name: Fetch final stubborn originals
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fetch-last-originals.yml'
      - 'tools/fetch_last_originals.py'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python tools/fetch_last_originals.py
      - if: always()
        run: find build/last_originals -type f -printf '%p\t%s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-public-originals
          path: |
            build/last_originals/**
            build/last_originals.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
