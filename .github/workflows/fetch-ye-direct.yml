name: Fetch Ye 2026 direct original
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fetch-ye-direct.yml'
      - 'tools/fetch_ye_direct.py'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python tools/fetch_ye_direct.py
      - if: always()
        run: find build/ye_direct -type f -printf '%p\t%s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ye-2026-direct-original
          path: build/ye_direct/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
