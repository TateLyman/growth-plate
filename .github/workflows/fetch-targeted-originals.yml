name: Fetch targeted stubborn public originals

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fetch-targeted-originals.yml'
      - 'tools/fetch_targeted_originals.py'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 lxml
      - name: Fetch exact originals and supplements
        run: python tools/fetch_targeted_originals.py
      - name: Inventory
        if: always()
        run: find build/targeted_originals -type f -printf '%p\t%s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-public-originals
          path: |
            build/targeted_originals/**
            build/targeted_originals.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
