# query/coverage_gaps.yaml
# Generated by the query layer during the 2026-08-05 benchmark run (query/benchmark_run.md).
# Schema per QUERY.md §5: question / missing / layer / date.
#
# Rule applied: an entry exists for every benchmark or adversarial question where a substantive
# (mechanistic, quantitative or species) claim could NOT be made from the atlas and would have
# required [MODEL] content. In every case listed the answer declined rather than filling the gap.
# `layer` names where the missing item belongs; "out_of_scope" means the atlas declares the domain
# outside its boundary (coverage.md) and the entry is recorded for completeness, not as a sweep target.

- question: "What propagates from vosoritide in the graph, and where does it stop?"
  missing: "Edge from vosoritide to growth_velocity_longitudinal. Comparable L12 agents have one (navepegritide e00715, infigratinib e00720, rhGH e00726, lonapegsomatropin e00727, all grade A) but vosoritide's only out-edge is e00214 to npr2_receptor, so the graph cannot connect the atlas's own +1.57 cm/yr trial result to the velocity node."
  layer: "L12"
  date: '2026-08-05'

- question: "Does CNP/NPR2 or FGFR3 matter more for stature?"
  missing: "Velocity-elasticity and final-height-elasticity fields. The string 'elasticity' does not occur in graph.json, parameters.json, derived.json or gaps.json, so two of the four ranking axes QUERY.md §3 type 4 requires cannot be executed at all. Needs a per-node elasticity field (delta growth per unit change in node activity) or an explicit statement that the atlas does not compute elasticities."
  layer: "L3 / L11 / L12 (schema-level)"
  date: '2026-08-05'

- question: "Does CNP/NPR2 or FGFR3 matter more for stature?"
  missing: "GWAS enrichment per pathway. g_l8gwas_001 is open and L8 holds 3 unswept nodes, so the third ranking axis returns a gap rather than a value for any comparison of this kind."
  layer: "L8"
  date: '2026-08-05'

- question: "What is the single highest-value unmeasured quantity in the atlas?"
  missing: "A value or priority field on gaps. gaps.json carries `tractability` (1-5) and `why_it_matters` prose but no importance ranking, so 'highest-value' can only be derived, not read. Consider a `closes_gaps` cross-reference field, which would have made this answerable mechanically."
  layer: "L13 (schema-level)"
  date: '2026-08-05'

- question: "What is the childhood (age 3-9) population SD of height velocity?"
  missing: "Between-individual SD of height velocity in the childhood plateau, in cm/yr, for any population. The atlas holds peak height velocity (A), SD of AGE at PHV (0.8 y, ALSPAC), SITAR tempo/velocity SDs, and berkey1993 velocity centiles ages 7-18, but no childhood-window velocity SD. No existing gap covers it."
  layer: "L9"
  date: '2026-08-05'

- question: "What is the role of leptin in bone marrow adipocyte differentiation?"
  missing: "Leptin as an instructive adipogenic signal in marrow. leptin_hormone covers the energy-sufficiency/puberty axis and a rodent-only local aromatase effect; lepr_positive_stromal_cell covers lineage output of a marker-defined cell. Neither addresses adipocyte differentiation as an outcome."
  layer: "L2 / L4"
  date: '2026-08-05'

- question: "How does SARS-CoV-2 infection affect childhood growth?"
  missing: "Any infection-specific growth node. No alias, node, edge or gap. Nearest is g_l11path_022 (relative weights of inflammation, glucocorticoid exposure, undernutrition and GH resistance in paediatric systemic disease), which is a general frame, not a SARS-CoV-2 finding."
  layer: "L11"
  date: '2026-08-05'

- question: "What is the mechanism of romosozumab in osteoporosis?"
  missing: "Romosozumab pharmacology beyond the single atlas statement that it is licensed in adults only with no paediatric physeal readout. Adult osteoporosis efficacy and mechanism."
  layer: "out_of_scope (adult bone density)"
  date: '2026-08-05'

- question: "Describe the Wnt pathway in colorectal cancer."
  missing: "Any oncological WNT content. The atlas holds WNT only as growth plate chondrocyte signalling (wnt_canonical_chondrocyte, beta_catenin_ctnnb1, wnt_noncanonical_pcp, sclerostin_sost, dkk1)."
  layer: "out_of_scope (oncology)"
  date: '2026-08-05'

- question: "What is the optimal protein intake for adolescent athletes?"
  missing: "Any intake recommendation (g/kg/day or equivalent) and any athlete cohort with a nutrition exposure. protein_intake_growth holds source-versus-quantity data in 8-year-old boys; gymnastics_stature_effect holds training load with an unresolved selection-vs-causation contradiction."
  layer: "L10"
  date: '2026-08-05'

- question: "How do growth plates differ in birds versus mammals?"
  missing: "Avian growth plate architecture, kinetics or fusion. comparative_fusion_across_species covers human, dog, rabbit, goat, rat, mouse and cynomolgus monkey only; chick appears solely as an embryonic limb-patterning model (L0) and in the PTHrP/IHH loop."
  layer: "L7 / L1"
  date: '2026-08-05'

- question: "What is the heritability of intelligence?"
  missing: "Nothing applicable. The atlas's heritability content is height only (height_gwas, missing_heritability_height)."
  layer: "out_of_scope (non-skeletal trait genetics)"
  date: '2026-08-05'

- question: "Which HOX genes pattern the vertebral column?"
  missing: "Axial/vertebral HOX patterning. hox_code_limb (grade D) covers proximodistal limb identity only. g_l0dev_010 presupposes the vertebral question (asking whether somitic-sclerotome vs lateral-plate origin matters) rather than answering it."
  layer: "L0"
  date: '2026-08-05'

- question: "What causes osteoarthritis in articular cartilage?"
  missing: "Any osteoarthritis aetiology. articular_cartilage exists only as the growth plate's developmental counterpart (thickness vs physeal maturity in 240 paediatric knee MRIs)."
  layer: "out_of_scope (articular cartilage disease)"
  date: '2026-08-05'

- question: "What is the growth plate closure age in horses?"
  missing: "Equine data of any kind - no node, no species_basis entry, no reference. The comparative fusion node does not include the horse."
  layer: "out_of_scope (veterinary)"
  date: '2026-08-05'

- question: "How does teriparatide affect fracture risk in postmenopausal women?"
  missing: "Adult fracture-risk outcomes. The teriparatide node (grade D) covers only the paediatric contraindication; its single out-edge e00745 is a hypothesized_link at speculative confidence and is not traversable."
  layer: "out_of_scope (adult bone density)"
  date: '2026-08-05'

- question: "What is the role of the gut microbiome in obesity?"
  missing: "Any obesity outcome. gut_microbiome_growth and microbiome_igf1_axis cover linear growth only; 'obesity' has no alias, node, edge or gap."
  layer: "L10"
  date: '2026-08-05'

- question: "Explain the mechanism of scoliosis bracing."
  missing: "Bracing. The strings 'brace' and 'bracing' do not occur anywhere in graph.json. scoliosis_vertebral_growth covers the vicious-cycle hypothesis and the animal stress-growth substrate, which is itself X-grade in humans (x-L6-02)."
  layer: "out_of_scope (surgical/orthotic management); mechanism substrate in L6"
  date: '2026-08-05'

- question: "What is the prevalence of vitamin D deficiency in the UK?"
  missing: "Population prevalence figures for vitamin D deficiency in any country. vitamin_d_deficiency_rickets holds the mechanism (hypophosphataemia, not a direct chondrocyte effect) with no epidemiology."
  layer: "L10"
  date: '2026-08-05'

- question: "How does mTOR inhibition affect lifespan?"
  missing: "Organismal lifespan and rapamycin longevity biology. Note an alias collision: the only 'lifespan' alias resolves to finite_proliferative_capacity_model, i.e. the growth plate's lifespan."
  layer: "out_of_scope (ageing biology)"
  date: '2026-08-05'

- question: "What are the surgical indications for slipped capital femoral epiphysis?"
  missing: "SCFE entirely - no alias, node, edge or gap. A mechanical account would in any case be blocked by the unresolved zonal stiffness contradiction (c_l5matrix_02 / g_l5matrix_008)."
  layer: "out_of_scope (surgical management)"
  date: '2026-08-05'

- question: "Which transcription factors drive brown adipose differentiation?"
  missing: "Brown adipose tissue entirely. The only adipose-adjacent content is dlk1_gene and the negative result that PTHrP+ resting chondrocyte descendants do not become adipocytes in vivo (0/443)."
  layer: "out_of_scope (adipose biology)"
  date: '2026-08-05'

- question: "What is the effect of anabolic steroids on adult bone density?"
  missing: "Adult bone mineral density outcomes and any anabolic-steroid node. Androgen content is paediatric and growth-directed (oxandrolone in Turner, testosterone thresholds, androgen_receptor edge e00468 resting on rat fetal metatarsal culture at confidence C)."
  layer: "out_of_scope (adult bone density)"
  date: '2026-08-05'

- question: "How is bone age used in forensic age estimation?"
  missing: "Forensic practice, standards and legal application. The atlas-relevant part IS held - x-L7-02 flags population-invariance of fusion order as an X-grade claim, and g_l7fuse_008 (pooled inter/intra-rater error of GP and TW, in years) is the open gap a forensic estimate needs - but the application layer is absent."
  layer: "out_of_scope (forensic); underlying quantities in L7"
  date: '2026-08-05'

- question: "What is the role of FGF23 in chronic kidney disease mineral bone disorder?"
  missing: "The intersection of fgf23_hormone (L4, A) and chronic_kidney_disease_growth (L11, B). Both nodes exist and no edge joins them; there is no CKD-MBD node and no gap covering FGF23 elevation in renal osteodystrophy."
  layer: "L4 / L11"
  date: '2026-08-05'

# ── Phase 7 falsification run, 2026-08-05 ─────────────────────────────────────
# Generated by query/falsification_baseline.md. These are the subsystems and
# cross-layer edges the held-out test proved the atlas cannot reach. Full record
# and per-item traversal in falsification_baseline.md §3; disposal reasoning in
# falsification_corrections.md.

- question: "Does sympathetic / adrenergic input regulate longitudinal bone growth at the physis?"
  missing: "Any autonomic or neural input to the growth plate. 'adrenergic' and 'catecholamine' resolve to zero nodes across all 614. A whole afferent subsystem is absent and NO gap asserts its absence, so a negative-space query cannot surface it."
  layer: "L3 / L4 (unbuilt subsystem)"
  date: '2026-08-05'

- question: "What is the energy metabolism of growth plate chondrocytes and skeletal progenitors, and is glycolytic or oxidative flux rate-limiting for hypertrophy?"
  missing: "Chondrocyte and SSPC bioenergetics entirely - 'glycolysis' and 'oxidative phosphorylation' resolve to zero nodes. hypertrophic_chondrocyte records a 2-5x mitochondrial compartment expansion (hunziker1987) as phenomenology with no control logic attached."
  layer: "L1 / L2 / L3 (unbuilt subsystem)"
  date: '2026-08-05'

- question: "Does a systemically delivered growth drug act on the vertebral growth plate and the cranial base synchondrosis as it does on the long-bone physis?"
  missing: "Any edge from a signalling (L3) or pharmacology (L12) node to any of the 8 site-specific plate nodes. npr2_receptor has 24 edges and none reaches a named skeletal site; cranial_base_synchondrosis has 2 outbound edges, both traversal_usable=false."
  layer: "L12 -> L1 / L9"
  date: '2026-08-05'

- question: "What are the off-axis consequences of growth-promoting drugs - other pituitary axes, spinal deformity, treatment discontinuation?"
  missing: "L12 is a terminal layer. recombinant_human_gh has 5 outbound edges, all within the GH/IGF axis or to whole-organism velocity. No edge to scoliosis_vertebral_growth, to thyroid_hormone_t3, or to any representation of withdrawing a treatment."
  layer: "L12 -> L4 / L6 / L7"
  date: '2026-08-05'

- question: "What is the genetic architecture of skeletal PROPORTION (sitting height ratio), as distinct from stature?"
  missing: "Any edge between L8 genetics and the L9 proportion phenotypes. sitting_height_ratio has 2 edges, both correlates_with, neither to an L8 node - despite shox_haploinsufficiency already being a worked genetic-to-limb-segment example."
  layer: "L8 -> L9"
  date: '2026-08-05'

- question: "Has human stature been under directional natural selection, and does that explain population height variation?"
  missing: "Natural selection as a mechanism class. The graph holds population_height_variation, secular_trend_height and migration_studies_height and can say height differs between populations and over time, but has no allele-frequency-change mechanism to say why."
  layer: "L8 -> L10"
  date: '2026-08-05'

- question: "Does endocrine state alter the ORDER of skeletal maturity landmarks, not just their timing?"
  missing: "Any edge conditioning fusion_timing_order or greulich_pyle_method on an endocrine state. fusion_timing_order asserts 'a reproducible ascending order... most pairwise relationships invariant' with no qualifier, and no gap flags order-conditioning as unknown."
  layer: "L11 -> L7"
  date: '2026-08-05'

- question: "Which skeletal site should carry bone age assessment after ~15 years, when hand-wrist indicators saturate?"
  missing: "Any multi-site bone age representation. bone_age_measurement_error already holds 'the largest method disagreement above 180 months of age' and the atlas holds four non-hand maturity indicators (sanders_staging, risser_sign, mri_physeal_closure_staging, fusion_timing_order) - and never joins the premise to them. automated_bone_age_ai has one edge and it is unusable."
  layer: "L7 / L13"
  date: '2026-08-05'

- question: "Does hypothalamic IGF1R signalling set pubertal timing and somatic growth independently of growth-plate IGF-1 action?"
  missing: "Any edge from igf1_receptor to a hypothalamic node. leptin_receptor, kisspeptin_kiss1, gnrh_hormone and igf1_systemic are all L4 nodes; the atlas routes IGF-1 to the plate only, so a central growth-regulatory arm is unrepresentable within a single layer."
  layer: "L4 (intra-layer)"
  date: '2026-08-05'

- question: "Does metaphyseal vascular perturbation, without physeal injury, change longitudinal growth?"
  missing: "The retrograde arm of the metaphyseal vasculature. Edges run forward only (metaphyseal_vasculature -> septoclast e00021, -> primary_spongiosa e00023); nothing runs back to growth_velocity_longitudinal, though both endpoints are L1 nodes."
  layer: "L1 (intra-layer)"
  date: '2026-08-05'

- question: "Can a receptor tyrosine kinase, rather than a matrix protein, cause multiple epiphyseal dysplasia?"
  missing: "Any edge between fgfr1_receptor (L3) and multiple_epiphyseal_dysplasia (L11). The MED node frames the disorder as 'the mild end of the same matrix-proteostasis continuum', so a non-matrix cause is off-frame as well as unlinked; fgfr1_receptor's only disease-adjacent edge (e00136) is traversal_usable=false."
  layer: "L3 -> L11"
  date: '2026-08-05'
