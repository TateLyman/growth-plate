  date: '2026-08-05'

- question: "How do growth plates differ in birds versus mammals?"
  missing: "Avian growth plate architecture, kinetics or fusion. comparative_fusion_across_species covers human, dog, rabbit, goat, rat, mouse and cynomolgus monkey only; chick appears solely as an embryonic limb-patterning model (L0) and in the PTHrP/IHH loop."
  layer: "L7 / L1"
  date: '2026-08-05'

- question: "What is the heritability of intelligence?"
  missing: "Nothing applicable. The atlas's heritability content is height only (height_gwas, missing_heritability_height)."
