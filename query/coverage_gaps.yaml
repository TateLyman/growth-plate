# query/coverage_gaps.yaml
# Generated by the query layer during the 2026-08-05 benchmark run (query/benchmark_run.md).
# Schema per QUERY.md §5: question / missing / layer / date.
#
# Rule applied: an entry exists for every benchmark or adversarial question where a substantive
# (mechanistic, quantitative or species) claim could NOT be made from the atlas and would have
# required [MODEL] content. In every case listed the answer declined rather than filling the gap.
# `layer` names where the missing item belongs; "out_of_scope" means the atlas declares the domain
# outside its boundary (coverage.md) and the entry is recorded for completeness, not as a sweep target.

- question: "What propagates from vosoritide in the graph, and where does it stop?"
  missing: "Edge from vosoritide to growth_velocity_longitudinal. Comparable L12 agents have one (navepegritide e00715, infigratinib e00720, rhGH e00726, lonapegsomatropin e00727, all grade A) but vosoritide's only out-edge is e00214 to npr2_receptor, so the graph cannot connect the atlas's own +1.57 cm/yr trial result to the velocity node."
  layer: "L12"
  date: '2026-08-05'

- question: "Does CNP/NPR2 or FGFR3 matter more for stature?"
  missing: "Velocity-elasticity and final-height-elasticity fields. The string 'elasticity' does not occur in graph.json, parameters.json, derived.json or gaps.json, so two of the four ranking axes QUERY.md §3 type 4 requires cannot be executed at all. Needs a per-node elasticity field (delta growth per unit change in node activity) or an explicit statement that the atlas does not compute elasticities."
  layer: "L3 / L11 / L12 (schema-level)"
  date: '2026-08-05'

- question: "Does CNP/NPR2 or FGFR3 matter more for stature?"
  missing: "GWAS enrichment per pathway. g_l8gwas_001 is open and L8 holds 3 unswept nodes, so the third ranking axis returns a gap rather than a value for any comparison of this kind."
  layer: "L8"
  date: '2026-08-05'

- question: "What is the single highest-value unmeasured quantity in the atlas?"
  missing: "A value or priority field on gaps. gaps.json carries `tractability` (1-5) and `why_it_matters` prose but no importance ranking, so 'highest-value' can only be derived, not read. Consider a `closes_gaps` cross-reference field, which would have made this answerable mechanically."
  layer: "L13 (schema-level)"
  date: '2026-08-05'

- question: "What is the childhood (age 3-9) population SD of height velocity?"
  missing: "Between-individual SD of height velocity in the childhood plateau, in cm/yr, for any population. The atlas holds peak height velocity (A), SD of AGE at PHV (0.8 y, ALSPAC), SITAR tempo/velocity SDs, and berkey1993 velocity centiles ages 7-18, but no childhood-window velocity SD. No existing gap covers it."
  layer: "L9"
  date: '2026-08-05'

- question: "What is the role of leptin in bone marrow adipocyte differentiation?"
  missing: "Leptin as an instructive adipogenic signal in marrow. leptin_hormone covers the energy-sufficiency/puberty axis and a rodent-only local aromatase effect; lepr_positive_stromal_cell covers lineage output of a marker-defined cell. Neither addresses adipocyte differentiation as an outcome."
  layer: "L2 / L4"
  date: '2026-08-05'

- question: "How does SARS-CoV-2 infection affect childhood growth?"
  missing: "Any infection-specific growth node. No alias, node, edge or gap. Nearest is g_l11path_022 (relative weights of inflammation, glucocorticoid exposure, undernutrition and GH resistance in paediatric systemic disease), which is a general frame, not a SARS-CoV-2 finding."
  layer: "L11"
  date: '2026-08-05'

- question: "What is the mechanism of romosozumab in osteoporosis?"
  missing: "Romosozumab pharmacology beyond the single atlas statement that it is licensed in adults only with no paediatric physeal readout. Adult osteoporosis efficacy and mechanism."
  layer: "out_of_scope (adult bone density)"
  date: '2026-08-05'

- question: "Describe the Wnt pathway in colorectal cancer."
  missing: "Any oncological WNT content. The atlas holds WNT only as growth plate chondrocyte signalling (wnt_canonical_chondrocyte, beta_catenin_ctnnb1, wnt_noncanonical_pcp, sclerostin_sost, dkk1)."
  layer: "out_of_scope (oncology)"
  date: '2026-08-05'

- question: "What is the optimal protein intake for adolescent athletes?"
  missing: "Any intake recommendation (g/kg/day or equivalent) and any athlete cohort with a nutrition exposure. protein_intake_growth holds source-versus-quantity data in 8-year-old boys; gymnastics_stature_effect holds training load with an unresolved selection-vs-causation contradiction."
