# 20 questions the atlas was NOT built to answer.
# Adversarial coverage is where provenance discipline actually breaks: the entity is
# plausible, adjacent, and the model has training data on it. Correct behaviour is a
# coverage-gap log + [MODEL] tag, never a fluent [ATLAS]-flavoured answer.
meta: {total: 20, purpose: measure leakage where the atlas has no content}
