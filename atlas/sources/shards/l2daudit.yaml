  robinson2017:
    added: '2026-08-05'
    cited_by: 19
    doi: 10.1016/j.cellsig.2017.09.021
    first_author: Robinson JW
    has_full_text: true
    is_preprint: false
    journal: Cellular signalling
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: FGF2 causes rapid, potent and reversible dephosphorylation of GC-B in rat chondrosarcoma cells, which
      express FGFR2 as well as FGFR3; a 7-glutamate phosphomimetic GC-B is FGF-resistant. No receptor-specific manipulation
      was performed.
    open_access: false
    pmid: '28964968'
    ref_id: robinson2017
    tier: T1
    title: Dephosphorylation is the mechanism of fibroblast growth factor inhibition of guanylyl cyclase-B
    type: primary
    year: 2017
