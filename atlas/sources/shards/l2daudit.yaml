refs:
  agoston2007:
    added: '2026-08-05'
    cited_by: 72
    doi: 10.1186/1471-213x-7-18
    first_author: Agoston H
    has_full_text: true
    is_preprint: false
    journal: BMC developmental biology
    note: Full text read (Europe PMC / PMC) during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only
      to primary.
    one_line_finding: 'Zonal microarray of micro-dissected mouse tibia: Nppc/Npr2/Npr3 mRNA similar across resting-proliferative,
      hypertrophic and mineralized zones; Prkg1 5.9-fold and Prkg2 4.4-fold higher in hypertrophic than resting/proliferative;
      CNP induces Npr3 16-fold in the hypertrophic zone only.'
    open_access: true
    pmid: '17374144'
    ref_id: agoston2007
    tier: T1
    title: C-type natriuretic peptide regulates endochondral bone growth through p38 MAP kinase-dependent and -independent
      pathways
    type: primary
    year: 2007
  ambrosi2021:
    added: '2026-08-05'
    cited_by: 298
    doi: 10.1038/s41586-021-03795-7
    first_author: Ambrosi TH
    has_full_text: true
    is_preprint: false
    journal: Nature
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: Aged (24 month) mouse marrow/periosteal skeletal stem cells lose osteochondrogenic potential and generate
      an inflammatory pro-resorptive niche not reversed by heterochronic parabiosis; growth plate attenuation is reported
      only as a descriptive ageing correlate.
    open_access: false
    pmid: '34381212'
    ref_id: ambrosi2021
    tier: T1
    title: Aged skeletal stem cells generate an inflammatory degenerative niche
    type: primary
    year: 2021
  chikuda2004:
