  wagner2021:
    added: '2026-08-05'
    cited_by: 12
    doi: 10.1172/jci.insight.147832
    first_author: Wagner BM
    has_full_text: true
    is_preprint: false
    journal: JCI insight
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: Homozygous GC-B-7E crossed into HOMOZYGOUS FGFR3-G380R restores femur/tibia length and hypertrophic
      zone area to wild-type; femur gain 12.6% (male) and 7.9% (female) in the G380R background versus 4.3% and 5.0% in wild-type
      FGFR3; midface hypoplasia and macrocephaly are NOT rescued; effects at 2 weeks are strongly sex-specific.
    open_access: true
    pmid: '33784257'
    ref_id: wagner2021
    tier: T1
    title: Prevention of guanylyl cyclase-B dephosphorylation rescues achondroplastic dwarfism
    type: primary
    year: 2021
