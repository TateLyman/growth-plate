    one_line_finding: 'Quantitative FRET on an FGFR3 EC+TM construct in which the intracellular kinase domain is replaced
      by a fluorescent protein: G380R increases unliganded dimerisation by -1.8 kcal/mol and does not change ligand-bound
      Intrinsic FRET.'
    open_access: false
    pmid: '27040652'
    ref_id: sarabipour2016
