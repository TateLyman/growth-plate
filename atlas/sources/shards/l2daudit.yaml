    added: '2026-08-05'
    cited_by: 105
    doi: 10.1128/mcb.20.2.516-522.2000
    first_author: Monsonego-Ornan E
    has_full_text: true
    is_preprint: false
    journal: Molecular and cellular biology
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: G380R dimerisation and activation are predominantly ligand-dependent; the mutant receptor is selectively
      resistant to ligand-mediated internalisation and shows an expanded FGFR3 immunoreactive domain in transgenic mouse growth
      plate.
    open_access: false
    pmid: '10611230'
    ref_id: monsonegoornan2000
    tier: T1
