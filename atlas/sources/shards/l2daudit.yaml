  cho2004:
    added: '2026-08-05'
    cited_by: 90
    doi: 10.1073/pnas.2237184100
    first_author: Cho JY
    has_full_text: true
    is_preprint: false
    journal: Proceedings of the National Academy of Sciences of the United States of America
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: In Cos-7 and RCJ cells, ACH and TDII FGFR3 show reduced c-Cbl-mediated ubiquitination and diversion
      from lysosome to recycling endosome; the paper explicitly reports the opposite sign to Monsonego-Ornan and states the
      alternative cannot be excluded.
