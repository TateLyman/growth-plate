    has_full_text: true
    is_preprint: false
    journal: Genes & development
    note: Full text read (Europe PMC / PMC) during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only
      to primary.
    one_line_finding: cGKII protein by IHC is predominantly in LATE PROLIFERATIVE and PREHYPERTROPHIC chondrocytes; the Prkg2-mutant
      KMI rat growth plate is EXPANDED (665+/-47 vs 255+/-34 um, n=8) by a postmitotic non-hypertrophic intermediate layer.
