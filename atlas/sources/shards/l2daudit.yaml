    is_preprint: false
    journal: Genes & development
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: Constitutively active MEK1 in chondrocytes gives achondroplasia-like dwarfism with incomplete hypertrophy,
      reduced collagen X and persistent Sox9 but unchanged BrdU index; it suppresses Fgfr3-null overgrowth. Stat1 loss restores
      proliferation in Fgfr3-ACH mice but not the hypertrophic zone or the phenotype.
    open_access: false
    pmid: '14871928'
    ref_id: murakami2004
    tier: T1
