  chung1998:
    added: '2026-08-05'
    cited_by: 189
    doi: 10.1073/pnas.95.22.13030
    first_author: Chung UI
    has_full_text: true
    is_preprint: false
    journal: Proceedings of the National Academy of Sciences of the United States of America
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: PTH1R-null / wild-type chimeras show PTHrP signals directly to PTH1R on proliferating chondrocytes;
      matrix mineralization around ectopic hypertrophic cells is non-cell-autonomous and requires a critical mass of adjacent
      hypertrophic cells.
    open_access: false
    pmid: '9789035'
    ref_id: chung1998
    tier: T1
    title: The parathyroid hormone/parathyroid hormone-related peptide receptor coordinates endochondral bone development
      by directly controlling chondrocyte differentiation
    type: primary
    year: 1998
  gress2000:
    added: '2026-08-05'
    cited_by: 47
    doi: 10.1083/jcb.149.4.983
    first_author: Gress CJ
    has_full_text: true
    is_preprint: false
    journal: The Journal of cell biology
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: 'Col10a1-null mice: approximately 14% overall lethality, approximately 10.8% perinatal at week 3; growth
      plate width reduced approximately 14% at day 21; the PROLIFERATIVE zone is more compressed than the hypertrophic, the
      opposite of the collagen-X transgenic; lymphatic organs approximately 80% of control with marrow aplasia.'
    open_access: true
    pmid: '10811836'
    ref_id: gress2000
    tier: T1
    title: Growth plate compressions and altered hematopoiesis in collagen X null mice
    type: primary
    year: 2000
  kamakura2023:
    added: '2026-08-05'
    cited_by: 8
    doi: 10.1002/jbm4.10737
    first_author: Kamakura T
    has_full_text: true
    is_preprint: false
    journal: JBMR plus
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: COL10A1-/- human iPSC chondrocytes hypertrophy normally, but transplanted proliferating-stage pellets
      give a significantly larger bone-area fraction in one of two iPSC backgrounds and a transcriptome shifted from proliferating-phase
      toward calcification-phase genes, i.e. accelerated differentiation rather than no phenotype.
    open_access: true
    pmid: '37197316'
    ref_id: kamakura2023
    tier: T1
    title: Collagen X Is Dispensable for Hypertrophic Differentiation and Endochondral Ossification of Human iPSC-Derived
      Chondrocytes
    type: primary
    year: 2023
  kobayashi2005:
    added: '2026-08-05'
    cited_by: 194
    doi: 10.1172/jci24397
    first_author: Kobayashi T
    has_full_text: true
    is_preprint: false
    journal: The Journal of clinical investigation
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: Ihh stimulates periarticular-to-columnar chondrocyte differentiation and sets column length independently
      of PTHrP; PTHrP heterozygosity had minimal effect on column elongation driven by Ihh overexpression.
    open_access: false
    pmid: '15951842'
    ref_id: kobayashi2005
    tier: T1
    title: Indian hedgehog stimulates periarticular chondrocyte differentiation to regulate growth plate length independently
      of PTHrP
    type: primary
    year: 2005
  mak2008:
    added: '2026-08-05'
    cited_by: 222
    doi: 10.1242/dev.018044
    first_author: Mak KK
    has_full_text: true
    is_preprint: false
    journal: Development (Cambridge, England)
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: Raising Hh signalling in PTHrP-null limbs (Shh protein, Ihh overexpression or Ptch1 inactivation) accelerates
      hypertrophy, and cyclopamine or Smo removal delays it, establishing a PTHrP-independent Ihh route to hypertrophy.
    open_access: false
    pmid: '18434416'
    ref_id: mak2008
    tier: T1
    title: Indian hedgehog signals independently of PTHrP to promote chondrocyte hypertrophy
    type: primary
    year: 2008
  marino2008:
    added: '2026-08-05'
    cited_by: 41
    doi: 10.1210/en.2007-0993
    first_author: Marino R
    has_full_text: true
    is_preprint: false
    journal: Endocrinology
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: Rat propylthiouracil hypothyroidism delays functional, structural and molecular growth plate senescence,
      but catch-up growth was INCOMPLETE at final measurement; gonadal suppression by leuprolide was incomplete (uterine mass
      ~0.16 g vs ~0.1 g ovariectomised).
    open_access: false
    pmid: '18174286'
    ref_id: marino2008
    tier: T1
    title: Catch-up growth after hypothyroidism is caused by delayed growth plate senescence
    type: primary
    year: 2008
  miyazaki2022:
    added: '2026-08-05'
    cited_by: 21
    doi: 10.7554/elife.71931
    first_author: Miyazaki Y
    has_full_text: true
    is_preprint: false
    journal: eLife
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: CNP-facilitated bone growth in mouse tibia explants is abolished by chondrocyte-specific Trpm7 ablation;
      the proposed chain is NPR2 to cGMP to PKG to BK channel to hyperpolarisation to TRPM7 Ca2+ entry to CaMKII, a PKG substrate
      other than SOX9/GSK3-beta.
    open_access: true
    pmid: '35287796'
    ref_id: miyazaki2022
    tier: T1
    title: C-type natriuretic peptide facilitates autonomic Ca<sup>2+</sup> entry in growth plate chondrocytes for stimulating
      bone growth
    type: primary
    year: 2022
