    has_full_text: true
    is_preprint: false
    journal: Proceedings of the National Academy of Sciences of the United States of America
    note: Retrieved during phase 2d audit while searching for the true primary behind the prehypertrophic GC-B protein localisation
      claim (gap g_l2d_002). It is not that source.
    one_line_finding: GC-B (Npr2) null mice show dramatic impairment of endochondral ossification and female infertility;
