    has_full_text: true
    is_preprint: false
    journal: Scientific reports
    note: Full text read during phase 2d canonical-mechanism audit; ref type upgraded from primary_abstract_only to primary.
    one_line_finding: 'Cartilage-specific Nppc and Npr2 knockouts, n=5/group: HZ falls to 34.6% and 23.0% of control, non-hypertrophic
      layer to 76.7% and 71.1%; BrdU index only trended lower in Nppc cKO but was significantly lower in Npr2 cKO.'
    open_access: true
    pmid: '26014585'
    ref_id: nakao2015
    tier: T1
