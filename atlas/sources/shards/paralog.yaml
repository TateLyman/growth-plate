refs:
  bali2021:
    added: '2026-08-05'
    cited_by: 9
    doi: 10.1007/s00109-021-02049-3
    first_author: Bali SK
    has_full_text: true
    is_preprint: false
    journal: Journal of molecular medicine (Berlin, Germany)
    one_line_finding: Tamoxifen-inducible cartilage-specific Gsk3a/Gsk3b DOUBLE knockout causes precocious growth plate remodeling,
      progressive loss of cellular and proteoglycan components, decreased SOX9, increased osteoclast recruitment and apoptosis,
      shorter long bones and growth retardation. States that cartilage-specific Gsk3b single KO mice are NORMAL except for
      elevated GSK3A protein - the paralog compensates by upregulating.
    open_access: false
    pmid: '33609145'
    ref_id: bali2021
    tier: T1
    title: Glycogen synthase kinase 3 alpha/beta deletion induces precocious growth plate remodeling in mice
    type: primary
    year: 2021
  chou2021:
    added: '2026-08-05'
    cited_by: 12
    doi: 10.3389/fcell.2021.710664
    first_author: Chou YS
    has_full_text: true
    is_preprint: false
    journal: Frontiers in cell and developmental biology
    one_line_finding: Chondrocyte-specific GPER-1 knockout (80% expression loss) reduces tibial/femoral length, proliferative-zone
      thickness and PCNA/Ki67 index in female pubertal mice; effect reproduced by a GPER-1 antagonist in cultured epiphyseal
      cartilage. Genetic, receptor-selective - not an estradiol-ligand inference.
    open_access: true
    pmid: '34490260'
    ref_id: chou2021
    tier: T1
    title: G-Protein-Coupled Estrogen Receptor-1 Positively Regulates the Growth Plate Chondrocyte Proliferation in Female
      Pubertal Mice
    type: primary
    year: 2021
  dentice2005:
    added: '2026-08-05'
    cited_by: 181
    doi: 10.1038/ncb1272
    first_author: Dentice M
    has_full_text: true
    is_preprint: false
    journal: Nature cell biology
    one_line_finding: The Hedgehog-inducible ubiquitin ligase subunit WSB-1 targets DIO2 for degradation in the developing
      growth plate, modulating local thyroid hormone activation and PTHrP secretion - primary evidence that DIO2 (not DIO1)
      is the locally regulated activating deiodinase in this tissue.
    open_access: false
    pmid: '15965468'
    ref_id: dentice2005
    tier: T1
    title: The Hedgehog-inducible ubiquitin ligase subunit WSB-1 modulates thyroid hormone activation and PTHrP secretion
      in the developing growth plate
    type: primary
    year: 2005
  gthe1999:
    added: '2026-08-05'
    cited_by: 301
    doi: 10.1101/gad.13.10.1329
    first_author: Göthe S
    has_full_text: true
    is_preprint: false
    journal: Genes & development
    one_line_finding: TRalpha1(-/-)beta(-/-) double-null mice show retarded growth and bone maturation NOT found in either
      single receptor-deficient mouse; single TR deletions reveal only a small proportion of hypothyroid phenotypes. TRalpha1
      and TRbeta cooperate or substitute for each other on common pathways.
    open_access: false
    pmid: '10346821'
    ref_id: gthe1999
    tier: T1
    title: Mice devoid of all known thyroid hormone receptors are viable but exhibit disorders of the pituitary-thyroid axis,
      growth, and bone maturation
    type: primary
    year: 1999
  itoh2012:
    added: '2026-08-05'
    cited_by: 43
    doi: 10.1074/jbc.m112.372086
    first_author: Itoh S
    has_full_text: true
    is_preprint: false
    journal: The Journal of biological chemistry
    one_line_finding: GSK-3alpha and GSK-3beta act with functional redundancy in early chondrocyte differentiation via RelA
      Thr-254 phosphorylation, independently of Wnt/beta-catenin. Gsk3a(-/-) alone or Gsk3b(+/-) alone does not significantly
      affect skeletal development; the compound Gsk3a(-/-);Gsk3b(+/-) causes dwarfism with impaired chondrocyte differentiation.
    open_access: false
    pmid: '22761446'
    ref_id: itoh2012
    tier: T1
    title: GSK-3α and GSK-3β proteins are involved in early stages of chondrocyte differentiation with functional redundancy
      through RelA protein phosphorylation
    type: primary
    year: 2012
  rowley2024:
    added: '2026-08-05'
    cited_by: 7
    doi: 10.1021/acs.jmedchem.3c01562
    first_author: Rowley AM
    has_full_text: true
    is_preprint: false
    journal: Journal of medicinal chemistry
    one_line_finding: PDE3A and PDE3B share 48% overall identity and >95% ACTIVE-SITE homology, described as a massive obstacle
      to active-site selectivity; every FDA-approved PDE3 inhibitor is family-selective only, not isoform-selective. Quantifies
      why cilostazol/milrinone cannot assign a cGMP effect to PDE3B over PDE3A.
    open_access: false
    pmid: '38284310'
    ref_id: rowley2024
    tier: T2
    title: Discovery and SAR Study of Boronic Acid-Based Selective PDE3B Inhibitors from a Novel DNA-Encoded Library
    type: primary
    year: 2024
  shen2004:
    added: '2026-08-05'
    cited_by: 6
    doi: 10.1111/j.1365-2052.2004.01103.x
    first_author: Shen S
    has_full_text: true
    is_preprint: false
    journal: Animal genetics
    one_line_finding: Iodothyronine deiodinase type 2 is differentially expressed in growth plates of chickens divergently
      selected for tibial dyschondroplasia - a species-limited but direct DIO2 growth plate expression measurement.
    open_access: false
    pmid: '15025570'
    ref_id: shen2004
    tier: T3
    title: Differential expression of iodothyronine deiodinase type 2 in growth plates of chickens divergently selected for
      incidence of tibial dyschondroplasia
    type: primary_abstract_only
    year: 2004
  stickens2004:
    added: '2026-08-05'
    cited_by: 459
    doi: 10.1242/dev.01461
    first_author: Stickens D
    has_full_text: true
    is_preprint: false
    journal: Development (Cambridge, England)
    one_line_finding: 'Independent Mmp13-null line: chondrocytes differentiate normally but exit is delayed, severity peaks
      at 5 weeks and COMPLETELY RESOLVES by 12 weeks. Collagen II and aggrecan confirmed as in vivo MMP13 substrates. Mmp9/Mmp13
      DOUBLE nulls have severely impaired endochondral bone with drastically shortened bones - MMP13 works synergistically
      with MMP9.'
    open_access: false
    pmid: '15539485'
    ref_id: stickens2004
    tier: T1
    title: Altered endochondral bone development in matrix metalloproteinase 13-deficient mice
    type: primary
    year: 2004
  vidal2000:
    added: '2026-08-05'
    cited_by: 252
    doi: 10.1073/pnas.97.10.5474
    first_author: Vidal O
    has_full_text: true
    is_preprint: false
    journal: Proceedings of the National Academy of Sciences of the United States of America
    one_line_finding: 'ERalpha-KO (ERKO), ERbeta-KO (BERKO) and DOUBLE ERalpha/beta-KO (DERKO) male mice compared head to
      head: ERKO and DERKO but NOT BERKO show decreased longitudinal and radial skeletal growth with decreased serum IGF-1.
      The ER double perturbation has been done and adds nothing over ERalpha alone.'
    open_access: false
    pmid: '10805804'
    ref_id: vidal2000
    tier: T1
    title: Estrogen receptor specificity in the regulation of skeletal growth and maturation in male mice
    type: primary
    year: 2000
  wang2011:
    added: '2026-08-05'
    cited_by: 109
    doi: 10.1002/jbmr.359
    first_author: Wang Y
    has_full_text: true
    is_preprint: false
    journal: 'Journal of bone and mineral research : the official journal of the American Society for Bone and Mineral Research'
    one_line_finding: 'Cartilage-specific Igf1r knockout (embryonic and tamoxifen-inducible postnatal) - a genetically IGF1R-selective
      cartilage perturbation that does not touch INSR: disorganised columns, delayed ossification and vascular invasion, reduced
      proliferation, increased apoptosis, and increased Pthrp transcription in the growth plate.'
    open_access: false
    pmid: '21312270'
    ref_id: wang2011
    tier: T1
    title: IGF-1R signaling in chondrocytes modulates growth plate development by interacting with the PTHrP/Ihh pathway
    type: primary
    year: 2011
  zhou2024:
    added: '2026-08-05'
    cited_by: 5
    doi: 10.1038/s42003-024-07077-6
    first_author: Zhou Z
    has_full_text: true
    is_preprint: false
    journal: Communications biology
    one_line_finding: Corin and Nppa (ANP) knockout mice have impaired chondrocyte differentiation and SHORTENED limb long
      bones, with reduced adult bone density; ANP acts IN CHONDROCYTES via cGMP-dependent protein kinase G to inhibit MAPK
      phosphorylation and raise pGSK-3beta/beta-catenin. A genetic requirement for the NPR1/GC-A ligand arm in the same cGMP-PKG
      readout the atlas attributes wholly to CNP/NPR2.
    open_access: true
    pmid: '39443661'
    ref_id: zhou2024
    tier: T1
    title: Deficiencies in corin and atrial natriuretic peptide-mediated signaling impair endochondral ossification in bone
      development
    type: primary
    year: 2024
