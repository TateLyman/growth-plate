  filters: no date limit, retmax=60, esearch db=pubmed
  date_run: '2026-08-05'
  hit_count: 2
  screened_count: 2
  reason_none_qualified: 'Two hits, neither relevant: PMID 40394920 is a serum miRNA panel as a surrogate
    marker of GH response, and PMID 39674288 is a CDK8 inhibitor study in achondroplasia model mice. No
    human study measures physeal elongation directly with implanted markers or transducers at daily resolution.
    A companion PubMed query ''(saltation[tiab] OR saltatory[tiab] OR stasis[tiab]) AND (growth plate[tiab]
    OR physis[tiab] OR "bone elongation"[tiab] OR "longitudinal bone growth"[tiab])'' returned 7 records,
