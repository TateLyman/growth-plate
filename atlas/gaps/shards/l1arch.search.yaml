searches:
- gap_id: g_l1arch_001
  database: PubMed
  exact_query_string: (growth plate[tiab] OR physis[tiab] OR "epiphyseal plate"[tiab]) AND humans[MeSH
    Terms] AND (stereolog*[tiab] OR morphometr*[tiab] OR histomorphometr*[tiab]) AND (hypertroph*[tiab])
    AND (elongation[tiab] OR "longitudinal growth"[tiab] OR "growth rate"[tiab])
  filters: no date limit, retmax=60, esearch db=pubmed
  date_run: '2026-08-05'
  hit_count: 4
  screened_count: 4
  reason_none_qualified: Four hits. PMID 11033444 (Byers 2000) is human histomorphometry of rib growth
    plate but reports zone heights only, not a partition of elongation. PMID 31997656 correlates growth
    plate morphometry with tibial growth but the human arm is radiographic (plate height/width) with no
    cellular stereology. PMIDs 15647824 and 10487224 are rodent. No human study partitions elongation
    among division, matrix synthesis and hypertrophy.
- gap_id: g_l1arch_003
  database: Europe PMC
  exact_query_string: septoclast*
  filters: resultType=core, pageSize=60, no date limit
  date_run: '2026-08-05'
  hit_count: 54
  screened_count: 54
  reason_none_qualified: All 54 records screened by title and, where ambiguous, abstract. Every primary
    observation of septoclasts is in mouse (35091558, 29464321, 33398436, 28500502, 35195769, 42324641,
    41319243, 40387924, 19893052), rat (7730591, 35537657, 32816022, 24879443) or bovine calf costochondral
    junction (33884197). The remainder are reviews, conference abstract collections, or unrelated osteoclast/vascular
    papers. Not one reports septoclasts, FABP5+ chondro-osseous border cells, or an equivalent population
    in human growth plate tissue. A narrower run of 'septoclast* AND (human OR "Homo sapiens")' returned
    38 records, all of which were rodent-tissue studies or reviews that merely mention human relevance.
