- gap_id: g_l7fuse_013
  question: What is the full distribution, not the mean, of height gain after menarche, and can the upper tail be
    predicted prospectively?
  type: quantitative_gap
  layer: L7
  why_it_matters: The clinical rule of thumb "girls grow about 5-7 cm after menarche" is used to counsel families,
    to decide whether to treat precocious puberty, and to time scoliosis surgery. In the best-measured cohort the
    mean is 8.0 cm but the standard deviation is 4.9 cm and the observed range runs from 0.2 to 31.1 cm. A rule
    of thumb whose SD is 60% of its mean, and whose tail is four times its mean, is not a clinical tool; using it
    as one produces systematic errors in exactly the early-maturing girls in whom the decision matters most.
  what_is_known: In 793 healthy term-born Swedish girls, mean age at menarche was 13.0 years (SD 1.3, range 8.2-17.2)
    and postmenarcheal growth averaged 8.0 cm (SD 4.9) with an observed range of 0.2 to 31.1 cm, decreasing with
    later menarche; menarche occurred at 71.6% (SD 18.8) of the QEPS-specific pubertal growth function, and data
    available at pubertal onset explained 44% of the variance in menarcheal age (grdstedtbergho2024). Adding menarcheal
    status to Tanner-Whitehouse height prediction narrows the 95% interval from plus or minus 5 cm to plus or minus
    4 cm at age 12 and from plus or minus 4 cm to plus or minus 3 cm at age 13 (tanner1975).
  what_is_missing: The determinants of the upper tail. No study has reported which prospectively measurable variables
    at menarche - bone age, MRI fusion stage, height SDS, midparent height, BMI - identify the girls who will gain
    more than 15 cm. A Europe PMC search combining menarche with height gain, growth after menarche or postmenarcheal,
    longitudinal or cohort, and centimetres returned 471 records dominated by GnRH-agonist and growth hormone treatment
    series with predicted rather than observed adult height as the outcome.
  nearest_evidence:
  - grdstedtbergho2024
  - tanner1975
  discriminating_experiment: 'Model system: a prospective cohort of at least 1000 girls enrolled within 3 months
    of menarche with baseline height, weight, midparent height, hand radiograph read by BoneXpert, and MRI fusion
    staging of knee and wrist, followed to measured adult height. Readout: a quantile regression of postmenarcheal
    height gain on baseline covariates, reporting the 90th percentile explicitly rather than the conditional mean.
    Expected results - skeletal maturity dominant: MRI fusion stage at menarche explains most of the upper-tail
    variance and the conditional 90th percentile collapses once it is included. Tempo-independent: the tail persists
    after adjustment for all baseline maturity measures, which would establish an irreducible biological variance
    floor on postmenarcheal growth prediction and set the achievable limit for gap g_l7fuse_007.'
  tractability: 4
  search_log_ref: g_l7fuse_013
- gap_id: g_l7_untreated_oestrogen_null_ceiling
  type: known_unknown
  layer: L7
  tractability: 1
  question: How tall does an oestrogen-null human become if nobody stops them - and has any human ever reached that
    endpoint?
  why_it_matters: 'This is the single number that decides whether the ceiling on human height is a timer or a budget,
    and it has never been measured because the condition is always treated. Aromatase-deficient men are given oestrogen
    on diagnosis explicitly to close the plates. CYP17D patients are replaced. The only human who CANNOT be closed
    - the ESR1-null man, whose receptor is absent and who did not respond to a tenfold rise in free oestradiol -
    was 204 cm at 28 with open epiphyses, and 3.5 years later his bone age had advanced only from 15 to 17.5. HE
    HAD NOT RUN OUT. Whether he later did, and at what height, discriminates directly between the two models this
    atlas holds: oestrogen as an ACCELERATOR of a fixed division budget, which predicts convergence on a late but
    finite height; or oestrogen as an IMPOSED endpoint the budget would not otherwise reach, which predicts continued
    slow growth.'
  what_is_known: 'smith1994 and smith2008: ESR1-null male, 204 cm at 28, incomplete epiphyseal closure, continued
    linear growth into adulthood, no response to transdermal oestrogen; bone age 15 to 17.5 over 3.5 years; lumbar
    spine aBMD falling from 0.745 to 0.684 g/cm2 (Z -3.85). morishima1995: aromatase-deficient male, 204 cm, bone
    age 14 at chronological age 24.25. aromdef2022: a 24-year-old aromatase-deficient male with open wrist and knee
    epiphyses started on estradiol valerate FOR EPIPHYSEAL CLOSURE to prevent further increase in height. cyp17d2025:
    51 final heights under complete lifelong sex-steroid absence, 77% at or above the 50th percentile and 39% at
    or above the 90th - most of them treated.'
  what_is_missing: (1) A LATER HEIGHT FOR THE ESR1 PATIENT. The last published measurement is at about 31 years.
    He would now be in his sixties. (2) FINAL HEIGHTS OF THE NEVER-TREATED SUBGROUP of the 88-patient CYP17D cohort,
    which the abstract does not separate. (3) WHETHER ANY AROMATASE-DEFICIENT MAN HAS EVER GONE UNTREATED to a true
    endpoint - 15 male cases are reported and the treatment is the same in all of them. (4) WHAT WAS ADVANCING THE
    ESR1 PATIENT'S BONE AGE AT ALL. Something matured his plate at roughly 0.7 years per year without ERalpha, and
    identifying it identifies the oestrogen-independent component of fusion - which is the drug target if the oestrogen
    route is closed off by its bone cost.
  nearest_evidence:
  - smith2008
  - morishima1995
  - aromdef2022
  - cyp17d2025
  nearest_evidence_note: Three case reports and one cohort, none of which reports an untreated endpoint. The quantity
    has never been measured, not because it is hard but because measuring it means not treating someone.
  discriminating_experiment: NO EXPERIMENT IS NEEDED AND NONE WOULD BE ETHICAL. THE OBSERVATIONS ALREADY EXIST IN
    CLINICAL RECORDS. (1) The ESR1 patient was followed at NIEHS and in Ohio and reported twice; a case follow-up
    reporting his height and epiphyseal status three decades on is a chart review and a letter. (2) The Brazilian
    CYP17D cohort of 88 already holds the untreated subgroup; separating their final heights is a re-analysis of
    a table the authors already have. (3) A systematic re-reading of all 15 reported aromatase-deficient males for
    height at diagnosis, height at treatment start and any pre-treatment growth velocity converts a set of censored
    observations into a survival problem with a estimable endpoint. ALL THREE ARE DESK WORK ON DATA THAT EXISTS.
