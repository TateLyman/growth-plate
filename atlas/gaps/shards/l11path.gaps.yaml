    mutation, and homocysteine-mediated disruption of matrix cross-linking. Because they converge,
    comparing their effect sizes is the only way to ask whether the routes are quantitatively equivalent
    or whether one dominates. It also matters clinically, because tall stature triage in adolescence
    rests on habitus rather than on measured deviation.
