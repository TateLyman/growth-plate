- gap_id: g_l11path_018
  question: Is the zone in which a cartilage matrix gene is expressed a general predictor of which
    radiographic compartment fails when that gene is mutated?
  type: known_unknown
  layer: L11
  why_it_matters: 'Schmid metaphyseal chondrodysplasia (COL10A1, expressed only in hypertrophic chondrocytes,
    metaphyseal disease with normal epiphyses and spine) and the type II collagenopathies (COL2A1,
    expressed throughout hyaline cartilage, epiphyseal and vertebral disease with relatively spared
    metaphyses) suggest a rule: expression domain predicts failure domain. If the rule generalises,
    then the radiographic pattern of any new skeletal dysplasia predicts the expression domain of
    the causal gene, which is a powerful and testable diagnostic heuristic. If it fails, the atlas
    needs a different organising principle for the matrix disorders.'
  what_is_known: COL10A1 was confirmed as the Schmid locus by an early multi-mutation series, and
    collagen X expression is restricted to hypertrophic chondrocytes. COL2A1 disorders span achondrogenesis
    type II through SEDC to Stickler syndrome with epiphyseal and vertebral involvement. COMP disorders
    (pseudoachondroplasia, MED1) are epiphyseal and metaphyseal and COMP is expressed in the territorial
    matrix throughout. MATN3 and COL9 disorders are epiphyseal.
  what_is_missing: No systematic test of the correspondence across the full set of matrix-gene dysplasias,
    and no human growth plate expression atlas of the relevant genes against which to score it. The
    rule has never been stated as a falsifiable claim and tested.
  nearest_evidence:
  - mcintosh1994
  - richmond1993
  - zhan2025
  - ni2026
  discriminating_experiment: 'Score every matrix-gene skeletal dysplasia in the current nosology
    on two axes: the zonal expression domain of the causal gene in HUMAN growth plate (measured by
    spatial transcriptomics on normal human physeal tissue, not inferred from mouse) and the radiographic
    compartment of failure. Under the rule the two axes correlate strongly; deviations identify genes
    whose disease mechanism is proteostatic (ER retention causing chondrocyte-autonomous death regardless
    of where the protein is needed) rather than structural - pseudoachondroplasia being the predicted
    deviant.'
