    confounding the apparent treatment effect. In ACAN deficiency, a 3-year prospective rhGH study
    in 10 treatment-naive children reported height SDS and velocity gains, and an extended-family
    study reported a mean gain of 1.3 SDS with bone age reported as not accelerating. In idiopathic
    GHD, treated adult heights exceed untreated adult heights in the same cohort - the positive control.
