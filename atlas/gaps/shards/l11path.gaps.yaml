  - lokulosodipe2020
  - saal1993
  - gregorova2025
  discriminating_experiment: Pool molecularly subtyped SRS (11p15 LOM, mUPD7, IGF2 variant) and BWS
    (11p15 GOM, pUPD11, CDKN1C, KCNQ1OT1 LOM) cohorts and compare adult height SDS against mid-parental
    height, with pubertal timing as a covariate. Under a symmetric dosage model the height excess
    in BWS equals the deficit in SRS in absolute SDS; under a saturating model the BWS excess is
    markedly smaller, and adjusting for early puberty in SRS does not close the gap.
