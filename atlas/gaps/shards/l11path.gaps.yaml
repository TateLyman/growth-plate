- gap_id: g_l11path_020
  question: In osteogenesis imperfecta and the mucopolysaccharidoses, how much of the adult height
    deficit is lost growth plate output and how much is mechanical loss from deformity, fracture
    and vertebral compression?
  type: method_blocked
  layer: L11
  why_it_matters: These two disorders are the atlas's warning that adult height is not a clean readout
    of growth plate function. In OI the growth plate is comparatively normal and the bone it produces
    fails; in MPS the matrix is progressively degraded from within. Attributing their height deficit
    to the growth plate would corrupt any cross-disorder comparison of growth plate output, and it
    would make interventions aimed at the physis look ineffective when they were never targeting
    the right compartment.
  what_is_known: OI severity by type tracks fracture burden and deformity, and a large national registry
    documents the gradient. In MPS, growth is near-normal for the first one to two years and then
    decelerates, with divergent trajectories between MPS IVA and MPS IIIA. Bisphosphonates in OI
    alter vertebral morphology and craniofacial growth, adding an iatrogenic term.
  what_is_missing: Standing height cannot distinguish a short bone that grew less from a short bone
    that grew normally and then bowed or collapsed. No study in either disorder reports a deformity-corrected
    height - for example, summed segmental bone lengths from radiographs or whole-body imaging -
    alongside standing height.
  nearest_evidence:
  - mordenti2026
  - carmon2026
  discriminating_experiment: In OI and MPS cohorts, measure standing height, sitting height and radiographic
    long-bone lengths (femur, tibia) plus vertebral body heights on the same day, and compute a 'geometric
    height' as the sum of the segments corrected for angulation. Under a pure-mechanical model geometric
    height is normal or near-normal while standing height is reduced; under a growth-plate model
    both are reduced equally. The difference between them is the mechanical component, and it can
    then be subtracted before comparing these disorders with the chondrodysplasias.
  tractability: 4
- gap_id: g_l11path_021
  question: Why is bone age DELAYED in X-linked hypophosphatemia but ADVANCED in aggrecan deficiency,
    when both produce short stature?
  type: known_unknown
  layer: L11
  why_it_matters: Bone age is the clinical proxy for remaining growth potential and is used to predict
    adult height in every short child. Two common monogenic causes of short stature move it in opposite
    directions, which means the proxy is not measuring a single underlying variable. Resolving what
    bone age actually reports - the mineralisation of epiphyseal cartilage, the differentiation state
    of the chondrocytes, or the cumulative estrogen exposure - would repair or retire a century-old
    clinical instrument.
  what_is_known: In XLH, FGF23 excess causes hypophosphataemia, impaired hypertrophic chondrocyte
    apoptosis and failure of mineralisation at the zone of provisional calcification; bone age is
    delayed and short stature is present pre-pubertally. In ACAN deficiency, matrix is reduced, hypertrophy
    is impaired in the mouse model, bone age is advanced by a median 1.3 years, and adult height
    is worse than childhood height. Both are short; the maturation clocks run opposite.
  what_is_missing: No study measures, in the same framework, whether bone age in these two disorders
    is dissociated from the true differentiation state of the growth plate. Radiographic bone age
    reports MINERALISED epiphyseal area, so a mineralisation defect (XLH) would delay it artefactually
    while cartilage differentiation proceeded normally, and a matrix defect (ACAN) could accelerate
    apparent ossification without accelerating differentiation.
  nearest_evidence:
  - soto2026
  - liang2025
  - gkourogianni2017
  - bendre2025
  discriminating_experiment: Compare radiographic bone age with an MRI-based assessment of epiphyseal
    cartilage volume and secondary ossification centre differentiation in matched XLH and ACAN cohorts.
    Under the artefact hypothesis MRI shows equivalent cartilage differentiation in both while radiographic
    bone age diverges; under a true-maturation hypothesis MRI confirms the divergence and bone age
    is measuring a real biological difference in the rate of chondrocyte differentiation.
  tractability: 3
- gap_id: g_l11path_022
  question: In systemic paediatric disease, what are the relative weights of inflammation, glucocorticoid
    exposure, undernutrition and acquired GH resistance in producing the height deficit?
  type: scale_gap
  layer: L11
  why_it_matters: 'Chronic kidney disease, juvenile idiopathic arthritis, coeliac disease and Cushing
    syndrome each combine several of these four mechanisms, and clinical practice treats them as
    interchangeable causes of ''chronic disease growth failure''. They are not: nutritional arrest
    is fully reversible with catch-up growth (coeliac disease), glucocorticoid exposure is only partly
    reversible, and inflammation acts locally as well as systemically. Without weights, no rational
    sequencing of interventions is possible, and the field cannot tell whether biologic cytokine
    blockade removes the inflammatory term or merely the steroid term by allowing steroid withdrawal.'
  what_is_known: 'Coeliac disease demonstrates the reversible extreme: antigen withdrawal restores
    growth with catch-up, implying no loss of proliferative capacity during the arrest. Cushing syndrome
    demonstrates the partly irreversible extreme: growth failure with weight gain, and incomplete
    recovery after cure. In paediatric dialysis, growth failure associates with parathyroid hormone
    levels - a fifth mechanism converging on PTH1R, the same receptor perturbed genetically in Jansen
    and Blomstrand chondrodysplasia. In JIA, local joint inflammation can either accelerate (hyperaemia,
    limb overgrowth) or destroy an adjacent physis, so the local sign is not fixed.'
  what_is_missing: No study measures inflammatory burden, cumulative glucocorticoid dose, nutritional
    status, PTH and IGF-I bioactivity in the same children and partitions the height deficit between
    them. The catch-up capacity after each mechanism is removed has not been compared on a common
    scale.
  nearest_evidence:
  - imaizumi2026
  - fjelstad2026
  - ahirwar2025
  - lodish2018
  discriminating_experiment: In a multi-disease paediatric cohort (CKD, JIA, coeliac disease, inflammatory
    bowel disease) with serial height, CRP/IL-6, cumulative prednisolone-equivalent dose, height-for-weight
    trajectory, PTH and free IGF-I, fit a mixed model of height velocity on the four exposures with
    disease as a random effect. Under an inflammation-dominant model CRP/IL-6 carries most of the
    variance and steroid dose little once inflammation is controlled; under a steroid-dominant model
    the reverse holds and biologic-treated children with controlled inflammation but continuing steroids
    still grow poorly.
  tractability: 4
- gap_id: g_l11path_023
  question: Does the human growth plate chondrocyte depend on MCT8 for T3 uptake, or does it use
    an alternative transporter?
  type: species_gap
  layer: L11
  why_it_matters: 'MCT8 deficiency produces a state that no other human condition can: high serum
    T3 with tissue-level hypothyroidism restricted to MCT8-dependent cells. If chondrocytes are MCT8-dependent,
    patients are locally hypothyroid at the growth plate despite thyrotoxic serum, and thyromimetic
    therapy (TRIAC, which enters cells independently of MCT8) should rescue growth. If chondrocytes
    are MCT8-independent, they are exposed to the elevated serum T3 and are effectively thyrotoxic,
    which advances maturation and would predict a shortened growth period - the opposite therapeutic
    implication.'
  what_is_known: 'MCT8 deficiency gives high T3, low-normal T4 and normal or mildly raised TSH, with
    severe neurological disease and impaired growth and weight gain. Congenital hypothyroidism shows
    what complete absence of thyroid hormone action does to the growth plate: arrest of terminal
    hypertrophy and epiphyseal dysgenesis with profoundly delayed bone age. Alternative thyroid hormone
    transporters (OATP1C1, MCT10) have tissue-specific distributions established largely in rodents.'
  what_is_missing: No study localises MCT8, MCT10 or OATP1C1 protein or transcript in human growth
    plate cartilage, and no systematic auxology of MCT8-deficient patients reports height SDS and
    bone age together, which is the phenotypic discriminator.
  nearest_evidence:
  - li2026
  - karimian2024
  - kochar2025
  discriminating_experiment: 'Two steps: (i) map MCT8, MCT10 and OATP1C1 in normal human physeal
    tissue by immunohistochemistry and spatial transcriptomics; (ii) in an MCT8-deficiency cohort,
    report height SDS with bone age and follow the response to TRIAC. Under chondrocyte MCT8-dependence,
    bone age is DELAYED despite high serum T3, and TRIAC accelerates growth and maturation; under
    MCT8-independence, bone age is ADVANCED by the high serum T3 and TRIAC does not change it.'
  tractability: 3
- gap_id: g_l11path_024
  question: Is there a single quantitative function relating cumulative estrogen exposure to adult
    height across the human disorders of pubertal timing?
  type: quantitative_gap
  layer: L11
  why_it_matters: Central precocious puberty, constitutional delay, congenital adrenal hyperplasia,
    aromatase deficiency, aromatase excess and ESR1 resistance are six human perturbations of one
    variable - how much estrogen the growth plate sees and when. If one function fits all six, then
    adult height becomes predictable from an estrogen exposure integral and every timing intervention
    (GnRH analogues, aromatase inhibitors, sex steroid priming) can be dosed against it. If it does
    not fit, then timing and amplitude of exposure act separately and must be modelled separately.
  what_is_known: 'The endpoints of the range are established: no estrogen action gives unfused epiphyses
    and 204 cm (ESR1 resistance) or continued adult growth (aromatase deficiency); excess estrogen
    gives premature fusion and short adult stature (aromatase excess, and CAH via aromatised adrenal
    androgen). GnRH analogue suppression preserves adult height in girls with precocious puberty
    when started early enough, and androgen therapy in constitutional delay has been meta-analysed
    against final adult height. CDGP itself shows that delayed exposure preserves adult height because
    delayed fusion compensates for delayed velocity.'
  what_is_missing: No study places these disorders on a common estrogen-exposure axis. Cumulative
    estradiol exposure is not measured in any of them, and adult height is reported against chronological
    age at pubertal onset rather than against an exposure integral.
  nearest_evidence:
  - bahar2025
  - wang2026
  - navardauskaite2026
  - smith1994
  discriminating_experiment: Construct a cumulative estradiol exposure metric (area under the serial
    serum estradiol curve, or a validated surrogate such as bone age advance per year) for cohorts
    of CPP, CDGP, CAH and aromatase deficiency patients with attained adult heights, and fit adult
    height SDS against the metric. Under a single-function model all disorders fall on one curve
    regardless of the cause of the altered exposure; under a timing-specific model, patients with
    the same integral but different timing (early-high versus late-high) have systematically different
    adult heights, and the residual quantifies the timing term.
  tractability: 3
- gap_id: g_l11path_025
  question: Has anyone compared an irradiated with a non-irradiated growth plate within the same
    patient, using recorded radiation dosimetry, to separate direct physeal damage from radiation-induced
    GH deficiency?
  type: search_established
  layer: L11
  why_it_matters: Therapeutic irradiation is the only spatially targeted, dose-quantified, deliberately
    applied perturbation of the human growth plate that exists. In craniospinal irradiation the vertebral
    physes are inside the field and the femoral and tibial physes are not, so a single patient contains
    both an exposed and an unexposed physis under an identical endocrine environment. That is a within-subject
    control no genetic disorder provides, and it would yield a dose-response curve for direct radiation
    injury to the human growth plate. The clinical stake is that GH replacement is offered on the
    assumption that the deficit is endocrine, which is only partly true.
  what_is_known: Craniospinal irradiation is known to reduce sitting height disproportionately to
    leg length; response to GH after radiotherapy is reported to depend on the location of irradiation;
    total body irradiation before haematopoietic transplantation causes generalised growth loss and
    GH therapy after transplantation has been characterised nationally. An aromatase inhibitor study
    in 92 GH-deficient male survivors compared final adult height with and without adjuvant aromatase
    inhibition.
  what_is_missing: No study links recorded radiation dose to the individual physis with the segment-specific
    growth outcome of that physis in the same patient. Sitting height and leg length are rarely both
    recorded in survivorship follow-up, and modern treatment-planning dosimetry - which gives the
    dose to each vertebral body and to each long bone - is not being joined to auxology.
  nearest_evidence:
  - pollock2024
  discriminating_experiment: Retrospectively link radiotherapy treatment-planning dosimetry to serial
    sitting height and subischial leg length in a childhood cancer survivor cohort, and model each
    segment's growth against the dose delivered to its own physes with GH status as a covariate.
    Under a purely endocrine model both segments are affected equally and dose to the individual
    physis adds nothing once GH status is known; under a direct-damage model segment growth falls
    with local physeal dose in a graded way, and the slope of that relationship is the human physeal
    radiation dose-response.
  tractability: 4
