- gap_id: g_l11path_017
  question: Is the 11p15.5 imprinting dose-response for stature symmetric - does gain of IGF2 dosage
    add as much adult height as loss of IGF2 dosage subtracts?
  type: quantitative_gap
  layer: L11
  why_it_matters: Silver-Russell and Beckwith-Wiedemann syndromes are a reciprocal human dosage experiment
    at one imprinted locus, which is rare. Symmetry or asymmetry of the response tells you whether
    IGF2 acts on the growth plate on the steep part of a dose-response curve or near saturation,
    which in turn bears on whether raising IGF signalling pharmacologically can add height in a normal
    child. It is also the clearest available test of whether prenatal and postnatal growth read IGF2
    dosage the same way.
  what_is_known: Both syndromes are molecularly defined by opposite methylation and copy-number changes
    at the same 11p15.5 domain, with additional subtypes (mUPD7 in SRS; CDKN1C mutation and KCNQ1OT1
    loss of methylation in BWS). SRS shows prenatal-onset growth failure with no catch-up and EARLY
    puberty, so the growth period is shortened as well; BWS overgrowth is prominent in infancy and
    childhood and attenuates with age, so adult heights are less extreme than childhood SDS predicts.
    Paternally inherited IGF2 missense variants also cause SRS, localising causality to IGF2 within
    the domain.
  what_is_missing: No study reports adult heights for molecularly subtyped SRS and BWS patients on
    the same scale, and no analysis regresses adult height on the direction and magnitude of the
    11p15 methylation or copy-number change.
