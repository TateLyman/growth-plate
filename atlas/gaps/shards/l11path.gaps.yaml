- gap_id: g_l11path_019
  question: Why do some COMP alleles spare adult stature (multiple epiphyseal dysplasia) while others
    in the same domain cost 4-6 SD (pseudoachondroplasia)?
  type: known_unknown
  layer: L11
  why_it_matters: COMP is the clearest case in which one gene produces both a severe chondrodysplasia
    and a joint disease with near-normal height, and 830 patients have been genotyped, so the human
    dose-response is unusually well populated. Understanding which property of the allele determines
    whether the growth plate output is destroyed or preserved would generalise to every proteostatic
    matrix disorder, including the COL2A1 and COL10A1 series.
  what_is_known: In 830 PSACH/EDM1 patients with 224 COMP variants, in-frame variants and especially
    the hotspot c.1417_1419del (p.Asp473del) are PSACH-specific, whereas missense changes in T3 subdomains
    4 and 5 associate with EDM1; 87.7 percent of probands have a T3-domain variant. Separately, a
    22-patient MED series found COMP mutations previously assigned to PSACH producing typical MED1
    or intermediate phenotypes, so the genotype-phenotype boundary is not absolute. In MED, 15 children
    followed to ages 11-18 had height normal or at the lower limit.
  what_is_missing: No measurement of the amount of retained mutant COMP or of the ER stress response
    in patient chondrocytes as a function of allele class, so the hypothesis that PSACH alleles retain
    more protein than EDM1 alleles is untested in human cells.
  nearest_evidence:
  - ni2026
  - taner2026
  discriminating_experiment: Introduce a panel of PSACH-specific (p.Asp473del and other in-frame)
    and EDM1-specific (T3-4/T3-5 missense) COMP alleles into isogenic human iPSC-derived chondrocytes;
    quantify intracellular COMP retention, the unfolded protein response, apoptosis and secreted
    matrix. Under a retention-dose model PSACH alleles retain more protein and kill more chondrocytes
    in a graded fashion that predicts height SDS; under a matrix-function model retention is equal
