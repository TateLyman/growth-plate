# Gap shard for Layer L11 (pathology as natural experiment).
# Merged into atlas/gaps/gaps.yaml by atlas/tools/merge_shards.py
gaps:
- gap_id: g_l11path_001
  question: Within genetically confirmed achondroplasia, does the specific FGFR3 allele (c.1138G>A
    vs c.1138G>C, both G380R; and the rarer non-G380R achondroplasia alleles) explain any of the
    residual variance in adult height?
  type: quantitative_gap
  layer: L11
  why_it_matters: Achondroplasia is presented as a single-allele disorder with a fixed adult height
    of ~132/124 cm, yet the reported variability around that mean is as wide as in the general population.
    If part of that variance is allelic rather than polygenic, then vosoritide and infigratinib trials
    are pooling responders and non-responders, and the field's baseline expectation for an individual
    patient is wrong. It also determines whether FGFR3 output is a graded rheostat across the whole
    series or only between the named syndromes.
  what_is_known: The two nucleotide changes at position 1138 both produce G380R and are conventionally
    treated as equivalent. Naski 1996 shows K650E > G380R in constitutive activity, establishing
    that graded activation exists ACROSS syndromes. Merker 2018 reports adult height 132 cm (M) /
    124 cm (F) in 466 European children with variability comparable to the general population, but
    does not stratify by allele.
  what_is_missing: No published cohort reports adult height stratified by achondroplasia genotype.
    No study partitions achondroplasia height variance into allelic, parental-height (polygenic)
    and environmental components.
  nearest_evidence:
  - merker2018
  - naski1996
  - shiang1994
  discriminating_experiment: Take an existing genotyped achondroplasia registry with attained adult
    heights (LIAISE, ACHieve, or the European growth-reference cohort), stratify by c.1138G>A vs
    c.1138G>C vs non-G380R alleles, and regress adult height on allele with mid-parental height as
    a covariate. Under the 'single allele, fixed phenotype' hypothesis the allele term is null and
    mid-parental height carries the variance; under a graded-rheostat hypothesis the non-G380R alleles
    separate by >1 SD and the two G380R nucleotide changes do not.
  tractability: 4
  search_log_ref: search_log_l11path_001
- gap_id: g_l11path_002
  question: Has the growth plate of any living person with achondroplasia, hypochondroplasia or SADDAN
    ever been described histologically?
  type: search_established
  layer: L11
  why_it_matters: Every mechanistic claim in the atlas about which zone FGFR3 acts on in humans -
    shortened proliferative columns, truncated hypertrophic zone, disrupted resting-zone turnover
    - is currently imported from mouse models or from autopsy material of the LETHAL variants. If
    the non-lethal FGFR3 disorders differ zonally from the lethal ones (and Wilcox 1998 already shows
    that K650E plates are better preserved than R248C plates, so zonal phenotype is not monotonic
    in severity), the whole zonal model for achondroplasia rests on an extrapolation from a different
    allele class.
  what_is_known: Wilcox 1998 read growth plate histopathology in 91 thanatophoric dysplasia cases
    from the International Skeletal Dysplasia Registry and found genotype-dependent differences in
    preservation. Mouse Fgfr3 models give detailed zonal data, most recently resting-zone turnover
    disruption via CREB. Human iliac and physeal tissue is obtainable at guided-growth and limb-lengthening
    surgery, which achondroplasia patients undergo frequently.
  what_is_missing: No histological description of a growth plate from a living achondroplasia, hypochondroplasia
    or SADDAN patient. Limb lengthening and epiphysiodesis are performed routinely in this population
    and the resected or biopsied physeal tissue is not being characterised.
  nearest_evidence:
  - wilcox1998
  - horike2026
  - merker2018
  discriminating_experiment: Consent a prospective series of achondroplasia patients undergoing guided
    growth or limb lengthening for physeal biopsy at the osteotomy site, with age- and site-matched
    control physeal tissue from trauma or leg-length-discrepancy surgery. Read zone heights, column
    organisation, proliferative index (Ki67) and collagen X extent. Under the mouse-derived model
    the proliferative zone is selectively shortened with an intact resting zone; under the CREB/resting-zone-turnover
    model the resting zone is depleted and the proliferative deficit is secondary.
  tractability: 3
  search_log_ref: search_log_l11path_002
- gap_id: g_l11path_003
  question: What is the adult height distribution of genetically confirmed hypochondroplasia, in
    cm by sex, and does the FGFR3 N540K genotype differ from the non-N540K genotypes?
  type: quantitative_gap
  layer: L11
  why_it_matters: Hypochondroplasia is the intermediate rung of the FGFR3 dose ladder and is the
    rung with no number. Without a cohort adult height for hypochondroplasia the ladder has a value
    at the achondroplasia rung (132/124 cm), a value at the lethal rung (no adult height), and a
    hole in between, so the human dose-response for FGFR3 activation cannot be drawn. Hypochondroplasia
    is also the indication now being pursued for infigratinib, and a trial without a natural-history
    endpoint cannot demonstrate benefit on adult height.
  what_is_known: N540K accounts for 50-70 percent of hypochondroplasia; K650N and K650Q give hypochondroplasia-like
    disease with weaker kinase activation than the thanatophoric alleles. A 20-patient N540K series
    reports mean age, follow-up, genu varum and macrocephaly frequencies and GH response but not
    attained adult height by sex. A six-patient GH series reports a baseline height SDS of -3.43
    and concludes final height remained inadequate.
  what_is_missing: No published adult height in cm with SD and n for hypochondroplasia, and no comparison
    of attained height between N540K and non-N540K genotypes.
  nearest_evidence:
  - bellus1995
  - bellus2000
  - kim2023
  discriminating_experiment: Assemble genotyped hypochondroplasia patients who have reached adult
    height from the existing European and Asian skeletal dysplasia registries; report height in cm
    by sex with SD and n, stratified by N540K versus other FGFR3 alleles, excluding GH-treated patients
    or analysing them separately. Under a graded FGFR3 rheostat, N540K sits between achondroplasia
    and normal and the non-N540K alleles spread around it in the order predicted by their in vitro
    kinase activity; under a threshold model all hypochondroplasia genotypes converge on one height.
  tractability: 4
  search_log_ref: search_log_l11path_003
- gap_id: g_l11path_004
  question: Why is FGFR3 K650M (SADDAN) survivable when K650E (thanatophoric dysplasia type II) is
    lethal, despite K650M producing roughly three times the constitutive receptor kinase activity?
  type: contradiction
  layer: L11
  why_it_matters: This is the single observation that falsifies the simplest model of the whole FGFR3
    series - that phenotype severity is a monotonic function of receptor activation strength. If
    the scalar model is wrong, then drug development premised on 'reduce FGFR3 kinase output' (infigratinib,
    TYRA-300) is targeting a quantity that does not by itself determine outcome, and the relevant
    variable is pathway bias, receptor localisation or tissue distribution.
  what_is_known: Tavormina 1999 measured ~3-fold greater constitutive kinase activity for K650M than
    for K650E in transient transfection, and reported four unrelated K650M individuals surviving
    past infancy without prolonged life support. Bellus 2000 showed the same codon generates weakly
    activating alleles (K650N, K650Q) that cause hypochondroplasia-like disease. Wilcox 1998 independently
    found that K650E growth plates are BETTER preserved than R248C and Y373C plates, a second non-monotonicity
    in the same series.
  what_is_missing: No study has compared downstream pathway usage (MAPK/ERK vs STAT1 vs PLCgamma),
    receptor trafficking, or ligand dependence between K650M and K650E in chondrocytes rather than
    in generic transfected cells. Lethality in thanatophoric dysplasia is respiratory, driven by
    thoracic cage and cranial base geometry, and no study has asked whether the two alleles differ
    in their effect on those specific skeletal elements rather than on the long bones.
  nearest_evidence:
  - tavormina1999
  - bellus2000
  - wilcox1998
  discriminating_experiment: Express K650M and K650E FGFR3 at matched levels in human iPSC-derived
    chondrocytes and in a costal-cartilage explant model; quantify phospho-ERK, phospho-STAT1 and
    receptor surface residence, and measure rib and cranial base growth in matched knock-in mouse
    alleles. Under the scalar model K650M shows uniformly greater signalling and worse growth on
    every readout; under a pathway-bias model K650M exceeds K650E on ERK but not on STAT1, and STAT1
    output tracks the lethal thoracic phenotype.
  tractability: 3
- gap_id: g_l11path_005
  question: Has the growth plate of any patient with an NPR2 or NPPC dosage disorder - AMDM, NPR2
    haploinsufficiency, NPR2 gain of function, or NPPC overexpression - ever been examined histologically?
  type: search_established
  layer: L11
  why_it_matters: The CNP axis is the target of an approved drug (vosoritide) and of several agents
    in trials, and the entire mechanistic rationale - that CNP/NPR2/cGMP/PKG-II acts on proliferative
    and hypertrophic chondrocytes - is derived from mouse, rat, dog and in vitro systems. AMDM is
    the human null and its growth plate has never been read. Without human tissue there is no way
    to know whether the human growth plate uses the same zonal distribution of NPR2 as the mouse,
    which is the assumption every dose calculation for vosoritide rests on.
  what_is_known: Npr2- and Nppc-deficient mice and rats, the cn/cn dwarf mouse corresponding to AMDM,
    and Dalmatian dogs with a PRKG2 nonsense mutation all have detailed growth plate histomorphometry.
    In humans, Bartels 2004 established biallelic NPR2 loss of function in 21 families with in vitro
    guanylyl cyclase assays; Olney 2006 measured plasma CNP and NT-proCNP in an AMDM proband and
    in carriers. None of these studies examined human cartilage.
  what_is_missing: No human growth plate histology, immunohistochemistry or in situ hybridisation
    in any NPR2 or NPPC dosage disorder, and no human zonal map of NPR2 protein in a normal growth
    plate against which a patient could be compared.
  nearest_evidence:
  - bartels2004
  - olney2006
  - hisadooliva2015
  discriminating_experiment: AMDM patients undergo corrective osteotomy and limb lengthening; consent
    a biopsy protocol at those procedures and compare against age- and site-matched physeal tissue
    from trauma surgery. Stain for NPR2, phospho-VASP (a PKG activity reporter) and collagen X, and
    measure zone heights. Under the mouse-derived model the proliferative and hypertrophic zones
    are both shortened with reduced hypertrophic cell volume; under a matrix-synthesis model the
    cell numbers are preserved and only the matrix per cell is reduced.
  tractability: 3
  search_log_ref: search_log_l11path_005
- gap_id: g_l11path_006
  question: What is the effect size in cm or SDS of NPR2 gain of function and of NPPC overexpression
    on adult height, and does it scale with the measured increase in cGMP?
  type: quantitative_gap
  layer: L11
  why_it_matters: The CNP axis is the only human growth pathway with documented loss-of-function
    AND gain-of-function alleles AND a measurable circulating second messenger (blood cGMP) AND an
    approved agonist drug. That combination would make it the first human signalling axis in the
    skeleton with a complete dose-response curve from receptor output to adult height - which is
    precisely the curve needed to predict how much height a CNP analogue can deliver. Half the curve
    is quantified and half is not.
  what_is_known: 'The loss-of-function arm is quantified: NPR2 heterozygotes are -1.8 +/- 1.1 SDS
    versus -0.4 +/- 0.8 in non-carrier relatives, a ~1.4 SD effect per lost allele. The gain-of-function
    arm is described only per individual: ''tall stature'' with V883M, ''extremely tall'' with R655C,
    ''marfanoid habitus'' with the NPPC translocations. Blood cGMP was elevated in the V883M family
    and plasma NT-proCNP was reduced in the R655C proband, so the transducer has been measured in
    the same people whose height was not tabulated.'
  what_is_missing: No pooled adult height in cm or SDS, with sex and n, for any NPR2 gain-of-function
    allele or NPPC overexpression rearrangement; and no regression of height SDS on circulating cGMP
    or NT-proCNP across the reported carriers.
  nearest_evidence:
  - olney2006
  - miura2012
  - hannema2013
  - bocciardi2007
  discriminating_experiment: Recontact the published NPR2 gain-of-function and NPPC-rearrangement
    pedigrees (V883M three-generation family, R655C proband, the submembrane-deletion family, the
    t(2;7) and t(1;2) probands, and the NPR3 loss-of-function tall-stature families), collect adult
    heights in cm with sex and mid-parental height, and pair them with plasma cGMP and NT-proCNP.
    Under a linear cGMP-to-height model the height SDS regresses monotonically on cGMP across loss
    and gain alleles alike; under a saturating model the gain-of-function alleles gain much less
    height than the loss-of-function alleles lose.
  tractability: 4
- gap_id: g_l11path_007
  question: Has the growth plate in Laron syndrome or any other form of severe GH insensitivity ever
    been examined histologically in a human?
  type: search_established
  layer: L11
  why_it_matters: 'The Ecuadorian GHR-deficiency cohort shows that loss of GH-IGF-I signalling produces
    DISproportionate growth - the lowest lower-segment/height and the highest head-circumference/height
    ratios - contradicting the standard assumption that the axis scales the skeleton uniformly. That
    result demands a cellular explanation: either GH/IGF-I acts differently on different growth plates,
    or the growth plates are the same and the difference arises from differing baseline growth rates.
    Human tissue is the only way to distinguish them, and it has never been obtained despite a geographically
    clustered cohort of over 100 affected individuals followed for decades.'
  what_is_known: Guevara-Aguirre 2025 characterised body proportions in 201 adults and showed serum
    IGF-I correlates positively with all body measurements and negatively with head-circumference/height.
    Ghr-null mice have detailed growth plate histology showing reduced hypertrophic chondrocyte size.
    STAT5B-null and IGF1-null humans exist with full endocrine phenotyping but no cartilage sampling.
  what_is_missing: No histology, immunohistochemistry or zonal measurement of a human growth plate
    in GH receptor deficiency, STAT5B deficiency, IGF1 deficiency, IGF1R deficiency or PAPP-A2 deficiency.
  nearest_evidence:
  - guevaraaguirre2025
  - hwa2005
  - dauber2016
  discriminating_experiment: In the Ecuadorian or Israeli GHR-deficiency cohorts, obtain physeal
    tissue at orthopaedic procedures already being performed (or post mortem with consent) and compare
    zone heights and hypertrophic chondrocyte volume against site-matched controls from the same
    population. Under a uniform-scaling model all zones are proportionally reduced at every site;
    under the disproportionality data the femoral/tibial hypertrophic zone is selectively reduced
    relative to the vertebral one.
  tractability: 2
  search_log_ref: search_log_l11path_007
- gap_id: g_l11path_008
  question: In humans, what fraction of growth plate elongation is driven by circulating (hepatic)
    IGF-I versus locally produced IGF-I within the growth plate?
  type: known_unknown
  layer: L11
  why_it_matters: This determines whether systemic IGF-I concentration is a valid target or merely
    a biomarker. Laron syndrome (no GH signal anywhere), STAT5B deficiency (no IGF1 transcription),
    IGF1 biallelic deletion (no ligand at all) and PAPP-A2 deficiency (normal total but low free
    IGF-I) form a natural human series that in principle separates the two sources, because they
    differ in whether local IGF-I production is preserved. Getting this wrong means mecasermin dosing
    is targeted at the wrong compartment.
  what_is_known: The four human disorders and their biochemical signatures are established. PAPP-A2
    deficiency in particular shows that total IGF-I can be HIGH while free IGF-I is low and growth
    fails, proving that the bioavailable fraction rather than the measured total is the growth-relevant
    variable. Liver-specific Igf1 knockout mice grow almost normally despite a large fall in circulating
    IGF-I, which is the strongest argument for the local source - but it is a mouse result.
  what_is_missing: No human condition selectively removes hepatic IGF-I while preserving local growth
    plate IGF-I, so the mouse dissociation has no human counterpart; and no measurement of IGF-I
    protein or transcript in human growth plate tissue from any of these disorders exists.
  nearest_evidence:
  - dauber2016
  - hwa2005
  - guevaraaguirre2025
  - woods1996
  discriminating_experiment: 'Combine two readouts: (i) in PAPP-A2 deficiency, measure the height
    velocity response to rhIGF-1 (which raises free IGF-I systemically) against the response to recombinant
    PAPP-A2 (which liberates IGF-I from existing complexes); (ii) quantify IGF1 transcript in physeal
    biopsies from GHR-deficient versus control humans. Under a dominant endocrine model both interventions
    give equal velocity gain and physeal IGF1 transcript is unchanged in GHR deficiency; under a
    dominant local model physeal IGF1 transcript is markedly reduced in GHR deficiency and systemic
    free IGF-I correlates poorly with velocity.'
  tractability: 2
- gap_id: g_l11path_009
  question: What is the upper bound of human growth plate elongation - how tall can a growth plate
    driven by lifelong GH excess from infancy actually make a person, and what terminates it?
  type: quantitative_gap
  layer: L11
  why_it_matters: X-LAG provides a human experiment that starts GH excess in infancy and runs it
    for the entire growth period, which is the maximal possible drive on a structurally normal growth
    plate. The resulting adult heights define the ceiling of human longitudinal growth capacity,
    which is the number every growth-promoting therapy is implicitly trying to approach. It also
    tests whether the growth plate has a finite proliferative reserve (Layer L2) or whether elongation
    is limited only by fusion timing.
  what_is_known: Rostomyan 2015 characterised 208 pituitary gigantism patients with an inclusion
    criterion of final height >2 SD above country means; median onset of rapid growth was 13 years
    overall, but every X-LAG patient had onset in early childhood while no non-duplicated patient
    presented before age 5. Trivellin 2014 established the Xq26.3/GPR101 mechanism in 13 of 43 gigantism
    patients.
  what_is_missing: No published analysis relating attained adult height in gigantism to age at onset
    of GH excess and to duration of exposure, and no test of whether X-LAG patients (earliest onset,
    longest exposure) reach greater adult heights than later-onset gigantism after adjusting for
    treatment and for age at biochemical control.
  nearest_evidence:
  - rostomyan2015
  - trivellin2014
  discriminating_experiment: Within the existing international gigantism cohort, regress attained
    adult height on age at onset of GH excess, duration of uncontrolled excess and age at epiphyseal
    fusion, stratified by genetic cause (X-LAG, AIP, McCune-Albright, sporadic). Under a fusion-limited
    model adult height rises with duration of exposure without plateau until fusion; under a proliferative-reserve
    model height plateaus despite continued exposure, and the earliest-onset X-LAG patients gain
    no more than later-onset patients with the same fusion age.
  tractability: 3
- gap_id: g_l11path_010
  question: Has a growth plate from a person with ACAN haploinsufficiency ever been examined, and
    does the human lesion match the impaired-hypertrophy mechanism found in the Acan+/- mouse?
  type: search_established
  layer: L11
  why_it_matters: ACAN haploinsufficiency is common enough to account for a meaningful share of idiopathic
    short stature and it is the disorder that dissociates height from bone age, so it is the human
    system in which the coupling between growth and maturation could be mechanistically resolved.
    The only mechanistic account - reduced extracellular matrix with impaired chondrocyte HYPERTROPHY
    and largely preserved proliferation, mediated by Camk1D suppression of Akt - is entirely mouse.
    If the human lesion is instead a proliferative one, then the advanced bone age and the early
    growth cessation require a different explanation and GH therapy expectations change.
  what_is_known: Gkourogianni 2017 gives adult height -2.8 SDS, childhood height -2.0 SDS and bone
    age +1.3 years in 103 carriers from 20 families. Bendre 2025 provides the Acan+/- mouse histomorphometry
    and single-cell transcriptomics. ACAN patients frequently undergo osteochondritis dissecans surgery
    and joint procedures at which cartilage is removed.
  what_is_missing: No human growth plate or physeal cartilage from an ACAN mutation carrier has been
    described. No human study distinguishes whether the height deficit arises from reduced growth
    per unit time or from a shortened growth period, despite the childhood-versus-adult SDS difference
    implying the latter contributes.
  nearest_evidence:
  - gkourogianni2017
  - bendre2025
  - tatsi2017
  discriminating_experiment: Obtain physeal or peri-physeal cartilage at surgery from ACAN-mutation
    carriers (a population already over-represented in paediatric orthopaedic clinics for osteochondritis
    dissecans) and measure zone heights, hypertrophic cell volume, Ki67 index and aggrecan content
    against site-matched controls. Under the mouse-derived model hypertrophic cell volume and matrix
    content fall while the proliferative index is preserved; under a proliferative model the proliferative
    zone is short and hypertrophic cell size is normal.
  tractability: 3
  search_log_ref: search_log_l11path_010
- gap_id: g_l11path_011
  question: Do short stature and advanced bone age share a single cause in aggrecan deficiency, or
    does bone age advance independently of the height deficit?
  type: known_unknown
  layer: L11
  why_it_matters: Height and skeletal maturation are normally so tightly coupled that bone age is
    used as a proxy for remaining growth potential. ACAN deficiency breaks the coupling, and X-linked
    hypophosphatemia breaks it in the opposite direction (short with DELAYED bone age). If the two
    variables are separable, then predicting adult height from bone age is invalid in an unknown
    fraction of short children, and any therapy that improves velocity must be evaluated against
    its effect on maturation independently.
  what_is_known: In 103 ACAN carriers, bone age was advanced by a median 1.3 years and adult height
    (-2.8 SDS) was worse than childhood height (-2.0 SDS), consistent with early growth cessation
    adding to a per-year deficit. Critically, Tatsi 2017 showed ACAN mutations also occur in short
    stature WITHOUT accelerated skeletal maturation, so the two features dissociate within the same
    gene. In XLH, bone age is delayed and the child is still short.
  what_is_missing: No study has stratified an ACAN cohort into advanced-bone-age and normal-bone-age
    carriers and compared their adult heights, which is the direct test of whether the maturation
    advance costs additional height beyond the per-year growth deficit.
  nearest_evidence:
  - gkourogianni2017
  - tatsi2017
  - soto2026
  discriminating_experiment: In a pooled ACAN cohort with serial bone ages and attained adult heights,
    model adult height SDS as a function of childhood height SDS plus bone-age advance. Under a single-cause
    model bone-age advance adds no information once childhood height is known; under a two-mechanism
    model bone-age advance carries an independent negative coefficient of the order of 0.3-0.5 SDS
    per year of advance. Compare against XLH, where the coefficient should have the opposite sign.
  tractability: 4
- gap_id: g_l11path_012
  question: Do the growth plates of Jansen and Blomstrand chondrodysplasia show reciprocal shifts
    in the position of the proliferative-to-hypertrophic transition in human tissue?
  type: known_unknown
  layer: L11
  why_it_matters: Jansen (constitutively active PTH1R) and Blomstrand (inactive PTH1R) are a matched
    activating/inactivating pair at one receptor in one species, and together they are the only direct
    human test of the PTHrP-IHH negative-feedback loop that governs when a proliferative chondrocyte
    becomes hypertrophic. The loop is the central control element in the mouse growth plate model
    that the whole atlas depends on. Confirming reciprocity in human tissue would convert that model
    from a mouse inference into a human fact; failing to confirm it would be one of the most consequential
    negative results available.
  what_is_known: Schipani 1995 established ligand-independent cAMP for H223R; Saito 2018 characterised
    24 patients across five activating alleles. Karaplis 1998 showed the homozygous P132L Blomstrand
    receptor reaches the surface of the affected infant's own growth plate chondrocytes - the single
    existing human growth plate observation in either disorder - and Jobert 1998 showed loss of both
    cAMP and inositol phosphate signalling. Blomstrand is defined radiographically by ADVANCED endochondral
    maturation and Jansen by DELAYED metaphyseal mineralisation, which is the reciprocity at the
    tissue level. Pereira 2025 provides bone histomorphometry in two Jansen patients.
  what_is_missing: No side-by-side histological comparison of a Jansen and a Blomstrand human growth
    plate. Blomstrand material exists (it is a perinatally lethal disorder with autopsies performed)
    and Jansen patients undergo orthopaedic surgery, so the tissue is in principle available but
    has never been analysed with the same protocol.
  nearest_evidence:
  - schipani1995
  - karaplis1998
  - jobert1998
  - pereira2025
  discriminating_experiment: 'Apply one histological protocol to archived Blomstrand autopsy physes
    and to Jansen surgical physeal tissue, with age-matched controls: measure the fraction of the
    plate occupied by proliferative versus hypertrophic cells, and stain for PTHrP, IHH, collagen
    X and Ki67. Under the reciprocal-loop model Blomstrand shows a collapsed proliferative zone with
    premature collagen X expression and Jansen shows an expanded proliferative zone with delayed
    collagen X; under a non-reciprocal model both are disorganised in the same direction and the
    difference is in mineralisation rather than in cell fate timing.'
  tractability: 2
- gap_id: g_l11path_013
  question: What serum estradiol concentration is required in humans to close an epiphysis, and is
    the same threshold sufficient in both sexes?
  type: quantitative_gap
  layer: L11
  why_it_matters: Aromatase deficiency, ESR1 resistance and aromatase excess bracket the estrogen
    requirement for epiphyseal fusion in humans from both directions, and the aromatase-deficient
    men treated with transdermal estradiol constitute an unintentional dose-titration experiment
    - including one patient whose poor compliance produced low but detectable estradiol levels and
    therefore incomplete maturation. Knowing the threshold converts every aromatase-inhibitor height
    trial from empirical to mechanistic, and it is the number needed to predict whether a given AI
    dose will actually delay fusion.
  what_is_known: Aromatase-deficient patients have undetectable estradiol, absent pubertal growth
    spurt, delayed bone age, unfused epiphyses and continued growth; estradiol but not testosterone
    closed the epiphyses in a treated man. ESR1 resistance gives the same skeletal phenotype at 204
    cm with normal or elevated estrogen, proving the receptor rather than the ligand is the transducer.
    Aromatase excess produces the opposite - accelerated maturation and short adult stature.
  what_is_missing: No published dose-response relating measured serum estradiol to rate of bone age
    advance or to epiphyseal closure in the aromatase-deficient patients who were titrated, and no
    comparison of the required concentration between XX and XY aromatase-deficient individuals.
  nearest_evidence:
  - morishima1995
  - carani1997
  - smith1994
  - giannopoulou2024
  discriminating_experiment: 'Pool the published aromatase deficiency case series in which transdermal
    estradiol was given with serial serum estradiol and serial bone age, and fit rate of bone-age
    advance against measured estradiol. Under a threshold model bone age advance is near-zero below
    a concentration and maximal above it; under a graded model the relationship is continuous. Compare
    XX and XY patients: equal thresholds support a sex-independent growth plate estrogen requirement.
    Note that the fusion mechanism itself is analysed in Layer L7.'
  tractability: 3
- gap_id: g_l11path_014
  question: How many centimetres of adult height are attributable to SHOX dosage alone, and does
    the estimate derived from sex-chromosome aneuploidy match the estimate from isolated SHOX deletions?
  type: quantitative_gap
  layer: L11
  why_it_matters: SHOX is the largest-effect common contributor to human height variation and the
    gene through which Turner syndrome, Klinefelter syndrome and Leri-Weill dyschondrosteosis all
    act. A single number in centimetres per SHOX copy, validated across two independent designs,
    would anchor the whole genetics-to-stature translation in Layers L8 and L11. The aneuploidy design
    gives a dosage estimate confounded by all other PAR1 and X/Y genes; the isolated-deletion design
    gives a gene-specific estimate confounded by ascertainment.
  what_is_known: Berry 2025, using 928,605 individuals including 1,225 sex-chromosome aneuploidy
    adults, found that one extra Y adds 3.1 cm (95% CI 1.9-4.3) more than one extra inactive X, and
    that this asymmetry explains 22.6 percent of the 13 cm male-female height difference - consistent
    with reduced SHOX expression from the inactive X. Untreated Turner growth references exist from
    259 Brazilian and 842 Turkish girls.
  what_is_missing: No study reconciles the aneuploidy-derived per-copy SHOX estimate with the height
