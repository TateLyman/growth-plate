    in the same tissue. Comparing the two answers the dye-dissociation question at the same time. A penetration
    depth that falls short of the inert zone would show that a carrier optimised on mouse tissue does not reach
    the human proliferative zone at all, which is the outcome the thickness scaling predicts and which no published
    study can currently exclude.
  tractability: 3
- gap_id: g_l12_does_intermittent_pth1r_agonism_raise_amplification_in_a_wild_type_plate
  type: quantitative_gap
  layer: L12
  tractability: 4
  question: Does intermittent PTH1R agonism raise the number of chondrocytes delivered per resting-zone progenitor
    consumed, or does it buy its growth-rate effect by spending the pool faster the way growth hormone does?
  why_it_matters: This is the decisive measurement on the programme's best yield candidate. ogawa2002 is the only
    agent found anywhere in this atlas that raised the longitudinal growth rate of a NORMAL, normally-loaded, growing
    animal - not a dysplasia rescue, not a deficiency rescue. Its mechanism is an exact match to the definition
    of the term being targeted, because PTHrP acting on PTH1R is the endogenous signal that delays hypertrophic
    commitment and commitment delay IS amplification. But ogawa2002 reports a zone height, an unspecified chondrocyte
    number, and a growth rate, and CORR-189 established one round earlier that a zone height cannot separate amplification
    from terminal cell height. Round 183 is the cautionary precedent - growth hormone was recorded as an amplification
    agent by two separate nodes until the flux quantities were computed and it came out at 0.77, buying its entire
    effect by consuming the resting pool five times faster. If intermittent PTH1R agonism turns out to work the
    same way it is a second growth hormone, and in a subject at bone age 16 it would stack in COST with the GH already
    in the stack rather than in benefit. That is the specific failure mode and nothing currently distinguishes it.
  what_is_known: 'ogawa2002, rat - hPTH(1-34) 80 ug/kg/day five days a week for three weeks raised growth plate
    thickness, chondrocyte number and longitudinal growth rate in 6-week-old normally loaded animals against untreated
    normally loaded controls, with the effect ABSENT in 15-week-old animals. xie2012, mouse - systemic intermittent
    PTH(1-34) rescued thanatophoric dysplasia type II lethality and brought achondroplastic humeri and tibiae to
    lengths comparable with wild-type, with increased PTHrP and downregulated FGFR3. reyes2023, mouse - the humanized
    H223R-PTH1R Jansen plate has markedly EXPANDED proliferating and prehypertrophic zones with abundant apoptosis
    and progressive LOSS of type X hypertrophic chondrocytes, so constitutive activation delays commitment successfully
    and then fails to discharge. liu2012, chondrocytes - continuous PTH suppresses differentiation while intermittent
    PTH enhances it, the schedule dependence that makes pulsatile dosing a single-agent charge-and-discharge cycle.
    hunziker1994, rat - the worked method: growth rate = amplification x pool consumption rate x terminal cell height,
    closed with zero residual when the right five quantities are measured in the same animals.'
  what_is_missing: Terminal hypertrophic cell height and resting-zone cycle time under any PTH1R agonist, in any
    species, at any dose - without both, the growth-rate gain cannot be partitioned and the amplification claim
    cannot be made or refused. Also missing - (a) any dose-response, since ogawa2002 ran a single dose and the minimum
    effective dose is therefore unknown and could be far below the human equivalent of 12.9 ug/kg/day that currently
    sits about 10-fold above the approved abaloparatide dose; (b) any test of whether the 15-week null is a CLOSED
    WINDOW or a dose-and-duration artefact in a slower plate, which decides whether the candidate is usable in a
    late case at all; (c) any head-to-head of abaloparatide against teriparatide at a growth plate, the preference
    between them currently resting on signalling duration (zhai2022) against a paper finding no difference in early
    pathway engagement (sato2021); (d) any schedule comparison against a LENGTH endpoint, since liu2012's charge-and-discharge
    evidence is differentiation markers in condylar cartilage.
  nearest_evidence:
  - ogawa2002
  - reyes2023
  - liu2012
  - xie2012
  - hunziker1994
  nearest_evidence_note: 'Four PTH datasets, none reporting the flux quantities, plus hunziker1994 as the METHOD
    rather than as PTH evidence. The pattern is the same one that produced the wrong answer for growth hormone:
    a real growth effect, reported in zone heights, with the term assignment inferred rather than computed.'
  discriminating_experiment: 'In wild-type growing mice or rats, dose abaloparatide or PTH(1-34) on an intermittent
    schedule and measure the hunziker1994 five in the same animals - calcein-labelled elongation rate, terminal
    hypertrophic cell height, resting cells per column, resting-zone cycle time by continuous label, and cells per
    column by zone. Compute amplification as (growth rate / terminal cell height) divided by (resting cells per
    column / resting cycle time). Run two ages spanning the ogawa2002 gate, 6 weeks and 15 weeks, and at least three
    doses spanning the approved human equivalent. THREE OUTCOMES DISCRIMINATE AND EACH SENDS THE PROGRAMME SOMEWHERE
    DIFFERENT. Amplification rises - this is the yield agent, it is an approved drug, and the search that began
    in round 174 is over. Amplification flat with terminal cell height up - it is a third h_term agent behind vosoritide
    and GH and it stacks poorly. Amplification flat or below one with pool consumption up - it is a second growth
    hormone, it is actively harmful in a late case, and the candidate dies. A fourth arm comparing continuous infusion
    against intermittent injection at matched total dose would test the charge-and-discharge claim directly, and
    the prediction is specific: continuous should reproduce the reyes2023 Jansen phenotype of an expanded proliferative
    zone with lost hypertrophic cells and no length gain.'
  status: answered_indirectly
  answered_round: 198
  answer: 'ANSWERED INDIRECTLY IN ROUND 198 - THE ANSWER IS NEITHER, AND THE FEARED FAILURE MODE IS EXCLUDED. The
    gap was built to distinguish three outcomes: amplification rises and the search is over; amplification flat
    with terminal cell height up and it stacks poorly; or amplification flat with pool consumption up, in which
    case it is a second growth hormone and is actively harmful behind the GH already in the stack. THE THIRD IS
    NOW EXCLUDED. correa2010 shows that removing the PTHrP effector Zfp521 collapses the resting zone from five
    or more cell layers to one or two while cutting cells per column, and hirai2011 shows that deleting PTH1R from
    cartilage after birth destroys the growth plate through accelerated differentiation and apoptosis. Endogenous
    PTH1R tone is POOL-PRESERVING, so an agonist on that axis cannot be a pool-spending agent. THE FIRST IS ALSO
    EXCLUDED, by the inverted U of round 197 and by every wild-type agonist null across mouse, rat and randomised
    human children: the axis is saturated, so there is no headroom for amplification to rise. The remaining answer
    is that intermittent PTH1R agonism does nothing measurable to any term of the Hunziker identity in a wild-type
    plate. RESIDUAL, AND IT IS REAL: the direct measurement has still never been made. No study in any species at
    any dose reports cells per column, terminal hypertrophic cell height and resting-zone cycle time under a PTH1R
    agonist. The indirect closure rests on a loss-of-function flux measurement plus a wall of length nulls. If g_l12_does_aromatase_inhibition_lower_growth_plate_pthrp_tone
    survives, the direct measurement becomes necessary again, because a plate moved below the optimum is no longer
    the plate these nulls were measured in.'
- gap_id: g_l12_which_clock_sets_intermittency_at_the_growth_plate
  type: known_unknown
  layer: L12
  tractability: 4
  question: Is the clock that makes PTH1R dosing 'intermittent' rather than 'continuous' the receptor's own desensitisation
    and resensitisation kinetics, or the chondrocyte's differentiation-commitment clock?
  why_it_matters: This single unmeasured quantity decides whether daily teriparatide or abaloparatide is a usable
    growth-plate intervention or an actively harmful one, and it is the assumption the whole round-185 benchmark
    rests on. PTH1R agonism is the only drug class in this atlas whose SIGN inverts with dosing schedule - pulses
    lengthen bone, continuous exposure shortens it, and every continuous exposure on record produces the same phenotype.
    If the operative clock is RECEPTOR-INTRINSIC (desensitisation and resensitisation, minutes to hours) it is near
    species-invariant, the duty cycle transfers unchanged from rat to human, and daily dosing is genuinely intermittent
    in both. If it is the CHONDROCYTE COMMITMENT CLOCK it scales with the cell cycle, which is 1.4 days in rat and
    about 20 days in human, and the same daily syringe delivers 1 pulse per cell cycle to a rat and 20 to a human
    - twenty-fold toward the arm where bone gets shorter. The two readings differ not in effect size but in the
    DIRECTION of the predicted human result.
  what_is_known: ogawa2002, rat - hPTH(1-34) five days a week raised longitudinal growth rate in normally loaded
    6-week-old animals, delivering approximately one pulse per rat proliferative chondrocyte cycle. liu2012, chondrocytes
    - continuous PTH promotes proliferation and SUPPRESSES differentiation with COL10A1 down, while intermittent
    PTH enhances differentiation, so the inversion is real in this cell type and not only in osteoblasts. reyes2023,
    mouse - the humanized H223R-PTH1R plate under constitutive signalling has markedly expanded proliferating and
    prehypertrophic zones with abundant apoptosis and progressive loss of type X hypertrophic chondrocytes, which
    is a DIFFERENTIATION-TIMING failure rather than a receptor-resensitisation failure and therefore leans toward
    the commitment clock. hunziker1994 and kember1976 supply the two cell-cycle clocks, 1.4 days and about 20 days.
    In BONE the intermittent-versus-continuous distinction is conventionally attributed to signalling duration in
    osteoblasts, which leans the other way.
  what_is_missing: Any measurement of PTH1R desensitisation or resensitisation kinetics in a CHONDROCYTE, of either
    species - a focused search returns two papers on PTH1R desensitisation and neither is in cartilage. Also missing
    - (a) any dose-schedule matrix at a growth plate, since no experiment has varied the dosing INTERVAL against
    a bone-length endpoint while holding cumulative dose constant; (b) whether the commitment clock scales with
    the proliferative cycle at all, which is assumed rather than shown; (c) any human or large-animal data at an
    interval longer than daily, even though weekly teriparatide 56.5 micrograms is an approved product.
  nearest_evidence:
  - ogawa2002
  - liu2012
  - reyes2023
  - hunziker1994
  - kember1976
  nearest_evidence_note: The inversion is established, both clocks are measured, and the link between them is entirely
    unmeasured. This is a gap between two well-characterised things rather than a gap in a dark area.
  discriminating_experiment: Two experiments, one cheap and one decisive. CHEAP - measure cAMP and downstream response
    to a second PTH1R agonist pulse in primary rat and human growth plate chondrocytes at increasing intervals after
    a first pulse, and read off the resensitisation half-time in each species. If the two species resensitise at
    similar rates, the receptor clock is species-invariant and the round-185 benchmark is wrong. DECISIVE - in growing
    rats, hold the CUMULATIVE dose of PTH(1-34) constant and vary only the dosing interval across at least four
    arms spanning roughly 0.25 to 4 pulses per proliferative chondrocyte cycle, then measure bone length plus the
    hunziker1994 five so amplification can be computed for each arm. If the length response peaks near one pulse
    per cell cycle, intermittency is set by the commitment clock, the benchmark holds, and the human interval should
    be weeks. If the response is flat across intervals or peaks at the shortest one, it is set by receptor kinetics
    and daily human dosing is defensible. This experiment has never been done for any schedule-inverting drug at
    a growth plate, and it would settle the candidate either way in one study.
  status: moot_line_closed
  answered_round: 198
  answer: 'MOOT AS OF ROUND 198. This gap asked what pulse interval a PTH1R agonist should use to engage the growth
    plate, on the assumption that the agent would do something once the schedule was right. It is answered only
    in the sense that the question no longer arises: round 197 established the axis is an inverted U with wild type
    at the top, round 198 established the receptor is present and load-bearing but the tone is saturated, and no
    schedule can add signalling to a saturated system. ONE PIECE OF THE ORIGINAL QUESTION SURVIVES AND IS NOT MOOT,
    because it is the only internally controlled schedule comparison on a LENGTH endpoint anywhere in the line:
    schmitt2000 gave PTH(1-37) at the same 60 micrograms per kilogram per day by continuous minipump and by twice-daily
    injection in the same experiment, and only the intermittent arm changed length gain. If g_l12_does_aromatase_inhibition_lower_growth_plate_pthrp_tone
    survives and the line reopens, that contrast is the starting point for the schedule and the reopened gap should
    inherit it.'
- gap_id: g_l12_is_the_pth1r_acceleration_banked_or_does_it_advance_fusion
  type: quantitative_gap
  layer: L12
  tractability: 3
  question: Intermittent PTH1R agonism accelerates femoral elongation in the rat and leaves final femoral length
    unchanged. In a species whose growth plate FUSES, is the accelerated interval banked as extra final height,
    or does the acceleration bring fusion forward and bank nothing?
  why_it_matters: This is now the only question on which the entire PTH1R line turns, and it cannot be answered
    in the species where all the data exist. The FDA Pharmacology Review for NDA 21-318 tabulates QCT femur length
    at two interim sacrifices and at terminal. At the interims the drug is clearly working - plus 1.5 and plus 3.4
    per cent treating from 2 to 8 months, plus 1.5 and plus 2.9 per cent treating from 6 to 12 months, dose-dependent,
    both starred. At terminal, 26 months of age, femur length is 35 mm in all eight arms including the two dosed
    continuously from 2 and from 6 months to termination, with no asterisk anywhere in that row while every other
    row in the same table is starred. Controls ran 32.8 mm at 8 months, 34.2 at 12, 35.0 at 26 - they caught up.
    The rat gives it back BECAUSE THE RAT PLATE NEVER CLOSES and the control has fourteen further months to converge
    on the same asymptote. A human at bone age 16 does not have that. If fusion is scheduled by time or by the hormonal
    milieu, then six months of accelerated elongation is banked and the illustrative arithmetic is 1.4 to 1.6 cm
    of femur. If fusion is triggered by exhaustion of a fixed proliferative reserve, then accelerating consumption
    fuses the plate earlier, banks nothing, and stacks in COST behind growth hormone - which round 183 showed is
    already consuming the resting pool at five times the normal rate. The two hypotheses predict opposite signs
    on final height from the same rat dataset.
  what_is_known: fda_forteo_pharmreview_2002 - the interim positives and the terminal null, in the same study, same
    measurement method, same reviewer. hunziker1994 - the rate-yield trade-off, amplification falling as growth
    rate rises with an exponent of about minus 0.146, fitted in round 183; a rate agent buying growth by spending
    the pool is the documented failure mode. hallett2021 and chu2026 - PTH1R sits on the pre-hypertrophic cell in
    both mouse and human and NOT on the root progenitor, so the agonist retimes commitment rather than acting on
    the pool directly, which is consistent with a conserved total. jansen_metaphyseal_chondrodysplasia - constitutive
    human PTH1R activation delays hypertrophic exit and produces SEVERE SHORT STATURE, so the extreme of this axis
    loses height. winer2018 - hypoparathyroid children on PTH(1-34) at 0.75 micrograms per kilogram per day for
    up to 10 years, in whom the negative claim (no truncation of growth) was upgraded from D to C in round 192.
  what_is_missing: A bone age or skeletal maturation endpoint under any PTH1R agonist, in any species with a fusing
    plate, at any dose. Specifically - (a) serial bone age in the Winer paediatric hypoparathyroid cohorts on PTH(1-34),
    which is the only human population with years of exposure during growth and where the bone-age-to-chronological-age
    ratio would answer this directly if it was recorded; (b) growth plate histology or physeal width under a PTH1R
    agonist at ANY timepoint, which no study in the regulatory package or the literature reports; (c) any experiment
    in a fusing species - rabbit, sheep, pig or non-human primate with open plates - since the NDA 21-318 cynomolgus
    study deliberately selected skeletally mature animals with no open growth plates; (d) vertebral HEIGHT under
    a PTH1R agonist, since the only axial measurement anywhere is L6 vertebral cross-sectional area and CORR-189
    forbids reading height from it.
  nearest_evidence:
  - fda_forteo_pharmreview_2002
  - hunziker1994
  - hallett2021
  - chu2026
  - winer2018
  nearest_evidence_note: Two of these are the same document read twice - the interim table and the terminal table
    - and they point in opposite directions on the same animals. Everything else is mechanism or human replacement
    dosing. Nothing measures maturation.
  discriminating_experiment: 'The cheapest discriminating observation is retrospective and human: recover serial
    bone-age films or reports from the NIH hypoparathyroid paediatric PTH(1-34) cohorts and compute the ratio of
    bone age advance to chronological age advance against the calcitriol-treated comparator. If the ratio is at
    or below one, the acceleration is banked and the candidate survives; if it exceeds one, PTH1R agonism advances
    maturation and the interim gain is spent buying an earlier fusion. Failing that, the animal experiment is a
    fusing species - the rabbit distal femur fuses at about 20 to 24 weeks - dosed intermittently from mid-growth
    to fusion with weekly radiographic physeal width and a terminal bone length, which converts the rat question
    into one an animal can answer.'
  status: answered
  answer: 'ANSWERED NEGATIVELY IN ROUND 198 by weise2001, in a species that fuses. Juvenile ovariectomised rabbits,
    three growth plates, four timepoints: "epiphyseal fusion is triggered when the proliferative potential of growth
    plate chondrocytes is exhausted", with fusion occurring "when the rate of chondrocyte proliferation approached
    zero", and oestrogen accelerating programmed senescence rather than ossifying the plate directly. FUSION IS
    A FUEL GAUGE, NOT A CLOCK. An accelerated interval is therefore SPENT, not banked - it brings fusion forward
    by as much as it raises growth. This closes the question for teriparatide and, by the same argument, downgrades
    growth hormone, which round 183 showed buys its rate by consuming the resting pool five times faster while amplification
    falls to 0.77. The model also predicts the round-194 rat terminal table it was not fitted to: interim gains
    at 8 and 12 months and 35 mm in every arm at 26.'
  answered_round: 198
- gap_id: g_l12_no_vertebral_height_under_any_pth1r_agonist
  type: quantitative_gap
  layer: L12
  tractability: 4
  question: Does any PTH1R agonist change VERTEBRAL HEIGHT - as distinct from vertebral bone mass or vertebral cross-sectional
    area - in any species?
  why_it_matters: The case this atlas is built for has meaningful SPINE reserve as well as knee reserve, and about
    40 per cent of adult standing height is vertebral. Every PTH1R dataset in the file measures the spine, and every
    one of them measures the wrong thing. The FDA Pharmacology Review for NDA 21-318 tabulates L6 vertebral BMD,
    BMC and X-AREA per group - X-area rose 10.6 to 16 per cent in the young window and 4.2 to 11.5 per cent in the
    older one - and never vertebral height. jolette2017 and jolette2006 report lumbar spine BMC by DXA. vahle2002
    measured femoral length by calipers and no vertebral dimension. The clinical literature reports vertebral BMD
    and fracture. A cross-sectional area is orthogonal to height by construction and CORR-189 forbids reading one
    from the other, so the axial half of the target is completely unmeasured while appearing, superficially, to
    be the best-measured site in the whole package.
  what_is_known: fda_forteo_pharmreview_2002 - L6 vertebral BMD, BMC and cross-sectional area per dose per age window,
    with the largest percentage effects anywhere in the study (vertebral BMC plus 24 to 55 per cent young, plus
    31 to 56 per cent older). The vertebral response to PTH1R agonism is by far the strongest response of any site,
    which is why the missing dimension matters. The vertebral growth plate is a physis and the vertebral body grows
    by endochondral ossification at two endplates, so the mechanism is available in principle.
  what_is_missing: A vertebral body height measurement under any PTH1R agonist. The measurement is trivial - the
    sections already exist. The NDA 21-318 histopathology protocol states that a longitudinal section of a single
    lumbar vertebra including endplate and body was taken so that the entire length of a vertebra was evaluated,
    in every animal of every arm. Vertebral height was therefore SECTIONED and never measured, in the same way femoral
    length was measured and never reported by vahle2004. ROUND 197 REMOVES THE TECHNICAL EXCUSE. wezeman2003 measures
    L4 vertebral body height in growing Sprague-Dawley rats by dissection and caliper, superior to inferior cortical
    endplate, with standard deviations of 0.06 to 0.56 mm on a 6.5 to 8.2 mm bone - a coefficient of variation between
    0.8 and 7 per cent at n=5. The same paper shows the endpoint is nutritionally sensitive, with pair-fed controls
    5 to 6 per cent shorter than ad libitum, which is also the size of every length effect claimed for this drug
    class.
  nearest_evidence:
  - fda_forteo_pharmreview_2002
  - jolette2017
  - vahle2002
  - wezeman2003
  nearest_evidence_note: Three studies that measured the vertebra thoroughly and none that measured its height.
  discriminating_experiment: Vertebral body height on the existing archived longitudinal lumbar sections from Lilly
    R00100 and R00200, or from the Radius abaloparatide carcinogenicity study, read blind against arm. If archived
    blocks are unavailable, the same measurement prospectively in any growing rodent study already dosing a PTH1R
    agonist - it adds one caliper reading to a necropsy that is already happening.
  status: demoted_not_decision_relevant
  answer: DEMOTED IN ROUND 198, NOT MEASURED. The endpoint is still missing from every study in the field and wezeman2003
    shows it is a dissection and a caliper, so the omission remains a real defect in the literature. But it is no
    longer decision-relevant for THIS programme, for two reasons. First, round 197 established that the PTHrP-PTH1R
    axis is an inverted U with wild type at the top and the system saturated, and nothing about the vertebral physis
    exempts it - it is an endochondral plate running the same PTHrP/Ihh loop, so there is no mechanism by which
    an agonist that does nothing to appendicular length would act on vertebral height. Second, weise2001 established
    that fusion is triggered by exhaustion of proliferative potential, so even a vertebral rate effect would be
    spent rather than banked. The gap would become decision-relevant again only if the aromatase-inhibition hypothesis
    in g_l12_does_aromatase_inhibition_lower_growth_plate_pthrp_tone survives, because the vertebral plates fuse
    later than the long bones and would carry more remaining reserve at bone age 16 - which makes vertebral body
    height the RIGHT endpoint for that experiment rather than femoral length.
  answered_round: 198
- gap_id: g_l12_is_the_pth1r_length_gain_only_body_weight
  type: quantitative_gap
  layer: L12
  tractability: 4
  question: Is the femoral length increase seen under teriparatide in female rats a growth plate effect at all,
    or is it entirely the linear consequence of the concurrent body-weight gain?
  why_it_matters: This decides whether the drug has ANY longitudinal-growth pharmacology, and the answer currently
    available says probably not. Every femoral length increase in the complete NDA 21-318 package is female and
    every one co-occurs with a large body-weight increase; every intact-male arm across 8 to 100 micrograms per
    kilogram per day and 18 days to one year is null, and in the 26-week study the males LOST 3.8 per cent body
    weight while showing no length change. Tested against isometric allometry, where a 10 per cent heavier animal
    is about 3.2 per cent longer-boned, the 26-week female gains of 2, 3 and 4 per cent against weight gains of
    7, 10 and 10 per cent sit ON or slightly BELOW the reference line - there is no residual once body size is accounted
    for. The only arm that exceeds the line is the 2-year caliper measurement, which is also the arm whose femoral
    width rose 33 per cent and which the regulator itself reads as periosteal expansion. If the length effect is
    a body-weight readout then the entire femoral-length literature for this drug class measures appetite, and the
    human case, who is male, has nothing to gain from it.
  what_is_known: fda_forteo_pharmreview_2002 - the 26-week study reports femur length 1.02x, 1.03x, 1.04x in females
    with body weight +7/+10/+10 per cent, body weight gain 1.4 to 1.8-fold and efficiency of food utilisation 1.4
    to 1.7-fold, and states "Change not seen in males" where body weight fell. The reviewer records the sponsor
    invoking IGF-1 induction in females as the explanation. The 2-year study reports female body weight +4.5/+9.0/+10.4
    per cent alongside length up to 6 per cent by caliper. Study R00796/R04296 - one year in intact male F344 rats
    at 8 and 40 micrograms per kilogram - "did not alter linear bone growth in males". CG3-04 - 18 days in 4-week-old
    males at 16 and 80 - femur length the same in all groups.
  what_is_missing: 'Any arm in which body-weight trajectory is controlled. There is no pair-fed control anywhere
    in the package, no length measurement normalised to body mass, and no arm in which a male gained weight on drug.
    Also missing - the per-dose MALE femoral length values from the first carcinogenicity study, which exist in
    the sponsor tables and are described in the review only as "maximal at the low dose"; and the actual allometric
    exponent for femur length against body mass in F344 rats of these ages, which would replace the assumed one
    third. ROUND 197 SHARPENS THE SCALE OF THE PROBLEM: wezeman2003 shows caloric intake alone moves L4 vertebral
    body height by 6.4 per cent in male and 5.0 per cent in female growing rats, and every healthy-animal length
    positive under a PTH1R agonist is between 2 and 6 per cent. toromanoff1998, the lone healthy-animal femoral
    length positive, does not report body weight in its abstract and is not open access - its body-weight table
    is now the single most valuable unread number in the line.'
  nearest_evidence:
  - fda_forteo_pharmreview_2002
  - vahle2002
  - winer2010
  - wezeman2003
  - toromanoff1998
  nearest_evidence_note: Two regulatory readings of sponsor tables and one human randomised trial. The human trial
    reports height percentile and WEIGHT percentile side by side and neither moved, which is consistent with the
    body-size reading and does not distinguish it from no effect at all.
  discriminating_experiment: Dose intact male and female rats at matched exposure with a PAIR-FED vehicle arm, so
    the weight trajectory is equalised between drug and control. Measure femur length by microCT, plus growth plate
    height, cells per column and terminal hypertrophic cell height in the same animals. If the female length gain
    survives pair-feeding it is a plate effect and the hunziker1994 decomposition can be applied to it; if it disappears,
    the femoral-length literature for PTH1R agonists is a body-weight readout and the line closes.
  status: demoted_not_decision_relevant
  answer: 'DEMOTED IN ROUND 198, NOT RESOLVED. The single number that would resolve it - the body-weight table of
    toromanoff1998 - was hunted and is genuinely unobtainable: Bone 22:217-223, DOI 10.1016/s8756-3282(97)00271-8,
    Unpaywall reports no open version, there is no PMC record, Europe PMC full text 404s, and none of the twelve
    papers citing it quotes the body-weight result. The gap is demoted rather than left open because its answer
    no longer changes the decision. toromanoff1998 measured femoral length at FIFTEEN DAYS, an interim timepoint
    of exactly the kind that read positive at 8 and 12 months in the Lilly carcinogenicity study and then read 35
    mm in every arm at terminal. Under the fixed-reserve model established by weise2001, whether that 15-day gain
    is a genuine plate effect or a nutritional one, it is an acceleration and accelerations are spent rather than
    banked. The methodological defect stands; the decision does not turn on it.'
  answered_round: 198
- gap_id: g_l12_pth1r_expression_across_human_pubertal_stage
  type: quantitative_gap
  layer: L12
  tractability: 4
  question: How does PTH1R expression in the human growth plate change across pubertal stage and bone age, and is
    a late-pubertal plate BELOW or ABOVE the optimum of the PTHrP-PTH1R dose-response for bone length?
  why_it_matters: 'The whole candidate rests on there being a target. chu2026 places PTH1R in the pre-hypertrophic
    zone of the EARLY pubertal human growth plate. kindblom2002 measures the two LIGANDS of the same loop across
    Tanner stages and finds both fall significantly with maturation - correlation coefficients of 0.816 for Ihh
    and 0.911 for PTHrP, both negative, in 10 patients with Greulich-Pyle bone ages. Nobody has measured the RECEPTOR
    across that range. The two readings point opposite ways and the atlas cannot choose between them: low endogenous
    ligand tone at late puberty could mean an unoccupied receptor with headroom for an exogenous agonist, or it
    could mean the axis has been switched off along with the pre-hypertrophic population that carries the receptor.
    In a case at bone age 16 this is the difference between a target and no target. ROUND 197 PROMOTED THIS TO THE
    DECISIVE GAP FOR THE ENTIRE LINE. Bone length is now established as an INVERTED U in PTHrP-PTH1R tone: both
    genetic extremes shorten bone - Blomstrand, PTHrP null, chondrocyte PTH1R knockout, Zfp521 conditional knockout
    and human PTHLH haploinsufficiency at the low end; Jansen metaphyseal chondrodysplasia and Col2-driven PTHrP
    overexpression at the high end - and every exogenous agonist trial in a healthy animal returns no change, which
    places wild type at or near the maximum. An agonist can therefore only add length from BELOW the optimum, which
    is exactly where uraemia and achondroplasia sit and exactly where a healthy animal does not. kindblom2002 is
    the single reason the line is not closed: both ligands of the loop fall significantly with Tanner stage in human
    growth plate biopsies. If a plate at Tanner four to five has dropped below the optimum, the case subject is
    in the rescuable region and every null was measured in the wrong animal at the wrong point on its curve. If
    instead falling tone simply tracks a shrinking pre-hypertrophic population, the target is disappearing and the
    line closes. THE TWO READINGS PREDICT OPPOSITE SIGNS AND ONE IMMUNOSTAINING SERIES SEPARATES THEM.'
  what_is_known: chu2026 - PTH1R listed with ALPL as a pre-hypertrophic zone marker in early pubertal human growth
    plate biopsies, four donors, with a Fig 7A endocrine-receptor dotplot across clusters GP1 to GP5. kindblom2002
    - Ihh and PTHrP protein in early hypertrophic chondrocytes, falling with Tanner stage, with the RESTING ZONE,
    epiphyseal bone and metaphyseal bone EXPLICITLY EXCLUDED from the quantification. hallett2021 - the mouse counterpart,
    Pth1r enriched 3.0-fold in non-label-retaining cells while Pthlh is enriched 2.6-fold in the slow-cycling fraction.
  what_is_missing: 'PTH1R protein or transcript in human growth plate as a function of Tanner stage or bone age,
    at any n. Also missing - PTH1R in the human RESTING zone at any stage, since kindblom2002 excluded it by design
    and chu2026 reports a cluster assignment rather than a per-zone quantification. And the per-cluster PTH1R values
    behind chu2026 Fig 7A, which are in the figure source data rather than the text. ROUND 197 ESTABLISHED WHY,
    AND IT IS STRUCTURAL RATHER THAN AN OVERSIGHT. Every molecular dataset of the human growth plate in existence
    comes from ONE surgical route - percutaneous epiphysiodesis at Karolinska for constitutionally tall stature
    or leg-length discrepancy - and that operation is performed only while there is growth left to stop. chu2026:
    10 participants aged 11 to 14 years, Tanner B/G2 to B/G4, deposited as GSE288028. avijgan2026: patients aged
    12 years 2 months to 14 years 6 months, Tanner 2 to 4, per its Table 1. kindblom2002: 10 patients from epiphyseal
    surgery with Greulich-Pyle bone ages topping out around 14 years. THE TISSUE AT BONE AGE 16 HAS NEVER BEEN SAMPLED
    AND CANNOT BE OBTAINED BY THE ROUTE THAT PRODUCED ALL EXISTING SAMPLES. Re-analysing GSE288028 would therefore
    not answer the question even if run perfectly - it does not reach the stage in question.'
  nearest_evidence:
  - chu2026
  - kindblom2002
  - hallett2021
  - weir1996
  - correa2010
  nearest_evidence_note: One human transcriptomic snapshot at one stage, one human protein series of the ligands
    only, and one mouse sorted-population comparison. No human receptor series exists.
  discriminating_experiment: 'The Karolinska epiphysiodesis pipeline cannot reach bone age 16 and re-analysis of
    GSE288028 cannot either. Three routes remain. (1) ARCHIVED PATHOLOGY: PTH1R immunohistochemistry on banked paraffin
    blocks of late-adolescent physis from limb salvage, amputation, corrective osteotomy or post-mortem series,
    stained alongside the Tanner 2-4 epiphysiodesis blocks as the young comparator - this is the only route to the
    actual stage and it needs no new surgery. (2) PROXY: quantify PTH1R against a maturation marker WITHIN existing
    specimens, since plate maturation varies across the Tanner 2-4 range already sampled, and extrapolate with the
    extrapolation declared. (3) ANIMAL SURROGATE: PTH1R immunostaining across the closing physis of a fusing species
    - rabbit distal femur closes at about 20 to 24 weeks - to establish whether receptor density falls, holds or
    rises as a plate approaches fusion. A falling receptor curve closes the line; a flat or rising one makes the
    late case the RIGHT case rather than the wrong one.'
  status: answered_indirectly
  answer: 'ANSWERED INDIRECTLY IN ROUND 198, in the species where the ages are samplable. Round 197 showed the human
    question is unanswerable in human tissue because every existing specimen comes from epiphysiodesis at Tanner
    2 to 4 and the operation cannot reach bone age 16. van2000 characterised the rat growth plate at 1, 4, 7 and
    12 weeks in both sexes by RT-PCR, in situ hybridisation and immunohistochemistry: PTH1R mRNA and protein are
    present AT ALL AGES in prehypertrophic and hypertrophic chondrocytes with no sex difference. The receptor does
    not disappear as the plate matures. The component that fades is the faint stem-cell and proliferative-zone expression,
    which is described as a feature of the younger age groups. hirai2011 then shows the persisting receptor is LOAD-BEARING:
    tamoxifen-inducible cartilage-specific deletion AFTER birth causes accelerated differentiation, chondrocyte
    apoptosis and disappearance of the growth plate. So the answer to "is there a target left" is YES, and the answer
    to "would hitting it help" is still no, because round 197 established the axis is an inverted U with wild type
    at the top and the system saturated. WHAT REMAINS UNMEASURED IN HUMAN IS THE QUANTITATIVE LEVEL, NOT THE PRESENCE.'
  answered_round: 198
- gap_id: g_l12_does_aromatase_inhibition_lower_growth_plate_pthrp_tone
  type: quantitative_gap
  layer: L12
  tractability: 4
  question: Does aromatase inhibition lower PTHrP tone at the growth plate, and if so does it move the plate below
    the optimum of the inverted-U dose-response where a PTH1R agonist could add length?
  why_it_matters: 'This is the only route by which the PTH1R line remains alive after round 198, and it exists only
    because of the specific stack in question. Round 197 established that bone length is an inverted U in PTHrP-PTH1R
    tone with wild type at or near the maximum, which is why every agonist trial in a healthy animal is null - there
    is no headroom. chou2025 now shows that oestrogen acting through the membrane receptor GPER-1 SUSTAINS growth
    plate PTHrP tone: the agonist G1 thickened the proliferative zone, raised proliferation, shrank the hypertrophic
    zone and type X collagen area and RAISED the PTHrP/Ihh ratio at four and eight weeks, while GPER-1 blockade
    or chondrocyte-specific deletion lowered PTHrP/Ihh and expanded the hypertrophic zone. Anastrozole removes oestrogen.
    If it therefore lowers growth plate PTHrP tone, the stack would be manufacturing the one state in which a PTH1R
    agonist has ever added length - a plate below the optimum, which is where uraemia and achondroplasia sit. THE
    COUNTERWEIGHT IS THAT THE DEFICIT WOULD BE A RATE DEFICIT, and weise2001 has just established that fusion is
    triggered by exhaustion of proliferative potential rather than by elapsed time, so restoring proliferation spends
    reserve rather than adding height. The gap is therefore not only about whether tone falls, but about whether
    restoring it costs reserve.'
  what_is_known: 'chou2025 - GPER-1 agonist, antagonist and Col2a1-Cre conditional knockout arms in C57BL/6 mice
    at four and eight weeks, both sexes, 48 animals, with micromass culture confirmation: GPER-1 sustains the PTHrP/Ihh
    ratio and the proliferative zone. weise2001 - oestrogen accelerates growth plate senescence and brings forward
    proliferative exhaustion and fusion; it does not ossify the plate directly. kindblom2002 - both Ihh and PTHrP
    protein fall significantly with advancing Tanner stage in human growth plate biopsies. van2000 - PTH1R itself
    persists at every postnatal age in rat prehypertrophic and hypertrophic chondrocytes. hirai2011 - postnatal
    PTH1R signalling is load-bearing. The clinical fact that aromatase inhibitors raise predicted adult height in
    boys is established elsewhere in this atlas and is attributed to delayed senescence.'
  what_is_missing: Any measurement of growth plate PTHrP, Ihh or the PTHrP/Ihh ratio under an aromatase inhibitor,
    in any species, at any age. Also missing - whether the GPER-1 arm and the senescence arm of oestrogen action
    can be separated pharmacologically, since an aromatase inhibitor removes both; and whether adding a PTH1R agonist
    on top of aromatase inhibition restores proliferation at the cost of reserve, which is the specific failure
    mode the fixed-reserve model predicts.
  nearest_evidence:
  - chou2025
  - weise2001
  - kindblom2002
  - van2000
  - hirai2011
  nearest_evidence_note: One mouse study establishing the oestrogen-to-PTHrP link, one rabbit study establishing
    that the currency is reserve rather than rate, and a human ligand-versus-Tanner curve. No study has combined
    an aromatase inhibitor with a growth plate PTHrP readout.
  discriminating_experiment: 'Dose growing male mice or rats with an aromatase inhibitor, with and without an intermittent
    PTH1R agonist, in a four-arm design, and measure at the plate: PTHrP and Ihh transcript and protein by zone,
    proliferative zone height, BrdU or EdU labelling index, terminal hypertrophic cell height, cells per column,
    and resting-zone cell layers - the Hunziker five plus the ligand ratio. Follow a parallel cohort to natural
    fusion in a fusing species and measure FINAL bone length. Three outcomes discriminate. Aromatase inhibition
    lowers PTHrP tone and the agonist restores proliferation AND final length - the stack manufactures its own indication
    and the line reopens. Aromatase inhibition lowers PTHrP tone, the agonist restores proliferation but final length
    is unchanged or reduced - the agonist is spending reserve the inhibitor was preserving, and it must be kept
    out of the stack. Aromatase inhibition does not lower growth plate PTHrP tone - the hypothesis dies and the
    PTH1R line closes completely.'
- gap_id: g_l2_p16_cellular_senescence_in_the_growth_plate
  type: search_established
  layer: L2
  tractability: 5
  question: Do growth plate resting-zone chondrocytes accumulate p16-positive cellular senescent cells as the plate
    approaches exhaustion, and does clearing them with a senolytic restore proliferative output or final bone length?
  why_it_matters: This atlas has used the word senescence for two different things and never noticed. One is the
    Baron-Nilsson PROGRAMMED senescence - a coordinated downregulation of hundreds of growth-promoting genes across
    kidney, lung, liver and heart as well as the plate, driven by growth output rather than time. The other is p16-positive
    CELLULAR senescence with a senescence-associated secretory phenotype, which is a distinct cell state and the
    target of an entire drug class. Round 198 established that fusion is triggered by exhaustion of proliferative
    potential, which makes cells that have irreversibly stopped dividing the exact currency of the problem. Senolytics
    - dasatinib plus quercetin, fisetin, navitoclax, UBX compounds - exist precisely to remove such cells from a
    tissue that needs divisions. If a fraction of the resting-zone pool at bone age 16 is p16-positive rather than
    quiescent, that fraction is recoverable budget rather than spent budget, and the distinction is the difference
    between a fixed ceiling and a raisable one.
  what_is_known: weise2001 - the untreated plate declines in proliferation rate, plate height, proliferative and
    hypertrophic cell number, terminal cell size and column density together, and fuses when proliferation approaches
    zero. nilsson2005 - resting-zone methylation falls with age in a way specific to slow replication inside the
    niche, and does not fall during rapid replication of the same cells in culture, which is at least consistent
    with a reversible state rather than an executed programme. The atlas holds replicative_senescence_chondrocyte
    and growth_plate_senescence as separate nodes without distinguishing p16-positive cellular senescence from the
    programmed gene programme.
  what_is_missing: Any measurement of p16INK4a, p21, SA-beta-galactosidase or a SASP signature in growth plate resting-zone
    chondrocytes as a function of age or proximity to fusion, in any species. And any administration of any senolytic
    to a growing animal with a bone length endpoint. A two-query Europe PMC sweep returning 120 records found the
    entire senolytic-in-cartilage literature to be osteoarthritis and articular.
  nearest_evidence:
  - weise2001
  - ba2025
  nearest_evidence_note: No direct evidence exists in either direction. The nearest is the whole-tissue senescence
    phenotype of weise2001 and, from the opposite end, the antler transcriptional programme that ba2025 describes
    as having intrinsically low tumorigenic potential tied to apoptotic regulation - a pool that proliferates enormously
    without accumulating the state.
  discriminating_experiment: Stain rabbit or rat proximal tibial growth plates across the senescence series - the
    weise2001 design already produces them - for p16INK4a, p21 and SA-beta-galactosidase by zone, and correlate
    the resting-zone positive fraction with remaining growth. Then dose a growing animal with a senolytic through
    to natural fusion in a fusing species and measure FINAL bone length, not velocity. A rising p16-positive fraction
    that senolytic clearance reduces WITH a final-length gain reopens the ceiling. A flat fraction, or clearance
    without length, closes it and confirms that the atlas should stop using one word for two states.
- gap_id: g_l2_can_targeted_nanoparticles_deliver_a_pool_pulse
  type: quantitative_gap
  layer: L2
  tractability: 4
  question: Now that cartilage-selective delivery into the avascular growth plate exists, does a TRANSIENT, LOCAL
    Hedgehog pulse delivered by targeted nanoparticle expand the resting-zone pool and raise FINAL bone length in
    a wild-type fusing animal - and does the pool it adds stay chondrocytic?
  why_it_matters: 'Round 179 identified the Hedgehog lever as having an apparent time-dependent sign - trompet2024
    gave a local transient intra-articular SAG bead and got plus 3.63 per cent femur in 8 of 8 animals at P equals
    0.00004, while orikasa2024 deleted Ptch1 permanently in the same cell type and got clonally expanded pool that
    MIGRATED OUT of the plate and became trabecular osteoblasts with no length change. The distinction the atlas
    drew was duration and reversibility, and it could not be tested because there was no way to deliver a controlled
    transient pulse to growth plate cartilage. ye2026 published one: chondrocyte-membrane-coated nanoparticles with
    a collagen-II-binding peptide, delivering the Hedgehog agonist purmorphamine into the plate in vivo with a bone
    and body length gain. This is simultaneously the test of the time-dependent sign and the enabling technology
    for the round-178 charge-discharge escape, which required lowering resting-zone IGF availability while maintaining
    it systemically.'
  what_is_known: trompet2024 - local transient SAG, plus 3.63 per cent femur and plus 1.65 per cent whole leg in
    rat, the only pool intervention in this atlas with a length endpoint. orikasa2024 - permanent Ptch1 deletion
    in PTHrP-positive resting chondrocytes, hyperplastic plate, patched roses, then fate leak to diaphyseal trabecular
    osteoblasts and NO length change. ye2026 - CT-CM-NPs deliver purmorphamine into growth plate cartilage in vivo
    in a hypochondroplasia mouse, upregulating Hedgehog, restoring ciliogenesis and increasing bone and body length.
    harboe2024 and oichi2023 supply the IGF half of the charge-discharge problem that the same delivery platform
    could address.
  what_is_missing: Any use of targeted delivery in a WILD-TYPE animal rather than a disease model; any FINAL bone
    length endpoint rather than an interim one, which round 198 made mandatory; any dose-and-duration series establishing
    where the Hedgehog sign flips; and any fate tracing of the added pool to check it stays chondrocytic rather
    than leaking to osteoblast as it did in orikasa2024.
  nearest_evidence:
  - ye2026
  - trompet2024
  - weise2001
  nearest_evidence_note: One delivery paper in a disease model, one pool intervention with an interim length endpoint,
    and the reserve model that makes final length the only endpoint that counts.
  discriminating_experiment: 'In wild-type growing animals of a FUSING species, dose CT-CM-NP-purmorphamine in a
    pulse-duration series - single pulse, weekly, and continuous - with a vehicle-nanoparticle arm to control for
    the carrier. Measure at interim: resting-zone cell layers, cells per column, terminal hypertrophic cell height
    and calcein elongation rate, the Hunziker five. Then follow a parallel cohort to natural fusion and measure
    FINAL bone length. Lineage-trace the expanded pool. THREE OUTCOMES DISCRIMINATE. Pulse raises final length and
    the pool stays chondrocytic - the time-dependent sign is real, route 8 is open and the delivery platform is
    the tool. Pulse raises interim growth and final length is unchanged - the pool was spent, and this is another
    rate agent. Pulse expands the pool and the descendants become osteoblasts as in orikasa2024 - the fate leak
    dominates and the Hedgehog lever is dead regardless of schedule.'
- gap_id: g_l12_does_a_cnp_agent_change_terminal_cell_height_or_matrix
  question: Under a CNP-axis agent, does the hypertrophic zone get taller because the cells are taller, because
    there are more of them, or because there is more extracellular matrix between them?
  type: quantitative_gap
  layer: L12
  tractability: 3
  why_it_matters: VOSORITIDE IS IN THE STACK AND ITS TERM ASSIGNMENT DOES NOT EXIST. Under the round-198 objective
    function, adult height = reserve x terminal cell height, the three candidate answers have completely different
    values. TALLER CELLS is the free axis - length with no division spent, and the highest-value outcome available
    to any agent. MORE CELLS spends reserve and makes vosoritide a second growth hormone. MORE MATRIX may be
    neither, and may not even be durable length. Round 203 established by exhaustive full-text search that NOBODY
    HAS MEASURED A CELL under any CNP-axis agent in any species, and CORR-197 established that the zone-height
    evidence cannot be decomposed because the CNP axis moves the matrix term as well. So the atlas has been
    carrying vosoritide on an unassigned term while scoring the stack on exactly that term.
  what_is_known: nakao2015, mouse - cartilage-specific Nppc or Npr2 deletion drops the hypertrophic LAYER to
    34.6 and 23.0 per cent of control against the non-hypertrophic layer at 76.7 and 71.1 per cent; TUNEL shows
    almost no difference in apoptosis, so clearance is excluded; BrdU is significantly lower in the Npr2 knockout
    and only trends lower in the Nppc knockout; AND THE EXTRACELLULAR SPACES OF THE NON-HYPERTROPHIC LAYER ARE
    GREATLY DECREASED IN BOTH. hirota2018, rat - CNP-53 by infusion raises skeletal growth dose-dependently
    in WILD-TYPE as well as CNP-knockout animals, measured as growth plate thickness at nine femoral and five
    tibial and calcaneal sites plus hypertrophic and non-hypertrophic zone thickness; no cell dimension anywhere
    in the full text. agoston2007, mouse organ culture - CNP acts largely by expanding the hypertrophic zone,
    again a zone. weber2025, mouse - the ONLY cell-level measurement on the pathway, maximum hypertrophic cell
    height in the axis of elongation about 20 per cent greater, but under NPR3 LOSS, which is the clearance
    arm rather than NPR2 agonism and which the atlas separately records as bifunctional.
  what_is_missing: Terminal hypertrophic cell height, measured AXIALLY and reported SEPARATELY from the zone,
    under a CNP-axis agonist, in any species. Also missing and required for the decomposition to close - cells
    per column by zone in the same animals, and an explicit matrix measurement (proteoglycan content or extracellular
    volume fraction) since CORR-197 makes matrix a third term the CNP axis is known to move. And missing specifically
    for this stack - any such measurement under VOSORITIDE rather than under native CNP or a genetic lesion.
  nearest_evidence:
  - nakao2015
  - hirota2018
  - agoston2007
  - weber2025
  - hunziker1994
  nearest_evidence_note: hirota2018 is the closest usable platform because it is a dosed pharmacological agent
    in wild-type animals with histology already collected - the sections needed to answer this may physically
    exist. hunziker1994 is the method entry, the worked example of the full decomposition. weber2025 shows the
    cell measurement being done correctly, on the wrong arm of the pathway.
  discriminating_experiment: 'Growing wild-type animals, vehicle against a CNP-axis agonist at two or more doses,
    reading the Hunziker five in the same animals - calcein elongation rate, TERMINAL HYPERTROPHIC CELL HEIGHT
    measured axially, cells per column by zone, resting-zone cycle time by continuous label - PLUS an explicit
    matrix readout, because CORR-197 makes matrix a third term. Four outcomes discriminate. CELL HEIGHT UP with
    cells per column flat: vosoritide is an h_term agent, the free axis, and it should be dosed to the top of
    the linear range jeong2026 describes. CELLS PER COLUMN UP with cell height flat: it is a second growth hormone
    and spends reserve, and stacking it with GH is paying twice for one mechanism. MATRIX UP with both flat:
    the zone-height literature has been measuring swelling and the agent may not add durable length at all.
    ANY MIXTURE: the decomposition gives the weights, which is what the stack needs. THE CHEAP PARTIAL VERSION
    NEEDS NO NEW ANIMALS - re-measure terminal cell height and cells per column on the existing hirota2018 or
    nakao2015 histology, which converts a published zone height into the two cell terms.'
- gap_id: g_l12_why_does_the_cnp_axis_lengthen_limb_but_not_spine_in_primates
  question: Why did vosoritide lengthen the tibia and humerus but produce no significant change in L1-L4 vertebral
    length or skull dimensions in skeletally normal juvenile primates, when the human trials show an unchanged
    upper-to-lower segment ratio?
  type: contradiction
  layer: L12
  tractability: 3
  why_it_matters: 'THE OPEN-SITE REGISTER MAKES THIS A FIRST-ORDER QUESTION RATHER THAN A CURIOSITY. At bone
    age 16 the knee, the spine, the hip and the cranial base can all still be contributing, and CORR-195 forbids
    scoring an agent against one site. Round 203 read cnpmeta2026 - upper-to-lower segment ratio unchanged,
    MD -0.02, I-squared 0 across 4 randomised trials - as proportionate growth and called it the favourable
    answer for a multi-site case. The FDA review of the 26-week juvenile NHP study states the opposite in a
    skeletally NORMAL animal: tibia +7 per cent and humerus +6 per cent with significance in high-dose males,
    femur +3 per cent not significant, and NO SIGNIFICANT EFFECT on L1-L4 length or on the foramen magnum or
    skull. IF THE AXIAL SKELETON DOES NOT RESPOND, a large part of the remaining reserve at a late bone age
    is unreachable by this agent, and the stack needs a second agent for the axial sites rather than a higher
    dose of this one.'
  what_is_known: fda_voxzogo_multidiscipline_review_2021, Table 55 and accompanying text, 26-week juvenile NHP
    - the appendicular gains and the explicit axial null, plus a stated sex split ("in females, minimal increases
    in bone lengths were evident") with the high-dose female femur NEGATIVE. cnpmeta2026, human - segment ratio
    unchanged across 4 RCTs in ACHONDROPLASIA, where the vertebrae are themselves FGFR3-affected and therefore
    have room to respond that a normal vertebra may not. rua2025 - sitting height SDS gaining MORE than arm
    span in one 27-child cohort, which points the other way again. weber2025, mouse - Npr3 loss DISPROPORTIONATELY
    elongates tail vertebrae, so the axial skeleton is CNP-responsive in at least one species. lauffer2022,
    human - biallelic NPR3 loss gives a PROPORTIONATE gain with a normal sitting-height ratio.
  what_is_missing: Any segment-resolved measurement under a CNP-axis agonist in a SKELETALLY NORMAL large animal
    with adequate power on the axial endpoint. Also missing - whether vertebral growth cartilage expresses NPR2
    at the same level as appendicular growth plate in primates or humans, which would be the simplest explanation
    and has never been measured side by side; and whether the discrepancy is dose, since the human trials run
    at a fraction of the primate high dose.
  nearest_evidence:
  - fda_voxzogo_multidiscipline_review_2021
  - cnpmeta2026
  - rua2025
  - weber2025
  - lauffer2022
  nearest_evidence_note: The primate study is the only skeletally-normal segment-resolved dataset and its axial
    arm is a null in a small group. Every human dataset is achondroplasia. weber2025 shows the axial skeleton
    CAN respond to this axis in mouse, which makes a receptor-expression explanation testable.
  discriminating_experiment: TWO CHEAP STEPS BEFORE ANY NEW ANIMAL. (1) NPR2 and NPR3 expression in VERTEBRAL
    growth cartilage against appendicular growth plate in the same individuals - avijgan2026 and chu2026 hold
    human growth plate material, and any veterinary or archived primate spine would serve. If vertebral NPR2
    is low, the null is a receptor-density result and the axis is structurally limb-biased. (2) Re-analyse the
    existing vosoritide trial imaging for SITTING HEIGHT and SUBISCHIAL LEG LENGTH as absolute segments rather
    than as a ratio - a ratio can stay flat while both segments move, or while neither does. THE DEFINITIVE
    VERSION is a segment-resolved study in skeletally normal growing primates powered on the axial endpoint,
    which is exactly the arm the registration package under-powered.
- gap_id: g_l12_can_resveratrol_or_a_bioavailable_analogue_reach_the_plate_in_humans
  question: Can resveratrol, or a bioavailable analogue, reach growth plate cartilage in humans at a concentration
    in the narrow stimulatory window, and does the four-term rabbit profile survive there?
  type: known_unknown
  layer: L12
  tractability: 2
  why_it_matters: karimian2013 IS THE ONLY COMPOUND IN THIS FILE MEASURED ON ALL FOUR TERMS SEPARATELY AND IT
    MOVES ALL FOUR IN THE RIGHT DIRECTION. Resting zone area up, hypertrophic cells per column up, terminal
    hypertrophic cell SIZE up, proliferative cells per column and proliferative zone height UNCHANGED, growth
    plate 284 against 133 micrometres, fusion DELAYED at the distal tibia, distal femur and proximal tibia,
    tibial AND VERTEBRAL growth raised, and FINAL LENGTH improved over sixteen weeks. Under the round-198 objective
    function that is pool plus amplification plus h_term plus duration, at multiple sites, with a length endpoint
    - a profile no other agent here comes near. The named mechanism, SUPPRESSED CHONDROCYTE VEGF AND LAMININ,
    connects directly to the atlas vascular thread, because vascular invasion of a plate is what fusion is.
    IT SITS AT GRADE D IN A NODE CALLED "THE UNTOUCHED COMPOUND" AND THE REASON IS DELIVERY, NOT BIOLOGY - which
    makes it a solvable problem of the kind this atlas has solved before.
  what_is_known: 'karimian2013, rabbit - the full decomposition above, at oral 200 mg/kg/day. AND A BIPHASIC
    IN VITRO DOSE-RESPONSE THAT IS THE CENTRAL DIFFICULTY: in cultured fetal rat metatarsals growth was STIMULATED
    at the low concentration and INHIBITED at the two highest, so the therapeutic window is narrow and two-sided.
    Human resveratrol pharmacology is dominated by extensive first-pass glucuronidation and sulfation giving
    very low free plasma concentrations, which is why the compound has repeatedly failed to reproduce animal
    effects in people. The plate is additionally avascular and diffusion-fed, which ye2026 names as the reason
    drugs do not reach it.'
  what_is_missing: Any measurement of resveratrol or its metabolites IN GROWTH PLATE CARTILAGE, in any species,
    at any dose. Also missing - whether the active species is the parent or a metabolite; whether the stimulatory
    window in the metatarsal assay corresponds to any achievable free concentration in human cartilage; whether
    the effect is SIRT1-dependent or oestrogen-receptor-mediated, since resveratrol is a phytoestrogen and the
    comparator arm in karimian2013 was oestradiol, which did NOT reproduce the cell-size effect; and whether
    any of the better-absorbed analogues (for example pterostilbene) retains the growth plate profile.
  nearest_evidence:
  - karimian2013
  - ye2026
  - machnicki2022
  nearest_evidence_note: karimian2013 carries the whole case and no pharmacokinetics in cartilage. ye2026 is
    listed because it states the delivery barrier the compound would have to cross. There is no second growth
    plate resveratrol study in this file.
  discriminating_experiment: ORDER MATTERS BECAUSE THE CHEAP STEP CAN KILL IT. (1) MEASURE THE TARGET CONCENTRATION
    FIRST - dose growing rabbits or rats orally as karimian2013 did and assay parent resveratrol and its glucuronide
    and sulfate IN GROWTH PLATE CARTILAGE, not plasma. If cartilage free concentration at an effective oral
    dose is already above the inhibitory arm of the biphasic curve, or unmeasurably below the stimulatory arm,
    the human route is closed and the line ends there. (2) IF THE WINDOW IS REACHABLE, repeat karimian2013 in
    an INTACT non-ovariectomised growing animal with the full Hunziker readout and a final length endpoint,
    because the published result is in an ovariectomised model where the oestrogen arm is absent and this stack
    deliberately suppresses oestrogen too. (3) Only then screen better-absorbed analogues against the metatarsal
    assay for the same biphasic window.
- gap_id: g_l12_does_growth_plate_cartilage_deconjugate_polyphenol_glucuronides
  question: Does growth plate cartilage - and specifically the resting zone - carry beta-glucuronidase activity
    sufficient to convert circulating polyphenol glucuronides to the active aglycone in situ?
  type: known_unknown
  layer: L12
  tractability: 1
  why_it_matters: 'THIS IS THE CHEAPEST HIGH-VALUE EXPERIMENT CURRENTLY IDENTIFIED IN THIS ATLAS AND IT DECIDES
    WHETHER THE ONLY FOUR-TERM COMPOUND IN THE FILE IS DELIVERABLE. karimian2013 is the single compound measured
    on pool, amplification, terminal cell height and duration separately, all favourable, at multiple sites,
    with a final length endpoint. The stated barrier has always been that resveratrol is glucuronidated on first
    pass so free plasma levels are trivial. kunihiro2020 inverts that for BONE: the glucuronide is the transport
    form, bone GUSB deconjugates it in situ, most of what reaches bone is deconjugated, and the authors confirm
    GUSB deconjugates RESVERATROL glucuronide specifically. IF CARTILAGE DOES THE SAME, ORAL DOSING IS A VIABLE
    ROUTE AND THE COMPOUND RE-ENTERS THE STACK. IF IT DOES NOT, only local delivery remains and the programme
    should stop citing plasma pharmacokinetics as the reason either way. THE PRIOR IS BETTER THAN IT LOOKS:
    GUSB is a LYSOSOMAL enzyme, and avijgan2026 reports by transmission electron microscopy that human RESTING
    ZONE chondrocytes contain MORE LYSOSOMES than proliferative zone chondrocytes - so the compartment holding
    the reserve is the one most likely to carry the enzyme. Those two papers are in different literatures and
    do not cite each other.'
  what_is_known: kunihiro2020, mouse - bone deconjugates curcumin glucuronide to the aglycone in situ via high
    GUSB content, most of the glucuronide reaching bone is deconjugated, substrate is >2-fold higher in immature
    4-6 week animals, and GUSB also deconjugates resveratrol and quercetin glucuronides by bone with the aglycones
    required for bioactivity; in ovariectomised mice GUSB fell 24 per cent yet aglycone still tracked substrate,
    so substrate delivery is rate-limiting rather than enzyme capacity. avijgan2026, human - resting zone chondrocytes
    contain more lysosomes than proliferative zone chondrocytes by TEM. karimian2013, rabbit - oral resveratrol
    200 mg/kg/day produced the full four-term growth plate response, which is itself indirect evidence that
    SOMETHING active reached the plate after an oral dose. NOTHING measures GUSB or any polyphenol species in
    growth plate cartilage.
  what_is_missing: GUSB enzyme activity in growth plate cartilage, by zone, in any species - the single missing
    measurement. Also missing - resveratrol parent, glucuronide and sulfate concentrations IN GROWTH PLATE CARTILAGE
    after an oral dose; whether the chondro-osseous junction, which does have osteoclasts, supplies aglycone
    to the adjacent hypertrophic zone by diffusion; and whether the karimian2013 effect is abolished by a GUSB
    inhibitor, which would tie the mechanism down in one experiment.
  nearest_evidence:
  - kunihiro2020
  - avijgan2026
  - karimian2013
  nearest_evidence_note: kunihiro2020 supplies the mechanism in the wrong tissue; avijgan2026 supplies the reason
    to think the right tissue has it; karimian2013 supplies the phenotype that would need explaining if it does
    not. No paper joins them.
  discriminating_experiment: 'THREE STEPS, THE FIRST OF WHICH COSTS ALMOST NOTHING. (1) GUSB ACTIVITY AND IMMUNOSTAINING
    BY ZONE on archived growth plate sections - rodent, and human if the Karolinska material can be used. A
    fluorogenic 4-methylumbelliferyl-beta-D-glucuronide assay on microdissected zones gives the answer directly,
    and avijgan2026 predicts the resting zone will be highest. (2) DOSE AND MEASURE: give growing rats oral
    resveratrol at the karimian2013 dose and assay parent, glucuronide and sulfate in MICRODISSECTED GROWTH
    PLATE by LC-MS/MS, against plasma. This is the measurement round 205 asked for and it now has a specific
    hypothesis attached. (3) CAUSAL TEST: repeat the karimian2013 growth endpoint with and without a GUSB inhibitor
    such as saccharolactone. If the growth effect disappears, the aglycone-in-situ mechanism is established
    and the oral route is validated for the whole polyphenol class; if it survives, the active species is something
    else and the delivery question must be re-asked from scratch.'
- gap_id: g_l12_does_an_intra_articular_nanoparticle_reach_the_growth_plate
  question: Does an intra-articularly injected nanoparticle reach the growth plate, which sits behind the secondary
    ossification centre, or only the articular cartilage and synovium?
  type: known_unknown
  layer: L12
  tractability: 2
  why_it_matters: LOCAL DELIVERY IS THE ROUTE THAT HAS ACTUALLY WORKED IN THIS ATLAS AND NOBODY HAS ESTABLISHED
    ITS REACH. trompet2024 is the only length-endpoint proof in the stem cell arm and it was obtained by SURGICALLY
    IMPLANTING beads into the secondary ossification centre; its intra-articular INJECTIONS expanded the resting
    pool but did not move proliferation, and round 205 showed its cell-height effect was transient. wei2024
    now supplies a built, characterised cationic 50 nm PLGA particle with 35-day joint persistence and confirmed
    chondrocyte uptake - but in ARTICULAR cartilage. If that particle reaches the growth plate, several agents
    this atlas has parked for delivery reasons become testable at once, including resveratrol and any hedgehog
    agonist whose systemic use is unattractive. If it does not, local delivery means surgery and the whole local
    route is far less usable than round 204 and 205 implied.
  what_is_known: 'wei2024, rat - 50.40 nm PLGA particle, zeta +12.57 mV, 35-day quantifiable resveratrol in
    joint tissue including knee cartilage after a single intra-articular injection, chondrocyte internalisation
    confirmed, systemic redistribution markedly decreased. trompet2024, rat and mouse - SOC bead gave length;
    intra-articular injection gave pool expansion without a proliferation change. ye2026 - the growth plate
    is avascular and alymphatic, which is why systemic agents struggle to reach it. Round 199 logged cartilage-targeting
    nanoparticle technology as an unworked route. THE ANATOMY IS THE PROBLEM: in a skeletally immature joint
    the secondary ossification centre is bone and lies between the joint space and the growth plate.'
  what_is_missing: A biodistribution study of an intra-articular nanoparticle with the GROWTH PLATE as a named
    compartment. Every existing study reports synovium, articular cartilage, and sometimes subchondral bone.
    Also missing - whether the perichondrial ring or the groove of Ranvier offers a lateral route that bypasses
    the SOC, and whether particle charge and size can be tuned for the far denser matrix of the growth plate
    as opposed to articular cartilage.
  nearest_evidence:
  - wei2024
  - trompet2024
  - ye2026
  nearest_evidence_note: wei2024 is the particle and stops at articular cartilage. trompet2024 shows the SOC
    route works but by surgery. Nothing measures growth plate delivery from a joint injection.
  discriminating_experiment: 'DIRECT AND ALREADY WITHIN REACH OF THE wei2024 PROTOCOL. Inject FITC- or near-infrared-labelled
    cationic PLGA nanoparticles into the knee of GROWING rats and image or microdissect at 1, 7 and 28 days,
    reporting fluorescence or LC-MS/MS drug content SEPARATELY for articular cartilage, secondary ossification
    centre, RESTING ZONE, proliferative zone and hypertrophic zone. Include a perichondrial-ring region of interest,
    because if the particle arrives laterally rather than through the SOC that changes the injection target.
    Three outcomes: growth plate signal comparable to articular cartilage means the route is open and the parked
    agents become testable; signal confined to the SOC boundary means dose or particle design is the lever;
    no signal past the SOC means local delivery requires surgical placement and should be costed that way.'
- gap_id: g_l12_does_fgfr_inhibition_change_chondrocyte_lysosomal_enzyme_handling
  question: Does pharmacological FGFR inhibition alter lysosomal enzyme trafficking and secretion in growth
    plate chondrocytes, and if so does it raise or lower the extracellular capacity to activate glucuronidated
    or otherwise lysosomally-processed agents?
  type: known_unknown
  layer: L12
  tractability: 2
  why_it_matters: ERDAFITINIB IS IN THIS STACK AND THIS IS AN INTERACTION NEITHER LITERATURE HAS LOOKED FOR.
    cinque2025 shows FGF signalling controls lysosome biogenesis in chondrocytes through the mannose-6-phosphate
    receptor pathway via TFEB and TFE3 - cells lacking FGFR3 and FGFR4 dysregulate the M6P pathway with HYPERSECRETION
    of lysosomal enzymes and impaired lysosomal function. GUSB, the enzyme kunihiro2019 shows activates polyphenol
    glucuronides, is a lysosomal hydrolase trafficked by exactly that pathway. THE DIRECTION IS GENUINELY UNDETERMINED
    AND BOTH ANSWERS MATTER. Hypersecretion would push MORE enzyme into the extracellular matrix, which is where
    a circulating glucuronide actually arrives, and would make FGFR inhibition ENHANCE polyphenol activation
    in cartilage. Impaired lysosomal function would do the opposite. Beyond polyphenols, the same pathway governs
    cartilage catabolism generally, so an FGFR inhibitor may be changing matrix turnover in a way the atlas
    has never costed - and matrix is the third term CORR-197 added to every zone height.
  what_is_known: cinque2025, Swarm rat chondrosarcoma cells - FGFR3 and FGFR4 double-deficient cells show dysregulated
    M6P pathway, hypersecretion of lysosomal enzymes and impaired lysosomal function; FGF receptors control
    M6P receptor gene expression in response to FGF stimulation and during cell cycle via TFEB and TFE3; restoring
    the M6P pathway by gene expression or TFEB activation rescues the defect. kunihiro2019, mouse - GUSB is
    the deconjugating enzyme, expressed by hematopoietic marrow cells, and its inhibition by saccharolactone
    or genetic reduction abolishes aglycone formation. avijgan2026, human - resting zone chondrocytes contain
    more lysosomes than proliferative zone chondrocytes by transmission electron microscopy. NOTHING connects
    FGFR inhibition to cartilage GUSB in any species, and no pharmacological FGFR inhibitor has been tested
    on this pathway at all.
  what_is_missing: Any measurement of lysosomal enzyme content, secretion or activity in growth plate chondrocytes
    under a PHARMACOLOGICAL FGFR inhibitor rather than a genetic double knockout, and in primary chondrocytes
    rather than a chondrosarcoma line. Specifically missing - GUSB activity intracellular against secreted under
    erdafitinib or infigratinib; whether the effect differs by zone, since the resting zone is the lysosome-rich
    compartment; and whether FGFR inhibition changes cartilage matrix turnover enough to matter for the CORR-197
    matrix term in any zone-height reading.
  nearest_evidence:
  - cinque2025
  - kunihiro2019
  - avijgan2026
  nearest_evidence_note: cinque2025 is the only paper linking FGF to chondrocyte lysosome biogenesis and it
    uses a genetic double knockout in a tumour line. kunihiro2019 supplies the enzyme and its controls in the
    wrong tissue. avijgan2026 supplies the zone distribution of lysosomes in the right tissue with no enzyme
    measurement.
  discriminating_experiment: ONE EXPERIMENT ANSWERS BOTH HALVES AND IT IS A CELL-CULTURE STUDY. Treat primary
    growth plate chondrocytes, and the postnatal ex vivo tibia preparation of abubakar2019, with erdafitinib
    across a dose range, and measure GUSB activity by fluorogenic 4-methylumbelliferyl-beta-D-glucuronide assay
    SEPARATELY in the cell lysate and in the conditioned medium, alongside TFEB and TFE3 nuclear translocation
    and M6P receptor expression. Three outcomes. Secreted GUSB UP with intracellular DOWN reproduces cinque2025
    and predicts that FGFR inhibition ENHANCES extracellular activation of a glucuronidated agent, which would
    make erdafitinib and a polyphenol synergistic at the delivery step rather than antagonistic. BOTH DOWN means
    the combination is antagonistic and the polyphenol needs a non-glucuronide route. NO CHANGE means the chondrosarcoma
    result does not transfer to primary chondrocytes and the interaction can be dropped. THE CHEAP PRIOR STEP
    is simply to run the same MUG assay on untreated microdissected zones, which is already required by g_l12_does_growth_plate_cartilage_deconjugate_polyphenol_glucuronides.
- gap_id: g_l12_are_fgfr3_inhibition_and_the_cnp_axis_complementary_by_site
  question: Do FGFR3 inhibition and the CNP axis grow DIFFERENT skeletal sites, such that the two arms are complementary
    rather than redundant?
  type: contradiction
  layer: L12
  tractability: 3
  why_it_matters: 'THIS IS NOW THE MOST CONSEQUENTIAL THING THE STACK COULD LEARN, and the pieces were already
    in the file. CORR-195 established that at bone age 16 the knee, hip, spine, sacrum and cranial base can
    all still be contributing and that no agent may be scored against one site. Rounds 205 and 207 then established
    that the CNP axis is APPENDICULAR-BIASED across three species - no change in L1-L4 vertebral length, foramen
    magnum or skull in skeletally normal primates, and L4-L6 the only segment failing significance at both doses
    in thanatophoric mice. Round 208 read tyra300_2025 for its numbers and found the opposite profile: FGFR3-selective
    inhibition INCREASED LUMBAR VERTEBRAE LENGTH, improved the size and shape of the SKULL AND FORAMEN MAGNUM,
    elevated a WILD-TYPE animal (naso-anal +7.3 per cent, femur +8.2, tibia +6.4, no body-weight difference),
    and left the growth plate MORE ORGANISED - where the CNP axis at its normal-animal dose ceiling produces
    growth plate DYSPLASIA. IF THE TWO ARMS COVER DIFFERENT SITES, the stack should carry both and dose each
    for its own territory. IF THEY OVERLAP, one is redundant and its reserve cost is being paid twice.'
  what_is_known: tyra300_2025, mouse - FGFR3-selective inhibition raises naso-anal, tibia, femur, tail, LUMBAR
    VERTEBRAE and improves skull and foramen magnum, in wild-type and in two FGFR3-mutant models; histologically
    it raises proliferation AND differentiation, hypertrophic chondrocytes are LARGER, and the plate is MORE
    ORGANISED. ema_voxzogo_epar_2021, cynomolgus n=7 per sex - vosoritide produced NO change in L1-L4 vertebral
    length, foramen magnum dimensions or skull measurements while raising tibia and humerus; in TD mice L4-L6
    was the only segment failing significance at both doses; in juvenile rats the axial skeleton did respond
    but with scoliosis, kyphosis and fractures. cnpmeta2026, human - the upper-to-lower segment ratio is UNCHANGED
    across 4 RCTs, which is the one datum pointing toward proportionate CNP growth, and it is in achondroplasia
    where the vertebrae are FGFR3-affected.
  what_is_missing: A HEAD-TO-HEAD. Every element of this comparison comes from a different study, species, model
    and laboratory. Specifically missing - the two agents given in the same experiment with SEGMENT-RESOLVED
    lengths; any CNP-axis segment data in a genetically normal animal beyond the single primate study; any FGFR3-inhibitor
    segment data in a WILD-TYPE animal, since the vertebral and cranial results are in FGFR3-mutant models where
    those sites are themselves affected and have room to respond; and NPR2 against FGFR3 expression in vertebral
    compared with appendicular growth cartilage, which would give the mechanism rather than the phenomenon.
  nearest_evidence:
  - tyra300_2025
  - ema_voxzogo_epar_2021
  - cnpmeta2026
  - weber2025
  nearest_evidence_note: tyra300_2025 carries the FGFR3 side including the wild-type arm but its axial and cranial
    results are in mutant models. ema_voxzogo_epar_2021 carries the CNP side in normal primates. cnpmeta2026
    is the human counter-datum. weber2025 is listed because Npr3 loss DOES disproportionately elongate mouse
    tail vertebrae, so the CNP axial null is not a class property.
  discriminating_experiment: 'ONE EXPERIMENT SETTLES IT AND IT IS A STANDARD FOUR-ARM DESIGN IN WILD-TYPE ANIMALS.
    Growing wild-type mice or rats - vehicle, FGFR3-selective inhibitor alone, CNP-axis agonist alone, and both
    - reading SEGMENT-RESOLVED lengths by microCT at every site the open-site register names: femur, tibia,
    humerus, L1-L4 vertebral bodies, skull anterior-posterior, foramen magnum, plus naso-anal as the sum. Add
    the Hunziker five on one bone so the term assignment travels with the site map. FOUR OUTCOMES. COMPLEMENTARY
    - each agent grows the sites the other misses and the combination sums: carry both, dose each for its territory.
    REDUNDANT - the combination equals the better single agent: drop one and save its reserve cost. SUB-ADDITIVE
    ON SHARED SITES BUT ADDITIVE ON DISJOINT ONES: the realistic case, and the segment map tells you how to
    dose. ANTAGONISTIC - the combination is worse than either alone, which the FGFR-lysosome interaction of
    round 207 makes a live possibility and which nothing would otherwise have predicted. THE CHEAP PARTIAL VERSION
    is to re-analyse existing microCT archives from either agent for the segments the original papers did not
    report - the scans include the spine.'
