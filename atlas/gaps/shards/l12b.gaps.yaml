- gap_id: g_l12b_019
  question: Does pharmacological PTH1R agonism expand the proliferative zone and increase linear growth in a human,
    as PTHrP-PTH1R biology and the Jansen metaphyseal chondrodysplasia phenotype predict?
  type: method_blocked
  layer: L12
  why_it_matters: 'PTH1R is the receptor through which the growth plate''s own pace-setting signal operates, and
    two PTH1R agonists are approved drugs. Neither can be given to a growing child: both labels restrict use with
    open epiphyses because of osteosarcoma risk. The atlas therefore has a structural hole exactly where its most
    mechanistically apt intervention would be. Jansen metaphyseal chondrodysplasia - constitutive PTH1R activation
    in humans - shows the receptor does drive a dramatic growth plate phenotype, so the untested prediction is not
    idle.'
  what_is_known: Teriparatide labelling instructs avoidance with open epiphyses; abaloparatide is not recommended
    in paediatric patients with open epiphyses; both state paediatric safety and effectiveness are not established.
    Paediatric exposure exists only in hypoparathyroidism and rare calcium disorders, none with a growth endpoint.
    A mouse model of Jansen metaphyseal chondrodysplasia is available for mechanistic work.
  what_is_missing: Any human growth readout under PTH1R agonism, at any dose, at any age with open epiphyses.
  nearest_evidence:
  - fda_forteo_label_2025
  - fda_tymlos_label_2025
  - tantivit2026
  - hppner2025
  discriminating_experiment: Since a prospective trial is regulatorily blocked, extract growth data retrospectively
    from the paediatric hypoparathyroidism and activating-CaSR-mutation cohorts already exposed to teriparatide
    or palopegteriparatide - height velocity before and during treatment against the child's own pre-treatment trajectory
    - and pair it with growth plate morphometry in the Jansen mouse under matched intermittent dosing. GROWTH-PROMOTING
    - treated children show velocity above their own pre-treatment trajectory and the mouse shows proliferative
    zone expansion. NEUTRAL - neither, which would decouple PTH1R agonism from linear growth and remove a major
    hypothesis.
  tractability: 2
- gap_id: g_l12b_020
  question: Do bisphosphonates change linear growth in children, independently of the severity of the underlying
    bone disease for which they are given?
  type: known_unknown
  layer: L12
  why_it_matters: Bisphosphonates act precisely at the chondro-osseous junction, blocking the resorption of the
    mineralised hypertrophic cartilage template - the step that converts plate output into bone. Blocking it could
    in principle either retard growth by impeding the removal of the template or have no effect if resorption is
    not rate-limiting. Thousands of children receive these drugs for years and the question has not been answered
    because treated children all have skeletal disease that itself impairs growth.
  what_is_known: Metaphyseal sclerotic bands timed to dosing cycles are a universal radiographic finding, proving
    the drugs reach and persist at the mineralising front. One-year bone microstructure and strength changes in
    treated children with osteogenesis imperfecta are comparable to matched healthy controls. In growing osteogenesis
    imperfecta mice, a CNP analogue plus a bisphosphonate enhanced bone growth beyond either alone.
  what_is_missing: Any human study that isolates a bisphosphonate effect on height from disease severity, and any
    human test of the additive CNP-plus-bisphosphonate effect seen in mice.
  nearest_evidence:
  - mulcrone2026
  - pereira2025_2
  - hosseinitabata2026
  discriminating_experiment: 'Use a within-condition, dose-varying design: in a large osteogenesis imperfecta registry
    stratified by molecular type and baseline severity, regress height velocity on cumulative bisphosphonate dose
    with mixed models including a patient-level random intercept, and confirm with an interrupted-time-series analysis
    around treatment initiation and around treatment holidays. NO GROWTH EFFECT - velocity is flat in cumulative
    dose within strata. GROWTH RETARDATION - a negative dose-slope survives adjustment and reverses during holidays,
    which would make resorption of the hypertrophic template rate-limiting for elongation.'
  tractability: 4
- gap_id: g_l12b_021
  question: Is a drug-induced deficit in growth velocity recovered by catch-up growth after the drug is stopped,
    and does the answer depend on whether the agent acts on the plate directly or through appetite and nutrition?
  type: known_unknown
  layer: L12
  why_it_matters: The atlas contains three growth-toxic agents with different mechanisms and different apparent
    reversibility. Inhaled budesonide produced a deficit within two years that persisted unchanged to adult height
    - no recovery at all. Imatinib produced a deficit with documented adolescent catch-up that was nonetheless insufficient
    - partial recovery. Methylphenidate produces a height Z deficit whose fate is unknown, with a weight-to-height
    deficit ratio suggesting a nutritional route that ought to be the most recoverable. If plate-acting agents are
    irreversible and nutrition-acting agents are reversible, that is a strong statement about whether the plate
    has a fixed proliferative budget.
  what_is_known: 'CAMP: budesonide adult height -1.2 cm, equal to the 2-year deficit, so no recovery and no progression.
    Imatinib: height Z -0.6 to -1.1 to skeletal maturity despite catch-up, with the effect confined to prepubertal
    initiation. Methylphenidate: height Z -0.13, weight Z -0.25, with no adult height data.'
  what_is_missing: Adult height for methylphenidate-treated children, and any study measuring catch-up velocity
    after discontinuation with a matched control for all three agents.
  nearest_evidence:
  - kelly2012
  - sadanand2026
  - cao2026
  discriminating_experiment: Link national prescription registries to conscription or occupational adult height
    records for stimulant-exposed, inhaled-glucocorticoid-exposed and unexposed cohorts, with exposure-duration
    and age-at-first-exposure as covariates and sibling comparison to control for confounding. FIXED BUDGET - all
    three exposures leave proportionate permanent deficits. MECHANISM-DEPENDENT - the nutritional exposure recovers
    fully while the plate-acting exposures do not, showing that the plate can make up nutritionally lost growth
    but not pharmacologically suppressed proliferation.
  tractability: 4
- gap_id: g_l12b_022
  question: In a childhood cancer survivor with short stature, what fraction of the height deficit is caused by
    direct cytotoxic or radiation injury to the growth plate itself, and what fraction by hypothalamic-pituitary
    growth hormone deficiency?
  type: known_unknown
  layer: L12
  why_it_matters: The two mechanisms call for different treatments. Endocrine deficiency is correctable with growth
    hormone replacement; a directly damaged plate is not, and giving GH to it wastes the treatment window and exposes
    the survivor to GH risks for no benefit. Growth hormone therapy after haematopoietic cell transplantation exists
    as an organised national programme precisely because the two coexist, and its incomplete success is the clinical
    expression of the unpartitioned mechanism.
  what_is_known: Cranial and total body irradiation cause GH deficiency. High-dose methotrexate has direct antiproliferative
    effects on chondrocytes and osteoblasts and a recognised osteopathy; cisplatin induces chondrocyte oxidative
    stress and apoptosis in vitro. A prospective JIA cohort has examined methotrexate effects on growth plate development
    at conventional doses. Post-transplant GH replacement partially but not fully restores growth.
  what_is_missing: No study measures growth plate structure or function directly in treated survivors, and no analysis
    partitions the height deficit between effector damage and endocrine deficiency.
  nearest_evidence:
  - shimomura2026
  - ahirwar2025
  - sokhan2026
  - ferrari2026
  discriminating_experiment: In survivors with documented GH deficiency, measure the height velocity response to
    a standardised GH replacement dose and relate it to prior cumulative radiation dose to the lower limb plates
    and to cumulative alkylator and antimetabolite exposure, with serum CXM as a direct marker of endochondral ossification
    activity. ENDOCRINE-DOMINANT - velocity response and CXM rise are independent of local radiation dose. PLATE-DAMAGE-DOMINANT
    - both fall steeply with local dose despite identical GH exposure and identical IGF-1 response, identifying
    a damaged effector.
  tractability: 3
- gap_id: g_l12b_023
  question: Can glucocorticoid anti-inflammatory efficacy be separated from growth suppression at the human growth
    plate, and does any dissociative steroid achieve that separation with an adult-height endpoint?
  type: known_unknown
  layer: L12
  why_it_matters: Chronic glucocorticoid therapy is the most common iatrogenic cause of growth failure in children,
    and the sparing strategies tried so far - alternative classical steroids, route change, dissociative agents
    - have each been adopted on partial evidence. CAMP shows the route-change strategy still costs 1.2 cm of adult
    height. Deflazacort's US label carries no growth-sparing claim. Vamorolone is designed for the separation but
    has been compared to classical steroids only across trials, not against an adult-height endpoint. Without a
    definitive answer, children receive whichever steroid local practice prefers.
  what_is_known: 'CAMP: inhaled budesonide 400 ug/day reduced adult height by 1.2 cm (95% CI -1.9 to -0.5), dose-dependently
    at -0.1 cm per ug/kg/day in the first 2 years, with prepubertal children most affected. Growth and motor function
    centiles track together in corticosteroid-treated DMD. Vamorolone has been compared with prednisone and deflazacort
    by cross-trial analysis of FOR-DMD, and real-world transition criteria have been published.'
  what_is_missing: No randomised head-to-head of a dissociative steroid against a classical one with growth as a
    prespecified endpoint, and no glucocorticoid study outside CAMP with attained adult height.
  nearest_evidence:
  - kelly2012
  - clemens2026
  - stimpson2025
  - fda_emflaza_label_2025
  discriminating_experiment: Randomise boys with DMD to vamorolone or deflazacort at matched anti-inflammatory potency
    with height velocity at 24 months as primary endpoint and time-to-loss-of-ambulation as co-primary, powered
    for non-inferiority on function and superiority on growth. DISSOCIATION ACHIEVED - equal function with significantly
    better height velocity. NOT DISSOCIATED - the two endpoints move together, confirming that transactivation and
    transrepression are not separable at clinically useful doses in this tissue.
  tractability: 4
