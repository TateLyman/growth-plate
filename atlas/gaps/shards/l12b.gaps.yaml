- gap_id: g_l12b_018
  question: Does the age at which low-dose oestrogen is introduced in Turner syndrome measurably change attained
    adult height, and where is the boundary between the growth-promoting and fusion-promoting arms of the oestrogen
    dose-response?
  type: search_established
  layer: L12
  why_it_matters: Oestrogen is the only hormone in human biology with a documented biphasic action on linear growth,
    and Turner syndrome is the setting in which clinicians deliberately titrate along that curve. The timing decision
    is made routinely, guided by consensus rather than by a randomised comparison, and it trades adult height against
    pubertal timing and bone mineral accrual. Establishing the boundary would also fix a parameter that L7 needs
    for any model of oestrogen-driven plate senescence.
  what_is_known: rhGH plus timed low-dose oestrogen is guideline-endorsed standard care in Turner syndrome and the
    timing trade-off is explicitly described in current management reviews. Lower-dose, earlier oestrogen for pubertal
    induction has been proposed. The complementary high-dose experiment - oestrogen given to reduce excessive height
    in constitutionally tall adolescents - has largely been abandoned, removing the upper arm of the curve from
    contemporary data.
  what_is_missing: No randomised comparison of oestrogen introduction ages or doses with attained adult height as
    the endpoint, and no human dose-response relating serum oestradiol to rate of epiphyseal fusion.
  nearest_evidence:
  - turner2025
  - guzzetti2024
  - martn2026
  discriminating_experiment: Randomise girls with Turner syndrome on established rhGH to oestradiol introduction
    at two prespecified ages with identical escalation schedules, with attained adult height as primary endpoint
    and serial high-sensitivity oestradiol plus automated bone age as mediators. TIMING MATTERS - adult height differs
    between arms and the difference is explained by integrated oestradiol exposure before fusion. TIMING IRRELEVANT
    WITHIN THIS RANGE - no height difference, which would free the decision to be made on pubertal and bone-health
    grounds alone.
  tractability: 3
