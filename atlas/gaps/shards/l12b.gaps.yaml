  question: Do bisphosphonates change linear growth in children, independently of the severity of the underlying
    bone disease for which they are given?
  type: known_unknown
  layer: L12
  why_it_matters: Bisphosphonates act precisely at the chondro-osseous junction, blocking the resorption of the
    mineralised hypertrophic cartilage template - the step that converts plate output into bone. Blocking it could
    in principle either retard growth by impeding the removal of the template or have no effect if resorption is
    not rate-limiting. Thousands of children receive these drugs for years and the question has not been answered
    because treated children all have skeletal disease that itself impairs growth.
  what_is_known: Metaphyseal sclerotic bands timed to dosing cycles are a universal radiographic finding, proving
    the drugs reach and persist at the mineralising front. One-year bone microstructure and strength changes in
    treated children with osteogenesis imperfecta are comparable to matched healthy controls. In growing osteogenesis
    imperfecta mice, a CNP analogue plus a bisphosphonate enhanced bone growth beyond either alone.
  what_is_missing: Any human study that isolates a bisphosphonate effect on height from disease severity, and any
    human test of the additive CNP-plus-bisphosphonate effect seen in mice.
  nearest_evidence:
  - mulcrone2026
  - pereira2025_2
  - hosseinitabata2026
  discriminating_experiment: 'Use a within-condition, dose-varying design: in a large osteogenesis imperfecta registry
    stratified by molecular type and baseline severity, regress height velocity on cumulative bisphosphonate dose
    with mixed models including a patient-level random intercept, and confirm with an interrupted-time-series analysis
    around treatment initiation and around treatment holidays. NO GROWTH EFFECT - velocity is flat in cumulative
    dose within strata. GROWTH RETARDATION - a negative dose-slope survives adjustment and reverses during holidays,
    which would make resorption of the hypertrophic template rate-limiting for elongation.'
  tractability: 4
