- gap_id: g_l12b_026
  question: Does a cartilage-targeted carrier that penetrates a mouse growth plate penetrate a HUMAN one, whose
    inert zone alone is thicker than the entire mouse plate?
  type: species_gap
  layer: L12
  why_it_matters: Delivery carriers are the only intervention class that attacks the exposure term rather than the
    target, and exposure is the term the atlas cannot measure for any growth-modifying drug in any species (g_l12b_002).
    If carriers work in human physes they change what is dosable, including agents whose systemic toxicity currently
    caps the dose. If they do not, the entire class is a mouse result and the exposure problem is untouched.
  what_is_known: A PLGA core with a chondrocyte-membrane coat and a WYRGRL collagen-II-binding peptide (K_D about
    1.2 uM against recombinant human COL2A1) reached the mouse distal femoral growth plate after intravenous injection,
    peaking at 24 h, and delivered purmorphamine well enough to restore body length in Fgfr3 V376D/+ mice at 1 mg/kg
    every two days for five weeks (ye2026). The peptide drives enrichment around cartilage; the membrane coat drives
    retention within it.
  what_is_missing: Everything quantitative about penetration depth in human-scale tissue. The mouse result is measured
    as normalised DiR fluorescence radiant efficiency, a membrane dye, so there is no concentration, no depth profile
    in um, no AUC and no free fraction to scale from. Diffusion into avascular cartilage scales badly with thickness
    and the human inert zone alone is 700-1000 um (thurston1985), exceeding the full height of the mouse plate that
    was treated. The authors state explicitly that human growth-plate cartilage was unobtainable, so no human tissue
    has been exposed to this or any comparable carrier.
  nearest_evidence:
  - ye2026
  - thurston1985
  nearest_evidence_note: ye2026 (mouse, dye-based, single laboratory, single disease model); thurston1985 (the human
    plate dimensions that set the scaling problem).
  discriminating_experiment: Expose surgically obtained human physeal cartilage explants (epiphysiodesis waste,
    the same stream gap g_l1arch_002 needs) to fluorophore-loaded and drug-loaded carriers under matrix-preserving
