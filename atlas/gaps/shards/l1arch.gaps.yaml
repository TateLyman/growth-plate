- gap_id: g_l1arch_019
  question: Is the fibrillin/TGF-beta axis a GROWTH PLATE mechanism for long bone overgrowth rather than a connective-tissue
    one - and if so, is it the largest untapped lever on human height?
  type: known_unknown
  layer: L1
  why_it_matters: 'This atlas dismissed the entire class on 2026-08-06 and the dismissal was wrong. Round 17''s
    screen of every human tall-stature gene classified 14 of its 45 hits - FBN1, TGFBR1/2, TGFB2/3, SKI, the fibrillar
    collagens, AGTR1 - as ''connective tissue: tall by dolichostenomelia, a structural defect, not a growth plate
    that runs faster or longer'', and set them aside. That was an assumption stated as a classification. It is the
    single largest block in the screen, it contains the only approved drug in the whole list that acts on the axis
    (losartan, an AT1 blocker used in Marfan to reduce TGF-beta signalling), and the direction is known - which
    is more than can be said for anything else the screen returned. If the overgrowth is physeal, this is a mapped,
    drugged, human-validated pathway to long bone length that nobody has read as such.'
  what_is_known: 'THE EVIDENCE THAT BROKE THE CLASSIFICATION CAME FROM HOMOCYSTINURIA, WHICH SHARES THE AXIS BY
    A DIFFERENT ROUTE. (i) The overgrowth is postnatal and therefore physeal: an Irish cohort of 48 pyridoxine-nonresponsive
    patients has NORMAL BIRTH WEIGHT and reaches about +1 SD above the population in height and weight with no BMI
    difference, and within the disease the late-diagnosed are 7.97 cm taller at 18 years than the newborn-screened
    (P=0.0204), the divergence complete before age 10 (purcell2017). Length accrued after birth is length accrued
    at the growth plate. (ii) The animal counterpart localises it: chicks fed 0.6% homocysteine for 8 weeks grow
    faster with SIGNIFICANTLY LONGER TIBIAE (P<0.01) and radiographic ACCELERATED EPIPHYSEAL OSSIFICATION, described
    by the authors as epiphyseal growth plate lesions; the bones are stronger only in proportion to their extra
    length and cortical thickness, so nothing about the material changed (mass2003). (iii) The molecular target
    is FIBRILLIN-1, the Marfan protein: homocysteinylation but not cysteinylation disrupts fibrillin-1 multimerisation
    and greatly reduces microfibril network deposition by human fibroblasts, and the authors note that Marfan and
    homocystinuria share long bone overgrowth, scoliosis and ectopia lentis from unrelated origins (hubmacher2010).
    (iv) It is NOT the collagen cross-link route of g_l1arch_018: homocysteine leaves cross-links in non-lesional
    cartilage unchanged (orth1994, Experiment 3). ANSWERED IN LARGE PART, 2026-08-06, AND THE ANSWER INVERTS THE
    PREDICTION THIS GAP WAS OPENED WITH. The literature extraction called for here has been done and the paper exists:
    sedes2022 used Cre-LoxP with metatarsal organ culture to localise Marfan long bone overgrowth to the OUTER PERICHONDRIUM
    rather than the growth plate, found DECREASED LTBP-3/4 and reduced phospho-Smad2 there - loss of TGF-beta signalling,
    not the excess the aortic literature would predict - and showed that Fbn1-deficient metatarsals grow LONGER
    while releasing LESS TGF-beta, with recombinant TGF-beta1 add-back NORMALISING their linear growth. That add-back
    is a causal step and it fixes the sign: LESS TGF-BETA MEANS A LONGER BONE. Three sources agree in direction:
    yang2001 (TGF-beta/Smad3 represses terminal hypertrophic differentiation; Smad3-null plates show enhanced terminal
    differentiation), chen2015 (losartan in wild-type mice elongates the hypertrophic zone and raises Col10a1 with
    minimal proliferation change) and the Marfan phenotype itself. yu2013 places fibrillin microfibrils throughout
    the plate with fibrillin-1 richest in the resting and proliferative zones. Entered as the new node perichondrial_tgfb_restraint,
    grade C.'
  what_is_missing: SHARPLY NARROWED 2026-08-06 AFTER THE HUMAN TRIAL DATA WAS FOUND AND ANALYSED. (1) THE HUMAN
    RANDOMISED TEST HAS BEEN RUN AND IS NULL, BUT AGAINST THE WRONG COMPARATOR. Pediatric Heart Network NCT00429364
    randomised 608 growing Marfan patients to atenolol or losartan and PRESPECIFIED height, height-for-age Z, arm
    span:height and upper:lower segment ratio as secondary outcomes; the results are posted publicly and show no
    detectable difference on any of them (height velocity +0.113 cm/yr, p~0.69; height-for-age Z velocity -0.027
    z/yr, p~0.14, running the other way). BOTH ARMS ARE ON ACTIVE DRUG. There is no placebo arm anywhere in the
    Marfan literature because withholding aortic protection is not ethical, so the effect of this axis on human
    growth may never be measurable by a randomised design. That is a structural limit on the question, not a gap
    that more work closes. (2) THE ANIMAL PHARMACOLOGY REMAINS UNMEASURED AND IS NOW THE ONLY CLEAN ROUTE. Nobody
    has given a TGF-beta-lowering drug to a normal growing animal and measured femur length - chen2015 measured
    zone heights and bone mass, sedes2022's pharmacology is organ culture. With no human placebo arm possible, this
    becomes the decisive experiment rather than a supporting one. (3) WHICH TERM MOVES. long1998 and alvarez2001
    establish that the perichondrium restrains proliferation AND hypertrophy through two separate mechanisms, only
    the hypertrophic arm being PTHrP-dependent. Nobody has partitioned the resulting length gain between the two,
    so it is unknown whether the 7% overgrowth is mostly more cells or mostly bigger cells - the same partition
    question wilsman1996 answered for normal growth and nobody has answered here. (4) KDM5A, still unexplored, still
    named as joint-top of the dysregulated pathways in the fibrillin-1-deficient perichondrium, still unstudied
    for bone length. (5) THE SET-POINT IS GRADED, WHICH IS THE ENCOURAGING PART. crochiere2008 shows 300 pg/ml active
    TGF-beta1 restores growth PRECISELY in stripped organ culture, so the restraint is a tunable set-point rather
    than a switch. A graded set-point is what a therapeutic target has to be.
  nearest_evidence:
  - sedes2022
  - robertson2023
  - long1998
  - alvarez2001
  - crochiere2008
  - chen2015
  - erkula2002
  - yu2013
  - purcell2017
  nearest_evidence_note: purcell2017 (the quantified human height, postnatal timing and within-disease dose-response);
    mass2003 (longer tibiae and accelerated epiphyseal ossification in chick); hubmacher2010 (fibrillin-1 as the
    molecular target, in vitro); orth1994 (excludes the collagen cross-link route); mudd1985 (the 629-patient natural
    history that reports no stature data at all, which is why this took so long to see).
  discriminating_experiment: 'THE CHEAPEST DECISIVE STEP IS A LITERATURE ONE AND SHOULD BE DONE FIRST: Marfan mouse
    models have been characterised extensively for aortic and skeletal phenotype, and several report long bone length.
    Extract limb length and, where available, growth plate histology from the existing Fbn1 hypomorph and Fbn1 C1039G
    literature and ask whether the overgrowth tracks physeal zone heights. If it does, the classification of round
    17 inverts and 14 of the 45 screen hits become live. THEN THE EXPERIMENT: give a growing wild-type animal a
    TGF-beta-lowering agent already used in Marfan - losartan is the obvious one, it is approved, and its skeletal
    effect in a normal growing animal appears never to have been the endpoint of any study - and measure long bone
    length and growth plate histomorphometry against controls. The prediction that makes it worth running is DIRECTIONAL
    AND UNCOMFORTABLE: if the fibrillin/TGF-beta axis drives physeal elongation, losartan should SHORTEN bones in
    a normal growing animal, which would be both a confirmation of the mechanism and a safety signal for every child
    on losartan for Marfan. That second consequence is the reason to look at the existing paediatric Marfan trial
    data for height before running anything new.'
  tractability: 2
- gap_id: g_l3_neprilysin_window
  question: Does a human equivalent of the mouse 3-to-4-week neprilysin-inhibition window exist, and when is it
    - and does raising endogenous CNP by blocking its degradation increase bone length in any human?
  type: known_unknown
  layer: L3
  why_it_matters: 'Sacubitril is an APPROVED drug, already given to children for heart failure, that produces dose-dependent
    skeletal overgrowth in wild-type mice through the same CNP/NPR-B pathway vosoritide targets - but by protecting
    the peptide the child already makes rather than infusing an analogue daily. That is a materially different pharmacological
    proposition from anything else in this atlas: oral, approved, paediatric-dosed, and acting on an endogenous
    ligand. Everything turns on the window, because the mouse effect appears ONLY at 3-4 weeks, when endogenous
    CNP and neprilysin expression are highest. Given outside its window the drug has no substrate to protect and
    will do nothing - and a null obtained that way would look like a refuted mechanism rather than a mistimed experiment.'
  what_is_known: 'hakata2024: sacubitril given to wild-type C57BL/6 mice causes DOSE-DEPENDENT skeletal overgrowth
    with thickening of BOTH the proliferative and hypertrophic zones, mirroring CNP administration; the effect is
    ABOLISHED by cartilage-specific NPR-B knockout, which excludes neprilysin''s many other substrates; it also
    works on fetal tibial explants in organ culture, so it needs no endocrine axis; and it appears only at 3-4 weeks
    of age, coinciding with peak endogenous CNP and NEP expression in lumbar vertebrae. The receiving pathway is
    the best-validated growth pathway in human skeletal medicine - NPR2 gain of function causes human tall stature,
    NPR2 loss causes acromesomelic dysplasia, NPPC duplication causes tall stature, and vosoritide is approved.
    The atlas already held the OTHER clearance arm, NPR3, from the start.'
  what_is_missing: 'PARTLY ANSWERED THE SAME DAY, FROM DATA ALREADY ON DISK. chu2026''s deposited dataset IS GSE288028,
    which this atlas has been using since Phase 5 - confirmed from the GEO record, whose title is ''Growth hormone
    directly stimulates cartilage stem cells in the human pubertal growth plate''. Re-analysis of it answers the
    presence half of the window question: MME is expressed in 3 of 4 donors across every zone of the EARLY PUBERTAL
    HUMAN growth plate, mean 7.97% of cells against 1.55% for NPR3 - a 5.1-fold difference, with MME exceeding NPR3
    in 9 of 11 zone-donor pairs. So in human pubertal cartilage the ENZYMATIC clearance arm looks more prominent
    than the RECEPTOR arm, and it is the enzymatic arm sacubitril blocks. NPR2 is present in all four donors. WHAT
    THAT LEAVES. (1) NPPC ITSELF IS AT THE DETECTION FLOOR - 0.04 to 0.52% of cells, zero donors above threshold.
    Local CNP production in the human plate is minimal in these samples, so the mouse rationale of inhibiting NEP
    where CNP and NEP are co-expressed does not transfer intact, and any human effect would depend on protecting
    CIRCULATING CNP. Droplet scRNA-seq under-detects secreted peptides, so this is weak evidence of absence and
    should be checked by in situ or ELISA rather than treated as settled. (2) THE AGE WINDOW IN HUMANS IS STILL
    UNKNOWN. These donors are at the pubertal spurt, which is the plausible equivalent of mouse 3-4 weeks, but the
    atlas holds no younger or older human growth plate to compare against, so the shape of the human window is unmeasured.
    (3) NO HUMAN HAS BEEN MEASURED FOR HEIGHT ON THE DRUG despite paediatric approval of sacubitril/valsartan for
    heart failure - the same unexamined-data situation as the losartan trial, and worth checking whether the paediatric
    trials posted anthropometric outcomes. (4) THE CEILING IS NOW KNOWN AND IT IS LOW: sacubitril gives 2-3% of
    body length in mouse, about half what exogenous CNP gives, and the two are NOT ADDITIVE, so this cannot be stacked
    on a CNP analogue.'
  nearest_evidence:
  - hakata2024
  - chu2026
  nearest_evidence_note: hakata2024 is the entire evidential basis and it is one paper, one laboratory, one species,
    read from its abstract. chu2026 is the human tissue resource that could answer the window question without a
    new experiment.
  discriminating_experiment: TWO STEPS, NEITHER REQUIRING A NEW ANIMAL. (1) READ MME AND NPPC EXPRESSION BY ZONE
    AND AGE OUT OF chu2026's HUMAN PUBERTAL GROWTH PLATE ATLAS. If neprilysin is not expressed in the human plate,
    or is expressed outside the growing years, the whole proposition fails immediately and cheaply. If it tracks
    CNP the way it does in mouse, the window is identified. (2) RETROSPECTIVELY ANALYSE HEIGHT IN CHILDREN ON SACUBITRIL/VALSARTAN.
    The drug is approved for paediatric heart failure and those children are measured at every visit over years.
    The comparator problem that defeated the losartan question is smaller here, because paediatric heart failure
    cohorts include children on other regimens. THEN, and only then, the animal experiment worth doing is a dose-response
    of sacubitril across the whole growing period in a normal animal with FEMUR LENGTH as the endpoint - the same
    measurement nobody has taken for losartan.
  tractability: 1
- gap_id: g_l1arch_human_age_series_modern
  type: known_unknown
  layer: L1
  tractability: 3
  question: What are the zone heights, cell numbers per column and terminal cell dimensions of the human growth
    plate at each year of age from 1 to 18, at a LONG BONE, measured with modern methods?
  why_it_matters: The atlas can now describe the human growth plate across childhood, and the description rests
    on 58 individuals measured between 1976 and 2000 by manual point counting on autopsy tissue, with one person
    per age above one year in the larger series and twelve subjects in total in the smaller. Every quantitative
    claim about how the human plate changes with age - including the two that most constrain the flow model, that
    terminal cell height does not vary and that zone height collapses in the first year - has that as its entire
    evidential base. Neither series resolves puberty, which is when the question of how much height is still available
    is actually decided.
  what_is_known: 'byers2000: 46 human rib costochondral junctions, 11 days to 13.5 years; proliferative zone height
    to 34% and hypertrophic to 26% of day-11 values, most of it in year 1; lacunar diameter unchanged; matrix volume
    fraction and septal thickness up. kember1976: 12 human distal femora, birth to 14 years with paired Harpenden
    growth rates; hypertrophic cell height 29-38 um with no age dependence; column cell number falling from 62 at
    birth to about 36 at 5-8 years; derived cycle time 20 days.'
  what_is_missing: (1) n PER AGE. Above one year byers2000 has a single individual at each of ten ages and kember1976
    has twelve subjects across the whole range. No variance estimate at any childhood age exists. (2) A LONG BONE
    ACROSS THE FULL RANGE. byers2000 is rib; kember1976 is distal femur but with twelve people. (3) PUBERTY. byers2000
    did not record pubertal status; kember1976 declines to estimate cycle time at 13-14 years because growth rates
    scatter too widely. The only human growth plate tissue now being collected - epiphysiodesis biopsies - is all
    Tanner 2-4, i.e. exactly and only the interval both old series miss, and it is being profiled transcriptionally
    rather than histomorphometrically. (4) MODERN MORPHOMETRY. Both series are manual point counting on decalcified
    sections; neither used 3D reconstruction, and kember1976 measured a 13% processing shrinkage that byers2000
    does not report correcting for at all.
  nearest_evidence:
  - byers2000
  - kember1976
  - avijgan2026br
  nearest_evidence_note: The two old series are the whole of it. avijgan2026br has the right tissue at the right
    age but reports transcriptomics, not morphometry, from 8 donors within a 2-year age window.
  discriminating_experiment: 'NO NEW TISSUE COLLECTION IS NEEDED FOR THE FIRST STEP. Paediatric autopsy archives
    hold decades of decalcified long-bone blocks; byers2000 drew 46 cases from one Adelaide service in the 1990s.
    Re-cutting archival blocks across the age range and applying automated morphometry to zone heights, column cell
    counts and axial cell dimensions would multiply n per age by an order of magnitude at the cost of sectioning.
    THE SECOND STEP IS FREE: the epiphysiodesis biopsies already being taken for transcriptomics are fixed tissue
    and could be measured histomorphometrically as well, which would put a modern number on the pubertal plate that
    neither old series reaches. Report shrinkage.'
- gap_id: g_l1arch_human_cycle_time_measured
  type: known_unknown
  layer: L1
  tractability: 3
  question: Can human growth plate chondrocyte cycle time be MEASURED rather than derived, and does it shorten during
    the pubertal spurt?
  why_it_matters: If human terminal cell height does not vary with age (kember1976) and column cell number only
    falls, then cycle time is the only remaining free variable in the human plate, and the pubertal growth spurt
    has to be produced by shortening it. That is the single most consequential quantitative claim the atlas can
    now make about human growth, and it rests on an argument from absence in twelve necropsy subjects plus a derivation
    with a rabbit-imported assumption. The rat value is 2 days and the human derivation is 20; anything built on
    rodent kinetics is out by an order of magnitude if the derivation is right, and out by an unknown amount if
    it is wrong.
  what_is_known: kember1976 derives 20 days at ages 5-8 in human distal femur, with a floor near 16 days, from growth
    rate, terminal cell height and column cell counts; and reports no increase in proliferative cell number during
    the spurt. wilsman1996a measures 30.9-76.3 HOURS by BrdU in 28-day rat across four plates. Rat labelling shows
    the zone is heterogeneous - central cells 50-60% per day, epiphyseal-end cells 5-10% per day - so any single
    human figure is a mean over a wide range.
  what_is_missing: (1) ANY LABEL-BASED HUMAN MEASUREMENT. None exists, and thymidine analogues cannot be given to
    healthy children. (2) THE SPURT. No human cycle-time estimate exists at any pubertal age; kember1976 explicitly
    refuses to make one. (3) THE PROLIFERATIVE FRACTION OF THE COLUMN, which is the weakest step in the derivation
    and is currently a rabbit number. (4) WHETHER THE DERIVATION IS EVEN INTERNALLY VALID at ages where growth rate
    is changing fast, since it assumes steady state.
  nearest_evidence:
  - kember1976
  - wilsman1996a
  - avijgan2026br
  nearest_evidence_note: kember1976 is the only human estimate. avijgan2026br demonstrates that ex vivo sequential
    thymidine-analogue labelling of intact HUMAN growth plate biopsies works - EdU overnight, then IdU, then CldU
    - which is the technique the measurement would need.
  discriminating_experiment: 'avijgan2026br HAS ALREADY DONE THE HARD PART. They cultured intact human growth plate
    biopsies from epiphysiodesis and labelled them with three sequential thymidine analogues over several days,
    in order to ask whether resting zone cells re-enter the cycle. The SAME experiment read out on the PROLIFERATIVE
    zone, with the analogue-to-analogue interval varied, gives a percent-labelled-mitoses-style estimate of human
    cycle time directly - and the tissue is Tanner 2-4, i.e. the pubertal window no other method can reach. The
    confounds are real and must be stated in advance: explant culture releases cells from their niche (the paper
    shows exactly that for the resting zone), so a cultured cycle time is a lower bound on the in vivo one, and
    the donors are selected for tall stature. A LOWER BOUND WOULD STILL SETTLE THE ORDER OF MAGNITUDE against the
    rat.'
