  question: What sets the aspect ratio of the terminal hypertrophic chondrocyte - the height-to-diameter ratio that
    hunziker1989 shows carries physiological change in growth rate - and can it be manipulated independently of
    cell volume?
  type: known_unknown
  layer: L1
  why_it_matters: This is the variable a physiological growth change actually moves, and no therapeutic programme
    targets it. CNP analogues and FGFR3 inhibitors are aimed at hypertrophic ENLARGEMENT, but hunziker1989 measured
    cell volume FALLING 13% while growth rate rose 20%. If aspect ratio rather than volume is the lever, the entire
    pharmacology of this field is aimed one axis away from the mechanism, and a compound that made terminal cells
    taller and narrower at constant volume would be a different class of agent from anything in development.
  what_is_known: 'Rat proximal tibia, 21 to 35 days, growth rate +20%: final cell height +23% (31.2 to 38.5 um,
    P<0.02), final lateral diameter -14% (29.9 to 25.6 um, P<0.03), final cell volume -13% (P<0.03), matrix per
    cell unchanged, cells produced per column per day unchanged, hypertrophic-phase duration unchanged at about
    two days (hunziker1989, n=6 per age). Derived aspect ratio rises from 1.04 to 1.50. The cell sits inside a pericellular
    matrix and a lattice of longitudinal septa that could in principle impose the anisotropy: perlecan is required
    for the pericellular matrix and for column formation (costell1999, arikawahirasaw2001), integrin beta1 is required
    for chondrocyte rotation and column formation (aszodi2003, greer2024), and cytoskeletal tension is required
    for rotation (greer2024). PARTLY ANSWERED 2026-08-06: the constraint anisotropy is measured and it VARIES. Transverse-to-axial
    modulus ratio is 9.7 in newborn bovine (cohen1998) and collapses from 11.0 at birth to 0.72-1.15 by 4-18 weeks
    in porcine distal ulna (wosu2012), i.e. the tissue becomes isotropic over the period growth rate falls. And
    in human vertebral physis, hypertrophic cell WIDTH is invariant (14.9 vs 15.0 um, ns) while HEIGHT differs 34%
    (8.5 vs 12.8 um, p<0.0005) between scoliosis and controls (bylskiaustrow2018).'
  what_is_missing: 'Two things, and the first was misstated here earlier on 2026-08-06 and corrected the same day
    - see CORR-010. (i) HEIGHT AND VOLUME MEASURED IN THE SAME CELLS BY ESTIMATORS INDEPENDENT OF EACH OTHER. Not
    "a model-free height", which stokes2007 already provides: 146 paired within-animal comparisons across rat, rabbit
    and calf, cell height read directly off segmented profiles with no shape model, growth rate measured in the
    same specimen. What no study has is height and volume estimated independently. hunziker1989 has both but its
    height is literally computed FROM its volume (super-egg model, cruzorive1986 eq. 8.11). rubin2021 has both in
    3D but its volume is a direct mesh integral while its height is a bounding box on a fitted ellipsoid, its predictor
    comparison is across only three plate types, and its growth values come from previously published data on other
    animals. stokes2007 has only height. In BOTH studies that compare the two variables, volume is the better-estimated
    one, which is the configuration that can manufacture a "volume is the better predictor" result out of estimator
    quality. Applying rubin2021''s MAPs pipeline to hunziker1989''s two-age within-plate design remains the decisive
    experiment. (ii) The causal step. Every measurement above is a correlation across ages, species, loads or disease
    states; nobody has manipulated the anisotropy and measured the resulting cell dimensions and bone length. See
    C-L1-08, CORR-009 and CORR-010.'
