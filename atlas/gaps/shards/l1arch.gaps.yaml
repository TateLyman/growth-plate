- gap_id: g_l1arch_017
  question: Does the terminal chondrocyte's contribution to column length change because the CELL ELONGATES or because
    the cell ALIGNS with the growth axis - and is the answer already sitting in rubin2021's deposited feature table?
  type: known_unknown
  layer: L1
  why_it_matters: 'Every quantity called ''cell height'' in this literature is AXIAL EXTENT, which is intrinsic
    cell length multiplied by how well the cell is aligned with the proximal-distal axis. The two have completely
    different therapeutic implications. If terminal cells contribute more length because they get longer, the target
    is cell-volume regulation or pericellular matrix compliance. If they contribute more because columns straighten,
    the target is column alignment - integrin beta1, cytoskeletal tension, chondrocyte rotation (aszodi2003, greer2024)
    - an entirely different and largely unexplored drug class. The distinction also decides contradiction C-L1-08:
    volume is orientation-free by construction, axial extent is not, so a ''volume beats height'' result can be
    produced by the confound alone.'
  what_is_known: 'rubin2021 reports mean cell BOUNDING BOX HEIGHT along the P-D axis and states in its own Supplementary
    Fig. 4A caption that this quantity ''is influenced by cell orientation'', illustrating three differently-shaped
    cells that yield the same h - a wide flat ellipse, a tall narrow ellipse and a tilted elongated ellipse. Peak
    hypertrophic bounding-box heights are approximately 23 um (proximal tibia), 22 um (distal tibia) and 26 um (distal
    ulna). Scored against the growth ranking (PT and DU more active than DT), axial extent gets 1 of 3 pairwise
    comparisons right - it misses PT>DT (ns in the HZ) and it reports a significant DU>PT difference (p=2.0e-03)
    where growth shows none - while cell volume gets 3 of 3 (p=0.0279, p=0.0045, p=0.4834 ns). So rubin2021''s published
    conclusion is supported by its own supplement. CRITICALLY, the 3D MAPs pipeline already extracts, per cell,
    the PC1/PC2/PC3 COEFFICIENTS (the three axis lengths, orientation-free) AND the PC1/PC2/PC3 ORIENTATIONS, listed
    in Supplementary Table 1, with per-feature segmentation error quantified in Supplementary Figs 2 and 3, and
    PC1 orientation shown robust to imaging angle in Supplementary Fig. 5. The same confound is present on the other
    side of the contradiction: cruzorive1986 section 10.5 states that hunziker1989''s height and width estimators
    carry opposite-signed bias whose magnitude is set by cell tilt. PARTLY ANSWERED 2026-08-06 BY THIS ATLAS, from
    rubin2021''s own Figshare deposit (10.6084/m9.figshare.14903052.v1), which turned out to contain the per-cell
    feature tables for one growth plate - distal ulna DU_S84_m3_wt, 21 tiles, 29,162 segmented cells, with PC_range,
    PCA_coeff, ellipsoid radii and eigenvectors, volume and centroids all present. atlas/tools/rubin_decompose.py
    reconstructs the published bounding-box height profile for that sample as a validation guard (10.13 um over
    the first half of the axis against a published trace near 9-10; 27.55 um hypertrophic peak against a published
    peak near 26) and refuses to report if it fails. RESULT: within this plate the orientation confound does NOT
    bite. Mean alignment |cos(PC1, P-D)| moves only 0.322 to 0.384 from resting to hypertrophic zone, both far below
    the 0.500 expected for uniformly random axes. A counterfactual swap - hypertrophic cell shapes wearing resting-zone
    orientations, and the reverse - attributes 96.7% of the log rise in axial extent to ELONGATION and 15.0% to
    REALIGNMENT. AND THE ENLARGEMENT IS NEAR-ISOTROPIC: principal axis folds 2.17, 2.27, 2.38 against a cube-root-of-
    volume fold of 2.12, all within 12%, with the SHORT axis growing marginally fastest.'
  what_is_missing: 'The between-plate half, which is the half that carries rubin2021''s conclusion. The deposit
    holds no proximal tibia and no distal tibia, so it cannot be said whether the DU-versus-PT hypertrophic height
    difference - the one comparison that breaks the height-growth correlation - is a size difference or an alignment
    difference. The three-plate feature tables are stated to be available from the corresponding author on request,
    and the analysis is already written. SEPARATELY, the within-plate result raises a sharper question than the
    one this gap opened with: if chondrocyte enlargement is isotropic then height is volume^(1/3) times a constant,
    height and volume are not independent variables at all, and the recurring ''volume is the better predictor''
    result is simply a statement about which of two views of one variable is measured better. Whether the enlargement
    is isotropic in a plate whose GROWTH RATE is changing - hunziker1989''s axis, where an anisotropic change is
    claimed - is untested in any species by any method. DATA-AVAILABILITY AUDIT BY THIS ATLAS, 2026-08-06 - every
    public route was checked and the PT and DT feature tables are not in any of them. (i) figshare 10.6084/m9.figshare.14903052.v1,
    the deposit used for the within-plate result above: distal ulna only, 21 tiles. (ii) figshare 10.6084/m9.figshare.14932503.v1:
    preprocessing inputs for distal ulna tiles 19 and 20 only, same sample. (iii) The Nature Communications Source
    Data archive (41467_2021_25714_MOESM4_ESM.zip, 371 MB, reached via the Europe PMC supplementaryFiles endpoint
    after the PMC download link returned a Javascript interstitial): sub-archives S1 to S7 contain the XPIWIT segmentation
    binaries, demo .vff and .tif images and ImageJ macros, and the single spreadsheet S8_data.xlsx holds a two-way
    ANOVA of SMAD-positive counts for the GDF5 figure. NONE OF THE VALUES BEHIND FIG. 2 OR SUPPLEMENTARY FIG. 4A
    ARE IN IT, so the statement ''source data are provided with this paper'' resolves for this paper to software
    and demo images. (iv) The eight Zenodo deposits of the follow-up paper (Agrawal et al. 2024, eLife 95289) hold
    about 250 GB of raw Imaris stacks of Col2creER;Confetti clones from proximal tibia and distal femur at E18.5
    and P40 - raw images under a different labelling scheme, not 3D MAPs feature tables, and they would require
    rerunning the whole segmentation pipeline. That deposit is nevertheless the most interesting object found: proximal
    tibia at two ages spanning a large growth-rate change is hunziker1989''s own design, and if 3D MAPs cell-morphology
    output exists for it, it would be the first modern 3D test of the shape-modulation claim. A request for both
    datasets was drafted to the corresponding authors on 2026-08-06. SHARPENED 2026-08-06 by a per-cell test on
    the same deposit. The pivotal quantity is now named: MEAN ALIGNMENT OF THE CELL LONG AXIS WITH THE P-D AXIS,
    PER PLATE. Within the distal ulna, log volume explains only 43.2% of the per-cell variance in log axial extent
    in the hypertrophic zone, and the residual correlates with |cos(PC1, P-D)| at r=+0.664 against r=+0.076 for
    intrinsic length. So orientation is weak between zones (mean alignment is flat, and elongation carries 97% of
    the rise in the mean) but dominant between cells. A difference in MEAN alignment between plates would therefore
    shift mean axial extent without any difference in cell size, which is exactly the failure mode that could produce
    rubin2021''s DU-versus-PT result. Nobody has reported per-plate mean alignment, and it cannot be computed from
    the public deposit. A SECOND, UNRELATED QUESTION FELL OUT OF THE SAME TEST: in embryonic mouse distal ulna the
    axis pointing along the bone is the SHORT one (mean |cos| 0.660 resting and 0.625 hypertrophic for PC3, against
    0.322 and 0.384 for PC1), and it is the axis that thickens fastest with volume (allometric slope 0.421 against
    an isometric 0.333). hunziker1989''s postnatal rat terminal cell is taller than wide, which would put the LONG
    axis along the bone. Whether and where the terminal chondrocyte turns its long axis up the bone is unmeasured
    in any species, and if it does, that transition is the shape modulation Hunziker described.'
