- gap_id: g_l1arch_014
  question: Can chondrocyte kinetics be measured non-invasively in a living human growth plate?
  type: method_blocked
  layer: L1
  why_it_matters: Every human number in this layer is either post-mortem, surgical waste, or derived from
    external anthropometry. Without an in vivo readout there is no way to relate a drug's effect on stature
    to its effect on the tissue, and no way to detect a plate-level response before months of height data
    accumulate.
  what_is_known: Human physeal architecture can be resolved by MRI and the plate can be seen to close,
    and radiographic marker methods give month-scale elongation (pritchett1992). Growth plate height and
    width correlate with tibial growth rate in both mouse and human radiographs (wilson2021). Nothing
    images cell turnover.
  what_is_missing: An in vivo readout of proliferation, hypertrophic volume, or matrix turnover in human
    physeal cartilage. Sodium and gagCEST MRI measure matrix proteoglycan but have not been validated
    against physeal kinetics; no PET tracer targets chondrocyte proliferation with sufficient resolution
    against adjacent bone uptake.
  nearest_evidence:
  - pritchett1992
  - wilson2021
  nearest_evidence_note: wilson2021 (human radiographic morphometry), MRI physeal imaging literature,
    circulating markers such as collagen X neoepitope and miRNA panels proposed but not anchored to a
    plate-level measurement.
  discriminating_experiment: 'Validate a candidate readout against ground truth in a large-animal model:
    in growing lambs with implanted microtransducers measuring elongation continuously, acquire serial
    ultra-high-field sodium/gagCEST MRI and matched serum collagen X neoepitope, then terminally measure
    hypertrophic cell volume stereologically. A readout that tracks measured elongation with r>0.8 across
    a manipulated range of growth rates (for example dexamethasone-suppressed versus control) is a candidate
    for human translation; anything weaker means human plate-level pharmacodynamics remain inaccessible.'
  tractability: 2
