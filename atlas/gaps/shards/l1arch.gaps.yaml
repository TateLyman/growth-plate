- gap_id: g_l1arch_013
  question: How much of the latitudinal (circumferential) enlargement of a human growth plate is contributed by
    the groove of Ranvier, and does the groove also supply chondrocytes to the columnar population?
  type: known_unknown
  layer: L1
  why_it_matters: If the groove supplies the plate with progenitors, it is an alternative stem source to the PTHrP+
    resting zone and a target for restoring growth after physeal injury; iatrogenic damage to the groove during
    surgery is a recognised cause of angular deformity, but the quantitative contribution has never been established.
  what_is_known: The groove is a wedge of densely cellular tissue continuous with the perichondrium (shapiro1977,
    rabbit) and is present in developing human calcaneus and talus (cheng1995). It harbours CD90+/CD105+ mesenchymal
    progenitors and mature alpha-SMA-covered vessels in human digits (walzer2014). Its disorganisation causes
    hyperostosis in piglets, and its damage is linked to angular deformity and osteochondroma (langenskild1998).
    Postnatal mouse plates show clusters restricted to the outer edges, consistent with a peripherally driven
    expansion mechanism (rubin2024).
  what_is_missing: No lineage tracing from a groove-specific marker into the columnar chondrocyte population,
    and no quantitative estimate of the fraction of plate diameter increase attributable to the groove versus
    interstitial appositional growth. In humans nothing beyond descriptive histology exists.
  nearest_evidence:
  - shapiro1977
  - walzer2014
  - cheng1995
  nearest_evidence_note: shapiro1977 (rabbit), cheng1995 and walzer2014 (human, descriptive), rubin2024 (mouse,
    peripheral clusters).
  discriminating_experiment: Identify a groove-of-Ranvier-restricted driver in mouse (candidates from Gli1+ or
    periosteal PDGFRa+ perichondrial populations) and perform inducible lineage tracing at P7, scoring at P28
    (i) the fraction of labelled cells inside columns versus at the plate margin and (ii) plate diameter. In parallel,
    microsurgically excise the groove unilaterally and measure the change in plate diameter growth rate versus
    elongation rate. If diameter growth falls while elongation is preserved, the groove is a dedicated latitudinal-growth
    organ and not a column progenitor source.
  tractability: 3
- gap_id: g_l1arch_014
  question: Can chondrocyte kinetics be measured non-invasively in a living human growth plate?
  type: method_blocked
  layer: L1
  why_it_matters: Every human number in this layer is either post-mortem, surgical waste, or derived from external
    anthropometry. Without an in vivo readout there is no way to relate a drug's effect on stature to its effect
    on the tissue, and no way to detect a plate-level response before months of height data accumulate.
  what_is_known: Human physeal architecture can be resolved by MRI and the plate can be seen to close, and radiographic
    marker methods give month-scale elongation (pritchett1992). Growth plate height and width correlate with tibial
    growth rate in both mouse and human radiographs (wilson2021). Nothing images cell turnover.
  what_is_missing: An in vivo readout of proliferation, hypertrophic volume, or matrix turnover in human physeal
    cartilage. Sodium and gagCEST MRI measure matrix proteoglycan but have not been validated against physeal
    kinetics; no PET tracer targets chondrocyte proliferation with sufficient resolution against adjacent bone
    uptake.
  nearest_evidence:
  - pritchett1992
  - wilson2021
  nearest_evidence_note: wilson2021 (human radiographic morphometry), MRI physeal imaging literature, circulating
    markers such as collagen X neoepitope and miRNA panels proposed but not anchored to a plate-level measurement.
  discriminating_experiment: 'Validate a candidate readout against ground truth in a large-animal model: in growing
    lambs with implanted microtransducers measuring elongation continuously, acquire serial ultra-high-field sodium/gagCEST
    MRI and matched serum collagen X neoepitope, then terminally measure hypertrophic cell volume stereologically.
    A readout that tracks measured elongation with r>0.8 across a manipulated range of growth rates (for example
    dexamethasone-suppressed versus control) is a candidate for human translation; anything weaker means human
    plate-level pharmacodynamics remain inaccessible.'
  tractability: 2
- gap_id: g_l1arch_015
  question: Does the growth plate contain lipochondrocytes, and if not, why does one cartilage lineage build its
    mechanics from intracellular lipid vacuoles while the physis does not?
  type: known_unknown
  layer: L1
  why_it_matters: Lipochondrocytes overturn the assumption that cartilage mechanics are set by extracellular matrix
    alone - in ear cartilage the cells themselves set stiffness, strength and resilience, and emptying their vacuoles
    nearly doubles the Young's modulus. The growth plate is the cartilage in which cells occupy the largest volume
    fraction and swell the most, so if intracellular contents can dominate cartilage mechanics anywhere, the hypertrophic
    zone is the obvious candidate. It bears directly on contradiction g_l5matrix_008, where the zonal stiffness
    gradient disagrees in direction between species and between measurement methods.
  what_is_known: Lipochondrocytes were characterised in mouse and rat ear, nose and trachea and confirmed in multiple
    mammals including humans, but not in non-mammalian tetrapods. They make lipid exclusively by de novo lipogenesis,
    do not enlarge with obesity, do not shrink with starvation, and lack lipid-mobilisation factors. Ear lipocartilage
    has a tensile Young's modulus of 3.25 +/- 0.38 MPa against 23.9 MPa for lipid-devoid meniscus and rib; delipification
    raises lipocartilage modulus from 3.27 to 5.79 MPa, tensile strength from 1.91 to 4.53 MPa and resilience
    from 0.38 to 1.77 MJ/m3 (ramos2025). Separately, the growth-plate hypertrophic chondrocyte is known to dilute
    its dry mass density from 0.183 to about 0.07 pg/fl during a swelling phase (cooper2013) - a large intracellular
    compositional change of a different kind.
  what_is_missing: The question has not been asked. ramos2025 is the study that established the cell type and
    it never examines the growth plate - the words growth plate, physis and epiphysis do not appear in it. So
    there is no positive evidence, no negative evidence, and no search. This is a known_unknown created by the
    scope of the discovery paper rather than by a failed search.
  nearest_evidence:
  - ramos2025
  - cooper2013
  nearest_evidence_note: ramos2025 (ear, nose, trachea; growth plate never examined); cooper2013 (growth plate,
    intracellular density change of a different mechanism - dilution, not lipid accumulation).
  discriminating_experiment: 'Stain murine and human growth-plate sections for neutral lipid (BODIPY, Oil Red
    O) alongside the lipochondrocyte markers ramos2025 defines, in the same sections and with ear cartilage as
    a positive control on the same slide. A negative in the physis is informative and cheap: it would establish
    that the hypertrophic chondrocyte''s volume increase is not a lipid phenomenon, which the dry-mass-dilution
    data already suggest but do not test directly. A positive in any zone would mean growth-plate mechanics have
    an intracellular determinant that no existing physeal finite-element model represents.'
  tractability: 5
- gap_id: g_l1arch_016
  question: What sets the aspect ratio of the terminal hypertrophic chondrocyte - the height-to-diameter ratio
    that hunziker1989 shows carries physiological change in growth rate - and can it be manipulated independently
    of cell volume?
  type: known_unknown
  layer: L1
  why_it_matters: This is the variable a physiological growth change actually moves, and no therapeutic programme
    targets it. CNP analogues and FGFR3 inhibitors are aimed at hypertrophic ENLARGEMENT, but hunziker1989 measured
    cell volume FALLING 13% while growth rate rose 20%. If aspect ratio rather than volume is the lever, the entire
    pharmacology of this field is aimed one axis away from the mechanism, and a compound that made terminal cells
    taller and narrower at constant volume would be a different class of agent from anything in development.
  what_is_known: 'Rat proximal tibia, 21 to 35 days, growth rate +20%: final cell height +23% (31.2 to 38.5 um,
    P<0.02), final lateral diameter -14% (29.9 to 25.6 um, P<0.03), final cell volume -13% (P<0.03), matrix per
    cell unchanged, cells produced per column per day unchanged, hypertrophic-phase duration unchanged at about
    two days (hunziker1989, n=6 per age). Derived aspect ratio rises from 1.04 to 1.50. The cell sits inside a
    pericellular matrix and a lattice of longitudinal septa that could in principle impose the anisotropy: perlecan
    is required for the pericellular matrix and for column formation (costell1999, arikawahirasaw2001), integrin
    beta1 is required for chondrocyte rotation and column formation (aszodi2003, greer2024), and cytoskeletal
    tension is required for rotation (greer2024).'
  what_is_missing: 'Everything causal. No experiment has manipulated pericellular matrix stiffness, septal anisotropy,
    cytoskeletal tension or cell-volume regulation and then measured terminal cell HEIGHT AND DIAMETER SEPARATELY
    together with bone elongation in the same animal. The atlas holds no node with a signed edge into cell height
    or aspect ratio at all - every shape-adjacent route (pericellular_matrix, cartilage_osmotic_swelling) terminates
    in hypertrophic_volume_increase and both are speculative and traversal-unusable. In human tissue the aspect
    ratio has never been measured: two studies report a height and disagree by 61% (C-L1-07) and neither reports
    the transverse diameter of the same cells. hunziker1989 itself has never been replicated in any species.'
  nearest_evidence:
  - hunziker1989
  - greer2024
  - costell1999
  - breur1991
  nearest_evidence_note: hunziker1989 (rat, the only measurement of the phenomenon); greer2024 and aszodi2003
    (cytoskeleton and integrin control of chondrocyte ROTATION, which is a shape-related process but not aspect
    ratio); costell1999 (perlecan and the pericellular matrix); breur1991 (the between-plate volume correlation
    this contradicts).
  discriminating_experiment: 'Two steps, the first of which is cheap. (i) REPLICATE hunziker1989 in a second species
    and a second laboratory, measuring terminal cell height and transverse diameter separately by stereology at
    two growth rates in the same animals. The entire reframing rests on one unreplicated 1989 study and it should
    not carry that weight. (ii) Then manipulate the candidate constraint - pericellular matrix stiffness by perlecan
    or collagen VI perturbation, septal anisotropy by controlled MMP exposure, or cell-volume regulation by an
    osmotic or ion-transport agent - and measure height, diameter, volume AND bone length in the same animals.
    The decisive outcome is any intervention that raises the height-to-diameter ratio at constant volume: if bone
    length rises with it, aspect ratio is a lever and a drug target; if bone length does not move, then hunziker1989''s
    correlation is a consequence of growth rate rather than a cause of it, and the reframing is wrong.'
  tractability: 3
