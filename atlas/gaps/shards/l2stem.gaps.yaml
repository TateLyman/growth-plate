gaps:
- gap_id: g_l2stem_001
  question: Which cell in the human growth plate resting zone, if any, self-renews and clonally generates chondrocyte
    columns over years, and does it express PTHLH?
  type: method_blocked
  layer: L2
  why_it_matters: Every functional statement in this layer - clonality, self-renewal, column founding, lifespan
    - comes from tamoxifen-inducible Cre lineage tracing in mice. The entire resting-zone-stem-cell edifice on which
    growth-plate exhaustion and fusion models rest is therefore unvalidated in the species the atlas is about, and
    the one human study that addresses it reports that the most stem-like human resting cells are PTHLH-negative,
    contradicting the dominant mouse marker.
  what_is_known: Mouse PTHrP-creER-labelled resting chondrocytes form clonal columns for at least a year, with ~2-3%
    showing long-term self-renewal (mizuhashi2018); FoxA2+ cells are a longer-lived upstream population (muruganandan2022).
    Human adolescent resting zone contains transcriptionally quiescent sub-populations (CHRDL2+, SFRP5+; avijgan2025)
    and two stem-like populations of which the upper 'root' population is PTHLH-negative and maps to mouse Prrx1+
    cells (chu2026).
  what_is_missing: Any clonal or self-renewal measurement made on human cells in their own tissue. Human evidence
    is entirely cross-sectional transcriptomics plus xenotransplantation of sorted cells into mice.
  nearest_evidence:
  - chu2026
  - chan2018
  - avijgan2025
  discriminating_experiment: Somatic-mutation phylogenetics on microdissected human growth plate. Take zone-resolved
    laser-capture or single-cell samples from paediatric growth plate tissue (surgical epiphysiodesis or post-mortem),
    deep-sequence to call somatic single-nucleotide variants, and reconstruct clonal lineage trees. Under the resting-zone
    stem cell model, cells within one column share private mutations absent from neighbouring columns, and resting-zone
    cells sit at the root of those trees. Under a consumption model with no resident stem cell, columns show no
    shared private variants distinguishing them from adjacent columns and resting-zone cells are terminal branches,
    not roots. A PTHLH-expressing root would support mouse-to-human marker transfer; a PTHLH-negative root would
    refute it.
  tractability: 3
  search_log_ref: g_l2stem_001
  nearest_evidence_note: 'chu2026: human single-cell/spatial identification plus mouse Prrx1 clonal tracing of a
    transcriptionally matched population. chan2018: human sorted cells assayed by serial renal-capsule xenotransplantation.
    avijgan2025: human resting cells shown to exit G0 ex vivo.'
- gap_id: g_l2stem_002
  question: What fraction of human trabecular and endosteal osteoblasts is derived from hypertrophic chondrocytes,
    and over what age range?
  type: quantitative_gap
  layer: L2
  why_it_matters: In mice this fraction is about 60%, which reassigns the majority of young trabecular bone to a
    cartilage origin and changes what a growth plate is for. If the human fraction is similar, growth plate biology
    is also bone-mass biology; if it is small, human bone accrual and mouse bone accrual are driven by different
    cells and mouse osteoporosis and growth models transfer poorly.
  what_is_known: 'Mouse: ~63% of trabecular and ~62% of endosteal osteocalcin+ osteoblasts at one month, and ~60%
    trabecular / ~68% endosteal Col1a1(2.3kb)-GFP+ osteoblasts at three weeks, are Col10a1-lineage (zhou2014a);
    confirmed qualitatively by independent inducible tracing (yang2014); the contribution ends at adolescence, after
    which LepR+ stroma dominates (shu2021).'
  what_is_missing: Any human number at all. No study has quantified chondrocyte-derived osteoblasts in human bone
    at any age.
  nearest_evidence:
  - zhou2014a
  - yang2014
  - shu2021
  discriminating_experiment: 'Apply single-cell multi-omic lineage inference to paediatric human bone: profile growth-plate
    hypertrophic chondrocytes and metaphyseal osteoblasts from the same specimen for both transcriptome and mitochondrial
    or nuclear somatic variants, then test whether osteoblast clones share variants with hypertrophic chondrocytes
    from the overlying plate. Expected under the mouse-like model: a majority of metaphyseal osteoblast clones share
    chondrocyte-private variants. Expected under a perichondrial-origin model: osteoblast clones share variants
    with periosteal or LepR-equivalent stromal cells instead.'
  tractability: 2
  search_log_ref: g_l2stem_002
  nearest_evidence_note: 'zhou2014a and yang2014: mouse lineage tracing giving the ~60% figure. shu2021: mouse dual-recombinase
    timing of the chondrocyte-to-LepR switch.'
- gap_id: g_l2stem_003
  question: Does secondary ossification centre formation causally confer stem-cell properties on resting-zone chondrocytes,
    or does it merely coincide in time with an autonomous developmental switch?
  type: search_established
  layer: L2
  why_it_matters: This claim is load-bearing for L7 fusion models, which use it to argue that the epiphyseal niche
    has a defined start and therefore a definable end. It is currently supported only by two temporal correlations
    in one species, and the atlas should not propagate a correlation as a mechanism into a downstream layer.
  what_is_known: Mouse PTHrP-creER colony-forming cells acquire robust in vitro self-renewal between a P9 pulse
    (3.3% secondary colonies, none passageable) and a P12 pulse (16.3%, 12.5% of those passageable nine times),
    described by the authors as coinciding with active SOC development (mizuhashi2018). Independently, clonal tracing
    shows a switch from progenitor depletion to stable monoclonal columns 'coinciding with the formation of the
    secondary ossification centre' (newton2019). FoxA2+ long-term stem cells sit at the cartilage/SOC interface
    (muruganandan2022).
  what_is_missing: Any experiment that perturbs SOC formation and then measures resting-zone stem cell behaviour.
    A Europe PMC search on 2026-08-05 for studies combining SOC ablation, blockade, prevention or delay with resting-zone
    or self-renewal readouts in mice returned zero records.
  nearest_evidence:
  - mizuhashi2018
  - newton2019
  - chan2015
  discriminating_experiment: Delay SOC formation genetically or pharmacologically without disturbing the growth
    plate - for example epiphysis-directed inhibition of cartilage-canal angiogenesis (local VEGF trap or Vegfa
    deletion restricted to epiphyseal chondrocytes) initiated at P4 - then at P12 and P18 assay (i) PTHrP-creER
    clonal column formation and (ii) secondary and serial colony-forming capacity of sorted resting chondrocytes.
    If SOC formation is causal, delayed SOC animals retain the P9-like phenotype (~3% secondary colonies, no serial
    passage) at P12-P18 and form only short transient columns. If the switch is autonomous, they reach the P12-like
    phenotype (~16% secondary colonies, passageable clones) on the normal schedule despite an absent or delayed
    SOC. A comparative version tests the same prediction across bones whose SOCs appear at different times within
    one animal.
  tractability: 4
  search_log_ref: g_l2stem_003
  nearest_evidence_note: 'mizuhashi2018 and newton2019: temporal coincidence only. chan2015: VEGF blockade shifts
    skeletal progenitor fate from bone to cartilage, showing vascular signals can steer progenitor fate, but never
    tested on the resting zone.'
- gap_id: g_l2stem_004
  question: Are the five published skeletal stem cell schemes - mSSC, PTHrP+/FoxA2+ resting chondrocytes, Grem1+
    OCR cells, LepR+ stroma and CTSK-lineage periosteal stem cells - distinct cell types, overlapping states of
    one lineage, or artefacts of different assays?
  type: contradiction
  layer: L2
  why_it_matters: Downstream layers need to know which cell to target and which mouse model reports on human biology.
    The schemes disagree on anatomy, adipogenic potential, developmental window and markers, and one immunophenotype
    (CD200+CD105-Thy-6C3-) is used for two anatomically different 'stem cells'. Without reconciliation, any therapeutic
    inference from this layer is arbitrary.
  what_is_known: mSSC is CD45-Ter119-Tie2-AlphaV+Thy-6C3-CD105-CD200+ and excludes fat (chan2015); the periosteal
    stem cell carries the same CD200+CD105-Thy-6C3- phenotype but is Ctsk-lineage and periosteal (debnath2018);
    Grem1+ OCR cells are metaphyseal, non-adipogenic and non-overlapping with Nestin-GFP cells (worthley2015); LepR+
    cells are perisinusoidal, make adipocytes, contribute nothing to developing cartilage and become the dominant
    osteoblast source only after adolescence (zhou2014, shu2021); PTHrP+ resting chondrocytes are Grem1-negative
    (mizuhashi2018); the human CD146+ definition includes adipogenesis (sacchetti2007, bianco2015) while the hSSC
    definition excludes it and reports CD146+ cells as poorer colony formers (chan2018).
  what_is_missing: A single study that applies all marker panels and all Cre drivers to the same animals at the
    same ages with the same functional assay, so that overlap can be measured rather than inferred across papers.
  nearest_evidence:
  - mizuhashi2018
  discriminating_experiment: 'Multiplexed intersectional fate mapping in one mouse cohort: combine Pthlh-creER,
    Grem1-creER, Lepr-cre, Ctsk-cre and FoxA2-creER with orthogonal recombinases and distinct reporters, plus full
    mSSC/PSC surface staining, sampling at P6, P12, P28 and 12 weeks, and score anatomical position, marker phenotype
    and clonal output for each labelled cell. Under the ''distinct cell types'' model, reporters remain mutually
    exclusive at all ages and each maps to one compartment. Under the ''states of one lineage'' model, early labelled
    cells convert between reporter identities with age in a directional sequence. Under the ''assay artefact'' model,
    surface phenotype fails to predict clonal output within any single Cre lineage.'
  tractability: 2
  nearest_evidence_note: 'mizuhashi2018 is the only cross-scheme quantification located: it measures overlap between
    PTHrP+ resting chondrocytes and the mSSC/pre-BCSP/BCSP tiers and excludes Grem1 co-expression.'
- gap_id: g_l2stem_005
  question: Do human resting zone chondrocytes have a finite, division-denominated proliferative capacity, or can
    they renew indefinitely until fusion terminates them?
  type: search_established
  layer: L2
  why_it_matters: This is the pivot between the two available accounts of why human growth stops. If capacity is
    finite, adult height is set by a spendable budget and interventions that spare divisions raise final height.
    If capacity is renewable, height is set by the timing of the fusion trigger and sparing divisions achieves nothing.
  what_is_known: Rabbit resting zone chondrocytes fall in proliferation rate and number with age (schrier2006),
    the decline is division-dependent rather than age-dependent (baron1994, gafni2001, marino2008), and it is not
    a cell-autonomous Hayflick limit, since cultured rabbit RZ chondrocyte population doublings are independent
    of donor age (nilsson2005). Mouse clonal tracing found progenitors acquiring self-renewal postnatally rather
    than only spending down a budget (newton2019).
  what_is_missing: Any measurement of proliferative capacity, division history or clone size in human growth plate
    tissue. A Europe PMC search on 2026-08-05 combining human, growth plate/resting zone and clonal/self-renewal/proliferative-capacity
    terms returned 213 records of which none was a primary human measurement of resting-zone proliferative or clonal
    capacity.
  nearest_evidence:
  - avijgan2025
  - nilsson2005
  - schrier2006
  discriminating_experiment: 'Paired-age human growth plate biopsies (early puberty vs late puberty, e.g. from epiphysiodesis
    series) assayed two ways: (i) division-history reconstruction by somatic mutation burden or by methylation-clock-based
    division counters in sorted resting-zone cells; (ii) ex vivo serial colony formation of sorted resting-zone
    cells. Under finite capacity, late-pubertal cells show higher accumulated division counts and markedly fewer
    serial colonies than early-pubertal cells from the same anatomical site. Under renewable capacity, serial colony
    output is preserved across pubertal stage and division counts plateau.'
  tractability: 3
  search_log_ref: g_l2stem_005
  nearest_evidence_note: 'avijgan2025: human resting cells can exit G0 ex vivo under defined conditions - the closest
    existing functional readout on human tissue. nilsson2005 and schrier2006: rabbit population-level measurements.'
- gap_id: g_l2stem_006
  question: Is resting zone stem cell depletion a cause of epiphyseal fusion or a consequence of it?
  type: known_unknown
  layer: L2
  why_it_matters: L7 depends on the answer. If depletion causes fusion, the therapeutic target is progenitor conservation.
    If fusion is imposed by an oestrogen-driven programme on a plate that still has capacity, the target is the
    trigger, and every attempt to raise adult height by sparing progenitors is misdirected.
  what_is_known: 'Rabbit resting-zone cells decline numerically and functionally with age (schrier2006) and the
    field''s canonical model states depletion then fusion (nilsson2004). Against a simple causal chain: rodents
    senesce almost to cessation but never fuse (emons2011), so depletion is not sufficient for fusion; and oestrogen
    accelerates senescence while slowing resting-zone proliferation (schrier2006), the opposite of a pure consumption
    model.'
  what_is_missing: A measurement of resting zone cell number and proliferative capacity at the moment of fusion,
    compared between plates fusing early and late, in a species that fuses.
  nearest_evidence:
  - schrier2006
  - emons2011
  discriminating_experiment: In rabbits, induce early fusion with exogenous oestradiol and delay fusion with an
    aromatase inhibitor, then at the histological moment of bony bridging in each group measure resting zone cell
    number per unit area, BrdU labelling index, and ex vivo serial colony capacity, against untreated animals at
    their own fusion point. If depletion causes fusion, all groups fuse at the same low resting-cell number and
    colony capacity regardless of chronological age. If fusion is imposed, oestradiol-treated plates fuse while
    retaining significantly higher resting cell number and colony capacity than controls.
  tractability: 4
  nearest_evidence_note: 'schrier2006: age- and treatment-dependent rabbit resting-zone depletion. emons2011: the
    rodents-senesce-without-fusing argument.'
- gap_id: g_l2stem_007
  question: Does telomere length shorten, or telomerase activity fall, in human growth plate chondrocytes with age
    or with proximity to fusion?
  type: search_established
  layer: L2
  why_it_matters: Telomere attrition is the mechanism most often asserted in reviews for the growth plate's finite
    proliferative capacity. If it is unmeasured in humans, the atlas must carry the claim as grade X rather than
    as mechanism, and downstream reasoning about senolytics or telomerase manipulation in growth disorders has no
    foundation.
  what_is_known: Mouse mTert-GFP marks a transitional skeletal progenitor population whose expression peaks during
    adolescent bone growth (carlone2021). Rabbit resting-zone chondrocyte replicative capacity in culture is independent
    of donor age, which is difficult to reconcile with progressive telomere-driven exhaustion (nilsson2005).
  what_is_missing: Any primary measurement of telomere length or telomerase activity in human growth plate chondrocytes.
    A Europe PMC search on 2026-08-05 returned 218 records, all of which were osteoarthritic articular cartilage,
    general skeletal ageing reviews, or rodent studies.
  nearest_evidence:
  - carlone2021
  - nilsson2005
  discriminating_experiment: 'Zone-resolved telomere measurement on banked human growth plate tissue: apply quantitative
    FISH for telomere signal intensity, plus TRAP or TERT in-situ detection, to resting, proliferative and hypertrophic
    zones across a paediatric age series spanning pre-pubertal to near-fusion. If telomere attrition underlies the
    finite capacity, resting-zone telomere signal declines monotonically with age and is lowest near fusion. If
    the limit is epigenetic rather than telomeric, resting-zone telomere signal is stable across the series while
    global methylation falls, mirroring the rabbit result.'
  tractability: 4
  search_log_ref: g_l2stem_007
  nearest_evidence_note: 'carlone2021: mouse mTert-GFP reporter. nilsson2005: rabbit, indirect and negative for
    a replicative clock.'
- gap_id: g_l2stem_008
  question: How many cell divisions of proliferative capacity does a human growth plate resting-zone progenitor
    start with, and how many are spent per centimetre of bone elongated?
  type: quantitative_gap
  layer: L2
  why_it_matters: The finite-capacity model is stated qualitatively everywhere and quantified nowhere. Without a
    division budget and a cost-per-centimetre, the model makes no falsifiable prediction about final height, cannot
    be used to estimate how much height a period of growth suppression conserves, and cannot be compared across
    species.
  what_is_known: 'The model is division-dependent rather than age-dependent (baron1994, gafni2001, marino2008),
    and resting-zone cells are numerically depleted with age in rabbit (schrier2006). Mouse data give clone-level
    rather than division-level numbers: labelled column number plateaus at about six months of chase and roughly
    2-3% of PTHrP+ colony-forming cells self-renew long term (mizuhashi2018).'
  what_is_missing: A division count. No study in any species reports the total number of divisions a resting-zone
    progenitor undergoes, nor divisions consumed per unit of longitudinal growth.
  nearest_evidence:
  - hallett2021
  - mizuhashi2018
  - baron1994
  discriminating_experiment: 'Combine H2B-GFP dilution kinetics with quantified longitudinal growth in mice across
    the whole growth period: measure divisions per resting-zone cell per week by label dilution, and tibial elongation
    by calcein double-labelling, over P7 to 12 months, then compute divisions per millimetre elongated and integrate
    to a lifetime budget. Repeat in rabbit, which fuses, to test whether the budget is exhausted at fusion. A model
    in which capacity is finite predicts a species-specific total that is reached at growth cessation; a model in
    which capacity is renewable predicts no ceiling and a growth arrest that occurs at a division count well below
    any plateau.'
  tractability: 3
  nearest_evidence_note: hallett2021 provides the per-division measurable (H2B-EGFP halves 2.03-fold per division;
    label-retaining decay half-life 0.99-1.18 weeks), which is the assay that could generate the number in mouse.
    mizuhashi2018 gives clone-level rather than division-level numbers. baron1994 establishes division-dependence.
- gap_id: g_l2stem_009
  question: Does the hSSC surface panel (PDPN+CD146-CD73+CD164+) label human resting zone chondrocytes, or only
    pre-hypertrophic and hypertrophic zone cells as originally reported?
  type: search_established
  layer: L2
  why_it_matters: Mouse work places the growth plate stem cell in the resting zone; the human SSC was localised
    to the pre-hypertrophic and hypertrophic zones of a fetal femur. Either the human and mouse growth plate stem
    cells occupy different zones - a major biological difference - or one of the two localisations is an assay artefact.
    Any translational use of the hSSC panel for growth disorders depends on which.
  what_is_known: chan2018 scored human fetal femur cells against 76 mSSC/mBCSP orthologues and found the highest
    homology in p-H2 and H1, then confirmed by flow cytometry that PDPN+CD146-CD73+CD164+ cells are enriched there
    and depleted in the diaphysis. Separately, human resting zone stem-like populations have been described transcriptionally
    and are PTHLH-negative (chu2026, avijgan2025), but their PDPN/CD73/CD164 status is not reported in the retrieved
    material.
  what_is_missing: Direct co-localisation of the hSSC panel with resting-zone identity in postnatal human growth
    plate. A Europe PMC search on 2026-08-05 combining PDPN, CD164, CD73 with resting zone/reserve zone/PTHrP terms
    returned 36 records, all reviews or unrelated periosteal and marrow studies; no primary study places the hSSC
    panel in the resting zone.
  nearest_evidence:
  - chan2018
  - ambrosi2025
  - chu2026
  discriminating_experiment: Multiplex immunofluorescence and zone-resolved flow cytometry on postnatal human growth
    plate (epiphysiodesis specimens), staining PDPN, CD146, CD73, CD164 alongside a resting-zone identity marker
    set from human spatial transcriptomics, with microdissected zones sorted and assayed for serial colony formation.
    If the hSSC is a resting-zone cell, the PDPN+CD146-CD73+CD164+ fraction is enriched in the resting zone and
    carries the serial colony activity. If the original localisation is correct, that fraction remains enriched
    in the pre-hypertrophic/hypertrophic zones and resting-zone colony activity resides in a panel-negative population
    - which would mean the human growth plate contains two unrelated 'stem cell' populations in different zones.
  tractability: 3
  search_log_ref: g_l2stem_009
  nearest_evidence_note: 'chan2018: fetal pre-hypertrophic/hypertrophic localisation of the hSSC panel. ambrosi2025:
    hSSC composition across ten sites but not zone-resolved within the growth plate. chu2026: human resting-zone
    stem-like cells described with a different marker set.'
- gap_id: g_l2stem_010
  question: What fraction of resting zone chondrocytes is genuinely long-term self-renewing in vivo, and is the
    low in vitro figure (~2-3%) an underestimate imposed by culture?
  type: quantitative_gap
  layer: L2
  why_it_matters: The size of the true stem pool sets how much reserve a growth plate has and how much of catch-up
    growth is possible. The only quantitative figures come from colony passaging, which is an ex vivo proxy, and
    different markers give order-of-magnitude different answers (2-3% for PTHrP+, 9% of colonies for FoxA2+), so
    the field currently has no agreed denominator.
  what_is_known: 'PTHrP-creER P12-pulse colonies: 16/98 (16.3%) formed secondary colonies and 2/16 (12.5%) passaged
    nine times, yielding the authors'' ~2-3% long-term self-renewal figure (mizuhashi2018). FoxA2+ colonies: 10/112
    (8.9%) reached passage 9 or beyond versus 2/143 (1.4%) of PTHrP+ colonies reaching passage 5 (muruganandan2022).
    In vivo, labelled column number declines to a plateau by about six months (mizuhashi2018) and the durable label-retaining
    fraction plateaus at 2.6% (hallett2021).'
  what_is_missing: An in vivo estimate of the self-renewing fraction that does not depend on culture. The agreement
    between the 2.6% label-retaining plateau and the 2-3% colony figure is suggestive but the two measure different
    things and have never been reconciled in the same animals.
  nearest_evidence:
  - hallett2021
  - mizuhashi2018
  - muruganandan2022
  discriminating_experiment: Very-low-density Confetti or Rainbow labelling in Pthlh-creER and FoxA2-creER mice
    with quantitative clone-size distribution analysis at 1, 3, 6 and 12 months, fitted to a neutral drift model
    to estimate the number of functional stem cells per plate directly. Under a 2-3% stem fraction, the fitted stem
    cell number matches 2-3% of resting-zone cells and clone sizes follow the scaling expected for neutral competition.
    If culture is underestimating, the fitted in vivo stem number is substantially larger and clone-size distributions
    are broader than a 2-3% pool can generate.
  tractability: 4
  nearest_evidence_note: 'hallett2021: label-retention kinetics in vivo. mizuhashi2018 and muruganandan2022: ex
    vivo colony passaging.'
- gap_id: g_l2stem_011
  question: Does any non-murine mammal show the postnatal clonal switch to self-renewing resting-zone progenitors,
    and specifically does it occur in a species that fuses its growth plates?
  type: species_gap
  layer: L2
  why_it_matters: Mice never fuse. Every clonal and self-renewal result in this layer therefore comes from an animal
    that lacks the outcome the atlas is trying to explain. If the clonal switch is a feature of non-fusing rodents,
    the whole resting-zone stem cell framework may not describe human growth at all.
  what_is_known: The clonal switch and the SOC coincidence are documented only in mouse (mizuhashi2018, newton2019).
    The only non-murine mammalian datum located is that FoxA2 immunoreactivity is present at the equivalent anatomical
    position in rabbit, with no functional or clonal data (muruganandan2022). Rabbits fuse; rodents do not (emons2011).
  what_is_missing: Clonal lineage tracing, or any equivalent clone-resolving measurement, in a fusing mammal.
  nearest_evidence:
  - muruganandan2022
  - schrier2006
  - emons2011
  discriminating_experiment: 'Clone-resolving analysis in rabbit growth plate without transgenesis: use naturally
    occurring somatic mutation or X-inactivation mosaicism in female rabbits, sampling microdissected columns before
    SOC completion, mid-growth and at fusion, and test whether columns become clonal after SOC formation as in mouse.
    If the switch is conserved, columns sampled after SOC completion are monoclonal by mosaicism marker and remain
    so until fusion. If it is a rodent peculiarity, rabbit columns remain polyclonal throughout, and the resting-zone
    stem cell framework should be restricted to non-fusing species until human data exist.'
  tractability: 2
  nearest_evidence_note: 'muruganandan2022: rabbit FoxA2 immunostaining only, no clonal data. schrier2006: rabbit
    resting-zone kinetics, population-level not clonal. emons2011: rabbits fuse, rodents do not.'
- gap_id: g_l2stem_population_asymmetry_human
  question: Does the human growth plate stem pool renew by population asymmetry, and if so what is the self-renewal
    probability and the equilibrium pool size?
  type: known_unknown
  layer: L2
  why_it_matters: This is the question that decides whether final height has a fixed ceiling. If human growth plate
    stem cells renew by INVARIANT asymmetry, the pool size is a constant of the tissue and the only levers on height
    are velocity and duration - which is where every intervention in this atlas already lives, and where every one
    of them tops out at 2-4%. If they renew by POPULATION asymmetry, the pool size is a set-point determined by
    the ratio of self-renewing to lineage-restricted divisions, and that ratio becomes a target that nothing has
    ever been aimed at. chu2025 shows the mouse uses population asymmetry. The mouse growth plate never closes.
  what_is_known: 'chu2025, mouse: labelling all Col2a1+ cells in Col2-CreERT2;R26R-Confetti and chasing a month
    gives the population-asymmetry signature - clone number falls while clone size rises. GH shifts divisions toward
    the committed side and depletes the slow-cycling label-retaining pool and the PTHrP+ population, and GHR deletion
    in PTHrP+ cells impairs clone formation, so the shift is cell-autonomous. mizuhashi2018 independently shows
    labelled column number falling to a plateau by 6 months with a persisting minority, which is the same signature
    seen from the exhaustion end, and puts long-term self-renewing cells at roughly 2-3% of PTHrP+ colony-forming
    cells.'
  what_is_missing: (1) ANY HUMAN OBSERVATION. Clonal genetic labelling cannot be done in a person, so the direct
    experiment is unavailable and the question has simply never been asked. (2) A FITTED PARAMETER IN ANY SPECIES.
    The mouse result is a qualitative signature. No self-renewal probability, loss rate or equilibrium pool size
    has been fitted, so nothing from this can enter a quantitative model of final height. (3) THE SAME MEASUREMENT
    IN A PLATE THAT CLOSES. Every clonal number in this atlas comes from mouse, whose growth plate remains open
    for life. Rat, rabbit and sheep plates cease growing and fuse; none has been clonally traced. (4) WHETHER THE
    RENEWAL FRACTION CAN BE MOVED UPWARD. GH moves it downward. Nothing has been tested for the opposite direction,
    and that is the untried half of the only lever that is not velocity or duration.
  nearest_evidence:
  - chu2025
  - mizuhashi2018
  nearest_evidence_note: chu2025 establishes the renewal mode in mouse and that it is drug-movable. mizuhashi2018
    supplies the only long-chase clone-loss curve. Neither has a human counterpart and neither fits a parameter.
  discriminating_experiment: SOMATIC MUTATION PHYLOGENY IN HUMAN GROWTH PLATE. Clone structure has been reconstructed
    in human blood, gut, liver and skin from somatic mutations accumulated in single cells or microdissected clones,
    without any genetic labelling. The same approach applied to growth plate tissue - which is obtainable from epiphysiodesis
    surgery, the source of the only human growth plate scRNA-seq that exists - would give clone-size distributions
    directly, and clone-size distribution is exactly what separates invariant from population asymmetry. It requires
    laser-capture or single-cell whole-genome sequencing rather than transcriptomics, and it requires more than
    one donor age. FAILING THAT, the cheaper animal experiment is Confetti-equivalent clonal tracing in a RAT, whose
    growth plate actually ceases growing, to test whether the mouse renewal mode is a property of growth plates
    or a property of a plate that never has to close.
  tractability: 3
- gap_id: g_l2stem_renewal_fraction_lever
  question: Can the ratio of self-renewing to lineage-restricted stem cell divisions in the growth plate be shifted
    TOWARD self-renewal, and does doing so raise final bone length?
  type: known_unknown
  layer: L2
  why_it_matters: 'Every pharmacological lever in this atlas acts on velocity or on duration and each tops out at
    a few per cent. Population asymmetry opens a third: the size of the stem compartment itself. It is known to
    be movable because growth hormone moves it - downward. NOBODY HAS TRIED TO MOVE IT UPWARD. That is a gap in
    the experimental record rather than a negative result, and it is the single most direct restatement of the question
    this atlas exists to answer.'
  what_is_known: 'chu2025: GH shifts growth plate stem cell divisions toward the lineage-restricted side, reducing
    label-retaining cells and PTHrP+ cell number while raising clone size in all zones. The shift is cell-autonomous
    - GHR deletion in PTHrP+ cells impairs clone formation. So the division-fate ratio is under endocrine control
    and responds within 10 days. growth_plate_senescence holds that plate senescence is DIVISION-dependent rather
    than time-dependent, which is what makes the size of the pool and the rate at which it is spent the same currency.'
  what_is_missing: (1) ANY AGENT TESTED FOR THE OPPOSITE DIRECTION. No compound, schedule or genetic manipulation
    has been assayed for INCREASING the self-renewing fraction in growth plate. (2) WHETHER A LARGER POOL PRODUCES
    A LONGER BONE. The causal link from pool size to final length is assumed throughout the field and has not been
    demonstrated by expanding the pool and measuring the bone. It could saturate. (3) SCHEDULE. GH is given daily
    for years. If depletion tracks cumulative committed divisions, intermittent dosing might buy the same velocity
    for less of the pool - and intermittent versus daily GH has been compared for height but never for the stem
    compartment. (4) THE CEILING. Whether the pool or something downstream of it is what actually limits final height
    in a human is not established, so an intervention that expanded the pool might change nothing.
  nearest_evidence:
  - chu2025
  - mizuhashi2018
  nearest_evidence_note: chu2025 is the only demonstration that the division-fate ratio in growth plate is movable
    at all, and it moves it the wrong way for height.
  discriminating_experiment: 'THE CHEAP VERSION FIRST, AND IT NEEDS NO NEW ANIMAL: re-analyse the existing intermittent-versus-daily
    GH comparisons for anything that reports growth AFTER treatment stops, since a spent pool should show up as
    a shorter remaining growth period rather than a lower velocity during treatment. THEN the animal experiment:
    in Pthrp-mCherry or H2B-GFP mice, screen candidate agents for an INCREASE in label-retaining cell number after
    a fixed exposure - the same readout chu2025 used to detect the decrease, run in the opposite direction. Any
    hit is then taken to a bone-length endpoint in an animal whose plate closes, because a larger pool that never
    converts to a longer bone is not a height intervention.'
  tractability: 2
- gap_id: g_l2_human_progenitor_reservoir
  type: species_gap
  layer: L2
  tractability: 1
  question: Does a human growth plate have a progenitor reservoir outside the cartilage, and can it be seen in tissue
    that is already collected?
  why_it_matters: qu2025 shows in mouse that the long-lived progenitors driving postnatal growth descend from Gli1+
    cells that are dormant through fetal life, that damage to the cartilage recruits them, and that they originate
    from Pdgfra+ cells OUTSIDE the cartilage. If a human equivalent exists, the division budget is not a closed
    quantity and can in principle be added to - which is the only mechanism this atlas holds that could raise the
    ceiling rather than merely defer it. If no human equivalent exists, the budget is closed and the ceiling stands.
  what_is_known: 'qu2025, mouse: Gli1-lineage cells expand into the cartilage with a resting-zone bias under cartilage-targeted
    p21 arrest, enrich the Ki67+ fraction and restore normal growth; the reparative cells arise from Pdgfra+ cells
    outside the cartilage. nilsson2005, rabbit: resting-zone chondrocyte population doublings do not depend on donor
    age, so the proliferative limit is not carried by the cell. This atlas already holds groove_of_ranvier and perichondrial
    nodes describing the anatomical neighbourhood in which such a reservoir would sit.'
  what_is_missing: 'PARTLY ANSWERED 2026-08-06 BY THIS ATLAS''S OWN RE-ANALYSIS, AND THE ANSWER SPLITS THE QUESTION
    IN TWO. (1) A HUMAN STROMAL POPULATION EXISTS - GSE288028, four directly processed libraries, 27,620 cells,
    harmony-corrected, per-library ambient reference; cluster 0, 1,374 cells in three donors, COL1A1 573x enriched
    over chondrocytes, PRRX1 13x, PDGFRA-positive in 78%, COL2A1 at its own donors'' ambient floor. (2) IT IS
    HEDGEHOG-NEGATIVE. GLI1 0.30, PTCH1 0.08, HHIP 0.03, GLI2 0.22 relative to chondrocytes. Every direct target
    is DEPLETED, and GLI1 is the marker by which the mouse reserve is identified, traced and recruited. STILL
    MISSING - (a) POSITION, since dissociated scRNA-seq infers "outside the cartilage" from transcriptome and no
    image places these cells relative to the plate; (b) WHETHER THE POPULATION IS RECRUITABLE, since qu2025 recruits
    it by cartilage DAMAGE and no human sample can be taken under that condition, so a population that is
    Hedgehog-off at rest is not thereby shown to be Hedgehog-unresponsive; (c) THE CONSTITUTION WINDOW, since the
    biopsies are 12-14 y and Tanner 2-4 while the mouse reserve is constituted at about 3 postnatal weeks;
    (d) DONOR3, the most cartilage-rich library, is EXCLUDED because it holds 9 immune cells and its ambient floor
    cannot be measured (CORR-021); (e) INDEPENDENT REPLICATION in a second human cohort.'
  nearest_evidence:
  - qu2025
  - avijgan2026br
  - chu2026
  - nilsson2005
  nearest_evidence_note: The mouse result is strong and the human tissue that could test it has already been collected
    and sequenced by two groups for other purposes.
  discriminating_experiment: LOOK IN DATA THAT ALREADY EXISTS. avijgan2026br applied Visium and Visium HD to human
    growth plate biopsies and their sections span the plate AND the surrounding tissue and secondary ossification
    centre - the spatial data therefore already contains whatever GLI1+ or PDGFRA+ population sits outside the cartilage,
    and their code and data are public on GitHub. chu2026 sequenced 23,625 cells from four donors including non-chondrocyte
    clusters. THE RE-ANALYSIS HAS NOW BEEN RUN AND THE CHEAP ROUTE IS SPENT - it took three instruments,
    four guard failures and four corrections (CORR-018 through CORR-021) to reach a readable answer, and the spatial
    data proved too shallow for Hedgehog components at PTCH1 45 and GLI1 60 pooled counts across 14 sections. THE
    REMAINING EXPERIMENT IS NO LONGER FREE AND IS NOW SPECIFIC. (1) A targeted in-situ panel - Xenium or RNAscope -
    for GLI1, PTCH1, PDGFRA, COL1A1 and COL2A1 on an INTACT human growth plate section, which supplies the position
    that dissociation destroys and the depth that RRST lacks. (2) chu2026's explant, which survives two months,
    INJURED and then assayed for GLI1 induction - the mouse result is about recruitment on damage, and nothing
    observed at rest can test it. (3) A younger human cohort, to sample the window in which the reserve would be
    constituted rather than the pubertal window in which it would already be spent.
- gap_id: g_l2_larger_pool_with_intact_flux
  type: known_unknown
  layer: L2
  tractability: 3
  question: Does a LARGER resting-zone stem pool with INTACT flux produce a longer bone, and has any experiment ever
    created that condition?
  why_it_matters: The therapeutic instinct behind every depletion argument is to enlarge the stem pool. Three independent
    mouse perturbations show pool size and bone growth moving in OPPOSITE directions, but none of them tested the
    informative condition. orikasa2024 enlarged the pool and the descendants discharged into BONE, so flux was diverted;
    horike2026 enlarged the pool by BLOCKING exit, so flux was abolished. In neither case was the pool enlarged while
    cells continued to enter cartilage columns normally. Until that cell of the table is filled, this atlas cannot say
    whether pool expansion is a dead end or merely untested, and that distinction decides whether the reservoir
    programme has any therapeutic future at all.
  what_is_known: 'chu2025, mouse: GH depletes the slow-cycling pool while raising elongation rate, and the pool renews
    by population asymmetry so its size is a regulated variable. orikasa2024, mouse: Ptch1 deletion in PTHrP+ resting
    chondrocytes widens columns to 5-6 cells with growth plate hyperplasia, no significant bone length change, transient
    hyperplasia, and conversion of descendants to trabecular osteoblasts. horike2026, mouse: the Fgfr3 achondroplastic
    resting zone is expanded because progeny cannot exit, bones are significantly shorter, and a CREB inhibitor shrinks
    the zone while restoring growth. nilsson2005, rabbit: resting-zone chondrocyte population doublings do not depend
    on donor age, so the proliferative limit is imposed by the plate rather than carried by the cell.'
  what_is_missing: An experiment that ENLARGES the resting-zone pool WITHOUT diverting its output to bone and WITHOUT
    blocking exit, and then measures FINAL bone length rather than plate morphology. Also missing - (a) any equivalence
    test on bone length in orikasa2024, which reports a null rather than a bound; (b) whether the flux rate itself
    has a ceiling independent of pool size, which would make pool expansion useless even if achieved; (c) whether the
    integral of flux over the whole growth period, rather than either variable at a moment, is the quantity that final
    height is proportional to - which is the version of the model this atlas actually needs and which no experiment
    has yet measured end to end.
  nearest_evidence:
  - chu2025
  - orikasa2024
  - horike2026
  - nilsson2005
  nearest_evidence_note: Three unrelated perturbations in three laboratories agree on the direction, and none of them
    tested the condition that matters. The absence is structural rather than accidental - each experiment enlarged
    the pool as a SIDE EFFECT of blocking or diverting flux, because that is how pools get enlarged.
  discriminating_experiment: In mouse, raise the self-renewal fraction of PTHrP+ or CD73+ resting cells without altering
    their differentiation route or their exit rate, then measure final bone length at skeletal maturity rather than
    plate height at an interim timepoint. A cell-cycle or niche manipulation restricted to the renewal decision is the
    requirement; every Hedgehog, FGFR3 or Wnt manipulation tried so far also changes fate or exit and therefore cannot
    answer it. The cheaper partial version is to re-analyse orikasa2024's and horike2026's own animals for an
    equivalence bound on bone length, which converts two weak nulls into a quantitative statement.
- gap_id: g_l2_recruit_reserve_pharmacologically
  type: known_unknown
  layer: L2
  tractability: 3
  question: Can the progenitor reservoir be recruited without damaging the plate - and does recruiting it produce
    a LONGER bone rather than merely a normal one?
  why_it_matters: 'In qu2025 the reserve is mobilised by injury: cartilage-targeted cell-cycle arrest. The compensation
    restores NORMAL growth, it does not exceed it. Two things therefore remain unknown and they are the whole therapeutic
    question. Whether the trigger can be supplied pharmacologically rather than by damage, and whether a reservoir
    recruited into an UNDAMAGED plate adds length or is simply held in reserve unused. A repair mechanism that restores
    normal is not the same as a mechanism that exceeds normal, and this atlas should not conflate them.'
  what_is_known: 'qu2025: Gli1+ cells expand and normalise growth after p21-induced arrest, arising from Pdgfra+
    cells outside the cartilage; the authors state the aim as "stimulating the expansion of the pool of LLCPs at
    the right time and location". osk2026: AAV-delivered OSK in mouse knee lowers chondrocyte senescence and DNMT
    expression through TET2 WITHOUT inducing stemness genes - a demonstrated in vivo reprogramming technique in
    cartilage. chu2025: the growth plate stem pool renews by population asymmetry, so its number is a regulated
    variable and GH moves it downward.'
  what_is_missing: (1) A NON-DAMAGING TRIGGER. Every mobilisation shown is injury-driven. (2) WHETHER RECRUITMENT
    INTO A HEALTHY PLATE LENGTHENS IT. Nobody has expanded the pool in an undamaged animal and measured bone length.
    (3) THE SIGNAL. Hedgehog is implied by the Gli1 marker but the paper does not show that Hedgehog agonism recruits
    the reserve. (4) OSK IN A GROWTH PLATE. Never delivered; the tissue differs from articular cartilage in exactly
    the property at issue. (5) THE OBVIOUS HAZARD - Gli1 and Hedgehog signalling are oncogenic in bone and cartilage,
    and osteosarcoma arises from this lineage during rapid growth. No route here is safe by default.
  nearest_evidence:
  - qu2025
  - osk2026
  - chu2025
  - chu2026
  nearest_evidence_note: Two demonstrated techniques - reserve mobilisation by injury, and local partial reprogramming
    - neither aimed at elongation and neither combined.
  discriminating_experiment: THE ORDER MATTERS AND THE CHEAP STEP COMES FIRST. (1) Re-analyse the published human
    spatial and single-cell data for a GLI1+/PDGFRA+ population adjacent to the human resting zone - gap g_l2_human_progenitor_reservoir
    - because a negative answer stops the programme. (2) IN THE HUMAN EXPLANT, which survives two months and has
    a cartilage-expansion endpoint, test whether a Hedgehog agonist or AAV-OSK changes the resting-zone label-retaining
    fraction. The explant is already an injured tissue - it has been cut - so it may be a permissive rather than
    a neutral setting, and that must be controlled with uncut organ culture. (3) ONLY THEN the animal question,
    and it must be asked in an UNDAMAGED animal with BONE LENGTH as the endpoint, because restoring normal growth
    after injury and exceeding normal growth are different results and the first has been mistaken for the second
    before.
