searches:

- gap_id: g_l9organism_001
  database: Europe PMC
  exact_query_string: '("growth plate" OR physis) AND ("chondrocyte proliferation" OR "cell kinetics" OR "hypertrophic volume") AND ("cm/year" OR "height velocity" OR "stature") AND (model OR simulation OR multiscale)'
  filters: 'format=json, resultType=lite, pageSize=10, no date limit'
  date_run: '2026-08-05'
  hit_count: 560
  screened_count: 10
  reason_none_qualified: >-
    The first ten hits, ranked by relevance, are clinical growth-hormone outcome studies
    (42243538, 42073123, 42279040), narrative reviews of short stature (40723048, 40310145) and
    murine growth plate molecular biology with no organism-level endpoint (41342396, 41641077,
    41864337). None computes a human height velocity in cm/yr from measured cellular parameters.
    The corpus splits cleanly into clinical auxology without cell biology and rodent cell biology
    without a stature endpoint, which is precisely the scale gap being asserted.

- gap_id: g_l9organism_002
  database: Europe PMC
  exact_query_string: '("Preece-Baines" OR SITAR OR "ICP model" OR "JPA-2") AND (residual OR "goodness of fit" OR RMSE) AND comparison AND (same OR identical) AND (cohort OR individuals)'
  filters: 'format=json, resultType=lite, pageSize=10, no date limit'
  date_run: '2026-08-05'
  hit_count: 132
  screened_count: 10
  reason_none_qualified: >-
    Hits are applications of a single model to a new cohort (40170793 Ethiopian SITAR, 38812046
    Cracow, 40695558 antenatal steroids), a new method benchmarked against one comparator
    (41232372 People-Like-Me, 38302887 modified Michaelis-Menten, P-splines preprint) or entirely
    off-topic (42164255, 41675598 equivalents). No paper fits ICP, Preece-Baines, JPA-2 and SITAR
    to one dataset and tabulates residual SD for all four; in particular no residual SD for the
    ICP model or for JPA-2 appears anywhere in the screened set.

- gap_id: g_l9organism_004
  database: Europe PMC
  exact_query_string: '("target height" OR "midparental height") AND ("residual standard deviation" OR "prediction interval" OR "limits of agreement") AND (adult height) AND (cohort OR population-based)'
  filters: 'format=json, resultType=lite, pageSize=10, no date limit'
  date_run: '2026-08-05'
  hit_count: 23
  screened_count: 10
  reason_none_qualified: >-
    Every screened hit concerns the accuracy of adult height PREDICTION FROM BONE AGE (36701990,
    35103904, 41390355, 38169882) or is a conference abstract collection (40986224 and two
    untitled abstract records). None reports the residual SD of adult offspring height about a
    corrected mid-parental target height in a population-representative sample. The only direct
    empirical estimate located anywhere in this sweep remains zeevi2024 (23 large Jewish nuclear
    families), which is exactly the narrowness the gap asserts.

- gap_id: g_l9organism_006
  database: Europe PMC
  exact_query_string: '"catch-up growth" AND ("rate constant" OR "time constant" OR monomolecular OR "exponential") AND human AND (children OR prepubertal)'
  filters: 'format=json, resultType=lite, pageSize=10, no date limit'
  date_run: '2026-08-05'
  hit_count: 131
  screened_count: 10
  reason_none_qualified: >-
    The top hit is wit2021 itself (32936765), which reports that the rate constant k differs
    between diseases but does not publish numerical k values or confidence intervals. The
    remaining hits are catch-up fat and thermogenesis (40418496), altitude growth (41070017),
    twin cognitive-physical recovery (38303087) and unrelated clinical topics. No paper reports an
    absolute rate constant for human linear catch-up growth, and none regresses k on the duration
    of the preceding growth suppression.

- gap_id: g_l9organism_007
  database: Europe PMC
  exact_query_string: '(infant OR infancy) AND ("centile crossing" OR "channel shift" OR "catch-down") AND length AND (WHO OR standard) AND (proportion OR percentage OR rate)'
  filters: 'format=json, resultType=lite, pageSize=10, no date limit'
  date_run: '2026-08-05'
  hit_count: 180
  screened_count: 10
  reason_none_qualified: >-
    All screened hits examine growth trajectories under a specific exposure - gestational diabetes
    (41462270, 39577834, 41869033), macrosomia (41132617), prematurity (42136589), size for
    gestational age (39135906) - and report mean trajectories or z-score change, not the
    proportion of infants crossing two or more length centiles in each direction relative to a
    parentally defined channel. None relates the shift to measured parental height, which is what
    distinguishes catch-down from faltering.

- gap_id: g_l9organism_008
  database: Europe PMC
  exact_query_string: '("growth plate" OR physis) AND (velocity OR "growth rate") AND (population OR ethnic OR ancestry) AND (difference OR variation) AND human'
  filters: 'format=json, resultType=lite, pageSize=10, no date limit'
  date_run: '2026-08-05'
  hit_count: 1190
  screened_count: 10
  reason_none_qualified: >-
    Screened hits are surgical guided-growth technique reviews (42299327, 41485130, 42246508,
    42279114), imaging methodology (38757966, 41929406), a population-genetics perspective piece on
    South American child growth with no physeal measurement (41096569), and nutritional supplement
    trials (42064572, 42123928). No study measures site-specific physeal growth velocity or
    plate-specific contribution shares in two or more ancestry groups by a common method, which is
    what would decide between the velocity and duration explanations for population differences in
    body proportion.

- gap_id: g_l9organism_009
  database: Europe PMC
  exact_query_string: '("dental age" AND "bone age") AND ("standard deviation" OR SD OR "limits of agreement") AND (discrepancy OR difference) AND healthy'
  filters: 'format=json, resultType=lite, pageSize=10, no date limit'
  date_run: '2026-08-05'
  hit_count: 33
  screened_count: 10
  reason_none_qualified: >-
    Hits compare dental age estimation METHODS against chronological age (41928213 ChatGPT-5 versus
    Demirjian and Willems, 41300576, 39061650, 40151703, 39775028) or study dental maturity in a
    named disease (41302932 GHD tooth eruption, 39441161 cleft lip and palate, 40583134 liver
    transplant). None reports the mean and SD, or limits of agreement, of dental age minus skeletal
    age within the same healthy children. Correlation coefficients are reported almost universally
    instead, and those are inflated by the shared chronological-age axis and cannot be converted to
    a within-child difference SD.

- gap_id: g_l9organism_017
  database: Europe PMC
  exact_query_string: '(allometric OR allometry) AND (exponent OR "scaling exponent") AND human AND (organ OR viscera OR kidney OR liver) AND (postnatal OR children OR growth)'
  filters: 'format=json, resultType=lite, pageSize=10, no date limit'
  date_run: '2026-08-05'
  hit_count: 587
  screened_count: 10
  reason_none_qualified: >-
    Screened hits are paediatric pharmacokinetic scaling with ASSUMED exponents (41255069,
    42087498, 41824241), non-human allometry (41512279 mouse vocal folds, 42122839 Malus, 41290152
    plant diaspores), an integrative review of allometric theory (39644458), a weight-for-height
    scaling analysis that fits body-shape rather than organ exponents (39024324) and heart-weight
    normalisation methodology (41844692). No source fits organ-by-organ postnatal allometric
    exponents to measured human organ mass across development.
