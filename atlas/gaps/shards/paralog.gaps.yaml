# Shard `paralog` - gaps opened by the systematic paralog-attribution audit.
#
# Every gap here comes from one of five questions put to a node that attributes a
# mechanism to a specific molecule: (a) does a paralog exist; (b) is it expressed in the
# relevant zone and at what relative abundance; (c) was the key perturbation selective
# for A over B and at what fold; (d) was the ligand or agonist selective or
# cross-reactive; (e) has the double perturbation ever been done.
#
# See atlas/audit/paralog_audit.md for the audit that generated each, including the
# 80 CLEAN verdicts that did NOT generate a gap.

gaps:

  - gap_id: g_para_001
    question: >-
      Does the chondrocyte cGMP pool that drives growth plate output come from NPR2/CNP
      alone, or does NPR1/ANP contribute a measurable share - and does a cartilage-specific
      Npr1;Npr2 double knockout differ from the Npr2 single knockout in hypertrophic layer
      thickness and long bone length?
    type: known_unknown
    layer: L3
    why_it_matters: >-
      The entire natriuretic-peptide arm of this atlas - CNP, NPR2, NPR3, cGMP, PKG-II, and
      the therapeutic reasoning around vosoritide - is built on the premise that NPR2 is the
      sole physiologically relevant guanylyl cyclase in the chondrocyte. zhou2024 shows that
      is not established: Corin- and Nppa(ANP)-null mice have impaired chondrocyte
      differentiation and shortened limb long bones, and ANP acts IN CHONDROCYTES through
      cGMP-dependent protein kinase G to suppress MAPK phosphorylation and raise
      phospho-GSK-3beta and beta-catenin. That is the same second messenger, the same kinase
      family and one of the same substrates (GSK-3beta) the atlas assigns wholly to the CNP
      arm. If a meaningful fraction of chondrocyte cGMP is ANP-derived, then the cGMP node
      has an unresolved SOURCE question sitting on top of its already unresolved EFFECTOR
      question (cGKI versus cGKII, g_l2d_001), and quantitative models of CNP dose-response
      are missing an input term.
    what_is_known: >-
      Cartilage-specific Npr2 deletion drops the type X collagen-positive layer to 23.0% of
      control and femur length to 45.3% of control (nakao2015). Human NPR2 is a graded
      three-state dosage locus (biallelic AMDM, heterozygous ISS, gain-of-function tall
      stature), so NPR2 requirement in humans is not in doubt. Npr2 transcript is similar
      across resting/proliferative (combined), hypertrophic and mineralized compartments
      (agoston2007). nakao2015's authors independently raise ANP/BNP cross-activation of
      GC-B as a live alternative, and note that the Nppc cKO is milder than the Npr2 cKO -
      currently explained by residual extra-cartilage CNP alone. zhou2024 supplies the
      genetic requirement for the ANP arm.
    what_is_missing: >-
      No study locates NPR1/GC-A protein or transcript by zone in growth plate of any
      species, so the relative abundance of the two receptor guanylyl cyclases in the tissue
      is unknown. No Npr1;Npr2 or Nppa;Nppc compound mutant exists in cartilage. No study
      partitions chondrocyte cGMP between the two ligand-receptor pairs. Whether the
      Nppc-cKO-versus-Npr2-cKO severity gap is extra-cartilage CNP, an ANP contribution, or
      both, has not been tested.
    nearest_evidence: [zhou2024, nakao2015, agoston2007, miyazaki2022]
    discriminating_experiment: >-
      Generate Col2a1-Cre;Npr1(fl/fl);Npr2(fl/fl) mice alongside each single conditional and
      a wild-type control on one background. Readouts at 2 and 6 weeks: proximal tibial
      total growth plate height, type X collagen-positive hypertrophic layer height, BrdU
      index, femur and tibia length, and chondrocyte cGMP by immunoassay on micro-dissected
      zones. Under NPR2-only, the double is indistinguishable from the Npr2 single on every
      readout. Under a real ANP contribution, the double is significantly more severe than
      the Npr2 single, and the Npr1 single shows a partial phenotype in the direction
      zhou2024 reports. Pair with zonal NPR1 and NPR2 protein immunohistochemistry in mouse
      and, if tissue is obtainable, human physis.
    tractability: 3
    search_log_ref: g_para_001

  - gap_id: g_para_002
    question: >-
      Is the bone-elongating effect of PDE3 inhibition in the growth plate mediated by
      PDE3B, by PDE3A, or by both - and what is the growth plate zonal distribution of each
      isoform?
    type: search_established
    layer: L3
    why_it_matters: >-
      kawabe2025 is the strongest positive pharmacological result in the cGMP arm of this
      atlas: PDE3 inhibitors raise chondrocyte cGMP, activate cell-surface K+ channels via
      PKG-mediated phosphorylation, hyperpolarise the cell, increase the driving force for
      TRPM7-mediated Ca2+ entry, elongate cultured bones and enlarge juvenile mice. The
      atlas assigns all of it to PDE3B. The agents used are cilostazol and milrinone, which
      are PDE3-FAMILY inhibitors. rowley2024 quantifies why that assignment cannot be made:
      PDE3A and PDE3B share 48% overall identity and >95% ACTIVE-SITE homology, described as
      "a massive obstacle for obtaining selectivity at the active site", and every
      FDA-approved PDE3 inhibitor is family-selective only - obtaining a PDE3B-selective
      compound required a DNA-encoded library screen and novel boronic-acid chemistry. The
      alternative is not a bystander: PDE3A is the isoform carrying the HUMAN skeletal
      genetics, since gain-of-function PDE3A variants cause hypertension with brachydactyly
      type E and short stature (maass2015), and the direction fits - if PDE3A gain of
      function shortens metacarpals, PDE3A inhibition lengthening bone is exactly what a
      family inhibitor would produce. This is the same structure as CORR-001 and CORR-003:
      the mechanism was assigned in a system where the alternative was present and was never
      removed. It also matters therapeutically, because repositioning cilostazol for short
      stature is the explicit proposal of the primary paper, and PDE3A inhibition carries
      the proarrhythmic liability that motivated the search for PDE3B-selective agents.
    what_is_known: >-
      IMPC Pde3b-null mice have increased tibial length - a gene-selective genetic result,
      and the reason PDE3B is not excluded. PDE3B is superficial-zone enriched in human and
      bovine ARTICULAR cartilage (grogan2013), which is a different tissue. PDE3B was
      selected in kawabe2025 "based on gene expression data" from bulk profiling, not from a
      zonal measurement. PDE3A is recorded at moderate to negligible levels in whole-bone
      and osteocyte transcriptomes. Human PDE3A gain of function causes brachydactyly with
      short stature (maass2015). PDE3A and PDE3B share >95% active-site homology
      (rowley2024).
    what_is_missing: >-
      Neither isoform has been localised by growth plate zone in any species. No
      cartilage-specific Pde3a knockout exists, and no Pde3a;Pde3b compound mutant exists.
      No isoform-selective PDE3 compound has been applied to growth plate. The IMPC
      Pde3b-null tibial length result has not been paired with a matched Pde3a-null tibial
      length measurement, so the genetic comparison that would settle this has not been
      made even though both lines are in principle available.
    nearest_evidence: [kawabe2025, rowley2024, maass2015, grogan2013, miyazaki2022]
    discriminating_experiment: >-
      Two arms. (1) Genetic: compare tibial and femoral length, growth plate zonal heights
      and chondrocyte cGMP in cartilage-specific Pde3a, Pde3b and Pde3a;Pde3b conditional
      knockouts on one background at 4 weeks. Under PDE3B-only, the Pde3b single reproduces
      the cilostazol phenotype and the Pde3a single is null. Under PDE3A-only, the reverse.
      Under joint contribution, only the double reaches the cilostazol effect size.
      (2) Pharmacological: administer the boronic-acid PDE3B-selective compounds of
      rowley2024 alongside cilostazol in the ex vivo tibia elongation assay of kawabe2025.
      If the selective compound reproduces cilostazol's elongation, PDE3B is sufficient;
      if it does not, the effect requires PDE3A inhibition. Pair either arm with
      isoform-specific immunohistochemistry across RZ/PZ/PHZ/HZ.
    tractability: 4
    search_log_ref: g_para_002

  - gap_id: g_para_003
    question: >-
      What fraction of IGF-1-binding receptor sites on the growth plate chondrocyte surface
      are IGF1R homodimers, INSR homodimers and INSR/IGF1R hybrid receptors, and how does
      that fraction vary by zone?
    type: quantitative_gap
    layer: L4
    why_it_matters: >-
      The atlas treats IGF1R as the convergence point at which the somatomedin and
      dual-effector accounts of GH action become indistinguishable at the chondrocyte. That
      framing assumes a receptor population whose composition has never been measured in
      this tissue. Hybrid INSR/IGF1R receptors bind IGF-1 with high affinity and insulin
      poorly, so they behave pharmacologically like IGF1R while being genetically half
      INSR - which means every conclusion drawn from an insulin-versus-IGF-1 comparison in
      cartilage, and every conclusion drawn from an Igf1r conditional deletion, carries an
      unquantified hybrid term. This is the residue of the IGF1R/insulin finding recorded in
      phase3_close: the one cartilage experiment coupling this family to mTORC1 used
      insulin, not IGF-1. That edge is already correctly graded speculative, so the atlas is
      not making a false claim - but the number that would let anyone reason quantitatively
      about it does not exist.
    what_is_known: >-
      IGF1R binds IGF-1 with roughly 100-fold higher affinity than insulin (alarid1992
      framing). Hybrid receptors form wherever both receptors are co-expressed, and INSR is
      ubiquitous. Cartilage-specific Igf1r knockout - embryonic and tamoxifen-inducible
      postnatal - gives disorganised columns, delayed ossification and vascular invasion,
      reduced proliferation, increased apoptosis and increased Pthrp transcription
      (wang2011), establishing IGF1R necessity in chondrocytes by a gene-selective route.
      Biallelic human INSR loss (Donohue syndrome) causes severe growth failure that
      hyperinsulinaemia cannot rescue, establishing an INSR requirement separable from
      IGF1R. Human PAPP-A2 deficiency shows stature tracks free rather than total IGF-1
      (dauber2016).
    what_is_missing: >-
      No study has quantified INSR, IGF1R or hybrid receptor abundance in growth plate
      tissue of any species, by zone or in bulk. No chondrocyte Insr;Igf1r compound mutant
      exists. The INSR-A versus INSR-B isoform split in chondrocytes is unmeasured, which
      matters because INSR-A binds IGF-2 with near-insulin affinity and IGF-2 remains
      abundant postnatally in humans but not in mice.
    nearest_evidence: [wang2011, alarid1992, dauber2016, phornphutkul2008]
    discriminating_experiment: >-
      Apply the established immunoprecipitation-based hybrid quantification assay - capture
      with anti-INSR, detect with anti-IGF1R and reciprocally - to micro-dissected resting,
      proliferative and hypertrophic zones of postnatal mouse tibia, and to human physeal
      tissue from the donor census where available. Report the three receptor species as
      percentages of total alpha-subunit with n and CI. Expected outputs differ sharply: if
      hybrids are under 10% of sites the pharmacological ambiguity is negligible and the
      Igf1r conditional data can be read at face value; if hybrids exceed 40%, as they do in
      several insulin-target tissues, then Igf1r deletion removes a large share of INSR
      signalling capacity as a side effect and the two receptors cannot be treated as
      separable in this tissue at all.
    tractability: 3
    search_log_ref: g_para_003

  - gap_id: g_para_004
    question: >-
      Does the Mmp13-null growth plate phenotype persist into adult life or resolve by 12
      weeks, and is collagen II cleavage in the lower hypertrophic zone attributable to
      MMP-13 alone or to MMP-13 acting synergistically with MMP-9?
    type: contradiction
    layer: L5
    why_it_matters: >-
      The atlas states that MMP-13 is "the enzyme that cleaves the triple helix of collagen
      II in the lower growth plate", and uses the persistence of the Mmp13-null phenotype
      into adulthood as the discriminator against the transient Mmp9-null. Both halves of
      that are in question. Two independently generated Mmp13-null lines, both reported in
      2004, disagree on persistence: inada2004 reports growth plate abnormalities persisting
      into adult life, while stickens2004 reports that severity increased until about 5
      weeks and COMPLETELY RESOLVED by 12 weeks. And stickens2004 made the Mmp9/Mmp13 DOUBLE
      null, which has severely impaired endochondral bone with diminished ECM remodelling,
      prolonged chondrocyte survival, delayed vascular recruitment and drastically shortened
      bones - the authors' conclusion being that "degradation of cartilage collagen and
      aggrecan is a coordinated process in which MMP13 works synergistically with MMP9".
      Exclusive attribution to MMP-13 does not survive a synergy result. The human situation
      is worse for exclusivity than the mouse: haeusler2005 finds MMP-1, -9, -10, -11 AND
      -13 all immunopositive in human hypertrophic chondrocytes, with MMP-14 the most
      prominent MMP in the human growth plate and present in all zones.
    what_is_known: >-
      stickens2004 confirms collagen II and aggrecan as in vivo MMP-13 substrates, so the
      substrate identification is strengthened, not weakened. Both lines agree that
      chondrocytes differentiate normally and that their exit from the plate is delayed, so
      the phenotype itself replicates; only its duration is disputed. Mmp9-null gives an
      ~8-fold lengthened plate that remodels after 3 weeks postnatal and is rescued by
      wild-type bone marrow transplantation (vu1998), establishing MMP-9's cellular source
      as marrow-derived rather than chondrocytic. MMP13 variants cause human metaphyseal
      anadysplasia and a frameshift short-stature allele (lu2026).
    what_is_missing: >-
      No head-to-head re-examination of the two Mmp13-null lines under one histomorphometric
      protocol with a stated time course to 12 weeks and beyond. No quantitative measurement
      of collagen II cleavage neoepitope by zone in either single or the double null. No
      human data assigning lower-plate collagen II cleavage to any specific MMP; the human
      evidence is co-localisation of at least five MMPs in the same zone.
    nearest_evidence: [stickens2004, inada2004, vu1998, haeusler2005, little2005]
    discriminating_experiment: >-
      Phenotype Mmp13-null, Mmp9-null and Mmp9;Mmp13 double-null mice from both source lines
      on one background, with blinded histomorphometry of hypertrophic zone height and total
      plate height at 2, 5, 8, 12 and 20 weeks, plus collagen II 3/4-length neoepitope
      immunostaining quantified by zone. Under persistence (inada2004), Mmp13-null plate
      height remains elevated at 20 weeks; under resolution (stickens2004), it returns to
      control by 12 weeks. Under MMP-13 exclusivity, neoepitope loss in the Mmp13-null
      equals that in the double; under synergy, the double is significantly worse than
      either single. Pair with the human question by staining human physeal tissue for the
      same neoepitope alongside MMP-13 and MMP-14.
    tractability: 3
    search_log_ref: g_para_004

  - gap_id: g_para_005
    question: >-
      Which thyroid hormone receptor isoform carries the T3 response of the long-bone growth
      plate chondrocyte - and does a cartilage-restricted Thra;Thrb double deletion produce
      a phenotype that neither single deletion produces?
    type: contradiction
    layer: L4
    why_it_matters: >-
      This atlas already carries a logged contradiction between mouse and human on this
      point: rabier2006 found that ALL T3 responses were abolished in TRbeta-deficient mouse
      rib chondrocytes and preserved in TRalpha-deficient ones, while in humans it is
      dominant-negative THRA variants, not THRB variants, that cause short stature and
      delayed bone age - THRB resistance leaves adult stature largely normal. The paralog
      audit finds the resolving experiment already exists outside cartilage and points at a
      third answer: gthe1999 shows TRalpha1(-/-)beta(-/-) double-null mice have retarded
      growth and bone maturation NOT found in either single receptor-deficient mouse, and
      states that "deletion of TRalpha1 or TRbeta individually reveals only a small
      proportion of the phenotypes that arise in hypothyroidism", concluding the two
      isoforms cooperate with or substitute for each other. If that holds in cartilage, then
      neither single-null phenotype assigns the chondrocyte T3 response to an isoform, and
      the mouse-human contradiction may be an artefact of comparing two different
      compensation states rather than a real species difference. The ligand cannot help:
      T3 binds TRalpha1 and TRbeta1 with comparable affinity, so no pharmacological
      experiment can separate them.
    what_is_known: >-
      robson2000 places TRalpha1, TRalpha2 AND TRbeta1 protein together in reserve and
      proliferating rat chondrocytes, all absent from hypertrophic cells - so both receptors
      occupy the same cells with no relative abundance measurement. jorge2025 documents three
      children with heterozygous THRA variants, short stature, low free T4 and marked
      response to levothyroxine plus rhGH. gthe1999 supplies the double null outside
      cartilage. The atlas already lists rib-versus-long-bone chondrocyte differences,
      germline compensation, and a genuine species difference as the candidate explanations.
    what_is_missing: >-
      No cartilage-restricted Thra, Thrb or Thra;Thrb conditional deletion has been reported
      with a growth plate readout. No relative abundance measurement of TRalpha versus
      TRbeta protein in growth plate of any species. No human growth plate TR localisation
      at all. rabier2006's germline nulls cannot distinguish "TRbeta carries the signal"
      from "TRalpha compensated during development in the TRalpha-null and could not in the
      TRbeta-null".
    nearest_evidence: [gthe1999, rabier2006, robson2000, jorge2025]
    discriminating_experiment: >-
      Generate Col2a1-CreERT2;Thra(fl/fl), ;Thrb(fl/fl) and ;Thra(fl/fl);Thrb(fl/fl) mice,
      induced postnatally to avoid developmental compensation, and measure tibial growth
      velocity by calcein double labelling, zonal heights and Col10a1 expression, with and
      without T3 challenge. Under isoform-specific signalling, one single conditional
      reproduces the T3-unresponsive phenotype and the other does not. Under the gthe1999
      redundancy model, both singles are near-normal and only the double is unresponsive.
      Quantify TRalpha and TRbeta protein by zone in the same animals so the abundance
      question is answered alongside the functional one.
    tractability: 3
    search_log_ref: g_para_005

  - gap_id: g_para_006
    question: >-
      Is DIO1 expressed in growth plate cartilage, and what fraction of intracellular T3 in
      the growth plate chondrocyte is generated locally by DIO2 rather than imported from
      the circulation?
    type: search_established
    layer: L4
    why_it_matters: >-
      The pre-receptor amplification model - that the chondrocyte sets its own T3 exposure
      by local DIO2-mediated deiodination independently of serum T4 - is the step that
      determines whether a given systemic thyroid status is amplified or damped at the
      plate, and it is stated as fact throughout the thyroid literature. Two things are
      missing under it. First, DIO1 is the OTHER activating outer-ring deiodinase and is not
      mentioned in the atlas node at all, so the isoform assignment has never been tested.
      Second, the quantitative claim itself - the local versus imported fraction - has never
      been measured with zonal resolution in any species. Before this audit the dio2 node
      carried NO primary DIO2 growth plate reference: its only key_ref was robson2000, a
      thyroid hormone RECEPTOR localisation paper. That has now been repaired
      (dentice2005, shen2004) but the isoform and fraction questions remain open.
    what_is_known: >-
      dentice2005 shows the Hedgehog-inducible ubiquitin ligase subunit WSB-1 targets DIO2
      for degradation in the developing growth plate, modulating local thyroid hormone
      activation and PTHrP secretion - primary evidence that DIO2 specifically is locally
      regulated in this tissue and is wired into the Ihh/PTHrP loop. shen2004 reports
      differential DIO2 expression in growth plates of chickens divergently selected for
      tibial dyschondroplasia. DIO3-mediated inactivation minimises T3 signalling in the
      early fetal skeleton. DIO2's substrate-induced ubiquitination gives it a short
      half-life, making local T3 production self-limiting as T4 rises.
    what_is_missing: >-
      No primary study reports DIO1 expression, activity or function in growth plate
      cartilage in any species. No study measures the locally generated versus imported T3
      fraction in physeal tissue. No Dio1;Dio2 compound mutant with a growth plate readout.
      No human growth plate deiodinase measurement of any isoform.
    nearest_evidence: [dentice2005, shen2004, robson2000, dauber2017]
    discriminating_experiment: >-
      Micro-dissect resting, proliferative and hypertrophic zones from postnatal mouse
      tibia and assay DIO1, DIO2 and DIO3 transcript and enzymatic activity per zone, using
      the standard outer- and inner-ring deiodination assays with propylthiouracil to
      distinguish DIO1 (PTU-sensitive) from DIO2 (PTU-resistant) - a pharmacological
      discriminator that does exist for this pair, unlike for GSK3 or PDE3. Then measure the
      local fraction directly by administering labelled T4 and quantifying zonal T3
      generation in wild-type versus cartilage-specific Dio2 knockout. Under the local
      generation model, zonal T3 falls substantially in the Dio2 knockout; under an import
      model it does not, and DIO2's role reduces to fine-tuning.
    tractability: 3
    search_log_ref: g_para_006

  - gap_id: g_para_007
    question: >-
      Is the FGF21 effect on growth plate chondrocytes - suppression of proliferation and
      Col10a1, and induction of local GH insensitivity - transduced by FGFR1, by FGFR3, or
      by both?
    type: known_unknown
    layer: L3
    why_it_matters: >-
      beta-Klotho is the only demonstrated molecular entry point by which systemic caloric
      state reaches the growth plate through the FGF receptor family rather than through the
      GH/IGF-1 axis, so which receptor carries it determines where undernutrition-induced
      growth suppression sits in the network. The atlas assigns it to an FGFR1-ERK arm on
      the strength of FGFR1 siRNA. But wu2012 detected Fgfr1 AND Fgfr3 transcripts, with Klb
      and Fgf21, in the SAME mouse growth plate chondrocytes, and never knocked down FGFR3.
      The atlas's own fgfr3_receptor node states, from human in situ hybridisation, that
      FGFR1 is NOT detected in human growth plate chondrocytes and that the human plate is
      an FGFR3-dominant tissue (delezoide1998). So the receptor the mechanism is assigned to
      is the one the human expression map says is absent from this cell type - which makes
      this the specific point where the mouse mechanism is least likely to translate. The
      dose compounds it: the inhibitory effects required recombinant FGF21 at 5-10 ug/ml,
      far above physiological circulating concentrations, and at those concentrations
      FGF21's receptor preference and Klotho dependence both loosen.
    what_is_known: >-
      wu2012: Klb, Fgfr1, Fgfr3, Fgf21 transcripts in fetal and 3-week mouse growth plate
      chondrocytes; FGF21 at 5-10 ug/ml suppressed thymidine incorporation and Col10a1 mRNA,
      abolished the GH-stimulated increase in both, and reduced 125I-GH binding; siRNA
      against FGFR1 or ERK1 prevented every one of these effects. wu2013: four weeks of food
      restriction raised LEPROT and LEPROTL1 mRNA in liver and tibial growth plate,
      Fgf21-null mice did not show the induction, and rhFGF21 restored it in food-restricted
      Fgf21-null mice - a ligand-side necessity result that does not depend on which
      receptor carries it. delezoide1998: FGFR3 is the only FGFR in human growth plate
      chondrocytes.
    what_is_missing: >-
      No Fgfr3 knockdown or knockout control in the FGF21 chondrocyte system. No
      Fgfr1;Fgfr3 double perturbation in chondrocytes. No dose-response establishing whether
      any FGF21 effect occurs at physiological concentrations. KLB has never been localised
      in human growth plate cartilage by any method, so the human arm of the whole pathway
      is inferred rather than shown.
    nearest_evidence: [wu2012, wu2013, delezoide1998]
    discriminating_experiment: >-
      Repeat the wu2012 chondrocyte assays with siRNA against Fgfr1, against Fgfr3, and
      against both, with knockdown efficiency reported for each, across an FGF21 dose range
      spanning physiological (ng/ml) to the published 5-10 ug/ml. Under an FGFR1-only
      mechanism, Fgfr3 knockdown has no effect at any dose. Under FGFR3 involvement, Fgfr3
      knockdown attenuates the response, most likely at the lower doses where receptor
      preference is sharper. Confirm in vivo with cartilage-specific Fgfr1 versus Fgfr3
      deletion under food restriction, reading out tibial LEPROT/LEPROTL1 induction - the
      wu2013 endpoint. Separately, attempt KLB localisation in human physeal tissue, which
      would tell us whether the pathway is present in humans at all.
    tractability: 4
    search_log_ref: g_para_007

  - gap_id: g_para_008
    question: >-
      Which GSK3-dependent chondrocyte phenotypes survive isoform-selective removal of
      GSK3B, given that the cartilage-specific Gsk3b single knockout is phenotypically
      normal with compensatory GSK3A upregulation?
    type: search_established
    layer: L3
    why_it_matters: >-
      The atlas's functional evidence for GSK3B in chondrocytes is lithium chloride
      (guidotti2015), which does not distinguish GSK3A from GSK3B at any concentration - it
      is a metal ion competing at the Mg2+ site with no isoform preference, and no
      ATP-competitive GSK3 inhibitor with meaningful GSK3A/B selectivity exists. This audit
      also found that the node's own statement - that no chondrocyte-restricted Gsk3b
      conditional knockout growth plate phenotype has been reported - is factually wrong.
      One exists, and its result is the informative part: cartilage-specific Gsk3b knockout
      mice are NORMAL except for elevated GSK3A protein (bali2021). The paralog does not
      merely co-exist, it upregulates to compensate. So the selective genetic removal of
      GSK3B does nothing, the non-selective chemical removal of both does something, and no
      evidence assigns any chondrocyte phenotype to GSK3B specifically. itoh2012 additionally
      shows the redundant GSK3 function in early chondrocyte differentiation runs through
      RelA Thr-254 phosphorylation INDEPENDENTLY of Wnt/beta-catenin, which weakens the
      atlas's framing of GSK3B in this tissue as primarily a destruction-complex kinase.
    what_is_known: >-
      bali2021: tamoxifen-inducible cartilage-specific Gsk3a/Gsk3b double knockout causes
      precocious growth plate remodelling, progressive loss of cellular and proteoglycan
      components, decreased SOX9, increased osteoclast recruitment and apoptosis, shorter
      long bones and growth retardation; articular cartilage changes are mild by comparison,
      indicating differential regulation of the two cartilages. itoh2012: Gsk3a(-/-) alone
      and Gsk3b(+/-) alone do not significantly affect skeletal development, while the
      compound Gsk3a(-/-);Gsk3b(+/-) causes dwarfism with impaired chondrocyte
      differentiation; the isoforms are redundant cell-autonomously and independently of
      Wnt/beta-catenin. guidotti2015: LiCl in human OA chondrocytes links GSK3 inactivation
      to oxidative DNA damage, matrix remodelling and terminal differentiation.
    what_is_missing: >-
      No zonal map of GSK3A or GSK3B protein in growth plate in any species, so the
      compensation reported by bali2021 has no spatial resolution. No isoform-selective
      chemical probe exists, so the redundancy cannot be broken acutely. No experiment
      determines whether the guidotti2015 LiCl phenotype - oxidative DNA damage and terminal
      differentiation - is reproduced by the genetic double knockout, which is the specific
      claim the atlas attaches to GSK3B. No human growth plate GSK3 measurement.
    nearest_evidence: [bali2021, itoh2012, guidotti2015, akiyama2004]
    discriminating_experiment: >-
      Apply the guidotti2015 readouts - beta-catenin level, terminal differentiation
      markers, 8-oxo-dG oxidative DNA damage and matrix remodelling - to chondrocytes from
      the bali2021 cartilage-specific Gsk3a, Gsk3b and Gsk3a/Gsk3b conditional knockouts,
      alongside LiCl-treated wild-type cells. Under a GSK3B-specific mechanism the Gsk3b
      single knockout reproduces the LiCl phenotype; given bali2021 it almost certainly will
      not, in which case the atlas claim must be restated at the level of GSK3 activity
      rather than the GSK3B gene. Include a Wnt-independence control by repeating in
      beta-catenin-stabilised cells, since itoh2012 places the redundant function outside
      the canonical pathway.
    tractability: 4
    search_log_ref: g_para_008

  - gap_id: g_para_009
    question: >-
      Which BMP ligand or ligands does Noggin actually neutralise in growth plate explant
      experiments, and do the conclusions drawn from Noggin-based BMP-off experiments
      survive ligand-selective blockade?
    type: known_unknown
    layer: L3
    why_it_matters: >-
      This is a methodological paralog risk that propagates rather than sitting on one node.
      The noggin_antagonist node states it plainly: Noggin is widely used experimentally as
      the BMP-off reagent in growth plate explants, so a large fraction of "BMP is required
      for X" claims in this subsystem are Noggin-inference rather than receptor genetics.
      Noggin binds BMP2, BMP4, BMP7 and GDF5 without discriminating among them, so every
      downstream conclusion inherits that non-selectivity - including any claim about which
      BMP ligand matters in a given zone. The BMP layer of this atlas is otherwise in good
      shape: Bmp2 and Bmp4 were deleted separately in the same cartilage-specific system
      (shu2011), the Bmp2;Bmp4 double exists in limb mesenchyme and Bmp7 was tested on top
      of it (bandyopadhyay2006), and Noggin and Chordin have a published double
      (stottmann2001). The exposure is confined to the explant pharmacology, which is
      exactly where it is easiest to miss.
    what_is_known: >-
      Noggin-null mice have grossly enlarged fused cartilage elements with failure of joint
      formation (brunet1998); human heterozygous NOG loss causes proximal symphalangism and
      multiple synostoses (gong1999) - both gene-selective and both about BMP DOSE rather
      than any single ligand. Chordin shares substrate ligands with Noggin and the
      Noggin;Chordin double loses structures neither single loses (stottmann2001). Within
      cartilage, BMP2 is the non-redundant member of the BMP2/BMP4 pair (shu2011), while in
      limb mesenchyme the pair is redundant (bandyopadhyay2006) - so redundancy is
      compartment-specific and cannot be assumed from one compartment to another.
    what_is_missing: >-
      No growth plate explant study has compared Noggin against ligand-selective blockade -
      neutralising antibodies to BMP2 versus BMP4 versus BMP7, or ligand-specific traps - so
      no explant conclusion in this subsystem is resolved to a ligand. No inventory exists
      of which atlas claims descend from Noggin explant experiments as opposed to receptor
      or ligand genetics.
    nearest_evidence: [brunet1998, gong1999, stottmann2001, shu2011, bandyopadhyay2006]
    discriminating_experiment: >-
      In cultured fetal metatarsals or tibial explants, compare Noggin against
      ligand-selective neutralising antibodies to BMP2, BMP4 and BMP7 individually and in
      combination, reading out longitudinal growth rate, hypertrophic zone height and
      pSMAD1/5/8 immunostaining. Under a single dominant ligand, one selective antibody
      reproduces the Noggin effect. Under genuine redundancy, only the combination does, and
      any published claim of the form "BMP ligand X is required" that rests on Noggin must be
      restated as "BMP-SMAD1/5/8 output is required". Use the result to audit and re-tag
      existing atlas edges whose evidence is Noggin-based.
    tractability: 4
