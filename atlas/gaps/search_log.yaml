- gap_id: g_l3core_005
  database: Europe PMC
  exact_query_string: (TITLE_ABS:"PTHrP" OR TITLE_ABS:"PTHLH" OR TITLE_ABS:"PTH1R") AND (TITLE_ABS:"C-type natriuretic peptide"
