  date_run: '2026-08-05'
  hit_count: 8
  screened_count: 8
  reason_none_qualified: All eight records were screened. Four are reviews or gene-panel papers listing both pathways as separate
    causes of short stature (Vasques-type panels, SHOX second-hit papers, a signalling review, and a novel-genetic-causes
