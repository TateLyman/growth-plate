  reason_none_qualified: TIRED. Five angles run, four returned material the atlas already held (CORR-112), one failed verification
    and was not entered. (1) REGIONAL HYPERAEMIA AS A HUMAN NATURAL EXPERIMENT - queries on arteriovenous malformation, Parkes
