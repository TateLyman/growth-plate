searches:
- gap_id: g_l12pharm_001
  database: Europe PMC
  exact_query_string: vosoritide AND ("final adult height" OR "final height" OR "adult height" OR "near-adult height")
  filters: format=json, pageSize=20, resultType=core, no date limit
  date_run: '2026-08-05'
  hit_count: 64
  screened_count: 20
  reason_none_qualified: 'No hit reports achieved final or near-adult height in CNP-analogue-treated patients. The two most
    likely candidates were screened at abstract level and explicitly excluded: PMID 42306228 (meta-analysis of CNP analogs,
    11 studies N=542, 4 RCTs n=326) reports AGV 1.36 cm/yr (95% CI 1.05-1.68), height Z-score, standing height and upper-to-lower
    segment ratio - no final height; PMID 40821249 (review of clinical and real-world evidence to May 2025) reports AGV ~1.5-2.0
    cm/yr and discusses "long-term potential" prospectively rather than reporting attained adult height. The remaining screened
    hits are surgical integration studies, cost-effectiveness models, dosing/PK modelling, spine and genu varum morphometry,
    or reviews. Absence is consistent with trial design rather than with reporting failure: the phase 3 extension NCT03424018
    is registered as ACTIVE_NOT_RECRUITING, so the cohort has not yet reached skeletal maturity.'
  additional_source_checked: 'ClinicalTrials.gov API v2, query.intr=vosoritide, 2026-08-05: of 12 returned studies the two
    extension studies (NCT03424018 phase 3 n=119, NCT03989947 phase 2 n=73) are ACTIVE_NOT_RECRUITING, consistent with final
    height data being pending rather than withheld.'
- gap_id: g_l12pharm_002
  database: Europe PMC
  exact_query_string: vosoritide AND achondroplasia AND (randomi* OR "growth velocity")
  filters: format=json, pageSize=12, resultType=core, no date limit
  date_run: '2026-08-05'
  hit_count: 134
  screened_count: 12
  reason_none_qualified: Screened hits report plasma pharmacokinetics and population-PK-derived weight-band dosing (e.g. PMID
    38649657) but none reports a measured drug concentration within growth plate tissue or across its zones. Tissue exposure
    at the target is treated throughout the literature as inferred from plasma exposure rather than measured, which is the
    substance of this gap.
- gap_id: g_l13data_001
  database: NCBI GEO DataSets (E-utilities esearch, db=gds)
  exact_query_string: (growth plate[All Fields]) AND (spatial[All Fields]) AND Homo sapiens[Organism]
  filters: db=gds, retmax=0 for count; census executed against live E-utilities API
  date_run: '2026-08-05'
  hit_count: 0
  screened_count: 0
  reason_none_qualified: 'Exact zero. The unrestricted query (growth plate[All Fields]) AND (spatial[All Fields]) returns
    7 records, all non-human - inspected accessions include GSE299816, GSE288529 (ApoE resting zone marker), GSE275252 (ADGRG6),
    GSE221571, all Mus musculus. Adding the Homo sapiens organism restriction eliminates all 7. The null is not an artefact
    of the organism filter being too strict: the companion query (growth plate) AND (single cell) AND Homo sapiens returns
    18 records, confirming that human growth plate data IS deposited and indexed under this organism tag, and that the absence
    is specific to the spatial modality.'
- gap_id: g_l13data_002
  database: NCBI GEO DataSets (E-utilities esearch, db=gds)
  exact_query_string: 'four paired counts: (growth plate[All Fields]) = 1472; AND Mus musculus[Organism] = 919; AND Homo sapiens[Organism]
    = 141; AND (single cell[All Fields]) = 60, of which Homo sapiens = 18'
  filters: db=gds, retmax=0, counts only
  date_run: '2026-08-05'
  hit_count: 1472
  screened_count: 24
  reason_none_qualified: These counts establish the DEPOSITION ratio (~6.5 mouse records per human record) but do not answer
    the question asked, which concerns the mechanistic LITERATURE and its species attribution practices. No systematic species-audit
    of the growth plate literature was located in GEO or Europe PMC; the gap is therefore quantitative rather than search_established
    for the literature claim, and the GEO figures are recorded as nearest available evidence.
- gap_id: g_l1arch_001
  database: PubMed
  exact_query_string: (growth plate[tiab] OR physis[tiab] OR "epiphyseal plate"[tiab]) AND humans[MeSH Terms] AND (stereolog*[tiab]
    OR morphometr*[tiab] OR histomorphometr*[tiab]) AND (hypertroph*[tiab]) AND (elongation[tiab] OR "longitudinal growth"[tiab]
    OR "growth rate"[tiab])
  filters: no date limit, retmax=60, esearch db=pubmed
  date_run: '2026-08-05'
  hit_count: 4
  screened_count: 4
  reason_none_qualified: Four hits. PMID 11033444 (Byers 2000) is human histomorphometry of rib growth plate but reports zone
    heights only, not a partition of elongation. PMID 31997656 correlates growth plate morphometry with tibial growth but
    the human arm is radiographic (plate height/width) with no cellular stereology. PMIDs 15647824 and 10487224 are rodent.
    No human study partitions elongation among division, matrix synthesis and hypertrophy.
- gap_id: g_l1arch_003
  database: Europe PMC
  exact_query_string: septoclast*
  filters: resultType=core, pageSize=60, no date limit
  date_run: '2026-08-05'
  hit_count: 54
  screened_count: 54
  reason_none_qualified: All 54 records screened by title and, where ambiguous, abstract. Every primary observation of septoclasts
    is in mouse (35091558, 29464321, 33398436, 28500502, 35195769, 42324641, 41319243, 40387924, 19893052), rat (7730591,
    35537657, 32816022, 24879443) or bovine calf costochondral junction (33884197). The remainder are reviews, conference
    abstract collections, or unrelated osteoclast/vascular papers. Not one reports septoclasts, FABP5+ chondro-osseous border
    cells, or an equivalent population in human growth plate tissue. A narrower run of 'septoclast* AND (human OR "Homo sapiens")'
    returned 38 records, all of which were rodent-tissue studies or reviews that merely mention human relevance.
