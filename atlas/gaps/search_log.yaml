- gap_id: g_l1arch_007
  database: PubMed
  exact_query_string: ("oxygen tension"[tiab] OR pO2[tiab] OR "partial pressure of oxygen"[tiab]) AND (growth plate[tiab]
    OR "epiphyseal plate"[tiab] OR physis[tiab]) AND humans[MeSH Terms]
  filters: no date limit, retmax=60, esearch db=pubmed
  date_run: '2026-08-05'
  hit_count: 4
  screened_count: 4
  reason_none_qualified: Four hits. PMID 41253283 is ToF-SIMS mineral/organic mapping of human growth plate with no oxygen
    measurement; PMID 19419319 is an in vitro chondrocyte study of ANK expression under imposed oxygen tensions, not a tissue
    measurement; PMID 16425255 is a review; PMID 711109 is a 1978 non-English clinical paper on fracture effects. No study
    reports measured oxygen tension in human growth plate tissue. The only zonal measurements in any species remain Brighton
    and Heppenstall 1971 in rat and rabbit, whose numeric values are not retrievable from any indexed abstract (queued in
    access_queue).
- gap_id: g_l1arch_008
  database: PubMed
  exact_query_string: (chondrocyte[tiab] AND (swelling[tiab] OR "dry mass"[tiab] OR "volume increase"[tiab] OR hypertrophy[tiab]))
    AND (human[tiab] OR humans[MeSH Terms]) AND ("growth plate"[tiab] OR physis[tiab]) AND (quantitative phase[tiab] OR interferometr*[tiab]
    OR "cell volume"[tiab] OR density[tiab])
  filters: no date limit, retmax=60, esearch db=pubmed
  date_run: '2026-08-05'
  hit_count: 6
  screened_count: 6
  reason_none_qualified: 'Six hits: a mathematical model of osteochondral regeneration (38908475), an HDAC4/MMP-13 mouse study
    (27320207), an in vitro chondrocyte dedifferentiation study (23758619), a BMP-2/Wnt signalling study (22513174), a chondrosarcoma
    type X collagen study (22116208) and a review of steroid effects (19940493). None measures single-cell volume or dry mass
    density in human growth plate chondrocytes. The three-phase enlargement trajectory remains described only in mouse and
    jerboa (cooper2013).'
- gap_id: g_l1arch_012
  database: PubMed
  exact_query_string: ("cell cycle"[tiab] OR "cycle time"[tiab] OR "labelling index"[tiab] OR "labeling index"[tiab] OR bromodeoxyuridine[tiab]
    OR Ki-67[tiab]) AND ("growth plate"[tiab] OR physis[tiab] OR "epiphyseal plate"[tiab]) AND humans[MeSH Terms] AND (proliferative
    zone[tiab] OR chondrocyte[tiab])
  filters: no date limit, retmax=60, esearch db=pubmed
  date_run: '2026-08-05'
  hit_count: 19
  screened_count: 19
  reason_none_qualified: All 19 screened. Every record is either a mouse/rat genetic or pharmacological study (32759468, 24551245,
    17652426, 16869727, 20470884, 10098598, 2207391), an in vitro human chondrocyte differentiation study without cell-cycle-phase
    timing (21538935, 19898608, 31601652, 19351720, 11739785), or a review (34137454, 33064251, 10799356, 10372550, 7634645,
    17098451, 16144844). None reports G1, S, G2 or M duration, cumulative labelling index kinetics, or a growth fraction for
    human proliferative-zone chondrocytes. The only human numbers remain a derived cycle time (kember1976) and an in vitro
    labelling index in four subjects (thurston1985).
- gap_id: g_l2stem_001
  database: Europe PMC
  exact_query_string: (human) AND ("growth plate" OR physis OR "resting zone") AND ("lineage tracing" OR "clonal tracing"
    OR "somatic mutation" OR "clonal lineage")
  filters: resultType=lite, pageSize=8 inspected of full hit list, no date limit
  date_run: '2026-08-05'
  hit_count: 726
  screened_count: 40
  reason_none_qualified: Top-ranked and all screened records are either murine lineage tracing, reviews of murine work, or
    human descriptive transcriptomics (chu2026, avijgan2025, avijgan2026). No record reports clonal or lineage tracing performed
    on human growth plate cells. The two human primary studies retrieved (chu2026, 41984930; the systematic review 41795828)
    explicitly state that human growth plate stem cells had not previously been demonstrated and rely on mouse tracing of
    a transcriptionally matched population for the functional claim.
