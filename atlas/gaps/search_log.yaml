- gap_id: g_l3core_011
  database: Europe PMC
  exact_query_string: TITLE_ABS:NPR2 AND TITLE_ABS:"short stature" AND (heterozygous OR carrier)
  filters: format=json, pageSize=25, resultType=core, no date limit; first 25 of 49 screened
  date_run: '2026-08-05'
  hit_count: 49
  screened_count: 25
  reason_none_qualified: Twenty-five records were screened for a standardised activity-versus-height regression. Every cohort
    reports either cGMP assays on a handful of novel variants (typically 1-8) in a laboratory-specific construct, or height
    SDS, but never both across a variant panel under one protocol. Wang 2015 comes closest, functionally testing 16 variants,
    but reports prevalence and direction rather than a regression of activity on height. No study reports the shape of the
    activity-to-height dose-response.
- gap_id: g_l7fuse_003
  database: Europe PMC
  exact_query_string: (human) AND ("growth plate" OR physis) AND (transcriptome OR "single-cell RNA" OR "RNA-seq") AND ("epiphyseal
    fusion" OR "growth plate closure" OR "fusing growth plate")
  filters: format=json, resultType=lite, pageSize=30, no date limit
  date_run: '2026-08-05'
  hit_count: 50
  screened_count: 30
  reason_none_qualified: Screened the 30 highest-ranked records by title and, where ambiguous, abstract. None reports sequencing
    of human physeal tissue at a defined late-pubertal or fusing stage. The closest qualifying record is a commentary (PMID
    42248738) on the human EARLY-PUBERTAL growth plate atlas of chu2026, whose specimens come from growth-restricting surgery
    and therefore predate fusion by years. The remainder are rodent growth plate studies (e.g. PMID 30036371 rodent differential
    aging, PMID 35039652 murine gp130/STAT3), reviews of skeletal single-cell methods, cartilage organoid papers, and unrelated
    skeletal dysplasia genetics. No dataset accession for human fusing physis was identified.
