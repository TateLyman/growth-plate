- gap_id: g_l0dev_006
  question: At what gestational or postnatal ages do the secondary ossification centres of each human epiphysis appear, measured
    prospectively with modern imaging and reported with dispersion?
  type: quantitative_gap
  layer: L0
  why_it_matters: Every bone-age method (Greulich-Pyle, Tanner-Whitehouse, Fels) and every remaining-growth prediction in
    L7 is calibrated on ossification centre appearance and maturation, but the underlying appearance-timing data are largely
    mid-twentieth-century radiographic atlases from single populations. If the atlas is going to hold L0 timing as an organism-level
    number the mechanistic layers must reproduce, that number needs a modern, prospective, population-resolved basis, particularly
    because secular trend and population differences in maturation are documented elsewhere in the atlas.
  what_is_known: 'One modern prospective cohort gives the distal femoral and proximal tibial centres only: not visible before
    30 and 33 weeks gestation respectively, 100% and 73.7% present at 35 and 37 weeks, n=199 Japanese pregnancies, explicit
    >1 mm visualization criterion (funaki2020). Rabbit has a complete 16-stage histological sequence with ages (rivas2002).'
  what_is_missing: Prospective, imaging-based appearance timing with dispersion, by sex and population, for the remaining
    epiphyses. Existing values circulate as atlas norms without retrievable primary cohorts or confidence intervals.
  nearest_evidence:
  - funaki2020
  - rivas2002
  discriminating_experiment: Retrospective analysis of an existing large paediatric MRI or low-dose CT repository, scoring
    first appearance of each epiphyseal ossification centre against chronological age, sex and recorded ancestry, with survival
    analysis to produce median age and interquartile range per centre. The deliverable is a table of appearance ages with
    dispersion that can be compared directly against the mouse two-week window, and that tests whether appearance order is
    conserved across populations or shifts with the same secular trend seen in stature.
  tractability: 4
- gap_id: g_l0dev_007
  question: Does the human interzone give rise to articular but not growth plate chondrocytes, as it does in mouse?
  type: species_gap
  layer: L0
  why_it_matters: The separation of the joint lineage from the growth plate lineage at the interzone is the reason the atlas
    treats articular and growth plate chondrocytes as different cells with different rules, and it underpins the assumption
    that articular cartilage cannot resupply a depleted resting zone. If in humans the two lineages remain connected for longer,
    then the articular surface is a potential progenitor reserve for the plate and the finite-capacity argument in L2 weakens.
  what_is_known: Gdf5-Cre lineage tracing in mouse shows interzone descendants build articular cartilage, synovium and intra-articular
    ligaments but not growth plate chondrocytes (koyama2008), and inducible pulses show continuous recruitment rather than
    clonal expansion (shwartz2016). Human GDF5 activating and inactivating mutations produce joint fusion and short middle
    phalanges respectively (seemann2005), which is consistent with but does not demonstrate the same lineage separation.
  what_is_missing: Any human fate map. Lineage tracing is impossible in humans, so the question has to be approached by somatic-mutation
    phylogenetics or by high-resolution developmental transcriptomics.
  nearest_evidence:
  - koyama2008
  - shwartz2016
  - to2024
  discriminating_experiment: Somatic single-nucleotide-variant phylogenetics on microdissected articular cartilage and growth
    plate resting zone from the same human joint, using deep sequencing of laser-captured zonal samples to reconstruct clonal
    trees. Under the mouse-like model the two compartments occupy separate branches diverging early in development. Under
    a shared-reservoir model they share late private variants, indicating continued exchange. The human embryonic multi-omic
    atlas (to2024) provides the developmental-stage reference against which the branch points can be dated.
  tractability: 2
- gap_id: g_l0dev_008
  question: What patterns whether a given end of a skeletal element forms a growth plate at all, and does the same patterning
    set how fast that plate will run?
  type: known_unknown
  layer: L0
  why_it_matters: Metacarpals and metatarsals grow from one end only, and the pisiform is the only carpal with a growth plate.
