- gap_id: g_l0dev_004
  question: Are HOX genes expressed in growth plate chondrocytes, and if so in which zone, in any species and in human?
  type: search_established
  layer: L0
  why_it_matters: 'The entire proposition that positional identity is retained by the growth plate rests on knowing whether
    the cells of the plate express HOX at all. The two most relevant mouse studies disagree about where retained Hoxa11 sits:
    one reports adult Hoxa11-EGFP as EXCLUSIVE to zeugopod bone marrow MSCs (rux2016), the other finds Hoxa11 maintained in
    zeugopod articular chondrocytes to six months (rux2021). Neither examined the growth plate. If HOX is absent from growth
    plate chondrocytes, then any HOX effect on elongation must act through the perichondrium or the marrow stroma, which relocates
    the mechanism to a different compartment and a different set of drugs.'
  what_is_known: Bulk laser-capture RNA-seq of separated proliferative and hypertrophic zones detects Hoxd13, Shox and Tbx5
    differences between phalangeal and tibial plates (lui2018), so positional transcripts are present at bulk-zone level in
    rodent. Hox11 function is required postnatally for zeugopod elongation (pineault2015). No in situ hybridization, immunohistochemistry
    or single-cell dataset resolving HOX by growth plate zone was retrieved.
  what_is_missing: Zone-resolved HOX localization in a growth plate, in any species, and any HOX measurement in human growth
    plate tissue. A Europe PMC search combining Hox genes with growth plate, chondrocyte and zone terms returned 90 records;
    the top 20 by relevance were screened and none reports zonal HOX localization in a growth plate. The two closest are rux2021
    (articular, not growth plate cartilage) and lui2018 (bulk zonal RNA-seq, no localization).
  nearest_evidence:
  - rux2016
  - rux2021
  - lui2018
  discriminating_experiment: RNAscope for HOXA11, HOXD11, HOXA13 and HOXD13 on serial sections of mouse proximal tibia (Hox11
    domain), distal femur (Hox10 domain) and metacarpal (Hox13 domain) at P10 and P28, scored per zone, alongside the same
    probes on archived human growth plate specimens from epiphysiodesis or post-mortem tissue. Under the retained-identity
