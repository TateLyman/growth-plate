- gap_id: g_l7fuse_012
  question: Why do different growth plates in the same individual, exposed to the same circulating estradiol, fuse years apart
    in a reproducible order?
  type: known_unknown
  layer: L7
  why_it_matters: Site-asynchronous fusion is the sharpest constraint any mechanistic model has to satisfy, and it falsifies
    any purely systemic account. Whatever ends the plate must be a local clock that a systemic signal only modulates. Identifying
    that local clock would explain skeletal proportion, would explain why estrogen excess shortens limbs preferentially, and
    would identify the target for any intervention that aims to extend growth at one site.
  what_is_known: Human fusion proceeds in an ascending foot-to-wrist order with the distal radius last (kvist2021), and pairwise
    sequences across 21 epiphyses are largely invariant within a population (schaefer2007). In rodents, functional, structural
    and molecular senescent changes occur earlier in the growth plates of small bones (metacarpals, phalanges) than of large
    bones (femur, tibia), and the differential involves modulation of IGF, BMP and WNT signalling (lui2018, mouse and rat).
    Positional identity is established embryonically by HOX-code patterning, which is a plausible but untested source of the
    site-specific set point.
  what_is_missing: No human data on site-specific differences in growth plate gene expression, progenitor number or estrogen-receptor
    abundance. No demonstration in any species that the site-specific clock is cell-autonomous rather than imposed by local
    mechanics, perfusion or perichondrial signalling.
  nearest_evidence:
  - kvist2021
  - lui2018
  - schaefer2007
  discriminating_experiment: 'Model system: paired early-fusing (proximal phalanx or calcaneus) and late-fusing (distal radius
    or distal femur) physeal specimens from the SAME human donors (g_l7fuse_002), plus heterotopic transplantation of early-
    and late-fusing rabbit growth plates into reciprocal sites in the same animal. Readout: site-matched single-nucleus RNA-seq
    and progenitor counts in the human pairs; time to fusion of transplanted rabbit plates in host versus donor site. Expected
    results - cell-autonomous clock: transplanted plates fuse on their donor schedule and human site pairs differ in senescence
    markers within donor. Environment-imposed clock: transplanted plates adopt the host site schedule and the human site pairs
    are transcriptionally indistinguishable, implicating local mechanics or perfusion instead.'
  tractability: 2
  search_log_ref: null
- gap_id: g_l7fuse_013
  question: What is the full distribution, not the mean, of height gain after menarche, and can the upper tail be predicted
    prospectively?
  type: quantitative_gap
  layer: L7
  why_it_matters: The clinical rule of thumb "girls grow about 5-7 cm after menarche" is used to counsel families, to decide
    whether to treat precocious puberty, and to time scoliosis surgery. In the best-measured cohort the mean is 8.0 cm but
    the standard deviation is 4.9 cm and the observed range runs from 0.2 to 31.1 cm. A rule of thumb whose SD is 60% of its
    mean, and whose tail is four times its mean, is not a clinical tool; using it as one produces systematic errors in exactly
    the early-maturing girls in whom the decision matters most.
  what_is_known: In 793 healthy term-born Swedish girls, mean age at menarche was 13.0 years (SD 1.3, range 8.2-17.2) and
    postmenarcheal growth averaged 8.0 cm (SD 4.9) with an observed range of 0.2 to 31.1 cm, decreasing with later menarche;
    menarche occurred at 71.6% (SD 18.8) of the QEPS-specific pubertal growth function, and data available at pubertal onset
    explained 44% of the variance in menarcheal age (grdstedtbergho2024). Adding menarcheal status to Tanner-Whitehouse height
    prediction narrows the 95% interval from plus or minus 5 cm to plus or minus 4 cm at age 12 and from plus or minus 4 cm
    to plus or minus 3 cm at age 13 (tanner1975).
  what_is_missing: The determinants of the upper tail. No study has reported which prospectively measurable variables at menarche
    - bone age, MRI fusion stage, height SDS, midparent height, BMI - identify the girls who will gain more than 15 cm. A
    Europe PMC search combining menarche with height gain, growth after menarche or postmenarcheal, longitudinal or cohort,
    and centimetres returned 471 records dominated by GnRH-agonist and growth hormone treatment series with predicted rather
    than observed adult height as the outcome.
  nearest_evidence:
  - grdstedtbergho2024
  - tanner1975
  discriminating_experiment: 'Model system: a prospective cohort of at least 1000 girls enrolled within 3 months of menarche
    with baseline height, weight, midparent height, hand radiograph read by BoneXpert, and MRI fusion staging of knee and
    wrist, followed to measured adult height. Readout: a quantile regression of postmenarcheal height gain on baseline covariates,
    reporting the 90th percentile explicitly rather than the conditional mean. Expected results - skeletal maturity dominant:
    MRI fusion stage at menarche explains most of the upper-tail variance and the conditional 90th percentile collapses once
    it is included. Tempo-independent: the tail persists after adjustment for all baseline maturity measures, which would
    establish an irreducible biological variance floor on postmenarcheal growth prediction and set the achievable limit for
    gap g_l7fuse_007.'
  tractability: 4
