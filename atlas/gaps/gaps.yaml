  - yu2025
  - haines1975
  discriminating_experiment: 'Model system: staged human physeal specimens (g_l7fuse_002) plus rabbit distal femoral plates
    at defined pre-fusion and fusion stages as a fusing-species positive control. Readout: SEM-EDS elemental mapping for Ca
    and P plus immunohistochemistry for COL2A1, COL10A1, aggrecan and MMP-13 plus an aggrecan neoepitope antibody, all on
    serial sections of the same plate. Expected results - matrix degradation model: MMP-13 and neoepitope signal rise at the
    bridging front in both human and rabbit. Murine-pattern model: MMP-13 and COL10A1 fall while mineral rises, in which case
    human fusion cannot be a matrix-degradation event and the trigger must be sought in the vasculature or the progenitor
    pool.'
