    (Akiyama 2004, Chen 2008); stabilisation gives severe chondrodysplasia or accelerated maturation depending on stage (Akiyama
    2004, Dao 2012); transient adult activation causes premature growth plate closure (Yuasa 2009). At the progenitor stage
    beta-catenin is required for osteoblast rather than chondrocyte fate (Hill 2005, Day 2005).'
  what_is_missing: No graded, quantified perturbation in human chondrocytes. A search for human chondrocyte beta-catenin dose-response
    returns 32 records, all either articular/osteoarthritis pharmacology, rodent metatarsal work, or reviews - none titrates
    beta-catenin activity in human growth plate chondrocytes against a differentiation readout.
