  discriminating_experiment: 'Validate a candidate readout against ground truth in a large-animal model: in growing lambs
    with implanted microtransducers measuring elongation continuously, acquire serial ultra-high-field sodium/gagCEST MRI
    and matched serum collagen X neoepitope, then terminally measure hypertrophic cell volume stereologically. A readout that
    tracks measured elongation with r>0.8 across a manipulated range of growth rates (for example dexamethasone-suppressed
