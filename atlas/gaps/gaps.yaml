  question: Why is FGFR3 K650M (SADDAN) survivable when K650E (thanatophoric dysplasia type II) is lethal, despite K650M producing
    roughly three times the constitutive receptor kinase activity?
  type: contradiction
  layer: L11
  why_it_matters: This is the single observation that falsifies the simplest model of the whole FGFR3 series - that phenotype
    severity is a monotonic function of receptor activation strength. If the scalar model is wrong, then drug development
    premised on 'reduce FGFR3 kinase output' (infigratinib, TYRA-300) is targeting a quantity that does not by itself determine
    outcome, and the relevant variable is pathway bias, receptor localisation or tissue distribution.
  what_is_known: Tavormina 1999 measured ~3-fold greater constitutive kinase activity for K650M than for K650E in transient
    transfection, and reported four unrelated K650M individuals surviving past infancy without prolonged life support. Bellus
    2000 showed the same codon generates weakly activating alleles (K650N, K650Q) that cause hypochondroplasia-like disease.
    Wilcox 1998 independently found that K650E growth plates are BETTER preserved than R248C and Y373C plates, a second non-monotonicity
    in the same series.
  what_is_missing: No study has compared downstream pathway usage (MAPK/ERK vs STAT1 vs PLCgamma), receptor trafficking, or
    ligand dependence between K650M and K650E in chondrocytes rather than in generic transfected cells. Lethality in thanatophoric
    dysplasia is respiratory, driven by thoracic cage and cranial base geometry, and no study has asked whether the two alleles
    differ in their effect on those specific skeletal elements rather than on the long bones.
  nearest_evidence:
  - tavormina1999
  - bellus2000
  - wilcox1998
  discriminating_experiment: Express K650M and K650E FGFR3 at matched levels in human iPSC-derived chondrocytes and in a costal-cartilage
    explant model; quantify phospho-ERK, phospho-STAT1 and receptor surface residence, and measure rib and cranial base growth
    in matched knock-in mouse alleles. Under the scalar model K650M shows uniformly greater signalling and worse growth on
    every readout; under a pathway-bias model K650M exceeds K650E on ERK but not on STAT1, and STAT1 output tracks the lethal
