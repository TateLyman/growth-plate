- gap_id: g_l7fuse_012
  question: Why do different growth plates in the same individual, exposed to the same circulating estradiol, fuse years apart
    in a reproducible order?
  type: known_unknown
  layer: L7
  why_it_matters: Site-asynchronous fusion is the sharpest constraint any mechanistic model has to satisfy, and it falsifies
    any purely systemic account. Whatever ends the plate must be a local clock that a systemic signal only modulates. Identifying
    that local clock would explain skeletal proportion, would explain why estrogen excess shortens limbs preferentially, and
    would identify the target for any intervention that aims to extend growth at one site.
  what_is_known: Human fusion proceeds in an ascending foot-to-wrist order with the distal radius last (kvist2021), and pairwise
    sequences across 21 epiphyses are largely invariant within a population (schaefer2007). In rodents, functional, structural
    and molecular senescent changes occur earlier in the growth plates of small bones (metacarpals, phalanges) than of large
    bones (femur, tibia), and the differential involves modulation of IGF, BMP and WNT signalling (lui2018, mouse and rat).
    Positional identity is established embryonically by HOX-code patterning, which is a plausible but untested source of the
    site-specific set point.
  what_is_missing: No human data on site-specific differences in growth plate gene expression, progenitor number or estrogen-receptor
    abundance. No demonstration in any species that the site-specific clock is cell-autonomous rather than imposed by local
    mechanics, perfusion or perichondrial signalling.
  nearest_evidence:
  - kvist2021
  - lui2018
  - schaefer2007
  discriminating_experiment: 'Model system: paired early-fusing (proximal phalanx or calcaneus) and late-fusing (distal radius
    or distal femur) physeal specimens from the SAME human donors (g_l7fuse_002), plus heterotopic transplantation of early-
    and late-fusing rabbit growth plates into reciprocal sites in the same animal. Readout: site-matched single-nucleus RNA-seq
    and progenitor counts in the human pairs; time to fusion of transplanted rabbit plates in host versus donor site. Expected
    results - cell-autonomous clock: transplanted plates fuse on their donor schedule and human site pairs differ in senescence
    markers within donor. Environment-imposed clock: transplanted plates adopt the host site schedule and the human site pairs
    are transcriptionally indistinguishable, implicating local mechanics or perfusion instead.'
  tractability: 2
  search_log_ref: null
- gap_id: g_l7fuse_013
  question: What is the full distribution, not the mean, of height gain after menarche, and can the upper tail be predicted
    prospectively?
  type: quantitative_gap
  layer: L7
  why_it_matters: The clinical rule of thumb "girls grow about 5-7 cm after menarche" is used to counsel families, to decide
    whether to treat precocious puberty, and to time scoliosis surgery. In the best-measured cohort the mean is 8.0 cm but
    the standard deviation is 4.9 cm and the observed range runs from 0.2 to 31.1 cm. A rule of thumb whose SD is 60% of its
    mean, and whose tail is four times its mean, is not a clinical tool; using it as one produces systematic errors in exactly
    the early-maturing girls in whom the decision matters most.
  what_is_known: In 793 healthy term-born Swedish girls, mean age at menarche was 13.0 years (SD 1.3, range 8.2-17.2) and
    postmenarcheal growth averaged 8.0 cm (SD 4.9) with an observed range of 0.2 to 31.1 cm, decreasing with later menarche;
    menarche occurred at 71.6% (SD 18.8) of the QEPS-specific pubertal growth function, and data available at pubertal onset
    explained 44% of the variance in menarcheal age (grdstedtbergho2024). Adding menarcheal status to Tanner-Whitehouse height
    prediction narrows the 95% interval from plus or minus 5 cm to plus or minus 4 cm at age 12 and from plus or minus 4 cm
    to plus or minus 3 cm at age 13 (tanner1975).
  what_is_missing: The determinants of the upper tail. No study has reported which prospectively measurable variables at menarche
    - bone age, MRI fusion stage, height SDS, midparent height, BMI - identify the girls who will gain more than 15 cm. A
    Europe PMC search combining menarche with height gain, growth after menarche or postmenarcheal, longitudinal or cohort,
    and centimetres returned 471 records dominated by GnRH-agonist and growth hormone treatment series with predicted rather
    than observed adult height as the outcome.
  nearest_evidence:
  - grdstedtbergho2024
  - tanner1975
  discriminating_experiment: 'Model system: a prospective cohort of at least 1000 girls enrolled within 3 months of menarche
    with baseline height, weight, midparent height, hand radiograph read by BoneXpert, and MRI fusion staging of knee and
    wrist, followed to measured adult height. Readout: a quantile regression of postmenarcheal height gain on baseline covariates,
    reporting the 90th percentile explicitly rather than the conditional mean. Expected results - skeletal maturity dominant:
    MRI fusion stage at menarche explains most of the upper-tail variance and the conditional 90th percentile collapses once
    it is included. Tempo-independent: the tail persists after adjustment for all baseline maturity measures, which would
    establish an irreducible biological variance floor on postmenarcheal growth prediction and set the achievable limit for
    gap g_l7fuse_007.'
  tractability: 4
  search_log_ref: g_l7fuse_013
- gap_id: g_l8gwas_001
  question: What fraction of the 12,111 independent height-associated SNPs exert their effect through the growth plate chondrocyte,
    as opposed to through muscle, endocrine tissue, vasculature, or systemic nutrition-sensing tissue?
  type: quantitative_gap
  layer: L8
  why_it_matters: The entire premise of a growth-plate-centred atlas is that the plate is where stature is set. That premise
    is widely assumed and rarely quantified. If the chondrocyte-attributable fraction is 30% rather than 80%, then large parts
    of L3-L7 explain a minority of height variance and the atlas's centre of gravity is wrong. It also determines which tissue
    a therapeutic should target.
  what_is_known: Richard 2025 generated epigenomic and transcriptomic maps from chondrocytes sampled across multiple growth
    plates of developing human skeletons and intersected them with height GWAS signal, concluding that regulatory pleiotropy
    dominates and separating skeletal-element-specific from global-acting variants. Darbellay 2024 showed in mouse that variants
    overlapping chondrocyte-specific enhancers (2,704 identified, 780 genes) explain height differences better than variants
    overlapping non-chondrogenic enhancers, establishing enrichment. Yengo 2022 reports that association density is elevated
    near biologically relevant genes.
  what_is_missing: Enrichment is not partition. No source states the PERCENTAGE of height SNP heritability attributable to
    growth-plate chondrocyte regulatory activity, with a confidence interval, benchmarked against competing tissues in the
    same analysis. The published framing is qualitative ("prime importance of regulatory pleiotropy") rather than a variance
    decomposition.
  nearest_evidence:
  - richard2025
  - darbellay2024
  - yengo2022
  discriminating_experiment: 'Stratified LD-score regression (or equivalent, e.g. sc-linker) partitioning height SNP-heritability
    across a matched panel of cell-type-specific regulatory annotations that includes human growth-plate chondrocytes by zone
    (from the Richard 2025 maps), skeletal muscle, hepatocyte, pituitary somatotroph, adipocyte and vascular endothelium,
    all generated on the same platform to avoid annotation-quality confounding. Readout: proportion of h2-SNP per annotation
    with standard errors. Under a plate-centric model the chondrocyte annotation takes the largest share and zone-resolved
    annotations (proliferative/hypertrophic) are individually significant; under a distributed model no single tissue exceeds
    ~25% and the chondrocyte share is comparable to muscle and endocrine annotations.'
  tractability: 4
  search_log_ref: g_l8gwas_001
- gap_id: g_l8gwas_002
  question: Do cis-regulatory variants identified in human growth plate chondrocytes have measurable expression effects in
    situ - i.e. does a growth-plate eQTL catalogue from primary human physeal tissue exist, with donor numbers sufficient
    to map effects by zone?
  type: search_established
  layer: L8
  why_it_matters: Chromatin accessibility and enhancer maps show where regulatory potential lies, but an eQTL requires genotype-by-expression
    across many donors and is the direct evidence that a height variant changes gene dosage in the tissue that builds stature.
    Without it, variant-to-gene assignment in the growth plate rests on accessibility overlap and orthology rather than measured
    allelic effect, which weakens every causal claim linking L8 to L1-L3.
  what_is_known: Human chondrocyte epigenomic/transcriptomic maps across skeletal sites now exist (Richard 2025). eQTL catalogues
    exist for human osteoclasts and for articular/primary cartilage in the osteoarthritis literature, and GTEx covers neither
    growth plate nor any cartilage tissue.
  what_is_missing: 'A donor-scale eQTL map of human GROWTH PLATE (physeal) chondrocytes, resolved by zone. Searching yields
    osteoarthritis articular-cartilage eQTL work, osteoclast eQTL work, and Mendelian-randomization studies using non-skeletal
    eQTL panels - none is physeal, and none is zone-resolved. The obstacle is structural rather than technical: human growth
    plate tissue is obtainable only as surgical discard in small numbers, so assembling the tens-to-hundreds of genotyped
    donors an eQTL scan needs is the binding constraint.'
  nearest_evidence:
  - richard2025
  - darbellay2024
  discriminating_experiment: 'A multi-centre consortium banking physeal cartilage from routine paediatric orthopaedic procedures
    (epiphysiodesis, limb realignment, polydactyly correction, amputation), targeting >=150 genotyped donors, with zone separation
    by laser-capture microdissection and RNA-seq, analysed as a cis-eQTL scan conditioned on age, site and sex. Readout: number
    of physis-specific eGenes and their overlap with the 12,111 height SNPs. If growth-plate eQTLs are largely shared with
    other cartilage, the tissue-scarcity problem is partly solvable by proxy tissue; if a substantial fraction are physis-specific,
    no proxy is adequate and the banking effort is unavoidable.'
  tractability: 2
  search_log_ref: g_l8gwas_002
