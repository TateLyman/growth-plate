    population forms a WNT-inhibitory niche that keeps chondroprogenitors WNT-inactive.
  what_is_missing: No zonal quantification of nuclear beta-catenin, of WNT ligand and antagonist protein, or of TCF reporter
    activity in the same growth plate, in any species. The relative contribution of the three candidate mechanisms has never
    been partitioned.
