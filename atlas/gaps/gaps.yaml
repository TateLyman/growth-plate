- gap_id: g_l6mech_010
  question: In young athletes, can the growth attenuation associated with high training volume be separated into a mechanical
    component acting on the physis and an energetic/endocrine component acting systemically?
  type: known_unknown
  layer: L6
  why_it_matters: 'The gymnastics debate has run for over thirty years without resolution because training volume, energy
    deficit, later maturation and constitutional selection are perfectly confounded in every published cohort. For this layer
    the specific question is narrower and answerable: gymnastics loads the upper limb physes far outside the normal range
    while loading the lower limb physes more conventionally, so a within-athlete site contrast can isolate mechanics from
    systemic effects.'
  what_is_known: Gymnasts training >18 h/wk had PHV 5.48 vs 8.0 cm/yr in swimmers with falling height SDS and selective leg-length
    stunting (theintz1993); a within-sport dose gradient exists in sitting height velocity (daly2005); spurts are present
    but about a year late and match short late-maturing girls with short parents (thomis2005); and the FIG review concludes
    causality is not established (malina2013). Site-specific load effects are demonstrated for the gymnast wrist, where acquired
    positive ulnar variance shows the radius is locally shortened (difiori2006).
  what_is_missing: A design that separates the two mechanisms rather than adjudicating between whole-body correlations. No
    study has compared segment-specific growth at heavily loaded versus lightly loaded physes within the same athletes while
    measuring energy availability.
  nearest_evidence:
  - theintz1993
  - daly2005
  - difiori2006
  discriminating_experiment: Prospective 3-year cohort of prepubertal artistic gymnasts, rhythmic gymnasts (comparable energy
    restriction, far less upper-limb loading) and swimmers, with (a) segment-specific growth measured at the distal radius,
    distal ulna, humerus, femur and tibia by serial low-dose imaging, (b) upper- and lower-limb loading quantified by accelerometry
    and training logs, and (c) energy availability, IGF-1, leptin and gonadotrophins measured every 6 months. Under a mechanical
    mechanism, growth deficit is concentrated at the heavily loaded distal radius and scales with limb-specific load while
    lower-limb growth tracks energy availability. Under a purely systemic mechanism, all segments are attenuated proportionally
    and the deficit tracks energy availability alone, with rhythmic gymnasts matching artistic gymnasts despite much lower
    upper-limb loading.
