- gap_id: g_l3rest_006
  question: What is the quantitative dose-response relationship between beta-catenin transcriptional activity and chondrocyte
    fate (matrix gene expression, hypertrophy onset, osteoblastic conversion) in HUMAN growth plate chondrocytes?
  type: quantitative_gap
  layer: L3
  why_it_matters: 'Every statement in this layer about WNT being "dose-dependent" in cartilage rests on mouse alleles that
    are effectively two-point: null and stabilised. Between those two points sits the entire physiological range, and that
    is where a drug would operate. Without a human dose-response curve there is no way to predict whether a given degree of
    WNT modulation would lengthen or shorten a human bone, and the mouse data predict opposite outcomes at the two ends.'
