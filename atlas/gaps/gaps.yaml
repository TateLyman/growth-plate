- gap_id: g_l4endo_007
  question: Which thyroid hormone receptor isoform mediates T3 action in growth plate chondrocytes - TRalpha, as human THRA
    mutations imply, or TRbeta, as mouse rib chondrocyte knockouts imply?
  type: contradiction
  layer: L4
  why_it_matters: Isoform-selective thyromimetics (resmetirom-class TRbeta agonists) are entering clinical use, and their
    skeletal safety in growing children depends entirely on which isoform the plate uses. If the plate is TRbeta-driven, a
    TRbeta-selective agonist would accelerate hypertrophic differentiation and advance bone age; if TRalpha-driven, the same
    drug would be skeletally silent. The literature currently supports both answers.
  what_is_known: Human side - heterozygous dominant-negative THRA variants cause growth retardation, delayed bone age and
    disharmonious short stature with low free T4 and normal-to-mildly- raised TSH, and these children respond to levothyroxine
    plus rhGH with height gains up to 2.5 SDS (jorge2025). Human RTHbeta (dominant-negative THRB) is common, well described
    and typically NOT associated with short stature. Mouse side - in primary neonatal rib chondrocytes, T3 reduced proliferation
    and accelerated differentiation normally in TRalpha-deficient cells but ALL T3 responses were abolished in TRbeta-deficient
    cells, and T3 upregulated TRbeta1 itself (rabier2006). Both TRalpha1, TRalpha2 and TRbeta1 protein are present in rat
    reserve and proliferating zone chondrocytes and absent from hypertrophic cells (robson2000), so localisation does not
    adjudicate.
  what_is_missing: No isoform-selective test in long-bone growth plate chondrocytes of either species - the mouse experiment
    used RIB chondrocytes, a different skeletal element - and no measurement of THRA versus THRB transcript or protein in
    human physeal tissue. Germline knockouts also permit compensation that a conditional, adult-onset deletion would not.
  nearest_evidence:
  - jorge2025
  - rabier2006
  - robson2000
  discriminating_experiment: Model system - side-by-side conditional deletion of Thra and Thrb in Acan-CreERT2 chondrocytes
    of the mouse proximal tibia, induced postnatally, plus primary human growth plate chondrocytes from surgical waste treated
    with isoform-selective agonists (TRbeta-selective resmetirom-class compound versus a TRalpha-sparing control) at matched
    receptor occupancy. Readout - tibial length and zonal heights in vivo; COL10A1, ALPL and proliferation index in the human
    cells; isoform transcript quantification in the same human tissue. Expected result - under the human-genetics-led model,
    Thra deletion shortens the tibia and TRbeta-selective agonists leave human chondrocyte differentiation markers unchanged;
    under the mouse-chondrocyte-led model, Thrb deletion is the one that blocks hypertrophic differentiation and the TRbeta
    agonist induces COL10A1 in human cells - which would be a direct paediatric safety signal for that drug class.
  tractability: 3
- gap_id: g_l4endo_008
  question: What drives the seasonal variation in human height velocity - photoperiod, ambient temperature, or seasonal nutrition
    - and why does the phase of the peak differ between cohorts?
  type: contradiction
  layer: L4
  why_it_matters: The seasonal amplitude is not trivial (~13% of mean linear growth velocity in infants), which means growth-velocity
    measurement intervals shorter than a year are systematically biased by season - directly affecting clinical decisions
    about starting or stopping GH and the interpretation of short trials. It is also the only routinely observable environmental
    modulator of the human growth plate, so identifying the transducer would be mechanistically valuable.
  what_is_known: Three large human cohorts agree that seasonality is real and disagree on phase and driver. In 11,587 three-month
    intervals from 2,277 GH-treated prepubertal children, height velocity scaled with average daylight hours (+0.146 cm/yr
    per hour in treatment year 1, +0.121 thereafter), the effect grew with latitude, and calendar month had no independent
    effect - a photoperiod signature (shulman2013). In 9,409 Japanese infants, length z-velocity peaked in SUMMER, with a
    winter-summer difference of 0.0026 z/day (95% CI 0.0015-0.0036), about 13% of mean velocity (narumi2020). In 760 Danish
    8-11 year olds, height velocity was above the 6.10 cm/yr mean in JANUARY-APRIL, and unlike earlier reports of a spring
    height peak with an autumn weight peak, weight, BMI and fat-free mass index peaked coincidentally (dalskov2016).
  what_is_missing: No study manipulates photoperiod, temperature or energy intake independently while measuring growth, and
    no study measures a candidate mediator (melatonin amplitude, 25-hydroxyvitamin D, IGF-1, GH pulsatility) longitudinally
    across seasons in the same children with growth as the outcome. The competing explanations have never been placed in one
    model.
