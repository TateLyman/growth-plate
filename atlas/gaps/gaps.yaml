- gap_id: g_l4endo_009
  question: Which IGF binding proteins are present in the human growth plate, and do they form a zonal gradient that sets
    the free IGF-1 concentration differently in the resting, proliferative and hypertrophic zones?
  type: search_established
  layer: L4
  why_it_matters: The IGF bioavailability layer is demonstrably load-bearing in humans - PAPP-A2 loss raises total IGF-1 several-fold
    while cutting the bioactive fraction to 0.09-0.32% and producing heights of -2.16 to -3.81 SDS - yet the entire model
    is built on serum measurements. If IGFBP-5, which binds hydroxyapatite and matrix, forms a zonal reservoir in the plate,
    then the local free IGF-1 concentration is a matrix property rather than a circulating one, and PAPP-A2 replacement therapy
    would act by remodelling that reservoir rather than by raising serum free IGF-1.
