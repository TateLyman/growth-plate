  type: quantitative_gap
  layer: L3
  why_it_matters: NPR2 is one of very few human loci with a measured three-state dosage series and an approved pathway-targeted
    drug. A calibrated activity-to-height curve would convert an in vitro cGMP assay on a novel variant into a predicted height
    effect, would say how much residual activity a CNP analogue must restore to be worth giving, and would test whether the
    relationship is linear or thresholded.
  what_is_known: Individual points exist but on incompatible scales. Biallelic loss gives adult heights around 120-134 cm
    (arya2020, with the 120 cm figure a secondary citation). Heterozygous carriers sit at -1.8 +/- 1.1 SDS versus -0.4 +/-
    0.8 in non-carrier relatives (olney2006) and -2.06 +/- 0.97 versus -1.37 +/- 0.59 in wild-type siblings (hanley2020),
    with individual dominant-negative families spanning -4.5 to -1.7 SDS (vasques2013). Gain-of-function alleles give +1.30
    to +2.77 SDS (lauffer2020) and extreme tall stature (hannema2013). Many of these variants have been assayed for cGMP output
    in HEK293 cells or patient fibroblasts, but with different constructs, ligand concentrations and normalisation.
  what_is_missing: No single study measures cGMP output for a panel of variants under one standardised protocol and regresses
    it against measured height SDS with confidence intervals. Consequently the shape of the dose-response - linear, thresholded,
    or saturating - is unknown.
  nearest_evidence:
  - arya2020
  - olney2006
  - hanley2020
  - vasques2013
  - lauffer2020
  - hannema2013
  - wang2015
  discriminating_experiment: 'Assemble the published NPR2 variant set (>60 alleles) and express each in a single NPR2-null
    HEK293 line at matched surface expression measured by flow cytometry, assaying basal and CNP-stimulated cGMP across a
    full ligand dose-response; for heterozygous alleles co-express with wild-type at 1:1 to capture dominant-negative effects.
    Regress log(cGMP Emax, percent of wild-type) against reported adult height SDS with a mixed model accounting for family
    and ancestry. Prediction under a linear model: height SDS is proportional to residual activity across the whole range.
    Prediction under a threshold model: height is insensitive above roughly 50% residual activity and falls steeply below
    it, which would explain why heterozygous carriers cluster near -2 SDS rather than midway between normal and AMDM.'
