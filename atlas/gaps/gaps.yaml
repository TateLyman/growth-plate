- gap_id: g_l7fuse_011
  question: Is the rat terminal growth plate morphology - a bone band sealing the metaphyseal edge with acellular regions
    - homologous to any stage of human epiphyseal union, or a distinct endpoint?
  type: species_gap
  layer: L7
  why_it_matters: The rat is the workhorse of growth plate endocrinology and pharmacology, and its terminal phenotype is routinely
    described as if it were fusion or as if the difference from humans were merely quantitative. If the rat endpoint is mechanistically
    distinct, every rat study of "growth plate closure" is measuring something else, and the atlas must grade rat fusion claims
    as high risk rather than moderate.
  what_is_known: 'Aged Wistar rats (62-80 weeks) retain histologically present femoral and tibial growth plates while longitudinal
    growth has ceased, developing four morphologies absent from young plates: a metaphyseal bone band sealing that edge, acellular
    regions resistant to resorption, intraplate remodelling and bone formation, and direct bone formation by former growth
    plate chondrocytes; sporadic proliferation continues but loses synchrony (roach2003, rat). The mouse endpoint is different
    again - persistent calcified cartilage with loss of type X collagen and MMP-13 (yu2025, mouse) - despite countable bony
    bridges (samvelyan2022, mouse). Human union destroys the cartilage entirely (haines1975).'
  what_is_missing: No study has applied the same stains, markers and 3D imaging to rat, mouse, rabbit and human terminal plates
    in a single comparison, so the descriptive claims sit in incomparable literatures using different methods decades apart.
  nearest_evidence:
  - roach2003
