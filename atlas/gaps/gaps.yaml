- gap_id: g_l7fuse_004
  question: Does the human growth plate at fusion show the same matrix trajectory as the aged mouse plate - accumulating mineral
    while losing type X collagen and MMP-13 - or the opposite?
  type: species_gap
  layer: L7
  why_it_matters: The only quantitative matrix data on a terminal growth plate come from mice, and they show the degradative
    machinery being switched OFF as mineral accumulates. If humans do the same, then a matrix-degradation model of fusion
    is wrong and some additional trigger is needed to convert calcified cartilage into bone. If humans do the opposite, mouse
    matrix data are actively misleading and should be excluded from human reasoning about fusion.
  what_is_known: In mice, hypertrophic-zone Ca and P content rose and the mineralised area expanded between 10 and 55 weeks
    while type X collagen and MMP-13 became undetectable and aggrecan and type II collagen became sparse; the plate remained
    calcified cartilage and was never replaced by bone (yu2025, mouse). In humans, mineralisation advances from both plate
    surfaces and first union is by mineralised cartilage acting as metaplastic bone (haines1975, human and dog), which is
    qualitatively compatible with the murine mineral accumulation but says nothing about the enzymes.
  what_is_missing: No collagen typing, proteoglycan quantification, MMP or ADAMTS profiling, or elemental analysis has ever
    been performed on a human growth plate at fusion. Mouse cannot substitute because the endpoint is absent; rabbit matrix
    composition at fusion has also not been characterised.
