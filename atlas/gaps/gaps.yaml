- gap_id: g_l6mech_012
  question: What determines whether a mechanically tethered human physis modulates its growth reversibly or forms a permanent
    bony bar?
  type: known_unknown
  layer: L6
  why_it_matters: 'This is the safety boundary of every growth-modulation procedure. Guided growth is intended to be reversible,
    epiphysiodesis is intended to be permanent, and physeal bar formation after trauma is the accidental version of the same
    event. Clinically the boundary is crossed unpredictably: transphyseal screws are described as reversible yet sometimes
    are not, and growth arrest after physeal fracture is far commoner than textbooks state.'
  what_is_known: Growth arrest occurred in 30.1% of 332 prospectively followed paediatric physeal fractures and 86% of distal
    femoral fractures, with older age and initial displacement associated (hooper2024). In mice, Pdgfra- and Pdgfrb-lineage
    cells absent from the uninjured plate migrate into a drill-hole defect and build the bar over 42 days (li2026_2). Non-idiopathic
    and varus deformities correct more slowly and less completely with tension-band plates (tolk2026, coskun2026). Purely
    mechanical modulation without physeal breach is reversible within 10 days in rats (mnard2015).
  what_is_missing: Any measurement of the mechanical or biological threshold that converts modulation into bridging - whether
    it is a stress magnitude, a breach of the physeal barrier allowing metaphyseal vessels and Pdgfr-lineage cells across,
    or a duration.
  nearest_evidence:
  - hooper2024
  - li2026_2
  - mnard2015
  discriminating_experiment: 'Rabbit proximal tibial model with three arms: extraphyseal tension-band tethering (no plate
    breach), transphyseal screw (breach without tissue loss) and drill-hole injury (breach with tissue loss), each at matched
    tethering force, for 6 weeks, with Pdgfra/Pdgfrb lineage reporters where available, micro-CT bar scoring and growth rate.
    Under a mechanical-threshold model, bar formation scales with applied stress irrespective of breach. Under a barrier-breach
    model, bars form only where the physeal barrier is crossed, independent of force, which would make implant design rather
    than tension the determinant of reversibility.'
  tractability: 4
- gap_id: g_l6mech_013
  question: Does removing mechanical load from a growing human physis accelerate, slow, or leave unchanged its longitudinal
    growth rate?
  type: search_established
  layer: L6
  why_it_matters: The Hueter-Volkmann law predicts that unloading should accelerate growth, and this prediction is never tested
    because the only human unloading states are pathological. If unloading does accelerate physeal growth, then immobilised
    and non-ambulant children should overgrow rather than undergrow, which is the opposite of what is observed, and the discrepancy
    would bound how far the law extends below physiological load.
  what_is_known: Children and adolescents with cerebral palsy and other neuromotor impairments have smaller and thinner long
    bones (hodgson2025), and even ambulatory children with spastic cerebral palsy show reduced bone area and trabecular deficits
    (zimmermann2025) - so chronic disuse is associated with less bone, not more length. In mice, limb immobilisation abolished
    the load-driven growth plate phenotype of Ift88 deletion, showing unloading is protective for that phenotype rather than
    growth-promoting (coveney2022). Adult spaceflight raises stature up to 3% but reversibly and through the disc (young2023).
    No controlled paediatric bed rest study with a height-velocity endpoint was located.
  what_is_missing: A human unloading exposure in growing children that is not confounded by illness, nutrition, denervation
    or spasticity, with a segment-specific growth endpoint.
  nearest_evidence:
  - hodgson2025
  - coveney2022
  - young2023
  discriminating_experiment: Natural-experiment cohort using unilateral non-weight-bearing in otherwise healthy children -
    for example prolonged protected weight-bearing after unilateral Perthes disease treatment or after a unilateral lower-limb
    fracture treated non-operatively - with serial scanography of both limbs and accelerometry-quantified limb loading, comparing
    the unloaded and loaded sides within the same child so that nutrition and endocrine status are controlled. Under the Hueter-Volkmann
    prediction, the unloaded limb overgrows relative to the loaded one in proportion to the loading difference. Under a use-it-or-lose-it
    model, the unloaded limb grows less, which would mean the law does not extend below the physiological load range and that
    some minimum load is permissive for growth.
  tractability: 3
  search_log_ref: g_l6mech_013
- gap_id: g_l6mech_014
  question: How much of the measured diurnal stature loss originates in the vertebral endplate physes and epiphyseal cartilage
    rather than in the intervertebral discs, in growing children?
  type: quantitative_gap
  layer: L6
  why_it_matters: Diurnal stature loss is 19.3 mm in adults and 2-7 mm across a day in children, which is of the same order
    as several months of true growth and is routinely ignored in growth monitoring and in clinical trials of growth-promoting
    drugs. It is universally attributed to disc creep, but growth plate cartilage is itself viscoelastic and sits in series
    with the disc, and no study has partitioned the two. If a measurable fraction is physeal, then the daily loading and unloading
    cycle is a real mechanical stimulus to the physis and not merely measurement noise.
  what_is_known: Adult circadian stature variation is 19.3 mm, 1.1% of stature, with 54% lost in the first hour after rising
    and about 70% regained in the first half of the night, and it scales with applied load (tyrrell1985). Children aged 12-14
    lose 2.0 mm by early afternoon and 4.6 mm by late afternoon (whitehouse1974); children with idiopathic scoliosis lose
    about 7 mm standing and sitting (czaprowski2019). Paediatric imaging confirms diurnal spine-length variation is large
    enough to affect radiotherapy planning (meijer2024). The attribution to disc creep is universal but rests on adult spine
    mechanics.
  what_is_missing: A morning-versus-evening measurement that resolves disc height and physeal/epiphyseal cartilage thickness
    separately in the same growing children.
  nearest_evidence:
  - tyrrell1985
  - whitehouse1974
  - meijer2024
  discriminating_experiment: Paired morning and evening 3T MRI of the lumbar spine and of a peripheral growth plate (distal
    femur) in 20-30 children aged 8-14, with quantitative segmentation of intervertebral disc height, vertebral endplate cartilage
    thickness and distal femoral physeal thickness, accompanied by stadiometry to 1 mm. Under the pure-disc model, the summed
    disc height loss accounts for the whole stature loss and physeal thickness is unchanged. Under a series-compliance model,
    a measurable fraction (say >10%) of the loss is physeal and epiphyseal cartilage thinning, which would make the daily
    gravity cycle a genuine physeal loading stimulus and would put a floor on how precisely growth can be measured at all.
  tractability: 4
- gap_id: g_l4endo_001
  question: In a growing human, what fraction of IGF1R activation in growth plate chondrocytes is driven by IGF-1 produced
    within the plate itself versus IGF-1 delivered from the circulation, and how does that fraction change across the resting,
    proliferative and hypertrophic zones?
  type: quantitative_gap
  layer: L4
  why_it_matters: This single number decides between the somatomedin and dual-effector accounts, and it determines whether
    a therapeutic should raise circulating IGF-1 (mecasermin), raise GH to drive local IGF-1, or deliver IGF-1 to cartilage
    directly. The two hypotheses make opposite predictions about who benefits from rhIGF-1 versus rhGH in partial GH insensitivity,
    and the field currently answers the question with a mouse experiment (liver-specific Igf1 deletion) whose species caveats
    are usually dropped in review.
  what_is_known: Two independent liver-specific Igf1 deletions in mouse cut serum IGF-1 by roughly 75% with no detectable
    change in body weight, body length or femoral length (yakar1999, sjgren1999), so circulating IGF-1 is not rate-limiting
    in mouse at that level. Below a threshold - reached only when ALS knockout is combined with liver Igf1 deletion - growth
    plate total, proliferative and hypertrophic zone heights all fall and are restored by exogenous IGF-1 (yakar2002). On
    the local side, GH increases the number of IGF-1-immunoreactive chondrocytes in the rat germinal zone (nilsson1986) and
    somatomedin antiserum abolishes the local response to intra-arterial GH (schlechter1986). A cartilage-targeting antibody-IGF-1
    fusion raised growth plate height in GH-deficient lit mice without kidney off-target proliferation, showing IGF-1 delivered
    to the plate is sufficient (lui2019).
  what_is_missing: No measurement of IGF-1 concentration in human growth plate interstitial fluid, no zonal gradient, and
    no partition of receptor occupancy between locally produced and circulating ligand in any species. Every quantitative
    statement about the local/systemic split rests on mouse whole-body genetics, which cannot separate concentration from
    source at the receptor.
  nearest_evidence:
  - yakar1999
  - sjgren1999
  - yakar2002
  - nilsson1986
  - schlechter1986
  - lui2019
  discriminating_experiment: Model system - a mouse carrying an Igf1 allele whose product is distinguishable from wild type
    by mass (e.g. a tagged or codon-variant IGF-1), expressed either only in hepatocytes (Alb-Cre) or only in chondrocytes
    (Acan-CreERT2), on an otherwise Igf1-null background. Readout - targeted mass spectrometry of laser-capture- microdissected
    resting, proliferative and hypertrophic zones quantifying the two IGF-1 species separately, alongside phospho-IGF1R immunostaining
    by zone. Expected result - under a somatomedin model, hepatocyte-derived IGF-1 dominates the physeal pool in all zones
    and chondrocyte-derived IGF-1 is <20%; under a dual-effector model, chondrocyte- derived IGF-1 exceeds hepatocyte-derived
    in the resting and proliferative zones specifically and tracks GH dose. Human translation step - a parallel measurement
    in surgical human physeal tissue (epiphysiodesis or limb-lengthening waste tissue) of total and free IGF-1 per unit wet
    weight by zone, benchmarked against paired serum, to establish whether the human plate concentration exceeds what serum
    ultrafiltration could supply.
  tractability: 3
