    count, plus lineage- or marker-based assessment of whether the bone within the plate derives from chondrocytes. Expected
    results - homologous endpoints: rat sealed-edge bone and human perforation bone share a chondrocyte-derived signature
    and appear at the same relative bridge density. Distinct endpoints: rat intraplate bone is osteoblast-derived and appears
