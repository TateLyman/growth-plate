- gap_id: g_l11path_024
  question: Is there a single quantitative function relating cumulative estrogen exposure to adult height across the human
    disorders of pubertal timing?
  type: quantitative_gap
  layer: L11
  why_it_matters: Central precocious puberty, constitutional delay, congenital adrenal hyperplasia, aromatase deficiency,
    aromatase excess and ESR1 resistance are six human perturbations of one variable - how much estrogen the growth plate
    sees and when. If one function fits all six, then adult height becomes predictable from an estrogen exposure integral
    and every timing intervention (GnRH analogues, aromatase inhibitors, sex steroid priming) can be dosed against it. If
    it does not fit, then timing and amplitude of exposure act separately and must be modelled separately.
  what_is_known: 'The endpoints of the range are established: no estrogen action gives unfused epiphyses and 204 cm (ESR1
    resistance) or continued adult growth (aromatase deficiency); excess estrogen gives premature fusion and short adult stature
    (aromatase excess, and CAH via aromatised adrenal androgen). GnRH analogue suppression preserves adult height in girls
    with precocious puberty when started early enough, and androgen therapy in constitutional delay has been meta-analysed
    against final adult height. CDGP itself shows that delayed exposure preserves adult height because delayed fusion compensates
    for delayed velocity.'
  what_is_missing: No study places these disorders on a common estrogen-exposure axis. Cumulative estradiol exposure is not
    measured in any of them, and adult height is reported against chronological age at pubertal onset rather than against
    an exposure integral.
  nearest_evidence:
  - bahar2025
  - wang2026
  - navardauskaite2026
  - smith1994
  discriminating_experiment: Construct a cumulative estradiol exposure metric (area under the serial serum estradiol curve,
    or a validated surrogate such as bone age advance per year) for cohorts of CPP, CDGP, CAH and aromatase deficiency patients
    with attained adult heights, and fit adult height SDS against the metric. Under a single-function model all disorders
    fall on one curve regardless of the cause of the altered exposure; under a timing-specific model, patients with the same
    integral but different timing (early-high versus late-high) have systematically different adult heights, and the residual
    quantifies the timing term.
  tractability: 3
- gap_id: g_l11path_025
  question: Has anyone compared an irradiated with a non-irradiated growth plate within the same patient, using recorded radiation
    dosimetry, to separate direct physeal damage from radiation-induced GH deficiency?
  type: search_established
  layer: L11
  why_it_matters: Therapeutic irradiation is the only spatially targeted, dose-quantified, deliberately applied perturbation
    of the human growth plate that exists. In craniospinal irradiation the vertebral physes are inside the field and the femoral
    and tibial physes are not, so a single patient contains both an exposed and an unexposed physis under an identical endocrine
    environment. That is a within-subject control no genetic disorder provides, and it would yield a dose-response curve for
    direct radiation injury to the human growth plate. The clinical stake is that GH replacement is offered on the assumption
    that the deficit is endocrine, which is only partly true.
  what_is_known: Craniospinal irradiation is known to reduce sitting height disproportionately to leg length; response to
    GH after radiotherapy is reported to depend on the location of irradiation; total body irradiation before haematopoietic
    transplantation causes generalised growth loss and GH therapy after transplantation has been characterised nationally.
    An aromatase inhibitor study in 92 GH-deficient male survivors compared final adult height with and without adjuvant aromatase
    inhibition.
  what_is_missing: No study links recorded radiation dose to the individual physis with the segment-specific growth outcome
    of that physis in the same patient. Sitting height and leg length are rarely both recorded in survivorship follow-up,
    and modern treatment-planning dosimetry - which gives the dose to each vertebral body and to each long bone - is not being
    joined to auxology.
  nearest_evidence:
  - pollock2024
  discriminating_experiment: Retrospectively link radiotherapy treatment-planning dosimetry to serial sitting height and subischial
    leg length in a childhood cancer survivor cohort, and model each segment's growth against the dose delivered to its own
    physes with GH status as a covariate. Under a purely endocrine model both segments are affected equally and dose to the
    individual physis adds nothing once GH status is known; under a direct-damage model segment growth falls with local physeal
    dose in a graded way, and the slope of that relationship is the human physeal radiation dose-response.
  tractability: 4
