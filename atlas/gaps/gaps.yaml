  question: What is the complete dose-response relationship between serum estradiol and human longitudinal growth rate, from
    the stimulatory low-dose limb through to the fusion-accelerating high-dose limb, measured within a single experiment?
  type: quantitative_gap
  layer: L4
  why_it_matters: Aromatase inhibitors and low-dose estrogen are both used to manipulate adult height, and they act on opposite
    sides of a curve whose shape is inferred rather than measured. Knowing where the maximum lies, and how steeply the curve
    turns, determines whether an aromatase inhibitor should aim for near-zero or for a low target estradiol, and whether a
    given transgender or Turner-syndrome estrogen regimen sits on the growing or the fusing side.
  what_is_known: 'The only direct human dose-response experiment is 40 years old and has n=5: four-day intravenous estradiol
    infusions at 4, 20 and 90 ug/day in prepubertal and early pubertal boys, double-blind and randomised, raised three-week
    ulnar growth velocity significantly only at the LOWEST dose (0.45 to 1.38 mm/3 weeks, P<0.05, serum estradiol 10 +/- 2.3
    pg/mL); at 20 and 90 ug/day the increments were smaller and non-significant while somatomedin-C rose only at the two higher
    doses (carusonicolett1985). Separately, the ascending limb has been fitted observationally: half-maximal pubertal growth
    acceleration at morning estradiol 20 pmol/L in girls (95% CI 13-31) and 6.5 pmol/L in boys (3.2-13), with <25% of potential
    growth remaining above the Tanner B2 range (albin2012, albin2013). The descending limb is known only through long-term
    pharmacology (ross2011, quigley2014, rosenfield2005) and through rabbit senescence experiments at a single high dose (weise2001,
    nilsson2014).'
  what_is_missing: No experiment measures growth rate at four or more estradiol concentrations spanning ~5 to ~200 pmol/L
    in the same individuals with a modern ultrasensitive assay, so the position of the maximum, the steepness of the descending
    limb, and whether the curve is genuinely biphasic rather than monotonically saturating are all unmeasured. The 1985 study
    is underpowered (n=5, three doses, no significant difference BETWEEN doses) and its assay is not comparable with current
    extraction RIA or LC-MS/MS values.
  nearest_evidence:
  - carusonicolett1985
  - albin2012
  - albin2013
  - ross2011
  - weise2001
  discriminating_experiment: Model system - prepubertal or early pubertal children (for example, girls with Turner syndrome
    already committed to estrogen replacement, or adolescents on GnRH-analogue suppression) randomised to four transdermal
    estradiol dose levels producing steady-state serum estradiol of approximately 5, 15, 40 and 120 pmol/L by LC-MS/MS, each
    maintained for 8-12 weeks in a crossover with washout. Readout - knemometry (lower-leg length velocity, resolution ~0.1
    mm/week) as the short-interval growth endpoint, with bone-age advance by automated AI reading and serum IGF-1, IGFBP-3
    and bone turnover markers as secondary outcomes. Expected result - under a biphasic model, growth velocity peaks at the
    15 pmol/L level and is lower at both 5 and 120 pmol/L while bone-age advance increases monotonically, giving a genuine
    inverted-U for growth against a monotone maturation curve; under a saturating model, growth velocity rises monotonically
    and plateaus, and the apparent "high-dose inhibition" is entirely attributable to accelerated maturation rather than to
    reduced growth rate.
