  - kinoshita2000
  - huckert2015
  - serra1997
  discriminating_experiment: 'Explanted human or porcine growth plate cartilage cores subjected to defined cyclic compression
    in a bioreactor, with active and total TGF-beta in the bathing medium quantified by a mink lung epithelial reporter assay
    before and after transient acidification, normalised to wet mass and to zone of origin. Readout: pg active TGF-beta released
    per mg tissue per loading cycle, versus total extractable latent pool. A store that is mechanically mobilised gives a
