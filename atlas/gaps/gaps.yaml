- gap_id: g_l3rest_014
  question: What fraction of human growth plate chondrocytes carry a primary cilium in each zone, and what is the ciliary
    length distribution?
  type: known_unknown
  layer: L3
  why_it_matters: The cilium is where Hedgehog transduction happens, and mouse work shows it does not merely amplify Hedgehog
    but confines it spatially - Kif3a-deficient plates lose internal hedgehog signalling while the perichondrium gains it.
    Human ciliopathies (Jeune, Ellis-van Creveld) are among the strongest human anchors in this layer, yet the organelle itself
    has not been quantified in human physeal tissue, so there is no baseline against which a ciliopathy specimen could be
    scored.
  what_is_known: Haycraft 2007 and Koyama 2007 establish the requirement for IFT88 and KIF3A in mouse. Wang 2013 shows IFT80
    is predominantly expressed in growth plate chondrocytes and that its loss lowers Hedgehog and raises WNT. Ruiz-Perez 2007
    localises EVC to the base of the chondrocyte cilium and shows Evc-null cilia are present but signalling-defective. Beales
    2007 and Ruiz-Perez 2000 supply the human ciliopathy genetics.
  what_is_missing: No ciliary prevalence or length morphometry in human growth plate by zone, and no comparison between a
    ciliopathy patient specimen and an age-matched control.
  nearest_evidence:
  - haycraft2007
  - koyama2007
  - wang2013
  - ruizperez2007
  discriminating_experiment: ARL13B and acetylated-alpha-tubulin immunofluorescence with gamma-tubulin basal body counterstain
    on thick sections of human growth plate, imaged by confocal or expansion microscopy, reporting percent ciliated cells
    and ciliary length per zone with n per donor, compared against archived Jeune or Ellis-van Creveld specimens. Under the
    mouse-conserved model, prevalence is high in all zones and length peaks in the prehypertrophic zone where Hedgehog transduction
    is most active; a ciliopathy specimen with normal prevalence but abnormal EVC-zone composition would specifically support
    the transduction-defect rather than ciliogenesis-defect model.
