- gap_id: g_l2stem_008
  question: How many cell divisions of proliferative capacity does a human growth plate resting-zone progenitor start with,
    and how many are spent per centimetre of bone elongated?
  type: quantitative_gap
  layer: L2
  why_it_matters: The finite-capacity model is stated qualitatively everywhere and quantified nowhere. Without a division
    budget and a cost-per-centimetre, the model makes no falsifiable prediction about final height, cannot be used to estimate
    how much height a period of growth suppression conserves, and cannot be compared across species.
  what_is_known: 'The model is division-dependent rather than age-dependent (baron1994, gafni2001, marino2008), and resting-zone
    cells are numerically depleted with age in rabbit (schrier2006). Mouse data give clone-level rather than division-level
    numbers: labelled column number plateaus at about six months of chase and roughly 2-3% of PTHrP+ colony-forming cells
    self-renew long term (mizuhashi2018).'
  what_is_missing: A division count. No study in any species reports the total number of divisions a resting-zone progenitor
    undergoes, nor divisions consumed per unit of longitudinal growth.
  nearest_evidence:
  - hallett2021_2
  - mizuhashi2018
  - baron1994
  discriminating_experiment: 'Combine H2B-GFP dilution kinetics with quantified longitudinal growth in mice across the whole
    growth period: measure divisions per resting-zone cell per week by label dilution, and tibial elongation by calcein double-labelling,
    over P7 to 12 months, then compute divisions per millimetre elongated and integrate to a lifetime budget. Repeat in rabbit,
    which fuses, to test whether the budget is exhausted at fusion. A model in which capacity is finite predicts a species-specific
    total that is reached at growth cessation; a model in which capacity is renewable predicts no ceiling and a growth arrest
    that occurs at a division count well below any plateau.'
  tractability: 3
