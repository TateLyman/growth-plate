- gap_id: g_l2stem_001
  question: Which cell in the human growth plate resting zone, if any, self-renews and clonally generates chondrocyte columns
    over years, and does it express PTHLH?
  type: method_blocked
  layer: L2
  why_it_matters: Every functional statement in this layer - clonality, self-renewal, column founding, lifespan - comes from
    tamoxifen-inducible Cre lineage tracing in mice. The entire resting-zone-stem-cell edifice on which growth-plate exhaustion
    and fusion models rest is therefore unvalidated in the species the atlas is about, and the one human study that addresses
    it reports that the most stem-like human resting cells are PTHLH-negative, contradicting the dominant mouse marker.
  what_is_known: Mouse PTHrP-creER-labelled resting chondrocytes form clonal columns for at least a year, with ~2-3% showing
    long-term self-renewal (mizuhashi2018); FoxA2+ cells are a longer-lived upstream population (muruganandan2022). Human
    adolescent resting zone contains transcriptionally quiescent sub-populations (CHRDL2+, SFRP5+; avijgan2025) and two stem-like
    populations of which the upper 'root' population is PTHLH-negative and maps to mouse Prrx1+ cells (chu2026).
  what_is_missing: Any clonal or self-renewal measurement made on human cells in their own tissue. Human evidence is entirely
    cross-sectional transcriptomics plus xenotransplantation of sorted cells into mice.
  nearest_evidence:
  - chu2026
  - chan2018
  - avijgan2025
  discriminating_experiment: Somatic-mutation phylogenetics on microdissected human growth plate. Take zone-resolved laser-capture
    or single-cell samples from paediatric growth plate tissue (surgical epiphysiodesis or post-mortem), deep-sequence to
    call somatic single-nucleotide variants, and reconstruct clonal lineage trees. Under the resting-zone stem cell model,
    cells within one column share private mutations absent from neighbouring columns, and resting-zone cells sit at the root
    of those trees. Under a consumption model with no resident stem cell, columns show no shared private variants distinguishing
    them from adjacent columns and resting-zone cells are terminal branches, not roots. A PTHLH-expressing root would support
    mouse-to-human marker transfer; a PTHLH-negative root would refute it.
  tractability: 3
  search_log_ref: g_l2stem_001
  nearest_evidence_note: 'chu2026: human single-cell/spatial identification plus mouse Prrx1 clonal tracing of a transcriptionally
    matched population. chan2018: human sorted cells assayed by serial renal-capsule xenotransplantation. avijgan2025: human
    resting cells shown to exit G0 ex vivo.'
- gap_id: g_l2stem_002
  question: What fraction of human trabecular and endosteal osteoblasts is derived from hypertrophic chondrocytes, and over
    what age range?
  type: quantitative_gap
  layer: L2
  why_it_matters: In mice this fraction is about 60%, which reassigns the majority of young trabecular bone to a cartilage
