    peri-physeal rib fractures, while Piezo2 deletion does nothing comparable (brylka2024). Hypertrophic-chondrocyte Piezo1
    deletion raises osteoclast number in the primary spongiosa (tschaffonmller2026). Compression upregulates PIEZO1 in mouse
    vertebral growth plate chondrocytes and deletion slows scoliosis (chen2025a); PIEZO1 colocalises with the primary cilium
    there (chen2025). The only human cartilage PIEZO1 protein data are from osteophytes in osteoarthritis (brylka2024).
  what_is_missing: Any immunohistochemical, in situ hybridisation, single-cell or spatial transcriptomic report of PIEZO1
    or PIEZO2 in human physeal tissue, resolved by zone.
  nearest_evidence:
  - brylka2024
  - chen2025a
  - chen2025
