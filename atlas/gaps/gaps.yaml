- gap_id: g_l1arch_013
  question: How much of the latitudinal (circumferential) enlargement of a human growth plate is contributed by the groove
    of Ranvier, and does the groove also supply chondrocytes to the columnar population?
  type: known_unknown
  layer: L1
  why_it_matters: If the groove supplies the plate with progenitors, it is an alternative stem source to the PTHrP+ resting
    zone and a target for restoring growth after physeal injury; iatrogenic damage to the groove during surgery is a recognised
    cause of angular deformity, but the quantitative contribution has never been established.
  what_is_known: The groove is a wedge of densely cellular tissue continuous with the perichondrium (shapiro1977, rabbit)
    and is present in developing human calcaneus and talus (cheng1995). It harbours CD90+/CD105+ mesenchymal progenitors and
    mature alpha-SMA-covered vessels in human digits (walzer2014). Its disorganisation causes hyperostosis in piglets, and
    its damage is linked to angular deformity and osteochondroma (langenskild1998). Postnatal mouse plates show clusters restricted
    to the outer edges, consistent with a peripherally driven expansion mechanism (rubin2024).
  what_is_missing: No lineage tracing from a groove-specific marker into the columnar chondrocyte population, and no quantitative
    estimate of the fraction of plate diameter increase attributable to the groove versus interstitial appositional growth.
    In humans nothing beyond descriptive histology exists.
  nearest_evidence:
  - shapiro1977
  - walzer2014
  - cheng1995
  nearest_evidence_note: shapiro1977 (rabbit), cheng1995 and walzer2014 (human, descriptive), rubin2024 (mouse, peripheral
    clusters).
  discriminating_experiment: Identify a groove-of-Ranvier-restricted driver in mouse (candidates from Gli1+ or periosteal
    PDGFRa+ perichondrial populations) and perform inducible lineage tracing at P7, scoring at P28 (i) the fraction of labelled
    cells inside columns versus at the plate margin and (ii) plate diameter. In parallel, microsurgically excise the groove
    unilaterally and measure the change in plate diameter growth rate versus elongation rate. If diameter growth falls while
    elongation is preserved, the groove is a dedicated latitudinal-growth organ and not a column progenitor source.
  tractability: 3
- gap_id: g_l1arch_014
  question: Can chondrocyte kinetics be measured non-invasively in a living human growth plate?
  type: method_blocked
  layer: L1
  why_it_matters: Every human number in this layer is either post-mortem, surgical waste, or derived from external anthropometry.
    Without an in vivo readout there is no way to relate a drug's effect on stature to its effect on the tissue, and no way
    to detect a plate-level response before months of height data accumulate.
  what_is_known: Human physeal architecture can be resolved by MRI and the plate can be seen to close, and radiographic marker
    methods give month-scale elongation (pritchett1992). Growth plate height and width correlate with tibial growth rate in
    both mouse and human radiographs (wilson2021). Nothing images cell turnover.
  what_is_missing: An in vivo readout of proliferation, hypertrophic volume, or matrix turnover in human physeal cartilage.
