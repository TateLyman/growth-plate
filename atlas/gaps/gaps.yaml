- gap_id: g_l4endo_002
  question: Does the temporal PATTERN of GH exposure - burst amplitude, interburst trough depth and burst frequency - change
    growth plate output in humans at matched 24-hour integrated GH exposure, and has the GH concentration-time profile ever
    been measured in growth plate interstitium in any species?
  type: search_established
  layer: L4
  why_it_matters: Long-acting weekly GH analogues are now in routine paediatric use and deliberately flatten the GH profile.
    If growth is pulse-encoded rather than exposure-encoded, those products are not pharmacokinetically equivalent to daily
    GH at matched AUC, and the difference would appear in adult height rather than in year-one velocity. The rat data say
    pattern matters and say so with a clean design; the human data do not exist.
  what_is_known: In GH-deficient dwarf rats given patterned intravenous infusions in which the peak and trough components
    were varied independently of total dose, weight gain rose from 1.1 +/- 0.2 to 2.1 +/- 0.2 g/day when the extra dose was
    delivered as pulses but not when delivered continuously, and pulsatile versus continuous dose-response curves were significantly
    non-parallel; hepatic GHR and plasma GHBP showed the mirror-image dependence on the continuous component (gevers1996).
    At the tissue level, pulsatile but not continuous GH narrowed the resting zone while both patterns widened the proliferative
    and hypertrophic zones (gevers1996a). Independently, meal-feeding versus grazing at matched intake tripled GH secretion,
    added two bursts per day and preserved tibial epiphyseal plate width in a ghrelin/GHS-R-dependent manner (hornsby2025).
    Human deconvolution studies establish that the pattern exists (13.7-13.8 bursts/24 h, ~88% of output pulsatile; van2016)
    and is modulated by age, BMI, sex steroids and sleep (roelfsema2016, calvert2022, roelfsema2018).
  what_is_missing: No human study delivers the same total GH dose in two different temporal patterns and measures linear growth.
    No study of any species measures the GH concentration-time profile within growth plate interstitial fluid, so it is unknown
    whether the plate even sees a pulsatile signal or whether capillary transit and matrix diffusion low-pass filter it into
    a near-constant exposure.
  nearest_evidence:
  - gevers1996
  - gevers1996a
  - hornsby2025
  - van2016
  - roelfsema2016
  discriminating_experiment: Model system - prepubertal children with severe isolated GH deficiency, randomised within a crossover
    or parallel design to daily rhGH versus a weekly long-acting GH analogue titrated to identical 7-day integrated serum
    GH bioactivity (not identical IGF-1), with 10-minute GH profiling to confirm the two patterns actually differ. Readout
    - annualised height velocity by stadiometry plus knemometry for short-interval resolution, with IGF-1 and IGFBP-3 as intermediate
    markers, followed to adult height. Expected result - under exposure-encoding, height velocity and adult height are identical
    between arms and IGF-1 is the sufficient intermediate; under pulse-encoding, the daily arm outgrows the weekly arm at
    matched GH exposure, and the gap widens over years rather than appearing in year one. Preclinical companion - implantable
    microdialysis or ultrafiltration probe in the rabbit proximal tibial epiphysis to recover the actual physeal GH profile
    during pulsatile versus continuous systemic infusion, which would settle whether the plate is exposed to pulses at all.
  tractability: 2
