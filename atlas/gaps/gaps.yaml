- gap_id: g_l6mech_011
  question: Has the 1 mm/day, 4-increments distraction prescription ever been dose-optimised in humans, and does the optimum
    shift with age, segment and underlying diagnosis?
  type: search_established
  layer: L6
  why_it_matters: A single canine tibial series from 1989 sets the rate and rhythm used in essentially all human limb lengthening
    and craniofacial distraction. The failure modes at either end are different tissues - premature consolidation below the
    optimum, neurovascular and muscular injury above - so the tolerable window should differ by segment and by patient, yet
    the same number is used for a femur in an adolescent with achondroplasia and a mandible in an infant.
  what_is_known: In the canine tibia, 0.5 mm/day often caused premature consolidation, 2.0 mm/day often caused soft-tissue
