- gap_id: g_l3rest_015
  question: Do the four proposed convergence nodes (SOX9, RUNX2, beta-catenin, HDAC4 localisation) actually integrate their
    inputs within a single chondrocyte, or is the convergence an artefact of pooling pairwise experiments performed in different
    genetic backgrounds, ages and skeletal sites?
  type: scale_gap
  layer: L3
  why_it_matters: The convergence claim is what makes this layer a network rather than a list, and it is the basis for predicting
    that single-pathway interventions will have off-target effects on other arms. Every edge in that claim is individually
    supported, but no experiment has measured more than two of these nodes in the same cells at the same time. If integration
    is in fact partitioned by zone or by subpopulation, then the network diagram overstates crosstalk and single-pathway drugs
    are cleaner than predicted.
  what_is_known: 'Pairwise links are established: SOX9-beta-catenin mutual antagonism (Akiyama 2004, Topol 2009), Notch-SOX9
    epistasis (Kohn 2015), SOX9 restraint of Runx2 and beta-catenin (Dy 2012), PTHrP-SIK3-HDAC4-MEF2C/RUNX2 (Nishimori 2021,
    Sasagawa 2012), RUNX2 transcription of Ihh (Yoshida 2004), cilium-dependent Hedgehog/WNT reciprocity (Wang 2013), and
    SOX9-driven glutamine metabolism (Stegen 2020).'
  what_is_missing: No single-cell, multi-modal measurement of these nodes together in growth plate tissue, and no perturbation
    experiment that reads out all four simultaneously.
  nearest_evidence:
  - akiyama2004
  - kohn2015
  - dy2012
  - nishimori2021
  - wang2013
  discriminating_experiment: Multiplexed single-cell spatial proteomics (for example CODEX or imaging mass cytometry) on intact
    growth plate sections with a panel covering SOX9, RUNX2, nuclear beta-catenin, HDAC4 (nuclear and cytoplasmic), MEF2C,
    phospho-S6 and GLI1, applied to control tissue and to tissue from mice carrying a single-pathway perturbation (for example
    chondrocyte Rbpj deletion). Under a genuine convergence model, the perturbation shifts three or more node states in the
    same cells and the node states are correlated cell-by-cell within a zone. Under a partitioned model, node states are uncorrelated
    within a zone and the perturbation moves only its own downstream node.
  tractability: 3
- gap_id: g_l6mech_001
  question: What is the growth-rate sensitivity to sustained mechanical stress of a human physis, expressed as percent change
    in longitudinal growth rate per 0.1 MPa, and does it match the 17.1%/0.1 MPa measured in rat, rabbit and calf?
  type: search_established
  layer: L6
  why_it_matters: This single coefficient is the quantitative core of the Hueter-Volkmann law and the basis on which guided
    growth, vertebral body tethering and the scoliosis vicious-cycle simulation are planned and justified. It has been measured
    only in three quadruped species at two skeletal sites over 8-day loading windows. If the human coefficient differs by
    even a factor of two, every model-based prediction of deformity progression and of correction rate is correspondingly
    wrong, and the wide correction-rate variance seen clinically (SD approximately 80-90% of the mean) would have a principled
    explanation.
  what_is_known: Growth-rate sensitivity is 17.1% per 0.1 MPa averaged across rat, rabbit and calf caudal vertebrae and proximal
    tibiae, range 9.2-23.9%/0.1 MPa, 15.0%/0.1 MPa for vertebrae and 18.6%/0.1 MPa for proximal tibia, despite baseline growth
    rates spanning 30-366 um/day (stokes2006). The relation is apparently linear over the stress range tested and asymmetric
    between compression and distraction (stokes2002). Human physes are demonstrably modulable - guided growth corrects at
    0.67 deg/month at the distal femur (tolk2026) - but the applied stress is never known.
  what_is_missing: Any human experiment or observation in which a known stress is applied across a physis and the resulting
    longitudinal growth rate is measured. There is not even a human estimate with uncertainty; the field substitutes the animal
    coefficient without adjustment.
  nearest_evidence:
  - stokes2006
  - tolk2026
  - hucke2023
  discriminating_experiment: Prospective cohort of children undergoing unilateral tension-band hemiepiphysiodesis of the distal
    femur, in whom (a) implant strain is measured directly with an instrumented plate or strain-gauged screw, giving the tether
    force, (b) subject-specific finite element models driven by instrumented gait analysis and MRI geometry convert that force
    plus body loading into physeal stress on the tethered and free sides, and (c) longitudinal growth on each side is measured
    by serial low-dose EOS radiography or by implanted tantalum bead radiostereometry. Regress percent growth difference on
    stress difference. Under the hypothesis that the animal coefficient transfers, the slope is 15-19% per 0.1 MPa with the
    animal-derived range covering the human confidence interval. Under the alternative that human physes are less mechanosensitive
    - which the slow, variable clinical correction rates hint at - the slope is substantially below 9%/0.1 MPa and the residual
    variance is dominated by skeletal age rather than stress.
  tractability: 3
  search_log_ref: g_l6mech_001
- gap_id: g_l6mech_002
  question: Over what range of applied stress does the linear growth-stress relation hold, and where are the upper and lower
    saturation points at which growth stops changing or the physis is damaged?
  type: quantitative_gap
  layer: L6
  why_it_matters: 'Linearity was demonstrated over roughly 0.02-0.2 MPa, a window chosen by apparatus design. Clinical devices
    operate outside it: tension-band plates and vertebral tethers apply forces whose physeal stress is unknown and probably
    higher, and Blount disease in an obese adolescent almost certainly exceeds it. A saturating or non-monotonic relation
    would explain why guided growth fails disproportionately in heavy, varus and non-idiopathic knees, and would change device
    design from ''more tension is better'' to a target window.'
  what_is_known: 'Growth change is linear in stress over the tested range with a 17.1%/0.1 MPa slope (stokes2006), maximum
    achieved change 53% (stokes2007). Above some threshold the response becomes destructive rather than modulatory: 0.2 MPa
    mean at 1.0 Hz with +/-0.14 MPa amplitude caused repeated inflammation and destroyed rat caudal plate integrity (mnard2014),
    and 10% sustained compressive strain abolished aggrecan and collagen II/X expression in swine explants (sergerie2011).
    In vivo tethering shows saturation in time rather than magnitude: high tether tension gave 53% growth modulation at 2
    weeks but only 14% at 2-4 weeks, indistinguishable from low tension (halanski2026).'
  what_is_missing: A dose-response curve extending to the failure point, with growth rate measured at five or more stress
    levels including at least two above 0.3 MPa, in a single species and site, with histology to separate modulation from
    damage.
  nearest_evidence:
  - stokes2006
  - mnard2014
  - halanski2026
  discriminating_experiment: Rat caudal vertebra or rabbit proximal tibia loaded for 14 days at 0.05, 0.1, 0.2, 0.4 and 0.8
    MPa sustained compression, n>=8 per level, with fluorochrome double-labelling for growth rate and paired histology for
    plate thickness, proliferative cells per column, hypertrophic cell height and TUNEL. Under a pure linear model, growth
    rate falls proportionally to zero near 0.6 MPa with proportional zonal changes. Under a saturating model, growth rate
    plateaus above approximately 0.2-0.3 MPa while histological damage continues to rise, identifying a therapeutic window
    with an upper bound.
  tractability: 5
  search_log_ref: g_l6mech_002
- gap_id: g_l6mech_003
  question: What is the compressive and tensile stress across a human growth plate during normal walking, and how does it
    change with obesity, varus alignment and a tension-band implant?
  type: method_blocked
  layer: L6
  why_it_matters: 'Without this number the animal sensitivity coefficient cannot be converted into a human prediction, so
    no clinical growth-modulation device can be dosed rationally. It is also the missing term in every mechanical account
    of Blount disease and of scoliosis progression: both hypotheses assert that a particular alignment raises physeal stress,
    and neither states by how much.'
  what_is_known: Personalised finite element models of four human distal femoral epiphyses driven by instrumented gait analysis
    show heterogeneous, geometry-dependent physeal stress, with implant-induced local static stress and loss of cyclic loading
    at the insertion and increased tension contralaterally (hucke2023). The authors state their models are not fully participant-specific
    in geometry or loading. FE work also shows plate geometry itself adapts to the mechanical environment, so the model input
    is not fixed (rodrguez2025).
  what_is_missing: Any direct measurement, and any validated model whose predictions have been checked against a physical
    measurement in a growth plate. No cadaveric paediatric physeal stress measurement was located either.
  nearest_evidence:
  - hucke2023
  - rodrguez2025
  - stokes2006
  discriminating_experiment: 'Two-stage. Stage 1: instrumented cadaveric paediatric or juvenile large-animal knees with thin-film
    pressure sensors placed across the physis under physiological joint loading, to obtain ground-truth stress distributions
    and to validate a finite element pipeline. Stage 2: apply the validated pipeline to children with dual-fluoroscopy or
    biplanar-radiograph kinematics, MRI geometry and instrumented gait, comparing typically developing children, obese children
    and children with tibia vara. Under the mechanical hypothesis for Blount disease, medial physeal compressive stress in
    tibia vara exceeds the typically developing value by a margin large enough to predict the observed growth asymmetry given
    the 17.1%/0.1 MPa coefficient. Under a primary-cartilage-defect hypothesis, medial stress is only modestly raised and
    cannot account for the observed deformity rate.'
