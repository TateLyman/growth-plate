  question: Does the human growth plate contain a functioning cell-autonomous circadian oscillator, and does disrupting it
    change longitudinal bone growth in humans?
  type: search_established
  layer: L4
  why_it_matters: Sleep-associated GH release, seasonal variation in growth velocity and the diurnal variation in standing
    height are all routinely attributed to "circadian regulation of growth" without specifying whether the clock is in the
    pituitary, the plate, or both. If the plate has its own clock that gates matrix synthesis, then shift-work-like conditions,
    night-time light exposure and mistimed GH dosing would have effects that no systemic measurement would detect.
  what_is_known: 'This search REVISED the gap rather than confirming absence. Rodent evidence for a functional physeal clock
    does exist: artificial light at night suppressed developmental growth plate cartilage formation in mice by inhibiting
    BMAL1-driven collagen hydroxylation (chen2023). Cartilage clock literature is otherwise dominated by articular and temporomandibular
    cartilage in osteoarthritis models. On the systemic side the human GH axis is strongly nycthemeral (van2016, calvert2022)
    and is entrained by feeding pattern through ghrelin in both rodents and humans (hornsby2025).'
  what_is_missing: No demonstration of a running BMAL1/PER oscillation in human growth plate chondrocytes, no human intervention
    altering clock phase with a linear-growth endpoint, and no separation in any species of the plate-intrinsic clock from
    the entrained systemic GH rhythm.
