- gap_id: g_l4endo_007
  question: Which thyroid hormone receptor isoform mediates T3 action in growth plate chondrocytes - TRalpha, as human THRA
    mutations imply, or TRbeta, as mouse rib chondrocyte knockouts imply?
  type: contradiction
  layer: L4
  why_it_matters: Isoform-selective thyromimetics (resmetirom-class TRbeta agonists) are entering clinical use, and their
    skeletal safety in growing children depends entirely on which isoform the plate uses. If the plate is TRbeta-driven, a
    TRbeta-selective agonist would accelerate hypertrophic differentiation and advance bone age; if TRalpha-driven, the same
    drug would be skeletally silent. The literature currently supports both answers.
  what_is_known: Human side - heterozygous dominant-negative THRA variants cause growth retardation, delayed bone age and
    disharmonious short stature with low free T4 and normal-to-mildly- raised TSH, and these children respond to levothyroxine
    plus rhGH with height gains up to 2.5 SDS (jorge2025). Human RTHbeta (dominant-negative THRB) is common, well described
    and typically NOT associated with short stature. Mouse side - in primary neonatal rib chondrocytes, T3 reduced proliferation
    and accelerated differentiation normally in TRalpha-deficient cells but ALL T3 responses were abolished in TRbeta-deficient
    cells, and T3 upregulated TRbeta1 itself (rabier2006). Both TRalpha1, TRalpha2 and TRbeta1 protein are present in rat
    reserve and proliferating zone chondrocytes and absent from hypertrophic cells (robson2000), so localisation does not
    adjudicate.
  what_is_missing: No isoform-selective test in long-bone growth plate chondrocytes of either species - the mouse experiment
    used RIB chondrocytes, a different skeletal element - and no measurement of THRA versus THRB transcript or protein in
    human physeal tissue. Germline knockouts also permit compensation that a conditional, adult-onset deletion would not.
  nearest_evidence:
  - jorge2025
  - rabier2006
  - robson2000
  discriminating_experiment: Model system - side-by-side conditional deletion of Thra and Thrb in Acan-CreERT2 chondrocytes
    of the mouse proximal tibia, induced postnatally, plus primary human growth plate chondrocytes from surgical waste treated
    with isoform-selective agonists (TRbeta-selective resmetirom-class compound versus a TRalpha-sparing control) at matched
    receptor occupancy. Readout - tibial length and zonal heights in vivo; COL10A1, ALPL and proliferation index in the human
    cells; isoform transcript quantification in the same human tissue. Expected result - under the human-genetics-led model,
    Thra deletion shortens the tibia and TRbeta-selective agonists leave human chondrocyte differentiation markers unchanged;
    under the mouse-chondrocyte-led model, Thrb deletion is the one that blocks hypertrophic differentiation and the TRbeta
    agonist induces COL10A1 in human cells - which would be a direct paediatric safety signal for that drug class.
  tractability: 3
- gap_id: g_l4endo_008
  question: What drives the seasonal variation in human height velocity - photoperiod, ambient temperature, or seasonal nutrition
    - and why does the phase of the peak differ between cohorts?
  type: contradiction
  layer: L4
  why_it_matters: The seasonal amplitude is not trivial (~13% of mean linear growth velocity in infants), which means growth-velocity
    measurement intervals shorter than a year are systematically biased by season - directly affecting clinical decisions
    about starting or stopping GH and the interpretation of short trials. It is also the only routinely observable environmental
    modulator of the human growth plate, so identifying the transducer would be mechanistically valuable.
  what_is_known: Three large human cohorts agree that seasonality is real and disagree on phase and driver. In 11,587 three-month
    intervals from 2,277 GH-treated prepubertal children, height velocity scaled with average daylight hours (+0.146 cm/yr
    per hour in treatment year 1, +0.121 thereafter), the effect grew with latitude, and calendar month had no independent
    effect - a photoperiod signature (shulman2013). In 9,409 Japanese infants, length z-velocity peaked in SUMMER, with a
    winter-summer difference of 0.0026 z/day (95% CI 0.0015-0.0036), about 13% of mean velocity (narumi2020). In 760 Danish
    8-11 year olds, height velocity was above the 6.10 cm/yr mean in JANUARY-APRIL, and unlike earlier reports of a spring
    height peak with an autumn weight peak, weight, BMI and fat-free mass index peaked coincidentally (dalskov2016).
  what_is_missing: No study manipulates photoperiod, temperature or energy intake independently while measuring growth, and
    no study measures a candidate mediator (melatonin amplitude, 25-hydroxyvitamin D, IGF-1, GH pulsatility) longitudinally
    across seasons in the same children with growth as the outcome. The competing explanations have never been placed in one
    model.
  nearest_evidence:
  - shulman2013
  - narumi2020
  - dalskov2016
  discriminating_experiment: Model system - a prospective cohort of prepubertal children measured by knemometry every 2 weeks
    for 24 months at three widely separated latitudes (for example ~60 N, ~35 N and ~5 N), with a nested arm in a controlled-photoperiod
    setting (polar winter workers' children or a residential facility with fixed lighting). Readout - lower-leg length velocity
    as the outcome, with monthly serum 25(OH)D, IGF-1, IGFBP-3, overnight urinary 6-sulphatoxymelatonin and 7-day dietary
    energy record as candidate mediators, analysed by mediation model. Expected result - under a photoperiod model, growth
    velocity amplitude scales with latitude, peaks in phase with daylight hours regardless of temperature, and melatonin amplitude
    is the strongest mediator; under a temperature/energy model, amplitude tracks seasonal temperature or energy intake and
    is near zero at low latitude despite a substantial photoperiod swing there being absent; under a vitamin D model, 25(OH)D
    mediates the effect and supplementation in a randomised sub-arm abolishes the seasonal amplitude.
  tractability: 3
- gap_id: g_l4endo_009
  question: Which IGF binding proteins are present in the human growth plate, and do they form a zonal gradient that sets
    the free IGF-1 concentration differently in the resting, proliferative and hypertrophic zones?
  type: search_established
  layer: L4
  why_it_matters: The IGF bioavailability layer is demonstrably load-bearing in humans - PAPP-A2 loss raises total IGF-1 several-fold
    while cutting the bioactive fraction to 0.09-0.32% and producing heights of -2.16 to -3.81 SDS - yet the entire model
    is built on serum measurements. If IGFBP-5, which binds hydroxyapatite and matrix, forms a zonal reservoir in the plate,
    then the local free IGF-1 concentration is a matrix property rather than a circulating one, and PAPP-A2 replacement therapy
    would act by remodelling that reservoir rather than by raising serum free IGF-1.
  what_is_known: In serum, human PAPPA2 deficiency raises IGFBP-3 to 4403-5912 ug/L (Tanner I reference 2206-4200) and IGFBP-5
    to 645-997 ug/L (reference 211-707) while free IGF-1 falls (dauber2016), and IGFALS deficiency collapses IGFBP-3 with
    only mild short stature (domen2004). At the tissue level, PAPP-A is required for IGF-dependent chondrocyte differentiation
    and columnar organisation in mouse and zebrafish cartilage (harboe2024), implying substrate IGFBPs are present and functional
    there.
  what_is_missing: No zonal immunolocalisation or quantification of any IGFBP in human growth plate tissue, and no measurement
    of free versus bound IGF-1 in physeal interstitium in any species. Searching for zonal IGFBP localisation in human physis
    returns only serum-based clinical studies and rodent whole-plate work.
  nearest_evidence:
  - dauber2016
  - domen2004
  - harboe2024
  - kobber2022
  discriminating_experiment: Model system - human growth plate tissue from epiphysiodesis and limb-lengthening surgery across
    a range of ages, with rabbit proximal tibia as a functional companion. Readout - multiplexed immunofluorescence or imaging
    mass cytometry for IGFBP-2 through -6, ALS, PAPP-A, PAPP-A2 and STC2 across the three zones, quantified per cell and per
    unit matrix area, cross-validated by laser-capture zonal proteomics. Expected result - under a matrix-reservoir model,
    IGFBP-5 and PAPP-A2 are concentrated in the proliferative zone matrix and free IGF-1 (by zonal ultrafiltration) peaks
    where protease-to-inhibitor ratio is highest; under a serum-delivery model, IGFBP profile in the plate mirrors serum with
    no zonal structure and the free fraction is uniform.
  tractability: 3
  search_log_ref: g_l4endo_009
- gap_id: g_l4endo_010
  question: Does human SOCS2 loss of function produce overgrowth, as the mouse predicts, and if not, what compensates?
  type: species_gap
  layer: L4
  why_it_matters: Socs2-null mice are among the largest single-gene overgrowth models in the GH axis and are cited as evidence
    that GH signalling is submaximally braked. If no human phenotype exists at any allele frequency, the brake is either redundant
    in humans or SOCS2 loss is selected against for non-skeletal reasons - and the therapeutic idea of pharmacologically inhibiting
    SOCS2 to enhance GH response, which follows directly from the mouse, loses its premise.
  what_is_known: Socs2-null mice show substantial skeletal overgrowth with normal circulating GH and IGF-1, and the overgrowth
    is GH-dependent (metcalf2000). SOCS2 is a direct STAT5B target and binds phosphorylated GHR to target it for degradation,
    so the mechanism is specific and well defined. Human STAT5B loss of function - which would also remove SOCS2 induction
    - causes short, not tall, stature (kofoed2003, hwa2005), consistent with the brake being downstream of the signal it limits.
  what_is_missing: No reported human SOCS2 biallelic loss-of-function individual with an overgrowth phenotype, and no systematic
    interrogation of tall-stature cohorts or population biobanks for SOCS2 predicted-loss-of-function carriers with height
    as the tested outcome.
  nearest_evidence:
  - metcalf2000
  - kofoed2003
  - hwa2005
  discriminating_experiment: Model system - population-scale exome/genome biobanks (UK Biobank, All of Us, gnomAD- linked
    cohorts) plus curated idiopathic tall-stature and overgrowth cohorts. Readout - burden test of SOCS2 predicted loss-of-function
    and missense-deleterious variants against standing height in SD units, with a matched positive control (e.g. NPR2 gain-of-function)
    and negative control gene set; complemented by a SOCS2-hypomorph knock-in mouse humanised at the GHR-SOCS2 interface.
    Expected result - under a conserved-brake model, SOCS2 pLoF carriers are significantly taller with an effect size of the
    order of +0.3 to +1 SD and the signal replicates across biobanks; under a species-divergence model, SOCS2 pLoF carriers
    exist at expected frequency with no height effect, which would locate the mouse phenotype in a rodent-specific feature
    of GH pulse amplitude or GHR turnover rather than in a general mammalian mechanism.
  tractability: 5
  search_log_ref: g_l4endo_010
- gap_id: g_l4endo_011
  question: Why does pharmacological glucocorticoid act locally and potently on the growth plate (77% growth suppression on
    unilateral infusion in rabbit) while genetic deletion of the glucocorticoid receptor from chondrocytes leaves mouse growth
    plates and long bone length entirely normal?
  type: contradiction
  layer: L4
  why_it_matters: These two results are used interchangeably to support "glucocorticoids act on the chondrocyte", but they
    cannot both mean that. Either the receptor mediating pharmacological suppression is not the classical chondrocyte GR (raising
    the possibility of a perichondrial, vascular or mineralocorticoid-receptor route), or endogenous and pharmacological glucocorticoid
    exposures engage different mechanisms. The answer changes what a growth-sparing steroid would have to avoid.
  what_is_known: Local intra-plate dexamethasone infusion (80 ng/uL at 1 uL/h) reduced ipsilateral rabbit proximal tibial
    growth by 77% versus the vehicle-infused contralateral plate, P<0.0001, with a measurement error of ~5% (baron1992); subsequent
    catch-up was likewise confined to the treated plate (baron1994); dexamethasone slowed rabbit resting zone chondrocyte
    proliferation and their numerical depletion (schrier2006). Against this, tamoxifen- inducible chondrocyte-specific GR
    knockout mice showed normal knee joint architecture, cartilage structure, growth plates, intervertebral discs, long bone
    length and bone microarchitecture at all ages, with a defect confined to metaphyseal fracture healing (tu2014).
  what_is_missing: 'No experiment applies the two designs to the same question: nobody has performed the unilateral local
    dexamethasone infusion in a chondrocyte-specific GR knockout animal, which is the single measurement that would resolve
    it. Nor has the mouse GR knockout been challenged with systemic glucocorticoid excess and a growth endpoint.'
  nearest_evidence:
  - baron1992
  - baron1994
  - schrier2006
  - tu2014
  discriminating_experiment: Model system - Acan-CreERT2 x Nr3c1-flox mice and littermate controls, each receiving unilateral
    intra-growth-plate dexamethasone infusion with contralateral vehicle, plus a systemic high-dose dexamethasone arm. Readout
    - ipsilateral versus contralateral tibial growth rate by calcein/tetracycline double labelling and pin-radiograph measurement,
    with zonal heights and resting zone chondrocyte counts. Expected result - under a chondrocyte-GR model, local dexamethasone
    suppresses growth in controls but has no ipsilateral effect in chondrocyte-GR-null mice, and the mouse null result in
    tu2014 is simply the absence of a physiological ligand challenge; under a non-chondrocyte-target model, local dexamethasone
    suppresses growth equally in both genotypes, redirecting the search to perichondrium, hypertrophic-zone vasculature or
    the mineralocorticoid receptor.
  tractability: 4
- gap_id: g_l4endo_012
  question: Does restoring IGF-1 bioavailability - rather than IGF-1 concentration - rescue growth in humans, and by how much
    per unit increase in the bioactive IGF fraction?
  type: known_unknown
  layer: L4
  why_it_matters: PAPP-A2 deficiency is the proof that the bioavailability layer sets stature in humans, and it also names
    a specific replacement molecule (recombinant PAPP-A2) that no other short-stature condition has. If a defined increase
    in bioactive IGF fraction maps to a defined height-velocity gain, the same relationship becomes the dose target for idiopathic
    short stature, GH insensitivity and any condition where total IGF-1 is normal but free IGF-1 is low - a much larger group
    than PAPPA2 mutation carriers.
  what_is_known: In PAPP-A2-deficient humans the bioactive IGF fraction is 0.09-0.32% of total against a healthy median of
    1.23% (range 0.46-2.59%), free IGF-1 is 0.27-1.98 ug/L against a prepubertal reference of 1.58-3.15, and heights are -2.16
    to -3.81 SDS (dauber2016). rhIGF-1 improves growth velocity and height in these patients. In Pappa2-null mice, rhGH, rhIGF-1
    and rhPAPP-A2 all partially rescue skeletal growth but with sex-specific differences in the signalling response (fernndezarjona2024,
    lpezgambero2025). Population-level data show PAPP-A2 and STC2, but not PAPP-A, associate with circulating total IGF-1
    in adults (nimptsch2024), and children with obesity have high free IGF-1 and accelerated growth despite reduced pappalysins
    (martnrivada2025).
  what_is_missing: No human dose-response linking a measured change in bioactive or free IGF-1 to a measured change in height
    velocity, in PAPP-A2 deficiency or in any other condition; no human recombinant PAPP-A2 exposure; and no agreed reference
    method for bioactive IGF, so the 0.09-0.32% versus 1.23% comparison rests on a single laboratory's assay.
  nearest_evidence:
  - dauber2016
  - fernndezarjona2024
  - lpezgambero2025
  - nimptsch2024
  - martnrivada2025
  discriminating_experiment: Model system - a multi-arm dose-finding study in children with low free IGF-1 and normal or high
    total IGF-1 (PAPPA2 mutation carriers plus a broader biochemically defined cohort), receiving rhIGF-1 at several doses,
    with a parallel first-in-human recombinant PAPP-A2 arm if available. Readout - free and bioactive IGF-1 by a harmonised
    assay (IGF-1 kinase receptor activation bioassay plus ultrafiltration free IGF-1) measured at steady state, against 6-month
    height velocity and 12-month height SDS change. Expected result - under a bioavailability model, height velocity is a
    monotone function of bioactive IGF fraction irrespective of total IGF-1, and rhPAPP-A2 achieves the same velocity as rhIGF-1
    at a lower total IGF-1; under a concentration model, height velocity tracks total or free IGF-1 mass and the bioactive
    fraction adds no independent information.
  tractability: 2
