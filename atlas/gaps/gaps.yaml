- gap_id: g_l3rest_011
  question: Has oxygen tension ever been measured directly across the zones of a HUMAN growth plate?
  type: search_established
  layer: L3
  why_it_matters: 'The hypoxic gradient is treated throughout the field as an established property of the growth plate and
    is used to justify HIF1A-centred models, hypoxic culture protocols for cartilage tissue engineering, and metabolic interpretations
    of chondrocyte biology. If the gradient has never been measured in human tissue, then a load-bearing premise of this layer
    rests on a rodent measurement from 1971 plus genetic inference. It also matters dimensionally: a human adolescent growth
    plate is far thicker than a mouse plate, so the diffusion distance - the variable that generates the gradient - is not
    comparable, and the human gradient could be steeper, not merely similar.'
  what_is_known: Brighton and Heppenstall 1971 measured oxygen tension with microelectrodes across zones of the epiphyseal
    plate, metaphysis and diaphysis in RATS AND RABBITS, in vitro and in vivo; a companion 1971 paper measured plate oxygen
    tension distal to an arteriovenous fistula. Schipani 2001 established by chondrocyte Hif1a deletion that the mouse plate
    is hypoxic in its INTERIOR rather than its periphery, and Schipani 2015 restates the gradient as accepted. Zhang 2023
    shows chondrocytes buffer their own oxygenation with KLF1-dependent, HIF-independent haemoglobin condensates, so tissue
    oxygen is partly cell-autonomously controlled and cannot be predicted from geometry alone.
  what_is_missing: No human measurement of any kind. A title-restricted search for growth plate/physis/epiphyseal plate combined
    with oxygen tension, pO2 or oximetry returns 21 records; the only direct-measurement papers are the two 1971 Brighton
    studies (rat, rabbit) and a 1991 study of oxygen tension effects on proteoglycan synthesis in cultured cells. No record
    reports human physeal oximetry, and no modern method (fibre-optic probe, EPR oximetry, phosphorescence quenching, blood-oxygen-level-dependent
    MRI) has been applied to a human growth plate.
  nearest_evidence:
  - brighton1971
  - schipani2001
  - schipani2015
  - zhang2023_2
  discriminating_experiment: 'Intraoperative fibre-optic oxygen microprobe or EPR oximetry profiling during elective epiphysiodesis
    or physeal bar resection in adolescents, advancing the probe across the plate under fluoroscopic or ultrasound guidance
    and recording pO2 against depth, with the resected specimen histologically zoned afterwards to assign each reading to
    RZ/PZ/PHZ/HZ. Under the standard model pO2 falls monotonically from both vascularised margins to a minimum in the mid-plate;
    under a buffered model (implied by the haemoglobin-condensate finding) the interior minimum is shallower than diffusion
    modelling predicts. Non-invasive alternative: quantitative BOLD or oxygen-enhanced MRI of the physis in healthy adolescents,
    calibrated against the intraoperative probe data.'
  tractability: 2
  search_log_ref: g_l3rest_011
- gap_id: g_l3rest_012
  question: Is SOX9 required for chondrocyte hypertrophy, or must SOX9 be downregulated for hypertrophy to occur?
  type: contradiction
  layer: L3
  why_it_matters: 'SOX9 is the most convergent node in this layer and the target of every upstream arm. The two published
    positions imply opposite predictions for any intervention that raises SOX9: one predicts more hypertrophy and faster bone
    formation, the other predicts a blocked, achondroplasia-like plate. Achondroplasia therapeutics reasoning depends on which
    is correct.'
  what_is_known: Dy 2012 shows, using doxycycline-inducible Cre and Sox9 conditional nulls in mouse, that SOX9 is REQUIRED
    to maintain columnar proliferation and to generate hypertrophy, that SOX9 protein outlives its mRNA into upper hypertrophic
    cells, and that it acts there with MEF2C to directly activate Col10a1. Zhou 2015 shows that activated mutant FGFR3 impairs
    endochondral growth by PREVENTING SOX9 downregulation in differentiating chondrocytes, i.e. persistent SOX9 is the lesion.
    Kohn 2015 adds that prolonged Notch signalling suppresses Sox9 and that this suppression is required for the onset of
    maturation.
  what_is_missing: No experiment titrates SOX9 level within a single differentiating chondrocyte population and measures hypertrophy
    as a continuous function of it. The two positions may be reconciled by a biphasic requirement (SOX9 needed to license
    Col10a1 but needing to fall for terminal maturation), but that reconciliation has not been tested.
  nearest_evidence:
  - dy2012
  - zhou2015
  - kohn2015
  - akiyama2002
  discriminating_experiment: A degron-tagged endogenous SOX9 allele in mouse or human chondrocytes allowing graded, reversible
    protein reduction, applied at defined points along the differentiation trajectory, with live readout of COL10A1 reporter
    and cell volume. Under the "required" hypothesis, reducing SOX9 at the prehypertrophic step lowers COL10A1 monotonically.
    Under the "must fall" hypothesis, modest reduction at that step raises COL10A1 and accelerates volume increase. A biphasic
    curve with a maximum at intermediate SOX9 supports the reconciliation and gives the field a set point.
  tractability: 4
- gap_id: g_l3rest_013
  question: What is the nuclear-to-cytoplasmic ratio of HDAC4 protein in each zone of the human growth plate, and how does
    it change across puberty?
  type: quantitative_gap
  layer: L3
  why_it_matters: HDAC4 activity is encoded by its address in the cell, not its abundance - phosphorylation by SIK3 at 14-3-3
    sites holds it in the cytoplasm and PTHrP-driven dephosphorylation lets it into the nucleus to repress MEF2C and RUNX2.
    That ratio is therefore the single most information-dense readout of the PTHrP arm in a fixed tissue section. Human HDAC4
    haploinsufficiency causes brachydactyly type E in 48% of 2q37 deletion cases, so the human dose relationship exists; what
    is missing is the quantitative state variable.
  what_is_known: Sasagawa 2012 shows HDAC4 is nuclear in Sik3-null chondrocytes and cytoplasmic in wild-type hypertrophic
    chondrocytes (mouse). Kozhemyakina 2009 shows PTHrP/forskolin drives HDAC4 phospho-S246 dephosphorylation by PP2A and
    nuclear translocation. Nishimori 2019 and 2021 place SIK3 between PKA and HDAC4 in vivo. Le 2019 gives the human haploinsufficiency
    phenotype frequencies.
  what_is_missing: No quantitative nuclear:cytoplasmic HDAC4 measurement by zone in any species, and none at all in human
    tissue; no measurement of phospho-HDAC4 at the 14-3-3 sites in human growth plate.
  nearest_evidence:
  - sasagawa2012
  - kozhemyakina2009
  - nishimori2021
  - le2019
  discriminating_experiment: Quantitative immunofluorescence for total HDAC4 and phospho-HDAC4 (Ser246/Ser467/Ser632) with
