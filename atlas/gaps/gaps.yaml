    stability and preservation of periosteum and marrow set the conditions under which this holds (ilizarov1989a). Clinical
    series report healing indices and complications at the inherited rate but do not randomise it.
  what_is_missing: A human randomised or systematically varied rate and rhythm study with a regenerate-quality endpoint. No
    such trial was located.
