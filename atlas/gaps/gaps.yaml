- gap_id: g_l7fuse_010
  question: Is the ORDER in which human epiphyses fuse conserved across populations, or does it vary in the way that the ages
    of fusion demonstrably do?
  type: search_established
  layer: L7
  why_it_matters: Forensic age estimation, paediatric orthopaedic decision-making and every mechanistic model of site-specific
    fusion all rest on the assumption that the sequence is a species-level developmental constant while only the timing shifts.
    If the sequence itself varies, then site-specific fusion is not a fixed developmental programme and a purely endocrine
    account cannot be complete. If it is conserved despite a two-year timing shift, that dissociation is itself strong evidence
    for a local, site-intrinsic clock modulated by a systemic signal.
  what_is_known: 'Timing varies markedly: all ten epiphyses compared between young Bosnian males and the McKern and Stewart
    North American sample were at least two years advanced in the Bosnian material (schaefer2005). Detailed sequences exist
    for single populations - 21 epiphyses pairwise-sequenced for beginning and complete union in 258 Bosniak males, where
    substantial variation in order existed at the individual level but most pairwise relationships were invariant (schaefer2007)
    - and separate sequences exist for the Portuguese sacrum (cardoso2014) and for the Swedish wrist, knee and ankle by MRI,
    which fuse in an ascending foot-to-wrist order (kvist2021). Differential growth plate aging by bone size has been demonstrated
    in rodents (lui2018).'
  what_is_missing: A Europe PMC search for epiphyseal union or epiphyseal fusion combined with sequence or order of union
    and population-specific, population differences, ancestry or between populations returned 166 records dominated by forensic
    age-estimation validation and archaeological population studies; none reported a formal statistical comparison of union
    SEQUENCE between two or more contemporary populations. Every published sequence is single-population, and the sequences
    use non-comparable element sets.
  nearest_evidence:
  - schaefer2007
  - schaefer2005
  - kvist2021
  discriminating_experiment: 'Model system: harmonised MRI fusion staging of the same element set (distal radius, distal femur,
    proximal and distal tibia, calcaneus, iliac crest) in at least three contemporary populations differing in fusion timing,
    using the kvist2020 cartilage-sequence protocol and a common ordinal scale, in cohorts of at least 300 per population.
    Readout: pairwise Kendall concordance of element rank order within each population, compared between populations, with
    timing removed by aligning on median age at 50% fusion of a reference element. Expected results - conserved sequence:
    rank-order concordance between populations is not distinguishable from within-population test-retest concordance, supporting
    a fixed site-intrinsic programme scaled by a systemic signal. Variable sequence: concordance falls significantly between
    populations, implicating environment- or ancestry-dependent local modulation and undermining single-population forensic
    standards.'
  tractability: 3
