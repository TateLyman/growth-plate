    Gao 2011 shows WNT5A gradients set graded ROR2-dependent VANGL2 phosphorylation. Yang 2003 shows Wnt5a and Wnt5b differ
    in their effect on the hypertrophy transition. Human WNT5A and ROR2 mutations cause Robinow syndrome with mesomelic shortening.
