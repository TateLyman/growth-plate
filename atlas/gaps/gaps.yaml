- gap_id: g_l8gwas_001
  question: What fraction of the 12,111 independent height-associated SNPs exert their effect through the growth plate chondrocyte,
    as opposed to through muscle, endocrine tissue, vasculature, or systemic nutrition-sensing tissue?
  type: quantitative_gap
  layer: L8
  why_it_matters: The entire premise of a growth-plate-centred atlas is that the plate is where stature is set. That premise
    is widely assumed and rarely quantified. If the chondrocyte-attributable fraction is 30% rather than 80%, then large parts
    of L3-L7 explain a minority of height variance and the atlas's centre of gravity is wrong. It also determines which tissue
    a therapeutic should target.
  what_is_known: Richard 2025 generated epigenomic and transcriptomic maps from chondrocytes sampled across multiple growth
    plates of developing human skeletons and intersected them with height GWAS signal, concluding that regulatory pleiotropy
    dominates and separating skeletal-element-specific from global-acting variants. Darbellay 2024 showed in mouse that variants
    overlapping chondrocyte-specific enhancers (2,704 identified, 780 genes) explain height differences better than variants
    overlapping non-chondrogenic enhancers, establishing enrichment. Yengo 2022 reports that association density is elevated
    near biologically relevant genes.
  what_is_missing: Enrichment is not partition. No source states the PERCENTAGE of height SNP heritability attributable to
    growth-plate chondrocyte regulatory activity, with a confidence interval, benchmarked against competing tissues in the
    same analysis. The published framing is qualitative ("prime importance of regulatory pleiotropy") rather than a variance
    decomposition.
  nearest_evidence:
  - richard2025
  - darbellay2024
  - yengo2022
  discriminating_experiment: 'Stratified LD-score regression (or equivalent, e.g. sc-linker) partitioning height SNP-heritability
    across a matched panel of cell-type-specific regulatory annotations that includes human growth-plate chondrocytes by zone
    (from the Richard 2025 maps), skeletal muscle, hepatocyte, pituitary somatotroph, adipocyte and vascular endothelium,
    all generated on the same platform to avoid annotation-quality confounding. Readout: proportion of h2-SNP per annotation
    with standard errors. Under a plate-centric model the chondrocyte annotation takes the largest share and zone-resolved
    annotations (proliferative/hypertrophic) are individually significant; under a distributed model no single tissue exceeds
    ~25% and the chondrocyte share is comparable to muscle and endocrine annotations.'
