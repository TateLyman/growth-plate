- gap_id: g_l4endo_003
  question: Is the glucocorticoid receptor expressed differentially across the resting, proliferative and hypertrophic zones
    of the HUMAN growth plate, and what fraction of it is ligand-occupied at physiological versus therapeutic cortisol exposure?
  type: search_established
  layer: L4
  why_it_matters: 'Glucocorticoid growth suppression is the commonest iatrogenic cause of short stature in chronically ill
    children, and the rabbit unilateral-infusion experiments locate the effect inside the plate. Which zone is hit determines
    whether the deficit is recoverable: suppression of resting zone proliferation conserves progenitor capacity and permits
    catch-up, whereas hypertrophic-zone effects would translate directly into lost bone. Without zonal receptor data in human
    tissue, the choice between glucocorticoid-sparing strategies and rescue with GH is made on rabbit histology.'
  what_is_known: Local intra-plate dexamethasone (80 ng/uL at 1 uL/h) cut ipsilateral rabbit tibial growth rate by 77% versus
    the contralateral vehicle-infused plate (baron1992), and subsequent catch-up growth was also confined to the treated plate
    (baron1994). Dexamethasone slowed rabbit resting zone chondrocyte proliferation and their numerical depletion, conserving
    proliferative capacity (schrier2006). Against this, tamoxifen- inducible chondrocyte-specific GR knockout mice had normal
    growth plates, long bone length and bone microarchitecture at all ages tested, with impairment only in metaphyseal fracture
    healing (tu2014).
  what_is_missing: No study reports GR protein abundance, isoform composition (GRalpha versus GRbeta), or transcriptional
    output by zone in human growth plate tissue; there is no human ligand-occupancy or GR-target-gene measurement in the physis
    at any cortisol exposure.
