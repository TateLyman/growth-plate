- gap_id: g_l4endo_012
  question: Does restoring IGF-1 bioavailability - rather than IGF-1 concentration - rescue growth in humans, and by how much
    per unit increase in the bioactive IGF fraction?
  type: known_unknown
  layer: L4
  why_it_matters: PAPP-A2 deficiency is the proof that the bioavailability layer sets stature in humans, and it also names
    a specific replacement molecule (recombinant PAPP-A2) that no other short-stature condition has. If a defined increase
    in bioactive IGF fraction maps to a defined height-velocity gain, the same relationship becomes the dose target for idiopathic
    short stature, GH insensitivity and any condition where total IGF-1 is normal but free IGF-1 is low - a much larger group
    than PAPPA2 mutation carriers.
  what_is_known: In PAPP-A2-deficient humans the bioactive IGF fraction is 0.09-0.32% of total against a healthy median of
    1.23% (range 0.46-2.59%), free IGF-1 is 0.27-1.98 ug/L against a prepubertal reference of 1.58-3.15, and heights are -2.16
    to -3.81 SDS (dauber2016). rhIGF-1 improves growth velocity and height in these patients. In Pappa2-null mice, rhGH, rhIGF-1
    and rhPAPP-A2 all partially rescue skeletal growth but with sex-specific differences in the signalling response (fernndezarjona2024,
    lpezgambero2025). Population-level data show PAPP-A2 and STC2, but not PAPP-A, associate with circulating total IGF-1
    in adults (nimptsch2024), and children with obesity have high free IGF-1 and accelerated growth despite reduced pappalysins
    (martnrivada2025).
  what_is_missing: No human dose-response linking a measured change in bioactive or free IGF-1 to a measured change in height
    velocity, in PAPP-A2 deficiency or in any other condition; no human recombinant PAPP-A2 exposure; and no agreed reference
    method for bioactive IGF, so the 0.09-0.32% versus 1.23% comparison rests on a single laboratory's assay.
  nearest_evidence:
  - dauber2016
  - fernndezarjona2024
  - lpezgambero2025
  - nimptsch2024
  - martnrivada2025
  discriminating_experiment: Model system - a multi-arm dose-finding study in children with low free IGF-1 and normal or high
    total IGF-1 (PAPPA2 mutation carriers plus a broader biochemically defined cohort), receiving rhIGF-1 at several doses,
    with a parallel first-in-human recombinant PAPP-A2 arm if available. Readout - free and bioactive IGF-1 by a harmonised
    assay (IGF-1 kinase receptor activation bioassay plus ultrafiltration free IGF-1) measured at steady state, against 6-month
    height velocity and 12-month height SDS change. Expected result - under a bioavailability model, height velocity is a
    monotone function of bioactive IGF fraction irrespective of total IGF-1, and rhPAPP-A2 achieves the same velocity as rhIGF-1
