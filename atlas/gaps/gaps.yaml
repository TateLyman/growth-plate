- gap_id: g_l5matrix_007
  question: By what mechanism is aggrecan removed from the hypertrophic zone before mineralization, and what is its half-life
    in growth plate as opposed to articular cartilage?
  type: known_unknown
  layer: L5
  why_it_matters: Aggrecan carries essentially all the fixed charge of the matrix, and mineral cannot form where the proteoglycan
    gel is intact - matrix sulphur falls from 3.5% to 0.3% of dry mass at the mineralization front. So aggrecan clearance
    is a required step in longitudinal growth, and the two obvious protease families have both been formally excluded in mouse.
  what_is_known: Mice carrying aggrecan resistant to MMP cleavage at N341-F342 develop normally, do not accumulate aggrecan,
    and show no compensatory cleavage at alternative interglobular-domain sites (little2005). Adamts4/Adamts5 double-null
    mice are physiologically normal (majumdar2007), although ADAMTS5 is the dominant aggrecanase in murine osteoarthritis
    (glasson2005) and in human explants both ADAMTS-4 and -5 contribute (song2007). In bovine growth plate, aggrecan synthesis
    and breakdown are both fastest in the resting/proliferative third and slowest in the lower hypertrophic third (shapses1994).
    Human articular aggrecan monomer half-life is 3.4 years (maroudas1998), a figure that cannot apply to a tissue replaced
    in weeks.
  what_is_missing: Both the mechanism (which protease, or non-proteolytic loss by diffusion after G1 detachment, or hyaluronidase-driven
    aggregate disassembly) and the number (physeal aggrecan half-life in days).
  nearest_evidence:
  - little2005
  - majumdar2007
  - shapses1994
  - maroudas1998
  - althoff1982
  discriminating_experiment: 'Pulse-chase growing rats or lambs with 35S-sulphate or with heavy-water-labelled amino acids,
    then microdissect the growth plate by zone at intervals and measure both the decay of label in aggregate-bound aggrecan
    and the appearance of specific neoepitopes: NITEGE (MMP site), ARGSVIL (aggrecanase site), and free G1. Under a proteolytic
    model one neoepitope will dominate at the hypertrophic boundary. Under a non-proteolytic model, intact full-length aggrecan
    and free hyaluronan will be lost together with no neoepitope enrichment, which would point to hyaluronidase or HAS2 downregulation
    as the clearance route. The same experiment yields the missing physeal half-life directly.'
  tractability: 4
- gap_id: g_l5matrix_008
  question: Which zone of the growth plate is stiffest, and does the direction of the zonal stiffness gradient depend on species,
    anatomical site, or measurement method?
  type: contradiction
  layer: L5
  why_it_matters: Physeal fractures propagate through a mechanically weak plane, and guided-growth and distraction hardware
    are designed around assumed stiffness gradients. The published gradients point in different directions, so the predicted
    failure plane and the predicted strain distribution across the plate differ between studies that are all cited interchangeably.
  what_is_known: 'Newborn porcine distal ulna, unconfined compression, transversely isotropic biphasic model: the RESERVE
    zone is stiffest, with PZ and HZ half as stiff axially and about a third as stiff transversely, and three times as permeable
    radially (sergerie2009). Nine-week rabbit proximal tibia, microindentation: modulus PEAKS in the UPPER HYPERTROPHIC zone,
    range 380-690 kPa, with proteoglycan content correlating with compressive modulus (eckstein2022). Rabbit cranial base,
    AFM microindentation: modulus increases MONOTONICALLY from reserve (0.57 MPa) to mineralizing zone (1.41 MPa) (radhakrishnan2004).
    Human phalangeal and tibial growth plate, sharp-tip AFM: HZ (416 MPa) stiffer than RZ (131 MPa) (xie2025). Bovine tensile
    failure runs from the upper columnar into the reserve zone, leaving chondrons intact on the metaphyseal side (williams2001).'
  what_is_missing: A single study measuring more than one species, more than one anatomical site and more than one method
    on comparable tissue. The five datasets differ simultaneously in species, site (weight-bearing long bone versus cranial
    base versus phalanx), age, hydration, loading mode and constitutive model, so no variable can be isolated.
  nearest_evidence:
  - sergerie2009
  - eckstein2022
  - radhakrishnan2004
  - xie2025
  - williams2001
  discriminating_experiment: 'A single-laboratory factorial study: proximal tibial and cranial base physes from rabbit and
    pig at two ages, each specimen measured by (i) microindentation with a 100 um spherical probe, (ii) AFM with a 5 um spherical
    probe, and (iii) zone-dissected unconfined compression, all hydrated in PBS, with paired Safranin-O and Raman proteoglycan
    mapping. If the gradient direction is method-dependent, indentation and compression will disagree within the same specimen
    and the field''s disagreement is an artefact of technique. If it is site-dependent, cranial base and long bone will differ
    consistently across methods and species, and cranial-base data (radhakrishnan2004) should be excluded from long-bone models.
    If it is age-dependent, the newborn porcine result (reserve stiffest) will reverse in older animals as the hypertrophic
    zone begins to calcify.'
  tractability: 4
- gap_id: g_l5matrix_009
  question: Which enzyme actually crosslinks collagen in the growth plate, and does crosslink density vary by zone?
  type: known_unknown
  layer: L5
  why_it_matters: Covalent crosslinking is what makes the collagen network able to resist aggrecan swelling pressure, and
    it is irreversible - a physeal fibril, once crosslinked, cannot be re-engineered by the cell. If crosslink density is
    zonally graded it is a direct candidate explanation for the zonal stiffness gradient and for why physeal fractures propagate
    where they do. The growth plate is also a steep oxygen gradient and lysyl oxidase is hypoxia-inducible, so a zonal LOX
    gradient is mechanistically plausible and entirely untested.
  what_is_known: Cartilage collagen II is crosslinked head-to-tail by hydroxylysyl pyridinoline at two telopeptide-to-helix
    sites, and collagen IX carries at least six crosslink sites all occupied in the matrix pool (eyre2002). Human ARTICULAR
    cartilage pyridinoline content has been measured across age (eyre1988). Lox-null mice die perinatally from aortic and
    diaphragmatic failure (mki2002). Phospho1-/- bone shows altered DHLNL/HLNL and pyridinoline/deoxypyridinoline ratios alongside
    hypomineralization (huesa2011), showing crosslink chemistry tracks mineralization status.
  what_is_missing: Any zone-resolved measurement of LOX/LOXL isoform expression, LOX enzymatic activity, or pyridinoline/deoxypyridinoline
    crosslink density in growth plate cartilage, in any species. No lathyrogen (beta-aminopropionitrile) dose-response on
    physeal mechanical properties was located either.
  nearest_evidence:
  - eyre2002
  - eyre1988
  - mki2002
  - huesa2011
  discriminating_experiment: Microdissect resting, proliferative and hypertrophic zones from bovine or porcine physis, hydrolyse
    and quantify HP and LP crosslinks per collagen molecule by HPLC with fluorescence detection, normalised to hydroxyproline;
    in parallel measure LOX, LOXL1-4 transcript and LOX enzymatic activity per zone. Then test causality by feeding growing
    rats beta-aminopropionitrile at graded doses and measuring zonal modulus by microindentation against crosslink density
    in the same animals. If crosslink density explains the stiffness gradient, modulus will scale with pyridinoline content
    across zones and BAPN will collapse the gradient dose-dependently. If it does not, the gradient is set by mineral and
    proteoglycan content instead, which is what the Raman correlation in eckstein2022 suggests.
  tractability: 4
- gap_id: g_l5matrix_010
  question: Does human growth plate matrix stiffness or composition change measurably before radiographic fusion, and can
    any matrix parameter be measured non-invasively in a living child?
  type: quantitative_gap
  layer: L5
  why_it_matters: Every human growth plate matrix measurement in this layer comes from a terminal surgical specimen - amputation,
    epiphysiodesis, or post-mortem - so all of it is cross-sectional and none of it can be repeated in the same child. If
    a matrix parameter (water content by MR T1 mapping, fixed charge density by sodium MRI, proteoglycan by dGEMRIC or T1rho)
    tracked approaching fusion, it would convert this layer from descriptive anatomy into a clinically usable predictor of
    remaining growth, which bone age currently does poorly.
  what_is_known: MR T1 mapping measures cartilage and physeal water content with 97.3% accuracy against freeze-drying, with
    in vivo CV 2.73 and interobserver CV 0.053, but has only been demonstrated in eight skeletally immature 30 kg pigs (shiguetomimedi2013).
    Sodium NMR measures cartilage FCD non-destructively with essentially complete sodium visibility (NMR:ICP 1.02 +/- 0.04)
    and the authors explicitly note applicability in vivo (lesperance1992). Human growth plate composition and modulus have
    been mapped ex vivo in donors aged 0-14 years (xie2025).
  what_is_missing: Any longitudinal in vivo measurement of growth plate matrix composition in children, and any demonstration
    that such a measurement predicts remaining growth or time to fusion.
  nearest_evidence:
  - shiguetomimedi2013
  - lesperance1992
  - xie2025
  discriminating_experiment: A prospective cohort of children aged 8-16 undergoing knee MRI for unrelated indications, scanned
    annually with a protocol adding T1 mapping (water), T1rho or dGEMRIC (proteoglycan) and, at sites with the hardware, sodium
    MRI (fixed charge density) over the distal femoral physis, with height velocity and Greulich-Pyle bone age at each visit
    and adult height as the endpoint. If matrix composition changes ahead of radiographic fusion, physeal water content and
    FCD will fall in the two years before fusion and will add predictive information about remaining growth beyond bone age
    alone. If they do not change until the plate is already bridged, the matrix is not a leading indicator and imaging effort
    should go to the resting zone instead.
  tractability: 3
- gap_id: g_l0dev_001
  question: Does the positional HOX identity retained by postnatal skeletal cells causally set the site-specific elongation
    rate of the growth plate at that site, or is it a passive marker while rate is set by the independently timed senescence
    programme?
  type: scale_gap
  layer: L0
  why_it_matters: The whole layer is justified by the assumption that embryonic patterning explains why the distal femur,
    proximal tibia and metacarpal run at different velocities. If HOX identity is causal, site-specific growth becomes a druggable
    transcriptional target and limb-lengthening biology changes. If it is a marker, then site-specific rate is set by a separate
    senescence clock and L0 explains only which elements exist, not how fast they grow. The two readings imply completely
    different intervention strategies and the field currently states the causal version without having tested it.
  what_is_known: Hox11 compound mutants slow radius and ulna elongation postnatally, lose growth plate height and senesce
    prematurely while resting- and proliferative-zone proliferation rises (pineault2015, mouse). Hox function in the adult
    skeleton is region-restricted (song2020, rux2017, leclerc2023). Hoxd13, Shox and Tbx5 are differentially expressed between
    one-week phalangeal and tibial growth plates in a manner independent of the plates' differing developmental age (lui2018).
    Adult human fibroblasts retain site-specific HOX expression (chang2002). Shox2 gained expression in jerboa metatarsals
    and is sufficient to lengthen mouse distal limb (saxena2022).
  what_is_missing: Any experiment that changes a HOX gene and measures elongation rate at two anatomically different plates
    in the same animal. lui2018, the only study that measures both rate and positional gene expression across sites, attributes
    the rate difference to differential senescence progression and performs no HOX manipulation. The direction of the arrow
    between positional identity and rate has never been tested.
  nearest_evidence:
  - pineault2015
  - lui2018
  - saxena2022
  - leclerc2023
  discriminating_experiment: Conditional, chondrocyte-restricted (Acan-CreERT2) deletion of Hoxa11/Hoxd11 in juvenile mice,
    with calcein double-labelling of elongation rate measured simultaneously at the proximal tibia (Hox11 domain) and the
    distal femur (Hox10 domain) in the same animals, plus zone-resolved proliferation and terminal hypertrophic cell height.
    Under the causal hypothesis, tibial rate falls while femoral rate is unchanged, and the fall precedes any change in senescence
    markers. Under the marker hypothesis, neither rate changes on the timescale of the deletion, or both change together with
    generalised senescence markers. A reciprocal gain-of-function arm - Hoxa11 misexpression in metacarpal chondrocytes -
    should raise metacarpal rate toward tibial values if the identity is instructive.
  tractability: 4
  search_log_ref: g_l0dev_004
- gap_id: g_l0dev_002
  question: Is there any developmental antecedent - in patterning, in ossification-centre timing, or in epiphyseal architecture
    - that distinguishes species whose growth plates undergo complete epiphyseal fusion (human, dog, rabbit) from species
    whose plates persist (mouse, rat)?
  type: search_established
  layer: L0
  why_it_matters: 'L7 establishes that the two genetically tractable models cannot express the endpoint the atlas is about:
    mice and rats cease growth without fusing. Every murine fusion claim is therefore an inference from a surrogate. If the
    divergence has a developmental antecedent - for example a difference in secondary ossification centre extent, in epiphyseal
    vascular architecture, or in the size of the reserve pool laid down at the condensation stage - then that antecedent is
    measurable in embryos and could be used to select or engineer a model that does fuse. If there is none, the divergence
    is a late endocrine or matrix phenomenon and embryology is the wrong place to look.'
  what_is_known: Species sort into complete fusion, cessation without fusion, and site-specific persistence (L7 comparative_fusion_across_species).
    The secondary ossification centre first appears in amniotes and its extent varies with mechanical demand across mammals,
    but both fusing (rabbit) and non-fusing (mouse, rat) species form SOCs, so SOC presence alone cannot be the antecedent
    (xie2020). Rodents and rabbits pass through the same sixteen structural stages of long bone development up to physeal
    resorption, which is stage 16 and is reached in rabbit but not in mouse (rivas2002, and L7 mouse_does_not_fuse).
  what_is_missing: No study asks the question. A Europe PMC search combining epiphyseal fusion or physeal closure with developmental,
    embryonic or ontogenetic terms and with human-versus-rodent comparison returned 194 records of which the top 20 by relevance
    were screened; none addresses a developmental antecedent of the fusion/non-fusion divergence. The nearest records are
    a caprine autopod synostosis description and a comparative review of bone length regulation, neither of which compares
    embryonic parameters between fusing and non-fusing species.
  nearest_evidence:
  - xie2020
  - rivas2002
  discriminating_experiment: 'Matched-stage comparative embryology and early postnatal microCT/histology of a fusing species
    (rabbit) and a non-fusing species (rat) reared under identical conditions, measuring at each of the sixteen Rivas-Shapiro
    stages: epiphyseal cartilage volume, cartilage canal density, SOC volume as a fraction of epiphyseal volume, and resting
    zone cell number per unit plate area. Under the developmental-antecedent hypothesis, at least one of these diverges before
    the fusing species approaches cessation - the strongest prediction being a smaller resting zone reserve per unit of remaining
    growth in the fusing species. Under the late-endocrine hypothesis, all four parameters scale identically once normalised
    to fraction of total growth completed, and divergence appears only at sexual maturation.'
  tractability: 3
  search_log_ref: g_l0dev_002
- gap_id: g_l0dev_003
  question: Do mesenchymal condensations that become skeletal elements of very different final length (femur versus phalanx)
    differ in cell number, volume or cell density at the condensation stage, and by how much?
  type: quantitative_gap
  layer: L0
  why_it_matters: 'The claim that all long bone condensations start at a similar size and diverge only through differential
    growth is asserted in the introductions of primary papers and in reviews, and it is load-bearing: it is what licenses
    the atlas to treat the entire 10-20 fold difference in adult bone length as a growth plate phenomenon rather than a starting-size
    phenomenon. If condensations differ by, say, threefold in cell number, then a third of the final disparity is set before
    any growth plate exists and the mechanistic layers are being asked to reproduce a number that is not theirs.'
  what_is_known: The statement "all long bones form from mesenchymal condensations of similar size" appears in lui2018 citing
    two Hall and Miyake reviews, not primary measurements. Condensation-stage progenitors are spatially compartmentalised
    and their descendants occupy restricted growth plate territories (wu2025). Human embryonic condensation-stage cells have
    been profiled transcriptionally and spatially at 5-11 post-conception weeks (to2024) but not counted per element.
  what_is_missing: A number. A Europe PMC search for condensation or cartilage anlage combined with cell number, cell count
    or volume and with measurement or stereology terms returned 363 records; the top 20 by relevance contain no study reporting
    condensation cell number or volume compared across elements of different final length in any species.
  nearest_evidence:
  - wu2025
  - to2024
  - lui2018
  discriminating_experiment: Light-sheet imaging of whole cleared mouse limbs at E11.5-E12.5 with Sox9 or Col2a1 reporter
    labelling, segmenting every condensation in one limb and counting nuclei per condensation and condensation volume, then
    following the same elements to adult length in littermates. Regress adult element length on condensation cell number.
    Under the equal-start hypothesis the regression slope is near zero and adult length is uncorrelated with starting cell
    number. Under the starting-size hypothesis the slope is significantly positive and the fraction of adult length variance
    explained gives directly the share of skeletal proportion that is NOT a growth plate phenomenon. The same measurement
    is feasible in human embryonic specimens by light-sheet imaging of the existing 5-11 post-conception week collections.
  tractability: 4
