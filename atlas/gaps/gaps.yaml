- gap_id: g_l4endo_011
  question: Why does pharmacological glucocorticoid act locally and potently on the growth plate (77% growth suppression on
    unilateral infusion in rabbit) while genetic deletion of the glucocorticoid receptor from chondrocytes leaves mouse growth
    plates and long bone length entirely normal?
  type: contradiction
  layer: L4
  why_it_matters: These two results are used interchangeably to support "glucocorticoids act on the chondrocyte", but they
    cannot both mean that. Either the receptor mediating pharmacological suppression is not the classical chondrocyte GR (raising
    the possibility of a perichondrial, vascular or mineralocorticoid-receptor route), or endogenous and pharmacological glucocorticoid
    exposures engage different mechanisms. The answer changes what a growth-sparing steroid would have to avoid.
  what_is_known: Local intra-plate dexamethasone infusion (80 ng/uL at 1 uL/h) reduced ipsilateral rabbit proximal tibial
    growth by 77% versus the vehicle-infused contralateral plate, P<0.0001, with a measurement error of ~5% (baron1992); subsequent
    catch-up was likewise confined to the treated plate (baron1994); dexamethasone slowed rabbit resting zone chondrocyte
    proliferation and their numerical depletion (schrier2006). Against this, tamoxifen- inducible chondrocyte-specific GR
    knockout mice showed normal knee joint architecture, cartilage structure, growth plates, intervertebral discs, long bone
    length and bone microarchitecture at all ages, with a defect confined to metaphyseal fracture healing (tu2014).
  what_is_missing: 'No experiment applies the two designs to the same question: nobody has performed the unilateral local
    dexamethasone infusion in a chondrocyte-specific GR knockout animal, which is the single measurement that would resolve
    it. Nor has the mouse GR knockout been challenged with systemic glucocorticoid excess and a growth endpoint.'
  nearest_evidence:
  - baron1992
  - baron1994
  - schrier2006
  - tu2014
  discriminating_experiment: Model system - Acan-CreERT2 x Nr3c1-flox mice and littermate controls, each receiving unilateral
    intra-growth-plate dexamethasone infusion with contralateral vehicle, plus a systemic high-dose dexamethasone arm. Readout
    - ipsilateral versus contralateral tibial growth rate by calcein/tetracycline double labelling and pin-radiograph measurement,
    with zonal heights and resting zone chondrocyte counts. Expected result - under a chondrocyte-GR model, local dexamethasone
    suppresses growth in controls but has no ipsilateral effect in chondrocyte-GR-null mice, and the mouse null result in
    tu2014 is simply the absence of a physiological ligand challenge; under a non-chondrocyte-target model, local dexamethasone
    suppresses growth equally in both genotypes, redirecting the search to perichondrium, hypertrophic-zone vasculature or
    the mineralocorticoid receptor.
