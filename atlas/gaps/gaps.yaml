- gap_id: g_l7fuse_009
  question: Do blood vessels invade the human growth plate from both the epiphyseal and metaphyseal sides at fusion, and does
    the first bony bridge form where the two vascular fronts meet?
  type: species_gap
  layer: L7
  why_it_matters: Bidirectional invasion is the only proposed mechanism that explains the specific geometry Haines described
    - mineralisation advancing from both surfaces, then perforation - and it is the only mechanism that would make fusion
    a vascular rather than a chondrocyte-autonomous event. It also predicts a different therapeutic target (angiogenesis)
    from every other hypothesis in this layer.
  what_is_known: 'Human and canine histology shows tide-line-demarcated mineralisation spreading inward from both plate surfaces
    before union, union first by mineralised cartilage as metaplastic bone, and then perforation, with single perforations
    in small early-uniting epiphyses and multiple perforations in large late-uniting ones (haines1975, human and dog). The
    estrogen-angiogenesis link is rodent: VEGF protein fell after ovariectomy and was restored by estradiol in rat growth
    plates, and estradiol dose-dependently induced VEGF-121 and VEGF-189 but not VEGF-164 in a rat chondrocyte line; human
    growth plate VEGF protein rises across pubertal development (emons2010, rat and human). The one human fusing plate showed
    hypoxia and necrosis, which is hard to reconcile with a plate being actively vascularised (emons2009).'
  what_is_missing: No vascular imaging of a human growth plate at fusion has been published. The direction of vessel ingrowth
    relative to the first bridge has never been determined in any species that fuses. Rodent VEGF data cannot address it because
    rodents do not complete fusion.
  nearest_evidence:
  - haines1975
  - emons2010
  - emons2009
  discriminating_experiment: 'Model system: synchrotron phase-contrast or contrast-enhanced micro-CT of intact human physeal
    blocks from the biobank in g_l7fuse_002, plus rabbit distal femora at defined pre-fusion and fusion stages, with vascular
    casting. Readout: 3D reconstruction of canal continuity across the plate, scored for whether each nascent bridge is continuous
    with an epiphyseal canal, a metaphyseal canal, or both, and whether chondrocyte loss (empty lacunae) is proximal or distal
    to the vascular tip. Expected results - bidirectional invasion: bridges are dual-supplied and vascular tips precede empty
    lacunae. Chondrocyte-first models: empty lacunae precede vessels and bridges are supplied from the metaphyseal side only,
    as in ordinary endochondral growth. Hypoxic death: canal density falls before bridging, which would reconcile the emons2009
    ultrastructure with the Haines geometry.'
