  what_is_missing: Any primary measurement of telomere length or telomerase activity in human growth plate chondrocytes. A
    Europe PMC search on 2026-08-05 returned 218 records, all of which were osteoarthritic articular cartilage, general skeletal
    ageing reviews, or rodent studies.
  nearest_evidence:
  - carlone2021
  - nilsson2005
  discriminating_experiment: 'Zone-resolved telomere measurement on banked human growth plate tissue: apply quantitative FISH
    for telomere signal intensity, plus TRAP or TERT in-situ detection, to resting, proliferative and hypertrophic zones across
    a paediatric age series spanning pre-pubertal to near-fusion. If telomere attrition underlies the finite capacity, resting-zone
    telomere signal declines monotonically with age and is lowest near fusion. If the limit is epigenetic rather than telomeric,
    resting-zone telomere signal is stable across the series while global methylation falls, mirroring the rabbit result.'
  tractability: 4
  search_log_ref: g_l2stem_007
  nearest_evidence_note: 'carlone2021: mouse mTert-GFP reporter. nilsson2005: rabbit, indirect and negative for a replicative
