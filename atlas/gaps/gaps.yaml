- gap_id: g_l4endo_010
  question: Does human SOCS2 loss of function produce overgrowth, as the mouse predicts, and if not, what compensates?
  type: species_gap
  layer: L4
  why_it_matters: Socs2-null mice are among the largest single-gene overgrowth models in the GH axis and are cited as evidence
    that GH signalling is submaximally braked. If no human phenotype exists at any allele frequency, the brake is either redundant
    in humans or SOCS2 loss is selected against for non-skeletal reasons - and the therapeutic idea of pharmacologically inhibiting
    SOCS2 to enhance GH response, which follows directly from the mouse, loses its premise.
  what_is_known: Socs2-null mice show substantial skeletal overgrowth with normal circulating GH and IGF-1, and the overgrowth
    is GH-dependent (metcalf2000). SOCS2 is a direct STAT5B target and binds phosphorylated GHR to target it for degradation,
    so the mechanism is specific and well defined. Human STAT5B loss of function - which would also remove SOCS2 induction
    - causes short, not tall, stature (kofoed2003, hwa2005), consistent with the brake being downstream of the signal it limits.
  what_is_missing: No reported human SOCS2 biallelic loss-of-function individual with an overgrowth phenotype, and no systematic
    interrogation of tall-stature cohorts or population biobanks for SOCS2 predicted-loss-of-function carriers with height
    as the tested outcome.
  nearest_evidence:
  - metcalf2000
  - kofoed2003
  - hwa2005
  discriminating_experiment: Model system - population-scale exome/genome biobanks (UK Biobank, All of Us, gnomAD- linked
    cohorts) plus curated idiopathic tall-stature and overgrowth cohorts. Readout - burden test of SOCS2 predicted loss-of-function
    and missense-deleterious variants against standing height in SD units, with a matched positive control (e.g. NPR2 gain-of-function)
    and negative control gene set; complemented by a SOCS2-hypomorph knock-in mouse humanised at the GHR-SOCS2 interface.
    Expected result - under a conserved-brake model, SOCS2 pLoF carriers are significantly taller with an effect size of the
    order of +0.3 to +1 SD and the signal replicates across biobanks; under a species-divergence model, SOCS2 pLoF carriers
    exist at expected frequency with no height effect, which would locate the mouse phenotype in a rodent-specific feature
    of GH pulse amplitude or GHR turnover rather than in a general mammalian mechanism.
