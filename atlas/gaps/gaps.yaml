    osteoarthritis articular-cartilage eQTL work, osteoclast eQTL work, and Mendelian-randomization studies using non-skeletal
    eQTL panels - none is physeal, and none is zone-resolved. The obstacle is structural rather than technical: human growth
    plate tissue is obtainable only as surgical discard in small numbers, so assembling the tens-to-hundreds of genotyped
    donors an eQTL scan needs is the binding constraint.'
