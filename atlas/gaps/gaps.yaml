  question: Do cis-regulatory variants identified in human growth plate chondrocytes have measurable expression effects in
    situ - i.e. does a growth-plate eQTL catalogue from primary human physeal tissue exist, with donor numbers sufficient
    to map effects by zone?
  type: search_established
  layer: L8
  why_it_matters: Chromatin accessibility and enhancer maps show where regulatory potential lies, but an eQTL requires genotype-by-expression
    across many donors and is the direct evidence that a height variant changes gene dosage in the tissue that builds stature.
    Without it, variant-to-gene assignment in the growth plate rests on accessibility overlap and orthology rather than measured
    allelic effect, which weakens every causal claim linking L8 to L1-L3.
  what_is_known: Human chondrocyte epigenomic/transcriptomic maps across skeletal sites now exist (Richard 2025). eQTL catalogues
    exist for human osteoclasts and for articular/primary cartilage in the osteoarthritis literature, and GTEx covers neither
    growth plate nor any cartilage tissue.
