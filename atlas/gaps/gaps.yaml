- gap_id: g_l11path_001
  question: Within genetically confirmed achondroplasia, does the specific FGFR3 allele (c.1138G>A vs c.1138G>C, both G380R;
    and the rarer non-G380R achondroplasia alleles) explain any of the residual variance in adult height?
  type: quantitative_gap
  layer: L11
  why_it_matters: Achondroplasia is presented as a single-allele disorder with a fixed adult height of ~132/124 cm, yet the
    reported variability around that mean is as wide as in the general population. If part of that variance is allelic rather
    than polygenic, then vosoritide and infigratinib trials are pooling responders and non-responders, and the field's baseline
    expectation for an individual patient is wrong. It also determines whether FGFR3 output is a graded rheostat across the
    whole series or only between the named syndromes.
  what_is_known: The two nucleotide changes at position 1138 both produce G380R and are conventionally treated as equivalent.
    Naski 1996 shows K650E > G380R in constitutive activity, establishing that graded activation exists ACROSS syndromes.
    Merker 2018 reports adult height 132 cm (M) / 124 cm (F) in 466 European children with variability comparable to the general
    population, but does not stratify by allele.
  what_is_missing: No published cohort reports adult height stratified by achondroplasia genotype. No study partitions achondroplasia
    height variance into allelic, parental-height (polygenic) and environmental components.
  nearest_evidence:
  - merker2018
  - naski1996
  - shiang1994
  discriminating_experiment: Take an existing genotyped achondroplasia registry with attained adult heights (LIAISE, ACHieve,
    or the European growth-reference cohort), stratify by c.1138G>A vs c.1138G>C vs non-G380R alleles, and regress adult height
    on allele with mid-parental height as a covariate. Under the 'single allele, fixed phenotype' hypothesis the allele term
    is null and mid-parental height carries the variance; under a graded-rheostat hypothesis the non-G380R alleles separate
    by >1 SD and the two G380R nucleotide changes do not.
