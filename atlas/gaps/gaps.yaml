- gap_id: g_l0dev_005
  question: Given that human secondary ossification centres appear bone by bone across roughly two decades while mouse SOCs
    all appear within a two-week window, does resting-zone stem cell character in humans appear at a bone-specific age tracking
    that bone's own SOC?
  type: species_gap
  layer: L0
  why_it_matters: 'The SOC-triggers-stemness hypothesis is load-bearing for fusion models in L7, and its only support is temporal
    coincidence in mouse. This layer contributes the timing side, and the timing side generates a sharp, testable and so far
    unexamined prediction in humans: if the SOC is the trigger, human growth plates should acquire stem-cell character in
    the same staggered order as their SOCs appear, meaning the distal femoral plate would be stem-cell-competent from around
    term while a proximal humeral or metacarpal plate would not be for years. If instead human resting zones look alike at
    equivalent skeletal ages regardless of SOC status, the coincidence in mouse is an artefact of everything happening at
    once in a two-week-old animal.'
  what_is_known: Human distal femoral SOC is absent before 30 weeks gestation and universal after 35 weeks; the proximal tibial
    SOC is absent before 33 weeks and present in only 73.7% at 37 weeks (funaki2020, n=199). Mouse PTHrP+ colony-forming self-renewal
    rises between a P9 and a P12 pulse, described as coinciding with SOC development (mizuhashi2018), and clonal behaviour
    switches at the same time (newton2019). No SOC manipulation has been read out as a stemness assay in any species (L2 gap
    g_l2stem_003).
  what_is_missing: Any human comparison of resting zone properties between a bone whose SOC has formed and a bone whose SOC
    has not, at the same chronological age in the same individual.
  nearest_evidence:
  - funaki2020
  - mizuhashi2018
  - newton2019
  - xie2020
  discriminating_experiment: Single-cell and spatial transcriptomic profiling of resting zones from two different bones of
    the same paediatric individual, chosen so that one has a mature SOC and the other does not - for example distal femur
    versus a metacarpal or proximal humerus in specimens obtained at epiphysiodesis, amputation or post-mortem. Score each
    resting zone for the human stem-like signatures already defined (PRRX1-high root population, CHRDL2/SFRP5 quiescent populations).
    Under the SOC-trigger hypothesis the SOC-bearing bone shows the stem-like signature and the SOC-free bone does not. Under
    the null the two are indistinguishable once normalised for plate height. In mouse the same question is answerable now
    with the validated SOC-delay tools (axitinib at P18; Prx-Cre:GnasR201H) combined with a PTHrP-creER colony-forming readout.
  tractability: 2
