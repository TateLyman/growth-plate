- gap_id: g_l7fuse_001
  question: Does estrogen irreversibly deplete the resting-zone progenitor pool of the human growth plate, as it does in the
    ovariectomised rabbit, and does that depletion precede rather than follow the collapse of the proliferative columns?
  type: species_gap
  layer: L7
  why_it_matters: 'Progenitor exhaustion is the leading mechanistic account of why the human plate ends, and it is the account
    that predicts an intervention window: if fusion is triggered by running out of stem cells, preserving that pool would
    extend growth, whereas if fusion is a differentiated-cell senescence programme, preserving the pool would not help. The
    entire mechanism rests on one species.'
  what_is_known: In juvenile ovariectomised rabbits, 5 weeks of estradiol cypionate followed by 5 weeks of washout irreversibly
    advanced structural senescence and the age-related loss of resting-zone chondrocytes while reversibly suppressing growth
    plate function, and transient estrogen hastened epiphyseal fusion; the resting-zone cell loss was not apoptotic (nilsson2014_2,
    rabbit). Fusion in the same model occurs when the proliferation rate approaches zero (weise2001, rabbit), and suppressing
    proliferation with dexamethasone delays both senescence and fusion (gafni2001, rabbit). Single-cell and spatial profiling
    of human early-pubertal growth plate has now identified two resting-zone stem-like populations, including a PTHrP-negative
    Prrx1-marked root population, conserved with mouse (chu2026, human).
  what_is_missing: No count of human resting-zone progenitors as a function of pubertal stage, sex, or MRI fusion stage. The
    human specimens that exist are early-pubertal epiphysiodesis material; nothing spans the interval between mid-puberty
    and fusion. Mouse cannot be used because it never fuses (mouse_does_not_fuse); rabbit cannot be used for the human cell-identity
    markers because no rabbit growth plate single-cell atlas exists.
  nearest_evidence:
  - nilsson2014_2
  - chu2026
  - weise2001
  discriminating_experiment: 'Model system: human physeal tissue from staged epiphysiodesis and limb-reconstruction procedures,
    banked prospectively with a same-day MRI fusion stage (kvist2020 cartilage sequence protocol), spanning Tanner 2 to fusion
    in both sexes. Readout: absolute resting-zone root-cell density (PRRX1+/PTHrP-negative by the chu2026 marker panel) per
    mm of plate, plus Ki67 index of the proliferative zone, plus plate height, on the same section. Expected results - progenitor
    exhaustion: root-cell density falls monotonically and reaches near-zero at least one MRI stage BEFORE proliferative index
    and plate height collapse. Differentiated-cell senescence: root-cell density is preserved into late stages while Ki67
    index falls first. Vascular invasion: both fall abruptly and simultaneously at the stage at which bridges appear, with
    no antecedent decline.'
