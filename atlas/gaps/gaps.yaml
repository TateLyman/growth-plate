  - baron1994
  - schrier2006
  - tu2014
  discriminating_experiment: Model system - archived and prospectively collected human growth plate tissue from epiphysiodesis,
    limb-lengthening and post-mortem series, stratified by documented systemic glucocorticoid exposure. Readout - laser-capture
    microdissection of the three zones with (i) quantitative GR immunohistochemistry and GRalpha/GRbeta isoform-specific RNA
    quantification, and (ii) a GR-target transcript panel (FKBP5, TSC22D3/GILZ, PER1) as a readout of actual receptor occupancy
    rather than expression. Expected result - under a resting-zone-suppression model, GR and its target transcripts are highest
    in the resting zone and rise with glucocorticoid exposure there, matching the rabbit catch-up phenotype; under a hypertrophic-zone
    model, GR target induction concentrates in prehypertrophic/hypertrophic cells, predicting irreversible loss; under a GR-independent
