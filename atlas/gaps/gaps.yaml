- gap_id: g_l7fuse_002
  question: How many human growth plates have ever been examined histologically at the moment of epiphyseal fusion, and can
    a prospectively banked series be assembled?
  type: method_blocked
  layer: L7
  why_it_matters: Every cellular mechanism in this layer is adjudicated, if at all, against a sample of one. The negative
    apoptosis result that contradicts the entire rodent hypertrophic-chondrocyte literature (apoptosis_at_fusion) and the
    positive hypoxia/necrosis observation that replaced it (hypoxia_necrosis_at_fusion) both come from the same single specimen.
    Until n is greater than 1, no mechanism in L7 can rise above confidence D on human evidence.
  what_is_known: One human growth plate described as being about to fuse has been reported, collected within a small series
    of unfused pubertal plates; it contained no TUNEL-positive cells, expressed anti-apoptotic Bcl-2 and Bcl-XL but among
    pro-apoptotic proteins only Bad, and showed ultrastructural hypoxia and necrosis but no apoptosis or autophagy (emons2009,
    human). Classical human union histology exists from autopsy material but predates immunohistochemistry and molecular readouts
    (haines1975). Early-pubertal human growth plate is now obtainable from growth-restricting surgery and has been profiled
    at single-cell resolution (chu2026).
  what_is_missing: The tissue is not available at the relevant moment. Fusion occurs at ages when elective physeal surgery
    has essentially ceased, and the plate is destroyed by the event itself, so the window between "still gradable as fusing"
    and "gone" is short. No biobank of staged human physeal tissue exists, and no autopsy protocol routinely samples the physis.
  nearest_evidence:
  - emons2009
  - haines1975
  - chu2026
  discriminating_experiment: 'Model system: a multicentre prospective physeal biobank drawing on (a) epiphysiodesis and guided-growth
    hardware placement in adolescents 12-17 y, (b) amputation and tumour resection specimens with uninvolved physis, and (c)
    forensic autopsy of adolescents aged 14-20 with same-day post-mortem MRI. Readout: paired MRI fusion stage (kvist2020
    protocol) and matched histology, immunohistochemistry and single-nucleus RNA-seq on the identical plate. Expected result:
    a stage-resolved series of at least 10 specimens per fusion stage would, for the first time, allow the apoptosis, hypoxia/necrosis,
    vascular and progenitor hypotheses to be tested against each other in the species that actually fuses. A null result -
    no molecular difference across stages - would itself falsify all cell-autonomous accounts and force the field toward a
    purely vascular or mechanical trigger.'
