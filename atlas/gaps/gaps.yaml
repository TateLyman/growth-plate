- gap_id: g_l3rest_005
  question: What sets the level of beta-catenin signalling in each growth plate zone - is the zonal profile produced by WNT
    ligand availability, by antagonist gradients, or by SOX9-driven beta-catenin degradation?
  type: known_unknown
  layer: L3
  why_it_matters: The canonical WNT arm is dose-dependent with opposite phenotypes at the two extremes, so knowing the resting
    set point in each zone is a precondition for any therapeutic that raises or lowers it. Whether the set point is imposed
    from outside the cell (ligands and antagonists) or from inside (SOX9-driven degradation) determines whether an extracellular
    biologic can move it at all.
