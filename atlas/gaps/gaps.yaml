  question: Do growth plate chondrocytes express 11beta-HSD1 or 11beta-HSD2, and does pre-receptor cortisol/cortisone interconversion
    within the plate amplify or damp systemic glucocorticoid exposure?
  type: search_established
  layer: L4
  why_it_matters: Pre-receptor metabolism is the step that would explain why children on identical glucocorticoid doses show
    very different growth suppression, and it is the only mechanism in the glucocorticoid arm that is pharmacologically addressable
    without abandoning the steroid. If the plate expresses 11beta-HSD1, selective inhibitors already developed for metabolic
    disease become candidate growth-sparing agents; if it expresses 11beta-HSD2, the plate defends itself and dose-response
    variation must be sought elsewhere.
  what_is_known: 11beta-HSD1 activity is well documented in osteoblasts and osteoclasts, where it mediates part of glucocorticoid-induced
    bone loss, and 11beta-HSD2 forms the placental barrier whose reduction is linked to fetal growth restriction. Human HSD11B2
    loss of function causes apparent mineralocorticoid excess with low birth weight. Glucocorticoid action on the plate itself
    is demonstrably local (baron1992, baron1994).
  what_is_missing: No primary study measures 11beta-HSD1 or 11beta-HSD2 expression, protein or enzymatic activity in growth
    plate chondrocytes, by zone or in bulk, in any species. The pre-receptor amplification model is applied to the physis
    by extension from osteoblast data.
  nearest_evidence:
  - baron1992
  - baron1994
  - tu2014
  discriminating_experiment: Model system - human growth plate tissue from epiphysiodesis or limb-lengthening, paired with
    rabbit proximal tibial plate for functional work. Readout - (i) zonal HSD11B1/HSD11B2 transcript and protein quantification
    by laser-capture microdissection plus immunohistochemistry; (ii) enzymatic assay on microdissected zonal homogenates measuring
    cortisone-to-cortisol and cortisol-to-cortisone conversion by LC-MS/MS with deuterated internal standards. Expected result
    - under an amplification model, HSD11B1 reductase activity is detectable in the resting/proliferative zones and a selective
    11beta-HSD1 inhibitor co-infused with dexamethasone-precursor (11-dehydrocorticosterone) in the rabbit unilateral model
    abolishes the ipsilateral growth suppression; under a protection model, HSD11B2 dehydrogenase dominates and inhibiting
    it worsens local suppression; under a null model, neither activity exceeds assay background and the plate's glucocorticoid
    exposure equals free plasma cortisol.
