- gap_id: g_l6mech_004
  question: Do static and dynamic loading at equal mean stress suppress growth rate equally, or is dynamic loading growth-sparing?
  type: contradiction
  layer: L6
  why_it_matters: The claim that dynamic loading preserves growth where static suppresses it is the stated rationale for cyclically
    controlled vertebral tethers and for 'physiological' growth-modulation implants. If dynamic loading suppresses growth
    just as much and only spares the tissue, then such devices will still stunt the segment they are applied to, and the design
    goal should be tissue preservation, not growth preservation.
  what_is_known: 'Duty cycle matters: reducing 0.1 MPa compression from 24 to 12 h/day raised rat vertebral growth from 82%
    to 90-93% of control and tibial growth from 70% to 84-86% (stokes2005). Waveform apparently does not: sinusoidal 0.2 MPa
    +/-30% at 0.1 Hz reduced rat caudal vertebral growth by the same 19% as sustained 0.2 MPa, while sparing plate thickness,
    proliferative cells per column and hypertrophic cell height (valteau2011). Explants tell the tissue-sparing half of the
    story (sergerie2011, kaviani2015) and cell-strain measurements give the viscoelastic explanation (zimmermann2017). Frost''s
    chondral modeling theory predicts the opposite of the valteau2011 result (frost1979).'
  what_is_missing: A single experiment that varies duty cycle and waveform orthogonally at matched mean stress with a growth-rate
    endpoint, so that 'intermittent' (load off part of the day) and 'dynamic' (oscillating about a non-zero mean) are not
    conflated, as they routinely are in reviews.
  nearest_evidence:
  - stokes2005
  - valteau2011
  - sergerie2011
  discriminating_experiment: 'Rat caudal vertebra, 2x3 factorial, n>=8 per cell: duty cycle 24 h/day vs 12 h/day, crossed
    with waveform sustained, 0.1 Hz sinusoid and 1.0 Hz sinusoid, all at 0.2 MPa time-averaged stress, 14 days, fluorochrome
    growth rate plus histomorphometry. Under the growth-sparing hypothesis, waveform has a main effect on growth rate. Under
    the mean-stress hypothesis, only duty cycle affects growth rate while waveform affects only histomorphometry, which is
    what valteau2011 and stokes2005 jointly imply.'
  tractability: 5
- gap_id: g_l6mech_005
  question: Why does mechanically modulated growth become load-independent after two to four weeks of sustained tethering,
    and is the escape adaptation of the physis or creep of the tether?
  type: known_unknown
  layer: L6
  why_it_matters: Vertebral body tethering and guided growth both rely on sustained modulation over months to years. If the
    physis adapts away from a fixed mechanical stimulus within weeks, then the effective dose delivered over a treatment course
    is far smaller than the initial dose, which would explain incomplete correction, would predict that intermittent re-tensioning
    outperforms a single tightening, and would put a ceiling on what any passive implant can achieve.
  what_is_known: In kyphotic swine, single-level posterior tethering at high tension gave 53 +/- 43% growth modulation in
    the first 2 weeks versus -1 +/- 15% at low tension, but at 2-4 weeks the two were indistinguishable (14 +/- 11% vs 10
    +/- 10%), and the authors conclude modulation becomes load-independent with time (halanski2026). Separately, growth rate
    and plate height recover fully within 10 days of unloading (mnard2015), so the physis is not permanently altered.
  what_is_missing: Simultaneous measurement of tether force and growth rate over the same interval. Every published result
    measures one or the other, so tether relaxation, bone remodelling around the anchors, and physeal desensitisation cannot
    be distinguished.
  nearest_evidence:
  - halanski2026
  - mnard2015
  - stokes2005
  discriminating_experiment: Porcine or lapine tethering with a strain-gauged, telemetered tether recording force continuously
    for 8 weeks, combined with weekly fluorochrome labels for interval growth rate and end-point micro-CT of anchor migration.
    Under tether creep or anchor loosening, force decays with the same time constant as the modulation effect and re-tensioning
    restores it. Under physeal adaptation, force is maintained while modulation decays, and re-tensioning to the original
    force does not restore the original growth difference.
  tractability: 4
- gap_id: g_l6mech_006
  question: What frequency and strain-rate range does the growing physis actually experience during human locomotion, and
    does growth respond to loading frequency independently of magnitude?
  type: quantitative_gap
  layer: L6
  why_it_matters: Frost's chondral modeling theory makes peak intermittent strain, not mean stress, the controlling variable,
    and the viscoelastic explanation of static-versus-dynamic differences makes loading rate mechanistically central. Yet
    in vivo growth plate loading experiments have only ever used 0.1 and 1.0 Hz, a band far below the strain rates of heel
    strike or of the landing impacts that distinguish gymnastics from swimming.
  what_is_known: At 0.2 MPa mean, both 0.1 Hz and 1.0 Hz reduced rat caudal vertebral growth without histomorphometric change,
    while 1.0 Hz combined with a larger amplitude destroyed the plate, so frequency and amplitude interact (mnard2014). Higher-frequency
    dynamic compression produced lower hypertrophic cell volumetric strain in explants (zimmermann2017). At fixed 1.0 mm/day,
    raising distraction frequency from 1 to 4 to 60 steps/day monotonically improved regenerate quality (ilizarov1989).
  what_is_missing: A measured or validated-model frequency and strain-rate spectrum at a human physis during walking, running
    and landing, and any in vivo growth experiment above 1 Hz.
  nearest_evidence:
  - mnard2014
  - zimmermann2017
  - ilizarov1989
  discriminating_experiment: In vivo rat caudal vertebral loading at fixed 0.15 MPa mean and fixed peak-to-peak amplitude,
    varying frequency at 0.1, 0.5, 2 and 10 Hz for 14 days, n>=8 per group, with fluorochrome growth rate and histomorphometry,
    paired with a validated subject-specific model estimating the human physeal strain-rate spectrum during gait and landing.
    Under a frequency-independent mean-stress model, growth rate is identical across frequencies. Under Frost's peak-strain
    model, growth rate rises with frequency at constant mean stress, and the crossover frequency identifies the physiologically
    relevant band.
  tractability: 4
- gap_id: g_l6mech_007
  question: Is PIEZO1 or PIEZO2 protein present in human growth plate tissue, and in which zones?
  type: search_established
  layer: L6
  why_it_matters: PIEZO1 is the leading candidate physeal mechanotransducer and is already being pursued as a drug target
    for scoliosis, with mouse work showing that local PIEZO1 inhibition slows curve progression. All of that rests on mouse
    conditional knockouts. If PIEZO1 is not expressed in human growth plate chondrocytes, or is expressed in a different zone,
    the therapeutic rationale collapses; the question is answerable with existing archival tissue and costs almost nothing
    relative to what is being built on top of it.
