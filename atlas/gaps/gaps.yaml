  - topol2009
  - guo2009
  - ruscitto2023
  discriminating_experiment: Axin2-CreERT2;R26-tdTomato or TCF/Lef:H2B-GFP reporter mice, zonally imaged, crossed onto (i)
    a chondrocyte Sox9 hypomorph and (ii) a chondrocyte-restricted Wntless (Wls) deletion that blocks local WNT secretion.
