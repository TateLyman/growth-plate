- gap_id: g_l7fuse_006
  question: Is the absence of apoptosis in the fusing human growth plate a real species or process difference, or an artefact
    of a single specimen?
  type: contradiction
  layer: L7
  why_it_matters: Apoptosis of terminal hypertrophic chondrocytes is the textbook account of how cartilage is cleared during
    endochondral ossification, and it is the account carried into fusion by default. The only direct human test of it at fusion
    is negative. Either the textbook is wrong for the fusion step in humans, or the one available human specimen is unrepresentative.
    Both possibilities have large downstream consequences for how the atlas grades every apoptosis-based rodent result.
  what_is_known: In the one human growth plate reported as about to fuse, there was not a single TUNEL-positive cell, cleaved
    caspase-3 was not detected, and electron microscopy showed no apoptosis or autophagy but did show hypoxia and necrosis;
    unfused plates contained a few TUNEL-positive chondrocytes (emons2009, human). Independently, estrogen-accelerated loss
    of rabbit resting-zone chondrocytes also did not appear to be apoptotic (nilsson2014_2, rabbit). Against this, apoptosis
    of hypertrophic chondrocytes is a well-replicated feature of normal endochondral growth in rodents.
  what_is_missing: Replication in a second human fusing plate, and a positive control demonstrating that the TUNEL assay used
    would have detected apoptosis had it been present in that tissue block. No modern death-modality markers (RIPK3, MLKL,
    GSDMD, LC3/p62) have been applied to any human physeal specimen.
  nearest_evidence:
  - emons2009
  - nilsson2014_2
  discriminating_experiment: 'Model system: staged human physeal specimens (g_l7fuse_002) and rabbit plates at matched stages
    as a fusing-species control, with DNase-treated sections as TUNEL positive controls on the same slides. Readout: TUNEL,
    cleaved caspase-3, RIPK3 and phospho-MLKL, LC3 and p62, and pimonidazole or CAIX as a hypoxia marker, scored zone by zone
    at the bridging front. Expected results - classical apoptosis: caspase-3-positive, TUNEL-positive cells cluster at the
    front. Regulated necrosis: phospho-MLKL positive, caspase-3 negative. Hypoxic death: hypoxia marker positive with no regulated-death
    marker, matching the emons2009 ultrastructure. A finding of apoptosis in the rabbit but not the human would establish
    a genuine species difference at the final step even between two fusing species.'
  tractability: 3
