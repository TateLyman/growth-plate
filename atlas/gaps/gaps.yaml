- gap_id: g_l3rest_004
  question: How much latent TGF-beta is stored per unit volume of human growth plate matrix, and what fraction is liberated
    per physiological loading cycle?
  type: quantitative_gap
  layer: L3
  why_it_matters: The latent matrix store is the only mechanism in this layer by which a mechanical event can be converted
    directly into a growth factor dose without transcription. Human genetics brackets the store in both directions (TGFB1
    latency-domain gain of function causes Camurati-Engelmann disease; LTBP3 loss of function causes brachyolmia with short
    stature), so the store is load-bearing - but with no concentration and no release fraction, it cannot be placed in any
