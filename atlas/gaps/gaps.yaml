  question: Which of the candidate mechanotransducers (PIEZO1, TRPV4, integrin beta-1, primary cilium, YAP/TAZ, FAK) is required
    for the Hueter-Volkmann growth response, as opposed to being required for cartilage homeostasis generally?
  type: known_unknown
