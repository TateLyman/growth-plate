- gap_id: g_l3rest_001
  question: Has BMP pathway ACTIVITY (nuclear phospho-SMAD1/5/8), as opposed to BMP ligand transcript abundance, ever been
    measured zone-by-zone in human growth plate tissue?
  type: search_established
  layer: L3
  why_it_matters: The BMP arm is drawn in every growth plate diagram, but in mouse the ligand gradient and the signalling
    gradient run in OPPOSITE directions across the plate - Bmp2/Bmp6 mRNA peaks in the hypertrophic zone while pSmad1/5/8
    peaks in the proliferative and prehypertrophic zones, apparently because SMAD7 is concentrated in the hypertrophic zone.
    If the human plate inverts differently, or not at all, then every inference about where a BMP-directed therapeutic would
    act is wrong. Transcript-level human atlases cannot resolve this because the discrepancy is post-transcriptional.
  what_is_known: Garrison 2017 performed laser-capture microdissection of six zones of postnatal MOUSE proximal tibia with
    direct mRNA counting for 30 BMP-related genes, plus in situ hybridisation and phospho-SMAD1/5/8 immunohistochemistry,
    establishing the ligand/activity inversion. Retting 2009 established that combined Smad1/Smad5 loss in mouse chondrocytes
    causes severe chondrodysplasia. Human evidence for the BMP arm is confined to germline variant phenotypes (NOG, GDF5,
    LTBP3).
  what_is_missing: No phospho-SMAD1/5/8 immunostaining series, and no zonally resolved BMP/SMAD/antagonist expression panel,
    on human growth plate tissue at any age. Searching human-restricted terms returns reviews, heterotopic ossification and
    osteochondroma work, and mouse studies; nothing reports human physeal zonal BMP activity.
  nearest_evidence:
  - garrison2017
  - retting2009
  - huckert2015
  discriminating_experiment: Formalin-fixed human growth plate from surgical epiphysiodesis or limb-lengthening specimens
    (Tanner-staged donors, distal femur and proximal tibia), stained for phospho-SMAD1/5/8, SMAD7 and total SMAD1, quantified
    by nuclear intensity per zone (RZ/PZ/PHZ/HZ) with the same antibody clones used by Garrison 2017 on mouse controls run
    in parallel. Under the mouse-conserved hypothesis, nuclear pSMAD1/5/8 is highest in PZ/PHZ and falls in HZ with reciprocal
    SMAD7. Under a human-divergent hypothesis, activity tracks ligand and peaks in HZ.
