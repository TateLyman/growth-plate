- gap_id: g_l2stem_003
  question: Does secondary ossification centre formation causally confer stem-cell properties on resting-zone chondrocytes,
    or does it merely coincide in time with an autonomous developmental switch?
  type: search_established
  layer: L2
  why_it_matters: This claim is load-bearing for L7 fusion models, which use it to argue that the epiphyseal niche has a defined
    start and therefore a definable end. It is currently supported only by two temporal correlations in one species, and the
    atlas should not propagate a correlation as a mechanism into a downstream layer.
  what_is_known: Mouse PTHrP-creER colony-forming cells acquire robust in vitro self-renewal between a P9 pulse (3.3% secondary
    colonies, none passageable) and a P12 pulse (16.3%, 12.5% of those passageable nine times), described by the authors as
    coinciding with active SOC development (mizuhashi2018). Independently, clonal tracing shows a switch from progenitor depletion
    to stable monoclonal columns 'coinciding with the formation of the secondary ossification centre' (newton2019). FoxA2+
    long-term stem cells sit at the cartilage/SOC interface (muruganandan2022).
  what_is_missing: Any experiment that perturbs SOC formation and then measures resting-zone stem cell behaviour. A Europe
    PMC search on 2026-08-05 for studies combining SOC ablation, blockade, prevention or delay with resting-zone or self-renewal
    readouts in mice returned zero records.
  nearest_evidence:
  - mizuhashi2018
  - newton2019
  - chan2015
  discriminating_experiment: Delay SOC formation genetically or pharmacologically without disturbing the growth plate - for
    example epiphysis-directed inhibition of cartilage-canal angiogenesis (local VEGF trap or Vegfa deletion restricted to
    epiphyseal chondrocytes) initiated at P4 - then at P12 and P18 assay (i) PTHrP-creER clonal column formation and (ii)
    secondary and serial colony-forming capacity of sorted resting chondrocytes. If SOC formation is causal, delayed SOC animals
    retain the P9-like phenotype (~3% secondary colonies, no serial passage) at P12-P18 and form only short transient columns.
    If the switch is autonomous, they reach the P12-like phenotype (~16% secondary colonies, passageable clones) on the normal
    schedule despite an absent or delayed SOC. A comparative version tests the same prediction across bones whose SOCs appear
    at different times within one animal.
  tractability: 4
  search_log_ref: g_l2stem_003
  nearest_evidence_note: 'mizuhashi2018 and newton2019: temporal coincidence only. chan2015: VEGF blockade shifts skeletal
    progenitor fate from bone to cartilage, showing vascular signals can steer progenitor fate, but never tested on the resting
    zone.'
- gap_id: g_l2stem_004
  question: Are the five published skeletal stem cell schemes - mSSC, PTHrP+/FoxA2+ resting chondrocytes, Grem1+ OCR cells,
    LepR+ stroma and CTSK-lineage periosteal stem cells - distinct cell types, overlapping states of one lineage, or artefacts
    of different assays?
  type: contradiction
  layer: L2
  why_it_matters: Downstream layers need to know which cell to target and which mouse model reports on human biology. The
    schemes disagree on anatomy, adipogenic potential, developmental window and markers, and one immunophenotype (CD200+CD105-Thy-6C3-)
    is used for two anatomically different 'stem cells'. Without reconciliation, any therapeutic inference from this layer
    is arbitrary.
  what_is_known: mSSC is CD45-Ter119-Tie2-AlphaV+Thy-6C3-CD105-CD200+ and excludes fat (chan2015); the periosteal stem cell
    carries the same CD200+CD105-Thy-6C3- phenotype but is Ctsk-lineage and periosteal (debnath2018); Grem1+ OCR cells are
    metaphyseal, non-adipogenic and non-overlapping with Nestin-GFP cells (worthley2015); LepR+ cells are perisinusoidal,
    make adipocytes, contribute nothing to developing cartilage and become the dominant osteoblast source only after adolescence
    (zhou2014, shu2021); PTHrP+ resting chondrocytes are Grem1-negative (mizuhashi2018); the human CD146+ definition includes
    adipogenesis (sacchetti2007, bianco2015) while the hSSC definition excludes it and reports CD146+ cells as poorer colony
    formers (chan2018).
  what_is_missing: A single study that applies all marker panels and all Cre drivers to the same animals at the same ages
    with the same functional assay, so that overlap can be measured rather than inferred across papers.
  nearest_evidence:
  - mizuhashi2018
  discriminating_experiment: 'Multiplexed intersectional fate mapping in one mouse cohort: combine Pthlh-creER, Grem1-creER,
    Lepr-cre, Ctsk-cre and FoxA2-creER with orthogonal recombinases and distinct reporters, plus full mSSC/PSC surface staining,
    sampling at P6, P12, P28 and 12 weeks, and score anatomical position, marker phenotype and clonal output for each labelled
    cell. Under the ''distinct cell types'' model, reporters remain mutually exclusive at all ages and each maps to one compartment.
    Under the ''states of one lineage'' model, early labelled cells convert between reporter identities with age in a directional
    sequence. Under the ''assay artefact'' model, surface phenotype fails to predict clonal output within any single Cre lineage.'
  tractability: 2
  nearest_evidence_note: 'mizuhashi2018 is the only cross-scheme quantification located: it measures overlap between PTHrP+
    resting chondrocytes and the mSSC/pre-BCSP/BCSP tiers and excludes Grem1 co-expression.'
- gap_id: g_l2stem_005
  question: Do human resting zone chondrocytes have a finite, division-denominated proliferative capacity, or can they renew
    indefinitely until fusion terminates them?
  type: search_established
  layer: L2
  why_it_matters: This is the pivot between the two available accounts of why human growth stops. If capacity is finite, adult
    height is set by a spendable budget and interventions that spare divisions raise final height. If capacity is renewable,
    height is set by the timing of the fusion trigger and sparing divisions achieves nothing.
  what_is_known: Rabbit resting zone chondrocytes fall in proliferation rate and number with age (schrier2006), the decline
    is division-dependent rather than age-dependent (baron1994, gafni2001, marino2008), and it is not a cell-autonomous Hayflick
    limit, since cultured rabbit RZ chondrocyte population doublings are independent of donor age (nilsson2005). Mouse clonal
    tracing found progenitors acquiring self-renewal postnatally rather than only spending down a budget (newton2019).
  what_is_missing: Any measurement of proliferative capacity, division history or clone size in human growth plate tissue.
    A Europe PMC search on 2026-08-05 combining human, growth plate/resting zone and clonal/self-renewal/proliferative-capacity
    terms returned 213 records of which none was a primary human measurement of resting-zone proliferative or clonal capacity.
  nearest_evidence:
  - avijgan2025
  - nilsson2005
  - schrier2006
  discriminating_experiment: 'Paired-age human growth plate biopsies (early puberty vs late puberty, e.g. from epiphysiodesis
    series) assayed two ways: (i) division-history reconstruction by somatic mutation burden or by methylation-clock-based
    division counters in sorted resting-zone cells; (ii) ex vivo serial colony formation of sorted resting-zone cells. Under
    finite capacity, late-pubertal cells show higher accumulated division counts and markedly fewer serial colonies than early-pubertal
    cells from the same anatomical site. Under renewable capacity, serial colony output is preserved across pubertal stage
    and division counts plateau.'
  tractability: 3
  search_log_ref: g_l2stem_005
  nearest_evidence_note: 'avijgan2025: human resting cells can exit G0 ex vivo under defined conditions - the closest existing
    functional readout on human tissue. nilsson2005 and schrier2006: rabbit population-level measurements.'
- gap_id: g_l2stem_006
  question: Is resting zone stem cell depletion a cause of epiphyseal fusion or a consequence of it?
  type: known_unknown
  layer: L2
  why_it_matters: L7 depends on the answer. If depletion causes fusion, the therapeutic target is progenitor conservation.
    If fusion is imposed by an oestrogen-driven programme on a plate that still has capacity, the target is the trigger, and
    every attempt to raise adult height by sparing progenitors is misdirected.
  what_is_known: 'Rabbit resting-zone cells decline numerically and functionally with age (schrier2006) and the field''s canonical
    model states depletion then fusion (nilsson2004). Against a simple causal chain: rodents senesce almost to cessation but
    never fuse (emons2011_2), so depletion is not sufficient for fusion; and oestrogen accelerates senescence while slowing
    resting-zone proliferation (schrier2006), the opposite of a pure consumption model.'
  what_is_missing: A measurement of resting zone cell number and proliferative capacity at the moment of fusion, compared
    between plates fusing early and late, in a species that fuses.
  nearest_evidence:
  - schrier2006
  - emons2011_2
  discriminating_experiment: In rabbits, induce early fusion with exogenous oestradiol and delay fusion with an aromatase
    inhibitor, then at the histological moment of bony bridging in each group measure resting zone cell number per unit area,
    BrdU labelling index, and ex vivo serial colony capacity, against untreated animals at their own fusion point. If depletion
    causes fusion, all groups fuse at the same low resting-cell number and colony capacity regardless of chronological age.
    If fusion is imposed, oestradiol-treated plates fuse while retaining significantly higher resting cell number and colony
    capacity than controls.
  tractability: 4
  nearest_evidence_note: 'schrier2006: age- and treatment-dependent rabbit resting-zone depletion. emons2011_2: the rodents-senesce-without-fusing
    argument.'
- gap_id: g_l2stem_007
  question: Does telomere length shorten, or telomerase activity fall, in human growth plate chondrocytes with age or with
    proximity to fusion?
  type: search_established
  layer: L2
  why_it_matters: Telomere attrition is the mechanism most often asserted in reviews for the growth plate's finite proliferative
    capacity. If it is unmeasured in humans, the atlas must carry the claim as grade X rather than as mechanism, and downstream
    reasoning about senolytics or telomerase manipulation in growth disorders has no foundation.
  what_is_known: Mouse mTert-GFP marks a transitional skeletal progenitor population whose expression peaks during adolescent
