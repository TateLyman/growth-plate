    hypertrophic chondrocytes and metaphyseal osteoblasts from the same specimen for both transcriptome and mitochondrial
    or nuclear somatic variants, then test whether osteoblast clones share variants with hypertrophic chondrocytes from the
    overlying plate. Expected under the mouse-like model: a majority of metaphyseal osteoblast clones share chondrocyte-private
    variants. Expected under a perichondrial-origin model: osteoblast clones share variants with periosteal or LepR-equivalent
