- gap_id: g_l3rest_008
  question: Is core planar cell polarity protein asymmetry (VANGL2, PRICKLE, FZD) detectable in human growth plate chondrocytes,
    and does its orientation predict column direction?
  type: known_unknown
  layer: L3
  why_it_matters: Columnar organisation is the architectural feature by which the growth plate converts proliferation into
    unidirectional elongation, and in mouse it is a PCP process rather than a proliferation process. Human growth plates are
    described morphologically as columnar, but the mechanism has never been shown to be the same. If human columns are built
    differently, disorganisation-based dysplasias would need a different explanation.
