    antagonists.
  nearest_evidence:
  - minina2001
  - thakore2026
  discriminating_experiment: 'Mouse metatarsal explant culture with a two-factor dose matrix of a BMP type I receptor inhibitor
    (LDN-193189, 5 log-spaced doses) crossed with a smoothened antagonist (vismodegib, 5 doses), reading proliferative column
    length, Col10a1 domain length and total elongation over 6 days, and fitting a response surface. Prediction under additive
    parallel arms: no interaction term. Prediction under the Minina serial model in which BMP acts through Ihh: strong negative
