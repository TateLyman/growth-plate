- gap_id: g_l7fuse_007
  question: What fraction of the error in predicted adult height is attributable to bone age reading error, what fraction
    to reference-standard displacement, and what fraction to irreducible biological variance in remaining growth at a given
    skeletal maturity?
  type: quantitative_gap
  layer: L7
  why_it_matters: Every clinical and pharmacological decision in growth medicine is powered against predicted adult height,
    and every trial of a growth-promoting agent is judged against a prediction whose error structure has never been decomposed.
    If most of the error is biological, better bone age reading - including perfect automated reading - cannot improve prediction,
    and trials need larger n rather than better imaging. If most of the error is measurement, automation should already have
    improved prediction, which has not been demonstrated.
  what_is_known: Total 95% prediction intervals are plus or minus 6-8 cm in mid-childhood, narrowing to plus or minus 3-4
    cm in postmenarcheal girls and to plus or minus 4 cm in boys when the previous year's height increment is known (tanner1975,
    tanner1983). Manual bone age has interobserver spread of 0.74-0.96 years and intra-observer 95% limits spanning about
    3-5 years of range (king1994, bull1999), while automated reading has a repeat-measurement SD of 0.17 years (thodberg2009).
    Critically, a model that omits skeletal age entirely (Khamis-Roche) has errors only slightly larger than the model that
    uses it (khamis1994) - the single strongest hint that the bone age contribution to prediction accuracy is small. Systematic
    reference-standard displacement is 2.9 months in one modern US cohort and -2.2 months in an Australian one, with 95% limits
    of agreement around 2 years (guevel2026, paxton2013).
  what_is_missing: No published variance decomposition. The Khamis-Roche comparison is reported qualitatively ("only slightly
    larger") without the numeric error difference, and no study has repeated a prediction on the same child using (a) two
    independent manual readings, (b) an automated reading, and (c) no bone age at all, against observed adult height.
  nearest_evidence:
  - khamis1994
  - tanner1983
  - thodberg2009
  - guevel2026
  discriminating_experiment: 'Model system: an existing longitudinal cohort with serial hand radiographs and measured adult
    height (for example the Fels, Zurich or GrowUp Gothenburg series), re-read prospectively. Readout: for each child, adult
    height predicted by (i) two independent manual GP readings, (ii) two independent manual TW3-RUS readings, (iii) BoneXpert,
    and (iv) Khamis-Roche with no skeletal age; fit a variance-components model partitioning prediction residual into reader,
    method, reference-displacement and residual biological terms. Expected results - measurement-dominated: replacing manual
    with automated bone age materially narrows the 95% prediction interval and the reader variance component is the largest
    term. Biology-dominated: the automated and no-bone-age predictions have indistinguishable intervals and the residual biological
    term exceeds 80% of total variance, in which case bone age precision is not the rate-limiting step in growth medicine.'
  tractability: 4
  search_log_ref: null
- gap_id: g_l7fuse_008
  question: What is the pooled inter-rater and intra-rater error of Greulich-Pyle and Tanner-Whitehouse bone age, in years
    with a confidence interval, across contemporary multi-ethnic populations?
  type: quantitative_gap
  layer: L7
  why_it_matters: Bone age error is quoted throughout paediatric endocrinology, orthopaedics and forensic age estimation as
    "about a year", but the number is assembled from small single-centre audits from the 1990s with three or fewer readers,
    in populations that do not resemble those in which the method is now used - including forensic determinations of legal
    majority where the consequence of error is a custody decision.
  what_is_known: Interobserver spread 0.96 years (GP) and 0.74 years (TW2) from 3 registrars reading 50 films (king1994).
    Intra-observer 95% limits of agreement -2.46 to +2.18 years (GP) and -1.41 to +1.43 years (TW2) from 362 consecutive clinical
    radiographs (bull1999). Modern trained-reader ICC exceeds 0.9 for both methods across 1725 radiographs and 12 readers,
    but ICC is not an error in years and inflates with a wide age range; the reported mean absolute GP-versus-TW3-RUS difference
    of 2.5-3.3 months widens above 180 months of age (tewattanarat2026). Automated precision is SD 0.17 years (thodberg2009).
