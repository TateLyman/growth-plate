- gap_id: g_l7fuse_005
  question: Has DNA methylation or any other epigenetic mark ever been measured in human growth plate chondrocytes as a function
    of age, pubertal stage or fusion status?
  type: search_established
  layer: L7
  why_it_matters: The epigenetic drift model is the only proposed mechanism that explains why growth plate senescence tracks
    replication count rather than chronological time, and why different bones in the same endocrine environment senesce on
    different schedules. It is also the only mechanism for which a decisive assay already exists off the shelf. If the human
    growth plate methylome has never been measured, the model is not weakly supported - it is untested.
  what_is_known: Growth plate senescence in rodents is a coordinated molecular programme with bone-size-dependent timing and
    modulation of IGF, BMP and WNT signalling (lui2018, mouse and rat). Delaying proliferation with dexamethasone delays senescence
    and fusion in rabbits, implying a replication-counted clock (gafni2001, rabbit). Epigenetic clocks are established for
    many human tissues but have not been reported for physeal cartilage.
  what_is_missing: A Europe PMC search combining growth plate or epiphyseal plate, DNA methylation or methylome, human, chondrocyte
    or cartilage, and puberty or bone age or epiphyseal fusion returned 99 records; screening the top-ranked 20 found no primary
    study measuring methylation in human growth plate cartilage at any age. A broader query without the human and cartilage
    constraints returned 441 records dominated by osteoarthritis, bone marrow stromal cells and general skeletal ageing, again
    with no growth plate methylome.
