edges:
  - edge_id: e00001
    source: hueter_volkmann_law
    target: mechanical_modulation_growth
    relation: required_for
    sign: "+"
    magnitude: "17.1% growth change per 0.1 MPa (range 9.2-23.9), 8-day sustained loading"
    context: "rat, rabbit and calf caudal vertebrae and proximal tibiae, immature animals"
    evidence_tier: T1
    refs: [stokes2006]
    confidence: C
    notes: "The law is the quantitative statement of the process node; no human coefficient exists."

  - edge_id: e00002
    source: mechanical_modulation_growth
    target: loading_effect_plate_height
    relation: precedes
    sign: "-"
    magnitude: "hypertrophic zone height 87%, mean cell height 85%, cell height increment 78% of control under compression"
    context: "rat caudal vertebra, 4 weeks at ~60% body weight"
    evidence_tier: T1
    refs: [stokes2002, stokes2007]
    confidence: C
    notes: "Compression alters zonal structure; distraction at the same magnitude does not."

  - edge_id: e00003
    source: static_vs_dynamic_loading
    target: loading_effect_plate_height
    relation: correlates_with
    sign: biphasic
    magnitude: "static and dynamic each reduced growth 19%, but only static reduced plate thickness, proliferative cells/column and hypertrophic cell height"
    context: "rat caudal vertebra Cd7, 0.2 MPa mean, 0.1 Hz, 2 weeks"
    evidence_tier: T1
    refs: [valteau2011]
    confidence: C
    notes: "Waveform dissociates growth suppression from tissue damage."

  - edge_id: e00004
    source: strain_rate_dependence
    target: static_vs_dynamic_loading
    relation: required_for
    sign: "+"
    magnitude: "static loading gave higher lateral (p<0.001) and volumetric (p<=0.015) hypertrophic cell strain at equal mean stress and equal axial strain"
    context: "pre-pubertal rat proximal tibial growth plate explants, stress-controlled"
    evidence_tier: T1
    refs: [zimmermann2017]
    confidence: C
    notes: "Viscoelastic creep is the mechanism that makes the static/dynamic distinction exist."

  - edge_id: e00005
    source: strain_magnitude_dependence
    target: mechanical_modulation_growth
    relation: correlates_with
    sign: "-"
    magnitude: "linear over approximately 0.02-0.2 MPa; slope 17.1%/0.1 MPa"
    context: "rat, rabbit, calf; two anatomical sites"
    evidence_tier: T1
    refs: [stokes2006]
    confidence: C

  - edge_id: e00006
    source: strain_frequency_dependence
    target: mechanical_modulation_growth
    relation: correlates_with
    sign: unknown
    magnitude: "0.1 and 1.0 Hz both reduced growth without histological change; 1.0 Hz with +/-0.14 MPa destroyed the plate"
    context: "rat caudal vertebrae, 0.2 MPa mean, 15 days"
    evidence_tier: T1
    refs: [mnard2014]
    confidence: D
    notes: "Frequency and amplitude interact non-additively; sign of the frequency main effect is not established."

  - edge_id: e00007
    source: wolff_law
    target: static_vs_dynamic_loading
    relation: hypothesized_link
    sign: "+"
    magnitude: "Frost predicts intermittent loading drives cartilage growth and static loading suppresses it"
    context: "theoretical, cartilage; thresholds quoted for bone only"
    evidence_tier: T5
    refs: [frost1979, frost2001]
    confidence: speculative
    gap_id: g_l6mech_004
    notes: "Partly supported (tissue preservation) and partly contradicted (equal growth suppression at matched mean stress) by valteau2011."

  - edge_id: e00008
    source: primary_cilium_mechanosensing
    target: mechanical_modulation_growth
    relation: required_for
    sign: "+"
    magnitude: "Ift88 deletion disrupted ossification only beneath load-bearing compartments; immobilisation abolished the phenotype"
    context: "mouse proximal tibia, AggrecanCreERT2;Ift88fl/fl, adolescent"
    evidence_tier: T1
    refs: [coveney2022]
    confidence: C
    notes: "The only candidate transducer with a complete load-plus-genetics-plus-unloading design."

  - edge_id: e00009
    source: piezo1_channel
    target: primary_cilium_mechanosensing
    relation: binds
    sign: "+"
    magnitude: "PIEZO1 colocalises with acetylated alpha-tubulin+ cilia; IFT88 knockdown feedback-upregulates PIEZO1 under stress"
    context: "mouse growth plate chondrocytes, 100 kPa in vitro / 10 kPa caudal compression in vivo"
    evidence_tier: T1
    refs: [chen2025]
    confidence: D
    notes: "Colocalisation and epistasis, not a demonstrated physical interaction."

  - edge_id: e00010
    source: piezo1_channel
    target: mechanical_modulation_growth
    relation: required_for
    sign: "-"
    magnitude: "compression upregulates PIEZO1, driving GPX4 loss and ferroptosis; Col2a1-CreERT deletion slowed scoliosis"
    context: "mouse vertebral growth plate chondrocytes"
    evidence_tier: T1
    refs: [chen2025a, brylka2024]
    confidence: C
    notes: "Readout is ossification and deformity progression, not growth rate; see g_l6mech_008."

  - edge_id: e00011
    source: trpv4_channel
    target: mechanical_modulation_growth
    relation: required_for
    sign: "+"
