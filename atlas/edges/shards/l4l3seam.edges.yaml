# L4 (endocrine_and_systemic) -> L3 (signaling_networks) / L1 / L2 seam.
# Every edge below is anchored to a primary study that measured the stated relation.
# Where a plausible endocrine->pathway link could NOT be found in the literature it is
# written as a gap in l4l3seam.gaps.yaml, not as an edge.
edges:

  # =====================================================================
  # A. GH / GHR / JAK2 / STAT5B / SOCS2 onto the plate
  # =====================================================================
  - edge_id: e00001
    source: gh_receptor
    target: chondrocyte_proliferation_rate
    relation: required_for
    sign: "+"
    magnitude: "tibial linear growth rate reduced ~65% in Ghr-null vs ~35% in Igf1-null between P20 and P40; chondrocyte proliferation and chondrocyte number significantly reduced in Ghr-null only"
    context: "mouse, proximal tibial growth plate, proliferative zone, postnatal days 20-40 (peak GH effect); sex not stated"
    timescale: weeks
    evidence_tier: T1
    refs: [wang2004, sims2000]
    confidence: B
    notes: "The Ghr-null/Igf1-null contrast is the cleanest available separation of GH-dependent from IGF-1-dependent chondrocyte proliferation: proliferation is normal in Igf1-null but reduced in Ghr-null."

  - edge_id: e00002
    source: gh_receptor
    target: resting_zone
    relation: required_for
    sign: "+"
    magnitude: "germinal (resting) zone hypoplastic in Ghr-null mice; the same zone is ENLARGED in Igf1-null mice"
    context: "mouse, proximal tibial growth plate, resting/germinal zone, postnatal days 20-40"
    timescale: weeks
    evidence_tier: T1
    refs: [wang2004]
    confidence: C
    notes: "Opposite-direction phenotypes in Ghr-null and Igf1-null germinal zones are the strongest single argument that GH acts on the resting zone by an IGF-1-independent route."

  - edge_id: e00003
    source: growth_hormone
    target: label_retaining_chondrocyte
    relation: activates
    sign: "+"
    magnitude: "labelled-cell ratio (GH leg / contralateral control leg) 1.95 +/- 0.13 after 12 d local intratibial GH (1 ug/day) with continuous [3H]thymidine"
    context: "hypophysectomised rat, proximal tibial germinal (resting) zone, local unilateral infusion; contralateral leg internal control"
    timescale: days
    evidence_tier: T1
    refs: [ohlsson1992, chu2025]
    confidence: C
    notes: "Chu 2025 reaches the opposite net effect on pool size in mouse (GH DEPLETES the slow-cycling pool by driving committed division) while agreeing that GH acts directly on these cells; the two are reconcilable if GH drives their division rather than their self-renewal."

  - edge_id: e00004
    source: igf1_local_growth_plate
    target: label_retaining_chondrocyte
    relation: correlates_with
    sign: unknown
    magnitude: "NULL RESULT: labelled-cell ratio 0.96 +/- 0.04 after 12 d local intratibial IGF-I (10 ug/day) - no stimulation of the slowly cycling germinal cells, versus 1.95 +/- 0.13 for GH in the same experiment"
    context: "hypophysectomised rat, proximal tibial germinal/resting zone, local unilateral infusion"
    timescale: days
    evidence_tier: T1
    refs: [ohlsson1992]
    confidence: C
    notes: "This is a scientific null and is the discriminating datum for the dual effector hypothesis: IGF-I acts only on the proliferation of chondrocytes already recruited out of the germinal layer."

