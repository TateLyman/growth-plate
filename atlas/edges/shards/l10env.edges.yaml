    sign: "+"
    magnitude: "IGF-I/IGFBP-3 ratio rose 13% (P<0.0001), i.e. IGF-I rose proportionally more than IGFBP-3"
    context: "human, prepubertal boys, 7-day skimmed milk intervention"
    evidence_tier: T1
    refs: [hoppe2004]
    confidence: B
    notes: "The rise in free IGF-I index is the physiologically relevant quantity; see L4 igf_ternary_complex."

