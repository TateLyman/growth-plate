edges:
  # ---------------- nutrition -> GH/IGF axis (L4) ----------------
  - edge_id: e00001
    source: protein_intake_growth
    target: igf1_systemic
    relation: activates
    sign: "+"
    magnitude: "+19% serum IGF-I in 7 days from 1.5 L/day skimmed milk; 0% from an isonitrogenous meat load"
    context: "human, healthy prepubertal boys aged 8 y, n=24, free-living diet, 7-day randomised intervention"
    evidence_tier: T1
    refs: [hoppe2004]
    confidence: A
    notes: "Protein source, not protein quantity, is the operative variable: intake rose 61% (milk) and 54% (meat)."

  - edge_id: e00002
    source: milk_consumption_height
    target: igf1_systemic
    relation: activates
    sign: "+"
    magnitude: "+15% serum IGF-1 from the casein fraction of 1.5 L skim milk; whey gave no IGF-1 change"
    context: "human, 57 boys aged 8 y, 2x2 factorial (whey/casein x high/low milk mineral), 7 days"
    evidence_tier: T1
    refs: [hoppe2009, hoppe2004]
    confidence: A

  - edge_id: e00003
    source: milk_consumption_height
    target: insulin_hormone
    relation: activates
    sign: "+"
    magnitude: "+21% fasting insulin from the whey fraction (P=0.006), with no change in IGF-1"
    context: "human, 57 boys aged 8 y, same 2x2 factorial trial"
    evidence_tier: T1
    refs: [hoppe2009]
    confidence: A
    notes: "Separates the insulinotropic from the somatotropic action of milk; the two fractions dissociate cleanly."

  - edge_id: e00004
    source: milk_consumption_height
    target: igfbp3
