  target: resting_zone_niche
  relation: required_for
  sign: '+'
  magnitude: >-
    the niche is defined by position within the zone: PTHrP-expressing chondrocytes occupy the
    resting zone specifically, and the zone provides the WNT-inhibitory microenvironment in which
    those cells stay undifferentiated. Removing the zone removes the niche by construction, and
    resting zone transplantation experiments show the zone induces columnar organisation in the
    tissue beneath it
  context: mouse distal femur and proximal tibia, postnatal, both sexes; resting zone
  timescale: >-
