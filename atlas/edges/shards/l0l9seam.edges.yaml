  - hallett2021
  - newton2019
  confidence: C
  notes: >-
    L1 -> L2 had zero edges before this. The architectural zone and the stem-cell niche are
    deliberately separate nodes - one is a histological compartment, the other a functional claim
    about the cells in it - and the dependency between them was never written down.

