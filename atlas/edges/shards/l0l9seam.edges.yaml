edges:

# ===================================================================
# SEAM A - L0 developmental origin -> L2 stem and progenitor biology
# ===================================================================

- edge_id: e00001
  source: secondary_ossification_center
  target: soc_formation_triggers_stemness
  relation: hypothesized_link
  sign: '+'
  magnitude: >-
    temporal coincidence only: PTHrP-creER resting chondrocytes go from 3.3% secondary
    colony-forming (17/518, none passageable) at a P9 pulse to robust self-renewal at a P12 pulse,
    spanning the days in which the murine SOC forms. No experiment has advanced, delayed or
    ablated SOC formation and measured the clonal consequence
  context: >-
    mouse proximal tibia and distal femur, P9-P12, sex not stated; resting zone. The human SOC of
    the distal femur is already present in 100% of fetuses after 35 weeks gestation, so the mouse
    temporal window has no human counterpart and the coincidence argument does not transfer
  timescale: days (mouse P9 to P12); prenatal in humans
  evidence_tier: T1
  refs:
  - mizuhashi2018
  - newton2019
  - funaki2020
  confidence: speculative
  gap_id: g_l2stem_003
  notes: >-
    Written as hypothesized_link deliberately. This is the load-bearing claim of the L2 stem-cell
    story and it currently rests on two mouse studies that report a correlation in time and
    nothing else. The species mismatch makes it worse rather than better: in humans the SOC forms
    before birth while the resting zone continues to function for another fifteen years.

- edge_id: e00002
  source: vascular_invasion_poc
  target: stem_cell_niche_vascular_coupling
  relation: required_for
  sign: '+'
  magnitude: >-
    Osterix-expressing osteoprogenitors migrate INTO the cartilage template along the invading
    vessels and become trabecular osteoblasts, whereas mature osteoblasts do not migrate; type H
    (CD31-high, endomucin-high) capillaries in the metaphysis are surrounded by osteoprogenitors
    and decline with age in parallel with bone formation
  context: >-
    mouse embryonic and postnatal long bone, both sexes; primary ossification centre and
    metaphysis. Not demonstrated in human tissue
  timescale: hours to days for progenitor co-migration with the vascular front
  evidence_tier: T1
  refs:
  - maes2010
  - kusumbe2014
  confidence: C
  notes: >-
    The first vascular invasion event is what installs the progenitor-carrying vasculature the
    later niche depends on; the coupling node itself is metaphyseal and postnatal, so this edge is
    the developmental antecedent rather than a restatement of it.

- edge_id: e00003
  source: endochondral_ossification
  target: chondrocyte_to_osteoblast_transdifferentiation
  relation: required_for
  sign: '+'
  magnitude: >-
    Col10a1- and Aggrecan-creER lineage tracing shows hypertrophic chondrocytes survive the
    chondro-osseous junction and become osteoblasts and osteocytes in the primary spongiosa during
    development, postnatal growth and fracture repair, so a fraction of trabecular bone is
    chondrocyte-derived rather than derived from perichondrial osteoprogenitors
  context: mouse long bone, embryonic through postnatal, both sexes; hypertrophic zone and primary spongiosa
  timescale: days (label appears in metaphyseal osteoblasts within ~3-7 days of a hypertrophic-zone pulse)
  evidence_tier: T1
  refs:
  - yang2014
  - zhou2014a
  confidence: C
  notes: >-
    Two independent groups reaching the same conclusion with different Cre drivers in the same
    year. Still mouse-only: no human lineage tracing exists (see lineage_tracing_limitations), so
    the human fraction of chondrocyte-derived osteoblasts is unknown.

- edge_id: e00004
  source: mesenchymal_condensation
  target: clonal_exhaustion
  relation: hypothesized_link
  sign: '+'
  magnitude: >-
    unmeasured. Fgfr3-creER pulsed at the condensation stage marks descendants that stay dorsally
    restricted in the resting and proliferative zones for the life of the plate, establishing that
    condensation-stage partitioning IS inherited; whether founder NUMBER sets the total division
    budget has never been measured in any species
  context: >-
    mouse limb bud condensation to postnatal growth plate, both sexes; whole element. The
    quantitative link asserted here has no measurement in mouse or human
  timescale: >-
    the full growth period - embryonic condensation to fusion, i.e. weeks in mouse and ~15-18
    years in human
  evidence_tier: T1
  refs:
  - lui2018
  - gafni2001
  - mizuhashi2018
  confidence: speculative
  gap_id: g_l0l9_008
  notes: >-
    This is the embryonic initial condition the finite-proliferative-capacity model needs and does
    not have. Recorded as hypothesized_link rather than omitted because the two halves of the
    claim are each demonstrated separately and only their product is missing.

# =====================================================================
# SEAM B - L9 organism-level readouts constraining L1/L2/L4 mechanism
# =====================================================================

- edge_id: e00005
  source: growth_velocity_curve
  target: hypertrophic_volume_increase
  relation: hypothesized_link
  sign: '+'
  magnitude: >-
    the arithmetic that must close and never has: organism peak height velocity is 9.61 cm/yr at
    12.46 y in boys and 8.32 cm/yr at 10.99 y in girls, and under the Hunziker formulation plate
    elongation equals chondrocyte production rate multiplied by terminal hypertrophic cell height.
    No published calculation multiplies HUMAN column density by HUMAN production rate by HUMAN
    terminal cell height and compares the product to measured human height velocity
  context: >-
    human, both sexes, puberty (organism side) versus rat and pig hypertrophic zone (cellular
    side); the species and the scale both change across this edge
  timescale: >-
    cm/yr at the organism against um/day at the cell - a 10^4 gap in the time unit, which is why
    the join has never been made
  evidence_tier: T1
  refs:
  - chun2024
  - galvo2025
  - hunziker1987
  - hunziker1989
  confidence: speculative
  gap_id: g_l9organism_001
  notes: >-
    Distinct from e00001 in the canonical set (growth_velocity_curve -> growth_velocity_longitudinal),
    which is the summation across plates. This edge is the cell-kinetic decomposition WITHIN a
    plate, and it is the one the atlas exists to test.

- edge_id: e00006
  source: canalization_growth
  target: neuroendocrine_catchup_hypothesis
  relation: correlates_with
  sign: unknown
  magnitude: >-
    a null that discriminates: 83-90% of catch-up episodes are fitted by a monomolecular function,
    the rate constant k differs by diagnosis (higher in coeliac disease than in either juvenile
    hypothyroidism or GH deficiency), but GH DOSE has no significant effect on k. The deficit, not
    the systemic drive, sets the catch-up rate
  context: human, prepubertal, both sexes, treated coeliac disease vs juvenile hypothyroidism vs GH deficiency
  timescale: >-
    k is expressed in reciprocal years; catch-up episodes run over 1-3 years and infant
    realignment onto the parental channel completes by about 2 years
  evidence_tier: T1
  refs:
  - wit2021
  - smith1976
  confidence: B
  notes: >-
    The existing canonical edge canalization_growth -> delayed_senescence_hypothesis records the
    hypothesis this result SUPPORTS; this edge records the one it constrains. A neuroendocrine
    sizostat that senses the deficit and drives the endocrine axis harder predicts that raising GH
    dose raises k. It does not.

- edge_id: e00007
  source: canalization_growth
  target: clonal_exhaustion
  relation: hypothesized_link
  sign: '+'
  magnitude: >-
    unmeasured in either direction. Catch-up in rabbit is accompanied by DELAYED growth plate
    senescence (capacity apparently conserved), while the finite-capacity model as usually stated
    implies catch-up spends capacity. No cohort has been followed from a resolved growth insult to
    attained adult height and physeal closure with both endpoints measured
  context: >-
    human prepubertal catch-up (wit2021, smith1976) against rabbit growth-restriction catch-up
    (gafni2001); no human plate-level capacity readout exists at any age
  timescale: catch-up over 1-3 years; the cost, if any, would be paid 5-15 years later at fusion
  evidence_tier: T1
  refs:
  - wit2021
  - gafni2001
  - nilsson2004
  confidence: speculative
  gap_id: g_l0l9_010
  notes: >-
    This is the edge that decides whether L12's growth-promoting endpoints are honest. Every
    near-adult-height trial assumes catch-up is free.

- edge_id: e00008
  source: dental_development_clock
  target: growth_hormone
  relation: correlates_with
  sign: unknown
  magnitude: >-
    a dissociation of 1.68 years: in untreated isolated GH deficiency, bone age is delayed by 1.99
    years but dental age by only 0.31 years, and the extent of dental delay does not correlate
    with the extent of bone age delay. Independently, age at 90% dental maturity shows no
    significant correlation with peak height velocity
  context: >-
    human children with untreated isolated GH deficiency, both sexes (torliskawalkow2026); human
    mixed-sex maturity series (demirjian1985)
  timescale: >-
    years - both clocks are read in years of maturational age, which is what makes the 1.68-year
    dissociation interpretable
  evidence_tier: T1
  refs:
  - torliskawalkow2026
  - demirjian1985
  confidence: B
  notes: >-
    An organism-level readout that bounds where GH acts. Dental development is a maturational
    clock that runs largely independently of the GH axis, so any model in which GH sets a global
    somatic maturation rate is falsified. It also supplies the control the bone-age literature
    lacks: a second, GH-insensitive maturity clock in the same child.

- edge_id: e00009
  source: brain_growth_trajectory
  target: pubertal_growth_spurt
  relation: correlates_with
  sign: unknown
  magnitude: >-
    zero of the brain tissue classes show an adolescent volume spurt. Peak grey matter volume
    occurs at 5.9 years and peak white matter volume at 28.7 years, with peak total cerebrum
    volume at 12.5 years, against peak height velocity at 12.46 years (boys) and 10.99 years
    (girls). The organ that consumes the largest share of childhood energy does not participate in
    the pubertal spurt
  context: >-
    human, both sexes, birth to old age; brain MRI normative modelling of >100,000 scans
    (bethlehem2022) against SITAR height velocity cohorts (chun2024)
  timescale: >-
    years; the brain trajectory peaks are separated from peak height velocity by 6.6 years (grey
    matter) and 16 years (white matter)
  evidence_tier: T1
  refs:
  - bethlehem2022
  - chun2024
  confidence: A
  notes: >-
    Constrains L4: whatever produces the pubertal height spurt is a skeletal-tissue-specific
    signal, not a general anabolic or maturational drive, because the brain sees the same hormonal
    environment and does not spurt. Total cerebrum volume peaking at 12.5 y is a passive
    consequence of white matter still accruing, not a spurt.

- edge_id: e00010
  source: muscle_bone_mechanical_coupling
  target: appositional_growth
  relation: correlates_with
  sign: '+'
  magnitude: >-
    peak lean mass velocity leads peak total-body bone mineral content velocity by 0.36 years in
    girls and 0.51 years in boys (0.71/0.63 y at the arms, 0.22/0.48 y at the legs), and peak lean
    mass velocity explains 50% of the variance in peak BMC velocity; peak HEIGHT velocity shows no
    independent association with peak BMC velocity once lean mass is accounted for
  context: human adolescents, both sexes, pubertal growth spurt; whole body and limb-segment DXA
  timescale: months to years - the lead time is 0.22-0.71 years depending on site and sex
  evidence_tier: T1
  refs:
  - rauch2004
  confidence: B
  notes: >-
    Directs the muscle-bone coupling to the periosteal/appositional compartment rather than to the
    physis: bone MASS accrual follows muscle force with a measurable lag, while longitudinal
    growth velocity contributes nothing independent. This is an organism-level argument that
    mechanical loading acts on the bone envelope, not on plate elongation.

# ============================================================
# SEAM C - L10 environment -> L3 local pathway
# ============================================================

- edge_id: e00011
  source: energy_availability_growth
  target: klotho_beta_cofactor
  relation: activates
  sign: '+'
  magnitude: >-
    four weeks of food restriction in wild-type mice raises LEPROT and LEPROTL1 mRNA in the tibial
    growth plate as well as the liver; Fgf21-knockout mice show no such induction, and giving
    rhFGF21 back to food-restricted Fgf21-null mice restores it. The receptor complex is present:
    Klb, Fgfr1 and Fgfr3 mRNA are all detected in fetal and 3-week-old mouse growth plate
    chondrocytes
  context: >-
    mouse, 3 weeks to adult, sex not stated; tibial growth plate and primary growth plate
    chondrocyte culture. Not shown in human tissue
  timescale: weeks - the in vivo induction requires 4 weeks of restriction
  evidence_tier: T1
  refs:
  - wu2013
  - wu2012
  confidence: C
  notes: >-
    The only DEMONSTRATED molecular entry point from the environment layer into a local signalling
    node that does not route through GH or IGF-1 systemically. It is included because the
    knockout-plus-rescue design is genuinely causal, and graded C rather than higher because both
    papers come from a single laboratory and the tissue is mouse.

- edge_id: e00012
  source: energy_availability_growth
  target: fgfr1_receptor
  relation: activates
  sign: '+'
  magnitude: >-
    siRNA epistasis places the effect on FGFR1: knocking down FGFR1 (or ERK1) in cultured mouse
    growth plate chondrocytes abolishes every FGF21 action - the fall in thymidine incorporation
    and Col10a1, the block on GH-stimulated proliferation, the reduction in 125I-GH binding, and
    the induction of LEPROT/LEPROTL1
  context: cultured mouse growth plate chondrocytes, fetal and 3-week-old; rhFGF21 5-10 ug/ml
  timescale: hours to days in culture
  evidence_tier: T1
  refs:
  - wu2012
  - wu2013
  confidence: D
  notes: >-
    Names the receptor arm rather than restating e00011. Graded D and not higher because the
    concentrations required (5-10 ug/ml) are orders of magnitude above human circulating FGF21
    even in starvation, so the receptor assignment is secure but its physiological relevance is
    not.

- edge_id: e00013
  source: stunting
  target: klotho_beta_cofactor
  relation: hypothesized_link
  sign: '+'
  magnitude: >-
    untested in humans. The mouse mechanism requires FGF21 at 5-10 ug/ml to inhibit chondrocytes,
    which is far above human circulating FGF21 even in starvation, and KLB has never been detected
    in human physeal cartilage. No study has measured FGF21 alongside height velocity in
    undernourished children
  context: >-
    human stunted children (the exposure) against mouse growth plate chondrocytes (the only place
    the mechanism has been shown); no human physeal tissue has been examined
  timescale: >-
    stunting accumulates over months to years; the murine mechanism operates over 4 weeks of
    restriction
  evidence_tier: T1
  refs:
  - wu2013
  - htet2026
  - madigan2026
  confidence: speculative
  gap_id: g_l0l9_009
  notes: >-
    Recorded as hypothesized_link, not as an edge with a sign one could act on. The human stunting
    literature attributes growth failure entirely to the GH/IGF-1 axis; this is the competing
    route and it has never been looked for in a child.

# ==========================================================================
# SEAM D - L13 method constraints on what the other layers may claim
# ==========================================================================

- edge_id: e00014
  source: human_growth_plate_tissue_scarcity
  target: epiphyseal_fusion
  relation: required_for
  sign: unknown
  magnitude: >-
    exactly TWO human growth plates have ever been examined histologically while physiological
    fusion was in progress - one distal tibia undergoing physiological epiphysiodesis studied by
    stereological histomorphometry (white2008, n=1) and one fusing plate within an apoptosis and
    electron-microscopy series (emons2009, n=1) - out of 30 catalogued human growth-plate studies
  context: >-
    human, adolescent, at physeal closure; whole plate. Provenance is surgical waste and autopsy,
    with no biobank
  timescale: >-
    the fusion process itself takes months to a few years per site, and the two available
    specimens are single time points within it
  evidence_tier: T3
  refs:
  - human_gp_donor_census_20260805
  - white2008
  - emons2009
  confidence: A
  notes: >-
    Hard ceiling on the whole of L7. Every mechanistic statement about how the human growth plate
    closes - bony bridge formation, apoptosis at fusion, hypoxia and necrosis, ECM remodelling -
    is downstream of n=2. This is a supply constraint, not a knowledge gap that more analysis can
    close.

- edge_id: e00015
  source: spatial_transcriptomics_growth_plate
  target: pde_isoform_inventory
  relation: required_for
  sign: unknown
  magnitude: >-
    no human growth plate spatial transcriptomics exists. Every human zonal molecular assignment
    in this atlas derives either from laser-capture microdissection of n=2 donors (gse9160, distal
    femur, 11y10m female and 13y3m male, five zones) or from mouse spatial data, so any claim that
    a particular PDE isoform is zonally restricted in the human plate is an inference across both
    method and species
  context: human distal femur, peripubertal; RZ/PZ/PHZ/HZ/PERI. Mouse spatial data exist; human do not
  timescale: not applicable - a static expression-map constraint
  evidence_tier: T3
  refs:
  - gse9160
  - geo_census_20260805
  - chu2026
  confidence: A
  notes: >-
    Chosen as the target because the PDE inventory is where the atlas most wants zonal resolution
    (it determines which phosphodiesterase inhibitor could raise cGMP in the right zone) and where
    it has least.

- edge_id: e00016
  source: lineage_tracing_limitations
  target: human_skeletal_stem_cell
  relation: required_for
  sign: unknown
  magnitude: >-
    no genetic fate mapping is possible in humans, so every human skeletal stem cell claim rests
    on prospective marker-based isolation followed by xenotransplantation, or on inference from
    single-cell and spatial profiling of static tissue - never on watching a labelled cell and its
    progeny in situ
  context: >-
    human, fetal and paediatric skeletal tissue; whole plate. The mouse hierarchy that defines the
    concept is built entirely on Cre-lox tracing that cannot be repeated in human
  timescale: >-
    the unobservable quantity is precisely the long one - clone lifetime and self-renewal over
    months to years
  evidence_tier: T1
  refs:
  - chan2018
  - chu2026
  - mizuhashi2018
  confidence: A
  notes: >-
    The asymmetry is the point: the mouse skeletal stem cell hierarchy is a lineage claim, the
    human one is a marker-and-transplant claim, and they are not the same kind of evidence. Any
    edge running from mouse SSC biology to human SSC biology inherits this.

- edge_id: e00017
  source: lineage_tracing_limitations
  target: clonal_column
  relation: required_for
  sign: unknown
  magnitude: >-
    the monoclonality of the human chondrocyte column has never been demonstrated. In mouse it is
    established by multicolour clonal reporters; in human it is inferred from column morphology
    and from static single-cell and spatial profiling of four donors aged 11-14 years
  context: human growth plate, peripubertal; proliferative zone columns
  timescale: >-
    a column represents days to weeks of clonal output; that history is exactly what static human
    data cannot recover
  evidence_tier: T1
  refs:
  - chu2026
  - mizuhashi2018
  - zhou2014a
  confidence: A
  notes: >-
    Marked as a method constraint on an L1 structural claim, because the word "clonal" in
    clonal_column is doing mouse work inside a human node.

- edge_id: e00018
  source: chondrocyte_dissociation_bias
  target: hypertrophic_chondrocyte_survival
  relation: inhibits
  sign: '-'
  magnitude: >-
    hypertrophic chondrocytes are the cells most severely under-recovered by enzymatic
    dissociation - they are large, fragile and embedded in mineralising matrix - so the question of
    whether they survive the chondro-osseous junction or die there is the question that
    dissociation-based single-cell RNA-seq is structurally least able to answer
  context: >-
    multiple species, dissociation-based scRNA-seq of growth plate; hypertrophic zone and
    chondro-osseous junction
  timescale: >-
    the transit through the hypertrophic zone takes hours to a few days, so the cells in question
    are a small and short-lived fraction even before dissociation loss
  evidence_tier: T1
  refs:
  - white2008
  - li2025
  - delos2026
  confidence: B
  notes: >-
    Distinct from the existing canonical edge chondrocyte_dissociation_bias -> hypertrophic_chondrocyte,
    which records the cell-recovery bias itself. This edge records what that bias does to a
    specific contested L2 claim: the survival-versus-apoptosis question at the junction cannot be
    settled by the method most often used to argue it.

- edge_id: e00019
  source: stadiometry_measurement_error
  target: saltation_stasis_growth
  relation: required_for
  sign: unknown
  magnitude: >-
    the saltation-and-stasis claim asserts that growth occurs in discrete increments separated by
    days to weeks of stasis, and the increments asserted are of the same order as the measurement
    error of the instruments used to detect them; diurnal variation in standing height alone is
    several millimetres
  context: >-
    human infants and children, both sexes; whole-organism stature by stadiometry and knemometry.
    The dispute is entirely about measurement, not about biology
  timescale: >-
    the contested unit is exactly the sampling interval - daily to weekly measurement produces
    saltation, less frequent measurement does not
  evidence_tier: T1
  refs:
  - lampl1992
  - klein1994
  - reilly1984
  - ahmed1995
  confidence: A
  notes: >-
    One of the few places in this atlas where a whole L1 hypothesis node is downstream of an
    instrument's noise floor rather than of a biological uncertainty. Recorded so the hypothesis is
    not read as settled biology.

- edge_id: e00020
  source: immunohistochemistry_cartilage_artifact
  target: estrogen_receptor_alpha
  relation: required_for
  sign: unknown
  magnitude: >-
    the entire human zonal map of oestrogen receptor expression in the growth plate rests on
    immunohistochemistry in 32 donors across three studies (n=24 Tanner 1-5 proximal tibia; n=4
    pubertal tibia and femur; n=4, two prepubertal girls and two adolescent boys), with no
    orthogonal confirmation by in situ hybridization or zonal transcriptomics
  context: human proximal tibia and distal femur, Tanner 1-5, both sexes; all zones
  timescale: not applicable - a static localization constraint
  evidence_tier: T1
  refs:
  - nilsson2003
  - nilsson1999
  - egerbacher2002
  confidence: A
  notes: >-
    Oestrogen action on the human plate is the mechanism on which the whole of L7 fusion and much
    of L12 aromatase-inhibitor pharmacology depends, and its zonal anatomy is an IHC result in 32
    children. Cartilage IHC has specific artefact modes (endogenous biotin, matrix trapping,
    fixation-dependent epitope loss) that this node catalogues.

- edge_id: e00021
  source: growth_velocity_measurement_interval
  target: seasonality_growth_velocity
  relation: required_for
  sign: unknown
  magnitude: >-
    a seasonal amplitude in height velocity can only be resolved if the measurement interval is
    shorter than the season being claimed; annualised velocities are mathematically incapable of
    showing it, and sub-annual intervals inflate apparent velocity variance because measurement
    error is divided by a shorter time base
  context: human children, both sexes, longitudinal auxology; whole organism
  timescale: the constraint IS a timescale - seasonal claims require intervals well under 3 months
  evidence_tier: T1
  refs:
  - lampl1992
  - ahmed1995
  - shulman2013
  confidence: B
  notes: >-
    L13 -> L4 was empty before this edge. Seasonality of growth velocity is a real and repeatedly
    reported phenomenon whose effect size is not separable from the sampling design used to
    measure it.

- edge_id: e00022
  source: in_situ_hybridization_cartilage
  target: ihh_protein
  relation: required_for
  sign: unknown
  magnitude: >-
    the prehypertrophic restriction of Ihh expression - the spatial fact on which the entire
    PTHrP/IHH negative feedback loop is built - is an in situ hybridization result. The human
    counterpart rests on IHC in a pubertal series with donor number not stated, plus the
    two-donor laser-capture zonal array
  context: >-
    mouse embryonic and postnatal long bone (stjacques1999, long2001) with human pubertal
    confirmation of uncertain n (kindblom2002); prehypertrophic zone
  timescale: not applicable - a static expression-domain constraint
  evidence_tier: T1
  refs:
  - stjacques1999
  - long2001
  - kindblom2002
  - gse9160
  confidence: A
  notes: >-
    L13 -> L3 was empty. The feedback loop is usually drawn as though the expression domains were
    measured directly in human; they were not.

- edge_id: e00023
  source: atomic_force_microscopy_cartilage
  target: zonal_stiffness_gradient
  relation: required_for
  sign: unknown
  magnitude: >-
    the zonal modulus gradient of the human plate is an AFM nanoindentation result on hydrated
    cryosections: resting-zone cartilage 130.70 MPa (SD 36.56) stepping to 11920 MPa (SD 6.60 GPa)
    at epiphyseal bone, n=3 per interface with 4 areas each across 10 donors. Tip geometry, section
    thickness and hydration state each move the absolute values substantially
  context: human phalangeal and tibial growth plates, paediatric, both sexes; all zones and both interfaces
  timescale: >-
    indentation rate dependence matters - cartilage is poroviscoelastic, so the modulus reported
    depends on the loading timescale of the measurement
  evidence_tier: T1
  refs:
  - xie2025
  - darling2010
  - radhakrishnan2004
  confidence: B
  notes: >-
    L13 -> L5 was empty. Every finite-element model of the physis takes its material properties
    from measurements of this kind, so the modelling layer inherits the method's assumptions
    without restating them.

- edge_id: e00024
  source: dxa_body_composition
  target: muscle_bone_mechanical_coupling
  relation: required_for
  sign: unknown
  magnitude: >-
    the muscle-bone unit argument at puberty is a DXA result: peak lean mass velocity leading peak
    bone mineral content velocity by 0.22-0.71 years depending on site and sex, with 50% of peak
    BMC velocity variance explained. DXA measures areal rather than volumetric density and
    conflates size with density in growing children, which biases exactly the growth-phase
    comparison being made
  context: human adolescents, both sexes, pubertal spurt; whole body, arms and legs
  timescale: >-
    the lead time being measured (0.22-0.71 y) is of the same order as the spacing of annual DXA
    scans, so it is near the design's resolution
  evidence_tier: T1
  refs:
  - rauch2004
  - hodgson2025
  confidence: B
  notes: >-
    L13 -> L9 was empty. This edge and e00010 are deliberately paired: the organism-level
    conclusion and the instrument that produced it should not be separated.

- edge_id: e00025
  source: metatarsal_explant_culture
  target: npr2_agonist_class
  relation: required_for
  sign: unknown
  magnitude: >-
    the fetal metatarsal explant is the assay in which CNP and its analogues were shown to
    lengthen cartilage directly, and it is the bridge every NPR2 agonist programme crossed between
    receptor pharmacology and animal growth. It is a fetal, rodent, avascular, unloaded explant
    with no secondary ossification centre and no resting zone niche of the kind the postnatal
    human plate has
  context: >-
    fetal mouse and rat metatarsal, embryonic; whole rudiment. Applied to a class of drugs given to
    human children aged 2-15 with an intact postnatal physis
  timescale: >-
