edges:
  - edge_id: e00001
    source: resting_zone_niche
    target: pthrp_positive_resting_chondrocyte
    relation: required_for
    sign: "+"
    magnitude: "partial DTA ablation of PTHrP+ cells shrinks PZ and expands HZ and RZ"
    context: "mouse distal femur, P6 pulse, both sexes"
    evidence_tier: T1
    refs: [mizuhashi2018]
    confidence: C
    notes: "Niche and cell are mutually defining; ablation was incomplete, so the effect size is a lower bound."

  - edge_id: e00002
    source: pthrp_positive_resting_chondrocyte
    target: monoclonal_column_formation
    relation: sufficient_for
    sign: "+"
    magnitude: "single PTHrP-creER cells give rise to single-colour Confetti columns; long columns (>10 cells) appear from P18"
    context: "mouse distal femur growth plate, P6 tamoxifen pulse"
    evidence_tier: T1
    refs: [mizuhashi2018]
    confidence: C

  - edge_id: e00003
    source: pthrp_positive_resting_chondrocyte
    target: chondrocyte_to_osteoblast_transdifferentiation
    relation: precedes
    sign: "+"
    magnitude: "labelled descendants become Col1a1(2.3kb)-GFP+ osteoblasts and Cxcl12-GFP+ stroma; osteoblast counts peak at 3 months of chase"
    context: "mouse metaphysis beneath labelled columns, P6 pulse"
    evidence_tier: T1
    refs: [mizuhashi2018]
    confidence: C
    notes: "Multipotency is acquired only at the post-mitotic hypertrophic stage, not in the resting zone."

  - edge_id: e00004
    source: hypertrophic_chondrocyte_survival
    target: chondrocyte_to_osteoblast_transdifferentiation
    relation: required_for
    sign: "+"
    magnitude: "~60-63% of trabecular and 62-68% of endosteal osteoblasts are Col10a1-lineage at 3-4 weeks"
    context: "mouse femur, 3-4 weeks old, Col10a1-Cre and Agc1-CreERT2"
    evidence_tier: T1
    refs: [zhou2014a, yang2014]
    confidence: C

  - edge_id: e00005
    source: chondrocyte_apoptosis_hz
    target: chondrocyte_to_osteoblast_transdifferentiation
    relation: inhibits
    sign: "-"
    magnitude: "not quantified; the two fates partition an unmeasured fraction of terminal hypertrophic cells"
    context: "mouse chondro-osseous junction"
    evidence_tier: T1
    refs: [yang2014, zhou2014a]
    confidence: D
    notes: "Competing fates of the same cell; the partition has never been measured directly in any species."

  - edge_id: e00006
    source: chondrocyte_to_osteoblast_transdifferentiation
