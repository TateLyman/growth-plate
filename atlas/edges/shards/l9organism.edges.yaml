edges:

- edge_id: e00001
  source: growth_velocity_curve
  target: growth_velocity_longitudinal
  relation: correlates_with
  sign: '+'
  magnitude: >-
    organism peak 9.5-9.6 cm/yr (boys) and 8.3-8.4 cm/yr (girls) must equal the summed axial
    output of the lower-limb, vertebral and skull-base plates; the human distal femur alone
    contributes about 1.3 cm/yr after age 7
  context: human, both sexes, birth to fusion; whole organism versus single physis
  evidence_tier: T1
  refs:
  - chun2024
  - galvo2025
  confidence: B
  notes: >-
    This is the summation edge on which the whole validation layer rests. It is B not A because
    no study has measured all contributing plates in the same children at the same time; the
    plate-level velocities come from radiographic series in different cohorts.

- edge_id: e00002
  source: growth_velocity_curve
  target: peak_height_velocity
  relation: correlates_with
  sign: '+'
  magnitude: 'PHV 9.61 cm/yr at 12.46 y (boys), 8.32 cm/yr at 10.99 y (girls) by SITAR'
  context: human, both sexes, puberty; organism-level velocity
  evidence_tier: T1
  refs:
  - chun2024
  - galvo2025
  - elhakeem2024
  confidence: A

- edge_id: e00003
  source: growth_velocity_curve
  target: site_specific_growth_rate
  relation: correlates_with
