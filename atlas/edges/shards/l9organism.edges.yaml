- edge_id: e00025
  source: dental_development_clock
  target: bone_age
  relation: correlates_with
  sign: '+'
  magnitude: >-
    r=0.85 in unselected schoolchildren, but the two clocks dissociate by 1.68 y in untreated GH
    deficiency (bone age -1.99 y, dental age -0.31 y) with the delays uncorrelated
  context: human, ages 6-17, healthy and GH-deficient
  evidence_tier: T1
  refs:
  - demirjian1985
  - torliskawalkow2026
  - floresmir2005
  confidence: A
  notes: >-
    The correlation in unselected samples is driven by shared chronological age; under endocrine
    perturbation the clocks separate, which is the constraint on any single-systemic-signal theory
    of maturation.

