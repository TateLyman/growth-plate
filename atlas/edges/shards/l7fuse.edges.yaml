edges:

- edge_id: e00001
  source: estradiol_hormone
  target: epiphyseal_fusion
  relation: required_for
  sign: '+'
  magnitude: 'serum estradiol >73 pmol/L required for closure (n=1, within-subject dose-response)'
  context: human, both sexes, late puberty; systemic
  evidence_tier: T1
  refs:
  - lanfranco2008
  - morishima1995
  - carani1997
  confidence: B
  notes: >-
    Necessity established by aromatase deficiency (no ligand, plates stay open into the third
    decade) and sufficiency for closure by estradiol replacement in the same patients.

- edge_id: e00002
  source: estrogen_receptor_alpha
  target: epiphyseal_fusion
  relation: required_for
  sign: '+'
  magnitude: 'homozygous ESR1 nonsense mutation: bone age advanced only 15 to 17.5 y over 3.5 y'
  context: human male, homozygous ESR1 codon 157 stop; systemic
  evidence_tier: T1
  refs:
  - smith1994
  - smith2008
  confidence: B
  notes: >-
    The receptor arm of the experiment. Six months of transdermal estrogen giving a 10-fold rise
    in free estradiol produced no response, so the requirement is for signalling, not ligand.

