# L3 signaling_networks - shard l3core
# Subsystems: PTHrP/IHH loop; CNP/NPR2/cGMP/PKG-II + PDEs; FGF/FGFR3; and their convergence points.
# Edge ids are local (e00001...); merge_shards.py renumbers globally.
edges:

  # ---------- PTHrP / IHH loop ----------
  - edge_id: e00001
    source: pthrp_protein
    target: pth1r_receptor
    relation: binds
    sign: "+"
    context: mouse and chicken, periarticular/RZ-derived ligand acting on late PZ and PHZ chondrocytes, embryonic and postnatal
    evidence_tier: T1
    refs: [vortkamp1996, lee1996, chung1998]
    confidence: B
    notes: Ligand-receptor pairing is the axis of the loop; PTH1R is a class B GPCR coupling to Gs and Gq/11.

  - edge_id: e00002
    source: pth1r_receptor
    target: pthrp_ihh_feedback_loop
    relation: required_for
    sign: "+"
    context: mouse, whole growth plate; Pth1r-null and Pthlh-null give distinct phenotypes
    evidence_tier: T1
    refs: [lanske1999, chung1998]
    confidence: B

  - edge_id: e00003
    source: pthrp_protein
    target: ihh_protein
    relation: inhibits
    sign: "-"
    context: mouse and chicken PZ/PHZ; PTHrP keeps cells in the proliferative, pre-Ihh-competent state
    magnitude: not quantified - no measured transfer function
    evidence_tier: T1
    refs: [vortkamp1996, kobayashi2002]
    confidence: B
    notes: Indirect - PTHrP delays the differentiation step at which Ihh is switched on rather than repressing Ihh transcription directly.

  - edge_id: e00004
    source: ihh_protein
    target: pthrp_protein
    relation: transcribes
    sign: "+"
    context: mouse and chicken periarticular chondrocytes; Ihh acts as a long-range morphogen directly activating Pthlh
    evidence_tier: T1
    refs: [vortkamp1996, karp2000, koziel2004]
    confidence: B
    notes: Closes the negative feedback loop. Direct activation shown by Ext1 hypomorph range expansion (koziel2004).

  - edge_id: e00005
    source: ihh_protein
    target: patched1
    relation: binds
    sign: "-"
    context: mouse and chicken PZ/PHZ chondrocytes; ligand binding relieves PTCH1 inhibition of SMO
    evidence_tier: T1
    refs: [vortkamp1996, koziel2004]
    confidence: B

  - edge_id: e00006
