  evidence_tier: T1
  refs:
  - meng2025
  - warman1993
  confidence: A
  timescale: onset median 12 months for NC1-domain variants versus 72 months for non-NC1 (P=0.0014)
  notes: 'The only locus in this atlas where dominant-negative and haploinsufficient alleles of one gene
    have measured stature effects in the same cohort: interference costs ~1.6 SDS more than losing a copy.'
- edge_id: e00015
  source: col10a1_gene
  target: hypertrophic_chondrocyte
  relation: required_for
  sign: +
