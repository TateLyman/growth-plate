# Edge shard for Layer L8 (genetics and heritability).
# Each edge attaches a human genetic dosage state to the mechanistic node it perturbs.
# edge_ids are local; merge_shards.py renumbers globally.
edges:
- edge_id: e00001
  source: npr2_gene
  target: npr2_receptor
  relation: required_for
  sign: +
  magnitude: height z -1.8 +/- 1.1 in 16 carriers vs -0.4 +/- 0.8 in 23 non-carriers (P<0.0005)
  context: human, heterozygous NPR2 loss-of-function carriers within a 39-member acromesomelic dysplasia
    family, both sexes; germline
  evidence_tier: T1
  refs:
  - olney2006
  - bartels2004
  confidence: A
  timescale: lifetime (birth to adult height)
  notes: 'Gene dosage sets receptor function: three tested AMDM missense alleles have markedly deficient
    guanylyl cyclase activity, and obligate carriers are below matched-control height.'
- edge_id: e00002
  source: npr2_gene
  target: cgmp_second_messenger
  relation: activates
  sign: +
  magnitude: no detectable cGMP after CNP stimulation for all three mutants; significant reduction when
    co-expressed 1:1 with wild type
  context: human, heterozygous NPR2 missense alleles from idiopathic short stature probands expressed
    in transfected cells; also 1:1 co-transfection with wild type
  evidence_tier: T1
  refs:
  - vasques2013
  confidence: A
  notes: Establishes the dominant-negative component of heterozygous NPR2 alleles, not merely halved dose.
- edge_id: e00003
  source: npr2_gene
  target: npr2_receptor
  relation: activates
  sign: +
  magnitude: ligand-independent cGMP generation and elevated blood cGMP; tall stature with macrodactyly
    (V883M) or extreme tall stature without deformity (R655C)
  context: human, heterozygous gain-of-function NPR2 p.Val883Met (guanylyl cyclase domain) and p.Arg655Cys
    (kinase homology domain); germline
  evidence_tier: T1
  refs:
  - miura2012
  - hannema2013
  confidence: A
  timescale: lifetime
  notes: Opposite-direction human dosage arm. Together with olney2006 this makes NPR2 a two-sided human
    dose experiment on the same receptor.
- edge_id: e00004
  source: nppc_gene
  target: cnp_protein
  relation: transcribes
  sign: +
  magnitude: plasma CNP doubled versus five controls; NPPC substantially overexpressed in fibroblasts,
    with skeletal overgrowth
  context: human, three patients with balanced translocations breaking in 2q37.1 (partners chr7, chr8,
    chr13); de novo, both sexes
  evidence_tier: T1
  refs:
  - bocciardi2007
  - moncla2007
  confidence: A
  notes: Three independent chromosomal partners converge on NPPC overexpression, proposed to separate
    the gene from a negative regulatory element.
- edge_id: e00005
  source: nppc_gene
  target: npr2_receptor
  relation: activates
  sign: +
  magnitude: significant reduction in cGMP synthesis by the mutant ligands; screen of 668 patients plus
    29 ISS families
  context: human, two families with heterozygous NPPC mutations in the conserved CNP ring; autosomal dominant
    short stature with small hands
  evidence_tier: T1
  refs:
  - hisadooliva2018
  confidence: B
  notes: Ligand-side loss of function reduces receptor output; effect size in SDS not reported.
- edge_id: e00006
  source: fgfr3_gene
  target: fgfr3_receptor
  relation: inhibits
  sign: '-'
  magnitude: graded constitutive kinase activation across four disorders; adult height 132 cm (M) / 124
    cm (F) in achondroplasia
  context: human, heterozygous germline FGFR3 activating alleles; achondroplasia G380R, hypochondroplasia
    N540K, thanatophoric dysplasia K650E/R248C, both sexes
  evidence_tier: T1
  refs:
  - shiang1994
  - bellus1995
  - tavormina1995
  confidence: A
  timescale: effect established within the first two postnatal years
  notes: 'Sign is negative because FGFR3 is a negative regulator of bone growth: activating the receptor
    shortens the bone.'
- edge_id: e00007
  source: fgfr3_gene
  target: fgfr3_receptor
  relation: activates
  sign: +
  magnitude: tall stature with camptodactyly, scoliosis and hearing loss, recapitulating the Fgfr3-knockout
    mouse phenotype
  context: human, heterozygous FGFR3 p.R621H (and p.R621C in a second family), partial loss of kinase
    function; CATSHL syndrome, both sexes
  evidence_tier: T1
  refs:
  - toydemir2006
  confidence: B
  timescale: lifetime
  notes: 'The loss-of-function arm. Sign is positive on growth: reducing FGFR3 signalling lengthens bone.
    Graded B because the original report is one family, with one independent confirmatory family since.'
- edge_id: e00008
  source: ihh_gene
  target: ihh_protein
  relation: required_for
  sign: +
  magnitude: heterozygous carriers show mild-to-moderate short stature with fifth-finger middle phalanx
    shortening; biallelic loss gives cone-shaped epiphyses of hands and hips
  context: human, 16 probands with heterozygous IHH variants including the first complete IHH deletion;
    plus homozygous IHH mutations causing acrocapitofemoral dysplasia
  evidence_tier: T1
  refs:
  - sentchordimont2020
  - hellemans2003
  confidence: A
  timescale: lifetime
  notes: 'Penetrance is incomplete: 5 of 16 heterozygous carriers were of normal height. IHH is nonetheless
    the commonest gene found on growth-plate panels in idiopathic short stature (4/102).'
- edge_id: e00009
  source: ihh_gene
  target: ihh_protein
  relation: activates
  sign: unknown
  magnitude: three mutated residues predicted to be adjacent on the IHH surface; middle phalanges shortened
    or absent
  context: human, three large families with heterozygous missense mutations in the IHH amino-terminal
    signalling domain; brachydactyly type A-1
  evidence_tier: T1
  refs:
  - gao2001
  confidence: B
  notes: 'Sign recorded as unknown deliberately: BDA-1 missense alleles do not phenocopy IHH haploinsufficiency,
    so they are not simple loss of function and the direction of effect on Hedgehog output is not established.'
- edge_id: e00010
  source: pth1r_gene
  target: pth1r_receptor
  relation: activates
  sign: +
  magnitude: constitutive ligand-independent cAMP accumulation in COS-7 cells, absent in wild type; short-limbed
    dwarfism with hypercalcaemia and hypophosphataemia
  context: human, heterozygous PTH1R His223Arg in the first intracellular loop; Jansen-type metaphyseal
    chondrodysplasia, germline
  evidence_tier: T1
  refs:
  - schipani1995
  confidence: A
  timescale: prenatal onset, lifelong
  notes: Gain of function delays hypertrophic differentiation and shortens limbs, the direction predicted
    by the PTHrP-IHH loop.
- edge_id: e00011
  source: pth1r_gene
  target: pth1r_receptor
  relation: required_for
  sign: +
  magnitude: mutant receptor well expressed but binds neither PTH nor PTHrP and gives no cAMP or inositol
    phosphate response; lethal with advanced endochondral maturation
  context: human, Blomstrand chondrodysplasia; maternal splice-altering PTH1R allele expressed, paternal
    allele silent, so chondrocytes carry functionally zero receptor
  evidence_tier: T1
  refs:
  - jobert1998
  confidence: D
  notes: Single patient, and the null state arose from allele-specific non-expression rather than biallelic
    mutation. Graded D on that basis despite the clarity of the biochemistry.
- edge_id: e00012
  source: hdac4_gene
  target: hdac4_protein
  relation: required_for
  sign: +
  magnitude: brachydactyly type E in 48% and short stature among 103 individuals with 2q37 deletion; penetrance
    markedly incomplete
  context: human, six overlapping 2q37.3 deletions narrowing the critical region to HDAC4, plus de novo
    intragenic HDAC4 deletion and frameshift in deletion-negative patients; both sexes
  evidence_tier: T1
  refs:
  - williams2010
  - le2019
  confidence: B
  timescale: childhood through adult stature
  notes: Losing a repressor of chondrocyte hypertrophy shortens the digits, the direction expected if
    hypertrophic differentiation is advanced rather than extended.
- edge_id: e00013
  source: acan_gene
  target: aggrecan_acan
  relation: required_for
  sign: +
  magnitude: adult median height -2.8 SDS (range -5.9 to -0.9); childhood median -2.0 SDS (range -4.2
    to -0.6)
  context: human, 103 individuals from 20 families with heterozygous ACAN loss-of-function variants, both
    sexes, childhood through adult height
  evidence_tier: T1
  refs:
  - gkourogianni2017
  - nilsson2014_2
  confidence: A
  timescale: deficit widens from childhood to adult height, with premature growth cessation
  notes: Perfect cosegregation of variant and phenotype across 20 families. Bone age is ADVANCED, not
    delayed, so the mechanism is a shortened growth window rather than a slowed plate.
- edge_id: e00014
  source: col10a1_gene
  target: collagen_type_x
  relation: required_for
  sign: +
  magnitude: height Z -3.62 +/- 1.95 for missense (dominant-negative) versus -1.99 +/- 1.28 for truncating
    (haploinsufficient) variants, P=0.013
  context: human, 128 metaphyseal chondrodysplasia Schmid cases (4 new plus 124 published), heterozygous,
