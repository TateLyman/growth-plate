- edge_id: e00018
  source: ghr_gene
  target: gh_receptor
  relation: required_for
  sign: +
  magnitude: -4 to -10 height SDS with high circulating GH and low IGF-1; only homozygotes express the
    disease
  context: human, homozygous GHR loss-of-function (Laron syndrome), 69-patient cohort of Middle Eastern
    and Mediterranean origin followed over 50 years, both sexes
  evidence_tier: T1
  refs:
  - laron2015
  - godowski1989
  - amselem1989
  confidence: A
  timescale: postnatal; birth size is near-normal because fetal growth is largely GH-independent
  notes: 'The largest monogenic stature effect in this atlas. Fixes the causal direction of the somatomedin
    hypothesis in humans: abolishing the receptor while the ligand is elevated produces near-complete
    growth failure.'
- edge_id: e00019
  source: stat5b_gene
  target: stat5b_tf
  relation: required_for
  sign: +
  magnitude: height -7.8 SDS (114 cm at 16.4 years) with IGF-1 7.2 ng/ml against a normal range of 242-600,
