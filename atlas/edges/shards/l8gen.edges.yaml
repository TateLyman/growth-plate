  evidence_tier: T1
  refs:
  - hwa2005
  - kofoed2003
  confidence: B
  timescale: postnatal growth failure with growth hormone insensitivity
  notes: 'Places the lesion below the GH receptor: GH and GH-binding protein are normal to elevated while
