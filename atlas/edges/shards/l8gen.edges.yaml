  context: human, COL10A1 p.W651fsX666 assayed in vitro for trimerisation against wild-type collagen X
  evidence_tier: T1
  refs:
  - yang2025
  confidence: C
  notes: In vitro human-protein assay; the link to the hypertrophic chondrocyte is by restricted expression
