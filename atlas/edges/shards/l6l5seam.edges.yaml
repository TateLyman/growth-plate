  - edge_id: e00007
    source: static_vs_dynamic_loading
    target: proliferative_zone
    relation: inhibits
    sign: "-"
    magnitude: "proliferative cells per column reduced under static loading only (p<0.01 static vs dynamic); growth rate fell 19% under both"
