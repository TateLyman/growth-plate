    magnitude: "in vitro the sign REVERSES: dynamic compression (7-13% strain, 0.1 Hz) caused severe loss of columnar arrangement in proliferative and hypertrophic zones, while static (10% strain) preserved columns with only slight deviation from the growth axis"
