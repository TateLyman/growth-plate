  - edge_id: e00011
    source: strain_rate_dependence
    target: hypertrophic_chondrocyte
    relation: correlates_with
    sign: "+"
    magnitude: "at equal mean stress and equal axial strain, static loading gave higher lateral (p<0.001) and volumetric (p<=0.015) hypertrophic cell strain than dynamic; axial cell strain did not differ"
