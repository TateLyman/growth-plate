    evidence_tier: T1
    refs: [sergerie2011]
    confidence: D
    gap_id: g_l6l5_002
    notes: >-
      Directly opposite in sign to valteau2011 in vivo, where static is the architecturally damaging
      waveform. Explant (no perfusion, cut boundaries, 48 h) vs in vivo (2 weeks) is the obvious
      confound but has not been tested. Logged as a contradiction.

