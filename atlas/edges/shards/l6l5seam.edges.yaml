# Cross-layer seam shard: L6->L1, L6->L5, L5->L1, L11->L5, L13->{L1,L5,L6}
# All four seams were empty or near-empty before this pass.
# Convention used here: `timescale` records the observation window over which the
# stated effect was demonstrated, NOT a guess at the underlying biological rate.
edges:

# =====================================================================
# SEAM A - L6 mechanobiology -> L1 growth plate architecture
# NOTE: the quantitative stress-growth coefficient is rat/rabbit/calf only and
# in vivo human physeal stress has never been measured (physeal_stress_in_vivo,
# g_l6mech_003). Every animal-derived edge below therefore carries an explicit
# species caveat; the human-context claims are written separately and are almost
# all either surgical (guided growth, epiphysiodesis) or observational (sport).
# =====================================================================

  - edge_id: e00001
    source: hueter_volkmann_law
    target: growth_velocity_longitudinal
    relation: correlates_with
    sign: "-"
    magnitude: "17.1% change in longitudinal growth rate per 0.1 MPa sustained stress (range across plates 9.2-23.9); 15.0%/0.1 MPa for caudal vertebral plates, 18.6%/0.1 MPa for proximal tibial plates; compression slows, distraction accelerates"
    context: "rat, rabbit and calf caudal vertebrae and proximal tibiae; immature animals, sex not reported; whole-plate output measured by oxytetracycline label displacement"
    timescale: "8 days of sustained external loading"
    evidence_tier: T1
    refs: [stokes2006, stokes2002]
    confidence: C
    notes: >-
      The coefficient is invariant across a 12-fold range of baseline growth rate (30-366 um/day),
      which is why it is applied to humans. No human measurement of the coefficient exists and no
      human physeal stress has ever been measured in vivo (g_l6mech_001, g_l6mech_003), so the
      human application is extrapolation across three species and two skeletal sites.

  - edge_id: e00002
    source: hueter_volkmann_law
    target: growth_plate_height
    relation: correlates_with
    sign: "-"
    magnitude: "hypertrophic zone height 87% of control; total plate thickness significantly reduced under static compression only"
    context: "rat caudal vertebra, ~60% body weight for 4 weeks (stokes2002); rat caudal vertebra Cd7, 0.2 MPa mean for 2 weeks (valteau2011); immature animals"
    timescale: "2-4 weeks of sustained loading"
    evidence_tier: T1
    refs: [stokes2002, valteau2011]
    confidence: C
    notes: >-
      Plate height is a poor proxy for growth rate in general, but under load it moves in the same
      direction as growth rate because the same zonal parameters drive both.

  - edge_id: e00003
    source: mechanical_modulation_growth
    target: chondrocyte_hypertrophy
    relation: inhibits
    sign: "-"
    magnitude: "mean hypertrophic chondrocyte height 85% of control; increment in cell height along the growth direction 78% of control"
    context: "rat caudal vertebra, sustained compression at ~60% body weight, 4 weeks; both effects significant"
    timescale: "4 weeks"
    evidence_tier: T1
    refs: [stokes2002]
    confidence: C

  - edge_id: e00004
    source: mechanical_modulation_growth
    target: hypertrophic_volume_increase
    relation: inhibits
    sign: "-"
    magnitude: "final hypertrophic cell height is the single strongest correlate of loaded growth rate: normalised multiple-regression coefficient 1.39, overall r=0.56"
    context: "pooled loaded and control plates from rat, rabbit and calf caudal vertebrae and proximal tibiae, 8 days sustained compression or distraction"
    timescale: "8 days"
    evidence_tier: T1
    refs: [stokes2007]
    confidence: C
    notes: >-
      Load acts on the same variable that dominates unloaded elongation, so mechanical modulation is
      not a separate mechanism but a shift along the existing hypertrophy axis.

  - edge_id: e00005
    source: mechanical_modulation_growth
    target: chondrocyte_proliferation_rate
    relation: inhibits
    sign: "-"
    magnitude: "proliferative cells per unit plate width: normalised regression coefficient 0.72, overall r=0.38 - roughly half the explanatory weight of hypertrophic cell height"
    context: "pooled rat, rabbit and calf loaded and control plates, 8 days"
    timescale: "8 days"
    evidence_tier: T1
    refs: [stokes2007]
    confidence: C

  - edge_id: e00006
    source: mechanical_modulation_growth
    target: elongation_budget
    relation: correlates_with
    sign: "-"
    magnitude: "hypertrophic cell height r=0.56 and proliferative cells per unit width r=0.38 of loaded growth-rate variance; the matrix-synthesis term of the budget was not partitioned"
