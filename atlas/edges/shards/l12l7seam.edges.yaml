# Cross-layer edge shard: l12l7seam
# Seams written here: L11->L3, L11->L4, L11->L5, L12->L3, L12->L4, L3->L7, L4->L7, L2->L7
# Rule applied throughout: mice do not complete epiphyseal fusion, so any mechanism->fusion
# edge whose only support is murine is written as hypothesized_link + confidence speculative
# with a gap_id. Rabbit fusion data are treated as genuine fusion-endpoint evidence.

edges:

# =====================================================================
# SEAM L11 -> L3 : each disease is a human perturbation OF a named pathway
# ---- FGFR3 allelic series ----
# =====================================================================

  - edge_id: e00001
    source: achondroplasia
    target: fgfr3_receptor
    relation: activates
    sign: "+"
    magnitude: >-
      G380R (c.1138G>A on 15/16 and G>C on 1/16 achondroplasia chromosomes). Constitutive but WEAK:
      quantitative FRET in plasma membrane vesicles shows the only measurable effect is increased
      unliganded dimerisation propensity, with no effect on ligand-bound dimer configuration; the
      dominant defect is failed termination - selective resistance to ligand-mediated internalisation
      and down-regulation via disrupted c-Cbl ubiquitination, diverting active receptor from lysosome
      to recycling. Weaker constitutive activation than K650E.
    context: >-
      human, heterozygous germline FGFR3 transmembrane-domain allele; receptor biochemistry in
      transfected human and animal cell lines and in transgenic mouse growth plate; zone-resolved
      receptor activity has never been measured in a living achondroplasia patient
    timescale: constitutive from fetal life; height-SDS loss accrues almost entirely within the first 2 postnatal years
    evidence_tier: T1
    refs: [shiang1994, naski1996, sarabipour2016, monsonegoornan2000, cho2004]
    confidence: A
    notes: >-
      Severity ordering across DOMAINS holds: K650E (kinase domain, lethal) activates more strongly
      than G380R (transmembrane, viable). It does NOT hold within the K650 pair - see e00004.

  - edge_id: e00002
    source: hypochondroplasia
    target: fgfr3_receptor
    relation: activates
    sign: "+"
    magnitude: >-
      N540K (8/14 unrelated patients in the original screen; 50-70% of all cases) plus a rarer K650N/K650Q
      class producing weaker constitutive kinase activation than the K650E and K650M substitutions
    context: >-
      human, heterozygous germline FGFR3 proximal-kinase-domain allele; no human growth plate histology
      has ever been reported for hypochondroplasia
    timescale: constitutive from fetal life
    evidence_tier: T1
    refs: [bellus1995, bellus2000]
    confidence: A
    notes: >-
      The weak allele of the series and therefore the human dose control for achondroplasia: same
      molecular lesion class, smaller magnitude, adult stature overlapping the lower normal range.

  - edge_id: e00003
    source: thanatophoric_dysplasia
    target: fgfr3_receptor
    relation: activates
    sign: "+"
    magnitude: >-
      TD2 = K650E in the kinase activation loop (16/16 cases); TD1 = R248C (22/39) or S371C creating an
      unpaired extracellular cysteine that drives ligand-independent covalent dimerisation. K650E
      constitutive activation exceeds G380R.
    context: >-
      human, de novo heterozygous FGFR3 alleles; the only member of the series in which the human growth
      plate has actually been examined (91 registry cases with matched genotype, radiology and histopathology)
    timescale: constitutive from fetal life; perinatally lethal, so no postnatal integration
    evidence_tier: T1
    refs: [tavormina1995, naski1996, wilcox1998]
    confidence: A
    notes: >-
      Critically non-monotonic at the tissue level: K650E growth plates were BETTER preserved than R248C
      and Y373C plates, so severity of receptor activation and severity of growth plate disorganisation
      are not monotonically related.

  - edge_id: e00004
    source: saddan_syndrome
    target: fgfr3_receptor
    relation: activates
    sign: "+"
    magnitude: >-
      K650M produces approximately 3-fold the constitutive kinase activity of K650E in transient
      transfection, yet is survivable (4/4 individuals survived past infancy) whereas K650E is lethal
    context: >-
      human, de novo heterozygous FGFR3 A1949T; kinase activity measured in transiently transfected cells;
      no SADDAN growth plate histology and no systematic adult height series exist
    timescale: constitutive from fetal life
    evidence_tier: T1
    refs: [tavormina1999]
    confidence: B
    notes: >-
      LOAD-BEARING SCOPE LIMIT for every FGFR3-inhibitor edge in this atlas: phenotype severity is NOT
      monotonic in kinase output within the K650E/K650M pair, even though it is monotonic across
      K650E vs G380R. Reducing scalar kinase output is therefore not by itself predictive of benefit.

  - edge_id: e00005
    source: achondroplasia
    target: fgfr3_mapk_branch
    relation: activates
    sign: "+"
    magnitude: >-
      G380R strongly activates ERK in a cell-free kinase assay and in RCS chondrocytes; ERK activation
      correlated with inhibition of chondrocyte proliferation. All six dysplasia alleles tested
      (G380R, N540K, R248C, Y373C, K650M, K650E) activated ERK strongly.
    context: >-
      human FGFR3 alleles expressed in rat chondrosarcoma (RCS) chondrocytes, HeLa and 293T; constitutively
      active MEK1 in mouse chondrocytes reproduces achondroplasia-like dwarfism and suppresses Fgfr3-null
      overgrowth. No ERK measurement exists in human growth plate tissue.
    timescale: minutes (kinase signalling); phenotypic integration over the first 2 postnatal years
    evidence_tier: T1
    refs: [krejci2008, murakami2004]
    confidence: B
    gap_id: g_l3core_008

  - edge_id: e00006
    source: thanatophoric_dysplasia
    target: fgfr3_mapk_branch
    relation: activates
    sign: "+"
    magnitude: K650E, R248C and Y373C all strongly activate ERK in RCS chondrocytes, HeLa and 293T
    context: human FGFR3 alleles in non-cartilage and rat chondrosarcoma cell backgrounds
    timescale: minutes (kinase signalling)
    evidence_tier: T1
    refs: [krejci2008]
    confidence: B

  - edge_id: e00007
    source: hypochondroplasia
    target: fgfr3_mapk_branch
    relation: activates
    sign: "+"
    magnitude: N540K activates ERK strongly, comparably to the lethal alleles, despite the mildest clinical phenotype of the series
    context: human FGFR3 N540K expressed in RCS chondrocytes, HeLa and 293T
    timescale: minutes (kinase signalling)
    evidence_tier: T1
    refs: [krejci2008]
    confidence: B
    notes: >-
      ERK activation strength does not order the clinical series either - N540K (mildest) activates ERK
      comparably to K650E (lethal). Whatever grades the phenotype is not scalar ERK output alone.

  - edge_id: e00008
    source: thanatophoric_dysplasia
    target: fgfr3_stat1_branch
    relation: activates
    sign: "+"
    magnitude: >-
      K650E is one of only two of six dysplasia alleles that phosphorylate STAT1(Y701) in a cell-free
      kinase assay and in RCS, HeLa and 293T cells; in cultured human TD type I fetal chondrocytes STAT1
      is ligand-independently activated with nuclear STAT1 detectable in hypertrophic chondrocytes
    context: >-
      human TD alleles; the only human-tissue arm is TD type I fetal chondrocyte culture (legeaimallet1998),
      not the human growth plate in situ
    timescale: minutes (kinase signalling)
    evidence_tier: T1
    refs: [su1997, legeaimallet1998, krejci2008]
    confidence: B
    gap_id: g_l12l7_005
    notes: >-
      CONTRADICTION: krejci2008 found the TD1 allele R248C does NOT activate STAT1 in RCS/293T, whereas
      legeaimallet1998 reported ligand-independent STAT1 activation in human TD1 fetal chondrocytes.
      The disagreement is cell-background versus human-cell and is unresolved.

  - edge_id: e00009
    source: achondroplasia
    target: fgfr3_stat1_branch
    relation: correlates_with
    sign: unknown
    magnitude: >-
      NULL RESULT: G380R produced no activatory STAT1(Y701) phosphorylation in a cell-free kinase assay,
      and no STAT1 activation in RCS chondrocytes or 293T (weak in HeLa only)
    context: human FGFR3 G380R expressed in RCS chondrocytes, HeLa and 293T; not tested in human growth plate tissue
    timescale: minutes (kinase assay readout)
    evidence_tier: T1
    refs: [krejci2008]
    confidence: D
    gap_id: g_l12l7_005
    notes: >-
      Negative evidence. The STAT1 arm must NOT be assumed engaged by the achondroplasia allele; STAT1
      activation appears restricted to K650E/K650M, which together account for a small minority of
      FGFR3-related skeletal dysplasia. Recorded as an unsigned correlation so it is not traversed
      as a signed mechanism.

  - edge_id: e00010
    source: saddan_syndrome
    target: fgfr3_stat1_branch
    relation: activates
    sign: "+"
    magnitude: K650M is one of the two alleles of six that strongly phosphorylate STAT1(Y701)
    context: human FGFR3 K650M in a cell-free kinase assay and in RCS, HeLa and 293T cells; single study
    timescale: minutes (kinase signalling)
    evidence_tier: T1
    refs: [krejci2008]
    confidence: D
    notes: >-
      Relevant to the K650E/K650M lethality dissociation: both alleles activate STAT1 and both activate
      ERK, so neither branch's on/off state explains why K650M is survivable and K650E is not.

  - edge_id: e00011
    source: achondroplasia
    target: npr2_receptor
    relation: inhibits
    sign: "-"
    magnitude: >-
      FGF-driven, PPP-family-phosphatase-dependent dephosphorylation of the seven juxtamembrane
      serines/threonines of GC-B; crossing a non-dephosphorylatable GC-B(7E/7E) allele into FGFR3-G380R
      restored long bone length and hypertrophic zone area to wild-type values
    context: >-
      mouse Fgfr3-G380R knock-in, intact mouse tibia with an in vivo cGMP biosensor, and rat chondrosarcoma
      cells. NOT demonstrated in human tissue - no human growth plate NPR2 phosphorylation measurement exists.
    timescale: minutes (rapid and reversible dephosphorylation); phenotypic integration over postnatal growth
    evidence_tier: T1
    refs: [wagner2021, robinson2017, shuhaibar2017]
    confidence: C
    gap_id: g_l12l7_008
    notes: >-
      Crosstalk is post-translational only - GC-B protein levels are unchanged - which is why the receptor
      is still present to be agonised by CNP analogues in achondroplasia.

# ---- CNP / NPR2 / cGMP dosage series ----

  - edge_id: e00012
    source: acromesomelic_dysplasia_maroteaux
    target: npr2_receptor
    relation: inhibits
    sign: "-"
    magnitude: >-
      biallelic loss of function; 21 distinct NPR2 lesions in 21 families (4 nonsense, 4 frameshift,
      2 splice-site, 11 missense); 3 of the missense alleles tested were markedly deficient in
      guanylyl cyclase activity
    context: human, biallelic; functional assay in transfected cells; no AMDM growth plate has ever been described histologically
    timescale: constitutive, lifelong
    evidence_tier: T1
    refs: [bartels2004]
    confidence: A
    notes: The zero point of the human CNP dosage series and the mechanistic negative control for vosoritide.

  - edge_id: e00013
    source: acromesomelic_dysplasia_maroteaux
    target: cgmp_second_messenger
    relation: inhibits
    sign: "-"
    magnitude: >-
      guanylyl cyclase activity markedly deficient for the tested alleles; the AMDM proband had very high
      plasma CNP and NT-proCNP with low IGF-I and GH resistance, i.e. ligand accumulates because the
      receptor cannot transduce or clear it. Heterozygous carriers were biochemically normal.
    context: human proband plus in vitro cyclase assay; cGMP has never been measured in a human growth plate
    timescale: constitutive, lifelong
    evidence_tier: T1
    refs: [bartels2004, olney2006]
    confidence: B

  - edge_id: e00014
    source: npr2_heterozygous_short_stature
    target: npr2_receptor
    relation: inhibits
    sign: "-"
    magnitude: >-
      one lost allele costs approximately 1.4 SDS of height: 16 heterozygous carriers -1.8 +/- 1.1 SDS
      versus 23 non-carrier relatives -0.4 +/- 0.8 SDS in the same family (P<0.0005); 7 heterozygous
      variants in 192 short-stature patients versus 0 in 192 height-normal controls; ~3% yield in
      SHOX-negative Leri-Weill referrals
    context: human, heterozygous, both sexes; within-family design controls for shared environment and background
    timescale: lifelong; the deficit is present through childhood and worsens with age
    evidence_tier: T1
    refs: [olney2006, wang2015, hisadooliva2015, bartels2004]
    confidence: A

  - edge_id: e00015
    source: npr2_gain_of_function_tall
    target: npr2_receptor
    relation: activates
    sign: "+"
    magnitude: >-
      three mechanistically distinct activating classes: V883M (cyclase domain) generates cGMP with no CNP
      present; R655C (kinase homology domain) amplifies the CNP response and its ATP stabilisation and
      heterodimerises dominantly with wild-type receptor; plus an activating submembrane deletion
    context: human, heterozygous, three-generation family for V883M; single probands for the others
    timescale: constitutive, lifelong
    evidence_tier: T1
    refs: [miura2012, hannema2013, lauffer2020, wang2015]
    confidence: B
    notes: >-
      V883M (tall WITH scoliosis and macrodactyly) and R655C (tall WITHOUT skeletal deformity) show that
      ligand-independent basal signalling and amplified ligand-dependent signalling are not interchangeable
      in the growth plate. No pooled effect size in cm or SDS exists for NPR2 gain of function.

  - edge_id: e00016
    source: npr2_gain_of_function_tall
    target: cgmp_second_messenger
    relation: activates
    sign: "+"
    magnitude: >-
      blood cGMP elevated in affected members of the V883M family; mutant receptor generated cGMP in
      HEK293A cells in the complete absence of CNP where wild type did not. In the R655C proband plasma
      NT-proCNP was REDUCED, i.e. augmented receptor activity feeds back onto ligand production.
    context: >-
      human blood (not growth plate) plus transfected human cell line; the only setting in which the
      transducer and the stature phenotype have been measured in the same people
    timescale: constitutive, lifelong
    evidence_tier: T1
    refs: [miura2012, hannema2013]
    confidence: B

  - edge_id: e00017
    source: nppc_duplication_tall_stature
    target: cnp_protein
    relation: activates
    sign: "+"
    magnitude: >-
      plasma CNP 2-fold above five controls in the de novo t(2;7)(q37.1;q21.3) proband with a breakpoint
      adjacent to NPPC, with substantially raised NPPC expression in the proband's fibroblasts; an
      independent t(1;2)(q41;q37.1) with a breakpoint 200,365 bp downstream of NPPC raised serum NT-proCNP
    context: human, two independent de novo balanced translocations at the same locus, same phenotype, same biomarker
    timescale: constitutive, lifelong
    evidence_tier: T1
    refs: [bocciardi2007, ko2015]
    confidence: A

  - edge_id: e00018
    source: nppc_duplication_tall_stature
    target: npr2_receptor
    relation: activates
    sign: "+"
    magnitude: not quantified - ligand concentration was measured, receptor output was not
    context: >-
      human; inferred from ligand dosage. Supported independently from the clearance side: biallelic NPR3
      loss of function, which raises local CNP without changing NPPC, causes tall stature with skeletal overgrowth.
    timescale: constitutive, lifelong
    evidence_tier: T1
    refs: [bocciardi2007, lauffer2022, hisadooliva2018]
    confidence: C
    notes: >-
      Written at C rather than A because no receptor-level or cGMP measurement exists in NPPC-duplication
