# ---- PTH1R: the matched activating/inactivating human pair ----

  - edge_id: e00019
    source: jansen_metaphyseal_chondrodysplasia
    target: pth1r_receptor
    relation: activates
    sign: "+"
    magnitude: >-
      ligand-independent cAMP accumulation from heterozygous activating alleles; H223R in 18/24 patients
      in the natural-history series, plus T410P, T410R (father and two sons), I458R and I458K
    context: >-
      human, heterozygous, both sexes; cAMP measured in COS-7 cells expressing the mutant receptor.
      The growth plate itself remains undescribed in living patients; bone histomorphometry exists in 2 children.
    timescale: constitutive from fetal life
    evidence_tier: T1
    refs: [schipani1995, saito2018]
    confidence: A
    notes: HALF 1 OF 2 of the matched human PTH1R pair. Partner edge e00020 carries the opposite sign.

  - edge_id: e00020
    source: blomstrand_chondrodysplasia
    target: pth1r_receptor
    relation: inhibits
    sign: "-"
    magnitude: >-
      homozygous P132L abolishes both PTH- and PTHrP-stimulated cAMP accumulation and radioligand binding
      while the mutant protein still reaches the cell surface of the affected infant's OWN growth plate
      chondrocytes - so the defect is binding, not trafficking; an independent exon-M5 splice allele
      abolished PTH-induced inositol phosphate accumulation as well as cAMP
    context: >-
      human, biallelic, perinatally lethal; receptor pharmacology in COS-1/COS-7 cells plus direct
      immunolocalisation in patient growth plate chondrocytes
    timescale: constitutive from fetal life; lethal in the perinatal period
    evidence_tier: T1
    refs: [karaplis1998, jobert1998]
    confidence: A
    notes: >-
      HALF 2 OF 2 of the matched human PTH1R pair. Jansen and Blomstrand are the same receptor perturbed
      in opposite directions in humans, and together they establish the direction of the timing control
      without requiring any animal model.

  - edge_id: e00021
    source: jansen_metaphyseal_chondrodysplasia
    target: pthrp_ihh_feedback_loop
    relation: activates
    sign: "+"
    magnitude: >-
      constitutive PTH1R signalling holds chondrocytes in the proliferative state and DELAYS exit into
      hypertrophy, giving markedly delayed and disorganised metaphyseal mineralisation with severe short stature
    context: >-
      human, heterozygous; the mouse counterpart (targeted expression of the Jansen H223R receptor in
      growth plate) reproduces delayed hypertrophic differentiation
    timescale: years - the phenotype is the integral of a per-cycle timing shift over childhood
    evidence_tier: T1
    refs: [schipani1995, saito2018, schipani1997]
    confidence: B

  - edge_id: e00022
    source: blomstrand_chondrodysplasia
    target: pthrp_ihh_feedback_loop
    relation: inhibits
    sign: "-"
    magnitude: >-
      extremely ADVANCED endochondral bone maturation - the exact phenotypic mirror of Jansen -
      lethal in the perinatal period
    context: human, biallelic; matches the mouse Pthlh-null and Pth1r-null acceleration of hypertrophy
    timescale: fetal; the whole phenotype is expressed before birth
    evidence_tier: T1
    refs: [jobert1998, karaplis1998]
    confidence: B
    notes: >-
      Read against e00021, the pair establishes in humans what the mouse knockouts establish in mice:
      PTH1R signalling sets the timing of the proliferative-to-hypertrophic transition, more signal delays
      it and less signal advances it, and stature is the integral of that timing decision.

  - edge_id: e00023
    source: pseudohypoparathyroidism
    target: pthrp_ihh_feedback_loop
    relation: inhibits
    sign: "-"
    magnitude: >-
      brachydactyly, most characteristically of the fourth and fifth metacarpals, produced by PREMATURE
      closure of the affected growth plates, with only mild overall short stature
    context: >-
      human; the lesion is in GNAS (Gs-alpha) or its imprinting, one step DISTAL to an intact PTH1R, so
      this edge represents loss of pathway output rather than loss of receptor. Partial and tissue-restricted
      by imprinting, which is why the phenotype is site-selective rather than lethal.
    timescale: childhood - selective plates close early while others continue
    evidence_tier: T1
    refs: [yang2026, portalescastil2025]
    confidence: B
    notes: >-
      The third member of the human PTH1R series: reduced PTHrP-PTH1R-cAMP signalling accelerates exit
      of proliferative chondrocytes into hypertrophy, the exact opposite of Jansen.

# ---- RAS/MAPK, TGF-beta and RUNX2 ----

  - edge_id: e00024
    source: noonan_syndrome
    target: mek1_erk_chondrocyte
    relation: activates
    sign: "+"
    magnitude: >-
      germline gain-of-function PTPN11 (commonest), SOS1, RAF1 and RIT1 raise RAS/MAPK flux; birth length
      is usually normal and growth failure is postnatal, with adult height approaching the lower limit of
      normal rather than falling into the skeletal dysplasia range
    context: >-
      human, heterozygous germline, both sexes; MAPK flux has been measured in patient-derived non-cartilage
      cells only, never in human growth plate. Family-based cohorts carry a polygenic confounder - in a
      101-patient genotyped cohort the fathers were themselves -0.33 SDS.
    timescale: postnatal, accruing over childhood
    evidence_tier: T1
    refs: [jirova2026, klar2025]
    confidence: B
    notes: >-
      Mechanistically adjacent to achondroplasia - the same cascade - and it bounds how much of the
      achondroplasia phenotype scalar MAPK activation alone can explain: raising RAS/MAPK flux germline
      costs roughly 1-2 SDS, not the 6 SDS of achondroplasia.

  - edge_id: e00025
    source: marfan_syndrome
    target: tgfb_signaling_chondrocyte
    relation: activates
    sign: "+"
    magnitude: >-
      tall stature with dolichostenomelia - reduced upper:lower segment ratio and arm span exceeding
      height, i.e. the long-bone plates overgrow relative to the vertebral plates
    context: >-
      human, heterozygous FBN1; the increased-free-TGF-beta model rests on the microfibril-sequestration
      role of fibrillin-1 and has NOT been demonstrated in human cartilage or growth plate tissue
    timescale: childhood through adolescence
    evidence_tier: T1
    refs: [gregorova2025, sada2024]
    confidence: D
    notes: >-
      Sign is opposite to every other structural-matrix disorder in L11. Consistent in direction with the
      mouse result that the canonical TGF-beta arm restrains terminal differentiation, so more signal
      should delay hypertrophy and lengthen the growth period - but that chain is inferred, not measured.

  - edge_id: e00026
    source: loeys_dietz_syndrome
    target: tgfbr2_receptor
    relation: inhibits
    sign: "-"
    magnitude: >-
      heterozygous TGFBR1, TGFBR2, SMAD3, TGFB2 or TGFB3 mutations giving marfanoid habitus with skeletal
      overgrowth, arachnodactyly and scoliosis
    context: >-
      human, heterozygous; no growth plate specimen from a Loeys-Dietz patient has been assayed, and the
      human phenotype is dominated by aortic rather than skeletal disease
    timescale: childhood through adolescence
    evidence_tier: T1
    refs: [ko2015, sada2024]
    confidence: C
    notes: >-
      The receptor-level control for Marfan, and it exposes an unresolved paradox: receptor loss-of-function
      produces an overgrowth phenotype resembling ligand excess. One human double perturbation is on record -
      the t(1;2)(q41;q37.1) patient carried both an NPPC gain and TGFB2 haploinsufficiency, so that
      individual's overgrowth cannot be attributed to either lesion alone.

  - edge_id: e00027
    source: cleidocranial_dysplasia
    target: runx2_tf
    relation: inhibits
    sign: "-"
    magnitude: >-
      heterozygous loss by point mutation, whole-gene deletion, or a 4.2 kb deletion of the 3' untranslated
      region; intramembranous bone (clavicle, cranial vault) severely affected while endochondral long bones
      are comparatively spared and stature is only mildly to moderately reduced
    context: human, heterozygous, both sexes
    timescale: constitutive; the skeletal distribution is fixed developmentally
    evidence_tier: T1
    refs: [mundlos1997, mijovic2025]
    confidence: A
    notes: >-
      The asymmetric dose sensitivity is the point: one functional RUNX2 allele is nearly sufficient for
      the hypertrophic transition in the growth plate while being clearly insufficient for intramembranous
      bone, in the same individual.

# =====================================================================
# SEAM L11 -> L5 : disease onto matrix protein
# =====================================================================

  - edge_id: e00028
    source: acan_related_short_stature
    target: aggrecan_acan
    relation: inhibits
    sign: "-"
    magnitude: >-
      heterozygous loss of function: adult height median -2.8 SDS (range -5.9 to -0.9) versus childhood
      height -2.0 SDS in the same 103 individuals from 20 families, with bone age advanced by a median
      +1.3 years (range 0 to +3.7)
    context: human, heterozygous, 57 female and 46 male; variants cosegregated perfectly with phenotype
    timescale: >-
      lifelong; the adult deficit EXCEEDS the childhood deficit because growth stops early, so the plate
      both grows less per year and exhausts sooner
    evidence_tier: T1
    refs: [gkourogianni2017, tatsi2017]
    confidence: A
    notes: >-
      Dissociates height from skeletal maturation. Advanced bone age is not obligate - ACAN mutations also
      occur in nonfamilial short stature without accelerated skeletal maturation. The cellular mechanism
      (reduced matrix and impaired hypertrophy with proliferation spared) is MOUSE only.

  - edge_id: e00029
    source: schmid_metaphyseal_chondrodysplasia
    target: collagen_type_x
    relation: inhibits
    sign: "-"
    magnitude: >-
      COL10A1 mutations concentrated in the C-terminal NC1 trimerisation domain prevent normal trimer
      assembly; the modern mechanism is ER stress from misfolded collagen X retained in hypertrophic
      chondrocytes rather than simple haploinsufficiency
    context: >-
      human, heterozygous; COL10A1 is expressed ONLY by hypertrophic chondrocytes, so the phenotype is a
      pure hypertrophic-zone readout - irregular cupped metaphyses with normal epiphyses and normal spine
    timescale: childhood; adult height usually only mildly reduced
    evidence_tier: T1
    refs: [mcintosh1994]
    confidence: B
    notes: >-
      Abstract-only source for the mutation series. The structure-function mapping is among the sharpest
      in human skeletal genetics: the zone in which a matrix gene is expressed predicts which radiographic
      compartment fails. Eliminating a hypertrophic-zone matrix protein costs surprisingly little final height.

