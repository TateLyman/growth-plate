id: resting_zone
name: Resting (reserve) zone
aliases:
- reserve zone
- germinal zone
- RZ
type: tissue_structure
layer: L1
stub: false
summary: 'The resting zone is the epiphyseal-most stratum of the growth plate, containing small, rounded,
  sparsely distributed chondrocytes in abundant matrix and singly or in pairs rather than in columns.
  It is the source of the columnar clones: PTHrP-expressing resting-zone chondrocytes in mouse behave
  as skeletal stem cells that acquire self-renewal and generate columnar clones only after the secondary
  ossification centre has formed, which places the appearance of a true stem compartment after, not before,
  the establishment of the plate. The zone is not uniformly quiescent: a systematic review of the primary
  literature finds reported labelling indices and the operational definition of quiescence vary widely
  between studies, so ''resting'' is a morphological label rather than an established kinetic state. Resting-zone
  height is one of the histomorphometric parameters that correlates linearly with tibial length and growth
  rate in mouse. The zone is also the most hypoxic and nutritionally remote part of the plate, since it
  is furthest from the metaphyseal vasculature and depends on epiphyseal supply.'
