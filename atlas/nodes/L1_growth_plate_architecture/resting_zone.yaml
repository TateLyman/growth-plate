id: resting_zone
name: Resting (reserve) zone
aliases:
- reserve zone
- germinal zone
- RZ
type: tissue_structure
layer: L1
stub: false
summary: 'The resting zone is the epiphyseal-most stratum of the growth plate, containing small, rounded, sparsely
  distributed chondrocytes in abundant matrix and singly or in pairs rather than in columns. It is the source of the
  columnar clones: PTHrP-expressing resting-zone chondrocytes in mouse behave as skeletal stem cells that acquire
  self-renewal and generate columnar clones only after the secondary ossification centre has formed, which places
  the appearance of a true stem compartment after, not before, the establishment of the plate. The zone is not uniformly
  quiescent: a systematic review of the primary literature finds reported labelling indices and the operational definition
  of quiescence vary widely between studies, so ''resting'' is a morphological label rather than an established kinetic
  state. Resting-zone height is one of the histomorphometric parameters that correlates linearly with tibial length
  and growth rate in mouse. The zone is also the most hypoxic and nutritionally remote part of the plate, since it
  is furthest from the metaphyseal vasculature and depends on epiphyseal supply.'
quantitative:
- parameter: ARE HUMAN RESTING ZONE CELLS ACTUALLY QUIESCENT - measured in human tissue
  value: yes, a subset is functionally quiescent in vivo and can be released from it
  unit: qualitative, four independent readouts
  conditions: 8 growth plate biopsies from healthy adolescents aged 12 y 2 m to 14 y 6 m, Tanner stage 2-4, distal
    femur, taken at epiphysiodesis for idiopathic tall stature. Visium and Visium HD spatial transcriptomics by the
    RNA-Rescue protocol, plus electron microscopy, RNAscope and ex vivo sequential thymidine-analogue labelling of
    intact biopsies
  species: human
  source_ref: avijgan2026br
  uncertainty: 'THE FOUR READOUTS ARE THE STRENGTH: resting zone cells carry the least mRNA of any zone (UMI per spot
    lowest in RZ in every one of 17 sections), the mRNA is predominantly NUCLEAR, the nuclei carry abundant heterochromatin
    on electron microscopy, and in overnight ex vivo culture few RZ cells take up EdU while IdU and CldU given on
    subsequent days ARE taken up - reversible cell cycle arrest, the behaviour of muscle satellite, haematopoietic
    and neural stem cells released from their niche. CHRDL2+ and/or SFRP5+ sub-populations are the LEAST quiescent,
    which gives a hierarchy rather than a uniform compartment. LIMITS THE AUTHORS STATE: a prolonged G1 cannot be
    excluded by thymidine analogues alone, and the release is observed in culture rather than in the body. LIMIT THIS
    ATLAS ADDS: all 8 donors were operated on to PREVENT tall stature, so this is quiescence measured in plates selected
    for growing too much, and there is no normal-stature comparison because no such tissue is obtainable.'
- parameter: resting zone height correlation with tibial growth rate
  value: high linear correlation
  unit: qualitative
  conditions: mouse proximal tibia, neonate to young adult, histomorphometry
  species: mouse
  source_ref: wilson2021
  uncertainty: linear model reported; coefficient not extractable from abstract
localization:
- 'mouse RZ: PTHrP+ skeletal stem cells confirmed by lineage tracing (mizuhashi2018)'
- 'human RZ: architecture described histologically, kinetics unmeasured (kember1976, thurston1985)'
human_evidence: direct
human_evidence_note: UPGRADED FROM INDIRECT 2026-08-06. avijgan2026br measures quiescence directly in human growth
  plate tissue - 8 adolescent donors, four independent readouts (mRNA quantity, nuclear mRNA localisation, heterochromatin,
  and reversible failure to incorporate EdU) - and finds a functionally quiescent subset with a hierarchy in which
  CHRDL2+/SFRP5+ cells are the least quiescent. The atlas previously recorded that none of this had been demonstrated
  in human tissue. It now has been, in donors selected for idiopathic tall stature.
species_basis:
- human
- mouse
- rat
translation_risk: high
translation_risk_reason: The stem-cell identity of resting-zone chondrocytes rests entirely on mouse lineage tracing,
  which cannot be done in humans; and the secondary-ossification-centre dependence of that identity means timing relative
  to human skeletal development is unestablished.
