id: round288_the_human_test_of_the_perichondrial_axis_was_run_four_times_and_nobody_looked_at_height
name: >-
  ROUND 288 - I took the perichondrial axis apart because it was the only one of the four with an approved
  molecule. THIS ATLAS SAID THE HUMAN TEST COULD NEVER BE RUN. IT HAS BEEN RUN FOUR TIMES WITH A TRUE
  CONTROL - AIMS IS PLACEBO-CONTROLLED, AGES 6-40, MEDIAN 18, FIVE YEARS, AND COMPUTED BSA-ADJUSTED Z SCORES
  ANNUALLY, WHICH REQUIRES SERIAL HEIGHT. But the same trial reports that irbesartan did not move circulating
  TGF-beta at all, no TGF-beta-lowering agent has ever had bone length measured in a normal animal, and the
  one unexplored lead inside the mechanism paper points AWAY from its own available compounds
aliases:
- round 288
- AIMS holds the growth data
- the perichondrial axis taken apart
- KDM5A points the wrong way
- mullen2019
type: hypothesis
layer: L1
stub: false
summary: >-
  WHY THIS AXIS AND NOT THE OTHER THREE. Of HHIP, the perichondrial TGF-beta axis, SCUBE3 and the NPR3
  clearance blocker, this is the only one with an APPROVED, CHEAP, ORAL, PAEDIATRICALLY DOSED MOLECULE
  already sitting next to an unmeasured endpoint. HHIP has the better biology and no compound at all. So this
  one was taken apart first, and the result is mixed in a way worth stating precisely rather than either
  promoting or killing.

  ONE - THE ATLAS'S OWN STRUCTURAL CLAIM IS WRONG, AND IT WAS AN ASSERTION ABOUT THE LITERATURE THAT NOBODY
  QUERIED. Gap g_l1arch_019 records: "there is no placebo arm anywhere in the Marfan literature because
  withholding aortic protection is not ethical, so the effect of this axis on human growth may never be
  measurable by a randomised design. That is a structural limit on the question, not a gap that more work
  closes." THAT IS FALSE. pitcher2022's individual patient data meta-analysis identifies SEVEN randomised
  trials and 1442 patients, of which FOUR TRIALS AND 676 PARTICIPANTS COMPARED AN ARB AGAINST CONTROL -
  placebo or open control. Named: Ghent Marfan (placebo), Marfan Sartan (randomised, double-blind,
  placebo-controlled, age 10 and over), COMPARE (open control), and AIMS.

  TWO - AND AIMS IS THE ONE THAT MATTERS, BECAUSE IT IS PLACEBO-CONTROLLED AND FULL OF GROWING CHILDREN.
  mullen2019: 192 participants AGED 6 TO 40, MEDIAN AGE 18 WITH INTERQUARTILE RANGE 12 TO 28, randomised
  double-blind to irbesartan or matching placebo, FOLLOWED FOR UP TO FIVE YEARS at 22 UK centres. The authors
  list among the study's strengths "a robust double-blind design with use of a placebo control" and "HIGH
  PROPORTIONS OF CHILDREN".
  HEIGHT WAS RECORDED AT ENTRY - the paper says so explicitly. AND IT MUST HAVE BEEN RECORDED SERIALLY: the
  trial reports aortic Z scores "based on aortic sinus diameter and BODY SURFACE AREA" measured annually, and
  states that its findings held for measurements "which take somatic growth over time into account". BODY
  SURFACE AREA IS COMPUTED FROM HEIGHT AND WEIGHT. You cannot produce an annual BSA-adjusted Z score across
  five years in a growing cohort without annual height. THE DATA EXISTS. NOBODY HAS ANALYSED IT FOR GROWTH -
  a search for any AIMS skeletal or height secondary publication returns nothing. And pitcher2022's
  consortium explicitly requested PHYSICAL MEASUREMENTS from every contributing trial, so the pooled
  resource plausibly holds serial height on all 1442.

  THREE - AND THEN THE FINDING THAT CUTS THE OTHER WAY, FROM THE SAME PAPER. AIMS measured the biomarker:
  "TGF-beta concentrations from baseline to 1 year for 99 patients DID NOT DIFFER between groups". THE DRUG
  DID NOT MOVE THE THING THE MECHANISM IS ABOUT. That is a serious problem for reading any ARB trial as a
  test of this axis, and it has to be stated before the growth data is requested rather than after.
  THERE IS A DEFENCE AND IT IS NOT A GOOD ENOUGH ONE ON ITS OWN. sedes2022's mechanism is entirely LOCAL -
  fibrillin-1 in the OUTER PERICHONDRIUM sequestering LTBP-3 and LTBP-4, with reduced phospho-Smad2 in that
  tissue - and circulating TGF-beta in serum is not the perichondrial matrix pool. An angiotensin-receptor
  blocker modulates TGF-beta EXPRESSION indirectly through AT1 signalling; it does not touch matrix
  sequestration. So a serum null does not exclude a local effect. But it also means AN ARB IS A POOR PROBE OF
  THIS AXIS, and a growth null from AIMS would be substantially less informative than a growth positive.

  FOUR - THE ANIMAL SIDE IS EMPTY, AND SEARCHED THIS ROUND RATHER THAN ASSUMED. No angiotensin receptor
  blocker, no ACE inhibitor, no TGF-beta neutralising antibody, no ALK5 inhibitor and no Smad3 inhibitor has
  ever been given to a normal growing animal with BONE LENGTH as an endpoint. The skeletal TGF-beta
  pharmacology literature is entirely about bone MASS - anti-TGF-beta treatment increasing bone mass and
  strength, constitutively active TGF-beta receptor promoting cortical and cancellous bone formation. MASS,
  NOT LENGTH, EVERY TIME.
  AND chen2015 IS WORSE THAN A SIMPLE OMISSION, WHICH MAKES IT BETTER AS AN ARGUMENT. It gave losartan to
  WILD-TYPE mice and the drug DID change the growth plate - total plate length unchanged, resting and
  proliferative zones unchanged, and the POST-PROLIFERATIVE ZONE EXPANDED. So the compound reaches a normal
  growth plate and produces a measurable, zone-specific pharmacodynamic effect there. The animals were in
  hand, the plate had responded, and the caliper was never picked up.

  FIVE - THE UNEXPLORED LEAD INSIDE THE MECHANISM PAPER, AND ITS DIRECTION IS THE OPPOSITE OF WHAT I
  EXPECTED. sedes2022's RNA-seq of laser-captured fibrillin-1-deficient perichondrium returned TGF-beta
  signalling predicted DOWN and KDM5A PREDICTED UP as the joint top dysregulated pathways, and the authors
  wrote that "KDM5A contribution to bone lengthening was not further explored in this study". KDM5A is an
  H3K4me3 DEMETHYLASE, and CLAUDE.md's live frontier already carries the H3K4me3 arm as open with the note
  that no KDM5 or H3K4 intervention has any bone length endpoint in any species. TWO INDEPENDENT LINES OF
  THIS FILE POINT AT THE SAME ENZYME FAMILY.
  BUT THE SIGN IS WRONG FOR THE AVAILABLE CHEMISTRY. The LONG-BONE state has KDM5A activity predicted UP.
  Every KDM5 compound that exists - CPI-455, PBIT, KDM5-C70 - is an INHIBITOR, which moves the axis AWAY from
  the overgrowth state. Reproducing the phenotype would need KDM5A ACTIVATION, for which there is no chemical
  matter. A KDM5 search this round returned 3843 records and NOT ONE with a bone length endpoint, so the
  frontier item stands - but it stands as an untestable direction, not a shelf-ready one.

  SIX - SO THE HONEST VERDICT, AND IT IS NOT THE ONE I WANTED. THE PERICHONDRIAL AXIS HAS THE BEST MECHANISM
  AND THE LARGEST HUMAN NUMBER IN THE FILE AND NO USABLE HANDLE. Mechanism: four conditional deletions with a
  clean chondrocyte-negative control, a side-specific perichondrium-removal experiment from 1998, a precise
  add-back dose of 300 pg/ml that restores normal growth exactly, a route through PTHrP, 7 per cent longer
  bones accruing entirely after birth, and +11.14 cm per allele in 1.45 million humans. Handle: an approved
  drug that does not move the biomarker, one human point estimate of +0.113 cm per year that is not
  significant and comes from an active-comparator trial, no length endpoint in any normal animal, and an
  unexplored epigenetic lead whose compounds point the wrong way.
  WHAT CHANGES IS NOT THE STACK BUT THE STATUS OF THE QUESTION. It moves from "structurally unanswerable" to
  "answerable from data that already exists, with an imperfect probe" - and the two cheapest steps in the
  whole file are now both on this axis: request the AIMS growth data, and put a caliper on the femur of a
  wild-type mouse that chen2015 already dosed.
quantitative:
- parameter: >-
    THE PLACEBO-CONTROLLED PAEDIATRIC TRIAL THIS ATLAS SAID DID NOT EXIST
  value: >-
    AIMS: 192 participants randomised to irbesartan (n=104) or matching PLACEBO (n=88), AGES 6 TO 40, MEDIAN
    AGE 18 (IQR 12-28), 99 (52 per cent) female, 108 (56 per cent) on beta blockers, 22 UK centres, FOLLOWED
    FOR UP TO FIVE YEARS. Height and weight recorded at entry; aortic Z scores computed from BODY SURFACE
    AREA annually, and the authors state their findings held for measures "which take somatic growth over
    time into account". Primary result: aortic root dilatation 0.53 mm/year on irbesartan versus 0.74 on
    placebo, difference -0.22 (95 per cent CI -0.41 to -0.02, p=0.030).
    WIDER FRAME: pitcher2022 identifies SEVEN randomised trials and 1442 patients, of which FOUR TRIALS AND
    676 PARTICIPANTS compared ARB against CONTROL (placebo or open control) - Ghent Marfan, Marfan Sartan,
    COMPARE and AIMS. Mean age in the control-comparator trials 29 (SD 14); in the ARB-versus-beta-blocker
    trials 14 (SD 10)
  unit: participants, age, years of follow-up
  conditions: >-
    mullen2019 for AIMS; pitcher2022 for the trial census. The consortium requested individual patient data
    including PHYSICAL MEASUREMENTS from every contributing trial.
  species: human
  source_ref: mullen2019
  uncertainty: >-
    SERIAL HEIGHT IS INFERRED, NOT STATED. The paper says height was recorded AT ENTRY and reports annual
    BSA-adjusted Z scores across five years; body surface area is a function of height and weight, so annual
    height is required to produce those numbers, but the paper never says so and the appendix has not been
    read. IT IS ALSO POSSIBLE that BSA was carried forward from baseline for adults or updated only from
    weight, which would weaken the inference - that is exactly what the appendix would settle. And no AIMS
    skeletal or growth secondary publication exists; a search returns nothing.
- parameter: >-
    THE DRUG DID NOT MOVE THE BIOMARKER, WHICH IS THE STRONGEST ARGUMENT AGAINST READING ARB TRIALS AS A TEST
    OF THIS AXIS
  value: >-
    In AIMS, circulating TGF-beta concentrations from baseline to 1 year in 99 patients DID NOT DIFFER
    between the irbesartan and placebo groups
  unit: serum TGF-beta, baseline to 1 year
  conditions: mullen2019, appendix p 7, 99 of 192 participants assayed by ELISA.
  species: human
  source_ref: mullen2019
  uncertainty: >-
    CIRCULATING TGF-BETA IS NOT THE PERICHONDRIAL MATRIX POOL, and sedes2022's mechanism is local
    sequestration of LTBP-3 and LTBP-4 by fibrillin-1 in the outer perichondrium with reduced phospho-Smad2
    in that tissue. A serum null therefore does not exclude a local effect, and serum TGF-beta is notoriously
    contaminated by platelet release during sampling. BUT IT DOES MEAN AN ARB IS A POOR PROBE: a growth NULL
    from AIMS would be weakly informative, while a growth POSITIVE would be strong. The asymmetry should be
    declared before the data is requested, not after it is seen.
- parameter: >-
    NO TGF-BETA-LOWERING AGENT HAS EVER HAD BONE LENGTH MEASURED IN A NORMAL GROWING ANIMAL
  value: >-
    Searched this round across angiotensin receptor blockers, ACE inhibitors, TGF-beta neutralising
    antibodies, ALK5 inhibitors and Smad3 inhibitors against bone-length vocabulary: NOT ONE length endpoint
    in a normal animal. The skeletal TGF-beta pharmacology literature is bone MASS - anti-TGF-beta treatment
    increasing bone mass and strength, constitutively active TGF-beta receptor type I promoting cortical and
    cancellous bone formation. AND chen2015 GAVE LOSARTAN TO WILD-TYPE MICE AND THE PLATE RESPONDED: total
    growth plate length unchanged, resting and proliferative zones unchanged, POST-PROLIFERATIVE ZONE
    EXPANDED - a zone-specific pharmacodynamic effect in a normal growth plate, with bone length never
    measured
  unit: presence or absence of a length endpoint
  conditions: Europe PMC, this round; chen2015 already read in full and held in perichondrial_tgfb_restraint.
  species: mouse
  source_ref: chen2015
  uncertainty: >-
    AN ABSENCE-OF-EVIDENCE CLOSURE with the usual limit - a database query does not index every toxicology
    package, and antihypertensives have been given to juvenile animals in regulatory studies where body
    length is sometimes a routine measure that never reaches a paper. What is solid is that no PUBLISHED
    study has the endpoint. The chen2015 observation is the more useful half: it establishes exposure and a
    pharmacodynamic response at the target tissue in a normal animal, which is what makes the missing
    measurement cheap rather than speculative.
- parameter: >-
    THE UNEXPLORED LEAD IN THE MECHANISM PAPER, AND ITS DIRECTION
  value: >-
    RNA-seq of laser-capture-microdissected fibrillin-1-deficient perichondrium returned 1114 genes down and
    529 up, with TGF-beta signalling predicted DOWN and KDM5A PREDICTED UP as joint top dysregulated
    pathways; the authors state that "KDM5A contribution to bone lengthening was not further explored in this
    study". A KDM5 search this round returned 3843 records with NOT ONE bone length endpoint in any species.
    THE OVERGROWTH STATE HAS KDM5A ACTIVITY UP, and every existing KDM5 compound - CPI-455, PBIT, KDM5-C70 -
    is an INHIBITOR, which moves away from that state
  unit: predicted upstream regulator activity; count of records with a length endpoint
  conditions: sedes2022 for the RNA-seq; Europe PMC for the KDM5 search.
  species: mouse
  source_ref: sedes2022
  uncertainty: >-
    "PREDICTED UP" IS PATHWAY-ANALYSIS INFERENCE, NOT A MEASUREMENT - it is an upstream-regulator activity
    call from differential expression, the authors did not validate it, and the sign could invert on
    validation. If it holds, the tractable direction is KDM5A ACTIVATION, for which no chemical matter
    exists, and the available inhibitors are the wrong way round. This is worth recording precisely because
    the obvious move - reach for the KDM5 inhibitor that already exists - would be the wrong direction, and
    this file has made that class of sign error before.
localization:
- 'outer perichondrium: the tissue that carries the effect, and the pool an ARB does not obviously reach'
- 'serum: where AIMS measured TGF-beta and found no drug effect'
human_evidence: direct
human_evidence_note: >-
  Four randomised trials with a true control and 676 participants, one of them placebo-controlled with median
  age 18 and five-year follow-up. No growth endpoint has been analysed in any of them.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The approved agent does not demonstrably lower the relevant TGF-beta pool, the single human growth point
  estimate is +0.113 cm per year and non-significant against an active comparator, and no agent on this axis
  has a bone-length endpoint in any normal animal.
confidence: B
confidence_reason: >-
  The trial census and the AIMS design are documented facts. The inference that AIMS holds serial height is
  strong but not stated in the paper. The mechanism underneath is graded B elsewhere in this file on four
  conditional deletions and a causal add-back. The verdict - good mechanism, no usable handle - is held at B
  because the decisive animal experiment has not been run rather than because it has been run and failed.
claim_grades:
- claim: >-
    The effect of the perichondrial TGF-beta axis on human growth may never be measurable by a randomised
    design, because no placebo arm exists in the Marfan literature.
  grade: X
  basis: >-
    REFUTED, AND IT WAS THIS ATLAS'S OWN CLAIM IN GAP g_l1arch_019. pitcher2022 identifies FOUR TRIALS AND
    676 PARTICIPANTS COMPARING AN ARB AGAINST CONTROL - Ghent Marfan and Marfan Sartan placebo-controlled,
    COMPARE open control, and AIMS placebo-controlled. AIMS enrolled AGES 6 TO 40 with MEDIAN AGE 18 (IQR
    12-28), followed for up to five years, and its authors cite "high proportions of children" as a strength.
    An assertion about what the literature contains was made without querying it - failure mode four.
- claim: >-
    Serial height data on randomised, placebo-controlled, growing Marfan patients exists and has never been
    analysed for growth.
  grade: B
  basis: >-
    AIMS recorded height at entry and computed BSA-adjusted aortic Z scores ANNUALLY across five years in a
    cohort with median age 18; body surface area is a function of height and weight, so annual height is
    required to produce those numbers. No AIMS skeletal or growth secondary publication exists. pitcher2022's
    consortium requested PHYSICAL MEASUREMENTS from all seven trials. Held at B and not A because the serial
    measurement is INFERRED from the Z-score methodology rather than stated, and the appendix has not been
    read.
- claim: >-
    An ARB trial is a good test of the perichondrial fibrillin-LTBP-TGF-beta axis.
  grade: X
  basis: >-
    NO. AIMS measured circulating TGF-beta in 99 patients from baseline to one year and found NO DIFFERENCE
    between irbesartan and placebo. The drug did not move the biomarker. sedes2022's mechanism is local
    matrix sequestration in the outer perichondrium, which serum does not report on and which an AT1-receptor
    blocker has no established route to - so a growth null would be weakly informative while a growth
    positive would be strong. That asymmetry is declared here, before the data is requested.
- claim: >-
    Lowering TGF-beta pharmacologically increases bone length in a normal animal.
  grade: E
  basis: >-
    STILL NEVER TESTED, AND NOW SEARCHED ACROSS THE WHOLE CLASS - angiotensin receptor blockers, ACE
    inhibitors, TGF-beta neutralising antibodies, ALK5 inhibitors, Smad3 inhibitors. Not one bone-length
    endpoint in a normal growing animal; the entire skeletal literature for these agents is bone MASS. AND
    chen2015 SHOWS THE COMPOUND REACHES THE TARGET: losartan in wild-type mice left total plate length,
    resting and proliferative zones unchanged and EXPANDED THE POST-PROLIFERATIVE ZONE. Exposure and a
    zone-specific pharmacodynamic response are established in a normal animal; only the caliper is missing.
- claim: >-
    A KDM5 inhibitor is the tractable handle on sedes2022's unexplored epigenetic lead.
  grade: X
  basis: >-
    THE SIGN IS THE WRONG WAY ROUND. KDM5A was predicted UP in the fibrillin-deficient, LONG-BONE
    perichondrium, so reproducing the phenotype requires KDM5A ACTIVATION. Every KDM5 compound in existence -
    CPI-455, PBIT, KDM5-C70 - is an inhibitor and moves away from the overgrowth state. This is recorded
    because the obvious reach, for the tool compound that exists, would be the wrong direction. The frontier
    item stands: 3843 KDM5 records, zero bone-length endpoints in any species.
- claim: >-
    The perichondrial axis is a usable addition to this stack.
  grade: X
  basis: >-
    NOT ON PRESENT EVIDENCE, AND THE HONEST STATEMENT IS THAT IT HAS THE BEST MECHANISM AND THE LARGEST HUMAN
    NUMBER IN THE FILE AND NO USABLE HANDLE. The approved agent does not move the biomarker; the one human
    growth point estimate is +0.113 cm per year, non-significant, against an active comparator; the animal
    length experiment has never been run; and the unexplored epigenetic lead points away from its own
    compounds. What the round changes is the status of the question, not the stack.
key_refs:
- ref_id: mullen2019
  pmid: '31836196'
  year: 2019
  type: primary
  one_line_finding: >-
    AIMS - irbesartan versus PLACEBO in 192 people aged 6 to 40, median 18, for up to five years with high
    proportions of children, computing BSA-adjusted Z scores annually and therefore necessarily holding
    serial height - and reporting that circulating TGF-beta did not differ between groups at one year
- ref_id: pitcher2022
  pmid: '36049495'
  year: 2022
  type: meta_analysis
  one_line_finding: >-
    Seven randomised Marfan trials and 1442 patients, of which FOUR trials and 676 participants compared ARB
    against a true CONTROL - which refutes this atlas's claim that no control arm exists - with physical
    measurements requested from every trial
- ref_id: sedes2022
  pmid: '35567544'
  year: 2022
  type: primary
  one_line_finding: >-
    The mechanism, and the unexplored lead inside it - KDM5A predicted UP as a joint top dysregulated pathway
    in the fibrillin-deficient perichondrium, which the authors explicitly did not pursue
- ref_id: chen2015
  year: 2015
  type: primary
  one_line_finding: >-
    Losartan in WILD-TYPE mice expands the post-proliferative zone with total plate length and the resting and
    proliferative zones unchanged - exposure and a zone-specific response in a normal growth plate, with bone
    length never measured
- ref_id: robertson2023
  year: 2023
  type: primary
  one_line_finding: >-
    The only human growth point estimate on this axis - Pediatric Heart Network, 608 growing Marfan patients,
    height velocity +0.113 cm/year on losartan versus atenolol, p about 0.69, with height and body proportions
    prespecified secondary outcomes
contradicts: >-
  DIRECTLY REFUTES A CLAIM THIS ATLAS MADE IN GAP g_l1arch_019 - that no placebo arm exists anywhere in the
  Marfan literature and that the effect of this axis on human growth may therefore never be measurable by a
  randomised design. pitcher2022 identifies four randomised trials and 676 participants comparing an ARB
  against a true control, and mullen2019's AIMS is placebo-controlled, enrolled from age 6 with a median age
  of 18, ran five years, and computed BSA-adjusted Z scores annually.
  It also SHARPENS rather than overturns perichondrial_tgfb_restraint: the mechanism is untouched, but AIMS's
  own finding that irbesartan did not change circulating TGF-beta means that an ARB is a poor probe of the
  axis, and sedes2022's KDM5A lead points away from the compounds that exist for that family.
builds_on: round287_the_whole_table_run_and_the_layer_it_points_at_is_one_this_atlas_never_named
