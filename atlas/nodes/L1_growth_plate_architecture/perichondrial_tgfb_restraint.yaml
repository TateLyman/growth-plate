id: perichondrial_tgfb_restraint
name: Perichondrial fibrillin-LTBP-TGF-beta restraint on long bone length
aliases:
- outer perichondrium TGF-beta axis
- fibrillin-1 restraint of longitudinal growth
- Marfan long bone overgrowth mechanism
type: process
layer: L1
stub: false
summary: 'Long bone length is set in part from OUTSIDE the growth plate, by the outer layer of the
  perichondrium, through a fibrillin-1 / latent-TGF-beta-binding-protein / TGF-beta / Smad2 module that
  RESTRAINS elongation. Removing the restraint lengthens the bone and restoring it shortens it again.
  This is the mechanism behind the most conspicuous feature of Marfan syndrome - disproportionate tall
  stature - and until 2022 essentially nobody had worked on it, because the field''s effort went to the
  aorta. Sedes and colleagues used Cre-LoxP with metatarsal organ culture to localise the responsible
  tissue to the OUTER PERICHONDRIUM, not the growth plate itself: fibrillin-1 deficiency there is
  accompanied by decreased accumulation of LTBP-3 and LTBP-4 and reduced phosphorylated Smad2, so the
  signalling change is LOSS of TGF-beta activity rather than the excess that the cardiovascular Marfan
  literature made famous. Mutant metatarsals grew LONGER in vitro and released LESS TGF-beta, and adding
  recombinant TGF-beta1 back NORMALISED their linear growth. That add-back is the causal step, and it
  fixes the sign: LESS TGF-BETA MEANS A LONGER BONE. The rest of the pathway is consistent. TGF-beta via
  Smad3 represses terminal hypertrophic differentiation, and Smad3-null mice show enhanced terminal
  differentiation of growth plate chondrocytes, so lowering TGF-beta releases the brake on hypertrophy.
  Losartan, an approved angiotensin receptor blocker used in Marfan precisely to lower this axis,
  produces an ELONGATED HYPERTROPHIC ZONE with raised Col10a1 and minimal change in proliferation when
  given to wild-type mice. Fibrillin microfibrils are present throughout the plate, with fibrillin-1
  more abundant in the resting and proliferative zones than the hypertrophic zone. THE AXIS IS
  BIDIRECTIONAL AND THAT IS THE CENTRAL CAUTION: FBN1 mutations cause tall stature in Marfan and SHORT
  stature in Weill-Marchesani, acromicric and geleophysic dysplasia, so the gene does not have a
  direction - alleles do, exactly as for FGFR3. What is not established is the step everyone will want
  to assume: no study has shown that lowering this axis increases BONE LENGTH in a normal animal.
  chen2015 measured hypertrophic zone height and bone mass, not length, and an elongated hypertrophic
  zone is equally consistent with slower clearance at the chondro-osseous junction.'
quantitative:
- parameter: tissue responsible for long bone overgrowth in Marfan mice
  value: the outer layer of the perichondrium
  unit: qualitative, tissue-level localisation
  conditions: Cre-LoxP conditional inactivation of Fbn1 combined with metatarsal bone organ culture,
    mouse model of Marfan syndrome
  species: mouse
  source_ref: sedes2022
  uncertainty: 'THE LOCALISATION IS THE FINDING: the tissue that sets the overgrowth is NOT the growth
    plate but the layer wrapped around it, which means a purely intra-plate account of Marfan tall
    stature is wrong. Organ culture plus conditional genetics; no in vivo limb-length series is reported
    in the abstract, and the full text has not been obtained.'
- parameter: direction of the TGF-beta change in fibrillin-1-deficient perichondrium
  value: decreased LTBP-3 and LTBP-4 accumulation with reduced phosphorylated Smad2
  unit: qualitative, immunohistochemistry
  conditions: outer perichondrium of Fbn1-deficient mice
  species: mouse
  source_ref: sedes2022
  uncertainty: 'THIS IS LOSS OF TGF-BETA SIGNALLING, NOT EXCESS, and it runs against the account most
    readers will bring from the aortic Marfan literature, where excess TGF-beta is the standard story.
    The two need not conflict - different tissue, different LTBP complement - but any argument that
    imports the aortic direction into bone is importing the wrong sign.'
- parameter: effect of restoring TGF-beta on mutant bone elongation
  value: recombinant TGF-beta1 normalised the linear growth of mutant metatarsals
  unit: qualitative rescue
  conditions: Fbn1-deficient mouse metatarsals in organ culture, which grew longer and released less
    TGF-beta than wild-type before the add-back
  species: mouse
  source_ref: sedes2022
  uncertainty: 'THE CAUSAL STEP AND THE ONE THAT FIXES THE SIGN. A correlation between low TGF-beta and
    long bones could run either way; an add-back that normalises growth cannot. LESS TGF-BETA MEANS A
    LONGER BONE in this system. Limits that matter: organ culture rather than a whole animal,
    metatarsals rather than a major long bone, recombinant protein at a chosen concentration, and no
    dose-response reported in the abstract.'
- parameter: effect of losartan on the growth plate of normal mice
  value: elongated hypertrophic zone with increased Col10a1 and minimal change in proliferation
  unit: qualitative histomorphometry
  conditions: wild-type mice treated with losartan in utero from conception to 1 day of age; a separate
    cohort treated from birth to 6 weeks gave trabecular BV/TV +98% and cortical thickness +9% through
    reduced osteoclastogenesis
  species: mouse
  source_ref: chen2015
  uncertainty: 'READ THE ENDPOINT CAREFULLY. This paper measured hypertrophic zone HEIGHT and bone MASS.
    IT DID NOT MEASURE BONE LENGTH. An elongated hypertrophic zone is equally consistent with faster
    hypertrophy and with slower clearance at the chondro-osseous junction, and those have opposite
    consequences for elongation - hunziker1989 and wilsman1996 both turn on exactly that distinction. So
    this row establishes that an approved drug reaches the growth plate and changes it, and establishes
    nothing about height.'
- parameter: direction of TGF-beta/Smad3 action on terminal hypertrophic differentiation
  value: repression
  unit: qualitative
  conditions: Smad3 exon 8 targeted disruption in mouse; growth plate chondrocytes examined shortly
    after weaning, plus embryonic metatarsal rudiment culture with TGF-beta1
  species: mouse
  source_ref: yang2001
  uncertainty: 'Smad3-null mice show ENHANCED terminal differentiation of growth plate chondrocytes and
    abnormally increased numbers of collagen X expressing cells, and TGF-beta1 significantly inhibits
    differentiation of wild-type metatarsal rudiments while the inhibition is lost in Smad3-null
    rudiments. So the brake is real and Smad3-dependent. The same mice develop degenerative joint
    disease resembling osteoarthritis, which is the standing cost of removing this brake and is not a
    side note.'
- parameter: distribution of fibrillin microfibrils across growth plate zones
  value: fibrillin-1 more abundant in resting and proliferative zones than hypertrophic; fibrillin-2
    highest in the calcified region
  unit: qualitative immunolocalisation
  conditions: calf metacarpal and vertebral growth plate, dual immunostaining of fibrillin-1 with
    elastin, with fibrillin-2, and with collagen X
  species: bovine
  source_ref: yu2013
  uncertainty: 'No elastin fibres were found in either the proliferative or hypertrophic zone, so these
    are microfibrils acting without elastin - consistent with a growth-factor-sequestering rather than
    an elastic role, though the authors note a mechanical role is also possible. The zonal pattern puts
    fibrillin-1 where the cells are still cycling rather than where they enlarge.'
- parameter: stature direction of FBN1 mutations in humans
  value: tall in Marfan; SHORT in Weill-Marchesani, acromicric dysplasia and geleophysic dysplasia
  unit: qualitative, opposite directions from one gene
  conditions: human clinical genetics, as summarised in the context of fibrillin microfibril
    organisation in the growth plate
  species: human
  source_ref: yu2013
  uncertainty: 'THE REASON NO SCREEN MAY EVER ASSIGN A DIRECTION TO THIS GENE. FBN1 behaves like FGFR3:
    the gene is implicated in stature in both directions and only the allele carries a sign. Any
    therapeutic reasoning that treats FBN1 or its pathway as directionally "pro-growth" because Marfan
    patients are tall is making the error target_screen.py was rebuilt to prevent.'
localization:
- 'outer perichondrium: the tissue that carries the overgrowth (sedes2022)'
- 'growth plate resting and proliferative zones: where fibrillin-1 is most abundant (yu2013)'
- 'hypertrophic zone: where the losartan-induced change appears (chen2015)'
human_evidence: indirect
human_evidence_note: The human evidence is the phenotype only - disproportionate tall stature is the
  most evident manifestation of Marfan syndrome, and homocystinuria reaches the same axis by modifying
  fibrillin-1 chemically with a measured height excess of about 1 SD and a 7.97 cm within-disease
  difference by exposure duration. No human study has measured perichondrial TGF-beta signalling, and no
  trial has reported height as an outcome of lowering this axis.
species_basis:
- mouse
- bovine
- human
translation_risk: high
translation_risk_reason: The causal chain is mouse organ culture; the human end is a syndrome phenotype.
  The one approved drug that lowers this axis has been given to growing mice and to growing children
  without long bone length being the reported endpoint in either.
confidence: C
confidence_note: 'C rather than B because the load-bearing experiment - TGF-beta1 add-back normalising
  mutant metatarsal growth - is a single organ-culture result read from an abstract, and the full text
  has not been obtained. C rather than D because the direction is supported independently by three
  further sources: Smad3-null enhanced terminal differentiation, losartan elongating the hypertrophic
  zone, and the human Marfan phenotype itself.'
