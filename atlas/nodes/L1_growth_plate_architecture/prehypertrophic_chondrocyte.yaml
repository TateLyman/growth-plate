id: prehypertrophic_chondrocyte
name: Prehypertrophic chondrocyte
aliases:
- maturing chondrocyte
- PHZ chondrocyte
type: cell_type
layer: L1
stub: false
summary: 'Prehypertrophic chondrocytes are post-mitotic cells that have committed to terminal differentiation
  but have not yet begun the swelling phase of enlargement. Quantitatively they occupy phase 1 of the
  enlargement trajectory: in mouse they roughly triple their volume from about 600 fl to about 2000 fl
  while holding dry mass density at the normal 0.183 pg/fl, so this is genuine biosynthetic hypertrophy
  with proportionate increase in macromolecular content, not fluid uptake. The transition out of this
  state is the growth-rate determining decision, because whether a cell goes on to complete phase 2 swelling
  and the IGF-dependent phase 3 determines its final volume and therefore its contribution to elongation.
  Structurally, unbiased stereological stratification is required to place the boundary, because the morphological
  transition is gradual; the marker-based definition (Indian hedgehog, PTH1R) that is used routinely is
  murine and has no validated human counterpart.'
