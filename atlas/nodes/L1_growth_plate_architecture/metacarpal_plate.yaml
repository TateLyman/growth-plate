id: metacarpal_plate
name: Metacarpal and metatarsal growth plate
aliases:
- metacarpal physis
- metatarsal physis
- pseudoepiphysis
type: tissue_structure
layer: L1
stub: false
summary: 'Metacarpals and metatarsals are architecturally unusual: unlike other long bones they carry
  a functional growth plate at one end only, with the opposite end forming a pseudoepiphysis or none at
  all. The PTHrP/Ihh feedback loop has been shown to explain this asymmetric architecture, and the same
  logic applies to the pisiform. This makes these bones a natural experiment for the question of what
  determines where a growth plate forms and how many a bone gets. Metatarsals are also the element in
  which the mechanism of evolutionary limb elongation has been localised most precisely: in the jerboa,
  whose metatarsals are about 2.5 times longer in relative proportion than the mouse''s, hypertrophic
  chondrocytes reach about 23,000 fl against about 8000 fl in mouse, and individual hypertrophic cell
  height is 58% greater, achieved by extending the IGF-dependent third phase of enlargement that the mouse
  metatarsal truncates. Human metacarpal physeal growth rates have not been reported in the sources reviewed
  here; metacarpophalangeal pattern profiles are used clinically to characterise short stature but describe
  final proportions, not growth plate kinetics.'
