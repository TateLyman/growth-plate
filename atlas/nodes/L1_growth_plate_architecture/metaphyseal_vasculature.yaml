id: metaphyseal_vasculature
name: Metaphyseal vasculature
aliases:
- metaphyseal capillary loops
- vascular invasion front
type: tissue_structure
layer: L1
stub: false
summary: The metaphyseal vasculature terminates in blind capillary loops that abut the last transverse
  septum of each chondrocyte column and advance as that septum is removed. Scanning electron microscopy
  of vascular casts shows the invading capillary ends are morphologically varied rather than uniform,
  and serial-section analysis shows the endothelium penetrates the non-calcified pericellular and territorial
  matrix specifically, not the mineralised longitudinal septa. The advancing tips are physically associated
  with FABP5+ septoclasts, which in mouse require endothelial Dll4 for their specification, making the
  vessel the organiser of its own path through cartilage. In the metaphysis proper the vessels are type
  H capillaries, a CD31-high/endomucin-high subtype that is enriched near the growth plate, surrounds
  osteoprogenitors and declines with age. Because vascular invasion sets the rate at which the plate is
  consumed, anything that blocks metaphyseal angiogenesis thickens the hypertrophic zone without increasing
  elongation.
quantitative:
- parameter: morphology of capillary ends at the invasion front
  value: variable, not uniform
  unit: qualitative
  conditions: rat femur, scanning electron microscopy of vascular casts
  species: rat
  source_ref: yamamoto2022
  uncertainty: descriptive
- parameter: matrix compartment penetrated by invading endothelium
  value: non-calcified pericellular and territorial matrix
  unit: qualitative
  conditions: distal hypertrophic zone, Yucatan swine, serial light-microscopic sections
  species: porcine
  source_ref: farnum1989
  uncertainty: descriptive
- parameter: abundance of septoclasts relative to osteoclasts at the chondro-osseous interface
  value: significantly greater
  unit: qualitative
  conditions: 3-week-old mouse femur
  species: mouse
  source_ref: sivaraj2022
  uncertainty: n = 6 animals
localization:
