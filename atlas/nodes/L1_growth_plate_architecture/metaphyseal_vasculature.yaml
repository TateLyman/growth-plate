- 'human metaphysis: RANK+ chondro/osteoclasts quantified by zone (walzer2014)'
human_evidence: indirect
human_evidence_note: Human metaphyseal vessels and RANK+ resorptive cells have been quantified by zone
  in polydactylous digit specimens (walzer2014), but the invasion-front cell biology is entirely rodent.
