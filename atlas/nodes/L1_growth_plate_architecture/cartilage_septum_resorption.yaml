id: cartilage_septum_resorption
name: Cartilage septum resorption
aliases:
- septal resorption
- transverse septum breakdown
type: process
layer: L1
stub: false
summary: Removal of cartilage at the metaphyseal face is selective, not wholesale. The transverse septa
  separating successive chondrocytes in a column are removed to open a channel for the capillary bud,
  while the mineralised longitudinal septa are preserved and become the cores of the primary spongiosa
  trabeculae. Serial-section analysis in swine shows that invading endothelial cells penetrate the non-calcified
  pericellular and territorial matrix compartments specifically, which explains the geometric selectivity.
  In rodents the executing cell is the septoclast, a cathepsin-B-rich, FABP5+ mesenchymal cell whose differentiation
  depends on endothelial Dll4 and whose transcriptional programme includes Ctsb and Mmp13; osteoclasts
  are present but sparse at this interface. The rate of septal removal must equal the rate of chondrocyte
  production for the plate to hold constant height, and in rat that means one cell per column every three
  hours. In human tissue, septal thickness has been measured across age - it increases from birth to adolescence
  in rib - but the resorbing cell has never been identified.
