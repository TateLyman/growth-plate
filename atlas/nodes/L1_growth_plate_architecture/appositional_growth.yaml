id: appositional_growth
name: Appositional (circumferential) growth
aliases:
- latitudinal growth
- radial growth
- periosteal apposition
type: process
layer: L1
stub: false
summary: 'Appositional growth widens a bone, in contrast to the longitudinal growth generated by the physis.
  Two distinct processes contribute: periosteal bone apposition on the outer cortex, which thickens the
  diaphysis, and latitudinal enlargement of the cartilaginous plate itself, to which the groove of Ranvier
  supplies cells at the plate margin. The two modes are quantitatively separable in mouse by micro-CT:
  measuring the equivalent radius of the chondro-osseous junction against its axial displacement gives
  an expansion-to- elongation ratio that falls from 0.18 (distal femur) and 0.16 (proximal tibia) at E17.5-E18.5
  to 0 and 0.04 respectively by P32-P40. In other words, embryonic bones widen almost a fifth as fast
  as they lengthen, and postnatal bones essentially stop widening at the plate while continuing to elongate.
  The same study connects this to cellular architecture: embryonic clones are mostly orthogonally oriented
  clusters and postnatal ones are mostly columns, suggesting that whether the division plane rotation
  is completed determines whether a clone contributes to widening or to lengthening.'
quantitative:
- parameter: expansion-to-elongation ratio
  value: '0.18'
  unit: dimensionless ratio
  conditions: mouse distal femur, E17.5-E18.5, micro-CT of registered bones
  species: mouse
  source_ref: rubin2024
  uncertainty: computed from equivalent radius change over elongation
- parameter: expansion-to-elongation ratio
  value: '0.16'
  unit: dimensionless ratio
  conditions: mouse proximal tibia, E17.5-E18.5
  species: mouse
  source_ref: rubin2024
  uncertainty: as above
- parameter: expansion-to-elongation ratio
  value: '0'
  unit: dimensionless ratio
  conditions: mouse distal femur, P32-P40
  species: mouse
  source_ref: rubin2024
  uncertainty: expansion negligible relative to elongation
- parameter: expansion-to-elongation ratio
  value: '0.04'
  unit: dimensionless ratio
  conditions: mouse proximal tibia, P32-P40
  species: mouse
  source_ref: rubin2024
  uncertainty: non-monotonic decrease seen in proximal fibula and distal tibia
localization:
- 'mouse: quantified across eight growth plates and three time windows (rubin2024)'
- 'rabbit: groove of Ranvier as the source of latitudinal cells (shapiro1977)'
- 'human: not quantified separately from total bone width'
human_evidence: absent
human_evidence_note: No human study separates plate latitudinal enlargement from periosteal apposition
  quantitatively; human data exist only for total bone width.
species_basis:
- mouse
- rabbit
translation_risk: high
translation_risk_reason: The expansion-to-elongation ratios are mouse micro-CT values and the cellular
  explanation is mouse clonal analysis; nothing equivalent has been measured in human bone.
confidence: C
