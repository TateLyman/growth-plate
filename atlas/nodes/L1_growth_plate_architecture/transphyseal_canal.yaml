type: tissue_structure
layer: L1
stub: false
summary: 'Transphyseal canals are channels that cross the growth plate from metaphysis to epiphysis, breaching
  what is otherwise treated as an avascular barrier. In the human distal femur a distinct anatomical entity,
  the intercondylar transphyseal complex, has been described and characterised: cartilage and vascular
  channels that traverse the physis in the intercondylar region and provide a route by which metaphyseal
  osteosarcoma extends into the epiphysis. This matters because the physis has traditionally been taught
  as a tumour and infection barrier, and the existence of a constant transphyseal route reframes both
  oncological staging and the pathogenesis of transphyseal haematogenous osteomyelitis in children. In
  young children before the secondary ossification centre matures, transphyseal vessels are also the route
  by which the epiphysis receives blood, which is the anatomical basis for epiphyseal osteonecrosis after
  septic arthritis or vascular injury. The human quantitative anatomy - number, diameter and age-dependence
  of these channels - is essentially unmapped outside the single distal femoral study.'
