id: metaphyseal_funnelization
name: Metaphyseal funnelisation
aliases:
- funnelization
- metaphyseal remodelling
- metaphyseal cutback
type: process
layer: L1
stub: false
summary: 'Funnelisation is the narrowing of the flared metaphysis into the tubular diaphysis as the growth
  plate advances away from it. Because the plate deposits bone at its own full diameter, every increment
  of elongation leaves behind a segment that is too wide for the diaphysis; osteoclastic resorption on
  the outer metaphyseal cortex removes the excess. The rate at which funnelisation must operate is therefore
  set by the plate: it equals the product of the elongation rate and the difference between plate diameter
  and diaphyseal diameter. In mouse the width the process must handle is quantified by the expansion-to-elongation
  ratio, which falls to near zero postnatally, meaning that in older animals almost all the metaphyseal
  reshaping burden comes from the historical width laid down earlier rather than from continuing widening.
  Failure of funnelisation produces the Erlenmeyer-flask metaphysis of osteopetrosis and storage disorders,
  which is the clinical demonstration that this is an osteoclast-dependent process separable from the
  plate itself. No study has measured a funnelisation rate in human bone against a simultaneously measured
  physeal elongation rate.'
quantitative:
- parameter: expansion-to-elongation ratio setting the funnelisation burden
  value: 0.16-0.18 (embryonic) falling to 0-0.04 (P32-P40)
  unit: dimensionless ratio
  conditions: mouse distal femur and proximal tibia
  species: mouse
  source_ref: rubin2024
  uncertainty: as reported
localization:
- 'mouse metaphysis: expansion quantified (rubin2024)'
- 'human metaphysis: failure phenotypes described clinically; rate not measured'
human_evidence: indirect
human_evidence_note: Human evidence is the radiographic phenotype of failed funnelisation in osteoclast
  disorders; no human study measures funnelisation rate against physeal elongation.
species_basis:
- mouse
- human
translation_risk: moderate
translation_risk_reason: The process is unambiguous in humans from disease phenotypes, but every quantitative
  parameter available is murine.
confidence: C
