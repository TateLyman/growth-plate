id: round311_the_crispr_screen_is_unblocked_and_its_blind_spot_is_the_atlas_own_lead_layer
name: ROUND 311 - the genome-wide CRISPR screen of chondrocyte maturation is UNBLOCKED, its sign convention calibrated
  on nine controls, and it answers a question the atlas has never been able to ask - which genes set the PERIOD.
  Its informative direction is ACCELERATION, which makes it a CONTRAINDICATION screen; and the genes it cannot see
  are exactly the secreted extracellular layer the atlas's two best leads live in, which it proves by reporting
  the inside nodes of hedgehog and missing the outside one
