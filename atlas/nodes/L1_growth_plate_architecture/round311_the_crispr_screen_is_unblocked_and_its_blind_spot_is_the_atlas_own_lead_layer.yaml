claim_grades:
- claim: A PDE3 inhibitor HAS a bone-length endpoint in a normal animal, and this atlas repeatedly said it did not.
  grade: B
  basis: 'kawabe2025 dosed juvenile wild-type C57BL/6 mice with cilostazol 10 mg/kg/day IP for 4 weeks from weaning
    and measured naso-anal length 93.6 +/- 0.3 mm vehicle against 95.3 +/- 0.5 mm treated, with expanded tibial
    growth plates and enlarged alcian-blue matrix area; ex vivo, four PDE3 inhibitors elongated cultured bone while
    PDE2 and PDE10 inhibitors did not. CLAUDE.md asserted the opposite in rounds 304, 308, 309 and 310 while the
    paper sat in the uploads from 2026-08-08 and in this atlas''s own gaps file under kawabe2025. GRADE B not A:
    4 weeks from weaning with length taken at the end of dosing, not at skeletal maturity, so a permanent gain and
    a temporary acceleration are not separated.'
  species: mouse
  source_ref: kawabe2025
- claim: PDE3 inhibition is occluded by the CNP arm, demonstrated directly on bone length rather than inferred.
  grade: B
  basis: kawabe2025's mechanism is cGMP-PKG-BK channel-TRPM7-CaMKII, which is the vosoritide arm, not the cAMP arm
    the atlas assumed for five rounds. Its combination experiment adds cilostazol to a moderate CNP concentration
    (10 nM) and gets further outgrowth, and to a submaximal one (30 nM) and gets nothing; the authors conclude the
    two drive a common axis. This is the hakata2024 structure that eliminated sacubitril and the argument that demoted
    the NPR3 clearance blocker, now measured once rather than inferred three times. It CONFIRMS round 310's closure
    of PDE3 for this stack by an independent route, and it makes the general claim that the cGMP arm saturates.
  species: mouse
  source_ref: kawabe2025
- claim: 'The GSE225878 sign convention is resolved: positive log fold change means the knockout matures early.'
  grade: A
  basis: baronas2023 states the design - sorting on the maturation marker CD-200, top and bottom deciles, thresholds
    +0.57 mature and -0.63 immature - and nine control genes agree. Pth1r and Npr2, the two textbook brakes on hypertrophic
    differentiation, both score positive; Sox9 and Runx2, both required for the programme, score negative; and Sufu,
    Ptch1, Eed, Ezh2 and Suz12 reproduce the paper's own named results at -log10p 6.5 to 10.8. CORR-296's prohibition
    is lifted for this dataset and remains in force for chu2026.
  species: mouse
  source_ref: baronas2023
- claim: The screen cannot see the extracellular morphogen-availability layer, and it proves this on hedgehog.
  grade: A
  basis: 'In the screened cells Hhip is at 0.10 CPM, Ihh 1.31, Nppc 0.00, Loxl2 0.20, Nrk 1.30 - none transcribed
    - while Ptch1 (142.6), Smo (165.7) and Sufu (47.8) are. The culture therefore has a hedgehog transduction apparatus
    with no ligand and no secreted antagonist, which is why the ligand-independent brakes Sufu and Ptch1 score enormously
    and Hhip cannot score at all. The nulls on HHIP, NRK and LOXL2 are absence of substrate, not absence of effect,
    and must not be read as refutations. The positive control is FBN1: expressed at 230.7 CPM, not a hit, exactly
    reproducing sedes2022''s finding that deleting Fbn1 from chondrocytes gives no overgrowth because the control
    is extrinsic and perichondrial.'
  species: mouse
  source_ref: gse225879
- claim: Across one pathway, the height effect of removing a hedgehog brake flips sign with depth into the cell.
  grade: B
  basis: HHIP, a SECRETED antagonist, has human pLoF +9.92 cm. PTCH1, the CELL-SURFACE receptor, has human pLoF
    -1.56 cm and its knockout is the strongest accelerator of chondrocyte maturation in this screen (+6.004, -log10p
    9.71, replicating at 10.34). SUFU, INTRACELLULAR, accelerates maturation (+3.628, replicating at 12.00) and
    shortens mouse femur by 21-30% (xiu2022). This is CORR-300 derived a third time and quantified for the first
    time on a single pathway with a human number at each node. PTCH1's -1.56 cm had never been used in this atlas.
    It also puts a cost on the HHIP lead - cell-autonomous hedgehog activation spends the period - which stands
    in tension with haraguchi2025's limb-restricted Hhip1 deletion holding the plate open to 53 weeks, and that
    tension is the secreted-versus-inside distinction itself.
  species: human
  source_ref: kosmicki2026
- claim: cAMP/PKA output sets chondrocyte maturation timing, confirmed causally in both directions.
  grade: C
  basis: 'Gnas knockout, which lowers cAMP, ACCELERATES maturation (+0.995 primary, +3.023 secondary D15 at -log10p
    6.90) and human GNAS pLoF is -9.36 cm with premature epiphyseal closure in Albright hereditary osteodystrophy.
    Prkar1a knockout, which removes the PKA regulatory subunit and raises PKA output, DELAYS maturation (-3.957
    primary D15, -2.291 secondary at 6.47). Two mirror lesions, two mirror results, both replicating. This upgrades
    round 306''s grade-E inference from acrodysostosis type 2''s advanced bone age to a causal genome-wide result.
    It does NOT reopen the axis: round 307''s Jansen''s argument means a delayed plate at high cAMP is CORR-292''s
    jam rather than a period extension, and this assay measures a marker and not a length, so it cannot tell them
    apart. What it specifies is an agent that does not exist - a small, CREB-sparing increment in chondrocyte PKA
    output.'
  species: mouse
  source_ref: gse225878
- claim: The screen is a contraindication screen for this case, not a lever screen.
  grade: B
  basis: 'The delayed direction is confounded three ways - the sorting antigen Cd200 is its rank-1 hit, 34% of it
    is predicted genes and pseudogenes, 22% sits in shared log-fold-change groups indicating one guide cutting many
    paralogues, and most of what survives is proteasome, ribosome, spliceosome and translation machinery. The accelerated
    direction has 1 of 44 flagged by the same filters and carries all the recognisable cartilage biology. Its usable
    output is therefore a list of targets whose inhibition would SPEND the period: EZH2 with approved tazemetostat,
    DOT1L with pinometostat, CSNK2B with silmitasertib, ALDH2 with approved disulfiram, and FKBP1A with seven approved
    drugs including the rapalogs - a second independent line against rapalogs after round 300''s MTOR -3.65 cm.
    The FKBP1A case is weakened by mechanism, since those drugs bind FKBP12 and act through the complex rather than
    deleting it.'
  species: mouse
  source_ref: gse225878
- claim: Four ciliary genes accelerate chondrocyte maturation, which makes round 294's open gate asymmetric.
  grade: D
  basis: 'Fuz +3.656, Wdpcp +3.120, Traf3ip1/IFT54 +3.040 and Pibf1 +2.924 all accelerate maturation on loss. Round
    294 established that an FGFR inhibitor SHORTENS primary cilia in normal mice (AZD4547 x 28 days, P<0.001 in
    all three tissues tested) and left the net effect on the growth plate unmeasured, with two arms of opposite
    sign. This supplies the missing half in the unfavourable direction: less ciliary function, earlier maturation,
    less period. GRADE D and no higher - four genetic nulls are not a drug-induced shortening, a monolayer line
    has different ciliary biology from a plate, and no length was measured. But the subject is wild-type at FGFR3
    and on a pan-FGFR inhibitor, so the gate now leans.'
  species: mouse
  source_ref: gse225878
- claim: Tankyrase does not move maturation timing cell-autonomously - an informative negative, not an absent one.
  grade: C
  basis: Tnks (195.7 CPM) and Tnks2 (231.0 CPM) are both well transcribed in the screened cells and neither reaches
    threshold at either time point. Unlike the nulls on HHIP, NRK and LOXL2, this one is informative. It is consistent
    with rounds 302 and 303 placing tankyrase on the SPIN4 signature - resting-zone pool and rate, the N and lambda
    terms - rather than on the period, and it is a modest datum against anyone reading tankyrase as a period lever.
    The same informative-negative status applies to Tet1 (82.3 CPM) and Amd1 (92.5 CPM).
  species: mouse
  source_ref: gse225878
