summary: "ZERO - THE CORRECTION FIRST, BECAUSE IT IS A LIVE FALSEHOOD IN THIS FILE (CORR-333).\nAcross rounds 304,\
  \ 308, 309 and 310 I wrote that \"no PDE inhibitor of any subtype has a bone-length endpoint\nin any species.\"\
  \ That is FALSE, and the refutation has been in the operator's uploads since 2026-08-08 AND\nin this atlas's own\
  \ gaps file, cited five times under the ref_id kawabe2025.\n`kawabe2025` (British Journal of Pharmacology, \"\
  Phosphodiesterase 3 inhibitors boost bone outgrowth\"):\nCILOSTAZOL, 10 mg/kg/day intraperitoneally for 4 weeks\
  \ from weaning in juvenile WILD-TYPE mice, naso-anal\nlength 93.6 +/- 0.3 mm vehicle against 95.3 +/- 0.5 mm treated.\
  \ Ex vivo, cilostazol 10 microM took cultured\nmetatarsal outgrowth from 120.7 +/- 0.9% to 127.6 +/- 1.2% of starting\
  \ length over 4 days; milrinone,\nanagrelide and olprinone reproduced it, while a PDE2 inhibitor (BAY-60-7550)\
  \ and a PDE10 inhibitor (MP10)\ndid not - a specificity control. CORR-313's rule caught this only because I ran\
  \ the grep; the rule now needs\nits stronger form, which is that a phrase of the form \"no agent in any species\"\
  \ must be grepped against the\ngraph AND against the uploads BEFORE it is written, not after.\n\nZERO-B - AND\
  \ THE SAME PAPER KILLS PDE3 FOR THIS STACK BETTER THAN ROUND 310 DID.\nRound 310 closed PDE3 by arguing its height\
  \ effect is systemic and runs through IGF-1 into the already-spent\nGH arm. That argument stands, but kawabe2025\
  \ supplies a DIRECT experimental kill that needs no inference.\nIts mechanism is NOT cAMP: PDE3B hydrolyses both\
  \ cyclic nucleotides and the paper's chain is\ncGMP -> PKG -> BK-channel phosphorylation -> hyperpolarisation\
  \ -> increased Ca2+ driving force ->\nTRPM7-mediated Ca2+ entry -> CaMKII -> matrix secretion. That is the VOSORITIDE\
  \ ARM.\nAnd the paper ran the additivity experiment. In cultured bone, cilostazol at 10 microM ADDED to a MODERATE\n\
  CNP concentration (10 nM) and had NO EFFECT AT ALL at a SUBMAXIMAL one (30 nM). The authors' own words are\nthat\
  \ cilostazol loses its effect under high-CNP conditions and that CNP and cilostazol drive a common axis.\nThis\
  \ is the `hakata2024` structure that eliminated sacubitril, now measured on bone length rather than\ninferred:\
  \ an agent occluded by the arm this subject is already taking. THREE eliminations - sacubitril\n(round 301), the\
  \ NPR3 clearance blocker (round 302), PDE3 (here) - are now ONE mechanism, and it has been\ndirectly demonstrated\
  \ once.\nCONTRADICTION TO RECORD, not resolved: `hirota2022` reports that cilostamide changed neither CNP-induced\n\
  cGMP nor PKA activation in growth-plate chondrocytes, which is the opposite of kawabe2025's central\nmeasurement.\
  \ Same tissue, same question, opposite results. CLAUDE.md's CORR-330 row rests on hirota2022.\n\nONE - BLOCKER\
  \ #1 IS RESOLVED, AND THE CALIBRATION IS NOT AN INFERENCE. The operator supplied `baronas2023`\n(Cell Genomics\
  \ 3:100299), the source paper for GSE225878 - a genome-wide CRISPR knockout screen of\nchondrocyte maturation,\
  \ 22,624 genes, 600 million cells. Round 310 recorded the dataset as unreadable\nbecause CORR-296 forbids assigning\
  \ a direction to an uncalibrated screen. The paper states the convention\noutright: cells are sorted on CD-200,\
  \ a cell-surface chondrocyte MATURATION marker, top and bottom deciles\ncollected at day 4 and day 15, with knockouts\
  \ called MATURE above log2 fold change +0.57 and IMMATURE below\n-0.63.\nSo: POSITIVE = losing the gene ACCELERATES\
  \ maturation and SPENDS the period.\n    NEGATIVE = losing the gene DELAYS maturation and EXTENDS it.\nNINE CONTROLS\
  \ AGREE, INCLUDING THE FOUR ROUND 310 SAID DID NOT RESOLVE.\n· Pth1r KO +0.396 / +0.844 - PTHrP-PTH1R is THE canonical\
  \ brake on hypertrophic differentiation. Correct.\n· Npr2  KO +0.039 / +1.192 - CNP/NPR-B sustains the proliferative\
  \ zone; LoF is acromesomelic dysplasia.\n· Sox9  KO -0.908 / -0.823 and Runx2 KO -0.978 / -0.640 - both required\
  \ for the programme. Correct.\n· Sufu +3.628 / +6.353 at -log10p 10.8 and Ptch1 +1.816 / +6.004 - reproducing\
  \ the paper's own stated\n  result that losing either hedgehog brake matures cells prematurely.\n· Eed +2.654,\
  \ Ezh2 +1.874, Suz12 +1.525 - the PRC2 trio, the paper's other headline.\nTwo delayers and two drivers on the\
  \ correct sides, and the paper's four named hits at the top. The\nprohibition is lifted FOR THIS DATASET. It is\
  \ NOT lifted for chu2026, which remains uncalibrated.\n\nTWO - THE SCREEN'S OWN STRUCTURE, READ BEFORE ANY HIT\
  \ IS BELIEVED (CORR-311, CORR-329).\nAt -log10p >= 3 and the paper's thresholds: 181 knockouts DELAY maturation,\
  \ 44 ACCELERATE. The skew is\ntoward delay, so by CORR-329 the ACCELERATED direction is the rare and informative\
  \ one - and the artefact\naudit says the same thing far more strongly.\n* THE SINGLE STRONGEST DELAYER IN THE\
  \ WHOLE SCREEN IS Cd200 ITSELF, at -2.342, -log10p 11.14, rank 1, and\n  replicating in the secondary screen.\
  \ CD-200 IS THE SORTING ANTIGEN. Deleting the epitope the sort is\n  performed on must score as immature. The\
  \ top hit of the delayed direction is a readout artefact.\n* 34% of the delayed list are Gm-prefixed predicted\
  \ genes, pseudogenes or ribosomal proteins; 22% sit in an\n  identical log-fold-change value shared by three or\
  \ more genes, which is one guide cutting many paralogous\n  loci; 4% are histone-cluster genes. In the ACCELERATED\
  \ direction the same filters flag 1 of 44.\n* Of the 94 delayers surviving those filters, the large majority are\
  \ core-essential - proteasome (Psmc4,\n  Psmd14), ribosome biogenesis (Bysl, Nip7, Rpf2, Utp4, Ddx27), spliceosome\
  \ (Prpf19, Snrpe), translation\n  (Eif2s1, Eif3h, Eif4e2), Plk1, Kpnb1, Hspa8, V-ATPase subunits. A cell that\
  \ cannot grow does not mature.\n=> THE DELAYED DIRECTION IS CONFOUNDED THREE WAYS - by the sorting antigen, by\
  \ multicopy guide toxicity and\nby essentiality - WHILE THE ACCELERATED DIRECTION IS CLEAN AND CARRIES ALL THE\
  \ RECOGNISABLE CARTILAGE\nBIOLOGY. For this case that is an awkward result: the screen is a good CONTRAINDICATION\
  \ screen and a poor\nlever screen. It is recorded that way rather than mined for the leads I wanted.\n\nTHREE\
  \ - THE BLIND SPOT, AND IT IS THE ATLAS'S OWN LEAD LAYER. GSE225879 gives the CPM of the screened cells,\nso \"\
  no effect\" can be separated from \"not present.\" In the screened cell line:\n  Hhip 0.10 CPM . Nppc 0.00 . Loxl2\
  \ 0.20 . Nrk 1.30 . Ihh 1.31 . Scube3 7.60\n  against Ptch1 142.6 . Smo 165.7 . Sufu 47.8 . Gnas 737.0 . Col2a1\
  \ 1629 . Prkar1a 350.9\n=> THE SCREEN'S NULLS ON HHIP, NRK AND LOXL2 ARE UNINFORMATIVE. You cannot knock out a\
  \ gene that is not\ntranscribed. Anyone reading this dataset in a later round must not count those nulls against\
  \ the leads.\n=> AND THE REASON IS STRUCTURAL, NOT INCIDENTAL. The culture has a hedgehog TRANSDUCTION apparatus\
  \ with no\nligand and no secreted antagonist. Sufu and Ptch1 still score enormously because they are ligand-INDEPENDENT\n\
  brakes. R287's LAYER - the extracellular control of morphogen availability - is invisible here BY\nCONSTRUCTION:\
  \ no perichondrium, no matrix, no gradient, monolayer.\n=> THE POSITIVE CONTROL FOR THAT CLAIM IS FBN1, AND IT\
  \ IS EXACT. Fbn1 IS expressed, at 230.7 CPM, and is\nNOT a hit. `sedes2022` already established why: deleting\
  \ Fbn1 from CHONDROCYTES produces no overgrowth,\nbecause the control is extrinsic and lives in the outer perichondrium.\
  \ The one layer gene present in the\nassay reproduces its own known cell-autonomous null. The blind spot is demonstrated,\
  \ not asserted.\n\nFOUR - THE HEDGEHOG RESULT, WHICH IS THE ROUND'S BEST FINDING. Joining the screen to kosmicki2026:\n\
  \  HHIP  - SECRETED extracellular antagonist - human pLoF **+9.92 cm** - invisible to this screen (0.10 CPM)\n\
  \  PTCH1 - CELL-SURFACE receptor/brake      - human pLoF **-1.56 cm** - screen **+6.004, -log10p 9.71**,\n   \
  \       secondary +5.041 at 10.34: losing it matures cells prematurely\n  SUFU  - INTRACELLULAR brake        \
  \      - `xiu2022` femur **-21% / -30%** in mouse - screen **+3.628**,\n          secondary +5.270 at 12.00\n\
  => THREE BRAKES ON ONE PATHWAY. Losing the SECRETED one adds ~10 cm in humans; losing the RECEPTOR subtracts\n\
  1.6 cm; losing the INTRACELLULAR one destroys the plate. THE SIGN FLIPS WITH DEPTH INTO THE CELL. That is\nCORR-300\
  \ derived a third time and for the first time QUANTIFIED on a single pathway with a human number at\neach node,\
  \ and PTCH1's -1.56 cm is a value this atlas has never used.\n=> IT ALSO SHARPENS A COST ON THE HHIP LEAD RATHER\
  \ THAN REMOVING IT. This screen says that activating\nhedgehog cell-autonomously ACCELERATES maturation, which\
  \ at bone age 16 spends the period. `haraguchi2025`\nsays limb-restricted Hhip1 deletion HOLDS THE PLATE OPEN\
  \ to 53 weeks with femur +4.5%. Those are in tension\nand the tension is exactly the secreted-versus-inside distinction\
  \ above, so it is a reason to hold the\ndistinction, not to abandon the lead. But the discriminating measurement\
  \ - what a secreted-antagonist\nperturbation does to maturation TIMING, as opposed to plate size - has still never\
  \ been made.\n\nFIVE - THE cAMP AXIS'S MATURATION DIRECTION IS NOW CAUSAL AND BIDIRECTIONAL, WHICH UPGRADES A\
  \ GRADE-E ROW.\nRound 306 inferred from acrodysostosis type 2's ADVANCED bone age that less cAMP accelerates maturation\
  \ and\nmore decelerates it, and graded it E - inference from a syndrome feature, never measured under a\nperturbation.\
  \ It is now measured, genome-wide, in both directions, and both arms replicate in the secondary\nscreen:\n· **Gnas\
  \ KO (LESS cAMP) -> +0.995 primary, +3.023 secondary D15 at -log10p 6.90 = ACCELERATED maturation.**\n  Human\
  \ GNAS pLoF is **-9.36 cm**, and the human disease (pseudohypoparathyroidism 1A / Albright hereditary\n  osteodystrophy)\
  \ features short stature, brachydactyly and premature epiphyseal closure. Three lines, one\n  direction.\n· **Prkar1a\
  \ KO (MORE PKA output, the regulatory subunit removed) -> -3.957 primary D15, -2.291 secondary at\n  -log10p 6.47\
  \ = DELAYED maturation.** The mirror lesion, the mirror result.\n=> Grade E -> C for the direction. cAMP/PKA output\
  \ sets maturation TIMING, and raising it extends the period.\n=> ⛔ AND IT DOES NOT REOPEN THE AXIS, FOR TWO REASONS\
  \ ALREADY IN THIS FILE. Round 307: the gain end is\nJansen's metaphyseal chondrodysplasia - constitutively active\
  \ PTH1R, maximal cAMP, SHORT with disarrayed\nzones - so a delayed plate at high cAMP is CORR-292's JAM, not a\
  \ period extension, and this screen cannot\ntell those apart because it measures a marker and not a length. Round\
  \ 309: the CREB microdomain opposes the\nerdafitinib arm. What the screen actually specifies is the shape of a\
  \ thing that does not exist - a SMALL,\nCREB-SPARING increment in chondrocyte PKA output. No available agent delivers\
  \ that.\n\nSIX - WHAT THE SCREEN SAYS ABOUT THE ATLAS'S OWN LEADS, separating informative from uninformative nulls.\n\
  · INFORMATIVE NEGATIVES (gene expressed, no maturation effect): **Tnks 195.7 CPM and Tnks2 231.0 CPM, both\n \
  \ null.** Tankyrase does not move maturation timing cell-autonomously - consistent with round 302/303\n  framing\
  \ it as a pool-and-rate lever on the SPIN4 signature (N and lambda) rather than a period lever, and\n  a real\
  \ if modest datum against reading it as one. **Tet1 82.3 CPM null. Amd1 92.5 CPM null. Ext1 69.0 CPM\n  sub-threshold.**\
  \ **Fbn1 230.7 CPM null**, which is the positive control above.\n· UNINFORMATIVE NULLS (gene not transcribed):\
  \ HHIP, NRK, LOXL2, NPPC, SCUBE3, and Spin4 at only 9.8 CPM.\n· **CHD8 is COHERENT AND UNVALIDATED.** Human pLoF\
  \ **+10.22 cm**, screen D4 **-1.029 at -log10p 4.35** =\n  delayed maturation = longer period = taller, which\
  \ is the first kosmicki tall-gene to receive a coherent\n  causal chondrocyte mechanism. ✗ But it FAILS the secondary\
  \ screen (-0.558 at p 1.62; -0.415 at 1.53), and\n  CLAUDE.md's baggage stands (ASD, intellectual disability,\
  \ macrocephaly). Recorded, not promoted.\n\nSEVEN - WHAT IS ACTUALLY ACTIONABLE, WHICH IS THE CONTRAINDICATION\
  \ LIST.\nApproved or late-clinical agents whose target's loss ACCELERATES maturation, i.e. spends the period:\n\
  · ⛔ **TAZEMETOSTAT (EZH2, approved)** - PRC2 was already DEAD here on `gao2024`; this makes it\n  DIRECTIONALLY\
  \ HARMFUL rather than merely ineffective, on a third independent line (Eed, Ezh2, Suz12 all\n  accelerate, all\
  \ replicate). **DOT1L +1.865 at 7.55** adds a fourth chromatin node and pinometostat is its\n  clinical inhibitor.\n\
  · ⚠ **FKBP1A +4.605 at -log10p 8.60 - the fourth strongest accelerator in the screen, expressed at 207 CPM,\n\
  \  and it carries SEVEN approved drugs** (sirolimus/rapamycin family - everolimus, temsirolimus, zotarolimus -\n\
  \  and the calcineurin binders tacrolimus and pimecrolimus). CAUTION ON MECHANISM, stated rather than glossed:\n\
  \  these drugs BIND FKBP12 and act through the complex, they do not delete it, so the phenocopy is partial and\n\
  \  applies to FKBP12's OWN functions (restraint of TGF-beta/BMP type I receptors, RyR modulation). It is\n  nonetheless\
  \ a SECOND independent line against rapalogs in this atlas, after round 300's MTOR -3.65 cm.\n· ⚠ **ALDH2 +1.111\
  \ at 6.60, expressed at 241 CPM, and DISULFIRAM is an approved ALDH2 inhibitor.** Direct\n  contraindication.\
  \ The extrapolation to acetaldehyde exposure from alcohol loads the same enzyme and is\n  grade E, mechanism only\
  \ - but it costs nothing and this atlas has never mentioned it.\n· **CSNK2B +3.620** (silmitasertib is the clinical\
  \ CK2 inhibitor) and **SMAD6 +3.827** with **FKBP1A** make\n  a coherent BMP-brake module: losing a BMP brake\
  \ accelerates maturation.\n· ⚠ **FOUR CILIARY GENES ACCELERATE MATURATION - Fuz +3.656, Wdpcp +3.120, Traf3ip1/IFT54\
  \ +3.040,\n  Pibf1 +2.924.** Round 294 asked, and could not answer, what an FGFR inhibitor does to cilium length\
  \ and\n  hedgehog output in a normal growth plate, having found that AZD4547 SHORTENS cilia in normal mice at\n\
  \  P<0.001. This screen supplies the missing half of that chain in the unfavourable direction: losing ciliary\n\
  \  genes matures chondrocytes prematurely. Grade D - four genetic nulls are not a drug-induced shortening, and\n\
  \  a monolayer line is not a plate - but it converts round 294's open gate from symmetric to asymmetric, and\n\
  \  the subject is a wild-type-FGFR3 adolescent on a pan-FGFR inhibitor.\n\nEIGHT - THE ONE CANDIDATE THE DELAYED\
  \ DIRECTION SURVIVES WITH, held at grade D.\n**BRD2.** Primary D4 -1.290 at -log10p 6.07, secondary D4 -0.984\
  \ at 5.00 AND D15 -0.966 at 3.39 - the only\nclean delayer replicating at BOTH secondary time points - expressed\
  \ at 320 CPM, not a Gm gene, not a histone,\nnot in a shared-LFC group. BET inhibitors are numerous and one is\
  \ approved (pelabresib), with apabetalone in\nphase 3 and orally dosed in cardiovascular disease rather than oncology.\n\
  ✗ AGAINST, and it is heavy: BET inhibitors are broadly antiproliferative, which is precisely the essentiality\n\
  confound that contaminates this entire direction; BRD2 is not cartilage-specific; there is no zone\ndecomposition\
  \ and no length endpoint in any species; and a delayed plate may be CORR-292's jam.\n⚠ **KDM1A/LSD1** is the other\
  \ one, and it FAILS ITS OWN CONSISTENCY CHECK - primary D4 -1.052 but primary\nD15 +0.139, against secondary D15\
  \ -1.769 at -log10p 5.30. A sign flip between primary and secondary at the\nsame time point. Recorded because\
  \ it sits in the H3K4 arm CLAUDE.md calls the live half and because\nbomedemstat is oral and in phase 3 - but\
  \ it is not promotable on data that disagrees with itself.\n\nNINE - WHAT THIS ROUND DOES NOT DO. It does not\
  \ produce an addition to the stack. Every candidate it\nsurfaces is either occluded by an arm already present\
  \ (PDE3), confounded by essentiality (BRD2), internally\ninconsistent (KDM1A), or a mechanism with no agent (a\
  \ CREB-sparing PKA increment). Its real product is a\nCONTRAINDICATION list, a calibrated dataset that can now\
  \ be queried by any later round, and the\ndemonstration that the atlas's two best leads sit in a compartment this\
  \ class of experiment cannot see."
human_evidence: indirect
human_evidence_note: 'The perturbation data are entirely MOUSE - a growth-plate-like chondrocyte cell line in monolayer.
  The human contribution is joined, not measured here: kosmicki2026''s burden effects in centimetres from 1.45M
  exomes supply HHIP +9.92, PTCH1 -1.56, GNAS -9.36 and CHD8 +10.22, and the human diseases supply the direction
  checks (Albright hereditary osteodystrophy for GNAS, acrodysostosis for the PRKAR1A/PDE4D arm). No human tissue
  was used in the screen and no human was perturbed. The kawabe2025 correction is also mouse throughout - there
  is no human PDE3-inhibitor length endpoint, and cilostazol''s chronic paediatric use in moyamoya disease remains
  the untapped observational route.'
species_basis: mouse
translation_risk: high
translation_risk_reason: 'HIGH, and the reason is the assay rather than the species. A monolayer immortalised chondrocyte
  line has no zones, no columns, no perichondrium, no matrix loading and no morphogen gradient, and this round demonstrates
  the cost directly: the culture carries a hedgehog transduction apparatus with no ligand (Ihh 1.31 CPM) and no
  secreted antagonist (Hhip 0.10 CPM), so an entire mechanistic layer that the atlas''s two best-validated leads
  occupy cannot register at all. The readout is a maturation MARKER and not a bone length, and CORR-292''s jam -
  expanded resting zone with SHORT bones - is indistinguishable here from a genuine period extension. Anything carried
  out of this dataset needs a length endpoint in tissue before it means anything for a human.'
confidence: B
confidence_reason: Graded B overall. The sign calibration is A - it is stated by the source paper and confirmed
  by nine controls including four the previous round could not resolve. The blind-spot demonstration is A, because
  it rests on measured CPM in the same cells plus an exact positive control in FBN1. The kawabe2025 correction is
  B, limited only by that study's dosing window. The hedgehog depth-of-compartment series and the cAMP bidirectional
  result are B and C respectively, since both join a mouse cell-line perturbation to human burden genetics across
  a large inferential gap. The ciliary finding is D. Nothing here is graded above the weakest link in its own chain,
  and the round produces no addition to the stack - its product is a contraindication list, a calibrated dataset
  and a correction.
limitations: 'The screen is a MONOLAYER MOUSE CELL LINE, not a growth plate: no zones, no columns, no matrix loading,
  no perichondrium, no morphogen gradient. Its readout is CD-200, a maturation MARKER and not a length, so CORR-292
  applies at full force - an expanded resting zone with SHORT bones reads here exactly like a genuine period extension,
  and nothing in this dataset separates them. The delayed direction is confounded by the sorting antigen, by multicopy
  guide toxicity and by essentiality, all quantified above rather than waved at. Proliferation and maturation are
  not separated in the primary files. Every call is mouse. The kosmicki2026 join is only five genes, because the
  screen''s significant hits and the 1.45M-exome height genes are largely disjoint sets. kawabe2025''s in-vivo arm
  measured length at the end of 4 weeks of dosing rather than at skeletal maturity, so it cannot distinguish a permanent
  gain from an acceleration, and its cGMP result directly contradicts hirota2022 without either being resolved here.'
