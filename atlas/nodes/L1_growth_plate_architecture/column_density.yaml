id: column_density
name: Column density and cartilage septal number
aliases:
- columns per unit area
- septal number
type: phenotype
layer: L1
stub: false
summary: 'Column density - the number of chondrocyte columns per unit cross-sectional area of the plate,
  measured histologically as cartilage septal number - determines how many parallel elongation units the
  plate runs. It changes systematically with age in humans and it does so differently by zone: in human
  rib, cartilage septal number falls with age in the proliferative zone but shows no significant change
  in the hypertrophic zone, while septal thickness rises in both. That dissociation means the plate becomes
  coarser (fewer, thicker units) at the proliferative level while preserving the number of units actually
  delivering cartilage to the metaphysis. Because total plate width, not zone height, is the growth plate
  parameter that correlates most strongly with tibial length and growth rate in both mouse and human,
  the total number of columns a plate can run is plausibly the dominant scaling variable; but no study
  has counted columns per unit area in a human plate and related it to a measured growth rate. Column
  number is also the quantity that recovers or fails to recover after physeal injury, which is why it
  matters clinically.'
