  value: 9/32/59, 9/32/58, 9/41/50, 8/49/43
  unit: '% of elongation'
  conditions: proximal tibia (396 um/day), distal radius (269), distal tibia (138), proximal radius (47);
    28-day-old Long-Evans rat, unit-cylinder model
  species: rat
  source_ref: wilsman1996
  uncertainty: 'DERIVED BY THIS ATLAS from the paper''s Tables 5 and 6 - the text states only the two
    extreme plates (9/32/59 and 7/49/44) and Figure 1 carries the middle two. Computed as division =
    T5 cell volume / T6 total, matrix = T6 matrix / T6 total, enlargement = (T6 cell - T5 cell) / T6
    total. The derivation reproduces the paper''s independently reported hypertrophic volume fractions
    (0.685 / 0.675 / 0.595 / 0.504) to within rounding, which is the check that it is the intended
    decomposition. Middle two plates carry no published dispersion.'
- parameter: cell share of the volume removed at the chondro-osseous junction
  value: 68.5, 67.8, 59.3, 51.4
  unit: '% of elongation'
  conditions: proximal tibia, distal radius, distal tibia, proximal radius; equals division plus enlargement,
    i.e. all of the removed volume that is cell rather than matrix
  species: rat
  source_ref: wilsman1996
  uncertainty: 'DERIVED as division + enlargement from the rows above; matches the paper''s directly
    measured hypertrophic volume fractions 0.685/0.675/0.595/0.504. THIS IS THE QUANTITY TO COMPARE A
    MEASURED TERMINAL CELL HEIGHT AGAINST, not the 44-59% enlargement figure - a histological cell
    height includes the volume the cell already had on leaving the proliferative zone. It is also a
    LOWER bound on the axial-height share, because longitudinal septal matrix adds volume without adding
    axial length.'
- parameter: partition of PHYSIOLOGICAL growth acceleration (21 to 35 days) among cell parameters
  value: height +23, diameter -14, volume -13, matrix/cell 0, turnover 0, hyp duration 0
  unit: '% change'
  conditions: rat proximal tibia, suckling (21 d) to pre-pubertal growth spurt (35 d), n=6 per age;
    growth rate +20%; stereology plus fluorochrome labelling plus 3H-thymidine autoradiography
  species: rat
  source_ref: hunziker1989
  uncertainty: 'THE SINGLE MOST DIRECT TEST OF WHICH VARIABLE CARRIES PHYSIOLOGICAL GROWTH CHANGE. A
    20% rise in growth rate is accounted for almost entirely by a 23% rise in terminal cell HEIGHT
    (31.2 -> 38.5 um, P<0.02) with a 14% FALL in lateral diameter (29.9 -> 25.6 um, P<0.03). Final cell
    VOLUME FALLS 13% (P<0.03) while growth rises - so volume and height DISSOCIATE and only height
    tracks growth rate. Matrix per cell, cell turnover per column and hypertrophic-phase duration are
    all unchanged. Coefficients of error 3.7-14.3% between animals.'
- parameter: cell cycle time and growth fraction move together and cancel
  value: T_c -33, growth fraction -33, turnover 0
  unit: '% change'
  conditions: rat proximal tibia, 21 to 35 days; cycle time 81 -> 54 h, proliferating cells per column
    27 -> 18
  species: rat
  source_ref: hunziker1989
  uncertainty: 'A 33% fall in cycle time is offset by a 33% fall in the columnar growth fraction, so
    cells produced per column per day is UNCHANGED. The only data on the joint behaviour of N_p and
    T_c say they are ANTICORRELATED and their ratio is conserved. Any model that samples them
    independently overstates the uncertainty of their product - which is what flow_model.py does.'
- parameter: partition of physiological growth deceleration (35 to 80 days)
