id: elongation_budget
name: Partition of elongation among proliferation, matrix synthesis, and hypertrophy
aliases:
- elongation budget
- chondrocytic kinetic partition
- growth partition
type: process
layer: L1
stub: false
summary: 'Longitudinal elongation of a growth plate is the sum of three separable contributions: the axial
  displacement produced by chondrocyte division, the axial displacement produced by interstitial matrix
  synthesis, and the axial displacement produced by the volume and shape change of chondrocytes during
  hypertrophy. The only study that has closed this budget quantitatively is Wilsman et al. 1996, which
  used oxytetracycline labelling for elongation rate and bromodeoxyuridine plus unbiased stereology for
  cell kinetics in four growth plates of 28-day-old Long-Evans rats: in the fast proximal tibia the split
  is 9% division, 32% matrix synthesis, 59% hypertrophic enlargement, and in the slow proximal radius
  the hypertrophic share falls to 44% while matrix synthesis rises to 49%. In the same study the calculated
  number of chondrocytes produced per day matched the number lost at the chondro-osseous junction, which
  is the internal consistency check that makes the partition credible. Hunziker and Schenk reached a compatible
  conclusion in rat by a different route: net matrix production per cell is nearly invariant across growth
  rates and ages, so acceleration is achieved by modulating final chondrocyte height rather than by making
  more matrix. The partition is therefore not a constant of the tissue but a site- and rate-dependent
  quantity: slower plates lean more on matrix and less on hypertrophy. No equivalent measurement exists
  for any human growth plate, and the human proliferative cell cycle appears to be one to two orders of
  magnitude slower than the rat''s, so the rat partition cannot be assumed to transfer.'
