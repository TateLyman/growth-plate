- 'rat proximal tibia PZ+HZ: measured by stereology (wilsman1996)'
- 'human: unmeasured'
human_evidence: absent
human_evidence_note: No human study partitions elongation among division, matrix synthesis and hypertrophy;
  a targeted PubMed search returned four records, none of which does so (see search log g_l1arch_001).
species_basis:
- rat
- pig
- mouse
translation_risk: high
translation_risk_reason: The canonical 9/32/59 partition is from four growth plates in 28-day-old rats
  elongating at 50-400 um/day. Human plates elongate at roughly 40 um/day with a proliferative cycle inferred
  to be ~20 days rather than ~31 h, and the rat data themselves show the partition shifts substantially
  (hypertrophy 59% to 44%) across a 8-fold range of growth rate within one animal.
confidence: C
