translation_risk_reason: Rodent tail vertebrae at P7 and P16, and the jerboa reads were mapped by the depositors
  to the MOUSE transcriptome, which biases toward conserved sequence. Absolute CPM in the jerboa arm should be treated
  as relative within that arm only.
summary: 'R455 established that GSE299515 - mouse and jerboa cranial growth cartilage of caudal vertebrae 1 and
  6 - is the ONLY vertebral growth-cartilage transcriptome that exists anywhere. R458 downloaded it (2 MB of transcript-level
  counts, 16 samples) and ran a 49-gene panel of this atlas''s own targets against the cd1-versus-cd6 contrast in
  both species. Data and per-sample CPM in atlas/data/round458/.


  ONE - THE CONTRAST IS COMPOSITION, IN BOTH SPECIES, AND IT IS LARGE. In mouse P7, Acan runs 857 to 2,206 CPM in
  cd1 against 3,803 to 8,624 in cd6, while Mki67 runs 2,314 to 3,089 against 268 to 448 - complete group separation
  both ways. In jerboa P16 it is starker: Col2a1 35,365 versus 201,742 CPM mean, a 5.7-fold difference with one
  gene reaching a fifth of the transcriptome in cd6, and Mki67 2,624 versus 204. THE cd1 SAMPLES CARRY FAR MORE
  PROLIFERATIVE, NON-CARTILAGE TISSUE AND THE cd6 SAMPLES ARE CARTILAGE-DOMINATED. That is CORR-339''s shape - a
  contrast whose largest movers are markers of how much of which tissue is in the tube.

  CONSEQUENCE: the raw cd1-versus-cd6 contrast in this dataset CANNOT be read as an elongation contrast. Anyone
  mining it must carry a composition control. ⚠ I have NOT read the depositors'' methods and make no claim about
  whether their published analysis corrected for this - the warning is about the deposited counts, which is what
  a later round would use.

  AND THE OBVIOUS CORRECTION DOES NOT WORK EITHER: normalising each sample to its own Acan drives nearly every gene
  in the panel negative, because Acan is itself a maturation marker rather than a neutral cartilage-content marker.
  A usable composition control for this tissue does not currently exist.


  TWO - AND WHAT SURVIVES THE CONFOUND IS A PRESENCE RESULT THAT HAS NEVER BEEN SHOWN. In mouse vertebral growth
  cartilage NPPC is 0.5 and 0.06 CPM - effectively ABSENT - while NPR2 is robustly present at 49 to 90 CPM and NPR3
  at 12 to 14. In jerboa, NPR2 87 to 120 and NPR3 8 to 42. THE RECEPTOR-LOCAL, LIGAND-SYSTEMIC CONFIGURATION THIS
  FILE ESTABLISHED FOR THE LIMB PLATE ON TWO HUMAN PLATFORMS NOW HOLDS IN THE AXIAL COMPARTMENT AS WELL. A presence
  call needs no contrast and is unaffected by the composition problem. It bears directly on whether a systemically
  dosed CNP analogue can act on a vertebral plate at all - the receptor is there and the ligand is not made locally.


  THREE - AND ONE GENE MOVES IN A WAY CONSISTENT WITH THE PUBLISHED PHENOTYPE. NPR3 rises 8.1 to 42.1 CPM in jerboa
  cd6 with complete group separation, tracking the cartilage fraction. weber2025 reports that Npr3 is the only gene
  common to all five of its limb and vertebral proportion analyses, and that Npr3 loss disproportionately elongates
  proximal and mid-tail vertebrae through an increase in hypertrophic cell size. The expression is consistent with
  that; it does not test it.


  WHAT THIS DOES NOT DO. It produces no lever and no new target. Its products are a WARNING attached to the only
  dataset that exists for the compartment holding this subject''s residual centimetres, one presence result in that
  compartment, and a per-sample CPM table for 49 atlas targets that any later round can query without re-downloading
  anything.'
