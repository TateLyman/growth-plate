id: round458_the_only_vertebral_growth_cartilage_transcriptome_opened_and_it_is_composition_dominated
name: 'R458 - the only vertebral growth-cartilage RNA-seq in existence, downloaded and analysed: the caudal-1 versus
  caudal-6 contrast is COMPOSITION-DOMINATED in BOTH species (Col2a1 spans 20-fold, Mki67 13-fold between groups),
  so it cannot be read as an elongation contrast without correction - and what survives that is the first demonstration
  that the AXIAL plate has the same receptor-local, ligand-systemic CNP configuration as the limb plate'
