id: site_specific_growth_rate
name: Site-specific growth rate (differential growth)
aliases:
- differential growth
- plate-specific elongation rate
type: phenotype
layer: L1
stub: false
summary: 'Every growth plate in an individual runs at its own velocity at the same moment, and it is this
  differential growth that produces limb proportions. In the human lower limb the distal femoral physis
  supplies about 70% of femoral length and the proximal tibial physis about 57% of tibial length, and
  these proportions themselves shift with age - the distal femoral share rises from 60% at age 7 to 90%
  at 14 in girls and from 55% at 7 to 90% at 16 in boys. In the upper limb the proximal humeral physis
  supplies about 80% of humeral length, the distal radius about 80% and the distal ulna about 85%, with
  the distal-dominant proportion increasing through childhood. Mechanistically, differential growth is
  not explained by any single parameter. Wilsman and colleagues showed that eight independent chondrocytic
  variables are involved and that seven of them vary between plates of one 28-day-old rat; cell cycle
  time differs 2.5-fold with the variation almost entirely in G1; final hypertrophic cell volume correlates
  with rate at r=0.98; and the relative contribution of hypertrophy falls from 59% to 44% as plates get
  slower, with matrix synthesis taking up the difference. In mouse the site difference maps onto whether
  the IGF-dependent third phase of enlargement is executed or truncated. Differential growth is not present
  from the beginning: in rat it emerges postnatally.'
