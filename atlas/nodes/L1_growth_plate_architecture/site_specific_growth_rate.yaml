localization:
- 'human: per-plate contributions measured radiographically (pritchett1992, pritchett1991)'
- 'rat: mechanistic decomposition (wilsman1996, wilsman1996a, wilsman2008)'
- 'mouse: phase-3 truncation as the site-specific switch (cooper2013)'
human_evidence: direct
human_evidence_note: Per-plate contributions to limb segment length have been measured directly in two
  human radiographic cohorts of 244 and 200 children followed to skeletal maturity (pritchett1992, pritchett1991).
species_basis:
- human
- rat
- mouse
translation_risk: moderate
translation_risk_reason: The human proportions are solid human data, but every mechanistic explanation
  of why plates differ is rodent, and the rodent explanation itself is a multi-variable model rather than
  a single lever.
confidence: B
