  value: '80'
  unit: '% of radial length'
  conditions: human, overall; 85% at age 5, 90% by age 8
  species: human
  source_ref: pritchett1991
  uncertainty: n = 200
- parameter: distal ulnar share of ulnar growth
  value: '85'
  unit: '% of ulnar length'
  conditions: human, overall; 90% by age 5, 95% after age 8
  species: human
