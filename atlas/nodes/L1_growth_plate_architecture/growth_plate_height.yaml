id: growth_plate_height
name: Growth plate height
aliases:
- physeal thickness
- plate height
type: phenotype
layer: L1
stub: false
summary: 'Growth plate height is the axial thickness of the cartilage disc and is the most commonly measured
  architectural variable, but it is a poor stand-alone proxy for growth rate. Hunziker and Schenk warned
  explicitly that bulk measures including growth plate height bear little relationship to linear growth
  rate and are useful only as indicators of total plate activity. Direct morphometry supports the caution:
  in mouse proximal tibia total plate height, resting zone height and combined proliferative-plus-prehypertrophic
  height correlate linearly with tibial length and growth rate, but hypertrophic zone height and plate
  area do not, and in both mouse and human it is total plate width that correlates most strongly. In humans,
  plate height falls with age: proliferative and hypertrophic zone heights and primary spongiosa height
  all decrease from birth to adolescence in rib, most steeply in the first postnatal year. Regional heterogeneity
  within one plate is substantial - histomorphometry of a human distal tibia undergoing physiological
  epiphysiodesis showed physeal height varying by region alongside focal bony bar formation, so a single
  height value for a human plate is an average over a structurally non-uniform sheet.'
