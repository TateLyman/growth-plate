summary: "ZERO - WHAT THIS DATASET IS AND WHY IT WAS WORTH OPENING. GSE114919 (operator-supplied\n2026-08-13) carries\
  \ TWO orthogonal contrasts of growth capacity, zone-resolved, in TWO species:\n  AGE  - 1 week vs 4 week TIBIA,\
  \ proliferative and hypertrophic zones separately.\n  SITE - 1 week TIBIA vs 1 week PHALANX, same animals, same\
  \ age, same zones. Both plates are open; the\n         tibia will contribute an order of magnitude more length.\n\
  The atlas's binding constraint at bone age 16 is the PERIOD, and every other transcriptome here is a\nsnapshot\
  \ of one plate at one age. This is the first dataset that can ask which way a target moves as growth\ncapacity\
  \ is spent - and, separately, whether it distinguishes a high-output plate from a low-output one.\nTHE DISCRIMINATOR:\
  \ a target that RISES with age AND is HIGHER in the low-output plate behaves like a\nrestraint that accumulates,\
  \ so inhibiting it is coherent. One that FALLS on both is capacity being lost, and\ninhibiting it further runs\
  \ backwards.\n\nONE - THE ARTEFACT AUDIT, RUN FIRST AND FATAL TO GENOME-WIDE MINING. R311's discipline applied\
  \ again, and\nagain it changed the reading.\n· **MUSCLE CONTAMINATION TRACKS THE DESIGN AXIS ALMOST EXACTLY.**\
  \ A muscle marker panel (Myh1/2/4/8, Acta1,\n  Ckm, Tnnc2, Myl1, Des, Mylpf, Tnnt3) scores **6.15 in 1wk tibia\
  \ PZ, 3.12 in 4wk tibia PZ, 1.82 in 1wk\n  phalanx PZ** - falling with age AND lower in the low-output site, which\
  \ is precisely the CAPACITY-LIKE\n  pattern. The unfiltered capacity list is headed by Myh8 -6.58, Myh4 -5.13,\
  \ Acta1 -4.72, Myl1, Tnnc2,\n  Actc1, Myh1, Ckm. **The capacity direction is largely dissection contamination.**\n\
  · **THE SITE AXIS CARRIES A MASSIVE POSITIONAL-IDENTITY SIGNAL.** A distal-HOX panel scores **8.04 in\n  phalanx\
  \ PZ against 2.26 in tibia PZ - 5.8 log2.** Hoxa13 +6.06, Lhx2 +6.71. A phalanx is not a small\n  tibia; it has\
  \ a different HOX code, and that is the single largest thing separating the two sites.\n· **TWO FURTHER CONTAMINATIONS\
  \ APPEAR IN THE BRAKE DIRECTION:** bone (Bglap +4.26 mouse / +5.62 rat, Sost,\n  Mepe) and marrow/immune (Ms4a1/CD20,\
  \ Cd74, Ccl6, Siglec1, Il12a), both rising as the secondary\n  ossification centre and marrow invade the sample\
  \ with age; plus vascular Rgs5.\n=> **GSE114919 CANNOT BE MINED GENOME-WIDE.** 624 brake-like and 503 capacity-like\
  \ genes pass a naive\nthreshold and both lists are led by contamination. What the dataset CAN do is adjudicate\
  \ genes the atlas\nalready has independent reasons for, read against a chondrocyte reference so dilution cannot\
  \ explain the\nresult. That is how everything below is used.\n✓ **THE POSITIVE CONTROL BEHAVES, WHICH IS WHY THE\
  \ TARGETED READ IS TRUSTED AT ALL.** ESR1 - the canonical\nperiod-closing signal and the target of the one arm\
  \ in this stack that addresses the period - is\nBRAKE-LIKE in both species, and strongly so in rat (**age +4.02\
  \ PZ, +3.03 HZ**). The discriminator returns\nthe right answer on the one gene whose answer is known in advance.\n\
  \nTWO - ⭐ HHIP: THE SITE AXIS REPLICATES ACROSS SPECIES WITH NEARLY IDENTICAL MAGNITUDE.\n  **MOUSE site +2.86\
  \ PZ / +3.31 HZ . RAT site +2.33 PZ / +3.34 HZ.**\nHHIP is 5-10 fold higher in the plate that will contribute\
  \ far less length, at the same age, in two species.\nAgainst the chondrocyte reference this is not dilution: aggrecan\
  \ moves -0.61 on the same contrast, so HHIP\nis ~3.5 log2 higher than aggrecan-matched expectation in the low-output\
  \ plate. The atlas's therapeutic\ndirection for HHIP is REMOVAL (human pLoF +9.92 cm), and high HHIP marks low\
  \ growth. **Coherent, and it is\na third orthogonal line on the atlas's best-validated lead** - after human burden\
  \ genetics and\nharaguchi2025's limb-restricted deletion.\n✗ **THE AGE AXIS DOES NOT REPLICATE AND IS RECORDED\
  \ AS A FAILURE.** Mouse age +2.12 PZ; rat age +0.64 PZ and\n**-0.48 HZ**. So HHIP tracks plate OUTPUT and not\
  \ age as such. The honest statement is one axis replicated,\none did not, and the claim is trimmed to what survives.\n\
  ⭐ **THE DOWNSTREAM READOUT AGREES IN BOTH SPECIES:** Gli1 falls with age (mouse -1.09, rat -0.94 PZ) while\nHHIP\
  \ rises - a brake going up and its pathway output coming down.\n\nTHREE - ⭐ CHAD IS THE ROUND'S NEW CONVERGENCE,\
  \ AND IT IS THE LAYER AGAIN.\n**Chondroadherin - a SECRETED leucine-rich-repeat matrix protein.**\n· **Human pLoF\
  \ +2.63 cm, P=4.0e-10, 282 heterozygotes** (kosmicki2026). Loss makes people taller.\n· **BRAKE-LIKE ON BOTH AXES\
  \ IN BOTH SPECIES** - mouse age +4.76 PZ / +4.22 HZ, site +1.68 / +0.61;\n  rat age +1.75 / +0.69, site +1.11\
  \ / +2.06. All eight values positive.\n· Detected 5/5 probe-donor cells in BOTH human growth-plate donors (round\
  \ 300).\n· Muscle correlation is low and it is not a positional TF, so it survives the filters above.\n=> Three\
  \ independent lines - human burden, two-species growth-capacity expression, human tissue presence -\nand it belongs\
  \ to R287's LAYER, the class both open-plate passes belong to. **It had ZERO atlas coverage\nbefore round 300\
  \ and was never followed up.**\n✗ **NO DRUG, NO TOOL COMPOUND, NO PERTURBATION IN ANY SPECIES.** Open Targets\
  \ returns zero drugs and\ntractability limited to \"secreted\". It is a target, not a therapy.\n\nFOUR - ⚠ TWO\
  \ CANDIDATES ARE DAMAGED BY THIS ROUND, AND BOTH WERE THINGS THE ATLAS LIKED.\n· ⛔ **LOXL2 RUNS THE WRONG WAY\
  \ IN RAT.** Round 301 called it \"the ONLY candidate left standing\". Its\n  therapeutic direction is INHIBITION\
  \ (human pLoF +1.40 cm), which predicts brake-like behaviour. Mouse is\n  equivocal (age +0.78 PZ, site -0.02);\
  \ **rat site is -1.23 PZ and -2.00 HZ - LOXL2 is LOWER in the\n  low-output plate**, the opposite of a restraint\
  \ that accumulates. Not a refutation of the human genetics,\n  which are causal where this is not, but it removes\
  \ the supporting argument and it is recorded as a strike.\n· ⚠ **NRK'S EXPRESSION CONTRADICTS ITS OWN THERAPEUTIC\
  \ DIRECTION, IN BOTH SPECIES.** NRK is the atlas's\n  lead gene by localisation - 83.5-fold chondrocyte-enriched,\
  \ human pLoF +2.79 cm at P=1.0e-20, so the\n  implied direction is INHIBITION. But it is **CAPACITY-LIKE in mouse\
  \ (age -0.89, site -0.82/-1.24) and in\n  rat (age -0.88/-0.92, site -0.32/-0.83)**: NRK is highest where growth\
  \ is highest. Inhibiting a gene whose\n  expression tracks growth capacity positively is not incoherent - expression\
  \ is not requirement, and human\n  burden genetics outrank an association - but the two are pulling opposite ways\
  \ and that had not been\n  noticed. Gap recorded rather than resolved.\n\nFIVE - ✓ SCUBE3 GAINS SUPPORT, AND IT\
  \ IS THE ONE CANDIDATE WHOSE DIRECTION IS TO SUPPLY RATHER THAN BLOCK.\n**Falls with age in both species and both\
  \ zones - mouse -1.63 PZ / -2.02 HZ, rat -2.20 / -1.76.** SCUBE3 is\na secreted BMP modulator whose loss SHORTENS\
  \ (lin2021, human pLoF -7.18 cm), so a declining level as the\nwindow closes is capacity being lost, and supplying\
  \ it is the coherent move. CLAUDE.md already lists\n\"recombinant SCUBE3 into a normal animal, measure a bone\"\
  \ among four cheap experiments that do not exist.\nThis round is the first evidence that the protein actually\
  \ declines on the relevant axis. ✗ Still no\nrecombinant product, no perturbation with a length endpoint, and\
  \ CORR-325's warning applies - a gene whose\nbiallelic loss causes a syndrome may not be monotone.\n\nSIX - TANKYRASE\
  \ CONTINUES TO FADE. Tnks and Tnks2 are **flat on both axes in both species** (largest value\n-0.58). Round 311\
  \ found both transcribed and null on maturation timing; round 303 found the germline null\nhas unchanged body\
  \ length and nominally shorter tibia. Three rounds of independent tests have now failed to\nfind the signal that\
  \ would corroborate round 302's promotion. The human-cartilage direction result\n(hotta2024) and the Step-0 cleanliness\
  \ are untouched; what is gone is every attempt to confirm it from\nanother angle.\n\nSEVEN - THE ANSWER TO \"\
  WHAT SHOULD WE ADD\", STATED PLAINLY BECAUSE THE OPERATOR ASKED FOR A DECISION.\nApplying Step 0 - an addition\
  \ must move a term outside CNP/cGMP, FGFR3/ERK/CREB, GH/IGF-1 and\noestrogen/period - and requiring both a real\
  \ mechanism AND an obtainable molecule:\n**NOTHING PASSES BOTH TESTS.** The split is total and it is the shape\
  \ of the whole problem:\n· The targets with the best evidence have NO MOLECULE - HHIP (three independent lines,\
  \ no agent in any\n  species), CHAD (three lines, zero drugs), SCUBE3 (declining, no recombinant product), NRK\
  \ (best\n  localisation in the atlas, no inhibitor).\n· The molecules that exist have THIN OR NEWLY NEGATIVE EVIDENCE\
  \ - LOXL2/PXS-5505 damaged here, tankyrase\n  fading across three rounds, TET1 with no bone-length endpoint for\
  \ any inhibitor, DFMO with an unresolved\n  sign.\n· R298 already established this is the BASE RATE and not bad\
  \ luck: growth-plate control is transcription\n  factors, secreted morphogen modulators, matrix and channels,\
  \ and the pharmacopoeia is kinases, GPCRs and\n  nuclear receptors. 202 of 298 atlas-nominated targets have no\
  \ drug at all.\n⭐ **THE ONE CHEAP UNBLOCKED ITEM IS STILL A BLOOD TEST, NOT A PAPER.** Fasting insulin, glucose\
  \ and\nHOMA-IR appear NOWHERE in this atlas for this subject, and they decide whether metformin is a live period\n\
  lever (the only agent in R297's audit that targets the PERIOD rather than a rate) or a contraindication\nthat\
  \ lowers IGF-1 bioavailability against the GH arm. Fifteen rounds have passed with this outstanding.\n⭐ **AND\
  \ THE SCALE CORRECTION STANDS UNCHALLENGED.** Pooled across 1,149 patients, femoral lengthening is\n8.85 cm and\
  \ tibial 7.36 cm - roughly 16 cm from both segments, against 1-3 cm for the entire pharmacological\nstack. It\
  \ works AFTER fusion, so it does not compete for the closing window, and the one series combining it\nwith vosoritide\
  \ found no interference. Recorded as a correction to the file's sense of scale, not as a\nrecommendation to operate."
human_evidence: indirect
human_evidence_note: 'The expression data are entirely MOUSE and RAT. The human contribution is joined: kosmicki2026''s
  burden effects supply CHAD +2.63 cm (P=4.0e-10, 282 hets), NRK +2.79 cm, LOXL2 +1.40 cm and HHIP +9.92 cm, and
  round 300''s GSE9160 localisation supplies CHAD''s presence in 5/5 probe-donor cells of both human growth-plate
  donors. No human tissue was profiled here and nothing was perturbed in any species.'
species_basis: mouse
translation_risk: high
translation_risk_reason: HIGH. This is normal-tissue expression with no perturbation and no length endpoint, so
  every statement is an association. The dataset is additionally confounded four ways - muscle, bone, marrow/immune
  and positional HOX identity - all quantified in the node rather than assumed absent, and those confounds are large
  enough to dominate a naive genome-wide read in BOTH directions. The site contrast compares a phalanx with a tibia,
  which differ in far more than growth output. Nothing here can promote a candidate; its value is corroboration
  for targets with independent causal evidence, and falsification of supporting arguments, which is what it did
  to LOXL2.
confidence: C
confidence_reason: Graded C. The artefact audit and the positive control are solid - the muscle and HOX confounds
  are measured, and ESR1 returns the known answer in both species. The HHIP site replication is the strongest single
  result, with two species agreeing to within 0.5 log2 on both zones, and it is graded on the fact that its companion
  age axis did NOT replicate. CHAD's three-line convergence is real but every line is an association or a burden
  statistic, with no perturbation anywhere. The negative results on LOXL2 and tankyrase are graded lower still,
  because absence of a supporting expression pattern is weak evidence against a causal human genetic effect. No
  claim here exceeds C and the round's main product is a decision about what is NOT addable.
limitations: Normal tissue, no perturbation, no length endpoint, two rodent species. Four measured confounds - muscle
  contamination falling with age and lower in phalanx (6.15 / 3.12 / 1.82 on a marker panel), distal-HOX positional
  identity 5.8 log2 higher in phalanx, bone contamination rising with age (Bglap +4.26 mouse, +5.62 rat) and marrow/immune
  infiltration. The phalanx-versus-tibia contrast is not a clean growth-output contrast. The finger proliferative-zone
  group has four replicates rather than five. 26 mouse gene symbols were destroyed by Excel date auto-conversion
  and were dropped rather than guessed. The rat matrix is keyed by RefSeq accession and required an external NCBI
  mapping, which resolved 15,406 accessions to 15,060 symbols - genes lost in that mapping (including Tet1, Adamtsl1,
  Col10a1 and Hoxa13) have no rat value here, which is a coverage gap and not a negative result. Only 1 week and
  4 weeks were sampled, so nothing about the closing plate itself is observed.
