claim_grades:
- claim: HHIP is markedly higher in a low-output growth plate than a high-output one, in two species.
  grade: B
  species: mouse and rat
  source_ref: gse114919
  basis: 'Phalanx minus tibia at one week: mouse +2.86 PZ and +3.31 HZ, rat +2.33 PZ and +3.34 HZ - four values
    agreeing to within about 0.5 log2 across species and zones, on a contrast where aggrecan moves -0.61 so dilution
    cannot explain it. HHIP is not a muscle gene, not a positional transcription factor and survives the contamination
    filters. Gli1 falls on the same axes in both species, so the brake rises while its pathway output falls. This
    is a third orthogonal line on the atlas''s best-validated lead, after human pLoF +9.92 cm and haraguchi2025''s
    limb-restricted deletion. GRADE B not A because the companion AGE axis failed to replicate in rat (+0.64 PZ,
    -0.48 HZ against mouse +2.12), so HHIP tracks plate output rather than age, and because this is expression in
    normal tissue with no perturbation.'
- claim: GSE114919 can be mined genome-wide for growth-capacity genes.
  grade: X
  species: mouse and rat
  source_ref: gse114919
  basis: NO. Both directions are led by contamination. The capacity direction is headed by Myh8 -6.58, Myh4 -5.13,
    Acta1 -4.72 and a muscle marker panel that scores 6.15 / 3.12 / 1.82 across exactly the design axis, so muscle
    dissection contamination reproduces the capacity pattern by itself. The brake direction is led by distal-HOX
    positional identity (phalanx 8.04 versus tibia 2.26, Hoxa13 +6.06), by bone (Bglap +4.26 mouse and +5.62 rat,
    Sost, Mepe) and by marrow/immune infiltration (Ms4a1, Cd74, Ccl6, Siglec1). 624 brake-like and 503 capacity-like
    genes pass a naive threshold and the lists are not usable. The dataset is an adjudicator for genes with independent
    reasons, not a discovery screen.
- claim: CHAD behaves like a restraint that accumulates as growth capacity is spent.
  grade: C
  species: mouse and rat
  source_ref: gse114919
  basis: 'All eight contrast values are positive - mouse age +4.76 PZ and +4.22 HZ, site +1.68 and +0.61; rat age
    +1.75 and +0.69, site +1.11 and +2.06 - and it survives the muscle and positional filters. It converges with
    human pLoF +2.63 cm at P=4.0e-10 across 282 heterozygotes, which says losing it makes people taller, and with
    detection in 5/5 probe-donor cells of both human growth-plate donors. It is a SECRETED leucine-rich-repeat matrix
    protein, so it belongs to R287''s LAYER - the class containing both of the atlas''s open-plate passes. GRADE
    C: every line is an association or a burden statistic, there is no perturbation of CHAD in any species, and
    Open Targets returns zero drugs and zero tool compounds.'
- claim: LOXL2's expression supports its promotion as an inhibition target.
  grade: X
  species: rat
  source_ref: gse114919
  basis: NO, and this was round 301's last candidate standing. Inhibition predicts brake-like behaviour. Mouse is
    equivocal (age +0.78 PZ, site -0.02 PZ) and RAT RUNS THE OTHER WAY - site -1.23 PZ and -2.00 HZ, meaning LOXL2
    is LOWER in the plate with less growth capacity. This does not refute the human burden effect of +1.40 cm, which
    is causal where this is not, and it does not touch the expression argument from human growth plate where LOXL2
    sits at 34,135 in the proliferative zone. What it removes is the supporting claim that LOXL2 behaves like an
    accumulating restraint.
- claim: NRK's expression agrees with the inhibition direction implied by its human genetics.
  grade: X
  species: mouse and rat
  source_ref: gse114919
  basis: NO, and it is recorded because it is inconvenient. NRK is capacity-like in both species - mouse age -0.89
    and site -0.82/-1.24, rat age -0.88/-0.92 and site -0.32/-0.83 - so it is highest where growth is highest, while
    human pLoF +2.79 cm at P=1.0e-20 implies that INHIBITION is the height-adding direction. Expression is not requirement
    and a burden effect in 1.45M exomes outranks an association in 60 rodent libraries, so this does not overturn
    the target. But the two lines pull opposite ways, that had never been noticed, and it belongs beside the 83.5-fold
    chondrocyte enrichment rather than buried.
- claim: There is an addition to this stack that has both a real mechanism and an obtainable molecule.
  grade: X
  species: human
  source_ref: kosmicki2026
  basis: 'NO, and this is the round''s decision. Applying Step 0 - the addition must move a term outside CNP/cGMP,
    FGFR3/ERK/CREB, GH/IGF-1 and oestrogen/period - the candidates split cleanly and completely. Best evidence,
    no molecule: HHIP (three independent lines, no agent in any species per round 294), CHAD (three lines, zero
    drugs), SCUBE3 (declining in two species, no recombinant product), NRK (the atlas''s cleanest localisation,
    no inhibitor). Molecule exists, evidence thin or newly negative: LOXL2 damaged here, tankyrase now failed from
    three independent angles across rounds 303, 311 and 312, TET1 with no bone-length endpoint for any inhibitor,
    DFMO with an unresolved sign. Round 298 established this split is the BASE RATE - 202 of 298 atlas-nominated
    targets have no drug at all - because growth-plate control is transcription factors, secreted modulators, matrix
    and channels while the pharmacopoeia is kinases, GPCRs and nuclear receptors. The honest answer is that the
    shelf is empty, not that the search was insufficient.'
