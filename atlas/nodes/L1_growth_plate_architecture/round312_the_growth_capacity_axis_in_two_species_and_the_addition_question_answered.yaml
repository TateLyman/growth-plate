contradicts: This round DAMAGES two things the atlas liked and CORROBORATES one. LOXL2 - round 301's 'only candidate
  left standing' - has its supporting expression argument removed, because rat site runs -1.23/-2.00 where inhibition
  predicts positive; the human +1.40 cm is untouched. NRK is shown to be capacity-like in two species, which pulls
  against the inhibition direction its own human genetics imply, a tension not previously noticed. Tankyrase is
  flat on all eight contrasts, making three independent failures to corroborate round 302 across rounds 303, 311
  and 312. HHIP gains a third orthogonal line but only on the SITE axis - the age axis failed to replicate in rat
  and that failure is recorded rather than omitted. CHAD enters as a new three-line convergence with no molecule.
  It also establishes that GSE114919 cannot be mined genome-wide, so no later round should treat its brake or capacity
  lists as candidate sources without the contamination filters applied here.
