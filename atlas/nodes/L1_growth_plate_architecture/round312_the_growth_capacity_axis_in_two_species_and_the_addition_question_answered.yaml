id: round312_the_growth_capacity_axis_in_two_species_and_the_addition_question_answered
name: ROUND 312 - a growth-capacity discriminator built from two orthogonal contrasts in two species, and the answer
  to what should be ADDED. HHIP is 2.3-3.3 log2 higher in the LOW-OUTPUT plate in BOTH mouse and rat with matching
  magnitude; CHAD replicates on both axes and carries +2.63 cm of human burden effect; LOXL2 runs the WRONG WAY
  in rat; and NRK's expression contradicts the direction its own human genetics imply. No candidate emerges that
  has both a real mechanism and an obtainable molecule
