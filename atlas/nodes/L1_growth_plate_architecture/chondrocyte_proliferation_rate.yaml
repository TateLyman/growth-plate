id: chondrocyte_proliferation_rate
name: Chondrocyte proliferation rate
aliases:
- chondrocyte production rate
- cell production per column
type: process
layer: L1
stub: false
summary: 'Chondrocyte production rate is the number of new cells a plate generates per unit time, and
  in steady state it equals the number removed at the chondro-osseous junction. It is measured in vivo
  by pulse or repeated pulse labelling with bromodeoxyuridine combined with unbiased stereology. In 28-day-old
  rats the whole-plate output differs 4.4-fold between plates of the same animal: about 16,400 new chondrocytes
  per day in the proximal tibia against about 3,700 in the proximal radius. Per column the rat proximal
  tibia produces and loses 8 cells per day. Crucially, production rate is not the main lever on elongation:
  in the same rat proximal tibia cell division accounts for only 9% of elongation directly, and Hunziker
  and Schenk found that the physiological acceleration of growth between 21 and 35 days is achieved without
  any increase in longitudinal proliferation rate at all. Proliferation does become limiting in the other
  direction: growth deceleration toward maturity involves simultaneous falls in cell height, cell volume
  and proliferation rate. Human production rates have never been measured; the only human proliferation
  datum is an in vitro labelling index that failed to label any cells in half the specimens.'
