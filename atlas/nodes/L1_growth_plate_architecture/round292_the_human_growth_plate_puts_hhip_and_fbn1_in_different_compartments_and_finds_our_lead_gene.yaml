id: round292_the_human_growth_plate_puts_hhip_and_fbn1_in_different_compartments_and_finds_our_lead_gene
name: >-
  ROUND 292 - the only zone-resolved transcriptome of a HUMAN growth plate has been in this repository the
  whole time and neither of the two genes this case now rests on had ever been looked up in it. HHIP is in
  the CARTILAGE and below background in the PERICHONDRIUM in every probe-donor cell; FBN1's only detection
  in the clean donor is the PERICHONDRIUM. Round 291 said they were independent levers - here they are, in
  complementary compartments, in the same two children. And NRK, which had no skeletal data in any species
  eight days ago, is detected in every compartment of both donors
aliases:
- round 292
- HHIP is cartilage, FBN1 is perichondrium
- the first human measurement of HHIP in a growth plate
- NRK in a human growth plate
- SPIN4 is below background in human
type: hypothesis
layer: L1
stub: false
summary: >-
  ZERO - WHAT THIS ROUND COST. One script, no new data, no request to anyone. GSE9160 is the only public
  zone-resolved transcriptome of a human growth plate - reserve, proliferative, prehypertrophic, hypertrophic
  and PERICHONDRIUM, laser-captured separately from two normal children. It has been in this repository since
  2026-08-05 with a preregistered notebook on it. Rounds 285 through 291 built the HHIP case entirely on
  mouse data and the atlas's own standing rule is that every claim carries a species. Nobody had typed HHIP
  into it.

  ONE - HHIP IS EXPRESSED IN THE HUMAN GROWTH PLATE, AND IT IS A CARTILAGE GENE. First human measurement.
  Read against each array's own olfactory-receptor detection threshold - the control this notebook already
  passed against the submitters' present-calls - HHIP is detected in the PROLIFERATIVE zone on three of four
  probe sets in donor 1 (879, 1301, 1493 against a threshold of 746) and in the RESTING and PROLIFERATIVE
  zones in donor 2. It falls below background in prehypertrophic and hypertrophic zones in both donors.
  That is the same compartment mouse gives: haraguchi2025 localises Hhip1 mRNA to resting-zone chondrocytes,
  and chu2026 has it at baseMean 3.73, above FGFR3.
  A HUMAN, A MOUSE, TWO PLATFORMS, THE SAME ANSWER. The species gap in rounds 285-291 is closed.

  TWO - AND IT IS ABSENT FROM THE PERICHONDRIUM. ZERO OF EIGHT PROBE-DONOR CELLS. Four probe sets, two
  donors, and HHIP is below background in the perichondrium in every one - 144, 59, 217, 22 in donor 1
  against a threshold of 827; 26, 19, 42, 13 in donor 2 against 451. This matters because of what round 291
  refuted yesterday. guo2024's SMAD3-dependent HHIP enhancer predicted that FBN1 loss lowers HHIP in the
  perichondrium and that the atlas's two open-plate passes are one pathway; GSE189091 showed Hhip is not
  differentially expressed there in mouse and trends the wrong way. THIS IS THE SAME CONCLUSION FROM A
  DIFFERENT SPECIES, A DIFFERENT PLATFORM AND A DIFFERENT TISSUE SOURCE, and it is stronger than a null: a
  transcript that is BELOW BACKGROUND in the perichondrium of two human children cannot be the route by
  which perichondrial fibrillin loss lengthens a bone.

  THREE - AND THE MIRROR IMAGE IS IN THE SAME FILE. In donor 1 - the donor whose laser capture actually
  separated the zones - FBN1's ONLY detection across all five compartments and all three probe sets is the
  PERICHONDRIUM (1607 against a threshold of 827; reserve 677, proliferative 332, prehypertrophic 154,
  hypertrophic 477, all below). sedes2022's entire mechanism is perichondrial and its Col2-Cre deletion gave
  no overgrowth. HERE IS THAT COMPARTMENT SPECIFICITY, IN A HUMAN, MEASURED.
  SO IN ONE DATASET, IN THE SAME TWO CHILDREN: HHIP IS IN THE CARTILAGE AND NOT THE PERICHONDRIUM; FBN1 IS
  IN THE PERICHONDRIUM AND NOT THE CARTILAGE. Round 291 concluded from mouse RNA-seq that these are two
  independent levers. They are not merely in different pathways - THEY ARE IN DIFFERENT TISSUES. That is the
  strongest form the independence claim can take, and it is the argument for combining them rather than
  choosing.

  FOUR - NRK IS IN THE HUMAN GROWTH PLATE, ABUNDANTLY, IN EVERY COMPARTMENT OF BOTH DONORS.
  Eight days ago the atlas's lead gene had ZERO skeletal literature in any species. It now has three
  independent measurements. chu2026, mouse growth plate: baseMean 6.10, above FGFR3 at 2.30. GSE189091,
  mouse perichondrium (round 291): 183-301 CPM in all three wild types. And here, human: probe 227971_at
  detected in all five compartments of BOTH donors - the only gene in this round's list other than COL2A1
  and ACAN to achieve that - at 1050, 8062, 9980, 9289 and 3556 in donor 1 against thresholds of 719-827.
  IN THE CLEAN DISSECTION IT RISES ABOUT NINE AND A HALF FOLD FROM THE RESTING ZONE INTO THE
  PREHYPERTROPHIC ZONE. The second probe set, 232771_at, is below background in all ten arrays and is read
  as a dead probe, not as disagreement.
  WHAT THIS DOES AND DOES NOT DO. It closes the expression half of
  g_l8_nrk_has_no_skeletal_experiment_in_any_species: the gene is present, in humans, in the tissue, at high
  level, in the zones where growth happens. IT SAYS NOTHING ABOUT DIRECTION. Human NRK pLoF is +3.79 cm, so
  the therapeutic direction would be inhibition, and nothing here bears on that. AND THE CORR-314 CAVEAT IS
  CARRIED: NRK is X-linked and the two donors are one female and one male, so the donors are not comparable
  in magnitude - every claim here is detection WITHIN a donor, which does not use that comparison.

  FIVE - TWO GENES THE ATLAS HAS PROMOTED ARE BELOW BACKGROUND IN A HUMAN GROWTH PLATE, AND THAT IS RECORDED
  WHETHER OR NOT IT IS CONVENIENT.
  SPIN4 - round 281 called it "the cleanest pool lever in the atlas". Its single probe set is BELOW
  BACKGROUND IN ALL TEN ARRAYS: 36, 353, 178, 166, 186 in donor 1 against thresholds of 719-827, and
  146-209 in donor 2 against 254-451. Zero of five in each donor.
  PTHLH - round 290 made PTHrP the load-bearing buffer that lets HHIP loss be tolerated. THREE probe sets,
  both donors, ZERO OF FIFTEEN detections in each. PTHrP transcript is below background across the whole
  human growth plate at 11-13 years.
  NEITHER IS A REFUTATION AND BOTH ARE A WARNING. This platform is insensitive to low-abundance secreted and
  regulatory transcripts - this same notebook found NPPC, the ligand vosoritide amplifies, running one to two
  orders of magnitude below background in the same arrays while its receptors were detected. A single probe
  set below threshold is weak evidence of absence. But it is what the only human data says, and both claims
  were made on mouse.

  SIX - THE METHOD CONTROLS, BECAUSE THE ABOVE IS WORTHLESS WITHOUT THEM. IHH behaves exactly as a century of
  histology says it should: below background in resting and proliferative zones, then 9262 and 20856 in
  donor 1's prehypertrophic and hypertrophic zones, and ZERO OF FOUR in perichondrium. COL10A1 is absent
  from donor 1's resting zone and enormous in its hypertrophic zone. ACAN and COL2A1 are detected everywhere
  with ACAN five to ten fold lower in perichondrium than cartilage. The dissection reads correctly, the
  threshold discriminates, and the HHIP and FBN1 compartment results sit inside a set of positive and
  negative controls that all behave.
  AND THE DONOR RULE IS THIS NOTEBOOK'S OWN, NOT MINE. It had already established that donor 2's laser
  capture largely failed - COL10A1 at 15-36 per cent of hypertrophic level in donor 2's RESTING zone against
  0.6 per cent in donor 1's, and 1.0 versus 9.6 per cent of probe sets varying more than five-fold. Zonal
  ORDER is therefore taken from donor 1 only; donor 2 contributes presence and absence, where a failed
  dissection cannot manufacture a signal it did not have.

  SEVEN - A SMALL CONTRIBUTION TO CORR-296, WHICH HAS BLOCKED FOUR ROUNDS. The chu2026 GP1/GP2 direction
  cannot be assigned because GAS1 (+3.06, padj 1.8e-10) disagrees with SFRP5, PTHLH and NT5E. In this human
  dataset GAS1 is detected in ZERO of ten cells in donor 1 and is FLAT across all five compartments in donor
  2 (1197, 951, 1066, 1219, 542). A gene with no zonal structure in the only human growth plate available is
  a poor calibration marker in any species. That does not resolve CORR-296 - nothing here can, since this is
  bulk human zones and that is mouse single-cell clusters - but it identifies which of the four markers is
  carrying the disagreement, and it is the one that was already the outlier.
human_evidence: direct
human_evidence_note: >-
  This round is entirely human primary data - laser-microdissected growth plate from two normal children
  aged 11 y 10 m and 13 y 3 m, the only such dataset in existence. Its weaknesses are stated in full: n = 2,
  one platform, one analyst, and one of the two dissections failed on this notebook's own genome-wide test,
  so zonal ordering rests on a single donor. Detection is read against a per-array empirical null that
  passed a preregistered control. Everything about DIRECTION of effect remains mouse and human-genetic.
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  Unusually low FOR WHAT IS CLAIMED, because what is claimed is localisation in the target species and
  target tissue rather than a mechanism or an effect. There is no translation step between "HHIP transcript
  is present in human proliferative-zone chondrocytes and absent from human perichondrium" and the human
  case. The risk sits entirely in what this does NOT show: expression is not function, a transcript is not a
  protein, two children are not a population, and nothing here says that lowering HHIP in a human would add
  a millimetre.
confidence: B
confidence_reason: >-
  The compartment results are B: four probe sets and two donors agreeing on HHIP's absence from
  perichondrium is 8/8, the positive and negative controls in the same arrays behave correctly, and the
  detection rule was preregistered and validated before these genes were chosen. Held at B rather than A by
  n = 2, by the single failed dissection, and by the fact that these particular genes were chosen post hoc -
  which is declared in the script header rather than hidden. The negative results on SPIN4 and PTHLH are
  held at D because absence on one platform, at one age, on one or three probe sets, is weak.
claim_grades:
- claim: >-
    HHIP is expressed in the human growth plate, in the resting and proliferative zones.
  grade: B
  basis: >-
    FIRST HUMAN MEASUREMENT OF THIS GENE IN A GROWTH PLATE. GSE9160, detection against each array's
    olfactory-receptor empirical null. Donor 1 (clean dissection): proliferative zone detected on three of
    four probe sets at 879, 1301 and 1493 against a threshold of 746. Donor 2: resting and proliferative
    detected on three of four. Below background in prehypertrophic and hypertrophic in both. Agrees with
    haraguchi2025's mouse in situ localisation to resting-zone chondrocytes and with chu2026's mouse
    baseMean of 3.73. Two species, two platforms, one answer.
- claim: >-
    HHIP is not expressed in human perichondrium, and therefore cannot mediate the FBN1 effect.
  grade: B
  basis: >-
    ZERO OF EIGHT probe-donor cells above background - donor 1 at 144, 59, 217, 22 against a threshold of
    827; donor 2 at 26, 19, 42, 13 against 451. In the same arrays IHH is also 0/4 in perichondrium while
    reaching 20856 in the hypertrophic zone, and ACAN and COL2A1 ARE detected in perichondrium, so the
    compartment is not globally silent and the threshold is not simply too high. Independently corroborates
    round 291's refutation of the guo2024 unification from a different species, platform and tissue source.
- claim: >-
    FBN1 and HHIP occupy complementary compartments of the same human growth plate.
  grade: B
  basis: >-
    In donor 1, FBN1's ONLY detection across five compartments and three probe sets is the PERICHONDRIUM
    (1607 against 827; all cartilage zones below background), while HHIP's only detections are in cartilage
    and none is perichondrial. This is the compartment specificity sedes2022 established functionally in
    mouse - Scx-Cre yes, Col2-Cre no - measured in a human. It converts round 291's "different pathways"
    into "different tissues", which is the strongest form of the independence claim and the argument for
    combining the two levers rather than choosing between them.
- claim: >-
    NRK is expressed in the human growth plate in every compartment.
  grade: B
  basis: >-
    FIRST HUMAN SKELETAL MEASUREMENT OF THIS GENE. Probe 227971_at detected in all five compartments of both
    donors - 1050, 8062, 9980, 9289, 3556 in donor 1 against thresholds of 719-827 - one of only three genes
    in this round's list, with ACAN and COL2A1, to be detected everywhere. Rises about 9.5-fold from resting
    into prehypertrophic zone in the clean donor. Probe 232771_at is below background on all ten arrays and
    is read as a dead probe. Closes the expression half of
    g_l8_nrk_has_no_skeletal_experiment_in_any_species. SAYS NOTHING ABOUT DIRECTION - human NRK pLoF is
    +3.79 cm, so the therapeutic direction is inhibition, and nothing here bears on that.
- claim: >-
    The NRK zonal gradient can be compared between the two donors.
  grade: X
  basis: >-
    NO, AND THIS IS CORR-314 APPLIED TO A SECOND DATASET ON THE SAME DAY. NRK is X-linked and GSE9160's two
    donors are one female and one male. Donor 1 rises into the prehypertrophic zone and donor 2 falls; that
    difference cannot be attributed to biology when it is confounded with sex AND with a failed dissection.
    Every NRK claim in this node is detection WITHIN a donor.
- claim: >-
    SPIN4 and PTHLH are absent from the human growth plate.
  grade: D
  basis: >-
    WHAT THE DATA SAYS, HELD LOW BECAUSE ABSENCE IS WEAK. SPIN4's single probe set is below background in
    all ten arrays; PTHLH is 0/15 in each donor across three probe sets. Both were promoted on mouse -
    round 281 called SPIN4 the cleanest pool lever in the atlas, round 290 made PTHrP the buffer that lets
    HHIP loss be tolerated. AGAINST reading these as refutations: this same notebook found NPPC, the ligand
    vosoritide amplifies, one to two orders of magnitude below background in the same arrays while its
    receptors were detected, so the platform is demonstrably insensitive to low-abundance secreted and
    regulatory transcripts. Recorded because it is what the only human data says.
key_refs:
- ref_id: gse9160
  year: 2007
  type: dataset
  one_line_finding: >-
    The only zone-resolved transcriptome of a human growth plate - reserve, proliferative, prehypertrophic,
    hypertrophic and perichondrium from two normal children. Queried here for HHIP and NRK for the first
    time: HHIP is a cartilage gene absent from perichondrium in 8/8 probe-donor cells, FBN1's only donor-1
    detection is the perichondrium, and NRK is detected in every compartment of both donors
- ref_id: haraguchi2025
  pmid: '41509161'
  year: 2025
  type: primary
  one_line_finding: >-
    Localises Hhip1 mRNA to resting-zone chondrocytes, periosteum and primary spongiosa in mouse - the
    compartment the human data now independently returns for the cartilage half
- ref_id: sedes2022
  year: 2022
  type: primary
  one_line_finding: >-
    Established the FBN1 mechanism as perichondrial and showed Col2-Cre deletion gives no overgrowth; the
    human arrays put FBN1's only clean-donor detection in exactly that compartment
- ref_id: chu2026
  year: 2026
  type: primary
  one_line_finding: >-
    Mouse growth-plate expression giving HHIP baseMean 3.73, above FGFR3 - the measurement this round
    replicates in a human
- ref_id: kosmicki2026
  year: 2026
  type: preprint
  one_line_finding: >-
    Supplies the direction this dataset cannot - HHIP pLoF +9.92 cm, NRK pLoF +3.79 cm - so localisation and
    direction come from different sources and neither is asked to do the other's work
contradicts: >-
  Does not overturn a prior node. It CORROBORATES
  round291_hhip_has_chemical_matter_after_all_and_the_unification_died_on_sedes_own_data from an independent
  species and platform, and upgrades its conclusion from "different pathways" to "different tissues".
  IT PUTS TWO EXISTING PROMOTIONS UNDER A HUMAN NEGATIVE, at grade D and no higher: SPIN4, promoted in round
  281 as the cleanest pool lever in the atlas, and PTHLH, made the load-bearing buffer in round 290, are both
  below background in every array of the only human growth-plate transcriptome. Given the same notebook's
  NPPC result these are warnings about platform sensitivity as much as about the genes, and are recorded as
  such.
builds_on: round291_hhip_has_chemical_matter_after_all_and_the_unification_died_on_sedes_own_data
