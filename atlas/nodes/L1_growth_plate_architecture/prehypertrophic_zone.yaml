id: prehypertrophic_zone
name: Prehypertrophic zone
aliases:
- PHZ
- zone of maturation
- transitional zone
type: tissue_structure
layer: L1
stub: false
summary: 'The prehypertrophic zone is the narrow stratum where chondrocytes have left the cell cycle but
  have not yet begun the large volume increase of terminal hypertrophy. It is defined by position and
  by marker expression (Indian hedgehog and PTH1R in rodents) rather than by an unambiguous morphological
  boundary, which is why stereological studies define strata by unbiased position rather than by eye.
  In quantitative terms this zone is where phase 1 of chondrocyte enlargement occurs: a roughly three-fold
  volume increase from about 600 fl to 2000 fl at constant dry mass density in mouse, that is, true hypertrophy
  with proportionate macromolecular synthesis, before the swelling phase begins. Because the transition
  out of this zone is the committed step toward the volume increase that generates most elongation, its
  timing is the point at which local signals (IGF, Ihh/PTHrP, CNP, FGFR3) are integrated into growth rate.
  Reserve of caution: essentially all prehypertrophic zone marker work is murine, and the zone is not
  separately quantified in any human histomorphometric series.'
quantitative:
- parameter: volume increase during phase 1 of enlargement
  value: 600 to 2000
  unit: fl
  conditions: mouse proximal tibia; ~3-fold at constant dry mass density 0.183 pg/fl
  species: mouse
  source_ref: cooper2013
  uncertainty: approximate values as stated
localization:
- 'mouse PHZ: defined by Ihh/PTH1R expression and by unbiased stratum position'
- 'human PHZ: not separately quantified in published histomorphometry'
human_evidence: absent
human_evidence_note: No human histomorphometric series reports the prehypertrophic zone as a separate
  compartment; human studies report proliferative and hypertrophic zones only (byers2000).
species_basis:
