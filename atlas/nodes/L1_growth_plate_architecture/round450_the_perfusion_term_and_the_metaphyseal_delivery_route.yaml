id: round450_the_perfusion_term_and_the_metaphyseal_delivery_route
name: R450 - the plate's solute supply was measured in 1955 and it is METAPHYSEAL and CHARGE-INDEPENDENT,
  the periosteal effect is a within-bone cross-plate signal with opposite signs at the two ends, and every
  abandoned method that worked worked by raising local perfusion
