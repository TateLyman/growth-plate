human_evidence_note: The arteriovenous-anastomosis, sympathectomy, ivory-screw and 40 C heat arms are human
  clinical series, but every one of them is uncontrolled or historically controlled, in poliomyelitis
  anisomelia, and most reach this file secondhand through nordentoft1964's catalogue rather than through the
  primary. The tracer and growth-pattern measurements are rabbit.
translation_risk: high
translation_risk_reason: The delivery-route measurement is rabbit and semiquantitative fluorescence, the
  human perfusion series are 1930s-1960s uncontrolled surgical case series in a disease population, and the
  only internally-controlled modern confirmation is a rat model of a vascular malformation. The one arm that
  was tested non-surgically in humans - local heat at the knee - was null.
summary: 'COVERAGE BEFORE THIS ROUND, MEASURED. hyperaemia and hyperemia return zero node and gap files and
  zero CLAUDE.md; sympathectomy zero nodes; anisomelia zero; Brodin zero; nutrient artery zero. arteriovenous
  returns five files and one ledger mention, perfusion eleven and one. The whole question of whether BLOOD
  SUPPLY sets longitudinal growth rate - the question the field spent 1867 to 1964 on - is a near-total blind
  spot in an atlas with about 950 nodes.


  ONE. THE DELIVERY ROUTE INTO THE PLATE WAS MEASURED DIRECTLY IN 1955 AND IT IS METAPHYSEAL AND
  CHARGE-INDEPENDENT. brodin1955 injected two chemically opposite fluorescent tracers intravenously into
  rabbits - 3,4-benzpyrene, which is water-INSOLUBLE and neutral, and sodium 3-oxypyrene-5,8,10-trisulphonate,
  which is water-soluble and ACIDIC, i.e. a trianion - and killed animals at 30 seconds, 1 minute, 3.5 minutes
  and 10 minutes. Both tracers were demonstrated in THE SAME PARTS of the epiphyseal cartilage, which is the
  author''s own basis for concluding that the spread is not governed by electrolytic dissociation. Entry was
  mainly from the METAPHYSEAL side, less from the perichondrial and epiphyseal borders; the perichondrium
  itself took up the fluorochrome strongly but passed little of it on to the cartilage. The internal control
  is the one that makes the asymmetry interpretable: an EXCISED plate soaked in the tracer for 30 seconds took
  it up from BOTH borders, so the in vivo one-sidedness is a property of the SUPPLY and not of the tissue.


  THAT MATTERS FOR TWO THINGS THIS FILE HAS BUILT. It bears on R430''s Donnan calibration, which predicts that
  a dianion partitions at 0.189 and would put a trianion near 0.08, because a trisulphonate and a neutral
  polycyclic hydrocarbon reaching the same places is not what strong charge exclusion looks like. The honest
  limit is that fluorescence intensities cannot be compared across two different fluorophores, so what is
  comparable is the spatial PATTERN and not the concentration - but the pattern is the thing Donnan is
  supposed to distort. And it bears on depot placement: R373, R374 and R385 to R387 specified the SAG depot in
  the EPIPHYSEAL secondary ossification centre because that is where trompet2024 put its bead, while the
  plate''s dominant physiological solute supply is the metaphyseal marrow. Those are not contradictory, since
  a depot works by proximity rather than by the physiological route, but the two placements have never been
  compared - and R442 independently found that a sustained METAPHYSEAL occlusion lengthens a bone.


  AND A CORRECTION TO BRODIN, MADE WITH THIS FILE''S OWN ARITHMETIC. He concluded the tracers could hardly
  have entered by ordinary diffusion because they reached the inner portion within 30 seconds, and proposed
  minute canals running parallel to the cartilage columns and communicating with the metaphyseal spongiosa.
  For a roughly 500 Da solute at a cartilage diffusivity of 1 to 3 times 10^-10 m2/s the diffusion length
  sqrt(2Dt) is 78 to 134 micrometres at 30 seconds, 205 to 355 at 3.5 minutes and 346 to 600 at 10 minutes.
  A rabbit epiphyseal plate at that age is of the order of a few hundred micrometres, so the entire observed
  sequence - periphery only early, uniform by 10 minutes - is what ORDINARY DIFFUSION PREDICTS, and the canal
  inference is not supported by his own timings, which give no distance. What survives untouched is the
  ASYMMETRY and the CHARGE-INDEPENDENCE. The corrected reading is therefore favourable to R428 and R430 rather
  than against them: the plate behaves like a diffusion-fed tissue whose source is one-sided and metaphyseal,
  and it agrees on timescale with farnum2006, where a 332 Da solute reaches about 100 per cent of the vascular
  concentration and saturates in five minutes.


  TWO. THE PERIOSTEAL EFFECT IS A WITHIN-BONE CROSS-PLATE SIGNAL WITH OPPOSITE SIGNS AT THE TWO ENDS.
  brodin1955, 44 rabbits, metal indicators implanted in the bone, contralateral leg as control, followed to
  160 days. Ollier''s loosening of the periosteum from the PROXIMAL half of the tibia ACCELERATED growth from
  the DISTAL plate - the one at the far end, outside the operative field - by an average 0.12 mm in week one
  and a further 0.22 mm in week two, with individual maxima of 1.5 mm at seven weeks and 1.6 mm at sixteen
  weeks; and it INHIBITED the PROXIMAL plate from the second week onward, greatest individual decrease 1.0 mm
  at ten weeks. Both changes were still present at 160 days. THE NEAR PLATE GOES DOWN AND THE FAR PLATE GOES
  UP, in one bone, from one local intervention.


  THAT IS THE WITHIN-BONE VERSION OF THE CROSS-BONE ANOMALY R440, R441 AND R442 COULD NOT EXPLAIN - a plate
  nobody touched changing its rate - and it refines the modern periosteal literature, because kaneko2020 and
  the rest measure WHOLE-BONE length and would score this as simply a longer operated tibia. The compartment
  split has not been reported since. Brodin also refutes both standard explanations himself: osteogenin cannot
  explain a substance released proximally that stimulates the distal plate while inhibiting the nearer one,
  and the Cr-51 erythrocyte blood-volume rise he measured lasted at most two and a half weeks against a
  160-day growth change. His own stated unrun experiment is the one that would settle the term: produce a
  PERSISTENT circulatory disturbance WITHOUT damaging the bone.


  THREE. THE ABANDONED-METHODS CATALOGUE, AND EVERY METHOD THAT WORKED WORKED BY RAISING LOCAL PERFUSION. All
  of the following are secondhand within nordentoft1964 and are recorded as such. Hierton 1961 created a
  femoral artery-to-vein anastomosis in 5 children with poliomyelitis sequelae and progressive anisomelia;
  with the anastomosis open for 5.3 to 7.5 years the anisomelia DECREASED BY 3.0 TO 6.5 CM, with arteriography
  afterwards showing extremely ample vascularization around the epiphysial zones at the knee, all patients
  developing varicose veins and three developing leg ulcers that healed once normal circulation was
  re-established, and no demonstrable cardiac complication. janes1961 with Jennings found 5 of 8 patients
  improving by a mean 2.7 cm at a mean 4.4 years while 3 progressed, and ALL developed considerable cardiac
  dilatation which subsided when the anastomosis was closed. Gullickson, Kubicek and Kottke 1951 is the
  bidirectional and internally controlled version: electrical stimulation of the sympathetic trunk in 10
  puppies gave an average SHORTENING of 2.8 mm on the stimulated side, while lumbar sympathectomy in 6 puppies
  gave INVARIABLY a lengthening of 2.7 to 14.0 mm, average 6.5 mm, against a normal control series whose
  maximum was 1 mm and whose average difference was 0.2 mm.


  AND THE SAME CATALOGUE CONTAINS R442''S RESULT, SEVENTY YEARS EARLY. Trueta 1953 found that SEVERING the
  nutrient arteries of rabbits produced no growth stimulation, while BLOCKING THEIR LUMINA WITH WAX, or
  periosteal stripping around the nutrient foramen, DID - and his own generalisation was that stimulation
  appears chiefly when the lesion is diaphyseal and is active ONLY WHILE THE MEDULLARY CAVITY IS OCCLUDED.
  R442 read lee2023metaphyseal and park2025metaphyseal as showing that a metaphyseal defect lengthens a bone
  ONLY IF FILLED WITH BONE WAX, an unfilled or Tisseel-filled defect doing nothing, and concluded the stimulus
  is SUSTAINED OCCLUSION rather than injury or hyperaemia. The same material, the same filled-versus-unfilled
  contrast and the same conclusion, seven decades apart, with neither group citing the other.


  FOUR. THE MODERN INTERNALLY-CONTROLLED CONFIRMATION, AND THE ZERO-HIT THAT SHOULD NOT BE ZERO.
  bojakowski2015 made a side-to-side arteriovenous fistula between the common femoral vessels in Wistar rats
  with proximal venous outflow limitation and SHAM-OPERATED THE CONTRALATERAL LIMB; at 30 days there was
  significant elevation of common iliac vein pressure and limb overgrowth, and the authors state that the
  overgrowth is caused by muscle overgrowth, varicose vein formation AND BONE ELONGATION, with femoral bone
  length measured. Against that, three PubMed queries - arteriovenous fistula with limb length discrepancy and
  dialysis or haemodialysis; haemodialysis access with bone growth or limb length in children; and the same
  with arm length - return ZERO records for the first. Thousands of children have carried a surgically created
  forearm arteriovenous fistula for years through the growth period with a perfect contralateral internal
  control, and nobody has measured whether that arm is longer. The caveats are real and must be stated with
  it: R330 finds the upper limb contributes nothing to standing height, and chronic kidney disease is a badly
  confounded growth population - but the contralateral arm controls every systemic confound there is.


  FIVE. THE OBVIOUS DRUG IDEA, RUN BEFORE PROPOSING, AND IT DOES NOT SURVIVE. The tempting move is that a
  vasodilator is a non-surgical arteriovenous fistula, and that R298''s kill of the nitrate and soluble
  guanylate cyclase shelf and R300''s kill of PDE5A were about the CHONDROCYTE while a vasodilator''s target
  is vascular smooth muscle in the epiphyseal and metaphyseal vessels - a different tissue, which is exactly
  the CORR-342 inversion that licensed romosozumab for the regenerate after SOST''s absence killed it at the
  plate. Four things stop it. First, this file''s own data: kawabe2025''s cilostazol lengthens EX VIVO
  metatarsals from 120.7 to 127.6 per cent at 10 micromolar, and an explanted rudiment has no blood supply, so
  that result cannot be a perfusion effect. Second, R305 killed PDE5A a third time on a mouse length endpoint,
  body length -1.092 at P=2.3e-05, discordant with the human +1.42 cm. Third and most specific, Zinn and
  colleagues 1941 via nordentoft1964 injected carbon particles into rats after sympathectomy and found
  hyperaemia of the leg EXCEPT the marrow cavity, with LESS carbon in the operated marrow than in controls,
  which they attributed to soft-tissue vasodilatation drawing flow AWAY from the marrow. A systemic vasodilator
  lowers resistance in skin and muscle; an arteriovenous fistula raises flow through the deep femoral system.
  THEY ARE NOT THE SAME INTERVENTION AND THE STEAL RUNS THE WRONG WAY. Fourth, Brodin argues against both
  passive and active hyperaemia as the CAUSE of the growth change on his own data.


  SIX. AND THE NON-SURGICAL PERFUSION-RAISING INTERVENTION THAT HAS ACTUALLY BEEN TRIED IN HUMANS AT THE KNEE
  IS NULL. Ring and Lee 1958, via nordentoft1964, maintained 40 C around the epiphysial zones at the knee in 4
  children with poliomyelitis sequelae and demonstrated NO influence on longitudinal growth. This atlas''s
  local_limb_warming node asserts that there are NO HUMAN DATA OF ANY KIND on this axis, which is false. It
  does not close the axis - four children, no controls stated, a disease population, secondhand - and the same
  catalogue records Richards and Stofer 1959 obtaining a 2 to 6 per cent growth increment with ELECTRICAL
  heating of animal epiphysial regions, which is a different modality from external warming. But the human
  arm exists and it is negative, and the node must say so.


  SEVEN. WHAT NORDENTOFT HIMSELF FOUND, WHICH IS THE HONEST CEILING ON THE WHOLE CLASS. His own series is the
  largest published for Pease''s ivory screws - 44 long bones in 26 patients - and gave a SIGNIFICANT average
  growth stimulation of about 2 mm confined to the FIRST postoperative year, with the annual progression of
  anisomelia 2.32 mm greater in years two and three than in year one at p below 0.01, no case exceeding the
  average effect, and the effect gone within a year. Lumbar sympathectomy on 16 bones in 11 patients gave no
  definite stimulation. He rejected both procedures. So the class contains one arm with centimetre-scale
  effects sustained over years - the arteriovenous anastomosis, which is surgical, carries cardiac dilatation
  in one series and varicose veins and ulcers in the other, and is excluded here on route - and a set of
  smaller arms that decay within a year or do not replicate.'
