  year: 2000
  type: primary
  one_line_finding: '46 human ribs, 11 days to 13.5 years: proliferative and hypertrophic zone heights collapse to
    34% and 26%, most of it in the first year, while chondrocyte lacunar diameter does not change and matrix volume
    fraction and septal thickness rise.'
- ref_id: kember1976
  pmid: '1018028'
  first_author: Kember NF
  year: 1976
  type: primary
  one_line_finding: '12 human distal femora birth to 14 years with paired Harpenden growth rates: hypertrophic cell
    height 29-38 um with NO age dependence, 33 +/- 5 um at 5-8 years, and a derived proliferative cell cycle time
    of 20 days against 2 days in rat.'
- ref_id: kember1993
  pmid: '8219479'
