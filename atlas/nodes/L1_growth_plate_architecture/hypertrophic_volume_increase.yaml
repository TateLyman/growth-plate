id: hypertrophic_volume_increase
name: Hypertrophic chondrocyte volume increase
aliases:
- chondrocyte enlargement
- hypertrophic swelling
- three-phase hypertrophy
type: process
layer: L1
stub: false
summary: 'Terminal chondrocyte enlargement is the largest single contributor to longitudinal elongation and the parameter
  that correlates best with growth rate across mammals. Quantitative phase microscopy of live dissociated mouse chondrocytes
  resolves the enlargement into three phases with distinct biophysics. Phase 1 is true hypertrophy: volume rises from
  about 600 fl to 2000 fl with dry mass density held at 0.183 pg/fl, the normal value for healthy cells. Phase 2 is
  swelling: volume rises from about 2000 fl to 8000 fl while dry mass production continues at a lower relative rate,
  so density falls to about 0.07 pg/fl, a roughly 60% dilution confirmed independently by tomographic phase microscopy.
  Phase 3 resumes proportional growth at the new low density, taking mouse proximal tibial cells from 8000 fl to about
  14,000 fl. Which phases a plate executes determines its growth rate: the slow mouse proximal radius truncates phase
  2 at about 5000 fl and omits phase 3 entirely, the jerboa metatarsal extends phase 3 to about 23,000 fl, and Igf1-deficient
  cells stop at about 7000 fl. Volume increase is fast and time-boxed: proximal tibial cell height more than triples
  within roughly 12 h and cells then sit at terminal size for roughly another 12 h before being removed at the chondro-osseous
  junction. Stereologically, the rat proximal tibia shows a 4-fold height and 10-fold volume increase from proliferative
  to late hypertrophic stage. None of this has been measured in human cells.'
quantitative:
- parameter: HUMAN terminal hypertrophic cell height, and whether it varies with age
  value: 29-38 across birth to 13 years, NO AGE DEPENDENCE; 33 +/- 5 at ages 5-8
  unit: um
  conditions: human distal femur, 12 necropsy subjects; maximum dimension of the cell spaces in the direction of growth,
    five groups of ten cells per specimen along the metaphyseal border; celloidin, 15 um sections, 13% linear processing
    shrinkage measured and corrected
  species: human
  source_ref: kember1976
  uncertainty: 'ADDED 2026-08-06. THIS NODE PREVIOUSLY RECORDED human_evidence AS ABSENT while the human measurement
    had existed since 1976. The finding that matters is the NULL: across the whole of human childhood the parameter
    this node calls the largest single contributor to elongation does not move. The only departures are the two 14-year-olds
    with closure in progress (39 um male, 25 um female). n = 12 subjects, 1-2 per age, so this bounds a trend loosely
    rather than tightly.'
- parameter: RAT terminal cell size and whether it varies with age
  value: yes - lower hypertrophic zone cells reach 40 um at 2-4 weeks and are ABSENT in old rats
  unit: um
  conditions: Wistar rat femur and tibia, ages 2-16 weeks against 62-80 weeks; growth plate height maximal at 2 and
    4 weeks
  species: rat
  source_ref: roach2003
  uncertainty: THE SPECIES DISSOCIATION IS THE POINT. In old rats all growth plate cells are the size of the PROLIFERATIVE
    cells of young plates - the capacity for volume increase is lost - and the authors conclude that absence of the
    volume increase is the main factor associated with deceleration and eventually cessation of growth. In human the
    same parameter is flat from birth to 13 years while growth velocity varies several-fold. THE VARIABLE THAT SHUTS
    GROWTH DOWN IN THE RAT IS THE ONE THE HUMAN HOLDS CONSTANT. Recorded as contradiction C-L1-09.
- parameter: terminal cell size across nine bird species, against their growth rates
  value: 10 to 18 um (22 um in one chicken), with NO CLEAR TREND against growth rate
  unit: um, mean diameter in the plane of growth
  conditions: 68 growth plates - tarsometatarsus and a phalangeal bone - across a range of avian species including
    rhea, Abdim's stork and budgerigar, with growth rates from serial external measurement [schema vocabulary has
    no "bird"; the literal basis is nine avian species]
  species: multiple
  source_ref: kember1990
  uncertainty: PRIMARY, AND IT IS THE CLEANEST TEST OF THIS NODE'S CENTRAL CLAIM THAT THE ATLAS HOLDS. The authors
    state the variation in terminal cell size was NOT a major cause of differences in growth rate and that the differences
    seen were within biological variation, sampling error and processing shrinkage; labelling percentage was likewise
    similar at 10-15%; and the major cause of between-species growth rate differences was THE SIZE OF THE FLAT CELL
    ZONE. Birds also have SMALLER hypertrophic cells than mammals while growing faster. Growth rate per flat cell
    did not scale with adult body weight (r = -0.22, n = 6, not significant), so cycle time appears independent of
    body size and metabolic rate. Between-clade comparison of a shrinkage-sensitive measurement.
- parameter: a dwarfing mutation that acts on terminal cell height ALONE
  value: 'Type I cn: hypertrophic cell height reduced, proliferation-zone cell number hardly reduced, mitotic rate
    normal'
  unit: qualitative
  conditions: achondroplastic (cn) homozygous mice aged 16-34 days against normal littermates; tritiated thymidine
    1 h before cull, labelling profiles from >=100 labelled cells per profile, heights of 100 hypertrophic cells per
    section. Normal mouse labelling index 9-13%
  species: mouse
  source_ref: thurston1985cn
  uncertainty: THE OTHER DIRECTION OF C-L1-09 AND IT MATTERS. Human development does not vary terminal cell height,
    and across bird species it does not track growth rate - but BREAKING it is sufficient to dwarf an animal with
    proliferation untouched. Invariance under physiology is not the same as irrelevance under perturbation, and this
    node should not be read as saying h_term does not matter. The same paper reports a Type II phenotype in which
    proliferation-zone cell size, mitotic index AND hypertrophic cell height are all reduced, and the two types cannot
    be told apart by body size - so the mutation's expressivity is itself heterogeneous and the authors attribute
    this to a second unidentified factor in some colonies.
