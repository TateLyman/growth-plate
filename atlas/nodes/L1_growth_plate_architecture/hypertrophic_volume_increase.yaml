id: hypertrophic_volume_increase
name: Hypertrophic chondrocyte volume increase
aliases:
- chondrocyte enlargement
- hypertrophic swelling
- three-phase hypertrophy
type: process
layer: L1
stub: false
summary: 'Terminal chondrocyte enlargement is the largest single contributor to longitudinal elongation
  and the parameter that correlates best with growth rate across mammals. Quantitative phase microscopy
  of live dissociated mouse chondrocytes resolves the enlargement into three phases with distinct biophysics.
  Phase 1 is true hypertrophy: volume rises from about 600 fl to 2000 fl with dry mass density held at
  0.183 pg/fl, the normal value for healthy cells. Phase 2 is swelling: volume rises from about 2000 fl
  to 8000 fl while dry mass production continues at a lower relative rate, so density falls to about 0.07
  pg/fl, a roughly 60% dilution confirmed independently by tomographic phase microscopy. Phase 3 resumes
  proportional growth at the new low density, taking mouse proximal tibial cells from 8000 fl to about
  14,000 fl. Which phases a plate executes determines its growth rate: the slow mouse proximal radius
  truncates phase 2 at about 5000 fl and omits phase 3 entirely, the jerboa metatarsal extends phase 3
  to about 23,000 fl, and Igf1-deficient cells stop at about 7000 fl. Volume increase is fast and time-boxed:
  proximal tibial cell height more than triples within roughly 12 h and cells then sit at terminal size
  for roughly another 12 h before being removed at the chondro-osseous junction. Stereologically, the
  rat proximal tibia shows a 4-fold height and 10-fold volume increase from proliferative to late hypertrophic
  stage. None of this has been measured in human cells.'
