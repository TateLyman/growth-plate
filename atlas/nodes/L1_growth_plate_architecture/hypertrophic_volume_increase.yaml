confidence_note: 'HELD AT C on 2026-08-06. Adding a human measurement does not raise the grade because the human measurement
  is a null in 12 subjects and the node''s positive claims remain rodent. What it does is bound the node''s transferability:
  the claim that terminal cell enlargement is the largest single contributor to elongation is well supported across
  mammals as a BETWEEN-species and between-site regression, and is not supported as a WITHIN-human developmental variable,
  because in humans it does not vary. Further constrained 2026-08-06 by kember1990 and kember1987: across nine bird
  species terminal cell size does not track growth rate, and a chicken plate elongates about 26 times faster than
  a human distal femur on cells less than half the height. The node''s claim now stands as a BETWEEN-SITE and WITHIN-species-and-age
  regression in mammals, and is contradicted as a general determinant of growth rate both across birds and across
  human development.'
