localization:
- 'mouse HZ: measured on dissociated live cells (cooper2013)'
- 'rat HZ: measured by stereology (hunziker1987)'
- 'human HZ: unmeasured'
human_evidence: absent
human_evidence_note: No quantitative phase, interferometric or stereological measurement of human hypertrophic
  chondrocyte volume or dry mass density exists; a targeted PubMed search returned six records, none in
  human growth plate tissue (search log g_l1arch_008).
species_basis:
- mouse
- rat
- porcine
- multiple
translation_risk: high
translation_risk_reason: Every number in this node is rodent (or jerboa). The mammalian volume-versus-growth-rate
  relationship already fails in birds (barreto1994) and has a species-specific slope between rat and pig
  (breur1991), so the mouse volume set points cannot be applied to human plates without measurement.
confidence: C
