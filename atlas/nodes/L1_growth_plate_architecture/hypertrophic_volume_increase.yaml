human_evidence: direct
human_evidence_note: UPGRADED FROM ABSENT 2026-08-06 on reading kember1976 in full. Human terminal hypertrophic cell
  height is 29-38 um from birth to 13 years with no detectable age dependence, 33 +/- 5 um at ages 5-8, measured directly
  in the direction of growth with a measured shrinkage correction. The human evidence is therefore a NULL on the age
  axis, which is the opposite of what the rodent literature in this node would predict.
