  conditions: implanted marker measurement of daily growth rate
  species: rabbit
  source_ref: klein1994
  uncertainty: as stated
- parameter: shape of the daily growth velocity distribution
  value: single Gaussian
  unit: qualitative
  conditions: rabbit proximal tibia, direct daily measurement
  species: rabbit
  source_ref: klein1994
  uncertainty: interpreted by the authors as evidence of continuous growth
- parameter: fraction of elongation occurring during recumbency
