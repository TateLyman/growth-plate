  uncertainty: range across events; n = 31 infants (19 female, 12 male)
- parameter: stasis interval duration
  value: 2-63
  unit: days
  conditions: human infants, first 21 months
  species: human
  source_ref: lampl1992
  uncertainty: range across intervals
