id: saltation_stasis_growth
name: Saltation and stasis growth
aliases:
- saltatory growth
- episodic growth
- mini growth spurts
type: hypothesis
layer: L1
stub: false
summary: 'The saltation-and-stasis model holds that linear growth is not continuous but occurs in discrete
  bursts separated by intervals of true zero growth. Lampl, Veldhuis and Johnson reported from serial
  infant measurements (n = 31 infants measured weekly, semi-weekly or daily over the first 21 months)
  that length accrues in 0.5-2.5 cm saltations separated by stasis intervals of 2-63 days, with 90-95%
  of days growth-free. The claim is contested on both statistical and biological grounds. Klein and colleagues
  measured rabbit proximal tibial elongation directly with about 15-fold better precision than human anthropometry
  and obtained a single Gaussian distribution of daily velocities rather than the bimodal distribution
  the model predicts, concluding growth is continuous; Heinrichs et al. published a further critique in
  Science. The saltation camp replied that frequency-distribution shape cannot exclude saltation, showing
  by Monte Carlo simulation that a genuinely pulsatile process can produce unimodal, left- or right-skewed
  distributions depending on sampling frequency, measurement error and study duration. A third position
  holds that short-term growth is chaotic rather than discretely saltatory, with mini growth spurts and
  no true stasis. Separately from the statistical dispute there is one unambiguous, directly measured
  discontinuity: in lambs with implanted microtransducers at least 90% of elongation occurs during recumbency,
  so growth is mechanically gated on a diurnal cycle. Canine proximal tibial growth measured with implanted
  tantalum markers has been reported as following the saltation-and-stasis model. The dispute has never
  been settled because no group has measured the same preparation with both camps'' instruments.'
