  value: 90-95
  unit: '% of days'
  conditions: human infants, first 21 months
  species: human
  source_ref: lampl1992
  uncertainty: as stated by the authors
- parameter: implied annualised velocity during a growth event
  value: greater than 350
  unit: cm/year
  conditions: recalculation of the saltation model by its critics
  species: human
  source_ref: klein1994
  uncertainty: critics' arithmetic, stated in the abstract
