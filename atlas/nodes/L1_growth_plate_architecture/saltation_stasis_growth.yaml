  source_ref: noonan2004
  uncertainty: as stated
localization:
- 'human infants: external anthropometry (lampl1992)'
- 'rabbit proximal tibia: direct implanted measurement (klein1994)'
- 'lamb tibia: continuous microtransducer (noonan2004)'
- 'dog proximal tibia: tantalum markers, monthly radiographs (mcbrien2011)'
human_evidence: direct
human_evidence_note: The human evidence is serial anthropometry in infants (lampl1992) and its statistical
  re-analysis; there is no direct human measurement of physeal elongation at daily resolution.
species_basis:
- human
- rabbit
- ovine
- rat
translation_risk: moderate
translation_risk_reason: The pro-saltation evidence is human but indirect (surface anthropometry with
  a technical error exceeding the mean daily increment); the strongest anti-saltation evidence is direct
  but from rabbit. Neither camp has measured the human physis.
confidence: D
