confidence_note: 'HELD AT C on 2026-08-06 after adding the human row. The human value is a derivation with an imported
  rabbit assumption and n=12 subjects, and the rat values it sits beside are properly measured - so the node''s grade
  is not raised by adding it. What the addition changes is the node''s reach: any model that carries a cycle time
  from rodent into human is now carrying a 15-fold error, and the atlas can say so. Further qualified 2026-08-06 (CORR-014):
  the human row is a zone mean of unknown growth fraction, the rat rows are measured cycle times of cycling cells,
  and the node does not claim they are commensurable. Partially resolved 2026-08-06: wilsman1996 measures the rat
  growth fraction at 0.89-0.99, so the rat cycle times and the human zone mean differ by at most 11% on that account
  in rat. The human growth fraction is still unmeasured, so the comparison is still not clean - but the ambiguity
  now lives entirely on the human side.'
