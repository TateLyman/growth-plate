id: cell_cycle_time_pz
name: Proliferative zone chondrocyte cell cycle time
aliases:
- PZ cycle time
- chondrocyte cell cycle duration
type: process
layer: L1
stub: false
summary: 'Proliferative-zone chondrocytes are slow-cycling compared with most renewing tissues, and the
  cycle length is set almost entirely by G1. In 28-day-old rats measured in vivo by repeated bromodeoxyuridine
  pulses, total cycle time is 30.9 h in the fast proximal tibia, 34.0 h in the distal radius, 48.7 h in
  the distal tibia and 76.3 h in the slow proximal radius; the proximal tibia and distal radius do not
  differ significantly but all other pairwise differences do. S phase is 3.4-6.1 h, G2 is 3.0 h and M
  is 0.5-0.6 h, so essentially the whole 2.5-fold spread in cycle time is G1. This makes G1 length a locally
  controlled determinant of differential growth, in parallel with the hypertrophic volume set point. The
  human situation is very different and much worse characterised: Kember and Sissons derived a mean cycle
  time of about 20 days for the human distal femoral proliferative zone from a column length of 24 cells
  and a radiographic growth rate of 1.4 cm/yr, and explicitly warned against extrapolating rodent kinetics
  to humans. That figure is inferred, not measured; it assumes steady state and that every proliferative-zone
  cell cycles. Thurston and Kember''s in vitro tritiated thymidine labelling of human plates found no
  labelled cells at all in two of four subjects.'
