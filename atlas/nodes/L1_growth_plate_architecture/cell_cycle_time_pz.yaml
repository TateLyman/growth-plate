- 'human distal femur PZ: labelling index and cell count measured; cycle time derived from them (thurston1985)'
- 'human PZ: cycle time still never measured directly'
human_evidence: indirect
human_evidence_note: 'Two human cycle-time figures now exist and both are derived: ~20 days from column
  counts plus a radiographic growth rate (kember1976) and ~15 days from a measured 28-cell proliferation
  zone plus a measured 20.5 um hypertrophic cell height and the same radiographic growth rate (thurston1985).
  The inputs to the second are real measurements; the output is still an arithmetic consequence of the
  growth rate, so neither can be used to predict elongation without circularity. What is genuinely measured
  in human tissue is the labelling index (3.4-4.4%) and the proliferation-zone cell count (13-28), and
  the labelling failed entirely in two of four subjects.'
species_basis:
- rat
- human
- porcine
translation_risk: high
translation_risk_reason: The human and rat values differ by roughly 16-fold and the human value is derived
  rather than measured. Any inference about proliferation-targeting drug exposure windows, radiation sensitivity
  or chemotherapy effects on the physis depends on which figure is right.
confidence: C
