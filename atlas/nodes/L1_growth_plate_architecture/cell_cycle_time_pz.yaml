human_evidence: direct
human_evidence_note: UPGRADED FROM INDIRECT 2026-08-06. kember1976 gives a human distal-femoral proliferative cell
  cycle time of 20 days at ages 5-8, derived from human growth rates and human histology. It is a derivation rather
  than a label-based measurement, and no label-based human measurement exists or is likely to.
species_basis:
- rat
- human
- porcine
translation_risk: high
translation_risk_reason: The human and rat values differ by roughly 16-fold and the human value is derived rather
  than measured. Any inference about proliferation-targeting drug exposure windows, radiation sensitivity or chemotherapy
  effects on the physis depends on which figure is right.
confidence: C
