localization:
- 'rat PZ: measured in vivo (wilsman1996a)'
- 'human distal femur PZ: derived only (kember1976)'
- 'human PZ: never measured directly'
human_evidence: indirect
human_evidence_note: The only human figure is a ~20-day cycle time derived arithmetically from column
  cell counts and radiographic growth rate (kember1976), supported by an in vitro labelling study in four
  subjects in which two yielded no labelled cells (thurston1985).
species_basis:
- rat
- human
- porcine
translation_risk: high
translation_risk_reason: The human and rat values differ by roughly 16-fold and the human value is derived
  rather than measured. Any inference about proliferation-targeting drug exposure windows, radiation sensitivity
  or chemotherapy effects on the physis depends on which figure is right.
confidence: C
