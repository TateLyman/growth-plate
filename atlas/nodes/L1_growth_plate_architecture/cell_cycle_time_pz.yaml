id: cell_cycle_time_pz
name: Proliferative zone chondrocyte cell cycle time
aliases:
- PZ cycle time
- chondrocyte cell cycle duration
type: process
layer: L1
stub: false
summary: 'Proliferative-zone chondrocytes are slow-cycling compared with most renewing tissues, and the cycle length
  is set almost entirely by G1. In 28-day-old rats measured in vivo by repeated bromodeoxyuridine pulses, total cycle
  time is 30.9 h in the fast proximal tibia, 34.0 h in the distal radius, 48.7 h in the distal tibia and 76.3 h in
  the slow proximal radius; the proximal tibia and distal radius do not differ significantly but all other pairwise
  differences do. S phase is 3.4-6.1 h, G2 is 3.0 h and M is 0.5-0.6 h, so essentially the whole 2.5-fold spread in
  cycle time is G1. This makes G1 length a locally controlled determinant of differential growth, in parallel with
  the hypertrophic volume set point. The human situation is very different and much worse characterised: Kember and
  Sissons derived a mean cycle time of about 20 days for the human distal femoral proliferative zone from a column
  length of 24 cells and a radiographic growth rate of 1.4 cm/yr, and explicitly warned against extrapolating rodent
  kinetics to humans. That figure is inferred, not measured; it assumes steady state and that every proliferative-zone
  cell cycles. Thurston and Kember''s in vitro tritiated thymidine labelling of human plates found no labelled cells
  at all in two of four subjects. The two that did label give the only human numbers of their kind: a labelling index
  of 4.4% and a proliferation zone of 28 cells in the distal femur of a 10-year-old girl, and 3.4-4.0% with 13 proliferation-zone
  cells in the metatarsals and distal fibula of an 18-month-old girl - against 10-15% in actively growing rodents.
  From those the authors recomputed the human cycle time as roughly 15 days (28 cells / 1.9 cells per day), which
  supersedes the 20-day figure but reproduces its circularity exactly: the 1.9 cells/day comes from dividing a radiographic
  growth rate by the measured cell height, so the cycle time still cannot independently predict growth. The authors
  also state plainly that S-phase duration cannot be measured by a single-pulse method; their 16 h estimate, or 22
  h after a +40% age-distribution correction taken from a rat computer simulation, is longer than any other human
  tissue, which they attribute either to method artefact or to the large hypoxic inert zone slowing metabolism.'
quantitative:
- parameter: TOTAL CELL CYCLE TIME, PROLIFERATIVE ZONE, HUMAN
  value: 20, about +/-50% (i.e. 10-30); floor about 16 days
  unit: days
  conditions: human distal femur at ages 5-8 years. Derived from measured distal-femoral growth rate 1.4 cm/yr = 38
    um/day (Harris growth-arrest lines on serial Harpenden Growth Study radiographs), terminal cell height 33 um giving
    1.2 new cells per column per day, and 36 cells in the combined maturation and proliferation zones of which two
    thirds are taken as proliferative by analogy with rabbit, i.e. 24 cells
  species: human
  source_ref: kember1976
  uncertainty: 'ADDED 2026-08-06 ON READING kember1976 IN FULL. The node has cited this reference since it was created
    and carried no human value; every quantitative row was rat. THE UNITS ARE DAYS AGAINST HOURS IN EVERY OTHER ROW:
    20 days is 480 h against 30.9 h in fast rat proximal tibia, a roughly 15-fold difference in the same parameter.
    It is a derivation and not a measurement - no human growth plate has been labelled - and its weakest step, the
    proliferative fraction of the column, is imported from rabbit; the authors give at least 20 proliferative cells
    as a floor, hence about 16 days. It is also a MEAN over a heterogeneous zone. QUALIFIED 2026-08-06 (CORR-014).
    kember1993 gives the method''s precision as about +/-50% and states that the low human labelling percentage does
    NOT unequivocally mean slower cycling, because the human growth fraction may be low and the cells in cycle could
    be dividing as fast as in rodents - undecidable while human S-phase duration remains unmeasured. THE COMPARISON
    WITH THE RAT ROWS IN THIS NODE IS THEREFORE BETWEEN A MEAN OVER A WHOLE ZONE (human, derived) AND A CYCLE TIME
    OF CYCLING CELLS (rat, BrdU-measured), and those are not the same quantity.'
- parameter: growth fraction in the same four rat plates, which is what makes the rat cycle times commensurable with
    a human zone mean
  value: 0.99, 0.99, 0.98, 0.89
  unit: fraction of proliferative-zone cells in cycle
  conditions: proximal tibia, distal radius, distal tibia, proximal radius; continuous BrdU by osmotic pump, labelling
    index followed to plateau at 12, 24, 48 and 72 h
  species: rat
  source_ref: wilsman1996
  uncertainty: 'ADDED 2026-08-06. THIS RESOLVES HALF OF THE COMMENSURABILITY PROBLEM THIS NODE RECORDED THE SAME DAY:
    because the rat growth fraction is essentially 1, the rat cycle times ARE the rat zone means, and the comparison
    with the human 20-day zone mean is legitimate on the rat side. It remains illegitimate on the human side, where
    the growth fraction is unmeasured. The one plate below 0.99 is the slowest-growing.'
