id: cartilage_canal
name: Cartilage canal
aliases:
- epiphyseal cartilage canal
- canals of Wegner
type: tissue_structure
layer: L1
stub: false
summary: 'Cartilage canals are vascularised connective-tissue channels that invade the epiphyseal cartilage
  before the secondary ossification centre appears. They carry arterioles, venules, capillaries and mesenchymal
  cells into an otherwise avascular tissue, form a discrete network within the epiphysis, and determine
  where the secondary centre will form: in mouse, cartilage canals establish the marrow space that the
  secondary centre subsequently occupies, and they influence the fate of the resting chondrocytes they
  pass. Their mesenchymal cells express bone-relevant proteins and can become osteocytes, so the canals
  are not merely a plumbing system but a delivery route for osteogenic precursors. In human epiphyses,
  the vessels that build the ossification centres arise by sprouting from the bone collar or by intussusception
  rather than from circulating CD133+ endothelial progenitors, and vascular invasion of the joint anlage
  is delayed relative to the surrounding tissue. Canals are also the point of vulnerability in osteochondrosis
  of large animals, where failure of canal blood supply causes focal ischaemic chondronecrosis.'
