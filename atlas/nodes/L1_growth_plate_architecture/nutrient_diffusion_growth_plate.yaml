id: nutrient_diffusion_growth_plate
name: Nutrient diffusion in the growth plate
aliases:
- solute transport in physeal cartilage
- metabolite gradients
type: process
layer: L1
stub: false
summary: 'Because the growth plate contains no vessels, every solute a chondrocyte needs must diffuse
  from the epiphyseal or metaphyseal margins through a dense, negatively charged proteoglycan matrix,
  and every waste product must leave the same way. The consequence is that the interior of the plate is
  simultaneously the most hypoxic and the most nutritionally remote compartment, and that plate height
  is bounded by diffusion. This is one plausible reason why growth plate height falls as animals mature
  and why bulk plate height is a poor predictor of growth rate. The direct evidence for a nutrient gradient
  is much weaker than for the oxygen gradient: the only zonal transport measurements in the growth plate
  literature are the oxygen electrode profiles of Brighton and Heppenstall, and the strongest indirect
  evidence is that mouse chondrocytes have evolved an intracellular oxygen store (haemoglobin bodies)
  precisely because delivery is marginal. Glucose, lactate and amino acid gradients across the plate have
  not been measured in any species, and no human measurement of any kind exists. Treating this node as
  established biology would be an error; it is a well-motivated inference from tissue architecture.'
