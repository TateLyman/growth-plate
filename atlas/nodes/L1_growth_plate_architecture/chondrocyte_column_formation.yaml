id: chondrocyte_column_formation
name: Chondrocyte column formation
aliases:
- columnarisation
- column morphogenesis
type: process
layer: L1
stub: false
summary: 'A proliferative chondrocyte divides with its cleavage plane perpendicular to the long bone axis,
  so the two daughters initially sit side by side across the growth direction. To build a column the doublet
  must rotate roughly 90 degrees before separating. Live imaging established that this is a rotation on
  a dynamic cell-cell and cell-matrix adhesion surface, not the convergent-extension intercalation originally
  inferred from static 2D sections; beta1 integrin, N-cadherin and alpha-parvin are each required. 3D
  clonal analysis has since shown that the rotation is far less reliable than the textbook picture implies.
  In E18.5 mouse growth plates only 17.6% (distal femur) and 19.4% (proximal tibia) of neighbouring clonal
  cell pairs sit at the 60-90 degree elevation angle that indicates a completed rotation; most embryonic
  clones are ellipsoidal clusters oriented orthogonal to the growth axis. Postnatally rotation improves
  but is still imperfect: within P40 columns 39.5% (distal femur) and 36.4% (proximal tibia) of divisions
  show complete rotation and fewer than 10% are near-perfect (80-90 degrees). A column therefore tolerates
  about 60% incomplete rotations before the structure buckles sideways into a cluster. This reframes columns
  as a postnatal, elongation-favouring configuration rather than a prerequisite for growth.'
