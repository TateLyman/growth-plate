localization:
- 'mouse PZ: 3D clonal analysis (rubin2024); live-imaged rotation (romereim2014)'
- 'human PZ: column cell counts measured (kember1976) but rotation never observed'
human_evidence: indirect
human_evidence_note: Human proliferative columns are described histologically and counted (24 cells per
  column in distal femur), but the rotation mechanism has never been observed in human tissue.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: All mechanistic and quantitative data are from mouse live imaging and lineage
  tracing. Human plates have longer columns and much slower cycling, so the geometry of stacking may differ.
confidence: C
