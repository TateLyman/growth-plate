id: chondrocyte_hypertrophy
name: Chondrocyte hypertrophy
aliases:
- terminal differentiation
- hypertrophic differentiation
type: process
layer: L1
stub: false
summary: 'Chondrocyte hypertrophy is the post-mitotic programme in which a flattened proliferative chondrocyte
  becomes a large, axially elongated cell, and it is the single largest contributor to longitudinal growth.
  Mechanically the enlargement is anisotropic: the cell increases its height in the growth direction far
  more than its lateral diameter, because the surrounding longitudinal matrix channels constrain it. Hunziker
  and Schenk showed in rat that this shape modulation, not volume as such, is what changes when growth
  accelerates - between 21 and 35 days the final cell height rises and lateral diameter falls while final
  cell volume is slightly reduced. The volume increase itself has three biophysically distinct phases,
  of which the middle one is fluid uptake that dilutes dry mass by about 60%, so a large hypertrophic
  chondrocyte is a diluted cell, not simply a bigger one. The whole programme is time-boxed: about two
  days in rat regardless of growth rate, and roughly 24 h in mouse. Hypertrophic cells are metabolically
  active throughout, with 2-5 fold expansion of secretory organelles, and remain alive to the chondro-osseous
  junction.'
