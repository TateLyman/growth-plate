  species: rat
  source_ref: wilsman1996a
  uncertainty: approximate range as stated
- parameter: mean distal femoral growth rate
  value: '1.4'
  unit: cm/year
  conditions: human, ages 5-8 years, serial radiographs from the Harpenden Growth Study
  species: human
  source_ref: kember1976
  uncertainty: mean value; dispersion not reported
- parameter: mean distal femoral growth rate expressed per day
  value: '38'
  unit: um/day
  conditions: human, ages 5-8 years; arithmetic conversion of 1.4 cm/year
  species: human
  source_ref: kember1976
  uncertainty: derived from the reported annual rate
- parameter: distal femoral contribution to femoral growth after age 7
  value: '1.3'
  unit: cm/year
  conditions: human, ages 7 to skeletal maturity, halving in the final two years
  species: human
  source_ref: pritchett1992
  uncertainty: n = 244 children (123 boys, 121 girls), 6-monthly teleroentgenograms
- parameter: fraction of lamb tibial elongation occurring during recumbency
  value: '90'
  unit: '% or more'
  conditions: implanted microtransducer, sampling every 167 s for 21-25 days
  species: ovine
  source_ref: noonan2004
  uncertainty: authors state at least 90%
