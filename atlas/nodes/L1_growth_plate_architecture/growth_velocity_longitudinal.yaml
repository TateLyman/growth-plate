id: growth_velocity_longitudinal
name: Longitudinal growth velocity at the physis
aliases:
- elongation rate
- physeal growth rate
- bone elongation velocity
type: phenotype
layer: L1
stub: false
summary: 'Longitudinal growth velocity is the axial displacement produced per unit time by a single growth
  plate, and it spans nearly an order of magnitude between plates of the same animal at the same moment.
  In 28-day-old rats the four plates studied by Wilsman and colleagues ran at approximately 50 to 400
  um per 24 h. Human plates are far slower: the distal femur, the fastest human physis, averaged 1.4 cm
  per year between ages 5 and 8 in the Harpenden Growth Study series, which is about 38 um per day, and
  contributes roughly 1.3 cm per year from age 7 until the final two years of growth when it halves. Velocity
  is measured in animals by fluorochrome (oxytetracycline or calcein) double labelling, or continuously
  by implanted microtransducers; in humans only by serial radiography over months, or externally by knemometry.
  The rate is not steady on short timescales: implanted microtransducers in lambs show at least 90% of
  elongation occurs during recumbency and almost none during standing or locomotion, so velocity is mechanically
  gated on a diurnal cycle even where the multi-day average is smooth.'
