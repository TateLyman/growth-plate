human_evidence: direct
human_evidence_note: Human physeal growth rates have been measured directly by serial radiography with
  roentgenstereophotogrammetric analysis in a cohort of 244 children followed 6-monthly to maturity (pritchett1992)
  and from the Harpenden Growth Study (kember1976).
