id: terminal_cell_shape_modulation
name: Terminal hypertrophic cell shape modulation (height vs diameter)
aliases:
- phenotype modulation
- chondrocyte aspect ratio
- cell-shape modelling
type: process
layer: L1
stub: false
summary: 'Physiological change in longitudinal growth rate is carried by a change in the SHAPE of the terminal
  hypertrophic chondrocyte, not its size. In rat proximal tibia between 21 and 35 days, a 20% rise in
  growth rate is accounted for almost entirely by a 23% rise in final cell height (31.2 to 38.5 um, P<0.02)
  accompanied by a 14% FALL in final lateral diameter (29.9 to 25.6 um, P<0.03) and a 13% FALL in final
  cell volume (P<0.03). Matrix produced per cell, cells produced per column per day, and the duration of
  the hypertrophic phase are all unchanged. Hunziker and Schenk call this phenotype modulation, and it
  is the single most direct measurement of which variable carries a physiological change in growth rate
  in any species. It matters because it dissociates height from volume: the two move in OPPOSITE directions
  during acceleration, so the between-plate correlation of final hypertrophic VOLUME with elongation rate
  (r=0.98 in rat, r=0.83 in pig, breur1991) cannot be the causal relationship within a plate over time.
  Growth deceleration is not the mirror image - between 35 and 80 days height, volume, and cell turnover
  all fall together - so the system is asymmetric, and only acceleration isolates shape as the lever. What
  sets the aspect ratio is unknown. The cell is a pressurised object inside a constraining pericellular
  matrix and a lattice of longitudinal septa, so an anisotropic constraint could convert a fixed volume
  increase into height rather than width, but no experiment has manipulated the constraint and measured
  the resulting cell dimensions or bone length.'
quantitative:
- parameter: final terminal cell height during growth acceleration
  value: 31.2 -> 38.5
  unit: um
  conditions: rat proximal tibia, 21 days (suckling) to 35 days (pre-pubertal growth spurt), stereology,
    n=6 per age; growth rate rose 20% over the same interval
  species: rat
  source_ref: hunziker1989
  uncertainty: +23%, P<0.02; coefficients of error between animals 3.7-14.3% across the parameter set
- parameter: final terminal cell lateral diameter during growth acceleration
  value: 29.9 -> 25.6
  unit: um
  conditions: same animals and interval as the height measurement
  species: rat
  source_ref: hunziker1989
  uncertainty: -14%, P<0.03. The cell becomes TALLER AND NARROWER, which is why this is a shape change
    rather than a size change.
- parameter: final terminal cell volume during growth acceleration
  value: '-13'
  unit: '% change'
  conditions: rat proximal tibia, 21 to 35 days, while growth rate rose 20%
  species: rat
  source_ref: hunziker1989
  uncertainty: 'P<0.03. THE DECISIVE ROW: volume falls while growth rises, so volume is not the causal
    variable within a plate over time.'
- parameter: aspect ratio (height/diameter) of the terminal cell
  value: 1.04 -> 1.50
  unit: dimensionless
  conditions: rat proximal tibia, derived from the reported heights (31.2, 38.5 um) and diameters (29.9,
    25.6 um) at 21 and 35 days
  species: rat
  source_ref: hunziker1989
  uncertainty: DERIVED BY THIS ATLAS from two reported means; the paper does not report a ratio and no
    dispersion can be propagated from the published summary statistics. A 44% rise in aspect ratio
    accompanies a 20% rise in growth rate.
- parameter: matrix volume produced per cell
  value: '0'
  unit: '% change'
  conditions: rat proximal tibia, unchanged during BOTH acceleration (21-35 d) and deceleration (35-80
    d)
  species: rat
  source_ref: hunziker1989
  uncertainty: 'not significantly different in either comparison. Matrix is a large contributor to
    elongation but is not a regulator of it - the authors'' own conclusion is that cartilage matrix
    plays a subordinate role in regulating growth rate.'
- parameter: human terminal cell height and diameter
  value: not measured together
  unit: none
  conditions: human growth plate, any site, any age
  species: human
  source_ref: thurston1985
  uncertainty: 'RECORDED AS AN ABSENCE. thurston1985 and kember1976 both report a human hypertrophic cell
    HEIGHT (and disagree, 20.5 vs 33 um, contradiction C-L1-07). Neither reports the transverse diameter
    in the same cells, so no human aspect ratio exists and the one quantity hunziker1989 identifies as
    the carrier of growth-rate change has never been measured in a human.'
localization:
- 'rat proximal tibia hypertrophic zone: height, diameter and volume measured separately (hunziker1989)'
- 'human: height measured, diameter never measured, aspect ratio unknown'
human_evidence: absent
human_evidence_note: No human study reports terminal hypertrophic cell height and transverse diameter in
  the same specimen, so the human aspect ratio is unknown and its relationship to human growth rate is
  untested. The entire result rests on one rat study, which no one has repeated in any species.
species_basis:
- rat
translation_risk: high
translation_risk_reason: A single unreplicated rat study is the whole evidential basis. The human plate
  differs from rat in cycle time by roughly an order of magnitude and carries a large inert zone rat lacks,
  and human terminal cell height is itself contested by 61%.
confidence: C
