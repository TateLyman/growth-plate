localization:
- 'mouse HZ: single-cell volume and density measured (cooper2013)'
- 'rat HZ: stereology and ultrastructure (hunziker1987)'
- 'swine HZ: terminal condensation stage described (farnum1989a)'
- 'human HZ: axial cell heights measured, 20.5-26 um; no volume (thurston1985)'
human_evidence: direct
human_evidence_note: Human terminal hypertrophic cell height is measured, not inferred - 20.5 um in a 10-year-old
  distal femur and 26 um in an 18-month-old metatarsal (thurston1985, full text). What remains absent is
  a human VOLUME, because height without a transverse cross-sectional area cannot give one, and the transverse
  dimension was not measured in that study or any other human study found. The two subjects also carry
  disease context (osteosarcoma of the contralateral tibia; congenital absence of the tibia), and the tissue
  was decalcified paraffin, which shrinks hypertrophic lacunae by an amount nobody has quantified.
