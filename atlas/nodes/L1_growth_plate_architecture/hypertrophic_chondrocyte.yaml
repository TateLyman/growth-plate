id: hypertrophic_chondrocyte
name: Hypertrophic chondrocyte
aliases:
- terminal hypertrophic chondrocyte
- enlarged chondrocyte
type: cell_type
layer: L1
stub: false
summary: 'The hypertrophic chondrocyte is the cell whose volume increase produces most of the elongation
  of a long bone. In mouse proximal tibia it reaches about 14,000 fl from a starting volume of about 600
  fl, a roughly 23-fold increase, achieved by three sequential mechanisms: proportionate biosynthetic
  growth, then a swelling phase that dilutes dry mass density from 0.183 to about 0.07 pg/fl, then renewed
  proportionate growth at that low density. In rat the same process is described stereologically as a
  4-fold height and 10-fold volume increase accompanied by 2-5 fold increases in rough endoplasmic reticulum,
  Golgi and mitochondrial compartments, so these are not degenerate cells; time-lapse imaging confirms
  they remain alive up to the chondro-osseous junction, passing through a discrete condensation stage
  immediately before removal. Final volume correlates linearly with elongation rate across four plates
  and two ages in rat (r=0.98) and pig (r=0.83), with a species-specific slope, and the relationship fails
  altogether in birds. No human hypertrophic chondrocyte volume has been reported with unbiased stereology.
  The human terminal cell HEIGHT along the growth axis, however, has been measured directly: 20.5 um in
  the distal femur of a 10-year-old girl and 26 um in the metatarsals and distal fibula of an 18-month-old
  girl, each the mean of twenty cells along the metaphyseal border read with an eyepiece graticule
  (thurston1985). This is the only absolute axial height recorded for a human plate, and it is the
  conversion factor the atlas flow model previously halted on.'
