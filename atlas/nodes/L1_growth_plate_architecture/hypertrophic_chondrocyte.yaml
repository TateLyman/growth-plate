id: hypertrophic_chondrocyte
name: Hypertrophic chondrocyte
aliases:
- terminal hypertrophic chondrocyte
- enlarged chondrocyte
type: cell_type
layer: L1
stub: false
summary: 'The hypertrophic chondrocyte is the cell whose volume increase produces most of the elongation of a long
  bone. In mouse proximal tibia it reaches about 14,000 fl from a starting volume of about 600 fl, a roughly 23-fold
  increase, achieved by three sequential mechanisms: proportionate biosynthetic growth, then a swelling phase that
  dilutes dry mass density from 0.183 to about 0.07 pg/fl, then renewed proportionate growth at that low density.
  In rat the same process is described stereologically as a 4-fold height and 10-fold volume increase accompanied
  by 2-5 fold increases in rough endoplasmic reticulum, Golgi and mitochondrial compartments, so these are not degenerate
  cells; time-lapse imaging confirms they remain alive up to the chondro-osseous junction, passing through a discrete
  condensation stage immediately before removal. Final volume correlates linearly with elongation rate across four
  plates and two ages in rat (r=0.98) and pig (r=0.83), with a species-specific slope, and the relationship fails
  altogether in birds. No human hypertrophic chondrocyte volume has been reported with unbiased stereology. The human
  terminal cell HEIGHT along the growth axis has been measured twice, and the two measurements do not agree. Kember
  and Sissons report 33 +/- 5 um for the distal femur at ages 5-8 and 29-38 um across twelve subjects from birth to
  thirteen years with no age dependence, from celloidin sections with a measured 13% linear processing shrinkage corrected
  for. Thurston and Kember report 20.5 um from one 10-year-old distal femur and 26 um from one 18-month-old metatarsal,
  from decalcified paraffin with no shrinkage correction stated. The disagreement is 61%, and the smaller value lies
  outside the entire range of the larger series. Reaching 20.5 um from 33 um requires 38% linear shrinkage. The method
  asymmetry runs one way - more subjects, more cells per subject, less shrinkage-prone embedding and an explicit correction
  all favour the higher value - but nothing in either paper settles it, and it is recorded as a contradiction rather
  than averaged. The distinction matters because this height is the conversion factor that turns a cell flux into
  a length flux in every derivation of the human cell cycle time.'
