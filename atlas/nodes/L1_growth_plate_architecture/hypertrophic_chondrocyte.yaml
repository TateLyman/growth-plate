localization:
- 'mouse HZ: single-cell volume and density measured (cooper2013)'
- 'rat HZ: stereology and ultrastructure (hunziker1987)'
- 'swine HZ: terminal condensation stage described (farnum1989a)'
- 'human HZ distal femur: axial cell height 33 +/- 5 um, n=12 subjects (kember1976)'
- 'human HZ distal femur: axial cell height 20.5 um, n=1 subject (thurston1985) - CONTRADICTS the above'
- 'rat HZ: cell volumes 4,135-14,997 um3 and cell volume fraction 0.504-0.685 at the junction (wilsman1996)'
human_evidence: direct
human_evidence_note: Human terminal hypertrophic cell height is measured, not inferred, but the two human measurements
  disagree by 61% - 33 +/- 5 um over twelve subjects (kember1976) against 20.5 um in one (thurston1985), with the
  methodological asymmetry running one way. What remains absent is a human VOLUME, because height without a transverse
  cross-sectional area cannot give one, and the transverse dimension was not measured in that study or any other human
  study found. The two subjects also carry disease context (osteosarcoma of the contralateral tibia; congenital absence
  of the tibia), and the tissue was decalcified paraffin, which shrinks hypertrophic lacunae by an amount nobody has
  quantified.
