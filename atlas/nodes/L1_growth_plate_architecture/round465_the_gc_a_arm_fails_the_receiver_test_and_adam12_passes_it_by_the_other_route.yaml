human_evidence: direct
human_evidence_note: GSE288028 is postnatal HUMAN growth-plate tissue, 12 usable samples after removing the two mouse
  libraries identified in R344. The purity split is computed within the nine male samples per R411 to remove the sex
  confound, and calibrated on COL2A1, ACAN, COL10A1, PTPRC and HBB in the same run.
translation_risk: low
translation_risk_reason: 'Human tissue, human question, and the calibrators behave. The residual risk is interpretive
  rather than translational: CORR-363 establishes that a low purity ratio measures investment rather than rate-limitation,
  so an absence call is strong and a low-but-present call is weak.'
summary: 'R464 promoted three headlines from the endpoint-first sweep. The free local query - CORR-316''s rule, run before
  any

  further literature work - kills one of them at the growth plate, qualifies the second and strengthens the third.

  GSE288028, sex-corrected purity split, four purest against four most contaminated MALE samples, calibrated on

  COL2A1 7.65 and ACAN 1.96 against PTPRC 0.00 and HBB 0.03.


  ONE - THE GC-A ARM FAILS CORR-327 AT THE PLATE, AND IT FAILS IN THE BAND THAT KILLED LOSARTAN AND SACUBITRIL.

  NPR1 is 0.5 CPM in pure cartilage at ratio 0.17. AGTR1 was 0.03 and MME was 0.17. suda1998''s BNP transgenic raises

  plasma BNP to 12.2 pmol per millilitre against a control of less than 0.06 - over two hundred fold - and BNP

  cross-activates NPR-B at high concentration. Against that, NPR2 in the same tissue is ratio 2.40 at 12.0 CPM and NPR3

  is 2.83 at 2.8 CPM, both cartilage-enriched. THE MOST PARSIMONIOUS READING OF THE BNP TRANSGENIC IS SPILLOVER ONTO

  NPR2, WHICH MAKES IT A SUBSTITUTION FOR THE CNP ARM ALREADY IN THE STACK RATHER THAN A NEW RECEPTOR ARM - Step 0,

  CORR-297. It is not a refutation of suda1998, whose length endpoint is real; it is a statement that the receptor the

  paper names is not in the tissue and the receptor that is there is the one navepegritide already occupies.


  AND THE WHOLE NATRIURETIC LIGAND SET IS ABSENT FROM THE PLATE, WHICH IS THE SAME CONFIGURATION THIS FILE ALREADY HELD

  FOR CNP AND HAS NOW EXTENDED TO THE ENTIRE FAMILY: NPPA 0.0 CPM at ratio 0.03, NPPB 0.0 detected in only 3 of 12

  samples, NPPC 0.1 at 0.46, OSTN 0.0 at 0.12. Receptors local, ligands systemic - for all three peptides, not just CNP.


  TWO - AND A QUALIFICATION THAT MATTERS FOR ANY FUTURE cGMP ARGUMENT: PRKG1 IS CONTAMINANT-LEANING HERE AT RATIO 0.05,

  29.5 CPM pure against 646.7 contaminated. R298 recorded PRKG1 as present and hypertrophy-enriched from GSE9160, rising

  1441 in the resting zone to 4228 in the hypertrophic zone. Two platforms, two answers. PRKG2 is 0.73 at 57.5 CPM.

  CORR-363 governs - a low purity ratio measures investment rather than rate-limitation and cannot by itself refute a

  zone-resolved measurement on another platform - but the discrepancy is recorded rather than smoothed, because R298''s

  conclusion that the plate carries the cGMP effector kinases is load-bearing for the whole CNP arm.


  THREE - ADAM12 IS CONTAMINANT-LEANING AT RATIO 0.24 AND THAT IS NOT THE RIGHT TEST FOR IT. It is 32.6 CPM in pure

  cartilage against 133.8 contaminated, detected in all twelve samples - genuinely present, not concentrated. Two reasons

  that is not a kill. First, CORR-363: the screen is structurally blind to universal machinery, and every other ADAM
  in

  the panel scores the same way - ADAM10 at 0.22, ADAM17 at 0.18, ADAM9 at 0.53, ADAM19 at 0.04 - with only ADAM15 at

  2.67 enriched. Second and decisively, kveiborg2006''s transgenic expresses ADAM12-S IN THE CIRCULATION, so the

  chondrocyte does not have to make it; the correct receiver test is whether its SUBSTRATES are in the tissue.


  AND THEY ARE, ABUNDANTLY. The mechanism the paper names is inhibition of chondrocyte adhesion to FIBRONECTIN and

  COLLAGEN II. FN1 is ratio 2.11 at 10,528.9 CPM - one of the most abundant transcripts in the entire tissue - and ITGB1

  is 1.71 at 310.7 CPM. COL2A1 is the calibrator at 7.65. So a circulating protease acting on chondrocyte-matrix adhesion

  has its named targets present at very high abundance in the target tissue, which is the configuration a systemically

  delivered agent needs and which the CNP ligand, the RAAS and PDE5A all fail.'
