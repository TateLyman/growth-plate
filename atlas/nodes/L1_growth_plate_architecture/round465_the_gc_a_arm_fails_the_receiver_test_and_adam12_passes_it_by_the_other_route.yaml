id: round465_the_gc_a_arm_fails_the_receiver_test_and_adam12_passes_it_by_the_other_route
name: 'R465 - the free local query run before any further literature work: the GC-A/NPR1 arm FAILS the receiver test
  at the growth plate and is most likely NPR2 spillover, the whole natriuretic ligand family is absent from the plate,
  and ADAM12''s SUBSTRATES are abundantly present even though ADAM12 itself is not enriched'
aliases:
