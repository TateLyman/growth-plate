id: clonal_column
name: Clonal chondrocyte column
aliases:
- chondrocyte column
- cell column
- clone
type: tissue_structure
layer: L1
stub: false
summary: 'The clonal column is the functional unit of the growth plate: a vertical stack of chondrocytes
  all descended from one progenitor, in which the life history of a single cell is displayed in space.
  Postnatally, after the secondary ossification centre forms, columns become monoclonal and originate
  from PTHrP-expressing resting-zone cells; embryonic columns are multiclonal. Column length in the proliferative
  zone is a measurable and species-distinctive quantity: 24 cells per column in the human distal femur.
  Because a steady-state column loses one cell at its base for every cell added at its top, column length
  together with the loss rate fixes the transit time; in the rat proximal tibia a column loses 8 cells
  per day. Computer simulation of stem-cell plus amplification-division parameters reproduces rabbit column
  structure, showing that observed column architecture is compatible with a simple hierarchical proliferation
  model. 3D imaging has complicated the classical picture by showing that postnatal columns are composites
  of ordered and disordered stacks and that they coexist with peripheral clusters, so ''column'' names
  a statistical tendency rather than a crystalline structure.'
