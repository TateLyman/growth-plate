- calcified cartilage zone
- zone of preparatory calcification
type: tissue_structure
layer: L1
stub: false
summary: 'The zone of provisional calcification is the thin stratum at the metaphyseal face of the plate
  in which the longitudinal cartilage septa mineralise while the transverse septa remain unmineralised,
  producing the scaffold on which the primary spongiosa is built. Time-of-flight secondary ion mass spectrometry
  of human polydactyly growth plates shows the transition is compositionally abrupt rather than graded:
  across the calcified cartilage interface there is a sharp decline in organic matrix ion fragments and
  a concurrent rise in mineral fragments, with a highly significant peak in the calcium to organic-nitrogen
  ratio. Correlations between organic and phosphate markers across the interface are consistent with progressive,
  ordered mineralisation rather than a single nucleation event. Radiographically this zone is the dense
  white line at the metaphyseal border of the physis and is the landmark used clinically to assess physeal
  integrity and, when it is disrupted, to diagnose rickets and scurvy. The mineral chemistry and matrix
  vesicle biology of this zone belong to the matrix and mineralisation layer; here it is treated as the
  architectural boundary that determines where vascular invasion can occur.'
