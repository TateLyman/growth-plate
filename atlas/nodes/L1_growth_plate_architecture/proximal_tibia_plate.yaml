id: proximal_tibia_plate
name: Proximal tibial growth plate
aliases:
- proximal tibial physis
type: tissue_structure
layer: L1
stub: false
summary: 'The proximal tibial physis is the second fastest human plate and the workhorse of experimental
  growth biology, because in rodents it is the fastest plate and is easy to access. In humans it supplies
  about 57% of tibial length overall, rising from 50% at age 7 to 80% at 14 in girls and to 80% at 16
  in boys. In the rat it is the reference plate for essentially every quantitative statement in this layer:
  elongating at the top of the 50-400 um/24 h range, with a proliferative cycle time of 30.9 h, an elongation
  partition of 9% division / 32% matrix / 59% hypertrophy, production of about 16,400 new chondrocytes
  per day, and loss of one cell per column every 3 h. In the mouse it is where the three-phase hypertrophic
  enlargement trajectory was defined, reaching a final chondrocyte volume of about 14,000 fl. The gap
  between this richly characterised rodent plate and the human plate of the same name is the central translational
  problem of the layer: the human proximal tibia has none of these parameters measured.'
