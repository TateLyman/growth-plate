id: borderline_zone
name: Borderline zone (peripheral borderline chondrocytes)
aliases:
- borderline chondrocytes
- peripheral transition zone
type: tissue_structure
layer: L1
stub: false
summary: 'At the outer margin of the growth plate, immediately adjacent to the perichondrium and the groove
  of Ranvier, sits a population of chondrocytes that are aligned perpendicular to the columnar chondrocytes
  rather than parallel to the growth axis. Inducible lineage tracing in mouse shows these borderline chondrocytes
  are not simply mis-oriented columnar cells: they behave as transient mesenchymal precursors, leaving
  the cartilage and contributing to marrow stromal cells and osteoblasts in the metaphysis. This is a
  route from cartilage to bone lineage that is distinct from the transdifferentiation of terminal hypertrophic
  chondrocytes at the chondro-osseous junction. Independently, 3D clonal analysis in mouse finds that
  postnatal growth plates retain small, disorganised, orthogonally oriented clusters specifically at the
  outer edges while the interior is columnar, which is architecturally consistent with a distinct peripheral
  compartment that supports lateral rather than longitudinal growth. Nothing equivalent has been shown
  in human tissue; the borderline compartment is defined entirely by mouse genetics.'
