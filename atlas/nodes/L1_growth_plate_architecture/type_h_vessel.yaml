id: type_h_vessel
name: Type H vessel
aliases:
- type H capillary
- CD31-hi endomucin-hi capillary
type: cell_type
layer: L1
stub: false
summary: 'Type H vessels are a capillary subtype in bone defined by high expression of CD31 (Pecam1) and
  endomucin, distinguished from the more abundant sinusoidal type L vessels. They are concentrated in
  the metaphysis immediately beneath the growth plate and in the endosteum, are surrounded by Runx2+ and
  osterix+ osteoprogenitors, and their abundance falls sharply with age in parallel with declining bone
  formation. Their functional claim is that they couple angiogenesis to osteogenesis: manipulating endothelial
  Notch or HIF signalling changes type H vessel abundance and changes bone mass in the same direction.
  For growth plate architecture their relevance is positional - they define the vascular compartment that
  meets the chondro-osseous junction and that hosts the septoclasts and osteoprogenitors which convert
  the cartilage template into primary spongiosa. The entire type H concept is murine; no human study has
  demonstrated a type H compartment at the human growth plate, and the human vessels characterised at
  the human chondro-osseous region were phenotyped with a different marker panel.'
