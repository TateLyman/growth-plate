id: chondrocyte_cluster
name: Chondrocyte cluster (non-columnar clone)
aliases:
- orthogonal clone
- non-columnar clone
- lateral clone
type: tissue_structure
layer: L1
stub: false
summary: 'A cluster is a clone of chondrocytes whose long axis lies at less than 60 degrees to the proximal-distal
  bone axis, that is, a clone that failed to convert its divisions into a longitudinal stack. Clusters
  are not an artefact or a pathological finding: in the E18.5 mouse growth plate they are the majority
  clone type, with only 17.6% (distal femur) and 19.4% (proximal tibia) of doublets stacked at 60-90 degrees,
  and they are elongated ellipsoids oriented orthogonal to the growth direction. Postnatally clusters
  persist but retreat to the outer edges of the plate while the interior becomes columnar. Their proposed
  function is bone widening rather than lengthening, and the evidence is correlative but quantitative:
  the expansion-to-elongation ratio measured by micro-CT falls from 0.16-0.18 embryonically, when clusters
  dominate, to 0-0.04 by P40, when columns dominate. Mechanistically a clone becomes a cluster when the
  cumulative fraction of incomplete division-plane rotations exceeds about 60%. This entity is a recent
  and mouse-only construct; whether human growth plates contain a comparable peripheral cluster compartment
  is unexamined.'
