id: terminal_cell_volume_is_the_undefended_term
name: The budget is paid in progenitors but the output is measured in micrometres — and terminal cell volume is the exchange rate nothing defends
type: hypothesis
layer: L1
stub: false
summary: 'THIS NODE IS A SYNTHESIS, NOT A FINDING. It assembles results the atlas already held and one
  re-analysis it performed, and it names a target. THE ARGUMENT. Height is bounded because the growth plate
  spends a finite pool of resting-zone progenitors and fuses when proliferation reaches zero (weise2001).
  So the currency of the budget is CELLS and the currency of the output is MICROMETRES, and what converts
  one into the other is the YIELD. The yield factorises exactly: micrometres per progenitor = (terminal
  cells produced per progenitor) x (height of each terminal cell). Call these AMPLIFICATION and h_term.
  EVERY LEVER THIS PROJECT HAS EXAMINED ACTS ON AMPLIFICATION, AND AMPLIFICATION IS THE TERM THAT COSTS
  BUDGET. More proliferation drains the pool faster and hastens fusion (nilsson2014). Slowing senescence
  works only by inhibiting growth, and four weeks of inhibition buys two (forcinito2011). More IGF or BMP
  does nothing to long-bone chondrocytes because they are already at ceiling for both (lui2018). h_term IS
  DIFFERENT IN FOUR WAYS AND EVERY ONE OF THEM POINTS THE SAME DIRECTION. FIRST, IT IS NOT WHAT NATURE
  VARIES. This atlas decomposed the yield from lui2018''s raw per-animal values and found that of the
  tenfold gap between a mouse metacarpal about to fuse and a femur that never will, AMPLIFICATION CARRIES
  86% AND TERMINAL CELL SIZE CARRIES 14%. At 2 weeks, before the metacarpal collapses, its terminal cells
  are 91% the size of the femur''s while it obtains one tenth the length per progenitor. SECOND, IN HUMANS
  IT IS FLAT. Terminal hypertrophic cell height is 29-38 micrometres from birth to 13 years with no age
  dependence (kember1976), and rib chondrocyte lacunar diameter likewise does not change (byers2000),
  across an interval in which human growth velocity varies several-fold and then spikes at puberty. Humans
  do not use this parameter to set growth rate. THIRD, IT IS NOT AT A CEILING. Terminal chondrocyte volume
  spans at least 4.6-fold across mammalian growth plates - about 5000 femtolitres in the slow mouse
  proximal radius against about 23000 in the jerboa metatarsal. FOURTH, AND THIS IS THE PART THAT MAKES IT
  A BUDGET ARGUMENT RATHER THAN A WISH: THE LARGEST COMPONENT OF THE ENLARGEMENT IS SWELLING, NOT
  BIOSYNTHESIS. Phase 2 takes the cell from about 2000 to 8000 femtolitres while dry mass density falls to
  about 0.07 pg/fl, a roughly 60% dilution. A cell that gets bigger by taking on water spends no divisions.
  THEREFORE: h_term enters height linearly with elasticity 1, varies several-fold between mammals, is held
  flat across human childhood, and is achieved largely osmotically. It is the one term in the height
  equation that is large, movable, and FREE - it buys micrometres without spending the pool that fusion is
  waiting on. THE OBVIOUS OBJECTION IS THE RIGHT ONE TO TEST. An invariant parameter may be invariant
  because nothing varies it, or because something DEFENDS it. This node asserts the first and cannot yet
  exclude the second, and the discriminator already exists in humans - CNP analogues expand the
  hypertrophic zone (agoston2007) and one is approved.'
quantitative:
- parameter: THE DECOMPOSITION — 86 PER CENT OF THE YIELD GAP IS AMPLIFICATION, 14 PER CENT IS CELL SIZE
  value: 'over the same 2-to-3-week interval in the same mice, femur against metacarpal: YIELD ratio 10.40x;
    terminal hypertrophic cell height ratio 1.38x (27.9 against 20.2 micrometres, interval means); residual
    amplification ratio 7.54x. On a log scale terminal cell size carries 14 per cent of the gap and
    amplification 86 per cent. AT 2 WEEKS ALONE, before the metacarpal terminal cell collapses, the ratio is
    only 1.10x (27.0 against 24.5 micrometres)'
  unit: fold ratio and per cent of the log gap
  conditions: RE-ANALYSIS BY THIS ATLAS of lui2018 S1 Data per-animal values (CC-BY), C57BL/6 mouse,
    n = 4-6 per age per bone. Yield from atlas/tools/yield_lui2018.py; terminal hypertrophic cell height
    from the same workbook, sheet Fig1C
  species: mouse
  source_ref: lui2018
  value_unverified: true
  uncertainty: 'THE DECOMPOSITION IS EXACT AS ARITHMETIC AND APPROXIMATE AS BIOLOGY. Yield divided by
    h_term gives terminal cells per progenitor PER COLUMN multiplied by the number of columns across the
    measured width, and column density was not measured, so the amplification RATIO between two bones is
    only equal to the residual if the two bones carry similar column density. That assumption is untested
    and it is the main weakness of this row - if the metacarpal has substantially fewer columns per 500
    micrometres, part of the 7.54x is geometry rather than amplification. THE YIELD ITSELF INHERITS EVERY
    LIMIT FROM ITS OWN NODE, the load-bearing one being that a fall in a standing stock is net rather than
    gross so the yields are upper bounds. AND A DIRECTIONAL CAUTION THAT CUTS AGAINST THE NODE''S OWN
    THESIS: a 14 per cent share means nature does NOT use terminal cell size to differentiate bones, which
    is the evidence offered here that it is undefended - but it is equally consistent with terminal cell
    size being CONSTRAINED, and the two readings are not separated by this calculation.'
- parameter: THE DRUG TEST, RUN — VELOCITY NEARLY DOUBLED AND BONE AGE DID NOT MOVE
  value: 'annualized growth velocity 4.53 +/- 1.61 to 8.09 +/- 1.58 cm/year, an increase of 3.56 cm/year
    (P < .0001); age- and sex-adjusted AGV Z-score -1.34 +/- 1.64 to +2.66 +/- 1.89, a 4.0 SD increase
    (95% CI 3.08-4.91). BONE AGE TO CHRONOLOGICAL AGE RATIO 0.94 +/- 0.20 AT DAY 1 AGAINST 0.92 +/- 0.17
    AT MONTH 12, P = .22 - no significant change in the entire cohort NOR IN ANY SUBGROUP; the ACAN
    subgroup, advanced at baseline as expected for that condition at 1.11 +/- 0.17, was 1.06 +/- 0.14 at
    month 12. Height gain 0.69 SD. CXM, a serum biomarker of type X collagen turnover, NEARLY DOUBLED'
  unit: cm/year, SD, and bone age over chronological age
  conditions: dauber2026, phase 2 open-label basket trial of vosoritide in children with RASopathies, ACAN
    deficiency and NPR2 deficiency - ALL NON-FGFR3 - each subject serving as their own control against a
    pretreatment observation period; all prepubertal at initiation; bone age read by a SINGLE reviewer
  species: human
  source_ref: dauber2026
  uncertainty: 'THIS IS THE EXPERIMENT THE PREVIOUS ROUND ASKED FOR, IN THE POPULATION IT ASKED FOR, AND IT
    RETURNS THE PREDICTED DISSOCIATION. A velocity drug spends capacity and advances the skeleton; a yield
    drug should not. Velocity rose 4.0 SD and the bone-age-to-chronological-age ratio did not move. THE
    AUTHORS MAKE THE COMPARISON THEMSELVES AND IT IS THE SHARPEST PART: growth hormone gave 0.49 SD in
    Noonan, 0.62 SD in ACAN deficiency and a median 0.7 SD in NPR2 deficiency in the first year - almost
    identical to vosoritide''s 0.69 SD here - but, in their words, in all of those growth hormone studies
    growth rates SLOWED in subsequent years, whereas vosoritide has produced sustained multi-year velocity
    gains in achondroplasia. SAME FIRST-YEAR SDS, DIFFERENT TRAJECTORY, AND A FLAT BONE AGE. That is the
    signature this atlas predicted a yield lever would have and no velocity lever does. THE LIMITS ARE
    REAL AND SOME ARE SEVERE. Twelve months only, and a bone age reading carries roughly half a year of
    error, so P = .22 over one year is a WEAK NULL rather than a demonstration of no effect - no
    equivalence margin is given. Open-label, single-arm, own-control against an observation period, small
    subgroups. And it does NOT identify which term of the yield moved: the doubling of CXM says the
    HYPERTROPHIC compartment is where the activity is, since type X collagen is made only by hypertrophic
    chondrocytes, but a CXM rise is equally consistent with more hypertrophic cells, larger ones, or
    faster turnover.'
- parameter: AND THE PREDICTED FAILURE MODE APPEARED — THREE SLIPPED CAPITAL FEMORAL EPIPHYSES
  value: 5 of the treated children required treatment discontinuation for musculoskeletal complications,
    3 of whom developed SLIPPED CAPITAL FEMORAL EPIPHYSIS
  unit: count of subjects
  conditions: same trial, over 12 months of vosoritide with longer use in some subjects
  species: human
  source_ref: dauber2026
  uncertainty: 'THIS IS THE MOST IMPORTANT SAFETY OBSERVATION IN THE NODE AND IT IS MECHANISTICALLY
    PREDICTED BY A PAPER THIS ATLAS READ THE SAME WEEK, WHICH IS WHY IT IS RECORDED HERE RATHER THAN ONLY
    IN A SAFETY SECTION. williams2001 measured, in bovine proximal tibia, that ULTIMATE TENSILE STRESS
    FALLS LINEARLY WITH GROWTH PLATE THICKNESS - stress (MPa) = 3.2 - 2.8 x thickness (mm), R-squared
    0.55, P < 0.0001. A THICKER PLATE IS A MECHANICALLY WEAKER PLATE. The whole premise of this node is
    that CNP expands the hypertrophic zone, and expanding it THICKENS the plate. The same paper measured
    the human capital femoral physis at 1.35 +/- 0.33 mm with an ultimate stress of 0.98 +/- 0.29 MPa,
    about half the bovine value, at the exact anatomical site where slipped epiphysis occurs. So the
    route this node advocates carries a specific, predictable, load-bearing-joint failure mode, and it
    was observed in the first non-FGFR3 trial. THE INFERENCE IS THIS ATLAS''S AND NOT EITHER PAPER''S -
    dauber2026 does not attribute the slips to plate thickening, williams2001 is bovine for its
    regression and its human arm is eight specimens from two cerebral palsy patients, and children with
    these syndromes may carry independent SCFE risk. It is a hypothesis that unifies two observations,
    and it is testable by measuring physeal thickness on imaging in treated children.'
- parameter: THE HUMAN TEST, RUN ON NATURAL EXPERIMENTS — CNP-AXIS HEIGHT OUTRUNS BONE AGE
  value: 'NPR2 GAIN-OF-FUNCTION (miura2012, three-generation Japanese family): proband height 177.0 cm
    (+2.7 SD) at chronological age 11-12 with BONE AGE 11.0 YEARS - not advanced; arm span 99.7% of height
    and stature proportional; height reached 191.2 cm (+3.89 SD) at 15 with Tanner stage IV; mother 176 cm
    (+3.8 SD for her age) with the same phenotype. Bone formation and resorption markers markedly raised
    (bone-specific alkaline phosphatase 270 U/l against a 13-33.9 range; CTX 14.3 ng/ml against under 4.5).
    NPR3 BIALLELIC LOSS-OF-FUNCTION (lauffer2022): height 172.1 cm (+3.67 SDS) at calendar age 10 while
    PREPUBERTAL, bone age 11 years 3 months, sitting-height ratio and arm span NORMAL; by age 13 bone age
    had converged to EQUAL calendar age while height SDS rose to a predicted adult height of about 211 cm
    (+3.83 SDS); epiphysiodesis of both knees at 13.5 years, height 195.6 cm, to stop him. Target height
    from parents was +0.8 SDS'
  unit: cm, SDS, and bone age in years against chronological age
  conditions: two independent human genotypes that raise CNP/cGMP signalling - NPR2 receptor activation and
    loss of the NPR3 clearance receptor - both in an INTACT FGFR3 background, so neither is correcting an
    FGFR3 lesion. Bone age by Greulich and Pyle. Both papers obtained open-access and read in full 2026-08-07
  species: human
  source_ref: miura2012
  uncertainty: 'THIS IS THE DISCRIMINATING MEASUREMENT THE ATLAS ASKED FOR ONE ROUND AGO, AND IT WAS ALREADY
    IN THE LITERATURE. The prediction was that a yield lever should deliver height WITHOUT proportionate
    skeletal maturation, unlike growth hormone, whose dose-response saturates on final height because
    velocity is spent capacity. Both natural experiments show exactly that: 177 cm at a bone age of 11.0,
    and 172 cm at age 10 while still PREPUBERTAL with bone age 11.25. Height-for-bone-age is enormously
    elevated in both, and the stature is PROPORTIONATE in both. No other lever in this atlas produces that
    signature. THREE THINGS IT DOES NOT ESTABLISH, AND THE FIRST IS THE ONE THAT MATTERS MOST. (a) IT DOES
    NOT SHOW THE MECHANISM IS TERMINAL CELL SIZE. Height outrunning maturation is consistent with a raised
    yield, but the yield has two terms and this cannot say which one moved; distinguishing them needs a
    growth plate, and these are living people. (b) A DURATION CONFOUND IS PRESENT AND PARTLY REAL:
    lauffer2022 states pubertal progression was relatively slow, so some of that height is bought with time
    rather than efficiency - though miura2012''s proband reached Tanner IV by 15 with a bone age that was on
    time at 11-12, which is not a picture of delayed puberty. (c) THESE ARE GERMLINE VARIANTS ACTING FROM
    CONCEPTION, not a drug given to a normal plate, and NPR2 and NPR3 are expressed well beyond cartilage.
    Bone age by Greulich and Pyle is also a crude instrument in a skeleton with scoliosis and macrodactyly.'
- parameter: AND THE CNP-AXIS CEILING IS 211-221 CM AGAINST 197 CM FOR UNLIMITED DURATION
  value: 'NPR2 ACTIVATING MUTATION Arg655Cys (hannema2013): birth length 62 cm (+6 SDS); puberty started
    LATE at about 15; 216 cm at age 16; EPIPHYSIODESIS of distal femur and proximal tibia and fibula;
    height at 53 years 221 cm (+5.2 SDS), sitting height 107.8 cm (+3.7 SDS), sitting-height-to-height
    ratio 0.49 at -1.3 SDS so the LIMBS are disproportionately long, arm span 232 cm. NPR3 HOMOZYGOUS
    LOSS-OF-FUNCTION (moffatt2025): 211.1 cm (z +4.9) at age 19 against a parental target height of
    184.5 cm (z +1.1); spine fusion at 12 for scoliosis at a Cobb angle of 39 degrees; epiphysiodesis of
    the first metatarsal and proximal phalanx at 12; STATURE EXCEEDED THE MAXIMUM SIZE OF THE DXA
    EQUIPMENT. AGAINST THIS, THE ATLAS''S PREVIOUSLY RECORDED OBSERVED ENDPOINT: 197 cm at 27 in an
    untreated aromatase-deficient man with bone age 16 and OPEN EPIPHYSES (herrmann2002)'
  unit: cm and SDS
  conditions: two independent CNP-axis gain genotypes with intact FGFR3, compared against the atlas's
    recorded maximum for the DURATION lever - a man whose plates never closed
  species: human
  source_ref: hannema2013
  uncertainty: 'THE COMPARISON IS THE POINT AND IT IS ALSO THE WEAKEST THING HERE, BECAUSE IT IS ACROSS
    STUDIES, GENOTYPES AND BACKGROUNDS RATHER THAN CONTROLLED. Stated carefully: herrmann2002 had
    effectively UNLIMITED DURATION - epiphyses still open at 27 - and stopped at 197 cm because
    proliferation ran out. The two CNP-axis individuals reached 211 and 221 cm AND BOTH HAD TO BE
    SURGICALLY STOPPED with epiphysiodesis, so those figures are TRUNCATED and understate what the
    genotype would have produced. Duration without yield gave 197; yield had to be halted at 211 and 221.
    NOW THE CAVEATS, AND THEY MATTER. NEITHER CNP CASE HAS A BONE AGE - hannema2013 states explicitly
    that endocrine status and bone age were not studied, and moffatt2025 reports none - so the
    discriminating measurement is absent in exactly the two cases with the biggest heights, and it is
    supplied only by dauber2026. hannema2013''s proband also entered puberty LATE at about 15, which is a
    DURATION contribution mixed into his 221 cm, so that case is not a clean yield observation. Both
    individuals carry substantial morbidity - scoliosis needing spinal fusion at 12, macrodactyly needing
    epiphysiodesis, obesity at BMI 34, kyphosis - so this is not a picture of costless height. And n = 2
    across two papers.'
- parameter: IN HUMANS THE PARAMETER IS FLAT ACROSS THE WHOLE OF CHILDHOOD
  value: human distal femoral terminal hypertrophic cell height 29-38 micrometres from birth to 13 years
    with no evidence of age dependence, 33 +/- 5 micrometres at ages 5-8; human rib chondrocyte lacunar
    diameter shows no significant change with age in either zone
  unit: micrometres
  conditions: kember1976, 12 subjects, measured in the direction of growth over five groups of ten cells per
    specimen with a measured 13 per cent processing shrinkage corrected for; byers2000, 46 subjects, rib
  species: human
  source_ref: kember1976
  uncertainty: 'THIS IS THE LOAD-BEARING HUMAN OBSERVATION AND IT IS ALSO ONE HALF OF CONTRADICTION C-L1-09,
    which this node does not resolve. In rat the same parameter FALLS with age and its loss is what
    roach2003 identifies as driving cessation; in rabbit it falls too (weise2001). So the claim that
    h_term is a free parameter is a claim about HUMANS specifically, resting on 12 subjects with 1-2 per
    age in kember1976 and on a transverse dimension in RIB in byers2000. "No age dependence" at that n is a
    weak bound, not a demonstration of invariance. If the rodent pattern is the general one and the human
    flatness is a power failure, the central premise of this node is wrong.'
- parameter: AND IT IS NOT AT A CEILING — MAMMALIAN TERMINAL VOLUME SPANS AT LEAST 4.6-FOLD
  value: about 5000 femtolitres in the slow mouse proximal radius, which truncates phase 2 and omits phase 3
    entirely; about 14000 in mouse proximal tibia; about 23000 in the jerboa metatarsal, which extends phase
    3; Igf1-deficient cells stop at about 7000
  unit: femtolitres
  conditions: quantitative phase microscopy of live dissociated chondrocytes; held on hypertrophic_volume_increase
  species: mouse
  source_ref: cooper2013
  uncertainty: 'THE EXISTENCE OF THE JERBOA IS THE ARGUMENT AGAINST A HARD STRUCTURAL CEILING - a mammalian
    growth plate can operate a terminal cell 4.6 times the volume of another mammalian growth plate without
    the tissue failing. What it does NOT establish is that a GIVEN plate can be pushed there, since the
    jerboa metatarsal is a different tissue with a matrix and a chondro-osseous junction adapted to it. The
    volumes are also cross-sectional across species and preparations rather than a dose-response within one
    plate.'
- parameter: THE LARGEST COMPONENT IS SWELLING — DRY MASS IS DILUTED 60 PER CENT
  value: phase 1 is true hypertrophy, about 600 to 2000 femtolitres at constant dry mass density 0.183 pg/fl;
    PHASE 2 IS SWELLING, about 2000 to 8000 femtolitres with density falling to about 0.07 pg/fl, a roughly
    60 per cent dilution confirmed independently by tomographic phase microscopy; phase 3 resumes
    proportional growth at the new low density
  unit: femtolitres and pg/fl
  conditions: quantitative phase microscopy of live dissociated mouse chondrocytes
  species: mouse
  source_ref: cooper2013
  uncertainty: 'THIS IS WHY THE ARGUMENT IS A BUDGET ARGUMENT AND NOT A WISH. If terminal enlargement were
    biosynthesis, it would cost the same resource that proliferation costs and the two terms would not be
    independent. A 60 per cent dilution says the dominant phase is osmotic, and water is not a resource the
    growth plate runs out of. THE CAVEAT IS THAT CHEAP IS NOT THE SAME AS FREE: swelling requires
    osmolyte accumulation and matrix compliance, hypertrophy is time-boxed at roughly 12 hours to triple
    height plus roughly 12 hours at terminal size, and if larger cells take proportionally longer to
    make and clear then velocity does not rise with volume. NONE OF THIS HAS BEEN MEASURED IN HUMAN CELLS.'
localization:
- hypertrophic zone, terminal cell; the chondro-osseous junction sets the removal rate
human_evidence: direct
human_evidence_note: 'UPGRADED FROM INDIRECT 2026-08-07. Two human genotypes that raise CNP/cGMP signalling
  in an intact FGFR3 background - NPR2 gain-of-function (miura2012) and NPR3 loss-of-function (lauffer2022) -
  both show height massively outrunning bone age, proportionately. That is the signature this node predicted
  a yield lever should have, and it is direct human evidence that the CNP axis produces it. It is NOT direct
  evidence that terminal cell volume is the term that moved, which remains untested in any species. The older
  human evidence is the INVARIANCE (kember1976, byers2000) and it is the weakest
  kind of positive evidence - an absence of change at small n. Every mechanistic result on terminal cell
  enlargement is mouse. No human chondrocyte has been measured by quantitative phase microscopy, no human
  terminal cell volume is on record, and the only human intervention that acts on this compartment is a CNP
  analogue whose effect on terminal cell size in humans has never been measured because it would require a
  growth plate biopsy.'
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: The mechanism is entirely mouse and the therapeutic premise depends on a HUMAN
  claim - that terminal cell height is flat across childhood - which rests on 12 subjects and directly
  contradicts the rat and rabbit pattern (C-L1-09). If the human flatness is a power failure rather than a
  fact, the node's central premise fails.
confidence: C
confidence_note: 'C, and it is a hypothesis node rather than a result. The individual components are solid -
  the flow model with elasticity 1, the cross-species volume range, the phase-2 dilution, the human
  invariance, and the atlas''s own yield decomposition. WHAT IS NOT ESTABLISHED IS THE JOIN. That h_term is
  undefended rather than constrained is an INFERENCE from its invariance, and invariance is equally
  consistent with tight defence; that is the whole question and this node does not settle it. It is not B
  because no experiment has raised terminal cell volume in any plate and measured the length gained, because
  the decomposition carries an untested column-density assumption, and because the human premise sits on one
  side of an unresolved contradiction. It is not D because every input is a measured quantity from a primary
  source, the arithmetic is explicit and reproducible, and the argument makes a falsifiable prediction.'
key_refs:
- ref_id: lui2018
  pmid: '30036371'
  first_author: Lui JC
  year: 2018
  type: primary
  one_line_finding: Per-animal raw values from which this atlas computed the yield and decomposed it -
    amplification carries 86 per cent of the between-bone gap and terminal cell size 14 per cent.
- ref_id: kember1976
  pmid: '1018028'
  first_author: Kember NF
  year: 1976
  type: primary
  one_line_finding: Human terminal hypertrophic cell height is 29-38 micrometres from birth to 13 years with
    no evidence of age dependence, across an interval in which growth velocity varies several-fold.
- ref_id: weise2001
  pmid: '11381135'
  first_author: Weise M
  year: 2001
  type: primary
  one_line_finding: Fusion occurs when chondrocyte proliferation approaches zero - which is what makes the
    budget a budget of progenitors rather than of micrometres.
- ref_id: forcinito2011
  pmid: '20974641'
  first_author: Forcinito P
  year: 2011
  type: primary
  one_line_finding: Senescence tracks growth rather than time, so every known way to slow the clock works by
    not growing - the trap that only a yield lever escapes.
- ref_id: dauber2026
  pmid: '41967490'
  first_author: Dauber A
  year: 2026
  type: primary
  one_line_finding: Vosoritide in non-FGFR3 short stature raised growth velocity by 4.0 SD while the bone
    age to chronological age ratio did not move (0.94 to 0.92, P = .22) - the yield signature - and three
    children developed slipped capital femoral epiphyses.
- ref_id: hannema2013
  pmid: '24057292'
  first_author: Hannema SE
  year: 2013
  type: primary
  one_line_finding: An activating NPR2 mutation gave 221 cm with disproportionately long limbs after
    epiphysiodesis, and bone age was never studied.
- ref_id: moffatt2025
  pmid: '40171685'
  first_author: Moffatt P
  year: 2025
  type: primary
  one_line_finding: Homozygous NPR3 loss-of-function gave 211.1 cm at 19 against a parental target of
    184.5 cm, with scoliosis needing spinal fusion at 12.
- ref_id: miura2012
  pmid: '22870295'
  first_author: Miura K
  year: 2012
  type: primary
  one_line_finding: NPR2 gain-of-function in a three-generation family gave 177.0 cm at a BONE AGE OF 11.0
    years and 191.2 cm by age 15, proportionately - height outrunning skeletal maturation with intact FGFR3.
- ref_id: lauffer2022
  pmid: '35233476'
  first_author: Lauffer P
  year: 2022
  type: primary
  one_line_finding: NPR3 biallelic loss-of-function gave 172.1 cm at age 10 while PREPUBERTAL with bone age
    11 years 3 months, normal body proportions, and a predicted adult height of about 211 cm.
- ref_id: agoston2007
  pmid: '17374144'
  first_author: Agoston H
  year: 2007
  type: primary
  one_line_finding: CNP acts on the growth plate largely by expanding the hypertrophic zone, with far more
