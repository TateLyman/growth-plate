id: proliferative_chondrocyte
name: Proliferative zone chondrocyte
aliases:
- flattened chondrocyte
- columnar chondrocyte
type: cell_type
layer: L1
stub: false
summary: 'Proliferative chondrocytes are flattened discs whose short axis lies along the growth direction,
  stacked in clonal columns. They divide with their division plane perpendicular to the long bone axis
  and then rotate as a doublet so that the daughters end up stacked, a manoeuvre that requires beta1 integrin
  and N-cadherin mediated adhesion. In rat their cycle is long and its length is set by G1: total cycle
  time ranges from 30.9 h in the fast proximal tibia to 76.3 h in the slow proximal radius, while S, G2
  and M are essentially fixed at 3.4-6.1 h, 3.0 h and 0.5-0.6 h respectively. Beta1 integrin deletion
  delays G1/S progression as well as blocking rotation, which links adhesion directly to cycle control.
  Human proliferative chondrocytes have never had their cycle measured; the only human number is a derived
  mean cycle time of roughly 20 days for the distal femur. In quantitative terms, the direct contribution
  of these divisions to elongation is small (9% in the fast rat proximal tibia); their function is to
  set the number of cells that will subsequently hypertrophy.'
