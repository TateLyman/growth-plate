id: distal_radius_plate
name: Distal radial growth plate
aliases:
- distal radial physis
type: tissue_structure
layer: L1
stub: false
summary: The distal radial physis supplies about 80% of radial length overall, rising to 85% by age 5
  and 90% by age 8; the neighbouring distal ulnar physis is even more dominant at about 85% overall, 90%
  by age 5 and 95% after age 8. In absolute terms the radius grows about 0.9 cm per year in girls and
  1.0 cm per year in boys from age 7 to skeletal maturity, and the ulna about 1.0 and 1.1 cm per year
  respectively. This distal dominance is the anatomical reason distal radial physeal arrest after fracture
  or pinning produces clinically significant deformity while proximal radial injury rarely does. In the
  rat the distal radius is one of the four plates in the canonical differential-growth series, with a
  proliferative cycle time of 34.0 h - not significantly different from the fast proximal tibia - which
  shows that cycle time and elongation rate are not in one-to-one correspondence across plates.
