id: hypertrophic_phase_duration
name: Hypertrophic phase duration (transit time constraint)
aliases:
- hypertrophic transit time
- hypertrophic zone turnover time
type: process
layer: L1
stub: false
summary: 'The time a chondrocyte spends between leaving the cell cycle and being removed at the chondro-osseous
  junction is remarkably invariant, and this invariance is a strong constraint on how growth rate can
  be regulated. Hunziker and Schenk found the duration of hypertrophic activity to be approximately two
  days in rat proximal tibia and unchanged across 21-, 35- and 80-day-old animals whose growth rates differ
  several fold. In mouse the constraint is tighter: the whole hypertrophic column turns over in about
  24 h, split into roughly 12 h during which cell height more than triples and roughly 12 h at terminal
  size before removal. The implication is that plates growing at different rates cannot simply take longer
  to enlarge their cells; they must enlarge them faster or reach a different final size within a fixed
  window, which is exactly what the three-phase model shows - fast plates run the IGF-dependent third
  phase, slow plates truncate it. This also means the hypertrophic zone height is the product of a fixed
  transit time and a variable cell height, which is why zone height alone is a poor predictor of growth
  rate. The constraint has never been tested in human tissue, where the proliferative cycle appears to
  be an order of magnitude slower.'
