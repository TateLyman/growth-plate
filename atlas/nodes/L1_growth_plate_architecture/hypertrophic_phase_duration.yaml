human_evidence: absent
human_evidence_note: No human study measures the transit time of a chondrocyte through the hypertrophic
  zone.
species_basis:
- rat
- mouse
translation_risk: high
translation_risk_reason: A fixed ~24 h to 2 day transit time is a rodent finding in tissues that elongate
  roughly ten times faster than human plates; whether the same constraint operates in a slow human plate
  is unknown and would change how growth rate must be regulated.
