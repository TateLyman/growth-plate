id: vertebral_growth_plate
name: Vertebral growth plate
aliases:
- vertebral endplate physis
- ring apophysis
- vertebral body growth plate
type: tissue_structure
layer: L1
stub: false
summary: 'Each vertebral body grows in height from cartilaginous growth plates at its superior and inferior
  surfaces, and the human vertebral column carries more than 130 such plates. Collectively they generate
  the trunk component of standing height, and their behaviour is not linear with age: three distinct postnatal
  phases are recognised, birth to 5 years, 5 to 10 years, and 10 years to skeletal maturity, with acceleration
  and deceleration rather than a constant rate. The consequence for pathology is that the same asymmetric
  load produces very different deformity depending on when it acts, which is the basis of the relationship
  between remaining growth and progression risk in idiopathic scoliosis, and of growth-modulation surgery
  such as vertebral body tethering. What is missing is resolution: the field measures segment lengths
  radiographically rather than per-plate growth rates, so the contribution of an individual vertebral
  physis, and how it compares between superior and inferior endplates or between thoracic and lumbar levels,
  is unquantified in humans. No vertebral growth plate histomorphometry comparable to the appendicular
  literature exists.'
