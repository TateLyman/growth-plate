localization:
- 'mouse RZ: PTHrP+ skeletal stem cells confirmed by lineage tracing (mizuhashi2018)'
- 'human RZ: morphology and width described; no labelled cells detected on a 1 h pulse (thurston1985)'
- 'pig RZ: labelled cells present in all five animals on the same 1 h pulse (thurston1985)'
human_evidence: absent
human_evidence_note: No human study demonstrates stem or progenitor behaviour of resting zone chondrocytes;
  the human evidence is descriptive histology plus one non-detection of S-phase cells on a 1 h pulse in
  two subjects, which bounds the instantaneous labelling index but cannot establish quiescence.
species_basis:
