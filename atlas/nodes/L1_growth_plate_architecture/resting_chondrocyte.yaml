id: resting_chondrocyte
name: Resting (reserve) zone chondrocyte
aliases:
- reserve chondrocyte
- RZ chondrocyte
type: cell_type
layer: L1
stub: false
summary: 'Resting chondrocytes are small, rounded cells lying singly or in pairs in abundant matrix at
  the epiphyseal end of the plate. In mouse they include a PTHrP-expressing subpopulation with formal
  skeletal stem cell properties: these cells self-renew and generate the columnar clones of the proliferative
  zone, but they acquire that behaviour only after the secondary ossification centre forms, which means
  the stem compartment is a postnatal acquisition rather than a property of the embryonic plate. The label
  ''resting'' overstates their quiescence. A systematic review of the primary data finds that reported
  labelling indices and even the operational definition of quiescence differ widely between studies, so
  the zone contains cycling cells at rates that are not agreed. A separate mouse population at the plate
  periphery, the borderline chondrocytes, leaves the cartilage altogether and becomes marrow stroma and
  osteoblasts. In human tissue none of this has been demonstrated: the human resting zone is described
  morphologically, and the only human proliferation data come from an in vitro thymidine labelling study
  in which two of four specimens produced no labelled cells anywhere in the plate.'
