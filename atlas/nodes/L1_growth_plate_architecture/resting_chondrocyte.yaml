id: resting_chondrocyte
name: Resting (reserve) zone chondrocyte
aliases:
- reserve chondrocyte
- RZ chondrocyte
type: cell_type
layer: L1
stub: false
summary: 'Resting chondrocytes are small, rounded cells lying singly or in pairs in abundant matrix at the epiphyseal
  end of the plate. In mouse they include a PTHrP-expressing subpopulation with formal skeletal stem cell properties:
  these cells self-renew and generate the columnar clones of the proliferative zone, but they acquire that behaviour
  only after the secondary ossification centre forms, which means the stem compartment is a postnatal acquisition
  rather than a property of the embryonic plate. The label ''resting'' overstates their quiescence. A systematic review
  of the primary data finds that reported labelling indices and even the operational definition of quiescence differ
  widely between studies, so the zone contains cycling cells at rates that are not agreed. A separate mouse population
  at the plate periphery, the borderline chondrocytes, leaves the cartilage altogether and becomes marrow stroma and
  osteoblasts. In human tissue none of this has been demonstrated: the human resting zone is described morphologically,
  and the only human proliferation data come from an in vitro thymidine labelling study in which two of four specimens
  produced no labelled cells anywhere in the plate. That study also reports the one direct observation on human resting-zone
  proliferation that exists: in the two specimens that did label, no labelled cells were found anywhere in the wide,
  low-density epiphyseal region the authors call the inert zone - while in all five pig plates processed identically,
  labelled cells were present in the inert zone. If both observations are taken at face value the human reserve compartment
  is quieter than the pig''s, not merely quieter than the columnar zone, and the difference is a species difference
  in the same experiment rather than across studies. The human inert zone is also large: 700-1000 um in the distal
  femur and 1000 um in the metatarsals, wider than in pig and far wider than in rodents.'
quantitative:
- parameter: ARE HUMAN RESTING ZONE CELLS ACTUALLY QUIESCENT - measured in human tissue
  value: yes, a subset is functionally quiescent in vivo and can be released from it
  unit: qualitative, four independent readouts
  conditions: 8 growth plate biopsies from healthy adolescents aged 12 y 2 m to 14 y 6 m, Tanner stage 2-4, distal
    femur, taken at epiphysiodesis for idiopathic tall stature. Visium and Visium HD spatial transcriptomics by the
    RNA-Rescue protocol, plus electron microscopy, RNAscope and ex vivo sequential thymidine-analogue labelling of
    intact biopsies
  species: human
  source_ref: avijgan2026br
  uncertainty: 'THE FOUR READOUTS ARE THE STRENGTH: resting zone cells carry the least mRNA of any zone (UMI per spot
    lowest in RZ in every one of 17 sections), the mRNA is predominantly NUCLEAR, the nuclei carry abundant heterochromatin
    on electron microscopy, and in overnight ex vivo culture few RZ cells take up EdU while IdU and CldU given on
    subsequent days ARE taken up - reversible cell cycle arrest, the behaviour of muscle satellite, haematopoietic
    and neural stem cells released from their niche. CHRDL2+ and/or SFRP5+ sub-populations are the LEAST quiescent,
    which gives a hierarchy rather than a uniform compartment. LIMITS THE AUTHORS STATE: a prolonged G1 cannot be
    excluded by thymidine analogues alone, and the release is observed in culture rather than in the body. LIMIT THIS
    ATLAS ADDS: all 8 donors were operated on to PREVENT tall stature, so this is quiescence measured in plates selected
    for growing too much, and there is no normal-stature comparison because no such tissue is obtainable.'
- parameter: human specimens yielding no labelled cells after in vitro tritiated thymidine exposure
  value: 2 of 4
  unit: specimens
  conditions: human growth plates, in vitro labelling
  species: human
  source_ref: thurston1985
  uncertainty: author-reported; possible technical failure discussed by the authors
- parameter: labelled cells in the inert (reserve) zone after 1 h tritiated thymidine
  value: none detected
  unit: qualitative
  conditions: human distal femur (10 y) and metatarsals/fibula (18 mo), the two specimens in which the columnar zone
    labelled successfully; 1 h in vitro pulse
  species: human
  source_ref: thurston1985
  uncertainty: 'a 1 h pulse detects only cells in S phase during that hour, so this bounds the instantaneous labelling
    index rather than demonstrating quiescence: a cell cycling once a month would be missed with high probability.
    No cell count for the inert zone is reported, so the upper bound cannot be quantified. n=2 subjects.'
