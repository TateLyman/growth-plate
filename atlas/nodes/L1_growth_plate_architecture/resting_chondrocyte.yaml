localization:
- 'mouse RZ: PTHrP+ skeletal stem cells confirmed by lineage tracing (mizuhashi2018)'
- 'human RZ: morphology and width described; no labelled cells detected on a 1 h pulse (thurston1985)'
- 'pig RZ: labelled cells present in all five animals on the same 1 h pulse (thurston1985)'
human_evidence: direct
human_evidence_note: UPGRADED FROM ABSENT 2026-08-06. avijgan2026br measures quiescence directly in human growth plate
  tissue - 8 adolescent donors, four independent readouts (mRNA quantity, nuclear mRNA localisation, heterochromatin,
  and reversible failure to incorporate EdU) - and finds a functionally quiescent subset with a hierarchy in which
  CHRDL2+/SFRP5+ cells are the least quiescent. The atlas previously recorded that none of this had been demonstrated
  in human tissue. It now has been, in donors selected for idiopathic tall stature.
species_basis:
