id: groove_of_ranvier
name: Groove of Ranvier
aliases:
- ossification groove of Ranvier
- perichondrial ossification groove
- GOR
type: tissue_structure
layer: L1
stub: false
summary: 'The groove of Ranvier is a circumferential wedge of densely cellular tissue at the periphery
  of the growth plate, continuous with the perichondrium, that supplies cells for latitudinal enlargement
  of the plate. Shapiro, Holtrop and Glimcher''s rabbit study established its cellular organisation and
  the direction of cell flow from perichondrium into the plate margin. It is present and morphologically
  identifiable in developing human bones, described in calcaneus and talus, and in human polydactylous
  digits it harbours CD90+/CD105+ mesenchymal progenitor cells and, unlike the immature sprouting vessels
  inside the ossification centre, mature vessels stabilised by alpha-SMA-positive smooth muscle. Its clinical
  importance is negative: disorganisation of the groove causes congenital hyperostosis in piglets, and
  injury to it is implicated in angular deformity and in osteochondroma formation. What is missing is
  quantitative: no lineage tracing has shown groove-derived cells entering columnar clones, and no study
  has apportioned plate diameter increase between the groove and interstitial growth in any species, let
  alone in humans.'
