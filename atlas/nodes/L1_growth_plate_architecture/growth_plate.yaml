id: growth_plate
name: Growth plate (physis)
aliases:
- physis
- epiphyseal plate
- epiphyseal cartilage plate
type: tissue_structure
layer: L1
stub: false
summary: 'The growth plate is a disc of hyaline cartilage between epiphysis and metaphysis that is avascular,
  aneural and alymphatic and contains only chondrocytes and the matrix they make. Its functional unit
  is a vertical column of chondrocytes; the life history of one cell is laid out in space along that column,
  from slowly dividing resting-zone cells through rapidly cycling flattened proliferative cells to terminally
  enlarged hypertrophic cells that are removed at the vascular invasion front. Cartilage neoformation
  at the epiphyseal face is balanced against destruction at the metaphyseal face, so a plate in steady
  state maintains constant height while translating the epiphysis away from the diaphysis. In rat proximal
  tibia the balance is exact enough that the calculated cell production rate matches the loss rate at
  the chondro-osseous junction. Height and internal proportions are not fixed: in human rib the proliferative
  and hypertrophic zone heights and the primary spongiosa all fall with age, most steeply in the first
  postnatal year, while matrix volume fraction and septal thickness rise. Radiographic morphometry in
  mouse and human agrees that total plate width, and in mouse also total height and resting-zone height,
  correlate with tibial growth rate, whereas hypertrophic zone height on its own does not.'
