translation_risk: moderate
translation_risk_reason: 'The zonal plan is conserved across mammals, but the kinetics are not: human
  proliferative cycle times, plate heights and cell counts per column differ substantially from rodent,
  and mice do not undergo epiphyseal fusion.'
