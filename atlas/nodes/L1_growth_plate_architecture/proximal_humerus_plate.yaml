id: proximal_humerus_plate
name: Proximal humeral growth plate
aliases:
- proximal humeral physis
type: tissue_structure
layer: L1
stub: false
summary: 'The proximal humeral physis is the dominant plate of the upper limb, supplying about 80% of
  humeral length overall. Its dominance increases through childhood: less than 75% before age 2, about
  85% at age 8, and a constant 90% after age 11. The humerus as a whole grows about 1.2 cm per year in
  girls and 1.3 cm per year in boys from age 7 to skeletal maturity, so the proximal plate is contributing
  roughly 1.0-1.2 cm per year at its peak share. The humerus stays a nearly constant fraction of standing
  height across this period - 18% at age 7 rising to 19-20% at maturity - which means upper limb growth
  is proportionally coupled to stature rather than running an independent programme. Clinically the proximal
  humeral dominance is why proximal humeral fractures in children remodel so extensively and why distal
  humeral physeal injuries cause disproportionately little shortening. No histological or kinetic data
  exist for this human plate.'
