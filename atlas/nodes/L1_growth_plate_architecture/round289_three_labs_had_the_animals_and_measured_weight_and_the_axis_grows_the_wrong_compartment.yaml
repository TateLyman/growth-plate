  one_line_finding: >-
    The mechanism that survives all of this - outer perichondrium, chondrocyte deletion negative, TGF-beta1
    add-back causal, entirely postnatal accrual - and the rib finding that keeps the axial door open
contradicts: >-
  CORRECTS TWO CLAIMS OF
  round288_the_human_test_of_the_perichondrial_axis_was_run_four_times_and_nobody_looked_at_height, both from
  the appendix that round asked for. The claim that AIMS necessarily holds serial height drops from B to E,
  because the appendix contains no height data and the primary model uses absolute aortic diameter rather
  than a Z score. And the claim that irbesartan "did not move the biomarker" is corrected to underpowered
  rather than null - the difference is -0.10 log units with a confidence interval reaching 22 per cent lower
  and a point estimate favouring the drug.
  It STRENGTHENS the same round's central point: 93 randomised placebo-controlled children under 18 with
  five years of follow-up is a better cohort than round 288 knew about.
  And it adds a NEW argument that round 288 did not consider, which demotes the axis for this subject
  specifically - Marfan tall stature is disproportionate by diagnostic criterion, so this axis is
  limb-weighted, and round 274 established the residual at this maturity is trunk-dominant. That is the same
  objection round 275 used to set the CNP arm aside.
