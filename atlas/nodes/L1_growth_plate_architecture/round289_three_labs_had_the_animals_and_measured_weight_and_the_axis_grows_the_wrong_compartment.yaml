id: round289_three_labs_had_the_animals_and_measured_weight_and_the_axis_grows_the_wrong_compartment
name: >-
  ROUND 289 - operator supplied all three. The AIMS appendix DOWNGRADES my own round-288 claim: height is
  nowhere in it, only WEIGHT is demonstrably serial, and the TGF-beta null I leaned on is p=0.18 with the
  point estimate in the drug's favour - UNDERPOWERED, NOT NULL. What the appendix does deliver is 93 CHILDREN
  UNDER 18, RANDOMISED, PLACEBO-CONTROLLED, FIVE YEARS. And two more labs had growing animals on this exact
  axis and measured weight and bone mass instead of length. Three labs, three chances, no caliper. Then the
  argument that actually decides it for this case - the axis grows LIMBS
aliases:
- round 289
- the AIMS appendix read
- three labs no caliper
- Marfan is disproportionate
- busschers2025
- morales2026
type: hypothesis
layer: L1
stub: false
summary: >-
  ONE - TWO CORRECTIONS TO MY OWN LAST ROUND, BOTH FROM THE APPENDIX I ASKED FOR.
  (a) I claimed at grade B that AIMS "necessarily holds serial height", reasoning that annual BSA-adjusted Z
  scores require annual height. THE APPENDIX DOES NOT SUPPORT THAT. There is no height table anywhere in it.
  The primary statistical model, given in full on appendix page 4, uses ABSOLUTE AORTIC ROOT DIAMETER as its
  outcome, not a Z score. What IS demonstrably serial is WEIGHT: Table S2's footnote states that "patients
  generally gained weight during the course of the study and if they transitioned from <50kg to >50kg this
  allowed up-titration to 300mg". Weight drove dosing, so weight was measured repeatedly. HEIGHT AT FOLLOW-UP
  REMAINS UNDETERMINED FROM PUBLIC DOCUMENTS. My claim drops from B to E and becomes a question for the trial
  team rather than an inference.
  (b) I wrote that irbesartan "did not move the biomarker". Table S5 gives the actual numbers: log TGF-beta
  at one year, placebo 5.40 (95% CI 5.24-5.55, n=42) versus irbesartan 5.29 (5.14-5.45, n=47), DIFFERENCE
  -0.10 (95% CI -0.25 to 0.05), p=0.18. That is about a TEN PER CENT REDUCTION with a confidence interval
  reaching TWENTY-TWO PER CENT LOWER, in 89 people. THAT IS UNDERPOWERED, NOT NULL, AND THE POINT ESTIMATE
  RUNS IN THE DRUG'S FAVOUR. I overstated a p-value as an absence of effect.

  TWO - WHAT THE APPENDIX DOES DELIVER, AND IT IS BETTER THAN THE THING I ASKED FOR. Table S3 breaks the
  trial down by age: NINETY-THREE PARTICIPANTS WERE UNDER 18 AT BASELINE - 45 placebo and 48 irbesartan -
  against 98 aged 18 or over. So AIMS is 48 per cent growing children, randomised, PLACEBO-CONTROLLED, with
  follow-up to five years and weight tracked throughout. That is the cohort. Whether height rode along with
  the weight is a single question to a single trials unit.
  AND A DOSING FACT THAT MATTERS DIRECTLY FOR THIS CASE, WHICH I DID NOT EXPECT TO GET. Table S6: irbesartan
  lowered systolic pressure by 6.0 to 9.7 mmHg and diastolic by 3.6 to 7.5 mmHg AT EVERY ANNUAL TIMEPOINT,
  p<=0.013 throughout, in a cohort whose baseline pressure was 109/64 - normotensive. In the placebo arm
  systolic pressure ROSE from 109 to 119.8 over five years, which is simply growing up; irbesartan held it
  flat at 110. 153 of 191 participants tolerated the full 300 mg. SO AN ARB IN A NORMOTENSIVE ADOLESCENT
  PRODUCES A REAL, SUSTAINED, MULTI-YEAR PRESSURE DROP. That is the tolerability price of this arm, measured.

  THREE - AND NOW THE THING THAT IS NO LONGER A ONE-OFF. Round 288 recorded that chen2015 gave losartan to
  WILD-TYPE mice, saw the post-proliferative zone expand, and never measured bone length. TWO MORE PAPERS
  ARRIVED AND BOTH DID THE SAME THING.
  busschers2025: pan anti-TGF-beta antibody 1D11, 10 mg/kg weekly by intraperitoneal injection for EIGHT
  WEEKS from 8 weeks of age, in Col1a1+/- mice AND WILD-TYPE LITTERMATES. Femurs were dissected, scanned by
  micro-CT and broken in three-point bending. Bone mass up, ultimate strength up, weight gain unaffected.
  BONE LENGTH WAS NEVER REPORTED - and femur length is a standard output of the very scan they ran.
  morales2026: LOSARTAN AT 153 mg/kg/day IN DRINKING WATER FROM EMBRYONIC DAY 18, which the authors
  themselves note is "well above the estimated maximum dose", in Adamtsl2 mutant mice. This is the most
  aggressive TGF-beta-lowering exposure in a growing mammal in the literature. They measured survival and
  they measured growth - and their own methods define it: "for growth curves, the WEIGHTS at specific"
  timepoints. NO BONE OR BODY LENGTH.
  THREE INDEPENDENT LABORATORIES, THREE CHANCES, THE ANIMALS IN HAND, AND NOT ONE CALIPER. The missing
  measurement on this axis is not an oversight in one paper; it is a property of the field, which measures
  bone MASS because it comes from osteoporosis and fragility, and never asks about LENGTH.

  FOUR - AND HERE IS THE ARGUMENT THAT ACTUALLY DECIDES THIS AXIS FOR THIS SUBJECT, WHICH IS NOT ABOUT
  EVIDENCE QUALITY AT ALL. MARFAN TALL STATURE IS DISPROPORTIONATE, AND THE DISPROPORTION IS IN THE
  DIAGNOSTIC CRITERIA. The revised Ghent nosology scores REDUCED UPPER-TO-LOWER SEGMENT RATIO together with
  INCREASED ARM SPAN TO HEIGHT as a systemic feature - which is to say the FBN1 axis lengthens LIMBS
  preferentially relative to trunk. Round 274 established that at bone age 14.5 and beyond the residual in
  boys is TRUNK-DOMINANT, 6.5 to 9.0 cm of trunk against 0.3 to 0.4 cm of knee. Round 275 rejected the CNP
  arm on exactly this ground.
  THE PERICHONDRIAL AXIS APPEARS TO HAVE THE SAME DEFECT AS THE ARM THIS FILE ALREADY SET ASIDE.
  TWO QUALIFIERS, BOTH REAL. sedes2022 found the expanded hypertrophic zone in P4 RIBS as well as in limbs,
  and ribs are axial - so the mechanism is not limb-restricted even if the phenotype is limb-weighted. And
  Marfan carries a high rate of severe scoliosis, which shortens MEASURED sitting height and would
  exaggerate any apparent limb preference. The compartment claim is therefore strong enough to change the
  ranking and not strong enough to close the axis.

  FIVE - WHERE THIS LEAVES IT, AND I AM NOT KILLING IT. The mechanism is untouched: four conditional
  deletions with a chondrocyte-negative control, a causal TGF-beta1 add-back, a 300 pg/ml setpoint, entirely
  postnatal accrual, and the largest human effect in the file at +11.14 cm per allele. What has accumulated
  against it FOR THIS CASE is three things: no length endpoint anywhere on the axis despite three separate
  opportunities; an ARB probe that is at best weakly on-target and costs 6 to 10 mmHg of systolic pressure;
  and compartment selection that favours the segment this subject has already spent.
  IT STAYS ALIVE AS TWO SPECIFIC THINGS RATHER THAN AS A CANDIDATE. First, a DATA REQUEST - 93 randomised
  placebo-controlled children with five years of follow-up, and one question to the trials unit about
  whether height was recorded. Second, THE CHEAPEST MISSING EXPERIMENT IN THIS FILE - three groups of mice
  have already been dosed on this axis and the caliper costs nothing. Next round goes to HHIP, which has the
  better biology and no compartment problem, and this returns if the height data exists.
quantitative:
- parameter: >-
    THE AIMS APPENDIX - WHAT IS THERE AND WHAT IS NOT
  value: >-
    AGE BREAKDOWN (Table S3): NINETY-THREE participants UNDER 18 at baseline (45 placebo, 48 irbesartan)
    against 98 aged 18 or over; 153 of 191 tolerated the full 300 mg.
    TGF-BETA (Table S5): log TGF-beta at one year, placebo 5.40 (95% CI 5.24-5.55, n=42) versus irbesartan
    5.29 (5.14-5.45, n=47), difference -0.10 (95% CI -0.25 to 0.05), p=0.18.
    BLOOD PRESSURE (Table S6): systolic difference -6.3, -6.1, -6.0, -6.8 and -9.7 mmHg at years 1 to 5, all
    p<=0.001; diastolic -3.6, -3.7, -5.6, -5.5 and -7.5 mmHg, all p<=0.013; baseline 109/64. Placebo systolic
    ROSE 109.0 to 119.8 over five years while irbesartan held at about 110.
    WEIGHT: serially measured - Table S2 states patients "generally gained weight during the course of the
    study" and were up-titrated on crossing 50 kg.
    HEIGHT: NOT REPORTED ANYWHERE IN THE APPENDIX. The primary model (appendix p 4) uses ABSOLUTE aortic root
    diameter, not a Z score
  unit: participants; log(ng/L); mmHg
  conditions: >-
    mullen2019 supplementary appendix, 12 pages, operator-supplied 2026-08-12 and read in full. Archived at
    atlas/data/round289/.
  species: human
  source_ref: mullen2019
  uncertainty: >-
    THE ABSENCE OF HEIGHT FROM THE APPENDIX IS NOT PROOF IT WAS NOT COLLECTED - appendices report what the
    analysis needed, and five-year paediatric cardiology follow-up ordinarily records height as routine. But
    it removes my round-288 inference, which rested on the Z-score methodology, because the primary model
    turns out not to use a Z score at all. The TGF-beta comparison has 89 participants at one year and is
    underpowered; the direction favours the drug and the interval is wide.
- parameter: >-
    THREE LABORATORIES ON THIS AXIS, THREE GROWING-ANIMAL EXPERIMENTS, NO LENGTH ENDPOINT
  value: >-
    busschers2025 - pan anti-TGF-beta antibody 1D11, 10 mg/kg weekly IP for 8 weeks from 8 weeks of age, in
    Col1a1+/- mice AND WILD-TYPE littermates; femurs dissected, micro-CT scanned and broken in three-point
    bending; bone mass and ultimate strength increased, weight gain unaffected; BONE LENGTH NEVER REPORTED.
    morales2026 - LOSARTAN 153 mg/kg/day in drinking water FROM EMBRYONIC DAY 18, stated by the authors to be
    well above the estimated maximum dose, in Adamtsl2 mutant mice; survival and "growth" assessed, with the
    methods defining growth curves as WEIGHTS at specified timepoints; no improvement in either; NO BONE OR
    BODY LENGTH MEASURED.
    chen2015 - losartan in WILD-TYPE mice; total growth plate length, resting and proliferative zones
    unchanged, POST-PROLIFERATIVE ZONE EXPANDED; bone length never measured
  unit: presence or absence of a length endpoint
  conditions: >-
    All three read in full. busschers2025 and morales2026 operator-supplied 2026-08-12; chen2015 held since
    2026-08-06.
  species: mouse
  source_ref: busschers2025
  uncertainty: >-
    NEITHER NEW PAPER WAS DESIGNED TO ASK ABOUT LENGTH - busschers2025 is an osteogenesis imperfecta bone-mass
    study and morales2026 is a survival study in a lethal dysplasia, so this is not a criticism of either.
    IT IS AN OBSERVATION ABOUT THE FIELD: skeletal TGF-beta pharmacology descends from osteoporosis and
    fragility, so it measures MASS, and the length question has no constituency. busschers2025's treatment
    window, 8 to 16 weeks, is also mostly post-growth in a mouse, which weakens what a length measurement
    there would have shown; morales2026's window, from E18, does not have that problem.
- parameter: >-
    THE COMPARTMENT PROBLEM - THIS AXIS LENGTHENS LIMBS, AND THE RESIDUAL IS TRUNK
  value: >-
    Marfan tall stature is DISPROPORTIONATE and the disproportion is a diagnostic criterion: the revised
    Ghent nosology systemic score counts REDUCED UPPER-TO-LOWER SEGMENT RATIO together with INCREASED ARM
    SPAN TO HEIGHT RATIO. Against round 274, where boys at bone age 14.5 and beyond have 6.5 to 9.0 cm of
    remaining TRUNK growth against 0.3 to 0.4 cm at the knees. QUALIFIERS: sedes2022 found the expanded
    hypertrophic zone in P4 RIBS as well as limb bones, so the mechanism reaches axial cartilage; and severe
    scoliosis is common in Marfan and shortens measured sitting height, which would exaggerate an apparent
    limb preference
  unit: body segment ratio; cm of residual growth by compartment
  conditions: >-
    Revised Ghent nosology systemic scoring for Marfan syndrome; round 274 (aeppli2025) for the per-segment
    residual; sedes2022 for the rib finding.
  species: human
  source_ref: sedes2022
  uncertainty: >-
    THE SEGMENT RATIO IS A DIAGNOSTIC CRITERION RATHER THAN A MEASUREMENT MADE IN A COHORT ANALYSED HERE, and
    a criterion is chosen for discriminative value rather than to describe the average patient. The scoliosis
    confound is real and unquantified in this round. And a limb-weighted effect is not a limb-only effect -
    Marfan patients are taller overall, not merely longer-limbed. This changes the RANKING of the axis for
    this subject; it does not close it.
localization:
- 'outer perichondrium: the tissue that carries the effect'
- 'limbs preferentially over trunk: the compartment problem, from the Ghent segment criteria'
- 'P4 ribs: axial cartilage where sedes2022 also found the expanded hypertrophic zone'
human_evidence: direct
human_evidence_note: >-
  93 randomised, placebo-controlled participants under 18 followed to five years, with weight serial and
  height status unknown; plus the Ghent segment criteria for the compartment argument.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  No length endpoint exists anywhere on the axis in any animal; the available probe costs 6-10 mmHg of
  systolic pressure and is at best weakly on-target; and the phenotype is limb-weighted while this subject's
  residual is trunk-dominant.
confidence: B
confidence_reason: >-
  The appendix findings are read directly from the supplied document. The three-labs-no-caliper observation
  is a factual audit of three full texts. The compartment argument rests on a diagnostic criterion plus this
  file's own per-segment residual data and is held at B because the scoliosis confound is unquantified.
claim_grades:
- claim: >-
    AIMS necessarily holds serial height, because annual BSA-adjusted Z scores require annual height.
  grade: E
  basis: >-
    DOWNGRADED FROM B - MY OWN ROUND-288 CLAIM, AND THE APPENDIX DOES NOT SUPPORT IT. There is no height
    table in the appendix, and the primary statistical model given on page 4 uses ABSOLUTE aortic root
    diameter rather than a Z score, so the inference I built on the Z-score methodology has no foundation.
    What IS demonstrably serial is WEIGHT, which drove dose up-titration across the 50 kg threshold. Whether
    height was recorded at follow-up visits can now only be answered by the trials unit.
- claim: >-
    Irbesartan did not move circulating TGF-beta, so an ARB is a poor probe of this axis.
  grade: D
  basis: >-
    OVERSTATED IN ROUND 288 AND CORRECTED HERE. Table S5: log TGF-beta at one year, placebo 5.40 versus
    irbesartan 5.29, difference -0.10 (95% CI -0.25 to 0.05), p=0.18, n=89. That is roughly a TEN PER CENT
    REDUCTION with an interval reaching twenty-two per cent lower, and the point estimate favours the drug.
    UNDERPOWERED, NOT NULL. The probe concern survives on the mechanistic argument - serum TGF-beta is not the
    perichondrial matrix pool - but not on this measurement.
- claim: >-
    A randomised, placebo-controlled cohort of growing children on this axis exists.
  grade: A
  basis: >-
    NINETY-THREE PARTICIPANTS UNDER 18 AT BASELINE, 45 placebo and 48 irbesartan, followed to five years with
    weight tracked throughout and 153 of 191 tolerating the full 300 mg dose. Read directly from appendix
    Table S3.
- claim: >-
    The failure to measure bone length on this axis is a one-off omission.
  grade: X
  basis: >-
    IT IS A PROPERTY OF THE FIELD. Three independent laboratories with growing animals dosed on this exact
    axis measured bone MASS, biomechanics, survival and body WEIGHT, and not one measured length. chen2015
    even watched the post-proliferative zone expand in a wild-type mouse and stopped there. busschers2025
    scanned femurs by micro-CT, for which length is a standard output, and did not report it. morales2026
    ran losartan at 153 mg/kg/day from E18 - the most aggressive exposure in the literature - and defined its
    growth curves as weights. Skeletal TGF-beta pharmacology descends from osteoporosis and fragility; the
    length question has no constituency in it.
- claim: >-
    The perichondrial axis targets the compartment this subject has left.
  grade: X
  basis: >-
    THE OPPOSITE, AND THIS IS THE ARGUMENT THAT MOVES THE RANKING. Marfan tall stature is DISPROPORTIONATE by
    definition - the revised Ghent nosology scores reduced upper-to-lower segment ratio with increased arm
    span to height - so the axis is LIMB-WEIGHTED. Round 274 puts the residual at bone age 14.5 and beyond at
    6.5 to 9.0 cm of trunk against 0.3 to 0.4 cm at the knees, and round 275 rejected the CNP arm on exactly
    this ground. Qualified by sedes2022's rib finding, which shows the mechanism reaches axial cartilage, and
    by Marfan scoliosis, which shortens measured sitting height and would exaggerate the apparent preference.
- claim: >-
    The perichondrial axis is dead.
  grade: X
  basis: >-
    NO - IT IS DEMOTED, NOT CLOSED, AND IT STAYS ALIVE AS TWO CONCRETE THINGS. The mechanism is untouched:
    four conditional deletions with a chondrocyte-negative control, a causal TGF-beta1 add-back, a 300 pg/ml
    setpoint, entirely postnatal accrual, and +11.14 cm per allele in 1.45 million humans. What survives is a
    DATA REQUEST - 93 randomised placebo-controlled children, five years, one question about height - and THE
    CHEAPEST MISSING EXPERIMENT IN THIS FILE, since three cohorts of mice have already been dosed on this
    axis and nobody picked up a caliper.
