- koch2026 FROH height verified
type: tissue_structure
layer: L1
stub: false
confidence: B
last_verified: '2026-08-27'
species_basis: human
human_evidence: direct
human_evidence_note: 13 human spinal deformity patients and 5 age-matched human autopsy controls, vertebral physis, direct
  histomorphometry. The growth-rate and remaining-spine-growth figures are cited by those authors rather than measured
  in that study. koch2026 is 173,303 humans.
translation_risk: moderate
translation_risk_reason: The scoliosis arm is a diseased and mechanically loaded plate, so its cell heights are a claim
  about severe compression rather than about normal growth; the five AUTOPSY CONTROLS are the arm that describes a normal
  human vertebral physis and n=5. The conversion factor is rat tail.
summary: 'ONE - AND IT CORRECTS THIS LEDGER. R425 wrote that THE PAEDIATRIC HUMAN VERTEBRAL PHYSIS HAS NEVER BEEN SAMPLED
  BY ANYONE. That is over-broad and bylskiaustrow2018 refutes it as stated - 13 patients and 5 age-matched autopsy controls,
  human vertebral physes, measured. R455 stated the defensible version, which survives: no paediatric or adolescent human
  vertebral growth-plate OMICS dataset exists, verified by GEO query. Histomorphometry exists; omics does not. TWO -
  the numbers, and the one_line_finding was EMPTY while R440 and R463 both built on them (CORR-351). Zone height 152
  +/- 34 scoliosis convex versus 180 +/- 42 control, p=0.21 NOT significant; hypertrophic CELL HEIGHT 8.5 +/- 1.1 versus
  12.8 +/- 1.2, p<0.0005, a 33 per cent fall; cell WIDTH 14.9 +/- 1.5 versus 15.0 +/- 2.5, unchanged. New here: measured
  cell density 152 +/- 25 cells per mm2 versus 103.9 +/- 50 in controls, about 46 per cent higher, which is what shorter
  cells at unchanged width must produce - the picture is internally coherent. Also new: paired convex versus concave
  in the two AIS patients has zone, cell height and cell width all lower on the compressed concave side, while the single
  NF sample runs the OTHER way on cell height (7.0 convex versus 9.2 concave), so the concave-side claim is two patients
  wide and not uniform. THREE - TWO HUMAN NUMBERS THIS ATLAS HAS NEVER HAD. The average human growth rate in children
  and adolescents is ON THE ORDER OF 1 MICRON PER PHYSIS PER DAY at the vertebral physis, and average remaining SPINE
  growth is about 6 to 7 cm at a skeletal age of 11 to 12 years. The first has an internal check that works: 1 micron
  per physis per day times two physes times 365 days is 0.73 mm per vertebra per year, against 0.83 to 0.86 mm per vertebra
  per year from direct paediatric radiography held in R455 - two independent routes agreeing to about 15 per cent. It
  also makes the human vertebral physis roughly 35 to 39 times slower per physis than the rat or calf vertebral physis
  in stokes2007 control rows (39 and 35 micron per day), which is a species fact this file has never stated. FOUR - AND
  THE CONVERSION FACTOR IS CONTESTED BY MORE THAN TWOFOLD, WHICH IS THE ROUND. R463 established that zone height does
  not track growth and cell height does; R471 added a positive-direction instance in which a 2 mm length gain left every
  zone height unmoved. So terminal cell height is the surviving readout and its exchange rate against growth rate is
  what every future cell-height result has to be multiplied by. bylskiaustrow2018 pairs a rat-tail result - 15 per cent
  cell-height reduction associated with 48 per cent growth-rate reduction at 0.2 MPa over 4 weeks - implying an amplification
  near 3.2, and extrapolates it linearly to infer that scoliosis apex growth is reduced by more than 50 per cent and
  stress raised by more than 0.4 MPa. But stokes2007, better powered and with the second term controlled, regresses growth
  rate on maximum hypertrophic cell height at a coefficient of 1.39, alongside 0.72 on proliferative chondrocyte number
  per unit width - which would convert 15 per cent of cell height into about 21 per cent of growth, not 48. And stokes2006
  stress sensitivity of 17.1 per cent per 0.1 MPa predicts about 34 per cent at 0.2 MPa rather than 48. The authors themselves
  call their curve speculative, imprecise and presumably nonlinear. THE HONEST POSITION IS THAT THE DEFENSIBLE AMPLIFICATION
  IS ABOUT 1.4 AND NOT 3.2, AND THAT THE 15-TO-48 PAIRING SHOULD NOT BE QUOTED AS A CONVERSION FACTOR. FIVE - and separately,
  koch2026 Extended Data Fig. 5 VERIFIES a number R453 held as secondhand and value_unverified. The F_ROH association
  with height is P=1.6e-48 in the standard analysis and P=6.5e-36 after ADDITIONAL ADJUSTMENT FOR EDUCATIONAL ATTAINMENT
  AND TOBACCO USAGE - a direct socioeconomic confounder control that joshi2015 could only approach through cross-population
  consistency. The units, which R453 secondhand figure omitted, are standard deviations of the normalized trait PER F_ROH
  OF 0.0625, and 0.0625 is exactly the autozygosity of the offspring of first cousins, so koch2026 and joshi2015 are
  on the same scale. Height ranks third by significance in that panel behind weight (3.6e-89) and number of children
  (2.1e-54). The point estimate is a figure bar and is not recoverable from the scan.'
