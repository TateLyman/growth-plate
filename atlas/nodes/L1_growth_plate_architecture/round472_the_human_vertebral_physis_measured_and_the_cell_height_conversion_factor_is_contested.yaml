id: round472_the_human_vertebral_physis_measured_and_the_cell_height_conversion_factor_is_contested
name: R472 - the human paediatric vertebral physis HAS been measured, its growth rate is about 1 micron per physis per
  day, and the cell-height-to-growth-rate conversion factor is contested by more than twofold
aliases:
- bylskiaustrow2018 full read
