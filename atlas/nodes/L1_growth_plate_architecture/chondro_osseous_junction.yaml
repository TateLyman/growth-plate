- 'mouse COJ: septoclast and capillary bud biology (sivaraj2022)'
- 'human COJ: mineral transition mapped (zoehrer2025); cellular kinetics unmeasured'
human_evidence: indirect
human_evidence_note: The human chondro-osseous junction has been characterised compositionally (zoehrer2025)
  and immunohistochemically for vessels and RANK+ cells (walzer2014), but no human study measures cell
  turnover rate at the junction.
