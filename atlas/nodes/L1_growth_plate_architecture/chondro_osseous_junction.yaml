id: chondro_osseous_junction
name: Chondro-osseous junction
aliases:
- COJ
- chondro-osseous border
- vascular invasion front
- metaphyseal front
type: tissue_structure
layer: L1
stub: false
summary: 'The chondro-osseous junction is the interface at which the terminal hypertrophic chondrocyte
  is removed, the transverse septum is breached and a metaphyseal capillary bud enters the emptied lacuna.
  Serial-section analysis in swine and rat established the time sequence: metaphyseal endothelial cells
  penetrate the non-calcified pericellular and territorial matrix rather than the mineralised longitudinal
  septa, so the invasion is targeted rather than indiscriminate. Terminal hypertrophic chondrocytes are
  alive up to this point; time-lapse differential interference contrast imaging of living explants shows
  them viable at the junction, and they pass through a defined condensation stage immediately before removal.
  The rate of removal is the mirror image of the production rate at the top of the plate: in the rat proximal
  tibia in steady state, one chondrocyte per column is eliminated every 3 h, that is 8 cells per column
  per day, and across the whole plate the calculated production and loss rates match. The junction is
  therefore the point at which elongation rate is read out, and the point at which anything that blocks
  resorption or angiogenesis will cause the plate to thicken.'
