id: round286_two_of_the_six_pass_the_open_plate_test_and_both_are_secreted_antagonists_outside_the_cell
name: >-
  ROUND 286 - I listed FBN1 as UNTESTED one round ago and this atlas already held the decisive datum, in a
  paper the operator supplied in August. Marfan long-bone overgrowth is NORMAL AT BIRTH AND DIVERGES BETWEEN
  ONE AND THREE MONTHS - the largest human taller-gene, +11.14 cm per allele, accrues ENTIRELY POSTNATALLY.
  So TWO of round 283's six now pass the open-plate test, and BOTH ARE SECRETED EXTRACELLULAR ANTAGONISTS
  ACTING FROM OUTSIDE THE RESPONDING CELL - which is CORR-300's rule arrived at a second time, independently
aliases:
- round 286
- FBN1 passes the open-plate test
- Marfan overgrowth is postnatal
- two of six pass
- the secreted-antagonist convergence
type: hypothesis
layer: L1
stub: false
summary: >-
  ONE - THE CORRECTION, AND IT IS EMBARRASSING IN A SPECIFIC WAY. Round 285 established the open-plate test
  and reported that TET1, ZFAT, NRK, CHD8 AND FBN1 were all untested by it. FBN1 IS NOT UNTESTED. This atlas
  holds perichondrial_tgfb_restraint, built on sedes2022, which the OPERATOR SUPPLIED AS A FULL-TEXT PDF ON
  2026-08-06 and which was read in full on the same day. The node's own text contains the sentence that
  answers round 285's question: Fbn1 loss in limb mesenchyme gives limb bones about 7 PER CENT LONGER than
  wild-type in vivo, NORMAL AT BIRTH AND DIVERGING BETWEEN ONE AND THREE MONTHS.
  THAT IS PURELY POSTNATAL ACCRUAL IN THE LARGEST HUMAN TALLER-GENE IN THE FILE. kosmicki2026 puts FBN1
  singleton loss-of-function at PLUS 11.14 CM PER ALLELE, the biggest positive effect in 1.45 million exomes,
  and the mouse says none of it is laid down before birth.

  TWO - AND THE SAME PAPER LOCALISES THE CONTROL OUTSIDE THE PLATE, WITH THE RIGHT NEGATIVE CONTROL. Four
  conditional deletions were run. DELETING FIBRILLIN-1 FROM THE CHONDROCYTES THEMSELVES PRODUCES NO
  OVERGROWTH. Deleting it from the scleraxis lineage does. The responsible tissue is the OUTER PERICHONDRIUM,
  identified by Cre-LoxP plus metatarsal organ culture. Mechanism: fibrillin-1 deficiency there reduces
  accumulation of LTBP-3 and LTBP-4 and lowers phosphorylated Smad2 - so the signalling change is LOSS of
  TGF-beta activity, the opposite of the excess the cardiovascular Marfan literature made famous - mutant
  metatarsals grow LONGER in vitro while releasing LESS TGF-beta, and ADDING RECOMBINANT TGF-BETA1 BACK
  NORMALISES THEIR LINEAR GROWTH. The add-back is the causal step and it fixes the sign.
  At the plate the effect is dual-term: proliferative zone LENGTH unchanged but PROLIFERATION increased, and
  the hypertrophic zone significantly expanded. In a multiplicative flow model that is worth more than moving
  either term alone.

  THREE - SO THE SCORECARD RE-SORTS, AND THE PATTERN IN IT IS THE FINDING. Against round 285's open-plate
  test - is the gene still doing work in an open plate, shown by tissue-restricted or postnatally-induced
  perturbation with a bone-LENGTH endpoint:
  PASSES - HHIP (+9.92 cm human): limb-restricted Hhip1 deletion, femur significantly longer at 10 AND 53
  weeks, no body-weight difference at either age.
  PASSES - FBN1 (+11.14 cm human, the largest): limb-mesenchyme Fbn1 deletion, bones about 7 per cent longer,
  NORMAL AT BIRTH, diverging 1 to 3 months, control extrinsic to the plate, chondrocyte deletion a clean
  negative control.
  FAILS - LCORL (+9.99 cm human): wyler2024's null mice are born SMALLER with reduced circulating IGF-1 and a
  HEPATIC GH-signalling mechanism, opposite in sign to bai2025, and not cluster-restricted in the plate.
  STILL UNTESTED - TET1, ZFAT, NRK, CHD8. No tissue-restricted and no inducible perturbation with a length
  endpoint in any species; for NRK, no skeletal experiment of any kind.

  FOUR - AND HERE IS WHAT THE TWO PASSES HAVE IN COMMON, WHICH I DID NOT GO LOOKING FOR. HHIP IS A SECRETED,
  MEMBRANE-BOUND ANTAGONIST THAT BINDS A MORPHOGEN AND LIMITS ITS RANGE. FIBRILLIN-1 IS A SECRETED
  EXTRACELLULAR MATRIX PROTEIN THAT SEQUESTERS THE LATENT BINDING PROTEINS OF A MORPHOGEN. BOTH ACT FROM
  OUTSIDE THE RESPONDING CELL, ON THE AVAILABILITY OF A SIGNAL RATHER THAN ON THE MACHINERY THAT READS IT.
  Both, when lost, lengthen bone with the growth plate's architecture intact rather than destroyed. And the
  gene that FAILS, LCORL, is an intracellular transcriptional corepressor acting through the liver.
  CORR-300 derived that rule one round ago from a three-way comparison - HHIP versus SUFU, SPIN4 versus
  PORCN, selective versus pan-FGFR. THIS ROUND ARRIVES AT IT AGAIN FROM A COMPLETELY DIFFERENT DIRECTION:
  sort six human height genes by whether they survive a postnatal tissue-restricted test, and the survivors
  are the two secreted extracellular antagonists. That is independent confirmation, not restatement.

  FIVE - AND IT CONVERGES ON A TISSUE THIS FILE ALREADY HAD FLAGGED FOR A DIFFERENT REASON. The periosteum
  node records PERIOSTEAL RELEASE as a real but age-limited lever, with an ROC cutoff of 9.6 YEARS for
  gaining more than 10 mm - a MECHANICAL restraint on longitudinal growth exerted by the tissue wrapped
  around the bone. sedes2022 puts a MOLECULAR restraint in the same tissue: the outer perichondrium's
  fibrillin-LTBP-TGF-beta module. TWO INDEPENDENT RESTRAINT MECHANISMS, ONE ANATOMICAL COMPARTMENT, FOUND BY
  DIFFERENT LITERATURES THAT DO NOT CITE EACH OTHER. And the molecular one has no 9.6-year cutoff - Marfan
  patients are tall as adults - which is the more useful half for a subject at bone age 16.

  SIX - THE CAUTION THAT BOUNDS ALL OF IT, AND IT IS THE SAME ONE THE NODE ALREADY CARRIED. THE GENE HAS NO
  DIRECTION; ALLELES DO. gne2026 adds a fresh twelve-patient series in which MONOALLELIC FBN1 VARIANTS CAUSE
  ACROMICRIC DYSPLASIA WITH SHORT STATURE, alongside biallelic ADAMTSL2, ADAMTS10 and ADAMTS17 giving
  geleophysic dysplasia and Weill-Marchesani - SHORT STATURE IN ALL TWELVE PATIENTS. kosmicki2026's +11.14 cm
  is specifically for singleton putative-LOSS-OF-FUNCTION variants; TB5-domain missense alleles of the same
  gene run the other way. This is FGFR3's structure exactly, and this atlas already knows what that costs.
  AND THE SIMPLE PHARMACOLOGICAL READING DOES NOT SURVIVE EITHER. If less TGF-beta meant a longer bone
  everywhere, then LTBP3, ADAMTSL2, ADAMTS10 and ADAMTS17 loss should lengthen, and all four SHORTEN. A 2026
  preclinical study reports that LOSARTAN SHOWS LIMITED BENEFIT in geleophysic dysplasia models, which is a
  negative for the excess-TGF-beta model of the short arm. The sign is established for the OUTER
  PERICHONDRIUM by an add-back experiment; it is NOT established as a general rule for the module.

  SEVEN - AND THE MISSING EXPERIMENT IS EMBARRASSINGLY CHEAP, WHICH THE NODE ALSO ALREADY SAYS. NO STUDY HAS
  SHOWN THAT LOWERING THIS AXIS PHARMACOLOGICALLY INCREASES BONE LENGTH IN A NORMAL ANIMAL. chen2015 gave
  losartan to wild-type mice and measured growth plate zone lengths and bone MASS: total plate length
  unchanged, resting and proliferative zones unchanged, post-proliferative zone EXPANDED - AND BONE LENGTH
  WAS NEVER MEASURED. The nearest human test is the Pediatric Heart Network trial, 608 children randomised
  for three years with height, height-for-age Z, arm span to height and upper to lower segment ratio all
  PRESPECIFIED SECONDARY OUTCOMES: no detectable effect on any of them - but the comparator was ATENOLOL, not
  placebo, so a null between two active drugs is not a null for the axis. AN APPROVED, CHEAP, PAEDIATRICALLY
  DOSED DRUG HAS BEEN GIVEN TO WILD-TYPE GROWING MICE ON THIS EXACT AXIS AND NOBODY PUT A CALIPER ON THE
  FEMUR.
quantitative:
- parameter: >-
    THE LARGEST HUMAN TALLER-GENE ACCRUES ENTIRELY AFTER BIRTH, AND THE CONTROL IS OUTSIDE THE PLATE
  value: >-
    Fbn1 loss in limb mesenchyme gives limb bones ABOUT 7 PER CENT LONGER than wild-type in vivo, NORMAL AT
    BIRTH AND DIVERGING BETWEEN 1 AND 3 MONTHS. Four conditional deletions localise the source; DELETING
    FIBRILLIN-1 FROM CHONDROCYTES THEMSELVES PRODUCES NO OVERGROWTH while deleting it from the scleraxis
    lineage does. Mechanism at the outer perichondrium: decreased accumulation of LTBP-3 and LTBP-4, reduced
    phospho-Smad2, mutant metatarsals LONGER in vitro while releasing LESS TGF-beta, and recombinant TGF-beta1
    add-back NORMALISES linear growth. At the plate: proliferative zone LENGTH unchanged but PROLIFERATION
    increased, hypertrophic zone significantly expanded. Human counterpart: FBN1 singleton loss-of-function
    PLUS 11.14 CM PER ALLELE, the largest positive effect among 1.45 million exomes
  unit: per cent bone length; cm per allele
  conditions: >-
    sedes2022, operator-supplied full text read 2026-08-06, already held in perichondrial_tgfb_restraint.
    kosmicki2026 for the human effect size.
  species: mouse
  source_ref: sedes2022
  uncertainty: >-
    THE MOUSE DELETION IS STILL CONSTITUTIVE IN THE LINEAGE, NOT TAMOXIFEN-INDUCED AFTER BIRTH - what makes it
    postnatal is that the animals are NORMAL AT BIRTH and diverge from one to three months, which means the
    effect is laid down while the plate is open rather than during patterning. That is the strongest form of
    the argument available without an inducible arm, and it is not the same as showing that switching the
    axis at bone age 16 would work. The 7 per cent figure is limb bones in mouse, not human stature.
- parameter: >-
    THE OPEN-PLATE SCORECARD FOR ROUND 283's SIX, CORRECTED
  value: >-
    PASSES - FBN1 (+11.14 cm human; ~7 per cent longer bones, normal at birth, diverging 1-3 months,
    chondrocyte deletion a clean negative control) and HHIP (+9.92 cm human; limb-restricted deletion, femur
    significantly longer at 10 AND 53 weeks, no body-weight difference at either age). FAILS - LCORL (+9.99
    cm human; null mice born SMALLER with reduced circulating IGF-1 and a hepatic GH-signalling mechanism,
    opposite in sign to bai2025, and not cluster-restricted in the mouse growth plate). UNTESTED - TET1
    (+8.32), ZFAT (+7.86), CHD8 (+10.22), NRK (+3.79): no tissue-restricted and no inducible perturbation
    with a bone-length endpoint in any species, and for NRK no skeletal experiment of any kind
  unit: pass / fail / untested against the open-plate test
  conditions: >-
    Round 285's test - is the gene still doing work in an open growth plate, shown by tissue-restricted or
    postnatally-induced perturbation with a bone-LENGTH endpoint. Sources: sedes2022, haraguchi2025,
    wyler2024, bai2025, kosmicki2026, and round 283's chu2026 cross.
  species: mouse
  source_ref: haraguchi2025
  uncertainty: >-
    A PASS HERE MEANS "THE GENE IS STILL DOING WORK WHILE THE PLATE IS OPEN", NOT "A DRUG WOULD WORK AT BONE
    AGE 16". Neither passing gene has any pharmacology in any species. Both mouse deletions are constitutive
    within their lineage rather than inducible. And "untested" is a statement about the literature searched
    this round, not a proof of absence - though for NRK the absence is total.
- parameter: >-
    THE ALLELIC SERIES THAT FORBIDS TREATING FBN1 AS A DIRECTION
  value: >-
    Twelve patients from nine families with genetically confirmed acromelic dysplasias: MONOALLELIC FBN1
    variants gave ACROMICRIC DYSPLASIA (n = 3); biallelic ADAMTSL2 gave geleophysic dysplasia type 1 (n = 4);
    biallelic ADAMTS10 gave Weill-Marchesani type 1 (n = 3); biallelic ADAMTS17 gave Weill-Marchesani type 4
    (n = 1); GNAS gave Albright hereditary osteodystrophy (n = 1). SHORT STATURE WAS PRESENT IN ALL PATIENTS.
    Delayed bone age was common in geleophysic dysplasia and in Weill-Marchesani type 1, and in all
    geleophysic patients height NORMALISED during follow-up
  unit: stature direction by allele class
  conditions: gne2026, median follow-up 8.1 years in eight of the twelve.
  species: human
  source_ref: gne2026
  uncertainty: >-
    A CASE SERIES, AND THE COMPARISON WITH kosmicki2026 IS NOT LIKE FOR LIKE - kosmicki2026's +11.14 cm is
    specifically singleton putative-LOSS-OF-FUNCTION, while acromicric and geleophysic FBN1 alleles are TB5-
    domain missense variants that are not simple loss of function. That is precisely the point: the gene has
    no direction, alleles do, exactly as for FGFR3. It also breaks the simple pharmacological reading, since
    LTBP3, ADAMTSL2, ADAMTS10 and ADAMTS17 loss all SHORTEN while the perichondrial add-back experiment says
    less TGF-beta lengthens - so the sign is established for one compartment, not for the module.
localization:
- 'OUTER PERICHONDRIUM: the tissue sedes2022 localises long-bone-length control to, extrinsic to the growth
  plate, with chondrocyte-specific deletion as the negative control'
- 'periosteum/perichondrium as one compartment: the same tissue the periosteum node records as a MECHANICAL
  restraint with a 9.6-year ROC cutoff - two independent restraint mechanisms, one anatomical site'
human_evidence: direct
human_evidence_note: >-
  FBN1 singleton loss-of-function at +11.14 cm per allele in 1.45 million exomes, against a twelve-patient
  acromelic dysplasia series in which monoallelic FBN1 variants give short stature. The mechanism and the
  postnatal timing are mouse.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: >-
  No pharmacological agent has ever been shown to increase bone LENGTH by lowering this axis in a normal
  animal, the one human randomised test used an active comparator rather than placebo and was null, and the
  same gene shortens stature through a different allele class.
confidence: B
confidence_reason: >-
  The postnatal-accrual and tissue-localisation claims rest on a full-text-read primary with four conditional
  deletions and a causal add-back, and the human effect size on 1.45 million exomes. Held at B because the
  central actionable step - lowering the axis pharmacologically and measuring length in a normal animal - has
  never been done, and because the module's sign is compartment-specific rather than general.
claim_grades:
- claim: >-
    FBN1 is untested against the open-plate test.
  grade: X
  basis: >-
    WRONG, AND I WROTE IT ONE ROUND AGO WHILE THIS ATLAS HELD THE ANSWER. sedes2022 - operator-supplied,
    read in full on 2026-08-06, already summarised in perichondrial_tgfb_restraint - reports limb bones about
    7 per cent longer with Fbn1 loss in limb mesenchyme, NORMAL AT BIRTH AND DIVERGING BETWEEN ONE AND THREE
    MONTHS, with chondrocyte-specific deletion producing no overgrowth. That is postnatal accrual, tissue
    localisation and a negative control in one paper.
- claim: >-
    The height effect of FBN1 loss is accrued postnatally, while the growth plate is open.
  grade: B
  basis: >-
    Mutant mice are NORMAL AT BIRTH and diverge between one and three months, reaching about 7 per cent
    longer limb bones. Nothing is laid down during patterning. Held at B rather than A because the deletion
    is constitutive within the lineage rather than tamoxifen-induced, so the experiment shows WHEN the effect
    accrues, not that switching the axis after that window would still work.
- claim: >-
    Long bone length is controlled from outside the growth plate.
  grade: B
  basis: >-
    Four conditional deletions, and the decisive one is negative: deleting fibrillin-1 from CHONDROCYTES
    produces NO overgrowth, while deleting it from limb mesenchyme or the scleraxis lineage does. The
    responsible tissue is the outer perichondrium, identified by Cre-LoxP plus metatarsal organ culture, and
    the causal step is the recombinant TGF-beta1 add-back that normalises mutant metatarsal growth.
- claim: >-
    Both genes that pass the open-plate test are secreted extracellular antagonists, and that is a coincidence.
  grade: X
  basis: >-
    IT IS NOT A COINCIDENCE AND IT IS THE SECOND INDEPENDENT DERIVATION OF THE SAME RULE. HHIP is a secreted
    membrane-bound antagonist that binds a morphogen and limits its range; fibrillin-1 is a secreted matrix
    protein that sequesters a morphogen's latent binding proteins. Both act on the AVAILABILITY of a signal
    from outside the responding cell, and both, when lost, lengthen bone with plate architecture intact. The
    gene that FAILS, LCORL, is an intracellular transcriptional corepressor working through the liver.
    CORR-300 derived this from HHIP-versus-SUFU, SPIN4-versus-PORCN and selective-versus-pan-FGFR; sorting
    six human height genes by a postnatal tissue-restricted test reaches it again from a different direction.
- claim: >-
    Lowering the perichondrial TGF-beta axis pharmacologically increases bone length.
  grade: E
  basis: >-
    NEVER SHOWN IN A NORMAL ANIMAL, AND THE OMISSION IS ABSURD. chen2015 gave losartan - approved, cheap,
    paediatrically dosed - to WILD-TYPE mice and measured growth plate zone lengths and bone MASS: total plate
    length unchanged, resting and proliferative zones unchanged, post-proliferative zone EXPANDED, and BONE
    LENGTH WAS NEVER MEASURED. The nearest human test, the Pediatric Heart Network trial in 608 children with
    height and body proportions as prespecified secondary outcomes, was null on all of them - but against
    ATENOLOL rather than placebo, so it is a null between two active drugs.
- claim: >-
    Less TGF-beta means a longer bone, as a general rule for this module.
  grade: X
  basis: >-
    THE SIGN IS ESTABLISHED FOR ONE COMPARTMENT, NOT FOR THE MODULE. The outer-perichondrium add-back
    experiment fixes the direction there. But loss of LTBP3, ADAMTSL2, ADAMTS10 and ADAMTS17 - all secreted
    partners in the same fibrillin-microfibril TGF-beta network - gives SHORT stature in every case, gne2026
    reports short stature in all twelve acromelic dysplasia patients, and a 2026 preclinical study finds
    LOSARTAN SHOWS LIMITED BENEFIT in geleophysic dysplasia models, which argues against the excess-TGF-beta
    model of the short arm. Do not generalise the perichondrial sign.
- claim: >-
    FBN1 is a target.
  grade: X
  basis: >-
    THE GENE HAS NO DIRECTION; ALLELES DO. gne2026's monoallelic FBN1 variants give ACROMICRIC DYSPLASIA with
    SHORT stature. kosmicki2026's +11.14 cm is specifically for singleton putative-loss-of-function. This is
    FGFR3's structure exactly. The target, if there is one, is the perichondrial TGF-beta tone rather than the
    gene - and that has no agent with a length endpoint in any species.
key_refs:
