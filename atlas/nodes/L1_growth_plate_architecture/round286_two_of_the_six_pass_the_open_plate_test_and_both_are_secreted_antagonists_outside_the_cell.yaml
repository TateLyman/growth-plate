    hepatic mechanism, an intracellular corepressor rather than a secreted antagonist
contradicts: >-
  CORRECTS round285_germline_from_conception_was_a_bad_objection_and_the_test_that_replaces_it_reopens_hedgehog,
  which listed FBN1 among the genes untested by its own open-plate test. FBN1 had already been tested and this
  atlas already held the result in perichondrial_tgfb_restraint, from a full text the operator supplied on
  2026-08-06: about 7 per cent longer limb bones, NORMAL AT BIRTH and diverging between one and three months,
  with chondrocyte-specific deletion as a clean negative control. Two of round 283's six now pass rather than
  one.
  It ADDS to perichondrial_tgfb_restraint the human effect size that node lacked - FBN1 singleton
  loss-of-function at +11.14 cm per allele in 1.45 million exomes - and a fresh twelve-patient allelic series
  confirming the bidirectionality caution that node already carried.
  It CONFIRMS CORR-300 from an independent direction: sorting six human height genes by a postnatal
  tissue-restricted length test leaves exactly the two SECRETED EXTRACELLULAR ANTAGONISTS standing.
