  year: 2022
  type: primary
  one_line_finding: >-
    Marfan long-bone overgrowth is about 7 per cent, NORMAL AT BIRTH and diverging between one and three
    months, comes from the OUTER PERICHONDRIUM rather than the plate - chondrocyte-specific deletion causes
    none - via reduced LTBP-3/-4 and TGF-beta signalling, with TGF-beta1 add-back normalising it
