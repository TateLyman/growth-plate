id: distal_femur_plate
name: Distal femoral growth plate
aliases:
- distal femoral physis
type: tissue_structure
layer: L1
stub: false
summary: 'The distal femoral physis is the fastest human growth plate and the single largest contributor
  to standing height among individual plates. It supplies about 70% of femoral length overall, and its
  share rises with age: from 60% at age 7 to 90% at age 14 in girls, and from 55% at 7 to 90% at 16 in
  boys. In absolute terms it adds about 1.3 cm per year from age 7 until the final two years of growth,
  when the rate halves. Independent data from the Harpenden Growth Study give a mean distal femoral growth
  rate of 1.4 cm per year between ages 5 and 8, which is roughly 38 um per day - an order of magnitude
  slower than the rat proximal tibia. Its histology is the source of the only human column-length measurement:
  24 cells per proliferative column, from which a mean proliferative cycle time of about 20 days was derived.
  Because of its speed and its accessibility it is also the plate on which most human epiphysiodesis and
  guided-growth surgery is performed, and the site of the intercondylar transphyseal complexes through
  which metaphyseal osteosarcoma reaches the epiphysis.'
