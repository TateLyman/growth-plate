- parameter: cells per proliferative column
  value: '24'
  unit: cells
  conditions: human distal femur, ages 5-8 y; two-thirds of a MEASURED 36 maturing-plus-proliferating
    cells per column, the two-thirds ratio taken from the rabbit growth plate because no morphological
    criterion distinguishes proliferating from maturing cells in a stained human section
  species: human
  source_ref: kember1976
  uncertainty: 'NOT a direct count. The human measurement is 36 combined cells; the split into 24
    proliferating is a RABBIT-derived fraction applied to it, and the paper says so. The authors give a
    lower bound of 20 cells, which would make the cycle time 16 days. This is a species transfer sitting
    inside the atlas''s only human column-length number.'
- parameter: maturing plus proliferating cells per column (directly counted)
  value: '36'
  unit: cells
  conditions: human distal femur, ages 5-8 y; counted on approximately every fiftieth column, hypertrophic
    cells counted separately
  species: human
  source_ref: kember1976
  uncertainty: 'the directly measured quantity, before the rabbit-derived two-thirds split. Across the
    12-subject series this count falls with age (62 at birth to 21-28 at 13-14 y) but the paper notes no
    marked decline until the plate closes. Counts are described by the authors as "to some extent
    subjective", involving judgement about where a column ends and where hypertrophy begins.'
- parameter: cells per proliferative column
  value: '28'
  unit: cells
  conditions: human distal femur, 10-year-old girl; counted from the position-resolved tritiated-thymidine
    labelling profile, taking the run of positions with the highest labelling frequency
  species: human
  source_ref: thurston1985
  uncertainty: 'read off a labelling histogram rather than counted cell by cell, and the authors write
    "about twenty-eight"; n=1 subject. It is an independent estimate from kember1976''s 24 by a different
    method on a different subject, so the two together bracket the human value at roughly 24-28 rather
    than confirming either.'
- parameter: terminal hypertrophic cell height along the growth axis
  value: '33'
  unit: um
  conditions: human distal femur, ages 5-8 years, necropsy material; maximum dimension of the cell space
    along the growth axis, averaged over five groups of ten cells at regular intervals along the metaphyseal
    border; celloidin embedding, 15 um sections, and a measured 13% linear processing shrinkage corrected
    for
  species: human
  source_ref: kember1976
  uncertainty: '+/- 5 um SD across the three specimens in the 5-8 y band; the full series of 12 subjects
    from birth to 13 y spans 29-38 um with no age dependence, and the two 14-year-olds gave 39 um (male)
    and 25 um (female) with closure in progress. THIS IS THE ROW THE 20-DAY CYCLE TIME IS DERIVED FROM
    and the paper states the derivation explicitly. It CONTRADICTS thurston1985''s 20.5 um by 61%.'
- parameter: terminal hypertrophic cell height along the growth axis
  value: '20.5'
  unit: um
  conditions: human distal femur, 10-year-old girl, mean of 20 cells along the metaphyseal border; decalcified
    paraffin, no shrinkage correction reported
  species: human
  source_ref: thurston1985
  uncertainty: 'no dispersion reported; n=1 subject. CONTRADICTS kember1976''s 33 +/- 5 um (n=12 subjects,
    ~50 cells each) by 61%, and lies outside that series'' entire 29-38 um range. Reaching 20.5 from 33
    requires 38% linear shrinkage; kember1976 measured its own shrinkage at 13% and corrected for it,
    thurston1985 reports none. Method asymmetry favours the higher value but does not settle it - see
    contradiction C-L1-07 and gap g_l1arch_009.'
- parameter: derived mean proliferative cell cycle time
  value: '20'
  unit: days
  conditions: human distal femur; derived from column count and growth rate
  species: human
  source_ref: kember1976
  uncertainty: derived quantity, not measured
