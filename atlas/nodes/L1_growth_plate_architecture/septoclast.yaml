id: septoclast
name: Septoclast
aliases:
- cartilage-resorbing perivascular cell
- FABP5+ chondro-osseous border cell
type: cell_type
layer: L1
stub: false
summary: 'The septoclast is a mononuclear, spindle-shaped, cathepsin B-rich cell sitting at the chondro-osseous
  junction in intimate contact with the distal buds of the invading metaphyseal capillaries, first defined
  in rat as the cell that resorbs the transverse cartilage septa. Lineage tracing in mouse shows septoclasts
  are mesenchymal, not haematopoietic: they are FABP5+, PDGFRalpha+ and PDGFRbeta+, NG2+ but CD146-negative,
  and they lack the CD68/vATPase profile of osteoclasts, which are also present at the junction but far
  less abundant there. Their specification requires the Notch ligand Dll4 supplied by endothelial cells,
  which makes them a directly angiogenesis-coupled catabolic cell. They disappear in adult and ageing
  bone in parallel with the cessation of growth, and re-emerge with growing vessels during fracture healing.
  Marker assignment is not fully settled: FABP4 is upregulated in septoclasts of FABP5-deficient mice,
  indicating redundancy, and their origin has been assigned variously to pericytes and to the perichondrium.
  Every primary observation is rodent or bovine; a full search of the septoclast literature returns no
  human tissue study whatsoever.'
