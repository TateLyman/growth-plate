human_evidence: direct
human_evidence_note: The structure is described directly in human tissue - 28 paediatric knee MRIs at 1 mm
  slice thickness, 10 dissected paediatric knees, with H&E, immunofluorescence and angiography - and its
  clinical correlate is 38 paediatric osteosarcoma patients. It is nonetheless a single discovery paper from
  a single group and has not been independently replicated.
translation_risk: not_applicable
translation_risk_reason: The primary evidence is human anatomical and pathological material. The unresolved
  variable is not species but skeletal maturity - patency at bone age 16 has never been measured.
summary: 'THE MEASUREMENT FIRST, BECAUSE IT IS THE MOST EXPENSIVE CORR-352 INSTANCE RECORDED HERE AND IT IS
  EXPENSIVE BECAUSE OF WHICH ARGUMENT IT UNDERMINES. CLAUDE.md returns transphyseal 0, cartilage canal 0,
  shao2022 0 - and avascular 14. transphyseal_canal.yaml and cartilage_canal.yaml both exist, both grade C,
  both written 2026-08-05, and NEITHER CONTAINS THE WORDS DELIVERY, DRUG, BIOLOGIC OR THERAPY EVEN ONCE. The
  delivery wall is the single most-cited obstacle to every biologic proposal in this file - R314, R315, R330,
  R376, R401, R430 - and the anatomical counterexample has been in the node graph the whole time, filed under
  oncology and osteomyelitis.


  WHAT shao2022 FOUND, VERIFIED VERBATIM BY DIRECT FETCH. A previously undescribed INTERCONDYLAR TRANSPHYSEAL
  COMPLEX: a vasculature-canal compound structure arising from the MIDDLE GENICULAR VESSELS, traversing the
  WHOLE EPIPHYSIS, and BREACHING THE INTACT OPEN PHYSIS of the immature proximal tibia or distal femur. Its
  named components are the juxta-articular, epiphyseal and transphyseal segments of vessels; canals that
  traverse the entire epiphysis AND the physis and enclose those vessels; vascular foramina on the articular
  facet; and foramina-covering synovium. Three types - femoral, anterior tibial and posterior tibial. The
  evidence is 28 paediatric knee MRIs at 1 mm slices, 10 dissected paediatric knees, haematoxylin-eosin,
  immunofluorescence and angiography. Clinically it is the route by which osteosarcoma crosses a growth
  plate, and the authors state it does so WITHOUT DAMAGING THE ADJACENT PHYSEAL CARTILAGE - so it is a normal
  anatomical structure rather than an invasion front.


  THE JOIN NOBODY HAS MADE. The two plates it describes are the DISTAL FEMUR and the PROXIMAL TIBIA, which
  are the exact two R373 and R374 selected for the SAG depot and the two that carry most knee growth. A route
  that passes tumour CELLS passes a protein and it is not close - an osteosarcoma cell is of order 10
  micrometres while a nanobody is about 15 kDa and a few nanometres, so the bar for cell transit is orders of
  magnitude higher, and the cell transit is demonstrated in patients. And it changes the BOUNDARY CONDITION
  of the transport model rather than the model itself: R430 calibrated diffusion plus Donnan FROM THE PLATE''S
  PERIMETER and R315''s wall is about crossing avascular cartilage from outside, whereas a patent vessel lumen
  INSIDE the physis moves the source from the perimeter to a point within the tissue and collapses the
  diffusion distance - which for a systemically administered agent, and a vessel is what carries one, is the
  favourable direction. R430''s arithmetic is not wrong; its geometry may be.


  AND IT DOES NOT RESCUE THE INTRA-ARTICULAR ROUTE, WHICH IS THE TEMPTING MISREADING. The articular foramina
  are SYNOVIUM-COVERED and the canals ENCLOSE VESSELS, so this is a vascular conduit and not an open channel
  from the joint cavity. R361''s objection to a joint injection at bone age 16 stands.


  FOUR HONEST LIMITS, STATED BEFORE ANYONE BUILDS ON IT. It is REGIONAL rather than distributed - the
  structure is intercondylar, so anything delivered through it arrives in one region of the plate rather than
  across it. AGE IS UNVERIFIED for this subject - the specimens are immature knees, which is his state since
  his physes are open, but nobody has measured ITC patency against skeletal maturity and that is exactly the
  variable that matters at bone age 16. It is ONE GROUP, ONE DISCOVERY PAPER, 2022, UNREPLICATED, and this
  atlas''s own transphyseal_canal node states that the human quantitative anatomy - number, diameter and
  age-dependence of these channels - is essentially unmapped outside that single study. And A VESSEL LUMEN IS
  NOT THE CARTILAGE: the agent still has to leave the vessel and enter the matrix, and that step has never
  been measured for any molecule, which is the same extravasation question R430''s model does not contain.


  THE COMPANION STRUCTURE IS THE WRONG ONE FOR HIM, BY THIS FILE''S OWN NODE. cartilage_canal.yaml describes
  vascularised channels that invade epiphyseal cartilage BEFORE the secondary ossification centre appears - a
  pre-SOC structure that regresses as the centre forms. At bone age 16 he is maximally post-SOC, so cartilage
  canals are not his route and the ITC, described in bone with an intact open physis, is. Worth recording
  that the cartilage canal node calls those channels not merely a plumbing system but A DELIVERY ROUTE - for
  osteogenic precursors. This file''s own vocabulary had the phrase and applied it to cells.


  THE INVERSE, RECORDED BECAUSE IT IS A COST NOBODY HAS PRICED. If constant vascular structures breach the
  intact physis then the plate is exposed to systemic factors it was assumed to be shielded from, which bears
  on R365 where vascular invasion is the terminal event of closure, and on R442 where a sustained metaphyseal
  occlusion changes growth. shao2022 states explicitly that ITCs cross without damaging the adjacent physeal
  cartilage, so they are not an invasion front - but nobody has asked what an anti-angiogenic or a
  pro-angiogenic agent does to them, and this stack contains agents that move angiogenesis.


  WHAT CHANGES. Not a compound, and not a licence to assume delivery is solved. What changes is that "the
  growth plate is avascular" - asserted fourteen times in this ledger and load-bearing under every biologic
  argument in it - IS FALSE AS A UNIVERSAL, in the two plates that matter most, in humans, with the physis
  intact and open. The correct statement is that the plate is AVASCULAR IN BULK AND BREACHED FOCALLY, and the
  delivery question is therefore not whether anything can cross an avascular tissue but what fraction of the
  plate a focal vascular route serves and whether a macromolecule leaves that vessel - a smaller,
  better-posed and answerable question that nobody has asked.'
