summary: 'The perichondrial ring of LaCroix is the thin collar of dense fibrous tissue and bone that encircles
  the growth plate at its periphery, continuous with the metaphyseal periosteum below and with the groove
  of Ranvier above. Functionally it is the mechanical restraint on the plate: it resists the shear and
  tensile forces that would otherwise displace the epiphysis on the metaphysis, which is why it is described
  together with the groove as a single peripheral apparatus in Shapiro''s rabbit study and why its structural
  integrity is what surgical approaches to the physis attempt to preserve. It is the anatomical explanation
  for the clinical observation that physeal separation occurs more readily in young children, in whom
  the ring is relatively thin. Because it is a mechanical rather than a metabolic structure, there are
  almost no quantitative data on it: no measurements of its stiffness, thickness or load share have been
  reported in human tissue, and it is described in the human literature only qualitatively alongside the
  groove.'
