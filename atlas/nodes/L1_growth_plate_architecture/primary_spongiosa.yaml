type: tissue_structure
layer: L1
stub: false
summary: 'The primary spongiosa is the layer of newly formed trabeculae immediately below the chondro-osseous
  junction, each trabecula consisting of a mineralised longitudinal cartilage septum coated with woven
  bone. It is the direct structural product of the growth plate, so its dimensions track plate activity:
  in human rib the primary spongiosa height falls with age in parallel with the proliferative and hypertrophic
  zones, most steeply in the first postnatal year, while bone trabecular thickness increases and trabecular
  number decreases. Byers and colleagues make the point that the proliferative zone, hypertrophic zone
  and primary spongiosa should be treated as a single active growth region whose internal rearrangement,
  not just its height, changes with age; by contrast the secondary spongiosa in the same specimens showed
  stable bone mineral volume with trabecular consolidation. Because the primary spongiosa carries the
  cartilage core forward, its resorption rate determines how much of the plate''s product survives into
  the metaphysis, which is where growth plate architecture couples to peak bone mass.'
