id: proliferative_zone
name: Proliferative zone
aliases:
- PZ
- columnar zone
- zone of flattened cells
type: tissue_structure
layer: L1
stub: false
summary: 'The proliferative zone contains flattened, discoid chondrocytes stacked into longitudinal columns,
  each column a clone descended from a resting-zone progenitor. It is where the cell cycle is run and
  where column architecture is generated by post-mitotic rotation of daughter pairs. Column length in
  this zone is a species constant of sorts: Kember and Sissons counted 24 cells per proliferative column
  in the human distal femur, against a rodent plate that is structurally different and cycles roughly
  ten times faster. Rat proliferative cycle time varies from 30.9 h to 76.3 h between plates in the same
  animal, with the variation almost entirely in G1. In human rib the proliferative zone height falls with
  age, most steeply in the first year, while cartilage septal thickness rises and septal number falls,
  meaning the zone becomes shorter and coarser as growth decelerates. The proliferative zone contributes
  only a small direct share of elongation - about 9% by cell division in the fast rat proximal tibia -
  but it sets the number of cells that will later hypertrophy, which is where most of the elongation is
  generated.'
quantitative:
- parameter: cells per proliferative column
  value: '24'
  unit: cells
  conditions: human distal femur, cell counts on histological sections
  species: human
  source_ref: kember1976
  uncertainty: not reported; single-study value
- parameter: total cell cycle time
