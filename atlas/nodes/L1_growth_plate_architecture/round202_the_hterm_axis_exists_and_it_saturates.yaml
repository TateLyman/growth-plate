contradicts:
- 'OVERTURNS THE STANDING TEXT OF g_l1_raise_terminal_cell_volume, which reads that there is "no evidence
  the parameter can be pushed upward at all rather than only downward, and every manipulation on record
  LOWERS it". weber2025 raises it by about 20 per cent. The gap is not closed - it asked for a NON-DISEASED
  plate and for the cost to be measured, and a constitutive null with kyphosis answers neither - but its
  central negative premise is now false and the field of candidate agents is no longer empty.'
- 'CONTRADICTS THE STACK''S WORKING ASSUMPTION THAT MORE SOMATOTROPIC DRIVE IS BETTER. Under a fixed
  reserve, a saturating benefit against a linear cost has an interior optimum. hunziker1994 read as a
  dose-response puts 40 per cent of the available h_term in the first tripling of pool consumption and
  9 per cent in the next 3.3-fold. The dose that maximises adult height is therefore the lowest one that
  saturates h_term. This does not say GH is harmful and it does not license an IGF-I substitution; it
  says the dose-finding question has never been asked in the right currency.'
- 'QUALIFIES ROUND 199 AND ROUND 201 RATHER THAN OVERTURNING THEM. Both treated pool expansion as the
  route worth working. The exchange rate says a division returns about a fifth of what a hypertrophy
  returns, so even a solved second-signal problem buys length at the least efficient point in the
  transaction. h_term should be worked in parallel, not after.'
- 'SITS IN TENSION WITH ITSELF ON THE SPINE, WHICH MATTERS FOR THIS CASE. weber2025 finds Npr3 loss
  DISPROPORTIONATELY elongates proximal and mid-tail vertebrae in mouse; lauffer2022 finds human biallelic
  NPR3 loss gives a PROPORTIONATE gain with a normal sitting-height ratio; moffatt2025 finds tall stature
  WITH scoliosis. No segment-resolved human growth measurement exists under any CNP-axis agent, and the
  atlas should stop assuming the spine and the limb respond alike.'
