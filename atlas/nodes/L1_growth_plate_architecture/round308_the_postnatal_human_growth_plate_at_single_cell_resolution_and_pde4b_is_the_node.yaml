contradicts: >-
  This round withdraws a methodological hedge the atlas has used since round 292 and corrects three
  expression calls. WITHDRAWN: "a non-detection on GSE9160 is weak evidence of absence because that platform
  missed NPPC." The control was preregistered and NPPC is absent in single-cell postnatal human growth plate
  as well, so the array was right and every absence call in this file - including the ones that killed the
  ARB and nitrate shelves - becomes stronger rather than weaker. CORRECTED: PDE3B, SPIN4 and PDE5A are all
  present, so the array's limitation was dynamic range rather than blindness. NARROWED: round 306's
  conclusion that PDE4 and PDE3 are comparably supported - PDE4B is thirty times more abundant than PDE3B in
  the correct tissue at the correct stage, which makes PDE4 the local node and PDE3B's strong burden effect
  most likely systemic. Round 307's band and CREB conflict are untouched and still govern whether to push
  this axis at all.
