id: epiphyseal_vasculature
name: Epiphyseal vasculature
aliases:
- epiphyseal blood supply
- secondary ossification centre vasculature
type: tissue_structure
layer: L1
stub: false
summary: 'The epiphyseal side of the growth plate is supplied by vessels that reach the secondary ossification
  centre through cartilage canals and then via the epiphyseal arterial network. These vessels feed the
  resting and upper proliferative zones by diffusion across the epiphyseal face, since the plate itself
  contains no vessels. In human epiphyses the new vessels of the ossification centres are immature: they
  are formed by CD34-positive endothelial sprouts that do not yet co-express the mature marker CD31 and
  carry no abluminal alpha-SMA-positive smooth muscle coverage, in contrast to the mature, smooth-muscle-invested
  vessels of the periosteum and the groove of Ranvier in the same specimens. Vessel formation proceeds
  by sprouting from the bone collar or by intussusception rather than by recruitment of circulating CD133+
  endothelial progenitors, and vascular invasion of the joint anlage is delayed relative to surrounding
  joint tissue. Interruption of this supply is the mechanism of epiphyseal osteonecrosis and, in the horse
  and pig, of osteochondrosis.'
quantitative:
