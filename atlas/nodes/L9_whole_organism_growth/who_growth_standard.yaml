claim_grades:
- claim: Under growth-permitting conditions, site of origin explains only about 3% of variance in early
    linear growth
  grade: A
  basis: Prospective multicentre design with prescriptive inclusion criteria and formal variance decomposition
    (who2006).
- claim: The WHO velocity standards are the appropriate tool for detecting growth faltering in infancy
  grade: C
  basis: Argued by de2011 from the divergence between WHO and US increments; this is an inference about
    clinical utility rather than a measured outcome.
