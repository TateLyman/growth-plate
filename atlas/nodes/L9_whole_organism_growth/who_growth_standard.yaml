id: who_growth_standard
name: WHO Child Growth Standards
aliases:
- WHO MGRS standards
- WHO 2006 standards
type: dataset
layer: L9
stub: false
summary: 'The WHO Child Growth Standards are prescriptive rather than descriptive: they were built from
  children raised under conditions defined a priori as growth-permitting (breastfeeding, non-smoking mothers,
  adequate nutrition, no major morbidity) in six sites on five continents, so they describe how children
  should grow rather than how a given population does grow. The decisive empirical result underpinning
  that design is that between-site variance in linear growth was small: site differences accounted for
  only about 3% of the variance in length, while individual differences within sites accounted for about
  70% (who2006). This is the strongest single piece of evidence that under permissive conditions the human
  linear-growth trajectory is close to species-universal in the first five years, which in turn is what
  licenses the atlas to treat early growth-velocity targets as a property of the organism rather than
  of a population. The companion velocity standards give 1-, 2-, 3-, 4- and 6-month length increments
  with percentiles from birth to 24 months (who_velocity_2009), and these differ systematically from US
  reference increments, most at the lower percentiles (de2011) - so the choice of reference changes what
  counts as growth faltering more than it changes the median.'
