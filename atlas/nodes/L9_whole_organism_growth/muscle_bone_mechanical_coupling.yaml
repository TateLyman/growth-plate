id: muscle_bone_mechanical_coupling
name: Muscle-bone mechanical coupling
aliases:
- functional muscle-bone unit
- mechanostat coupling
type: process
layer: L9
stub: false
summary: 'The mechanostat predicts that bone strength is a consequence of the loads muscle imposes, so
  muscle growth should lead bone growth in time. Rauch and colleagues tested the prediction directly with
  longitudinal DXA in 70 boys and 68 girls through puberty. Peak whole-body lean mass accrual preceded
  peak bone mineral content accrual by 0.36 years in boys and 0.51 years in girls; in the arms the interval
  was 0.63 and 0.71 years and in the legs 0.48 and 0.22 years (rauch2004). The temporal ordering therefore
  holds at every site but with a site-specific lag - the arm lag is roughly three times the girls'' leg
  lag - which a single systemic driver does not predict. The stronger result is the regression: peak lean
  mass velocity, but not peak height velocity and not sex, was independently associated with peak bone
  mineral content velocity, explaining 50% of the variance for the total body, 61% for the arms and 41%
  for the legs. Longitudinal bone growth is thus statistically dissociable from bone mineral accrual:
  whatever sets peak height velocity is not what sets peak bone mineral accrual. The authors are explicit
  that the data cannot exclude the alternative that muscle and bone development are independently determined
  genetically and merely correlated.'
