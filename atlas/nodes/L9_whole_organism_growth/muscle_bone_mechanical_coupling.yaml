confidence: A
claim_grades:
- claim: Peak lean mass accrual precedes peak bone mineral accrual at every site measured
  grade: A
  basis: Directly measured intervals at three anatomical levels in 138 children.
- claim: Muscle growth causes bone mineral accrual
  grade: D
  basis: The temporal precedence and the regression are compatible with causation but the authors state
    explicitly that independent genetic determination of both is not excluded; no interventional human
    data.
- claim: Longitudinal growth and bone mineral accrual are driven by different variables
  grade: B
  basis: Peak height velocity had no independent association with peak BMC velocity once lean mass velocity
    was in the model (rauch2004); one cohort.
