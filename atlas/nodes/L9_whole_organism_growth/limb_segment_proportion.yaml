id: limb_segment_proportion
name: Limb segment proportions
aliases:
- arm span minus height
- arm span/height ratio
- upper to lower segment ratio
type: phenotype
layer: L9
stub: false
summary: 'Arm span minus height, and the arm span/height ratio, index the relative output of the upper-
  and lower-limb growth plates and of the vertebral plates against each other. In Japanese national anthropometry
  of 6089 boys and 4970 girls aged 5.5-18.5 years, arm span rises throughout childhood with a marked acceleration
  at puberty and the arm span/height ratio rises slowly throughout childhood before plateauing (hirano2025).
  Two population facts fall out of the same analysis and constrain any universal mechanistic model: the
  Japanese ratio is lower than the Dutch and Turkish ratio at every age between 5.5 and 18.5 years, and
  it reaches its plateau earlier. Population differences in limb proportion are therefore not a simple
  consequence of differences in adult stature or in pubertal timing alone, since the plateau age and the
  ratio differ independently. Because arm span is dominated by the proximal humeral and distal radial
  physes while height is dominated by the distal femoral and proximal tibial physes (proximal_humerus_plate,
  distal_radius_plate, distal_femur_plate, proximal_tibia_plate in L1), the ratio is the cheapest organism-level
  readout of differential physeal velocity that exists, and a mechanistic model that predicts a single
  systemic growth signal must explain why these four plates respond to it in fixed but population-specific
  proportions.'
