id: mid_parental_target_height
name: Mid-parental target height
aliases:
- target height
- corrected mid-parental height
- Tanner target height
type: method
layer: L9
stub: false
summary: 'Target height is a child''s mid-parental height corrected for sex, conventionally by adding
  6.5 cm for a son or subtracting 6.5 cm for a daughter (equivalently, adding 13 cm to the mother''s height
  before averaging), a procedure introduced by Tanner, Goldstein and Whitehouse (tanner1970) and still
  the recommended method. Three of its assumptions are demonstrably wrong. First, the sex correction is
  additive and constant, but in the CDC reference the male-female height difference at matched percentiles
  rises from 12.2 cm at the 3rd percentile to 14.7 cm at the 97th, and a multiplicative factor of 1.08
  fits with R-squared = 1 (zeevi2024). Second, parental height is measured after adult height loss has
  begun, biasing target height downward: in a cohort with parents aged 62 +/- 5 years the children were
  2.7 cm taller than predicted, and a nonlinear age correction reduced that bias to 0.06 cm (zeevi2024).
  Third, regression to the mean is ignored: the regression of standardised child height on standardised
  mid-parental height has a slope of about 0.79 (zeevi2024) and 0.75-0.78 in a population-based Swedish
  sample (luo1998), so the uncorrected method systematically underestimates the adult height of children
  of short parents - Luo found up to a 6 cm error by the Tanner method at mid-parental height below -2
  SDS. Wright and Cheetham showed the practical consequence: of 13 children below the 2nd height centile,
  8 appeared to be within the mid-parental 90% range, but only 3 remained so once regression to the mean
  was applied (wright1999).'
