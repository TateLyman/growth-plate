localization:
- 'human whole organism: adult standing height of parents and offspring'
human_evidence: direct
human_evidence_note: All data are measured adult heights of parents and their adult children in population-based
  and family-based human cohorts.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: A human clinical calculation with no animal counterpart.
confidence: A
claim_grades:
- claim: Mid-parental height explains only about 36-40% of the variance in adult child height
  grade: A
  basis: Directly measured in 303 adult children of 23 large families with both parents measured (zeevi2024);
    consistent with the 0.75-0.78 parent-offspring regression slopes in a population sample of 2402 (luo1998).
- claim: The additive 13 cm sex correction is wrong at the height extremes and a multiplicative 1.08 factor
    is correct
  grade: B
  basis: Demonstrated arithmetically against CDC matched-percentile heights and validated by improved
    variance explained in one family cohort; not replicated in a second population.
- claim: Ignoring regression to the mean systematically misclassifies short children
  grade: A
  basis: 'Direct demonstration in a representative survey sample: 8 of 13 children below the 2nd centile
    appeared within the mid-parental 90% range, falling to 3 of 13 after correction (wright1999).'
