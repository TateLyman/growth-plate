id: suture_fusion_timing
name: Cranial suture fusion timing
type: phenotype
layer: L9
stub: false
summary: Cranial sutures are the intramembranous growth sites of the calvaria and their patency is what
  allows the vault to expand with the brain. The textbook statement that the major sutures close during
  the third decade is wrong for a substantial minority of children. In 1119 healthy children aged 0-18
  imaged by high-resolution head CT for unrelated reasons, with craniofacial disorders, syndromes, fractures
  and intracranial pathology excluded, complete or partial sagittal suture closure was present in 11.1%,
  coronal closure in 2.8% and lambdoid closure in 1.6%; up to 17% had some asymptomatic calvarial suture
  closure before adulthood (han2025). Sagittal patency fell from 99.3% under age three to 83% by age nine.
  The metopic suture behaved as the textbooks describe, with over 75% closed by 21 months. Closure was
  not morphologically silent - sagittal closure was associated with a lower cephalic index (beta -0.8,
  p=0.026) and 86.4% of children with a cephalic index below 70 had partial or complete sagittal closure
  - but 83.1% of children with sagittal closure remained normocephalic. The organism-level significance
  is that the calvarial growth sites finish long before the long bones, and they do so on a schedule that
  tracks brain growth rather than the pubertal spurt.
