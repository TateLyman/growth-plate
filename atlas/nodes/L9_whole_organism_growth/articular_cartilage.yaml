- 'mouse epiphysis: articular and growth plate cartilage under Ift80 deletion (yuan2015)'
human_evidence: direct
human_evidence_note: Normative articular cartilage thickness measured by MRI in 240 children and adolescents
  with physeal status recorded on the same scans.
species_basis:
- human
- mouse
translation_risk: moderate
translation_risk_reason: The human data are thickness on MRI with no cellular content; the dissociation
  between articular and physeal responses to a single perturbation is established only in mouse.
confidence: B
claim_grades:
- claim: Femoral articular cartilage is thicker while the distal femoral physis is open and thins with
    age and skeletal maturity
  grade: A
  basis: Directly measured in 240 knee MRIs with physeal status scored on the same images, significant
    at three femoral sites (p<0.001) and on linear regression against age.
- claim: Articular cartilage thickness and growth plate output are separately controlled
  grade: C
  basis: Supported by the opposite-direction response of the two cartilages to Ift80 deletion in mouse
    (yuan2015) and by the site-specific human pattern (patella invariant, femur age-dependent); no human
    within-joint longitudinal test exists.
