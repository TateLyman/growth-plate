id: articular_cartilage
name: Articular cartilage
type: tissue_structure
layer: L9
stub: false
summary: 'Articular cartilage is the permanent cartilage at the epiphyseal surface, and during growth
  it behaves as the growth plate''s opposite number: it thins while the plate is running and stabilises
  once the plate closes. In 240 knee MRI scans of children aged 7-18 without chondral pathology, femoral
  articular cartilage was significantly thicker in patients with open distal femoral physes than in those
  with closing or closed physes at the medial condyle, lateral condyle and lateral trochlea (all p<0.001),
  and linear regression showed an inverse association between femoral cartilage thickness and age. Patellar
  cartilage, by contrast, was the thickest of all sites and did not vary with age or skeletal maturity,
  so the thinning is site-specific rather than a whole-joint phenomenon. This node is retained in L9
  because it supplies a quantitative organism-level dissociation the mechanistic layers must reproduce:
  the same ciliary perturbation that shortens the mouse growth plate thickens articular cartilage (yuan2015,
  the target of an existing L3 edge from ift80_protein), so plate output and articular thickness are not
  two readouts of one chondrocyte programme. The human numbers are cross-sectional MRI, not histology,
  and no human study has measured plate output and articular thickness in the same joint over time.'
