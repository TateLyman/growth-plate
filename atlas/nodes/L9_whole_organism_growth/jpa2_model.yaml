summary: 'JPA-2 is an asymptotic parametric model of human stature defined from birth rather than from
  age 2, so it spans infancy and puberty in a single function (jolicoeur1992). It descends from JPA-1,
  a lifetime asymptotic curve fitted to French longitudinal data (jolicoeur1988). Its value to this atlas
  is coverage rather than accuracy: because it reaches back to birth it supplies one continuous velocity
  function across the infancy-childhood transition, which Preece-Baines cannot reach at all and which
  the ICP model reaches only by summing components across a switch-on discontinuity. No head-to-head residual
  comparison of JPA-2 against Preece-Baines or against a nonparametric fit on the same individuals was
  located in this sweep, so the frequently repeated claim that JPA-2 fits better over the overlapping
  age range is at present untraceable to a primary and is graded X.'
