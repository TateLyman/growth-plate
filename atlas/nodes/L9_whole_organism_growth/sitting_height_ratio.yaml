id: sitting_height_ratio
name: Sitting height ratio
aliases:
- SH/H ratio
- trunk-to-height ratio
- upper segment ratio
type: phenotype
layer: L9
stub: false
summary: 'Sitting height divided by standing height measures the trunk''s share of stature and therefore
  reports directly on the difference in output between vertebral and lower-limb growth plates in the same
  child. The ratio falls steeply through infancy and childhood as the legs outgrow the trunk, then rises
  again during and after the pubertal spurt as vertebral growth continues after the lower-limb plates
  have decelerated - which is why disproportion is detectable at some ages and not others. Dutch nationwide
  references from 14500 children aged 0-21 years give age- and sex-specific LMS-smoothed centiles (fredriks2005).
  The clinically decisive finding in that reference is that SH/H SDS is not independent of height SDS:
  they are negatively correlated, so in a child with height SDS below -2 the conventional +2 SD cut-off
  generates too many false positives and must be shifted to +2.5 SD, while in exceptionally tall children
  the lower cut-off must be shifted to -2.2 SDS. Sensitivity of the height-corrected cut-off is 80% for
  hypochondroplasia but only 30% for Marfan syndrome, so a normal ratio does not exclude disproportionate
  growth. The ICP decomposition attributes the childhood fall in the ratio to a greater influence of the
  childhood growth component on the legs than on the trunk (karlberg1989), which if correct predicts that
  the growth-hormone-dependent phase acts preferentially on the lower-limb physes - a site-specific prediction
  that has never been tested at the level of the plate.'
