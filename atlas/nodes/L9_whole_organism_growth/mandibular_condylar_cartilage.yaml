id: mandibular_condylar_cartilage
name: Mandibular condylar cartilage
type: tissue_structure
layer: L9
stub: false
summary: The mandibular condyle grows by a secondary cartilage that is structurally and lineally unlike
  a growth plate. It has no resting-proliferative-hypertrophic columnar organisation; instead a fibrous
  surface layer overlies a polymorphic progenitor layer whose cells express early osteoblast markers -
  alkaline phosphatase and Runx2 - and can be labelled by an osteoblast progenitor reporter (the 3.6 kb
  collagen type I fragment in rat), yet differentiate into chondrocytes when appropriately mechanically
  loaded (robinson2015). So the same progenitor can become bone or cartilage depending on load, whereas
  the growth plate's resting zone produces only chondrocytes. The consequence at the organism level is
  that mandibular length is load-responsive in a way that femoral length is not, which is the mechanistic
  basis for functional orthopaedic appliances and for the mandibular retrognathia seen in growth restriction
  (craniofacial_growth). All cellular evidence for the progenitor identity is rodent; no human condylar
  progenitor has been characterised, and the potency and regenerative capacity of these cells remain explicitly
  open even in rodent.
