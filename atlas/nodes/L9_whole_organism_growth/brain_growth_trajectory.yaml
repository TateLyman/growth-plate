id: brain_growth_trajectory
name: Brain growth trajectory
type: process
layer: L9
stub: false
summary: 'The brain and the skeleton run on different clocks, and the size of the mismatch is now measured
  precisely. In the largest normative MRI resource assembled - 123984 scans from 101457 people spanning
  115 days post-conception to 100 years - grey matter volume peaks at 5.9 years (95% CI 5.8-6.1), total
  cerebrum volume at 12.5 years (12.14-12.89), cortical surface area at 10.97 years, subcortical grey
  matter at 14.4 years and white matter volume at 28.7 years, while mean cortical thickness peaks at 1.7
  years and its velocity peaks prenatally at about -0.38 years relative to birth (bethlehem2022). The
  velocity peaks are earlier still: grey matter volume velocity peaks at 5.08 months and white matter
  volume velocity at 2.4 years. Critically, none of these trajectories shows an adolescent volume spurt
  corresponding to peak height velocity - only grey matter peaks before puberty at all, and the remaining
  tissue classes peak during or long after it. Autopsy weights give the same picture with a different
  method: brain weight quadruples over birth weight in the first 3 years and rises only marginally further
  over the next 15 years, reaching maximum near 19 years, with male brains 9.8% heavier than female across
  4736 pathology-free brains (dekaban1978). Any theory that a single systemic maturational signal drives
  organ growth must explain why the brain''s peak precedes the pubertal skeletal spurt by six years and
  the white matter''s by fifteen.'
