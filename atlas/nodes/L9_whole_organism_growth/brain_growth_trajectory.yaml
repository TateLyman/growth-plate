confidence: A
claim_grades:
- claim: Human brain tissue volumes peak at ages between 1.7 and 28.7 years depending on tissue class
  grade: A
  basis: Normative GAMLSS model on 123984 scans with bootstrap CIs on each milestone.
- claim: There is no adolescent brain volume spurt corresponding to the height spurt
  grade: B
  basis: No pubertal velocity peak appears in any charted tissue class (bethlehem2022); MRI cohorts are
    unevenly sampled in adolescence, which limits the strength of a negative result.
