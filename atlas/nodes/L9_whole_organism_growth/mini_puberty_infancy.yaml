id: mini_puberty_infancy
name: Mini-puberty of infancy
aliases:
- minipuberty
type: process
layer: L9
stub: false
summary: 'Mini-puberty is the transient postnatal activation of the hypothalamic-pituitary-gonadal axis
  that produces adult-range sex steroid concentrations in the first months of life. Its relevance to skeletal
  growth was until recently assumed rather than measured. In the Copenhagen Minipuberty Study, 189 healthy
  term appropriate-for-gestational-age infants (101 boys, 88 girls) were followed with repeated anthropometry
  and hormone measurement to 12 months: growth velocity declined in both sexes after birth but boys grew
  faster than girls for the first three months before the trajectories converged, and free testosterone
  was positively associated with growth velocity, most strongly in boys - shifting free testosterone from
  the 25th to the 75th percentile corresponded to a growth velocity 8.3 cm/yr higher (95% CI 3.5-15.3),
  of which 32.6% (95% CI 15.3-...) was mediated by IGF-I (pridik2026). This is an organism-level number
  with a direct mechanistic consequence: sex steroids act on the human growth plate to accelerate it months
  before any secondary sexual characteristic appears, and they do so partly through the somatotropic axis
  and partly not. It also establishes an initial condition, since the infant plate is exposed to androgen
  and estrogen concentrations it will not see again until puberty.'
