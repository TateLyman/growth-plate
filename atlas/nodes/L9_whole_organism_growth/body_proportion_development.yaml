confidence: B
claim_grades:
- claim: Body proportions change in opposite directions before and after the pubertal spurt
  grade: A
  basis: Directly measured in national reference cohorts of 14500 (Dutch) and 11059 (Japanese) children.
- claim: Growth restriction produces a site-selective, not uniform, pattern of skeletal shortfall
  grade: B
  basis: Directly measured cephalometric SDS pattern in 48 short SGA subjects (van1998); single centre,
    wide age range, no untreated control series.
- claim: The childhood growth phase acts preferentially on the legs
  grade: D
  basis: Model-derived from the ICP decomposition only (karlberg1989).
