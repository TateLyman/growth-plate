id: body_proportion_development
name: Body proportion development
aliases:
- developmental change in body proportions
type: phenotype
layer: L9
stub: false
summary: 'Body proportions are not fixed and rescaled during growth; they change systematically and in
  opposite directions at different ages, which is the organism-level signature of site-specific physeal
  velocity. The head is proportionally largest at birth and the legs proportionally shortest; through
  infancy and childhood leg length grows fastest so the sitting height ratio falls; during and after the
  pubertal spurt vertebral growth persists after the lower-limb plates decelerate, so the ratio rises
  again. The Dutch and Japanese national references quantify these trajectories in sitting height, leg
  length, arm span and their ratios (fredriks2005, hirano2025), and the ICP decomposition attributes the
  childhood limb-favouring phase to a stronger childhood growth component in the legs than in the trunk
  (karlberg1989). Two independent constraints on mechanism follow. First, disproportion in disease is
  site-selective rather than global: short children born small for gestational age show a short anterior
  cranial base (-1.8 SDS), a small retropositioned mandible (<= -1.7 SDS) and a small maxilla (-1.5 SDS)
  with an increased lower anterior face height (+1.7 SDS) - a specific pattern, not uniform miniaturisation
  (van1998). Second, the ratio a child ends with is population-specific at every age, so any single systemic
  growth signal must be read differently by different plates in a way that itself varies between populations.'
