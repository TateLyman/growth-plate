id: growth_velocity_curve
name: Human height velocity curve
aliases:
- height velocity
- growth velocity
- stature velocity curve
type: phenotype
layer: L9
stub: false
summary: 'The human height velocity curve is triphasic: a steep monotonic decline through infancy, a slowly
  decelerating childhood plateau interrupted in some children by a small mid-growth spurt at 6-8 years,
  and an adolescent spurt that reverses the deceleration for the only time postnatally before velocity
  falls to zero at fusion. The pubertal peak is reached about two years earlier in girls than boys and
  is smaller. Three independent longitudinal cohorts modelled with the same shape-invariant method give
  peak height velocity 9.5-9.6 cm/yr in boys and 8.3-8.4 cm/yr in girls (chun2024 Korea, galvo2025 Brazil).
  Between-individual variance is dominated by timing rather than amplitude: in ALSPAC the SD of age at
  peak height velocity is 0.8 years in females around a mean of 11.8 years, with a male mean of 13.5 years
  (elhakeem2024, n=8518). Timing and amplitude are not independent - earlier pubertal onset raises peak
  velocity by 1.82 cm/yr per year in boys and 1.39 cm/yr per year in girls (chun2024), and age at onset
  correlates -0.48 with peak velocity in a separate biannually sampled male cohort (srensen2026). Mechanistically
  the constraint is severe: one physis must change its output roughly two-fold between the childhood trough
  and the pubertal peak and then to zero, with no change in the cell types present. Standing height is
  also a serial sum over the two lower-limb plates, the vertebral plates and the skull base, each running
  at its own velocity (site_specific_growth_rate, L1), so no plate-level model reaches cm/yr without an
  explicit summation step.'
