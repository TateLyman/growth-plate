localization:
- 'human whole organism: standing height by stadiometer; velocity derived from serial measurement'
human_evidence: direct
human_evidence_note: Every number is measured in humans by serial stadiometry in longitudinal cohorts;
  there is no animal component.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: The phenotype is defined only in humans and all data are human.
confidence: A
claim_grades:
- claim: Peak height velocity is 9.5-9.6 cm/yr in boys and 8.3-8.4 cm/yr in girls
  grade: A
  basis: Three independent longitudinal cohorts on two continents fitted with the same shape-invariant
    model agree to within 0.1 cm/yr.
- claim: Between-individual variance in the pubertal curve is dominated by timing rather than amplitude
  grade: B
  basis: ALSPAC SD of age at PHV 0.8 y in females plus the SITAR variance decomposition in Christ's Hospital
    (tempo SD 0.97 y, velocity SD 15%); never tested as a formal variance partition within one cohort.
- claim: Earlier pubertal onset produces a higher and shorter spurt
  grade: A
  basis: Consistent in sign and magnitude across a Korean SITAR cohort, a Brazilian SITAR cohort and a
    Danish biannually sampled male cohort.
- claim: A mid-growth spurt occurs at 6-8 years in a substantial minority of children
  grade: D
  basis: Detected by kernel regression and shape-invariant modelling of Fels and Zurich serial data (guo1992,
    sttzle1980) but invisible to Preece-Baines; prevalence is model-dependent.
