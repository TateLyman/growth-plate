id: satellite_cell
name: Muscle satellite cell
type: cell_type
layer: L9
stub: false
summary: 'Satellite cells are the Pax7-positive resident stem cells of skeletal muscle, lying between
  the myofibre plasma membrane and the basal lamina, and they are the only source of new myonuclei during
  postnatal muscle growth. Their behaviour during growth is phasic and, in mouse, well quantified: satellite
  cell number per EDL myofibre is about 14 at postnatal day 7 and falls to the adult level of about 5
  by P21, exactly the point at which myonuclear addition to the growing fibre stops (white2010). Muscle
  continues to enlarge after P21 without further nuclear accretion, so the satellite cell pool is not
  rate-limiting for late hypertrophy in normal growth. The parallel with the growth plate resting zone
  is structural rather than demonstrated: both are quiescent stem pools that contract as growth proceeds,
  but no experiment has tested whether the two pools deplete on a shared schedule or respond to a shared
  signal. In humans, satellite cell density has been counted mainly in pathology - contractured muscle
  in cerebral palsy has reduced satellite cell number in situ (dayanidhi2015) - and no normal human developmental
  series exists.'
