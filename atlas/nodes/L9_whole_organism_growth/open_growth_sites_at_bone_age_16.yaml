contradicts:
- 'CORRECTS THIS ATLAS''S OWN RECENT FRAMING, NOT AN EXTERNAL SOURCE. Rounds 199 to 202 progressively
  narrowed "spine and knee reserve" to "spine reserve", and round 202 scored the CNP axis against the
  spine alone. The knee is still the largest single contributor at this point and kvist2021 shows it is
  not closed. Logged as CORR-195.'
- 'CORRECTS ROUND 202 ON A MATTER OF FACT. That node stated that no segment-resolved human growth
  measurement exists under any CNP-axis agent. cnpmeta2026 pools four randomised trials with an explicit
  upper-to-lower segment ratio, and rua2025 reports sitting height against arm span. Logged as CORR-196.'
