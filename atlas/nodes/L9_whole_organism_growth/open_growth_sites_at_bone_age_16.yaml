confidence: B
claim_grades:
- claim: a hand-wrist bone age of 16 does not mean the skeleton has stopped growing
  grade: A
  basis: kvist2021 by MRI in 958 subjects plus schaefer2007 across 21 epiphyses; the hand-wrist is among
    the last regions to close and the spine and sacrum run later still
- claim: fusion proceeds foot to wrist, with the radius last
  grade: A
  basis: prospective MRI series of 958 subjects, corroborated across 21 epiphyses in an independent
    skeletal collection
- claim: the knee is still contributing at bone age 16
  grade: B
  basis: complete femoral fusion is only 85 per cent in 17-year-old females and 97 per cent in
    19-year-old males, both at or past the equivalent point; inferred across the loose chronological-age
    to bone-age mapping rather than measured at BA 16 directly
- claim: the spine and cranial base are the latest-running contributors to stature
  grade: B
  basis: sacral partial union to 21 years, vertebral growth quantified to maturity by Sanders stage, and
    a cranial base synchondrosis correlating 0.95-plus with cervical vertebral maturation
- claim: a CNP-axis agent grows the segments proportionately in humans
  grade: B
  basis: 4 randomised trials, n = 326, I-squared 0 on the segment ratio; achondroplasia only, short-term,
    and one observational cohort disagrees on one of two proportion measures
- claim: per-site remaining growth in centimetres at bone age 16 is known
  grade: X
  basis: FALSE. Only the spine has a followed-to-maturity figure and it comes from a scoliosis cohort
    indexed to Sanders rather than bone age. This is the register's main gap
key_refs:
- ref_id: kvist2021
  year: 2021
  type: primary
  role: THE SEQUENCE AND THE SITE-SPECIFIC PERCENTAGES - 958 subjects by MRI, foot to wrist, radius last,
    femur only 85 per cent complete in 17-year-old females
- ref_id: hori2025
  year: 2025
  type: primary
  role: the only followed-to-maturity per-site remaining-growth figure in the atlas, for the spine, and
    the limb-before-trunk timing offset
- ref_id: schaefer2007
  year: 2007
  type: primary
  role: extends the sequence across 21 epiphyses in an independent skeletal series and bounds the
    between-individual variation in ordering
- ref_id: cardoso2014
  year: 2014
  type: primary
  role: the sacrum, partial union 15 to 21 years, placing it among the latest contributors
- ref_id: kim2024
  year: 2024
  type: primary
  role: the spheno-occipital synchondrosis, and the finding that the cranial base matures with the
    cervical spine rather than with the hand
- ref_id: cnpmeta2026
  year: 2026
  type: meta_analysis
  role: the pooled randomised segment-ratio result - a CNP-axis agent grows the segments proportionately,
    which is the favourable answer when several sites are open
- ref_id: rua2025
  year: 2025
  type: primary
  role: the observational counterpoint - sitting height gaining more than arm span while the ULS ratio
    moves leg-favouring, two proportion measures disagreeing inside one cohort
