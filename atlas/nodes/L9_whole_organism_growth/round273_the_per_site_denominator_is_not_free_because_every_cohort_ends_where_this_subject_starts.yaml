contradicts: >-
  REFUTES THE SECOND LINE OF round264_where_to_attack_computed_not_recalled's attack ranking. Round 264
  placed the per-site denominator second and called it "RETROSPECTIVE and essentially free - the images
  exist in paediatric orthopaedic cohorts and the studies reported the spine only". The images do not
  simply exist: the literature that measures spine and total body growth longitudinally by maturation stage
  is built to time anterior vertebral body tethering, is offered only to patients with substantial growth
  remaining, and therefore terminates at the maturity this subject has already reached - hori2025 defines
  skeletal maturity at 16.6 years in boys. What the round does establish is the SHAPE, which favours the
  trunk at late maturity, and a T1-S1-to-standing-height conversion of about 25 per cent.
