id: round273_the_per_site_denominator_is_not_free_because_every_cohort_ends_where_this_subject_starts
name: >-
  ROUND 273 - round 264 ranked the per-site remaining-growth denominator SECOND and called it retrospective
  and essentially free. It is not free. The best dataset in the field defines SKELETAL MATURITY at 16.6
  years in boys, which is where this subject already is - so the cohorts END where the question STARTS.
  What is establishable is the SHAPE, and the shape favours the trunk
type: dataset
layer: L9
stub: false
summary: >-
  ROUND 264 PUT THE PER-SITE DENOMINATOR SECOND ON ITS ATTACK RANKING, DESCRIBING IT AS RETROSPECTIVE AND
  ESSENTIALLY FREE - the images exist in paediatric orthopaedic cohorts. This round went to get it. The
  finding is that the question is answerable in SHAPE and not in MAGNITUDE, and the reason is structural
  rather than a gap anyone chose.

  ONE - THE SHAPE, AND IT IS THE ONE THIS PROGRAMME WOULD HOPE FOR. hori2025 followed 517 patients with
  idiopathic scoliosis through Sanders maturation stages 2, 3A, 3B and 4, measuring T1-S1 SPINE HEIGHT and
  TOTAL BODY HEIGHT at every visit with curve-magnitude correction by validated formulae. SPINE HEIGHT
  GROWTH WAS HIGHEST AT SMS 3A - approximately 1.4 times SMS 2, 1.5 times 3B and 1.8 times 4. TOTAL BODY
  HEIGHT GROWTH WAS COMPARABLE AT SMS 2 AND 3A, both significantly exceeding 3B and 4.
  THOSE TWO PEAKS ARE NOT IN THE SAME PLACE. Total body growth is already at its maximum at SMS 2 and
  holds through 3A; spine growth does not peak until 3A. SO THE SPINE'S SHARE OF WHATEVER REMAINS RISES AS
  MATURITY ADVANCES. For a subject at bone age 16 the corollary is that the trunk, not the limbs, is where
  a larger fraction of the residual sits - which is the opposite of where the best-characterised
  intervention in this atlas points, since CORR-279 established borjesson2010's cartilage-ERalpha lever as
  APPENDICULAR ONLY with crown-rump non-significant.

  TWO - A CALIBRATION THIS ATLAS DID NOT HAVE. At SMS 4, T1-S1 spine height is 40.3 plus or minus 2.6 cm
  against a total body height of 162.3 plus or minus 9.2 cm. THE T1-S1 SEGMENT IS ABOUT A QUARTER OF
  STANDING HEIGHT. That is the conversion factor that has been missing every time this file has moved
  between a spine result and a height result, and it bounds how much any purely axial agent can be worth.
  Note what T1-S1 excludes: the cervical spine, the skull, and everything below S1. It is not "the trunk".

  THREE - AND THE REASON THE DENOMINATOR IS NOT FREE. hori2025 DEFINES SKELETAL MATURITY AT 15.4 PLUS OR
  MINUS 1.6 YEARS FOR GIRLS AND 16.6 PLUS OR MINUS 1.5 YEARS FOR BOYS. That is the study's ENDPOINT. Its
  cohort spans SMS 2 to 4 at chronological ages 11.3 to 12.9 years, with Risser 0 in 100 per cent at SMS 2
  and still 40 per cent at SMS 4, and only 5 per cent reaching Risser 4 at all. THE SUBJECT OF THIS
  PROGRAMME, AT BONE AGE 16, IS PAST THE LAST OBSERVATION OF THE BEST DATASET IN THE FIELD.
  THIS IS NOT AN ACCIDENT OF ONE PAPER. The entire literature that measures spine and total body growth
  longitudinally by maturation stage exists to time GROWTH MODULATION SURGERY - anterior vertebral body
  tethering - which is only offered to patients with substantial growth remaining. The cohorts are
  selected to stop where the growth stops being surgically interesting, which is exactly the regime this
  case occupies. SO THE IMAGES DO NOT SIMPLY EXIST WAITING TO BE RE-READ, AND ROUND 264's "ESSENTIALLY
  FREE" IS WRONG.

  FOUR - WHAT IS RECOVERABLE, AND WHAT WOULD ACTUALLY CLOSE IT. Recoverable from hori2025: each step of
  maturation costs a defined amount of remaining spine growth, with SMS 3A carrying 14.16 mm less
  cumulative T1-S1 gain to maturity than SMS 2 (95 per cent CI -18.32 to -10.00, adjusted for age, sex,
  race and baseline spine height); boys gain 11.19 mm more than girls; and baseline spine height itself
  carries -0.11 mm per mm, so taller spines have less left. Extrapolating that slope past SMS 4 is
  arithmetic on a model fitted inside a range that stops before the subject, and this node does not do it.
  WHAT WOULD CLOSE IT is a cohort with sitting height and standing height measured to final height in
  subjects first assessed at bone age 15 to 17 - which is a tall-stature or epiphysiodesis cohort, not a
  scoliosis one. aeppli2025 studied exactly that population for bilateral epiphysiodesis in extremely tall
  adolescents, and chagin2007a took growth plate biopsies from that same operation. THOSE ARE THE COHORTS
  THAT HOLD THE ANSWER, and neither has been mined for a per-site residual.

  FIVE - AND THE HONEST STATUS OF THE SCOLIOSIS SOURCE. Every number above comes from patients with
  idiopathic scoliosis. The atlas's own gap entry already flags that the spine figure comes from a
  scoliosis cohort, and it should stay flagged: AIS patients are systematically taller and leaner than
  controls, their spinal growth is the thing that is pathological, and T1-S1 measured radiographically in
  a curved spine requires a correction formula whose residual error is unstated here. The SHAPE - spine
  peaking later than total body - is unlikely to be an artefact of curvature. THE MAGNITUDES SHOULD NOT BE
  CARRIED INTO A NON-SCOLIOTIC SUBJECT WITHOUT THAT CAVEAT ATTACHED.
quantitative:
- parameter: >-
    SPINE GROWTH PEAKS LATER THAN TOTAL BODY GROWTH - SO THE TRUNK'S SHARE OF THE RESIDUAL RISES WITH
    MATURITY
  value: >-
    spine height growth highest at Sanders stage 3A - about 1.4 times stage 2, 1.5 times stage 3B and 1.8
    times stage 4; total body height growth comparable at stages 2 and 3A, both significantly exceeding 3B
    and 4
  unit: ratio of monthly growth rates between maturation stages
  conditions: >-
    hori2025, 517 patients with idiopathic scoliosis (68 per cent female), single-centre retrospective
    longitudinal. T1-S1 spine height and total body height measured at each visit; monthly growth rates
    computed between baseline and first follow-up at 6 to 12 months; both heights adjusted for curve
    magnitude by validated formulae; multivariate linear regression adjusting for age, sex, race and
    baseline height. Intrarater weighted kappa 0.85, interrater 0.79.
  species: human
  source_ref: hori2025
  uncertainty: >-
    IDIOPATHIC SCOLIOSIS COHORT - the atlas's own gap entry already flags this and it stays flagged. AIS
    patients are systematically taller and leaner than controls and their spinal growth is the pathological
    variable; radiographic T1-S1 in a curved spine needs a correction formula whose residual error is not
    stated. The SHAPE is unlikely to be a curvature artefact; the MAGNITUDES should not be carried into a
    non-scoliotic subject. Rates come from a single 6-to-12-month interval per patient, not continuous
    measurement.
- parameter: >-
    THE T1-S1 SEGMENT IS ABOUT A QUARTER OF STANDING HEIGHT - THE CONVERSION FACTOR THIS FILE HAS BEEN
    MISSING
  value: >-
    T1-S1 spine height 40.3 plus or minus 2.6 cm against total body height 162.3 plus or minus 9.2 cm at
    Sanders stage 4, i.e. about 25 per cent
  unit: cm and per cent of standing height
  conditions: hori2025 Table I, SMS 4 group, n = 212 observations, mean age 12.9 plus or minus 1.3 years.
  species: human
  source_ref: hori2025
  uncertainty: >-
    T1-S1 IS NOT THE TRUNK. It excludes the cervical spine, the skull and everything below S1, so it
    understates the axial contribution to standing height and cannot be used as a sitting-height
    equivalent. The ratio is also taken at SMS 4 in a scoliosis cohort of mean age 12.9 and will differ at
    other stages and in a non-scoliotic adult male.
- parameter: >-
    THE COHORT ENDS WHERE THIS SUBJECT BEGINS - WHY THE DENOMINATOR IS NOT "ESSENTIALLY FREE"
  value: >-
    skeletal maturity was reached at 15.4 plus or minus 1.6 years in girls and 16.6 plus or minus 1.5 years
    in boys; the cohort spans Sanders stages 2 to 4 at mean ages 11.3 to 12.9 years, with Risser 0 in 100
    per cent at SMS 2 and 40 per cent still Risser 0 at SMS 4, and only 5 per cent reaching Risser 4
  unit: years and per cent of cohort by Risser stage
  conditions: hori2025, 517 patients, 314 of them followed to skeletal maturity.
  species: human
  source_ref: hori2025
  uncertainty: >-
    THIS IS A STATEMENT ABOUT ONE COHORT BEING GENERALISED TO A LITERATURE, AND THAT GENERALISATION IS
    REASONING RATHER THAN A SEARCH RESULT - CORR-267 applies. The argument is that this literature exists
    to time anterior vertebral body tethering, which is offered only to patients with substantial growth
    remaining, so the selection stops where the growth stops being surgically interesting. Targeted
    searches for residual growth at Risser 4-5 or Sanders 6-8 returned deformity-progression studies rather
    than per-site growth measurements, which is consistent with that reading but does not prove no such
    cohort exists.
localization:
- 'T1-S1 vertebral column: about 25 per cent of standing height, and the compartment whose growth peaks
  latest'
- 'total body height: peaks earlier than the spine, at Sanders stage 2 to 3A'
human_evidence: direct
human_evidence_note: >-
  517 human patients with longitudinal radiographic spine and total body height, 314 followed to skeletal
  maturity. The limitation is the population (idiopathic scoliosis) and the age range, not the species.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: Human data throughout; the transfer problem is population and stage, not species.
confidence: B
confidence_reason: >-
  Large longitudinal human cohort with good rater reliability and multivariate adjustment, read in full.
  Graded B rather than A because it is a scoliosis population, the rates derive from a single interval per
  patient, and the central conclusion of this node concerns what the literature does NOT contain, which is
  an argument rather than a measurement.
claim_grades:
- claim: >-
    The per-site remaining-growth denominator at bone age 16 is retrospective and essentially free.
  grade: X
  basis: >-
    ROUND 264 WROTE THIS AS ITS SECOND-RANKED ATTACK AND IT IS WRONG. The best dataset in the field defines
    SKELETAL MATURITY at 16.6 plus or minus 1.5 years in boys and spans Sanders stages 2 to 4 at mean ages
    11.3 to 12.9 - the subject is past its last observation. The literature that measures spine and total
    body growth by maturation stage exists to time growth-modulation surgery and is therefore selected to
    stop where growth stops being surgically interesting.
- claim: >-
    Spine growth peaks later than total body growth, so the trunk's share of the residual rises with
    maturity.
  grade: B
  basis: >-
    hori2025 - spine height growth highest at SMS 3A (1.4 times SMS 2, 1.5 times 3B, 1.8 times 4) while
    total body growth is already maximal at SMS 2 and comparable at 3A. 517 patients, multivariate
    adjustment, good rater reliability. B and not A because it is a scoliosis cohort and the stages
    measured stop at SMS 4.
- claim: >-
    The T1-S1 segment is about a quarter of standing height.
  grade: B
  basis: >-
    40.3 plus or minus 2.6 cm against 162.3 plus or minus 9.2 cm at SMS 4, n = 212. Direct measurement.
    Held at B because T1-S1 excludes the cervical spine, skull and everything below S1, so it is a segment
    and not the trunk, and the ratio is taken at one stage in one population.
- claim: >-
    This atlas can convert an agent's effect into predicted centimetres for this subject.
  grade: X
  basis: >-
    STILL NO. That was the point of seeking the denominator and it is not obtainable from the existing
    literature. What this round establishes is the SHAPE of the site split and a conversion factor for
    T1-S1, not the residual at bone age 16 - which remains the open question it was, now with a reason
    attached rather than an assumption that somebody had already measured it.
