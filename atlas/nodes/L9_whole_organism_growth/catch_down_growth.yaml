id: catch_down_growth
name: Catch-down growth
aliases:
- downward centile crossing
- infant channel shift
type: process
layer: L9
stub: false
summary: 'Catch-down is the mirror image of catch-up: an infant born larger than its genetic channel decelerates
  and crosses height centiles downward until it reaches that channel. Smith and colleagues documented
  both directions in the same series and drew the mechanistic conclusion that birth length reflects the
  intrauterine environment while the postnatal trajectory reflects the child''s own genotype, so the first
  two postnatal years are a period of realignment onto the genetic channel rather than of continuous growth
  along it (smith1976). The realignment is essentially complete by about 2 years, which is why the correlation
  between length and adult height rises steeply over that interval and why height-for-age becomes a stable
  trait thereafter. This matters to a mechanistic atlas for a specific reason: it means the postnatal
  growth plate does not simply inherit the size it was born with and scale it, and any model that treats
  birth length as the initial condition of a monotone growth process will mispredict roughly the same
  fraction of infants in each direction. Quantitative centile-crossing rates with modern denominators
  were not extracted in this sweep and are logged as a gap.'
quantitative:
- parameter: age by which the shift onto the genetic growth channel is largely complete
  value: '2'
  unit: years
  conditions: healthy term infants followed from birth
  species: human
  source_ref: smith1976
  uncertainty: stated; per-infant completion ages not tabulated in the abstract
- parameter: direction of shift
  value: bidirectional
  unit: not_applicable
  conditions: infants born long relative to parental height shift down; infants born short shift up
  species: human
  source_ref: smith1976
  uncertainty: qualitative in the abstract; case series
localization:
