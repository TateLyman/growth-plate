confidence: C
claim_grades:
- claim: Infants shift height centiles in both directions during the first two years to reach a parentally
    determined channel
  grade: B
  basis: Directly observed in serial human data with parental heights (smith1976) and consistent with
    the 0.75-0.78 parent-offspring regression slope; the original series is small and pre-dates modern
    references.
- claim: Birth length reflects the intrauterine environment rather than the child's genotype
  grade: C
  basis: Inference from the direction and completeness of the shift; not tested against measured genotype
    or a polygenic score in the primary.
