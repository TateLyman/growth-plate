claim_grades:
- claim: Growth hormone becomes a significant regulator of linear growth only from 6-12 months
  grade: C
  basis: Inferred from the absence of the infancy-childhood spurt in untreated GH deficiency and its delay
    in deprived infants (karlberg1990); no direct measurement of GH action on the infant growth plate
    exists in any species.
- claim: Under growth-permitting conditions, population of origin explains almost none of the variance
    in infant length
  grade: A
  basis: Formal variance decomposition in a six-country prospective study (who2006).
