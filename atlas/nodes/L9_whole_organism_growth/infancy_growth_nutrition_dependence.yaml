id: infancy_growth_nutrition_dependence
name: Nutrition dependence of infant growth
type: process
layer: L9
stub: false
summary: 'Infant linear growth is the fastest and the least hormonally buffered phase of postnatal life.
  In the ICP framework the infancy component is driven by nutrition and insulin rather than by growth
  hormone, and growth hormone only becomes a significant regulator when the childhood component switches
  on between 6 and 12 months (karlberg1987, karlberg1990). The strongest evidence for that boundary is
  negative and human: untreated GH-deficient infants show no infancy-childhood spurt at all, whereas their
  infancy-component growth is intact, and a delayed spurt occurs in 30-50% of infants in a deprived environment
  as well as in 30-50% of children with growth disorders (karlberg1990). The corollary for a mechanistic
  atlas is that the postnatal growth plate operates under two different control regimes within its first
  three years, and a model calibrated on the childhood or pubertal plate cannot be assumed to apply to
  the infant plate. The WHO multicentre data set the ceiling on how much of infant growth variation is
  environmental at the population level: under growth-permitting conditions, site explains only about
  3% of variance in length while individuals within sites explain about 70% (who2006), so nutrition dominates
  the difference between deprived and non-deprived populations but not the difference between healthy
  individuals.'
