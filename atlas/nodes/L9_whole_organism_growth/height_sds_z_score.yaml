id: height_sds_z_score
name: Height standard deviation score
aliases:
- height SDS
- height z-score
- LMS method
type: method
layer: L9
stub: false
summary: 'Height SDS expresses a measurement as the number of reference SDs from the age- and sex-specific
  median, and it is the currency in which every organism-level growth claim in this atlas is denominated.
  Because childhood height is not normally distributed at every age, SDS is computed by the LMS method,
  which fits three smooth age-varying curves - the Box-Cox power L, the median M and the coefficient of
  variation S - and normalises through a Box-Cox transform (cole1992). Two properties matter mechanistically.
  First, an SDS is a rank statement about a reference population, not a physical quantity: the same SDS
  corresponds to a different number of centimetres at each age because S varies with age, so an unchanged
  SDS during treatment does not mean an unchanged centimetre deficit. Second, SDS is reference-dependent:
  a child scored against the WHO prescriptive standard and against the CDC descriptive reference receives
  different values, and the two disagree most at the tails and in infancy (de2011). Any conversion of
  a plate-level model output into SDS therefore requires the reference to be named, and any target number
  recorded in SDS in this atlas carries the reference with it.'
