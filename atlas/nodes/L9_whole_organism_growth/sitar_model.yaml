claim_grades:
- claim: Three random effects explain 98.9% of the between-child variance in pubertal height
  grade: A
  basis: Direct fit to 129508 heights in 3245 boys with the stepwise residual reduction reported.
- claim: Size, tempo and velocity are largely independent axes of variation
  grade: B
  basis: Pairwise correlations near +0.3 in one large male cohort; the tempo-velocity correlation reverses
    sign in Turner syndrome, so independence is cohort-specific.
