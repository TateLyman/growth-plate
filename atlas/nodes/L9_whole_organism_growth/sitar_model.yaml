id: sitar_model
name: SITAR shape-invariant growth model
aliases:
- SuperImposition by Translation And Rotation
type: method
layer: L9
stub: false
summary: 'SITAR fits one mean spline curve to all subjects and gives each individual three random effects:
  size (vertical shift, cm), tempo (horizontal shift, years) and velocity (age-scale stretch, fractional)
  (cole2010). Its importance here is that it partitions between-individual variance into interpretable
  pieces, and the partition is lopsided. In 3245 Christ''s Hospital boys with 129508 heights, adjusting
  for size alone cut the residual SD from 6.6 cm to 2.3 cm, adding tempo cut it to 1.2 cm, and adding
  velocity cut it to 0.8 cm - a 98.9% variance reduction from three numbers per child. The final residual
  SD of 0.79 cm matches the median residual of individually fitted five-parameter Preece-Baines curves,
  so three population-level parameters buy the same fit as five individual ones. The random-effect SDs
  are the organism-level dispersion numbers a mechanistic model must reproduce: size SD 6.1 cm, tempo
  SD 0.97 years, velocity SD 0.15, that is a 15% between-child spread in how fast the pubertal clock runs.
  The three axes correlate with each other only at about +0.3 in healthy boys, so growing tall, growing
  late and growing fast are largely separable; in Turner syndrome the tempo-velocity correlation reverses
  to -0.46, showing the correlation structure is not a property of the method.'
