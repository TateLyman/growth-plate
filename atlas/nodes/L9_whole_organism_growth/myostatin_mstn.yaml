type: protein
layer: L9
stub: false
summary: 'Myostatin is a TGF-beta superfamily ligand secreted by skeletal muscle that signals through
  ActRIIB and restrains muscle mass. The human evidence is a single reported case: a child with a loss-of-function
  MSTN mutation and gross muscle hypertrophy (schuelke2004). The organism-level significance for this
  atlas is what did not happen in that child - the phenotype reported is muscular, not skeletal, so a
  pathway that doubles muscle mass does not correspondingly change stature. That dissociates the myostatin
  axis from the growth plate and constrains the mechanostat account of longitudinal growth: if increased
  muscle force drove bone elongation, myostatin loss should lengthen bones, and no such report exists.
  Pharmacological confirmation runs the same way in adults: blocking the receptor with bimagrumab increases
  thigh muscle volume in men recovering from casting-induced atrophy (rooks2017) without any claim on
  bone length. The full text of the index human case was not retrieved in this sweep, so no genotype detail
  or muscle-mass quantity is asserted here.'
