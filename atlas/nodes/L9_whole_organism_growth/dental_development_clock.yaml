localization:
- 'human whole organism: panoramic radiography or clinical dental examination compared with hand-wrist
  or cervical-vertebral skeletal staging'
human_evidence: direct
human_evidence_note: All comparisons are direct within-individual measurements of dental and skeletal
  maturity in human children.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: Human maturity indicators; rodent molars erupt on a fixed schedule not comparable
  to the human dentition.
confidence: A
claim_grades:
- claim: Dental maturation dissociates from skeletal maturation under endocrine perturbation, by about
    1.7 years in untreated GH deficiency
  grade: A
  basis: Direct within-individual measurement of both clocks in 48 GHD children against 48 controls, with
    the delays explicitly uncorrelated (torliskawalkow2026); corroborated in an independent SGA cohort
    (van1998).
- claim: Dental maturity is uncorrelated with somatic and sexual maturity indicators in healthy girls
  grade: B
  basis: A single longitudinal cohort of 50 girls with five indicators measured in the same individuals
    (demirjian1985); not replicated in a comparable design, and unselected cross-sectional samples show
    moderate-to-high dental-skeletal correlation driven by shared chronological age.
- claim: Neither dental nor skeletal maturation is shifted by chronic undernutrition sufficient to cause
    stunting
  grade: D
  basis: One cross-sectional Peruvian school study with 140 stunted children; null results, no power calculation
    reported.
