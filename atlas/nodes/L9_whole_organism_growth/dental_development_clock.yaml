id: dental_development_clock
name: Dental development as an independent maturity clock
aliases:
- dental age
- dental maturity
type: method
layer: L9
stub: false
summary: Dental development is the only widely used maturity indicator that runs independently of skeletal
  maturation, and that independence is a hard constraint on any theory that a single systemic signal drives
  maturation. Demirjian and colleagues measured five maturity indicators in 50 French-Canadian girls -
  menarche, peak height velocity, 75% skeletal maturity, appearance of the ulnar sesamoid and 90% dental
  maturity - and found that ages at peak height velocity, menarche and 75% skeletal maturity were significantly
  intercorrelated, while age at 90% dental maturity showed no significant relationship with any of them;
  they concluded that the mechanisms controlling dental development are independent of somatic and sexual
  maturation (demirjian1985). The dissociation is largest exactly where a single systemic signal would
  predict coupling. In isolated GH deficiency, bone age is delayed by 1.99 years before treatment while
  dental age is delayed by only 0.31 years, and critically the two delays are uncorrelated within individuals
  (torliskawalkow2026, 48 GHD children versus 48 controls). Children born small for gestational age with
  persistent short stature show delayed skeletal maturation and specific craniofacial hypoplasia but no
  dental delay (van1998). Stunting in a Peruvian school population shifted neither dental nor skeletal
  maturity stage (floresmir2005). Correlations between dental and skeletal stage in unselected populations
  are nonetheless moderate to high (r = 0.85 in Peruvian schoolchildren; Spearman 0.78-0.79 against cervical
  vertebral maturation in Iranian orthodontic patients), so dental and skeletal clocks share chronological
  age as a common driver but not the endocrine perturbations that move one of them.
