id: preece_baines_model
name: Preece-Baines growth model
aliases:
- PB1
- Preece-Baines model 1
type: method
layer: L9
stub: false
summary: 'Preece and Baines derived a family of growth functions from the differential equation dh/dt
  = s(t)(h1 - h), where h1 is adult size and s(t) a time-varying rate function; different choices of s(t)
  generate different family members (preece1978). Model 1, with five parameters, is the version in universal
  use for pubertal height; it fits an individual curve from age 2 to maturity with a residual SD of 6-7
  mm, the benchmark against which later models are judged (cole2010, which independently reproduces 0.79
  cm in 3245 boys). Derived quantities - peak height velocity, age at peak height velocity, age at take-off
  - are read off the fitted curve rather than from raw increments, which makes them far more stable than
  difference-based estimates, and a published erratum supplies the direct algebraic expressions for them
  (sayers2013). Two documented failures constrain use: the function contains no term capable of representing
  the mid-growth spurt, and fitted to Fels serial data it places pubertal-spurt onset earlier, the spurt
  longer and the velocity rise slower than kernel regression or a triple-logistic model on the same children
  (guo1992). The residual SD of 6-7 mm is the operative number for this atlas: it is comparable to diurnal
  stature variation, so a plate-level model that claims to reproduce individual height to better than
  about 7 mm is fitting measurement structure rather than biology.'
