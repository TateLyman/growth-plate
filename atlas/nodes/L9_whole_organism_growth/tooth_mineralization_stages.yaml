id: tooth_mineralization_stages
name: Tooth mineralization staging
aliases:
- Demirjian
type: method
layer: L9
stub: false
summary: 'Demirjian, Goldstein and Tanner defined dental maturity as an eight-stage ordinal score of crown
  and root mineralization applied to the seven left mandibular permanent teeth on a panoramic radiograph,
  converted to a 0-100 maturity score and then to a dental age (demirjian1973). The method''s design choices
  are what make it useful as an independent clock: stages are defined by shape changes rather than by
  absolute length, so they are invariant to radiographic magnification and to body size, and the scoring
  is confined to one side of one jaw, so it does not average across skeletal sites the way bone-age scoring
  does. Its known limitation is that the original standard is French-Canadian and systematically overestimates
  dental age in other populations; a recent Iranian orthodontic series found the Demirjian method overestimated
  dental age while still correlating with chronological age at r = 0.894 in males and 0.876 in females
  and with cervical-vertebral skeletal stage at Spearman 0.779 and 0.785 (mohammadianras2026). The mineralization
  sequence itself, unlike the growth plate, is not a rate process that can be transiently suppressed and
  resumed: each stage is a one-way morphological transition, which is the structural reason the dental
  clock is robust to systemic perturbation.'
