id: allometry_organ_scaling
name: Allometry and organ scaling
type: process
layer: L9
stub: false
summary: 'Allometry is the statement that organ size scales with body size as a power law rather than
  proportionally, and its relevance here is that different organs have different exponents, so shape necessarily
  changes as size changes. The oldest quantitative human dataset on this is the regression of brain weight
  on body height and on body weight across 23 age groups from birth to the ninth decade, which shows clearly
  differential rates of change: the brain-to-height and brain-to-weight ratios fall steeply through childhood
  because the body continues to grow long after the brain has stopped (dekaban1978). The MRI charts give
  the same relation with modern precision - grey matter volume peaks at 5.9 years while stature is still
  six years from its peak velocity (bethlehem2022). This atlas records allometry as a constraint rather
  than a mechanism: any model that reproduces cm/yr at the growth plate must not simultaneously predict
  isometric growth of the organism, because the human body demonstrably does not grow isometrically. No
  modern human dataset of organ-specific scaling exponents across postnatal development was located in
  this sweep and this is logged as a quantitative gap.'
