id: muscle_hypertrophy_vs_hyperplasia
name: Muscle hypertrophy versus hyperplasia
type: process
layer: L9
stub: false
summary: 'The question of whether postnatal muscle grows by adding fibres or by enlarging them is settled
  in mouse and unsettled in human. In mouse EDL there is no net gain in myofibre number between P7 and
  adulthood while fibre volume rises 14.1-fold, so growth is essentially pure hypertrophy (white2010).
  This is the exact opposite of the growth plate, where elongation is generated by producing new cells
  that then enlarge and are removed, so the tissue turns over its cell population continuously; muscle
  keeps the same fibres for life and only adds nuclei to them, and only until P21 in mouse. The distinction
  has a direct consequence for how the two tissues can be perturbed: a muscle can be enlarged in adulthood
  by hypertrophic signalling because the hypertrophic mechanism is still available - ActRIIB blockade
  increases thigh muscle volume in adult men after casting-induced atrophy (rooks2017) - whereas the growth
  plate cannot be restarted after fusion because the cell-producing mechanism has been destroyed. Human
  fibre-number data across development are absent, and the claim that human muscle also fixes fibre number
  early rests on extrapolation from rodent.'
