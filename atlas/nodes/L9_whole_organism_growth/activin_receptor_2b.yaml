type: protein
layer: L9
stub: false
summary: 'ActRIIB is the type II serine-threonine kinase receptor through which myostatin, activins and
  several GDFs signal in skeletal muscle. It is the druggable node of that axis: bimagrumab, a human monoclonal
  antibody that blocks ActRIIB, increased thigh muscle volume in adult men recovering from casting-induced
  atrophy in a randomised study (rooks2017). Its inclusion in an organism-growth layer is justified by
  a negative result rather than a positive one - receptor blockade produces a large, measurable change
  in one organ system''s mass in adults, at an age when no change in stature is possible, which makes
  the muscle and skeletal growth programmes separately addressable in the same individual. Whether ActRIIB
  signalling has any role in the growth plate itself is not addressed by these human data; ligand traps
  against the receptor alter bone geometry in a mouse model of osteogenesis imperfecta, but that is mouse
  and disease-specific and is not carried forward as a human claim here.'
