id: skeletal_muscle_growth
name: Skeletal muscle growth
type: process
layer: L9
stub: false
summary: 'Postnatal skeletal muscle grows almost entirely by enlarging existing fibres, not by making
  new ones, and this is the structural difference between muscle growth and bone elongation. In mouse
  extensor digitorum longus there is no net change in myofibre number between postnatal day 7 and adulthood,
  while myofibre cross-sectional area increases 7.6-fold and length 1.9-fold, giving a 14.1-fold increase
  in fibre volume (white2010). Because muscle is a syncytium, that hypertrophy requires nuclei: myonuclear
  number per fibre rises about 5-fold between P3 and P21 and then stops, so all subsequent volume growth
  expands the myonuclear domain, which doubles to 9.2 x 10^3 um3 by P21 and then triples again to 26.5
  x 10^3 um3 by P56 (white2010, mouse). Satellite cell number per fibre falls from about 14 at P7 to the
  adult level of about 5 by P21, i.e. the progenitor pool contracts as the nuclear-accretion phase ends.
  The organism-level coupling to the skeleton is temporal and measurable in humans: peak lean-mass accrual
  velocity precedes peak bone mineral content accrual by 0.36 years in boys and 0.51 years in girls (rauch2004).
  No equivalent human measurement of myofibre number, myonuclear accretion or satellite cell density across
  postnatal growth exists, so the phase structure above is mouse and must not be stated as human fact.'
