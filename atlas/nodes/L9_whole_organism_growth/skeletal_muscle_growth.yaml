localization:
- 'mouse EDL: myofibre and myonuclear counts (white2010)'
- 'human whole body: DXA lean mass and bone mineral content velocities (rauch2004)'
human_evidence: indirect
human_evidence_note: Human evidence is limited to DXA-derived whole-body lean mass velocity; the cellular
  growth mode is entirely murine.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: Every cellular parameter comes from one fast muscle of one mouse strain; human
  muscle grows over 18 years rather than 8 weeks and human myonuclear accretion has never been measured
  longitudinally.
confidence: C
claim_grades:
- claim: Postnatal muscle growth is hypertrophic with fibre number fixed early
  grade: C
  basis: Directly counted in mouse EDL across the full postnatal period (white2010); no human counterpart.
- claim: Peak lean mass velocity precedes peak bone mineral accrual in humans
  grade: A
  basis: Longitudinal DXA in 138 children with the interval measured at three anatomical levels (rauch2004).
