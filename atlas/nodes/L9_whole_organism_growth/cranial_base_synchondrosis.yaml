type: tissue_structure
layer: L9
stub: false
summary: 'The synchondroses of the cranial base are bidirectional growth plates: a mirror-image pair of
  hypertrophic zones flanking a central resting zone, elongating in both directions at once, in contrast
  to the unidirectional physis of a long bone. The spheno-occipital synchondrosis is the last to close
  and is the principal contributor to postnatal cranial base lengthening. Its closure is a staged process
  resolvable on 3D CT, and in 630 Korean subjects aged 6-18 the intermediate stages 3 and 4 fell at 12.7-13.9
  years in males and 11.0-12.5 years in females, with females significantly more advanced than males at
  the same age (odds ratio 1.972, 95% CI 1.063-3.658) (kim2024). Fusion stage correlated with cervical
  vertebral maturation stage at Spearman 0.955 in males and 0.964 in females, so the cranial base and
  the vertebral column mature almost in lockstep - a much tighter coupling than that between skeletal
  and dental maturation. That contrast is the mechanistic point: two endochondral sites in different embryological
  lineages track each other closely, while an adjacent non-endochondral maturation process in the same
  head does not.'
