summary: 'The 2000 CDC growth charts are a descriptive reference: they summarise how US children actually
  grew in five national survey cycles, without prescriptive inclusion criteria, and they were smoothed
  with the LMS method so each chart carries explicit L, M and S parameters that permit exact SDS computation
  (kuczmarski2002). They matter to this atlas for two reasons. They supply the adult-height distribution
  used to convert clinical target-height bands into centimetres - the +/-1.64 SDS band recommended for
  idiopathic short stature becomes +/-10.6 cm for girls and +/-11.7 cm for boys under these charts (zeevi2024)
  - and they supply the matched-percentile male and female heights that expose the additive 13 cm sex
  correction as wrong at the extremes. Because the reference is descriptive it embeds the secular trend
  and the body composition of the US survey population, so an SDS computed against CDC is not interchangeable
  with one computed against WHO, and the two diverge most in infancy and at the tails (de2011).'
