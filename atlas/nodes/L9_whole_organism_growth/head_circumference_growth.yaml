id: head_circumference_growth
name: Head circumference growth
aliases:
- occipitofrontal circumference
type: phenotype
layer: L9
stub: false
summary: 'Head circumference is the clinical proxy for brain growth and it tracks brain volume closely
  in infancy, which is why it is the only anthropometric measure with a WHO velocity standard alongside
  length and weight (who_velocity_2009). Its trajectory is unlike stature: the increment is largest in
  the first months and then decays rapidly, mirroring the peak grey matter volume velocity at 5.08 months
  and the four-fold rise in brain weight by 3 years (bethlehem2022, dekaban1978), and there is no pubertal
  head-circumference spurt. This is the clearest organism-level demonstration that the calvaria and the
  long bones are not driven by a common growth signal: cranial vault expansion is essentially complete
  when the long bones still have more than a decade of elongation ahead, and the sutures that permit vault
  expansion begin closing in a substantial minority of children before adolescence (han2025). Numerical
  increment centiles for head circumference by month are published in the WHO velocity standards and are
  flagged for hand verification because the source is a manual rather than an indexed article.'
