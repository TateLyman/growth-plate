id: icp_growth_model
name: ICP (infancy-childhood-puberty) growth model
aliases:
- Karlberg ICP model
type: method
layer: L9
stub: false
summary: 'The ICP model decomposes an individual height curve into three additive, partly overlapping
  components: an infancy component (a sharply decelerating exponential present from mid-gestation), a
  childhood component (a slowly decelerating polynomial) and a puberty component (a logistic) (karlberg1987,
  karlberg1989). Its claim is biological rather than statistical: each component is asserted to map onto
  a different dominant endocrine driver - nutrition and insulin for infancy, growth hormone for childhood,
  sex steroids superimposed on GH for puberty. Its one hard testable prediction is the infancy-childhood
  transition: the childhood component switches on between 6 and 12 months, producing a measurable acceleration
  (the IC spurt) that is absent in untreated GH deficiency, complete by about 3 years, and delayed in
  30-50% of children with growth disorders or living in a deprived environment (karlberg1990). A second
  structural prediction is that the puberty component is invariant in size, so the inverse relation between
  age at pubertal onset and peak velocity must be generated by the shape of the childhood component alone
  (karlberg1989) - a claim the later QEPS decomposition contradicts by finding P-function pubertal gain
  independent of onset age while total pubertal gain is not (holmgren2017). No ICP component has ever
  been mapped onto a measured change in growth plate cell kinetics; the model is a hypothesis about control,
  not about tissue.'
