localization:
- 'human whole organism: fitted to serial supine length and standing height'
human_evidence: direct
human_evidence_note: The model was constructed from, and is only ever fitted to, human longitudinal length
  and height series.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: Human curve-fitting method with no animal counterpart.
confidence: B
claim_grades:
- claim: Human height growth can be fitted by three additive components with small residuals
  grade: A
  basis: Direct fits to large human longitudinal series, replicated in many cohorts.
- claim: The infancy-childhood transition at 6-12 months marks the onset of significant GH control of
    growth
  grade: C
  basis: Inferred from the absence of the IC spurt in untreated GH deficiency (karlberg1990); no direct
    measurement of GH-dependence of growth plate output across the transition in any species.
- claim: The puberty component is time-invariant in size
  grade: D
  basis: Asserted in karlberg1989; the QEPS decomposition of 2280 Swedish children separates P-function
    from QES-function pubertal gain and finds sex-different contributions (holmgren2017), so the invariance
    is model-dependent.
