id: visceral_organ_growth
name: Visceral organ growth
type: process
layer: L9
stub: false
summary: 'Internal organs do not grow on the skeletal schedule, and organ weight references are the quantitative
  record of that. The largest contemporary single-centre reference derives LMS-smoothed 5th to 95th centile
  weight charts for heart, lungs, liver, spleen, kidneys, pancreas, thymus and adrenals from 1190 of 1525
  consecutive infant autopsies over 14 years (pryce2014). Two of those organs are the strongest counterexamples
  to a common growth clock: the thymus is largest in absolute terms in early childhood and involutes from
  puberty onward, and the adrenal cortex loses its fetal zone in the first postnatal months and regrows
  a functionally distinct zona reticularis at adrenarche. So within a single individual, at the moment
  the growth plate is accelerating toward peak height velocity, at least one organ is regressing. This
  is an organism-level constraint rather than a plate mechanism, but it bounds what a systemic signal
  can be: no circulating factor whose concentration rises through puberty can be the sole driver of organ
  size, because organ responses at that time have opposite signs. Postnatal organ weight references beyond
  infancy were not located in this sweep and are logged as a gap.'
