id: craniofacial_growth
name: Craniofacial growth
type: process
layer: L9
stub: false
summary: 'The craniofacial skeleton grows by three mechanically and developmentally distinct mechanisms
  operating simultaneously: sutural growth at the calvarial and facial sutures, endochondral growth at
  the cranial base synchondroses, and surface remodelling with condylar growth at the mandible. Because
  these mechanisms are separable, growth restriction produces a patterned rather than a uniform shortfall.
  In 48 short subjects born small for gestational age the anterior cranial base was -1.8 SDS, the mandible
  at or below -1.7 SDS and the maxilla -1.5 SDS, while the mandibular plane angle was +1.9 SDS, the cranial
  base angle +1.0 SDS and lower anterior face height +1.7 SDS - a small retrognathic face with a relatively
  increased lower face height, not a scaled-down normal face (van1998). In the same subjects skeletal
  maturation was delayed but dental age was not, which is why craniofacial growth cannot be predicted
  from bone age alone. The timing anchor for the whole complex is the cranial base: spheno-occipital synchondrosis
  fusion stages 3 and 4 fall at 12.7-13.9 years in males and 11.0-12.5 years in females, i.e. close to
  peak height velocity in each sex (kim2024), so the endochondral component of the skull ceases on the
  same schedule as the appendicular skeleton while the sutural component does not.'
