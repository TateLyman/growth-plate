confidence: B
claim_grades:
- claim: Growth restriction produces a patterned, site-selective craniofacial shortfall
  grade: B
  basis: Directly measured cephalometric SDS pattern in 48 short SGA subjects; single centre, wide age
    range, no matched short-non-SGA control group.
- claim: The endochondral cranial base ceases growing on the same schedule as the appendicular skeleton
  grade: B
  basis: Spheno-occipital fusion stages 3-4 coincide with the sex-specific pubertal growth peak in 630
    CT subjects (kim2024); a cross-sectional staging study, so individual synchrony is inferred not observed.
