id: target_height_predictive_sd
name: Predictive SD of mid-parental target height
aliases:
- target height range
- target height residual SD
type: phenotype
layer: L9
stub: false
summary: 'The number a clinician needs from target height is not the point estimate but its predictive
  SD, because that SD defines what counts as an abnormal deviation. The value in routine use, ''mid-parental
  height plus or minus 8.5 cm'', was not measured: Tanner and colleagues derived it from theoretical considerations
  as the 3rd-to-97th centile band (tanner1970, as documented by zeevi2024), later revised it to +/-9 cm
  for girls and +/-10 cm for boys, and other authorities recommend +/-1.64 SDS, which under CDC standards
  is +/-10.6 cm for girls and +/-11.7 cm for boys. These three bands imply predictive SDs of about 4.5,
  4.8-5.3 and 6.5-7.1 cm respectively for the same quantity. The direct empirical measurement, made only
  in 2024, gives the residual SD of adult child height about the fully corrected target height as 4.7
  cm for sons and 4.4 cm for daughters pooled across families, and 4.5 +/- 0.9 cm and 4.2 +/- 0.8 cm within
  families (zeevi2024, n=303 adult children from 23 families with 7-16 children each). The independent
  population-based estimate is wider: Luo and colleagues report a 95% prediction interval of about +/-10
  cm around the regression estimate in 2402 Swedes, implying a predictive SD near 5.1 cm (luo1998). So
  the honest number is a predictive SD of 4.4-5.1 cm, and the widely quoted +/-8.5 cm is best read as
  a theoretically derived ~1.9 SD band, not the 2 SD band it is usually assumed to be. The residual dispersion
  is not larger for taller parents (zeevi2024, r=0.38, p=0.08), consistent with the population-based finding,
  so a single SD can be used across the height range once the mean is corrected.'
