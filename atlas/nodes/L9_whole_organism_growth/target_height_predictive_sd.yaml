human_evidence: direct
human_evidence_note: Directly measured adult heights of 303 adult children with both parents measured,
  plus a population-based sample of 2402.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: A human clinical prediction interval.
confidence: B
claim_grades:
- claim: The empirical predictive SD of corrected target height is 4.4-4.7 cm
  grade: B
  basis: One direct measurement in a genetically and geographically narrow sample (23 large Jewish nuclear
    families, Israel and US); internally replicated within and across families but not in a second population.
- claim: The clinically quoted +/-8.5 cm band was a theoretical derivation, not an empirical measurement
  grade: A
  basis: 'Documented explicitly against the primary source: ''Tanner et al. used theoretical considerations
    to estimate that the child''s final adult height should fall within +/-8.5 cm of mid-parental height''
    (zeevi2024, citing tanner1970).'
- claim: Guideline bands of +/-1.64 SDS (+/-10.6 to +/-11.7 cm) are about 50 percent wider than the measured
    predictive SD justifies
  grade: C
  basis: Arithmetic comparison of the guideline band against a single empirical SD estimate; a second
    empirical estimate (luo1998, SD ~5.1 cm) narrows but does not close the discrepancy.
