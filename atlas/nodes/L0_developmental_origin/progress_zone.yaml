id: progress_zone
name: Progress zone model of proximodistal specification
aliases:
- progress zone
- timing model of PD patterning
type: hypothesis
summary: 'How a limb bud decides which segment a cell will build determines which HOX code, and therefore which
  growth programme, each future growth plate inherits. Two models compete. The progress zone model holds that
  mesenchyme under the AER keeps an internal timer and acquires progressively more distal identity the longer
  it stays there. The prespecification/expansion model holds that stylopod, zeugopod and autopod domains are
  laid down early in the small bud and are then progressively expanded. Fate mapping and cell-death experiments
  in chick favour the second: removing cells does not shift identity as the timer model predicts, and the early
  bud already contains separable domains (dudley2002). Mouse genetics then showed that reducing AER Fgf4/Fgf8
  deletes PROXIMAL rather than distal skeletal elements, which is the opposite of what a distal-timer model
  predicts and indicates FGF acts instructively on identity and on survival of the proximal domain (mariani2008).
  The practical consequence for this atlas is that positional identity, and hence any inherited difference
  between the distal femoral and the metacarpal plate, is set very early - before any cartilage exists - and
  is not a running consequence of how long growth continues. This node is retained as a hypothesis because
  the debate is not formally closed and because it constrains when a site-specific intervention could act.'
localization:
- 'chick limb bud: fate mapping (dudley2002)'
- 'mouse limb bud: AER Fgf allelic series (mariani2008)'
human_evidence: absent
human_evidence_note: No human experiment addresses proximodistal specification mechanism; human relevance is
  limited to the segment-restricted distribution of HOX limb malformation syndromes.
species_basis:
- chicken
- mouse
translation_risk: high
translation_risk_reason: Avian and murine embryology with no human counterpart, and the models were built on
  limb morphology, not on any growth plate readout.
confidence: C
