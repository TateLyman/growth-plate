localization:
- 'mouse zeugopod marrow MSC: confirmed by Hoxa11-EGFP reporter (rux2016)'
- 'mouse zeugopod articular cartilage: confirmed to 6 months (rux2021)'
- 'mouse growth plate RZ/PZ/HZ: unreported in any species'
- 'human growth plate: unreported'
human_evidence: indirect
human_evidence_note: Human evidence is limb-malformation genetics (HOXD13 synpolydactyly, HOXA13 hand-foot-genital,
  HOXA11 radio-ulnar synostosis) plus the demonstration that adult human fibroblasts from 47 body sites retain
  site-specific HOX expression; no human growth plate has been assayed for HOX.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: Every functional statement rests on mouse Hox11 alleles in the zeugopod, a segment
  whose two bones are yoked mechanically; humans have HOX limb malformation syndromes but no growth-rate phenotype
  has ever been measured against HOX genotype.
confidence: D
claim_grades:
- claim: Posterior HOX genes assign proximodistal segment identity in the limb bud
  grade: B
  basis: mouse paralogue-group knockouts plus congruent human limb malformation syndromes
- claim: Hox11 function continues to be required postnatally and its loss slows zeugopod elongation
  grade: C
  basis: single mouse study (pineault2015), replicated in spirit by region-specific repair defects (rux2017)
- claim: 'FIELD CLAIM, not asserted by this node: retained positional HOX identity is what sets site-specific
    growth rate'
  grade: E
  basis: inference; the only supporting datum is age-independent Hoxd13/Shox/Tbx5 expression differences between
    phalangeal and tibial plates (lui2018), with no manipulation
- claim: 'FIELD CLAIM, not asserted by this node: HOX is expressed in postnatal growth plate chondrocytes'
  grade: X
  basis: asserted nowhere as a measurement; rux2016 reports adult Hoxa11 as exclusive to marrow MSCs, rux2021
    finds it in articular chondrocytes, and no zonal growth plate data exist
