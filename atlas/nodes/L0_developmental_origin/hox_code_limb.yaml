id: hox_code_limb
name: HOX code, proximodistal limb specification
aliases:
- posterior Hox 9-13 code
- positional identity of limb segments
type: pathway
summary: 'Posterior HOX paralogue groups 9-13 assign proximodistal identity in the limb bud: Hox9/10 to the
  stylopod, Hox11 to the zeugopod, Hox13 to the autopod. The atlas cares about this only because the identity
  is not discarded at birth. Hoxa11/Hoxd11 compound mutants that retain one wild-type allele develop normally
  to the newborn stage and then diverge: radial and ulnar elongation rate falls, growth plate height falls,
  senescent involution is premature, and terminal bone length is reduced, while proliferation in the resting
  and proliferative zones is paradoxically ELEVATED - the signature of accelerated consumption of a progenitor
  pool rather than of a slow one (mouse, pineault2015). The mutant phenotype is region-restricted: Hox11 loss
  impairs zeugopod fracture repair while stylopod fractures heal normally (mouse, rux2017), and Hox overexpression
  restores periosteal stem cell behaviour only when the Hox gene matches the anatomical origin of the cell
  (mouse, leclerc2023). Where the retained HOX protein actually sits is contested: Hoxa11-EGFP in the adult
  mouse marks PDGFRa+CD51+ LepR-lineage marrow MSCs of the zeugopod and is reported as exclusive to them (rux2016),
  whereas Hoxa11 is also maintained in zeugopod ARTICULAR chondrocytes to at least six months (rux2021). No
  study has reported zone-resolved HOX expression inside a growth plate in any species, and none in human.
  The correlative human-relevant link is that Hoxd13, Shox and Tbx5 are differentially expressed between one-week
  phalangeal and tibial growth plates in a way that is age-INDEPENDENT, i.e. not explained by the differing
  senescence state of the two plates (mouse and rat, lui2018). That is the closest anything comes to HOX identity
  predicting growth rate, and it is an expression difference, not a demonstrated cause.'
