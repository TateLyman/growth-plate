id: hoxd13_gene
name: HOXD13
aliases:
- Hoxd13
type: gene
summary: 'HOXD13 is the most 5'' HoxD gene and, with HOXA13, specifies the autopod. Human polyalanine-tract
  expansions in HOXD13 cause synpolydactyly, in which the digit skeleton shows altered growth AND altered branching
  - i.e. the mutation changes how much elements grow, not only how many form (muragaki1996). The reason HOXD13
  matters more than its paralogues here is a single specific observation: in laser-capture RNA-seq of separated
  proliferative and hypertrophic zones, Hoxd13 is among the genes whose expression differs between the one-week
  proximal phalangeal growth plate and the one-week proximal tibial growth plate in a manner that is NOT explained
  by the phalanx being developmentally older, because its expression in the 1-week phalanx differs from both
  1-week and 4-week tibia (mouse and rat, lui2018). Positional HOX identity is therefore demonstrably still
  readable inside a postnatal growth plate, at bulk-zone resolution. What the same study shows is that the
  growth rate difference between those plates is accounted for by differential progression of the senescence
  programme, not by Hoxd13; the link from retained HOX identity to rate remains a hypothesis.'
localization:
- 'mouse phalangeal growth plate PZ and HZ: differential expression vs tibia, age-independent (lui2018)'
- 'human growth plate: unreported'
human_evidence: direct
human_evidence_note: HOXD13 polyalanine expansions cause human synpolydactyly with documented alteration of
  digit element growth and branching.
species_basis:
- mouse
- rat
- human
translation_risk: moderate
translation_risk_reason: The human mutation phenotype is direct; the postnatal zonal expression evidence is
  rodent bulk RNA-seq and has not been confirmed by in situ localization or in human tissue.
