id: bone_collar_formation
name: Bone collar formation
aliases:
- periosteal collar
- perichondrial ossification
type: process
summary: 'The bone collar is the cuff of intramembranous bone laid down by the perichondrium around the hypertrophic
  midshaft, and it is the first bone in a long bone. Its formation requires Indian hedgehog: Ihh-null mice
  fail to form a bone collar and additionally show disorganised chondrocyte proliferation and premature hypertrophy
  (stjacques1999), which makes IHH the coupling point between the cartilage template and its osseous sleeve.
  Two inheritances follow into the postnatal plate. First, the collar is the mechanical constraint that converts
  diffuse cartilage swelling into directional elongation, and the perichondrium at the plate periphery persists
  postnatally as the groove of Ranvier and the perichondrial ring of LaCroix (L1). Second, the collar''s inner
  surface is the source of the osteoblast precursors that will occupy the primary ossification centre: Osterix+
  precursors, not mature osteoblasts, travel into the cartilage with the invading vessels (maes2010). The perichondrium
  is therefore not scaffolding but a progenitor reservoir the plate keeps for life.'
localization:
- 'mouse midshaft perichondrium from E14.5: confirmed (stjacques1999, maes2010)'
- 'human: inferred, no direct fate mapping possible'
human_evidence: absent
human_evidence_note: No human bone collar lineage or requirement experiment exists; human relevance is inferred
  from conserved anatomy and from the perichondrial structures visible in human growth plate histology.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Requirement and lineage claims are murine knockout and Cre-lineage results with no
  human counterpart.
