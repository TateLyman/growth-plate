id: tbx5_gene
name: TBX5
aliases:
- Tbx5
type: gene
summary: 'TBX5 is the T-box transcription factor that specifies forelimb identity and is required for forelimb
  bud initiation. Human heterozygous TBX5 mutations cause Holt-Oram syndrome, in which skeletal malformation
  is confined to the upper limb - most often radial ray and thumb defects - together with cardiac septation
  defects, with the lower limb entirely spared (basson1997). This restriction is the point: it establishes
  in humans that the forelimb and hindlimb skeletons run on separable genetic programmes from the moment the
  buds appear, which is the developmental precondition for arm and leg growth plates behaving differently.
  There is one further hook into the postnatal plate: Tbx5 is among the genes differentially expressed between
  one-week phalangeal and tibial growth plates in a manner independent of the plates'' differing senescence
  state (lui2018), so forelimb identity genes are still transcribed inside a postnatal growth plate. No study
  links TBX5 genotype to any growth velocity measurement.'
localization:
- 'mouse forelimb field lateral plate mesoderm: confirmed'
- 'mouse postnatal growth plate PZ/HZ: differential Tbx5 expression between phalanx and tibia (lui2018)'
- 'human: inferred from Holt-Oram phenotype distribution'
human_evidence: direct
human_evidence_note: TBX5 loss-of-function causes Holt-Oram syndrome with strictly upper-limb-restricted skeletal
  malformation in humans.
species_basis:
- human
- mouse
translation_risk: low
translation_risk_reason: The human syndrome defines the gene's skeletal domain directly; the mouse data are
  congruent.
