type: gene
summary: 'GDF5 is the BMP-family ligand that marks and is required for the interzone. Human mutations resolve
  its dose-response in both directions: mutations that ACTIVATE the receptor interaction site cause proximal
  symphalangism, where the interphalangeal joint never forms and the phalanges fuse into one longer element,
  while mutations that DEACTIVATE it cause brachydactyly type A2 with a short middle phalanx (seemann2005).
  One gene therefore controls both whether a segmentation boundary is placed and how long the element on either
  side becomes, which is precisely the kind of L0 decision the postnatal plate inherits without being able
  to revise. In mouse, Gdf5-driven lineage tracing establishes that GDF5-expressing interzone cells make joint
  tissues and not growth plate chondrocytes (koyama2008), and that they are recruited continuously rather than
  clonally expanded (shwartz2016). GDF5 is also one of the best-replicated common-variant loci for human height
  and osteoarthritis, which is handled in L8; the protein''s postnatal signalling is held by L3 gdf5_protein
  and is not duplicated here.'
localization:
- 'mouse presumptive joint interzone: confirmed'
- 'human: inferred from symphalangism and brachydactyly A2 phenotypes'
human_evidence: direct
human_evidence_note: Human GDF5 activating and inactivating mutations produce opposite, well-characterised
  digit phenotypes (symphalangism; brachydactyly type A2).
