id: vascular_invasion_poc
name: Vascular invasion of the primary ossification centre
aliases:
- primary vascular invasion
- chondro-osseous junction establishment
type: process
summary: 'Blood vessels breach the bone collar and enter the hypertrophic core of the cartilage template, converting
  the mid-diaphysis into the primary ossification centre and creating the chondro-osseous junction that will
  remain the plate''s lower boundary for the rest of growth. The invading front carries its own osteoprogenitors:
  lineage tracing shows Osterix-expressing precursors move in ALONG the vessels and become the trabecular osteoblasts,
  whereas mature osteoblasts do not migrate (maes2010). This is the developmental precedent for the postnatal
  coupling of angiogenesis to ossification at the metaphysis (L1 metaphyseal_vasculature, type_h_vessel) and
  for the pharmacological observation that anti-VEGFR agents can arrest ossification-centre expansion without
  altering cartilage stiffness (xie2020). In the epiphysis the same logic operates a second time through cartilage
  canals (blumer2008). The postnatal plate therefore inherits a fixed geometry: an ossified territory below,
  an ossified territory above, and a cartilage disc between them whose only escape from consumption is renewal
  from its own resting zone.'
localization:
- 'mouse diaphysis E14.5-E15.5: confirmed (maes2010)'
- 'rabbit: stage 4a of 16 (rivas2002)'
- 'human fetus: radiographically visible from the first trimester onward'
human_evidence: indirect
human_evidence_note: Human primary ossification centres are directly observable by fetal imaging and histology,
  but the lineage claim about vessel-borne osteoprogenitors is murine only.
species_basis:
- mouse
- rabbit
- human
translation_risk: moderate
translation_risk_reason: The anatomical event is directly observed in humans; the cellular mechanism is murine
  lineage tracing.
confidence: B
