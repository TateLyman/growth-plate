id: pitx1_gene
name: PITX1
aliases:
- Pitx1
- Backfoot
type: gene
summary: 'PITX1 is the bicoid-related homeodomain factor that imposes hindlimb identity. Pitx1-null mice show
  hindlimb-specific defects with partial transformation of hindlimb structures toward forelimb morphology,
  and the forelimb is unaffected (szeto1999). Together with TBX5 on the forelimb side, PITX1 is the reason
  the atlas can treat upper-limb and lower-limb growth plates as separately programmed rather than as instances
  of one plate. That separation is quantitatively real in humans: the proximal humeral physis supplies about
  80% of humeral length whereas the distal femoral physis supplies about 70% of femoral length, and the two
  shares move differently with age (see L1 site_specific_growth_rate). What is missing is any experiment connecting
  the two: no Pitx1 or Tbx5 manipulation has been read out as a growth plate elongation rate, and no human
  PITX1 variant has been assessed against limb segment growth velocity. The identity-to-rate step is an inference
  this layer flags rather than asserts.'
localization:
- 'mouse hindlimb field lateral plate mesoderm: confirmed (szeto1999)'
- 'human: no expression data in limb tissue retrieved'
human_evidence: absent
human_evidence_note: No human PITX1 variant has been characterised with limb growth measurements; human relevance
  rests on the conservation of forelimb/hindlimb identity genes.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Murine null phenotype only; the human counterpart of a hindlimb-to-forelimb identity
  shift has never been described.
