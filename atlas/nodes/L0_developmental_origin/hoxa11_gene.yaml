id: hoxa11_gene
name: HOXA11
aliases:
- Hoxa11
type: gene
summary: HOXA11 is a Hox11-paralogue transcription factor that specifies the zeugopod (radius/ulna, tibia/fibula).
  Its atlas value is that expression persists long after patterning. In mouse, Hoxa11-CreERT2 lineage marking
  shows Hoxa11-expressing cells arise at the earliest stages of skeletal development and continue to generate
  osteoblasts, chondrocytes and adipocytes for the life of the animal, sitting upstream of the LepR-Cre and
  Osx-CreER progenitor pools (pineault2019). In the adult, Hoxa11-EGFP marks PDGFRa+CD51+ marrow MSCs specifically
  in the zeugopod, and Hox11 loss produces a zeugopod-restricted fracture repair defect with reduced cartilage
  formation and delayed ossification (rux2016). Hoxa11 is also retained in zeugopod articular chondrocytes
  to at least six months and tracks their postnatal reorganisation into columns in the tibial plateau, while
  remaining silent in the elbow (rux2021). The single human phenotype is a missense mutation segregating with
  amegakaryocytic thrombocytopenia and radio-ulnar synostosis - a zeugopod-specific skeletal defect, consistent
  with the mouse domain, but with no reported growth velocity data (thompson2000). Whether HOXA11 is expressed
  in growth plate chondrocytes at all is unreported.
localization:
- 'mouse zeugopod marrow MSC: confirmed (rux2016)'
- 'mouse zeugopod articular chondrocyte: confirmed to 6 months (rux2021)'
- 'mouse elbow joint: absent (rux2021)'
- 'human growth plate: unreported'
human_evidence: indirect
human_evidence_note: One human pedigree with a HOXA11 missense mutation causing radio-ulnar synostosis with
  amegakaryocytic thrombocytopenia; no human expression or growth-rate data.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: All functional and lineage data are murine conditional-allele and reporter experiments;
  the human allele is a single family with a haematological presentation.
