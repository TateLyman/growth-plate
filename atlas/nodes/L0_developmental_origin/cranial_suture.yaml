id: cranial_suture
name: Cranial suture
aliases:
- calvarial suture
- coronal suture
type: tissue_structure
summary: 'A cranial suture is the fibrous joint between two calvarial bones and it is the site of calvarial
  growth: osteogenic fronts deposit bone appositionally on both sides of a central mesenchyme that houses the
  progenitor pool. The coronal suture sits at the neural-crest / paraxial-mesoderm lineage boundary (jiang2002),
  so a suture is a lineage interface as well as a growth site. Functionally the suture is defined by its stem
  cells: Gli1+ suture mesenchyme cells supply the osteogenic fronts, and their ablation produces craniosynostosis
  with arrest of skull growth (zhao2015), while Axin2+ suture cells are long-term self-renewing skeletal stem
  cells that also repair calvarial injury by direct differentiation (maruyama2016). The contrast with the growth
  plate is exact and instructive. Both structures are stem-cell-dependent growth engines; but suture growth
  is bidirectional, matrix-depositing and reversible in principle, whereas growth plate elongation is unidirectional
  and consumes the very cartilage it depends on. Premature loss of suture stem cells causes synostosis and
  stops growth; premature loss of resting zone cells is hypothesised (not shown) to cause epiphyseal fusion.
  The suture is the case where the stem-cell-exhaustion argument HAS been tested by ablation, which is precisely
  what the growth plate literature lacks.'
localization:
- 'mouse coronal and sagittal sutures: Gli1+ and Axin2+ populations confirmed (zhao2015, maruyama2016)'
- 'human sutures: no stem cell characterisation retrieved in this sweep'
human_evidence: indirect
human_evidence_note: Human evidence is the existence of syndromic and non-syndromic craniosynostosis and the
  in silico mapping of craniosynostosis genes onto human embryonic osteoprogenitor states (to2024); no human
  suture stem cell has been prospectively isolated in the retrieved literature.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: Both stem cell populations are defined by mouse reporter and ablation genetics; human
  suture biology is inferred from disease phenotypes.
