id: hoxd11_gene
name: HOXD11
aliases:
- Hoxd11
type: gene
summary: 'HOXD11 is the HoxD-cluster partner of HOXA11 in zeugopod specification; the two act as a paralogue
  group and single mutants are near-normal. The decisive experiment for the atlas is a conditional Hoxd11 allele
  deleted in the ADULT mouse on a Hox11-sensitised background: normal lamellar bone in the radius and ulna
  is replaced by disorganised woven-bone-like matrix, the Hox-expressing stem cell pool is NOT lost, Runx2
  induction is normal, but osteoblasts fail to progress to osteopontin or osteocalcin expression and the resulting
  osteocytes lack dendrites, a lacuno-canalicular network and SOST (song2020). Hox11 therefore acts on differentiation,
  region-specifically, in a fully formed skeleton - the strongest available evidence that embryonic positional
  identity is a continuing instruction rather than a memory. In the growing animal, Hoxa11/Hoxd11 compound
  loss slows radial and ulnar elongation postnatally with premature growth plate senescence (pineault2015).
  The bowing of the mutant radius is explicitly attributed to mechanical constraint from the disproportionately
  slower ulna, which makes the phenotype a natural experiment in paired-bone growth mismatch. No human HOXD11
  skeletal phenotype is established.'
localization:
- 'mouse zeugopod: confirmed (song2020, pineault2015)'
- 'human: unreported'
human_evidence: absent
human_evidence_note: No human HOXD11 variant with a skeletal growth phenotype has been reported; the human
  HOXD cluster evidence is limited to HOXD13 synpolydactyly.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Entirely murine conditional genetics with no human counterpart; mice also do not fuse
  their growth plates, so the adult-skeleton phenotype cannot be mapped onto a human post-fusion state.
