id: zone_of_polarizing_activity
name: Zone of polarizing activity (ZPA)
aliases:
- ZPA
- posterior SHH signalling centre
type: tissue_structure
summary: 'The ZPA is the posterior distal mesenchyme of the limb bud whose grafting to the anterior margin
  produces mirror-image digit duplication. Sonic hedgehog is expressed there and is sufficient to reproduce
  that polarizing activity in chick (riddle1993), establishing SHH as the anteroposterior organiser. In the
  human, the strongest evidence is regulatory rather than coding: point mutations in the ZRS, a conserved limb-specific
  SHH enhancer roughly 1 Mb away inside intron 5 of LMBR1, segregate with preaxial polydactyly (lettice2003).
  The ZPA therefore sets digit number and anteroposterior identity. It is retained in this layer only as the
  anteroposterior counterpart to the proximodistal HOX axis, because digit identity determines which HOX13-domain
  growth plates exist; it does not set any measured growth plate property. No ZPA or SHH-enhancer manipulation
  has been followed to a postnatal growth-plate rate measurement. Postnatal hedgehog signalling in the plate
  is an L3 matter (Ihh, Gli, Patched) and is not duplicated here.'
localization:
- 'chick and mouse posterior limb bud mesenchyme: confirmed'
- 'human: inferred from ZRS mutation phenotypes'
human_evidence: indirect
human_evidence_note: Human ZRS point mutations cause preaxial polydactyly, implying a conserved SHH limb organiser,
  but no human ZPA has been assayed directly.
species_basis:
- chicken
- mouse
- human
translation_risk: moderate
translation_risk_reason: Organiser function is avian/murine; the human evidence is genetic and concerns digit
  number, not growth rate.
confidence: B
