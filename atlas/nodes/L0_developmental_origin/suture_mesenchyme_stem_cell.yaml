id: suture_mesenchyme_stem_cell
name: Suture mesenchyme stem cell
aliases:
- SMSC
- Gli1+ suture stem cell
- Axin2+ suture stem cell
type: cell_type
summary: 'Two independently defined populations occupy the cranial suture mesenchyme and behave as skeletal
  stem cells. Gli1+ cells supply the osteogenic fronts of the growing calvaria; conditional ablation of the
  Gli1+ population causes craniosynostosis, arrest of skull growth and impaired injury repair, which is a direct
  demonstration that a stem cell pool is load-bearing for continued skeletal growth (zhao2015). Axin2+ suture
  cells are long-term self-renewing, generate calvarial bone by direct differentiation, and reconstitute the
  suture on transplantation (maruyama2016). The atlas keeps this node because it is the methodological benchmark
  the growth plate literature has not met: in the suture, the stem-cell-depletion-causes-growth-cessation claim
  has been tested by ablating the cells and observing the predicted synostosis, whereas in the growth plate
  the equivalent claim (resting zone depletion causes epiphyseal fusion, L2 rz_depletion_causes_fusion) rests
  on correlation. Whether the two populations are one cell or two is unresolved, and both are murine; no human
  suture stem cell has been prospectively isolated in the literature retrieved here.'
localization:
- 'mouse suture mesenchyme: Gli1+ (zhao2015) and Axin2+ (maruyama2016) populations confirmed'
- 'human: unreported in retrieved literature'
human_evidence: absent
human_evidence_note: No human suture stem cell isolation or functional assay was retrieved; human relevance
  rests on the craniosynostosis phenotype these mouse ablations reproduce.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Both populations are defined by mouse reporter alleles and inducible ablation; marker
  transfer to human calvarial tissue has not been demonstrated.
confidence: C
