id: cranial_neural_crest
name: Cranial neural crest
aliases:
- CNC
- neural crest derived skull
type: cell_type
summary: 'The skull vault is built from two embryologically distinct populations, and the boundary between
  them is a suture. Wnt1-Cre and Mesp1-Cre fate mapping in mouse shows the frontal bone is neural-crest derived
  while the parietal bone is paraxial-mesoderm derived, with the coronal suture sitting exactly at the lineage
  interface (jiang2002). This node exists as the atlas''s contrast case: the neural-crest-derived skeleton
  grows by intramembranous ossification at sutures, has no growth plate, no resting zone, no hypertrophic chondrocytes
  and no estrogen-driven fusion, yet it must coordinate its growth with an endochondral cranial base and with
  the brain. The comparison makes visible which constraints on limb growth are intrinsic to endochondral ossification
  rather than to bone growth as such. In human embryos the two ossification programmes are separable at the
  regulatory level: paired transcriptomic and epigenomic profiling of 5-11 post-conception week embryos resolves
  regionally distinct cranial and limb osteoprogenitor trajectories with different regulatory networks for
  intramembranous and endochondral ossification (to2024). Cranial-crest lineage identity is thus a real human
  distinction, not only a mouse one.'
localization:
- 'mouse frontal bone: neural crest derived (jiang2002)'
- 'mouse parietal bone: paraxial mesoderm derived (jiang2002)'
- 'human cranium 5-11 post-conception weeks: distinct cranial osteoprogenitor trajectories (to2024)'
human_evidence: indirect
human_evidence_note: Human embryonic cranial osteoprogenitors are transcriptionally and epigenetically distinct
