id: interzone_formation
name: Interzone formation and joint positioning
aliases:
- interzone
- joint site specification
type: process
summary: 'A joint site is specified by the appearance of an interzone: a three-layered flattened-cell domain
  that interrupts a continuous cartilage rod and thereby DEFINES where one skeletal element ends and the next
  begins. Because element length is bounded by the two joints that flank it, interzone position is the earliest
  determinant of how much bone each growth plate has to build. Gdf5-Cre lineage tracing in mouse shows the
  interzone gives rise to articular cartilage, synovium and intra-articular ligaments but NOT to growth plate
  chondrocytes: the joint lineage and the growth plate lineage separate at this point (koyama2008). Inducible
  Gdf5-CreERT2 pulses then showed the joint is not built by expansion of a single founder pool but by continuous,
  wave-like recruitment of new Gdf5-expressing cells from adjacent tissue (shwartz2016), so ''interzone'' names
  a rolling state, not a fixed clone. Human evidence that interzone signalling sets element length is genetic:
  activating GDF5 mutations cause proximal symphalangism, in which the joint never forms and adjacent phalanges
  fuse, and inactivating mutations cause brachydactyly type A2, in which the middle phalanx is short (seemann2005).
  Whether interzone position predicts the eventual elongation rate of the plate at that element''s other end
  is untested.'
localization:
- 'mouse presumptive joint sites E12.5 onward: confirmed by Gdf5-Cre and Gdf5-CreERT2 (koyama2008, shwartz2016)'
- 'human: inferred from GDF5 mutation phenotypes'
human_evidence: indirect
human_evidence_note: Human GDF5 gain- and loss-of-function mutations produce joint fusion and short middle
  phalanges respectively, implying the same interzone-dependent segmentation, but no human interzone has been
  fate mapped.
species_basis:
- mouse
- human
translation_risk: moderate
translation_risk_reason: Lineage claims are murine and cannot be made in humans; the human genetic phenotypes
  are concordant with the murine mechanism.
confidence: B
