  value_unverified: true
localization:
- 'mouse limb bud E11.5-E12.5 condensation: Fgfr3-creER marks dorsally restricted progenitors (wu2025)'
- 'human embryo 5-11 post-conception weeks: condensation-stage osteoprogenitor trajectories resolved by snRNA/snATAC
  and spatial transcriptomics (to2024)'
human_evidence: indirect
human_evidence_note: Human condensation-stage cells have been profiled transcriptionally and spatially in 5-11
  post-conception week embryos (to2024), but no human lineage tracing or ablation is possible, so no human
  cell-fate claim can be made.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: The compartment-inheritance result is a single mouse study using two inducible Cre
  lines; humans cannot be lineage traced and the dorsoventral compartmentalisation of the human plate is unexamined.
confidence: D
claim_grades:
- claim: Condensation-stage progenitors are spatially compartmentalised and their descendants occupy restricted
    territories of the postnatal growth plate
  grade: D
  basis: single mouse study with Fgfr3-creER and Dlx5-creER lineage tracing plus DTA ablation (wu2025)
- claim: Condensation is required for long bone formation
  grade: B
  basis: condensation-stage DTA ablation abolishes normal long bone development in mouse; Sox9-null cells excluded
    from condensations never form cartilage
- claim: All long bone condensations start at similar size and diverge later
  grade: X
  basis: repeated in reviews and in the introduction of lui2018 but no primary measurement across elements
    was retrievable
