id: mesenchymal_condensation
name: Mesenchymal condensation
aliases:
- precartilage condensation
- cartilage anlage formation
type: process
summary: 'Every endochondral element begins as a local aggregation of limb bud mesenchyme that raises cell
  density and turns on SOX9. The single most load-bearing recent result for this atlas is that the condensation
  is already spatially partitioned in a way the postnatal growth plate inherits: Fgfr3-creER pulsed at the
  condensation stage in mouse marks cells that contribute exclusively to hypertrophic chondrocytes and to the
  DORSAL side of the resting and proliferative zones, and their descendants remain dorsally restricted through
  growth plate chondrocytes, trabecular and cortical osteoblasts and marrow stroma; diphtheria-toxin ablation
  of these cells at the condensation stage severely disrupts long bone development (wu2025). The postnatal
  plate is therefore not a homogeneous field seeded at random - it carries a dorsoventral compartment map laid
  down before cartilage exists. A second, older claim is repeated widely and is NOT supported by a measurement:
  that all long bone condensations start at a similar size and diverge only later. It is cited as such (lui2018
  citing Hall and Miyake), but no study retrieved reports condensation cell number, volume or density measured
  across elements that end up 10-20 fold different in length. That quantitative hole is logged as g_l0dev_003.'
