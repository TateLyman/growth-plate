id: apical_ectodermal_ridge
name: Apical ectodermal ridge (AER)
aliases:
- AER
- FGF8/FGF10 signalling centre
type: tissue_structure
summary: 'The AER is the pseudostratified ectodermal thickening at the distal limb bud tip that maintains outgrowth
  by secreting FGF4/FGF8; it is maintained in turn by mesenchymal FGF10 (min1998). Its atlas relevance is confined
  to one result: an allelic series reducing AER Fgf4/Fgf8 in mouse deletes PROXIMAL skeletal elements while
  distal elements survive, which excludes the simple timer reading of the AER and shows FGF acts instructively
  on proximodistal identity and on survival of the proximal domain (mariani2008). The consequence for the postnatal
  plate is therefore that the AER determines which elements exist and what positional identity they carry,
  and it stops signalling long before any growth plate forms. No AER manipulation has been carried through
  to a postnatal growth plate measurement in any species, and there is no human AER data at all. This node
  is deliberately not a signalling review: FGF ligand-receptor mechanism belongs to L3.'
localization:
- 'chick and mouse distal limb bud ectoderm, E9.5-E12.5 mouse: confirmed'
human_evidence: absent
human_evidence_note: No human AER experiment exists; human relevance is inferred from the conserved consequence
  of limb-field disruption in congenital limb reduction defects.
species_basis:
- mouse
- chicken
translation_risk: high
translation_risk_reason: Avian and murine embryology only, and the readout is limb morphology at birth rather
  than any growth plate parameter.
