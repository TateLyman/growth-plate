summary: "ZERO - THE CORRECTION FIRST (CORR-338), BECAUSE I PUBLISHED THE ERROR YESTERDAY.\nRound 317 read `GCST90728588`\
  \ assuming that a POSITIVE deposited beta meant trunk-favouring. It does not.\nThe parent publication (`bartell2026`,\
  \ PMID 41861830) deposits SEVEN more summary statistics from the SAME\ncohort - standing height, sitting height\
  \ and leg length, each raw and inverse-normalised. Pulling the SAME\nSNP from all four files and correlating gives:\n\
  \  **corr( deposited SHR beta , SIT beta - LEG beta ) = -0.997 across 32 loci.**\n**THE SIGN IS INVERTED. Negative\
  \ deposited beta = TRUNK-favouring; positive = LIMB-favouring.**\n⭐ **AND THE POSITIVE CONTROL PROVES IT, WHERE\
  \ MY VERSION NEVER MADE SENSE.** The strongest locus in the\ngenome for this trait is chr17:59498052 at **P=9.89e-136**\
  \ over **TBX2/TBX4**. TBX4 is the **HINDLIMB\nIDENTITY GENE**. Under the corrected convention it is the strongest\
  \ **LIMB**-allocation locus in the genome,\nwhich is exactly what it must be. Under round 317's convention it\
  \ came out \"trunk\", and I printed that\nwithout noticing the contradiction.\n=> **Every gene-by-gene direction\
  \ in round 317 is reversed. Its headline is not - see below.**\n\nONE - ⭐⭐ THE ANALYSIS THAT CANNOT BE WRONG,\
  \ BECAUSE IT NEVER USES THE RATIO.\nWith standing height, sitting height and leg length for the same SNP in the\
  \ same ~546,000 people, the\nsign convention becomes irrelevant. Align every locus to its **HEIGHT-INCREASING\
  \ allele**, then ask where\nthat height goes. 32 loci with SHR P<1e-5 and all four traits at the identical variant:\n\
  **11 TRUNK-dominant, 14 LIMB-dominant, 7 BOTH.**\n\nTWO - ⭐⭐⭐ THE RESULT THAT MATTERS FOR THIS CASE: **HHIP IS\
  \ 95% TRUNK.**\n| locus | trunk | leg | total | % of gain that is TRUNK |\n|---|---|---|---|---|\n| **COL11A1**\
  \ | **+0.0416** | +0.0015 | +0.0235 | **97%** |\n| **HHIP** | **+0.0367** | +0.0021 | +0.0217 | **95%** |\n| **TET1**\
  \ | **+0.0306** | +0.0014 | +0.0176 | **96%** |\n| RUNX2 | +0.0221 | -0.0064 | +0.0082 | 78% |\n| SOX9 | +0.0213\
  \ | -0.0013 | +0.0109 | 94% |\n| ZFAT | +0.0182 | +0.0024 | +0.0116 | 88% |\n| IGF1 | +0.0164 | -0.0020 | +0.0080\
  \ | 89% |\n| **FGFR3** | **+0.0158** | -0.0057 | +0.0047 | **73%** |\n| COL2A1 | +0.0114 | -0.0031 | +0.0042 |\
  \ 79% |\n| ESR1 | +0.0090 | -0.0054 | +0.0017 | 62% |\n| MEF2C | +0.0067 | -0.0045 | +0.0009 | 60% |\n⭐ **HHIP's\
  \ height-increasing allele adds +0.0367 to SITTING HEIGHT and +0.0021 to LEG.** The atlas's\nbest-validated target\
  \ - human pLoF **+9.92 cm**, `haraguchi2025` femur **+4.5% at 53 weeks with the plate\nstill open**, R312's two-species\
  \ low-output-plate enrichment - turns out to act almost entirely on the\n**compartment that still has 6.5-9.0\
  \ cm in it at this bone age**, against 0.3-0.4 cm in the knees.\n**Nothing else in this file combines target validation\
  \ with the right compartment.**\n✓ **TET1 IS THE SECOND ONE, AND IT HAS BETTER CHEMISTRY.** 96% trunk, human pLoF\
  \ **+8.32 cm**, and round\n302 found it **present in both human growth-plate donors, peak hypertrophic zone**,\
  \ Open Targets\n\"High-Quality Ligand, Small Molecule Binder\", a **dioxygenase** - the most drugged fold there\
  \ is.\n\nTHREE - ✓ THE CNP ARM IS LIMB-DIRECTED. ROUND 317'S HEADLINE SURVIVES BY A BETTER ROUTE.\n**NPR3: trunk\
  \ -0.0019, leg +0.0453** - the height gain is essentially 100% LEG.\n**NPPC: trunk +0.0095, leg +0.0344** - 22%\
  \ trunk.\nThis no longer depends on the ratio sign at all, and it converges with everything already recorded:\n\
  navepegritide lowers the upper:lower segment ratio, vosoritide is **L1-L4 null in the EMA assessment**,\naxial-null\
  \ in monkeys, and the rat axial dose that works causes scoliosis and kyphosis. **Five lines.**\n✓ **AND THE STACK'S\
  \ OTHER ARM IS IN THE RIGHT COMPARTMENT: FGFR3 IS 73% TRUNK** (+0.0158 trunk, -0.0057\nleg), which independently\
  \ supports the atlas's note that the FGFR3 arm REACHES THE SPINE - dabogratinib is\nthe only agent in the file\
  \ shown to lengthen lumbar vertebrae. **This subject is on an FGFR inhibitor.**\n⚠ **CORR-195 STILL GOVERNS.**\
  \ His knees are open and growing at bone age 16, off the population\ndistribution, so \"the trunk is where the\
  \ cm are\" is a prior and not his measured value. This is a\n**selection criterion for ADDITIONS**, not an instruction\
  \ to stop the CNP arm.\n\nFOUR - ⛔ WHAT ROUND 317 GOT WRONG AND MUST BE WITHDRAWN.\n· ⛔ **\"TNKS is trunk-favouring\
  \ at P=7.63e-26\" is WRONG - TANKYRASE IS LIMB** (trunk -0.0075, leg +0.0206).\n  Round 317 offered this as a\
  \ new argument for the round 302 lead. **Withdrawn.** Tankyrase has now failed\n  to corroborate from four independent\
  \ directions: IMPC length (R303), maturation timing (R311),\n  growth-capacity expression (R312) and compartment\
  \ (here).\n· ⛔ **\"LTBP2 is a top trunk locus\" is WRONG - LTBP2 IS LIMB** (trunk +0.0027, leg +0.0397).\n· ⛔\
  \ **\"TEAD1 is the second strongest TRUNK locus in the genome\" is WRONG.** Its beta is positive, so under\n \
  \ the corrected convention TEAD1 is **LIMB**-favouring. The Hippo lead as stated is withdrawn; the KEGG\n  enrichment\
  \ in `baronas2023` is untouched but it is no longer a trunk argument.\n· ✓ **FBN1 IS LIMB (trunk +0.0019, leg\
  \ +0.0329) - which CONFIRMS R289 with a human number.** The atlas\n  deprioritised the angiotensin/TGF-beta handle\
  \ because \"the Marfan axis grows limbs - long limbs, relative\n  trunk sparing.\" That was an inference from\
  \ habitus; it is now measured. **SCUBE3 is also limb** (-0.0012\n  vs +0.0295), which is a real cost to the round\
  \ 312/315 SCUBE3 line.\n· ✓ **The denosumab contraindication SURVIVES**, because it never rested on the ratio\
  \ sign - it rests on\n  retained cartilage without lengthening (CORR-292's jam) and on IMPC Tnfrsf11b-null body\
  \ length -4.607 at\n  P=4.3e-14. Venetoclax likewise.\n\nFIVE - ⭐ WHAT THIS DELIVERS, AND IT IS THE FIRST TIME\
  \ THE ATLAS HAS HAD IT.\nA **compartment coordinate for every candidate**, from one cohort of 546,000 people,\
  \ on absolute traits.\nThe stack now reads:\n  · **vosoritide -> LIMB** (NPR3 100% leg, NPPC 78% leg) - aimed\
  \ at the compartment with least left\n  · **erdafitinib -> TRUNK** (FGFR3 73% trunk) - aimed at the compartment\
  \ with most left\n  · **GH -> mixed, limb-leaning** (GHR 83% leg; IGF1 89% trunk; IGF1R 70% trunk - the axis is\
  \ not coherent)\n  · **anastrozole -> ESR1 62% trunk, CYP19A1 limb** - also incoherent, and it acts on the PERIOD\
  \ anyway\nAnd the ranked ADDITION list, re-sorted by compartment for the first time:\n  1. **HHIP - 95% trunk,\
  \ best-validated target in the atlas, no agent exists** (R294, R314's antibody\n     reframe, R315's delivery\
  \ precedent)\n  2. **TET1 - 96% trunk, +8.32 cm, in the tissue, a dioxygenase with small-molecule tractability**\n\
  \  3. everything else in the file is limb-directed, weak, or both."
human_evidence: direct
human_evidence_note: 'Entirely human and from a single cohort: bartell2026 deposits standing height, sitting height,
  leg length and sitting height ratio for ~546,000 people (473,511 European, 72,471 East Asian, plus African-ancestry),
  and all four were queried at the IDENTICAL variant for each locus so no cross-cohort or cross-SNP comparison is
  involved. The compartment decomposition uses only the three absolute traits, so it is independent of the ratio''s
  sign convention.'
species_basis: human
translation_risk: moderate
translation_risk_reason: 'MODERATE. The compartment coordinates are human, large, internally controlled and validated
  by a positive control that is unambiguous (TBX4, the hindlimb identity gene, comes out as the genome''s strongest
  limb locus). What does NOT follow is any therapeutic direction: these are lead-allele effects at a locus, the
  allele''s effect on gene function is unknown, and a common-variant compartment bias need not survive into a pharmacological
  perturbation of the same gene in an adolescent. Gene assignment is by +/-100 kb window, so several calls could
  belong to a neighbour.'
confidence: A
confidence_reason: Graded A, the first in many rounds, and only for the compartment decomposition itself. It uses
  three ABSOLUTE traits rather than a ratio, so the sign convention that broke round 317 cannot affect it; the same
  variant is read from all four files; the cohort is one and the same; the sample is 546,000; and the positive control
  is decisive - TBX4, the hindlimb identity gene, is the strongest limb-allocation locus in the genome at P=9.89e-136.
  The A applies to WHERE a locus sends height. It does NOT extend to any claim that perturbing these genes in this
  subject would reproduce the split.
limitations: Common-variant lead effects, not perturbations - nothing here says what inhibiting or supplying a gene
  product would do, and the allele's effect on gene function is unknown at every locus. Gene assignment is by +/-100
  kb window and several windows contain multiple genes. No fine-mapping or colocalisation was performed, and bartell2026
  explicitly reports that fine-mapped SHR signals are often DISTINCT from height signals, so lead-SNP-based assignment
  is coarser than the authors' own analysis. Effect sizes are in inverse-normalised units and are NOT centimetres,
  so no row here can be converted to a predicted gain. The 32 loci analysed were selected because they carry SHR
  signal, which biases toward compartment-acting loci and says nothing about coverage of height loci generally.
  Adult cross-sectional genetics need not describe what is achievable at bone age 16.
