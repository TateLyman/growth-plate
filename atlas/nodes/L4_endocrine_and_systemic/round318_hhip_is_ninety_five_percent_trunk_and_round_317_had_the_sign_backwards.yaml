contradicts: 'This round CORRECTS round 317, published one round earlier. The deposited sitting-height-ratio beta
  is inverted relative to what round 317 assumed (r = -0.997 against sitting-minus-leg at the same SNP, and the
  TBX4 hindlimb positive control settles it), so every gene-by-gene direction in that round reverses: TNKS, LTBP2
  and TEAD1 are LIMB rather than trunk, and round 317''s tankyrase and Hippo arguments are withdrawn. Round 317''s
  HEADLINE survives and is strengthened, because the absolute traits reach it without any sign convention: the CNP
  arm is limb-directed. The denosumab and venetoclax contraindications survive untouched, since neither rested on
  the ratio. What is new is a compartment coordinate for every candidate - and it puts HHIP, the atlas''s best-validated
  and least available target, at 95% trunk, which is the compartment that still has centimetres in it.'
