claim_grades:
- claim: Round 317's gene-by-gene compartment directions were correct.
  grade: X
  species: human
  source_ref: bartell2026
  basis: 'NO - the deposited sitting-height-ratio sign is INVERTED relative to what round 317 assumed. Correlating
    the deposited SHR beta against (sitting height beta minus leg length beta) at the same SNP gives r = -0.997
    across 32 loci, and the positive control settles it: TBX4, the hindlimb identity gene, sits under the genome''s
    strongest locus for this trait at P=9.89e-136 and must be limb-allocating. The corrected convention places it
    there; round 317''s convention called it trunk, and I printed that contradiction without catching it. Every
    gene-by-gene direction in round 317 reverses.'
- claim: HHIP delivers its height effect overwhelmingly to the trunk.
  grade: A
  species: human
  source_ref: bartell2026
  basis: Aligned to its height-increasing allele, the HHIP locus gives sitting height +0.0367 and leg length +0.0021
    - 95% of the gain is trunk - with standing height +0.0217. This uses only the three ABSOLUTE traits, so it is
    independent of the ratio sign that broke round 317, and all four values come from the same variant in the same
    546,000-person cohort. It matters because HHIP is the best-validated target in this atlas (human pLoF +9.92
    cm; haraguchi2025 femur +4.5% at 53 weeks with the plate held open; two-species low-output-plate enrichment
    in round 312) and because at bone age 14.5 the trunk still holds 6.5-9.0 cm against 0.3-0.4 cm in the knees.
    GRADE A for the compartment assignment only - it says nothing about what perturbing HHIP would do.
- claim: The CNP arm is limb-directed.
  grade: A
  species: human
  source_ref: bartell2026
  basis: 'NPR3''s height-increasing allele gives trunk -0.0019 against leg +0.0453 - essentially the entire gain
    is leg - and NPPC gives trunk +0.0095 against leg +0.0344, 22% trunk. Round 317 reached this conclusion through
    the ratio and therefore reached it for the wrong reason; the absolute traits reach it without any sign convention.
    It now converges with five independent lines: navepegritide lowering the upper:lower segment ratio, vosoritide''s
    L1-L4 null in the EMA assessment, its axial null in monkeys, the rat axial dose causing scoliosis and kyphosis,
    and this. CORR-195 still limits the inference for this subject, whose knees are open at bone age 16 and off
    the population distribution.'
- claim: Tankyrase is trunk-favouring, as round 317 claimed.
  grade: X
  species: human
  source_ref: bartell2026
  basis: 'NO. Corrected, TNKS is LIMB-dominant - trunk -0.0075 against leg +0.0206. Round 317 offered the opposite
    as a new argument for the round 302 promotion, specifically because every earlier failed test had been about
    timing or whole-body length rather than compartment. That argument is withdrawn, and tankyrase has now failed
    to corroborate from four independent directions: IMPC length (R303), maturation timing (R311), growth-capacity
    expression (R312) and compartment (here). The same correction withdraws round 317''s LTBP2 and TEAD1 trunk claims.'
- claim: These compartment coordinates predict what a drug against the gene would do.
  grade: X
  species: human
  source_ref: bartell2026
  basis: NO, and this is the boundary of the round. Every value is a common-variant LEAD-ALLELE effect at a locus
    assigned by a +/-100 kb window. The allele's effect on gene function is unknown, so no therapeutic direction
    follows; bartell2026 itself reports that fine-mapped SHR signals are often distinct from height signals, so
    lead-SNP assignment is coarser than the authors' own analysis; the units are inverse-normalised SDs and cannot
    be converted to centimetres; and adult cross-sectional genetics need not describe what is achievable at bone
    age 16. What the round delivers is a SELECTION CRITERION for ranking candidates, not a prediction of effect.
