id: round318_hhip_is_ninety_five_percent_trunk_and_round_317_had_the_sign_backwards
name: ROUND 318 - the compartment question is DECIDED with absolute traits instead of a ratio, and it corrects my
  own last round. The deposited sitting-height-ratio sign was INVERTED (r = -0.997), so R317's gene-by-gene calls
  were backwards. The headline SURVIVES by a better route - and the answer is that HHIP, the atlas's best-validated
  target, delivers 95% of its height effect to the TRUNK, the compartment with 6.5-9.0 cm left, while the CNP arm
  this subject is on is limb-directed
