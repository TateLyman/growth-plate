type: protein
layer: L4
stub: false
summary: 'DIO3 is the inactivating selenodeiodinase: it removes an inner-ring iodine to convert T4 to
  reverse T3 and T3 to 3,3''-T2, both receptor-inactive. It is an imprinted, paternally expressed gene
  in the DLK1-DIO3 locus on chromosome 14q32 - the same imprinted domain that contains DLK1, whose paternal
  deletion causes central precocious puberty. DIO3 is highly expressed in fetal tissues and placenta,
  where its function is to shield developing tissue from premature T3 exposure; deiodinase-mediated inactivation
  has been shown to minimise thyroid hormone signalling in the early fetal skeleton. The growth plate
  consequence is a developmental gate: hypertrophic differentiation cannot be driven by T3 before DIO3
  falls. Whether DIO3 is expressed with zonal specificity in the postnatal human growth plate has not
  been reported.'
localization:
- 'fetal rodent skeleton: DIO3-mediated inactivation limits early T3 signalling'
- 'human growth plate: DIO3 expression not reported by zone'
human_evidence: indirect
human_evidence_note: Human evidence is genomic - DIO3 sits in the imprinted 14q32 DLK1-DIO3 domain whose
  disruption (Temple syndrome, paternal DLK1 deletion) alters growth and pubertal timing - not direct
  enzyme measurement in human physis.
