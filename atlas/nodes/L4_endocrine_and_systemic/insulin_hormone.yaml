id: insulin_hormone
name: Insulin
aliases:
- INS
type: hormone
layer: L4
stub: false
summary: 'Insulin contributes to linear growth in two distinct ways that are often conflated. First, it
  is the permissive nutritional signal for the GH axis: portal insulin maintains hepatic GHR expression
  and suppresses IGFBP-1, so insulinopenia (untreated type 1 diabetes, severe malnutrition) produces GH
  resistance with high GH and low IGF-1. Second, at supraphysiological concentrations insulin can cross-react
  with IGF1R. The direct cartilage action is largely IGF-mediated: insulin''s trophic effect on cartilage
  growth in vivo required IGF-I (alarid1992). In humans the clearest evidence is clinical - Mauriac syndrome
  (growth failure in poorly controlled type 1 diabetes) reverses with insulin, and severe insulin receptor
  mutations (Donohue syndrome) cause profound growth failure. Prepubertal children with obesity, who are
  hyperinsulinaemic, have high free IGF-1 and accelerated growth despite REDUCED circulating pappalysins
  (martnrivada2025), which shows insulin acts on the bioavailability layer rather than on total IGF-1.'
localization:
- 'human SYS: pancreatic beta cell -> portal and systemic circulation'
- 'growth plate: insulin receptor present but direct chondrocyte effect not isolated from IGF1R'
human_evidence: direct
human_evidence_note: Insulin deficiency (Mauriac syndrome) and insulin receptor loss of function (Donohue
  syndrome) both cause human growth failure that responds to correcting the insulin signal where possible.
species_basis:
- human
- rat
translation_risk: low
translation_risk_reason: Human clinical evidence is direct; rat data only refine the mechanism.
confidence: A
