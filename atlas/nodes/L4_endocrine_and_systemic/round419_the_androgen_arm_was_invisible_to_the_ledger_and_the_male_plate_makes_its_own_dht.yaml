id: round419_the_androgen_arm_was_invisible_to_the_ledger_and_the_male_plate_makes_its_own_dht
name: >-
  R419: the androgen axis has 106 files, a full oxandrolone node and a human ADULT-HEIGHT meta-analysis,
  and CLAUDE.md has never mentioned it once. Worked, it kills the raise-oestradiol hypothesis on two
  independent human lines, exposes a TARGET-ENGAGEMENT problem with aromatase inhibition started in late
  puberty, shows that MALE growth-plate chondrocytes convert testosterone to DHT rather than oestradiol,
  and produces a clinically live contraindication that pairs with minoxidil
aliases:
  - androgen receptor growth plate
  - finasteride dutasteride contraindication
  - aromatase inhibitor target engagement late puberty
  - oestradiol assay floor
  - DHT local conversion male chondrocyte
type: hypothesis
layer: L4
stub: false
summary: >-
  The instruction was to keep pushing on ways to get taller WITH OPEN PLATES. This atlas has roughly four
  hundred rounds on the oestrogen receptor and, as a lever, nothing on the other sex-steroid receptor -
  even though its own human data put the androgen receptor in 65 percent of resting-zone and 58 percent of
  hypertrophic chondrocytes in boys at every Tanner stage (nilsson2003, extracted in R354).

  ⛔ ZERO - THE LEDGER FAILURE, AND IT IS THE PUREST INSTANCE YET. Grep returns androgen in 106 files,
  testosterone in 130, oxandrolone in 15, and a dedicated `oxandrolone` node carrying a HUMAN ATTAINED-
  ADULT-HEIGHT meta-analysis. CLAUDE.md returns ZERO for both `oxandrolone` and `androgen`. An entire
  hormone axis with adult-height evidence has been invisible to every context that reads the ledger.
  CORR-313, and the fix is the one already written: any round producing a positive with a length endpoint
  goes in CLAUDE.md in the same commit.

  ⛔ ONE - THE HYPOTHESIS THIS ROUND GENERATED, AND KILLED. The setup looked strong: growth acceleration in
  boys is half-maximal at oestradiol 6.5 pmol/L (albin2013), the only infusion dose that significantly
  raised velocity sat near 37 pmol/L and tripled it (carusonicolett1985), closure proceeds only above
  roughly 55-73 pmol/L (lanfranco2008, rochira2015), and this subject sits at 3.3-6 pmol/L - BELOW all
  three. R339 read that same number as permission to suppress FURTHER; the opposite reading, that he is
  below the peak of a curve whose ascending limb is worth up to a threefold velocity increment, had never
  been made. TWO INDEPENDENT HUMAN LINES REFUTE IT:
  · belgorosky1989 - 16 normal pubertal boys, growth velocity correlated significantly with TESTOSTERONE
    and NOT with OESTRADIOL, including the bioavailable non-SHBG-bound fractions of both. The authors
    state the result is against a growth-promoting role for oestrogen in male puberty.
  · ferris2017 - 21 boys on an aromatase inhibitor: PREDICTED ADULT HEIGHT DID NOT CHANGE in either the
    Tanner I-III or the Tanner IV-V group.
  Recorded as SEARCHED AND REJECTED so no later context re-derives it. Weaknesses noted honestly:
  belgorosky1989 is correlational with collinear hormones, ferris2017 is n=21 retrospective on predicted
  rather than attained height.

  ⭐⭐ TWO - BUT ferris2017 DELIVERS SOMETHING FAR MORE IMPORTANT THAN THE NULL IT WAS READ FOR.
  In those AI-treated boys, OESTRADIOL DID NOT SIGNIFICANTLY CHANGE IN EITHER GROUP - while peak
  testosterone rose to 650 +/- 458 ng/dL early and 1156 +/- 302 ng/dL late, and in late puberty FSH, LH,
  HAEMATOCRIT, BMI z-score and acne all rose significantly. The authors single out LATE-PUBERTY INITIATION
  as the concerning configuration.
  → THAT IS THIS SUBJECT'S EXACT CONFIGURATION, and it is a TARGET-ENGAGEMENT result, not an efficacy one:
  the drug demonstrably did things (testosterone, gonadotropins, haematocrit) while the parameter the whole
  strategy is aimed at did not move. Mechanistically coherent - blocking aromatase releases hypothalamic
  feedback, raises LH and testosterone, and the risen substrate can overwhelm a partial blockade.

  ⭐⭐⭐ THREE - WHICH MAKES THE OESTRADIOL NUMBER LOAD-BEARING AND UNVERIFIED, AND THIS IS THE ROUND'S
  MOST ACTIONABLE OUTPUT. An enormous amount of this file rests on one figure - that he is at 3.3-6 pmol/L:
  R355's claim that he is 10-25 times below the closure threshold; R360's argument that anastrozole moved
  him from a deadline regime to a budget regime; R339's gate for the degrader; R351 and R358's entire
  ligand-deplete argument. R339 itself recorded that 6.5 pmol/L is about 1.8 pg/mL, BELOW the functional
  sensitivity of routine immunoassays, and that a standard assay reporting undetectable carries no
  information - and nobody acted on it. With ferris2017 showing that AI-treated late-pubertal boys do NOT
  show a fall in oestradiol, the possibility that the number is an assay-floor artefact rather than a
  measurement is now a live alternative rather than a technical caveat.
  → CONFIRM THE METHOD. If it is not LC-MS/MS or an extraction assay, it is not a measurement.

  ⭐⭐⭐ FOUR - THE NEW MECHANISM, AND IT IS SEX-SPECIFIC IN THE DIRECTION THAT MATTERS HERE.
  elbaradie2012, resting-zone chondrocytes from male and female rats: FEMALE chondrocytes convert
  testosterone to 17-beta-oestradiol, whereas MALE chondrocytes produce 5-alpha-DIHYDROTESTOSTERONE, and
  DHT mediates the sex-specific effects of testosterone in male cells - through classical androgen-receptor
  signalling plus a rapid membrane PKC pathway that is G-protein, PLC and calcium-channel dependent and
  independent of transcription and translation.
  → THE MALE GROWTH PLATE'S OWN LOCAL ANDROGEN SIGNAL IS TO A NON-AROMATISABLE ANDROGEN. An aromatase
  inhibitor cannot block that step, and by raising testosterone it raises its substrate. Together with
  nilsson2003's androgen receptor in 65 percent of resting-zone chondrocytes at every Tanner stage, and
  belgorosky1989's testosterone-velocity correlation, that is three independent lines pointing at an
  ANDROGEN arm this atlas has never worked as a lever.
  ⚠ Rat, in vitro, no bone-length endpoint. And it does NOT establish that the DHT arm is growth-promoting
  at a length endpoint in any species - only that it is the male plate's local conversion.

  ⛔⛔ FIVE - AND IT PRODUCES A CONTRAINDICATION THAT IS FREE, CLINICALLY LIVE, AND PAIRS WITH ONE THIS
  FILE ALREADY HOLDS. FINASTERIDE and DUTASTERIDE are 5-alpha-reductase inhibitors - they block exactly
  the conversion elbaradie2012 identifies as the male chondrocyte's own. Grep: finasteride ZERO files,
  dutasteride ZERO files, anywhere in this atlas.
  ⭐ And they are the OTHER HALF of the standard young-male hair-loss prescription. R336 already added
  MINOXIDIL as a contraindication and instructed that he be asked about it because it is over-the-counter
  and near-ubiquitous in teenage boys. Finasteride is what is typically taken alongside it, and nobody has
  asked.
  ⚠ Grade E, and the counter is recorded: SRD5A1 and SRD5A2 return NO rows in kosmicki2026's 207 (checked
  in R359), so there is no population-scale human height signal for the enzyme, and no 5-alpha-reductase
  inhibitor has a bone-length endpoint in any species. Free to ask and free to stop, which is the whole
  argument for recording it.

  ⚠ SIX - AND THE AROMATASE INHIBITOR'S OWN ADULT-HEIGHT EVIDENCE IS MIXED, WHICH CLAUDE.md STATES SLIGHTLY
  MORE CONFIDENTLY THAN THE PRIMARIES DO. tanriverdi2023 - matched retrospective to TRUE adult height, no
  difference overall at P=0.071, significant only in the at-least-two-years subgroup (173.1 vs 169.8 cm,
  P=0.044). mauras2016 - near-final height, AI/GH versus GH at P=0.06, not significant. ferris2017 -
  predicted adult height null in both Tanner groups. mauras2008 - PREDICTED height only, +6.7 cm at 36
  months, authors explicitly calling for long-term follow-up. binder2021 is the one clean positive and it
  is aromatase EXCESS syndrome, a disease of too much aromatase, which is a different baseline; its own
  low-dose observation is n=1 and went the other way.
  → This is NOT an argument to stop anastrozole. R274 and R329 keep it as the best agent in its class and
  R363 calls adherence the highest-leverage item in the file. It is an argument that the arm's effect size
  is softer than the ledger implies, and that its TARGET ENGAGEMENT in this subject has never been checked.

  ⭐ SEVEN - WHAT TO ACTUALLY DO, ALL OF IT FREE.
  · Confirm the METHOD behind the 3.3-6 pmol/L oestradiol. LC-MS/MS or extraction, or it is not a number.
  · Measure the ferris2017 engagement panel, which this file has never specified: TESTOSTERONE, LH, FSH,
    HAEMATOCRIT. Those are what demonstrably move on an AI in late puberty, and a rising haematocrit is the
    one with a real clinical edge.
  · ASK ABOUT FINASTERIDE OR DUTASTERIDE, alongside the minoxidil question R336 already raised.

  ⛔ WHAT THIS ROUND DOES NOT DO. It produces no new agent. Oxandrolone is not promoted: wang2026's own
  subgroup shows testosterone beat oxandrolone by 2.64 cm on attained adult height, so the non-aromatisable
  androgen is the WEAKER agent in the one human comparison that exists, and the population is boys with
  constitutional delay - a restoration setting, CORR-203. What the round delivers is an axis restored to
  visibility, a hypothesis killed before it cost a round, a target-engagement problem with a drug already
  in the stack, and a free contraindication nobody had asked about.
quantitative:
  - parameter: growth velocity correlation with testosterone versus oestradiol in pubertal boys
    value: >-
      significant positive correlation with testosterone, NO correlation with oestradiol, including the
      non-SHBG-bound bioavailable fractions of both
    unit: correlation, qualitative
    species: human
    source_ref: belgorosky1989
    value_unverified: true
    note: 16 normal pubertal boys; correlational, and T and E2 are collinear in normal puberty
  - parameter: aromatase inhibitor target engagement in boys, by Tanner stage
    value: >-
      predicted adult height unchanged in both groups; peak testosterone 650 +/- 458 ng/dL (Tanner I-III,
      p=0.008) and 1156 +/- 302 ng/dL (Tanner IV-V, p=0.002); OESTRADIOL DID NOT SIGNIFICANTLY CHANGE in
      either group; in late puberty FSH p=0.002, LH p=0.002, haematocrit p=0.0001, BMI z-score p=0.0005,
      acne p=0.01
    unit: ng/dL and p-values
    species: human
    source_ref: ferris2017
    value_unverified: true
    note: >-
      21 boys, retrospective, mean duration 0.9 years in the late-puberty group. The oestradiol
      non-response is the load-bearing observation, not the height null
  - parameter: local sex-steroid conversion in resting-zone chondrocytes is sex-specific
    value: >-
      female chondrocytes convert testosterone to 17-beta-oestradiol; MALE chondrocytes produce
      5-alpha-dihydrotestosterone, which mediates the sex-specific effects of testosterone in male cells
    unit: qualitative
    species: rat
    source_ref: elbaradie2012
    value_unverified: true
    note: >-
      in vitro, no bone-length endpoint. Establishes that the male plate's local androgen conversion is to
      a NON-aromatisable androgen, which an aromatase inhibitor cannot block
  - parameter: aromatase inhibition in aromatase EXCESS syndrome, attained adult height
    value: >-
      3 of 4 boys on anastrozole 1.0 mg daily for a median 5.6 years exceeded predicted adult height by
      2.4, 6.9 and 8.1 cm; one untreated boy fell 8.6 cm below prediction; adult height -0.91 SDS treated
      versus -0.15 SDS untreated
    unit: cm and SDS
    species: human
    source_ref: binder2021
    value_unverified: true
    note: >-
      n=7 total, retrospective, and a disease of aromatase EXCESS rather than an ordinary male. The one
      low-dose patient merely reached prognosis, which is n=1
localization: >-
  human growth plate - androgen receptor in 65 percent of resting-zone, 41 percent of proliferative and
  58 percent of hypertrophic chondrocytes in boys at every Tanner stage (nilsson2003, via R354)
human_evidence: direct
human_evidence_note: >-
  The velocity correlation, the aromatase-inhibitor engagement data and the aromatase-excess outcomes are
  human. The sex-specific local conversion to DHT is rat chondrocytes in vitro.
species_basis:
  - human
  - rat
translation_risk: moderate
translation_risk_reason: >-
  The mechanism that makes the androgen arm interesting is a rat in-vitro result with no length endpoint,
  and the human androgen evidence is from constitutional delay, which is a restoration setting.
confidence: C
claim_grades:
  - claim: Raising oestradiol into the 10-50 pmol/L window would add height in this subject
    grade: E
    basis: >-
      NO - searched and rejected. Two independent human lines refute the ascending limb in males, and
      weise2001 shows any oestrogen accelerates all seven senescence parameters
  - claim: Aromatase inhibition in late-pubertal boys does not reliably lower oestradiol
    grade: C
    basis: >-
      one retrospective series of 21 boys in which oestradiol did not change in either Tanner group while
      testosterone, gonadotropins and haematocrit did. Single series, small, needs replication
  - claim: The subject's oestradiol figure may be an assay-floor artefact rather than a measurement
    grade: D
    basis: >-
      6.5 pmol/L is about 1.8 pg/mL, below routine immunoassay functional sensitivity, and the assay method
      behind the reported value has never been recorded. A question about provenance, not a finding
  - claim: Male growth-plate chondrocytes convert testosterone to DHT rather than oestradiol
    grade: C
    basis: rat resting-zone chondrocytes in vitro, one laboratory, no length endpoint
  - claim: 5-alpha-reductase inhibitors are a plausible cost in a growing male
    grade: E
    basis: >-
      mechanistic only. SRD5A1 and SRD5A2 carry no signal in the 207 and no 5-alpha-reductase inhibitor has
      a bone-length endpoint in any species. Free to ask and free to avoid, which is why it is recorded
  - claim: Oxandrolone should be added
    grade: E
    basis: >-
      NO. Testosterone beat oxandrolone by 2.64 cm on attained adult height in the one human comparison,
      and the population is constitutional delay, which is restoration
