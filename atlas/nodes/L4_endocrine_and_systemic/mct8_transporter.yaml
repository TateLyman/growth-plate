id: mct8_transporter
name: MCT8 (SLC16A2) thyroid hormone transporter
aliases:
- SLC16A2
- MCT8
- monocarboxylate transporter 8
type: protein
layer: L4
stub: false
summary: 'MCT8 is a 12-transmembrane facilitative transporter that carries T4 and, preferentially, T3
  across plasma membranes; thyroid hormone is not freely membrane-permeant, so transporter expression
  determines which cells can respond to a given serum concentration. Hemizygous SLC16A2 loss of function
  in males causes MCT8 deficiency (Allan-Herndon-Dudley syndrome): severe psychomotor disability from
  cerebral hypothyroidism combined with peripheral thyrotoxicosis, because tissues that do not require
  MCT8 are exposed to the high serum T3 that results. The characteristic biochemistry is high T3, low-normal
  T4, normal-to-mildly-raised TSH and a raised T3/T4 ratio. The growth-relevant consequence is being underweight
  and poor somatic growth; the T3 analogue Triac, which enters cells independently of MCT8, lowered serum
  T3 from 4.58 to 1.66 nmol/L over a median 2.2 years and improved body-weight-for-age by 0.72 SD versus
  untreated historical controls (van2022). Whether growth plate chondrocytes depend on MCT8 or on alternative
  transporters (OATP1C1, MCT10, LAT1/2) has not been established in any species.'
