paralog_audit_note: Node lists its four competing transporters (OATP1C1, MCT10, LAT1/2) and states the
  growth plate question is unresolved. The Triac intervention works BECAUSE it bypasses MCT8 - a mechanism-confirming
  design.
reanalysis_observations:
- observation: SLC16A2 (MCT8) is not detected in human growth plate in either donor - one probe set, one
    marginal call in the more sensitive donor's proliferative zone. SLC16A10 (MCT10, 3 probe sets) and
    SLCO1C1 (OATP1C1, 2 probe sets) are likewise not detected. In the same samples THRA and THRB are detected
    in all five compartments of both donors, DIO2 in resting zone, proliferative zone and perichondrium,
    SLC7A5 (LAT1) in all four zones of both donors and SLC7A8 (LAT2) in three compartments.
  interpretation: The human growth plate chondrocyte is unlikely to depend on MCT8 for T3 uptake. Receptors
    and local T4-to-T3 activation are present; the system-L transporters are the leading alternative and
    are the ones to test first.
  caveats: A transporter can be functionally decisive below a microarray floor, so this is evidence against
    dependence rather than proof of independence.
  reanalysis: p8_01_gse9160_human_zonal
  source_ref: gse9160
  species: human
  grade: D
  date: '2026-08-05'
