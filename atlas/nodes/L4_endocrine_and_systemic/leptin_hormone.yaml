type: hormone
layer: L4
stub: false
summary: 'Leptin is a 16 kDa adipocyte-derived cytokine whose circulating concentration is proportional
  to fat mass and which functions as the permissive energy-sufficiency signal for the reproductive and
  growth axes. Below a threshold of adiposity, leptin falls, hypothalamic kisspeptin output drops and
  puberty is delayed or arrested - the mechanism underlying pubertal delay in anorexia nervosa, athletic
  amenorrhoea and undernutrition. Human congenital leptin deficiency proves the necessity: in a 145-child
  cohort with LEP, LEPR or MC4R deficiency, LEP-deficient children had 26% mortality and LEPR-deficient
  9%, mainly from infection, with hypogonadotropic hypogonadism in survivors; recombinant leptin restores
  puberty (saeed2023). At the plate itself leptin has a reported local action - it stimulates aromatase
  in the growth plate, which has been proposed to limit catch-up growth efficiency - but that is rodent
  work and the direct chondrocyte effect has not been demonstrated in human tissue.'
