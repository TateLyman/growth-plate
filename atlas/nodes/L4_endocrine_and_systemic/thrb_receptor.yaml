paralog_audit: at_risk
paralog_audit_date: '2026-08-05'
paralog_risk: The claim that all T3 responses require TRbeta rests on a GERMLINE TRbeta-null RIB chondrocyte
  culture in which TRalpha is present and can have compensated during development; gthe1999 shows the
  two isoforms cooperate with or substitute for each other, so a germline single null under-reports. This
  partly explains the logged mouse-versus-human contradiction. No cartilage-restricted deletion of either
  isoform exists. See g_para_005.
reanalysis_observations:
- observation: 'P8-01: THRB is detected in all five compartments of both human donors (2 of 3 probe sets)
    and peaks in the hypertrophic zone in both. THRA is also detected in all five. Both receptors present
    in human tissue - the single-null isoform-assignment problem is not resolved by absence.'
