id: igfbp2
name: IGFBP-2
aliases:
- IGFBP2
type: protein
layer: L4
stub: false
summary: IGFBP-2 is the second most abundant circulating IGFBP after IGFBP-3 and, unlike IGFBP-3, is not
  GH-dependent - it rises in GH deficiency and in catabolic states and falls with GH treatment, so its
  serum concentration moves opposite to IGFBP-3 across most of the growth disorders. It carries a heparin-binding
  domain and an RGD motif, giving it IGF-independent, integrin-mediated actions. It is a slow substrate
  for PAPP-A. Its specific contribution to growth plate IGF availability has not been isolated experimentally
  in any species. This node belongs to the IGF bioavailability control layer - ternary complex formation
  (IGFBP-3/-5 plus ALS), pericellular proteolysis (PAPP-A, PAPP-A2) and protease inhibition (STC1, STC2)
  - which sets the free IGF-1 concentration seen by chondrocyte IGF1R independently of total IGF-1. Reviews
  typically stop at 'IGF-1 level'; the human PAPPA2 kindreds show that total and free IGF-1 can move in
  opposite directions and that stature tracks the free fraction.
