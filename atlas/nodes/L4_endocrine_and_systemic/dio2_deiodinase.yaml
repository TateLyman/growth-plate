id: dio2_deiodinase
name: Type 2 deiodinase (DIO2)
aliases:
- DIO2
- D2
- 5'-deiodinase type II
type: protein
layer: L4
stub: false
summary: DIO2 is an endoplasmic-reticulum selenoenzyme that removes an outer-ring iodine from T4 to generate
  T3, providing intracellular T3 locally rather than from the circulation. Its substrate-induced ubiquitination
  gives it a short half-life and makes local T3 production self-limiting when T4 rises. In the skeleton
  DIO2 is the enzyme that would allow a chondrocyte to set its own T3 exposure independently of serum
  T4, and DIO2 activity has been demonstrated in bone. Its developmental importance is inferred largely
  from the complementary observation that DIO3 inactivation dominates early fetal skeleton, minimising
  T3 signalling until the appropriate stage. The specific quantitative claim that most growth plate T3
  is locally generated by DIO2 rather than imported is widely repeated but, as far as can be established,
  has not been measured with zonal resolution in any species and certainly not in human physis.
localization:
- 'human growth plate: DIO2 protein/activity not measured by zone'
- 'rodent bone: iodothyronine deiodinase activity demonstrated in bone tissue'
human_evidence: absent
human_evidence_note: No human DIO2 loss-of-function growth phenotype; the common DIO2 Thr92Ala polymorphism
  has been studied for metabolic rather than statural endpoints.
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: Local deiodinase control of skeletal T3 is a rodent-derived model with no human
  physeal measurement; the field states it more confidently than the data support.
confidence: D
