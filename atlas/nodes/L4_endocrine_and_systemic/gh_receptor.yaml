id: gh_receptor
name: Growth hormone receptor (GHR)
aliases:
- GHR
- somatotropin receptor
- GHBP (shed ectodomain)
type: protein
layer: L4
stub: false
summary: GHR is a single-pass class I cytokine receptor that exists as a preformed, ligand-independent
  dimer. Ligand binding does not dimerise the receptor; it rotates the two transmembrane helices from
  a parallel arrangement into a left-handed crossover, separating the juxtamembrane regions and pulling
  apart the two JAK2 pseudokinase domains that had been holding each other's kinase domains inhibited,
  which permits trans-activation (brooks2014). Proteolytic shedding of the ectodomain generates GH-binding
  protein (GHBP). GHR mRNA and protein are present across rat growth plate zones with the strongest signal
  in the germinal and proliferative zones (gevers2002), the anatomical basis for a direct plate action.
  Ghr-null mice show disproportionate skeletal shortening and markedly reduced bone mineral content (sjgren2000);
  in humans, biallelic GHR loss of function is Laron syndrome, with severely reduced untreated adult stature
  and only partial rescue by recombinant IGF-1 (laron2015, guevaraaguirre2025). Hepatic GHR abundance
  is set by the trough rather than the peak of the GH profile in rat (gevers1996); the equivalent regulation
  in chondrocytes has never been measured.
quantitative:
- parameter: hepatic GHR and plasma GHBP response to the pulsatile component of a patterned GH infusion
  value: '0'
  unit: fold change (no response across the tested pulsatile dose range)
  conditions: GH-deficient dwarf rats, patterned iv hGH; GHR/GHBP responded only to the continuous component
  species: rat
  source_ref: gevers1996
  uncertainty: qualitative null within the tested dose range
localization:
- 'rat RZ/PZ: GHR mRNA and protein confirmed, highest signal (gevers2002)'
- 'rat HZ: GHR present at lower level (gevers2002)'
- 'human growth plate: GHR protein not localised by zone'
human_evidence: direct
human_evidence_note: Biallelic human GHR loss of function (Laron syndrome) causes severe GH-insensitive
  short stature with high GH and low IGF-1, establishing the receptor's necessity for human stature.
species_basis:
