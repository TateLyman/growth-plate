type: hypothesis
layer: L4
stub: false
summary: "ZERO - THE DATASET AND WHY IT SETTLES SOMETHING. `GCST90728588` - sitting height ratio ADJUSTED\nFOR HEIGHT\
  \ AND BMI, 545,982 people across European, East Asian and African-ancestry cohorts, 16,884,049\nvariants, full\
  \ summary statistics - was hunted down on 2026-08-13 and never opened. Because the trait is\nadjusted for height,\
  \ it measures pure COMPARTMENT ALLOCATION: a positive beta is a trunk-favouring allele, a\nnegative one limb-favouring.\
  \ CLAUDE.md calls the axial/appendicular split \"the most decision-relevant\ncompartment fact in the file\" and\
  \ has been asserting it from pharmacology. This tests it in half a million\npeople.\n✓ **BASE-RATE CHECK FIRST\
  \ (CORR-329).** At P<1e-20 there are 153 independent loci (250 kb clumping) and they\nsplit **77 trunk-favouring\
  \ to 76 limb-favouring**. There is no global skew, so unlike the IMPC screen the\nSIGN here carries real information.\
  \ That check had to pass before anything below could be read.\n\nONE - ⭐⭐ THE HEADLINE: THE CNP AXIS IS ONE OF\
  \ THE STRONGEST LIMB-VERSUS-TRUNK ALLOCATION SIGNALS IN THE\nHUMAN GENOME, AND IT SITS ON THE LIMB SIDE.\n| gene\
  \ | top P in +/-100 kb | lead-allele beta | direction |\n|---|---|---|---|\n| **NPR3** | **2.20e-67** | -0.0389\
  \ | **LIMB** |\n| **NPPC** | **5.57e-23** | -0.0203 | **LIMB** |\n| NPR2 | 1.06e-04 | +0.0082 | nothing |\nNPR3\
  \ is the second most significant locus of the 46 tested, behind only COL11A1. **The ligand and the\nclearance\
  \ receptor of the exact axis vosoritide drives are both major determinants of how growth is split\nbetween trunk\
  \ and limb, and both lead alleles favour LIMB.**\n✓ **This CONVERGES with everything the atlas already recorded\
  \ pharmacologically** - navepegritide LOWERS the\nupper:lower segment ratio, vosoritide is L1-L4 NULL in the EMA\
  \ assessment, axial-null outright in monkeys,\nand in rats the axial dose that works causes scoliosis, kyphosis\
  \ and fractures. Four independent lines, one\nconclusion, now with a half-million-person human genetic anchor.\n\
  ⛔ **AND SET IT AGAINST THE RESIDUAL.** At bone age ~14.5, population data give the knees **0.3-0.4 cm** and\n\
  the trunk **6.5-9.0 cm** (aeppli2025), with spine growth peaking LATER than total body growth (hori2025).\n**THE\
  \ STACK'S LARGEST AND MOST EXPENSIVE ARM IS AIMED AT THE COMPARTMENT WITH THE LEAST LEFT.**\n⚠ **THE OPERATOR'S\
  \ OWN CORRECTION STANDS AND LIMITS THIS.** His knees are radiographically open and\ndemonstrably growing at bone\
  \ age 16, which is OFF that population distribution, so this is NOT an argument to\nstop the CNP arm - population\
  \ numbers are a prior, not his value (CORR-195). What it IS: the marginal return\non the CNP arm is limb-weighted,\
  \ and **anything ADDED should be selected for trunk reach**, which is a\nselection criterion the atlas has never\
  \ applied.\n\nTWO - ⭐ WHAT IS TRUNK-FAVOURING, GENOME-WIDE AND UNBIASED. Top loci by effect size among P<1e-20,\
  \ annotated\nagainst GRCh37 (+/-150 kb):\n· **chr17:59498052, P=9.89e-136 - TBX2 / TBX4 / BCAS3.** The single\
  \ most significant sitting-height-ratio\n  locus found. **TBX4 is the hindlimb identity gene** (TBX5 forelimb,\
  \ TBX4 hindlimb), so a limb-versus-trunk\n  allocation signal at 1e-136 over TBX4 is the strongest possible internal\
  \ positive control for this trait.\n  ✓ And IMPC agrees at length: **Tbx4-het tibia -0.310, P=0.0066.** Undruggable\
  \ developmental TF.\n· **chr11:12835835, P=3.11e-119 - TEAD1.** See below - this is the one with chemical matter.\n\
  · **chr5:176527577, P=1.84e-97 - NSD1 / FGFR4.** NSD1 is Sotos; already dead at the plate (R281).\n· **chr4:103112470,\
  \ P=1.94e-92, LARGEST TRUNK BETA +0.0810 - SLC39A8 / BANK1.** SLC39A8 is the manganese and\n  zinc transporter\
  \ whose biallelic loss is a congenital disorder of glycosylation with skeletal dysplasia,\n  treated with oral\
  \ manganese. ✗ CORR-203 applies hard - that is restoration in a rare deficiency, not\n  elevation in a replete\
  \ adolescent - and IMPC Slc39a8-het tibia is null (-0.618, P=0.88). Recorded, not\n  promoted.\n· **chr1:22511594,\
  \ P=1.20e-81 - WNT4 / CDC42** · **chr20:33882720, P=5.82e-62 - GDF5 region** ·\n  **chr12:93985482, P=6.36e-55\
  \ - SOCS2** (the GH-arm brake, trunk-favouring) · **chr7:27223771, P=4.26e-41 -\n  the HOXA1-HOXA7 cluster** ·\
  \ **chr2:56096892 - EFEMP1** · **chr2:42392591 - PKDCC** (secreted kinase; its\n  loss causes rhizomelic limb\
  \ shortening) · **chr22:33048039 - TIMP3** · **chr13:43153869 - TNFSF11** ·\n  **chr18:60054857 - TNFRSF11A.**\n\
  \nTHREE - ⛔ RANK/RANKL IS THE SIXTH BAND IN THIS FILE, AND IT MAKES DENOSUMAB A CONTRAINDICATION.\nTwo INDEPENDENT\
  \ loci on one pathway both come up trunk-favouring at genome-wide significance - **TNFRSF11A\n(RANK) P=4.17e-72**\
  \ and **TNFSF11 (RANKL) P=3.64e-25** - which is exactly the kind of convergence that makes\na pathway look like\
  \ a lever. It is not, and both directions shorten:\n· ⛔ **BLOCKING RANKL JAMS THE PLATE.** Osteoclastic resorption\
  \ is required to remove the hypertrophic\n  cartilage at the chondro-osseous junction. Genetic RANKL deficiency\
  \ causes osteopetrosis with **RETAINED\n  CARTILAGE**; OPG-Fc decreased bone growth in neonatal rats; adolescent\
  \ monkeys at 5-10x the denosumab dose\n  had **abnormal growth plates**; and metaphyseal band fractures are reported\
  \ in denosumab-treated children.\n  Retained cartilage without lengthening is **CORR-292's JAM**, which this file\
  \ has now seen in Fgfr3-Ach,\n  in Jansen's, and here.\n· ⛔ **AND EXCESS RANKL SHORTENS TOO.** IMPC **Tnfrsf11b\
  \ (OPG, the RANKL decoy) homozygous null: body length\n  -4.607 at P=4.3e-14** and -1.790 at P=3.2e-09 - unopposed\
  \ RANKL, and one of the largest length effects in\n  the whole 7,216-gene IMPC set against a median of -0.212.\n\
  => **DENOSUMAB IS CONTRAINDICATED FOR THIS GOAL**, and the band pattern predicted it before the literature\nwas\
  \ read. Sixth axis in this file to shorten in both directions, after hedgehog, oestrogen receptors, DNA\nmethylation,\
  \ canonical Wnt and cAMP.\n\nFOUR - ⚠ A NEW CONTRAINDICATION FOUND IN PASSING: **VENETOCLAX**, the approved BCL-2\
  \ inhibitor, **impairs\nlongitudinal bone growth** - a pharmacological result with a growth endpoint, and this\
  \ atlas had never named\nthe drug or the target.\n\nFIVE - ⭐ THE ONE BIG TRUNK LOCUS WITH CHEMICAL MATTER AND\
  \ ALMOST NO ATLAS COVERAGE: **TEAD1 / HIPPO.**\n· **chr11:12835835, P=3.11e-119, beta +0.0454 - the second most\
  \ significant trunk-favouring locus in the\n  genome**, and TEAD1 is the only protein-coding gene in the window.\n\
  · ⭐ **IT CONVERGES WITH ROUND 311 INDEPENDENTLY.** `baronas2023`'s genome-wide chondrocyte maturation screen\n\
  \  reported KEGG enrichment in exactly five pathways - Wnt, Hedgehog, ubiquitin-mediated proteolysis,\n  TGF-beta/BMP\
  \ and **HIPPO**. The atlas recorded that sentence and never followed the Hippo arm.\n· **Atlas coverage is near\
  \ zero**: Hippo 3 mentions, YAP1 14, WWTR1 12, angiomotin 4, against 800+ nodes.\n· **Chemical matter EXISTS and\
  \ is clinical-stage** - TEAD palmitate-pocket inhibitors are in phase 1\n  oncology. This is the opposite of the\
  \ HHIP/CHAD problem.\n· ⚠ **Direction unknown and IMPC is unhelpful**: Tead1-het is null for both body and tibia\
  \ length across four\n  rows; **Wwtr1/TAZ-het tibia is +1.753 at P=0.081** - not significant, but positive is\
  \ the RARE direction in\n  a screen where 63.7% of knockouts shorten, so it is worth exactly one follow-up and\
  \ no more.\n· ✗ And tankyrase already touches this node - R302 recorded that tankyrase is \"not Wnt-only; telomeric\
  \ TRF1,\n  YAP via angiomotin, unmapped in cartilage.\" **TNKS itself is trunk-favouring here at P=7.63e-26**,\
  \ which is\n  a new argument for a lead that rounds 303, 311 and 312 kept failing to corroborate - and notably\
  \ every one\n  of those failed tests was about maturation timing or whole-body length, **never about compartment.**\n\
  \nSIX - WHAT THIS ROUND DELIVERS. Not a compound. A **selection criterion the atlas has never had**: any\naddition\
  \ should be chosen for TRUNK reach, because the residual is trunk-dominant and the largest arm in the\nstack is\
  \ limb-weighted by four independent lines including half a million people. It kills denosumab, adds\nvenetoclax\
  \ to the contraindication list, and puts one large, druggable, essentially uncovered trunk-directed\nnode - TEAD1/Hippo\
  \ - on the table for the first time."
human_evidence: direct
human_evidence_note: The central result is human and large - 545,982 people, trans-ancestry (473,511 European, 72,471
  East Asian, plus African-ancestry cohorts), 16,884,049 variants, full summary statistics for sitting height ratio
  adjusted for height and BMI. The RANKL contraindication rests on human paediatric denosumab experience plus non-human-primate
  and rat preclinical data; the OPG-null length effect is mouse.
species_basis: human
translation_risk: moderate
translation_risk_reason: 'MODERATE. The compartment conclusion is human genetics at scale and converges with four
  independent pharmacological lines, so the CNP-is-limb-preferential claim travels well. What does NOT travel is
  any inference from a lead-allele SIGN to a DRUG direction: the beta is per effect allele and the allele''s effect
  on gene function is unknown, so no locus here licenses ''inhibit this''. And the trait is a RATIO adjusted for
  height, so a trunk-favouring allele could act by lengthening trunk OR by shortening leg - a distinction this file
  cannot resolve and which matters enormously for a subject whose goal is total height rather than proportion.'
confidence: B
confidence_reason: Graded B. The CNP-axis result is A on its own terms - NPR3 at P=2.2e-67 and NPPC at 5.6e-23 in
  546k people, with a clean 77:76 base-rate check confirming the sign is informative, and four independent pharmacological
  lines already pointing the same way. The RANK/RANKL band is B, resting on preclinical growth-plate findings plus
  a large IMPC OPG-null effect. TEAD1 is recorded at C - the locus statistic is overwhelming but the direction is
  unknown, IMPC is null, and no cartilage experiment exists. The round is held below A overall by the ratio-versus-absolute
  ambiguity, which is unresolved and which bears directly on whether any of this adds centimetres.
limitations: 'THE CENTRAL AMBIGUITY: sitting height ratio is ADJUSTED FOR HEIGHT, so it measures proportion. A trunk-favouring
  allele may raise the ratio by lengthening the trunk or by shortening the leg, and nothing in this file distinguishes
  them - which means no locus here is demonstrated to ADD total height. Resolving it needs separate sitting-height
  and leg-length GWAS, which are not on disk. Lead-allele beta signs say nothing about whether the allele raises
  or lowers gene function, so no therapeutic direction follows from any row. Gene assignment is by +/-100 kb or
  +/-150 kb window and several windows contain multiple genes (TBX2 with TBX4, NSD1 with FGFR4, SLC39A8 with BANK1),
  so the causal gene is not established. No fine-mapping, colocalisation or MR was performed. SHOX - the canonical
  proportion gene - returned no variants, almost certainly because the pseudoautosomal region is excluded, so the
  panel is missing its most obvious positive control.'
