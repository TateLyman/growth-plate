contradicts: This round does not overturn a prior conclusion; it CONFIRMS the atlas's axial/appendicular claim with
  a half-million-person human anchor and converts it from a pharmacological inference into a selection criterion.
  It CLOSES denosumab as a contraindication and identifies RANK/RANKL as the sixth both-directions-shorten band.
  It adds venetoclax to the contraindication list. It REOPENS one argument for tankyrase - TNKS is trunk-favouring
  at P=7.63e-26, and every previous test that failed to corroborate round 302 was about maturation timing or whole-body
  length rather than compartment. And it puts TEAD1/Hippo on the table for the first time despite baronas2023 having
  named Hippo as one of five enriched pathways in round 311, which the atlas recorded and never followed.
