claim_grades:
- claim: The CNP axis allocates growth preferentially to the limbs rather than the trunk.
  grade: A
  species: human
  source_ref: gcst90728588
  basis: 'NPR3 reaches P=2.20e-67 and NPPC P=5.57e-23 on sitting height ratio adjusted for height in 545,982 people,
    both with limb-favouring lead alleles, while NPR2 reaches only 1.06e-04. NPR3 is the second most significant
    of 46 genes tested. The base-rate check passes - 77 trunk to 76 limb among 153 independent loci - so the sign
    is informative. This converges with four pharmacological lines already in the atlas: navepegritide lowers the
    upper:lower segment ratio, vosoritide is L1-L4 null in the EMA assessment and axial-null in monkeys, and the
    axial dose that works in rats causes scoliosis and kyphosis. GRADE A for the allocation claim; it does NOT license
    any statement about what a CNP analogue adds in total centimetres.'
- claim: Therefore the CNP arm should be stopped in this subject.
  grade: X
  species: human
  source_ref: gcst90728588
  basis: 'NO, and the operator''s own correction is the reason. Population data give the knees 0.3-0.4 cm and the
    trunk 6.5-9.0 cm at bone age 14.5, but this subject''s knees are radiographically OPEN and demonstrably growing
    at bone age 16, which is off that distribution - CORR-195 says population numbers are a prior and not his value.
    What follows is narrower and still useful: the marginal return on the CNP arm is limb-weighted, so any ADDITION
    should be selected for trunk reach. That is a selection criterion the atlas has never applied.'
- claim: RANK/RANKL is a usable lever because two independent loci converge on it.
  grade: X
  species: mouse
  source_ref: impc_statistical_results
  basis: 'NO - it is the SIXTH BAND in this file and both directions shorten. Blocking RANKL removes the osteoclastic
    resorption required to clear hypertrophic cartilage at the chondro-osseous junction: genetic RANKL deficiency
    gives osteopetrosis with RETAINED CARTILAGE, OPG-Fc decreased bone growth in neonatal rats, adolescent monkeys
    at 5-10x the denosumab dose had abnormal growth plates, and metaphyseal band fractures are reported in treated
    children - CORR-292''s jam. The opposite arm shortens too: IMPC Tnfrsf11b (OPG) homozygous null gives body length
    -4.607 at P=4.3e-14, unopposed RANKL and one of the largest length effects among 7,216 genes. DENOSUMAB IS CONTRAINDICATED
    for this goal.'
- claim: A trunk-favouring allele adds trunk length.
  grade: X
  species: human
  source_ref: gcst90728588
  basis: NOT ESTABLISHED, and this is the round's central limitation rather than a detail. The trait is a RATIO
    adjusted for height, so an allele can raise it by lengthening the trunk or by shortening the leg, and these
    are opposite outcomes for a subject who wants total height. Separate sitting-height and leg-length summary statistics
    would resolve it and are not on disk. Every trunk-favouring locus in this round therefore identifies a compartment-allocation
    gene and NOT a height-adding one.
