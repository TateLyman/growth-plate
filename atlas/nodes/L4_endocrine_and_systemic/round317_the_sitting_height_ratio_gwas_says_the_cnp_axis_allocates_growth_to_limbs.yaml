id: round317_the_sitting_height_ratio_gwas_says_the_cnp_axis_allocates_growth_to_limbs
name: ROUND 317 - the 546,000-person sitting-height-ratio GWAS is finally opened, and it tests the atlas's central
  compartment claim rather than restating it. THE ENTIRE CNP AXIS IS A LIMB-ALLOCATION AXIS - NPR3 at P=2.2e-67
  and NPPC at 5.6e-23, both limb-favouring, while NPR2 is nearly null. The stack's largest arm is aimed at the compartment
  with the least left. Plus a sixth band (RANK/RANKL), a new contraindication, and the biggest trunk locus in the
  genome that has chemical matter
