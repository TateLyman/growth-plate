  uncertainty: median; range 0.46-2.59%
- parameter: bioactive IGF as a fraction of total IGF-1, PAPP-A2 deficiency
  value: 0.09-0.32
  unit: '%'
  conditions: homozygous PAPPA2 loss of function, n=5
  species: human
  source_ref: dauber2016
  uncertainty: individual values
localization:
- 'human SYS: plasma; complexes sized by neutral size-exclusion chromatography'
- 'human growth plate: free IGF-1 concentration in physeal interstitium never measured'
human_evidence: direct
human_evidence_note: Human PAPPA2 and IGFALS null alleles produce opposite dissociations between total
  IGF-1 and stature, which is the direct human evidence that bioavailability rather than concentration
  is the controlled variable.
species_basis:
