id: igf_ternary_complex
name: IGF ternary complex and bioavailability layer
aliases:
- 150 kDa ternary complex
- IGF bioavailability control
- free IGF-1 regulation
type: process
layer: L4
stub: false
summary: 'Between ''how much IGF-1 is in the blood'' and ''how much IGF-1 reaches a chondrocyte receptor''
  sits a control layer that most reviews skip. Over 99% of circulating IGF-1 is bound: mostly in a 150
  kDa ternary complex of IGF-1, IGFBP-3 or IGFBP-5, and ALS, which cannot cross the capillary endothelium;
  the remainder is in binary IGFBP complexes. Release requires local proteolysis - PAPP-A2 cleaves IGFBP-3
  and IGFBP-5, PAPP-A cleaves IGFBP-4 - and those proteases are themselves shut off by stanniocalcin-2,
  which covalently locks PAPP-A and excludes its substrate rather than blocking the catalytic site (kobber2022).
  Human genetics shows this layer is load-bearing and can invert the usual reading of an IGF-1 result:
  PAPPA2 loss of function raises total IGF-1 several fold while cutting the bioactive fraction to 0.09-0.32%
  of total against a healthy median of 1.23%, and produces heights of -2.16 to -3.81 SDS (dauber2016).
  IGFALS loss does the opposite, collapsing total IGF-1 with only mild short stature (domen2004). Total
  IGF-1 is therefore a poor proxy for IGF action, and the direction of the error depends on which node
  of this layer is disturbed.'
quantitative:
- parameter: bioactive IGF as a fraction of total IGF-1, healthy reference
  value: '1.23'
  unit: '%'
  conditions: 95 healthy individuals, IGF-1 kinase receptor activation bioassay
  species: human
