id: thyroxine_t4
name: Thyroxine (T4)
aliases:
- T4
- levothyroxine
- prohormone T4
type: hormone
layer: L4
stub: false
summary: 'T4 is the quantitatively dominant secretory product of the thyroid and is essentially a prohormone:
  it has low affinity for thyroid hormone receptors and must be 5''-deiodinated to T3 by DIO1 or DIO2
  to act. Because DIO2 and DIO3 are expressed locally in skeletal tissue, T4 sets a systemic supply while
  local deiodinase balance sets the T3 concentration each tissue actually sees - the reason serum T4 and
  tissue thyroid status can dissociate. Clinically T4 (levothyroxine) is the replacement given in congenital
  hypothyroidism, and in the neonatal-screening era it restores final height to normal, exceeding target
  height in a 215-patient 20-year cohort (delvecchio2015). Notably in that cohort neither age at diagnosis
  nor starting levothyroxine dose predicted final height, which argues the growth endpoint saturates once
  replacement is adequate. In THRA-mutant children free T4 is characteristically low with normal or only
  mildly raised TSH (jorge2025), an unusual pattern that is easily misread as central hypothyroidism.'
