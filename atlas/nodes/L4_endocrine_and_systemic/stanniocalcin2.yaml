id: stanniocalcin2
name: Stanniocalcin-2 (STC2)
aliases:
- STC2
type: protein
layer: L4
stub: false
summary: 'STC2 is a secreted glycoprotein that is the endogenous inhibitor of PAPP-A and PAPP-A2, and
  therefore the top of the IGF bioavailability control layer. Cryo-EM of the 500 kDa 2:2 PAPP-A.STC2 complex
  shows an unusual mechanism: a specific intersubunit disulfide bond covalently locks STC2 onto PAPP-A
  so the complex cannot dissociate, and STC2 contacts a module at the extreme C-terminus of PAPP-A that
  is required for IGFBP-4 binding. The catalytic site itself remains accessible - the inhibited complex
  still hydrolyses a short synthetic IGFBP-4 peptide - so inhibition is by substrate exclusion, not active-site
  blockade (kobber2022). Common human STC2 variants are among the replicated coding-variant associations
  with adult height, and circulating STC2 associates with total IGF-1 in human adults (nimptsch2024).
  STC2 is thus a rare case where the structural mechanism, the human genetics and the human biomarker
  association all point the same way, yet its zonal role in the growth plate has never been examined.'
localization:
- 'human SYS: circulating'
- 'human growth plate: STC2 protein not localised'
human_evidence: indirect
human_evidence_note: Human evidence is genetic association with adult height plus population-level correlation
  of circulating STC2 with total IGF-1; no human monogenic STC2 growth disorder is described.
species_basis:
