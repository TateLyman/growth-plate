reanalysis_observations:
- observation: NR3C1 is detected in all five compartments of both human donors on 4 of 5 probe sets, and
    peaks in the HYPERTROPHIC zone in both donors independently (fold range 2.9 and 4.2). NR3C2 is not
    detected. Neither HSD11B1 nor HSD11B2 is detected.
  interpretation: Glucocorticoid receptor is present throughout the human physis with modest hypertrophic-zone
    enrichment; mineralocorticoid receptor is not a plausible mediator; and there is no detectable local
    11beta-HSD gate, so the tissue sees what the circulation delivers.
  caveats: Transcript only. Says nothing about receptor occupancy at any cortisol exposure.
  reanalysis: p8_01_gse9160_human_zonal
  source_ref: gse9160
  species: human
  grade: D
  date: '2026-08-05'
