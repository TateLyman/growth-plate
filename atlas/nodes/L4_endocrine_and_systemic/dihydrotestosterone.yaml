id: dihydrotestosterone
name: Dihydrotestosterone (DHT)
aliases:
- DHT
- 5alpha-dihydrotestosterone
type: hormone
layer: L4
stub: false
summary: 'DHT is the 5alpha-reduced, non-aromatisable androgen with roughly 5-10 fold higher androgen
  receptor affinity than testosterone. Precisely because it cannot be aromatised, DHT is the reagent that
  tests whether androgens act on the growth plate directly. The evidence says largely not: androgen receptor
  modulation had no effect on longitudinal growth of cultured fetal rat metatarsal bones (chagin2009),
  and human 5alpha-reductase type 2 deficiency, in which DHT is absent from fetal life, is not characterised
  by short stature. What DHT does have is documented sex-specific, receptor-dependent effects on growth
  plate chondrocytes in vitro that require membrane-localised receptors, and an interaction with 1,25(OH)2D3
  in epiphyseal chondrocyte cultures. The reasonable summary is that DHT modulates chondrocyte behaviour
  in culture without a demonstrated effect on longitudinal growth in vivo.'
localization:
- 'rat growth plate: androgen receptor expressed with sex differences in level (van2002)'
- 'human bone: androgen receptor localised immunohistochemically (abu1997)'
- 'human growth plate: DHT effect not tested'
human_evidence: absent
human_evidence_note: No human experiment isolates DHT's growth plate effect; 5alpha-reductase deficiency
  does not produce short stature, which is a weak human negative.
species_basis:
- rat
- in_vitro_animal_cell
- human
translation_risk: high
translation_risk_reason: All positive findings are in vitro rodent chondrocyte cultures.
