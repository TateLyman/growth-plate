id: adrenarche
name: Adrenarche
aliases:
- adrenal androgen maturation
- pubarche (clinical correlate)
type: process
layer: L4
stub: false
summary: 'Adrenarche is the maturation of the adrenal zona reticularis from roughly age 6-8 years, producing
  a rise in DHEA, DHEAS and androstenedione that is independent of the hypothalamic-pituitary-gonadal
  axis and of gonadarche. It is a primate-restricted phenomenon - rodents have no zona reticularis and
  no adrenarche - which is the single most important constraint on animal modelling of this node. Its
  statural effect is a modest acceleration of growth and bone maturation. The clinically informative version
  is premature adrenarche, where advanced bone age might be expected to cost adult height but does not:
  in a cohort of children with premature adrenarche, predicted adult height remained normal despite advanced
  bone age (kanniainen2025). Adrenarche is therefore a case where growth acceleration and skeletal maturation
  advance together and largely cancel, unlike central precocious puberty where estrogen tips the balance
  toward early fusion.'
localization:
- 'human SYS: adrenal zona reticularis -> serum DHEAS'
- 'growth plate: no established direct adrenal androgen action distinguishable from aromatisation'
human_evidence: direct
human_evidence_note: Adrenarche is defined and quantified in human cohorts by serum DHEAS trajectories
  and bone age; premature adrenarche cohorts provide the growth outcome data.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: Adrenarche does not occur in rodents; only humans and some other primates have
  a zona reticularis that matures in this way, so there is nothing to translate.
