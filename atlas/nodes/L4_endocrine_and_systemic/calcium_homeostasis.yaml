summary: 'Extracellular ionised calcium is held within a few percent by a fast loop (CASR on parathyroid
  cells sets PTH secretion within minutes) and a slow loop (PTH-driven renal CYP27B1 raises calcitriol
  and hence intestinal absorption over hours to days). For the growth plate, calcium matters chiefly as
  the cation of hydroxyapatite at the zone of provisional calcification, and severe hypocalcaemia produces
  rickets. Its role is however subordinate to phosphate in the specific mechanism of rachitic growth plate
  expansion: in mouse models that separate the variables, it is phosphate, not calcium or PTH, whose normalisation
  restores caspase-9-mediated hypertrophic chondrocyte apoptosis and prevents the expanded hypertrophic
  layer (sabbagh2005). Dietary calcium intake influences childhood growth in populations with low intake,
  but the effect size in well-nourished populations is small.'
localization:
