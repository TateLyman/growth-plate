summary: 'IGFBP-3 carries roughly 75-90% of circulating IGF-1 and is the principal partner, with ALS,
  in the 150 kDa ternary complex. Its synthesis is GH- and STAT5B-dependent, which is why serum IGFBP-3
  falls in GH deficiency, GHR deficiency (Laron) and STAT5B deficiency and is used clinically as a GH-dependent
  analyte. IGFBP-3 is the main substrate through which PAPP-A2 releases IGF-1: in human PAPP-A2 deficiency
  IGFBP-3 rises to 4403-5912 ug/L against a Tanner I reference of 2206-4200 ug/L while free IGF-1 falls,
  and size-exclusion chromatography shows the IGF is retained in ternary complex (dauber2016). Human ALS
  deficiency collapses IGFBP-3 as well, because the ternary complex protects it from clearance (domen2004).
  This node belongs to the IGF bioavailability control layer - ternary complex formation (IGFBP-3/-5 plus
  ALS), pericellular proteolysis (PAPP-A, PAPP-A2) and protease inhibition (STC1, STC2) - which sets the
  free IGF-1 concentration seen by chondrocyte IGF1R independently of total IGF-1. Reviews typically stop
  at ''IGF-1 level''; the human PAPPA2 kindreds show that total and free IGF-1 can move in opposite directions
  and that stature tracks the free fraction.'
