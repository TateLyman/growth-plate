- estradiol
type: hormone
layer: L4
stub: false
summary: '17beta-estradiol is the dominant estrogen of puberty in both sexes and the hormone that both
  drives the pubertal growth spurt and terminates growth. In boys almost all of it is produced by peripheral
  aromatisation of testosterone rather than by the gonad. Concentrations are extremely low relative to
  assay sensitivity: with an ultrasensitive extraction RIA (detection limit 4 pmol/L) the 24-h mean in
  boys rises from below 4 pmol/L prepubertally to 6 pmol/L in early puberty, 8 pmol/L in mid-puberty,
  21 pmol/L in late puberty and 32 pmol/L once final height is reached (ankarberglindg2008), which is
  why routine immunoassays are inadequate for pediatric work. The growth-relevant dose-response has been
  fitted directly in humans: half-maximal pubertal growth acceleration occurs at a morning estradiol of
  20 pmol/L in girls (95% CI 13-31; albin2012) and 6.5 pmol/L in boys (95% CI 3.2-13; albin2013). Above
  roughly the Tanner B2 range (10-51 pmol/L) less than 25% of potential pubertal growth remains - i.e.
  the stimulating and terminating actions are separated by well under one order of magnitude in concentration.'
