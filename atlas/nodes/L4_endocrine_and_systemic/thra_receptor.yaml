paralog_audit: at_risk
paralog_audit_date: '2026-08-05'
paralog_risk: T3 binds TRalpha and TRbeta with comparable affinity, and both are protein-detected in the
  same RZ/PZ chondrocytes (robson2000) with no relative abundance measurement. gthe1999 shows TRalpha1(-/-)beta(-/-)
  double nulls have retarded growth and bone maturation not found in either single null, and that single
  deletions reveal only a small proportion of hypothyroid phenotypes - so no single-gene phenotype assigns
  the chondrocyte T3 response to an isoform. See g_para_005.
reanalysis_observations:
- observation: 'P8-01: THRA is detected in all five compartments of both human donors (3 of 7 probe sets).
    THRB is likewise detected in all five, hypertrophic-maximal in both donors. Both receptors are present
    in human physis, so the isoform-assignment problem the paralog audit identified is live in human tissue
    and is not a mouse artefact. Separately, MCT8/MCT10/OATP1C1 are all undetectable while LAT1 is present
    in every zone.'
