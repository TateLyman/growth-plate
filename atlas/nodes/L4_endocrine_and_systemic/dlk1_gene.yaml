type: gene
layer: L4
stub: false
summary: DLK1 is a paternally expressed imprinted gene in the 14q32 DLK1-DIO3 domain encoding a transmembrane
  EGF-repeat protein that acts as a non-canonical NOTCH inhibitor and is shed as a soluble fragment. Paternally
  inherited DLK1 deletion causes familial central precocious puberty (dauber2017), making it the second
  imprinted puberty brake after MKRN3 and placing two independently imprinted loci in the same functional
  role. Loss of the whole 14q32 paternal contribution (Temple syndrome) combines precocious puberty with
  pre- and postnatal growth restriction, so DLK1 dosage affects growth as well as pubertal timing; DLK1
  also links reproduction to metabolism, with affected individuals showing increased adiposity and insulin
  resistance. The same imprinted domain contains DIO3, the thyroid hormone-inactivating deiodinase, which
  means the L4 thyroid and puberty modules share a genomic control region.
localization:
- 'human SYS: hypothalamus, adrenal, adipose; soluble DLK1 measurable in serum'
- 'growth plate: DLK1 expression not established in human physis'
human_evidence: direct
human_evidence_note: Paternally inherited DLK1 deletions segregate with central precocious puberty in
  families, and Temple syndrome provides the broader imprinting phenotype.
