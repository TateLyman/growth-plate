id: round420_the_androgen_arm_is_real_direct_and_male_specific_and_its_human_effect_is_extinguished_after_16
name: >-
  R420: the androgen arm worked to the end. This atlas's own androgen_receptor node CLOSED it on a
  misread of the CAIS evidence and a rat null that tested the wrong ligand in fetal tissue. Reopened,
  the arm is REAL, DIRECT, MALE-SPECIFIC and DHT-MEDIATED, and a 46,XY human without a functional AR
  loses 1.9 cm/yr of peak height velocity and ends 0.6 SD below male norms. It still does not open a
  lever here - the human dose-response is EXTINGUISHED AFTER AGE 16 - but it hardens finasteride and
  dutasteride from a mechanistic guess into a measured result in the target cell type
aliases:
  - androgen receptor growth plate reopened
  - CAIS adult height
  - AR CAG repeat height age limit
  - finasteride growth plate
  - SRD5A1 chondrocyte
type: hypothesis
layer: L4
stub: false
summary: >-
  R419 found that the androgen axis has 106 files, its own oxandrolone node and a human adult-height
  meta-analysis while CLAUDE.md had never said the word. R420 works it to a conclusion. The atlas already
  contained an `androgen_receptor` node that CLOSED the arm - "expressed but not demonstrated to be
  required for longitudinal growth, with androgen's growth effect running predominantly through
  aromatisation to estradiol" - and that closure was never in CLAUDE.md either, which is CORR-352's point
  that the ledger is lossy in BOTH directions.

  ⛔ ONE - THE CLOSURE IS WRONG ON MECHANISM, AND IT FAILS IN THE SAME WAY THIS FILE HAS FAILED BEFORE.
  It rested on two things.
  · `chagin2009` - fetal rat metatarsal culture, neither oxandrolone nor testosterone nor flutamide
    changed growth. It is a better null than expected: BOTH sexes, agonist AND antagonist, 1 nM to 10 uM,
    and the IGF-I positive control fired at p<0.001. But TWO THINGS SURVIVE IT.
    ① IT NEVER TESTED DHT. It tested testosterone and oxandrolone, and the mechanism nominates DHT.
    ② It is FETAL, embryonic day 20 - before a secondary ossification centre exists, and R362/R368
      established that the plate acquires self-renewal AT SOC formation. Pre-niche tissue is exactly the
      stage where R368 showed hedgehog agonism has the OPPOSITE sign.
  · CAIS - read here as "taller than average females", which is THE WRONG COMPARATOR. The question for a
    46,XY subject is height against MALE norms.

  ⭐⭐ TWO - AND AGAINST MALE NORMS THE HUMAN NATURAL EXPERIMENT SAYS THE OPPOSITE OF WHAT THE NODE SAYS.
  · `danilovic2007` - 8 complete and 7 partial AIS patients with proven AR mutations, measured against
    BOTH reference populations: FINAL HEIGHTS WERE INTERMEDIATE BETWEEN FEMALE AND MALE PREDICTIONS, with
    a lumbar spine BMAD deficit (z female -1.56, P=0.006; z male -0.75, P=0.04) and a normal femoral neck.
    The authors' own conclusion is that the data suggest AN IMPORTANT ROLE FOR ANDROGENS IN NORMAL MALE
    GROWTH AND BONE DENSITY NOT REPLACED BY OESTROGENS.
  · `zachmann1986` puts numbers on it in 8 AIS patients with spontaneous puberty: MEAN ADULT HEIGHT
    172.3 cm = MINUS 0.6 SD versus normal men and PLUS 1.4 SD versus normal women; PEAK HEIGHT VELOCITY
    7.4 cm/yr, identical to normal girls at 7.3 and far below normal boys at 9.3; age at peak velocity
    12.7 years, closer to girls. Bone age tracked MALE standards.
  · `zhao2022ais` - 118 untreated AIS children across eight centres: height runs at +1 SD until age 12 and
    then DIVERGES, falling toward -1 SD on the boys' chart while rising toward +2 SD on the girls'. The
    loss happens AT PUBERTY, which is when an androgen contribution should act.
  → A 46,XY INDIVIDUAL WITH TESTOSTERONE, INTACT AROMATISATION AND A Y CHROMOSOME, BUT NO FUNCTIONAL AR,
  LOSES ABOUT 1.9 cm/yr OF PEAK VELOCITY AND ENDS 0.6 SD BELOW MALE NORMS. That is the direct human
  quantification of the androgen receptor's contribution to male height, and this atlas had it filed as
  evidence for the opposite conclusion. CORR-309's shape on a natural experiment rather than a paper.

  ⭐⭐⭐ THREE - AND THE MECHANISM IS SPECIFIC, MALE-ONLY, AND RUNS THROUGH 5-ALPHA-REDUCTASE.
  `raz2005`, rat costochondral growth-plate chondrocytes separated into resting zone and growth zone:
  · ONLY MALE CELLS RESPOND to testosterone, although receptors are present in both sexes.
  · Testosterone and DHT give comparable dose-dependent rises in thymidine incorporation and alkaline
    phosphatase in male GROWTH-ZONE cells.
  · ⭐ INHIBITING 5-ALPHA-REDUCTASE WITH FINASTERIDE (1, 5, 10 ug/mL) REDUCED THE MALE GROWTH-ZONE
    RESPONSE TO TESTOSTERONE DOSE-DEPENDENTLY - metabolism to DHT is REQUIRED.
  · ⭐ THE ISOFORM IS NAMED: both sexes express SRD5A1 mRNA and NEITHER expresses SRD5A2; male cells have
    5-alpha-reductase ACTIVITY and female cells have none detectable.
  · Resting-zone cells behave differently from growth-zone cells - testosterone DECREASED DNA synthesis in
    male resting-zone cells while DHT had no effect - so the arm is zone-specific as well as sex-specific.
  `cohen2021` extends it: DHT activates PKC in male cells, AR inhibition blocks it, AR translocates to
  plasma-membrane caveolae - AND INHIBITION OF ER-ALPHA AND ER-BETA ALSO BLOCKS IT. The androgen and
  oestrogen receptors form a membrane complex, so the two arms are PHYSICALLY COUPLED rather than
  independent, which is a caution for any reasoning that treats them as separable.

  ⛔⛔ FOUR - AND THEN THE ARM CLOSES FOR THIS SUBJECT, ON A HUMAN DOSE-RESPONSE WITH AN AGE LIMIT.
  `vanderwerff2011` - two Dutch cohorts, 226 subjects followed 13 to 36 years and 244 followed 8 to 14.
  The AR CAG repeat correlates INVERSELY with receptor transactivation, so repeat length is a graded
  natural instrument on AR function. HEIGHT SDS WAS INVERSELY ASSOCIATED WITH CAG LENGTH IN BOYS AT YOUNG,
  PREPUBERTAL AND EARLY PUBERTAL AGE - more androgen-receptor activity, taller.
  ⛔ THE ASSOCIATION DIMINISHES OVER THE FOLLOWING YEARS AND COMPLETELY DISAPPEARS AFTER THE AGE OF 16.
  → THE ONE GRADED HUMAN MEASUREMENT OF AR FUNCTION AGAINST HEIGHT IS EXTINGUISHED AT PRECISELY THIS
  SUBJECT'S AGE. Not "no molecule" and not "wrong direction" - the window for this particular arm has
  closed for him while remaining real for younger boys.

  ⛔ FIVE - AND TWO INDEPENDENT REASONS AGREE, SO THE CONCLUSION DOES NOT REST ON ONE STUDY.
  · STEP 0 SUBSTITUTION: `ferris2017` measured peak testosterone at 1156 +/- 302 ng/dL in Tanner IV-V boys
    ON AN AROMATASE INHIBITOR. This subject is on anastrozole. The androgen channel is already being
    pushed hard by a drug already in the stack, and CORR-297 says an addition that moves an occupied
    channel is a substitution question, not biology.
  · THE ONE HUMAN HEAD-TO-HEAD RUNS AGAINST THE NON-AROMATISABLE AGENT: `wang2026`'s subgroup has
    TESTOSTERONE BEATING OXANDROLONE BY 2.64 cm on attained adult height, in boys with constitutional
    delay - a restoration population, so CORR-203 applies to the whole comparison anyway.
  → OXANDROLONE, SARMs AND ANY NON-AROMATISABLE ANDROGEN ARE NOT PROMOTED.

  ⭐⭐ SIX - WHAT THE ROUND DOES DELIVER: R419's FINASTERIDE CONTRAINDICATION GOES FROM GRADE E TO A
  MEASURED PHARMACOLOGICAL RESULT IN THE TARGET CELL TYPE. R419 recorded it as mechanistic inference from
  `elbaradie2012`. `raz2005` had already done the experiment: finasteride, at three concentrations, DOSE-
  DEPENDENTLY REDUCED THE RESPONSE OF MALE GROWTH-PLATE CHONDROCYTES TO TESTOSTERONE.
  ⭐ AND IT SHARPENS WHICH DRUG: the chondrocyte isoform is SRD5A1, and SRD5A2 is ABSENT. Finasteride is
  a preferential type-2 inhibitor and still blocked the response at the concentrations tested;
  DUTASTERIDE INHIBITS BOTH TYPE 1 AND TYPE 2, so on isoform grounds dutasteride is the worse choice of
  the two near an open male growth plate.
  ⛔ Still grade D not A: rat costochondral cells in vitro, no bone-length endpoint for any
  5-alpha-reductase inhibitor in any species, and SRD5A1/SRD5A2 carry no signal in kosmicki2026's 207
  (R359). Free to ask and free to stop, which is the entire argument for recording it.

  ⭐ WHAT R420 SETTLES. The androgen arm is not a phantom - it is a real, direct, male-specific,
  DHT-mediated, zone-specific input to the growth plate that a human without it pays 0.6 SD of adult height
  for. The atlas had closed it on the wrong comparator and an untested ligand, and that closure is now
  corrected. It nonetheless yields no addition for this subject, because the human effect is extinguished
  after 16 and because the AI already drives the channel. Its usable output is a subtraction, not an
  addition.
