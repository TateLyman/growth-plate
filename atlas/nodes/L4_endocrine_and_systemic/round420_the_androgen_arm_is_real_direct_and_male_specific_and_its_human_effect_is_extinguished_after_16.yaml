localization: >-
  growth plate - androgen receptor in 65 percent of resting-zone, 41 percent of proliferative and 58
  percent of hypertrophic chondrocytes in human boys at every Tanner stage (nilsson2003 via R354); the
  functional testosterone response is confined to MALE cells and to the GROWTH zone (raz2005)
human_evidence: direct
human_evidence_note: >-
  Adult height and peak velocity in androgen insensitivity, and the CAG-repeat dose-response, are human.
  The DHT mechanism and the finasteride block are rat chondrocytes in vitro.
species_basis:
  - human
  - rat
translation_risk: moderate
translation_risk_reason: >-
  The human evidence establishes that the arm exists and quantifies its size, but the mechanism and the
  finasteride result are rat in vitro with no bone-length endpoint.
confidence: B
claim_grades:
  - claim: The androgen receptor makes a direct contribution to male adult height
    grade: B
    basis: >-
      two independent human AIS series with the correct male comparator, a third registry showing the
      divergence begins at puberty, and a graded CAG-repeat dose-response in 470 subjects
  - claim: The atlas's previous closure of the androgen arm was wrong on mechanism
    grade: B
    basis: >-
      it read CAIS against female rather than male norms, and its rat null tested testosterone and
      oxandrolone but never DHT, in fetal tissue that predates the secondary ossification centre
  - claim: The growth-plate androgen response is male-specific and requires 5-alpha-reduction to DHT
    grade: C
    basis: rat costochondral chondrocytes in vitro, one laboratory group, no length endpoint
  - claim: The human AR effect on height is extinguished after age 16
    grade: C
    basis: >-
      a single longitudinal observational study, two cohorts, using CAG repeat length as a proxy for
      receptor function. Directionally consistent with the AIS divergence appearing at puberty, but one
      study and an indirect instrument
  - claim: An androgen should be added to this stack
    grade: E
    basis: >-
      NO. The human effect is extinguished at his age, the aromatase inhibitor already drives testosterone
      to about 1156 ng/dL in late-pubertal boys, and testosterone beat oxandrolone by 2.64 cm in the only
      human head-to-head, in a restoration population
  - claim: 5-alpha-reductase inhibitors are a cost near an open male growth plate
    grade: D
    basis: >-
      finasteride dose-dependently blocked the male chondrocyte testosterone response in vitro. No
      bone-length endpoint in any species and no population height signal at SRD5A1 or SRD5A2
