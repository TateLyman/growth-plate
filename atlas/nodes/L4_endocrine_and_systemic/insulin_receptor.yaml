id: insulin_receptor
name: Insulin receptor (INSR)
aliases:
- INSR
- IR-A
- IR-B
type: protein
layer: L4
stub: false
summary: INSR is an alpha2beta2 receptor tyrosine kinase that heterodimerises with IGF1R to form hybrid
  receptors; the A isoform (exon 11 skipped) binds IGF-2 with near-insulin affinity, which matters in
  humans where IGF-2 remains abundant postnatally. Biallelic INSR loss of function causes Donohue syndrome
  (leprechaunism) with extreme intrauterine and postnatal growth failure that hyperinsulinaemia cannot
  rescue, establishing an insulin-receptor requirement for human growth that is separable from the IGF1R
  requirement. Hybrid INSR/IGF1R receptors mean that at the chondrocyte surface insulin and IGF signalling
  are not cleanly separable pharmacologically. INSR protein has not been quantified by zone in human growth
  plate.
localization:
- 'human SYS: ubiquitous'
- 'human growth plate: INSR and INSR/IGF1R hybrid abundance not quantified by zone'
human_evidence: direct
human_evidence_note: Donohue and Rabson-Mendenhall syndromes are human biallelic INSR loss-of-function
  disorders with severe growth failure.
species_basis:
- human
- rat
translation_risk: low
translation_risk_reason: The requirement is established by human null alleles.
confidence: B
