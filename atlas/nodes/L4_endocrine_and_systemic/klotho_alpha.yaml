summary: alpha-Klotho is a single-pass transmembrane glycoprotein, expressed mainly in the distal renal
  tubule, parathyroid and choroid plexus, that is the obligate co-receptor converting FGFR1c into a high-affinity
  FGF23 receptor. Without alpha-Klotho, FGF23 cannot signal at physiological concentrations, which is
  why human alpha-Klotho loss of function phenocopies FGF23 deficiency (hyperphosphataemic tumoural calcinosis)
  and why Klotho-null mice show accelerated ageing with hyperphosphataemia. A shed ectodomain circulates
  as soluble Klotho with FGF23-independent activities. For the growth plate, alpha-Klotho's role is entirely
  through gating the FGF23-phosphate axis; there is no established Klotho expression in growth plate chondrocytes
  in human tissue, and the beta-Klotho paralogue relevant to FGF21/FGF15-19 signalling is a distinct protein
  (held separately in L3).
localization:
- 'human SYS: distal renal tubule, parathyroid, choroid plexus'
- 'human growth plate: alpha-Klotho expression not established'
human_evidence: direct
human_evidence_note: Human KL loss-of-function causes hyperphosphataemic tumoural calcinosis with FGF23
  resistance, and a translocation causing Klotho overexpression caused hypophosphataemic rickets.
