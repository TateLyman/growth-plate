id: dheas_hormone
name: DHEAS (dehydroepiandrosterone sulfate)
aliases:
- DHEAS
- DHEA-S
type: hormone
layer: L4
stub: false
summary: DHEAS is the sulfated, long-half-life circulating form of DHEA, produced by SULT2A1 in the adrenal
  zona reticularis. Because its half-life is hours rather than minutes and it lacks diurnal variation,
  DHEAS is the standard biochemical marker of adrenarche. DHEAS itself is essentially inactive at the
  androgen receptor; it is a reservoir that peripheral steroid sulfatase and 3beta-HSD convert to active
  androgens and, by aromatisation, to estrogens. Its growth relevance is as a quantitative index of the
  adrenarchal androgen supply rather than as a direct effector, and childhood DHEAS concentration prospectively
  predicts more advanced pubertal development several years later. Children with premature adrenarche
  have raised DHEAS and advanced bone age but preserved predicted adult height (kanniainen2025).
localization:
- 'human SYS: adrenal zona reticularis -> serum'
- 'growth plate: DHEAS not shown to act directly on chondrocytes'
human_evidence: direct
human_evidence_note: DHEAS is measured directly in human cohorts and prospectively associates with pubertal
  timing and bone age advance.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: Rodents do not produce adrenal DHEAS in the human pattern.
confidence: B
