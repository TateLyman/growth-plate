id: estrogen_receptor_beta
name: Estrogen receptor beta (ESR2 / ERbeta)
aliases:
- ESR2
- ERbeta
- NR3A2
type: protein
layer: L4
stub: false
summary: 'ERbeta is the second nuclear estrogen receptor. It is expressed in growth plate cartilage and
  can heterodimerise with ERalpha, where it generally damps ERalpha-driven transcription. Its role in
  longitudinal growth is secondary and, unlike ERalpha, is not supported by a human experiment of nature:
  no ESR2 inactivating mutation with continued growth and unfused epiphyses has been described, and Esr2-null
  mice have essentially normal longitudinal bone growth. Sex-specific in vitro work in rat costochondral
  chondrocytes shows 17beta-estradiol responses that require BOTH ERalpha and ERbeta and depend on receptor
  palmitoylation for membrane translocation, so ERbeta may matter more for rapid membrane-initiated signalling
  than for the nuclear closure programme. The practical consequence is that estrogen''s growth-terminating
  action should be attributed to ERalpha; attributing it to ''estrogen receptors'' generically overstates
  ERbeta''s role.'
localization:
- 'rodent growth plate: ERbeta expressed in chondrocytes'
- 'human growth plate: ERbeta protein not quantified by zone'
human_evidence: absent
human_evidence_note: No human ESR2 loss-of-function skeletal growth phenotype has been reported, in contrast
  to ESR1.
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: Rodent in vitro data attribute part of the estradiol response to ERbeta, but
  there is no human phenotype to anchor this and no human physeal measurement.
confidence: D
