paralog_audit_date: '2026-08-05'
paralog_audit_note: The node negative - that estrogen growth termination should be attributed to ERalpha
  - is now backed by the single AND the double knockout (vidal2000 BERKO and DERKO arms). Confidence deliberately
  NOT raised; the node remains human-evidence-absent.
reanalysis_observations:
- observation: ESR2 is represented by six probe sets and is not detected in either human donor in any
    of the five compartments, in the same samples where ESR1 is detected in four of five.
  interpretation: On this evidence ERbeta is not a candidate mediator of estrogen action at the human
    physis at 11-13 years, which is consistent with the human ESR1-null case and with the absence of a
    comparable ESR2 human phenotype.
  caveats: Transcript only, two donors, one platform.
  reanalysis: p8_01_gse9160_human_zonal
  source_ref: gse9160
  species: human
  grade: D
  date: '2026-08-05'
- observation: CORROBORATED across independent donors and platforms. ESR2 median percentile 39.2 / 22.4
    / 21.8 across the three P8-02 series, not detected at any stringency, while ESR1 is detected at every
    stringency in all three. With P8-01 this is four datasets, four platform families and roughly ten
    donors agreeing, with a working internal control on every one.
  interpretation: 'The absence of local aromatase and of ERbeta in human growth plate is the one P8-01
    negative that survived independent replication - the other three did not. Estrogen action at the human
    physis runs through ERalpha on circulating hormone. Grade moves D -> C per the P8-02 preregistration:
    replicated across independent donors and platforms, still transcript-only, and NOT to B, because a
    non-detection in bulk tissue is neither human genetic nor interventional evidence.'
  caveats: Aromatase is a low-abundance enzyme and bulk tissue can dilute a zonally-restricted transcript
    below detection - NPR3 does exactly that in these same datasets. This is a bounded negative, not proof
    of absence.
  reanalysis: p8_02_independent_corroboration
  source_ref: gse9160
  species: human
  grade: C
  date: '2026-08-05'
