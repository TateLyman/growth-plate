  year: 2000
  type: primary
  one_line_finding: 'ERalpha-KO (ERKO), ERbeta-KO (BERKO) and DOUBLE ERalpha/beta-KO (DERKO) male mice
    compared head to head: ERKO and DERKO but NOT BERKO show decreased longitudinal and radial skeletal
    growth with decreased serum IGF-1. The estrogen receptor double perturbation has been done and removing
    ERbeta adds nothing over removing ERalpha alone.'
last_verified: '2026-08-05'
