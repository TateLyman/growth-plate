id: somatomedin_hypothesis
name: Somatomedin hypothesis
aliases:
- classical somatomedin hypothesis
- endocrine IGF-1 hypothesis
type: hypothesis
layer: L4
stub: false
summary: 'The somatomedin hypothesis (Salmon and Daughaday, 1957) states that GH does not act on cartilage
  itself but stimulates the liver to release a circulating mediator - later identified as IGF-1 - which
  is the proximate growth stimulus at the plate. Two independent liver-specific Igf1 deletions in mouse
  falsified the strong form. Yakar 1999 deleted hepatic Igf1 by Cre/loxP and found body weight, body length
  and femoral length indistinguishable from littermates despite near-complete loss of hepatic Igf1 mRNA;
  Sjogren 1999 obtained the same result with a 75% fall in serum IGF-1 (sjgren1999). Both confirm the
  liver is the principal SOURCE of blood IGF-1 while denying that blood IGF-1 is the principal DRIVER
  of postnatal growth. A weaker, threshold form survives: LID plus ALS-knockout double mutants, in which
  serum IGF-1 falls further, do show reduced linear growth with a shorter total growth plate and shorter
  proliferative and hypertrophic zones, 10% lower bone mineral density and >35% lower periosteal circumference,
  all partly restored by 4 weeks of IGF-1 (yakar2002). These are mouse data. The equivalent partition
  has never been made in humans.'
