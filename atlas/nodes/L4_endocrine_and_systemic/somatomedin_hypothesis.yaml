translation_risk: high
translation_risk_reason: The falsification and the surviving threshold form are both mouse-only; mice
  reach adult size without epiphyseal fusion and their IGF-1 ternary complex biology differs quantitatively
  from human. Reviews routinely state the LID result as if it were a general fact about mammals.
