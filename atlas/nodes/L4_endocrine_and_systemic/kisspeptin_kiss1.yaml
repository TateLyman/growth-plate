id: kisspeptin_kiss1
name: Kisspeptin (KISS1)
aliases:
- KISS1
- metastin
- kisspeptin-54
type: hormone
layer: L4
stub: false
summary: 'Kisspeptin is the product of KISS1, processed to peptides of 54, 14, 13 and 10 residues sharing
  a C-terminal RF-amide motif, and is the principal excitatory drive onto GnRH neurons. Arcuate kisspeptin
  neurons co-express neurokinin B and dynorphin (KNDy neurons) and generate the GnRH pulse; they are also
  where sex steroid negative feedback is integrated. Kisspeptin''s relevance to the growth plate is entirely
  upstream: it sets the timing of the sex steroid rise that produces the growth spurt and, later, epiphyseal
  fusion. The genetic proof came from loss of its receptor rather than the ligand - two independent 2003
  reports of GPR54/KISS1R loss of function in consanguineous families with normosmic hypogonadotropic
  hypogonadism (seminara2003, de2003) - and MKRN3 acts as a brake on puberty specifically through kisspeptin-expressing
  neurons (abreu2020).'
localization:
- 'human SYS: hypothalamic arcuate and AVPV kisspeptin neurons'
- 'growth plate: no established local action'
human_evidence: direct
human_evidence_note: Human KISS1R (and rarer KISS1) loss-of-function mutations cause absent puberty; kisspeptin
  administration to humans releases LH, a direct interventional confirmation.
species_basis:
