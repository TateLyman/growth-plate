stub: false
summary: 'KISS1R is a Gq/11-coupled receptor on GnRH neurons; kisspeptin binding raises intracellular
  Ca2+ and depolarises the neuron, generating the GnRH pulse. Its identification in 2003 by two independent
  groups studying consanguineous families with normosmic hypogonadotropic hypogonadism (seminara2003,
  de2003) is one of the cleanest human forward-genetic results in reproductive endocrinology, and gain-of-function
  KISS1R variants have subsequently been reported in central precocious puberty, giving bidirectional
  human dosage evidence. For stature the consequence is indirect but large: absent KISS1R signalling means
  no pubertal sex steroid rise, hence no growth spurt but also no estrogen-driven epiphyseal fusion, so
  untreated patients continue growing into adulthood with eunuchoid proportions - a natural human demonstration
  that the spurt and the cessation are both downstream of this receptor.'
localization:
- 'human SYS: GnRH neuron plasma membrane'
- 'growth plate: no established expression'
human_evidence: direct
human_evidence_note: Biallelic KISS1R loss of function causes human hypogonadotropic hypogonadism; activating
  variants have been reported in central precocious puberty.
