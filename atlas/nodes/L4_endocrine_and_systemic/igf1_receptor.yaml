id: igf1_receptor
name: IGF-1 receptor (IGF1R)
aliases:
- IGF1R
- type 1 IGF receptor
type: protein
layer: L4
stub: false
summary: IGF1R is a disulfide-linked alpha2beta2 receptor tyrosine kinase closely homologous to the insulin
  receptor, with which it forms hybrid receptors. Ligand binding autophosphorylates the beta-subunit activation
  loop and recruits IRS-1/2 and Shc, driving PI3K-AKT (survival, cell size, protein synthesis) and RAS-ERK
  (proliferation). IGF1R binds IGF-1 with roughly 100-fold higher affinity than insulin, which is why
  insulin's growth effects are mostly indirect (alarid1992). At the growth plate IGF1R is the receptor
  through which both circulating and locally produced IGF-1 act, so it is the convergence point at which
  the somatomedin and dual-effector accounts become indistinguishable at the level of the chondrocyte.
  Human IGF1R haploinsufficiency causes intrauterine and postnatal growth restriction with elevated IGF-1
  and relative GH resistance; biallelic loss is not viable. Zonal quantification of IGF1R protein or occupancy
  in human growth plate has not been reported.
localization:
- 'human growth plate: IGF1R protein not quantified by zone'
- 'rodent PZ: IGF1R expression reported but not quantified against local ligand concentration'
human_evidence: direct
human_evidence_note: IGF1R haploinsufficiency and heterozygous missense variants cause human pre- and
  postnatal growth restriction with raised circulating IGF-1, an unambiguous human loss-of-function phenotype.
species_basis:
- human
- mouse
- rat
translation_risk: low
translation_risk_reason: Human genetic evidence is direct and reproducible across unrelated patients.
confidence: A
