id: round477_the_adam12_plate_phenotype_is_an_igf_phenotype_and_the_modality_is_what_fails
name: >-
  R477 - the ADAM12-S plate phenotype IS the canonical IGF-I signature, against my own hypothesis; and on
  this axis chronic transgenic secretion lengthens bone TWICE while recombinant protein injection fails TWICE
aliases:
  - IGFBP protease class
  - PAPPA2 human loss of function
  - transgenic versus recombinant modality
type: hypothesis
layer: L4
stub: false
confidence: C
last_verified: '2026-08-27'
species_basis: human, mouse, rat, zebrafish
human_evidence: direct
human_evidence_note: >-
  dauber2016 is a five-patient two-family human loss-of-function series for PAPPA2 with height SDS, total
  and free IGF-I, IGFBP-3, IGFBP-5, ALS and IGF-II in every patient, plus rhIGF-1 treatment response across
  three centres. The ADAM12 arm itself has no human intervention.
translation_risk: moderate
translation_risk_reason: >-
  The zone-signature argument rests on hypophysectomy restoration (hunziker1994) and germline nulls
  (wang1999, wang2004), i.e. deficient systems, so CORR-203 applies to the magnitudes if not to the shape.
  The two positive length results are transgenic overexpression from conception in mice.
summary: >-
  I PRIVATELY REASONED THE OPPOSITE AND THE PRIMARY LITERATURE REFUTES IT. R466/R469 established that
  ADAM12-S widens the growth plate ONLY in the collagen type X-positive region with cells per column
  UNCHANGED, and I read that as not looking like an IGF phenotype - which would have cleared Step 0 by
  putting ADAM12-S on matrix proteolysis rather than on the GH/IGF-1 arm this file prices at about zero
  attained height after mid-puberty. THREE PRIMARIES SAY THAT IS EXACTLY THE IGF-I SIGNATURE. hunziker1994
  Fig 2B: PROLIFERATIVE CELLS PER COLUMN ARE 14 FOR SALINE, IGF-I AND NORMAL ALIKE while GH is significantly
  higher at 18, and hypertrophic cells per column run 8, 12, 16, 12 - so IGF-I raises the hypertrophic zone
  from 114 to 207 um and leaves proliferative cells per column exactly at control. wang1999: the Igf1-null
  has NORMAL chondrocyte numbers and proliferation with terminal hypertrophic cells 30 per cent shorter,
  accounting for most of a 35 per cent growth deficit, and normal ColX. wang2004 separates the two arms in
  one paper: Igf1-null gives an ENLARGED germinal zone with normal proliferation and reduced hypertrophy,
  Ghr-null a HYPOPLASTIC germinal zone with reduced proliferation. GH GENERATES CHONDROCYTES, IGF-I ENLARGES
  THEM - so the ADAM12-S phenotype is an IGF-I phenotype and the IGFBP-3/-5 proteolysis mechanism
  (loechel2000) is load-bearing rather than incidental. The Step-0 defence therefore reverts to R326's
  yakar2016 split - circulating IGF-1 drives RADIAL growth, LOCAL IGF-1 drives LONGITUDINAL - which is the
  identical argument that let R341 reopen STC2, plus the fact that IGFALS is 0 of 14 in the human plate.
  THE HUMAN ANCHOR FOR THE WHOLE AXIS IS BETTER THAN THIS FILE HAD RECORDED. dauber2016: five patients, two
  families, homozygous PAPPA2 loss - height SDS -1.10, -0.96, -3.81, -2.82, -3.14, with TOTAL IGF-I HIGH,
  IGFBP-3 HIGH, IGFBP-5 high in four of five and IGF-II high in all five, while FREE IGF-I IS LOW in four of
  five and the bioactive-to-total ratio is reduced in all five. Losing an IGFBP-3/-5 protease leaves the
  total pool elevated and the free pool depleted and the patients are short. rhIGF-1 roughly doubles height
  velocity across three centres and two patients reached target height.
  AND THE FINDING THAT MATTERS MOST FOR WHAT TO DO NEXT: ON THIS AXIS, CHRONIC TRANSGENIC SECRETION
  LENGTHENS A NORMAL BONE TWICE AND RECOMBINANT PROTEIN INJECTION FAILS TWICE. Positive: kveiborg2006
  ADAM12-S from a muscle creatine kinase promoter, femur +8, +9 and +17 per cent; qin2006pappa
  osteoblast-specific PAPP-A under Col1a1, FEMUR LENGTH 107 per cent of wild type at P<0.05 with a WIDER
  GROWTH PLATE and BODY WEIGHT UNCHANGED - two different IGFBP proteases, same phenotype shape, both in
  normal animals. Negative: fernndezarjona2026 gave daily recombinant PAPP-A2 to WILD-TYPE mice from PND5 to
  PND35 and body length went 15.33 to 15.15 in males, numerically LOWER and not significant (CORR-108/345),
  moving only the femur-to-body and tibia-to-body ratios; and kveiborg2006's own purified recombinant
  ADAM12-S on murine chondrocytes was null on proliferation. THE MODALITY MAY BE THE THING THAT FAILS, NOT
  THE TARGET - which is a direct warning to g_l12_466a and g_l12_476a, whose proposal is exactly a
  recombinant protein.
  AND THE MATRIX ALTERNATIVE HAS NO SUBSTRATE. roy2004adam12 gives ADAM12-S cleaving gelatin, type IV
  collagen and fibronectin and NOT type I collagen; ADAM12 with aggrecan returns one review, with type II
  collagen cleavage returns zero, with COMP returns no cleavage demonstration. kveiborg2006 measured
  ADHESION to fibronectin and collagen II, not proteolysis of them. So if ADAM12-S were acting on cartilage
  matrix rather than on IGFBPs, no published substrate would support it.
quantitative:
  - parameter: proliferative chondrocytes per column, saline / IGF-I / GH / normal littermate
    value: 14 / 14 / 18 / 14
    unit: cells per column (GH significantly higher; IGF-I identical to both controls)
    species: rat
    source_ref: hunziker1994
    note: >-
      Hypophysectomised rat proximal tibia, 8-day minipump, six per group. Hypertrophic cells per column over
      the same groups are 8 / 12 / 16 / 12, and hypertrophic zone height 114 / 207 / 279 / 237 um.
  - parameter: terminal hypertrophic chondrocyte linear dimension in the Igf1-null mouse
    value: '-30'
    unit: per cent, accounting for most of a 35 per cent growth deficit
    species: mouse
    source_ref: wang1999
    note: Chondrocyte numbers and proliferation normal; ColX and alkaline phosphatase expressed normally.
  - parameter: height SDS in five humans with homozygous PAPPA2 loss of function
    value: -1.10, -0.96, -3.81, -2.82, -3.14
    unit: SDS
    species: human
    source_ref: dauber2016
    note: >-
      With total IGF-I 831-1060 ug/l (HIGH), IGFBP-3 high, and FREE IGF-I 0.27-3.31 ug/l against a
      prepubertal reference of 1.58-3.15, low in four of five, and the bioactive-to-total ratio reduced in
      all five against a normal median of 1.23 per cent.
  - parameter: femur length in osteoblast-specific PAPP-A transgenic mice, wild type = 100
    value: '107'
    unit: per cent (SD 1.5, P<0.05), line 26, 3-month F1 females
    species: mouse
    source_ref: qin2006pappa
    note: >-
      Bone area 126 +/- 2.8 (P<0.001), tibia 105 +/- 1.5 in line 12, growth plate described as wider, and
      BODY WEIGHT NOT DIFFERENT at 3 or 6 months. A second IGFBP protease with the same phenotype shape as
      ADAM12-S in a normal animal.
  - parameter: body length in WILD-TYPE male mice given daily recombinant PAPP-A2 PND5 to PND35
    value: 15.33 to 15.15
    unit: cm, saline versus rhPAPP-A2, not significant (n=15 saline)
    species: mouse
    source_ref: fernndezarjona2026
    note: >-
      Numerically LOWER. Females 14.47 to 14.71, also ns, while rhGH was significant in both sexes. What
      moved was proportion - femur/body 0.72 to 0.75 and tibia/body 0.93 to 0.97, both P<0.001, i.e. toward
      LIMB. CONFIRMS CORR-108/345 from the supplementary tables. Recorded discrepancy: the paper's prose
      claims increased body length in rhPAPP-A2 wild-type males from PND5 while the terminal PND35 table
      shows the value below saline and unmarked; the factorial ANOVA is pooled across timepoints.
  - parameter: published ADAM12 cleavage of aggrecan, type II collagen or COMP
    value: '0'
    unit: primary demonstrations
    species: human
    source_ref: roy2004adam12
    note: >-
      ADAM12 with aggrecan returns a single review; with type II collagen cleavage, zero records; with COMP,
      four records and no cleavage demonstration. The demonstrated matrix substrates are gelatin, type IV
      collagen and fibronectin, and NOT type I collagen.
