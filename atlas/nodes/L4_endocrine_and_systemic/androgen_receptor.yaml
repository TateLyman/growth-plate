id: androgen_receptor
name: Androgen receptor (AR)
aliases:
- AR
- NR3C4
type: protein
layer: L4
stub: false
summary: 'AR is the nuclear receptor for testosterone and DHT. It is present in the growth plate: AR protein
  was localised immunohistochemically in human bone including chondrocytes and osteoblasts (abu1997),
  and in rat tibial growth plate and metaphyseal bone with sex differences in abundance (van2002). The
  functional consequence at the plate, however, is unproven. In cultured fetal rat metatarsals - a system
  that reads out longitudinal growth directly - neither AR agonists nor antagonists changed growth (chagin2009).
  Human complete androgen insensitivity syndrome (46,XY with non-functional AR) is informative and cuts
  the same way: affected individuals are taller than average females, with growth and epiphyseal fusion
  tracking their aromatised estrogen exposure rather than their absent androgen signalling. AR is therefore
  best described as expressed but not demonstrated to be required for longitudinal growth, with androgen''s
  growth effect running predominantly through aromatisation to estradiol.'
localization:
- 'human bone and growth plate: AR protein detected by immunohistochemistry (abu1997)'
- 'rat tibial growth plate: AR protein present, sex-different (van2002)'
human_evidence: indirect
human_evidence_note: Human complete androgen insensitivity provides a natural AR-null experiment in which
  stature and fusion are not androgen-dependent, but no human study measures AR function within the plate.
species_basis:
- human
- rat
translation_risk: moderate
translation_risk_reason: Localisation exists in human tissue; the functional test is rat organ culture
  with a null result.
confidence: C
