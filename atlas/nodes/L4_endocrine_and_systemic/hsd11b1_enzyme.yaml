id: hsd11b1_enzyme
name: 11beta-hydroxysteroid dehydrogenase type 1 (HSD11B1)
aliases:
- HSD11B1
- 11beta-HSD1
type: protein
layer: L4
stub: false
summary: 'HSD11B1 is an NADPH-dependent, predominantly reductase enzyme of the endoplasmic reticulum that
  regenerates active cortisol from inert cortisone, amplifying local glucocorticoid exposure independently
  of circulating cortisol. Its activity is the reason tissue glucocorticoid tone can diverge from serum
  cortisol, and it is a validated pharmacological target in metabolic disease. In bone, HSD11B1 activity
  in osteoblasts is established and rises with age and with inflammatory cytokine exposure. For the growth
  plate specifically, the pre-receptor amplification model is widely assumed but the primary evidence
  is essentially absent: a targeted search returns no study measuring HSD11B1 expression or activity in
  growth plate chondrocytes by zone, in any species. This is a mechanistically load-bearing hole, because
  it is the step that would determine whether a given systemic glucocorticoid dose is amplified or damped
  at the plate.'
localization:
- 'human growth plate: HSD11B1 expression/activity not reported'
- 'human/rodent bone: HSD11B1 activity demonstrated in osteoblasts, not in physeal chondrocytes'
human_evidence: absent
human_evidence_note: No human growth plate measurement; human HSD11B1 deficiency (cortisone reductase
  deficiency) is described for its androgen excess phenotype, not for stature.
species_basis:
- human
- mouse
translation_risk: unknown
translation_risk_reason: There is no growth plate data in any species to transfer, so the direction and
  magnitude of any species difference cannot be estimated.
