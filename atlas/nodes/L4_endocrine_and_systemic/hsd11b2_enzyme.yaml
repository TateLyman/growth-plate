id: hsd11b2_enzyme
name: 11beta-hydroxysteroid dehydrogenase type 2 (HSD11B2)
aliases:
- HSD11B2
- 11beta-HSD2
type: protein
layer: L4
stub: false
summary: HSD11B2 is an NAD+-dependent, unidirectional dehydrogenase that inactivates cortisol to cortisone.
  In kidney and colon it protects the mineralocorticoid receptor from cortisol; in the placenta it forms
  the barrier that shields the fetus from maternal cortisol, and reduced placental HSD11B2 is the leading
  mechanistic candidate linking maternal stress to fetal growth restriction. Human HSD11B2 loss of function
  causes apparent mineralocorticoid excess with hypertension and, notably, low birth weight and poor postnatal
  growth - the closest thing to a human experiment on glucocorticoid inactivation and stature. Within
  the growth plate itself, whether chondrocytes express HSD11B2 and thereby defend themselves against
  systemic cortisol has not been established; the only physeal-adjacent primary work found is in cartilage
  in a developmental-programming osteoarthritis model, not in the growth plate.
localization:
- 'human placenta, kidney, colon: HSD11B2 established'
- 'human growth plate: HSD11B2 expression not reported'
human_evidence: indirect
human_evidence_note: Human HSD11B2 mutations cause apparent mineralocorticoid excess with low birth weight
  and impaired growth, but the growth effect is not localised to the plate.
