id: igf1_local_growth_plate
name: Locally produced growth plate IGF-1
aliases:
- autocrine/paracrine IGF-1
- chondrocyte IGF-1
type: hormone
layer: L4
stub: false
summary: 'Growth plate chondrocytes synthesise IGF-1 themselves, and this pool is GH-regulated: GH treatment
  of hypophysectomised rats increased the number of IGF-1-immunoreactive chondrocytes in the germinal
  and proliferative zones (nilsson1986), and blocking somatomedin with antiserum abolished the local growth
  response to intra-arterial GH (schlechter1986). The strongest argument for the local pool''s importance
  is negative and comes from the liver-specific Igf1 knockouts: a 75% fall in circulating IGF-1 left mouse
  body and femoral length unchanged (yakar1999, sjgren1999), which is only interpretable if a non-hepatic
  IGF-1 source sustains growth. Local IGF-1 is also the node where thyroid hormone enters - T3-driven
  chondrocyte differentiation requires IGF-1 modulation of beta-catenin (wang2010). What is missing is
  quantity: no study reports the concentration of IGF-1 in growth plate interstitium, its gradient across
  zones, or the fraction of chondrocyte IGF1R occupancy attributable to local versus circulating ligand,
  in any species, and least of all in human tissue.'
localization:
- 'rat RZ/PZ: IGF-1 immunoreactivity present and GH-inducible (nilsson1986)'
- 'human growth plate: IGF-1 protein concentration and zonal gradient not measured'
human_evidence: absent
human_evidence_note: There is no human measurement of growth-plate-derived IGF-1; human inference is entirely
  by analogy from rodent conditional genetics.
species_basis:
- rat
- mouse
translation_risk: high
translation_risk_reason: The concept rests on rat immunohistochemistry and mouse liver knockouts. Human
  growth plate tissue is scarce and no equivalent measurement exists.
confidence: C
