id: ghsr_receptor
name: GHS-R1a (ghrelin receptor)
aliases:
- GHSR
- GHS-R1a
- growth hormone secretagogue receptor
type: protein
layer: L4
stub: false
summary: GHSR1a is a Gq/11-coupled receptor with unusually high constitutive activity, expressed on pituitary
  somatotrophs and hypothalamic GHRH and NPY neurons. Acyl-ghrelin binding raises intracellular Ca2+ and
  augments GH burst mass; GHSR agonists (the GH secretagogue class) are used as pharmacological probes
  of somatotroph reserve. Genetic deletion of GHS-R in rodents abolished the skeletal benefit of meal-feeding
  - body length and tibial epiphyseal plate width were no longer preserved when the ghrelin signal could
  not be received (hornsby2025) - the strongest causal evidence that this receptor participates in setting
  growth plate output. In humans, rare GHSR variants have been reported in short stature and constitutional
  delay but penetrance is incomplete and GHSR is not an established monogenic growth gene.
localization:
- 'human SYS: pituitary somatotroph, hypothalamic arcuate nucleus'
- 'growth plate: not established'
human_evidence: indirect
human_evidence_note: Human evidence is pharmacological (GH secretagogue responses) plus rare, incompletely
  penetrant GHSR variants; no definitive human loss-of-function growth syndrome.
species_basis:
- rat
- mouse
- human
translation_risk: moderate
translation_risk_reason: Causal skeletal data are rodent; human data are pharmacological.
confidence: C
