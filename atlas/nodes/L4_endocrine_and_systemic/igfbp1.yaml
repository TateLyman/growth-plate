id: igfbp1
name: IGFBP-1
aliases:
- IGFBP1
type: protein
layer: L4
stub: false
summary: IGFBP-1 is a 25 kDa hepatic binding protein whose transcription is acutely suppressed by insulin
  and induced by fasting, hypoglycaemia and glucocorticoids; its serum concentration therefore swings
  several-fold within hours and inversely tracks portal insulin. Because it binds IGF-1 with affinity
  comparable to IGF1R and is not part of the ternary complex, IGFBP-1 acts as a rapid, nutrition-responsive
  brake on free IGF-1. This is the most plausible molecular route by which acute undernutrition and catabolic
  illness lower IGF bioactivity within hours rather than days, but no study has measured IGFBP-1 in growth
  plate interstitium or shown a chondrocyte-level effect in any species. This node belongs to the IGF
  bioavailability control layer - ternary complex formation (IGFBP-3/-5 plus ALS), pericellular proteolysis
  (PAPP-A, PAPP-A2) and protease inhibition (STC1, STC2) - which sets the free IGF-1 concentration seen
  by chondrocyte IGF1R independently of total IGF-1. Reviews typically stop at 'IGF-1 level'; the human
  PAPPA2 kindreds show that total and free IGF-1 can move in opposite directions and that stature tracks
  the free fraction.
quantitative: []
