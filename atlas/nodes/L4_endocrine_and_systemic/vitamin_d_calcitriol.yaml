id: vitamin_d_calcitriol
name: 1,25-dihydroxyvitamin D (calcitriol)
aliases:
- calcitriol
- 1,25(OH)2D3
- active vitamin D
type: hormone
layer: L4
stub: false
summary: 'Calcitriol is the VDR ligand generated by renal CYP27B1 1alpha-hydroxylation of 25(OH)D, under
  PTH stimulation and FGF23 inhibition. Its dominant action on the growth plate is indirect: it raises
  intestinal calcium and phosphate absorption, and it is the resulting mineral ion supply, not VDR signalling
  in cartilage, that determines whether the plate mineralises normally. The decisive experiment is that
  normalising mineral ion homeostasis with a rescue diet prevents rachitic growth plate changes in VDR-null
  mice, showing rickets is secondary to hypophosphataemia (and hypocalcaemia/hyperparathyroidism) rather
  than to loss of VDR action in chondrocytes (sabbagh2005). A residual direct component exists - receptor-dependent
  1,25(OH)2D action was required for normal growth plate maturation in Npt2a-null mice (miedlich2010),
  and VDR in chondrocytes drives osteoclastogenesis and regulates osteoblast FGF23 production (masuyama2006)
  - so the plate both responds to and feeds back on the mineral axis.'
localization:
- 'mouse growth plate: VDR-dependent effects on hypertrophic zone maturation demonstrated (miedlich2010)'
- 'human growth plate: calcitriol concentration and VDR occupancy not measured'
human_evidence: direct
human_evidence_note: Nutritional rickets and its reversal with vitamin D, and hereditary 1,25-dihydroxyvitamin
  D-resistant rickets, are direct human evidence at the tissue level (radiographic growth plate changes).
species_basis:
- human
- mouse
translation_risk: low
translation_risk_reason: Human rickets provides the phenotype and its treatment response; mouse genetics
  only resolves whether the mechanism is direct or mineral-mediated.
confidence: A
