id: parathyroid_hormone
name: Parathyroid hormone (PTH)
aliases:
- PTH
- parathormone
type: hormone
layer: L4
stub: false
summary: PTH is an 84-residue peptide from parathyroid chief cells, secreted in response to a fall in
  ionised calcium sensed by CASR. It raises serum calcium by mobilising bone mineral and increasing renal
  calcium reabsorption, and it lowers serum phosphate by internalising the renal NaPi-2a/2c cotransporters;
  it also induces renal CYP27B1, so its effect on the growth plate is largely exerted through calcitriol
  and phosphate. PTH shares PTH1R with PTHrP, which is the actual growth-plate ligand and belongs to L3,
  so systemic PTH and local PTHrP converge on one receptor - the reason chronic hyperparathyroidism and
  PTH1R activating mutations (Jansen metaphyseal chondrodysplasia) both disturb the hypertrophic transition.
  In secondary hyperparathyroidism of chronic kidney disease, high PTH with low calcitriol and phosphate
  retention combine to produce the growth failure and metaphyseal disorganisation of renal osteodystrophy.
localization:
- 'human SYS: parathyroid chief cell -> serum; targets kidney and bone'
- 'growth plate: acts via PTH1R shared with PTHrP; direct systemic PTH action on the plate not separated
  from PTHrP in human tissue'
human_evidence: direct
human_evidence_note: Human hypoparathyroidism, pseudohypoparathyroidism, primary and secondary hyperparathyroidism
  and PTH1R mutations all produce characteristic skeletal phenotypes measured in humans.
species_basis:
- human
- mouse
translation_risk: low
translation_risk_reason: Human endocrine disorders provide the phenotypes directly.
confidence: A
