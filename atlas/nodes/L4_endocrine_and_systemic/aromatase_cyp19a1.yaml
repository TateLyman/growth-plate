id: aromatase_cyp19a1
name: Aromatase (CYP19A1)
aliases:
- CYP19A1
- estrogen synthase
- P450arom
type: protein
layer: L4
stub: false
summary: 'Aromatase is the cytochrome P450 that converts androstenedione to estrone and testosterone to
  estradiol, the committed and rate-limiting step of estrogen synthesis. Its importance for the skeleton
  is that it makes estrogen a locally producible hormone: aromatase is expressed in adipose, bone and
  gonad, and in boys the great majority of circulating estradiol is aromatised from testosterone rather
  than secreted. This is why androgen and estrogen effects on the growth plate are hard to separate pharmacologically
  and why aromatase inhibitors are used clinically to delay fusion and increase predicted adult height.
  Aromatase activity has been reported in growth plate tissue and is regulated there - leptin stimulates
  aromatase in the growth plate, which has been proposed to limit the efficiency of catch-up growth. The
  human loss-of-function experiments (CYP19A1 deficiency with continued growth and unfused epiphyses)
  are covered in L7 and are not duplicated here; what belongs to L4 is that aromatase places the estrogen
  dose-response of estrogen_biphasic_dose_effect under partly local, partly adipose-mass-dependent control.'
localization:
- 'human SYS: adipose, gonad, bone, placenta'
- 'growth plate: aromatase expression reported in rodent physis; human physeal aromatase not quantified'
human_evidence: direct
human_evidence_note: Human CYP19A1 loss of function and aromatase excess syndrome both alter epiphyseal
  fusion timing, and aromatase inhibitors change predicted adult height in randomised paediatric studies;
  the case series themselves are held in L7.
species_basis:
- human
- rat
- mouse
translation_risk: low
translation_risk_reason: The enzyme's role in human skeletal maturation is established by human genetics
  and human pharmacology; only the local physeal expression data are rodent.
confidence: A
