reanalysis_observations:
- observation: CYP19A1 is represented by seven probe sets and is not detected in either human donor in
    any compartment (one marginal perichondrial call in donor 1). ESR1 is detected in resting, proliferative
    and prehypertrophic zones and perichondrium, proliferative-maximal in both donors. ESR2 (6 probe sets)
    is not detected. AR is detected in resting zone, prehypertrophic zone and perichondrium.
  interpretation: There is no detectable local aromatase in the human growth plate at 11-13 years. Estrogen
    action on the human physis therefore runs on circulating estrogen through ERalpha, not on estrogen
    made in situ - which matters for how aromatase inhibitors are understood to act.
  caveats: Transcript only; aromatase is a low-abundance enzyme and this is a bounded negative.
