translation_risk: high
translation_risk_reason: A large size effect in mouse with no human counterpart is exactly the pattern
  that should not be assumed to transfer; the human GH axis has different pulse structure and feedback
  set points. The effect size itself is abstract-only (paywalled figures), so it is recorded value_unverified
  and the node's confidence is dropped one grade.
