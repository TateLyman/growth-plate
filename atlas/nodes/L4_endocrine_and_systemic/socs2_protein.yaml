id: socs2_protein
name: SOCS2
aliases:
- suppressor of cytokine signalling 2
- CIS2
type: protein
layer: L4
stub: false
summary: SOCS2 is a STAT5B-induced SH2-domain protein that binds phosphorylated GHR tyrosines and, via
  its SOCS box and an elongin-cullin-RING E3 complex, ubiquitinates the receptor - a delayed negative
  feedback loop on GH signalling. Its physiological weight is shown by the Socs2-null mouse, which is
  markedly larger than wild type across the skeleton despite normal circulating GH and IGF-1, and whose
  overgrowth is GH-dependent (metcalf2000). SOCS2 is therefore the clearest example in this axis of a
  gain of stature produced by removing a brake rather than adding a ligand, which implies whole-body growth
  is not saturated at physiological GH concentrations. No human SOCS2 loss-of-function overgrowth syndrome
  has been established, and SOCS2's zonal role inside the growth plate has not been mapped in any species.
quantitative:
- parameter: body/skeletal size increase in Socs2-null mice
  value: 30-40
  unit: '%'
  conditions: Socs2-/- vs wild-type littermates, adult; circulating GH and IGF-1 normal
  species: mouse
  source_ref: metcalf2000
  uncertainty: abstract read only; exact effect size and CI not confirmed at source
  value_unverified: true
localization:
