id: dual_effector_hypothesis
name: Dual effector hypothesis
aliases:
- Green-Isaksson dual effector model
- local IGF-1 hypothesis
type: hypothesis
layer: L4
stub: false
summary: 'The dual effector model holds that GH acts on the growth plate in two steps: it first recruits
  resting/germinal zone chondrocytes into the proliferative pool and simultaneously induces local IGF-1,
  which then drives clonal expansion of those cells. Its empirical basis is a specific set of rat experiments.
  Unilateral intra-arterial GH widened the growth plate only on the infused side (isaksson1982), excluding
  a purely systemic mechanism. GH increased the NUMBER of IGF-1-immunoreactive chondrocytes in the germinal
  zone (nilsson1986). A somatomedin antiserum abolished the local response to intra-arterial GH, showing
  the direct effect is IGF-1-mediated rather than IGF-1-independent (schlechter1986). GH multiplied the
  slowly cycling germinal cells specifically (ohlsson1992), and single-cell enzyme histochemistry confirmed
  GH raises the number of proliferating chondrocytes without raising the labelling index of cells already
  in cycle (gevers1996a). The model is therefore not an alternative to IGF-1 action but a relocation of
  it from liver to plate. Its status in humans is unresolved: no human experiment has separated locally
  produced from circulating IGF-1 at the plate.'
localization:
- 'rat RZ: GH-induced recruitment into proliferation confirmed (ohlsson1992, gevers1996a)'
- 'rat PZ: GH-induced IGF-1 immunoreactivity confirmed (nilsson1986)'
- 'human growth plate: local IGF-1 production not quantified'
human_evidence: absent
human_evidence_note: The two-step model has never been tested in human tissue; the human GH-insensitivity
  syndromes cannot distinguish local from systemic IGF-1 because GHR loss removes both.
species_basis:
- rat
translation_risk: high
translation_risk_reason: Every load-bearing experiment is a hypophysectomised or dwarf rat; rat growth
  plates remain open for life and their GH profile is far more sharply pulsatile than the human one.
confidence: C
