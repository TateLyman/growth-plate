id: jak2_kinase
name: JAK2 (Janus kinase 2)
aliases:
- JAK2
type: protein
layer: L4
stub: false
summary: 'JAK2 is the tyrosine kinase constitutively bound to the Box1 motif of GHR and the proximal transducer
  of GH signal. In the resting GHR dimer the two JAK2 pseudokinase (JH2) domains hold each other''s kinase
  (JH1) domains inhibited; GH-induced transmembrane helix rotation separates them and permits JH1 trans-phosphorylation
  (brooks2014). Activated JAK2 phosphorylates GHR cytoplasmic tyrosines, creating docking sites for STAT5B
  (the growth-relevant branch), STAT1/3, SHC-RAS-ERK and IRS-PI3K. The pathway is self-limiting: STAT5B
  transcribes SOCS2, which binds phosphorylated GHR and targets the complex for degradation. Human JAK2
  loss-of-function causing isolated growth failure is far rarer than STAT5B or GHR defects, consistent
  with JAK2''s non-redundant role in haematopoiesis; the growth-relevant human evidence is therefore indirect,
  inferred from the phenotypes of the receptor above and the transcription factor below.'
localization:
- 'human SYS: ubiquitous'
- 'human growth plate: JAK2 phosphorylation not localised by zone'
human_evidence: indirect
human_evidence_note: There is no well-characterised isolated human JAK2 growth-failure syndrome; JAK2's
  requirement in GH action is inferred from GHR and STAT5B human phenotypes plus biophysical reconstitution.
