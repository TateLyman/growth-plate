id: round284_the_ghsr_axis_runs_the_right_way_and_that_is_exactly_why_its_compound_cannot_be_added
name: >-
  ROUND 284 - the human genetics of the GHSR axis came in and it runs the RIGHT way: 26 people with
  heterozygous loss are short with LOW IGF-I and a NORMAL stimulated GH peak. That validates the direction
  of the compound sitting at the top of this file's LIVE list - and it is also the reason that compound
  CANNOT BE ADDED to this stack. A secretagogue works through the pituitary; exogenous GH bypasses it. The
  one argument that made LUM-201 an ADDITION rather than a SUBSTITUTION was pulsatility, and round 271
  already tested that prediction and it failed. Three unchecked compounds closed in the same round
aliases:
- round 284
- GHSR haploinsufficiency
- LUM-201 is a substitute not an addition
- punt2025
- macimorelin, NBI-31772 and roxadustat closed
- screen the exome you may already have
type: hypothesis
layer: L4
stub: false
summary: >-
  ONE - THE AXIS IS NOW HUMAN-VALIDATED IN THE DIRECTION THIS PROGRAMME WANTS. punt2025 assembled 26
  patients with heterozygous GHSR loss-of-function variants - ten variants, six of them novel, each
  characterised in vitro for total protein, cell-surface expression and receptor activity. The phenotype:
  PROPORTIONATE SHORT STATURE AT MINUS 2.8 +/- 0.5 SDS, SERUM IGF-I AT MINUS 1.6 +/- 0.7 SDS, AND A NORMAL
  STIMULATED GH PEAK. In UK Biobank, predicted loss-of-function variants in GHSR associate with standing
  height at P = 1.9x10^-9 and with IGF-I. And kosmicki2026's pathway table independently places GHSR among
  its 207 height genes. LOSING GHSR MAKES A HUMAN SHORT WITH A LOW IGF-I, SO AGONISING IT IS THE
  HEIGHT-INCREASING DIRECTION. Round 279 put LUM-201/ibutamoren at the head of this file's live-compound
  list on paediatric trial data alone; the receptor's human genetics now run the same way.

  TWO - AND THE MECHANISM OF THE LOSS IS THE INTERESTING PART. The variants act PRIMARILY THROUGH LOSS OF
  CONSTITUTIVE ACTIVITY, not through loss of ghrelin responsiveness. GHSR is remarkable in signalling at
  ABOUT 50 PER CENT OF ITS MAXIMAL CAPACITY WITH NO LIGAND PRESENT AT ALL, and it is that ligand-independent
  tone that these patients lose. THAT HAS A DIRECT CONSEQUENCE FOR ROUND 279's PEM SELECTION TEST, and
  punt2025 states it: MACIMORELIN "MAY ONLY TEST THE EFFECT OF STIMULATION OF THE RECEPTOR AND NOT ASSESS
  ITS CONSTITUTIVE ACTIVITY". Round 279 recorded the PEM criterion as baseline IGF-1 above 30 ng/mL plus a
  peak GH of 5 ng/mL or more after a single oral secretagogue dose. A single-dose stimulation test reads the
  agonist limb of a receptor whose pathology is in the OTHER limb.

  THREE - AND HERE IS THE STRUCTURAL POINT THAT CLOSES THE COMPOUND FOR THIS CASE, AND IT IS NOT A SAFETY
  ARGUMENT OR A DOSE ARGUMENT. A GH SECRETAGOGUE ACTS ON THE SOMATOTROPH. EXOGENOUS GROWTH HORMONE BYPASSES
  THE SOMATOTROPH ENTIRELY. So LUM-201 and exogenous GH are two routes to the same molecule in the same
  circulation, and a secretagogue given on top of injected GH is not a second lever - IT IS A SECOND ROUTE
  TO A LEVER ALREADY PULLED. LUM-201 IS A SUBSTITUTE FOR GROWTH HORMONE, NOT AN ADDITION TO IT.
  THE ONLY ARGUMENT THAT EVER MADE IT AN ADDITION WAS PULSATILITY, AND THIS FILE ALREADY KILLED IT. Round
  279's case was that LUM-201 restores PULSATILE secretion at 3.3-4.0 ug/kg/24h against 25-34 injected -
  the same velocity on about an eighth of the hormone - and that round 269's SOCS2 loop predicts pattern
  should beat amount. ROUND 271 TESTED THE PATTERN PREDICTION WHERE HUMANS TESTED IT AND IT FAILED: WEEKLY
  GH IS AT LEAST AS GOOD AS DAILY GH ON HEIGHT VELOCITY. If making GH LESS pulsatile costs nothing, then
  making it more pulsatile buys nothing, and the addition argument has no support left.
  PUT THE THREE STANDING CONCLUSIONS SIDE BY SIDE AND THEY DO NOT COHABIT: (a) GH after mid-puberty is worth
  approximately zero attained height (rounds 254, 269); (b) the pulsatility advantage does not exist (round
  271); (c) LUM-201 sits at the top of the live-compound list (round 279). (a) AND (b) TOGETHER LEAVE (c)
  WITH NOTHING. This file has been carrying that contradiction since round 279 and nobody put the three
  lines next to each other.

  FOUR - WHAT SURVIVES, STATED SO THE COMPOUND IS NOT OVER-CLOSED. LUM-201 remains a real SUBSTITUTION
  option and the substitution is not trivial: PEM-positive children reached 7.7 cm/year against 8.8 on rhGH
  in a randomised comparison, ORALLY, on roughly an eighth of the hormone exposure. If the GH arm were ever
  discontinued for cost, adherence or injection burden, that is the replacement. It is closed as an
  ADDITION to a GH-containing stack, not closed as a molecule.

  FIVE - THE DIAGNOSTIC READING, AND I AM GRADING IT HONESTLY RATHER THAN SELLING IT. punt2025's phenotype -
  proportionate short stature, LOW IGF-I, and a NORMAL STIMULATED GH PEAK - is a recognisable description of
  GH neurosecretory dysfunction, and it is close to this subject's own presentation: IGF-1 198, and
  demonstrated growth on GH. GHSR has never been sequenced in him. BUT AGAINST THE PRE-ROUND CHECKLIST'S
  SECOND QUESTION - does it change what we DO, or only what we believe - THE ANSWER IS MOSTLY BELIEF. He is
  already receiving the treatment a positive result would indicate, and rounds 254 and 269 price that
  treatment at approximately zero attained height from here. A GHSR result would explain the low IGF-1 with
  normal GH testing and retro-validate the response he had. It would not change the stack.

  SIX - BUT THERE IS A VERSION OF THAT TEST THAT WOULD, AND IT COSTS NOTHING IF THE DATA ALREADY EXIST.
  kosmicki2026 gives 207 human height genes with SIGNED effect sizes, and this atlas separately holds the
  agent-relevant ones: NPR2 and NPR3 for the CNP arm, FGFR3 for the lead agent, ACAN, SHOX, IGF1R, GHSR,
  PAPPA2 and STC2 for the IGF layer. IF EXOME OR GENOME SEQUENCING HAS EVER BEEN PERFORMED ON THIS SUBJECT,
  THOSE GENES CAN BE READ OUT OF THE EXISTING FILE AT ZERO MARGINAL COST OR RISK - and unlike a GHSR result,
  several of them WOULD change the stack. A heterozygous NPR2 variant would make the CNP arm mechanistically
  indicated in a subject where round 275 currently expects less than the achondroplasia effect size. An
  FGFR3 variant would do the same for the lead agent. An ACAN variant would predict early cessation and
  reprice the whole remaining window. THIS IS THE CHEAPEST UNEXPLOITED INFORMATION IN THE FILE - it is not a
  new experiment, it is a query against data that may already have been generated.

  SEVEN - AND THE THREE UNCHECKED COMPOUNDS ARE NOW CHECKED AND ALL THREE CLOSE.
  MACIMORELIN is an approved ORAL GHSR agonist, but it is approved as a SINGLE-DOSE DIAGNOSTIC for adult GH
  deficiency and has no therapeutic growth indication or chronic dosing data; punt2025 adds that it probably
  reads only the stimulated limb of the receptor. It is the same target as LUM-201 and therefore inherits
  section three's argument in full. CLOSED.
  NBI-31772, the IGFBP-displacing agent that round 279 flagged and this file has never used: the ENTIRE
  Europe PMC record for it is 41 items, none skeletal - zebrafish fin regeneration, oocyte maturation,
  retinal lamination, mouse glucose homeostasis. NO BONE OR LENGTH ENDPOINT IN ANY SPECIES, no development
  programme, no human exposure. It is a reagent, not a candidate. CLOSED as a compound; the underlying
  question it stood for - raising the FREE IGF-1 fraction that only_free_igf_reaches_the_plate says is all
  the plate ever sees - remains open and has no molecule.
  ROXADUSTAT: a targeted query pairing HIF prolyl-hydroxylase inhibitors with bone-LENGTH vocabulary returns
  35 records and NOT ONE with a length endpoint. The skeletal literature that does exist is about bone MASS
  in both directions - roxadustat promotes osteoblast differentiation and prevents oestrogen-deficiency bone
  loss, and separately inhibits osteoclast differentiation. Mass, not length, and no growing animal. CLOSED
  pending any length endpoint.
quantitative:
- parameter: >-
    HUMAN GHSR HAPLOINSUFFICIENCY - SHORT, LOW IGF-I, AND A NORMAL GH STIMULATION TEST
  value: >-
    26 patients, aged 4.0 to 15.1 years, ten heterozygous GHSR variants (six novel). HEIGHT -2.8 +/- 0.5
    SDS; SERUM IGF-I -1.6 +/- 0.7 SDS; NORMAL STIMULATED GH PEAK on arginine or clonidine; failure to thrive
    with low appetite in 4 of 26. Variants showed partial or complete loss of function PRIMARILY THROUGH
    LOSS OF CONSTITUTIVE ACTIVITY - the wild-type receptor signals at about 50 per cent of maximum with no
    ligand present. Nine patients treated with rhGH gained +0.9 +/- 0.4 SDS of height at one year and +1.5
    +/- 0.4 SDS at two years (n = 5). In UK Biobank, predicted loss-of-function GHSR variants associate with
    STANDING HEIGHT at P = 1.9x10^-9 and with IGF-I levels. Segregation with short stature in 7 of 17
    informative families; absent in the other 10, so penetrance is incomplete
  unit: height SDS, IGF-I SDS, GH peak
  conditions: >-
    punt2025, case series with in vitro functional characterisation of every variant (total protein,
    cell-surface expression, basal/stimulated/inhibited activity).
  species: human
  source_ref: punt2025
  uncertainty: >-
    A CASE SERIES ASCERTAINED ON SHORT STATURE, so the height figure is conditioned on the reason for
    referral and cannot be read as the variant's population effect - the UK Biobank association is the
    unbiased estimate and it is a P value rather than a centimetre figure here. Penetrance is incomplete:
    short stature was absent in parents with the variant in 10 of 17 families. The rhGH response is
    uncontrolled and in children, and short children respond to GH regardless of cause. NOTHING HERE IS
    MEASURED IN AN ADULT OR AT ATTAINED HEIGHT.
- parameter: >-
    WHY THE SECRETAGOGUE CANNOT BE ADDED TO A STACK THAT ALREADY CONTAINS GROWTH HORMONE
  value: >-
    LUM-201/ibutamoren acts at GHSR on the pituitary somatotroph to raise ENDOGENOUS GH; exogenous
    recombinant GH bypasses the somatotroph. The pulsatility argument that made it an addition rather than a
    substitution - restored pulsatile secretion at 3.3-4.0 ug/kg/24h against 25-34 ug/kg injected, the same
    velocity on about one eighth of the hormone - depends on pattern beating amount, and ROUND 271 FOUND
    WEEKLY GH AT LEAST AS GOOD AS DAILY GH ON HEIGHT VELOCITY. Set against rounds 254 and 269, where GH
    after mid-puberty is worth approximately zero attained height, the addition has no remaining support.
    WHAT SURVIVES IS SUBSTITUTION: 7.7 cm/year on oral LUM-201 against 8.8 cm/year on rhGH in PEM-positive
    children, randomised
  unit: qualitative pharmacological argument, with the velocity figures that bound it
  conditions: >-
    bright2021 for the randomised velocity comparison; round 271 (ying2026) for the weekly-versus-daily
    result; rounds 254 and 269 for the post-mid-puberty attained-height null.
  species: human
  source_ref: bright2021
  uncertainty: >-
    THE ARGUMENT IS STRUCTURAL RATHER THAN EXPERIMENTAL - no trial has given a GH secretagogue on top of
    exogenous GH and measured whether anything is added, and the prediction that nothing is added is an
    inference from where the two agents act. It could fail if GHSR has growth-relevant peripheral actions
    independent of pituitary GH release; ghrelin receptors are expressed outside the pituitary and that has
    not been excluded here. The substitution figures come from PEM-positive, prepubertal, GH-deficient
    children at bone age 8 to 9 and round 279 already graded their transfer to this subject as X.
- parameter: >-
    THE THREE UNCHECKED COMPOUNDS, CHECKED - ALL THREE CLOSE
  value: >-
    MACIMORELIN - approved oral GHSR agonist, but licensed as a SINGLE-DOSE DIAGNOSTIC for adult GH
    deficiency, with no therapeutic growth indication and no chronic dosing data; punt2025 notes it probably
    assays only the stimulated and not the constitutive limb of the receptor. NBI-31772 - the entire Europe
    PMC record is 41 items and NONE is skeletal; no bone or length endpoint in any species, no development
    programme, no human exposure. ROXADUSTAT - a targeted HIF-prolyl-hydroxylase-inhibitor query against
    bone-LENGTH vocabulary returns 35 records with NO length endpoint in any species; the skeletal
    literature is bone MASS (promotes osteoblast differentiation, prevents oestrogen-deficiency bone loss,
    inhibits osteoclast differentiation)
  unit: presence or absence of a bone length endpoint
  conditions: >-
    Europe PMC searches run this round, recorded so the negative result is reusable rather than repeated.
  species: multiple
  source_ref: punt2025
  uncertainty: >-
    THESE ARE ABSENCE-OF-EVIDENCE CLOSURES AND CARRY THE USUAL LIMIT - a Europe PMC query does not index
    patents, company pipelines or unpublished pharmacology, and CLAUDE.md's own convention says compound
    discovery must go beyond PubMed. For NBI-31772 the absence is convincing because the total record is 41
    items and can be read in full. For roxadustat the closure is narrower: it says no LENGTH endpoint
    exists, not that the HIF axis is irrelevant to growth.
localization:
- 'pituitary somatotroph: where GHSR acts and where a secretagogue acts, which is upstream of the point at
  which exogenous GH enters'
- 'growth plate: not where any of this happens, which is the point of section three'
human_evidence: direct
human_evidence_note: >-
  26 genotyped and functionally characterised patients plus a UK Biobank predicted-loss-of-function
  association at P = 1.9x10^-9.
species_basis:
- human
translation_risk: moderate
translation_risk_reason: >-
  The genetics is human and direct, but everything is measured in short children with an ascertainment on
  short stature, and nothing is measured at attained adult height or in an adolescent at bone age 16.
confidence: B
confidence_reason: >-
  The human genetics of the receptor is solid - functionally characterised variants plus an unbiased
  biobank association. The compound conclusion is graded on a structural pharmacological argument combined
  with two results this file already holds, not on a trial of the combination, which has never been run.
claim_grades:
- claim: >-
    Agonising GHSR is the height-increasing direction in humans.
  grade: B
  basis: >-
    26 patients with functionally characterised heterozygous loss-of-function variants are short at -2.8 SDS
    with IGF-I at -1.6 SDS and a NORMAL stimulated GH peak, and UK Biobank predicted-LoF GHSR associates
    with standing height at P = 1.9x10^-9 and with IGF-I. kosmicki2026 independently lists GHSR among 207
    height genes. Held at B because the case series is ascertained on short stature, penetrance is
    incomplete in 10 of 17 families, and no attained adult height is reported.
- claim: >-
    LUM-201/ibutamoren is a candidate ADDITION to this stack.
  grade: X
  basis: >-
    NO, AND THE REASON IS ARCHITECTURAL RATHER THAN PHARMACOLOGICAL. A secretagogue acts on the somatotroph;
    exogenous GH bypasses it. The only thing that made it an addition rather than a substitution was
    pulsatility, and round 271 found weekly GH at least as good as daily GH on height velocity - if reducing
    pulsatility costs nothing, restoring it buys nothing. Rounds 254 and 269 independently price GH after
    mid-puberty at approximately zero attained height. Round 279 put this compound at the head of the live
    list while this file already held both of those results, and nobody set the three lines side by side.
- claim: >-
    LUM-201/ibutamoren is a dead compound.
  grade: X
  basis: >-
    ALSO NO - IT IS CLOSED AS AN ADDITION, NOT AS A MOLECULE. In PEM-positive children it produced 7.7
    cm/year against 8.8 cm/year for rhGH in a randomised comparison, orally, on roughly an eighth of the
    hormone exposure. If the GH arm were ever stopped for cost, adherence or injection burden, this is the
    replacement to reach for, subject to round 279's unchanged objection that every subject in that evidence
    base was prepubertal, GH-deficient and at bone age 8 to 9.
- claim: >-
    Sequencing GHSR in this subject would change the stack.
  grade: X
  basis: >-
    IT WOULD CHANGE THE EXPLANATION, NOT THE ACTION, AND THE PRE-ROUND CHECKLIST SAYS THAT IS NOT ENOUGH. The
    phenotype fits - low IGF-1 with a normal stimulated GH peak and a demonstrated GH response - but he is
    already receiving the treatment a positive result would indicate, and rounds 254 and 269 price that
    treatment at approximately zero attained height from here.
- claim: >-
    Screening an EXISTING exome or genome against the height-gene set would change the stack.
  grade: E
  basis: >-
    THIS ONE COULD, AND IT IS THE CHEAPEST UNEXPLOITED ITEM IN THE FILE - not a new experiment but a query
    against data that may already exist. kosmicki2026 supplies 207 signed human height genes; the
    agent-relevant subset is NPR2 and NPR3 (the CNP arm), FGFR3 (the lead agent), ACAN, SHOX, IGF1R, GHSR,
    PAPPA2 and STC2. A heterozygous NPR2 variant would make the CNP arm mechanistically indicated where
    round 275 currently expects sub-achondroplasia effect sizes; an FGFR3 variant would do the same for the
    lead agent; an ACAN variant would predict early cessation and reprice the remaining window. Graded E
    because it is conditional on sequencing having been done and on finding something - the prior for any
    single gene is low.
- claim: >-
    Macimorelin, NBI-31772 or roxadustat is a candidate for this stack.
  grade: X
  basis: >-
    ALL THREE CLOSE. Macimorelin is an approved SINGLE-DOSE DIAGNOSTIC with no therapeutic growth indication,
    and it is the same target as LUM-201 so it inherits the substitution argument. NBI-31772's entire Europe
    PMC record is 41 items with nothing skeletal - a reagent, not a candidate. Roxadustat has no bone LENGTH
    endpoint in any species; its skeletal literature is bone mass. CLAUDE.md's unchecked-compound list is
    now empty.
