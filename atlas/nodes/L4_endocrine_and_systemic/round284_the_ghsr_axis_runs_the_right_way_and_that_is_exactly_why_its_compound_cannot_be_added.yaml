contradicts: >-
  DOWNGRADES THE CENTRAL RECOMMENDATION OF
  round279_an_oral_compound_this_atlas_never_held_and_the_pulsatility_question_it_actually_tests. Round 279
  put LUM-201/ibutamoren at the head of this file's live-compound list. Its human receptor genetics are now
  confirmed to run the right way, and that does not save it FOR THIS STACK: a secretagogue acts on the
  somatotroph and exogenous GH bypasses the somatotroph, so it is a SUBSTITUTE for the GH arm rather than an
  addition to it. The pulsatility argument that made it an addition was already refuted by round 271, and
  rounds 254 and 269 price GH after mid-puberty at approximately zero attained height. Those three results
  were all in the file simultaneously and were never set side by side.
  It also QUALIFIES round 279's PEM selection criterion: punt2025 notes that a single-dose oral agonist test
  reads the STIMULATED limb of GHSR, while the human pathology is loss of the receptor's CONSTITUTIVE
  activity.
