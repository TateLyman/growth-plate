stub: false
summary: 'IGFBP-5 is the most abundant IGFBP in bone matrix and the only IGFBP besides IGFBP-3 that forms
  a ternary complex with ALS. It binds hydroxyapatite and extracellular matrix, which converts it from
  a soluble carrier into a matrix-immobilised IGF reservoir - the property that makes it the most likely
  IGFBP to matter inside cartilage rather than in blood. It is a PAPP-A2 substrate: in human PAPP-A2 deficiency
  serum IGFBP-5 rises to 645-997 ug/L against a Tanner I reference of 211-707 ug/L (dauber2016). Whether
  matrix-bound IGFBP-5 in the growth plate sets a zonal gradient of free IGF-1 has not been measured in
  any species. This node belongs to the IGF bioavailability control layer - ternary complex formation
  (IGFBP-3/-5 plus ALS), pericellular proteolysis (PAPP-A, PAPP-A2) and protease inhibition (STC1, STC2)
  - which sets the free IGF-1 concentration seen by chondrocyte IGF1R independently of total IGF-1. Reviews
  typically stop at ''IGF-1 level''; the human PAPPA2 kindreds show that total and free IGF-1 can move
  in opposite directions and that stature tracks the free fraction.'
