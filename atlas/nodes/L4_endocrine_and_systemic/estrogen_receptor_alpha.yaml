claim_grades:
- claim: ERalpha function is required for epiphyseal fusion, and losing it permits continued longitudinal
    growth past the normal age of closure.
  grade: A
  basis: Mouse germline ERalpha-null females keep growing (tibia +8.3%, plate height +18%; brjesson2012)
    and a human ESR1-null male reached 204 cm with unfused epiphyses despite elevated estradiol
    (smith1994), with independent ESR1 loss-of-function families showing delayed bone maturation
    (bernard2017).
- claim: Growth plate closure is driven by ERalpha functions that do not require AF-1 and is actively
    opposed by AF-1.
  grade: D
  basis: Single mouse study dissociating AF-1 from AF-2 (brjesson2012); no human allele separates
    the activation functions.
