id: estrogen_receptor_alpha
name: Estrogen receptor alpha (ESR1 / ERalpha)
aliases:
- ESR1
- ERalpha
- NR3A1
type: protein
layer: L4
stub: false
summary: 'ERalpha is the nuclear receptor that carries the growth-terminating action of estrogen. It transactivates
  through two activation functions, AF-1 (ligand-independent, N-terminal) and AF-2 (ligand-dependent).
  Mouse genetics dissociates them sharply: old female ERalpha-null mice continue growing, with tibiae
  8.3% longer (P<0.01) and growth plate height 18% greater (P<0.05) than wild type, phenocopying human
  ESR1 and aromatase deficiency; whereas mice lacking only ERalphaAF-1 have SHORTER tibiae (-4.9%, P<0.01)
  and closed proximal tibial growth plates in every animal while all wild-type plates remained open (brjesson2012).
  AF-1 deletion therefore yields a HYPERactive ERalpha for the closure function, meaning growth plate
  closure is driven by ERalpha functions that do not require AF-1 and is actively opposed by AF-1. This
  is a rare instance where a mouse experiment makes a mechanistic prediction that the human experiments
  of nature (ESR1 inactivation, aromatase deficiency - covered in L7) then match phenotypically.'
