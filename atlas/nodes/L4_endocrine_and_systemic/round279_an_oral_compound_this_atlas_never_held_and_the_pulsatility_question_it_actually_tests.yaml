id: round279_an_oral_compound_this_atlas_never_held_and_the_pulsatility_question_it_actually_tests
name: >-
  ROUND 279 - a compound sweep found the graph's own vocabulary blocks generic discovery, so the search
  moved to the INTERNET and found an ORAL agent with placebo-controlled paediatric height-velocity data
  that this atlas has ZERO nodes on. LUM-201 / ibutamoren restores PULSATILE GH and matches injectable
  rhGH's velocity on roughly an eighth of the GH - which is the one frequency CORR-281 said was untested
aliases:
- round 279
- LUM-201
- ibutamoren
- MK-677
- the pulsatility question actually tested
- oral growth hormone secretagogue
type: intervention
layer: L4
stub: false
summary: >-
  THE INSTRUCTION WAS TO FIND ACTUAL COMPOUNDS AND TO STOP CLOSING THINGS. Two methodological findings and
  one compound.

  ZERO - THE METHOD FAILED FIRST, AND THAT IS WORTH RECORDING. round279_compound_frontier_sweep.py fires 14
  wide Europe PMC queries pairing intervention vocabulary with length endpoints, keeps records with a
  length-gain sentence, extracts agent names by drug-name morphology, and subtracts every token already
  present anywhere in the graph or bibliography. IT RETURNED 36 RECORDS AND TWO NOVEL AGENT TOKENS, BOTH
  FALSE POSITIVES - a grant identifier and a study day. THE ATLAS VOCABULARY IS NOW SO LARGE THAT ALMOST
  EVERY REAL DRUG NAME ALREADY APPEARS SOMEWHERE IN IT, so generic discovery is dead. Compound finding has
  to be targeted by domain knowledge, or run against sources PubMed does not index. THE SECOND FIX WAS THE
  OPERATOR'S: use the INTERNET. Trial registries, company pipelines, regulatory filings and conference
  abstracts carry compounds in development that a PubMed-only search never sees. That is now a standing
  rule in CLAUDE.md.

  ONE - AND IT IMMEDIATELY FOUND ONE. A hand-checked list of candidate agents against the graph returned
  four genuine absences - ibutamoren/MK-677, macimorelin, NBI-31772 and roxadustat - of which the first is
  substantial. IBUTAMOREN (MK-0677, now LUM-201) IS AN ORALLY ACTIVE NON-PEPTIDE GHRELIN-RECEPTOR (GHS-R)
  AGONIST THAT AMPLIFIES ENDOGENOUS GH SECRETION. This atlas held nothing on it.

  TWO - THE PAEDIATRIC EVIDENCE IS REAL, PLACEBO-CONTROLLED AND ENRICHED. bright2021 reanalysed the Merck
  020 trial: 68 naive, PREPUBERTAL children with established GHD, 6 months, oral LUM-201 at 0.4 or 0.8
  mg/kg/day against rhGH and placebo. In the PEM-POSITIVE group, 0.8 mg/kg LUM-201 gave 7.7 plus or minus
  1.3 cm/year against rhGH's 8.8 plus or minus 1.8 - AN ORAL SECRETAGOGUE WITHIN ABOUT 1.1 cm/year OF
  INJECTED GROWTH HORMONE. In the PEM-NEGATIVE group it gave 5.4 plus or minus 2.0 against rhGH's 14.0 plus
  or minus 4.1, so the marker is doing real work and the drug is NOT universally equivalent.
  THE PREDICTIVE ENRICHMENT MARKER IS TWO NUMBERS: baseline IGF-1 above 30 ng/mL, and peak GH at least 5
  ng/mL after a SINGLE ORAL DOSE. The logic is that the drug amplifies an endogenous axis, so there has to
  be an axis to amplify.

  THREE - AND THE PHASE 2 RESULT IS THE ONE THAT MATTERS MECHANISTICALLY, BECAUSE IT TESTS THE FREQUENCY
  NOBODY HAD. oragrowth212_pulsatility2024 reports that in 22 PEM-positive moderate-PGHD children, LUM-201
  raised PULSATILE GH from 1.17 plus or minus 0.66 to 1.8 plus or minus 0.74 microgram/kg and basal GH from
  0.19 to 0.36, restoring total secretion to 3.3 to 4.0 microgram/kg/24h against about 5 in normal
  children - and produced annualised height velocity of 7.2 to 8.1 cm/year. INJECTED rhGH FOR THIS
  INDICATION IS 25 TO 34 MICROGRAM/KG/DAY. SO A RESTORED PULSATILE PATTERN DELIVERING ROUGHLY AN EIGHTH OF
  THE GROWTH HORMONE ACHIEVES A COMPARABLE HEIGHT VELOCITY.
  THAT IS EXACTLY WHAT CORR-281 SAID WAS UNTESTED. Round 271 found weekly GH non-inferior and possibly
  superior to daily, and I recorded that the pattern hypothesis was REFUTED at the frequency tried and
  UNTESTED at the frequency that matters - because physiological pulses arrive every few hours and a daily
  injection is already a single non-physiological bolus. LUM-201 operates at the ULTRADIAN frequency, and
  at that frequency pattern appears to beat amount by roughly eightfold.
  AND IT IS THE CLINICAL FORM OF ROUND 269's MECHANISM. GH induces SOCS2 seventeen-fold at the plate and
  SOCS2 gates the response; sustained exposure holds the plate refractory while pulses let it decay. Eight
  times less GH doing the same work is what that model predicts. AND IT IS THE PHARMACOLOGICAL VERSION OF
  hornsby2025 - meal-feeding preserved body length by tripling GH secretion and adding two bursts per day
  through GHRELIN AND GHS-R, which is the receptor LUM-201 agonises.

  FOUR - AND NOW THE LIMITS, WHICH ARE SEVERE AND WHICH THE COMMERCIAL LITERATURE ON THIS COMPOUND HIDES.
  EVERY SUBJECT IN EVERY ONE OF THESE TRIALS WAS PREPUBERTAL. Merck 020 required bone age at or below 8
  years for girls and 9 for boys, with a bone age DELAY of at least one year, and median age 9.2. THE CASE
  IS BONE AGE 16 - outside the tested range by seven or more bone years, on the far side of the puberty
  boundary that round 254 identified as where growth hormone's contribution to attained height goes to
  zero.
  EVERY SUBJECT WAS ALSO GH-DEFICIENT, with height SDS -3.3. THIS SUBJECT IS NOT. A secretagogue in a
  non-deficient axis faces intact negative feedback that a deficient one does not.
  AND THE CLAIM CIRCULATING ONLINE THAT IT RAISES GROWTH VELOCITY WITHOUT ADVANCING BONE AGE IS NOT
  SUPPORTED BY bright2021, WHICH REPORTS ONLY BASELINE bone age delay - 1.9 years in PEM-positive against
  4.0 in PEM-negative - AND NO BONE AGE ADVANCEMENT OUTCOME AT ALL. The sources making that claim are
  supplement retailers, not studies. If LUM-201 is simply more endogenous GH then it inherits GH's
  bone-age cost and GH's attained-height null after mid-puberty.

  FIVE - SO WHAT IS ACTUALLY NEW HERE IS A HYPOTHESIS WITH A COMPOUND ATTACHED, AND IT IS SHARP. Round 254's
  finding that GH after mid-puberty adds about zero attained height was measured with EXOGENOUS DAILY
  INJECTION - the SOCS2-saturating pattern. NOBODY HAS ASKED WHETHER PULSATILE ENDOGENOUS AMPLIFICATION HAS
  A DIFFERENT ATTAINED-HEIGHT PROFILE AT THE SAME MATURITY. That is the experiment this compound makes
  askable, the mechanism from round 269 predicts it should differ, and the answer is unknown in either
  direction. The subject clears the IGF-1 half of the PEM at 198 ng/mL by a wide margin; the peak-GH half
  requires a single-dose test that has never been done outside the trials.
quantitative:
- parameter: >-
    ORAL SECRETAGOGUE VERSUS INJECTED GROWTH HORMONE, PLACEBO-CONTROLLED, BY PREDICTIVE ENRICHMENT MARKER
  value: >-
    PEM-POSITIVE: LUM-201 0.8 mg/kg/day 7.7 plus or minus 1.3 cm/year (n = 15) against rhGH 8.8 plus or
    minus 1.8 (n = 11). PEM-NEGATIVE: LUM-201 5.4 plus or minus 2.0 (n = 9) against rhGH 14.0 plus or minus
    4.1 (n = 9). PEM = baseline IGF-1 above 30 ng/mL AND peak GH at least 5 ng/mL after a single oral dose
  unit: cm per year at 6 months
  conditions: >-
    bright2021, reanalysis of the Merck 020 randomised placebo-controlled trial. 68 naive-to-treatment
    PREPUBERTAL children with established GH deficiency; bone age at or below 8 years for girls and 9 for
    boys with a bone age delay of at least 1 year; median age 9.2; baseline height SDS -3.3; pretreatment
    height velocity 4.4 cm/year. Oral LUM-201 at 0.4 mg/kg/day (n = 22) or 0.8 mg/kg/day (n = 24).
  species: human
  source_ref: bright2021
  uncertainty: >-
    A POST-HOC MARKER DERIVED FROM THE SAME TRIAL IT IS EVALUATED IN, with 9 to 15 subjects per cell. SIX
    MONTHS, HEIGHT VELOCITY, NOT ATTAINED HEIGHT - round 254 established those come apart for the GH class.
    EVERY SUBJECT PREPUBERTAL AND GH-DEFICIENT, bone age capped at 8-9 years, which is seven or more bone
    years short of this case and on the other side of the puberty boundary where GH's attained-height
    contribution goes to zero. The authors themselves flag that pubertal status at end of treatment was not
    recorded and that subjects entering puberty may have influenced the comparison. NO BONE AGE
    ADVANCEMENT OUTCOME IS REPORTED.
- parameter: >-
    RESTORED PULSATILE SECRETION MATCHES INJECTED GH's VELOCITY ON ROUGHLY AN EIGHTH OF THE HORMONE
  value: >-
    pulsatile GH rose from 1.17 plus or minus 0.66 to 1.8 plus or minus 0.74 microgram/kg and basal GH from
    0.19 plus or minus 0.09 to 0.36 plus or minus 0.21 at 6 months on 1.6 mg/kg/day (p 0.02-0.04); total
    restored secretion 3.3 to 4.0 microgram/kg/24h against about 5 in normal children; annualised height
    velocity 7.2 cm/year at 1.6 mg/kg and 8.1 at 3.2 mg/kg at 6 months, 6.9 and 7.2 at 12 months; IGF-1 SDS
    rose 0.9 and 1.1 from baselines of -1.0 and -0.85. Injected rhGH for this indication is 25 to 34
    microgram/kg/day
  unit: microgram/kg of GH, and cm per year
  conditions: >-
    oragrowth212_pulsatility2024, OraGrowtH212 Phase 2, 22 PEM-positive moderate-PGHD subjects randomised
    to 1.6 or 3.2 mg/kg/day oral LUM-201, Santiago, Chile, with 24-month follow-up ongoing. Reported good
    tolerability with no safety signal in adverse events, laboratory values or ECGs.
  species: human
  source_ref: oragrowth212_pulsatility2024
  uncertainty: >-
    A CONFERENCE ABSTRACT, NOT A PEER-REVIEWED FULL PAPER, AND FLAGGED FOR HAND VERIFICATION IN THE
    BIBLIOGRAPHY. n = 22, no placebo arm in this analysis, single centre. The eightfold comparison is
    between a restored ENDOGENOUS secretion rate and an INJECTED dose, which are not the same quantity -
    injected GH is cleared differently and the two numbers are not directly commensurable, so "an eighth of
    the hormone" is an order-of-magnitude statement rather than a ratio. Again height VELOCITY at 6 and 12
    months, in prepubertal GH-deficient children.
- parameter: >-
    THE COMPOUND SWEEP THAT FAILED, AND WHY IT MATTERS
  value: >-
    14 wide queries returned 36 records carrying a length-gain sentence, of which 2 carried an agent token
    absent from the atlas - both false positives, a grant identifier and a study day. Zero real novel
    compounds
  unit: counts
  conditions: >-
    atlas/tools/round279_compound_frontier_sweep.py, subtracting every lowercase token of four or more
    characters appearing anywhere in atlas/nodes or the bibliography.
  species: not_applicable
  source_ref: chu2025
  uncertainty: >-
    THE SUBTRACTION IS TOO AGGRESSIVE AND THAT IS THE POINT - with roughly 800 nodes and 1500 references,
    almost every real drug name already appears somewhere in the corpus, so novelty-by-absence stops
    discriminating. The queries were also capped at 25 results each. This is a negative result about the
    METHOD, not about the field, and it is recorded so the approach is not tried again in this form.
localization:
- 'pituitary somatotroph and hypothalamus: where a GHS-R agonist acts, amplifying endogenous pulses rather
  than replacing them'
- 'growth plate: where round 269 places SOCS2 as the gate that a pulsatile pattern would evade'
human_evidence: direct
human_evidence_note: >-
  Randomised placebo-controlled paediatric trial data with height velocity endpoints, plus Phase 2
  pulsatility and velocity data - all in PREPUBERTAL, GH-DEFICIENT children.
species_basis:
- human
translation_risk: high
translation_risk_reason: >-
  Every subject in every trial was prepubertal with bone age capped at 8-9 years and GH-deficient with
  height SDS -3.3. The case is bone age 16 and not GH-deficient.
confidence: B
confidence_reason: >-
  The Merck 020 velocity comparison is randomised and placebo-controlled and the PEM separation is large.
  Graded B rather than A because the marker is post-hoc within its own trial, the cell sizes are 9 to 15,
  the pulsatility data are a conference abstract, and every endpoint is 6-to-12-month velocity rather than
  attained height.
claim_grades:
- claim: >-
    An oral compound can produce height velocity close to injected growth hormone in the right patients.
  grade: B
  basis: >-
    bright2021 - in PEM-positive children, oral LUM-201 at 0.8 mg/kg/day gave 7.7 plus or minus 1.3 cm/year
    against rhGH's 8.8 plus or minus 1.8, in a randomised placebo-controlled trial. In PEM-negative children
    it gave 5.4 against rhGH's 14.0, so the marker matters and the equivalence is conditional.
- claim: >-
    Pattern beats amount for growth hormone at the ULTRADIAN frequency.
  grade: C
  basis: >-
    oragrowth212_pulsatility2024 - restored pulsatile secretion totalling 3.3 to 4.0 microgram/kg/24h
    produced 7.2 to 8.1 cm/year against injected doses of 25 to 34 microgram/kg/day for the same indication.
    THIS IS THE FREQUENCY CORR-281 IDENTIFIED AS UNTESTED, and round 269's SOCS2 loop predicts exactly this
    shape. Held at C because it is a conference abstract, n = 22, uncontrolled within that analysis, and
    endogenous secretion rate and injected dose are not directly commensurable quantities.
- claim: >-
    This compound raises growth velocity without advancing bone age.
  grade: X
  basis: >-
    NOT SUPPORTED BY ANY SOURCE FOUND. bright2021 reports BASELINE bone age delay only - 1.9 years in
    PEM-positive against 4.0 in PEM-negative - and no bone-age-advancement outcome. The claim circulates on
    supplement-retailer websites, which are not evidence. If the compound simply raises endogenous GH then
    it should inherit GH's bone-age cost.
- claim: >-
    The paediatric evidence transfers to a non-deficient subject at bone age 16.
  grade: X
  basis: >-
    IT DOES NOT, AND THE GAP IS LARGE. Merck 020 required bone age at or below 8 for girls and 9 for boys
    with at least a year of bone age delay; all subjects were prepubertal and GH-deficient at height SDS
    -3.3. The case is bone age 16, past the puberty boundary at which round 254 measured GH's contribution
    to attained height as approximately zero, and has a normal axis with intact negative feedback.
- claim: >-
    Whether pulsatile endogenous GH amplification escapes the post-pubertal attained-height null is known.
  grade: E
  basis: >-
    IT IS NOT, AND THIS IS THE ROUND'S ACTUAL CONTRIBUTION. Round 254's null was measured with EXOGENOUS
    DAILY INJECTION, which is the SOCS2-saturating pattern round 269 identified. Nobody has tested whether
    an ultradian-pulsatile amplification has a different attained-height profile at the same maturity. The
    mechanism predicts it might; no data exists in either direction; and the subject clears the IGF-1 half
    of the enrichment marker at 198 ng/mL against a threshold of 30.
- claim: >-
    A generic length-endpoint compound sweep can still find novel agents for this atlas.
  grade: X
  basis: >-
    NO. The sweep returned 36 length-gain records and two novel agent tokens, both false positives. With
    roughly 800 nodes and 1500 references, almost every real drug name already appears somewhere in the
    corpus. Compound discovery now requires targeted domain queries or non-PubMed sources.
