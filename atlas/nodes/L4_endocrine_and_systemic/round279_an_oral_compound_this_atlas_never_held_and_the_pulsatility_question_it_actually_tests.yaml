contradicts: >-
  REFINES CORR-281 rather than reversing it. That correction recorded that the GH pattern hypothesis was
  REFUTED at the frequency humans had tested - weekly versus daily, where flatter exposure was non-inferior
  and possibly superior - and UNTESTED at the ultradian frequency, because a daily injection is already a
  single non-physiological bolus. LUM-201 operates at the ultradian frequency and at that frequency pattern
  appears to beat amount by roughly eightfold, which is what round 269's SOCS2 loop predicts. Both halves
  stand: flattening from daily to weekly costs nothing, and restoring true pulsatility may buy a great deal.
  It also records a NEGATIVE about method - generic compound sweeps no longer discriminate against a corpus
  this large, and compound discovery must move to targeted domain queries and non-PubMed sources.
