id: pappa_protease
name: PAPP-A (pappalysin-1)
aliases:
- PAPPA
- pappalysin-1
type: protein
layer: L4
stub: false
summary: PAPP-A is the founding pappalysin, a homodimeric metzincin that cleaves IGFBP-4 (strictly IGF-dependently)
  and, more slowly, IGFBP-2 and IGFBP-5. Because IGFBP-4 is a pure inhibitor of IGF action, PAPP-A activity
  converts a locally sequestered IGF pool into free ligand at the cell surface - a paracrine amplifier
  rather than an endocrine one. It is inhibited stoichiometrically by stanniocalcin-2 (and STC1). PAPP-A's
  growth role is best established in mouse, where Pappa deletion produces proportionate dwarfism and extended
  lifespan. In human population data PAPP-A concentration, unlike PAPP-A2 and STC2, does NOT associate
  with circulating total IGF-1 (nimptsch2024), consistent with PAPP-A acting locally rather than on the
  circulating pool. No human PAPPA loss-of-function short-stature syndrome has been reported, which is
  a notable asymmetry with PAPPA2. This node belongs to the IGF bioavailability control layer - ternary
  complex formation (IGFBP-3/-5 plus ALS), pericellular proteolysis (PAPP-A, PAPP-A2) and protease inhibition
  (STC1, STC2) - which sets the free IGF-1 concentration seen by chondrocyte IGF1R independently of total
  IGF-1. Reviews typically stop at 'IGF-1 level'; the human PAPPA2 kindreds show that total and free IGF-1
  can move in opposite directions and that stature tracks the free fraction.
localization:
- 'human SYS: circulating (also the first-trimester screening analyte)'
- 'human growth plate: PAPP-A protein not localised in physeal tissue'
human_evidence: indirect
human_evidence_note: Human evidence is correlative (population associations of circulating PAPP-A with
  IGF axis components); no human PAPPA null growth phenotype is described.
species_basis:
- mouse
- human
translation_risk: moderate
translation_risk_reason: The dwarfism phenotype is mouse-only and the human population data actually dissociate
  PAPP-A from circulating IGF-1, so the mouse result should not be read as a human growth mechanism.
confidence: C
