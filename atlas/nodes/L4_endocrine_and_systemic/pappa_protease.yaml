id: pappa_protease
name: PAPP-A (pappalysin-1)
aliases:
- PAPPA
- pappalysin-1
type: protein
layer: L4
stub: false
summary: 'PAPP-A is the founding pappalysin, a homodimeric metzincin that cleaves IGFBP-4 (strictly IGF-dependently)
  and, more slowly, IGFBP-2 and IGFBP-5. Because IGFBP-4 is a pure inhibitor of IGF action, PAPP-A activity
  converts a locally sequestered IGF pool into free ligand at the cell surface - a paracrine amplifier
  rather than an endocrine one. It is inhibited stoichiometrically by stanniocalcin-2 (and STC1), which
  locks it by an intersubunit disulfide and excludes IGFBP-4 from binding without occluding the catalytic
  site (kobber2022). PAPP-A is required in cartilage specifically: Pappa-knockout mice have reduced femur
  length and disorganised chondrocyte columns, pappaa-null zebrafish show shortened Meckel''s cartilage
  with disorganised chondrocytes and reduced sox9a, ihha and col10a1, the zebrafish phenotype is mimicked
  by pharmacological IGF-signalling inhibition and rescued by recombinant IGF-I (harboe2024). In human
  population data, however, PAPP-A concentration - unlike PAPP-A2 and STC2 - does NOT associate with circulating
  total IGF-1 (nimptsch2024), consistent with PAPP-A acting locally rather than on the circulating pool.
  No human PAPPA loss-of-function short-stature syndrome has been reported, a notable asymmetry with PAPPA2.
  This node belongs to the IGF bioavailability control layer - ternary complex formation, pericellular
  proteolysis and protease inhibition - which sets the free IGF-1 concentration seen by chondrocyte IGF1R
  independently of total IGF-1.'
localization:
- 'mouse growth plate: Pappa-null mice show reduced femur length and disorganised chondrocyte columns
  (harboe2024)'
- 'zebrafish Meckel''s cartilage: pappaa-null shortens cartilage and disrupts chondrocyte organisation,
  rescued by rhIGF-I (harboe2024)'
- 'human SYS: circulating (also the first-trimester screening analyte)'
- 'human growth plate: PAPP-A protein not localised in physeal tissue'
human_evidence: indirect
human_evidence_note: Human evidence is correlative (population associations of circulating PAPP-A with
  IGF axis components); no human PAPPA null growth phenotype is described.
species_basis:
- mouse
- zebrafish
- human
translation_risk: moderate
translation_risk_reason: The dwarfism phenotype is mouse-only and the human population data actually dissociate
  PAPP-A from circulating IGF-1, so the mouse result should not be read as a human growth mechanism.
confidence: C
