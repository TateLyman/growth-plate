id: lin28b_gene
name: LIN28B
aliases:
- LIN28B
type: gene
layer: L4
stub: false
summary: LIN28B encodes an RNA-binding protein that blocks maturation of the let-7 microRNA family, and
  it was the first locus shown by genome-wide association to set human pubertal timing. In 4,714 women
  with replication in 16,373, each major allele at rs314276 was associated with 0.12 years earlier menarche
  (95% CI 0.08-0.16; combined P=3.6x10-16), plus earlier breast development and voice breaking, faster
  tempo of height growth in both sexes, and SHORTER adult height in women and men - the expected consequence
  of earlier growth cessation (ong2009). A second, partially correlated variant tags effects that are
  distinct and sex-specific, influencing prepubertal growth in girls and final height in boys, so LIN28B
  affects the entire postnatal growth trajectory rather than only the timing of the spurt (widn2010).
  Lin28a transgenic mice reproduce both the increased body size and the delayed puberty predicted from
  the human association (zhu2010), a rare instance of successful reverse translation from a human GWAS
  signal.
