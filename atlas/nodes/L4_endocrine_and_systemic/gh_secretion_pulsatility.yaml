id: gh_secretion_pulsatility
name: GH secretion pulsatility
aliases:
- GH pulse generator
- ultradian GH rhythm
- deconvolution analysis of GH
type: process
layer: L4
stub: false
summary: 'GH is not released tonically; it is emitted in discrete secretory bursts superimposed on a low
  basal rate. The standard measurement is 10-minute venous sampling for 8-24 h followed by deconvolution
  analysis, which decomposes the concentration series into burst times, burst mass, a basal secretion
  rate and a monoexponential elimination term; pattern regularity is reported separately as approximate
  entropy (ApEn). In healthy middle-aged adults sampled for 24 h this yields 13.7-13.8 bursts/24 h with
  ~88% of total output attributable to bursts rather than basal secretion (van2016). Burst amplitude,
  not frequency, carries most of the physiological modulation: 24-h pulsatile secretion falls with age
  and, more steeply, with BMI, and the female excess disappears after age 50 (roelfsema2016, n=130). Pattern
  is mechanistically load-bearing and not merely descriptive: in GH-deficient dwarf rats given patterned
  infusions at matched total dose, body growth tracked the PULSE component while hepatic GHR and plasma
  GHBP tracked the TROUGH component, and pulsatile versus continuous dose-response curves were non-parallel
  (gevers1996). A single fasting GH measurement is uninformative about 24-h secretion (roelfsema2016).'
quantitative:
- parameter: GH secretory bursts per 24 h
  value: 13.7-13.8
  unit: bursts/24 h
  conditions: healthy adults mean age ~65 y, 10-min sampling, maximum-likelihood deconvolution
  species: human
  source_ref: van2016
  uncertainty: 95% CI 12.1-15.7; n=37
- parameter: basal (non-pulsatile) GH secretion
  value: 14.5-26.9
  unit: mU/L per 24 h
  conditions: healthy middle-aged adults, geometric mean by group
  species: human
  source_ref: van2016
  uncertainty: 95% CI 9.8-40.4 across the two groups
- parameter: pulsatile GH secretion
  value: 151-191
  unit: mU/L per 24 h
  conditions: healthy middle-aged adults, deconvolution
  species: human
  source_ref: van2016
  uncertainty: 95% CI 113-230; between-group P=0.14
- parameter: approximate entropy (ApEn) of the 24-h GH series
  value: 0.45-0.66
  unit: dimensionless
  conditions: healthy middle-aged adults; higher value = weaker feedback control
  species: human
  source_ref: van2016
  uncertainty: 95% CI 0.39-0.77; between-group P=0.001
- parameter: sampling interval used for deconvolution of overnight GH in adolescents
  value: '10'
  unit: min
  conditions: 8-h sleep study, n=18 adolescents, sparse-recovery deconvolution
  species: human
  source_ref: genty2022
  uncertainty: method paper; no biological uncertainty stated
- parameter: body weight gain from added pulsatile vs added continuous GH at matched extra dose
  value: 2.1 vs 1.1
  unit: g/day
  conditions: GH-deficient dwarf rats; 72 ug/day delivered as pulses vs 36 ug/day pulses + 36 ug/day continuous
  species: rat
  source_ref: gevers1996
  uncertainty: SEM +/-0.2 both arms; P<0.01 for the all-pulsatile arm
localization:
- 'human SYS: measured in peripheral venous blood only'
- 'human growth plate: local GH concentration-time profile never measured'
human_evidence: direct
human_evidence_note: Deconvolution of frequently sampled human serum GH is a routine, validated human
  measurement; what is absent is any measurement of the GH profile actually seen by a chondrocyte.
species_basis:
- human
- rat
translation_risk: moderate
translation_risk_reason: Human data establish the systemic pattern; the demonstration that PATTERN rather
  than integrated exposure drives growth comes from rat infusion experiments, and rat GH profiles are
  more sharply pulsatile and more sexually dimorphic than human ones.
confidence: A
