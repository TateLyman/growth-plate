id: circadian_growth_regulation
name: Circadian regulation of growth
aliases:
- diurnal growth rhythm
- clock control of longitudinal growth
type: process
layer: L4
stub: false
summary: 'Longitudinal growth in humans has diurnal structure at two levels that are usually conflated.
  The first is systemic and well evidenced: the GH axis is strongly nycthemeral, with the dominant secretory
  burst after sleep onset and measurable 24-h rhythmicity in the deconvolved profile (van2016, calvert2022).
  Feeding pattern entrains this rhythm through ghrelin, and flattening the rhythm by continuous enteral
  feeding in humans produces continuously elevated GH with minimal ultradian structure (hornsby2025).
  The second level - a cell-autonomous circadian oscillator inside growth plate chondrocytes gating proliferation
  or matrix output - is asserted in reviews, but the primary cartilage-clock literature is dominated by
  articular and temporomandibular cartilage in osteoarthritis models, not by the physis. No study has
  demonstrated a functioning BMAL1/PER oscillator in human growth plate chondrocytes or shown that disrupting
  it changes longitudinal bone growth.'
localization:
- 'human SYS: GH axis rhythm confirmed'
- 'human growth plate: intrinsic circadian oscillator unconfirmed'
human_evidence: indirect
human_evidence_note: Human evidence covers the systemic GH rhythm and the effect of feeding pattern on
  it; there is no human growth plate clock measurement.
species_basis:
- human
- rat
- mouse
translation_risk: high
translation_risk_reason: The frequently repeated claim that a chondrocyte-intrinsic clock times growth
  rests on articular/TMJ cartilage rodent models - a different tissue in a disease context.
confidence: D
