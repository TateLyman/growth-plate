summary: 'MKRN3 is a paternally expressed imprinted gene in the Prader-Willi critical region at 15q11-q13
  encoding a RING-finger E3 ubiquitin ligase. Whole-exome sequencing of 40 members of 15 families with
  central precocious puberty found four novel heterozygous MKRN3 mutations (three frameshift, one missense)
  in 5 of the 15 families, affecting both sexes, and in every case inherited from the father - perfect
  segregation with the imprinting mode (abreu2013). Mkrn3 mRNA is high in the arcuate nucleus of prepubertal
  mice, falls immediately before puberty and stays low afterwards, so MKRN3 is a brake whose release permits
  puberty rather than a trigger. It acts within kisspeptin-expressing neurons (abreu2020) and interacts
  with IGF2BP1 to remodel hypothalamic plasticity. For stature the consequence is the standard precocious-puberty
  trade: accelerated growth and bone maturation followed by early fusion and reduced adult height.'
