id: stat5b_tf
name: STAT5B
aliases:
- STAT5b
- signal transducer and activator of transcription 5B
type: protein
layer: L4
stub: false
summary: STAT5B is the transcription factor carrying the growth-relevant arm of GH signalling. JAK2 phosphorylates
  STAT5B on Y699; phospho-STAT5B dimerises, enters the nucleus and transactivates IGF1, IGFALS and SOCS2
  among others. Homozygous human STAT5B mutations produce GH insensitivity biochemically indistinguishable
  from GHR deficiency - high GH, very low IGF-1 and IGFBP-3 - but with an additional immune phenotype
  (lymphocytic interstitial pneumonitis, eczema, autoimmunity), because STAT5B also transduces IL-2 receptor
  signalling in T cells (kofoed2003, hwa2005). This dual phenotype is the cleanest evidence that GH's
  effect on human stature runs through STAT5B specifically rather than through the ERK or PI3K branches
  of GHR signalling. Because circulating IGF-1 and ALS are both STAT5B targets, STAT5B loss collapses
  the ternary complex as well as IGF-1 production, so the biochemical picture is a compound one.
localization:
- 'human SYS: hepatocyte nucleus (IGF1/IGFALS transcription); T lymphocytes'
- 'human growth plate: STAT5B phosphorylation status by zone not reported'
human_evidence: direct
human_evidence_note: Homozygous STAT5B loss of function has been characterised in multiple unrelated humans
  with severe GH insensitivity plus immune disease; total absence of STAT5B protein was documented in
  at least one patient.
species_basis:
- human
- mouse
translation_risk: low
translation_risk_reason: The defining evidence is human genetic and biochemical.
