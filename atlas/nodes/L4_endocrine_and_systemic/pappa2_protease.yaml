id: pappa2_protease
name: PAPP-A2 (pappalysin-2)
aliases:
- PAPPA2
- pappalysin-2
type: protein
layer: L4
stub: false
summary: 'PAPP-A2 is a secreted metzincin metalloproteinase that liberates IGF-1 from inhibitory binding
  proteins by cleaving IGFBP-3 and IGFBP-5, the two IGFBPs that form the 150 kDa ternary complex with
  ALS. Two unrelated consanguineous families with homozygous PAPPA2 mutations (p.D643fs25* and p.Ala1033Val,
  both abolishing proteolytic activity in vitro) define the human phenotype: progressive postnatal growth
  failure, moderate microcephaly, thin long bones and mildly reduced bone density, with a paradoxical
  biochemistry of ELEVATED total IGF-1, IGF-2, IGFBP-3, IGFBP-5 and ALS but REDUCED free and bioactive
  IGF-1 (dauber2016). Size-exclusion chromatography confirmed the IGF-1 is trapped in ternary complexes.
  Affected adults reached heights of -2.16 to -3.81 SDS. This is the cleanest human demonstration that
  IGF bioavailability, not IGF concentration, sets stature. This node belongs to the IGF bioavailability
  control layer - ternary complex formation (IGFBP-3/-5 plus ALS), pericellular proteolysis (PAPP-A, PAPP-A2)
  and protease inhibition (STC1, STC2) - which sets the free IGF-1 concentration seen by chondrocyte IGF1R
  independently of total IGF-1. Reviews typically stop at ''IGF-1 level''; the human PAPPA2 kindreds show
  that total and free IGF-1 can move in opposite directions and that stature tracks the free fraction.'
