id: als_igfals
name: Acid-labile subunit (ALS / IGFALS)
aliases:
- IGFALS
- ALS
type: protein
layer: L4
stub: false
summary: 'ALS is an 85 kDa leucine-rich-repeat glycoprotein made by hepatocytes under GH-STAT5B control.
  It binds preformed IGF/IGFBP-3 or IGF/IGFBP-5 binary complexes to make the 150 kDa ternary complex,
  which cannot cross the capillary endothelium and so converts a paracrine growth factor into a long-lived
  circulating reservoir. Human IGFALS inactivation is the sharpest available test of whether the reservoir
  matters: it collapses circulating IGF-1 and IGFBP-3 to values seen in severe GH deficiency, yet the
  height deficit is comparatively modest and often only 1-2 SDS (domen2004, domen2009). This dissociation
  between circulating IGF-1 and stature is a direct human argument against the strong somatomedin hypothesis,
  and it is stronger evidence than the mouse LID experiment because it is a human null. Igfals-null mice
  likewise show only mild, sex-dependent reductions in body size and bone slenderness (courtland2010),
  but ALS knockout combined with liver Igf1 deletion does reduce growth plate height (yakar2002), locating
  the threshold below the single-gene nulls.'
localization:
- 'human SYS: hepatocyte-secreted, serum'
- 'growth plate: ALS not present locally; its effect is on delivery, not on the plate'
human_evidence: direct
human_evidence_note: Homozygous human IGFALS inactivation has been characterised in multiple kindreds
  with near-absent circulating IGF-1/IGFBP-3 and disproportionately mild short stature.
species_basis:
- human
- mouse
translation_risk: low
translation_risk_reason: The key experiment is a human null allele; mouse data are concordant.
confidence: A
