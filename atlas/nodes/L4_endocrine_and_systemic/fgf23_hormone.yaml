summary: 'FGF23 is a 251-residue osteocyte- and osteoblast-derived hormone, the principal phosphaturic
  factor. It requires alpha-Klotho as an obligate co-receptor to signal through FGFR1c in the proximal
  renal tubule, where it internalises NaPi-2a/2c and suppresses CYP27B1 while inducing CYP24A1 - so it
  lowers both phosphate and calcitriol simultaneously. FGF23 excess (PHEX-mutant X-linked hypophosphataemia,
  autosomal dominant hypophosphataemic rickets, tumour-induced osteomalacia) causes rickets and disproportionate
  short stature; loss of FGF23 or Klotho causes hyperphosphataemic tumoural calcinosis. Chondrocytes are
  not merely downstream: VDR signalling in chondrocytes regulates osteoblast FGF23 production (masuyama2006).
  The therapeutic test in humans is burosumab, an anti-FGF23 monoclonal, which improved height velocity
  by 0.085-0.121 Z-score/year in 641 children and adolescents with XLH (fukumoto2026).'
localization:
