id: ghrh_hormone
name: GHRH (growth hormone-releasing hormone)
aliases:
- GHRH
- somatoliberin
- GRF
type: hormone
layer: L4
stub: false
summary: 'GHRH is a 44-amino-acid hypothalamic peptide released from arcuate neurons into the hypophyseal
  portal circulation, where it binds the somatotroph GHRH receptor (a class B GPCR) and raises cAMP, driving
  both GH synthesis and secretory burst generation. Biallelic GHRHR loss of function causes isolated GH
  deficiency type IB with severe proportionate short stature; the Itabaianinha (Brazil) kindred provides
  a large human cohort homozygous for a GHRHR null allele followed from childhood into old age (aguiaroliveira2021).
  GH secretion in GHRHR-inactivated humans nonetheless remains pulsatile at minimal amplitude, which shows
  the pulse GENERATOR is not GHRH itself: somatostatin withdrawal and ghrelin provide non-GHRH inputs
  to burst timing. GHRH has no established action at the growth plate; its entire effect on stature is
  exerted through somatotroph output.'
localization:
- 'human SYS: hypothalamic arcuate nucleus -> portal blood -> pituitary somatotroph'
- 'growth plate: no established local action'
human_evidence: direct
human_evidence_note: Homozygous GHRHR null mutations in humans, including a large Brazilian kindred with
  lifelong follow-up, produce severe isolated GH deficiency and proportionate dwarfism.
