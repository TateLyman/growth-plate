type: hormone
layer: L4
stub: false
summary: 'Ghrelin is a 28-residue stomach-derived peptide, octanoylated on Ser3 by GOAT, that activates
  GHSR1a on somatotrophs and hypothalamic neurons and amplifies GH secretory bursts. Its role in skeletal
  growth was long argued mainly from pharmacology; it now has a direct mechanistic demonstration. In rodents
  fed identical total calories as discrete meals rather than by grazing, preprandial ghrelin surges tripled
  GH secretion, raised burst height and added two extra GH bursts per day, and this preserved body length
  and tibial epiphyseal plate width; the effect required ghrelin and GHS-R (hornsby2025). The same study
  showed the converse in humans: continuous nasogastric feeding failed to suppress circulating ghrelin
  and produced continuously elevated GH with minimal rhythmicity, whereas bolus enteral infusion restored
  postprandial ghrelin troughs and ultradian GH rhythm. Ghrelin is therefore the best-characterised link
  between feeding PATTERN, as distinct from total intake, and growth plate output.'
