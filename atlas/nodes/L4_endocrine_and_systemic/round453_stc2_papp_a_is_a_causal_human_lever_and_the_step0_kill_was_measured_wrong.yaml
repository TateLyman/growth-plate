id: round453_stc2_papp_a_is_a_causal_human_lever_and_the_step0_kill_was_measured_wrong
name: R453 - STC2 to PAPP-A is a CAUSAL human height mechanism with in-vitro confirmation, the Stc2-null mouse is
  10-15% larger, and BOTH papers say the effect is NOT through GH/IGF-I signalling as R328 assumed - the Step-0
  kill on this target rests on an inference that has been directly measured against
