type: hormone
layer: L4
stub: false
summary: 'IGF-2 is a paternally expressed imprinted growth factor that dominates fetal growth and is the
  most abundant IGF in adult human serum (roughly 3-5 fold higher than IGF-1 by mass), unlike in mouse
  where Igf2 is largely silenced postnatally - a species difference that undermines direct transfer of
  mouse IGF-2 data to humans. It signals through IGF1R and the insulin receptor A isoform; IGF2R (cation-independent
  mannose-6-phosphate receptor) is a clearance receptor. Human dosage disorders make the growth role unambiguous:
  loss of IGF2 expression at 11p15 (or maternal uniparental disomy 7 / ICR1 hypomethylation) produces
  Silver-Russell syndrome with severe pre- and postnatal growth restriction, and IGF2 gain of dosage produces
  Beckwith-Wiedemann overgrowth. In PAPP-A2 deficiency circulating IGF-2 is elevated alongside IGF-1 because
  both are trapped in ternary complexes (dauber2016), which shows that IGF-2 shares the same bioavailability
  control layer.'
