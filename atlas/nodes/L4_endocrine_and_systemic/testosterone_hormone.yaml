summary: 'Testosterone drives the male pubertal growth spurt, but the fitted human dose-response shows
  it does so at concentrations at which its aromatised product is also rising. In 26 healthy boys, a 50%
  increase in growth velocity from prepubertal baseline to peak height velocity occurred at a morning
  testosterone of 3.1 nmol/L (95% CI 2.4-4.2), and boys within 4% of PHV had testosterone above 10 nmol/L
  and estradiol above 9 pmol/L (albin2013). Because these two curves are superimposed, human observational
  data cannot by themselves separate direct androgen action from aromatisation. Where the separation has
  been attempted, the answer favours aromatisation: in cultured fetal rat metatarsals neither androgen
  receptor agonists nor antagonists changed longitudinal growth (chagin2009). Clinically, non-aromatisable
  androgens such as oxandrolone increase growth velocity but with limited effect on adult height, consistent
  with a mainly aromatisation-dependent mechanism for the spurt itself.'
