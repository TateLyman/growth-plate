id: gper1_receptor
name: GPER1 (G protein-coupled estrogen receptor 1)
aliases:
- GPER
- GPER1
- GPR30
type: protein
layer: L4
stub: false
summary: 'GPER1 is a seven-transmembrane, Gs-coupled receptor that binds estradiol with nanomolar affinity
  and signals through cAMP-PKA-CREB and EGFR transactivation on a seconds-to-minutes timescale, distinct
  from the hours-timescale nuclear ERalpha programme. In the growth plate its documented role is on the
  ascending, growth-promoting limb rather than on fusion: GPER1 positively regulates chondrocyte proliferation
  in the pubertal female mouse growth plate (chou2021), and the effect is relayed through the PTHrP/Ihh
  feedback loop (chou2025). GPER1 is therefore a candidate mechanism for how the same ligand can be growth-promoting
  at low concentration and growth-terminating at high concentration - two receptors with different affinities,
  kinetics and downstream logic - but this two-receptor explanation of the biphasic effect has not been
  tested by manipulating GPER1 and ERalpha in the same animal across a dose range, and there is no human
  GPER1 growth phenotype.'
localization:
- 'mouse pubertal growth plate: GPER1 promotes chondrocyte proliferation via PTHrP/Ihh (chou2021, chou2025)'
- 'human growth plate: GPER1 protein not localised'
human_evidence: absent
human_evidence_note: No human GPER1 loss- or gain-of-function growth phenotype has been described.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Entirely mouse, in a sex- and stage-restricted model, with no human counterpart;
  mice do not fuse, so the pubertal-proliferation result cannot be extended to the human fusion decision.
