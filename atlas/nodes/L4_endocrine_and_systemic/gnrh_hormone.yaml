id: gnrh_hormone
name: GnRH (gonadotropin-releasing hormone)
aliases:
- GnRH
- LHRH
- GNRH1
type: hormone
layer: L4
stub: false
summary: GnRH is a decapeptide released in ~60-120 minute pulses from hypothalamic neurons into the hypophyseal
  portal circulation; the reactivation of that pulse generator is the first detectable event of puberty
  (abreu2013). Pulse FREQUENCY, not concentration, encodes the signal - continuous GnRH exposure downregulates
  the pituitary GnRH receptor, which is exactly why long-acting GnRH agonists suppress rather than stimulate
  the axis and are used to arrest precocious puberty and preserve adult height. GnRH has no established
  action at the growth plate; its entire statural effect is mediated by gonadal sex steroid output and
  therefore by the estrogen dose-response. Loss of the upstream kisspeptin input (KISS1R mutations) produces
  hypogonadotropic hypogonadism with absent pubertal growth spurt and delayed epiphyseal fusion (seminara2003,
  de2003).
localization:
- 'human SYS: hypothalamic GnRH neurons -> portal circulation -> pituitary gonadotroph'
- 'growth plate: no established local action'
human_evidence: direct
human_evidence_note: Human GnRH deficiency syndromes and the therapeutic use of GnRH analogues in central
  precocious puberty give bidirectional interventional human evidence.
species_basis:
- human
- mouse
translation_risk: low
translation_risk_reason: Human genetic and pharmacological evidence dominates.
confidence: A
