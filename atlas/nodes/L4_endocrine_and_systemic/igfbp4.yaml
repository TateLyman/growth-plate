summary: 'IGFBP-4 is a pure inhibitor of IGF action with no documented IGF-potentiating activity, and
  it is the specific, strictly IGF-dependent substrate of PAPP-A. The PAPP-A/IGFBP-4/STC2 module is therefore
  a self-contained local switch: IGF-1 bound to IGFBP-4 is inert until PAPP-A cleaves the complex, and
  STC2 shuts that off by covalently locking PAPP-A and excluding IGFBP-4 from binding (kobber2022). Igfbp4-null
  mice are modestly growth-retarded, which is counterintuitive for a pure inhibitor and is usually read
  as loss of a reservoir function. No human IGFBP4 growth disorder is known. This node belongs to the
  IGF bioavailability control layer - ternary complex formation (IGFBP-3/-5 plus ALS), pericellular proteolysis
  (PAPP-A, PAPP-A2) and protease inhibition (STC1, STC2) - which sets the free IGF-1 concentration seen
  by chondrocyte IGF1R independently of total IGF-1. Reviews typically stop at ''IGF-1 level''; the human
  PAPPA2 kindreds show that total and free IGF-1 can move in opposite directions and that stature tracks
  the free fraction.'
