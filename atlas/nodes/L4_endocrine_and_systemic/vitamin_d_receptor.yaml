id: vitamin_d_receptor
name: Vitamin D receptor (VDR)
aliases:
- VDR
- NR1I1
type: protein
layer: L4
stub: false
summary: 'VDR is a nuclear receptor that heterodimerises with RXR on vitamin D response elements. Its
  growth plate role has been dissected more cleanly than most: VDR-null mice develop rickets with an expanded
  late hypertrophic layer caused by impaired chondrocyte apoptosis, but a calcium/phosphate/lactose rescue
  diet that normalises mineral ion homeostasis prevents the rachitic changes, showing that most of the
  phenotype is mineral-mediated rather than a direct cartilage VDR requirement (sabbagh2005). A residual
  chondrocyte-autonomous role remains: VDR in chondrocytes promotes osteoclastogenesis at the chondro-osseous
  junction and regulates osteoblast FGF23 production (masuyama2006), making the hypertrophic chondrocyte
  an endocrine participant in phosphate homeostasis rather than only a target of it. Human hereditary
  1,25-dihydroxyvitamin-D-resistant rickets (VDR loss of function, often with alopecia) reproduces the
  phenotype and responds to high-dose calcium, consistent with the mineral-mediated model.'
localization:
- 'mouse growth plate: VDR present in hypertrophic chondrocytes; regulates osteoclastogenesis and osteoblast
  FGF23 (masuyama2006)'
- 'human growth plate: VDR protein not quantified by zone'
human_evidence: direct
human_evidence_note: Human VDR loss-of-function (hereditary vitamin D-resistant rickets) produces radiographic
  rickets that responds to high-dose calcium, matching the mouse mineral-rescue result.
species_basis:
