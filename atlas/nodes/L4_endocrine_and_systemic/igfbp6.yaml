id: igfbp6
name: IGFBP-6
aliases:
- IGFBP6
type: protein
layer: L4
stub: false
summary: IGFBP-6 is distinguished by an approximately 20-100 fold preference for IGF-2 over IGF-1, making
  it the only IGFBP that is functionally an IGF-2-selective inhibitor. Given that IGF-2 remains the quantitatively
  dominant IGF in adult human serum (unlike in mouse), IGFBP-6 is the binding protein whose human relevance
  is most likely to be underestimated from rodent work. It is O-glycosylated, does not form ternary complexes,
  and is a poor pappalysin substrate. No growth plate localisation, no human mutation phenotype and no
  chondrocyte functional data exist. This node belongs to the IGF bioavailability control layer - ternary
  complex formation (IGFBP-3/-5 plus ALS), pericellular proteolysis (PAPP-A, PAPP-A2) and protease inhibition
  (STC1, STC2) - which sets the free IGF-1 concentration seen by chondrocyte IGF1R independently of total
  IGF-1. Reviews typically stop at 'IGF-1 level'; the human PAPPA2 kindreds show that total and free IGF-1
  can move in opposite directions and that stature tracks the free fraction.
quantitative: []
