type: protein
layer: L5
stub: false
summary: 'MMP-9 is not made by chondrocytes. It is supplied by invading cells of bone marrow origin -
  the chondroclasts/septoclasts at the chondro-osseous junction - and it acts at the last septum of the
  hypertrophic zone to release matrix-bound angiogenic activity and permit vascular invasion. The Mmp9-null
  mouse is the cleanest demonstration: hypertrophic chondrocytes still differentiate normally, but apoptosis,
  vascularisation and ossification are all delayed and the growth plate lengthens progressively to about
  EIGHT TIMES normal. The phenotype is transient - after three weeks postnatal, compensatory apoptosis
  and vascularisation remodel the enlarged plate and adult skeletal appearance is normal - so MMP-9 controls
  the timing of cartilage removal, not whether it happens. That the defect is cell-extrinsic to cartilage
  is shown directly by rescue with wild-type bone marrow transplantation, and Mmp9-null growth plates
  in culture show delayed release of an angiogenic activator. No human MMP9 deficiency syndrome is known,
  so this is a mouse-only mechanism with no human genetic anchor.'
