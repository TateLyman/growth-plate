id: osteopontin_spp1
name: Osteopontin (SPP1)
aliases:
- SPP1
- OPN
- BSP-1
- secreted phosphoprotein 1
type: protein
layer: L5
stub: false
summary: 'Osteopontin is a highly phosphorylated acidic glycoprotein that inhibits hydroxyapatite formation
  and growth by adsorbing to crystal faces through polyaspartate and phosphoserine motifs; its inhibitory
  activity is phosphorylation-dependent and is largely lost when the covalently bound phosphate is removed.
  It is a second, PPi-independent brake on mineralization and it is transcriptionally coupled to the PPi
  system: Alpl-/- mice have raised osteopontin, ank/ank mice have reduced osteopontin, and both are normalised
  in the corresponding double mutants, so the hypomineralization of TNAP loss is the combined effect of
  PPi excess AND osteopontin excess rather than PPi alone. In vivo the inhibitory role is shown by epistasis
  with matrix Gla protein: Opn-/-;Mgp-/- double nulls calcify far worse than Mgp-/- alone. In human growth
  plate, SPP1 protein is one of the two proteins concentrated at the mineralization-inhibiting growth
  plate-epiphysis interface, alongside AHSG. Osteopontin is therefore an inducible inhibitor whose expression
  rises when mineralization is dysregulated, which makes it a sensor as well as an effector.'
