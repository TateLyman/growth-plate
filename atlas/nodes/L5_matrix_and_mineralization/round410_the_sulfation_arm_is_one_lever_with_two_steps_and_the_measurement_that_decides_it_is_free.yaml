localization: >-
  human growth plate, zone-resolved: CHST3 hypertrophic-peaked, CHST11 and XYLT1 and CSGALNACT1
  proliferative-peaked, SLC26A2 proliferative-peaked and falling into the hypertrophic zone
human_evidence: direct
human_evidence_note: >-
  The zonal gradients, the purity ratios, the sodium-MRI feasibility and the maturation decline
  in sulfated GAG are all human. The causal claim that raising plasma sulfate raises cartilage
  sulfation and then bone length is not - it has never been tested in any species.
species_basis:
  - human
  - mouse
translation_risk: high
translation_risk_reason: >-
  No sulfate donor has a bone-length endpoint in any species, renal reabsorption is saturable,
  the two mouse heterozygote length rows on this pathway run the wrong way, and the cell arm of
  the volume story is defended by a set point that re-tunes.
confidence: C
claim_grades:
  - claim: >-
      CHST3 peaks in the hypertrophic zone and CHST11 in the proliferative zone of the human
      growth plate
    grade: B
    basis: >-
      GSE9160, both high-signal CHST3 probes and CHST11's strongest probe, both donors, against
      the platform's own calibrators. n=2 donors, and one donor is not monotone for CHST3
  - claim: The sulfate importer falls into the hypertrophic zone while the sulfotransferase rises
    grade: C
    basis: >-
      the same two donors on SLC26A2's strongest probe. Consistent in direction across donors but
      transcript abundance is not transport flux
  - claim: Sulfate supply and CHST3 are in series with the supply end unsaturated
    grade: C
    basis: >-
      scherer2025's graded heterozygote effect on plasma sulfate and human height within the
      ordinary range, plus the zonal configuration. Not a flux measurement
  - claim: The desulfation route to raising net chondroitin sulfation is closed
    grade: B
    basis: >-
      ARSB loss is MPS VI and GALNS loss is Morquio A, both short-stature storage diseases, and
      SULF1 and SULF2 are heparan-sulfate-specific endosulfatases that do not act on chondroitin
  - claim: A non-invasive zone-resolved charge measurement of a human growth plate is now feasible
    grade: B
    basis: >-
      in vivo 3 T sodium MRI of knee cartilage in 2 min 06 s with sodium correlating to sulfated
      GAG at R2=0.739 ex vivo. Never attempted on a physis, where partial-volume and resolution
      limits are unknown
  - claim: Raising plasma sulfate raises bone length
    grade: E
    basis: >-
      untested in any species. The genetics establish that being at the low end costs trunk
      height; they do not establish that being above normal adds any
