id: round410_the_sulfation_arm_is_one_lever_with_two_steps_and_the_measurement_that_decides_it_is_free
name: "R410: sulfate and CHST3 are ONE lever in series and only the supply step is actionable - CHST3 and CHST11 are zonally SEGREGATED in human tissue with CHST3 peaking in the hypertrophic zone while the sulfate importer falls, the desulfation route closes on three storage diseases, and the measurement that would decide the whole arm is a two-minute non-invasive scan nobody has pointed at a growth plate"
aliases:
  - is fixed charge density sulfation limited
  - CHST3 zonal gradient human growth plate
  - sodium MRI growth plate
  - one lever or two sulfate
type: hypothesis
layer: L5
stub: false
summary: >-
  R409 found that CHST3, not CHST11, is the human growth plate's chondroitin sulfotransferase,
  and that the atlas's one obtainable compound - oral sodium sulfate - feeds it. The question
  that leaves is whether the sulfate donor and the enzyme are ONE lever or TWO, and whether the
  charge they build is limiting for growth at all. This round worked it.

  ⭐ ONE - CHST3 AND CHST11 ARE ZONALLY SEGREGATED IN HUMAN TISSUE, AND CHST3 PEAKS EXACTLY
  WHERE h_term IS MADE. GSE9160 is the only zone-resolved human growth plate, laser-captured
  into five compartments from two children, and it had never been asked about this pathway.
  On both of CHST3's two high-signal probe sets, in both donors, the HYPERTROPHIC ZONE is the
  maximum: donor 1 rises monotonically reserve 2,680 to proliferative 3,982 to prehypertrophic
  8,450 to hypertrophic 12,526 on one probe and 3,476 to 6,279 to 7,097 to 12,979 on the other,
  a 3.7-fold reserve-to-hypertrophic rise on each; donor 2 also peaks hypertrophic on both
  probes (8,841 and 11,094) without being monotone. CHST11 does the opposite - it peaks in the
  PROLIFERATIVE zone in both donors on its strongest probe (29,568 and 13,829 against
  hypertrophic 10,979 and 7,715). ⭐ That is a completely independent corroboration of R409's
  purity split: a different platform, different donors, nineteen years apart, agreeing that the
  6-O enzyme and the 4-O enzyme are not interchangeable and that the 6-O enzyme is the one
  operating in the zone that produces roughly 80 percent of longitudinal growth. XYLT1 and
  CSGALNACT1, the chain-initiation enzymes, also peak proliferative - so the matrix is BUILT in
  the proliferative zone and 6-O-sulfated in the hypertrophic zone.

  ⭐⭐ TWO - AND THE SUPPLY STEP MOVES THE OTHER WAY, WHICH IS THE ARGUMENT THAT THEY ARE IN
  SERIES AND NOT SATURATED. SLC26A2, the plasma-membrane sulfate importer, peaks in the
  PROLIFERATIVE zone and FALLS into the hypertrophic zone in both donors (donor 1 reserve 2,093,
  proliferative 8,558, hypertrophic 5,059; donor 2 5,868, 7,774, 3,503). So in the one zone that
  makes height, the importer is declining while the enzyme is rising. That is the configuration
  in which SUBSTRATE, not enzyme, becomes the constraint - and it is the first mechanistic
  argument in this atlas connecting the oral sulfate compound specifically to h_term rather than
  to sulfation in general. ⚠ Grade E: this is a transcript gradient in two donors, not a flux
  measurement, and transcript is not enzyme activity.
  ⭐ The purity data agree from a different angle: the tissue's cartilage-SPECIFIC investment is
  in the last two steps - SLC35B2, the Golgi PAPS transporter, at ratio 5.00, and CHST3 at 3.32
  - while the supply enzymes sit at housekeeping ratios (SLC26A2 1.95, PAPSS1 1.01, PAPSS2 1.08).
  ⭐ AND THE HUMAN GENETICS SAY THE SUPPLY END IS NOT SATURATED AT ORDINARY VARIATION:
  scherer2025's heterozygous carriers of SLC13A1 loss-of-function are not ill, sit within the
  normal range of plasma sulfate, and are dose-responsively SHORTER, with the sitting-height arm
  at P=2.16e-07 (R322). Ordinary human variation in plasma sulfate moves human height.
  → ONE LEVER, TWO STEPS, AND ONLY ONE STEP IS ACTIONABLE. CHST3 has NO human ChEMBL target
  record at all and its direction is to RAISE, so it cannot be drugged; sulfate can be supplied.

  ⛔ THREE - THE OBVIOUS WAY TO MAKE IT BIGGER IS CLOSED, AND CLOSED PROPERLY. If you cannot add
  more sulfotransferase, block the enzymes that REMOVE the sulfate. Every one of them fails:
  ARSB, the 4-sulfatase, loss causes mucopolysaccharidosis VI - short stature. GALNS, the
  6-sulfatase, loss causes Morquio A - severe short stature and the most skeletal of all the
  storage diseases. And SULF1 and SULF2, the extracellular 6-O endosulfatases that look like the
  ideal target because they act outside the cell on exactly the position CHST3 sulfates, are
  HEPARAN SULFATE specific and do not act on chondroitin sulfate at all. The desulfation arm of
  chondroitin sulfate is lysosomal, and losing any of it produces short stature by storage rather
  than by charge. There is no charge-preserving route through it.
  ✓ Consistent with that, the sulfatases are contaminant-leaning in the purity data (ARSB 0.14,
  SULF1 0.30, SULF2 0.40) while the sulfotransferases CHST3, CHST13 and CHST14 are enriched: the
  plate is built to ADD charge, not to remove it.

  ⭐⭐⭐ FOUR - AND THE MEASUREMENT THAT WOULD DECIDE THE WHOLE ARM EXISTS, IS NON-INVASIVE, AND
  TAKES TWO MINUTES. This atlas's own fixed_charge_density node states that NO zone-resolved
  fixed-charge-density measurement of a growth plate exists in any species, and a targeted query
  confirms it - 415 sodium-MRI records, none on a physis. But the instrument has arrived:
  · IN VIVO, HUMAN KNEE, 3 TESLA, 2 MINUTES 6 SECONDS. A dual-echo ultrashort-echo-time rosette
    sequence (PETALUTE) quantified articular cartilage sodium at 168.8 +/- 29.9 mM in five
    healthy subjects, equivalent to the slower radial standard at 41 percent of the scan time.
    Ordinary clinical field strength, no radiation, no contrast.
  · AND SODIUM CONTENT TRACKS THE THING WE CARE ABOUT: in twelve PAEDIATRIC knee specimens at
    10.5 T, tissue sodium concentration correlated with biopsy sulfated GAG content at R2=0.739.
  · ⭐ AND THE SAME STUDY GIVES THE MATURATION DIRECTION: from birth to 12 years, cartilage
    WATER fell 18 percent, COLLAGEN rose 59 percent, and SULFATED GAG FELL 36 percent, all with
    R2 >= 0.557. The charge that drives osmotic swelling is DECLINING across exactly the window
    this case is in - the profile of a lever, and the same shape that made SCUBE3 interesting.
  ⚠ THE LIMIT, STATED WITH IT: those are ARTICULAR knee specimens, not growth plate, and
  epiphyseal cartilage is only the closest available proxy. Nobody has segmented a physis on a
  sodium scan. That is the unrun experiment, and it needs no drug, no animal and no access.

  ⛔ FIVE - AND THE HONEST CEILING, BECAUSE THE ANSWER TO "CAN THIS BE HUGE" IS NO.
  · The cell arm is triply defended and this file already established it: hall2001's terminal
    volume set point re-tunes across 180 to 380 mOsm to the same ~645 cubic micrometres;
    bush2008 found hypotonic swelling produces NO preferential increase in length - a swelling
    agent makes a chondrocyte fatter, not taller - and that the matrix offers LITTLE RESTRICTION
    to swelling, which means matrix charge does not direct cell growth either; and bush2008's
    osmotically inactive fractions say hypertrophy is mostly PROPORTIONAL enlargement rather than
    swelling, so h_term costs biosynthesis.
  · The mouse rows run the wrong way: IMPC Slc26a2 heterozygote TIBIA +0.242 at P=0.00384, the
    rare and therefore informative direction under CORR-329, and Papss2 heterozygote body +1.306.
  · The kidney fights the supplement: renal sulfate reabsorption is capacity-limited, so an oral
    dose raises filtered load and is excreted (R322), and the only human demonstration is a
    single-dose 25 percent excursion at two hours, not a new set point.
  · Size, from R322's own gradient and refused there as an estimate for the same reasons: about
    0.104 SD of sitting height per SD of plasma sulfate, which at the largest published excursion
    is of order one centimetre. That is the honest scale of this arm.
  → WHAT IT IS: a cheap, oral, Step-0-clean addition aimed at the largest term in the identity
  and at the TRUNK, gated on one blood test that has never been ordered, with a second free
  measurement now available that would say whether there is any headroom at all. What it is not
  is a large effect, and nothing in this round makes it one.
