id: hyaluronan_matrix
name: Hyaluronan in growth plate matrix
aliases:
- HA
- hyaluronic acid
- HAS2
type: metabolite
layer: L5
stub: false
summary: 'Hyaluronan is the unsulphated, unbranched glycosaminoglycan that forms the central filament
  of the proteoglycan aggregate: aggrecan G1 domains bind it non-covalently, link protein stabilises each
  interaction, and the resulting aggregate is too large to diffuse out of the collagen network. It is
  also the ligand of CD44 and thus the anchor of the chondrocyte pericellular coat. Its necessity is shown
  by conditional Has2 deletion in limb bud mesenchyme with Prx1-Cre: all limb skeletal elements are severely
  shortened, growth plates are disorganised with loss of columnar architecture and reduced aggrecan deposition
  in the matrix, the number of hypertrophic chondrocytes and the expression domains of hypertrophic markers
  are strikingly reduced, secondary ossification centres fail to form centrally, and proximal phalanges
  are duplicated. So hyaluronan is required not just to immobilise aggrecan but for chondrocyte maturation
  itself. The synthesis and degradation rates of hyaluronan in the growth plate, and its concentration
  by zone, were not located in this sweep.'
