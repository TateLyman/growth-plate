id: pericellular_matrix
name: Pericellular matrix (PCM)
aliases:
- PCM
- pericellular capsule
type: tissue_structure
layer: L5
stub: false
summary: 'The pericellular matrix is the 2-4 um shell immediately surrounding each chondrocyte, distinguished
  from the interterritorial matrix by containing collagen VI, perlecan, hyaluronan-CD44 coats, high collagen
  IX and XI on thin fibrils, and little or no collagen II fibril bulk. It is mechanically distinct and
  SOFTER than the surrounding matrix: in situ AFM stiffness mapping gives a PCM:ECM modulus ratio of about
  0.35 in human, porcine and murine articular cartilage, consistent with earlier measurements on mechanically
  isolated chondrons. That compliance is functional - it converts tissue-level strain into a cell-level
  strain and fluid-flow signal - and the PCM is also a signalling reservoir, with FGF-2 stored bound to
  perlecan heparan sulphate and released on mechanical loading. In the growth plate the PCM is additionally
  the structural unit of the column: chondrons are tubular rather than spherical, and under compression
  they bend and kink preferentially at the reserve/proliferative interface. The PCM:ECM modulus ratio
  of the growth plate specifically, as distinct from articular cartilage, has not been measured.'
