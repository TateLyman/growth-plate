localization:
- 'chicken epiphyseal growth cartilage: alkaline phosphatase confined to hypertrophic and calcifying zones
  (vnnen1980)'
- 'porcine growth plate HZ: maximal alkaline phosphatase activity coincident with maximal extractable
  organic phosphorus (althoff1982)'
- 'human growth plate metaphyseal boundary: ALPL protein detected at the mineralization-promoting GP-metaphysis
