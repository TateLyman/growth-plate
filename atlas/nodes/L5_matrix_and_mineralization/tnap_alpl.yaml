id: tnap_alpl
name: Tissue-nonspecific alkaline phosphatase (TNAP/ALPL)
aliases:
- ALPL
- TNAP
- TNSALP
- Akp2 (mouse)
type: protein
layer: L5
stub: false
summary: 'TNAP is the GPI-anchored ectophosphatase on the outer membrane of matrix vesicles and of hypertrophic
  chondrocytes and osteoblasts whose job is to destroy extracellular PPi so that hydroxyapatite can propagate.
  It is a homodimer with three catalytic metal sites (Zn at M1/M2, Mg at M3) plus a structural M4 site;
  the rising extracellular Ca gradient during mineralization first activates TNAP by replacing Mg with
  Ca at M3 and then deactivates it as Ca displaces Zn from M1/M2, which is a built-in shut-off at the
  completion of mineralization. Its activity in growth cartilage is restricted to the hypertrophic and
  calcifying zones by immunohistochemistry and by X-ray microprobe, which finds maximal alkaline phosphatase
  activity coincident with maximal extractable organically bound phosphorus in the hypertrophic zone of
  the pig growth plate. Alpl-/- mice have under 1% of wild-type plasma activity, accumulate PPi, phosphoethanolamine
  and pyridoxal-5-phosphate, and show developmental arrest of chondrocyte differentiation with diminished
  or absent hypertrophic zones. High-resolution TEM in these mice places the defect precisely: mineral
  crystals still initiate normally INSIDE matrix vesicles but fail to proliferate beyond the vesicle membrane,
  so TNAP is required for the extravesicular, not the intravesicular, step. In humans this is hypophosphatasia,
  and bone-targeted enzyme replacement with asfotase alfa raised one-year survival in perinatal and infantile
  disease from 42% to 95%, which is the interventional human proof that TNAP activity is rate-limiting.'
