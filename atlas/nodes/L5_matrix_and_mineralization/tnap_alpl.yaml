- 'matrix vesicle outer membrane: TNAP is GPI-anchored there (anderson2004)'
human_evidence: direct
human_evidence_note: Human ALPL loss-of-function (hypophosphatasia) and its reversal by enzyme replacement
  provide both observational and interventional human evidence, and ALPL protein has been detected at
  the human growth plate-metaphysis interface.
