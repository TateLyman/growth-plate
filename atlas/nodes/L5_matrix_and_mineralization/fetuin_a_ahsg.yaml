stub: false
summary: 'Fetuin-A is a liver-derived serum glycoprotein that reaches bone and cartilage from the circulation
  and acts as a systemic mineralization inhibitor with a mechanism unlike osteopontin''s. Rather than
  adsorbing to a growing crystal face, it sequesters calcium and phosphate into soluble colloidal calciprotein
  particles, keeping supersaturated fluid metastable. Ahsg-null mice develop widespread ectopic calcification,
  particularly on a calcification-prone genetic background, establishing the function in vivo. Its relevance
  to the growth plate was established directly in human tissue: spatial proteomics of human growth plate
  identifies AHSG together with SPP1 as the proteins concentrated at the growth plate-epiphysis interface,
  which behaves as a mineralization inhibition zone, while the metaphyseal interface carries the same
  inhibitors PLUS ENPP1 and ALPL and behaves as a promotion zone. A size-exclusion mechanism may make
  this spatially precise: fetuin is excluded from the interior of the collagen fibril, so intrafibrillar
  mineral can form by inhibitor exclusion while extrafibrillar mineral is suppressed.'
