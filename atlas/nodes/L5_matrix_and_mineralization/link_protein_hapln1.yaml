id: link_protein_hapln1
name: Link protein (HAPLN1)
aliases:
- HAPLN1
- CRTL1
- cartilage link protein
type: protein
layer: L5
stub: false
summary: 'Link protein is the small glycoprotein that clamps the aggrecan G1 domain onto hyaluronan, converting
  a reversible interaction into a stable ternary complex. Hapln1-null mice are dwarfed with craniofacial
  abnormalities, so link protein is required for normal longitudinal growth in vivo. Its stoichiometry
  is not one-to-one and it changes with age in a way that destabilises the aggregate: in human articular
  cartilage from individuals over 13 years, the molar concentration of link protein is LOWER than that
  of the aggrecan G1 domain in every sequential extract, and particularly so in the 1 M guanidinium fraction,
  so a substantial fraction of aggregates in adult human cartilage are link-protein-deficient and therefore
  unstable. Link protein also fragments with age, but fragmentation does not change its extractability.
  The consequence, stated bluntly by the authors, is that the textbook model of the proteoglycan aggregate
  - derived from immature animal cartilage where a single PBS extraction recovers most components - does
  not describe adult human cartilage, which contains a heterogeneous population of complexes with varying
  stability. Quantitative electron microscopy agrees: monomers per aggregate and the proportion of aggregating
  monomers both fall with age.'
