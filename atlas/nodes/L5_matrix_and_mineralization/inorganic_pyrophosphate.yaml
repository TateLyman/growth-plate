id: inorganic_pyrophosphate
name: Inorganic pyrophosphate (PPi)
aliases:
- PPi
- diphosphate
type: metabolite
layer: L5
stub: false
summary: 'PPi is the master physiological inhibitor of hydroxyapatite deposition. It adsorbs to nascent
  apatite crystal faces and blocks crystal proliferation and growth, so mineralization occurs where PPi
  is locally destroyed and is prevented everywhere else. Human plasma PPi is about 3.5 umol/L (99% range
  1.19-5.65 umol/L in 73 healthy adults by isotope dilution), slightly higher in 0-15 year olds, and urinary
  PPi exceeds 10 umol/L. Against a serum phosphate of roughly 1-2 mmol/L this makes the circulating Pi:PPi
  ratio of order 300-600:1, and the local ratio in the extracellular fluid of the hypertrophic zone is
  the actual control variable. The two ends of the human dose response are known experiments: loss of
  TNAP (hypophosphatasia) raises PPi and produces rickets and osteomalacia with an unmineralized hypertrophic
  zone, while loss of ENPP1 (generalized arterial calcification of infancy) lowers PPi and produces catastrophic
  ectopic calcification, and the same ENPP1 alleles also produce autosomal recessive hypophosphatemic
  rickets type 2, so PPi deficiency and PPi excess both damage the growth plate. In growth plate chondrocytes
  PPi is not merely a physicochemical inhibitor: extracellular PPi suppresses and extracellular Pi stimulates
  terminal differentiation and apoptosis, so PPi/Pi is a differentiation signal as well as a crystal poison.'
