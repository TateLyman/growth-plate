id: fixed_charge_density
name: Fixed charge density (FCD)
aliases:
- FCD
- matrix fixed charge
type: process
layer: L5
stub: false
summary: 'Fixed charge density is the molar concentration of immobilised negative charge, almost all of
  it chondroitin-sulphate and keratan-sulphate carboxylate and sulphate groups on aggrecan, held inside
  the collagen network. It is the physical parameter that converts proteoglycan content into mechanical
  function. Measured non-destructively by sodium NMR combined with ideal Donnan theory, calf articular
  cartilage near physiological conditions has an FCD of -0.28 +/- 0.03 M (n=10), and calf EPIPHYSEAL cartilage
  - the closest available proxy for growth plate - has an FCD of -0.19 to -0.35 M that varies with position
  within the joint in proportion to glycosaminoglycan content. Sodium NMR visibility in cartilage is essentially
  complete: the NMR:ICP sodium ratio is 1.02 +/- 0.04 in calf and 1.04 +/- 0.11 in adult bovine tissue,
  so the measurement is not missing a bound pool. FCD falls with decreasing bath ionic strength, and the
  FCD-derived swelling pressure is markedly non-ideal, so FCD calculated by ideal Donnan theory is an
  upper bound on the mechanically effective charge. Depletion of glycosaminoglycan raises permeability
  and restoring synthetic polyanion charge restores it, confirming the causal chain from charge to fluid
  transport to stiffness. No zone-resolved FCD measurement of a growth plate exists.'
