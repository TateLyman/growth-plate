contradicts:
- 'REVERSES the_transport_asymmetry_probably_fails FOR THE HYPERTROPHIC ZONE AND LEAVES IT STANDING FOR THE
  PROLIFERATIVE ZONE. That node swept guessed parameters and found the asymmetry in only 21 per cent of the
  grid. With yun2018 supplying the length and williams2007 the diffusivity, the hypertrophic zone - which
  is where nakao2015 puts the CNP axis - lands at phi 3.3 at a plausible consumption rate. The reversal is
  partial and is itself qualified by inward advection, which williams2007 documents and neither node
  models.'
