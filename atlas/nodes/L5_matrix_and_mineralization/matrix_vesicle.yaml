id: matrix_vesicle
name: Matrix vesicle
aliases:
- MV
- extracellular matrix vesicle
type: tissue_structure
layer: L5
stub: false
summary: 'Matrix vesicles are 30-200 nm membrane-bounded structures budded from the plasma membrane of
  hypertrophic chondrocytes into the longitudinal septa of the lower hypertrophic zone, and they are where
  the first apatite crystal in the growth plate forms. They are functionally defined by their cargo: PHOSPHO1
  inside, generating Pi from phosphocholine and phosphoethanolamine; TNAP and NPP1 GPI-anchored or bound
  on the outer leaflet; PiT-1 phosphate transporters to import extravesicularly generated Pi; annexins
  and ion channels to admit Ca; and a nucleational core of calcium-acidic-phospholipid-phosphate complexes
  on the inner leaflet. Mineralization is therefore a two-stage process with genetically separable steps.
  Stage one is intravesicular crystal initiation, which requires PHOSPHO1 and Pi influx and which still
  occurs normally in Alpl-/- mice. Stage two is rupture of the vesicle membrane and propagation of mineral
  onto the collagen scaffold, which requires TNAP to hold extravesicular PPi low and which is exactly
  the step that fails in Alpl-/- growth plate by high-resolution TEM. This is why Phospho1/Alpl double
  nulls have no skeletal mineral at all while each single null retains some. NPP1 localises to matrix
  vesicles but ANK does not, which explains why ANK deficiency cannot rescue the Alpl-/- phenotype even
  though it lowers systemic PPi.'
