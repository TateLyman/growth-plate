human_evidence: direct
human_evidence_note: The expression contrast is human postnatal growth plate (GSE288028, 12 samples, sex-
  corrected purity split) and the effect sizes are human burden statistics from 1.45M exomes. The elongation
  partition that motivates the round is rat and has no human equivalent, and the cross-linking null that the
  sign split explains is mouse.
translation_risk: moderate
translation_risk_reason: Steady-state transcript abundance is not secretory flux, and a coat protein could
  be rate-limiting without being abundant, so the closure of the COPII axis is grade D rather than decisive.
  The partition that makes matrix synthesis 32-49 per cent of elongation is rat and site-specific.
summary: 'WHY THIS TERM AT ALL. CORR-361 corrected the hypertrophy figure using wilsman1996''s closed
  stereological partition and in doing so exposed MATRIX SYNTHESIS at 32 per cent of daily elongation in a
  fast plate and 49 per cent in a slow one - co-equal with hypertrophy and larger than it in a slow plate,
  which is the plate a subject at bone age 16 has. This file has worked hypertrophy to exhaustion and has
  never worked matrix synthesis as a term. Coverage before this round, measured: CRTAP zero nodes and zero
  ledger, PPIB zero and zero, SEC23A zero and zero, "prolyl 4-hydroxylase" zero and zero, "secretion
  competence" zero and zero, COPII zero nodes.


  THE RESULT, ON THE FREE LOCAL QUERY. GSE288028 with R411''s sex-corrected purity split - four purest
  against four most contaminated MALE samples, calibrating at COL2A1 7.65, COL10A1 49.6, ACAN 1.96, PTPRC
  0.00 and HBB 0.03. The collagen FOLDING and post-translational machinery is strongly cartilage-enriched:
  CRTAP 6.25, P4HB 5.55, PPIB 5.45, P3H1 4.72, FKBP10 4.52, PLOD1 4.05, SERPINH1 3.39, P4HA2 2.96, P3H3 2.68,
  P4HA1 1.82. The COPII coat is not: SAR1A 1.29, SAR1B 0.97, SEC23A 0.91, SEC24C 0.73, SEC23B 0.64, SEC24A
  0.42, SEC24D 0.37, SEC24B 0.22, SEC13 0.92, SEC31A 0.73, SEC31B 0.39. Neither is the large-cargo export
  apparatus that exists specifically to move procollagen: MIA3 (TANGO1) 0.63, MIA2 0.47, SEC16A 0.60, KLHL12
  0.76, CUL3 0.26. NINE OF TEN FOLDING GENES CLEAR THE ACAN BENCHMARK AND NOT ONE OF THE SIXTEEN EXPORT GENES
  DOES. The cell''s entire collagen investment is in making the molecule foldable rather than in making it
  exportable.


  AND THE LOGIC IS ROBUST TO WHAT THE COMPARATOR IS, WHICH MATTERS BECAUSE THE CONTAMINATED FRACTION IS BLOOD
  AND CONTAINS PROFESSIONAL SECRETORS. Both arms are scored against the SAME comparator, so the internal
  contrast between them survives whatever the comparator''s own secretory character is. The consequence is
  that if secretion is rate-limiting in this cell the limit sits at FOLDING and not at EXPORT, which closes
  the COPII and TANGO1 large-cargo axis - the obvious and fashionable destination from CORR-361 - before a
  round is spent on it. Grade D, because steady-state transcript abundance is not flux.


  AND THE HUMAN EFFECT SIGNS SPLIT ALONG THE SAME SEAM, WHICH IS THE PART THAT CHANGES A DECISION. Of the
  whole panel only five genes reach kosmicki2026''s 207 and they sort perfectly by function. Enzymes that
  make collagen SECRETABLE are load-bearing: SERPINH1/HSP47 at minus 1.15 cm, P=6.06e-28 across 4,537
  carriers. So is the enzyme that initiates the glycosaminoglycan chain, XYLT1, at minus 3.88 cm, P=1.3e-11,
  and the proteoglycan core itself, ACAN, at minus 16.6 cm. Enzymes that make collagen CROSS-LINKED are
  brakes: PLOD1 at plus 0.535 cm, P=1.1e-11 across 8,036 carriers, and PLOD2 at plus 0.909 cm, P=1.0e-11
  across 2,791. ONE PATHWAY, OPPOSITE SIGNS, AND THE SEAM IS EXACTLY WHETHER THE ENZYME SERVES SECRETION
  COMPETENCE OR CROSS-LINK FORMATION.


  AND THAT RETRO-EXPLAINS R332''S INCONVENIENT NULL. mcnerny2015 gave BAPN to growing male mice, reduced
  mature cross-linking substantially with target engagement proven in the same animals, and tibia length did
  not move at p=0.580 - which R332 recorded as a mechanistic strike it could not account for. On this split
  it is predicted rather than anomalous: cross-linking sets mechanical QUALITY and not LENGTH, so the arm
  R331 and R334 built PXS-5505 on was never the arm carrying the matrix term. The arm that does carry it,
  secretion competence, has never been examined.


  THE ASCORBATE TENSION, RAISED AND RESOLVED IN THE SAME ROUND SO IT IS NOT LEFT AS AN UNNOTICED CONFLICT.
  P4HA1, P4HA2 and P4HB are 2-oxoglutarate and Fe(II) dioxygenases requiring ascorbate, they are 1.8 to 5.5
  fold cartilage-enriched, and prolyl 4-hydroxylation is required for the triple helix to fold and therefore
  for collagen to leave the cell at all - while this file contraindicates megadose vitamin C because
  ascorbate also feeds TET and KDM5, which run height-losing. Two arms of one cofactor pointing opposite
  ways, never previously stated together. It resolves in favour of the existing contraindication, because
  prolyl 4-hydroxylase is not ascorbate-limited at dietary adequacy so megadosing cannot raise its flux while
  it can still feed the erasers. Adequacy remains non-negotiable, and scurvy is a collagen-secretion disease,
  which is this axis stated in the negative.


  WHAT THIS DOES NOT PRODUCE. No compound. SERPINH1''s entire pharmacology runs the wrong way, since HSP47 is
  an inhibition target in fibrosis, thrombosis and cancer, and arimoclomol - the one approved heat-shock
  amplifier - has zero skeletal literature in any species. XYLT1 has no agent either and its direction is
  also to raise. And the whole panel is transcript abundance in twelve samples: NOBODY HAS MEASURED COLLAGEN
  SECRETION RATE PER CHONDROCYTE IN ANY SPECIES, which is the actual quantity CORR-361 makes 32 to 49 per
  cent of elongation.'
