id: round444_secretion_competence_not_export_capacity
name: R444 - the chondrocyte concentrates collagen folding enzymes and not the COPII export coat, and the
  human effect signs split at the secretion-competence versus cross-linking seam
aliases:
- R444
- COPII is not enriched in cartilage
- secretion competence
- the collagen sign split
- why BAPN was null
type: process
layer: L5
stub: false
confidence: B
last_verified: '2026-08-15'
species_basis:
- human
