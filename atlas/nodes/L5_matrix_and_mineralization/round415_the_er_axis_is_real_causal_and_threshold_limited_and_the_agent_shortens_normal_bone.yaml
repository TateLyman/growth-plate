id: round415_the_er_axis_is_real_causal_and_threshold_limited_and_the_agent_shortens_normal_bone
name: "R415: the ER/secretory axis worked to a conclusion - the direction is CAUSAL with a length endpoint in a non-dysplastic animal and the human genetics agree at P=1e-157, but normal hypertrophic chondrocytes carry a LATENT CAPACITY that must be EXCEEDED, and the one approved agent was already given to normal growing mice and IMPAIRED FEMUR GROWTH. Closes as a lever, delivers CARBAMAZEPINE as a contraindication"
aliases:
  - ER stress growth plate lever
  - carbamazepine contraindication height
  - SERPINH1 HSP47 height
  - unfolded protein response bone length
type: hypothesis
layer: L5
stub: false
summary: >-
  R414 named the ER and secretory-proteostasis apparatus as the largest uncovered module in the
  blind-spot data - 31 of 62 genes with zero atlas mentions, five carrying independent height
  signals, and three human stature alleles acting through ER stress. This round worked it to a
  conclusion in both directions.

  ⭐ ONE - THE DIRECTION IS CAUSAL, HAS A LENGTH ENDPOINT, AND IS NOT A RESCUE. A transgenic
  line was made expressing an ER-stress-inducing protein under the COLLAGEN II PROMOTER in mice
  carrying NO chondrodysplasia mutation. The transgene induced classical ER stress (BiP up,
  eIF2-alpha phosphorylated, Xbp1 spliced) and the animals showed DECREASED LONG BONE GROWTH
  and a decreased chondrocyte proliferation rate - WITH NO disruption of chondrocyte morphology
  or growth plate architecture and NO change in apoptosis. ⭐ That is ER stress ALONE, imposed
  on an otherwise normal plate, SHORTENING BONE, with the architecture intact so the effect
  cannot be dismissed as generalised dysplasia. CORR-203 does not apply to it.

  ⭐⭐ TWO - AND THE HUMAN GENETICS AGREE, WELL POWERED, FROM TWO INSTRUMENTS. Running the whole
  108-gene ER and secretory module against the 3,034 conditionally independent height variants
  returns 10 hits, 8 of them intragenic, and SIX OF THE EIGHT ARE NEGATIVE - led by the two
  strongest by an enormous margin:
  · SERPINH1 (HSP47, the COLLAGEN-SPECIFIC ER CHAPERONE) -0.434 cm at -log10 P = 157.5,
    distance 0, 394 CPM at 3.4x cartilage enrichment
  · EIF2AK3 (PERK, the ER stress SENSOR) -0.252 cm at -log10 P = 90.0, distance 0
  then EDEM3 -0.288, KDELR2 -0.186, CNIH4 -0.176, EDEM2 -0.093 - against only RPN2 +0.160 and
  OS9 +0.293 (the latter at -log10 P = 1.7, i.e. not significant).
  ⭐ AND SERPINH1 CARRIES A SECOND, INDEPENDENT INSTRUMENT: its rare-variant burden effect is
  -6.50 cm at P = 3.1e-25 (recorded in R404 and dismissed there as "an intracellular chaperone,
  wrong modality"). Two instruments, one gene, same direction. Human clinical genetics concurs
  from both ends - SERPINH1 loss causes osteogenesis imperfecta type X, and PERK loss causes
  Wolcott-Rallison syndrome, which includes spondyloepiphyseal dysplasia and short stature.
  → LOSING ER FOLDING AND QUALITY-CONTROL CAPACITY SHORTENS. The module is LOAD-BEARING and the
  therapeutic direction is to RAISE capacity or LOWER stress.

  ⛔⛔ THREE - AND THE AXIS IS A THRESHOLD, WITH NORMAL SITTING BELOW IT. THIS IS WHAT CLOSES IT.
  Correlating mutant protein expression with the onset of the unfolded protein response across
  four mouse lines from E14.5 to E17.5 showed that HETEROZYGOTES expressed mutant collagen X
  from E14.5 but exhibited NO evidence of a UPR and NO hypertrophic zone expansion until after
  E17.5, and that only homozygotes crossed over. The authors' conclusion is explicit:
  HYPERTROPHIC CHONDROCYTES HAVE A LATENT CAPACITY TO DEAL WITH ER STRESS WHICH MUST BE EXCEEDED
  TO TRIGGER THE UPR AND THE PATHOLOGY.
  → A BUFFER YOU ARE NOT CURRENTLY EXCEEDING CANNOT BE RELIEVED. Every therapeutic result on
  this axis - carbamazepine in the Schmid dysplasia, PERK inhibition in the same model - is
  rescue of a plate that has been pushed OVER the threshold, which is CORR-203 stated at the
  level of a mechanism rather than a model.

  ⛔⛔⛔ FOUR - AND THE DECISIVE TEST WAS ALREADY DONE, IN THE RIGHT ANIMAL, AND IT RUNS THE
  WRONG WAY. CORR-340's move - ask who has already dosed the normal animal - returns a study
  that gave CARBAMAZEPINE to CONTROL mice alongside its disease model: 3-week-old MALES, treated
  for 3 or 6 weeks at the dose effective in metaphyseal chondrodysplasia, assessed by
  micro-computed tomography and three-point bending. In the disease model it gave no benefit.
  ⭐ IN THE CONTROL MICE, SIX WEEKS OF CARBAMAZEPINE IMPAIRED FEMUR GROWTH AND LOWERED FEMORAL
  CORTICAL AND TRABECULAR BONE MASS. The authors state the negative impact on developing mouse
  bones themselves and flag it for any human clinical application in growing individuals.
  → THE ONLY APPROVED AGENT ON THIS AXIS SHORTENS THE FEMUR OF A NORMAL GROWING MALE MOUSE AT
  THE DOSE THAT RESCUES THE DYSPLASIA. That is a measured negative in the correct animal, age,
  sex and endpoint - stronger than most closures in this file, which rest on absence of data.

  ⛔ NEW CONTRAINDICATION, AND IT IS CLINICALLY LIVE: CARBAMAZEPINE. A common anticonvulsant and
  mood stabiliser prescribed to adolescents, with a direct measured impairment of femur growth in
  normal growing male mice. It joins topiramate and zonisamide (flagged in R347 via carbonic
  anhydrase) as anticonvulsants with a predicted or measured cost to linear growth, and it is the
  best-evidenced of the three. ASK WHETHER HE IS ON IT.

  ⛔ FIVE - AND THE ONE DIRECTION THAT IS NOT THRESHOLD-LIMITED HAS NO AGENT. Raising CHAPERONE
  CAPACITY rather than lowering stress would in principle raise folding throughput even in an
  unstressed cell, and SERPINH1 is the best-anchored gene in the module. But HSP47's entire
  pharmacology runs the other way - it is pursued as an INHIBITION target in fibrosis, thrombosis
  and cancer - and the one approved amplifier of the heat-shock response, arimoclomol (approved
  2024 for Niemann-Pick type C, oral, paediatric), has ZERO skeletal literature of any kind.
  Nobody has raised a chaperone in a growth plate in any species.

  ⭐ WHAT SURVIVES. The axis is REAL, CAUSAL and LOAD-BEARING, and that is worth having: it means
  ANYTHING THAT LOADS THE CHONDROCYTE ER IS A COST, and the plate secretes COL2A1 at roughly
  70,000 CPM so its secretory burden is among the largest in the body. What it is not is a lever,
  because the tissue is buffered below the threshold and the only obtainable agent is measured to
  shorten a normal femur. The module stays in the atlas as a named axis with a direction, a
  contraindication, and an explicit statement of why relieving it does nothing in a normal plate.
