localization: >-
  human growth plate; the ER and secretory apparatus is abundant and cartilage-enriched
  throughout, with SERPINH1 at 394 CPM and 3.4x
human_evidence: direct
human_evidence_note: >-
  The allelic effects are human and well powered, and SERPINH1 loss (osteogenesis imperfecta type
  X) and PERK loss (Wolcott-Rallison, with spondyloepiphyseal dysplasia and short stature) are
  human clinical genetics. The threshold result and the carbamazepine negative are mouse.
species_basis:
  - human
  - mouse
translation_risk: high
translation_risk_reason: >-
  The axis is buffered below its threshold in a normal plate, the only approved agent is measured
  to impair femur growth in normal growing mice, and the non-threshold-limited direction has no
  agent in any species.
confidence: B
claim_grades:
  - claim: Imposing ER stress on an otherwise normal growth plate shortens bone
    grade: B
    basis: >-
      a targeted transgene in mice without a dysplasia mutation, with decreased long bone growth
      and proliferation and intact architecture. One study, one line
  - claim: Losing ER folding and quality-control capacity shortens humans
    grade: B
    basis: >-
      6 of 8 intragenic signals negative, led by SERPINH1 at -log10P 157.5 and PERK at 90.0, with
      SERPINH1 corroborated by a second instrument at -6.50 cm, and two concordant Mendelian
      diseases. Nearest-gene assignment still applies
  - claim: The axis is threshold-limited and a normal plate sits below the threshold
    grade: B
    basis: >-
      heterozygotes expressing mutant protein showed no UPR and no phenotype until homozygous
      dosage was reached; the authors state the latent capacity explicitly
  - claim: Relieving ER stress raises growth in a normal plate
    grade: E
    basis: >-
      REFUTED as far as any agent has been tested. Carbamazepine at the dose effective in the
      dysplasia impaired femur growth in normal growing male mice
  - claim: Carbamazepine is a contraindication for linear growth
    grade: B
    basis: >-
      direct measurement in normal growing male mice with the authors' own warning for human use
      in growing individuals. Mouse only, one study, and the mechanism of the growth impairment
      was not established
  - claim: Raising chaperone capacity would raise throughput
    grade: E
    basis: >-
      untested in any species. HSP47's whole pharmacology is inhibition, and the one approved
      heat-shock amplifier has no skeletal literature
