- phosphoethanolamine/phosphocholine phosphatase
type: protein
layer: L5
stub: false
summary: 'PHOSPHO1 is a cytosolic, matrix-vesicle-enclosed phosphatase specific for phosphoethanolamine
  and phosphocholine. It supplies the intravesicular Pi that seeds the first apatite crystals inside matrix
  vesicles, which is a different step from TNAP''s job of destroying extravesicular PPi. The division
  of labour is proved by epistasis: Phospho1-/- mice have growth plate abnormalities, bowed long bones,
  spontaneous fractures, osteomalacia and scoliosis, with reduced-mineralizing chondrocytes and matrix
  vesicles and elevated plasma PPi; transgenic overexpression of TNAP normalises their plasma PPi but
  does NOT correct their bone phenotype; and Phospho1/Alpl double-null mice show complete absence of skeletal
  mineralization with perinatal lethality. Mechanically, Phospho1-/- tibiae deform plastically rather
  than fracturing in three-point bending and have significantly lower elastic modulus and hardness by
  nanoindentation with lower Raman mineral:matrix ratio. Spatial lipidomics confirms the substrate logic:
  PHOSPHO1 ablation shifts the growth plate lipidome with accumulation of phosphatidylcholine, lysophosphatidylcholine,
  sphingomyelin and phosphatidylethanolamine species across resting, proliferative and hypertrophic zones.
  Independent chick work reproduces the mineralization defect on pharmacological inhibition.'
