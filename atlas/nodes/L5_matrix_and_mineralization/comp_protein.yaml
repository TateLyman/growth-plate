id: comp_protein
name: Cartilage oligomeric matrix protein (COMP)
aliases:
- COMP
- thrombospondin-5
- TSP-5
type: protein
layer: L5
stub: false
summary: 'COMP is a pentameric extracellular glycoprotein of the thrombospondin family, assembled through
  a five-stranded parallel coiled coil that encloses an axial channel, with each of the five arms ending
  in a C-terminal globular domain; native molecules appear by electron microscopy as five-armed bouquets.
  The arms contain calcium-binding thrombospondin type 3 repeats, and essentially all pseudoachondroplasia
  and many multiple epiphyseal dysplasia mutations fall in these repeats or in the C-terminal domain and
  abolish calcium binding. The consequence is not loss of an extracellular function but a proteinopathy:
  misfolded COMP is retained in the chondrocyte endoplasmic reticulum, and PSACH is a disease of ER stress
  and chondrocyte death rather than of matrix deficiency. This is why COMP mutations cause severe disproportionate
  short stature whereas Comp-null mice have no skeletal phenotype - a dominant-negative/gain-of-toxicity
  mechanism that is the opposite of the aggrecan and collagen X haploinsufficiency logic elsewhere in
  this layer. COMP also participates in matrix assembly, binding collagen IX and cooperating with it in
  fibril organisation.'
