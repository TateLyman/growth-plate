id: round295_the_swelling_contradiction_resolves_and_the_free_query_broke_my_own_dismissal
name: >-
  ROUND 295 - hypertrophic chondrocyte volume control, mapped. The atlas left its central claim marked
  "contested" while holding both papers that contest it; they measure different quantities and both are
  right, which names the lever class as SMALL OSMOLYTES rather than protein. And the one oral agent that
  has ever augmented endochondral growth - myo-inositol, absent from this atlas entirely - grew a rabbit
  mandible 4.7 per cent and did NOTHING to the femur. The reason its authors give for that null does NOT
  survive the human data - PIK3CD is expressed in the human growth plate - so the arm is unexplained rather
  than closed. And PIEZO1, top of the atlas's own height ranking, turns out to be hypertrophy-enriched in
  the human plate and never perturbed for length
aliases:
- round 295
- the swelling contradiction resolved
- myo-inositol grows the wrong bone, for the wrong reason
- PIK3CD is NOT the compartment switch in humans
- PIEZO1 is hypertrophy-enriched in the human plate
- WNK2 and the volume kinase cascade
- INPPL1 and opsismodysplasia
type: hypothesis
layer: L5
stub: false
summary: >-
  ZERO - WHAT WAS ALREADY HERE, DECLARED FIRST. This axis is not new to the atlas and CORR-313 says to say
  so. `the_swelling_machinery_has_only_ever_been_switched_off` and `the_volume_set_point_and_where_a_compound_could_act`
  were written on 2026-08-08 and already hold: that roughly 80 per cent of longitudinal growth is
  hypertrophic volume increase; bush2010's bumetanide removing about 35 per cent of 24-hour metatarsal
  elongation with hypertrophic cell NUMBER unchanged at 193 against 192 (p=0.937), a clean isolation of
  h_term; abubakar2022's NHE1 and anion-exchange inhibitors cutting growth rate from 18 to 5.5-7.4 per cent;
  hall2001's set-point that re-tunes across 180 to 380 mOsm to the same 645 cubic micrometres; loqman2013
  showing DIDS suppresses growth while cell volume RISES, so DIDS does not act through volume; quinodoz2025's
  LRRC8C gain-of-function children at minus 5.1 SD; and the Open Targets run scoring PIEZO1 0.935, ACAN
  0.969, CHST11 0.812, SLC12A2 0.776, STK39 0.741, AQP1 0.717 against positive controls GDF5 0.675 and
  LCORL 0.919. The standing conclusion was that every perturbation ever performed on this machinery points
  DOWNWARD. This round does not overturn that. It resolves the contradiction underneath it and adds three
  papers the atlas did not hold.

  ONE - THE CENTRAL CLAIM WAS MARKED "CONTESTED" AND LEFT THERE, AND THE ATLAS HOLDS BOTH SIDES.
  cooper2013, quantitative phase microscopy on live unstained chondrocytes: three phases, phase 1 from 600
  to 2000 fL at CONSTANT dry mass density 0.183 pg/fL - true hypertrophy - then PHASE 2 FROM 2000 TO 8000 fL
  WITH DENSITY DILUTED TO ABOUT 0.07 pg/fL, confirmed independently by tomographic phase microscopy. A
  2.6-fold dilution of dry mass is swelling by definition.
  bush2008, two-photon microscopy of living rat growth plate across 0-580 mOsm: cells are near-perfect
  osmometers (r-squared 0.984 and 0.989) and the osmotically INACTIVE FRACTION is 39.5 +/- 2.9 per cent in
  proliferative against 47.0 +/- 4.3 in hypertrophic, with sensitivity identical at 15.5 percent-volume per
  Osm in both. Their argument: if enlargement were swelling the inactive fraction MUST fall in hypertrophic
  cells, and it does not - if anything it rises. Their conclusion is that proportional hypertrophy
  contributes more than swelling, and `the_volume_set_point_and_where_a_compound_could_act` records this as
  "a direct hit on the premise".
  THE TWO RESULTS ARE NOT IN CONFLICT BECAUSE THEY DO NOT MEASURE THE SAME QUANTITY. Dry mass density
  measures MACROMOLECULES - protein, nucleic acid, polysaccharide. The Boyle-van't Hoff osmotically inactive
  fraction measures NON-SOLVENT VOLUME, which is macromolecules PLUS osmotically bound water, and it is
  estimated by extrapolation from an acute osmotic challenge. A cell that accumulates SMALL OSMOLYTES -
  ions, taurine, sorbitol, myo-inositol, free amino acids - together with the water they oblige will (a)
  dilute its protein dry mass, giving cooper2013's density drop, and (b) remain a perfect osmometer with an
  unchanged inactive fraction, giving bush2008. Small osmolytes contribute enormously to osmotic pressure
  and almost nothing to dry mass. BOTH PAPERS ARE RIGHT AND THE MECHANISM IS SMALL-OSMOLYTE ACCUMULATION,
  NOT PROTEIN SYNTHESIS.
  voigt2025 states the same reconciliation as settled background from the outside: hypertrophic chondrocytes
  use "cellular biogenesis AND disproportionate fluid uptake" to expand 10 to 20 fold. Not either/or. That
  is also exactly cooper2013's own three-phase structure, which the atlas had already read.
  ✗ THIS IS AN INFERENCE, GRADED E, AND IT HAS A CHEAP DISCRIMINATING MEASUREMENT: intracellular small-solute
  content by zone. Nobody in this file has that number for any species.

  TWO - AND THE ONE ORAL AGENT THAT HAS EVER AUGMENTED ENDOCHONDRAL GROWTH IS ABSENT FROM THIS ATLAS.
  MYO-INOSITOL. Zero nodes, zero references before today. yamaguchi2019: nutritional supplementation in
  growing MICE augmented mandibular endochondral growth by 8.4 per cent. shimoyama2024, second species:
  six-week-old male Japanese white rabbits on chow containing 66 g/kg myo-inositol against 9.5 mg/kg control
  - roughly SEVEN THOUSAND FOLD dietary enrichment - to 25 weeks of age. MANDIBULAR LENGTH 74.95 +/- 0.53 mm
  control against 78.40 +/- 0.59 mm treated, PLUS 4.7 PER CENT, p < 0.05, n = 5 per group, with increased
  mandibular condylar cartilage thickness. Human safety is unusually good - myo-inositol sits on Japan's
  MHLW list of substances clearly not hazardous to human health, and 12 g/day in humans produces only mild
  gastrointestinal effects.
  AND IT DID NOTHING TO THE FEMUR. No effect on femur length. No effect on body weight.
  THE AUTHORS GIVE THE REASON AND IT IS A MECHANISM, NOT A DOSING FAILURE: PIK3CD, the phosphatidylinositol
  3-kinase catalytic delta polypeptide that converts myo-inositol into phosphatidylinositol, is STRONGLY
  EXPRESSED IN MANDIBULAR CONDYLAR CARTILAGE AND WEAKLY IN FEMORAL CARTILAGE - in mouse and in rabbit alike.
  The compartment specificity is built into the enzyme distribution.
  SO MYO-INOSITOL IS NOT AN OSMOLYTE LEVER DESPITE ITS NAME. It is a phosphatidylinositol substrate-supply
  lever acting through PI3K, and the atlas must not file it under swelling.
  I THEN WROTE THAT IT WAS ALMOST CERTAINLY DEAD FOR THIS CASE - vertebral plates being primary cartilage
  like the femur rather than secondary cartilage like the mandibular condyle - AND THEN RAN THE FREE QUERY
  THAT SECTION FOUR-B REPORTS, WHICH BROKE THAT ARGUMENT. Read the two together: the length null stands,
  its stated explanation does not.

  THREE - A SECOND, INDEPENDENT LINE POINTING AT INOSITOL, AND A HUMAN SHORT-STATURE GENE THE ATLAS LACKED.
  voigt2025: the 5'-inositol phosphatase inppl1a regulates zebrafish notochord vacuolated-cell expansion
  INDEPENDENTLY of vacuole fusion - genetically decoupling the two - and is also required for hypertrophic
  chondrocyte differentiation and endochondral bone lengthening. Human INPPL1 loss of function causes
  OPSISMODYSPLASIA, a short-stature endochondral disorder. So on this arm LOSS MAKES SHORTER, which sets the
  therapeutic direction as gain and immediately runs into CORR-295 - opsismodysplasia is a recessive
  dysplasia and the tall tail of a trait is not a disease. Two independent lines - PIK3CD/myo-inositol and
  INPPL1 - now converge on inositol metabolism as a chondrocyte SIZE determinant. That convergence is new
  to this file.

  FOUR - AND THE MASTER VOLUME KINASE HAS HUMAN CODING VARIANTS IN CARTILAGE. veerabhadraiah2025: novel
  WNK2 coding variants segregate with dominantly inherited familial erosive hand and foot osteoarthritis;
  WNK2 is expressed in chondrocytes and is highly elevated in end-stage human and mouse OA joints; and
  elevated WNK2 plus hyperosmotic stress drives an OA transcriptional signature that the variants worsen.
  WHY THIS MATTERS STRUCTURALLY: WNK kinases are the cell's osmosensors and they gate SPAK and OSR1, which
  switch NKCC1 ON and the KCC cotransporters OFF. NKCC1 is precisely the transporter bush2010 showed carries
  about a third of longitudinal elongation, and the atlas's own Open Targets run already put STK39 (SPAK) at
  0.741 and SLC12A2 at 0.776, both above the GDF5 positive control. This is the first human coding-variant
  evidence anywhere on that cascade in cartilage.
  ✗ AND THE DIRECTION IS A WARNING, NOT AN INVITATION. The height-favourable move would be MORE WNK-SPAK
  activity - more NKCC1, more swelling - and elevated WNK2 activity is what associates with joint
  destruction. This is the clearest cost-bearing node on the whole axis. Recorded, not weighed.

  FOUR-B - AND THEN I RAN THE FREE QUERY AND IT INVERTED THE COMPARTMENT ARGUMENT. CORR-316 says to hit
  the atlas's own datasets before writing, so PIK3CD went into GSE9160 - the only zone-resolved human growth
  plate - against each array's detection threshold.
  PIK3CD IS EXPRESSED IN THE HUMAN LONG-BONE GROWTH PLATE. Probe 203879_at is detected in 9 of 10
  compartment-donor cells: donor 1 proliferative 3520, prehypertrophic 1118, hypertrophic 1440,
  perichondrium 2488 against thresholds of 646-827, and donor 2 in all five compartments at 1444-2411.
  Highest in the PROLIFERATIVE zone.
  THE RODENT PAPERS COMPARED MANDIBULAR CONDYLAR CARTILAGE AGAINST FEMORAL *ARTICULAR* CARTILAGE - NOT
  AGAINST A GROWTH PLATE. Articular and growth-plate cartilage are different tissues, and the enzyme that
  is scarce in one is abundant in the other. So the mechanistic reason offered for the femoral null does not
  transfer to the human growth plate, and the dismissal of this arm cannot rest on it.
  ✗ WHAT DOES NOT CHANGE: the rabbit femur LENGTH null is a direct length endpoint and it stands. What
  changes is that it is now UNEXPLAINED rather than explained. The candidate explanations are that the
  effect is a property of secondary cartilage for reasons other than PIK3CD, or that the rabbit femur was
  measured under conditions that could not show a difference. Neither has been tested.
  ✓ AND A SECOND RESULT FROM THE SAME QUERY, WHICH IS THE STRONGEST CONVERGENCE IN THIS ROUND. PIEZO1 -
  the gene that scored 0.935 on the atlas's own Open Targets run, ABOVE EVERY POSITIVE CONTROL INCLUDING
  LCORL at 0.919 - is very highly expressed in the human growth plate AND RISES INTO HYPERTROPHY: donor 1
  probe 202771_at reads 8986 resting, 7893 proliferative, 20594 prehypertrophic, 24442 hypertrophic. A
  2.7-fold rise into the zone that performs the enlargement, at absolute levels among the highest in the
  panel, in the clean donor. Donor 2 is detected in all five.
  ✓ The volume KINASE cascade is present: STK39 (SPAK) detected 5/5 in both donors, OXSR1 4/5 and 5/5,
  INPPL1 5/5 in both. SLC12A2 (NKCC1) 2/10 and 7/10 - present but marginal on this platform.
  ✗ USEFUL NEGATIVES. WNK2, the osteoarthritis gene, is essentially ABSENT from the human growth plate -
  0 of 30 probe-donor cells in donor 1 and 2 of 30 in donor 2 across six probe sets - so the WNK that
  matters in cartilage disease is not the WNK that operates in the plate, and WNK1 (6/35) is the better
  candidate. SLC13A1 is 0/10 and SLC26A1 0-1/15, confirming that scherer2025's sulfate arm is SYSTEMIC -
  a renal transporter setting plasma sulfate - and not a local growth-plate mechanism.

  FIVE - WHAT IS NOW TRUE OF THIS AXIS, STATED SO THE NEXT ROUND DOES NOT RE-DERIVE IT.
  The mechanism is real and it is the largest single term in the height identity - about 80 per cent of
  elongation. It is experimentally isolable: bumetanide takes a third of it out without losing a cell. It
  has human common-variant support at scores above canonical height genes. It has three human genetic
  anchors, ALL OF WHICH POINT DOWNWARD - LRRC8C gain-of-function at minus 5.1 SD, INPPL1 loss in
  opsismodysplasia, and biallelic SLC13A1 loss with short stature and low plasma sulfate.
  AND EVERY PHARMACOLOGICAL PERTURBATION EVER PERFORMED ON IT IS AN INHIBITOR, because the clinical demand
  on this machinery has always been to REDUCE swelling - oedema, hypertension, seizures, glaucoma. That
  claim in `the_swelling_machinery_has_only_ever_been_switched_off` SURVIVES this round: myo-inositol is not
  a counterexample, because it is not a swelling agent.
  THE AXIS IS THEREFORE NOT DEAD AND NOT ACTIONABLE. It is the largest untouched term in the file with no
  agent pointing the right way, and the single most useful next step is not a drug search but the
  measurement in part ONE - intracellular small-solute content, by zone, in any species.
human_evidence: indirect
human_evidence_note: >-
  Three human genetic anchors, all in the losing direction: LRRC8C gain-of-function causing TIMES syndrome
  at minus 5.1 SD (quinodoz2025); INPPL1 loss of function causing opsismodysplasia (voigt2025); biallelic
  SLC13A1 loss with short stature (tise2025), plus scherer2025's r = 0.70 correlation between per-variant
  plasma sulfate effect and per-variant standing-height effect across 466,907 people. Human common-variant
  support for the transporters is strong on the atlas's own Open Targets run. WNK2 variants are human but
  the phenotype is osteoarthritis, not stature. NO HUMAN HAS EVER BEEN GIVEN AN AGENT INTENDED TO INCREASE
  growth-plate cell volume, and myo-inositol - the only oral agent with a positive endochondral result - has
  human safety data but no human growth data and no long-bone effect in any species.
species_basis:
- human
- mouse
- rat
- rabbit
translation_risk: high
translation_risk_reason: >-
  The one agent with a positive endochondral growth result works only on a secondary cartilage whose
  responsiveness is explained by an enzyme distribution that long bones do not share, at a roughly
  7000-fold dietary enrichment, in rodents and rabbits. The resolution of the swelling contradiction is an
  inference from two papers that measured different quantities and has never been tested directly. The
  transporter arm has no upward agent in any species. And the human genetics on this axis is uniformly a
  record of what BREAKS it, which constrains the target but says nothing about headroom above normal.
confidence: C
confidence_reason: >-
  The primary findings imported here are each single papers read at abstract-and-methods depth or better,
  and the two myo-inositol results replicate across species with a stated mechanism, so those are B-grade
  individually. The node is held at C because its organising contribution - the reconciliation of
  cooper2013 with bush2008 - is my inference rather than a measurement, and because the practical
  conclusion is a refusal plus a specified experiment rather than a result.
claim_grades:
- claim: >-
    cooper2013 and bush2008 do not conflict; the enlargement is small-osmolyte accumulation plus water, which
    dilutes protein dry mass while leaving the cell a perfect osmometer.
  grade: E
  basis: >-
    AN INFERENCE, AND THE ORGANISING ONE IN THIS NODE, SO IT IS GRADED HONESTLY. Dry mass density measures
    macromolecules; the Boyle-van't Hoff inactive fraction measures non-solvent volume including
    osmotically bound water, estimated by extrapolation from an acute challenge. Small osmolytes are heavy
    contributors to osmotic pressure and negligible contributors to dry mass, so accumulating them reproduces
    BOTH observations - cooper2013's 0.183 to 0.07 pg/fL dilution and bush2008's unchanged 15.5
    percent-volume per Osm sensitivity with inactive fraction 39.5 versus 47.0 per cent. voigt2025 states the
    both-mechanisms position as background. NEVER TESTED DIRECTLY.
- claim: >-
    Myo-inositol supplementation augments endochondral growth.
  grade: B
  basis: >-
    Two species, same laboratory. yamaguchi2019, growing mice, +8.4 per cent mandibular endochondral growth.
    shimoyama2024, Japanese white rabbits fed 66 g/kg against 9.5 mg/kg control from 6 to 25 weeks:
    mandibular length 74.95 +/- 0.53 against 78.40 +/- 0.59 mm, +4.7 per cent, p < 0.05, n = 5 per group,
    with thicker mandibular condylar cartilage. One laboratory, small n, and a roughly 7000-fold dietary
    enrichment.
- claim: >-
    Myo-inositol is a usable lever for HEIGHT.
  grade: D
  basis: >-
    DOWNGRADED FROM X WITHIN THE SAME ROUND, BECAUSE THE FREE QUERY BROKE MY OWN DISMISSAL. THE NEGATIVE
    STANDS: femur length was unaffected in the rabbit and long bones were not augmented in the mouse - a
    direct length endpoint in the compartment that matters. THE EXPLANATION DOES NOT: the rodent papers
    compared mandibular condylar cartilage against femoral ARTICULAR cartilage, and in GSE9160 - the only
    zone-resolved human growth plate - PIK3CD is DETECTED IN 9 OF 10 compartment-donor cells on its main
    probe, highest in the proliferative zone (donor 1: 3520 PZ against a threshold of 746). Articular and
    growth-plate cartilage are different tissues. So the femoral null is now UNEXPLAINED rather than
    explained, and the arm cannot be closed on the enzyme-distribution argument. It stays at D - one
    laboratory, two rodent species, a length null in the only relevant compartment, and no human growth
    data - but it is not dead, and it is oral, cheap and safe to 12 g/day.
- claim: >-
    Myo-inositol is an osmolyte lever and a counterexample to "the swelling machinery has only ever been
    switched off".
  grade: X
  basis: >-
    NO ON BOTH COUNTS, AND I NEARLY FILED IT THIS WAY. Myo-inositol IS a canonical compatible osmolyte in
    other tissues, but in this work it acts as a SUBSTRATE FOR PHOSPHATIDYLINOSITOL SYNTHESIS via PIK3CD and
    the PI3K pathway - the authors identify the enzyme and show its site-specific expression. No volume, no
    tonicity and no transporter measurement appears in either paper. The prior claim that no experiment in
    any species has attempted to INCREASE growth-plate cell swelling therefore SURVIVES intact.
- claim: >-
    Inositol metabolism is a chondrocyte cell-size determinant.
  grade: C
  basis: >-
    Two independent lines converging, which is new to this atlas. PIK3CD/myo-inositol (yamaguchi2019,
    shimoyama2024) on the supply side; INPPL1, a 5'-inositol phosphatase, on the degradation side -
    voigt2025 shows inppl1a controls notochord vacuolated-cell expansion independently of vacuole fusion AND
    is required for hypertrophic chondrocyte differentiation and endochondral lengthening in zebrafish, with
    human INPPL1 loss causing opsismodysplasia. Different organisms, different enzymes, same metabolite
    class. Held at C: the two lines point in opposite enzymatic directions and nobody has reconciled them.
- claim: >-
    The WNK-SPAK/OSR1 cascade is a human-validated node on growth-plate volume control.
  grade: D
  basis: >-
    veerabhadraiah2025 gives the first human CODING variants in this cascade in cartilage - WNK2 variants
    segregating with familial erosive hand and foot OA, WNK2 elevated in end-stage OA, and a WNK2-dependent
    transcriptional response to hyperosmotic stress worsened by the variants. Structurally decisive because
    WNK gates SPAK/OSR1 which switch NKCC1 on, and NKCC1 carries about a third of elongation (bush2010).
    HELD AT D FOR HEIGHT because the phenotype is joint disease, not stature; no length endpoint exists; and
    the height-favourable direction - MORE WNK-SPAK activity - is the direction associated with joint
    destruction.
- claim: >-
    PIEZO1 is expressed in the human growth plate and rises into the hypertrophic zone.
  grade: B
  basis: >-
    GSE9160, probe 202771_at, detected in all five compartments of both donors. Donor 1 - the clean
    dissection - reads 8986 resting, 7893 proliferative, 20594 prehypertrophic, 24442 hypertrophic against
    thresholds of 646-827: a 2.7-fold rise into the zone that performs the enlargement, at absolute levels
    among the highest in the panel. THE CONVERGENCE IS THE POINT: PIEZO1 scored 0.935 on the atlas's own
    Open Targets height run, above every positive control including LCORL at 0.919, and nobody had checked
    whether it was expressed where it would have to act. It is, and it is hypertrophy-enriched. No
    perturbation of PIEZO1 with a bone-length endpoint appears in this atlas.
- claim: >-
    This axis is actionable for this case today.
  grade: X
  basis: >-
    NO. It is the largest term in the height identity - about 80 per cent of elongation - and it has no
    agent pointing upward in any species. All three human genetic anchors record what BREAKS it. Every
    pharmacological tool on the machinery is an inhibitor because the clinical demand has always been to
    reduce swelling. The next step is a measurement, not a prescription.
key_refs:
- ref_id: cooper2013
  year: 2013
  type: primary
  one_line_finding: >-
    Three phases of chondrocyte enlargement with dry mass density diluted from 0.183 to about 0.07 pg/fL in
    phase 2 - a 2.6-fold dilution that is swelling by definition
- ref_id: bush2008
  year: 2008
  type: primary
  one_line_finding: >-
    Living rat growth plate across 0-580 mOsm: osmotically inactive fraction 39.5 versus 47.0 per cent and
    sensitivity identical between proliferative and hypertrophic zones - the result that made the atlas mark
    the swelling account contested
- ref_id: shimoyama2024
  pmid: '38534273'
  year: 2024
  type: primary
  one_line_finding: >-
    Rabbit mandible +4.7 per cent on myo-inositol chow with NO femur effect, and PIK3CD site-specific
    expression given as the reason - the compartment restriction is built into the enzyme distribution
- ref_id: yamaguchi2019
  year: 2019
  type: primary
  one_line_finding: >-
    The mouse predecessor - +8.4 per cent mandibular endochondral growth on dietary myo-inositol, with
    PIK3CD identified as the converting enzyme
- ref_id: voigt2025
  pmid: '40209709'
  year: 2025
  type: primary
  one_line_finding: >-
    inppl1a controls notochord vacuolated-cell expansion and hypertrophic chondrocyte differentiation in
    zebrafish, and human INPPL1 loss causes opsismodysplasia - the second independent line implicating
    inositol metabolism in chondrocyte size
- ref_id: veerabhadraiah2025
  pmid: '40592720'
  year: 2025
  type: primary
  one_line_finding: >-
    First human coding variants in the WNK-SPAK/OSR1 volume-sensing cascade in cartilage, segregating with
    familial osteoarthritis - the cascade that gates the NKCC1 carrying a third of elongation
- ref_id: bush2010
  year: 2010
  type: primary
  one_line_finding: >-
    The clean isolation of h_term - bumetanide removed about 35 per cent of elongation with hypertrophic
    cell number unchanged at 193 against 192
contradicts: >-
  Does not overturn `the_swelling_machinery_has_only_ever_been_switched_off` or
  `the_volume_set_point_and_where_a_compound_could_act`. It RESOLVES the "contested" grade the second node
  assigned to the swelling account, by showing that cooper2013 and bush2008 measure different quantities and
  are both correct - and in doing so it names the lever class as small osmolytes rather than protein
  synthesis.
  It also explicitly PRESERVES the claim that no experiment in any species has attempted to increase
  growth-plate cell swelling. Myo-inositol looked like a counterexample and is not one: it acts through
  PIK3CD and phosphatidylinositol synthesis, not through tonicity or transport.
builds_on: the_volume_set_point_and_where_a_compound_could_act
