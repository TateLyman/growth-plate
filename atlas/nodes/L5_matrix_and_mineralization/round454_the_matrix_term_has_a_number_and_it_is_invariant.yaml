    32.7 cells per column, gives 1473 um3 per cell per day, converted at an IMPORTED hyaline dry-solid density of
    0.15-0.25 g/cm3. Route B is not independent of wilsman1996. Comparators: plasma cell 2-220, industrial CHO line
    3-51, ADULT ARTICULAR chondrocyte about 0.5'
