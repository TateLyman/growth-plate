id: round454_the_matrix_term_has_a_number_and_it_is_invariant
name: R454 - the matrix term finally has a UNIT and a MAGNITUDE, and the answer is that a growth-plate chondrocyte
  secretes at the plasma-cell ceiling while matrix per cell stays CONSTANT across a nine-fold range of growth rate
  - so CORR-361's 32 to 49 per cent is a LARGE INVARIANT term, not a regulated one, which is exactly the profile
  of a lever nature never uses
