human_evidence: indirect
human_evidence_note: The invariance and the derived rate are rat and bovine. The human contribution is the TANGO1
  dosage series - complete loss embryonic-lethal with near-total bone loss, truncation giving short stature, and
  HETEROZYGOTES with entirely normal collagen secretion - which is what fixes the reserve capacity of the export
  step in humans.
translation_risk: moderate
translation_risk_reason: The per-cell rate is a derivation from two rodent stereology datasets plus an imported
  dry-solid density, and the invariance is measured in rat proximal tibia only. Both are strong statements about
  RODENT regulation of a term whose human value has never been measured.
summary: 'CORR-361 made matrix synthesis 32 per cent of elongation in a fast plate and 49 per cent in a slow one
  - co-equal with hypertrophy and larger than it in a slow plate - and R447 noted the term has no UNIT in this field:
  bioprocess engineering reports picograms per cell per day universally and matrix biology reports ''increased collagen
  production''. R454 supplies both the unit and the regulation, and they point in opposite directions.


  ONE - THE MAGNITUDE, BY THREE ROUTES THAT AGREE TO ABOUT FOURFOLD. Direct in vitro: juvenile bovine chondrocytes
  in agarose at 30 million cells per mL synthesise of order 1 mg per mL per day each of GAG and collagen, which
  is about 70 pg per cell per day. Derived in vivo from hunziker1994 plus wilsman1996: matrix per departing cell
  10,246 cubic micrometres times 32/68, ten cells per column per day, about 33 cells per column, gives about 1,473
  cubic micrometres of matrix per cell per day, which at hyaline cartilage dry-solid densities of 0.15 to 0.25 g
  per cubic centimetre is 220 to 370 pg per cell per day. Floor: an ADULT ARTICULAR chondrocyte, from collagen half-life
  117 years and aggrecan 19.5 to 23.5 years, runs at about 0.5 pg per cell per day.

  SO A GROWTH-PLATE CHONDROCYTE SECRETES AT THE PROFESSIONAL-SECRETOR CEILING - the plasma-cell range is 2 to 220
  pg per cell per day, an industrial CHO production line is 3 to 51 - AND ROUGHLY 100 TO 1000-FOLD FASTER THAN THE
  SAME CELL TYPE DOING MAINTENANCE. That is the scale of the term, and it is the first time this file has been able
  to state it.


  TWO - AND THEN THE REGULATION RUNS THE OTHER WAY, MEASURED TWICE BY THE SAME LABORATORY. hunziker1989: on growth
  acceleration from 21 to 35 days, net matrix production per cell REMAINS UNCHANGED, and on deceleration chondrocytes
  continue producing matrix at a level comparable to that attained at high growth rates. hunziker1994 is stronger
  because it is pharmacological: across hypophysectomy, IGF-I, GH and normal littermates - growth rates of 31, 92,
  163 and 284 micrometres per day, A NINE-FOLD RANGE - the average matrix volume per cell AT EACH DIFFERENTIATION
  STAGE WAS SIMILAR IN ALL FOUR GROUPS. What moved instead was cell height, cell volume, cycle time (50 down to
  6 days) and cells per column per day (1 up to 10).

  So the decomposition is: MATRIX VOLUME PER CELL IS A FIXED STRUCTURAL QUANTUM AND MATRIX PER UNIT TIME IS THAT
  QUANTUM DIVIDED BY TRANSIT TIME. The plate raises matrix output by pushing cells through faster and never by making
  a cell secrete more. Hunziker''s own conclusion is that cartilage matrix plays a SUBORDINATE ROLE in regulating
  longitudinal growth rate.

  THE HONEST READING OF THAT IS NOT THAT THE TERM IS DEAD. A term can be a third to a half of the elongation budget,
  invariant under every physiological input ever tested, and still be raisable by something the organism does not
  use - that is the definition of an unexploited lever, and it is also the definition of a hard structural constraint.
  NOTHING IN THE LITERATURE DISTINGUISHES THE TWO.


  THREE - THE EXPORT STEP HAS AT LEAST TWOFOLD RESERVE IN HUMANS, WHICH ANSWERS R447 DIRECTLY. R447 asked whether
  secretion is rate-limiting and could not tell. guillemyn2021: complete human TANGO1 loss is embryonic-lethal with
  near-total bone loss, a truncating variant gives short stature - and HETEROZYGOUS PARENTS HAVE ENTIRELY NORMAL
  TYPE I COLLAGEN SECRETION AND ECM ORGANISATION despite reduced TANGO1 mRNA and protein, which the authors call
  a THRESHOLD MODEL. Fifty per cent gene dosage is not limiting. The same shape appears in the industrial system:
  across real CHO clones the dominant determinant of specific productivity is transgene copy number and mRNA level
  rather than the secretory pathway, and deliberately relieving a demonstrated folding bottleneck buys tens of per
  cent, not fold changes.


  FOUR - AND CORR-361 RE-PRICES AN ARM THIS FILE ALREADY HELD AS UNRESOLVED. cinque2015 (Nature): autophagy is induced
  in growth-plate chondrocytes postnatally and REGULATES THE SECRETION OF TYPE II COLLAGEN; chondrocyte Atg7 loss
  gives ER storage of procollagen II and a defective Col2 network; and the inducer is FGF18 acting THROUGH FGFR4
  and JNK on the VPS34-beclin-1 complex, with Fgf18 heterozygotes and Fgfr4 nulls failing to induce it and showing
  decreased Col2 in the growth plate - rescued in vivo by pharmacological activation of autophagy. R219 already
  worked this and concluded that erdafitinib removes 5 to 20 per cent of FGFR4 and that FGFR4''s NET direction in
  human cartilage is UNRESOLVED. What changes is the price: before CORR-361 the collagen-secretion arm looked like
  a side effect on a minor term, and it is now an arm acting on a third to a half of the elongation budget. It has
  never been in this ledger. It is not a new alarm and it is not settled either way.


  FIVE - AND ONE FREE SUBTRACTION FELL OUT, IN THE RIGHT TISSUE. chen2023: ARTIFICIAL LIGHT AT NIGHT impairs developmental
  growth-plate cartilage ECM formation and causes ER dilation, compromising bone formation, by downregulating BMAL1
  - and BMAL1 is the DIRECT transcriptional activator of P4ha1 in chondrocytes, which orchestrates collagen prolyl
  hydroxylation and secretion. Restoring BMAL1/P4HA1 rescues it. The authors state LAN is a significant risk factor
  in bone growth and development. That lands exactly on R444''s finding that the chondrocyte concentrates the collagen
  FOLDING enzymes (P4HA1 1.82-fold, P4HB 5.55, PPIB 5.45, CRTAP 6.25) and not the COPII coat - the step BMAL1 controls
  is the step the tissue invests in. MOUSE, developmental, and no human equivalent exists - but darkness at night
  is free.


  SIX - THE OPEN POSSIBILITY THAT WOULD COLLAPSE TWO TERMS INTO ONE. In CHO fed-batch, specific productivity rises
  LINEARLY with cell volume - about twofold across a threefold volume increase, with larger cells more efficient
  per unit oxygen and nutrient. If that holds in a chondrocyte, then enlarging the terminal hypertrophic cell IS
  raising its matrix output, and wilsman1996''s 59 per cent and 32 per cent are not independent terms. NOBODY HAS
  MEASURED MATRIX SYNTHESIS PER CELL AGAINST CELL VOLUME BY ZONE IN ANY SPECIES.'
