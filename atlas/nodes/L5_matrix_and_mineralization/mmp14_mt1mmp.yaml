id: mmp14_mt1mmp
name: MT1-MMP (MMP14)
aliases:
- MMP14
- MT1-MMP
- membrane-type 1 matrix metalloproteinase
type: protein
layer: L5
stub: false
summary: 'MT1-MMP is the membrane-anchored collagenase whose loss produces the most severe skeletal phenotype
  of any single matrix metalloproteinase: Mmp14-null mice develop dwarfism, osteopenia, generalised arthritis
  and connective tissue disease attributed directly to inadequate collagen turnover, with defective secondary
  ossification and soft tissue fibrosis. That contrast is the informative part of this layer''s protease
  section. Deleting the secreted collagenase MMP-13 gives an expanded hypertrophic zone; deleting the
  vascular-invasion gelatinase MMP-9 gives a transient eight-fold plate; deleting the two aggrecanases
  together gives a physiologically normal mouse; but deleting the membrane-tethered collagenase gives
  frank dwarfism. Pericellular, membrane-localised proteolysis is therefore the non-redundant activity.
  MT1-MMP also has substrates beyond collagen relevant to growth: it cleaves PTH1R in the chondrocyte-derived
  osteoblast lineage, curbing PTH signalling intensity, and chondrocyte-specific deletion in adult mice
  does NOT reproduce the inflammatory arthritis of the global null, so much of the phenotype is non-chondrocytic.'
