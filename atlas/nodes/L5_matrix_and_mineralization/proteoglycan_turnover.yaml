id: proteoglycan_turnover
name: Proteoglycan turnover in cartilage and growth plate
aliases:
- aggrecan turnover
- proteoglycan half-life
type: process
layer: L5
stub: false
summary: 'Proteoglycan turnover in cartilage is measured either by radiosulphate pulse-chase in explants
  or by aspartate racemization, which reads the molecular age of a protein pool directly. In ADULT HUMAN
  ARTICULAR cartilage the numbers are unambiguous: the aggrecan large monomer has a turnover constant
  of 0.206/year, a half-life of 3.4 years, whereas the free G1 hyaluronan-binding region has a constant
  of 0.027/year and a half-life of 25 years. The G1 fragments therefore accumulate for decades and progressively
  occupy hyaluronan binding sites, which is a mechanistic explanation for the age-related decline in aggregation
  seen by quantitative electron microscopy. In the GROWTH PLATE the picture is zonal and much faster but
  has never been converted into a half-life: in bovine distal tibial explants, rates of both aggrecan
  synthesis and breakdown are highest in the resting/proliferative third and lowest in the lower hypertrophic
  third, and are higher in calf than fetal tissue. How aggrecan is actually removed before mineralization
  is unresolved: mice with MMP-cleavage-resistant aggrecan grow normally without accumulating aggrecan,
  and Adamts4/Adamts5 double-null mice are physiologically normal, so neither protease family is required.'
