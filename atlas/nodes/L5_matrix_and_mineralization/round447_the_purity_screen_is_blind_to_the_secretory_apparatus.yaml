human_evidence: direct
human_evidence_note: The expression contrast is human postnatal growth plate and the disease phenotypes - MIA3 odontochondrodysplasia,
  TRAPPC2 spondyloepiphyseal dysplasia tarda, SEC23A and SEC24D dysplasias, PCYT1A spondylometaphyseal dysplasia
  - are human. Every one is a loss of function, so they establish requirement and not the value of a gain.
translation_risk: moderate
translation_risk_reason: The gain-of-function evidence is entirely non-cartilage - CHO cells, plant leaves, bovine
  mammary epithelium, silk glands - and the falsifier is a mouse embryonic result. Nothing here establishes that
  a normal chondrocyte is operating near its secretory ceiling.
summary: 'CORR-363 - THE CORRECTION, AND IT IS AGAINST THIS FILE''S OWN PREVIOUS ROUND. R444 measured the collagen
  FOLDING enzymes at 1.8 to 6.25 fold cartilage-enriched and the COPII coat at 0.22 to 1.29, and concluded that
  if secretion is rate-limiting the limit sits at folding rather than at export. Four genes refute the inference
  and every one has a length or stature endpoint. CREB3L2/BBF2H7 scores 0.66 and its cartilage knockout gives severe
  chondrodysplasia with dilated rough endoplasmic reticulum, rescued by re-introducing Sec23a. SEC23A scores 0.91
  and its human mutation causes cranio-lenticulo-sutural dysplasia. SEC24D scores 0.37 and its human mutation shortens
  fetal long bones. MIA3/TANGO1 scores 0.63, its knockout mouse has global collagen secretion failure with dwarfism
  and neonatal lethality, complete human loss gives near-total absence of bone mineralisation, biallelic loss gives
  odontochondrodysplasia with severe short limbs and short stature, and medaka Tango1L knockout gives a shorter
  tail with collagen II retained in the ER. THE SECRETORY APPARATUS IS UNIVERSAL - EVERY CELL HAS IT - SO A CARTILAGE-VERSUS-BLOOD
  CONTRAST CANNOT CONCENTRATE IT EVEN WHERE IT IS DEMONSTRABLY RATE-LIMITING FOR BONE LENGTH. ENRICHMENT MEASURES
  INVESTMENT AND NOT RATE-LIMITATION, AND R444 CONFLATED THE TWO. What survives of R444 is the folding-versus-cross-linking
  SIGN SPLIT in the human burden data, which rests on genetics rather than on enrichment.


  THE FINDING THAT MATTERS MOST FOR A TRUNK-DOMINANT RESIDUAL. lou2023: TRAPPC2 or Sedlin loss causes X-linked spondyloepiphyseal
  dysplasia tarda - SHORT TRUNK with arm span exceeding height - and the mechanism is failure of type II collagen
  ER export. This file has never had a mechanism that is specifically trunk-limiting. This is one, it is human,
  and it is a RATE defect in the term CORR-361 makes 32 to 49 per cent of elongation. The direction is to raise,
  no agent exists, and CORR-203 governs any inference from a loss-of-function disease to the value of a gain.


  THE LOCAL QUERY, RUN ON THE ARM R444 NEVER TESTED, AND THE HEADLINE CANDIDATE FAILS ITS OWN RECEIVER TEST. The
  nominated lever was PCYT1A, the rate-limiting enzyme of phosphatidylcholine synthesis, whose auto-inhibitory domain
  deletion expands the ER and raises secreted IgA about ten-fold in planta, whose biallelic loss is human spondylometaphyseal
  dysplasia with severe short stature, and whose missense variant in Vizsla dogs gives disproportionate dwarfism
  with marked humeral and femoral shortening. Purity-corrected against COL2A1 7.65 and the ACAN benchmark of 1.96,
  the entire Kennedy pathway is contaminant-leaning: PCYT1A 0.64, CHKA 0.19, CEPT1 0.70, CHPT1 0.88, LPIN1 0.36,
  LPIN2 0.30. By CORR-363 above that is a weak filter, so it is recorded as not enriched rather than as a kill.


  TWO STRUCTURAL SPLITS THE PANEL DID RETURN, BOTH NEW. The CARGO RECEPTORS are enriched while the COAT is not -
  TMED9 4.59, TMED2 2.78, TMED10 2.55, SURF4 1.90, LMAN1 1.90, MCFD2 1.84 - which refines rather than repeats R444,
  whose sixteen export genes were all coat. And the UPR SENSORS are contaminant-leaning while the EFFECTORS are
  enriched: ERN1 0.05, ATF6 0.11 and EIF2AK3 0.14 against ATF4 2.99 at 421 CPM, DDIT3 2.65, CREB3L1 1.79 and XBP1
  1.73, all in 12 of 12 samples. The tissue does not concentrate the stress-SENSING apparatus and does concentrate
  the downstream integrated-stress-response output. CHOP is the terminal pro-apoptotic effector and terminal hypertrophic
  chondrocytes die, so its enrichment may belong to DISCHARGE rather than to capacity.


  THE FALSIFIER IS ALREADY IN THIS FILE, WHICH IS WHY THE ROUND PROMOTES NOTHING. kung2012 shows the onset of the
  unfolded protein response and of hypertrophic zone expansion depends on mutation type and gene dosage, indicating
  that hypertrophic chondrocytes have a LATENT CAPACITY WHICH MUST BE EXCEEDED. A cell running below its ceiling
  cannot be helped by raising the ceiling - R415''s threshold argument applied to capacity expansion rather than
  to stress relief. THE DISCRIMINATING EXPERIMENT IS THEREFORE A GAIN IN AN UNSTRESSED CELL, AND IT HAS NEVER BEEN
  DONE IN CARTILAGE IN ANY SPECIES: every chondrocyte ER result is a loss of function or a disease model, while
  the gain has been done and works in CHO cells, plant leaves, bovine mammary epithelium and silk glands. That asymmetry
  is the finding. The obtainable reagent is exogenous recombinant HSP47, which is taken up by cells, localises to
  ER exit sites and increases collagen secretion in osteogenesis imperfecta fibroblasts.


  AND A STRUCTURAL POSSIBILITY THAT WOULD CHANGE CORR-361''s ARITHMETIC. In CHO fed-batch culture specific productivity
  rises with cell volume across a threefold size increase, with larger cells more efficient per unit oxygen and
  nutrient. If matrix secretion per chondrocyte scales with chondrocyte volume then enlarging the terminal cell
  IS raising its matrix output, and wilsman1996''s hypertrophy and matrix-synthesis fractions are not independent
  terms. Equally it may run the other way, since terminal hypertrophy is classically described as swelling and dilution
  rather than biosynthesis. NOBODY HAS MEASURED MATRIX SYNTHESIS PER CELL AGAINST CELL VOLUME BY ZONE IN ANY SPECIES,
  and until that exists the two terms cannot be added or multiplied with confidence. The term also has no unit in
  this field: bioprocess engineering reports picograms per cell per day universally and matrix biology reports increased
  collagen production, so nobody has measured how much collagen a growth-plate chondrocyte secretes per hour in
  any species.


  AND THE COLLAGEN EXPORT MACHINE IS CLOCK-GATED TO RUN AT NIGHT. chang2020 shows the circadian clock rhythmically
  times SEC61, TANGO1, PDE4D and VPS33B in sequence in mouse tendon, giving nocturnal procollagen synthesis and
  daytime fibril assembly, with clock disruption producing abnormal fibrils and collagen accumulation. R427 holds
  noonan2004''s result that at least 90 per cent of elongation occurs during recumbency and attributes it entirely
  to mechanical unloading. This is an independent, molecular, non-mechanical candidate for the same observation
  and the two are not exclusive. It is tendon rather than growth plate, and R432 records that no functioning oscillator
  has been demonstrated in human growth-plate chondrocytes, so it is unresolved rather than established - and PDE4D
  sits in that list, a gene worked hard here on a completely different axis.'
