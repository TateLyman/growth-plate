id: collagen_fibril_stoichiometry
name: Cartilage collagen fibril stoichiometry (II:IX:XI)
aliases:
- heterotypic collagen fibril
- collagen II/IX/XI copolymer
type: tissue_structure
layer: L5
stub: false
summary: 'Cartilage fibrils are not pure collagen II. They are heterotypic copolymers in which collagen
  XI forms the nucleating core, collagen II supplies the bulk of the 4D-staggered lattice, and collagen
  IX decorates the fibril surface covalently crosslinked to collagen II. The stoichiometry is developmental,
  not fixed: in young growth cartilage the mass proportions are approximately 80% collagen II, >=10% collagen
  IX and >=10% collagen XI, which shifts on maturation to >=90% II, ~3% XI and ~1% IX in adult articular
  cartilage. The functional consequence is fibril diameter: reconstitution of purified collagens shows
  that a mixture of II and XI produces uniform ~20 nm fibrils only while the molar excess of II over XI
  is below eight-fold, above which control is lost and irregular tactoids form; collagen IX is not required
  for diameter control but sharply increases assembly efficiency. So the ''8:1:1'' figure quoted in reviews
  is a mass proportion of young growth cartilage that coincides numerically with the II:XI molar ceiling
  for diameter control, and the two are frequently conflated. The values above were determined in chick
  embryonic sternum and bovine/foetal cartilage by CNBr peptide and antibody quantitation; no equivalent
  quantitation exists for human physeal cartilage specifically, and mammalian fibrils are additionally
  heterogeneous, with decorin-bearing and collagen IX-bearing fibril subpopulations occupying different
  territories of the same tissue. Human physeal tissue has however been examined ultrastructurally: in
  human juvenile rib growth plate collagen XI is confined to fibrils under 25 nm and is absent from thick
  fibrils even after chaotropic disruption, while collagens II and IX decorate fibrils of all diameters
  - and the thin fibrils are concentrated in the HYPERTROPHIC zone, the thick ones in the resting zone,
  with a mixture in the proliferative zone. So the II:XI ratio in the human growth plate is zonally graded,
  lowest (most XI-rich) where mineralization is about to occur.'
