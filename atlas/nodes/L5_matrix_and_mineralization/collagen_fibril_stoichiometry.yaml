localization:
- 'human growth plate HZ: thin fibrils, collagen XI enriched (keene1995)'
- 'human growth plate RZ: thick fibrils, collagen XI absent (keene1995)'
- 'human growth plate PZ: mixture of thin and thick fibrils (keene1995)'
- 'chick sternal cartilage fibrils: collagens II, IX and XI colocalised in the same fibril by immuno-EM
  (mendler1989)'
- 'mammalian cartilage: decorin-bearing and collagen IX-bearing fibril subpopulations are distinct (hagg1998)'
- 'human physeal cartilage: mass stoichiometry unquantified'
human_evidence: indirect
human_evidence_note: Collagen XI, IX and II have been localised ultrastructurally in human juvenile rib
  growth plate by immuno-EM, establishing the zonal fibril-diameter pattern; the mass stoichiometry has
  still not been quantified in human physeal tissue.
species_basis:
- human
- chicken
- bovine
- in_vitro_animal_cell
translation_risk: moderate
translation_risk_reason: The stoichiometry itself is likely conserved (the same three genes cause chondrodysplasia
  in humans), but the numbers come from avian and bovine tissue and the developmental shift means any
  single ratio is age- and tissue-specific.
confidence: C
