id: chondron
name: Chondron
aliases:
- chondron
- chondrocyte plus pericellular capsule
type: tissue_structure
layer: L5
stub: false
summary: 'A chondron is the chondrocyte together with its pericellular matrix and capsule, treated as
  the mechanical unit of cartilage. In the growth plate the geometry differs fundamentally from articular
  cartilage: resting zone chondrocytes sit singly or in pairs with no preferred arrangement, while proliferative
  and hypertrophic chondrocytes are stacked inside long tubular chondrons that are the columns. This makes
  the chondron the load-transmitting element of the physis. Direct measurement of chondron deformation
  under compression shows that the apparently random strain fields reported in the compressed growth plate
  are not random at all: the chondron tubes undergo large bending deformations, kinking preferentially
  at the reserve/proliferative zone interface at 20%, 30% and 40% applied compression. The authors propose
  that this bending is itself the cue that aligns dividing cells longitudinally to maintain the column.
  Chondrons are also the failure interface: in bovine physeal tensile testing, fracture propagates leaving
  bundles of intact chondrons on the metaphyseal side, torn away from an interterritorial matrix that
  stays on the epiphyseal side.'
