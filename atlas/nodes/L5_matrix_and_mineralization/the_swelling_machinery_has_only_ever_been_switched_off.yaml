id: the_swelling_machinery_has_only_ever_been_switched_off
name: The biggest unhit axis - 80 per cent of longitudinal growth is osmotic cell swelling, every experiment ever done on it is subtractive, and the one arm with human genetic support is a SUBSTRATE the stack does not supply
aliases:
- the swelling gap
- why is every experiment an inhibitor
- sulfate is the missing substrate
- the biggest axis gap
type: hypothesis
layer: L5
stub: false
summary: 'THE ATLAS HAS ARGUED SINCE terminal_cell_volume_is_the_undefended_term THAT h_term IS THE ONE
  LARGE, MOVABLE, FREE TERM IN THE HEIGHT EQUATION AND THAT IT IS ACHIEVED "LARGELY OSMOTICALLY". IT THEN
  CARRIED 1230 REFERENCES WITHOUT A SINGLE ONE ON HOW THAT OSMOSIS IS ACTUALLY PERFORMED. This node closes
  that hole and, in closing it, finds the gap is not where the argument predicted.
  WHAT THE MACHINERY LITERATURE SAYS, AND IT IS BIGGER THAN ANY DRUG IN THIS ATLAS. Roughly 80 per cent of
  longitudinal bone growth is hypertrophic chondrocyte volume increase, against about 10 per cent from
  proliferative cell division. bush2010 blocked ONE transporter - NKCC1, with bumetanide - in cultured
  P7 rat metatarsals and removed about 35 per cent of 24-hour elongation, with the late hypertrophic zone
  falling from 204 to 151 micrometres AND THE NUMBER OF HYPERTROPHIC CELLS UNCHANGED (193 against 192,
  p=0.937). That is a clean experimental isolation of h_term: a third of the growth disappeared without a
  single cell being lost. Adding the anion-exchange inhibitor DIDS took the inhibition to 80 per cent.
  abubakar2022 independently cut ex vivo rat metatarsal growth RATE from about 18 per cent to 5.5 per cent
  with an NHE1 inhibitor and to 7.4 per cent with DIDS, again shortening the hypertrophic zone specifically.
  THE GAP, STATED PLAINLY: EVERY ONE OF THESE EXPERIMENTS, IN EVERY SPECIES, POINTS DOWNWARD. Bumetanide,
  DIDS, EIPA - inhibitors, all of them. Three independent search angles returned NO study in any species
  that attempted to INCREASE growth-plate cell swelling, and no agent exists that does. The clinical need
  on this machinery has always been to REDUCE swelling - oedema, hypertension, seizures - so every marketed
  drug on it is a blocker. Nobody has asked whether the mechanism that produces 80 per cent of height has
  headroom, because nobody has had a reason to want more of it.
  BUT THE HUMAN GENETICS SENDS YOU SOMEWHERE ELSE, AND THIS IS THE PART THAT CHANGES THE RECOMMENDATION.
  I checked every gene in the machinery against Open Targets for association with human height and
  stature phenotypes. THE MEMBRANE TRANSPORTERS SCORE ZERO. SLC12A2, SLC12A4/6/7, WNK1, STK39, OXSR1,
  SLC4A3, SLC9A1, AQP1, AQP3, NFAT5, PIEZO1 - genetic-association score 0.000 for every one. Human
  variation in the pumps does not move height. WHAT DOES SCORE IS THE OTHER HALF OF THE OSMOTIC STORY -
  the SULFATED PROTEOGLYCAN that creates the driving force: SLC26A2 at 0.797-0.889, TRPV4 at 0.765-0.834,
  PAPSS2 at 0.438-0.598, ACAN at 0.426-0.598. The pumps move water across a gradient; the sulfation sets
  the gradient; and it is the gradient that human variation acts on.
  AND UPSTREAM OF THE SULFATION IS A CIRCULATING SUBSTRATE WITH A GRADED HUMAN DOSE-RESPONSE ON ADULT
  HEIGHT. scherer2025 built an allelic series in the two transporters that perform transcellular sulfate
  reabsorption in the kidney - SLC13A1 (NaS1) and SLC26A1 (SAT1) - and found the per-variant effect on
  PLASMA SULFATE correlates r=0.70 with the per-variant effect on STANDING HEIGHT in UK Biobank across
  466,907 people. Not a dysplasia. A graded relationship between a measurable blood metabolite and normal
  adult stature. tise2025 supplies the phenotype at the extreme - five children with biallelic SLC13A1
  loss of function, all short, all with scoliosis or skeletal dysplasia.
  WHY THIS IS THE BIGGEST GAP RATHER THAN JUST A NEW ONE. It is the only unhit item in the coverage audit
  that (1) sits on the term the atlas already argues is largest and freest, (2) carries a HUMAN,
  population-scale, graded dose-response rather than a mouse phenotype, (3) has a BLOOD TEST that says
  whether this particular subject is on the steep part of the curve - which no other term in the audit
  has, at any price - and (4) is not tumour-suppressor adjacent, unlike SMO, mTORC1 and PP2A, the three
  compounds the audit had been forced to name. It is also the substrate arm of TERM 8, which the audit
  called unhit and height-negative.
  WHAT IS NOT ESTABLISHED, AND IT IS THE WHOLE QUESTION: EVERY HUMAN DATUM HERE IS A LOSS-OF-FUNCTION.
  The series runs from normal downward. NOTHING SHOWS THAT RAISING SULFATE ABOVE THE NORMAL RANGE RAISES
  HEIGHT, and the default expectation for a substrate is saturation, not linearity. The one supply-side
  result that exists anywhere is bakadlag2026, where sulfate supplementation reversed tungstate-impaired
  chondrogenesis in murine limb culture - a rescue from a poisoned state, which is not the same as a gain
  from a normal one. THE TESTABLE VERSION IS CHEAP: measure this subject plasma sulfate against the 0.3-0.5
  mM reference range. If it sits low, the graded curve says there is something to recover. If it sits mid
  range, this node predicts nothing and should be closed.'
quantitative:
- parameter: 'ONE TRANSPORTER CARRIES A THIRD OF ELONGATION, AND CELL NUMBER DOES NOT CHANGE - the cleanest
    isolation of h_term in the atlas'
  value: '~35 per cent reduction in 24-hour elongation; late hypertrophic zone 204 to 151 micrometres;
    hypertrophic cell number 193 against 192'
  unit: per cent of elongation; micrometres; cells per field
  conditions: 'bush2010. Paired P7 rat metatarsals and metacarpals in 24-hour organ culture with the NKCC
    inhibitor bumetanide. Dose-response fitted a three-parameter hyperbolic decay (r2=0.9656) with
    predicted maximal growth 1.725 per cent as concentration tends to infinity against 3.69 per cent in
    controls. Metatarsals alone, control elongation ~6 per cent in 24 h, 100 micromolar bumetanide reduced
    it ~35 per cent (p<0.01). TOTAL growth plate height was NOT significantly different (636 +/- 150
    against 689 +/- 130 micrometres, p=0.655); the LATE HYPERTROPHIC ZONE fell 204 +/- 25.6 to 151 +/- 15.0
    (p=0.015) and from 33.8 to 22.7 per cent of total plate height (p=0.008). Hypertrophic cell counts
    193 +/- 11.3 against 192 +/- 13.6 (p=0.937) and densities 1400 +/- 125 against 1377 +/- 350 cells/mm2
    (p=0.953). Adding the anion-exchange inhibitor DIDS took inhibition to a maximum of 80 per cent.
    NKCC appeared at the plasma membrane immediately BEFORE the volume increase; NKCC1 rose more than
    twofold from proliferative to hypertrophic cells while NKCC2 stayed at background.'
  species: rat
  source_ref: bush2010
  uncertainty: 'THE CELL-COUNT CONTROL IS WHAT MAKES THIS WORTH THE SPACE. Growth rate is cells produced
    per unit time TIMES terminal cell height, and almost every manipulation in this atlas moves both, which
    is why CORR-044 happened. Here the cell number is identical to within one cell and a third of the
    growth is gone, so the loss is h_term and nothing else. THE LIMITS ARE SERIOUS AND SEVERAL. It is P7 rat
    metatarsal in 24-hour organ culture - a neonatal, tiny, ex vivo bone, at the opposite end of the age
    axis from this case. 100 micromolar bumetanide is far above the concentration needed for maximal NKCC
    inhibition in isolated cells (about 20 micromolar), and the authors chose it deliberately to guarantee
    blockade while staying under the range where bumetanide hits the bicarbonate exchanger, chloride
    channels and K-Cl cotransport; that is a defensible choice but it is not a selective one. Their own
    arithmetic is the honest bound: if 80 per cent of elongation is hypertrophic volume increase and
    bumetanide removed 35 per cent, NKCC1 accounts for LESS THAN HALF of the swelling. The DIDS result is
    weaker still - DIDS is a promiscuous anion-transport inhibitor that also abolishes SLC26A2-mediated
    sulfate uptake in these very cells, so the 80 per cent figure may be two mechanisms, not one.'
- parameter: 'THE ASYMMETRY THAT IS THE ACTUAL GAP - every experiment on this machinery, in every species,
    is an inhibitor'
  value: 0 studies attempting to INCREASE growth-plate chondrocyte swelling with any endpoint
  unit: count
  conditions: 'Europe PMC 2026-08-08, three independent angles. (1) NKCC1/SLC12A2 crossed with activator,
    activation, agonist and cell swelling - 4764 hits, nothing skeletal. (2) metatarsal, bone rudiment and
    organ culture crossed with osmolality, osmolarity, tonicity and hypotonic - 470 hits, nothing that
    manipulated tonicity to raise elongation. (3) growth plate crossed with aquaporin - 82 hits, nothing
    with a growth endpoint. The three agents that HAVE been used on this machinery in bone are bumetanide,
    DIDS and EIPA, all blockers. The WNK-SPAK/OSR1 cascade that physiologically ACTIVATES NKCC1 and
    simultaneously switches off the K-Cl exporters is well transcribed in human growth plate - WNK1 in 4 of
    4 donors at 46-71 per cent of cells, STK39 4/4 at 21-64, OXSR1 4/4 at 16-37, CAB39 4/4 at 31-60 - and
    every compound ever made against it is an INHIBITOR, because the clinical demand has been oedema,
    hypertension and seizures.'
  species: not_applicable
  source_ref: bush2010
  uncertainty: 'THIS IS A GRADED ABSENCE, WHICH IS WHY IT IS STATED AS A COUNT AND NOT AS AN OPPORTUNITY.
    An absence of upward experiments is consistent with two very different worlds: one where nobody
    bothered, and one where the term is homeostatically defended and quietly resists being pushed. The
    atlas has already written down the reason to suspect the second - h_term is FLAT across human
    childhood (kember1976) while growth velocity varies several-fold, which is the signature of a regulated
    variable, not a free one. A cell that is 60 per cent water by the end of phase 2 has a bounded
    tolerance for more. NOTHING HERE ESTABLISHES HEADROOM; it establishes that headroom has never been
    tested.'
- parameter: 'THE HUMAN GENETICS SPLITS THE OSMOTIC STORY IN HALF - the pumps score zero and the
    sulfation scores high'
  value: 'transporters 0.000 genetic-association across all 11 tested; SLC26A2 0.797-0.889, TRPV4
    0.765-0.834, PAPSS2 0.438-0.598, ACAN 0.426-0.598'
  unit: Open Targets genetic_association datatype score against height and stature phenotypes
  conditions: 'Computed here, Open Targets Platform v4 GraphQL, 2026-08-08, filtering each target
    associated-disease list for body height, stature, dwarfism, brachyolmia, chondrodysplasia and skeletal
    dysplasia. ZERO genetic association: SLC12A2, SLC12A4, SLC12A6, SLC12A7, WNK1, STK39, OXSR1, SLC4A3,
    SLC9A1, AQP1, AQP3, NFAT5, PIEZO1. NON-ZERO: SLC26A2 (osteochondrodysplasia 0.797, diastrophic
    dwarfism 0.608, sulfate-transporter-related osteochondrodysplasia 0.889), TRPV4 (autosomal dominant
    brachyolmia 0.802, parastremmatic dwarfism 0.765, brachyolmia 0.834), PAPSS2 (autosomal recessive
    brachyolmia 0.598, skeletal dysplasia 0.559), ACAN (short stature with advanced bone age 0.598).
    Positive controls behaved: NPR2 0.872-0.912, which is the strongest in the set.'
  species: human
  source_ref: scherer2025
  uncertainty: 'THIS RESULT SENT ME IN THE OPPOSITE DIRECTION FROM THE ONE I WAS HEADING AND IT IS RECORDED
    THAT WAY. I had spent the round assembling a case for the membrane transporters on the strength of
    bush2010 and their human expression, and the human genetics says human variation in those genes does
    not move height while variation in the sulfation machinery does. THE INFERENCE IS BOUNDED IN THE USUAL
    WAY: an absence of genetic association is not an absence of biological importance. Essential,
    dosage-sensitive genes are exactly the ones where variation is not tolerated, so a transporter carrying
    a third of elongation might score zero precisely BECAUSE it matters. Open Targets scores are also
    aggregates over curated disease associations, not effect sizes, and they inherit whatever ascertainment
    the source databases carry. What the split does establish is where the human evidence IS, and it is not
    on the pumps.'
- parameter: 'A CIRCULATING METABOLITE WITH A GRADED DOSE-RESPONSE ON NORMAL ADULT HEIGHT'
  value: 'r=0.70 between per-variant effect on plasma sulfate and on standing height; aggregated driver
    variants -0.54 SD (-5.17 cm) for SLC13A1 and -0.73 SD (-6.68 cm) for SLC26A1'
  unit: Pearson correlation of effect sizes; standard deviations and centimetres of adult height
  conditions: 'scherer2025. Rare-variant aggregation over whole-exome sequencing against 1,294 plasma and
    1,396 urine metabolites in 4,737 GCKD participants, then six functional driver variants in SLC13A1
    (NaS1, apical) and SLC26A1 (SAT1, basolateral) carried into UK Biobank. Effect sizes on plasma sulfate
    correlate with effect sizes on STANDING height at r=0.70 (N>=466,907) and on SITTING height at r=0.57.
    In the GCKD subsample with measured height (N=3,239), aggregated driver variants gave -0.54 SD for
    SLC13A1, stated as -5.17 cm untransformed (P=1.6e-3), and -0.73 SD for SLC26A1, -6.68 cm (P=1.7e-6).
    SLC13A1 p.Arg12* heterozygotes: plasma sulfate 0.95 SD lower (22 carriers, P=9.9e-10) and sitting
    height 0.08 SD lower (2,480 carriers, P=2.2e-7). NaS1 p.Arg272Cys shows a genotype dose-response in
    UK Biobank - heterozygotes N=289 median height z -0.13, double heterozygotes with SAT1 p.Leu348Pro N=4
    median -1.13, and the single homozygote z=-3.51. SLC13A1 associates with lower sitting height at
    P=3e-8. Slc13a1-knockout mice show hyposulfatemia and growth retardation; dogs and sheep with
    homozygous loss of function show osteochondrodysplasia with growth restriction (tise2025).'
  species: human
  source_ref: scherer2025
  uncertainty: 'THE CENTIMETRE FIGURES ARE THE WEAKEST NUMBERS IN THIS NODE AND MUST NOT BE QUOTED AS THE
    EFFECT SIZE. They come from N=3,239 in GCKD, which is a CHRONIC KIDNEY DISEASE cohort - a population in
    which renal sulfate handling and adult stature are both disturbed for reasons unrelated to genotype -
    and they are an untransformed back-calculation from an inverse-normal-transformed primary analysis. The
    UK Biobank numbers, which are the population-scale ones, are far smaller: 0.08 SD of sitting height for
    the stop-gain. The r=0.70 correlation is six data points. The dose-response in Fig 8a rests on four
    double heterozygotes and ONE homozygote. AND THE DIRECTION IS THE WHOLE PROBLEM: every variant here
    REDUCES sulfate transport, so the series measures the descending limb. It establishes that sulfate
    supply is rate-relevant for human height BELOW normal. It says nothing about above.'
- parameter: 'THE SUPPLY SIDE, AND THE ONE PLACE SULFATE HAS EVER BEEN ADDED RATHER THAN REMOVED'
  value: normal serum sulfate 0.3-0.5 mM; two heterozygous nonsense variants give a 27 per cent reduction
    (0.25 against 0.36 mM)
  unit: millimolar; per cent
  conditions: 'tise2025 - sulfate is the fourth most abundant anion in human circulation, normal range
    0.3-0.5 mM, fractional excretion index 0.17-0.34, and it is NOT measured in routine clinical practice.
    bakadlag2026 - a CRISPR screen identified SLC26A2 as the route of tungstate entry, tungstate impaired
    chondrogenesis and osteogenesis in murine limb culture, and the impairment was REVERSIBLE BY SULFATE
    SUPPLEMENTATION. Human growth-plate expression computed here from GSE288028: SLC26A2 in 4 of 4 donors
    at 13.8-82.2 per cent of cells and PAPSS2 4/4 at 15.5-94.2, both among the best-detected genes in the
    table, while SLC13A1 - the RENAL transporter - is detected in 0 of 4, exactly as it should be if the
    plate takes sulfate from plasma rather than reabsorbing it.'
  species: multiple
  source_ref: tise2025
  uncertainty: 'bakadlag2026 IS A RESCUE FROM A POISONED STATE AND THAT IS NOT THE SAME EXPERIMENT AS A
    GAIN FROM A NORMAL ONE. Sulfate reversed a tungstate block; it was not shown to raise growth in an
    unpoisoned culture, and the node must not be read as if it were. NO HUMAN SULFATE-SUPPLEMENTATION STUDY
    WITH A GROWTH ENDPOINT EXISTS - searched and not found. The default pharmacology of a substrate is
    saturation: if plasma sulfate is already sufficient for maximal PAPS synthesis then adding more does
    nothing, and the burden is on this node to show otherwise. WHAT MAKES IT WORTH THE MEASUREMENT ANYWAY
    is that the measurement is a blood test against a published reference range, it is the only term in the
    coverage audit with a subject-specific readout of whether the lever is even engaged, and the downside
    of finding a normal value is one assay.'
localization:
- 'growth plate hypertrophic zone: where the swelling happens and where every inhibitor shortened the zone'
- 'growth plate proliferative and hypertrophic zones: SLC26A2 and PAPSS2 are expressed across both'
- 'renal proximal tubule: where SLC13A1 and SLC26A1 set the circulating sulfate the plate draws on'
human_evidence: direct
human_evidence_note: The sulfate-height dose-response is human and population-scale (UK Biobank, N over
  466,000) and the biallelic phenotype is human paediatric. The transport machinery evidence is entirely
  rat organ culture.
species_basis:
- human
- rat
- mouse
translation_risk: high
translation_risk_reason: The two halves of this node have opposite risk profiles and must not be averaged.
  The mechanism half is neonatal rat metatarsal in 24-hour culture with non-selective inhibitors at high
  concentration. The genetics half is human and large but measures only the DESCENDING limb, so applying
  it upward is an extrapolation beyond the observed range rather than a translation across species.
confidence: C
claim_grades:
- claim: Blocking a single ion cotransporter removes about a third of longitudinal elongation without
    changing the number of hypertrophic cells.
  grade: C
  basis: One study, P7 rat metatarsal organ culture over 24 hours, bumetanide at 100 micromolar - five
    times the concentration needed for maximal NKCC inhibition in isolated cells. The cell-count and
    cell-density controls are clean and internally consistent, which is what carries the grade.
- claim: No experiment in any species has attempted to INCREASE growth-plate cell swelling.
  grade: B
  basis: A graded absence over three independent search angles totalling more than 5,000 hits. Absences
    are gradeable and this one is well characterised; what would happen if the experiment were run is
    entirely unknown.
- claim: Human variation in plasma sulfate is graded with adult height.
  grade: B
  basis: Rare-variant allelic series across two transporters, effect sizes correlating r=0.70 with
    standing height in UK Biobank at N over 466,000, supported by a genotype dose-response and by a
    concordant biallelic paediatric phenotype. Six data points in the correlation, a chronic-kidney-disease
    cohort for the centimetre estimates, and one homozygote at the extreme of the dose-response.
- claim: Raising plasma sulfate above normal would increase height.
  grade: E
  basis: NOT SHOWN ANYWHERE. Every human variant in the series reduces transport, the only supply-side
    experiment is a rescue from tungstate poisoning in mouse limb culture, and substrate saturation is the
    default expectation. Recorded as the question this node exists to pose, not as a finding.
- claim: The membrane-transport arm of the swelling machinery is the right place to intervene.
  grade: E
  basis: Refuted in the direction I was heading. Eleven transporter and kinase genes score 0.000 for
    genetic association with human height and stature phenotypes, while the sulfation machinery scores
    0.44-0.89. Recorded because the node was built on the opposite assumption.
key_refs:
- ref_id: bush2010
  year: 2010
  type: primary
  one_line_finding: Bumetanide removed about 35 per cent of rat metatarsal elongation and 50 micrometres of
    late hypertrophic zone with hypertrophic cell number unchanged at 193 against 192 - a third of growth
    lost without losing a cell.
- ref_id: scherer2025
  year: 2025
  type: primary
  one_line_finding: Per-variant effects on plasma sulfate correlate r=0.70 with per-variant effects on
    standing height across 466,907 UK Biobank participants - a graded human dose-response between a
    circulating metabolite and normal adult stature.
- ref_id: tise2025
  year: 2025
  type: primary
  one_line_finding: Five children with biallelic SLC13A1 loss of function, all short, all with scoliosis or
    skeletal dysplasia, with hyposulfatemia measured in both probands evaluated.
- ref_id: abubakar2022
  year: 2022
  type: primary
  one_line_finding: NHE1 and anion-exchange inhibitors each cut rat metatarsal growth rate from about 18
    per cent to 5.5-7.4 per cent over 48 hours, shortening the hypertrophic zone specifically - an
    independent replication of the direction with different transporters.
- ref_id: bakadlag2026
  year: 2026
  type: primary
  one_line_finding: Tungstate impairment of chondrogenesis and osteogenesis in murine limb culture was
    REVERSIBLE BY SULFATE SUPPLEMENTATION - the only supply-side sulfate experiment with a skeletal
    readout, and it is a rescue rather than a gain.
- ref_id: fernndeziglesi2020
  year: 2020
  type: primary
  one_line_finding: Seven chondrocyte subphases resolved by volume, shape and cytoplasm density, with the
    ion and water transport proteins that permit swelling localised across them.
