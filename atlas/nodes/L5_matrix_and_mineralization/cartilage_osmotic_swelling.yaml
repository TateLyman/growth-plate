id: cartilage_osmotic_swelling
name: Cartilage osmotic swelling pressure
aliases:
- Donnan osmotic pressure
- swelling pressure
type: process
layer: L5
stub: false
summary: 'The compressive stiffness of cartilage is largely osmotic. Aggrecan''s sulphate and carboxylate
  groups are immobilised in the collagen network at a fixed charge density of order 0.2-0.3 mol/L, counterions
  accumulate to preserve electroneutrality, and the resulting Donnan imbalance draws water in until the
  collagen network''s tension balances it. The size of that pressure has been measured directly rather
  than inferred: confined compression stress-relaxation of immature bovine (n=18) and mature human (n=6)
  cartilage in baths of varying osmolarity shows that the real swelling pressure is only about ONE THIRD
  of the ideal Donnan prediction, i.e. the tissue is markedly non-ideal, and that material properties
  themselves are salt-concentration dependent: the aggregate modulus rises roughly threefold as the bath
  goes from hypertonic 2 M to hypotonic 0.001 M NaCl (bovine 0.420 +/- 0.109 to 1.266 +/- 0.438 MPa; human
  0.499 +/- 0.208 to 1.597 +/- 0.455 MPa). Donnan osmotic and Poisson-Boltzmann electrostatic interactions
  coexist in the same tissue, which is why single-parameter Donnan models overestimate. All of these measurements
  are articular cartilage. No equivalent direct swelling-pressure measurement exists for growth plate,
  although epiphyseal cartilage fixed charge density has been measured by sodium NMR and lies in the same
  range.'
