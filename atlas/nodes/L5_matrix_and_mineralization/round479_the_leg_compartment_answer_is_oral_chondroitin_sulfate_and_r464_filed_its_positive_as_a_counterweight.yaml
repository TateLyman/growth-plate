id: round479_the_leg_compartment_answer_is_oral_chondroitin_sulfate_and_r464_filed_its_positive_as_a_counterweight
name: >-
  R479 - the operator opened the LIMB compartment, and the one obtainable agent aimed at it turns out to have a
  POSITIVE bone-length endpoint in 1,152 normal animals that this atlas had filed as a null
aliases:
  - oral chondroitin sulfate limb compartment
  - munoz2025cs correction
  - chondroitin sulfate tibiotarsal length
type: intervention
layer: L5
stub: false
confidence: C
last_verified: '2026-08-27'
species_basis: chicken, pig, human
human_evidence: absent
human_evidence_note: >-
  No human study of oral chondroitin sulfate has ever measured height, growth velocity or a bone length, in any
  age group. A targeted query of chondroitin against height velocity, growth velocity, standing height, adult
  height and linear growth returned 40 records, every one a genetic, dysplasia, mucopolysaccharidosis or
  enzyme-replacement paper. The human side of this entry is entirely dose and safety.
translation_risk: high
translation_risk_reason: >-
  Both length endpoints are in broiler chickens, a bird bred for extreme growth rate, and the supporting large
  mammal is an unpublished patent. Nothing in the arm has ever been given to a human with a growth endpoint.
summary: >-
  THE OPERATOR'S RULING REMOVES THE ONE OBJECTION THAT KILLED THIS ARM, AND THE SAME WEEK THE EVIDENCE UNDER IT
  INVERTS. R451 worked oral chondroitin sulfate to a decision and demoted it on COMPARTMENT in its own words - the
  wild-type signature is LIMB and his residual is TRUNK. That demotion is lifted by instruction. And R464 then
  recorded munoz2025cs, the largest normal-animal chondroitin dataset in existence, as a counterweight that was
  MOSTLY NULL. IT IS NOT. IT MEASURED BONE LENGTH AND CHONDROITIN SULFATE RAISED IT.
  WHAT THE PAPER ACTUALLY SAYS. 1,152 NORMAL male Cobb broilers, completely randomised 4x3 factorial, chondroitin
  sulfate IN FEED at 0.00, 0.06, 0.12 and 0.18 per cent w/w crossed with three manganese levels, from day 1 to day
  47, one bird per replicate giving n=24 per chondroitin level. TIBIOTARSAL LENGTH 10.79, 10.90, 11.06 and 10.98 cm
  - P=0.032 with a QUADRATIC TERM AT P=0.012, fitted peak 11.02 cm at 0.14 per cent, R-squared 0.89. That is
  +0.27 cm, +2.50 per cent, in normal fast-growing animals with the endpoint the whole atlas is denominated in.
  Manganese had no effect on length at P=0.631, so the effect is chondroitin's. R464's list of nulls - body weight,
  bone mineral content, bone mineral density, ash, absolute bone weight, diaphyseal perimeter - is accurate and is
  the rest of the table. THE LENGTH ROW WAS BURIED IN THE ABSTRACT AS MORPHOMETRIC TRAITS OF THE PROXIMAL AND
  DISTAL TIBIOTARSUS, WHICH IS WHY IT WAS MISSED.
  AND THE CORRECT COUNTERWEIGHT IS NARROWER AND MORE HONEST. martins2023cs measured TIBIA LENGTH AT TWO AGES in a
  3x3 factorial with chondroitin at 0.00, 0.05 and 0.10 per cent: 73.61, 73.33, 74.67 mm at 21 days and 103.53,
  103.42, 104.06 mm at 42 days, chondroitin main effect NOT SIGNIFICANT at either age. Same direction, +0.5 per
  cent at 42 days, and not significant. Its top dose of 0.10 per cent sits BELOW munoz2025cs's fitted 0.14 per cent
  optimum and it used three levels against four, so it is a fair partial disagreement rather than a refutation.
  THOSE TWO STUDIES ARE THE ENTIRE WORLD LITERATURE. A targeted sweep found no other study in ANY species giving
  oral or dietary chondroitin sulfate to a NORMAL growing animal with a bone-length endpoint - not dog, horse,
  cattle, sheep, rat, mouse or rabbit, and no chondroitin oligosaccharide or low-molecular-weight preparation. The
  weaned-piglet study measured defatted bone weight, mineral density, ash, calcium and phosphorus and NOT length;
  the rat and broiler positives elsewhere are low-calcium and tibial-dyschondroplasia DISEASE models, which
  CORR-203 excludes.
  THE SHAPE IS A BAND, WHICH IS THE FILE'S OWN RECURRING SIGNATURE AND SHOULD BE READ AS ONE. 0.18 per cent gives
  LESS than 0.12 per cent. Seedor index, relative bone weight and both epiphyseal perimeters are quadratic in
  chondroitin too, all peaking at 0.06 to 0.12 per cent. R467 derived from schneider1963 that a mild local stimulus
  near a plate is readily reversed into retardation if the optimal degree is exceeded by a small margin, and R281
  derived the same shape for canonical Wnt. THIS IS THE THIRD INDEPENDENT AXIS WITH AN INTERIOR OPTIMUM AND A
  DECLINE ABOVE IT.
  THE DOSE IS THE UNCOMFORTABLE PART AND BOTH ANIMAL POSITIVES AGREE ON IT. R451 scaled the minipig patent's
  70 mg/kg by body-surface-area allometry to 45-66 mg/kg/day, or 2.7-4.6 g/day at 60-70 kg. The ORDINARY HUMAN
  SUPPLEMENT DOSE IS 0.8-1.2 g/day, and the Observed Safe Level is 1200 mg/day. So both animal positives point
  3-5 times ABOVE ordinary supplement use and above the safe-level figure. That figure is not a toxicity threshold:
  its authors state explicitly that it is the highest level tested in human clinical trials, i.e. an evidence
  ceiling. The highest single human dose formally studied is 2400 mg, tolerability described as excellent.
  WHY IT IS THE ANSWER TO THE QUESTION ASKED ANYWAY. It is ORAL, OVER THE COUNTER AND OBTAINABLE TODAY, which
  nothing else on the limb shortlist is - the SAG depot has no pharmaceutical-grade material, indirubin-3-oxime is
  a research reagent, lateral joint loading has a device built three times and never used in a human, and local
  limb warming has a human null at the knee. It is Step-0 CLEAN, because matrix sulfation is moved by nothing in
  the stack. It acts on h_term and on the matrix term, which CORR-361 prices at 32 per cent of elongation in a fast
  plate and 49 per cent in a slow one. And R448's Donnan exponent makes fixed charge a LEVERAGED parameter at
  d ln Pi / d ln FCD = 1.73, so a sulfation gain is convex rather than linear.
  AND THE MECHANISM IS STILL UNMEASURED, WHICH IS THE HONEST GRADE. R451 replaced the patent's own stated
  glycosaminoglycan-supply mechanism with a SLOW-RELEASE SULFATE DONOR reading, because jackson2010 shows ingested
  chondroitin alters neither the concentration nor the disaccharide composition of circulating chondroitin in
  humans after three months of daily dosing. That reading gained a named enzyme this round - alvarez2025bcsulf
  shows a Bacteroides caccae locus can only degrade chondroitin sulfate AFTER an endo-sulfatase, BcSulf, has
  stripped the sulfate, so desulfation is an obligatory first step in colonic catabolism. IT DOES NOT QUANTIFY THE
  SULFATE RELEASED, AND NOBODY HAS MEASURED SERUM INORGANIC SULFATE AFTER ORAL CHONDROITIN SULFATE IN ANY SPECIES.
  That single assay remains the thing that would decide the arm.
quantitative:
  - parameter: tibiotarsal length by dietary chondroitin sulfate level, normal broilers
    value: 10.79 / 10.90 / 11.06 / 10.98
    unit: cm at 0.00 / 0.06 / 0.12 / 0.18 per cent w/w in feed, P=0.032, quadratic P=0.012
    species: chicken
    source_ref: munoz2025cs
    note: >-
      1,152 birds, n=24 per chondroitin level, day 1 to day 47. Fitted peak 11.02 cm at 0.14 per cent, R-squared
      0.89. Rise of +0.27 cm = +2.50 per cent. NO SEM COLUMN IS PRINTED so no confidence interval is recoverable.
  - parameter: manganese effect on tibiotarsal length in the same factorial
    value: '0.631'
    unit: P value, means 10.92 / 10.98 / 10.90 cm at 0 / 40 / 80 mg/kg
    species: chicken
    source_ref: munoz2025cs
    note: The internal control that attributes the length effect to chondroitin rather than to the premix.
  - parameter: tibia length under dietary chondroitin sulfate, the replication attempt
    value: 73.61 / 73.33 / 74.67 at 21 d and 103.53 / 103.42 / 104.06 at 42 d
    unit: mm at 0.00 / 0.05 / 0.10 per cent, chondroitin main effect NOT significant at either age
    species: chicken
    source_ref: martins2023cs
    note: >-
      Same direction, +0.5 per cent at 42 days, not significant. Top dose sits below munoz2025cs's fitted optimum
      and only three levels were used. The only significant length effect in this study was a quadratic effect of
      GLUCOSAMINE at P=0.0320.
  - parameter: human Observed Safe Level for oral chondroitin sulfate
    value: '1200'
    unit: mg/day
    species: human
    source_ref: hathcock2007
    note: >-
      No tolerable upper intake level could be derived conventionally. The authors state the figure is the highest
      level tested in human clinical trials, so it bounds the EVIDENCE and not the toxicity.
  - parameter: highest single oral chondroitin sulfate dose formally studied in humans
    value: '2400'
    unit: mg as 800 mg tablets, healthy male volunteers, 48-hour pharmacokinetics
    species: human
    source_ref: volpi2019cs
    note: Safety and tolerability described as excellent. ABSTRACT ONLY.
  - parameter: human studies of oral chondroitin sulfate with a height or growth endpoint
    value: '0'
    unit: studies, any age, any design
    species: human
    source_ref: hathcock2007
    note: >-
      Earned by query, not asserted. Forty records returned for chondroitin against height velocity, growth
      velocity, standing height, adult height and linear growth, and every one is a genetic, dysplasia,
      mucopolysaccharidosis or enzyme-replacement paper.
  - parameter: paediatric or adolescent trials of systemic oral chondroitin sulfate
    value: '0'
    unit: >-
      trials; the single clinicaltrials.gov paediatric record, NCT06547424, was WITHDRAWN with zero enrolment
    species: human
    source_ref: hathcock2007
    note: >-
      The only adolescent chondroitin exposure found is a mucoadhesive oesophageal barrier device in 25 GERD
      patients for three weeks, which is topical by design and is a tolerability datum rather than a systemic one.
