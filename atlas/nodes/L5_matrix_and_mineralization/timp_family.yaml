id: timp_family
name: TIMPs (tissue inhibitors of metalloproteinases)
aliases:
- TIMP-1
- TIMP-2
- TIMP-3
- TIMP-4
type: protein
layer: L5
stub: false
summary: 'The four TIMPs are the endogenous stoichiometric inhibitors that set net proteolysis in cartilage.
  They are not interchangeable. TIMP-3 is the only member that inhibits the aggrecanases: its N-terminal
  inhibitory domain blocks ADAMTS4 and ADAMTS5 with sub-nanomolar Ki, whereas TIMP-1, TIMP-2 and TIMP-4
  are weak or inactive against ADAMTS4. TIMP-3 is also unique in binding to the extracellular matrix through
  its C-terminal domain rather than circulating freely, so it is retained where it is made. Because TIMP-3
  is the only aggrecanase inhibitor and aggrecanase activity is not required for normal murine skeletal
  development, the physiological role of TIMP-3 in the growth plate specifically is unresolved. Human
  TIMP3 mutations cause Sorsby fundus dystrophy, a retinal not skeletal disease, so there is no human
  genetic evidence linking TIMPs to longitudinal growth.'
