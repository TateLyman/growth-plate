localization:
- 'human growth plate: TIMP-1 present in all zones plus osteoblasts and osteoclasts; TIMP-2 in hypertrophic
  chondrocytes and osteoblasts (haeusler2005)'
- 'cartilage extracellular matrix: TIMP-3 is matrix-bound via its C-terminal domain (kashiwagi2001)'
- 'human growth plate zonal TIMP expression: not established'
