id: round463_the_direction_of_hypertrophic_expansion_is_set_at_the_tissue_tier_and_the_zone_height_readout_is_blind
name: R463 - the direction of hypertrophic expansion is imposed at the TISSUE tier, the directional stiffness measurement
  already existed at 9.7-fold, the fibre angle has been measured by SAXS and cannot yet be read, and the hypertrophic-zone-height
  readout does not correlate with growth
