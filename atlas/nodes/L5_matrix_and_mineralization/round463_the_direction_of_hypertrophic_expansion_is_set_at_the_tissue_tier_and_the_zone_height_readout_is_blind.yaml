human_evidence: indirect
human_evidence_note: The human members are wilson2021 tibial radiographs, in which hypertrophic zone height did not correlate
  with growth, and bylskiaustrow2018 human vertebral physes, in which cell height fell 34 per cent while cell width was
  unchanged and zone height was non-significant on the same sections. Both are morphometric; no human directional stiffness
  or fibre-angle measurement exists.
translation_risk: moderate
translation_risk_reason: The mechanical anisotropy is bovine and porcine and the decisive elongation control is mouse,
  but the quantities are architectural rather than physiological and the human morphometric arm agrees with the animal
  arm on the zone-height blindness.
summary: 'R437 named "what makes swelling AXIAL rather than isotropic" as 18 node hits and zero ledger presence, and
  R454

  worked it from first principles. R463 is the literature answer, and it corrects R454 four times, answers one open gap,

  and produces the cleanest counterexample in the atlas to a pure terminal-cell-size strategy.


  ONE - THE CONSTRAINT IS EXTRINSIC, AND THE PROOF IS A NATURAL EXPERIMENT INSIDE ONE MOUSE, NOT A HYDROGEL. R454 rested

  the extrinsic claim on cultured chondrocytes becoming round. shapiro2015 is far stronger: in the SAME BALB/c mouse,
  at

  the SAME stage of differentiation, hypertrophic chondrocytes inside a physeal column with longitudinal septa ELONGATE

  ALONG THE LONG AXIS, while hypertrophic chondrocytes in the secondary ossification centre REMAIN CIRCULAR TO OVAL WITH

  NO ELONGATION. Same genome, same programme, same animal, no culture artefact. Direction is a property of the

  architecture the cell sits in, not of the cell.


  TWO - THE DIRECTIONAL STIFFNESS MEASUREMENT EXISTS, IT IS THE RIGHT SIZE, AND IT HAS BEEN IN THIS ATLAS UNUSED. R454

  stated that prein2016 is the only directional mechanical measurement of growth-plate matrix and that it runs the wrong

  way. That is wrong twice: prein2016 is a RADIAL comparison of pericellular against interterritorial matrix and is not

  directional with respect to the growth axis at all, and cohen1998 measured the growth-axis anisotropy directly in

  NORMAL newborn bovine distal ulna, n=20 paired, giving transverse E1 4.55 plus or minus 1.21 MPa against axial E3 0.47

  plus or minus 0.11 MPa - a 9.7-fold transverse-to-axial ratio, running the RIGHT way. A cell meets about ten times
  more

  resistance widening than heightening. The requirement derived from hunziker1987 is only 2.47 to 1 linear, comfortably

  inside it. Two qualifications: the loading modes differ, E1 tensile and E3 compressive, and sergerie2009 reports the

  hypertrophic and proliferative zones are 0.5 times the reserve zone axially but 0.33 times transversely, so the

  hypertrophic zone is about 1.5-fold LESS anisotropic than the reserve zone. The absolute per-zone moduli for the

  hypertrophic zone are the single most useful missing number and have been in print since 2009.


  THREE - AND THE FIBRE ANGLE HAS BEEN MEASURED IN A GROWTH PLATE BY ALL THREE MODALITIES R454 SAID HAD NEVER BEEN

  APPLIED. bunger2006 is scanning SAXS on pig neurocentral growth plate, speer1982 is quantitative polarised light, and

  finnoy2016 is second-harmonic generation on porcine growth cartilage. BUT THE SAXS RESULT CANNOT CURRENTLY BE READ,

  AND THIS IS THE ROUND''S SINGLE MOST DECISION-RELEVANT AMBIGUITY: the abstract says the fibrils have a predominant

  orientation in the longitudinal direction of the neurocentral growth plate, and separately refers to the direction

  perpendicular to the growth plate. If longitudinal means the growth axis then the fibres sit near zero degrees, far

  below the 54.74 degree crossover, and R454''s own arithmetic then predicts pressurisation SHORTENS and FATTENS - the

  wrong sign. If it means the plate''s in-plane long dimension then the fibres are a hoop and the model is confirmed.


  FOUR - THE 1.58-FOLD DIAMETER RATIO IS NOT AN INDEPENDENT OBSERVATION. cruzorive1986, the method paper behind

  hunziker1987 and sharing its third author, defines cell height as five times mean volume divided by pi times the

  expectation of the squared width - so HEIGHT IS THE QUOTIENT OF VOLUME AND A WIDTH SECOND MOMENT, not a third

  measurement. The ten-fold volume and four-fold height therefore FORCE a width second-moment ratio of 2.5 and an RMS

  width ratio of 1.581 by identity. Carrying the published two-model prefactor scheme - oblate spheroid for

  proliferative cells, super-egg for hypertrophic - moves the implied width ratio to about 1.45 and the linear anisotropy

  from 2.47 to about 2.76 to 1. The consequence is that the anisotropy claim rests on ONE model-free measurement, volume,

  and ONE biased measurement, width, which cruzorive1986 itself says is biased high in hypertrophic cells.


  FIVE - AND THE BASELINE EXPANSION IS NOT PURELY AXIAL, BY THE ATLAS''S OWN MODEL-FREE MEASUREMENT. breur1994

  reconstructed individual rat chondrocytes by serial section and reports the volume increase raising BOTH the vertical

  AND the horizontal diameter. bylskiaustrow2018''s finding of unchanged human cell width is therefore the RESPONSE TO
  A

  PERTURBATION being purely axial, not the baseline expansion. And the same laboratory''s pig study disagrees with its
  own

  human study on that variable: in the pig, cell width FELL with cell height.


  SIX - THE ZONE-HEIGHT READOUT IS BLIND, AND THE FIELD SAID SO IN 1989 AND TESTED IT IN 2021. hunziker1989 concluded

  that the utility of growth plate height as an estimator of linear growth rate is limited. wilson2021 then regressed

  every plate parameter against tibial growth in NORMAL mice and in HUMAN radiographs and found that HYPERTROPHIC ZONE

  HEIGHT AND PLATE AREA DID NOT CORRELATE, while total height, resting-zone height, combined proliferative and

  prehypertrophic height, proliferation activity and PLATE WIDTH did. The one zone whose height is blind is the

  hypertrophic zone - precisely the zone carrying 44 to 59 per cent of elongation, and precisely the variable

  bylskiaustrow2018 showed misses a 34 per cent cell-level effect on the same sections at P=0.21.


  SEVEN - AND THE CLEANEST COUNTEREXAMPLE TO A PURE h_term STRATEGY IS NEW TO THIS ATLAS. rathod2024, global TRAP/ACP5

  knockout against WILD-TYPE LITTERMATES in both sexes: growth plate height AND HEIGHT OF TERMINAL HYPERTROPHIC

  CHONDROCYTES BOTH MARKEDLY INCREASED, NUMBER OF COLUMNS DECREASED, AND THE TIBIA WAS SHORTER, with serum IGF-1

  unchanged and organ masses not proportionally reduced. That is charge without discharge with the cell-level term

  measured, and it is a direct warning that raising terminal cell height is not sufficient for length.


  EIGHT - THE DENERVATION EXPERIMENT R449 CALLED UNRUN HAS BEEN RUN. killion2017 transected the sciatic nerve at P8 in

  NORMAL mice with the contralateral limb as internal control and reports significantly shorter tibiae at 8 and 14 weeks,

  disrupted columns, altered collagen fibre organisation by polarised light and disrupted actin. It does not close

  g_l7_449d - no resting-zone count, no Gli1 or Ptch1 - but it closes the length and architecture half, and it is the

  only in-vivo link between the cytoskeleton, matrix fibre order and bone length in one animal.


  NINE - AND THE SEARCH FOR AN AGENT SCORED ON BOTH DIMENSIONS CONFIRMS R440''S CLAIM WITH ONE IMPORTANT QUALIFICATION.

  The entire world literature measuring growth-plate chondrocyte WIDTH is small enough to enumerate - full-text

  co-occurrence of chondrocyte height with chondrocyte width returns zero records - and after removing bacterial

  cell-wall papers the real corpus is mechanical, genetic, nutritional and developmental. NOT ONE IS A GROWTH-PROMOTING

  PHARMACOLOGICAL AGENT. The qualification is that GH and IGF-1 have been scored on HEIGHT and VOLUME in hunziker1994,

  from which width is recoverable, and the atlas already back-calculates aspect ratios of 0.96, 1.27, 1.15 and 1.42 for

  saline, IGF-I, GH and normal littermate - so hormones restore SIZE more completely than SHAPE.'
quantitative:
- parameter: transverse versus axial Young modulus of NORMAL growth-plate matrix
  value: E1 transverse 4.55 +/- 1.21 MPa vs E3 axial 0.47 +/- 0.11 MPa - a 9.7-fold ratio
  unit: MPa, newborn bovine distal ulna, n=20 paired
  species: bovine
  source_ref: cohen1998
  value_unverified: true
  note: 'THE DIRECTIONAL MEASUREMENT R454 SAID DID NOT EXIST, running the RIGHT way, and about 4-fold larger than the
    2.47:1 linear anisotropy the cell shape requires. CAVEAT: E1 is tensile and E3 compressive, and the paper is paywalled
    so the numbers are atlas-held and unverified by direct reading'
- parameter: physeal versus epiphyseal hypertrophic chondrocyte shape in the SAME animal
  value: physeal cells elongate along the long axis; epiphyseal cells remain circular to oval with NO elongation
  unit: qualitative, LM and EM, same BALB/c mice, same differentiation stage
  species: mouse
  source_ref: shapiro2015
  note: 'THE DECISIVE IN-VIVO CONTROL: direction is a property of the architecture, not of the cell - and it needs no
    culture artefact to make the point'
- parameter: hypertrophic zone height as a correlate of tibial growth
  value: hypertrophic zone height and growth plate AREA did NOT correlate; total height, resting-zone height, PZ+PHZ
    height and PLATE WIDTH did
  unit: normal mouse neonate to young adult plus human tibial radiographs
  species: multiple
  source_ref: wilson2021
  note: THE ONE ZONE WHOSE HEIGHT IS BLIND IS THE ONE CARRYING 44-59 PER CENT OF ELONGATION. Any atlas result whose only
    cartilage endpoint is hypertrophic zone height should be read as UNINFORMATIVE rather than null unless a bone-length
    endpoint accompanies it
- parameter: global TRAP/ACP5 knockout - terminal hypertrophic cell height versus tibial length
  value: growth plate height AND terminal hypertrophic cell height markedly INCREASED, column number DECREASED, TIBIA
    SHORTER
  unit: both sexes, wild-type littermate controls; serum IGF-1 unchanged
  species: mouse
  source_ref: rathod2024
  note: CHARGE WITHOUT DISCHARGE WITH THE CELL-LEVEL TERM MEASURED - the cleanest counterexample in this atlas to a pure
    terminal-cell-size strategy
- parameter: pericellular versus interterritorial matrix volume per cell across hypertrophy
  value: cell 1174 to 5530; pericellular/territorial +61 per cent (4580 to 7390); interterritorial +26 per cent (3460
    to 4370)
  unit: cubic micrometres per cell, mini-pig, n=6
  species: porcine
  source_ref: noonan1998
  note: the immediate shell is expanded FASTER than the bulk, so the pericellular matrix is actively remodelled rather
    than passively stretched. Directional pericellular stiffness has never been measured
- parameter: primary cilium orientation by zone
  value: resting zone NON-polarised; proliferative and hypertrophic cilia align PARALLEL to the bone long axis
  unit: qualitative, human growth plate
  species: human
  source_ref: deandrea2010
  note: an intracellular directional marker acquired exactly where the shape change begins - correlation only, nobody
    has reoriented cilia and measured cell height and width
- parameter: unilateral sciatic denervation in a NORMAL mouse, contralateral internal control
  value: significantly SHORTER tibiae at 8 and 14 weeks, disrupted columns, ALTERED COLLAGEN FIBRE ORGANISATION, disrupted
    actin
  unit: nerve transected at P8
  species: mouse
  source_ref: killion2017
  note: ANSWERS THE LENGTH AND ARCHITECTURE HALF OF g_l7_449d, which R449 said had never been done. Does not close it
    - no resting-zone count, no Gli1/Ptch1
- parameter: cell width response to mechanical perturbation - PIG versus HUMAN, same laboratory
  value: 'pig: zone height, cell height AND cell width all lowest on the stapled side (model p<0.02). Human: cell height
    12.8 to 8.5 micrometres P<0.0005 with WIDTH 15.0 vs 14.9 UNCHANGED'
  unit: pig unilateral vertebral staple n=5 with contralateral controls; human scoliosis n=13 vs 5 autopsy
  species: multiple
  source_ref: bylskiaustrow2009
  note: SAME GROUP, SAME TWO VARIABLES, OPPOSITE ANSWERS ON WIDTH - the variable that decides whether direction is separately
    controllable. Both paywalled
- parameter: scanning SAXS fibril orientation in a growth plate
  value: fibrils 90-112 nm cross-section with a predominant orientation described as longitudinal
  unit: pig L4 neurocentral growth plate
  species: porcine
  source_ref: bunger2006
  value_unverified: true
  note: 'ORIENTATION CONVENTION UNRESOLVED AND IT INVERTS THE PREDICTION: growth-axis fibres sit near 0 degrees and predict
    shortening on pressurisation, while in-plane fibres are a hoop and confirm the model. Figures paywalled'
