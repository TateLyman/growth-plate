id: round407_why_osteolectin_worked_and_why_it_will_not_work_here
name: "R407: dissecting WHY osteolectin lengthened bone - it raises chondrocyte proliferation, and the same paper contains the experiment showing that at the age when elongation is nearly complete FOUR doses across an eightfold range did nothing at all"
aliases:
  - osteolectin mechanism
  - osteolectin dose age dependence
  - why recombinant osteolectin worked
type: intervention
layer: L5
stub: false
summary: >-
  R403 promoted osteolectin on one sentence: recombinant injections increased femur length
  in juvenile mice, in normal animals, which is the experiment this atlas has never had for
  any other obtainable agent. This round reads the paper in full and asks the only question
  that matters for this case - why did it work, and does the reason still hold at bone age
  16. The answer is in the same paper, it is unambiguous, and it goes against us.

  WHY IT WORKED. Dose 200 micrograms per kilogram per day, SUBCUTANEOUS, DAILY, FROM TWO TO
  EIGHT WEEKS OF AGE - the whole juvenile growth period - in male and female wild-type mice,
  six per sex per group. Result: FEMURS 3 TO 4 PERCENT LONGER than sex-matched littermates.
  The mechanism is explicit and measured: osteolectin binds INTEGRIN ALPHA-11, raises total
  and active beta-catenin and the Wnt targets Alpl, Lef1 and Runx2 in cultured growth plate
  chondrocytes, and RAISES EdU INCORPORATION IN AGGRECAN-POSITIVE GROWTH PLATE CHONDROCYTES
  in vivo. It lengthened the cortical bone formed by chondrocyte descendants in an
  Acan-CreER lineage trace. The authors state it plainly - it promotes bone elongation by
  increasing the proliferation of growth plate chondrocytes.

  ⛔ AND THE FIRST REASON THAT DOES NOT TRANSFER IS THE DOSE-FINDING EXPERIMENT ITSELF. Before
  the juvenile study they ran the same protein in EIGHT-WEEK-OLD wild-type males at 50, 100,
  200 and 400 micrograms per kilogram per day FOR A FULL MONTH. NONE OF THOSE DOSES HAD ANY
  EFFECT ON FEMUR LENGTH OR ON LS3 VERTEBRA LENGTH. The authors give the reason in the same
  sentence: bone elongation is largely complete by eight weeks of age. Four doses across an
  eightfold range, a month of daily injection, and the length endpoint did not move once the
  plate was nearly done. That is the closest available model of this subject, and it is the
  arm that failed.
  ⛔ THE MECHANISM FOLLOWS THE SAME CLOCK, WHICH IS WHY IT IS NOT A DOSING PROBLEM. EdU
  incorporation in growth plate chondrocytes was HIGHER in treated mice AT FOUR WEEKS and
  SIMILAR to controls AT EIGHT WEEKS. The drug stops moving proliferation exactly when the
  plate stops proliferating. There is no dose at which a proliferation agonist acts on a
  compartment that is no longer dividing.

  ⛔ THE SECOND REASON IS COMPARTMENT, AND HERE IT IS MEASURED RATHER THAN INFERRED. LS3
  VERTEBRA LENGTH DID NOT DIFFER between treated and control mice EVEN IN THE JUVENILE ARM,
  in the same animals whose femurs grew 3 to 4 percent. R406 inferred limb-dominance from a
  common variant; this is the direct experiment, and it is a flat null on the axial skeleton.
  For a subject whose residual growth is trunk-dominant, the one compartment that moved is
  the one with least left.

  ⛔ THE THIRD REASON IS THE TERM IT MOVES. In clonal culture osteolectin did NOT change the
  percentage of chondrocytes that formed colonies - it increased COLONY SIZE. It raises
  divisions per progenitor, not progenitor number. In the height identity that is
  amplification and throughput, not N. R360 established that once an aromatase inhibitor has
  removed the deadline the terminus becomes a BUDGET rather than a date, and in that regime
  raising throughput reaches the terminus sooner without adding total height. Osteolectin is
  a throughput agent, and this subject is the case where throughput is worth least.

  ⛔ AND THE FOURTH IS THE ONE R405 ALREADY FLAGGED AND THIS PAPER CONFIRMS MECHANISTICALLY:
  the effector is WNT PATHWAY ACTIVATION. R281 places the canonical-Wnt optimum BELOW wild
  type, and R356 found that the human resting zone's own programme is made of SECRETED WNT
  ANTAGONISTS - SFRP5, FRZB and SMOC1. An agent whose measured mechanism is raising
  beta-catenin in chondrocytes is on the wrong side of that band as this file draws it.

  WHAT SURVIVES, AND IT IS NOT NOTHING. The target is real and human-anchored, the receptor
  integrin alpha-11 is present and cartilage-enriched in the human growth plate at 61.8 CPM
  and a purity ratio of 2.76, the protein is purchasable, and the human-equivalent dose is
  trivially small - 16.2 micrograms per kilogram per day by body-surface-area scaling, about
  0.97 milligrams per day at 60 kilograms, roughly 27 milligrams for a four-week course. As
  a demonstration that supplying a secreted factor can lengthen a normal bone, it stands and
  it is the only such demonstration in this atlas. As a candidate FOR THIS SUBJECT it fails,
  and it fails on the paper's own negative control rather than on any argument of mine.
  ⭐ THE GENERALISABLE LESSON. R403 promoted this on a single positive sentence from an
  abstract. The dissection took one reading of the full text and found the disqualifying
  experiment sitting two paragraphs above the result. CORR-320 and CORR-343 in a new place:
  the arm that gets dropped from an abstract is the one that runs against the headline, and
  here it was the entire adult dose-response.
quantitative:
  - parameter: the juvenile regimen and its effect
    value: >-
      200 micrograms/kg/day subcutaneous, daily, from 2 to 8 weeks of age; femurs 3 to 4
      percent longer than sex-matched littermate controls
    unit: percent femur length
    species: mouse
    source_ref: zhang2023osteolectin
    note: six mice per sex per group in three independent experiments; wild-type, normal animals
  - parameter: the same protein in mice whose elongation is nearly complete
    value: >-
      50, 100, 200 and 400 micrograms/kg/day for one month in 8-week-old males - NO effect on
      body mass, femur length or LS3 vertebra length at any dose
    unit: qualitative null
    species: mouse
    source_ref: zhang2023osteolectin
    note: >-
      the authors attribute it to elongation being largely complete by 8 weeks. This is the
      closest available model of a subject at bone age 16, and it is the arm that failed
  - parameter: the proliferation effect tracks the same clock
    value: >-
      EdU incorporation in Aggrecan-positive growth plate chondrocytes HIGHER at 4 weeks,
      SIMILAR to control at 8 weeks
    unit: qualitative
    species: mouse
    source_ref: zhang2023osteolectin
    note: >-
      this is why the adult null is not a dosing problem - the mechanism itself switches off
      as the plate slows
  - parameter: compartment, measured directly
    value: LS3 vertebra length did not differ even in the juvenile arm
    unit: qualitative null
    species: mouse
    source_ref: zhang2023osteolectin
    note: >-
      in the same animals whose femurs grew 3 to 4 percent. A direct axial null, stronger
      than R406's inference from a common variant
  - parameter: which term of the height identity it moves
    value: >-
      no change in the percentage of chondrocytes forming colonies; INCREASED colony SIZE.
      Wnt activation - total and active beta-catenin, Alpl, Lef1, Runx2 all up
    unit: qualitative
    species: mouse
    source_ref: zhang2023osteolectin
    note: >-
      divisions per progenitor rather than progenitor number - amplification and throughput,
      not the pool. Under R360's budget regime that is the term worth least here
  - parameter: human-equivalent dose
    value: >-
      16.2 micrograms/kg/day, about 0.97 mg/day at 60 kg, roughly 27 mg for a four-week course
    unit: mg
    species: not_applicable
    source_ref: zhang2023osteolectin
    value_unverified: true
    note: >-
      computed in R407 by FDA body-surface-area allometry from 200 micrograms/kg/day. Recorded
      for completeness; the age dependence makes it moot for this subject
localization: growth plate chondrocytes, via integrin alpha-11
human_evidence: indirect
human_evidence_note: >-
  The interventional work is mouse. Human evidence is the rs182722517 association with
  reduced height and reduced plasma osteolectin, the gene-edited human BMSC experiment, and
  cartilage-enriched expression of CLEC11A and ITGA11 in human growth plate.
species_basis:
  - mouse
  - human
translation_risk: high
translation_risk_reason: >-
  The effect is demonstrated only in animals with an actively elongating plate and is
  explicitly absent once elongation is nearly complete, which is the condition of this
  subject. The axial null was measured directly.
confidence: B
claim_grades:
  - claim: Osteolectin lengthens bone by increasing growth plate chondrocyte proliferation
    grade: B
    basis: >-
      EdU in Aggrecan-positive chondrocytes in vivo, Wnt target induction and EdU in cultured
      chondrocytes, and an Acan-CreER lineage trace of chondrocyte-derived cortical bone
  - claim: >-
      The effect is absent once bone elongation is nearly complete, at four doses across an
      eightfold range
    grade: A
    basis: >-
      the paper's own dose-finding experiment in 8-week-old mice, one month of daily
      injection, null on femur and vertebra
  - claim: The mechanism switches off on the same schedule
    grade: B
    basis: EdU higher at 4 weeks and similar at 8 weeks in the treated animals
  - claim: The effect is femur-only - the vertebra did not move
    grade: A
    basis: LS3 vertebra length measured in the same juvenile animals and null
  - claim: >-
      It raises divisions per progenitor rather than progenitor number, so it is a throughput
      agent
    grade: B
    basis: >-
      colony percentage unchanged and colony size increased in clonal culture. In vitro, and
      colony size is not identical to divisions in vivo
  - claim: It is not a candidate for a subject at bone age 16
    grade: B
    basis: >-
      the adult null, the age-dependent mechanism, the axial null and the throughput term all
      point the same way. It remains a valid demonstration that supplying a secreted factor
      can lengthen a normal bone
