id: collagen_crosslinking
name: Collagen crosslinking in cartilage
aliases:
- pyridinoline crosslink
- hydroxylysyl pyridinoline
- HP/LP crosslinks
type: process
layer: L5
stub: false
summary: 'Cartilage collagen owes its tensile strength to covalent crosslinks formed by lysyl oxidase, which oxidatively
  deaminates specific telopeptide lysine and hydroxylysine residues to aldehydes that then condense with helical residues
  on neighbouring molecules. In cartilage the pathway is the hydroxylysine route, so divalent ketoimines mature into
  the trivalent 3-hydroxypyridinium crosslinks hydroxylysyl pyridinoline (HP) and lysyl pyridinoline (LP); collagen
  II is bonded head-to-tail at the two telopeptide-to-helix sites, and collagen IX is covalently attached to the collagen
  II fibril surface and to other collagen IX molecules at at least six identified sites, all of which are occupied
  in matrix-resident collagen IX. This makes the fibril a single covalent polymer that cannot be reassembled if broken,
  which is why cartilage collagen turnover is essentially nil in adults and why damaged collagen architecture is not
  recapitulated. Crosslink chemistry is a readout of mineralization status as well: Phospho1-/- bone shows altered
  DHLNL/HLNL and pyridinoline/deoxypyridinoline ratios alongside its hypomineralization. Lysyl oxidase itself is essential
  - Lox-null mice die perinatally - but CORRECTED 2026-08-06 (CORR-011): a zone-resolved crosslink density measurement
  of a growth plate DOES exist and this node previously implied it did not - farquharson1996 quantified pyridinium
  cross-links by HPLC through sequential transverse sections of the chick growth plate, with the proliferative zone
  reported at roughly ten times the pyridinoline of the mature hypertrophic zone (abstract only, full text requested),
  and the human cartilage crosslink data are articular, not physeal. LINKED 2026-08-06 to gap g_l1arch_018: this node
  is the enzymatic determinant in a five-step chain that would make tissue mechanical ANISOTROPY the converter from
  isotropic chondrocyte enlargement into axial bone length. The chain is (i) the plate is ~10x more compliant along
  the growth axis than transversely at birth (cohen1998, wosu2012); (ii) that ratio collapses to ~1 as growth slows
  (wosu2012); (iii) chondrocyte enlargement is near-isotropic, per-cell allometric slopes 0.345/0.373/0.351 against
  an isometric 1/3 over 29,162 cells (re-analysis of rubin2021 by this atlas, grade D); (iv) the axis pointing along
  the bone is the cell''s SHORT one, and it thickens fastest with volume; (v) in classical homocystinuria, interference
  with collagen and fibrillin cross-linking accompanies TALL STATURE in humans. The missing link is between (v) and
  (i) - nobody has measured cross-link density and mechanical anisotropy in the same growth plate in any species,
  which is why this node is graded E.'
