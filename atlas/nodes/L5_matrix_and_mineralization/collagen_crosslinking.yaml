id: collagen_crosslinking
name: Collagen crosslinking in cartilage
aliases:
- pyridinoline crosslink
- hydroxylysyl pyridinoline
- HP/LP crosslinks
type: process
layer: L5
stub: false
summary: 'Cartilage collagen owes its tensile strength to covalent crosslinks formed by lysyl oxidase,
  which oxidatively deaminates specific telopeptide lysine and hydroxylysine residues to aldehydes that
  then condense with helical residues on neighbouring molecules. In cartilage the pathway is the hydroxylysine
  route, so divalent ketoimines mature into the trivalent 3-hydroxypyridinium crosslinks hydroxylysyl
  pyridinoline (HP) and lysyl pyridinoline (LP); collagen II is bonded head-to-tail at the two telopeptide-to-helix
  sites, and collagen IX is covalently attached to the collagen II fibril surface and to other collagen
  IX molecules at at least six identified sites, all of which are occupied in matrix-resident collagen
  IX. This makes the fibril a single covalent polymer that cannot be reassembled if broken, which is why
  cartilage collagen turnover is essentially nil in adults and why damaged collagen architecture is not
  recapitulated. Crosslink chemistry is a readout of mineralization status as well: Phospho1-/- bone shows
  altered DHLNL/HLNL and pyridinoline/deoxypyridinoline ratios alongside its hypomineralization. Lysyl
  oxidase itself is essential - Lox-null mice die perinatally - but no zone-resolved crosslink density
  measurement of any growth plate was located in this sweep, and the human cartilage crosslink data are
  articular, not physeal.'
