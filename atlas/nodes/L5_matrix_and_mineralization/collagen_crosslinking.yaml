- parameter: pyridinoline cross-link concentration through the growth plate
  value: peak 0.55 in the proliferative zone falling to 0.03 at the collagen X boundary
  unit: residues per collagen molecule
  conditions: chick proximal tibiotarsus, sequential transverse sections, reverse-phase HPLC with hydroxyproline in
    the same hydrolysate as the collagen denominator; zones assigned by ALP histochemistry and collagen X immunostaining
    on the same sections. Articular cartilage sits at 0.30-0.37 and peaks at 0.55 in the proliferative zone (section
    9); ALP first appears at section 11 (0.21), collagen X at section 14 (0.03)
  species: chicken
  source_ref: farquharson1996
  uncertainty: 'THE MEASUREMENT THIS ATLAS TWICE SAID DID NOT EXIST. Values read from Fig. 1A; the paper states the
    comparison as approximately 10-fold between sections without collagen X (N9-N11) and those with it (N14-N16),
    and the peak-to-trough span in the figure is about 18-fold. The minimum falls exactly at the onset of collagen
    X, i.e. at hypertrophic entry. DEOXYPYRIDINOLINE RUNS THE OTHER WAY: absent from articular cartilage and the upper
    plate, first detected in the ALP-positive prehypertrophic zone, and the principal cross-link in the most differentiated
    sections. So this is not a simple loss of cross-linking but a collapse and partial recovery with a SWITCH OF CROSS-LINK
    TYPE - total pyridinium cross-links fall from ~0.55 to ~0.03 and recover only to ~0.12. THE AUTHORS DRAW A DIFFERENT
    CONCLUSION FROM THE SAME DATA: they read the fall as an adaptation permitting vascular invasion and osteoclastic
    resorption, via increased collagenase activity and collagen turnover, not as a softening that permits the cell
    to expand. Both readings fit; nothing here distinguishes them.'
- parameter: cross-link concentration where hypertrophic differentiation FAILS
  value: rises progressively through the lesion to about 0.45
  unit: residues per collagen molecule, total pyridinium
  conditions: chick tibial dyschondroplasia, a lesion in which chondrocytes arrest in the prehypertrophic state and
    unmineralised avascular cartilage accumulates; same sectioning and HPLC as the normal plate above
  species: chicken
  source_ref: farquharson1996
  uncertainty: 'The sign is the informative part: where hypertrophy and resorption FAIL, cross-links are HIGH and
    rise with depth, against the collapse seen in the normal plate. orth1994 reports the same direction independently
    and across four different means of inducing the lesion. This is correlative in both papers - no one has manipulated
    cross-linking and measured hypertrophy.'
- parameter: hydroxylysylpyridinoline in dyschondroplastic versus normal growth plate cartilage
  value: over 10-fold greater in the lesion
  unit: moles per mole collagen
  conditions: broiler chicks; tibial dyschondroplasia induced four separate ways - genetic predisposition, copper-deficient
    diet, thiram, and dietary homocysteine. ALL methods raised collagen and HP concentration in the lesion over normal
    growth plate cartilage
  species: chicken
  source_ref: orth1994
  uncertainty: 'THE FOUR-CAUSE DESIGN IS WHAT MAKES THIS INTERPRETABLE: because genetic, copper, thiram and homocysteine
    induction all raise cross-links, the elevation is a property of the LESION, not of any one causative agent. The
    authors read the heavily cross-linked matrix as inhibiting collagenolysis and vascular penetration.'
- parameter: effect of dietary homocysteine on cross-linking in NON-lesional cartilage
  value: none. sternal 0.355 vs 0.409; articular 0.603 vs 0.573
  unit: moles HP per mole collagen (homocysteine-fed vs control)
  conditions: broiler chicks fed a high-homocystine diet and developing tibial dyschondroplasia, against corn/soybean
    controls, n=5 per group; sternal and articular cartilage assayed rather than the lesion. Collagen concentration
    also unchanged (sternal 266 vs 273, articular 417 vs 439 ug/mg dry weight)
  species: chicken
  source_ref: orth1994
  uncertainty: 'THIS ROW WITHDRAWS CORR-011 PART 2. That correction, written from the abstract alone, took orth1994
    to show that homocysteine RAISES cartilage cross-linking and therefore that the homocystinuria step of g_l1arch_018
    ran backwards. Experiment 3 of the same paper shows the opposite: in homocysteine-fed birds the non-lesional cartilage
    is normal in both HP and collagen. The paper says so plainly - the cartilage "appeared normal, having similar
    HP concentrations". So homocysteine does NOT systemically raise cartilage cross-linking, and the objection is
    void. What orth1994 actually shows is that dyschondroplastic lesions of any cause are hyper-cross-linked.'
