type: protein
layer: L5
stub: false
summary: 'Lysyl oxidase is the copper- and lysine-tyrosylquinone-dependent amine oxidase that initiates
  all covalent collagen and elastin crosslinking by converting telopeptide lysine and hydroxylysine to
  allysine. It is the single enzymatic step on which the entire mechanical competence of the cartilage
  collagen network depends, and it is irreversibly inhibited by beta-aminopropionitrile, the lathyrogen.
  Lox-null mice die perinatally with aortic aneurysm, cardiovascular dysfunction and diaphragmatic defects;
  the paralogue Loxl3 null has cleft palate and spinal deformity, so the family has partially distinct
  skeletal roles. Beyond crosslinking, LOX is hypoxia-induced and the growth plate is a steep oxygen gradient,
  which makes zonal LOX activity a plausible but untested regulator of the zonal stiffness gradient. This
  node is deliberately thin because the evidence is thin: no zone-resolved LOX expression, activity or
  crosslink-density measurement in growth plate cartilage of any species was located in this sweep, and
  there is no human LOX-deficiency chondrodysplasia. Everything specific to the physis here is inference
  from vascular and tendon biology.'
