- protein-lysine 6-oxidase
- LOXL1-4
type: protein
layer: L5
stub: false
summary: 'Lysyl oxidase is the copper- and lysine-tyrosylquinone-dependent amine oxidase that initiates all covalent
  collagen and elastin crosslinking by converting telopeptide lysine and hydroxylysine to allysine. It is the single
  enzymatic step on which the entire mechanical competence of the cartilage collagen network depends, and it is irreversibly
  inhibited by beta-aminopropionitrile, the lathyrogen. Lox-null mice die perinatally with aortic aneurysm, cardiovascular
  dysfunction and diaphragmatic defects; the paralogue Loxl3 null has cleft palate and spinal deformity, so the family
  has partially distinct skeletal roles. Beyond crosslinking, LOX is hypoxia-induced and the growth plate is a steep
  oxygen gradient, which makes zonal LOX activity a plausible but untested regulator of the zonal stiffness gradient.
  This node is deliberately thin because the evidence is thin: no zone-resolved LOX expression or ACTIVITY measurement
  in growth plate cartilage of any species was located. CORRECTED 2026-08-06 (CORR-011): a zone-resolved CROSSLINK-DENSITY
  measurement does exist and this node previously implied it did not - farquharson1996 quantified pyridinium cross-links
  by HPLC through sequential transverse sections of the chick growth plate, and rucklidge1996 measured lysine-derived
  crosslinks in growth plate collagen X. A failed search is a statement about the search, and there is no human LOX-deficiency
  chondrodysplasia. Everything specific to the physis here is inference from vascular and tendon biology. LINKED 2026-08-06
  to gap g_l1arch_018: this node is the enzymatic determinant in a five-step chain that would make tissue mechanical
  ANISOTROPY the converter from isotropic chondrocyte enlargement into axial bone length. The chain is (i) the plate
  is ~10x more compliant along the growth axis than transversely at birth (cohen1998, wosu2012); (ii) that ratio collapses
  to ~1 as growth slows (wosu2012); (iii) chondrocyte enlargement is near-isotropic, per-cell allometric slopes 0.345/0.373/0.351
  against an isometric 1/3 over 29,162 cells (re-analysis of rubin2021 by this atlas, grade D); (iv) the axis pointing
  along the bone is the cell''s SHORT one, and it thickens fastest with volume; (v) in classical homocystinuria, interference
  with collagen and fibrillin cross-linking accompanies TALL STATURE in humans. The missing link is between (v) and
  (i) - nobody has measured cross-link density and mechanical anisotropy in the same growth plate in any species,
  which is why this node is graded E.'
