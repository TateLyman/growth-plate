human_evidence: direct
human_evidence_note: The anisotropy result is measured in HUMAN adolescent vertebral growth plate (bylskiaustrow2018),
  the period ceiling in 286,205 European women (onlandmoret2005) with a Swedish paediatric cohort agreeing
  (holmgren2017bmi), the secular-trend constraint in Japanese and Korean national data (cole2018), and the
  limb-wide overgrowth signal in 74 children followed to skeletal maturity (shapiro1981). The elongation
  partition that corrects the h_term figure is RAT (wilsman1996) and has no human equivalent in any bone.
translation_risk: moderate
translation_risk_reason: The corrected partition is rat and site-specific, so applying 59/44 per cent to a
  human adolescent is an inference. The anisotropy result is human but is a scoliotic-load contrast rather
  than a growth-agent contrast. The period ceiling is observational and derived from natural tempo variation
  in women rather than from pharmacological suppression in a male.
summary: 'SIX EXTERNAL ANOMALY HUNTS RUN AGAINST THE OUTSIDE LITERATURE, WITH EVERY LOAD-BEARING IDENTIFIER
  RE-RESOLVED BY DIRECT PubMed FETCH BEFORE USE. What comes back is not a compound. It is that the term this
  file has spent the most rounds on is mis-sized, mis-measured and aimed at the wrong variable, and that the
  arm it has ranked highest is already performing at a ceiling two independent instruments agree on.


  CORR-361 - THE h_term FIGURE IS WRONG AND THE CORRECTION WAS IN THIS FILE''S OWN NODE. CLAUDE.md asserted
  in thirteen places that hypertrophic volume is about 80 per cent of longitudinal growth. The elongation_budget
  node, grade C, holds wilsman1996''s CLOSED partition - oxytetracycline for elongation rate plus BrdU and
  unbiased stereology across four plates of 28-day-old rats, with the internal check that cells produced per
  day matched cells lost at the chondro-osseous junction. In the FAST plate (proximal tibia) the split is 9
  per cent division, 32 per cent MATRIX SYNTHESIS, 59 per cent hypertrophy. In the SLOW plate (proximal radius)
  it is 7, 49 and 44 - so in a slow plate MATRIX SYNTHESIS EXCEEDS HYPERTROPHY. A subject at bone age 16 has
  slow plates, so for him the ordering may be inverted. This file has worked h_term to exhaustion and has
  NEVER WORKED MATRIX SYNTHESIS AS A TERM - 14 nodes and 2 ledger mentions - and R437''s eighth zero process,
  Golgi proteoglycan assembly rate, is the machinery of the term that may be largest for him. Two independent
  agents surfaced the same partition this round. No human equivalent exists in any bone.


  ONE - THE DIRECTION FINDING, DERIVABLE FROM THE FIELD''S OWN FOUNDATIONAL PAPER AND NEVER DERIVED. R437
  flagged "what makes swelling AXIAL rather than isotropic" as 18 node hits and zero ledger. hunziker1987''s
  canonical ratios are cell HEIGHT times four and cell VOLUME times ten. Since volume goes as height times
  diameter squared, those two numbers FORCE a diameter ratio of 1.581, against 2.154 for isotropic expansion
  - a 2.53-fold anisotropy sitting unremarked in the most-cited stereology paper in the field, and nobody
  has divided the two numbers.


  AND IT HAS BEEN MEASURED IN A HUMAN ADOLESCENT VERTEBRAL PHYSIS, WHICH IS THE EXACT TISSUE R425 AND R436
  SAY HAS NEVER BEEN PROFILED. bylskiaustrow2018 compared the scoliosis apex against age-matched autopsy
  controls: hypertrophic cell HEIGHT fell 12.8 plus or minus 1.2 to 8.5 plus or minus 1.1 micrometres at
  P<0.0005, while hypertrophic cell WIDTH was 15.0 plus or minus 2.5 versus 14.9 plus or minus 1.5, not
  significant. A physiological load cut cell volume by about a third ENTIRELY THROUGH THE AXIAL DIMENSION
  and left the transverse dimension untouched. THE TWO AXES ARE UNDER SEPARATE CONTROL, IN HUMAN TISSUE.


  AND THE METHODOLOGICAL CONSEQUENCE IS IN THE SAME SPECIMENS AND IS LARGER THAN THE FINDING. ZONE HEIGHT
  MISSED IT - 180 plus or minus 42 to 152 plus or minus 34 micrometres, P=0.21, NON-SIGNIFICANT, while cell
  height in the same tissue was P<0.0005. Zone height is the readout nearly every result in this atlas rests
  on. It is blind to a 34 per cent cell-level effect. So any agent scored null on zone height may have moved
  cell height, and "expanded hypertrophic zone" may be measuring the wrong variable. Two further facts point
  the same way: the direction is EXTRINSIC rather than cell-autonomous, because chondrocytes hypertrophying
  in hydrogels become large and ROUND and never elongated; and the candidate mould is already imaged, with
  collagen fibrils running proximodistal in the longitudinal septa and mediolateral in the transverse septa,
  which is the plant cell-wall architecture that sets directional turgor-driven expansion - a mature field
  nobody here has imported. NO GROWTH-PROMOTING AGENT IN THIS FILE HAS EVER BEEN SCORED ON CELL HEIGHT VERSUS
  WIDTH - not CNP, not GH, not IGF-1, not an FGFR3 inhibitor.


  TWO - THE PRICE OF THE PERIOD, AND TWO INSTRUMENTS AGREE ON IT. onlandmoret2005, EPIC, 286,205 women across
  nine countries: menarche one year later is worth PLUS 0.31 CENTIMETRES of adult height, country range 0.13
  to 0.50. A year of extra pubertal growth is worth several centimetres of GROWTH and yields a third of a
  centimetre of HEIGHT, so compensation is about 95 per cent complete. holmgren2017bmi agrees from a different
  design in 1,901 Swedish children: high childhood BMI advanced puberty by 3 to 3.5 months and cost 2.3 to
  3.1 centimetres of pubertal gain, and adult height was UNRELATED to childhood BMI. Now compare this file''s
  own ceiling - R274 prices anastrozole at plus 1.3 centimetres over three years, which is 0.43 centimetres
  per year, INSIDE Onland-Moret''s country range. A 286,205-person cohort measuring NATURAL tempo variation
  and randomised aromatase-inhibitor trials measuring PHARMACOLOGICAL period extension converge on 0.3 to
  0.4 centimetres per year of extra growth period. That is a validated ceiling on the entire period strategy
  and it explains every null on that axis - R274''s letrozole-equals-anastrozole, R337''s deeper estrone-sulfate
  suppression buying nothing, R419''s soft attained-height evidence, R358. THE COMPENSATION IS INTRINSIC TO
  THE SYSTEM RATHER THAN A PROPERTY OF THE DRUG, SO THERE IS NO BETTER OESTROGEN AGENT TO FIND.


  THREE - AND THE SECULAR TREND SAYS THE HEIGHT IS NOT IN THE PERIOD AND NOT IN EXTRA DIVISIONS EITHER.
  cole2018 applied SITAR to Japanese 1950-2010 and South Korean 1965-2005 national data and states in its
  own words that the growth period ADVANCED IN TIMING AND SHRANK IN DURATION, and that most of the adult
  height increment had already accrued BY AGE 1.5 YEARS. Up to 20 centimetres was gained in some populations
  - an order of magnitude more than this entire drug stack - WITHOUT extra growing time. The constraint falls
  out of this file''s own framework: if the plate carries a finite division budget (R360, R439) then a gain
  delivered in a SHORTENED period cannot be extra divisions either, so it must be YIELD PER DIVISION - cell
  size, MATRIX PER CELL, or progenitor number set in infancy. Which lands exactly on CORR-361. The honest
  limit is compartment and timing: tanner1982leg reports the Japanese 1957-77 gain was almost all LEG with
  sitting height practically unchanged, bogin2002maya reports Maya children in the USA versus Guatemala at
  plus 11.54 centimetres of which plus 6.83 is LEG, and the mechanism is delivered before 18 months - while
  this subject''s residual is trunk and he is sixteen. And the leading proposed driver fails at a length
  endpoint: kang2019milk, 17 randomised trials and 2,844 children, found milk raised weight by 0.48 kilograms
  and lean mass by 0.21 and DID NOT RAISE HEIGHT - though at ages 6 to 18, so it does not test the infancy
  window where the gain lives.


  FOUR - ABOUT ONE CENTIMETRE OF HUMAN LONG-BONE LENGTHENING FROM A NON-PHARMACOLOGICAL STIMULUS, INTERNALLY
  CONTROLLED, UNEXPLAINED SINCE 1981. shapiro1981 followed 74 children under 13 with femoral shaft fractures
  to skeletal maturity by serial orthoroentgenogram with the contralateral limb as control. Femoral overgrowth
  averaged 0.92 centimetres, range 0.4 to 2.7, was UNIVERSAL, and was INDEPENDENT OF AGE, FRACTURE LEVEL AND
  HEALING POSITION. AND THE UNBROKEN IPSILATERAL TIBIA ALSO OVERGREW, BY 0.29 CENTIMETRES IN 82 PER CENT OF
  PATIENTS. The standard explanation is local post-traumatic hyperaemia and it fails twice on the paper''s
  own data - hyperaemia should scale with injury severity and does not, and a femoral shaft fracture cannot
  deliver a LOCAL stimulus to a plate in a different bone across a joint. A BONE THAT WAS NEVER BROKEN
  LENGTHENED. That is a limb-wide transmissible signal, nobody has identified it in 45 years, and it is filed
  as a nuisance variable surgeons must anticipate when setting a child''s leg.


  FIVE - A CHALLENGE TO THE PREMISE OF THE PERIOD FRAMEWORK, RECORDED WITH ITS PROVENANCE CAVEAT. parfitt2002
  is titled "Misconceptions (1): epiphyseal fusion causes cessation of growth" - Parfitt arguing the causality
  runs the other way, that growth ceases FIRST and fusion FOLLOWS. If right, an aromatase inhibitor does not
  buy height by postponing fusion; it buys height only while the plate is still PRODUCING, and the two are
  dissociable. Consistent with the aromatase-deficient men who have unfused plates AND continued growth into
  the third and fourth decades, a state the conventional model cannot distinguish from unfused plates and no
  growth. TITLE AND JOURNAL VERIFIED; THERE IS NO ABSTRACT IN PUBMED AND THE FULL TEXT IS UNREAD. Do not quote
  it as established until the two pages are obtained.


  SIX - FOUR MORE VERIFIED ANOMALIES, RECORDED SO THEY ARE NOT REDISCOVERED. (a) THE AXIAL PLATE IS 5.6 TIMES
  SLOWER THAN THE LIMB PLATE IN THE SAME ANIMAL - control data in the stokes2007 series give rat vertebra 39
  against tibia 218 micrometres per day and calf 35 against 192. Same genome, same hormones, same day,
  unexplained, and printed as a control column; and the vertebral plate has no secondary ossification centre,
  which xie2020 says exists to shield hypertrophic chondrocytes from load, so the plate under the highest
  axial compression in the body runs its most fragile cells unprotected. (b) 93 PER CENT OF THE OSMOTIC DRIVE
  FOR HYPERTROPHY IS UNACCOUNTED FOR - farnum2002, bovine, zone-resolved, found betaine plus free amino acids
  plus inositol plus sorbitol account maximally for 6 to 7 per cent. The candidate their panel could not
  contain is GLYCOGEN, because osmotic pressure is COLLIGATIVE: one particle of roughly ten thousand glucose
  residues yields roughly ten thousand osmotically active particles at near-constant mass, which would also
  dilute dry mass exactly as cooper2013 measured. horigome2020 then showed growth-plate autophagy IS glycogen
  mobilisation and that Atg7-null chondrocytes accumulate glycogen granules. Both halves published, never
  joined, and glycogen has never been quantified by zone in any species. (c) THE RESTING-ZONE POOL EMPTIES
  WITHOUT DIVIDING AND WITHOUT DYING - nilsson2014 found oestrogen irreversibly accelerated resting-zone cell
  loss while SLOWING their proliferation, and the loss did not appear to be due to apoptosis. A pool that
  drains by a non-mitotic route is not a division budget, which is R437''s zero process number four and
  qualifies R360''s Regime 2 and R439''s framework at their root. (d) A LONG ENOUGH INSULT ABOLISHES CATCH-UP
  ALTOGETHER - chagin2010, rat metatarsal in 160-day culture: catch-up occurred after 7 or 12 days of
  dexamethasone but NOT after 19, and incomplete catch-up left permanently compromised bone length at four
  months. A reserve model predicts MORE banked capacity from longer restriction; it banks none. There is a
  duration threshold that destroys the capacity. And catch-up happened in a BONE IN A DISH, which kills the
  neuroendocrine set-point model outright - the same paper adds that the capacity is restricted to POSTNATAL
  bones and was associated only with increased chondrocyte proliferation.


  WHAT R440 CHANGES. The largest term in the identity is smaller than this file said, is measured with an
  instrument blind to it, and is aimed at the wrong variable - while the co-equal term beside it, matrix
  synthesis at 32 to 49 per cent, has never been worked at all. The period arm is performing at its biological
  ceiling and two independent instruments now agree what that ceiling is. And the largest unexplained
  lengthening effect in humans is a limb-wide signal released by a broken femur, sitting unclaimed since 1981.'
