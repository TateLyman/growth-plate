human_evidence: direct
human_evidence_note: >-
  Human evidence is a recessive short-stature syndrome with roughly twenty reported
  patients, a burden effect of minus 6.71 cm per pLoF allele at P=2.1e-37 across 178
  carriers, and cartilage-enriched expression in human growth plate. The supplementation
  evidence is human cells but on an osteogenic rather than a chondrocyte readout.
species_basis:
  - human
  - mouse
  - zebrafish
translation_risk: high
translation_risk_reason: >-
  The mapping from a loss-of-function effect to a supplementation effect is unmeasured;
  the only supply data are osteogenic rather than chondrogenic; the paralogues are
  demonstrably compensatory; the compartment is contested; and the biallelic phenotype is
  a prenatal developmental syndrome, so whether the gene is still doing work in an open
  plate at bone age 16 is unestablished.
confidence: C
claim_grades:
  - claim: Supplying recombinant SCUBE3 to human cells produces a measurable biological effect
    grade: B
    basis: >-
      chen2024scube3 treated human BMSCs with rhSCUBE3 and reported BMP2 and TGF-beta
      induction, mitophagy activation and restored osteogenic function via SMAD. Osteogenic
      readout, not chondrocyte, and no length endpoint
  - claim: >-
      SCUBE3 acts as a co-receptor, which is the architecture in which supplementation is
      mechanistically coherent
    grade: C
    basis: >-
      lin2023scube, a review, states membrane-associated SCUBE3 is a coreceptor promoting
      signalling in bone morphogenesis. Reviews are an index; the primary work behind that
      statement has not been read here
  - claim: >-
      A first-in-class neutralising antibody against SCUBE3 is in preclinical development as
      a cancer therapy
    grade: A
    basis: singh2026scube3ab, Cancer Research 2026, with preclinical efficacy data
  - claim: The SCUBE paralogues are compensatory, so supplementation may be saturating
    grade: B
    basis: >-
      tran2025scube, single double and triple mutants in zebrafish, with only the triple
      giving near-complete pathway loss. Zebrafish, and about Hedgehog rather than BMP
  - claim: >-
      The minus 6.71 cm loss effect is not a prediction of a plus 6.71 cm supplementation
      effect
    grade: A
    basis: >-
      requirement is not sufficiency. The mapping has never been measured for this or any
      other member of the class except osteolectin, where the supplementation effect size
      is itself not yet extracted
  - claim: The compartment is contested between limb and axial
    grade: C
    basis: >-
      R318's ratio-derived 104 percent leg against yeter2025scube3's axial cartilage
      expression and scoliosis phenotype, with R323 showing the ratio-derived coordinate is
      allele-specific
