id: round405_scube3_taken_all_the_way_down_the_supply_evidence_exists_the_mechanism_is_a_coreceptor_and_an_oncology_programme_is_building_the_opposite_drug
name: "R405: SCUBE3 taken all the way down - the sufficiency experiment exists and used the recombinant protein, the mechanism is a CO-RECEPTOR which is the one architecture where supply is coherent, and an oncology programme is building a neutralising antibody against the exact protein"
aliases:
  - SCUBE3 supplementation
  - recombinant SCUBE3 bone
  - SCUBE3 coreceptor BMP
  - SCUBE3 neutralising antibody
type: intervention
layer: L5
stub: false
summary: >-
  R404 ranked SCUBE3 the best untried member of the supply class and flagged one governing
  caveat: a load-bearing genetic effect establishes requirement, not sufficiency, and for a
  matricellular protein the endogenous pool may already saturate. This round works the
  target properly. The caveat is partly answered, the mechanism turns out to be the
  favourable one, and two objections appear that are worse than anything R404 anticipated.

  THE SUFFICIENCY EVIDENCE EXISTS AND IT USED THE RECOMBINANT PROTEIN. chen2024scube3:
  SCUBE3 rises during early osteogenic differentiation of human bone marrow stromal cells;
  knocking it down hinders differentiation; overexpressing it raises osteogenic genes and
  protein and calcium deposition; and TREATMENT WITH RECOMBINANT HUMAN SCUBE3 boosted BMP2
  and TGF-beta expression, activated mitophagy, ameliorated oxidative stress and restored
  osteogenic function through SMAD phosphorylation. In vivo, SCUBE3-overexpressing cells in
  GelMA microspheres accelerated healing in a mouse bone defect. So adding SCUBE3 does
  something. ⛔ But the readout is OSTEOGENIC differentiation of stromal cells, not
  chondrocyte proliferation; the in vivo arm is engineered cells in a hydrogel in a defect
  model rather than systemic protein in a normal animal; and there is no length endpoint
  anywhere in it.

  THE MECHANISM IS A CO-RECEPTOR, WHICH IS THE ONE ARCHITECTURE WHERE SUPPLY IS COHERENT.
  lin2023scube: SCUBEs carry a signal peptide, nine EGF-like repeats, a spacer, three
  cysteine-rich motifs and a CUB domain; the spacer and CR motifs let them bind the cell
  surface, and MEMBRANE-ASSOCIATED SCUBEs FUNCTION AS CORECEPTORS THAT ENHANCE SIGNALLING
  OF SERINE/THREONINE AND TYROSINE KINASE RECEPTORS - with membrane-associated SCUBE3
  named specifically as a coreceptor promoting signalling in bone morphogenesis. That
  matters because R404's caveat assumed a sequestering matricellular modulator, where more
  protein buffers rather than signals. A coreceptor is the opposite: it presents ligand to
  receptor, and more of it plausibly means more signal. It is the same architecture that
  made osteolectin work, which acts through integrin alpha-11.
  ⭐ And the same review places the family in R379's ligand-release layer - soluble SCUBE2
  enhances distal signalling by facilitating secretion of dual-lipidated hedgehog.

  THE COMPARTMENT QUESTION IS GENUINELY CONTESTED AND BOTH SIDES ARE IN THIS FILE. R318
  measured the SCUBE3 height allele at approximately 104 percent LEG allocation, which is
  the wrong compartment for a trunk-dominant residual and was recorded then as a real cost.
  Against that, yeter2025scube3 states SCUBE3 protein is significantly expressed in primary
  osteoblasts, LONG BONES, AND THE CARTILAGE OF THE AXIAL SKELETON throughout development,
  and the recessive phenotype prominently includes SCOLIOSIS, eleven rib pairs, irregular
  lower thoracic vertebral endplates and narrow iliac wings - an axial phenotype. R323
  separately showed that a compartment coordinate derived from a ratio-selected allele is
  an ALLELE fact rather than a gene fact, which is exactly the weakness of the R318 number.
  Unresolved, and it is the difference between the right compartment and the wrong one.

  ⛔ THE HARDEST OBJECTION IS NEW AND IT IS NOT BIOLOGICAL SUBTLETY. singh2026scube3ab
  reports a FIRST-IN-CLASS NEUTRALISING ANTIBODY AGAINST SCUBE3 in preclinical development
  as a pan-cancer therapy. Loss-of-function genomic screening identified SCUBE3 as
  supporting tumour survival and therapy resistance and orchestrating an immunosuppressive
  microenvironment; secretory SCUBE3 acts through EGFR, mutant CALR and TGF-beta receptors
  I and II, activating FOXR2 and c-Myc, enhancing DNA damage repair, and recruiting the
  DNMT1 repressor complex to IRF1 to silence MHC class I and II. The antibody was effective
  across preclinical models including patient-derived breast and ovarian xenografts. The
  proposal here is to supply the exact protein that an oncology programme is being built to
  remove. This atlas has repeatedly recorded two-sided targets - HHIP is a tumour
  suppressor, STC2 is a tumour promoter - but this is the first time the opposing agent is
  a named first-in-class therapeutic aimed at the same molecule.

  ⛔ AND THE REDUNDANCY OBJECTION NOW HAS DATA. tran2025scube generated single, double and
  triple scube mutants in zebrafish and reports that individual characterisation is
  difficult because of overlapping expression and COMPENSATORY MECHANISMS, with only the
  TRIPLE knockout producing near-complete Hedgehog loss of function. A system buffered by
  two paralogues is precisely the system in which supplementation is most likely to be
  saturating - R404's caveat, with evidence behind it. ✓ One useful construct detail from
  the same paper: full-length scube2 mRNA rescued slow muscle fibre number better than
  EGF-domain-truncated constructs, so the EGF repeats are functionally required and a
  supplementation experiment must use full-length protein.

  ⛔ AND THE HONEST ANSWER TO "IS IT THE BIGGEST EFFECT". The human number is minus 6.71 cm
  per loss-of-function allele at P equals 2.1e-37, across 178 carriers. That is a LOSS
  effect and it is not a promise of plus 6.71 cm from supplying the protein - the mapping
  from removal to addition is exactly what is unmeasured. Compare CLEC11A at minus 0.74 cm:
  a far smaller number, but across 10,012 carriers, monotone in variant severity, and with
  the supplementation experiment already performed in NORMAL juvenile mice and positive.
  SCUBE3 has the bigger number and the weaker inference; osteolectin has the smaller number
  and the completed experiment. Both should be run; neither should be described as the
  larger effect until a caliper exists.
  ⚠ CORR-325 and CORR-299 both apply: the biallelic phenotype is a developmental syndrome
  with PRENATAL growth retardation and microcephaly, so this is a gene required during
  development, and whether it is still doing work in an open plate at bone age 16 is a
  question the atlas has learned to ask explicitly. ✓ In its favour, R312 found SCUBE3
  FALLS WITH AGE in both mouse and rat - a declining factor whose loss shortens is the
  correct profile for a replacement lever.
