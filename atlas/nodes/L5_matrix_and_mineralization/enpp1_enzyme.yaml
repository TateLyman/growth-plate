id: enpp1_enzyme
name: ENPP1 (ectonucleotide pyrophosphatase/phosphodiesterase 1)
aliases:
- ENPP1
- NPP1
- PC-1
- ttw mouse
type: protein
layer: L5
stub: false
summary: 'ENPP1 is the ectoenzyme that generates extracellular PPi by hydrolysing ATP to AMP plus PPi.
  It is the opposing arm to TNAP, and the two act on the same pool. The 2022 revision of the model made
  ENPP1 more central, not less: since ANKH exports ATP rather than PPi, ENPP1 is downstream of every known
  cellular PPi source, and Enpp1-/- mouse bone contains under 2.5% of wild-type PPi. Enpp1-/- mice and
  the ttw mouse are hypermineralized, and deleting Enpp1 genetically rescues the hypomineralization of
  Akp2(Alpl)-/- mice, the cleanest demonstration that the phenotype of TNAP loss is caused by PPi excess
  rather than Pi deficiency. In humans, biallelic ENPP1 loss of function causes generalized arterial calcification
  of infancy, and the SAME alleles cause autosomal recessive hypophosphatemic rickets type 2 - so ENPP1
  deficiency simultaneously produces ectopic calcification (from PPi deficiency) and defective growth
  plate mineralization (from FGF23-driven phosphate wasting). ENPP1 protein has been detected at the mineralization-promoting
  growth plate-metaphysis interface in human tissue.'
