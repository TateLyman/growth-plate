id: round404_the_supply_query_run_on_all_fourteen_and_only_one_has_ever_been_tried
name: "R404: the corrected supply query run on all fourteen secreted load-bearing genes - four fail the receiver test, two are the wrong modality or redundant, one has a contested direction, and of the remaining five ONLY OSTEOLECTIN HAS EVER BEEN GIVEN TO AN ANIMAL"
aliases:
  - supply direction sweep
  - secreted load-bearing genes
  - recombinant protein supplementation growth plate
type: method
layer: L5
stub: false
summary: >-
  R403 found osteolectin by applying R401's corrected availability query to the ninety-six
  genes whose loss shortens humans, and noted that thirteen other secreted load-bearing
  genes present in the human growth plate had not been run through the same queries. This
  round runs them.

  THE STRUCTURAL RESULT FIRST, BECAUSE IT IS THE MOST INFORMATIVE THING HERE. Of the
  FOURTEEN secreted, load-bearing, growth-plate-expressed genes in kosmicki2026's table,
  EXACTLY ONE has ever been supplied to an animal with a bone endpoint - and it worked.
  Not one of the other thirteen has a supplementation experiment with a length or skeletal
  readout in any species. This is not a shelf that was searched and found empty. It is a
  direction essentially nobody has tried.

  FOUR FAIL THE RECEIVER TEST AND COME OFF THE LIST. Purity ratios in the human postnatal
  growth plate: EXT1 0.03, LTBP1 0.46, PAPPA 0.71, ADAMTS6 0.84 - all contaminant-leaning
  against calibrators of COL2A1 8.92 and NT5E 8.18, in the band that killed losartan at
  0.03 and sacubitril at 0.17. Their human effects are real; they are not demonstrably
  local.

  TWO MORE COME OFF FOR REASONS THAT ARE NOT ABOUT EVIDENCE. SERPINH1 is HSP47, an
  INTRACELLULAR endoplasmic reticulum collagen chaperone - supplying it extracellularly is
  the wrong modality no matter how good the genetics are, and its -6.50 cm at P=3.1e-25
  says only that collagen folding is load-bearing. IHH is the hedgehog ligand, so supplying
  it is Step 0 redundant with the SAG axis this file has worked for thirty rounds; the
  supply literature it returns is gene transfer and biomimetic scaffolds, and the
  compartment is already occupied.

  ONE HAS A CONTESTED DIRECTION AND IS RECORDED RATHER THAN RANKED. HTRA1, -3.31 cm at
  P=6.1e-10 and 3.24-fold cartilage-enriched, has a real skeletal literature - and it runs
  the wrong way. Published work has HtrA1 INHIBITING mineral deposition by osteoblasts and
  NEGATIVELY regulating osteoblast differentiation, while the human genetics say losing it
  shortens. It also cleaves TGF-beta receptors, which places it on an axis R323 showed has
  opposite signs in two cells of the same tissue. Unresolved, and not a supply candidate
  until it is.

  TWO ARE BIOCHEMICALLY AVAILABLE BUT HAVE NEVER BEEN GIVEN TO AN ANIMAL. Full-length
  recombinant aggrecan was expressed and characterised in 2006 and every use since is
  biochemistry; ACAN is -16.60 cm at P=1.9e-52, the LARGEST effect in the entire table, at
  3537 CPM and 4.65-fold enriched. Recombinant collagen type I alpha 1 exists, including
  from transgenic corn, and is a materials product; COL1A1 is -10.40 cm. R337 closed the
  route of raising aggrecan by blocking its catabolism as the RANKL trap and explicitly
  left the SYNTHESIS side untouched. Supplying the protein systemically to a growth plate
  is not obviously coherent for either - both are enormous structural molecules assembled
  in situ - but neither has been tried and neither should be recorded as closed.

  WHICH LEAVES FOUR THAT SURVIVE EVERY TEST AND HAVE NEVER BEEN TRIED, RANKED.
  · SCUBE3 is the standout and it is not close. Minus 6.71 cm at P=2.1e-37, and 16.02-FOLD
  CARTILAGE-ENRICHED at 171 CPM - the second highest purity ratio in the whole list after
  IHH. The recombinant protein is sold, over 95 percent pure, endotoxin under 0.10 EU per
  microgram, AND THE VENDOR VALIDATES ITS BIOACTIVITY BY ADHESION OF ATDC5 CHONDROGENIC
  CELLS. R287 named this exact experiment - recombinant SCUBE3, measure a bone - as one of
  four that did not exist, and R312 recorded no recombinant product. The product exists,
  the assay exists, and nobody has put a caliper on anything.
  · THBS3, minus 1.72 cm at P=3.4e-14 across 963 carriers, 5.37-fold enriched at 376 CPM -
  the third-highest ratio - with recombinant protein sold carrier-free by several
  suppliers and essentially no skeletal literature at all.
  · ANGPTL2, minus 3.65 cm at P=3.9e-10, 3.98-fold enriched at 478 CPM, the most abundant
  of the four, and its entire literature is cardiovascular and inflammatory with nothing
  skeletal.
  · SMOC1, minus 1.63 cm, 3.04-fold enriched, recombinant human and mouse protein already
  recorded as catalogue items in R356, and the mouse is already made and tibia-phenotyped.

  ⛔ WHAT NONE OF THIS ESTABLISHES. Every protein named is research grade with no
  toxicology and none has been given to a human. A load-bearing genetic effect says the
  gene is required; it does not say that adding more of the protein does anything, and for
  several of these the physiological pool may already be saturating. The supply direction
  worked for osteolectin, which is a growth FACTOR with a signalling receptor; SCUBE3,
  THBS3 and SMOC1 are matricellular modulators, where a supplementation experiment is a
  genuinely open question rather than a predictable one.
