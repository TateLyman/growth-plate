human_evidence: indirect
human_evidence_note: >-
  The genetics and the expression are human. The absence of supplementation experiments is
  an absence across all species.
species_basis:
  - human
translation_risk: moderate
translation_risk_reason: >-
  This round ranks candidates; it does not test any of them. A load-bearing genetic effect
  establishes requirement, not sufficiency, and for matricellular proteins the endogenous
  pool may already be saturating.
confidence: B
claim_grades:
  - claim: >-
      Of fourteen secreted load-bearing growth-plate genes, only osteolectin has ever been
      supplied to an animal with a bone endpoint
    grade: B
    basis: >-
      systematic Europe PMC queries per gene. An absence from searching, overturnable by
      one paper, but the queries were broad and per-gene
  - claim: EXT1, LTBP1, PAPPA and ADAMTS6 fail the receiver test
    grade: B
    basis: >-
      purity ratios of 0.03, 0.46, 0.71 and 0.84 against calibrators. A transcript-origin
      argument, subject to CORR-351
  - claim: SERPINH1 is the wrong modality because HSP47 is an intracellular chaperone
    grade: A
    basis: established cell biology; supplying an ER chaperone extracellularly is incoherent
  - claim: HTRA1's published skeletal direction contradicts its human genetics
    grade: C
    basis: >-
      osteoblast papers have HtrA1 inhibiting mineral deposition while human loss shortens.
      Both could hold in different compartments; unresolved
  - claim: >-
      SCUBE3 is the best untried candidate - largest enrichment after IHH, protein sold,
      vendor-validated on chondrogenic cells
    grade: B
    basis: >-
      -6.71 cm at P=2.1e-37, 16.02-fold enriched, and a catalogue product with a
      chondrogenic bioassay. No supplementation experiment exists in any species
  - claim: >-
      A load-bearing genetic effect does not imply that supplying more protein helps
    grade: A
    basis: >-
      requirement is not sufficiency, and for matricellular proteins saturation is the
      default expectation. This is why the round ranks rather than promotes
