id: zonal_stiffness_gradient
name: Zonal mechanical properties of the growth plate
aliases:
- growth plate zonal modulus
- physeal stiffness gradient
type: tissue_structure
layer: L5
stub: false
summary: 'There is no single number for growth plate stiffness, and the published values span three orders of magnitude
  because the methods measure different things at different length scales on differently prepared tissue. Tissue-scale
  hydrated measurements give hundreds of kilopascals to low megapascals: microindentation of 9-week rabbit proximal
  tibial physis gives a Hertz reduced modulus of 380-690 kPa; AFM microindentation of rabbit cranial base growth plate
  gives 0.57 +/- 0.05 MPa in the reserve zone rising to 1.41 +/- 0.19 MPa in the mineralizing zone. Nanoscale sharp-tip
  AFM on human growth plate cryosections gives 130.7 +/- 36.6 MPa in the resting zone and 416.2 +/- 107.2 MPa in the
  hypertrophic zone - two to three orders of magnitude higher, because a 9 nm tip loaded to 6 uN probes the local
  mineralised/fibrillar matrix rather than the poroelastic tissue, and because the interstitial fluid cannot redistribute
  at that scale. Worse, the DIRECTION of the gradient is not agreed. Porcine unconfined compression makes the reserve
  zone the stiffest zone, with proliferative and hypertrophic zones half as stiff axially. Rabbit microindentation
  puts the peak in the upper hypertrophic zone. Rabbit cranial base AFM has modulus increasing monotonically from
  reserve to mineralizing zone. Species, site, age, hydration, loading rate and constitutive model all differ between
  these, and none of them is a human weight-bearing physis measured hydrated at tissue scale. The growth plate is
  also mechanically anisotropic - longitudinal indentation of the rabbit reserve zone gives 0.77 +/- 0.12 MPa versus
  0.57 MPa transversely - and permeability differs threefold between zones, so a scalar modulus is an incomplete description
  in any case. LINKED 2026-08-06 to gap g_l1arch_018: this node is the enzymatic determinant in a five-step chain
  that would make tissue mechanical ANISOTROPY the converter from isotropic chondrocyte enlargement into axial bone
  length. The chain is (i) the plate is ~10x more compliant along the growth axis than transversely at birth (cohen1998,
  wosu2012); (ii) that ratio collapses to ~1 as growth slows (wosu2012); (iii) chondrocyte enlargement is near-isotropic,
  per-cell allometric slopes 0.345/0.373/0.351 against an isometric 1/3 over 29,162 cells (re-analysis of rubin2021
  by this atlas, grade D); (iv) the axis pointing along the bone is the cell''s SHORT one, and it thickens fastest
  with volume; (v) in classical homocystinuria, interference with collagen and fibrillin cross-linking accompanies
  TALL STATURE in humans. The missing link is between (v) and (i) - nobody has measured cross-link density and mechanical
  anisotropy in the same growth plate in any species, which is why this node is graded E.'
quantitative:
- parameter: Hertz reduced modulus, growth plate, microindentation
  value: 380-690
  unit: kPa
  conditions: 9-week New Zealand White rabbit proximal tibia, n=15, hydrated, peak in upper hypertrophic zone
  species: rabbit
  source_ref: eckstein2022
  uncertainty: range of zonal means; neighbouring zones differ at p<0.05
- parameter: Elastic modulus, reserve zone, transverse AFM microindentation
  value: '0.57'
  unit: MPa
  conditions: rabbit cranial base growth plate, en bloc, 50 um increments
  species: rabbit
  source_ref: radhakrishnan2004
  uncertainty: SD 0.05
- parameter: Elastic modulus, mineralizing zone, transverse AFM microindentation
  value: '1.41'
  unit: MPa
  conditions: same specimens and method
  species: rabbit
  source_ref: radhakrishnan2004
  uncertainty: SD 0.19
- parameter: Elastic modulus, reserve zone, longitudinal AFM indentation (anisotropy)
  value: '0.77'
  unit: MPa
  conditions: indentation along the long axis, same specimens
  species: rabbit
  source_ref: radhakrishnan2004
  uncertainty: SD 0.12; significantly different from transverse
- parameter: Elastic modulus, resting zone, sharp-tip AFM on human growth plate
  value: '130.70'
  unit: MPa
  conditions: 150 um hydrated cryosections in PBS, 9 nm tip radius, 26 N/m cantilever, 6 uN peak force, Hertz conical
    fit; phalangeal (0-5 y) and tibial (6-14 y) growth plates, 10 donors, n=3 per interface
  species: human
  source_ref: xie2025
  uncertainty: SD 36.56
- parameter: Elastic modulus, hypertrophic zone, sharp-tip AFM on human growth plate
  value: '416.20'
  unit: MPa
  conditions: same method and donors
  species: human
  source_ref: xie2025
  uncertainty: SD 107.18
- parameter: Axial stiffness of proliferative and hypertrophic zones relative to reserve zone
  value: '0.5'
  unit: fold (PZ,HZ relative to RZ)
  conditions: newborn porcine distal ulna, unconfined compression stress relaxation, transversely isotropic biphasic
    model
  species: porcine
  source_ref: sergerie2009
  uncertainty: absolute moduli not available from the abstract
- parameter: Transverse stiffness of proliferative and hypertrophic zones relative to reserve zone
  value: '0.33'
  unit: fold (about three times less stiff)
  conditions: same study
  species: porcine
  source_ref: sergerie2009
  uncertainty: as reported
- parameter: Radial permeability of proliferative and hypertrophic zones relative to reserve zone
  value: '3'
  unit: fold higher
  conditions: same study
  species: porcine
  source_ref: sergerie2009
  uncertainty: as reported
- parameter: Human capital femoral physis tensile strength relative to bovine proximal tibial physis
  value: ~0.5
  unit: fold
  conditions: 8 specimens from 2 cerebral palsy patients vs bovine controls; human specimens twice as thick
  species: human
  source_ref: williams2001
  uncertainty: n=2 patients; absolute values not in abstract
- parameter: Regional variation in bovine physeal tensile strength, lateral vs medial
  value: '+33'
  unit: '% (strength); tangent modulus +25%'
  conditions: 12-18 month heifer proximal tibia, 70 specimens, 3 strain rates
  species: bovine
  source_ref: williams2001
  uncertainty: ultimate strain not different by region
- parameter: tangent modulus by zone, tension along the growth axis
  value: resting 27.0; proliferating 14.9; hypertrophic 15.1; whole plate 17.7
  unit: MPa
  conditions: rabbit distal radius and ulna, 20 animals aged 8 weeks, epiphysis-growth plate-metaphysis complex loaded
    to failure with four dye markers tracked by video dimension analyser so strain could be resolved per zone
  species: rabbit
  source_ref: fujii2000
  uncertainty: mean +/- SE. The RESTING zone is roughly 80% stiffer than the two zones below it, and it fails at less
    than half the strain (0.043 against 0.081 and 0.096) with under half the energy absorption (32.9 against 66.2
    and 88.5 kJ/m3). So the compliant, extensible part of the plate is the proliferative-plus-hypertrophic region
    - the part that has to accommodate cell expansion.
- parameter: collagen fibre orientation by zone
  value: proliferative and hypertrophic fibres aligned parallel to the long axis; resting random
  unit: ellipse long/short axis ratio, direction relative to the bone axis
  conditions: same rabbit specimens; fibre architecture scored microscopically per zone
  species: rabbit
  source_ref: fujii2000
  uncertainty: 'p<0.01 for longitudinal alignment in proliferative and hypertrophic zones; the mean direction did
    not differ significantly between zones but the CONCENTRATION of directions did. AWKWARD FOR ANY SIMPLE FIBRE-ALIGNMENT
    ACCOUNT OF STIFFNESS: the resting zone is the least aligned and the STIFFEST in axial tension, which is the opposite
    of what aligned load-bearing fibres would predict. Whatever sets the zonal modulus here, it is not fibre alignment
    alone.'
- parameter: total collagen by zone
  value: radius 250.6, 294.5, 399.6, 332.7, 207.2; ulna 234.2, 273.8, 345.6, 267.5, 207.2
  unit: ug hydroxyproline per mg dry tissue, zones I-V epiphyseal to metaphyseal
  conditions: rabbit distal radius and ulna, same animals as the mechanical testing
  species: rabbit
  source_ref: fujii2000
  uncertainty: Collagen peaks in the middle of the plate (zone III) and falls by roughly half at the metaphyseal end
    in both bones. Note the collagen peak does not coincide with the stiffness peak, which is at the epiphyseal end.
- parameter: ultimate tensile stress, radius versus ulna in the same animals
  value: 1.05 vs 1.03
  unit: MPa
  conditions: rabbit distal radial and ulnar growth plates, 20 animals, both plates from each animal; cross-sectional
    areas 29.7 and 27.9 mm2
  species: rabbit
  source_ref: fujii2000
  uncertainty: 'NOT SIGNIFICANTLY DIFFERENT, p>0.1. THIS IS A NULL RESULT AGAINST g_l1arch_018 AND IS THE CLOSEST
    EXISTING TEST OF ITS BETWEEN-PLATE PREDICTION: two plates of different growth rate, same animals, same age - and
    no difference in axial tensile strength. It is not a direct refutation, because the quantity predicted to differ
    is the transverse-to-axial modulus RATIO and what was compared here is axial ultimate stress alone, with the modulus
    pooled across both bones. But nothing in this dataset supports the prediction either.'
- parameter: change in physeal tensile properties with age
  value: 25% thinner, 34% stronger, 65% greater failure strain in the older animals
  unit: '% change, 5-month calves to 12-18-month heifers'
  conditions: bovine proximal tibia, 21 specimens from 12-18-month and 19 from 5-month animals, four matched anatomic
    sites, tension at 0.004 mm/s
  species: bovine
  source_ref: williams2001
  uncertainty: The plate gets axially STRONGER as the animal ages and growth slows. Consistent in direction with wosu2012,
    where the transverse-to-axial modulus ratio collapses over development, but NOT the same measurement - wosu2012
    measured transverse tension and out-of-plane compression, this is axial tension - and the two should not be pooled.
- parameter: human physeal tensile strength against bovine
  value: about twice as thick and about half as strong, with similar ultimate strain
  unit: relative to bovine proximal tibia
  conditions: 8 samples from the femoral capital growth plate of two cerebral palsy patients, tested identically to
    the bovine specimens
  species: human
  source_ref: williams2001
  uncertainty: A RARE HUMAN PHYSEAL MECHANICAL MEASUREMENT and the only one this atlas holds. Two patients, both with
    cerebral palsy, so the specimens come from limbs with abnormal loading history and probably abnormal growth; capital
    femoral physis, not a long-bone metaphyseal plate. Directional only - no absolute value is quoted here because
    the sample cannot support one.
localization:
- 'rabbit proximal tibia: modulus peak in upper hypertrophic zone (eckstein2022)'
- 'rabbit cranial base: modulus increases monotonically RZ -> mineralizing zone (radhakrishnan2004)'
- 'porcine distal ulna: reserve zone stiffest (sergerie2009)'
- 'human phalangeal and tibial growth plate: RZ softer than HZ at nanoscale (xie2025)'
human_evidence: direct
human_evidence_note: One study measures modulus directly in human growth plate tissue, but at nanoscale with a sharp
  tip; no hydrated tissue-scale modulus of a human weight-bearing physis exists.
species_basis:
- rabbit
- porcine
- bovine
- human
translation_risk: high
translation_risk_reason: The only human numbers were obtained by a method whose values are 200-1000 fold above every
  animal tissue-scale measurement, so human and animal data cannot currently be reconciled or pooled.
confidence: D
