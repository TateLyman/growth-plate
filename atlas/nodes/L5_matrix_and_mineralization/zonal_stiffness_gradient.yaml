- parameter: THE ABSOLUTE HUMAN PHYSEAL TENSILE NUMBERS — FULL TEXT NOW READ
  value: ultimate stress 0.98 +/- 0.29 MPa; tangent modulus 4.16 +/- 1.22 MPa; ultimate strain 31 +/- 7 per cent;
    growth plate thickness 1.35 +/- 0.33 mm
  unit: MPa, per cent, mm
  conditions: human capital femoral physis, 8 specimens that failed through cartilage out of 40 prepared, from TWO
    cerebral palsy patients with spastic quadriplegia aged 8 and 14 (one specimen from the 8-year-old, seven from the
    14-year-old); tension at 0.003 per second, tested identically to the bovine specimens
  species: human
  source_ref: williams2001
  uncertainty: 'THE ONLY ABSOLUTE HUMAN PHYSEAL TENSILE VALUES THIS ATLAS HOLDS, and they were sitting in a PDF on
    disk while the atlas recorded "absolute values not in abstract" (CORR-035 class). Against bovine proximal tibia
    the human plate is about twice as thick, about half as strong and about half as stiff, with the SAME ultimate
    strain. THE SAMPLE IS AS BAD AS IT LOOKS: two patients, both with cerebral palsy and chronic painful hip
    dislocation, so in vivo loading history is abnormal and the authors say so; 32 of 40 specimens failed in bone
    rather than cartilage because the epiphyseal bone was riddled with cysts, so the eight analysed are a survivor
    subset; and the capital femoral physis is not a long-bone metaphyseal plate. The authors note the mean ultimate
    tensile stress is close to a published estimate of the ultimate SHEAR stress of the same physis without
    perichondrium, 0.8 MPa at age six to 1 MPa at age twelve.'
- parameter: AND THE HUMAN RESTING ZONE IS TWO TO THREE TIMES THE PROPORTION OF THE PLATE THAT BOVINE IS
  value: the reserve zone occupied 60-80 per cent of growth plate thickness in the human capital femoral physis,
    against about 30 per cent in both the 5-month and 12-18-month bovine proximal tibial growth plate
  unit: per cent of growth plate thickness
  conditions: light microscopy and scanning electron microscopy of the same specimens used for tensile testing
  species: human
  source_ref: williams2001
  uncertainty: 'RECORDED HERE BECAUSE IT IS A HUMAN RESTING-ZONE MEASUREMENT AND THIS ATLAS HAS ALMOST NONE, not
    because it is a mechanical result. If the human resting zone really is 60-80 per cent of the plate against 30 per
    cent in cattle, then the compartment this entire project treats as the limiting resource is proportionally far
    larger in humans than in the animal models the depletion literature is built on, and cross-species transfer of
    resting zone counts is worse than assumed. THE CAVEATS ARE SEVERE ENOUGH THAT THIS SHOULD NOT BE TREATED AS A
    HUMAN NORM: two cerebral palsy patients aged 8 and 14, the capital femoral physis specifically - a site whose
    architecture is atypical and which is prone to slipped epiphysis - abnormal loading, and a range rather than a
    mean with no per-specimen values. It is a flag for a question, not an established proportion.'
- parameter: Regional variation in bovine physeal tensile strength
  value: 'lateral against CENTRE: up to 40 per cent stronger (P = 0.02) and tangent modulus 34 per cent greater
    (P < 0.001). Lateral against MEDIAL: 30 per cent stronger but P = 0.08, NOT significant, and tangent modulus 25
    per cent greater (P = 0.05). No difference between centre and medial in strength (P = 0.8) or modulus (P = 0.2).
    Ultimate stress by region and rate 1.64-3.46 MPa; tangent modulus 9.53-15.78 MPa'
  unit: per cent difference and MPa
  conditions: 12-18-month heifer proximal tibia, 70 specimens, three strain rates 0.0007, 0.007 and 0.07 per second
  species: bovine
  source_ref: williams2001
  uncertainty: 'CORRECTED ON READING THE FULL TEXT. This row previously read "+33 per cent, lateral vs medial" with
    no P value, taken from the abstract. The abstract does say 33 per cent; the RESULTS say 30 per cent for that
    comparison AT P = 0.08, which is not significant. The comparison that IS significant is lateral against CENTRE
    at 40 per cent, P = 0.02. So the atlas was carrying a non-significant contrast as the headline regional effect,
    and the abstract and results disagree on its magnitude. Ultimate strain did not differ by region (P = 0.51) or
    strain rate; strength and modulus both rose with strain rate.'
- parameter: THICKER GROWTH PLATES ARE WEAKER, AND IT IS A REGRESSION NOT AN IMPRESSION
  value: ultimate stress (MPa) = 3.2 - 2.8 x growth plate thickness (mm), R-squared 0.55, P < 0.0001
  unit: MPa per mm
  conditions: all 40 specimens of the bovine age-comparison study pooled across the 5-month and 12-18-month groups,
    pooled because the regression slopes for each age group were the same
  species: bovine
  source_ref: williams2001
  uncertainty: 'A QUANTITATIVE STRUCTURE-PROPERTY RELATION THE ATLAS DID NOT HOLD, and it runs opposite to intuition -
    a thicker plate is a WEAKER one, not a more substantial one. It is the mechanical counterpart of the age result
    in the next row, where the older plate is simultaneously thinner and stronger. Limits: bovine proximal tibia only,
    thickness spans a narrow range, R-squared 0.55 leaves nearly half the variance unexplained, and the relation is
    extrapolated to zero strength at 1.14 mm which is within the range of human plate thickness measured in this same
    paper (1.35 mm) - so the linear form cannot be correct across species.'
- parameter: tangent modulus by zone, tension along the growth axis
  value: resting 27.0; proliferating 14.9; hypertrophic 15.1; whole plate 17.7
  unit: MPa
  conditions: rabbit distal radius and ulna, 20 animals aged 8 weeks, epiphysis-growth plate-metaphysis complex loaded
    to failure with four dye markers tracked by video dimension analyser so strain could be resolved per zone
  species: rabbit
  source_ref: fujii2000
  uncertainty: mean +/- SE. The RESTING zone is roughly 80% stiffer than the two zones below it, and it fails at less
    than half the strain (0.043 against 0.081 and 0.096) with under half the energy absorption (32.9 against 66.2
    and 88.5 kJ/m3). So the compliant, extensible part of the plate is the proliferative-plus-hypertrophic region
    - the part that has to accommodate cell expansion.
- parameter: collagen fibre orientation by zone
  value: proliferative and hypertrophic fibres aligned parallel to the long axis; resting random
  unit: ellipse long/short axis ratio, direction relative to the bone axis
  conditions: same rabbit specimens; fibre architecture scored microscopically per zone
  species: rabbit
  source_ref: fujii2000
  uncertainty: 'p<0.01 for longitudinal alignment in proliferative and hypertrophic zones; the mean direction did
    not differ significantly between zones but the CONCENTRATION of directions did. AWKWARD FOR ANY SIMPLE FIBRE-ALIGNMENT
    ACCOUNT OF STIFFNESS: the resting zone is the least aligned and the STIFFEST in axial tension, which is the opposite
    of what aligned load-bearing fibres would predict. Whatever sets the zonal modulus here, it is not fibre alignment
    alone.'
- parameter: total collagen by zone
  value: radius 250.6, 294.5, 399.6, 332.7, 207.2; ulna 234.2, 273.8, 345.6, 267.5, 207.2
  unit: ug hydroxyproline per mg dry tissue, zones I-V epiphyseal to metaphyseal
  conditions: rabbit distal radius and ulna, same animals as the mechanical testing
  species: rabbit
  source_ref: fujii2000
  uncertainty: Collagen peaks in the middle of the plate (zone III) and falls by roughly half at the metaphyseal end
    in both bones. Note the collagen peak does not coincide with the stiffness peak, which is at the epiphyseal end.
- parameter: ultimate tensile stress, radius versus ulna in the same animals
  value: 1.05 vs 1.03
  unit: MPa
  conditions: rabbit distal radial and ulnar growth plates, 20 animals, both plates from each animal; cross-sectional
    areas 29.7 and 27.9 mm2
  species: rabbit
  source_ref: fujii2000
  uncertainty: 'NOT SIGNIFICANTLY DIFFERENT, p>0.1. THIS IS A NULL RESULT AGAINST g_l1arch_018 AND IS THE CLOSEST
    EXISTING TEST OF ITS BETWEEN-PLATE PREDICTION: two plates of different growth rate, same animals, same age - and
    no difference in axial tensile strength. It is not a direct refutation, because the quantity predicted to differ
    is the transverse-to-axial modulus RATIO and what was compared here is axial ultimate stress alone, with the modulus
    pooled across both bones. But nothing in this dataset supports the prediction either.'
- parameter: change in physeal tensile properties with age
  value: 25% thinner, 34% stronger, 65% greater failure strain in the older animals
  unit: '% change, 5-month calves to 12-18-month heifers'
  conditions: bovine proximal tibia, 21 specimens from 12-18-month and 19 from 5-month animals, four matched anatomic
    sites, tension at 0.004 mm/s
  species: bovine
  source_ref: williams2001
  uncertainty: The plate gets axially STRONGER as the animal ages and growth slows. Consistent in direction with wosu2012,
    where the transverse-to-axial modulus ratio collapses over development, but NOT the same measurement - wosu2012
    measured transverse tension and out-of-plane compression, this is axial tension - and the two should not be pooled.
- parameter: human physeal tensile strength against bovine
  value: about twice as thick and about half as strong, with similar ultimate strain
  unit: relative to bovine proximal tibia
  conditions: 8 samples from the femoral capital growth plate of two cerebral palsy patients, tested identically to
    the bovine specimens
  species: human
  source_ref: williams2001
  uncertainty: A RARE HUMAN PHYSEAL MECHANICAL MEASUREMENT and the only one this atlas holds. Two patients, both with
    cerebral palsy, so the specimens come from limbs with abnormal loading history and probably abnormal growth; capital
    femoral physis, not a long-bone metaphyseal plate. Directional only - no absolute value is quoted here because
    the sample cannot support one.
localization:
- 'rabbit proximal tibia: modulus peak in upper hypertrophic zone (eckstein2022)'
- 'rabbit cranial base: modulus increases monotonically RZ -> mineralizing zone (radhakrishnan2004)'
- 'porcine distal ulna: reserve zone stiffest (sergerie2009)'
- 'human phalangeal and tibial growth plate: RZ softer than HZ at nanoscale (xie2025)'
human_evidence: direct
human_evidence_note: One study measures modulus directly in human growth plate tissue, but at nanoscale with a sharp
  tip; no hydrated tissue-scale modulus of a human weight-bearing physis exists.
species_basis:
- rabbit
- porcine
- bovine
- human
translation_risk: high
translation_risk_reason: The only human numbers were obtained by a method whose values are 200-1000 fold above every
  animal tissue-scale measurement, so human and animal data cannot currently be reconciled or pooled.
confidence: D
