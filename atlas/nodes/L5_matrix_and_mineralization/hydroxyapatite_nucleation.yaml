id: hydroxyapatite_nucleation
name: Hydroxyapatite nucleation and mineral maturation
aliases:
- apatite nucleation
- ACP-to-HA transformation
type: process
layer: L5
stub: false
summary: 'Growth plate mineral does not appear as hydroxyapatite. It appears as amorphous calcium phosphate
  that is transiently stabilised by inhibitory proteins and then converted to oriented apatite platelets
  on a collagen template. Cryo-TEM and cryo-tomography of collagen mineralised in the presence of nucleation
  inhibitors show the mechanism: the positive net charge near the collagen C-terminus draws ACP into the
  fibril, and clusters of charged residues in the 40 nm gap zone and the overlap zone act as nucleation
  sites that convert ACP into a parallel array of oriented crystals within the 67 nm D-period. In human
  growth plate the same sequence has been imaged directly at the growth plate-metaphysis interface, where
  extrafibrillar spherical mineral particles fuse across the interfibrillar space and permeate the fibrils,
  and where immature spherical mineral gives way to crystal platelets with distance from the front. The
  chemistry that permits this is set by the Pi:PPi ratio and by protein inhibitors: in porcine growth
  plate the extracellular Ca and P concentrations are already several-fold above the ion product needed
  for in vitro mineralization in ALL zones, so the tissue is chronically supersaturated and mineralization
  is controlled by inhibition, not by supply.'
quantitative:
