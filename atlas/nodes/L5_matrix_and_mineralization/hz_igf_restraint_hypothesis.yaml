- parameter: 'THE STC2 CLAIM TESTED AGAINST A BETTER DATASET - it FAILS, and a stronger version of the
    same hypothesis replaces it'
  value: 'STC2 H/P 0.60, prehypertrophic-peaked; PAPPA2 near-absent at 2/4 donors; but IGFBP3 H/P 3.98
    and IGFBP5 H/P 2.50 rise into hypertrophy while PAPPA falls at H/P 0.52'
  unit: median per cent of cells per zone, and hypertrophic-to-proliferative ratio
  conditions: 'Computed here from GSE288028 - 4 human pubertal donors, single-cell, zone-resolved, via
    atlas/tools/gp_expression.py - against the 2-donor GSE9160 microarray re-analysis this node was built
    on. Zone medians (stem / proliferative / prehypertrophic / hypertrophic): STC2 4.3 / 16.0 / 23.9 /
    9.5; PAPPA2 3.0 / 1.8 / 0.7 / 0.5 and detected in only 2 of 4 donors below 1.3 per cent; PAPPA 36.2 /
    31.3 / 15.8 / 16.4; IGFBP3 19.7 / 0.8 / 3.0 / 3.3; IGFBP5 26.4 / 5.5 / 13.9 / 13.8; IGF1R 38.4 / 51.5
    / 57.3 / 39.7; IGF1 11.0 / 1.7 / 5.4 / 7.9 (H/P 4.78); IGFALS 0 of 4 donors, as expected for a hepatic
    subunit.'
  species: human
  source_ref: chu2026
  uncertainty: 'THIS ROW REFUTES THE ROW ABOVE IT AND BOTH ARE KEPT. The node was built on STC2 being
    strongly hypertrophic-enriched at fold 23.3 and 12.5 in two donors on a microarray. In four donors at
    single-cell resolution STC2 PEAKS PREHYPERTROPHICALLY and is LOWER in hypertrophy than in
    proliferation (H/P 0.60). The specific claim does not replicate, and the larger, zone-resolved,
    single-cell dataset should win. PAPPA2 is worse still - 2 of 4 donors under 1.3 per cent - so the
    pappalysin that matters in this tissue is PAPP-A, and the existing human biologic (recombinant
    PAPP-A2, dauber2016) is aimed at the wrong one by expression. WHAT SURVIVES, AND ON BETTER EVIDENCE
    THAN THE ORIGINAL: the RESTRAINT DIRECTION. IGFBP3 and IGFBP5, which sequester IGF-1, rise into the
    hypertrophic zone relative to proliferative (H/P 3.98 and 2.50) while PAPPA, the protease that frees
    IGF from them, falls (H/P 0.52). More binding protein and less protease, precisely where cooper2013
    places the IGF-dependent phase 3. THE USUAL LIMIT APPLIES AND IS NOT SMALL: these are transcripts, not
    protein, not protease activity, and not a free-IGF measurement in the compartment - which remains the
    measurement nobody has made. Droplet protocols also under-recover terminal hypertrophic cells
    (chondrocyte_dissociation_bias), which biases the hypertrophic column of this table downward.'
localization:
- 'human hypertrophic zone: STC2 transcript maximal in both donors (P8-01) - NOT REPLICATED in GSE288028,
  where STC2 is prehypertrophic-peaked at H/P 0.60 (CORR-103)'
- 'human prehypertrophic zone: PAPPA2 transcript maximal in both donors (P8-01)'
human_evidence: indirect
human_evidence_note: Every component is human - the STC2 localisation, the PAPP-A2 loss-of-function phenotype,
  the free-versus-total IGF-1 dissociation - but the joining claim has never been tested in any species.
species_basis:
- human
- mouse
translation_risk: moderate
translation_risk_reason: The phase structure is mouse (cooper2013) and the STC2 localisation is human;
  the hypothesis requires both to hold in the same tissue, which nothing has shown.
confidence: D
claim_grades:
- claim: Phase 3 duration sets terminal hypertrophic cell size and is IGF-dependent.
  grade: C
  basis: cooper2013 quantitative phase microscopy, mouse, with the Igf1-deficient truncation as the internal
    control. Replicated across four plates of differing growth rate within the same study.
- claim: STC2 restrains local IGF bioavailability in the human hypertrophic zone.
  grade: X
  basis: RETRACTED, CORR-103. STC2 is PREhypertrophic-peaked in GSE288028 (4 donors, single-cell,
    zone-resolved) at H/P 0.60, not hypertrophic-enriched. The 2-donor microarray re-analysis this rested
    on does not replicate in the better dataset.
- claim: The human hypertrophic zone restrains local IGF bioavailability, by IGF-binding-protein excess
    rather than by STC2.
  grade: D
  basis: IGFBP3 H/P 3.98 and IGFBP5 H/P 2.50 rise into hypertrophy while PAPPA falls at H/P 0.52, in 4
    donors at single-cell zone resolution - more sequestration and less protease exactly where cooper2013
    places phase 3. Transcript only; no protein, no protease activity, no free-IGF measurement in the
    compartment, and droplet protocols under-recover terminal hypertrophic cells.
- claim: Relieving hypertrophic-zone IGF restraint would increase terminal cell height.
  grade: E
  basis: Untested in any species. This is the discriminating claim and the reason the node exists.
key_refs:
- ref_id: cooper2013
  type: primary
  one_line_finding: 'FULL TEXT READ 2026-08-08. Phase 1 600-2000 fL at 0.183 pg/fL; phase 2 2000-8000 fL
    diluting to 0.07 pg/fL, reproduced at 424 mOsm so not a tonicity artefact; phase 3 8000-14000 fL at the
    new low density. Phase 3 duration is what varies - radius eliminates it, jerboa metatarsal extends it
    to 23000 fL. Igf1-null cells stop at about 7000 fL with the same cell NUMBER, each 30 per cent shorter.'
- ref_id: dauber2016
  type: primary
  one_line_finding: 'Human PAPP-A2 loss of function: elevated total IGF-1, reduced FREE IGF-1, progressive
    postnatal growth failure; recombinant PAPP-A2 raises free IGF-1.'
- ref_id: gse9160
  type: dataset
  one_line_finding: 'P8-01 re-analysis: STC2 strongly hypertrophic-zone-enriched in both human donors;
    PAPPA2 prehypertrophic-maximal.'
