contradicts: >-
  Does not overturn a prior node. It COMPLETES
  round285_germline_from_conception_was_a_bad_objection_and_the_test_that_replaces_it_reopens_hedgehog and
  round286_two_of_the_six_pass_the_open_plate_test_and_both_are_secreted_antagonists_outside_the_cell by
  running their test across all seventeen genes and both directions rather than the six, and it extends
  round283_the_six_genes_whose_loss_makes_humans_taller_and_why_this_atlas_kept_missing_them by showing that
  the height-DECREASING genes were set aside without their elevation arm ever being searched.
  It also identifies a structural absence rather than a factual error: this atlas is organised by pathway and
  by matrix and has never named THE EXTRACELLULAR CONTROL OF MORPHOGEN AVAILABILITY as a layer, although
  eight of seventeen human height genes act there, both genes passing the open-plate test act there, the
  largest single effect in the table acts there, and CORR-300 independently identified it as the class where
  perturbation adds length rather than destroying zonal order.
