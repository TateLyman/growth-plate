id: round287_the_whole_table_run_and_the_layer_it_points_at_is_one_this_atlas_never_named
name: >-
  ROUND 287 - all seventeen run, both directions, graph grepped before every claim. TWO PASS, ONE FAILS, AND
  FOURTEEN HAVE NEVER BEEN GIVEN A LENGTH ENDPOINT IN THE DIRECTION THAT WOULD HELP. But the sort has a
  structure nobody put there: EIGHT OF THE SEVENTEEN ARE EXTRACELLULAR MATRIX OR SECRETED MORPHOGEN-HANDLING
  PROTEINS, both passing genes are secreted antagonists, the single largest effect in the table is the
  matrix's own proteoglycan - and this atlas has 29 nodes on that gene, every one about DEFICIENCY. THE
  EXTRACELLULAR CONTROL OF MORPHOGEN AVAILABILITY IS A LAYER THIS FILE HAS NEVER NAMED
aliases:
- round 287
- the open-plate audit
- the extracellular availability layer
- SCUBE3 is the mirror of FBN1
- nobody has ever elevated aggrecan
type: hypothesis
layer: L5
stub: false
summary: >-
  ONE - THE METHOD, BECAUSE CORR-302 MADE THE FIRST STEP MANDATORY. Round 285 declared FBN1 untested while
  this graph held the answer. So round 287 begins by grepping the atlas -
  atlas/tools/round287_open_plate_audit.py reports, for all seventeen of kosmicki2026's singleton-pLoF height
  genes plus HHIP, the signed effect size, every node that mentions the gene, and every bibliography and gap
  entry. ONLY THEN was the literature searched. The audit's own headline: NO GENE IN THE TABLE IS ABSENT
  FROM THIS GRAPH, but SEVEN appear in only one or two nodes - ANKRD11, EXT1, IGF2BP2, ADAMTS6, DTL, SCUBE3
  and NF1 - and all seven are height-DECREASING, which is CORR-295's ascertainment bias showing up inside
  the atlas's own coverage rather than in the literature.

  TWO - THE SCORECARD, COMPLETE. PASSES the open-plate test, meaning a tissue-restricted or
  postnatally-induced perturbation with a bone-LENGTH endpoint: FBN1 (+11.14 cm) and HHIP (+9.92 cm), both
  established in rounds 285-286. FAILS: LCORL (+9.99 cm), hepatic GH/IGF-1 mechanism, two mouse knockouts in
  opposite directions, not plate-enriched.
  UNTESTED IN THE HELPFUL DIRECTION - AND THIS IS NOW SEARCHED, NOT ASSUMED. CHD8 (+10.22): the entire
  Chd8 conditional literature is neurological - microglia, cortex, neurogenesis - with no skeletal readout.
  TET1 (+8.32): the only Tet1 bone papers are bone AGEING and marrow stromal metabolism and an
  osteoporosis-stemness axis; no growth-plate conditional and no length endpoint. ZFAT (+7.86) and NRK
  (+3.79): NOTHING SKELETAL AT ALL IN ANY SPECIES - for ZFAT the skeletal literature is livestock GWAS, and
  for NRK it is placenta and prostate.

  THREE - AND THE ELEVEN NEGATIVE GENES ARE NOT DISMISSIBLE, WHICH IS THE HALF I NEARLY SKIPPED. A gene that
  costs SIXTEEN AND A HALF CENTIMETRES when a single copy is lost is a gene the growth plate cares about
  enormously. The question for those is the mirror one - has the OPPOSITE manipulation, elevation above
  normal rather than restoration toward it, ever been given a length endpoint?
  ACAN, MINUS 16.55 CM, THE LARGEST EFFECT IN THE ENTIRE TABLE. This atlas holds TWENTY-NINE NODES ON ACAN
  and every one of them is about DEFICIENCY - acan_related_short_stature, acan_gene, the haploinsufficiency
  cohorts. A search for aggrecan OVEREXPRESSION with a length endpoint returns nothing, and the graph
  contains no elevation experiment of any kind. THAT IS CORR-203's TRAP IN ITS PUREST FORM: the atlas knows
  precisely what happens when you take aggrecan away and has never once asked what happens if you add it.
  The same is true, with less coverage, of ANKRD11 (one node), EXT1 (one node), IGF2BP2, ADAMTS6, DTL and
  SCUBE3.

  FOUR - SCUBE3 IS THE MIRROR IMAGE OF FBN1 AND IT HAS BEEN SITTING IN THREE LISTS UNREAD. lin2021: SCUBE3
  loss-of-function causes a recognisable recessive developmental disorder with short stature THROUGH
  DEFECTIVE BONE MORPHOGENETIC PROTEIN SIGNALLING. SCUBE3 IS A SECRETED PROTEIN THAT MODULATES A MORPHOGEN.
  So is fibrillin-1. Fibrillin-1 SEQUESTERS TGF-beta and its loss LENGTHENS bone; SCUBE3 PRESENTS BMP and its
  loss SHORTENS it. Two secreted morphogen-handlers, opposite morphogens, opposite signs, both large. NOBODY
  HAS EVER GIVEN RECOMBINANT SCUBE3 TO ANYTHING AND MEASURED A BONE - and it is a secreted protein, which is
  the one target class that can be supplied rather than inhibited.

  FIVE - AND EXT1 TIES THE TWO PASSING GENES TOGETHER THROUGH A THIRD MECHANISM. EXT1, minus 8.70 cm,
  synthesises heparan sulfate, and heparan sulfate is what shapes the DIFFUSION GRADIENTS of Ihh, BMP and
  FGF through cartilage matrix. Its loss causes hereditary multiple exostoses - and the 2025-2026 literature
  places the origin of those lesions in the PERICHONDRIUM, driven by an ECTOPIC HEDGEHOG SIGNALLING AXIS.
  THAT IS THE SAME TISSUE sedes2022 IDENTIFIED FOR FBN1 AND THE SAME PATHWAY haraguchi2025 MOVED THROUGH
  HHIP. Three of the biggest genes in the table converge on one compartment and one class of mechanism, and
  they were found by three unrelated literatures that do not cite each other.

  SIX - SO NAME THE LAYER, BECAUSE THIS FILE NEVER HAS. The atlas is organised by pathway (L3) and by matrix
  (L5), and it has no node, no layer and no phrase for THE EXTRACELLULAR CONTROL OF MORPHOGEN AVAILABILITY -
  the sequestration, presentation, diffusion-shaping and clearance of signals in the space between cells,
  before any receptor is engaged. Yet: EIGHT OF THE SEVENTEEN height genes are extracellular matrix or
  secreted proteins by kosmicki2026's own annotation; the TWO that pass the open-plate test are both secreted
  antagonists; the LARGEST single effect is the matrix's own proteoglycan; and CORR-300 independently derived
  that this is the class where perturbation ADDS length while intracellular perturbation destroys zonal
  order and subtracts it.
  AND THE ATLAS'S OWN DERIVED COMPOUND ALREADY LIVES THERE. An NPR3-selective clearance-receptor blocker is
  an extracellular-availability intervention: it adds no ligand and touches no intracellular component, it
  changes how much of a signal the plate already makes reaches its receptor. So does osteocrin. So does
  neprilysin inhibition by sacubitril. THREE INDEPENDENT LINES OF THIS FILE HAVE CONVERGED ON ONE LAYER
  WITHOUT ANYONE SAYING SO.

  SEVEN - WHAT THIS DOES AND DOES NOT DELIVER. It does not deliver a compound. Of the eighteen genes, exactly
  ZERO have an agent with a bone-length endpoint in a normal animal pointed in the helpful direction. What it
  delivers is a RANKED AND STRUCTURED TARGET LAYER where before there was a list, and four specific
  experiments that do not exist and are individually cheap: give recombinant SCUBE3 and measure a bone; raise
  aggrecan above normal and measure a bone; delete Hhip1 with a TAMOXIFEN-INDUCIBLE driver in a juvenile and
  measure a bone; and put a caliper on the femur of a wild-type mouse given losartan, which chen2015 already
  dosed and never measured.
quantitative:
- parameter: >-
    THE COMPLETE OPEN-PLATE SCORECARD FOR ALL SEVENTEEN, BOTH DIRECTIONS
  value: >-
    PASSES (tissue-restricted or postnatal perturbation, length endpoint): FBN1 +11.14, HHIP +9.92.
    FAILS: LCORL +9.99 (hepatic GH/IGF-1, opposite-sign knockouts, not plate-enriched).
    UNTESTED, HEIGHT-INCREASING: CHD8 +10.22 (conditional literature entirely neurological), TET1 +8.32 (bone
    papers are ageing and marrow stromal metabolism only), ZFAT +7.86 (nothing skeletal in any species), NRK
    +3.79 (nothing skeletal in any species).
    UNTESTED IN THE ELEVATION DIRECTION, HEIGHT-DECREASING: ACAN -16.55, ANKRD11 -11.16, COL1A1 -10.36, EXT1
    -8.70, IGF2BP2 -8.68, ADAMTS6 -8.40, ADAMTS10 -8.24, IGF1R -8.23, DTL -7.34, SCUBE3 -7.18, NF1 -5.55.
    ATLAS COVERAGE: no gene is absent from the graph, but SEVEN appear in only one or two nodes - ANKRD11,
    EXT1, IGF2BP2, ADAMTS6, DTL, SCUBE3, NF1 - and ALL SEVEN are height-decreasing
  unit: pass / fail / untested, with signed effect size
  conditions: >-
    atlas/tools/round287_open_plate_audit.py for the graph-coverage half, run before any literature search
    per CORR-302; Europe PMC searches this round for the literature half. Output at atlas/data/round287/.
  species: human
  source_ref: kosmicki2026
  uncertainty: >-
    "UNTESTED" IS A STATEMENT ABOUT THE RECORD SEARCHED, NOT A PROOF OF ABSENCE - though for ZFAT and NRK the
    skeletal literature is empty enough to read in full. The elevation arm for the negative genes is a harder
    search than the loss arm because overexpression studies are scattered and often report mass or
    differentiation rather than length. And a PASS here means the gene is still doing work while the plate is
    open, NOT that an agent started at bone age 16 would work; neither passing gene has pharmacology in any
    species.
- parameter: >-
    THE LARGEST EFFECT IN THE TABLE HAS TWENTY-NINE ATLAS NODES AND NOT ONE ELEVATION EXPERIMENT
  value: >-
    ACAN at -16.55 cm per allele is the biggest single effect among 1.45 million exomes. This atlas holds 29
    nodes mentioning ACAN, 17 bibliography entries and 30 gap references - and a search of both the graph and
    the literature for aggrecan OVEREXPRESSION or elevation with a bone-length endpoint returns NOTHING. Every
    piece of ACAN evidence in this file concerns DEFICIENCY: haploinsufficiency cohorts, short stature with
    advanced bone age, early growth cessation
  unit: presence or absence of an elevation experiment
  conditions: >-
    Graph audit plus Europe PMC. The distinction is CORR-203's - restoration toward normal in a deficient
    animal is a claim about the deficit; elevation above normal in a normal animal is the claim that matters
    for this case.
  species: human
  source_ref: kosmicki2026
  uncertainty: >-
    THERE MAY BE GOOD REASONS NOBODY HAS RAISED AGGRECAN. It is an enormous, heavily glycosylated
    proteoglycan whose synthesis is rate-limited by glycosaminoglycan chain assembly rather than by
    transcript level, so "overexpress ACAN" may not be a physically available manipulation, and matrix
    stoichiometry may not tolerate it. The absence of the experiment is not evidence that it would work. What
    it IS is evidence that the atlas has spent 29 nodes on one side of a two-sided question.
- parameter: >-
    SCUBE3 - A SECRETED MORPHOGEN MODULATOR WHOSE LOSS SHORTENS, WHICH IS FBN1's MIRROR
  value: >-
    SCUBE3 loss-of-function causes a recognisable recessive developmental disorder with SHORT STATURE, and
    the mechanism given is DEFECTIVE BONE MORPHOGENETIC PROTEIN SIGNALLING. Human singleton pLoF: -7.18 cm
    per allele (49 carriers, P = 7.08x10^-13). Against FBN1, a secreted matrix protein that SEQUESTERS
    TGF-beta and whose loss LENGTHENS bone by about 7 per cent in mouse and +11.14 cm per allele in human.
    Two secreted morphogen-handlers, opposite morphogens, opposite signs. SCUBE3 appears in this atlas only
    as a name inside three lists
  unit: cm per allele; mechanism class
  conditions: lin2021 for the syndrome and the BMP mechanism; kosmicki2026 for the effect size.
  species: human
  source_ref: lin2021
  uncertainty: >-
    NO GAIN EXPERIMENT EXISTS. Nobody has given recombinant SCUBE3 to any animal and measured a bone, so the
    inference that raising it would lengthen is a sign-flip and nothing more - and this file has been burned
    by sign-flips on bounded axes four times (hedgehog, oestrogen receptors, DNA methylation, canonical Wnt).
    BMP in cartilage is itself dose-bounded. What makes SCUBE3 worth naming is not the inference but the
    tractability: it is a SECRETED protein, so the gain direction is a protein you could supply rather than a
    target you must inhibit.
- parameter: >-
    ADAMTS6 AND ADAMTS10 - THE TOOL FOR THE OPEN-PLATE TEST IS ALREADY BUILT AND HAS NOT BEEN POINTED AT BONE
  value: >-
    Combined ADAMTS10 and ADAMTS17 inactivation EXACERBATES BONE SHORTENING and skin phenotypes - two
    secreted proteases of the fibrillin microfibril network acting additively on length. Human singleton
    pLoF: ADAMTS6 -8.40 cm (27 carriers), ADAMTS10 -8.24 cm (27 carriers). AND A CONDITIONAL Adamts6 MOUSE
    ALLELE NOW EXISTS - generated in 2025 and used to show roles in lung maturation, with no skeletal
    readout taken
  unit: cm per allele; availability of a conditional allele
  conditions: taye2025 for the combined inactivation; sirek2025 for the conditional allele; kosmicki2026 for
    the human effect sizes.
  species: mouse
  source_ref: taye2025
  uncertainty: >-
    BOTH GENES ARE ON THE LOSS-SHORTENS SIDE, so the open-plate test for them is the ELEVATION arm and a
    conditional deletion cannot answer it - what the existing allele buys is the ability to ask WHEN and
    WHERE the loss acts, which bounds the window rather than finding a lever. ADAMTS proteases also act on
    fibrillin, the protein whose loss LENGTHENS bone, so the network's internal signs are not yet consistent
    and should not be assumed to be.
localization:
- 'the extracellular space of cartilage and perichondrium: where 8 of the 17 human height genes act, and
  where both genes that pass the open-plate test act'
- 'outer perichondrium: FBN1 (sedes2022) and the origin of EXT1-driven exostoses converge here'
human_evidence: direct
human_evidence_note: >-
  All effect sizes are human, from 826,066 discovery exomes with replication in 624,567. The pass/fail
  evidence is mouse and the elevation arm does not exist in any species.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  Zero of the eighteen genes has an agent with a bone-length endpoint in a normal animal pointed in the
  helpful direction. The layer this round names is a target class, not a therapy.
confidence: B
confidence_reason: >-
  The scorecard is a factual audit of a defined gene set against a searched literature and a grepped graph,
  and its negative entries are the most reliable part. The synthesis - that the extracellular
  morphogen-availability layer is where the human height genetics concentrates and where CORR-300 says
  perturbation adds rather than subtracts length - is an interpretation over eight genes and two independent
  derivations, held at B rather than A because no intervention in that layer has yet been shown to lengthen a
  normal animal's bone.
claim_grades:
- claim: >-
    CHD8, TET1, ZFAT and NRK have been tested for a tissue-restricted or postnatal effect on bone length.
  grade: X
  basis: >-
    NONE HAS, AND THIS IS NOW SEARCHED RATHER THAN ASSUMED. The Chd8 conditional literature is entirely
    neurological. Tet1's bone papers are bone ageing, marrow stromal metabolism and an osteoporosis-stemness
    axis - no growth-plate conditional, no length endpoint. ZFAT's skeletal literature is livestock GWAS and
    NRK's is placenta and prostate; neither has a skeletal experiment of any kind in any species.
- claim: >-
    The height-DECREASING genes are not levers and can be set aside.
  grade: X
  basis: >-
    NO. A gene that costs 16.55 cm when one copy is lost is a gene the plate depends on heavily, and the
    question for that class is elevation rather than loss. For ACAN specifically this atlas holds 29 nodes,
    17 bibliography entries and 30 gap references, EVERY ONE ABOUT DEFICIENCY, and neither the graph nor the
    literature contains an aggrecan elevation experiment with a length endpoint. That is CORR-203's
    restoration-versus-elevation distinction unexamined on the largest number in the table.
- claim: >-
    The extracellular control of morphogen availability is a distinct functional layer and it is where the
    human height genetics concentrates.
  grade: B
  basis: >-
    EIGHT OF SEVENTEEN genes are ECM or secreted proteins by kosmicki2026's own annotation. BOTH genes that
    pass the open-plate test are secreted antagonists - FBN1 sequestering TGF-beta, HHIP binding Ihh. The
    LARGEST single effect is ACAN, the matrix's own proteoglycan. EXT1 makes the heparan sulfate that shapes
    Ihh, BMP and FGF gradients, and its lesions arise from the PERICHONDRIUM through ectopic hedgehog - the
    same tissue as FBN1 and the same pathway as HHIP. SCUBE3 is a secreted BMP modulator. CORR-300 reached
    the same class from a different direction entirely. THIS ATLAS HAS NO NODE, LAYER OR PHRASE FOR IT.
- claim: >-
    An intervention in the extracellular availability layer has been shown to lengthen a normal animal's bone.
  grade: E
  basis: >-
    NOT ONCE, ACROSS ALL EIGHTEEN GENES. The nearest things this file holds are watanabetakano2021's
    periosteal osteocrin, which elongates long bones by occupying NPR3 as a decoy - an
    extracellular-availability mechanism, and the reason the NPR3 route should be re-ranked upward - and
    haraguchi2025's genetic Hhip1 deletion. Neither is a pharmacological agent given to a normal animal.
- claim: >-
    Recombinant SCUBE3 would lengthen bone.
  grade: E
  basis: >-
    A SIGN-FLIP AND NOTHING MORE, AND THIS FILE HAS BEEN BURNED BY SIGN-FLIPS ON BOUNDED AXES FOUR TIMES.
    What is solid is that SCUBE3 loss causes short stature through defective BMP signalling, that the human
    effect is -7.18 cm per allele, and that SCUBE3 is SECRETED - so unlike every other gene in the table
    except osteocrin, the gain direction is a protein that could be supplied rather than a target that must
    be inhibited. That tractability is the reason to name it, not the inference.
