translation_risk_reason: Chick electron-probe zonal ion content, rat trace-element depletion and broiler-strain
  morphometry are three unrelated species and designs. What transfers is the QUESTION each answers, not the effect
  size.
summary: 'FOUR MEASUREMENTS FROM AGRICULTURAL AND VETERINARY SCIENCE, NONE OF WHICH WAS TRYING TO MAKE ANYTHING
  TALLER.


  ONE - THE INORGANIC HALF OF THE OSMOTIC BUDGET WAS MEASURED IN 1985 AND ONLY EVER CITED FOR MINERALISATION. hargest1985
  ran quantitative electron probe analysis on chick epiphyseal growth cartilage in two independent anhydrous preparations
  across four zones: matrix sodium up to 550 and potassium up to 200 mmol per kg wet weight, believed largely bound
  to fixed anions; matrix sulfur about 400 mmol per kg wet weight rising slightly with maturation; and WITHIN THE
  CELLS SODIUM EXCEEDED POTASSIUM at 140 against 20 to 34 mmol per kg wet weight, which the authors suggest may
  reflect hypoxia. R440 recorded that 93 per cent of the osmotic drive for hypertrophy is unaccounted for on farnum2002''s
  ORGANIC osmolyte panel. This is the INORGANIC half of the same budget in the same tissue class, measured forty
  years earlier, and the two have never been summed. It is also the closest thing to a zone-resolved fixed-charge-density
  readout that exists in a growth plate, which the fixed_charge_density node states does not exist in any species.
  Chick, and an electron-probe cell-versus-matrix partition is not a free-solute measurement - but a cell whose
  intracellular sodium exceeds its potassium is not in ordinary ionic homeostasis and nobody has asked what that
  means for its volume.


  TWO - A DIETARY SUBTRACTION THAT LENGTHENS BONE IN A NORMAL ANIMAL. jugdaohsingh2008, titled increased longitudinal
  growth in rats on a silicon-depleted diet: 21-day-old female Sprague-Dawley rats, 20 depleted against 10 supplemented,
  26 weeks, a 24-fold intake difference with serum and urinary silicon confirming exposure at P=0.03 and 0.004.
  Removing a trace element made normal animals LONGER. Female, one species, and the classical deficiency direction
  is the opposite - silicon-deficient chicks have shorter leg bones of smaller circumference through reduced collagen
  AND glycosaminoglycan synthesis, a MATRIX lesion. Two directions, two species, opposite signs: a band and not
  an arrow.


  THREE - THE MOST INSTRUCTIVE NEGATIVE, AND IT IS LARGE. santos2022 compared 14 broiler strains and 7,216 birds
  at two MATCHED target weights so size is held constant. The conventional fastest-growing birds had the NARROWEST
  AND SHORTEST TIBIAE at 2.1 kg (P<0.001) and the SHORTEST TIBIAE at 3.2 kg (P<0.001). Sixty years of the most intense
  artificial selection ever applied to a vertebrate''s growth RATE produced a bird that reaches weight sooner with
  a WORSE bone. That is R360''s Regime 2 in an agricultural population - raising throughput reaches the terminus
  sooner and does not add length - reached from poultry science at n=7,216 by people not asking the question. And
  the companion gap is large and cheap: NOBODY HAS COMPARED THE GROWTH-PLATE CELLULAR ARCHITECTURE OF FAST- VERSUS
  SLOW-GROWING BROILER LINES. The endpoint is always whole-bone morphometry; chondrocyte number, terminal cell size,
  cells per column and matrix per cell have never been measured between lines, in the one vertebrate where growth
  rate has been driven to its extreme under controlled husbandry with tissue available by the thousand.


  FOUR - R412''s EXPLICIT OPEN QUESTION ABOUT ARSI IS ANSWERED AND IT QUALIFIES R410. R412 found ARSI the steepest
  riser in the hypertrophic programme, roughly 300-fold from reserve to hypertrophic zone, and recorded that whether
  it acts on chondroitin was unestablished. greccomachado2026 identifies ARSI as a novel LYSOSOMAL CHONDROITIN ENDOSULFATASE
  desulfating chondroitin-4-sulfate at pH 4.5, reports that proteoglycan sulfation significantly DECREASES during
  cartilage maturation, and that Arsi knockout raises Col10a1 and Mmp13. R410 concluded the plate is built to ADD
  charge and not remove it, from ARSB, SULF1 and SULF2 all being contaminant-leaning - ARSI was not in that panel
  and is the exception. The direction is favourable for the sulfate arm: if proteoglycan sulfation falls through
  maturation and ARSI is what removes it, the fixed charge driving hypertrophic swelling is being actively stripped
  in the zone that makes height, and inhibiting ARSI is a route to raising it requiring no substrate at all. No
  ARSI inhibitor exists in any species, there is no bone-length endpoint, and whether desulfation at pH 4.5 inside
  a lysosome affects EXTRACELLULAR matrix charge at all is unestablished.'
