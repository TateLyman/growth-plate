human_evidence: indirect
human_evidence_note: The human components are a burden module in kosmicki2026 (DTL, TLK1, XRN2, RFC1, PCNA shortening;
  HLTF lengthening at +1.47 cm, P=1.06e-10), the Meier-Gorlin phenotype, the Golgi-assembly disease genes with length
  endpoints (CANT1, IMPAD1, XYLT1, FAM20B, TMEM165), and purity-corrected expression in twelve postnatal human growth
  plates. Every mechanistic measurement - crowding, density, Golgi kinetics, PAPS transport - is animal or cell-line.
translation_risk: high
translation_risk_reason: The crowding set-point literature is dog red cell and cultured fibroblast; the Golgi kinetics
  are chick chondrocyte and rat chondrosarcoma; the one elevation experiment is canine kidney epithelium; the duration
  levers are insect, fish and cultured stem cells. Not one of them has a bone-length endpoint in the direction of interest.
summary: "Three inverse searches were run in parallel on terms R437 named as zero-coverage processes. They return one\
  \ coherent picture and several corrections, including two against this file's own framing.\n\nPART ONE - THE HYPERTROPHIC\
  \ CHONDROCYTE BREAKS A SET POINT EVERY OTHER ANIMAL CELL DEFENDS.\n  - THE PRINCIPLE WAS SETTLED IN 1992 AND HAS NEVER\
  \ BEEN APPLIED TO CARTILAGE. colclasure1992: resealed dog red-cell ghosts with the same membrane area and the same\
  \ haemoglobin concentration but under a THIRD the volume activate swelling-induced K-Cl cotransport at about 20 fL\
  \ versus 70 fL in intact cells - a 3.5-fold difference in the putative volume signal - BUT AT THE SAME 30-35 g DRY\
  \ SOLIDS PER 100 g WET WEIGHT. Albumin-loaded ghosts activate at the same solids concentration. The same holds for\
  \ shrinkage-activated Na/H exchange. CELLS DEFEND CYTOSOLIC MACROMOLECULE CONCENTRATION, NOT VOLUME.\n  - THE SENSOR\
  \ WAS FOUND IN 2022 AND THE EXPERIMENT DISCRIMINATES. boydshiwarski2022: WNK1 condenses within seconds of osmotic challenge\
  \ and drives regulatory volume increase - and injecting Ficoll, which RAISES CROWDING WHILE MAKING THE CELL BIGGER,\
  \ TRIGGERS CONDENSATES where vehicle disperses them. Crowding, not size.\n  - THE NUMBERS PUT THE CHONDROCYTE OFF THE\
  \ SCALE. An ordinary mammalian cell defends about 208 fg per cubic micrometre and grinds back to it monotonically over\
  \ 48 h after a shock (fu2025cmd); Xenopus egg cytoplasm is about 100. cooper2013 gives phase-1 chondrocytes at 183\
  \ - ordinary - and TERMINAL HYPERTROPHIC CHONDROCYTES AT ABOUT 70, a third of the set point and below a Xenopus egg,\
  \ AND IT DOES NOT COME BACK.\n  - AND IT IS INDEPENDENTLY CONFIRMED 27 YEARS EARLIER BY A DIFFERENT METHOD. buckwalter1986,\
  \ mouse tibial growth plate, EM stereology by zone: organelle volume per cell rose 126 per cent while cytoplasm plus\
  \ nucleoplasm rose 779 per cent, apparently by accumulation of water - an organelle volume-fraction fall of about 3.89-fold\
  \ against cooper2013's 2.61-fold dry-mass fall. NEITHER PAPER CITES THE OTHER AND NEITHER USES THE WORD CROWDING.\n\
  \  - ⛔ CORRECTION TO R437's PREMISE, MADE AGAINST THIS FILE: hall2001 DOES NOT DEMONSTRATE A CROWDING SET POINT. Equal\
  \ terminal volume at 180, 280 and 380 mOsm demonstrates a defended VOLUME; it becomes a defended CROWDING only if dry\
  \ mass is also constant, and dry mass was not measured. The observation is consistent with both hypotheses. The experiment\
  \ that separates them - hall2001's chronic-adaptation design read out with cooper2013's quantitative phase microscopy\
  \ - has not been done IN ANY CELL TYPE.\n  - ⭐ AND THE INTERESTING QUESTION INVERTS. If the hypertrophic chondrocyte\
  \ dilutes 2.6 to 3.9-fold and does not correct, the question is not how it senses crowding but HOW IT SWITCHES THE\
  \ DEFENCE OFF. Nobody has asked it. Measured negative: 'macromolecular crowding' with growth plate, bone growth, longitudinal\
  \ growth or chondrocyte returns ONE PubMed record and it is extracellular Ficoll in culture medium. No crowding probe\
  \ - GEMs, FRET sensor, Brillouin, quantitative phase as an intracellular readout - has ever been used in a chondrocyte.\n\
  \  - ⚠ COLLISION WITH THIS ATLAS'S OWN LOCALISATION: the characterised sensor is WNK1 to SPAK/OSR1, and R408/R411 find\
  \ the human plate concentrates WNK4 at 3.19-4.04x while WNK1 (0.49), WNK2 (0.23), SPAK (0.29-0.30) and OSR1 (0.30)\
  \ are all contaminant-leaning. Whether WNK4 phase-separates on crowding has never been tested.\n\nPART TWO - THE MATRIX\
  \ TERM'S GOLGI MODULE IS FAST, AND WHAT LIMITS IT IS SUPPLY.\nCORR-361 made matrix synthesis 32 per cent of elongation\
  \ in a fast plate and 49 per cent in a slow one, and this file had never worked it. The kinetics, all in chondrocytes\
  \ or chondrocyte-derived cells: the aggrecan CORE PROTEIN clears the rough ER and the Golgi region with half-times\
  \ UNDER TEN MINUTES EACH while type II collagen is 3 to 4 times slower (campbell1988); linkage galactoses and chain\
  \ glucuronic acid label with half-times of 5 to 8 minutes; sulfation is not a separate downstream step, since 30 seconds\
  \ of microsomal polymerisation already gives chains 20-25 per cent sulfated. BUT THE CORE PROTEIN PRECURSOR HAS AN\
  \ INTRACELLULAR HALF-LIFE OF 45 TO 90 MINUTES AND CYCLOHEXIMIDE TAKES 79 MINUTES TO STOP SULPHATE INCORPORATION, because\
  \ there is a large pool of core protein sitting UN-GLYCANATED.\n  ⭐ SO THE GLYCANATION-AND-SULFATION MODULE RUNS IN\
  \ ABOUT TEN MINUTES AND THE CORE PROTEIN WAITS ABOUT AN HOUR TO ENTER IT. The bottleneck is upstream of the enzymes,\
  \ and two independent perturbations name it:\n  - ACCEPTOR. mitchell1982: 50 micromolar xyloside RAISED TOTAL CHONDROITIN\
  \ SULFATE SYNTHESIS 60 TO 80 PER CENT while cutting incorporation into proteoglycan by 70 per cent, with cooling lengthening\
  \ chains on endogenous core but NOT on xyloside. The elongation machinery has spare capacity; what it lacks is primed\
  \ core. ✗ As a lever it is the wrong shape - the product is free GAG chains, not aggrecan.\n  - DONOR. dick2008papst:\
  \ overexpressing the Golgi PAPS transporter PAPST1/SLC35B2 raised Golgi-vesicle PAPS uptake about threefold and APICAL\
  \ CSPG SULFATION SEVERAL-FOLD, with HSPG essentially unchanged, the authors concluding CSPG sulfation occurs at SUBOPTIMAL\
  \ conditions. ⭐ THIS IS AN ELEVATION EXPERIMENT IN AN UNSTRESSED CELL AND IT WORKED - the clearest demonstration anywhere\
  \ that a Golgi step is rate-limiting and can be RAISED. ✗ Canine kidney epithelium, route-specific, no bone endpoint,\
  \ and nobody has done it in a chondrocyte.\n  ⚠ AND CANT1 BOUNDS IT FROM INSIDE: when CANT1 is lost, UDP accumulates,\
  \ glycosyltransferases are product-inhibited, chains get SHORTER - and SULFATION GOES UP, because a fixed PAPS supply\
  \ is spread over less polymer. PAPS becomes limiting only when polymer flux is high.\n  ⛔ AND EXPANDING THE ORGANELLE\
  \ IS NOT THE PLATE'S OWN STRATEGY. hunziker1999organelle did exactly the right experiment - rat tibial growth plate\
  \ in vivo at 21, 35 and 80 days, stereology of rough ER, GOLGI and mitochondrial surface area and volume WITH matrix\
  \ synthesis measured in the same animals - and concluded that MODULATIONS IN THE LEVEL OF ACTIVITY PREDOMINATE OVER\
  \ ALTERATIONS IN THE SURFACE AREA OR VOLUME OF THEIR MEMBRANES. That argues against build-a-bigger-Golgi and for supply-the-substrate.\
  \ THE PAPER IS PAYWALLED AND ITS INDIVIDUAL VALUES ARE NOT RETRIEVED - it is the highest-value missing document in\
  \ this round.\n  ⚠ AND THERE IS A TRADE-OFF AGAINST SPEED: the extent of glycan modification is set by GOLGI RESIDENCE\
  \ TIME rather than enzyme levels, so faster transit predicts SHORTER or LESS SULFATED chains - and R448's Donnan exponent\
  \ (dlnPi/dlnFCD = 1.73) makes fixed charge a LEVERAGED parameter, so that trade is not obviously favourable.\n  ⛔ DIRECTION\
  \ STATUS: the Golgi-throughput axis has real LENGTH endpoints in humans and mice, and ALL OF THEM ARE LOSS-OF-FUNCTION\
  \ - CANT1, IMPAD1, XYLT1, FAM20B (birth length about -7 SD), TMEM165, SLC35D1, TRIP11, MIA3. NOBODY HAS RUN THE ELEVATION\
  \ DIRECTION WITH A LENGTH ENDPOINT IN ANY SPECIES. And the rate of aggrecan output per cell has no unit and no number\
  \ anywhere in the literature.\n\nPART THREE - THE DURATION LEVERS, AND THEY DO NOT TRANSFER.\n  - THE INSECT RESULT\
  \ IS THE CLEANEST DEMONSTRATION IN BIOLOGY THAT DURATION ALONE BUYS SIZE, AND IT IS THE WRONG ARCHITECTURE. mcbrayer2007:\
  \ ablating the four PTTH neurons in Drosophila gives delayed development and LARGER FLIES WITH MORE CELLS, and the\
  \ authors state the mechanism - PROLONGED FEEDING WITHOUT CHANGING THE RATE OF GROWTH. Bidirectional (PTTH overexpression\
  \ gives small flies) and reversed by feeding ecdysone; replicated in a hemimetabolous insect with a FEMUR endpoint\
  \ (luo2024ptth). ⛔ WHY IT DOES NOT TRANSFER: the insect grows by FEEDING, in a soft cuticle, with no growth plate and\
  \ no progenitor pool being spent, whereas the mammalian period is limited by resting-zone exhaustion counted in divisions.\
  \ The mammalian equivalent - removing the terminal steroid - IS THE ARM THE STACK ALREADY OCCUPIES, and R440 priced\
  \ it at 0.3 to 0.4 cm of adult height per extra year of growth period from two independent instruments, with compensation\
  \ about 95 per cent complete. The insect has no compensating mechanism because it has no counter to compensate against.\n\
  \  - DEVELOPMENTAL TEMPO IS NOT A SIZE DIAL, AND THIS IS NOW AN EXPERIMENTAL RESULT RATHER THAN AN ABSENCE. lazaro2023\
  \ measured segmentation-clock period in iPSC-derived presomitic mesoderm from SIX MAMMALS INCLUDING A RHINOCEROS AND\
  \ A MARMOSET - about a thousandfold in adult mass - and the periods DID NOT SCALE WITH BODY WEIGHT BUT WITH EMBRYOGENESIS\
  \ LENGTH. seleit2024 then ran the causal test: hybridising two Oryzias species and quantifying about 600 F2 embryos\
  \ DECOUPLES TIMING FROM SIZE CONTROL while spatial scaling is preserved, with DISTINCT devQTL loci for timing and for\
  \ tissue size. And harima2013's mechanism makes bigger UNITS, not a bigger animal - a faster clock gives MORE somites,\
  \ with total axial length not reported. NOBODY HAS SLOWED A TEMPO AND PRODUCED A LARGER STRUCTURE.\n  - SUSPENSION\
  \ PRESERVES THE PROGRAMME AND ADDS NOTHING. Roe-deer embryonic diapause is slowed rather than stopped, with the blastocyst\
  \ proliferating throughout; C. elegans dauer decelerates and even reverses a transcriptomic age clock and exits with\
  \ normal lifespan and fully retained fecundity - AND NO REPORT OF A LARGER POST-DAUER OR POST-DIAPAUSE ADULT EXISTS.\
  \ That is the single most important negative for pause-the-clock.\n  - AND THE REPLICATION MODULE IS A RATE TERM, NOT\
  \ THE COUNTER. Twelve genes reach the 207 and this atlas had never named them as a module: DTL -4.67 cm (P=1.11e-26,\
  \ best-powered row P=2.10e-39), TLK1 -4.66, XRN2 -2.97, RFC1 -1.91, PCNA -1.56 - and ONE BRAKE, HLTF at +1.47 cm (P=1.06e-10,\
  \ 957 carriers, monotone), which is a replication-FORK-REVERSAL translocase, a fact this file has cited HLTF for four\
  \ rounds without noticing. Mouse concords on Dtl, Tyms, Orc4, Slc29a1 and Uhrf2, and Hltf runs the RARE positive direction\
  \ (+0.058, P=1.08e-07) against a base rate of 64.1 per cent negative. ⛔ BUT THE DECISIVE HUMAN TEST ARGUES AGAINST\
  \ THE COUNTER: Meier-Gorlin syndrome is biallelic hypomorphic pre-replication-complex mutation, i.e. reduced licensing\
  \ capacity from conception - median height Z about -4.4 AND 70 PER CENT WITH DELAYED BONE AGE. If licensing were the\
  \ division budget, a licensing-deficient plate should exhaust EARLY with ADVANCED maturation. It is short with the\
  \ clock running SLOW. ⚠ CORR-203 and CORR-299 both govern, and delayed bone age is equally consistent with the whole\
  \ organism running slow - which is the weak joint and is recorded as one.\n  ⭐ WHAT SURVIVES AS LEVER-SHAPED IS THE\
  \ NUCLEOTIDE SUPPLY ARM, AND IT IS THE SAME SHAPE AS THE GOLGI ARM. In the purity-corrected human plate the chondrocyte\
  \ CONCENTRATES NUCLEOTIDE SUPPLY AND DOES NOT CONCENTRATE REPLICATION MACHINERY - IMPDH2 6.77x, APRT 5.70, NME2 5.44,\
  \ SHMT2 5.10, PCNA 4.18, TYMS 3.36, SLC29A1 2.69 at 259 CPM, against ORC1 0.30, ORC2 0.28, MCM9 0.10, POLA1 0.09, RRM2\
  \ 0.52. ⚠ CORR-363 GOVERNS AND IS APPLIED AGAINST THIS ROUND: the screen is structurally blind to universal machinery,\
  \ so the low replisome ratios are NOT a kill - what survives is the INTERNAL CONTRAST between two equally universal\
  \ modules scored against one comparator, which is R444's logic. Three things make the supply arm more than an expression\
  \ pattern: Slc29a1-null gives the largest length effect in the module (body -3.470 at P near zero, tibia -2.604 at\
  \ P=2.38e-05); Tyms-het shortens on two independent parameters; and HUMANS WHO CANNOT HANDLE PURINES GET A GROWTH-PLATE\
  \ LESION - ADA-SCID produces costochondral cupping specific enough to distinguish it radiographically from other SCIDs,\
  \ with the mechanism worked out in rabbit growth plate as selective toxicity of deoxyadenosine to IMMATURE cartilage.\
  \ ✗ SAMHD1 runs the wrong way for the simple story (-1.00 cm at P=5.46e-21 for a gene that DEGRADES dNTPs), with an\
  \ interferonopathy confound as the available and convenient defence. ✗ And no nucleotide supplementation study has\
  \ a bone-length endpoint in any species.\n\nTHREE FIELD-LEVEL NEGATIVES WORTH RECORDING SO NOBODY RE-DERIVES THEM:\
  \ no mitotic clock (epiTOC, MiAge, stemTOC) has ever been run on cartilage or bone; no dNTP pool, gamma-H2AX zone map\
  \ or 53BP1 body has ever been measured in a chondrocyte; and NO INTERVENTION ANYWHERE, IN ANY TISSUE OR SPECIES, HAS\
  \ CONVERTED EXTRA STEM-CELL DIVISIONS INTO A TISSUE DIMENSION."
quantitative:
- parameter: cell mass density - the defended set point versus the terminal chondrocyte
  value: ordinary mammalian cell about 208; Xenopus egg cytoplasm about 100; chondrocyte phase 1 183; TERMINAL HYPERTROPHIC
    CHONDROCYTE about 70
  unit: fg per cubic micrometre (1 fL identical to 1 cubic micrometre)
  species: multiple
  source_ref: fu2025cmd
  note: assembled in R461 from fu2025cmd and cooper2013. An ordinary cell knocked off its density set point returns monotonically
    over 48 h. The terminal hypertrophic chondrocyte sits at a THIRD of the set point and does not return
- parameter: organelle volume per cell versus cytoplasm plus nucleoplasm, upper proliferative to lower hypertrophic zone
  value: organelles +126 per cent, cytoplasm plus nucleoplasm +779 per cent
  unit: per cent change in absolute volume per cell, EM stereology by zone
  species: mouse
  source_ref: buckwalter1986
  note: organelle volume fraction falls about 3.89-fold, against cooper2013 dry-mass density falling 2.61-fold - TWO
    METHODS, TWO SPECIES, 27 YEARS APART, SAME DIRECTION AND ORDER, neither citing the other
- parameter: the volume signal separated from the crowding signal in resealed red-cell ghosts
  value: K-Cl cotransport activates at about 20 fL in ghosts versus 70 fL in intact cells, but at the SAME 30-35 g dry
    solids per 100 g wet weight
  unit: fL and g dry solids per 100 g wet weight
  species: canine
  source_ref: colclasure1992
  note: THE DISCRIMINATING EXPERIMENT, FROM 1992, NEVER APPLIED TO A CHONDROCYTE. Albumin-loaded ghosts activate at the
    same solids concentration, and shrinkage-activated Na/H exchange behaves identically
- parameter: aggrecan core protein transit versus its intracellular waiting pool
  value: rough ER half-time under 10 min and Golgi region half-time under 10 min, against an intracellular core-protein
    precursor half-life of 45-90 min and cycloheximide taking 79 min to stop sulphate incorporation
  unit: minutes
  species: chicken
  source_ref: campbell1988
  note: assembled in R461 from campbell1988 (chick chondrocyte) with the precursor pool figures from the rat chondrosarcoma
    literature. THE GOLGI MODULE RUNS IN TEN MINUTES AND THE CORE PROTEIN WAITS AN HOUR - the bottleneck is upstream
    of the enzymes
- parameter: raising the Golgi PAPS transporter in an unstressed cell
  value: Golgi-vesicle PAPS uptake about 3x untransfected; apical CSPG sulfation enhanced several-fold; HSPG essentially
    unchanged
  unit: stable PAPST1/SLC35B2-GFP in MDCK II
  species: canine
  source_ref: dick2008papst
  note: THE ONLY ELEVATION EXPERIMENT ON A GOLGI MATRIX STEP THAT HAS EVER WORKED. Canine kidney epithelium; never done
    in a chondrocyte; no bone endpoint
- parameter: xylosyl acceptor as the rate-setting variable for chondroitin sulfate synthesis
  value: 50 micromolar xyloside raised TOTAL CS synthesis 60-80 per cent while cutting incorporation into proteoglycan
    by 70 per cent
  unit: rat chondrosarcoma cells
  species: rat
  source_ref: mitchell1982
  note: 'cooling lengthened chains on endogenous core but NOT on xyloside - the elongation machinery has spare capacity
    and lacks primed core. Wrong shape as a lever: the product is free GAG chains, not aggrecan'
- parameter: PTTH neuron ablation in Drosophila - duration versus rate
  value: delayed larval development and eclosion of LARGER FLIES WITH MORE CELLS, caused by prolonged feeding WITHOUT
    changing the rate of growth
  unit: genetic ablation of the four PTTH-producing neurons, versus two independent controls
  species: multiple
  source_ref: mcbrayer2007
  note: 'DROSOPHILA. the reference demonstration that duration alone buys size. Bidirectional and hormone-reversible.
    Does not transfer: the insect has no growth plate and no progenitor pool being spent, and the mammalian equivalent
    is the arm the stack already occupies'
- parameter: does developmental tempo scale with adult body size
  value: NO - segmentation-clock periods of six mammals including rhinoceros and marmoset did not scale with body weight
    but with EMBRYOGENESIS LENGTH
  unit: iPSC-derived presomitic mesoderm, matched conditions
  species: multiple
  source_ref: lazaro2023
  note: 'and seleit2024 supplies the causal test: about 600 Oryzias F2 hybrid embryos DECOUPLE timing from size control
    with distinct devQTL loci for each. Nobody has slowed a tempo and produced a larger structure'
- parameter: Meier-Gorlin syndrome - reduced origin licensing from conception
  value: median height Z about -4.4 with SHORT STATURE NEAR-UNIVERSAL, and 70 per cent DELAYED BONE AGE
  unit: systematic review of 29 published cases, biallelic hypomorphic ORC1/ORC4/ORC6/CDT1/CDC6/GMNN/CDC45/MCM5
  species: human
  source_ref: mgs2026
  value_unverified: true
  note: 'AGENT-REPORTED, ABSTRACT-LEVEL, NOT VERIFIED HERE. THE ARGUMENT: if licensing capacity were the division counter,
    a licensing-deficient plate should exhaust early and fuse early with ADVANCED maturation. It is short with the clock
    running SLOW - which lands on RATE, not NUMBER. CORR-203 and CORR-299 both govern'
- parameter: the replication module in the 207, and its single brake
  value: DTL -4.67 cm (P=1.11e-26), TLK1 -4.66, XRN2 -2.97, RFC1 -1.91, PCNA -1.56; HLTF +1.47 cm (P=1.06e-10, 957 carriers,
    monotone)
  unit: cm per allele, pure pLoF rows unless stated
  species: human
  source_ref: kosmicki2026
  note: HLTF IS A REPLICATION-FORK-REVERSAL TRANSLOCASE and this atlas has cited its concordance for four rounds without
    noticing what the gene does. Mouse Hltf-het body length +0.058 at P=1.08e-07 - the RARE direction against a 64.1
    per cent negative base rate
