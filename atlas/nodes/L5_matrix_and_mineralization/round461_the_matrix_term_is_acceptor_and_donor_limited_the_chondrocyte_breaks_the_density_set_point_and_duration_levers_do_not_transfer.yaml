id: round461_the_matrix_term_is_acceptor_and_donor_limited_the_chondrocyte_breaks_the_density_set_point_and_duration_levers_do_not_transfer
name: 'R461 - three inverse searches converge: the hypertrophic chondrocyte BREAKS the mass-density set point every other
  animal cell defends and two methods 27 years apart agree on the size of the breach; the Golgi matrix module runs in
  ten minutes and is limited by ACCEPTOR and DONOR SUPPLY not by enzymes; and every duration lever in biology - insect,
  tempo, diapause, replication - is a RATE term or does not transfer'
