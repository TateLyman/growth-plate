id: collagen_type_ii
name: Collagen type II (COL2A1)
aliases:
- COL2A1
- alpha1(II) collagen
type: protein
layer: L5
stub: false
summary: 'Collagen II is the fibril-forming backbone of all hyaline cartilage including every zone of
  the growth plate, supplying roughly two-thirds of the dry mass of cartilage collagen and forming a 4D-staggered
  polymer heavily crosslinked head-to-tail by hydroxylysyl pyridinoline at the two telopeptide-to-helix
  sites. Two splice forms exist: IIA retains the cysteine-rich N-propeptide and is made by prechondrocytes
  and perichondrium, IIB lacks it and is the form made by differentiated chondrocytes; the alpha3(XI)
  chain of collagen XI is in fact an alternatively glycosylated alpha1(II)B product, so collagen II and
  XI are not genetically independent. Collagen II is not the diameter-determining component: fibril width
  is set by the collagen XI content and the II:XI ratio. Its mechanical role is to resist the swelling
  pressure of the aggrecan gel, so tensile stiffness of cartilage depends on collagen network integrity
  while compressive stiffness depends on proteoglycan charge. In the growth plate the collagen II network
  is progressively lost from the lower hypertrophic zone as MMP-13 cleaves it, and the type II C-propeptide
  accumulates there. Human COL2A1 mutations produce a graded series from lethal achondrogenesis II/hypochondrogenesis
  through spondyloepiphyseal dysplasia congenita to Stickler syndrome and Kniest dysplasia, which is the
  human proof that collagen II dosage and structure set long-bone length.'
