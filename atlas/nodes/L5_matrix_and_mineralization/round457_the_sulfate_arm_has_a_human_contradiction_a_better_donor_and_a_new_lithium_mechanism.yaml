id: round457_the_sulfate_arm_has_a_human_contradiction_a_better_donor_and_a_new_lithium_mechanism
name: 'R457 - the sulfate axis audited on the ANALYTE: R321''s oral sodium sulfate is contradicted by a second human
  study this file never held, the same experiment supplies a better-tolerated donor that DID raise serum sulfate,
  the largest movement of the human pool is still a SUBTRACTION and it is sustained, and lithium acquires a second
  independent skeletal mechanism on this very arm'
