summary: 'R320, R321, R322 and R410 built the sulfate arm and R321 promoted ORAL SODIUM SULFATE on a single human
  study. R457 audits the axis with one discipline - only measurements of SERUM OR PLASMA INORGANIC SULFATE count
  - and four things change.


  ONE - THE PROMOTED AGENT IS CONTRADICTED BY A HUMAN STUDY THIS FILE NEVER HELD. hoffer2001 measured serum sulfate
  in normal subjects and states verbatim: UNLIKE GLUCOSAMINE SULFATE, ORAL SODIUM SULFATE DID NOT SIGNIFICANTLY
  INCREASE THE SERUM SULFATE CONCENTRATION. The sodium sulfate dose is NOT STATED in the abstract, and morris1983''s
  positive used 9 g of the decahydrate, which is 27.9 mmol of sulfate against roughly 1.6 mmol delivered by 1.0
  g of glucosamine sulfate - about seventeenfold more. So the likeliest reconciliation is a dose-response rather
  than a conflict, with Hoffer having matched sulfate content to the glucosamine arm. THAT IS AN INFERENCE, THE
  FULL TEXT WOULD SETTLE IT, AND UNTIL IT DOES R321''s PROMOTION RESTS ON ONE STUDY WITH A PUBLISHED HUMAN CONTRADICTION
  AGAINST IT.


  TWO - AND THE SAME EXPERIMENT SUPPLIES A BETTER-TOLERATED DONOR THAT WORKED. Serum inorganic sulfate in 7 normal
  subjects rose from 331 plus or minus 21 to 375 plus or minus 17 micromol per litre three hours after 1.0 g of
  ORAL GLUCOSAMINE SULFATE, P less than 0.05 - a 13.3 per cent rise from an ordinary, cheap, NON-LAXATIVE supplement,
  against 9 g of sodium sulfate which is an osmotic laxative and whose divided-dose requirement exists precisely
  because a single dose causes severe diarrhoea. R296 listed glucosamine among 26 agents with zero atlas coverage
  and never checked it.

  AND THE TRANSFER STEP IS IN THE SAME PAPER: synovial fluid and serum sulfate were closely similar in 15 patients
  undergoing knee aspiration, r = 0.99, slope 0.97, P less than 0.0001. THE EXTRACELLULAR FLUID BATHING CARTILAGE
  SITS AT SERUM CONCENTRATION.


  THREE - THE LARGEST HUMAN MOVEMENT OF THIS POOL IS STILL A SUBTRACTION, AND IT IS SUSTAINED RATHER THAN AN EXCURSION.
  hoffman1990: acetaminophen 650 mg four times daily for FOUR DAYS - an unremarkable analgesic regimen - reduced
  the 24-hour average serum inorganic sulfate from 360 to 253 micromol per litre, a 29.7 per cent fall, with renal
  sulfate excretion down 51 per cent and renal clearance down 33 per cent. The best single-dose ELEVATION ever measured
  is 25 per cent. ORDINARY PARACETAMOL USE IS BIGGER AND IT RUNS THE OTHER WAY. hoffer2001 closes the loop in the
  same subjects: 1 g of acetaminophen converted glucosamine sulfate''s plus 13 per cent into a minus 11 per cent
  fall.

  The chain runs to a tissue endpoint in a NORMAL animal: chronic paracetamol in rats lowered serum sulfate and
  lowered patellar cartilage GAG content, which recovered as serum sulfate returned toward normal. And human articular
  cartilage is the most sulfate-sensitive tissue in its comparison series. GOVERNING LIMIT: the entire concentration-response
  literature tests DOWNWARD from physiological, because its authors were asking whether analgesics harm cartilage
  - NOBODY HAS EVER RAISED EXTRACELLULAR SULFATE ABOVE NORMAL AND MEASURED CARTILAGE SULFATION.


  FOUR - A MEASUREMENT-DISCIPLINE FACT THAT BOUNDS THE WHOLE ARM. Serum inorganic sulfate has a circadian rhythm,
  lowest at 11:00 and peaking at 19:00, with a min-to-max difference averaging 25.8 per cent - THE SAME SIZE AS
  THE ENTIRE REPORTED EFFECT OF A 9 g SODIUM SULFATE DOSE. Any single measurement of this analyte must be time-standardised
  or it carries no information.


  FIVE - AND LITHIUM ACQUIRES A SECOND, INDEPENDENT, SKELETAL MECHANISM ON THIS ARM. R356 contraindicated lithium
  on canonical-Wnt grounds, grade E and mechanistic. frederick2008 identifies a Golgi-resident PAP 3-phosphatase
  - gPAPP, the IMPAD1/BPNT2 gene - which clears the nucleotide product of every sulfotransferase reaction, and demonstrates
  that ITS ACTIVITY IS POTENTLY INHIBITED BY LITHIUM IN VITRO. Inactivating gPAPP in mice gives neonatal lethality
  and DWARFISM WITH ABERRANT CARTILAGE MORPHOLOGY, with UNDERSULFATED CHONDROITIN. So the same drug this file already
  contraindicates on Wnt grounds also inhibits, in vitro, the enzyme whose loss undersulfates cartilage and shortens
  bone. LIMIT: potent in vitro inhibition is not the same as inhibition at therapeutic lithium concentrations in
  cartilage in vivo, and that has not been shown.


  SIX - AND THE THIOL ROUTE IS A CONDITIONAL, STATED BY THE PEOPLE WHO PRODUCED ITS POSITIVES. R321 characterised
  NAC as demonstrated only intravenously in a transporter-null patient; that is corrected - monti2015 gave it transplacentally
  and paganini2021 gave it SUBCUTANEOUSLY AND POSTNATALLY to dtd mice, both raising cartilage proteoglycan sulfation
  with improved skeletal phenotype. But pecora2006 injected labelled cysteine into WILD-TYPE as well as mutant mice
  and concluded verbatim that cysteine contribution to cartilage proteoglycan sulfation in vivo is MINIMAL UNDER
  PHYSIOLOGICAL CONDITIONS even when extracellular sulfate availability is low, and becomes significant only BY
  INCREASING PLASMA THIOL CONCENTRATION. Every skeletal result is a rescue in a sulfate-transport-deficient animal,
  and the drug is rapidly cleared from blood.'
