localization: growth plate chondrocytes and limb mesenchymal progenitors
human_evidence: direct
human_evidence_note: >-
  Human evidence is a GWAS variant associated with both reduced height and reduced plasma
  osteolectin, functionally validated by gene editing in human bone marrow stromal cells;
  a monotone exome burden series at P=1e-25 across 10,012 carriers; and cartilage-enriched
  expression of ligand and receptor in human postnatal growth plate. The interventional
  arm is mouse.
species_basis:
  - mouse
  - human
translation_risk: moderate
translation_risk_reason: >-
  The supplementation experiment is mouse and juvenile, and the magnitude is not yet
  extracted. The human arm is observational genetics with a small effect size. The
  mechanism runs against this file's own canonical-Wnt band, which is unresolved.
confidence: B
claim_grades:
  - claim: >-
      Recombinant osteolectin injections increase femur length in normal juvenile mice
    grade: B
    basis: >-
      zhang2023osteolectin, PNAS, Morrison lab. Normal animals rather than a rescue model,
      which is what makes it unusual here. Magnitude not yet read from the figures
  - claim: The receptor integrin alpha-11 is required in chondrocytes for bone elongation
    grade: B
    basis: conditional deletion in chondrocytes with a proliferation and elongation readout
  - claim: >-
      Human genetics support the axis at both ends - a variant lowering height also lowers
      plasma osteolectin
    grade: B
    basis: >-
      GWAS association plus gene editing of the variant into human BMSCs. Observational,
      and the burden effect is only -0.74 cm per allele
  - claim: The whole axis is present and cartilage-enriched in human growth plate
    grade: B
    basis: >-
      ligand, receptor and integrin partner all detected in 12 of 12 samples with purity
      ratios above 1.6. A transcript-origin argument, subject to CORR-351
  - claim: Recombinant CLEC11A is purchasable
    grade: B
    basis: multiple vendor listings checked 2026-08-14; research grade, not a medicine
  - claim: >-
      The Wnt-activating mechanism conflicts with this file's canonical-Wnt band
    grade: C
    basis: >-
      R281 places the optimum below wild type; osteolectin raises Wnt. Whether the pools
      are the same compartment has never been tested, so this is a recorded conflict
      rather than a refutation in either direction
  - claim: >-
      R331's conclusion that the elevation direction is fully occupied was reached with
      the wrong query
    grade: A
    basis: >-
      R331 keyword-matched drug mechanisms; R401 established that recombinant proteins are
      invisible to that query. Applying the corrected query to the same gene list returns
      this target immediately
