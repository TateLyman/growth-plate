id: matrix_volume_per_chondrocyte
name: v(m) - matrix volume per terminal chondrocyte
aliases:
- v(m)
- matrix per cell
- matrix volume per chondrocyte
- the matrix half of the terminal chondrocytic domain
type: process
layer: L5
stub: false
summary: 'The growth identity is dL/dt = flux x v(d), where v(d) is the TERMINAL CHONDROCYTIC DOMAIN VOLUME
  and v(d) = v(c) + v(m): the terminal hypertrophic cell volume plus the matrix volume attributable to that
  cell. v(m) is the second of those two terms and it is between a third and a half of longitudinal bone
  elongation. THE IDENTITY CLOSES ON WILSMAN 1996''S OWN SEPARATELY MEASURED NUMBERS TO 0.03 PER CENT and
  that is not circular: v(c) is a stereological mean cell volume, v(m) is computed from the hypertrophic
  volume fraction, and v(d) is the total volume turned over at the chondro-osseous junction divided by the
  cells lost there, so the three are independent measurements. Proximal tibia 14997 + 6900 = 21897 against
  a measured 21901 um^3; proximal radius 4135 + 4090 = 8225 against a measured 8222. The matrix fraction
  of the domain rises monotonically as the plate slows - 31.5 / 32.4 / 40.2 / 49.7 per cent across the four
  rat plates - and IN THE SLOWEST PLATE v(c) AND v(m) ARE EQUAL TO ONE PER CENT (4135 against 4090 um^3),
  so the terminal domain of a slow growth plate is half cell and half matrix. Breur 1997 is an independent
  measurement of both terms in the same four plates and agrees within 3 to 32 per cent per plate while reaching
  the same structural conclusion: terminal CELL volume varies 3.6 to 3.9-fold between sites while MATRIX
  per cell varies only 1.7 to 1.9-fold, and matrix per cell is age-invariant within a plate while cell volume
  is not. That is a SITE-patterned setpoint rather than the physiological rate control, which is the signature
  of an unexploited lever and equally the signature of a structural constraint - nothing in the arithmetic
  distinguishes them. The elasticity is exact and favourable: at constant flux and constant v(c), d ln(rate)
  / d ln(v(m)) equals the matrix fraction, so in a slow plate a 20 per cent rise in matrix per cell buys
  about 10 per cent of elongation rate and a doubling buys about 50 per cent - and unlike a flux increase
  it is not a withdrawal from the progenitor pool. THE HUMAN ANCHOR EXISTS AND HAD NOT BEEN RECOGNISED AS
  ONE: Wilsman defines matrix per cell as (1 - hypertrophic cellular volume fraction) x v(d), so the matrix
  fraction of the domain IS the cartilage volume fraction of the hypertrophic zone - the quantity byers2000
  measured in 46 human growth plates, where it rises from 25 per cent at 11 days to 40 per cent by one year
  and holds there to 13.5 years. A human terminal domain is therefore about 40 per cent matrix, inside the
  rat range and at its slow end.'
