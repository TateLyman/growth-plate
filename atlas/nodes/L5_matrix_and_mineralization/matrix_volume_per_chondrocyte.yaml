localization:
- 'terminal hypertrophic domain: the compartment in which v(m) is defined'
- 'pericellular and territorial matrix: rises +61 percent through hypertrophy, does not calcify (noonan1998)'
- 'interterritorial matrix: rises +26 percent, calcifies first (noonan1998)'
human_evidence: direct
human_evidence_note: 'No measurement of matrix volume per chondrocyte in absolute units exists for a human
  growth plate at any age or site. What does exist, and had not been recognised as the same quantity, is
  the matrix FRACTION of the domain. Wilsman defines matrix per cell as (1 - hypertrophic cellular volume
  fraction) x v(d), so the matrix fraction of the terminal domain is identically the cartilage volume fraction
  of the hypertrophic zone - and byers2000 measured that in 46 normal human growth plates, finding 25 percent
  at 11 days rising to 40 percent by one year and holding to 13.5 years. A human terminal chondrocytic domain
  is therefore about 40 percent matrix, which sits inside the rat range of 31.5 to 49.7 percent and at its
  slow end, as expected for a rib. The absolute human v(m) in um^3 still requires a terminal cell volume,
  and the only human one is white2008 (n=1, distal tibia at mid-closure with 46 percent central bridging
  bone, 5900 um^3, in a child treated with cisplatin, doxorubicin and methotrexate) - which is a floor rather
  than a representative value.'
species_basis:
- rat
- porcine
- human
translation_risk: moderate
translation_risk_reason: 'The identity, the absolute volumes and the source decomposition are rat. The human
  evidence is a FRACTION and not a volume, and it comes from the rib rather than a long bone. The direction
  of the site extrapolation is supported by two independent rat datasets measuring both terms in the same
  four plates, and the human fraction lands where the rat series predicts for a slow plate, but no human
  matrix volume per chondrocyte has ever been measured.'
confidence: B
key_refs:
- ref_id: wilsman1996
  first_author: Wilsman NJ
  year: 1996
  type: primary
  one_line_finding: 'Matrix production is 32 percent of elongation in a fast rat plate and 49 percent in
    a slow one; Table 6 gives matrix volume per cell directly for four plates (6900 to 4090 um^3) and the
    identity v(d) = v(c) + v(m) closes on the separately measured terms to 0.03 percent'
- ref_id: breur1997
  first_author: Breur GJ
  year: 1997
  type: primary
  one_line_finding: 'Independent measurement of both terms in the same four rat plates: matrix per cell spans
    only 1.92-fold and is age-invariant within a plate while terminal cell volume spans 3.86-fold'
- ref_id: hunziker1989
  first_author: Hunziker EB
  year: 1989
  type: primary
  one_line_finding: 'Net matrix production per cell is invariant across an approximately eightfold growth-rate
    range and the authors conclude cartilage matrix plays a subordinate role in regulating longitudinal growth
    rate - the load-bearing negative against this term as a lever'
- ref_id: hunziker1994
  first_author: Hunziker EB
  year: 1994
  type: primary
  one_line_finding: 'GH and IGF-I in hypophysectomised rats restore terminal cell volume and height while
    matrix volume per cell is similar in normal, hormone-treated and untreated animals - the somatotropic
    axis moves v(c) and does not move v(m)'
- ref_id: noonan1998
  first_author: Noonan KJ
  year: 1998
  type: primary
  one_line_finding: 'Matrix per cell rises 8040 to 11760 um^3 through hypertrophy in mini-pig, split +61
    percent pericellular/territorial versus +26 percent interterritorial, with growth rate related to matrix
    volume per cell'
- ref_id: byers2000
  first_author: Byers S
  year: 2000
  type: primary
  one_line_finding: 'In 46 human rib growth plates the cartilage volume fraction of the hypertrophic zone
    - which is the matrix fraction of the terminal domain by Wilsman''s definition - rises from 25 percent
    at 11 days to 40 percent by one year, while lacunar profile diameter does not change significantly in
    the proliferative zone'
- ref_id: hunziker1999organelle
  first_author: Hunziker EB
  year: 1999
  type: primary
  one_line_finding: 'Matrix production per cell per hour measured with organelle stereology in the same animals:
    GAG 54.2/62.6/25.2 and fibrillar collagen 44.9/77.6/82.5 um^3/cell/h at 21/35/80 days'
