id: round451_oral_chondroitin_sulfate_is_a_slow_release_sulfate_donor
name: R451 - the minipig patent verified and reframed - oral chondroitin sulfate is refuted as a GAG donor by
  a human PK study and survives as a SLOW-RELEASE SULFATE DONOR, which is the one profile that defeats R322's
  renal-dumping objection
