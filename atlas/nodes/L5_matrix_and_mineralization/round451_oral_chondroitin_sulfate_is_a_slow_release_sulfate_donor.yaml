human_evidence: direct
human_evidence_note: The two decisive pharmacokinetic studies are human - jackson2010 from the NIH GAIT trial
  and mizuta2023 - and they bound what oral chondroitin sulfate can and cannot do in a person. The growth
  result itself is porcine, unpublished, and appears only in a patent at n=3 per group.
translation_risk: high
translation_risk_reason: The growth result exists only as a patent with n=3 per group, no peer review, no
  route to the raw data, and no disclosure of the molecular weight or source of the agent - which is the
  single parameter that decides whether it is absorbed. The reframing as a sulfate donor is a mechanism
  inference this round makes, not something anyone has measured.
summary: 'R449 recorded this patent as agent-reported and unverified and flagged its wild-type arm as
  internally odd. It has now been pulled and read. THE PARTICULARS ARE CONFIRMED AND ONE OF R449''S TWO
  RESERVATIONS DISSOLVES, WHILE A HARDER OBJECTION APPEARS THAT R449 DID NOT HAVE.


  WHAT THE PATENT ACTUALLY SAYS. CN119055678A, Institute of Zoology of the Chinese Academy of Sciences,
  priority 2024-11-06. Guangxi Bama miniature pigs carrying an SLC13A1 W48R mutation and WILD-TYPE controls,
  chondroitin sulfate ADDED TO THE FEED - the route is ORAL - from one to six months of age, with a stated
  effective range of 20 to 100 mg/kg and 70 mg/kg preferred. At month five: HEIGHT rose 18.5 per cent in
  mutants and 12.6 PER CENT IN WILD TYPES, both at p below 0.01, n=3 per group, with BODY WEIGHT NOT
  significantly increased in either. Body length rose 29.1 per cent in mutants and showed no significant trend
  in wild types. A second example reports significantly increased bone length in femur, humerus, tibia, fibula
  and radius. The claimed mechanism is sulfation - more growth-plate chondrocytes, deeper Alcian blue and
  Safranin O staining, increased CS-56, elevated SOST. There is no human data of any kind.


  R449''S "INTERNALLY ODD" READING IS CORRECTED, AND THE CORRECTION IS UNFAVOURABLE FOR THIS SUBJECT. R449
  called the wild-type arm odd because height rose while body length did not. In a pig those are different
  compartments: height is a withers or shoulder measure and is limb-dominated, while body length is a
  nose-to-tail-base measure and is trunk. Height up with body length flat in a wild-type animal is therefore
  exactly what a LIMB-DIRECTED growth effect looks like, and the patent''s own bone list - femur, humerus,
  tibia, fibula, radius - is entirely LIMB bones. The mutant is a systemic sulfate-deficiency dysplasia with
  axial involvement, so correcting it also restores the trunk, which is why body length moves 29.1 per cent
  there and not in wild types. The arm is coherent. It is also aimed at the compartment that is NOT this
  subject''s residual. The anatomical landmarks are not defined in the document, so the landmark inference is
  grade E; the limb-only bone list is independent support for it.


  AND THE HARD OBJECTION IS A HUMAN PHARMACOKINETIC STUDY FROM THE NIH GAIT TRIAL. jackson2010 measured
  circulating chondroitin sulfate in human plasma at about 20 micrograms per millilitre and found that THE
  ENDOGENOUS CONCENTRATION AND THE CS DISACCHARIDE COMPOSITION WERE NOT DETECTABLY ALTERED BY INGESTION OF CS,
  taken alone or with glucosamine, in 29 normal individuals given a single dose and in 28 patients after THREE
  MONTHS of daily dosing. The authors'' own conclusion is that any effect probably does not result from
  ingested CS reaching the joint space. ORAL HIGH-MOLECULAR-WEIGHT CHONDROITIN SULFATE DOES NOT MEASURABLY
  ENTER THE HUMAN CIRCULATION AS CHONDROITIN SULFATE, and a molecule that does not enter the circulation
  cannot deliver sulfated glycosaminoglycan to a growth plate.


  MOLECULAR WEIGHT IS WHY THAT IS NOT THE END OF IT. mizuta2023 gave humans four chondroitin sulfates of
  different size - tetrasaccharide at 980 Da, CSOS-1 at 1,500, CSOS-2 at 2,800 and high-molecular-weight CS at
  70,000 - and quantified them in plasma and urine. Urinary exogenous CS over 24 hours was HIGHER for the
  oligosaccharide groups than for the high-molecular-weight group, and the authors conclude that lower
  molecular weight CS is more efficiently absorbed through the human digestive tract. So the two human results
  are not in conflict: jackson2010 tested the ordinary supplement and mizuta2023 tested depolymerised
  oligosaccharides. THE PATENT DOES NOT DISCLOSE WHICH IT USED, and that is the single parameter that decides
  whether the intact-GAG reading is even possible.


  THE REFRAMING, AND IT IS WHAT MAKES THIS WORTH A ROUND. jackson2010 offers its own alternative - that any
  effect may arise in the gut lining or the liver, where concentrations of ingested CS OR ITS BREAKDOWN
  PRODUCTS could be substantially elevated. Chondroitin sulfate''s breakdown products include INORGANIC
  SULFATE. The gut has a dedicated apparatus for producing them: ndeh2020 dissects a versatile core genetic
  locus in Bacteroides thetaiotaomicron that orchestrates metabolism of multiple glycosaminoglycans, and
  luis2023 establishes that carbohydrate sulfatases stripping sulfate from host glycans are widespread and
  substrate-specific among gut Bacteroidetes. Independently, pecly2006 shows in rats that after intravenous
  35S-chondroitin sulfate APPROXIMATELY 25 PER CENT OF URINARY 35S APPEARS AS INORGANIC SULFATE, so the GAG is
  a demonstrated in vivo sulfate source in a mammal. And the patent''s OWN claimed mechanism is sulfation, in
  an animal whose lesion is in a SULFATE TRANSPORTER. The patent may have found a sulfate-donor effect and
  attributed it to the glycosaminoglycan.


  AND THAT READING DEFEATS THE OBJECTION THAT KILLED THE MAGNITUDE OF R322''S SULFATE ARM. R322 established
  that renal sulfate reabsorption is CAPACITY LIMITED, so an oral bolus of sodium sulfate raises the filtered
  load and the kidney dumps it, producing a 25 per cent excursion at two hours rather than a new set point.
  A polysaccharide progressively desulfated by colonic bacterial sulfatases over many hours is a SLOW-RELEASE
  sulfate donor, which is precisely the pharmacokinetic profile a capacity-limited renal transporter does not
  defeat. That is a mechanism-level reason why chondroitin sulfate might do what sodium sulfate cannot, and it
  is derivable entirely from material this file already holds plus jackson2010. It also explains why a WILD
  TYPE responded, since a wild-type animal is not glycosaminoglycan-deficient but its sulfate pool is still
  capacity-limited - which removes CORR-203 from the wild-type arm specifically.


  THE ZERO THAT DECIDES IT, AND IT IS A SINGLE BLOOD TEST ON AN OVER-THE-COUNTER SUPPLEMENT. NOBODY HAS
  MEASURED SERUM INORGANIC SULFATE AFTER ORAL CHONDROITIN SULFATE, IN ANY SPECIES. Narrow queries against
  chondroitin and inorganic sulfate in plasma or serum return three records, of which one is pecly2006''s
  intravenous rat study and two are from the 1950s. It is the same assay R322 already named as the gate on the
  whole sulfate arm, and it converts this from a patent claim into a measurement.


  INDEPENDENT SPECIES CORROBORATION, WITH ITS CAVEATS. li2025cs reports that chondroitin sulfate alleviates
  broiler tibial dyschondroplasia, raising body weight and tibial mass and promoting repair of growth-plate
  injury with restoration of normal growth-plate morphology, via CHST11 and beta-catenin. Two caveats. Tibial
  dyschondroplasia is a DISEASE model, so CORR-203 governs the effect size. And R409 established that in HUMAN
  growth plate CHST3 is the cartilage-enriched sulfotransferase at a purity ratio of 3.32 while CHST11 is
  CONTAMINANT-LEANING at 0.11, so the named mechanism sits on the paralogue that is not the human plate''s.


  THE SAFETY ENVELOPE COMES FROM THE OTHER PATENT AND IT IS THE WRONG MOLECULE. wo2013174863 reports rat
  chronic toxicity at up to 200 mg/kg/day for 26 weeks with no adverse effects, an oral LD50 above 2000 mg/kg,
  and 90 dogs dosed at 15 mg/kg/day orally for six months. But its agent is NON-SULPHATED chondroitin, it
  states that non-sulphated chondroitin maintains type II collagen expression BETTER than chondroitin
  SULPHATE, and it carries no bone, growth-plate or length endpoint anywhere. Its value here is a chronic oral
  safety envelope for the polysaccharide backbone and nothing more.


  THE DOSE, DERIVED AND MARKED AS DERIVED. Scaling 70 mg/kg in a minipig to a human by body-surface-area
  allometry with an animal Km between 24 and 35 against a human Km of 37 gives a human equivalent of 45 to 66
  mg/kg, or roughly 2.7 to 4.6 grams per day at 60 to 70 kg. The ordinary human chondroitin sulfate supplement
  dose is 0.8 to 1.2 grams per day, so the patent-equivalent exposure is about three to five times what people
  ordinarily take. That is not a recommendation and it is not a prescription - it is the number needed to
  interpret whether ordinary supplement use is even in the tested range, and the answer is that it is not.'
quantitative:
- parameter: height gain in WILD-TYPE Guangxi Bama minipigs on oral chondroitin sulfate in feed
  value: 12.6
  unit: per cent at month 5 versus vehicle wild type, p<0.01, n=3 per group, 70 mg/kg preferred dose, 1 to 6
    months of age; body weight NOT significantly increased; body length showed no significant trend
  species: porcine
  source_ref: cn119055678
  note: the mutant arm gave height +18.5 per cent and body length +29.1 per cent; a second example reports
    significantly increased length of femur, humerus, tibia, fibula and radius - all LIMB bones. Patent, no
    peer review, n=3, molecular weight and source of the agent not disclosed
- parameter: effect of oral chondroitin sulfate ingestion on circulating chondroitin sulfate in humans
  value: none detectable
  unit: circulating CS about 20 microg/mL; neither endogenous concentration nor disaccharide composition
    altered by ingestion, n=29 single dose and n=28 after 3 months daily dosing
  species: human
  source_ref: jackson2010
  note: NIH GAIT trial - the hard objection to any intact-GAG reading of the patent; the authors conclude the
    effect probably does not result from ingested CS reaching the joint space but may arise in gut lining or
    liver from CS or ITS BREAKDOWN PRODUCTS
- parameter: dependence of human oral chondroitin sulfate absorption on molecular weight
  value: oligosaccharides >> 70 kDa
  unit: urinary exogenous CS over 24 h, comparing MW 980, 1,500, 2,800 and 70,000 Da
  species: human
  source_ref: mizuta2023
  note: reconciles jackson2010 with the patent - jackson tested the ordinary high-MW supplement, this tested
    depolymerised oligosaccharides, and the patent does not say which it used
- parameter: fraction of urinary 35S appearing as INORGANIC SULFATE after intravenous 35S-chondroitin sulfate
  value: 25
  unit: per cent, rat
  species: rat
  source_ref: pecly2006
  note: chondroitin sulfate is a demonstrated in vivo sulfate source in a mammal - but intravenous, and the
    sulfate measured is being EXCRETED rather than shown to enlarge the retained pool
- parameter: human equivalent dose of the patent's 70 mg/kg minipig dose, by body-surface-area allometry
  value: 45-66
  unit: mg/kg/day, i.e. about 2.7-4.6 g/day at 60-70 kg, using animal Km 24-35 against human Km 37
  species: human
  source_ref: cn119055678
  note: DERIVED in R451, not measured. The ordinary human supplement dose of 0.8-1.2 g/day is about 3-5 fold
    BELOW the patent-equivalent exposure, so ordinary supplement use is not in the tested range
- parameter: chronic oral safety envelope for the chondroitin backbone
  value: 200
  unit: mg/kg/day for 26 weeks in rat with no adverse effects; oral LD50 above 2000 mg/kg; 90 dogs at 15
    mg/kg/day orally for 6 months
  species: rat
  source_ref: wo2013174863
  note: the agent there is NON-SULPHATED chondroitin, which that same document reports behaves differently
    from chondroitin SULPHATE on type II collagen - so this is an envelope for the backbone and not a
    substitute for safety data on the sulfated molecule
