  species: human
  source_ref: maroudas1998
  uncertainty: turnover constant 0.206/year; articular not physeal cartilage
- parameter: Free G1 (hyaluronan-binding region) half-life
  value: '25'
  unit: years
  conditions: adult human articular cartilage, aspartate racemization
  species: human
