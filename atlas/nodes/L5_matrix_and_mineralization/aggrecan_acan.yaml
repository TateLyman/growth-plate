localization:
- 'bovine growth plate RZ/PZ: highest aggrecan synthesis and turnover (shapses1994)'
- 'bovine growth plate lower HZ: reduced aggrecan gene expression adjacent to the calcification zone (shapses1994)'
- 'human growth plate: aggrecan present in all zones; zonal turnover rates not measured'
human_evidence: direct
human_evidence_note: Heterozygous ACAN loss-of-function is a directly measured human short-stature syndrome
  with height SDS data in >100 individuals; the zonal biochemistry is bovine.
species_basis:
