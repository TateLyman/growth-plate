id: aggrecan_acan
name: Aggrecan (ACAN)
aliases:
- ACAN
- cartilage-specific proteoglycan core protein
- CSPG1
type: protein
layer: L5
stub: false
summary: 'Aggrecan is the large chondroitin-sulphate/keratan-sulphate proteoglycan that carries essentially
  all of the fixed negative charge of cartilage and therefore all of its osmotic swelling pressure. Its
  N-terminal G1 domain binds hyaluronan, the interaction is stabilised by link protein (HAPLN1), and up
  to a hundred monomers decorate a single hyaluronan filament to form the aggregate that is immobilised
  inside the collagen network. In the growth plate aggrecan is synthesised across all zones but with a
  strong zonal gradient of metabolism: in bovine distal tibial growth plate explants both synthesis and
  breakdown rates are highest in the resting/proliferative third and lowest in the lower hypertrophic
  third, and about 90% of newly synthesised proteoglycan is aggregation-competent. Aggrecan is removed
  from the hypertrophic zone before mineralization, but not by MMPs: mice engineered with aggrecan resistant
  to MMP cleavage at the N341-F342 interglobular-domain site grow normally and do not accumulate aggrecan,
  which excludes MMP aggrecanolysis as the removal mechanism and leaves ADAMTS cleavage at Glu373-Ala374
  and simple dilution as the surviving candidates. Human ACAN haploinsufficiency is one of the commonest
  monogenic causes of idiopathic short stature.'
