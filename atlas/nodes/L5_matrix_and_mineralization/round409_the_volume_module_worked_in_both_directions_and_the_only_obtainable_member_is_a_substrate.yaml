id: round409_the_volume_module_worked_in_both_directions_and_the_only_obtainable_member_is_a_substrate
name: "R409: the volume module worked in both directions - R408's chemistry optimism corrected within one round (KCC1 has ZERO chemical matter), the organic-osmolyte class SPLITS on localisation leaving BETAINE as the only obtainable member, CHST3 not CHST11 is the plate's sulfotransferase, and PIEZO1 loss is minus 2.46 cm in humans"
aliases:
  - betaine growth plate
  - BGT1 SLC6A12 cartilage
  - CHST3 versus CHST11
  - PIEZO1 human burden height
  - KCC1 chemical matter
type: hypothesis
layer: L5
stub: false
summary: >-
  R408 localised the cell-volume module for the first time and argued that the ask on h_term
  changes from "find a transporter ACTIVATOR", which is close to a nonexistent drug class, to
  "find an INHIBITOR of a cartilage-enriched exporter", which is ordinary medicinal chemistry.
  This round tested that claim and worked the rest of the module in both directions. Four
  results, and the first of them is a correction to R408 made one round later.

  ⛔ ONE - R408's CHEMISTRY OPTIMISM IS WRONG, AND THE PROPER ChEMBL QUERY SAYS SO.
  SLC12A4 (KCC1), the enriched exporter R408 nominated, has NO HUMAN ChEMBL TARGET RECORD AT
  ALL - not a thin one, none. WNK4, the enriched kinase, HAS a target record with ZERO
  molecules at pChEMBL >= 5. The chemistry on this family exists but sits on the WRONG
  PARALOGUES: SLC12A5 (KCC2, neuronal, 11 molecules at 7.21), WNK1 (18 at 8.40), STK39/SPAK
  (43 at 7.84), SLC12A2/NKCC1 (3 at 6.62). So CORR-312's "search the fold, not the drug" is
  half-satisfied - the fold is druggable and the paralogue is not - and R408's sentence about
  ordinary medicinal chemistry must be read as a statement about the CLASS, not about an
  available molecule. Nothing on the export arm is obtainable.

  ⭐ TWO - THE ORGANIC-OSMOLYTE CLASS SPLITS ON LOCALISATION, AND ONE MEMBER SURVIVES.
  R296 queried organic osmolytes (taurine, betaine, sorbitol, myo-inositol) for any mammalian
  bone-length endpoint and found the shelf empty. What R296 never ran was the receiver test on
  the TRANSPORTERS, and it separates the class:
  ENRICHED - SLC6A12 / BGT1, the BETAINE transporter, ratio 2.05 at 14.3 CPM, 12 of 12 samples.
  NOT ENRICHED - SLC5A3 / SMIT1, the myo-inositol transporter, 0.86; SLC5A11 absent.
  CONTAMINANT-LEANING - SLC6A6 / TauT, the taurine transporter, 0.15.
  ⭐ AND THE PLATE CANNOT BURN BETAINE: BHMT, the enzyme that consumes betaine as a methyl
  donor, is 0.0 CPM in pure cartilage at ratio 0.11. A tissue that imports betaine on a
  concentrative Na+/Cl-coupled transporter and carries no betaine-consuming enzyme is a tissue
  in which betaine can only accumulate as an OSMOLYTE. That is the cleanest mechanistic read
  in the round and it is new.
  ⭐ AND UNLIKE EVERY OTHER MEMBER OF THIS MODULE, IT NEEDS NO DRUG - IT NEEDS A SUBSTRATE.
  Betaine anhydrous is approved as CYSTADANE, oral powder, labelled at 6 g/day in divided doses
  for children 3 years and older with doses up to 20 g/day used, and 100 mg/kg/day escalating
  under 3 years. It is also an ordinary supplement (trimethylglycine). CORR-344's shelf - the
  one that produced this file's only obtainable compound, oral sodium sulfate.
  ⛔ AGAINST IT, AND STATED BEFORE IT IS PROPOSED: no betaine study in any species has a bone
  or body LENGTH endpoint - the growth literature is livestock growth performance, which is the
  taurine/aquaculture problem again, and the mammalian cartilage work is TMJ osteoarthritis
  repair via chondrogenic differentiation, not volume. Nobody has measured chondrocyte betaine
  content in any species. And NFAT5/TonEBP, the transcription factor that drives SLC6A12 under
  hypertonicity, is CONTAMINANT-LEANING at 0.32 - the osmolyte-response programme is not itself
  chondrocyte-concentrated, which is a real tension against the whole framing.
  ⛔ AND ONE INCONVENIENT ARM OF ITS OWN INDICATION: betaine's approved use is homocystinuria,
  a disease whose skeletal phenotype includes TALL marfanoid stature that treatment is intended
  to prevent. That tall stature is attributed to homocysteine disrupting fibrillin and collagen
  cross-linking, a pathological mechanism absent in a subject with normal homocysteine - but it
  is the arm that runs against the proposal and it is recorded rather than dropped.

  ⭐ THREE - CHST3, NOT CHST11, IS THE PLATE'S SULFOTRANSFERASE, AND THAT CORRECTS R320.
  R320 recorded CHST11 at 350.8 CPM from the uncorrected data as though it were the growth
  plate's chondroitin sulfotransferase. Purity-corrected the two invert: CHST3 176.8 CPM at
  ratio 3.32 ENRICHED, CHST11 89.6 at ratio 0.11 CONTAMINANT-LEANING - a paralogue switch as
  sharp as SCUBE1/SCUBE2. UST is 0.06, also contamination. ⭐ AND THE ENRICHED ONE IS THE ONE
  WITH A HUMAN SKELETAL PHENOTYPE: biallelic CHST3 loss causes spondyloepiphyseal dysplasia
  with congenital joint dislocations (Omani type), short stature, with a substantial published
  variant series. Direction is therefore to RAISE, the substrate is PAPS made from sulfate, and
  the atlas's one obtainable compound - oral sodium sulfate, R320/R321 - already feeds exactly
  this enzyme. The volume module and the sulfate arm converge on the same node from two
  independent directions, and neither knew about the other.
  ⛔ THE INCONVENIENT HALF, RECORDED: IMPC Slc26a2 HETEROZYGOTE TIBIA LENGTH is +0.242 at
  P=0.00384 - POSITIVE, which is the RARE direction under CORR-329 and therefore the informative
  one - so losing one copy of the cartilage sulfate IMPORTER lengthened the tibia. Papss2
  heterozygote body length is +1.306, ns. Both run AGAINST the supply direction. n is small
  (5m/4f and 9m/9f) and human biallelic loss of either gene is short, so these are heterozygous
  mouse rows against a human recessive phenotype - but they are the only length endpoints on the
  sulfate supply chain and they do not support it.

  ⭐⭐ FOUR - PIEZO1 LOSS IS MINUS 2.46 cm IN HUMANS AND THIS FILE HAS NEVER QUOTED THE NUMBER.
  kosmicki2026 gives PIEZO1 THIRTY-FIVE rows and they are MONOTONE in both variant severity and
  allele rarity - R324's causal shape, the same shape that validated NRK: pLoF singleton -2.590,
  pLoF <0.01% -2.460 (P=2.88e-43, 1,572 carriers), pLoF+deleterious missense <0.01% -1.260
  (P=1.79e-49, 6,935), decaying cleanly through -0.450 for deleterious missense <1% to -0.169
  for all-missense singletons. IMPC Piezo1-het body length -0.546 (P=0.054) is concordant and
  weak. ⛔ R296 withdrew PIEZO1 as a lever and wrote "therapeutic direction = INHIBITION",
  reasoning from Yoda1's cartilage degeneration and from PIEZO1 blockade slowing scoliosis. The
  human burden data have been on disk since 2026-08-12 and say the opposite: PIEZO1 is
  LOAD-BEARING for human height, so its INHIBITORS are a contraindication and the direction of
  interest is preservation or activation - which R296 correctly showed has no clean agent.
  R296's WITHDRAWAL of PIEZO1 as a lever stands; its statement of the therapeutic direction does
  not. This matters practically because PIEZO1 blockade is being pursued for adolescent
  scoliosis, in the same patients and the same years.

  ⭐ FIVE - TRPV4 CAME UP ENRICHED WITH REAL CLINICAL CHEMISTRY AND WAS KILLED BEFORE IT WAS
  PROPOSED. TRPV4 is 194.1 CPM at ratio 2.17, one of the most enriched channels in the panel,
  and TRPV4 antagonists have reached phase 2. The reasoning that made it attractive - TRPV4 is
  the swelling sensor that triggers regulatory volume decrease, so blocking it should leave the
  cell swollen - fails on two checks run first: IMPC Trpv4 homozygote TIBIA LENGTH is -0.781 at
  P=0.0171, and this atlas's own trpv4_channel node already records that human gain-of-function
  gives metatropic dysplasia and Kozlowski SMD while loss-of-function also gives Kozlowski, so
  the dose-response is non-monotonic. Both directions shorten. Recorded as searched-and-rejected.
  ⚠ Also localised for the first time and not pursued: SLC4A2/AE2 is ENRICHED at 2.39 while its
  published partner NHE1/SLC9A1 is contaminant-leaning at 0.20 - the two halves of a pair that
  were studied together in longitudinal bone growth sit on opposite sides of the purity split.

  ⛔ WHAT THIS ROUND DOES NOT DO. It produces no agent for the export arm - KCC1 and WNK4 have
  no chemical matter at all. Betaine is obtainable and has no length endpoint in any species.
  CHST3's direction is to supply and the only supply route already carries two mouse length rows
  running the wrong way. And hall2001's set-point re-tuning objection from R408 is untouched:
  adding one osmolyte from outside may simply be met by the cell lowering another, which is
  exactly what regulatory volume regulation is for.
