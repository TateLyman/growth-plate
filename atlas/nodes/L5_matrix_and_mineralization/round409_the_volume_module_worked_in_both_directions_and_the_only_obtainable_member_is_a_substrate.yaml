localization: >-
  human postnatal growth plate; within the volume and osmolyte module the chondrocyte-enriched
  members are SLC6A12, CHST3, SLC12A4, WNK4, AQP1, SLC4A2 and TRPV4, while SLC6A6, SLC5A11,
  NFAT5, SLC9A1, CHST11, UST, KCC3 and KCC4 are contaminant-leaning
human_evidence: indirect
human_evidence_note: >-
  The localisation and the PIEZO1 burden effect are human. The CHST3 direction rests on a human
  recessive dysplasia, which CORR-325 warns is a different dose from the heterozygous state.
  Betaine's human evidence is a labelled dose in an unrelated indication, with no skeletal
  endpoint in any species.
species_basis:
  - human
  - mouse
translation_risk: high
translation_risk_reason: >-
  No agent exists for the export arm, betaine has never been given with a length endpoint in any
  species, the sulfate supply chain's only two length rows run the wrong way, and the volume set
  point is known to re-tune.
confidence: C
claim_grades:
  - claim: KCC1 and WNK4 have no usable chemical matter and R408's chemistry claim was too optimistic
    grade: A
    basis: >-
      direct ChEMBL query - SLC12A4 returns no human target at all, WNK4 returns a target with
      zero molecules at pChEMBL >= 5, while KCC2, WNK1 and SPAK carry real series
  - claim: >-
      The organic-osmolyte class splits on localisation, and betaine's transporter is the only
      enriched member
    grade: B
    basis: >-
      purity-corrected expression across 12 human samples with calibrators, subject to CORR-351.
      SLC6A12 2.05 against SLC6A6 0.15 and SLC5A3 0.86
  - claim: The growth plate cannot catabolise betaine and can therefore only accumulate it as an osmolyte
    grade: C
    basis: >-
      BHMT at 0.0 CPM in pure cartilage. An inference from a single absent enzyme; betaine's other
      fates were not enumerated and no chondrocyte betaine measurement exists in any species
  - claim: CHST3 rather than CHST11 is the growth plate's chondroitin sulfotransferase
    grade: B
    basis: >-
      3.32 versus 0.11 on the purity split, corroborated by CHST3 biallelic loss being a human
      short-stature dysplasia and CHST11 having no such phenotype
  - claim: PIEZO1 is load-bearing for human height and its inhibitors are a contraindication
    grade: B
    basis: >-
      35 monotone burden rows to P=1.79e-49, concordant weak mouse het row. The mechanism at the
      plate is unestablished and a systemic route through erythroid, endothelial and lymphatic
      PIEZO1 is not excluded
  - claim: TRPV4 antagonism is the wrong direction
    grade: B
    basis: >-
      IMPC Trpv4 homozygote tibia -0.781 at P=0.0171 plus the non-monotonic human dysplasia series
      already recorded in trpv4_channel
  - claim: Betaine changes bone length
    grade: E
    basis: >-
      untested in any species. The transporter is enriched and the substrate is obtainable; that is
      the entire basis, and the class it belongs to was already searched and found empty by R296
