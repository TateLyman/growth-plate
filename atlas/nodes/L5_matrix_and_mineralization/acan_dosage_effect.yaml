id: acan_dosage_effect
name: ACAN dosage effect on longitudinal growth
aliases:
- aggrecanopathy
- ACAN haploinsufficiency
type: phenotype
layer: L5
stub: false
summary: 'Aggrecan is a dosage-sensitive determinant of human height. In the largest series, 103 individuals
  from 20 families carrying heterozygous ACAN loss-of-function variants reached a median adult height
  of -2.8 SDS (range -5.9 to -0.9), with childhood height less affected at -2.0 SDS and bone age advanced
  by a median of +1.3 years. Independent exome studies found adult heights of -2.3 to -4.2 SDS in three
  further families, and targeted screening established ACAN as one of the commonest monogenic causes of
  idiopathic short stature. Whole-gene and multi-exon deletions produce a phenotype at the more severe
  end with a high burden of osteochondritis dissecans and early osteoarthritis. The combination of short
  stature with ADVANCED rather than delayed bone age is the diagnostic signature and is mechanistically
  the important part: the plate is not simply slow, it is consumed early. The murine mechanism has been
  resolved in the Acan+/- (cartilage matrix deficiency) mouse, where growth failure is postnatal and comes
  from reduced extracellular matrix volume plus impaired chondrocyte hypertrophy with suppressed Akt signalling
  and raised Camk1d, while proliferation is largely unaffected. Homozygous ACAN loss in humans and animals
  is lethal or near-lethal (spondyloepimetaphyseal dysplasia aggrecan type), so the allelic series spans
  normal, mild dominant short stature, and lethal chondrodysplasia.'
