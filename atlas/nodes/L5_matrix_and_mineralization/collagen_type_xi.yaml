id: collagen_type_xi
name: Collagen type XI (COL11A1/COL11A2)
aliases:
- COL11A1
- COL11A2
- alpha3(XI)=alpha1(II)B
type: protein
layer: L5
stub: false
summary: 'Collagen XI is the minor fibrillar collagen that nucleates the cartilage fibril and sets its
  diameter. The molecule is a heterotrimer of alpha1(XI), alpha2(XI) and alpha3(XI), the last of which
  is the COL2A1 gene product alpha1(II)B differing only in post-translational glycosylation. It is buried
  inside the fibril and antigenically masked, becoming accessible to antibodies only where fibril packing
  is disrupted. Reconstitution experiments show the causal role directly: purified collagen II alone forms
  tapered tactoids of uncontrolled width, whereas II plus XI forms uniform ~20 nm fibrils provided the
  molar excess of II over XI stays below eight-fold. In the chondrodysplasia (cho/cho) mouse, a Col11a1
  null, alpha1(XI) is absent and alpha1(V) substitutes in the fibril, giving abnormally thick cartilage
  collagen fibrils and severe chondrodysplasia; heterozygotes have hearing loss, showing dosage sensitivity.
  In humans COL11A1 mutations cause Marshall and Stickler type II syndromes and fibrochondrogenesis, COL11A2
  causes otospondylomegaepiphyseal dysplasia and non-syndromic deafness, and COL11A2 variants have been
  reported in autosomal dominant familial short stature. In adult articular cartilage the isolated collagen
  XI fraction contains roughly equal amounts of alpha1(V) and alpha1(XI), so what is called collagen XI
  in mature tissue is a V/XI hybrid, not the embryonic molecule.'
