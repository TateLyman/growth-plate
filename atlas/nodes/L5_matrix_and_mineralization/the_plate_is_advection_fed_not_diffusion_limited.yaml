contradicts:
- 'OVERTURNS the_hypertrophic_zone_is_the_diffusion_limited_one AND local_consumption_rate_inferred ON THE
  CENTRAL POINT. Those nodes concluded the hypertrophic zone is diffusion-limited with a Thiele modulus of
  about 3 to 6. Both used a hypertrophic diffusivity of 5.7 square micrometres per second derived from the
  theoretical Mackie-Meares hindrance of 21; williams2007 Figure 3d measures it directly at roughly 41 for
  the same molecular size. With the measured value the modulus is 0.62 to 2.13, and with the measured
  advection the Damkohler number is 0.015 to 0.185. The earlier nodes are left in place with this one
  attached, because their other content - the human thickness, the consistency check, the zone assignment
  of the CNP axis - is unaffected.'
