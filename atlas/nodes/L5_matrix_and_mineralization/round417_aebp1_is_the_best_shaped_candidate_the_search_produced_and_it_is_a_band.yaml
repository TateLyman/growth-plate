id: round417_aebp1_is_the_best_shaped_candidate_the_search_produced_and_it_is_a_band
name: "R417: AEBP1 worked to the end - a monotone 35-row human allelic series with pLoF at +1.10 cm and the best-powered row at P=8.4e-15, a SECRETED protein peaking in PERICHONDRIUM and RESTING ZONE, acting on canonical Wnt at the one DEPTH that works. And it is a BAND: the osteoprogenitor knockout REDUCES body size and the biallelic human has osteoporosis and scoliosis. Third instance of R281's interior optimum, first with a large human heterozygous effect"
aliases:
  - AEBP1 ACLP height
  - clEDS2 stature
  - canonical Wnt extracellular brake
  - COL16A1 height
type: hypothesis
layer: L5
stub: false
summary: >-
  R416 found AEBP1 in the coding-brake table on a SPLICE DONOR variant at +0.53 cm and flagged it
  as the only novel entry that was simultaneously a true loss of function, cartilage-enriched, and
  landing on a pathway band this atlas has already mapped. Worked to the end it is the
  best-SHAPED candidate the whole inverse search produced - and it does not clear the bar, for a
  reason that is itself informative.

  ⭐ ONE - THE HUMAN GENETICS ARE THE BEST OF ANY BLIND-SPOT GENE, AND THEY ARE MONOTONE.
  Thirty-five burden rows, decaying cleanly as benign variants are added, which is R324's
  signature of a real causal loss-of-function effect and the shape that validated NRK and PIEZO1:
  pLoF <0.01% +1.100 cm · pLoF+deleterious missense <0.01% +0.657 · deleterious missense +0.565 ·
  pLoF+possibly-deleterious +0.428 · possibly-deleterious +0.372 · all missense +0.307.
  BEST-POWERED ROW: pLoF+deleterious missense <1%, +0.436 cm at P=8.39e-15 across 15,923 carriers,
  with pLoF <1% at +0.429 and P=8.69e-12 across 12,677. Plus the single-variant SPLICE DONOR at
  +0.53 cm and P=9.8e-10. Two instrument classes, one direction.

  ⭐⭐ TWO - AND THE COMPARTMENT IS THE ONE THAT MATTERS. AEBP1 is 422 CPM in pure cartilage at
  3.0x sex-corrected enrichment, and zone-resolved it is PERICHONDRIUM-AND-RESTING-ZONE peaked,
  falling monotonically into hypertrophic in BOTH donors: donor 1 PC 15,394 > RZ 12,797 > PZ 6,136
  > PHZ 4,802 > HZ 3,990; donor 2 PC 13,589 > RZ 9,813 > PZ 6,509 > PHZ 4,247 > HZ 4,503.
  ⭐ Those are the two compartments this file cares most about - the perichondrium is where FBN1's
  restraint acts (its only clean-donor detection is there, and Fbn1 loss in limb mesenchyme gives
  bones 7 percent longer), and the resting zone is where SFRP5, FRZB and SMOC1 run the only
  programme R356 could find. In the same arrays SFRP5 is RZ 3,656 and 8,431, the identical shape.

  ⭐⭐⭐ THREE - AND THE MECHANISM LANDS ON CANONICAL Wnt AT THE ONE DEPTH THAT WORKS. The
  osteoprogenitor conditional knockout shows Aebp1 loss ATTENUATES Wnt/beta-catenin signalling in
  bone. R281 places the canonical-Wnt optimum BELOW wild type, and R356 established that the axis
  is depth-dependent: EXTRACELLULAR reduction (SPIN4-like output, SFRP5, FRZB, SMOC1) LENGTHENS;
  INTRACELLULAR reduction (tankyrase) FAILED from four independent directions; TOTAL LIGAND
  BLOCKADE (PORCN) gives the inverse zone decomposition and exhausts the plate.
  ⭐ AEBP1 IS A SECRETED PROTEIN. It sits at the extracellular depth - the only one that has ever
  worked on this axis - and unlike SPIN4 (which would need a degrader) or SFRP5 and FRZB (which
  would need supplying), the direction here is to BLOCK, which is what the pharmacopoeia does.
  ✓ Step 0 is clean: canonical Wnt is moved by nothing in this stack.
  ✓ And it is R287's LAYER and R314's antibody-tractable class - secreted, extracellular, no
  membrane to cross.

  ⛔⛔ FOUR - AND IT IS A BAND, WHICH IS WHAT STOPS IT. The mouse and the human disagree by DOSE,
  not by direction:
  · HUMAN HETEROZYGOUS loss: +1.10 cm on the purest pLoF row. TALLER.
  · MOUSE OSTEOPROGENITOR-SPECIFIC KNOCKOUT: REDUCES BODY SIZE and bone mass, impairs osteoblast
    differentiation, and recapitulates the human disease.
  · HUMAN BIALLELIC loss: Ehlers-Danlos syndrome classical-like type 2, with loose connective
    tissue, OSTEOPOROSIS and SCOLIOSIS.
  → HALF-DOSE IS TALLER, ZERO-DOSE IS SMALLER AND WEAKER. That is an INTERIOR OPTIMUM between 50
  and 100 percent of normal function, and it is the THIRD instance of R281's band - after
  SPIN4/ICAT and the FBN1-LTBP2-PLOD2 microfibril module - and the FIRST with a large human
  heterozygous effect and a mouse null on the same axis.
  ⛔ CORR-325's standing objection therefore applies with full force: NO AGENT IS TITRATED FOR A
  WINDOW LIKE THAT, and it is a harder objection than pleiotropy.
  ⭐ AND THE PAPER'S OWN THERAPY IS THE INTERNAL CONSISTENCY CHECK: it rescued the knockout's bone
  mass with BIO, a GSK3 inhibitor - i.e. by RAISING Wnt - which is precisely the shelf R356
  contraindicated on R281's grounds. Both are consistent if the null sits BELOW the optimum while
  normal sits at or slightly above it. The band is real and the two rounds agree about where it is.

  ⛔ FIVE - AND THE PRACTICAL OBJECTIONS ARE UNRESOLVED.
  · ZERO CHEMICAL MATTER: AEBP1 has NO human ChEMBL target record at all, on the proper query
    (CORR-347). The inhibition work that exists is preclinical anti-fibrotic - siRNA delivered in
    mesenchymal-stem-cell-derived nanovesicles for atrial fibrillation, and an AEBP1-inhibition
    proposal in heart failure - none of it an agent that could be obtained.
  · NO BONE-LENGTH ENDPOINT IN ANY SPECIES. The mouse paper reports BODY SIZE and bone MASS, not
    femur or tibia length, and IMPC Aebp1 heterozygote body length is +0.061 at P=0.933 with
    n=6m/7f - uninformative in both directions.
  · The conditional is OsxCre, i.e. OSTEOPROGENITOR-restricted, so it tests the osteoblast lineage
    rather than the chondrocyte or the perichondrial compartment where AEBP1 actually peaks.
  · AEBP1 is a cancer-associated-fibroblast gene with pan-cancer collagen co-expression, so
    blocking it is two-sided in the usual way.

  ⭐ SIX - COL16A1 RECORDED ALONGSIDE, WEAKER BUT REAL. pLoF <0.01% +0.851 cm at P=1.1e-04,
  best-powered row +0.176 at P=4.79e-07 across 42,606; 445 CPM at 4.7x enrichment, proliferative-
  zone peaked; three prior atlas mentions; NO human ChEMBL target and NO IMPC length row at all.
  A collagen, so the same supply-versus-block problem as ACAN.

  ⭐ WHAT THIS ROUND SETTLES. AEBP1 is the closest the inverse search came: correct direction,
  correct compartment, correct depth on a mapped axis, monotone human genetics at P=8.4e-15, and
  a secreted target class that this file has repeatedly identified as the tractable one. It fails
  on the same thing that has stopped every band in this atlas - there is no agent that delivers a
  partial, titrated reduction, and the full reduction is measured to be worse than doing nothing.
  It is recorded as the best-characterised untried target on the canonical-Wnt axis, not as a lever.
