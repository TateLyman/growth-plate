confidence: B
claim_grades:
  - claim: Partial loss of AEBP1 raises adult human height
    grade: A
    basis: >-
      35 monotone burden rows with the best-powered at P=8.39e-15 across 15,923 carriers, plus an
      independent single-variant splice donor at P=9.8e-10
  - claim: AEBP1 is a secreted brake acting in perichondrium and resting zone
    grade: B
    basis: >-
      422 CPM at 3.0x enrichment and a monotone zonal gradient replicated in both donors. Transcript
      origin, subject to CORR-351, and n=2 donors
  - claim: It acts by lowering canonical Wnt at the extracellular depth
    grade: C
    basis: >-
      the osteoprogenitor knockout shows attenuated Wnt/beta-catenin and is rescued by a GSK3
      inhibitor. That is the osteoblast lineage, not the chondrocyte, and the depth argument is
      inferred from AEBP1 being secreted
  - claim: The axis has an interior optimum between half dose and zero
    grade: B
    basis: >-
      human heterozygotes are taller, the mouse null is smaller with less bone, and the human
      biallelic disease has osteoporosis and scoliosis. Three lines, two species
  - claim: AEBP1 is a usable lever
    grade: E
    basis: >-
      NO. No chemical matter of any kind, no bone-length endpoint in any species, and an interior
      optimum for which CORR-325 says no agent is titrated
