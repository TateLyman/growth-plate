summary: 'Biglycan is the class I SLRP most closely related to decorin, differing in carrying two rather
  than one glycosaminoglycan chain, and it is the more important of the two for bone. Biglycan-null mice
  have reduced bone mass and shortened long bones with an osteoporosis-like phenotype that worsens with
  age, attributed to defective marrow stromal cell function. Direct comparison of single and double knockouts
  shows the hierarchy: Bgn deletion but not Dcn deletion reduces trabecular bone mass, with the double
  knockout worst; both genotypes lose NMR-measured bound water and fracture toughness, with the largest
  losses in Bgn-null and double-null; and AFM shows decreased in situ permanent energy dissipation with
  INCREASED elastic modulus in the extrafibrillar matrix, an effect abolished by dehydration. So the SLRPs
  make bone tougher, not stiffer, by holding water. Decorin is markedly upregulated in Bgn-null mice while
  biglycan is only modestly upregulated in Dcn-null mice, confirming biglycan is the dominant partner.
  Biglycan is X-linked in humans, and BGN variants cause Meester-Loeys syndrome (an X-linked aortopathy),
  but no human biglycan short-stature syndrome is established.'
