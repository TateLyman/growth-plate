id: matrix_gla_protein
name: Matrix Gla protein (MGP)
aliases:
- MGP
- Keutel syndrome gene
type: protein
layer: L5
stub: false
summary: 'MGP is a small vitamin-K-dependent, gamma-carboxyglutamate-containing matrix protein made by
  chondrocytes and vascular smooth muscle cells whose function is to keep soft tissue and non-hypertrophic
  cartilage unmineralized. Mgp-null mice develop to term and then die within about two months from arterial
  rupture caused by spontaneous arterial calcification, and - the point for this layer - they inappropriately
  calcify their growth plate cartilage, which leads to short stature, osteopenia and fractures. This is
  the cleanest demonstration in the literature that cartilage mineralization is actively suppressed rather
  than passively absent: withdraw one inhibitor and the proliferative cartilage mineralizes even though
  nothing about the mineral supply has changed. The gamma-carboxylation is functionally required, which
  is why warfarin causes cartilage and arterial calcification in rats and why the undercarboxylated form
  is used as a circulating biomarker. In humans, MGP loss of function causes Keutel syndrome with abnormal
  cartilage calcification. Ex vivo, MGP is one of the genes expressed more highly by the calcification-suppressing
  superficial cartilage layer in bovine osteochondral explants.'
