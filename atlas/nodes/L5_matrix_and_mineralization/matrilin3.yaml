- matrilin-3
type: protein
layer: L5
stub: false
summary: 'Matrilin-3 is a cartilage-specific oligomeric adaptor protein built around a single von Willebrand
  factor A domain plus EGF repeats and a coiled-coil oligomerisation module. It sits on the surface of
  the collagen fibril and bridges fibrils to other matrix components. Its position in the assembly hierarchy
  is established genetically: matrilin-3 fails to integrate normally into cartilage matrix in collagen
  IX-null mice, so matrilin-3 incorporation is downstream of collagen IX; and matrilin-1/matrilin-3 double-deficient
  mice have abnormally thick and irregular cartilage collagen fibrils, so the matrilins constrain fibril
  growth even though single nulls are near-normal through redundancy. In humans, missense mutations in
  the beta strands of the single A domain cause autosomal dominant multiple epiphyseal dysplasia, and
  a homozygous MATN3 mutation causes a distinct spondylo-epi-metaphyseal dysplasia. As with COMP, the
  dominant mechanism is misfolding: MED mutations cause A-domain misfolding and prevent secretion of mutant
  matrilin-3, retaining it in the ER, so the disease is again a proteinopathy rather than simple loss
  of matrix protein.'
