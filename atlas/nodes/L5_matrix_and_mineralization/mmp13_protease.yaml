id: mmp13_protease
name: MMP-13 (collagenase-3)
aliases:
- MMP13
- collagenase-3
type: protein
layer: L5
stub: false
summary: 'MMP-13 is the chondrocyte-intrinsic collagenase of the hypertrophic zone and is the enzyme that
  cleaves the triple helix of collagen II in the lower growth plate. Its expression rises steeply from
  epiphysis to metaphysis in parallel with the loss of type II collagen and the appearance of type X collagen
  and the type II C-propeptide. Mmp13-null mice have profound growth plate defects: markedly increased
  hypertrophic domains, delayed endochondral ossification, delayed formation and vascularisation of the
  primary ossification centre, and significant interstitial collagen accumulation attributable to the
  missing collagenase cleavage. Unlike the Mmp9-null, these growth plate abnormalities persist into adult
  life and phenocopy human hereditary chondrodysplasias. There is a human anchor: MMP13 variants cause
  metaphyseal anadysplasia and, more recently, a frameshift variant causing short stature via a gain-of-function
  interaction with HSPA5 and ER stress. MMP-13 is also active inside matrix vesicles, where it can activate
  latent TGF-beta, so it is not solely a bulk collagenase.'
