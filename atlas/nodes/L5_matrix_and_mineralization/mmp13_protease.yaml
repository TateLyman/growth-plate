paralog_risk: >-
  Collagen II cleavage in the lower plate is attributed exclusively to MMP-13, but MMP-13 acts
  SYNERGISTICALLY with MMP-9 on the same substrates - the Mmp9;Mmp13 double null has drastically
  shortened bones (stickens2004) - and in human tissue MMP-1/-9/-10/-11/-13 are co-localised in
  the hypertrophic zone with MMP-14 the most prominent MMP overall (haeusler2005). Separately,
  stickens2004 reports the Mmp13-null phenotype COMPLETELY RESOLVES by 12 weeks, contradicting
  inada2004 persistence into adult life. See g_para_004.
