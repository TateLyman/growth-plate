id: round408_the_volume_module_localised_and_the_export_arm_is_the_unasked_direction
name: "R408: the h_term machinery localised for the first time - within the module the cartilage-enriched members are the K-Cl EXPORTER and WNK4, not NKCC1 or SPAK, and that converts an impossible ask (a transporter ACTIVATOR) into an ordinary one (an INHIBITOR of the opposite transporter)"
aliases:
  - NKCC1 KCC1 growth plate
  - K-Cl export chondrocyte volume
  - WNK4 cartilage
  - raising hypertrophic cell volume
type: hypothesis
layer: L5
stub: false
summary: >-
  Terminal hypertrophic cell volume is roughly 80 percent of longitudinal growth and it is
  the largest term in the height identity. the_swelling_machinery_has_only_ever_been_switched_off
  established the problem: every experiment ever done on that machinery is subtractive -
  bumetanide removed about 35 percent of elongation with hypertrophic cell NUMBER unchanged,
  DIDS and EIPA the same - and three independent search angles found no study in any species
  that attempted to INCREASE growth-plate cell swelling. The clinical need on this machinery
  was always to reduce swelling, so every marketed drug on it is a blocker.
  That framing contains a hidden assumption, and this round breaks it.

  THE ASSUMPTION. Raising volume was taken to require ACTIVATING an importer - NKCC1, or the
  SPAK/OSR1 kinases that switch it on. Transporter activators are close to a nonexistent
  drug class, which is why the axis has sat for many rounds with no candidate.
  ⭐ BUT THE CELL HAS AN EXPORT ARM TOO. The K-Cl cotransporters carry potassium, chloride
  and osmotically obliged water OUT; they are what performs regulatory volume decrease.
  INHIBITING an exporter raises volume by the same arithmetic as activating an importer -
  and inhibitors are precisely what the pharmacopoeia is made of. The direction this atlas
  wants is reachable with the class of molecule that actually exists.

  AND THE LOCALISATION, WHICH HAD NEVER BEEN RUN, SAYS THE EXPORT ARM IS THE PLATE'S ARM.
  Purity-corrected human postnatal growth plate, all 12 of 12 samples, cartilage-enrichment
  ratio against calibrators of COL2A1 8.92 and PTPRC 0.00:
  ENRICHED - WNK4 4.04, CHST3 3.32, KCC1/SLC12A4 2.60, AQP1 2.23, SLC6A12 2.05.
  CONTAMINANT-LEANING - NKCC1/SLC12A2 0.25, SPAK/STK39 0.29, OSR1/OXSR1 0.30, WNK1 0.49,
  WNK2 0.23, NFAT5 0.32, KCC3 0.18, KCC4 0.48, CHST11 0.11.
  So within the volume module the members that are chondrocyte-concentrated are the K-Cl
  EXPORTER KCC1, the kinase WNK4, the 6-O-sulfotransferase CHST3, aquaporin 1 and the
  betaine transporter - and none of those five has ever been worked in this file.
  ⚠ CORR-351 GOVERNS THIS AND MUST BE STATED WITH IT. A purity ratio measures where a
  transcript ORIGINATES, not whether the protein is present or functional. NKCC1 at 0.25 is
  NOT an absence - it is present at 25.7 CPM in all twelve samples, and bush2010's bumetanide
  experiment is direct functional proof that NKCC1 carries about a third of elongation at the
  plate. The ratio reorders priorities WITHIN the module; it does not overturn a functional
  result, exactly as it did not for ESR1.

  ⭐ AND WNK4 IS THE NODE THAT DOES BOTH ARMS AT ONCE. The WNK-SPAK/OSR1 cascade phosphorylates
  the cation-chloride cotransporters reciprocally: it ACTIVATES the NKCC importers and
  INHIBITS the KCC exporters. Both of those raise cell volume. WNK4 is the only member of the
  cascade that is cartilage-enriched here, at 4.04, while WNK1, WNK2, SPAK and OSR1 are all
  contaminant-leaning. If one node were to be raised, it is that one, and it moves import and
  export in the same direction simultaneously.

  ⛔ WHAT DOES NOT EXIST, AND IT IS STILL THE BINDING PROBLEM. No K-Cl cotransporter inhibitor
  has ever been given to cartilage or a growth plate in any species - a targeted query returns
  the erythroid, neuronal and cryo-EM literature and nothing skeletal. The classical tool is
  DIOA, an erythroid K-Cl cotransport inhibitor, and a 2024 review of compounds targeting
  cation-chloride cotransporter physiology is the right index for what exists; nothing on that
  shelf is approved for this purpose or has a length endpoint. And every WNK compound ever made
  is an INHIBITOR, built for hypertension, so the WNK4 direction has the same problem the NKCC1
  direction had.

  ⛔ AND THE OBJECTION THAT COULD SINK THE WHOLE REFRAME IS ALREADY IN THIS FILE. hall2001
  showed the volume set point RE-TUNES - chondrocytes at 180, 280 and 380 milliosmolar reached
  the same terminal volume of about 645 cubic micrometres. Regulatory volume decrease is a
  deliberately redundant, layered system, and this tissue carries KCC1, KCC3, KCC4, VRAC
  (LRRC8A at 23.3 CPM) and ANO1 in parallel. Blocking one exporter may simply be compensated
  by the others, which is the same saturation objection that governs the supply class - and it
  is more serious here, because redundancy is what regulatory volume decrease is FOR.
  ✓ One piece of human genetic support survives that objection: LRRC8A burden is minus 0.272 cm
  at P=3.5e-06 across 14,588 carriers, and a LRRC8C gain-of-function that leaves VRAC stuck
  open is minus 5.1 SD in humans. A channel whose opening shortens people is a channel whose
  closure is the direction of interest - but the same table shows losing LRRC8A also shortens,
  so this is a band and not an arrow.

  WHAT THIS ROUND IS AND IS NOT. It is not a compound. It is a reframe plus the first
  localisation of the module, and together they change the shape of the ask on the largest term
  in the identity: from "find an activator of a transporter", which is close to a nonexistent
  drug class, to "find an inhibitor of a specific, cartilage-enriched exporter", which is the
  ordinary business of medicinal chemistry. Nobody has asked for that molecule because nobody
  has wanted a bigger chondrocyte.
