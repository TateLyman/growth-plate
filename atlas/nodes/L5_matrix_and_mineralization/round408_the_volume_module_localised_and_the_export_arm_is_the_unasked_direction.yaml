localization: >-
  hypertrophic chondrocyte; within the volume module the chondrocyte-concentrated members are
  the K-Cl exporter KCC1, WNK4, CHST3, AQP1 and SLC6A12
human_evidence: indirect
human_evidence_note: >-
  The localisation is human. The functional experiments on the machinery are rat organ culture,
  and every one of them is an inhibitor. The only human genetics on the module are the LRRC8A
  burden effect and the LRRC8C gain-of-function, which bracket wild type.
species_basis:
  - human
  - rat
translation_risk: high
translation_risk_reason: >-
  No agent on the export arm has ever been given to cartilage in any species, the set point is
  known to re-tune, and the export system is redundant by design.
confidence: C
claim_grades:
  - claim: >-
      Raising cell volume is reachable by INHIBITING an exporter, not only by activating an
      importer
    grade: A
    basis: >-
      arithmetic of osmotic flux. It is a reframe of the ask rather than an empirical claim, and
      its value is that inhibitors are a drug class while transporter activators are not
  - claim: >-
      Within the volume module the cartilage-enriched members are KCC1, WNK4, CHST3, AQP1 and
      SLC6A12
    grade: B
    basis: >-
      purity-corrected expression across 12 human samples with calibrators. A transcript-origin
      argument, subject to CORR-351
  - claim: NKCC1's low purity ratio is not an absence
    grade: A
    basis: 25.7 CPM in 12 of 12 samples, and bush2010's functional result at the plate
  - claim: WNK4 raises volume through both arms simultaneously
    grade: C
    basis: >-
      established WNK-SPAK/OSR1 reciprocal regulation of NKCC and KCC, applied to the one
      cascade member that is cartilage-enriched here. Never tested in cartilage
  - claim: No K-Cl cotransporter inhibitor has been given to a growth plate in any species
    grade: B
    basis: targeted query returning erythroid, neuronal and structural work and nothing skeletal
  - claim: Redundancy in regulatory volume decrease may compensate for blocking one exporter
    grade: B
    basis: >-
      hall2001's set-point re-tuning plus the parallel presence of KCC1, KCC3, KCC4, VRAC and
      ANO1. This is the objection most likely to be fatal
