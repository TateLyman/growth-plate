summary: 'Decorin is a class I small leucine-rich proteoglycan carrying a single chondroitin/dermatan
  sulphate chain whose horseshoe-shaped leucine-rich repeat core binds the collagen fibril surface and
  limits lateral fibril growth. Decorin-null mice have abnormally coarse and irregular collagen fibrils
  with skin fragility, the founding demonstration that a SLRP sets fibril diameter in vivo. In cartilage
  decorin is not distributed uniformly over fibrils: decorin-bearing and collagen IX-bearing fibrils are
  biochemically distinct subpopulations within the same mammalian cartilage, so the fibril network is
  compositionally heterogeneous at the level of individual fibrils. Decorin also sequesters TGF-beta.
  Mechanically its contribution is second to biglycan''s in bone: in single and double knockouts, Bgn
  deletion but not Dcn deletion reduces trabecular bone mass, but both reduce NMR-measured bound water
  and fracture toughness and raise extrafibrillar matrix modulus - and that modulus effect disappears
  on dehydration, showing the SLRPs act mechanically through retained water. Decorin is upregulated in
  biglycan-null mice, indicating partial compensation. No human decorin-deficiency growth phenotype is
  established.'
