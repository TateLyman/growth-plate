id: collagen_type_ix
name: Collagen type IX (COL9A1/2/3)
aliases:
- COL9A1
- COL9A2
- COL9A3
- FACIT collagen IX
type: protein
layer: L5
stub: false
summary: 'Collagen IX is a FACIT collagen that sits on the surface of the collagen II/XI fibril, covalently
  attached by lysyl-oxidase-derived pyridinoline and divalent crosslinks at at least six identified sites
  distributed across the alpha1(IX), alpha2(IX) and alpha3(IX) chains, all of which are occupied in matrix-resident
  collagen IX. Its NC4 globular domain and COL3 domain project away from the fibril surface, so collagen IX
  acts as a covalently anchored molecular projection from the fibril rather than as a load-bearing lattice
  element. It is enriched on the thinnest fibrils of the pericellular basket. Functionally
  it is not required for fibril formation: Col9a1-null mice have grossly normal skeletal development and
  only develop non-inflammatory degenerative joint disease from about four months. It is required for
  correct assembly of the fibril surface, since matrilin-3 fails to integrate normally into cartilage
  matrix in collagen IX-null mice. In humans, COL9A1/2/3 mutations cause multiple epiphyseal dysplasia
  (mild short stature and early osteoarthritis) rather than a lethal chondrodysplasia, which matches the
  mouse: collagen IX is a fibril-surface organiser rather than a load-bearing element.'
