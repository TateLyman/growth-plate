id: fibronectin_cartilage
name: Fibronectin in cartilage and growth plate
aliases:
- FN1
- fibronectin
type: protein
layer: L5
stub: false
summary: Fibronectin is the adhesive glycoprotein through which chondrocytes engage their own matrix,
  principally via alpha5beta1 integrin, and it is a node in the matrix-matrix network, binding COMP directly.
  Its relevance to this layer rests on one strong human observation and a set of weaker cell-biological
  ones. The human observation is that heterozygous FN1 mutations cause a subtype of spondylometaphyseal
  dysplasia with corner fractures - a metaphyseal, growth-plate-adjacent phenotype - so fibronectin dosage
  does affect the human physis. The cell biology is that alpha5beta1-fibronectin engagement modulates
  chondrocyte proliferation and matrix interaction, and that fibronectin fragments generated by matrix
  degradation are catabolic, inducing collagenase-3 and inflammatory mediators in chondrocytes, which
  makes fibronectin fragmentation an amplifier of matrix loss rather than a structural role. Zonal fibronectin
  distribution across the human growth plate was not established in this sweep, and this node is the thinnest
  in the layer for that reason.
