type: protein
layer: L5
stub: false
summary: 'Perlecan is a very large modular heparan sulphate proteoglycan that is a core component of the
  cartilage pericellular matrix as well as of basement membranes. In cartilage it does two things. Structurally
  it maintains cartilage integrity: perlecan-null mice die perinatally with severe chondrodysplasia, disorganised
  growth plate columns and defective cartilage matrix. Functionally it is a growth-factor reservoir: FGF-2
  is stored bound to perlecan heparan sulphate in the articular pericellular matrix and released on mechanical
  loading, making perlecan a mechanotransducer rather than a passive scaffold. The human allelic series
  is unusually informative because it is a dose series: complete functional null HSPG2 mutations cause
  dyssegmental dysplasia Silverman-Handmaker type, which is perinatal lethal, while hypomorphic mutations
  that reduce but do not abolish perlecan cause Schwartz-Jampel syndrome (chondrodystrophic myotonia)
  with short stature and myotonia compatible with survival. Perlecan is therefore dosage-sensitive in
  humans across the full range from lethal to viable.'
