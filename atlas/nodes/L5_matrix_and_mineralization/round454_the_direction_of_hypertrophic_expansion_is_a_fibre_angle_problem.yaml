id: round454_the_direction_of_hypertrophic_expansion_is_a_fibre_angle_problem
name: 'R454 - what makes hypertrophic swelling AXIAL rather than isotropic: the osmotic drive is measurably isotropic,
  the required anisotropy is only about 2.4 to 1, every other biological system that solves this does it with a
  FIBRE-WOUND JACKET at a calculable angle, and the growth plate has both fibre systems described since 1982 with
  nobody ever measuring the angle'
