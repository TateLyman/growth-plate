human_evidence_note: The human contribution is bylskiaustrow2018, in which physiological compression of an adolescent
  vertebral physis removed about a third of hypertrophic cell volume ENTIRELY from the axial dimension with width
  unchanged. The fibre-angle mechanism itself has no human measurement in cartilage.
translation_risk: high
translation_risk_reason: The mechanism is imported from hydrostatic skeletons, filament-wound pressure vessels and
  soft robotics. It predicts what is observed and has never been tested in cartilage in any species.
summary: 'R437 named ''what makes swelling AXIAL rather than isotropic'' as 18 node hits and zero ledger presence,
  and R440 measured the required anisotropy. This node states the mechanism the rest of biology uses for the same
  problem, and the one measurement that would test it.


  ONE - THE DRIVE IS ISOTROPIC AND THIS IS MEASURED IN CARTILAGE. bush2008 found the osmotically inactive fraction
  differs between proliferative and hypertrophic zones (39.5 versus 47.0 per cent) with IDENTICAL osmotic sensitivity,
  and that THE DIMENSIONS OF HYPOTONIC SWELLING DIFFERED FROM THE PREFERENTIAL LENGTHENING SEEN IN VIVO. A chondrocyte
  allowed to swell freely gets bigger, not taller. THE ANISOTROPY IS IMPOSED FROM OUTSIDE THE CELL.


  TWO - AND THE AMOUNT REQUIRED IS SMALL. From hunziker1987''s own canonical ratios - terminal cell height times
  four, volume times ten - the diameter ratio is forced to the square root of 10/4 = 1.58, against 2.15 for isotropic
  expansion. So the linear anisotropy needed is 3.91 to 1.58, about 2.47 to 1. For comparison, a printed hydrogel
  with a few per cent of aligned cellulose fibrils achieves a FOURFOLD difference in swelling strain between axes.
  This is not a large anisotropy to engineer.


  THREE - THE MECHANISM EVERY OTHER SYSTEM USES IS A FIBRE ANGLE, AND IT IS CALCULABLE. For a constant-volume cylinder
  wound with crossed helical inextensible fibres at angle theta to the long axis, enclosed volume is maximal at
  tan-squared theta = 2, i.e. THETA = 54.74 DEGREES. Below that angle pressurising SHORTENS AND FATTENS the cylinder;
  above it, pressurising LENGTHENS AND NARROWS. The same angle falls out of netting analysis from the exact 2 to
  1 hoop-to-axial stress ratio of a thin-walled pressure vessel, and McKibben pneumatic actuators reverse the sign
  of their axial work at the same angle. The pressure is a scalar; THE WALL IS THE VECTOR.

  The animal instance is the notochord: as the sheath''s fibre density rises, internal pressure rises two to threefold
  and flexural stiffness about tenfold, and the structure elongates because the sheath resists RADIAL expansion
  while permitting AXIAL. A stack of flat cells that inflates and elongates because something outside it stops it
  widening is architecturally what a chondrocyte column is - and voigt2025 already showed one gene, inppl1a, controls
  both notochord vacuolated-cell expansion and hypertrophic chondrocyte enlargement in the same fish, so the two
  systems are not merely analogous.


  FOUR - THE GROWTH PLATE HAS BOTH FIBRE SYSTEMS, DESCRIBED IN 1982, AND NOBODY HAS MEASURED AN ANGLE. Polarised-light
  survey identifies TRANSPHYSEAL fibres running from metaphyseal calcified spicules across the plate into epiphyseal
  cartilage - an axial tether - and abundant CIRCUMFERENTIAL collagen in the perichondrial groove - a hoop. THE
  FIBRE ANGLE ON WHICH THE ENTIRE HYDROSTAT ARGUMENT TURNS HAS NEVER BEEN MEASURED IN A GROWTH PLATE IN ANY SPECIES,
  by SAXS, quantitative polarised light or second-harmonic imaging.


  FIVE - AND CARTILAGE HAS PLANT BIOLOGY''S PARADOX, WHICH POINTS AT YIELD RATHER THAN STIFFNESS. prein2016 is the
  only directional mechanical measurement of growth-plate matrix that exists and it runs the wrong way: pericellular
  and territorial matrix is SOFTER than interterritorial (1.6 versus 3.6 kPa). A naive fibre-stiffness reading of
  a stiff transverse septum predicts widening; cells heighten. Plant biology has the identical paradox and dissolved
  it: rsw4 and rsw7 roots lose growth anisotropy while cortical microtubules and cellulose microfibrils are neither
  depleted nor disoriented, so oriented fibres are INSUFFICIENT - and expansin lowers the wall''s YIELD THRESHOLD
  without changing stiffness or hydrolysing anything. Under Lockhart, rate = extensibility times (pressure minus
  yield), anisotropy needs extensibility OR YIELD to differ by axis, and stiffness is only the first of those. R448
  established that ANIMALS HAVE NO EXPANSIN and that every animal matrix-loosening tool is a protease - which predicts
  that cartilage''s directional yield must be PROTEOLYTIC, and MMP13 and MMP9 double inactivation does expand the
  hypertrophic zone.


  SIX - THE FALSIFIABLE PREDICTION AND THE FREE EXPERIMENT. Confinement predicts that releasing the hoop makes cells
  WIDEN instead of HEIGHTEN even at unchanged volume - testable by unilateral circumferential division of the perichondrial
  ring with the contralateral side as sham, scoring terminal hypertrophic cell HEIGHT and WIDTH SEPARATELY rather
  than zone height. And the cheapest version needs no animal at all: archived histology exists for CNP analogue,
  GH, IGF-I, FGFR3-inhibitor and loading studies, and NO GROWTH-PROMOTING AGENT IN THIS FILE HAS EVER BEEN SCORED
  ON CELL HEIGHT VERSUS CELL WIDTH.'
