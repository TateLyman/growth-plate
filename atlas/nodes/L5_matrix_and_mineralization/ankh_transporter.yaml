id: ankh_transporter
name: ANKH / ANK (progressive ankylosis protein)
aliases:
- ANKH
- Ank
- progressive ankylosis protein
type: protein
layer: L5
stub: false
summary: ANKH is a multipass plasma membrane protein of hypertrophic and terminally differentiating growth
  plate chondrocytes that was for two decades described as a PPi transporter carrying intracellular PPi
  to the extracellular space. That description is wrong in its mechanism. In HEK293 cells engineered to
  lack ENPP1 entirely, introducing ANKH produces robust ATP release with NO increase in extracellular
  PPi, and Enpp1-/- mouse bone contains under 2.5% of wild-type PPi despite intact Ank. ANKH therefore
  exports nucleoside triphosphates, predominantly ATP, which ENPP1 then converts extracellularly to PPi
  and AMP; the same is true of ABCC6, so both transporters that maintain plasma PPi do so by extruding
  NTPs. ANKH supplies about 25% of plasma PPi and ABCC6 60-70%. This matters for the growth plate because
  the older chondrocyte literature - blocking Ank raises intra- and extracellular PPi and blocks mineralization,
  overexpressing Ank in hypertrophic cells lowers PPi and induces alkaline phosphatase, collagen I, osteocalcin
  and mineralization - was interpreted as direct PPi transport and must be reread as ATP export plus local
  ENPP1 activity. ANK expression in growth plate chondrocytes is oxygen-dependent and HIF-1 regulated,
  tying the hypoxic gradient across the plate to PPi handling. In humans ANKH gain-of-function causes
  craniometaphyseal dysplasia and chondrocalcinosis; loss causes a distinct skeletal phenotype.
