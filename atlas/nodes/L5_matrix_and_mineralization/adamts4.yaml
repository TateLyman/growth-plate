type: protein
layer: L5
stub: false
summary: 'ADAMTS4 is a secreted aggrecanase that cleaves aggrecan at the Glu373-Ala374 bond in the interglobular
  domain and at further sites in the chondroitin sulphate region, generating the ARGS neoepitope fragments
  found in human synovial fluid. In mouse it is dispensable: Adamts4-null mice are not protected from
  surgical osteoarthritis whereas Adamts5-null mice are, and Adamts4/Adamts5 double-null mice are physiologically
  normal, which means neither aggrecanase is required for skeletal growth or for growth plate development
  in mouse. In human cartilage explants the division of labour is different - both ADAMTS-4 and ADAMTS-5
  contribute to aggrecan degradation - so the murine ADAMTS5 dominance should not be assumed for humans.
  ADAMTS4 is inhibited potently and selectively by TIMP-3 (sub-nanomolar Ki for the N-terminal domain)
  while TIMP-1, -2 and -4 are weak or inactive.'
