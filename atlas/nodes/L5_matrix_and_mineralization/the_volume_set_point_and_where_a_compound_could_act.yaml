id: the_volume_set_point_and_where_a_compound_could_act
name: The swelling axis mapped to its control points - the target is not the pump but the SET-POINT, the human genetics says a constitutively open shrinking channel costs 5 SD of height, and the one approved compound on that node has bad pharmacology
aliases:
- the volume set-point
- can we drug the swelling
- VRAC and TIMES syndrome
- block the shrinking not the swelling
type: intervention
layer: L5
stub: false
summary: 'THE INSTRUCTION WAS TO GO ALL THE WAY INTO bush2010 AND COME BACK WITH A COMPOUND. Five full
  texts later the honest answer is that the axis is REAL BUT SMALLER AND HARDER THAN I FIRST WROTE, and
  this summary replaces one built on abstracts. See CORR-101.
  WHAT THE FULL TEXTS TOOK AWAY. FIRST, THE ENLARGEMENT IS NOT MOSTLY SWELLING. bush2008, in living rat
  growth plate by 2-photon microscopy over 0-580 mOsm, found the osmotically INACTIVE fraction and the
  osmotic sensitivity essentially identical between zones - 39.5 vs 47.0 per cent and 15.5 vs 15.5
  percent-volume per Osm, neither significant. If enlargement were swelling those must diverge. The
  stereological swelling model requires an inactive fraction near 80 per cent in hypertrophic cells; they
  measure 53. Their conclusion is that hypertrophy - a proportional increase of everything - contributes
  more than swelling. That is a direct hit on the premise
  terminal_cell_volume_is_the_undefended_term is built on, and it means h_term is NOT free: proportional
  enlargement costs biosynthesis even if it spends no divisions.
  SECOND, THE SWELLING YOU CAN INDUCE IS IN THE WRONG AXIS. In the same paper, hypotonic swelling produced
  NO preferential increase in length, width or depth, whereas in vivo the cell lengthens preferentially.
  A swelling agent makes a chondrocyte fatter, not taller. Notably the matrix offered little restriction
  to swelling, so the lacuna is not what makes the growth directional either.
  THIRD, THE SET-POINT RE-TUNES. hall2001 - the paper I ranked fifth and should have ranked first -
  incubated chondrocytes chronically at 180, 280 or 380 mOsm and found them ALL AT THE SAME VOLUME, about
  645 cubic micrometres, with the taurine-efflux set-point tracking whatever ambient osmolarity it was
  given. Acute RVD (bush2001, t-half about 8 min, back to within 3 per cent by 20 min) could be dismissed
  as a transient. A set-point that re-tunes across a two-fold osmolarity range cannot.
  FOURTH, ONE OF MY OWN CLAIMS INVERTS. I told the user that bumetanide plus DIDS reaching 80 per cent
  inhibition extended the swelling account. loqman2013 Table II shows DIDS at 250 micromolar suppressing
  growth about 70 per cent while hypertrophic cell volume goes UP, 1,880 to 2,660 cubic micrometres. DIDS
  does not act through cell volume. And the only agent that did cut volume, EIPA, cut it by about 71 per
  cent in the PROLIFERATIVE zone as well, at 444 micromolar - the signature of global pH failure, not of a
  hypertrophy-specific lever.
  WHAT SURVIVES, AND IT IS NOT NOTHING. bush2010 itself stands: bumetanide removed about 35 per cent of
  elongation with hypertrophic cell number at 193 against 192 - though that paper never measured cell
  volume in the bumetanide arm, it inferred it from zone height. The emptiness stands: no agent has been
  given in the upward direction in any species. And the human genetics stands and is arguably
  STRENGTHENED by the RVD finding - quinodoz2025 describes two unrelated children with de novo monoallelic
  GAIN-OF-FUNCTION variants in LRRC8C, cryo-EM-confirmed to conduct under ISOTONIC conditions where
  wild-type channels are shut, presenting with TIMES syndrome: Telangiectasia, Intellectual disability,
  Microcephaly and METAPHYSEAL DYSPLASIA, Eye abnormalities and SHORT STATURE, one child at 112 cm at 12
  years, MINUS 5.1 SD, with metaphyseal fraying on radiographs. If the cell defends its volume, a channel
  stuck open defeats the defence, and the cost is five standard deviations.
  SO THE TARGET IS THE SET-POINT, AND THE SET-POINT IS NOW A MEASURED, ADAPTABLE, EXPERIMENTALLY TRACTABLE
  QUANTITY RATHER THAN A METAPHOR. What nobody has asked is what sets it DEVELOPMENTALLY - what makes a
  hypertrophic chondrocyte defend eight thousand femtolitres where a proliferative one defends six
  hundred. That is the question this node now poses.
  THE COMPOUNDS, BY NODE, WITH WHAT SURVIVED. (1) NKCC1 ACTIVATION - nothing exists; zhao2025a has solved
  the PHOSPHO-ACTIVATED conformation so a positive allosteric modulator is structurally conceivable. (2)
  THE PHOSPHATASE SWITCH - PP1 dephosphorylates SPAK; PPP1CB is the most abundant phosphatase in the human
  plate at 56-87 per cent of cells in 4 of 4 donors, and this would converge with cantharidin and LB-100
  already held at the NPR2 node. The supporting evidence is a 2025 PREPRINT about KCC2 in neurons, so this
  is a hypothesis to test, not a finding. (3) VRAC BLOCKADE - the best-anchored node by human genetics.
  DCPIB is the tool; FLAVOXATE, an approved urinary antispasmodic, blocks VRAC at IC50 1.8 micromolar;
  tamoxifen is disqualified as an oestrogen ligand in an aromatase-inhibitor stack. But a 2026 preprint
  reports VRAC blockers as a class bind albumin, carry off-target toxicity and fail to phenocopy LRRC8A
  deletion. (4) THE RVD OSMOLYTE PATHWAY IS NOW CLOSED TWICE - ALOX5 is 2 of 4 donors and zonally low, AND
  hall2001 states the pathway is NOT activated through arachidonic acid metabolites, so the zileuton lead
  fails on mechanism as well as expression.
  AND THE UNRESOLVED SAFETY OBJECTION IS UNCHANGED: VRAC executes apoptotic volume decrease, the terminal
  hypertrophic chondrocyte must be cleared for ossification, and blocking that gives an expanded
  hypertrophic zone over impaired bone - the gerber1999 configuration this project named and REJECTED and
  the CORR-044 trap. No study has measured VRAC in a growth plate at all.'
quantitative:
- parameter: 'THE HUMAN GENETIC PROOF OF DIRECTION - a constitutively OPEN cell-shrinking channel costs
    five standard deviations of height'
  value: 112 cm at 12 years, -5.1 SD, with metaphyseal dysplasia
  unit: centimetres and standard deviations of stature
  conditions: 'quinodoz2025. Two unrelated children, de novo MONOALLELIC variants in LRRC8C at the
    pore-to-cytoplasmic-domain boundary, a region depleted of variation in controls - p.(Leu400IlefsTer8)
    in an Italian boy and p.(Val390Leu) in a Canadian girl. Cryo-EM showed both mutant proteins assemble
    normally but with increased flexibility, and when co-expressed with the obligatory LRRC8A subunit
    they show ENHANCED ACTIVATION, conducting under ISOTONIC conditions where wild-type channels are
    closed - a dominant gain of function. The authors name the disorder TIMES syndrome for
    Telangiectasia, Intellectual disability, Microcephaly and metaphyseal dysplasia, Eye abnormalities
    and Short stature. Radiographs of P1 show thin diaphyses of radius, ulna, tibia and fibula with
    marked metaphyseal fraying.'
  species: human
  source_ref: quinodoz2025
  uncertainty: 'THE GENOTYPE-PHENOTYPE LINK IS THE AUTHORS FINDING; THE GROWTH-PLATE MECHANISM IS THEIR
    STATED SPECULATION AND MUST NOT BE PROMOTED. They write that an "educated guess" would implicate
    chondrocytes undergoing hypertrophy in the growth plate and that "in theory" inappropriate channel
    activation might cause exaggerated loss of water and anions and hence cell shrinkage. That is a
    hypothesis they label as one. This atlas has made exactly this error before (CORR-081) and is not
    making it again. THE OTHER LIMITS ARE HEAVY. n=2. The syndrome is multisystem and severe - microcephaly,
    telangiectasia, osteopenia with multiple fractures, hypothyroidism, severe hypertension from age 15,
    recurrent gastrointestinal bleeding with haemoglobin down to 2.1 g/dl, and death at 20 - so short
    stature could be secondary to chronic illness rather than to a growth-plate mechanism. WHAT RESISTS
    THAT READING is that the skeletal phenotype is specifically METAPHYSEAL - metaphyseal dysplasia and
    metaphyseal fraying are physeal findings, not the generic proportionate shortness of chronic disease.'
- parameter: 'THE TARGET IS A SET-POINT, NOT A PUMP - and two transporters each cost half the growth
    without changing plate length or cell number'
  value: 50 per cent growth suppression at about 250 micromolar EIPA and about 25 micromolar DIDS
  unit: per cent suppression of rudiment growth; micromolar
  conditions: 'loqman2013, READ AT ABSTRACT LEVEL ONLY - FULL TEXT NOT OBTAINED. P7 Sprague-Dawley rat
    bone rudiments. EIPA (NHE1) and DIDS (AE2) each suppressed rudiment growth 50 per cent at about 250
    and 25 micromolar respectively. Both DECREASED the size of the hypertrophic zone (P<0.05) with NO
    effect on overall growth plate length or cell density. In situ chondrocyte volume in proliferative
    AND hypertrophic zones fell with EIPA (P<0.01) but NOT with DIDS. Immunohistochemistry: NHE1 high and
    constant along the plate then declining steeply in the LATE hypertrophic zone; AE2 low in
    proliferative cells, rising to a maximum in the EARLY hypertrophic zone, then falling rapidly - which
    the authors read as AE2 governing the proliferative-to-hypertrophic TRANSITION. They attribute the
    EIPA effect to a reduction in the chondrocyte VOLUME SET-POINT.'
  species: rat
  source_ref: loqman2013
  uncertainty: 'THE PHRASE "VOLUME SET-POINT" IS WHY THIS ROW EXISTS AND IT IS ALSO WHY THE FULL TEXT IS
    NEEDED. If the transporters set a defended target volume rather than simply pumping water, then the
    intervention that matters is one that RAISES the target, and single-transporter agonism may be
    absorbed by the regulation. The dissociation in this abstract is itself informative: EIPA lowered cell
    volume and DIDS did not, yet both suppressed growth, so DIDS must act on something other than steady
    state volume - the authors suggest the transition. CONCENTRATIONS ARE THE USUAL PROBLEM AND ARE WORSE
    HERE THAN IN bush2010: EIPA at 250 micromolar is three to four orders of magnitude above its NHE1
    IC50, and DIDS is a promiscuous anion-transport inhibitor that also abolishes SLC26A2-mediated
    sulfate uptake in these same cells. NEITHER AGENT IS SELECTIVE AT THESE DOSES and the abstract cannot
    say how the authors bounded that.'
- parameter: 'THE VOLUME IS DEFENDED TWICE OVER - acutely by RVD in minutes, and chronically by a
    SET-POINT THAT RE-TUNES to whatever osmolarity it is given'
  value: 'RVD t-half about 8 min back to within about 3 per cent of initial by 20 min; and cells
    chronically held at 180, 280 or 380 mOsm all settle at THE SAME volume, about 645 cubic micrometres'
  unit: minutes; per cent of initial volume; cubic micrometres
  conditions: 'bush2001 and hall2001, both now READ IN FULL. bush2001 - bovine articular chondrocytes in
    situ and isolated, confocal at 21 C, challenged from 280 to 250 or 180 mOsm: swelling complete within
    about 90 s, then RVD with t-half about 8 min, all three cartilage zones at equal rates, isolated cells
    behaving identically to in situ cells, blocked by REV5901 - so RVD requires no cell-matrix
    interaction. hall2001 - THE DECISIVE ONE. Chondrocytes chronically incubated at 180, 280 or 380
    mOsm/l were NOT different in volume (about 645 cubic micrometres) and the swelling-activated taurine
    efflux SET-POINT tracked the ambient osmolarity in each case. kerrigan2008 - about 50 per cent of
    freshly isolated cells show robust RVD; blocked by REV5901 (4 +/- 2 per cent still responding) and by
    2 mM EGTA (18 +/- 5 per cent) but NOT by gadolinium, so RVD is Ca2+-dependent and not through
    stretch-activated cation channels. Cartilage interstitial osmolarity is 350-450 mOsm, well above
    plasma.'
  species: bovine
  source_ref: hall2001
  uncertainty: 'THE CHRONIC RESULT IS WHAT MATTERS AND IT IS BAD FOR THE SIMPLE VERSION OF THIS AXIS.
    Acute RVD could be dismissed as a transient; a set-point that RE-TUNES to a doubled or halved ambient
    osmolarity and returns the cell to the same volume cannot. It means chronic osmotic manipulation is
    homeostatically cancelled, and it raises the bar for any agent acting on a single transporter, because
    the regulation will absorb it. IT ALSO REFRAMES THE TARGET USEFULLY: the set-point is a real,
    measurable, adaptable quantity, and what sets it DEVELOPMENTALLY - what makes a hypertrophic
    chondrocyte defend 8000 femtolitres where a proliferative one defends 600 - has never been asked.
    THE LIMITS: articular chondrocytes, bovine, and hall2001 measured volume by confocal on isolated
    cells. Whether a growth-plate chondrocyte mid-hypertrophy re-tunes the same way is unmeasured and is
    the question that decides the axis. One useful negative: hall2001 states the taurine pathway is NOT
    activated through arachidonic acid metabolites, which closes the zileuton lead on mechanism as well
    as on ALOX5 expression.'
- parameter: 'THE DIDS DISSOCIATION - 70 per cent of growth lost while hypertrophic cells got BIGGER,
    which removes DIDS from the swelling story entirely'
  value: 'DIDS 250 micromolar: hypertrophic cell volume 1,880 +/- 230 to 2,660 +/- 419 cubic micrometres
    (NS, went UP). EIPA 444 micromolar: proliferative 761 +/- 50 to 211 +/- 26 and hypertrophic 2,044 +/-
    219 to 586 +/- 54, both P<0.01'
  unit: cubic micrometres of in situ chondrocyte volume
  conditions: 'loqman2013 Table II, NOW READ IN FULL. P7 rat metatarsal, 24 h. Control growth 6.2 +/- 1.3
    per cent (DIDS series) and 7.9 +/- 0.5 per cent (EIPA series, n=36); IC50 about 25 micromolar DIDS and
    250 micromolar EIPA; DIDS at 100 micromolar inhibits anion exchange over 90 per cent and bone growth
    about 70 per cent. VIABILITY WAS CONTROLLED - live:dead by CMFDA/PI unchanged at both working
    concentrations. Late hypertrophic zone height was NOT significantly reduced in raw micrometres (144
    +/- 18 to 116 +/- 11 for DIDS; 147 +/- 19 to 117 +/- 19 for EIPA) and reached significance only when
    normalised as a percentage of total plate length (22.6 to 17.5 and 21.9 to 17.3, P<0.05). Hypertrophic
    zone cell density unchanged in both.'
  species: rat
  source_ref: loqman2013
  uncertainty: 'THIS ROW EXISTS BECAUSE IT CORRECTS ME. I told the user that bumetanide plus DIDS reaching
    80 per cent inhibition in bush2010 extended the swelling account. Table II says DIDS suppresses growth
    about 70 per cent while hypertrophic cell volume, if anything, RISES - so whatever DIDS does to bone
    length, it is NOT via cell volume, and the DIDS component of that 80 per cent cannot be counted as
    swelling. CORR-101. THE EIPA RESULT DOES NOT RESCUE IT EITHER: 444 micromolar is three to four orders
    of magnitude above the NHE1 IC50 and it cut volume by about 71 per cent in the PROLIFERATIVE zone as
    well as the hypertrophic, which is not the signature of a hypertrophy-specific swelling lever but of
    global pH failure - and the authors themselves assign NHE1 a housekeeping pH role during raised
    chondrocyte metabolism. The one clean thing here is the viability control and the unchanged cell
    density, which do exclude cell death as the mechanism.'
- parameter: 'WHAT EXISTS PHARMACOLOGICALLY ON EACH NODE - and the one approved compound has bad
    pharmacology'
  value: 'NKCC1 activator - none. VRAC blockers - DCPIB (tool), flavoxate IC50 1.8 micromolar (approved),
    tamoxifen 84-85 per cent block at 10 micromolar (disqualified)'
  unit: micromolar and regulatory status
  conditions: 'zhang2026b - flavoxate, an approved urinary antispasmodic, inhibits VRAC currents with
    IC50 1.8 micromolar and about 78 per cent block at 30 micromolar in HEK293 under hypotonic
    conditions; its active metabolite MFCA (46 per cent at 30 micromolar) and 3-methylflavone (35 per
    cent) are weaker; the same authors state plainly that NO SPECIFIC INHIBITORS of VRAC currently exist.
    zhao2025a - cryo-EM co-structures of PHOSPHO-ACTIVATED human NKCC1 with furosemide, bumetanide and
    torsemide, showing the phosphorylated N-terminal segment engaging the C-terminal domain, so the ACTIVE
    conformation of the target is now structurally defined even though no activator exists. Tamoxifen
    blocks VRAC 84-85 per cent at 10 micromolar but is an oestrogen-receptor ligand with partial agonism
    at bone and is excluded from a stack whose duration arm is aromatase inhibition.'
  species: not_applicable
  source_ref: zhang2026b
  uncertainty: 'THE PHARMACOLOGY ON THE BEST NODE IS THE WORST PART OF THIS ENTRY AND IT IS DISQUALIFYING
    FOR NOW. A 2026 preprint titled for the problem reports that commonly used VRAC blockers bind ALBUMIN
    heavily, carry substantial off-target toxicity, and repeatedly FAIL TO REPRODUCE the phenotype of
    LRRC8A deletion - which is the standard by which a blocker should be judged. This atlas already
    tracks protein binding as a first-order variable (erdafitinib is 99.7 per cent AGP-bound), and a
    compound whose free fraction collapses in serum is not a compound. Flavoxate is approved, oral and
    cheap, and its VRAC IC50 of 1.8 micromolar is real, but it was measured in HEK293 cells under
    hypotonic challenge with no cartilage, no growth endpoint and no free-concentration analysis, and
    flavoxate is a smooth-muscle antispasmodic with anticholinergic and calcium-channel actions of its
    own. NAMED AS THE ONLY APPROVED COMPOUND ON THE NODE, NOT RECOMMENDED.'
localization:
- 'growth plate hypertrophic zone: where the volume set-point is expressed as height per cell'
- 'growth plate, all zones: LRRC8A detected 16.1/20.4/20.2/16.8 per cent of cells across stem,
  proliferative, prehypertrophic and hypertrophic'
human_evidence: direct
human_evidence_note: The direction of the axis is anchored by a human dominant gain-of-function syndrome
  with a measured stature deficit and a metaphyseal radiographic phenotype. Everything about the
  machinery itself is rat or bovine, and three of the five key sources were read at abstract level only.
species_basis:
- human
- rat
- bovine
translation_risk: high
translation_risk_reason: Three of the five load-bearing sources are ABSTRACT ONLY, the volume-regulation
  data are from ARTICULAR rather than growth-plate chondrocytes, the inhibitor concentrations in the
  rodent work are far above selective range, and the only approved compound on the best node has
  documented albumin binding and off-target toxicity.
confidence: D
claim_grades:
- claim: A constitutively open VRAC causes severe short stature with a metaphyseal growth-plate phenotype
    in humans.
  grade: C
  basis: Two unrelated children with de novo monoallelic variants, cryo-EM-confirmed gain of function
    conducting at isotonic conditions, one with height -5.1 SD and metaphyseal fraying on radiographs.
    n=2, multisystem severe disease that could confound stature, and the growth-plate mechanism is the
    authors' explicitly labelled speculation rather than a measurement.
- claim: Chondrocyte volume is defended twice - acutely by RVD and chronically by a set-point that
    re-tunes to ambient osmolarity.
  grade: B
  basis: Two full texts. bush2001 - RVD t-half about 8 min, recovery to within 3 per cent by 20 min, all
    zones, isolated cells identical to in situ. hall2001 - cells chronically held at 180, 280 or 380 mOsm
    all settle at about 645 cubic micrometres. Bovine ARTICULAR chondrocytes; whether a growth-plate cell
    mid-hypertrophy re-tunes the same way is unmeasured and decides the axis.
- claim: The enlargement of growth-plate chondrocytes is largely SWELLING rather than proportional
    hypertrophy.
  grade: X
  basis: RETRACTED, CORR-101. bush2008 in living tissue finds the osmotically inactive fraction and
    osmotic sensitivity indistinguishable between proliferative and hypertrophic zones, where the swelling
    model requires them to diverge, and computes that the stereological account needs an inactive fraction
    near 80 per cent against 53 measured. The atlas h_term thesis rested on this and must be weakened -
    enlargement may spend no divisions, but it is not free.
- claim: Induced osmotic swelling would add height.
  grade: E
  basis: bush2008 found NO preferential increase in length, width or depth under hypotonic challenge,
    against the preferential lengthening seen in vivo. Isotropic swelling adds girth. Whatever makes the
    in vivo enlargement directional is not osmotic and is not the matrix, which offered little
    restriction.
- claim: DIDS supports the swelling account of longitudinal growth.
  grade: X
  basis: RETRACTED, CORR-101. I cited bumetanide plus DIDS reaching 80 per cent inhibition as extending
    the swelling case. loqman2013 Table II shows DIDS at 250 micromolar suppressing growth about 70 per
    cent while hypertrophic cell volume rises from 1,880 to 2,660 cubic micrometres. DIDS does not act
    through cell volume.
- claim: The right target on this axis is the volume SET-POINT rather than any single transporter.
  grade: D
  basis: The framing of loqman2013, taken from an abstract, supported by the dissociation that EIPA
    lowered cell volume and DIDS did not while both suppressed growth by 50 per cent. A conceptual claim
    resting on one abstract from one group.
- claim: A usable compound exists today for the upward direction on this axis.
  grade: E
  basis: NO. There is no NKCC1 activator of any kind. The best-supported node is VRAC blockade, where the
    only approved agent is flavoxate, never tested on cartilage, and where a 2026 preprint reports that
    VRAC blockers as a class bind albumin, carry off-target toxicity and fail to phenocopy LRRC8A
    deletion. Stated so the node is not mistaken for a recommendation.
- claim: Blocking VRAC would be safe in a growth plate.
  grade: E
  basis: UNKNOWN AND WITH A SPECIFIC REASON TO DOUBT IT. VRAC executes apoptotic volume decrease, and the
    terminal hypertrophic chondrocyte must be cleared for ossification to proceed. Blocking clearance
    gives an expanded hypertrophic zone over impaired bone - the gerber1999 configuration this project
    named and rejected, and the CORR-044 trap where zone size rose and length fell.
key_refs:
- ref_id: quinodoz2025
  year: 2025
  type: primary
  one_line_finding: De novo gain-of-function LRRC8C variants leave the VRAC open at isotonic conditions
    and cause TIMES syndrome - metaphyseal dysplasia and short stature at -5.1 SD.
- ref_id: loqman2013
  year: 2013
  type: primary
  one_line_finding: 'ABSTRACT ONLY: EIPA and DIDS each suppress rat rudiment growth 50 per cent and shrink
    the hypertrophic zone without changing plate length or cell density; the authors attribute it to a
    reduced chondrocyte VOLUME SET-POINT.'
- ref_id: bush2008
  year: 2008
  type: primary
  one_line_finding: 'ABSTRACT ONLY: osmotically inactive fraction and osmotic sensitivity do NOT differ
    between proliferative and hypertrophic zones, and hypotonic swelling produces different dimensions
    from the preferential lengthening seen in vivo.'
- ref_id: bush2001
  year: 2001
  type: primary
  one_line_finding: 'ABSTRACT ONLY: chondrocytes swell in 90 s then execute regulatory volume decrease
    with t-half about 8 min, back to within 3 per cent of starting volume by 20 min.'
- ref_id: zhao2025a
  year: 2025
  type: primary
  one_line_finding: The phospho-ACTIVATED conformation of human NKCC1 is now solved by cryo-EM, so a
    positive allosteric modulator is structurally conceivable even though none exists.
- ref_id: zhang2026b
  year: 2026
  type: primary
  one_line_finding: Flavoxate, an approved drug, blocks VRAC with IC50 1.8 micromolar - the only marketed
    compound on the best-supported node, and never tested on cartilage.
