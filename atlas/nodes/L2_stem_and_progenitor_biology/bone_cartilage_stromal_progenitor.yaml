id: bone_cartilage_stromal_progenitor
name: Bone, cartilage and stromal progenitor (BCSP)
aliases:
- BCSP
- pre-BCSP
- CD105+ skeletal progenitor
type: cell_type
summary: 'The BCSP is the multipotent but non-self-renewing tier immediately below the mSSC: CD45-Ter119-Tie2-AlphaV+Thy-6C3-CD105+,
  with the CD105-CD200- pre-BCSP as an intermediate. Clonally it produces chondrocytes, osteogenic cells
  and at least three stromal subsets, but it does not regenerate the mSSC, which is the operational difference
  between a progenitor and a stem cell in this scheme. The earlier CD45-Tie2-AlphaV+CD105+Thy1- fetal
  population recruits host vasculature and builds an ectopic ossicle containing a functional long-term
  HSC niche when placed under the kidney capsule, which is the origin of the claim that endochondral ossification
  is required to construct a marrow niche. In the growth plate, 27.4% of PTHrP-mCherry+ resting chondrocytes
  carry the BCSP phenotype and 53.4% of BCSPs are PTHrP-mCherry+, so the immunophenotypic tiers and the
  anatomical zones cut across each other rather than nesting cleanly.'
