localization:
- 'human upper resting zone GP1: the nine named antagonists and four ligands are the WNT module this cluster
  runs'
human_evidence: direct
human_evidence_note: >-
  Human growth plate single-cell data from four donors, as published. This node adds no new measurement -
  it recovers names and group boundaries from a published figure and computes denominators from KEGG.
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  No cross-species inference is made. The one comparison drawn is that the mouse root cluster runs WIF1 and
  FRZB while the human runs WIF1 but not FRZB, which is recorded as a partial rather than a full
  convergence.
confidence: B
confidence_reason: >-
  Graded B for the gene identities and group assignment, which rest on a published figure read at high
  magnification with the boundaries fixed by two independent constraints that agree. Not A, because it is a
  figure read rather than a table, PORCN's membership is a curation artefact, and one label - ZNF3 - is
  almost certainly a misprint for ZNRF3. The confound finding is graded with the node.
