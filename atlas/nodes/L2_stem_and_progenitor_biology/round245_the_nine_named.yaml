stub: false
summary: |
  ROUND 244 CONCLUDED THE NINE COULD NOT BE NAMED AND THAT THE ONLY ROUTE LEFT WAS TO EMAIL THE AUTHORS.
  THAT WAS WRONG, AND IT WAS WRONG IN A LAZY WAY: the names are printed in the published figure. They are
  inside an embedded raster, so they do not appear in the PDF text layer and did not appear in any of the
  text extractions this atlas had been reading for a week. Extracting the image and reading it settles it.

  HOW IT WAS DONE, SO IT CAN BE CHECKED. Panel R of Fig. 3 is embedded image xref 142 on page 6 of the
  published PDF, native 2177 x 576. The axis ticks were detected computationally: EXACTLY 28, evenly spaced
  at 72.5 pixels, from x = 157 to x = 2120. Each label was then read at four times magnification. The four
  category captions - WNT Coreceptors, WNT receptors, Soluble WNT inhibitors, WNT ligands - ARE live text in
  the PDF, with pixel centres at 338, 897, 1550 and 2011.

  THE GROUP BOUNDARIES WERE NOT GUESSED. A contiguous 6/9/9/4 split puts the group centres at 338, 884, 1538
  and 2011 - residuals of 0, 13, 12 and 0 pixels against a 72.5 pixel column. The competing 6/9/8/5 split,
  which would make PORCN a ligand, gives residuals of 48 and 37. AND THE 6/9/9/4 SPLIT REPRODUCES THE
  PAPER'S OWN SENTENCE EXACTLY - four ligands and nine soluble inhibitors. Two independent constraints, one
  geometric and one textual, agree.

  THE ANSWER.

  - NINE SOLUBLE WNT INHIBITORS: WIF1, SERPINF1, DKK3, DKK1, SOSTDC1, SFRP1, SFRP2, SFRP5, PORCN
  - FOUR WNT LIGANDS: WNT8A, WNT3, WNT3A, WNT9A
  - nine receptors: FZD6, FZD3, FZD1, FZD9, FZD7, FZD5, FZD2, FZD4, FZD8
  - six coreceptors: APCDD1, RNF43, ZNF3 (as printed - see below), RYK, LRP6, LRP5

  SFRP1 IS CONFIRMED INDEPENDENTLY. Round 243 recovered SFRP1 alone, off the ligand-receptor panel as an
  autocrine SFRP1 -> FZD2 pair with GP1 as both source and target. It appears here in the inhibitor block,
  gp1-maximal, from a different figure by a different route.

  THREE THINGS THAT ARE WRONG WITH THE PANEL AS PRINTED, RECORDED RATHER THAN TIDIED AWAY.

  ONE - ZNF3 IS ALMOST CERTAINLY ZNRF3. ZNF3 is a zinc finger protein with no role in WNT signalling and is
  NOT in KEGG:04310; ZNRF3 is the pathway member, a transmembrane E3 ligase that degrades frizzled. Every
  other gene in the panel is a KEGG:04310 member. The label is recorded AS PRINTED and flagged, not silently
  corrected.

  TWO - THE PANEL IS NOT THE KEGG SET. DKK3 and SOSTDC1 are genuinely absent from current KEGG:04310, so the
  panel is KEGG plus curated additions, or an older release. Current membership is 178 against the paper's
  174. The '174 genes of the KEGG:04310 pathway' framing and the panel do not correspond one to one.

  THREE - AND THIS IS THE ONE THAT MATTERS. 'NINE AGAINST FOUR' COMPARES CATEGORIES OF DIFFERENT SIZES AND
  MEANS LITTLE ON ITS OWN. KEGG:04310 contains NINETEEN WNT ligands and THIRTEEN genuinely secreted
  antagonists. So GP1 has four of nineteen ligands on - 21 per cent - and six of thirteen KEGG antagonists
  plus two more from outside it - 46 per cent. THE ASYMMETRY IS REAL AND IT IS A PROPORTION, NOT A RAW
  COUNT, and stating it as a proportion is both more defensible and roughly twice as strong.

  WHAT GP1 POINTEDLY DOES NOT EXPRESS is as informative as what it does: not SFRP4, not FRZB, not DKK2, not
  DKK4, not SOST, not NOTUM, not CER1. Round 243 found that the MOUSE root cluster runs WIF1 and FRZB
  instead, and the human cell has WIF1 but not FRZB - so even the class-level convergence is partial.

  NOW THE PART THAT CUTS AGAINST ROUNDS 241 AND 243, AND IT WAS FOUND BY DOING THE RECONSTRUCTION PROPERLY.
  Reading the gp1 row across all 28 columns, SEVENTEEN OF TWENTY-EIGHT GENES ARE gp1-MAXIMAL - INCLUDING ALL
  FOUR LIGANDS. WNT3, WNT3A, WNT8A and WNT9A all peak in gp1. If the root cell were an antagonist source in
  the sense those rounds implied, the ligands should not peak there as well.

  ROUND 244 ALREADY ESTABLISHED WHY: root-region cells in this dataset carry more transcript overall, and
  scaling within a gene across clusters does NOT correct for detection depth. THE REDNESS OF THE gp1 ROW IS
  THEREFORE NOT EVIDENCE OF ANTAGONIST BIAS. It is the same confound, now visible in the authors' own
  figure rather than in my re-analysis of their data.

  WHAT SURVIVES, AND IT IS THE USEFUL HALF. The COMPOSITION result - which genes are switched on, against
  how many were available in each category - is not vulnerable to depth in the same way, because it compares
  two categories measured in the same cells. GP1 runs 46 per cent of the available secreted antagonists and
  21 per cent of the available ligands. THE ROOT CELL IS ANTAGONIST-RICH IN ITS REPERTOIRE, NOT IN ITS
  INTENSITY, and rounds 241 and 243 should be read that way from here.

  THE PRACTICAL CONSEQUENCE. The claim is now druggable in principle rather than pathway-level: nine named
  proteins, of which SFRP1, SFRP2, SFRP5, DKK1, DKK3, SOSTDC1, WIF1 and SERPINF1 are secreted and in
  principle measurable in a growth plate or supplementable to one. PORCN is the exception and does not
  belong with them - it is an ER O-acyltransferase required for WNT palmitoleoylation, neither soluble nor
  an inhibitor, and the authors' grouping of it here is a curation choice rather than a biological one.
