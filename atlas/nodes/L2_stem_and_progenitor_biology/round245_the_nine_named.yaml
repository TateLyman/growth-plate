id: round245_the_nine_named
name: >-
  ROUND 245 - the nine ARE named. Fig. 3R reconstructed column by column from the published figure: SFRP1,
  SFRP2, SFRP5, DKK1, DKK3, SOSTDC1, WIF1, SERPINF1 and PORCN, against four ligands WNT3, WNT3A, WNT8A and
  WNT9A. AND THE RECONSTRUCTION CUTS AGAINST THE FRAMING IT WAS MEANT TO SUPPORT - all four ligands peak in
  gp1 too
