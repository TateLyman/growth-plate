id: round268_hedgehog_is_bounded_on_both_sides_and_the_withdrawal_lever_is_refuted_in_three_species
name: >-
  ROUND 268 - the hedgehog contradiction is resolved and it resolves AGAINST the atlas. The bidirectional
  column result carries a qualifier this file dropped; and a harder experiment already in this graph -
  xiu2022, sitting unconnected in an L3 edge - gives femur length under Smo and Sufu deletion at the
  juvenile stage and BOTH ARE SHORTER. Hedgehog withdrawal as a discharge lever is refuted in mouse, rat
  and MAN, and the refutation was in this file the whole time
aliases:
- round 268
- the hedgehog contradiction resolved
- withdrawal is not discharge
- hedgehog is bounded on both sides
- the load and release protocol is kimura's experiment
type: hypothesis
layer: L2
stub: false
summary: >-
  THE ITEM FLAGGED AT THE END OF ROUND 265 AS THE ONE THAT COULD INVALIDATE THE DISCHARGE MODEL IS NOW
  SETTLED. It does not invalidate round 265. It invalidates round 251, and it invalidates the first line of
  round 264's attack ranking, and every piece of evidence needed to do so was already in this graph.

  ONE - THE CONTRADICTION ITSELF, READ IN THE PRIMARY, AND THE QUALIFIER THIS ATLAS DROPPED.
  resting_zone_niche states that both Smoothened agonism and antagonism reduce the number of columns formed
  from labelled resting cells. That is FAITHFUL to mizuhashi2018 and it is not the whole sentence. The
  clause immediately before it says these regimens "predominantly affected chondrocytes in the
  PROLIFERATING ZONE, without directly affecting PTHrP-creER-P6 cells in the RESTING ZONE". So it was never
  a symmetric statement about resting-cell behaviour. It is a statement that EITHER PERTURBATION DEGRADES
  THE PROLIFERATIVE ZONE, and the column count - a lineage readout from a P6 pulse - is downstream of that.
  The numbers say the same thing: at P17, control versus SAG differs by 67.8 columns and control versus
  LDE225 by 66.0, while SAG VERSUS LDE225 DIFFERS BY -1.85 with a confidence interval straddling zero. The
  agonist and the antagonist are indistinguishable FROM EACH OTHER. That is not a U-shaped dose-response
  around an optimum; it is two different ways of breaking the same downstream structure.

  TWO - AND IT TURNS OUT NOT TO MATTER, BECAUSE A HARDER EXPERIMENT WAS ALREADY IN THIS GRAPH AND NOBODY
  CONNECTED IT. xiu2022 sits in edges e00093 and e00094 as an L3 signalling fact about Sufu and Gli2, with
  the note that "Hedgehog output must be held within a band". Read in full it is not an L3 fact. It is
  Agc1-CreER-T2 conditional deletion in growth plate chondrocytes, tamoxifen from P14 - JUVENILE, WELL
  AFTER SOC - with MICRO-CT FEMUR LENGTH at P30 and P120.
  SMO DELETED, hedgehog OFF: femur SHORTENED BY 21 PER CENT AT P30, worsening to 30 PER CENT AT P120, with
  the plates of tibia and femur PREMATURELY FUSED in the most affected mutants. Hypertrophy accelerated,
  proliferation down, apoptosis up.
  SUFU DELETED, hedgehog ON: the plate is EXPANDED and its zonal order DESTROYED at P30 - "a
  poorly-organized mass of chondrocytes with heterogenous morphology" - femur length NOT significantly
  different at P30, and by P120 PREMATURE CLOSURE with femurs SIGNIFICANTLY SHORTER. Hypertrophy
  suppressed, proliferation and survival down.
  AND THE COMPARTMENT IS LOCALISED BY THE PAPER'S OWN CONTROL: Osx-Cre deletion of either gene in
  PREHYPERTROPHIC chondrocytes produced no obvious defect, so the requirement sits in RESTING AND COLUMNAR
  cells. Compound Smo;Sufu double mutants phenocopy Sufu, so it runs through Gli.
  THAT IS BOTH DIRECTIONS, CELL-AUTONOMOUS, AT THE RIGHT STAGE, WITH A LENGTH ENDPOINT, AND BOTH ARE
  SHORTER.

  THREE - SUFU IS THE SEVENTH INSTANCE OF CHARGE-WITHOUT-DISCHARGE AND THE FIRST WHERE THE CHARGE GOES
  NEGATIVE. The six catalogued instances gave pool or plate expansion with length UNCHANGED. Here the plate
  expanded at P30 and the femur ended up SIGNIFICANTLY SHORTER at P120. Expansion without order is not
  reserve; it is a plate that closes early. This is the strongest single entry in that catalogue because
  the failure is not a null, it is a reversal.

  FOUR - AND THE LOAD-AND-RELEASE PROTOCOL OF ROUND 251 IS, PRECISELY, KIMURA2008'S EXPERIMENT. Round 251
  proposed loading the pool with an agonist, withdrawing to discharge it, then reloading, and recorded
  kimura2008 as "a cost that must be carried". Read directly, kimura2008 is not a cost to carry - IT IS THE
  SAME PROTOCOL, RUN. Brief HhAntag in 10-to-14-day-old mice; "pathway activity was RESTORED 2 DAYS AFTER
  DRUG REMOVAL"; and then, AFTER DRUG REMOVAL, "osteoblasts invaded the cartilage plate, mineralization
  occurred, and there was PREMATURE FUSION of the growth plate resulting in permanent disruption of bone
  epiphyses". THE RELOAD STEP IS NOT A SEPARATE RISK. IT IS THE FUSION MECHANISM. Withdrawal empties the
  plate of its hedgehog-dependent brake on maturation, and restoring the pathway into that emptied plate is
  when the bone closes it.

  FIVE - AND IT HAS BEEN RUN IN MAN, TWICE, AND THIS FILE ALREADY HELD ONE OF THEM. robinson2017a: three
  children on vismodegib, all Tanner 1, starting heights -0.1, +1.0 and +0.5 SD, developing WIDESPREAD
  IRREVERSIBLE PHYSEAL FUSIONS that continued to widen after the drug stopped, ending at -2.7, -1.4 and
  -1.3 SD. Fusion appeared only after MORE THAN 140 DAYS of exposure; a knee film four months earlier was
  clean. It forced a trial amendment restricting the drug to skeletally mature patients and a product label
  change. pereira2021 independently: "the most severe adverse event was growth deceleration with growth
  plate fusion IN ALL EVALUABLE PATIENTS", and of the four who had not reached adult height ALL FOUR had
  complete growth arrest on treatment; one shifted +0.5 SD to -1 SD, resumed velocity ON THE LOWER CURVE
  and seven years later managed a PUBERTAL GROWTH PEAK OF ONLY 7.5 CM.
  AND THE MECHANISTIC DETAIL IN pereira2021 IS THE ONE THAT MATTERS MOST TO THIS PROGRAMME: the arrests
  were "NOT SECONDARY TO PREMATURE BONE MATURATION" by Greulich and Pyle. Expected ossification and phalanx
  epiphysis elongation SLOWED while CENTRAL EPIPHYSEAL FUSION happened anyway. THE PLATE CLOSES WITHOUT THE
  BONE AGE ADVANCING - which on this atlas's own bone-age-cost axis is an INFINITE cost per centimetre. It
  spends the plate and buys nothing.

  SIX - WHAT SURVIVES, STATED NARROWLY. Only a TRANSIENT, LOCAL, DECAYING AGONIST PULSE. trompet2024's
  intra-SOC bead gave femur +3.63 per cent in 8 of 8 normal rats against a contralateral control, and its
  Gli1-LacZ signal was gone by three weeks - loaded and released by accident of pharmacokinetics, not by
  design. That result is now BOUNDED ON BOTH SIDES by primaries in this file: above by Sufu deletion, which
  is sustained cell-autonomous hedgehog gain and gives shorter femurs, and below by Smo deletion and the
  human data. The window is real, narrow, agonist-only, and local-only. IT IS NOT A WITHDRAWAL LEVER.

  SEVEN - AND A NEW AGE FACT THAT BEARS DIRECTLY ON THE CASE. xiu2022's Gli1-LacZ and Ptc1-LacZ reporters
  put hedgehog responsiveness in RESTING AND COLUMNAR chondrocytes and near-absent in hypertrophic ones -
  and the number of LacZ-positive cells in BOTH the resting and columnar zones DECLINES GRADUALLY FROM TWO
  WEEKS TO FOUR MONTHS OF AGE. The compartment this programme wants to move becomes progressively less
  hedgehog-responsive as the animal matures, which is the wrong direction for a subject at bone age 16.

  EIGHT - WHAT THIS DOES NOT TOUCH. ROUND 265 IS UNAFFECTED. Its discharge model runs FGFR3 to CREB, from
  horike2026, and has nothing to do with hedgehog. Discharge as a CONCEPT survives; the HEDGEHOG
  IMPLEMENTATION of it is what dies. Erdafitinib remains the only agent in the revised stack that reaches
  the discharge arm, and it now does so as the only surviving route rather than one of two.
quantitative:
- parameter: >-
    FEMUR LENGTH UNDER CELL-AUTONOMOUS HEDGEHOG LOSS AND HEDGEHOG GAIN AT THE JUVENILE STAGE - BOTH
    DIRECTIONS SHORTEN THE BONE
  value: >-
    Smo deleted (hedgehog OFF): femur -21 per cent at P30, -30 per cent at P120, growth plates prematurely
    FUSED in the most affected mutants. Sufu deleted (hedgehog ON): plate EXPANDED and zonally
    DISORGANISED at P30 with femur length NOT significantly different, then PREMATURE CLOSURE and
    SIGNIFICANTLY SHORTER femurs at P120
  unit: femur length by micro-CT, per cent versus littermate control
  conditions: >-
    xiu2022, Front Cell Dev Biol 10:997838, read in full. Agc1-CreER-T2 tamoxifen-inducible conditional
    deletion in growth plate chondrocytes; five daily tamoxifen doses from P14, so JUVENILE AND WELL AFTER
    SOC FORMATION; micro-CT and Safranin O at P30 and P120. Smo loss ACCELERATED hypertrophy, Sufu loss
    SUPPRESSED it, and BOTH reduced proliferation (BrdU) and survival (TUNEL). Osx-Cre deletion of either
    gene in PREHYPERTROPHIC chondrocytes gave no obvious defect, localising the requirement to resting and
    columnar cells. Smo;Sufu compound mutants phenocopy Sufu, implicating Gli.
  species: mouse
  source_ref: xiu2022
  uncertainty: >-
    CONDITIONAL KNOCKOUT IS CHRONIC AND CELL-AUTONOMOUS, WHICH IS NOT THE SAME AS A SHORT SYSTEMIC PULSE -
    newton2019's discharge was eight doses over four days. So this bounds the LEVER CLASS rather than
    refuting that specific four-day pulse, which nobody has run to a length endpoint. The paper states its
    own principal limitation: "we did not evaluate the effects of Hh manipulation on growth plate skeletal
    stem cells", so RESTING-ZONE CELL NUMBER WAS NOT MEASURED IN EITHER ARM. The Sufu P120 femur deficit is
    reported as significant without a percentage. Percentages are given only for the Smo arm.
- parameter: >-
    THE MIZUHASHI COLUMN RESULT WITH THE QUALIFIER THIS ATLAS DROPPED - AGONIST AND ANTAGONIST ARE
    INDISTINGUISHABLE FROM EACH OTHER, AND NEITHER ACTED ON THE RESTING CELLS
  value: >-
    P17 control versus SAG, mean difference 67.8 columns [37.5, 98.1]; control versus LDE225, 66.0 [33.9,
    98.0]; SAG VERSUS LDE225, -1.85 [-33.9, 30.2]. P28 control versus LDE225, 134.5 [108.7, 160.3]. Both
    regimens "predominantly affected chondrocytes in the PROLIFERATING ZONE, without directly affecting
    PTHrP-creER-P6 cells in the RESTING ZONE"
  unit: number of tdTomato-positive columns, and 95 per cent confidence intervals on mean differences
  conditions: >-
    mizuhashi2018, Nature 563, read in full from PMC6251707. PTHrP-creER; R26R-tdTomato mice pulsed at P6;
    global Smo agonist SAG or antagonist LDE-225. Extended Data Fig 8j,k: P17 n = 5 control, 5 SAG, 4
    LDE225; P28 n = 4 control, 3 LDE225. One-way ANOVA with Tukey.
  species: mouse
  source_ref: mizuhashi2018
  uncertainty: >-
    THE P28 SAG ARM IS n = 2 AND NO COMPARISON IS REPORTED FOR IT, so the late agonist arm is effectively
    absent. The claim that the resting cells were not directly affected rests on Extended Data Fig 8a-8c,
    which are IMAGES - the legend describes no quantification of resting-zone cell number, so "not directly
    affected" is qualitative. That cuts both ways: it weakens the paper's own qualifier AND it means the
    absence of resting-cell depletion under an antagonist is not quantified either. The Methods, including
    dose, route and schedule for SAG and LDE-225, are NOT in the deposited author manuscript.
- parameter: >-
    THE LOAD-AND-RELEASE PROTOCOL HAS BEEN RUN AND THE FUSION HAPPENS ON THE RELOAD
  value: >-
    brief HhAntag in 10-to-14-day-old mice; pathway activity RESTORED two days after drug removal; and
    AFTER drug removal osteoblasts invaded the cartilage plate, mineralization occurred, and there was
    PREMATURE FUSION of the growth plate with permanent disruption of bone epiphyses
  unit: growth plate fate after transient pathway inhibition and spontaneous recovery
  conditions: >-
    kimura2008, Cancer Cell 13:249, PMID 18328428. Gli-luciferase transgenic mice with whole-animal
    functional imaging confirming both the suppression and its restoration. HhAntag inhibited chondrocyte
    proliferation and promoted differentiation, giving a dramatic expansion of the hypertrophic zone.
  species: mouse
  source_ref: kimura2008
  uncertainty: >-
    Read from the abstract of a paywalled paper, so the dose, the exact schedule and the magnitude of the
    permanent deficit are not held. What is quoted is unambiguous on the ORDER OF EVENTS, which is the
    load-bearing part - restoration precedes fusion - and that order is what refutes the protocol.
- parameter: >-
    HEDGEHOG INHIBITION IN CHILDREN - IRREVERSIBLE PHYSEAL FUSION, AND IT CLOSES THE PLATE WITHOUT
    ADVANCING THE BONE AGE
  value: >-
    robinson2017a: three children, standing height -0.1, +1.0 and +0.5 SD at diagnosis falling to -2.7,
    -1.4 and -1.3 SD; widespread fusions appearing only after MORE THAN 140 DAYS of exposure and continuing
    to widen after cessation. pereira2021: growth plate fusion in ALL EVALUABLE PATIENTS, and ALL FOUR who
    had not reached adult height had complete growth arrest on treatment; one went +0.5 SD to -1 SD,
    resumed velocity on the lower curve, and had a PUBERTAL GROWTH PEAK OF ONLY 7.5 CM seven years later.
    The arrests were "not secondary to premature bone maturation"
  unit: height standard deviation score, radiographic physeal fusion, pubertal peak in centimetres
  conditions: >-
    robinson2017a, Oncotarget 8:69295 - vismodegib in paediatric medulloblastoma, two on the SJMB12 phase
    II trial and one off trial; all Tanner 1 at diagnosis, ages 2.3, 4.9 and 6.7 years. Of the trial
    denominator as of February 2016, 23 SHH-medulloblastoma patients enrolled, 9 skeletally mature, and of
    the four skeletally immature patients who stayed on vismodegib five or more cycles, the two who
    completed twelve cycles both fused. pereira2021, Neuro-Oncology Advances 3:vdab097 - sonidegib and
    vismodegib, with Greulich and Pyle bone age and knee radiographs showing CENTRAL epiphyseal fusion with
    metaphyseal sclerosis while expected ossification slowed.
  species: human
  source_ref: robinson2017a
  uncertainty: >-
    THE HEIGHT NUMBERS ARE CONFOUNDED AND THE AUTHORS SAY SO - these are children receiving craniospinal
    irradiation and multi-agent chemotherapy, two of robinson2017a's three developed central precocious
    puberty, and pereira2021's most extreme case had 25 Gy to the pituitary with resulting GH deficiency
    and ovarian dysfunction. robinson2017a states plainly that short stature "may in part be attributable
    to prolonged therapy". THE RADIOGRAPHIC FUSION IS NOT CONFOUNDED IN THE SAME WAY - it is drug-timed
    against a clean film four months earlier, dose- and duration-dependent with a threshold beyond 140
    days, replicated in an independent cohort, and it produced a regulatory label change. The two claims
    are therefore graded separately below. Bone age readings in these children are themselves unreliable:
    both papers record osseous abnormalities in the films being staged.
localization:
- 'resting and columnar chondrocytes: where Gli1-LacZ and Ptc1-LacZ put hedgehog responsiveness, and where
  Osx-Cre controls localise the requirement'
- 'hypertrophic zone: near-absent hedgehog responsiveness, and the compartment Osx-Cre deletion showed to
  be dispensable'
- 'proliferating zone: where mizuhashi2018 states both SAG and LDE-225 predominantly acted'
human_evidence: direct
human_evidence_note: >-
  Two independent paediatric cohorts on Smoothened inhibitors with radiographic physeal fusion and height
  trajectories - robinson2017a and pereira2021. The fusion endpoint is direct human evidence; the attained
  height endpoint is human but confounded by irradiation, chemotherapy and precocious puberty.
species_basis:
- mouse
- rat
- human
translation_risk: not_applicable
translation_risk_reason: >-
  No translation is required in the usual direction - the human result is the strongest one here, and it
  agrees with the mouse genetics and the rat ex vivo work.
confidence: A
confidence_reason: >-
  The central claim - that hedgehog withdrawal shortens bones and closes plates - is carried by direct
  human radiographic evidence in two independent cohorts, mouse conditional genetics with a micro-CT length
  endpoint, mouse pharmacology in two further laboratories, and rat ex vivo culture. Four species-method
  combinations, no shared data, all one direction. Individual sub-claims are graded lower where the
  evidence is thinner.
claim_grades:
- claim: >-
    Hedgehog withdrawal is a candidate discharge lever that would add final height.
  grade: X
  basis: >-
    REFUTED IN THREE SPECIES. xiu2022 Smo conditional deletion at the juvenile stage: femur -21 per cent at
    P30, -30 per cent at P120, premature fusion. kimura2008: transient inhibition with confirmed pathway
    restoration, then premature fusion after drug removal. koyama2021: LDE225 causes premature growth plate
    closure in juvenile mice. The 2020 rat metatarsal work: vismodegib and the Gli1 antagonist GANT61 both
    impair growth ex vivo. robinson2017a and pereira2021: irreversible physeal fusion in children with a
    label change. THIS ATLAS HELD kimura2008, koyama2021 AND robinson2017a WHEN ROUND 251 PROPOSED THE
    LEVER.
- claim: >-
    The charge-and-discharge pair has never been run to a length endpoint in any species.
  grade: X
  basis: >-
    ROUND 264 WROTE THIS AS THE FIRST LINE OF ITS ATTACK RANKING AND IT IS FALSE. The discharge half has a
    length endpoint in mouse conditional genetics (xiu2022, -21 and -30 per cent), in mouse pharmacology
    (kimura2008, koyama2021), in rat ex vivo culture, and in two human paediatric cohorts. What has never
    been run to length is the SPECIFIC four-day vismodegib pulse of newton2019 applied to a Tsc1-charged
    pool - a much narrower statement, and one bounded by newton2019's own finding that two additional doses
    FUSED the plate at P37.
- claim: >-
    Both Smoothened agonism and antagonism reduce columns because resting cells need an optimum of
    hedgehog.
  grade: D
  basis: >-
    THE READOUT DOES NOT SUPPORT THE INTERPRETATION. mizuhashi2018 states both regimens acted predominantly
    on the PROLIFERATING zone without directly affecting the labelled resting cells, and SAG versus LDE225
    differ by -1.85 columns with an interval straddling zero. Two ways of breaking the same downstream
    structure produce the same column deficit. An optimum may still exist - xiu2022's genetics are
    consistent with one - but the column count is not the evidence for it.
- claim: >-
    Sustained cell-autonomous hedgehog gain expands the plate and converts that expansion into length.
  grade: X
  basis: >-
    THE OPPOSITE. xiu2022 Sufu deletion expanded the plate and destroyed its zonal order at P30 with no
    significant femur gain, then produced premature closure and SIGNIFICANTLY SHORTER femurs at P120. This
    is the seventh instance of charge-without-discharge in this file and the first in which the charge
    converts to a NEGATIVE length rather than a null.
- claim: >-
    Hedgehog inhibition causes premature physeal fusion in children.
  grade: A
  basis: >-
    Two independent cohorts, direct radiographic evidence against a clean prior film, a duration threshold
    beyond 140 days, fusion continuing to widen after cessation, fusion in ALL evaluable skeletally
    immature patients in pereira2021, and a trial amendment plus product label change. Uncontrolled case
    series, but the anatomical endpoint is drug-timed and replicated.
- claim: >-
    Hedgehog inhibition reduces attained height in children.
  grade: B
  basis: >-
    Consistent in direction and magnitude across both series with within-patient trajectories - -2.6, -2.4
    and -1.8 SD in robinson2017a; complete growth arrest in 4 of 4 in pereira2021; a 7.5 cm pubertal peak
    seven years on. HELD AT B RATHER THAN A because every patient carries craniospinal irradiation,
    multi-agent chemotherapy, and in some cases precocious puberty or pituitary irradiation, and the
    authors themselves attribute part of the deficit to prolonged therapy.
- claim: >-
    Hedgehog inhibition closes the plate without advancing the bone age.
  grade: C
  basis: >-
    pereira2021 states the arrests were "not secondary to premature bone maturation" by Greulich and Pyle,
    with expected ossification and phalanx epiphysis elongation SLOWING while central epiphyseal fusion
    occurred. If it holds it is an infinite cost per centimetre on this atlas's bone-age axis. Graded C
    because it rests on one cohort's radiological reading, both papers record osseous abnormalities that
    make Greulich and Pyle staging unreliable in these films, and robinson2017a's own table reports bone
    ages of 13.5 and 12.5 years at chronological ages 7.3 and 8.2 - which points the other way and is
    itself confounded by the precocious puberty those two children developed.
- claim: >-
    Hedgehog responsiveness in the resting and columnar zones declines with age.
  grade: C
  basis: >-
    xiu2022 Figure 1A-D - Gli1-LacZ-positive chondrocyte numbers in both resting and columnar zones "tended
    to decrease gradually" from 2 weeks to 4 months. Reported as a trend from reporter staining across four
    ages without quantification in the text, so C. Directionally it argues against hedgehog as a lever in a
    mature subject.
- claim: >-
    Round 265's discharge model depends on hedgehog.
  grade: X
  basis: >-
    NO. Round 265 derives discharge from horike2026 as FGFR3 acting through CREB, independent of ERK, with
    a direct resting-zone-height readout under a CREB inhibitor. Hedgehog appears nowhere in that chain.
    The concept of discharge survives this round intact; only the hedgehog implementation of it dies, and
    erdafitinib is left as the sole route to it in the revised stack.
