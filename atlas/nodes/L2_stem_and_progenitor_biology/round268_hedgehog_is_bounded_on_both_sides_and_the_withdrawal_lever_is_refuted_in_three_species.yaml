contradicts: >-
  OVERTURNS round251_the_second_signal_is_hedgehog_withdrawal at its centre. That node proposed hedgehog
  WITHDRAWAL as the second signal that discharges an alerted pool, and a load-release-reload protocol built
  on it, recording kimura2008 only as a cost to be carried. kimura2008 read directly is that protocol
  already run, with fusion occurring AFTER pathway restoration - the reload is the fusion mechanism, not a
  side effect. ALSO REFUTES THE FIRST LINE OF round264_where_to_attack_computed_not_recalled, which ranked
  the charge-and-discharge pair first on the ground that it "has never been run to a length endpoint in any
  species"; it has, in mouse genetics, mouse pharmacology, rat ex vivo culture and two human paediatric
  cohorts, and this atlas held three of those sources at the time. AMENDS resting_zone_niche, which
  recorded mizuhashi2018's bidirectional column result without the clause stating that neither drug
  directly affected the resting cells. DOES NOT TOUCH
  round265_discharge_is_creb_and_erdafitinib_is_the_only_agent_that_reaches_it, whose discharge model runs
  through FGFR3 and CREB and never invokes hedgehog.
