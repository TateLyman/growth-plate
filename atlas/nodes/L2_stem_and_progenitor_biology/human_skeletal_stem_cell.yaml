id: human_skeletal_stem_cell
name: Human skeletal stem cell (hSSC)
aliases:
- hSSC
- PDPN+CD146-CD73+CD164+ cell
type: cell_type
summary: 'The human SSC is defined as CD45- CD235a- TIE2- CD31- PDPN+ CD146- CD73+ CD164+. It was found
  by Smart-seq2 single-cell sequencing of seven microdissected regions of a 17-week human fetal femur,
  scoring each cell for expression of human orthologues of 76 mSSC/mBCSP-specific genes; the cells scoring
  highest were in the second half of the pre-hypertrophic zone and the first half of the hypertrophic
  zone - not the resting zone. Sorted hSSCs form ossicles with a marrow cavity under the renal capsule
  of NSG mice, self-renew through serial colony formation to tertiary CFU and through serial transplantation,
  and generate bone, cartilage and stroma but not fat. Downstream are a human BCSP, human osteoprogenitors
  and three chondroprogenitor subsets distinguished by CD73 and CD164. CD146+ cells, the classic marrow
  ''MSC'', gave smaller and fewer colonies. hSSCs are present in fetal and adult bone, can be induced
  from BMP2-treated adipose stroma and iPSCs, and expand locally after fracture. Across ten skeletal sites
  the hSSC pool is compositionally different site by site and shifts toward a fibroblastic state with
  age. The translation risk runs in the awkward direction: the human panel and the mouse panel share no
  antigen, and the human cell was localised to a different growth plate zone than the mouse resting-zone
  stem cell.'
