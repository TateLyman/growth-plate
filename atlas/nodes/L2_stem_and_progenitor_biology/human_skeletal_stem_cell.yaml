human_evidence: direct
human_evidence_note: Cells were prospectively isolated from human fetal and adult bone and assayed functionally,
  but every functional readout required xenotransplantation into immunodeficient mice or ex vivo culture;
  no in-situ human assay exists.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: 'The reverse translation problem: the hSSC was derived from mouse gene signatures
  yet shares no surface marker with the mSSC, was localised to a different growth plate zone than the
  mouse resting-zone stem cell, and its behaviour is measured in a mouse kidney rather than in a human
  growth plate.'
