id: round470_the_ledger_lost_the_yield_term_and_two_supplied_primaries_close_its_named_experiment
name: 'R470: the ledger lost the yield term, and reading nilsson2014 and breur1997 in full closes its named computation
  - oestrogen roughly halves the output per resting-zone cell spent'
aliases:
- CORR-365
- yield per progenitor spent
- loan versus loss discriminator
- dexamethasone mirror
- matrix per cell is a site property
type: hypothesis
layer: L2
stub: false
confidence: B
last_verified: '2026-08-27'
species_basis: rabbit and rat
human_evidence: absent
human_evidence_note: No human measurement of output per resting-zone progenitor consumed exists at any age. The human
  resting-zone chondrocyte number has never been measured at all (g_l7_459b). Everything here is ovariectomised rabbit
  (nilsson2014, schrier2006) and rat (breur1997), plus a prior mouse computation from lui2018.
translation_risk: high
translation_risk_reason: Rabbit and rat. The rabbit is the right species for fusion, which is why nilsson2014 and weise2001
  both use it, but the yield values are quotients of two figure-read curves from non-identical animal sets and are upper
  bounds by construction. The rat data are cross-sectional at two ages.
summary: 'CORR-365. the_exchange_rate_between_growth_and_pool_depletion is a grade B node written 2026-08-07 with five
  key refs and two named gaps, and it returns ZERO in CLAUDE.md for its node id, for the phrase yield per cell spent
  and for its central quantitative result. It already held the reversible-irreversible dissociation, the TUNEL negative,
  the finding that the pool drains by differentiation rather than death, the authors claim that there are fewer proliferative
  replications per lost resting zone chondrocyte, the dexamethasone mirror, and a computation from lui2018 open supplementary
  workbook giving metacarpal 14 micrometres of bone per resting-zone cell spent against femur 146, a tenfold difference
  with non-overlapping intervals inside one animal. R459, a round explicitly about how the resting pool drains, wrote
  that it drains by a route nobody has named - one round after this node had named it and credited schrier2006 with proposing
  it in 2006. schrier2006 argument is a forced move rather than a speculation, which is why it carries weight. Schrier
  tested two candidate mechanisms for how oestrogen accelerates senescence - faster resting-zone proliferation, or faster
  numerical loss of resting-zone cells - and oestrogen did NEITHER: it DECREASED resting-zone proliferation at P=0.011
  and had no significant effect on resting-zone cell number, at the same dose, compound and route nilsson2014 later used.
  Both measurable state variables of the pool move the wrong way or not at all while senescence accelerates, so the residual
  is the yield, and it survives by measurement rather than by argument. R470 then executes the computation g_l2_raise_the_yield_per_progenitor
  named as its discriminating step and recorded as blocked for a MECHANICAL reason - both figures are raster images.
  The operator supplied the scan; Figures 2 and 3 are on the same page. On treatment, oestrogen against vehicle: proximal
  tibia 511 against 868 micrometres of growth per resting-zone cell lost, ratio 0.59; proximal tibia 0.364 against 0.654
  BrdU cells per column per resting-zone cell lost, ratio 0.56; distal radius 0.319 against 0.759, ratio 0.42. Three
  computations, two bones, two numerators, all saying oestrogen roughly halves the yield. The shape is more informative
  than the ratio: the vehicle arm falls 868 to 443 over ten weeks of ordinary ageing while the oestradiol arm is flat
  at 511 then 500 - oestrogen delivered the entire normal decline in the first five weeks and it did not recover, with
  the control arm catching down to it. That is senescence expressed as a yield. nilsson2014 read in full also supplies
  the discriminator between a loan and a loss, stated by the group that ran both experiments. After withdrawal the functional
  parameters returned to normal but did not rebound above it, so the decreased tibial length was at least as pronounced
  five weeks after withdrawal as at the end of treatment - no catch-up growth. The authors contrast this explicitly with
  hypothyroidism, glucocorticoid excess and malnutrition, all of which ARE followed by catch-up because growth inhibition
  slows senescence, and conclude oestrogen is the exception because it does not slow functional senescence. The rule
  is that a growth-inhibiting agent that also slows senescence is a loan repaid, and one that does not is a pure loss
  - which is the test to apply to resveratrol and to any future agent that buys duration by slowing growth. The drain
  is named with its mirror. Oestrogen decreases proliferation and therefore self-renewal of resting-zone chondrocytes
  without delaying, and possibly while accelerating, their differentiation out. Dexamethasone also slows resting-zone
  proliferation and CONSERVES resting-zone cell number, because it additionally inhibits differentiation to proliferative
  cells. Two agents, one shared effect on renewal, opposite effects on the pool, and the difference is whether the outflow
  is also blocked - so the exit rate is separately controllable, which is the one thing R459 model required and could
  not supply. Glucocorticoids are contraindicated twice in this atlas, so it is a mechanism and never a candidate. A10
  is answered from the primary: TUNEL-positive resting zone cells 4.6 plus or minus 0.6 per cent under oestrogen against
  4.4 plus or minus 1.0 under vehicle, P=0.87, at 16 weeks - so resting-zone apoptosis is about 4.5 per cent standing
  in BOTH arms and what the paper excludes is an oestrogen-induced excess, not a standing death rate. One correction
  to R459: the persistence of the resting-zone deficit is significant at the distal radius at P<0.01 and is only a trend
  at the proximal tibia at P=0.07. breur1997, supplied in the same bundle, qualifies R454 central claim. Four rat growth
  plates at two ages across an 8.4-fold range of growth rate: matrix volume per cell is 4650 / 6380 / 8950 / 7860 micron^3
  at day 21 and 4270 / 6240 / 8880 / 6230 at day 35, NOT significantly different between ages in all four plates - a
  1.9-fold range between sites and no change with age within a site. R454 concluded from hunziker1989 and hunziker1994
  that matrix per cell is a fixed structural quantum. Both are right: Hunziker varied rate WITHIN one plate by hormone
  and by age and found invariance, Breur varied it BETWEEN plates and found a spread. Matrix per cell is therefore a
  SITE property and not a rate property, which makes it a developmentally patterned setpoint rather than a physical ceiling,
  and reopens it as a lever. The same site-variable age-invariant pattern holds for terminal cell height and for the
  rate of cell loss, while cell volume and numerical density do change with age. And breur1997 measured the direction
  question R454 and R463 said nobody had. The terminal axial ratio X_vert/X_hor is 0.80 / 1.02 / 1.17 / 1.15 at day 21
  and 0.83 / 1.18 / 1.20 / 1.07 at day 35 - in the SLOWEST plate the terminal hypertrophic chondrocyte is WIDER than
  it is tall, and in the fastest it is only about 1.2. The terminal cell is roughly isodiametric and is not a tall column.
  That corrects a natural misreading rather than contradicting the anisotropy argument: hunziker1987 height by four and
  width by 1.58 are RATIOS OF CHANGE, and a proliferative chondrocyte is a flattened disc, so hypertrophy carries it
  toward isodiametric with height rising more because it starts much smaller. Terminal cell volume alone explains 95
  per cent of growth-rate variance (Model 1, R^2 = 0.950) and the paper best model at R^2 = 0.992 combines it with the
  rate of cell loss over cell proliferation. Matrix volume is in no winning model, which is not a contradiction of CORR-361
  - matrix is 33 to 57 per cent of the hypertrophic zone by volume, concordant with wilsman1996, while varying only 1.9-fold
  against cell volume 3.9 to 5.3-fold. It is a large share of the OUTPUT and a small share of the VARIANCE, and those
  are different questions.'
quantitative:
- parameter: Yield on treatment - micrometres of proximal tibial growth per resting-zone cell lost, 11 to 16 weeks
  value: vehicle 868, estradiol 511, ratio 0.59
  unit: micrometre per cell per mm plate width
  species: rabbit
  source_ref: nilsson2014
  note: computed R470 from Figures 2G and 3B read at 760-900 dpi; upper bound because the resting zone is a standing
    stock; not the same animals for numerator and denominator
- parameter: Yield on treatment - BrdU-labelled cells per column per resting-zone cell lost, 11 to 16 weeks
  value: proximal tibia vehicle 0.654 against estradiol 0.364, ratio 0.56; distal radius vehicle 0.759 against estradiol
    0.319, ratio 0.42
  unit: dimensionless
  species: rabbit
  source_ref: nilsson2014
  note: second and third independent computations, both agreeing with the growth-rate version that oestrogen roughly
    halves the yield
- parameter: Yield during washout - proximal tibia, 16 to 21 weeks
  value: vehicle 443, estradiol 500 micrometres per resting-zone cell lost, ratio 1.13
  unit: micrometre per cell per mm plate width
  species: rabbit
  source_ref: nilsson2014
  note: the vehicle arm falls 868 to 443 while the oestradiol arm is flat at 511 to 500 - the control catches DOWN rather
    than the treated arm catching up; the distal radius does NOT converge (ratio 0.46)
- parameter: TUNEL-positive resting zone chondrocytes at 16 weeks
  value: estradiol 4.6 +/- 0.6 per cent against vehicle 4.4 +/- 1.0 per cent, P = 0.87
  unit: per cent of resting zone cells
  species: rabbit
  source_ref: nilsson2014
  note: verifies R459 correction to R440 from the primary; apoptosis is NOT zero, it is about 4.5 per cent standing in
    both arms, and what is excluded is an oestrogen-induced excess
- parameter: Persistence of the resting-zone deficit five weeks after withdrawal
  value: distal radius P < 0.01, proximal tibia P = 0.07
  unit: p value
  species: rabbit
  source_ref: nilsson2014
  note: corrects R459, which quoted the irreversibility as the paper strongest result without the site qualifier
- parameter: Epiphyseal fusion, distal tibia, per cent of growth plates unfused at 11 / 16 / 21 weeks
  value: vehicle 100 / 100 / about 10 against estradiol 100 / about 44 / 0, P < 0.05 by log-rank
  unit: per cent unfused
  species: rabbit
  source_ref: nilsson2014
  note: Figure 2J, figure-read
- parameter: Matrix volume per terminal hypertrophic chondrocyte, four plates at two ages
  value: 'day 21: proximal radius 4650, distal radius 6380, proximal tibia 8950, distal tibia 7860; day 35: 4270, 6240,
    8880, 6230 - NOT significantly different between ages in all four plates'
  unit: micron^3 per cell
  species: rat
  source_ref: breur1997
  note: site-variable at 1.9-fold and age-invariant; qualifies R454 fixed-quantum reading, which came from within-plate
    hormonal variation
- parameter: Terminal hypertrophic chondrocyte axial ratio X_vert over X_hor
  value: 'day 21: 0.80 / 1.02 / 1.17 / 1.15; day 35: 0.83 / 1.18 / 1.20 / 1.07 for proximal radius / distal radius /
    proximal tibia / distal tibia'
  unit: dimensionless
  species: rat
  source_ref: breur1997
  note: the terminal cell is roughly isodiametric and in the slowest plate is WIDER than tall - hunziker1987 height x4
    and width x1.58 are ratios of CHANGE from a flattened disc, not the terminal shape
- parameter: Regression of longitudinal growth rate on chondrocytic parameters
  value: Model 1 LG = -40.71 + 0.0212 x V_cell, R^2 = 0.950; Model 2 LG = 89.2 + 27.4 X_vert - 437 X_vert/X_hor, R^2
    = 0.929; best overall R^2 = 0.992 combining terminal cell volume with rate of cell loss over cell proliferation
  unit: micron per day
  species: rat
  source_ref: breur1997
  note: matrix volume is in no winning model - it is a large share of the output and a small share of the variance, which
    is not a contradiction of CORR-361
- parameter: Chondrocytic volume fraction of the terminal 75 micrometres of the growth plate
  value: 0.49 / 0.67 / 0.66 / 0.61 at day 21 and 0.43 / 0.63 / 0.60 / 0.53 at day 35, so matrix is 33 to 57 per cent
    by volume
  unit: volume fraction
  species: rat
  source_ref: breur1997
  note: independently concordant with wilsman1996 partition of 32 per cent matrix in a fast plate and 49 per cent in
    a slow one
