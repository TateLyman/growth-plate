id: round400_turning_notch_on_the_soluble_agonist_barrier_fell_in_2024_and_one_was_already_injected_into_bone
name: "R400: turning Notch ON - four independent lines say Notch holds the reserve, the textbook reason it could not be drugged with a soluble agonist stopped being true in 2024, and a Jagged1 peptide has ALREADY been injected into mice and expanded an endogenous progenitor pool in bone without a caliper being used"
aliases:
  - Notch agonist growth plate
  - soluble Notch agonist
  - synthetic Notch agonist SNAG
  - Jagged1 peptide injection bone
  - Notch resting zone reserve
type: intervention
layer: L2
stub: false
summary: >-
  R399 ended on a line written as a limitation: the helpful direction, Notch ON, has
  no drug. That was the state of the field until about 2024 and it is no longer true.
  This round takes the direction seriously and it produces the strongest new lead in
  many rounds - together with the reason it must be pulsed and targeted rather than
  simply given.

  FOUR INDEPENDENT LINES SAY NOTCH HOLDS THE RESERVE, AND THREE OF THEM ARE NEW HERE.
  · ORGAN CULTURE. lin2011, neonatal rat femur: Jagged1/Fc, which turns Notch on,
  RAISED the epiphysis-stem-cell zone as a fraction of plate length and RAISED the
  number of BrdU-positive proliferating stem cells; DAPT, a gamma-secretase inhibitor,
  LOWERED both. PTHrP(1-34) did the same as Jagged1/Fc and raised NICD and Jagged1,
  placing Notch downstream of PTHrP.
  · MOUSE LENGTH. IMPC, and the gene is the plate's own ligand: Dll1 heterozygotes
  have BODY LENGTH -1.726 at P=0.00136 and -4.492 at P=0.0052, against a consortium
  median of -0.212. DLL1 is cartilage-enriched in the human growth plate at a purity
  ratio of 3.05 and 24.9 CPM. Notch3 homozygotes are -0.830 at P=0.0016.
  · THE CALIBRATED MATURATION SCREEN, AND IT REPLICATES. In GSE225878, where R311
  established that a positive LFC means the knockout matured EARLY and therefore spent
  the period, RBPJ - the obligate Notch transcription factor - scores +0.766 at
  -log10p 3.61 on day 4 of the primary screen and +1.887 on day 15, and then
  REPLICATES in the independent secondary screen at +0.685 with -log10p 5.56 across
  ten perturbations and +1.554 at 3.70. MIB1, the E3 ligase required for ligand
  activation and therefore an entirely separate node of the same pathway, scores
  +3.385 at -log10p 4.35. Losing Notch makes a chondrocyte mature early.
  · HUMAN, WEAKLY. Children with Alagille syndrome, a dominant disorder of Notch
  signalling, have height Z-scores significantly below zero - confounded by cholestatic
  liver disease and n equals 10.
  And the pathway is demonstrably ON in the tissue: HES1, its own readout, is
  cartilage-enriched at 2.00 and 76.2 CPM in the purity-corrected human growth plate.

  THE BARRIER THAT MADE THIS UNDRUGGABLE FELL IN 2024. Notch activation classically
  requires a MECHANICAL PULLING FORCE delivered by a ligand held on a neighbouring
  cell, which is why soluble ligand has historically been an inhibitor rather than an
  agonist and why no Notch agonist drug existed. smyrlaki2024 broke that: molecularly
  precise MULTIVALENT Jag1 nanopatterns displayed from solution on DNA origami
  activate Notch WITHOUT a pulling force, including chimeric constructs in which most
  of the Jag1 is replaced by non-Notch binders, and the authors propose activation on
  prolonged binding instead. mout2025notch then turned that into a molecule:
  computationally designed protein complexes with defined valency and geometry act as
  soluble cytokine-like Notch agonists, drive T cell differentiation from cord blood
  and iPSCs, and - the part that matters here - WORK WHEN DELIVERED INTRAVENOUSLY IN
  MICE. perez2026snag supplies the targeting: synthetic Notch agonists tether an
  affinity-matured Notch ligand to a binder against a protein that internalises, so
  the internalisation itself supplies the pull, and Notch is activated ONLY in cells
  carrying the chosen surface marker. Six markers have been built successfully.

  ⭐ AND ONE HAS ALREADY BEEN INJECTED INTO A MOUSE AND EXPANDED A PROGENITOR POOL IN
  BONE. wang2021jag1 injected a Notch-activating JAGGED1 PEPTIDE into mice and reports
  that it was sufficient to maximally activate Notch and to PROMOTE BONE MARROW
  STROMAL CELL PROLIFERATION IN VIVO, with no effects on bone structure observed;
  pre-treated animals then formed more callus with greater mechanical strength in a
  femur defect model. This is not a proposal. A systemically administered Notch
  agonist expanding an endogenous skeletal progenitor population has been done.
  ⛔ CORR-340 EXACTLY: micro-CT, histology and biomechanical testing were all
  performed and BONE LENGTH WAS NOT REPORTED. The animals were dosed and the caliper
  was never used.

  ⛔ WHY IT MUST BE PULSED AND TARGETED - AND THIS IS A MECHANISTIC REQUIREMENT, NOT A
  SAFETY GARNISH. The atlas's own Notch node holds the other half: mead2009 shows that
  forced NICD in the chondrocyte lineage REDUCES precursor proliferation and BLOCKS
  hypertrophic differentiation. Read against lin2011 the split is exactly
  charge-versus-discharge: in the RESTING ZONE, Notch on means more stem cells; in the
  PROLIFERATIVE and HYPERTROPHIC zones, Notch on means less proliferation and blocked
  hypertrophy. So sustained, untargeted Notch activation charges the reserve and jams
  the discharge - failure mode number one, with eight prior instances in this file.
  The human gain-of-function agrees: NOTCH2 stabilising mutations cause Hajdu-Cheney
  syndrome, with acro-osteolysis and short stature. Notch is the EIGHTH axis in this
  atlas to shorten bone in BOTH directions.
  ⭐ THAT IS WHY perez2026snag's targeting is the load-bearing part rather than a
  convenience. The construct this indication wants is a Notch agonist restricted to
  the resting-zone stem cell, and the atlas already knows the marker: NT5E/CD73 is
  259.6 CPM at 8.18-fold cartilage enrichment in the purity-corrected human growth
  plate, and it is the canonical resting-zone stem cell marker. A CD73-directed SNAG
  would activate Notch in the compartment where it charges the pool and not in the
  columns where it jams them.

  WHAT IS ACTUALLY MISSING, STATED SO THE NEXT ROUND CANNOT CALL IT NEW. No Notch
  agonist of any kind has a BONE-LENGTH endpoint in any species. No soluble or
  synthetic Notch agonist has ever been given to a growth plate. The CD73-directed
  SNAG does not exist - it is a construction problem of the same class as the
  function-blocking anti-HHIP binder, except that here the agonist platform, the
  targeting chemistry and the systemic route are all published and the marker is
  already measured. Notch is a major oncogene in the T cell lineage, which is the
  cost this direction carries. And lin2011, the paper that sets the direction at the
  resting zone, is an abstract-only organ-culture study in a Chinese-language journal.
quantitative:
  - parameter: Notch manipulation and the epiphysis stem cell zone
    value: >-
      Jagged1/Fc and PTHrP(1-34) RAISED both the stem-cell zone fraction and BrdU+ stem
      cell number; DAPT and PTHrP(7-34) LOWERED both
    unit: qualitative, organ culture
    species: rat
    source_ref: lin2011
    note: neonatal rat femur organ culture; no bone-length endpoint; abstract-only
  - parameter: IMPC body length for the plate's own Notch ligand
    value: Dll1 heterozygote body length -1.726 (P=0.00136) and -4.492 (P=0.0052)
    unit: IMPC effect size
    species: mouse
    source_ref: lin2011
    value_unverified: true
    note: >-
      pulled in R400 from atlas/data/round303/impc_length_endpoints_all.json; source_ref
      nominal. CORR-329 applies - negative is the common direction, 63.7% of knockouts
      are shorter with a median of -0.212 - but -4.49 is far beyond that median. Notch3
      homozygotes -0.830 at P=0.0016
  - parameter: Rbpj knockout in the calibrated maturation screen
    value: >-
      primary D4 +0.766 (-log10p 3.61), D15 +1.887; secondary D4 +0.685 (-log10p 5.56,
      10 perturbations), D15 +1.554 (3.70)
    unit: LFC on the CD200 maturation axis
    species: mouse
    source_ref: lin2011
    value_unverified: true
    note: >-
      pulled in R400 from the raw GSE225878 files; source_ref nominal. R311's calibration
      - positive LFC means matured EARLY, i.e. spent the period. Replicates across
      independent primary and secondary screens. Mib1, a separate node required for
      ligand activation, scores +3.385 at -log10p 4.35 on D15
  - parameter: Notch pathway presence in the human growth plate
    value: >-
      HES1 76.2 CPM at purity ratio 2.00 and DLL1 24.9 CPM at 3.05, both
      cartilage-enriched; NOTCH2 84.0 CPM; RBPJ 95.5 CPM
    unit: CPM and purity ratio
    species: human
    source_ref: lin2011
    value_unverified: true
    note: >-
      computed in R400 from GSE288028 by R344's purity split; source_ref nominal. HES1 is
      the pathway's own transcriptional readout, so its enrichment says the pathway is
      ACTIVE in the chondrocyte rather than merely present
  - parameter: a Notch agonist given systemically to a mammal with a skeletal readout
    value: >-
      Jagged1 peptide injection maximally activated Notch and promoted bone marrow
      stromal cell proliferation in vivo, with no effect on bone structure
    unit: qualitative
    species: mouse
    source_ref: wang2021jag1
    note: >-
      bone marrow stroma, not growth-plate resting zone. CORR-340 - micro-CT, histology
      and biomechanics were run and BONE LENGTH WAS NOT REPORTED
  - parameter: soluble Notch agonism without mechanical force
    value: >-
      multivalent Jag1 nanopatterns from solution activate Notch without a pulling force;
      designed soluble agonists work INTRAVENOUSLY in mice
    unit: qualitative
    species: mouse
    source_ref: mout2025notch
    note: >-
      smyrlaki2024 supplies the mechanism, mout2025notch the molecule and the systemic
      route. Neither has any skeletal endpoint
  - parameter: the targeting platform and the marker it would use here
    value: >-
      SNAGs built against six independent surface markers; NT5E/CD73 is 259.6 CPM at
      8.18x cartilage enrichment and is the resting-zone stem cell marker
    unit: qualitative and CPM
    species: human
    source_ref: perez2026snag
    value_unverified: true
    note: >-
      the CD73 numbers are this atlas's own computation from GSE288028. The pairing of
      SNAG targeting with CD73 is a proposal made in R400 and has never been built
localization: >-
  growth-plate resting zone for the charging effect; proliferative and hypertrophic
  zones for the jamming effect - the sign of Notch depends on the compartment
human_evidence: indirect
human_evidence_note: >-
  Human evidence is expression in the growth plate, the Hajdu-Cheney gain-of-function
  short-stature phenotype, and a confounded height deficit in ten children with
  Alagille syndrome. Every functional result is rodent, and no Notch agonist has ever
  been given to a human for any skeletal purpose.
species_basis:
  - rat
  - mouse
  - human
translation_risk: high
translation_risk_reason: >-
  The direction rests on an abstract-only organ-culture study, a knockout screen
  calibrated for maturation rather than length, and IMPC effect sizes in the common
  direction. The agonist platform is real and systemic but has never touched cartilage,
  and the compartment split means an untargeted agonist is predicted to jam the plate
  rather than lengthen it.
confidence: C
claim_grades:
  - claim: Notch maintains the growth-plate resting-zone reserve
    grade: C
    basis: >-
      four independent lines - bidirectional organ culture, Dll1 IMPC length, Rbpj and
      Mib1 accelerating maturation with replication, and a confounded human syndrome. No
      single line is strong; the convergence is what carries it
  - claim: >-
      Losing Notch makes a chondrocyte mature early and therefore spends the growth
      period
    grade: B
    basis: >-
      Rbpj replicating across the primary and secondary arms of a calibrated genome-wide
      screen, with Mib1 as an independent pathway node in the same direction. The screen
      measures a maturation marker, not a length
  - claim: >-
      Soluble and synthetic Notch agonists now exist and work systemically in a mammal
    grade: A
    basis: >-
      smyrlaki2024 for the mechanism, mout2025notch for intravenous activity in mice,
      perez2026snag for targeted activation against six markers. Published, replicated
      across three groups
  - claim: >-
      A Notch agonist has already been injected into mice and expanded an endogenous
      skeletal progenitor pool
    grade: B
    basis: >-
      wang2021jag1. Bone marrow stroma rather than resting-zone chondrocytes, and the
      downstream endpoint is a defect-healing model
  - claim: >-
      Sustained untargeted Notch activation would jam the plate rather than lengthen it
    grade: C
    basis: >-
      mead2009's forced NICD blocking hypertrophy plus the Hajdu-Cheney gain-of-function
      short-stature phenotype. This is why the proposal is pulsed and CD73-targeted
      rather than simply systemic
  - claim: A CD73-directed SNAG is the construct this indication wants
    grade: E
    basis: >-
      a design proposal. Every component exists separately - the agonist, the targeting
      format, the systemic route, the marker and its measurement - and nobody has
      combined them. No Notch agonist has a bone-length endpoint in any species
