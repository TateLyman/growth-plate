localization:
- 'mouse RZ: confirmed by PTHrP-mCherry knock-in and PTHrP-creER lineage tracing (mizuhashi2018)'
- 'mouse perichondrium (fetal): confirmed, PTHrP-mCherry+ cells are perichondrial before birth (mizuhashi2018)'
- 'human RZ: unconfirmed - human resting-zone ''root'' stem cells do not express PTHLH (chu2026)'
human_evidence: absent
human_evidence_note: No human PTHrP+ resting chondrocyte has been shown to have stem-cell behaviour; the
  one human growth plate single-cell/spatial study to address it reports that the candidate human root
  stem cell population is PTHLH-negative.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Identity rests entirely on tamoxifen-inducible Cre lineage tracing, which cannot
  be done in humans, and the marker itself appears not to identify the analogous human population.
confidence: C
