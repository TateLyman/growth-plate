id: pthrp_positive_resting_chondrocyte
name: PTHrP+ (Pthlh+) resting zone chondrocyte
aliases:
- PTHrP+ RZ chondrocyte
- epiphyseal skeletal stem cell
- epSSC
type: cell_type
summary: 'PTHrP-expressing chondrocytes appear in the centre of the mouse growth plate around P3, expand
  sharply between P6 and P9, and occupy a discrete resting zone; they are markedly less proliferative
  than the cells below (6.1% vs 30.5% EdU+ at P9). Lineage tracing with a PTHrP-creER BAC line pulsed
  at P6 shows the labelled cells stay in the resting zone for about a week, then generate short (<10-cell)
  and subsequently long (>10-cell) columns, and continue to generate new columns for at least one year;
  Confetti labelling shows each column is monochromatic, i.e. clonal. Descendants leave the plate and
  become Col1a1(2.3kb)-GFP+ osteoblasts and Cxcl12-GFP+ marrow stromal cells, but not adipocytes in vivo
  (0/443 cells scored under rosiglitazone plus high-fat diet), so multipotency is acquired only after
  the post-mitotic hypertrophic step. Immunophenotypically these cells are heterogeneous: 49.2% of PTHrP-mCherry+
  CD45-Ter119-CD31-CD51+CD90- growth plate cells carry the CD105-CD200+ mSSC phenotype, 23.4% pre-BCSP
  and 27.4% BCSP. Only a small minority behave as long-term stem cells - 16.3% of P12-pulsed colonies
  formed secondary colonies and 12.5% of those could be passaged nine times, i.e. roughly 2-3% of PTHrP+
  colony-forming cells. No equivalent cell has been identified in human growth plate; the human resting
  zone contains a PTHLH-negative stem-like population, which is a direct challenge to translating this
  marker.'
