id: the_somatotropic_axis_is_not_a_yield_axis
name: GH AND IGF-1 BUY RATE BY SPENDING THE POOL FASTER - amplification measured under both, in one experiment,
  and it goes DOWN
aliases:
- GH does not raise yield
- the somatotropic axis is a throughput axis
- hunziker1994 amplification
- rate-yield trade-off
- round 183
type: hypothesis
layer: L2
stub: false
summary: 'THE ATLAS HELD TWO OPPOSITE ATTRIBUTIONS FOR GH ON THE PRIMARY OBJECTIVE TERM AND BOTH WERE WRONG.
  The ledger says amplification "is hit twice - FGFR3 inhibition raises proliferative-zone length and growth
  hormone acts on the same term". amplification_is_transit_time (round 175) says GH/IGF-1 act on terminal
  cell height and that "amplification is covered zero times". Both were inferred from ZONE HEIGHTS. This round
  measures it instead, and the answer is neither.

  hunziker1994 IS THE ONLY EXPERIMENT IN THIS LITERATURE THAT REPORTS EVERY QUANTITY THE DECOMPOSITION NEEDS
  IN THE SAME ANIMALS. Hypophysectomised 35-day-old male Wistar rats, proximal tibia, 8-day continuous
  minipump infusion, four groups of six: saline, IGF-I, GH, and normal unoperated littermates. It reports
  longitudinal growth rate (Table II), terminal hypertrophic cell height (Fig 1A), resting cell cycle time
  and resting cells per column (Fig 2A, 2B), and its own independent stereological count of cells produced
  per column per day (Fig 2C). Nothing has to be borrowed from another study, another species or another age.

  THE IDENTITY IS EXACT AND IT CLOSES. Kember-Sissons gives cell production per column P = growth rate /
  terminal cell height. Population asymmetry in a resting compartment whose size the authors report as
  unchanged gives pool consumption D = resting cells per column / resting cycle time. Amplification A = P / D
  is hypertrophic cells delivered per resting cell consumed, and GROWTH RATE = A x D x h_term with no
  residual. THREE OF THE EIGHT LOSS TERMS, SEPARATED INSIDE ONE EXPERIMENT, FOR THE FIRST TIME IN THIS
  PROGRAMME.

  THE NUMBERS. Growth rate 31 / 92 / 163 / 284 micrometres per day for saline / IGF-I / GH / normal.
  Terminal cell height 19.5 / 27.3 / 26.5 / 29.8 micrometres. Resting cycle time 50 / 15 / 8 / 6 days.
  Resting cells per column 2.5 / 2 / 2 / 2.5. AMPLIFICATION COMES OUT AT 31.8 / 25.3 / 24.6 / 22.9.

  SO GH RAISED GROWTH RATE 5.26-FOLD AND THAT IS 5.00x FASTER POOL CONSUMPTION, 1.36x TALLER TERMINAL CELLS,
  AND 0.77x AMPLIFICATION. The pool-consumption term alone is 97 per cent of the log effect. IGF-I is the
  same shape - 2.67x, 1.40x, 0.79x, with pool consumption 90 per cent. And so is the normal-versus-
  hypophysectomised contrast - 8.33x, 1.53x, 0.72x, pool consumption 96 per cent. THREE INDEPENDENT CONTRASTS,
  ONE EXPERIMENT, SAME ANSWER: THE SOMATOTROPIC AXIS DOES NOT RAISE YIELD. IT LOWERS IT, BY ABOUT A QUARTER,
  WHILE BUYING RATE OUT OF THE RESERVE.

  IT VALIDATES THREE WAYS BEFORE IT IS BELIEVED. (1) Growth rate divided by terminal cell height reproduces
  Hunziker''s own independently measured turnover count in every group - 1.59 / 3.37 / 6.15 / 9.53 against
  his stated 1 / 3 / 6 / 10. Two different methods, same animals, agreement to the rounding. (2) log2 of the
  amplification is 4.99 / 4.66 / 4.62 / 4.52 - between four and five doublings after leaving the resting
  zone - in columns the same paper reports as holding 14 to 18 proliferative cells. The arithmetic lands
  where the histology says it must. (3) The identity has zero residual by construction and the sensitivity
  analyses do not turn the sign over: forcing the resting count identical across groups gives a GH/saline
  amplification ratio of 0.62 at every value tried, and the GH resting cycle time would have to be understated
  by 30 per cent before amplification even reaches parity.

  WHY THE OLD ATTRIBUTIONS FAILED, AND HUNZIKER SAYS IT HIMSELF IN THIS PAPER. Both were read off zone
  heights. In these same animals IGF-I produced a TOTAL GROWTH PLATE HEIGHT similar to normal rats "despite
  dramatically differing growth rate activities", and the authors conclude that growth plate height, the
  classical tibia test, "is not a reliable indicator of bone growth rate". A zone height is cells per column
  multiplied by cell height - it is the PRODUCT of the two terms the decomposition exists to separate, and
  it is a standing stock rather than a flux. Every agent-to-term assignment in the ledger that rests on a
  zone height is therefore unverified, not wrong - unverified. Logged as CORR-189.

  THE FGFR3 HALF IS NOT SETTLED BY THIS AND MUST NOT BE ASSUMED TO FALL THE SAME WAY. kot2026 reports
  infigratinib raising proliferative-zone LENGTH, which is exactly the quantity this correction distrusts,
  and it did so in an osteogenesis imperfecta model in females only. FGFR3 inhibition may well be a real
  amplification agent - the CREB and MAPK biology is entirely different from the somatotropic one, and
  erdafitinib is in the stack for other reasons - but on present evidence its term assignment is UNTESTED
  by the flux method, and the experiment that would test it is named in the gap.

  WHAT THIS DOES TO CORR-187, WITHOUT OVERTURNING IT. Round 181 corrected an overstated three-line claim that
  GH spends the pool, because ohlsson1992 had nearly doubled germinal label-retaining cells with local GH in
  hypophysectomised rats. hunziker1994 IS THE SAME ANIMAL MODEL - hypophysectomised rat, minipump, proximal
  tibia - and it measures the resting cell cycle time DIRECTLY at 50 days falling to 8 under GH. That is a
  six-fold acceleration of the resting compartment, measured kinetically rather than inferred from a count.
  It does not refute ohlsson1992, whose readout was a label ratio rather than a cycle time, but it does mean
  the pool-spending direction now rests on a direct measurement in the same model rather than on a
  convergence of weaker lines. ONE RECONCILIATION WORTH TESTING AND NOT ASSERTING: a six-fold shorter stem
  cycle means far more germinal cells divide during a continuous twelve-day thymidine infusion, so MORE
  LABELLED CELLS IS WHAT ACCELERATED CYCLING PREDICTS, not what pool expansion uniquely predicts. Graded E -
  it is an inference about someone else''s labelling kinetics from a different paper''s cycle times.

  AND A RELATIONSHIP THE ATLAS HAS NEVER BEEN ABLE TO SEE BEFORE. Amplification falls monotonically as growth
  rate rises across all four groups - 31.8, 25.3, 24.6, 22.9 against 31, 92, 163, 284 micrometres per day.
  Least squares on the logs gives amplification proportional to growth rate to the power -0.146, R-squared
  0.948. A tenfold increase in elongation rate costs about 29 per cent of the yield per progenitor. FOUR
  POINTS, THREE OF THEM DRUG ARMS OF ONE EXPERIMENT - this is a described relationship and not a law, and it
  is recorded for the ORDERING rather than the exponent. But the ordering is the whole argument of the yield
  programme, and this is the first time rate and yield have been measured against each other in the same
  animals.

  THE CONSEQUENCE FOR THE STACK, STATED PLAINLY. GH is in the stack and should stay - rate is worth buying
  when there is pool to spend, and the duration arm and h_term arm both need it. But GH IS NOT AND WILL NEVER
  BE THE YIELD AGENT, at any dose, and no amount of dose-finding on the somatotropic axis will produce one.
  The remaining candidates for amplification are the positional and maturational levers - proximity to the
  secondary ossification centre (newton2019), bone identity (lui2018), oestrogen (nilsson2014) - none of
  which is a somatotropic signal. THAT IS WHERE THE YIELD SEARCH GOES NEXT.'
