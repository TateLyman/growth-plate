contradicts:
- 'CORRECTS THE LEDGER (CORR-189). ledger_what_is_dead_what_is_settled_what_is_live records that amplification
  is "hit twice" with growth hormone as one of the two. Computed from hunziker1994 the GH amplification ratio
  is 0.77, below one. The ledger''s assignment was read off zone heights, and Hunziker states in the same
  paper that growth plate height is not a reliable indicator of growth rate. The FGFR3 half of that claim is
  left as UNTESTED rather than corrected, because no one has reported cells per column under an FGFR3
  inhibitor.'
- 'PARTLY CORRECTS amplification_is_transit_time (round 175), which concluded that GH/IGF-1 and the CNP axis
  both act on terminal cell height and that "h_term is covered twice and amplification is covered zero times".
  h_term is indeed moved by the somatotropic axis, but only 14 to 22 per cent of the log effect - the term
  carrying 90 to 97 per cent is the rate of pool consumption, which appears in neither attribution.'
- 'STRENGTHENS THE POOL-SPENDING SIDE OF CORR-187 WITHOUT REVERSING IT. That correction downgraded the claim
  that GH spends the pool to "contested" on the strength of ohlsson1992. hunziker1994 measures the resting
  cycle time directly, in the same hypophysectomised rat model, at 50 days falling to 8 under GH. The
  direction now has a kinetic measurement behind it rather than a convergence of weaker lines.'
