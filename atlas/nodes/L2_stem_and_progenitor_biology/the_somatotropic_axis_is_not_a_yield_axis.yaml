localization:
- 'the resting zone: where the cycle time changes six-fold and the cell count does not change at all'
- 'the proliferative compartment: 14 to 18 cells per column across every group, so the amplifying structure
  is fixed while its throughput varies nine-fold'
- 'the terminal hypertrophic cell: restored to normal height by either hormone and exceeded by neither'
human_evidence: absent
human_evidence_note: 'Rat only. No human experiment reports growth rate, terminal cell height and resting-zone
  cycle time together, and the human resting cycle is not measurable by any available method - the atlas''s
  human anchor (kember1976) infers a roughly twenty-day proliferative cycle against two days in rodent, so the
  rate constants certainly do not transfer even if the decomposition does.'
species_basis:
- rat
translation_risk: high
translation_risk_reason: 'Hypophysectomised rat rescued to at most 57 per cent of the normal growth rate, at
  ceiling doses, over eight days. The subject is GH-replete, human, and at bone age 16. Two things travel
  better than the numbers: the IDENTITY, which is arithmetic and holds in any species, and the DIRECTION of
  the amplification term, which is the same in all three contrasts including the normal-versus-deficient one.
  What does not travel is any claim about what GH does when pushed ABOVE a normal baseline - no arm of this
  experiment does that, and chu2025 is the only study that has, in mouse, at about a hundredfold therapeutic
  dose.'
confidence: C
claim_grades:
- claim: Growth hormone acts on the amplification term.
  grade: X
  basis: 'MEASURED AND FALSE IN THIS EXPERIMENT. The ledger records amplification as "hit twice", with GH one
    of the two. Computed from hunziker1994''s own numbers the GH amplification ratio against the
    hypophysectomised control is 0.77, and 0.62 if the resting count is forced identical across groups. It is
    below one on every assumption tested. The ledger''s assignment came from zone heights, which Hunziker
    states in this same paper are not a reliable indicator of growth rate.'
- claim: GH and IGF-1 act principally on terminal cell height.
  grade: D
  basis: 'PARTLY RIGHT AND IT MISSED THE DOMINANT TERM. Round 175 concluded from cooper2013 that the
    somatotropic axis owns h_term. It does move h_term - 1.36x for GH and 1.40x for IGF-I - but that is only
    14 and 22 per cent of the log effect. The term that carries 90 to 97 per cent is the rate of pool
    consumption, which appears in neither prior attribution. D rather than X because the h_term claim itself
    is correct as far as it goes.'
- claim: The somatotropic axis buys elongation by consuming the progenitor pool faster.
  grade: C
  basis: 'DIRECTLY MEASURED, THREE CONTRASTS, ONE EXPERIMENT. Resting cycle time 50 days falling to 15 under
    IGF-I and 8 under GH with resting cells per column unchanged, giving pool consumption ratios of 2.67 and
    5.00 that account for 90 and 97 per cent of the respective log effects. C rather than B because it is one
    laboratory, one species, and a rescue-from-deficiency design; the direction is corroborated by chu2025 in
    GH-replete mouse at high dose.'
- claim: FGFR3 inhibition raises amplification.
  grade: E
  basis: 'UNTESTED BY THE FLUX METHOD AND MUST NOT BE ASSUMED TO FALL WITH GH. kot2026 reports infigratinib
    raising proliferative-zone LENGTH - a zone height, the exact quantity CORR-189 distrusts - in an Aga2/+
    osteogenesis imperfecta model, in females, with reduced male trabecular bone. Nothing in the somatotropic
    result transfers to it: the biology is unrelated and the receptor sits on the commitment switch rather
    than on the pool. It stays E until someone reports cells per column and terminal cell height separately
    under an FGFR3 inhibitor.'
- claim: Amplification and growth rate trade off against each other.
  grade: D
  basis: 'MONOTONE ACROSS ALL FOUR GROUPS, WITH FOUR POINTS. Amplification 31.8, 25.3, 24.6, 22.9 against
    growth rates 31, 92, 163, 284; log-log slope -0.146, R-squared 0.948. D because n=4 and three of the four
    are arms of one experiment, so this is a description of one dataset rather than an established
    relationship. It is recorded because the ordering has never been observable before and because it is the
    premise the yield programme rests on.'
- claim: The ohlsson1992 label-retaining-cell increase under local GH shows pool expansion.
  grade: E
  basis: 'AN ALTERNATIVE READING NOW EXISTS AND IS NOT YET TESTED. hunziker1994, in the SAME model, measures
    the resting cycle time falling from 50 days to 8 under GH. During a continuous twelve-day thymidine
    infusion a six-fold faster stem cycle would label far more germinal cells, so a higher labelled count is
    what accelerated cycling predicts as well as what pool expansion predicts. E because it is an inference
    about one paper''s labelling kinetics from another paper''s cycle times, and because the chase step cuts
    the other way. It does not overturn CORR-187; it gives the pool-spending side a direct measurement.'
key_refs:
