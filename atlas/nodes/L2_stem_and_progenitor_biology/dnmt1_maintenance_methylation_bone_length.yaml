id: dnmt1_maintenance_methylation_bone_length
name: DNMT1 maintenance methylation sets bone length
aliases:
- Dnmt1 chondrocyte
- maintenance methylation lead
- NOT an arm-3 result - see CORR-071
type: gene
layer: L2
stub: false
summary: 'The maintenance-methylation hypothesis that this atlas built across rounds 69-72 from nilsson2005
  already had a direct test, published in Nature Communications in October 2025, and it lands the way the
  hypothesis predicts. THE HUMAN LEG FIRST. In the Musculoskeletal Knowledge Portal, gene-level MAGMA
  analysis of SNPs at the DNMT1 locus gives its most significant association with HEIGHT, P < 4.2e-35 -
  not with bone density, not with fracture, with height. THE MOUSE LEG. Deleting Dnmt1 in limb mesenchyme
  (Prrx1-Cre) shortens long bones: tibiae at 6 weeks were 44.7 per cent of control length. The mechanism
  is the one the atlas cares about - a NARROWED PROLIFERATIVE ZONE with accelerated hypertrophy and
  mineralisation, increased primary trabecular bone, enhanced osteoclastogenesis, and what the authors
  describe as loss of growth plates. Shortening was present at birth and became more pronounced over the
  first several weeks, and the authors conclude explicitly that Dnmt1 matters MORE postnatally than
  embryonically. THE CELL-TYPE CONTROL DISSOCIATES THE LINEAGES BUT IS NOT AGE-MATCHED. Osx-Cre deletion,
  restricted to osteoblasts, gave NO difference in bone length - measured at 10-11 weeks. Col2a1-Cre
  deletion, restricted to chondrocytes, reproduced the shortening - measured at 3 weeks, because those
  animals survive poorly and are born at non-Mendelian rates. The effect is chondrocyte-autonomous in
  direction, on a control weaker than an age-matched pair. THE MECHANISM IS NOT THE ONE ANYBODY EXPECTED. Integrated RNA-Seq
  and MBD-Seq show that reduced methylation raises expression of energy-metabolism and ossification genes,
  and metabolomics confirms that nearly all energy metabolites rose. So maintenance methylation restrains
  bone growth through metabolic set-point rather than through a senescence clock, which connects this lead
  to the nutrient-sensing arm the atlas already holds. WHAT THIS DOES AND DOES NOT ESTABLISH. It establishes
  that maintenance methylation is REQUIRED for normal longitudinal growth, in a chondrocyte-autonomous way,
  with a human genetic association at the same locus. THE ATLAS CALLED THIS FOUR CONVERGING LINES, THEN TWO, AND ON
  READING ALL OF THEM IT IS THREE OF UNEQUAL QUALITY (CORR-066, CORR-068). cheung2001, cited second-hand as demethylation driving chondrocytes to
  hypertrophy, measures no methylation at all, uses a cytotoxic antileukaemia drug on fetal bovine
  chondrocytes in monolayer, and states that its own mechanism is unknown. sun2004 (PASG/HELLS), finally read, DOES measure methylation - 56 and 32 per cent of
  wild-type methyl-cytosine - and DOES measure bone, reporting shorter femurs and tibiae with smaller
  epiphyses; but it is a whole-body germline knockout in a cachectic progeroid animal, so it cannot
  attribute the short bones to chondrocytes. What stands is yanagihara2025 strongly, nilsson2005 moderately,
  and sun2004 as systemic corroboration.
  It does NOT establish sufficiency. Both of the surviving lines run from a LOSS of methylation to a LOSS of
  growth. Nobody has raised maintenance methylation postnatally and measured bone length. That asymmetry
  is the whole remaining question for this lead and it is now precisely specifiable.'
quantitative:
- parameter: 'resting-zone measurements in yanagihara2025'
  value: none
  unit: none
  conditions: full text searched - the words resting zone, reserve zone and Pthrp appear ZERO times; the
    measured phenotype is a narrowed PROLIFERATIVE zone with accelerated hypertrophy and mineralisation
  species: mouse
  source_ref: yanagihara2025
  uncertainty: 'CORR-071. This node was created with the alias the arm-3 mechanism candidate and that was
    wrong. Arm 3 is POOL SIZE - the number of resting-zone progenitors. yanagihara2025 measures the rate at
    which the pool is SPENT (proliferative zone width, transit to hypertrophy, bone length), not how many
    progenitors there are. It is a strong result about the counter and about arms 1 and 2. It is not
    evidence about arm 3, and the atlas must stop filing it there. Whether maintenance methylation controls
    resting-zone NUMBER is untested by this paper and by any other.'
- parameter: gene-level association of the DNMT1 locus with height
  value: 4.2e-35
  unit: P value, MAGMA gene analysis, two-sided
  conditions: Musculoskeletal Knowledge Portal, gene-level association of SNPs across the DNMT1 locus;
    height was the most significant phenotype for this gene
  species: human
  source_ref: yanagihara2025
  uncertainty: 'A gene-level aggregate over a locus, not a causal variant, and MSK-KP aggregates published
    GWAS so the height signal is driven by the very large height GWAS. It says the locus is associated,
    not that DNMT1 activity is the mediator. But it is a HUMAN association at exactly the gene the mouse
    work manipulates, and height was its top hit.'
- parameter: tibial length at 6 weeks, chondrocyte-lineage Dnmt1 deletion versus floxed control
  value: '44.7'
  unit: per cent of control
  conditions: Dnmt1 delta-Prx1 (Prrx1-Cre) versus Dnmt1 flox; n=15 control and n=13 knockout at 6 weeks,
    n=7 and 7 at 1 week; unpaired two-sided t-tests; length by soft X-ray or electronic caliper and uCT
  species: mouse
  source_ref: yanagihara2025
  uncertainty: 'Less than half the control tibial length. A constitutive deletion from the limb bud, so
    developmental and postnatal contributions are not separated by design - though the authors note the
    deficit widens over the first several weeks and conclude the postnatal role is the larger one. The
    atlas has now made the developmental-versus-postnatal error three times (CORR-046, CORR-053, CORR-058)
    and flags it here rather than repeating it: this is a REQUIREMENT result, and an inducible postnatal
    deletion has not been done.'
- parameter: cell type carrying the effect - osteoblast versus chondrocyte
  value: chondrocyte
  unit: qualitative, with an internal negative control
  conditions: Osx-Cre;Dnmt1 fl/fl (osteoblast) showed NO difference in bone length against Cre controls;
    Col2a1-Cre;Dnmt1 fl/fl (chondrocyte) reproduced the shortening, though with very low birth rates
    departing from Mendelian expectation and poor survival to adulthood
  species: mouse
  source_ref: yanagihara2025
  uncertainty: 'THE CONTROL THAT MAKES THE RESULT USABLE. Two Cre lines dissociating the lineages, with the
    osteoblast arm null. The Col2a1 line''s non-Mendelian birth rate means the surviving animals are a
    selected subset, which weakens quantitation from that arm while leaving the qualitative dissociation
    intact.'
- parameter: 'zone architecture under reduced maintenance methylation'
  value: proliferative zone narrowed, hypertrophy and mineralisation accelerated
  unit: qualitative
  conditions: histology and immunohistochemistry for Dnmt1 and Uhrf1; increased primary trabecular bone
    with enhanced osteoclastogenesis; in vivo BrdU 100 mg/kg intraperitoneally 24 h before sampling
  species: mouse
  source_ref: yanagihara2025
  uncertainty: 'This is the phenotype nilsson2005 predicts - lose methylation, chondrocytes stop
    proliferating and differentiate. It is NOT corroborated by cheung2001, which measures no methylation
    (CORR-066). Uhrf1 is co-stained because it is
    DNMT1''s obligate partner for hemimethylated-DNA recognition, which makes UHRF1 a second node on the
    same axis that the atlas has not examined.'
- parameter: transcriptional and metabolic consequence of reduced maintenance methylation
  value: energy metabolism and ossification genes up, nearly all energy metabolites up
  unit: qualitative
  conditions: integrated RNA-Seq (GSE270640, n=22) and MBD-Seq (GSE270641, n=6) plus metabolomics on
    Dnmt1 delta-Prx1 chondrocytes
  species: mouse
  source_ref: yanagihara2025
  uncertainty: 'UNEXPECTED AND IT REDIRECTS THE LEAD. The atlas assumed maintenance methylation would act
    through a senescence programme. The measured route is metabolic set-point - methylation restrains
    energy metabolism, and lifting that restraint accelerates differentiation. That connects this lead to
    the nutrient-sensing arm the atlas already holds (mTORC1, load-gating) rather than to the Baron
    senescence corpus, and the two may be the same axis seen from different ends.'
- parameter: 'CORRECTED - what the 5-azacytidine leg actually is'
  value: no methylation measured anywhere in the paper
  unit: none
  conditions: fetal bovine epiphyseal chondrocytes in monolayer culture, 5-azacytidine for 48 h then washed
    out; PTHrP and its receptor expressed days 5-9, type X collagen from day 11, a 14-fold increase in cell
    volume by day 15, alkaline phosphatase rising days 14-28; PTHrP added at day 14 downregulated type X
    collagen 6-fold
  species: bovine
  source_ref: cheung2001
  uncertainty: 'CORR-066. The atlas counted this as one of four converging lines fixing the SIGN of the
    methylation arrow - demethylation spends the plate. On reading it, that is not what the paper is. It
    is a cell-culture MODEL paper whose purpose is to build an in vitro system for endochondral ossification,
    aza-C is the tool that starts it, and the authors write that the mechanism by which aza-C induces the
    chondrocytes to differentiate is not known and that it is still obscure how aza-C exerts its
    demethylating effect. They offer an explicit alternative - that aza-C acts on a single early gene which
    then triggers the whole programme. NO METHYLATION IS MEASURED IN THE PAPER AT ALL. Add that aza-C is a
    cytotoxic antileukaemia cytidine analogue incorporated into DNA, that the cells are FETAL BOVINE
    epiphyseal chondrocytes in monolayer rather than postnatal resting zone in vivo, and that a chondrocytic
    phenotype was seen in treated AND untreated cultures. This leg is inadmissible for the sign. The atlas
    reached it through nilsson2005 one-sentence citation and never checked the source - the CORR-047 failure
    exactly.'
- parameter: 'the cell-type dissociation, with its age confound stated'
  value: Osx-Cre null at 10-11 weeks, Col2a1-Cre positive at 3 weeks
  unit: weeks of age at measurement
  conditions: Supplementary Fig 1F-1H; femoral length; birth rates from Osx-Cre and Col2a1-Cre crosses
    tabulated because Col2a1-Cre;Dnmt1 fl/fl departed from Mendelian expectation
  species: mouse
  source_ref: yanagihara2025
  uncertainty: 'READ FROM THE SUPPLEMENTARY, AND IT WEAKENS WHAT THE ATLAS CALLED A CLEAN DISSOCIATION. The
    two Cre lines were measured at DIFFERENT AGES - osteoblast-specific animals at 10-11 weeks, chondrocyte-
    specific at 3 weeks, because the latter survive poorly. A null at one age against a positive at another
    is a weaker control than an age-matched pair, though the direction is unaffected: an osteoblast deletion
    surviving to 10-11 weeks with no length phenotype is still informative. Note also that the supplementary
    panels report FEMORAL length while the 44.7 per cent figure in the main text is TIBIAL.'
- parameter: 'the PASG/HELLS leg, now read - global methyl-cytosine in the mutant'
  value: 56 and 32
  unit: per cent of wild-type methyl-cytosine level, a 43 per cent decrease
  conditions: PASG (lsh/SMARCA6/HELLS) germline disruption; methyl-cytosine measured directly in mutant
    embryos; heterozygotes similar to wild-type
  species: mouse
  source_ref: sun2004
  uncertainty: 'READ ROUND 75 AND IT RESTORES A LEG THAT CORR-066 HAD REMOVED - the count is three lines
    of unequal quality, not two (CORR-068). Unlike cheung2001 this paper MEASURES methylation, and unlike
    cheung2001 it measures bone: PASG-null mice have shorter femurs and tibiae, smaller epiphyses and
    reduced bone mineral density. What it cannot do is attribute any of that to chondrocytes. This is a
    constitutive whole-body germline knockout in an animal with low birth weight, failure to thrive,
    cachexia, kyphosis, osteoporosis, greying, hair loss and premature death - a progeroid syndrome, in
    which short bones are weak evidence for a plate-autonomous mechanism.'
- parameter: 'p16INK4a promoter methylation in the hypomethylated mutant'
  value: unmethylated in BOTH mutant and wild-type
  unit: 25 CpG sites, bisulfite sequencing
  conditions: 5-prime promoter region of p16INK4a sequenced from methylation-specific PCR products of
    bisulfite-modified DNA; p16INK4a expression is markedly raised in the mutant and the authors attribute
    it instead to downregulation of bmi-1
  species: mouse
  source_ref: sun2004
  uncertainty: 'A PATTERN THE ATLAS SHOULD NOW EXPECT RATHER THAN BE SURPRISED BY. This is the second time
    the flagship gene of a methylation-loss phenotype turns out NOT to be controlled by its own promoter
    methylation - lui2008 tested Mest, Peg3 and Plagl1 in the growth-limiting programme and found promoter
    methylation unchanged with age (CORR-060). Global hypomethylation produces its phenotypes through
    indirect routes, so any experiment designed around demethylation of a named effector promoter is
    likely to look in the wrong place.'
- parameter: 'THE LINK BETWEEN THE TWO LEADS - hypomethylation delays secondary ossification'
  value: delayed
  unit: qualitative
  conditions: von Kossa staining of tibiae from 15-day-old mice - calcified trabecular bone fully formed
    in wild-type, only calcified cartilage in PASG-null; epiphyses smaller
  species: mouse
  source_ref: sun2004
  uncertainty: 'THIS IS WHERE THE TWO LEADS MEET AND THE ATLAS HAD NOT SEEN IT. Lead 2 rests on marino2008
    reporting a wider resting zone with more resting-zone cells, which the authors attribute to DELAYED
    EPIPHYSEAL OSSIFICATION. Lead 1 now supplies a second perturbation - loss of maintenance methylation -
    that also DELAYS SECONDARY OSSIFICATION. And newton2019, already in this atlas, reports that resting
    zone chondrocytes acquire self-renewing stem cell behaviour AT secondary ossification centre formation.
    If SOC timing is what sets the pool, then methylation state and growth inhibition may be acting on the
    pool through the same intermediate rather than through two separate mechanisms. GRADED E - this is an
    inference joining three papers that never cite each other, and the direction is not even obviously
    favourable: delaying SOC formation might enlarge the reservoir or might delay the switch that creates
    self-renewing cells in the first place. It is recorded because it is testable and because it changes
    which experiment is worth running.'
- parameter: 'whether RAISING maintenance methylation postnatally lengthens bone'
  value: never tested
  unit: none
  conditions: all four converging lines - Dnmt1 deletion, Col2a1-Cre deletion, 5-azacytidine, PASG/HELLS
    loss - are LOSS of methylation producing LOSS of growth
  species: not_applicable
  source_ref: yanagihara2025
  uncertainty: 'RECORDED AS AN ABSENCE, AND IT IS THE WHOLE REMAINING QUESTION. Requirement is not
    sufficiency. A pathway can be necessary for normal growth and completely unresponsive to being pushed
    above normal - which is the same trap that killed the mTORC1 arm, where wu2017 gave wider, denser and
    SHORTER. Until a gain-of-function exists, this lead supports the mechanism and licenses no intervention.'
localization:
- 'growth plate proliferative zone: narrowed on Dnmt1 loss, with accelerated transit to hypertrophy'
- 'chondrocytes: the cell type carrying the effect, dissociated from osteoblasts by Osx-Cre versus Col2a1-Cre'
- 'human DNMT1 locus: gene-level association whose top phenotype is height'
human_evidence: indirect
human_evidence_note: The human evidence is a gene-level GWAS aggregation at the DNMT1 locus, not a measured
  methylation or growth phenotype in a human growth plate. All mechanism is mouse.
species_basis:
- mouse
- human
translation_risk: moderate
translation_risk_reason: The direction should transfer because maintenance methylation is a housekeeping
  mechanism conserved across mammals, the phenotype is chondrocyte-autonomous, and there is a human
  genetic association at the same locus. What will not transfer is magnitude, and more importantly the
  DIRECTION OF USEFUL MANIPULATION is untested in any species - every result here is loss of function.
confidence: B
claim_grades:
- claim: Maintenance DNA methylation by DNMT1 is required in chondrocytes for normal longitudinal bone
    growth.
  grade: B
  basis: Mouse conditional knockout with two independent Cre lines, an osteoblast-specific negative control,
    integrated methylation and expression sequencing, metabolomics, and a human gene-level association at
    the same locus with height as its top phenotype.
- claim: The mechanism runs through metabolic set-point rather than through a senescence programme.
  grade: C
  basis: One study, integrating RNA-Seq, MBD-Seq and metabolomics in one model. No perturbation of the
    metabolic arm to test necessity.
- claim: Raising maintenance methylation would increase bone length.
  grade: E
  basis: NOT TESTED IN ANY SPECIES. Recorded as an explicit inference so it cannot be read out of the
    requirement result. The lines that do exist all run loss-to-loss, and there are two of them, not the
    four the node originally claimed (CORR-066).
key_refs:
- ref_id: yanagihara2025
  pmid: '41188231'
  first_author: Yanagihara Y
  year: 2025
  type: primary
  one_line_finding: Chondrocyte-autonomous Dnmt1 loss shortens tibiae to 44.7 per cent of control by
    narrowing the proliferative zone and accelerating hypertrophy, via raised energy metabolism, with the
    DNMT1 locus associated with human height at P < 4.2e-35.
- ref_id: sun2004
  pmid: '15105378'
  first_author: Sun LQ
  year: 2004
  type: primary
  one_line_finding: PASG/HELLS disruption gives global hypomethylation (methyl-cytosine 56 and 32 per cent
    of wild-type), shorter femurs and tibiae, smaller epiphyses and DELAYED secondary ossification - in a
    whole-body progeroid animal, and with p16INK4a upregulation shown to be promoter-methylation-independent.
- ref_id: cheung2001
  pmid: '11204431'
  first_author: Cheung JO
  year: 2001
  type: primary
  one_line_finding: A bovine cell-culture model of endochondral ossification started with 5-azacytidine -
    no methylation measured, and the authors state the mechanism is unknown.
- ref_id: nilsson2005
  pmid: '16002553'
  first_author: Nilsson O
  year: 2005
  type: primary
  one_line_finding: Methylation loss in the resting zone is specific to slow in vivo replication and is
    reversed by culture - the observation this gene test was needed to interpret.
