id: the_counter_is_a_leak_not_an_odometer
name: What actually ends growth is not a spent cell count - it is a maintenance-methylation leak specific to slow replication inside the niche, and the one in vivo rejuvenation experiment pushes it the wrong way
aliases:
- what the ideal addition to the stack would be
- is it proliferative exhaustion
- the sign problem on the methylation axis
type: hypothesis
layer: L2
stub: false
summary: 'REVISED ROUND 88 ON FOUR FULL TEXTS, AND THE CENTRAL QUESTION IS NOW ANSWERED RATHER THAN
  POSED. Round 87 named a sign conflict - the growth plate appears to age by LOSING methylation while the
  only cartilage rejuvenation experiments work by INCREASING demethylation - and called it a coin flip.
  IT IS NOT A COIN FLIP. Read directly, sarkar2023 states the articular direction explicitly: the STAT3
  agonist 423F induced GLOBAL HYPOMETHYLATION and a decrease in biological age in aged adult human
  chondrocytes, and STAT3 knockdown in fetal chondrocytes induced GLOBAL HYPERMETHYLATION. osk2026 agrees
  from an independent direction: OA cartilage carries AUGMENTED DNMT1 AND DNMT3a, and OSK treatment brings
  DNMT3a down and TET2 up. SO ARTICULAR CARTILAGE AGES BY HYPERMETHYLATION AND BOTH REJUVENATION AGENTS
  ARE CALIBRATED ON THAT DIRECTION. The growth plate resting zone does the opposite - methylation falls
  with age (nilsson2005), and removing maintenance methylation REPRODUCES the arrested phenotype
  (yanagihara2025). THE TWO TISSUES AGE IN OPPOSITE METHYLATION DIRECTIONS, AND APPLYING AN ARTICULAR-
  CALIBRATED REPROGRAMMING AGENT TO A GROWTH PLATE WOULD PUSH IT TOWARD ITS OWN SENESCENT STATE. That
  closes the reprogramming lead for this application. It is not impossible; it is backwards.
  WHAT NILSSON ACTUALLY MEASURED, AND TWO CORRECTIONS TO ROUND 87 (CORR-081). The in vitro result is
  STRONGER than "methylation did not fall": global methylation ROSE with each population doubling,
  per cent methylated dCMP = 62.28 + 0.21 x population doublings, P = 0.012, from doubling four throughout
  replicative senescence. But round 87 stated "culture RESTORES maintenance methylation" as fact; the
  authors write that the constant level "SUGGESTS that maintenance methylases were upregulated when the
  cells were placed in cell culture, either because of loss of cell-cell or cell-matrix interactions or
  because of factors present in culture medium" - a speculation with named candidate causes, and no DNMT
  measurement was made. AND THE LEAK-VERSUS-ODOMETER DICHOTOMY WAS A FALSE ONE THAT THIS ATLAS INVENTED.
  Nilsson and Baron propose a cell-cycle counter explicitly, and they propose the zonal mechanism
  themselves: "there may be COMPLETE MAINTENANCE METHYLATION IN THE PROLIFERATIVE ZONE, BUT NOT IN THE
  RESTING ZONE". The correct statement is not that the counter is a leak instead of an odometer - it is
  that IT IS A DIVISION COUNTER WHOSE TICK RATE IS SET BY THE NICHE RATHER THAN BY DIVISION ITSELF. The
  proliferative zone divides far faster and does not tick. Round 87 presented the authors interpretation
  as the atlas own inversion.
  AND THE SAME PAPERS HAND OVER A MECHANISM AND A CLINICAL-STAGE COMPOUND, WHICH IS WHERE THIS NOW GOES.
  yanagihara2025 is not a methylation-clock paper - its title is that Dnmt1 determines bone length by
  regulating ENERGY METABOLISM. Losing maintenance methylation derepresses energy-metabolism genes;
  metabolomics shows increased glutamine uptake, oxygen consumption, ATP production and nearly ALL energy
  metabolites; the cells calcify prematurely; the bone stops elongating. And the authors ran the rescue:
  CB-839 (telaglenastat), a glutaminase inhibitor already in oncology trials, given daily for two weeks
  from birth, SUPPRESSED the abnormal calcification in vivo. THE CRITICAL LIMIT ON THAT, AND IT IS
  DISQUALIFYING FOR NOW: NO BONE LENGTH WAS MEASURED UNDER CB-839. The endpoints are trabecular volume and
  BMD, and BMD FELL - which in a wild-type subject is the absorptive term moving the wrong way.
  THE TWO ITEMS ACTIONABLE TODAY ARE BOTH SUBTRACTIONS, AND BOTH ARE COMMON SUPPLEMENTS. The TET
  dioxygenases require 2-oxoglutarate as co-substrate and ascorbate as reductant. yanagihara2025 states
  that 2KG is "a key substrate for demethylation" and finds it ELEVATED where methylation is lost;
  ascorbate_tet2025 shows vitamin C activates TET-dependent demethylation. Calcium alpha-ketoglutarate and
  high-dose vitamin C are two of the most common longevity supplements, and on this axis both supply the
  demethylation machinery that the growth plate ages by.'

quantitative:
- parameter: 'THE FOUR FACTS THAT KILL THE ODOMETER MODEL'
  value: methylation falls with age in the resting zone, but not between zones, not in fast culture, not
    in liver - and culture RESTORES maintenance
  unit: qualitative, four contrasts
  conditions: 'nilsson2005, rabbit. (1) Global methyl-dCMP fraction in resting-zone cartilage DECREASES
    with age. (2) It does NOT differ between resting and hypertrophic zones at any single age, so it does
    not track differentiation. (3) It does NOT fall during the far more RAPID replication of the same
    cells in culture, so it does not track divisions. (4) It does NOT fall with growth of the liver in
    vivo, so it is not a general consequence of tissue growth. And culture RESTORES maintenance
    methylation.'
  species: rabbit
  source_ref: nilsson2005
  uncertainty: 'THE ARGUMENT LIVES OR DIES ON FACT (3) AND FACT (3) IS THE ONE THIS ATLAS SHOULD PRESS
    HARDEST ON. If methylation loss were an obligate per-division event, the cells dividing fastest would
    lose the most, and they lose none. That is the observation that converts the counter from something
    carried in the genome to something imposed by the niche. WHAT IT DOES NOT ESTABLISH: this is global
    5-methyl-dCMP content by a bulk assay in ONE species, in a paper whose adjacent donor-age comparison
    was only P=0.068 (CORR-059), and "restores maintenance methylation" is the authors reading of their
    culture data rather than a direct measurement of DNMT1 activity at the fork. A bulk global measure
    can be flat while site-specific methylation at the CpGs that matter moves substantially. THE MODEL
    THIS NODE PROPOSES - a leak specific to slow replication - is a HYPOTHESIS THAT EXPLAINS FOUR
    OBSERVATIONS, not a demonstrated mechanism, and no experiment held here tests it directly.'
- parameter: 'THE SIGN CHECK, AND IT FAILS - removing maintenance methylation REPRODUCES the aged plate'
  value: 44.7 per cent of control tibial length, with a NARROWED proliferative zone
  unit: per cent of control length at 6 weeks
  conditions: Dnmt1 deleted in limb mesenchyme by Prrx1-Cre in mouse; the phenotype is a narrowed
    proliferative zone with accelerated hypertrophy. Independently, gene-level MAGMA analysis of SNPs at
    the human DNMT1 locus in the Musculoskeletal Knowledge Portal gives its most significant association
    with HEIGHT, P < 4.2e-35 - not with bone density and not with fracture
  species: mouse
  source_ref: yanagihara2025
  uncertainty: 'THIS IS THE ROW THAT SETS THE DIRECTION FOR EVERYTHING DOWNSTREAM, SO ITS LIMITS MATTER.
    A Prrx1-Cre limb-mesenchyme deletion removes DNMT1 from the whole limb bud from early development, so
    the 44.7 per cent is a DEVELOPMENTAL phenotype and not a model of a plate ageing normally - it shows
    that maintenance methylation is REQUIRED to build and hold a proliferative zone, not that its gradual
    decline is what ends growth. The human MAGMA hit is a locus association, not a direction: it says
    DNMT1 variation moves height, not which way. Together they establish that this axis has large effects
    on height in both species and that loss-of-function is the short direction. They do not establish that
    restoring methylation in an ageing plate would lengthen it, and no experiment held here does.'
- parameter: 'THE SIGN CONFLICT - the one in vivo cartilage rejuvenation experiment works by INCREASING
    demethylation'
  value: DNMT3a down, TET2 up, predicted methylation age reduced, Ki67-positive fraction unchanged
  unit: qualitative with direction
  conditions: osk2026, 12-week-old male C57BL/6, intra-articular AAV-OSK above 1e11 genome copies per
    joint at day 0 and week 4, assessed at 8 weeks in an osteoarthritis model; TET2 identified as the
    pivotal mediator; chondrocyte markers retained, no stemness rise, no dedifferentiation, no tumour
  species: mouse
  source_ref: osk2026
  uncertainty: 'THE CONFLICT STATED PRECISELY, BECAUSE IT WOULD BE EASY TO OVERSTATE. The growth plate
    resting zone loses methylation with age (nilsson2005) and losing maintenance methylation shortens
    bones (yanagihara2025). osk2026 lowers cartilage epigenetic age by turning demethylation UP. On
    their faces those point opposite ways, and if they do then the flagship rejuvenation intervention is
    contraindicated for this tissue. THREE REASONS IT MAY NOT BE A REAL CONTRADICTION. FIRST, a
    methylation CLOCK is a weighted panel of site-specific CpGs and GLOBAL 5mC content is a different
    quantity; a tissue can lose global methylation while the clock CpGs move the other way. The two
    studies measured different things. SECOND, articular and growth plate cartilage are different tissues
    with different ageing questions - degenerative against developmental. THIRD, osk2026 measured
    proliferation directly and the Ki67 fraction DID NOT DIFFER, so on the endpoint that matters here it
    did nothing in either direction. WHAT SURVIVES ALL THREE CAVEATS IS THE PRACTICAL POINT: NOBODY HAS
    MEASURED THE DIRECTION OF METHYLATION CHANGE THAT ACCOMPANIES REJUVENATION IN A GROWTH PLATE, and
    until somebody does, reaching for a reprogramming agent here is a coin flip on the sign.'
- parameter: 'THE COMPOUND THAT EXISTS FOR THE IMPOSSIBLE VERSION - partial reprogramming without genes,
    viruses or transcription factors'
  value: an optimized combination of TWO small molecules
  unit: count of molecules
  conditions: schoenfeldt2025 - chemical partial reprogramming improved genomic instability and epigenetic
    alterations in aged human cells, and a two-molecule combination was sufficient to ameliorate further
    aging phenotypes and extend lifespan. Against it, chemreprog_tox2026 reports that IN VIVO chemical
    reprogramming is associated with a toxic accumulation of lipid droplets that hinders the effect
  species: human
  source_ref: schoenfeldt2025
  uncertainty: 'THIS IS THE ANSWER TO "FIND A COMPOUND EVEN IF YOU THINK IT IS IMPOSSIBLE" AND IT IS
    GENUINELY EARLIER THAN IT SOUNDS. NO SKELETAL ENDPOINT OF ANY KIND EXISTS - not bone length, not
    growth plate, not chondrocyte, in any species. It is aged human cells in vitro plus a lifespan model.
    The in vivo counterweight is already published and is not a minor caveat: chemical reprogramming in a
    living animal accumulates lipid droplets toxically. AND IT INHERITS THE SIGN PROBLEM ABOVE INTACT,
    because chemical reprogramming targets the same epigenetic state OSK does. Listed because the
    question asked for it and because a two-molecule oral cocktail is a different accessibility class
    from AAV, NOT because the evidence supports using it.'
- parameter: 'THE ONE ITEM THAT CAN BE ACTED ON TODAY, AND THE ACTION IS SUBTRACTION'
  value: vitamin C activates DNA demethylation through TET, and the effect is lost without TET2 activity
  unit: qualitative
  conditions: ascorbate_tet2025, human HAP1 cells - ascorbate is a cofactor of the TET dioxygenases, so
    high-dose vitamin C drives ACTIVE demethylation; no skeletal tissue examined
  species: human
  source_ref: ascorbate_tet2025
  uncertainty: 'IF THE SIGN ON THIS AXIS IS WHAT IT APPEARS TO BE, A HIGH-DOSE VITAMIN C SUPPLEMENT IS
    PUSHING THE RESTING ZONE IN THE AGEING DIRECTION, and high-dose vitamin C is in most supplement
    stacks. THE CHAIN IS THREE INFERENCES LONG AND EVERY LINK IS WEAK: HAP1 cells are not chondrocytes,
    the ascorbate concentrations that drive TET in culture are not obviously reached by oral dosing, and
    the growth-plate sign itself is the unresolved question this node exists to state. AGAINST IT, AND IT
    IS NOT SMALL: ascorbate is REQUIRED for collagen prolyl hydroxylation, scurvy produces a
    disorganised growth plate, and no argument here justifies vitamin C DEFICIENCY. The claim is bounded
    to SUPRAPHYSIOLOGICAL dosing having a plausible cost that nobody has weighed, and the recommendation
    it supports is to stay at nutritional intake rather than to megadose - which costs nothing either way
    and is the only reason it is worth stating at this evidence level.'
- parameter: 'THE IN VITRO NUMBER, READ DIRECTLY - methylation did not merely fail to fall, it ROSE'
  value: 'per cent methylated dCMP = 62.28 + 0.21 x population doublings'
  unit: percentage points of methylated dCMP per population doubling
  conditions: cultured rabbit resting-zone chondrocytes, from population doubling four throughout
    replicative senescence, P = 0.012; the regression did not depend on donor age (P = 0.068). Measured
    as 100 x radioactivity in the methyl-dCMP spot divided by the sum of methyl-dCMP and dCMP spots,
    after MspI/HpaII digestion, 5-prime end labelling, nuclease P1 digestion and thin-layer chromatography
  species: rabbit
  source_ref: nilsson2005
  uncertainty: 'THIS IS THE FACT THE WHOLE MODEL RESTS ON AND IT IS STRONGER THAN THE ATLAS HAD IT.
    Methylation rose 0.21 points per doubling in the cells dividing fastest, while falling with age in the
    same cell type in vivo. TWO THINGS MUST TRAVEL WITH IT. FIRST, this is a GLOBAL CCGG-site assay, not
    a clock and not a locus - a bulk measure can move one way while the CpGs that matter move the other,
    and every rejuvenation study compared against it uses site-specific methods. SECOND, the authors
    inference that maintenance methylases were UPREGULATED in culture is a speculation they label as such,
    with three named candidate causes - loss of cell-cell interaction, loss of cell-matrix interaction, or
    a factor in the medium. NO DNMT WAS MEASURED IN THAT EXPERIMENT. Round 87 reported the inference as a
    finding (CORR-081). If it is right, the candidate causes are the therapeutic targets and all three are
    niche properties rather than cell properties.'
- parameter: 'THE SIGN CONFLICT, RESOLVED - the two cartilages age in OPPOSITE methylation directions'
  value: articular ages by HYPERmethylation; growth plate resting zone ages by HYPOmethylation
  unit: qualitative, direction
  conditions: 'THE ARTICULAR DIRECTION, TWO INDEPENDENT LINES. sarkar2023 - the STAT3 agonist 423F applied
    to aged adult human chondrocytes for two weeks induced GLOBAL HYPOMETHYLATION with a decrease in
    biological age in 5 of 6 donors, and STAT3 knockdown in fetal chondrocytes induced GLOBAL
    HYPERMETHYLATION. osk2026 - OA cartilage and the DMM mouse carry AUGMENTED DNMT1 AND DNMT3a with
    diminished DNMT3b, and OSK lowers DNMT3a while raising TET2. THE GROWTH PLATE DIRECTION, TWO
    INDEPENDENT LINES. nilsson2005 - global methylation falls with age in rib resting zone and in all
    three zones of the distal ulna. yanagihara2025 - deleting Dnmt1 REPRODUCES the arrested phenotype,
    chondrocyte-autonomously, with the human chondrocyte experiment agreeing.'
  species: multiple
  source_ref: sarkar2023
  uncertainty: 'THIS CLOSES THE ROUND-87 QUESTION AND IT CLOSES IT AGAINST THE REPROGRAMMING LEAD. Both
    agents that lower cartilage biological age do so by DEMETHYLATING, and both were calibrated on a
    tissue whose ageing direction is the reverse of the growth plate. Applied to a growth plate they push
    toward its senescent state, not away from it. THE PRINCIPAL LIMIT IS THAT THE COMPARISON CROSSES
    ASSAY TYPES: nilsson2005 is a bulk global CCGG measure in rabbit, sarkar2023 is human EWAS and a
    site-specific clock, osk2026 is WGBS reported as differentially methylated REGIONS with NO global 5mC
    percentage given anywhere - the single number this atlas asked for does not exist in that paper. The
    DNMT-expression directions substitute for it and they agree, which is why this is graded as resolved
    rather than as suggestive. WHAT IT DOES NOT SAY: that reprogramming could not be re-tuned for this
    tissue, only that neither existing agent is pointed the right way, and that a growth-plate-calibrated
    intervention would have to RAISE maintenance methylation rather than lower it.'
- parameter: 'THE MECHANISM UNDERNEATH, AND A CLINICAL-STAGE COMPOUND THAT REVERSES IT - but not on length'
  value: CB-839 suppressed abnormal calcification in vivo; NO length endpoint was measured
  unit: qualitative, with the missing endpoint named
  conditions: 'yanagihara2025. Losing Dnmt1 derepresses energy-metabolism genes; Dnmt1-null chondrocytes
    show increased glutamine uptake, higher basal respiration, ATP production and maximal respiration, and
    increased levels of NEARLY ALL energy metabolites including 2-oxoglutarate; calcification genes Pthlh,
    Osx and Ocn rise; the plate mineralises prematurely and the bone stops elongating. The glutaminase
    inhibitor CB-839 (telaglenastat) and the ATP-synthesis inhibitor oligomycin both normalised the
    enhanced metabolism and mineralisation in culture, and CB-839 given daily for two weeks from birth
    reduced trabecular bone volume and BMD in Dnmt1-null mice toward control. Osx-Cre deletion in
    osteoblasts gave NO length difference, so the effect is chondrocyte-autonomous.'
  species: mouse
  source_ref: yanagihara2025
  uncertainty: 'THIS IS THE MOST TRACTABLE THING IN THE NODE AND IT IS ALSO NOT USABLE YET, FOR THREE
    REASONS THAT MUST BE STATED TOGETHER. FIRST, NO BONE LENGTH WAS MEASURED UNDER CB-839 - the reported
    endpoints are trabecular and cortical microCT parameters. Under the CORR-062 rule this row cannot
    support any statement that glutaminase inhibition lengthens a bone. SECOND, BMD FELL, and lowering
    mineral is the absorptive term moving the wrong way in a subject whose spine has to carry driven
    growth. THIRD, AND MOST IMPORTANT, THE RESCUE WAS RUN IN A Dnmt1-NULL ANIMAL WITH PATHOLOGICALLY HIGH
    METABOLIC FLUX. Normalising an excess is not the same experiment as suppressing a normal flux, and
    this atlas has made exactly that error before on the FGFR arm (CORR-077). What the row establishes is
    that the pathway from maintenance methylation to arrested elongation runs THROUGH ENERGY METABOLISM
    and is pharmacologically interruptible - which relocates the target from an epigenetic mark, which
    nothing safely raises, to a metabolic flux, for which drugs exist.'
- parameter: 'THE TWO SUBTRACTIONS, AND BOTH ARE COMMON LONGEVITY SUPPLEMENTS'
  value: 2-oxoglutarate and ascorbate are the co-substrate and reductant of the TET dioxygenases
  unit: qualitative
  conditions: yanagihara2025 states that 2KG is "a key substrate for demethylation" and reports it
    ELEVATED in Dnmt1-null chondrocytes where methylation is lost; ascorbate_tet2025 shows vitamin C
    activates DNA demethylation through TET and that the effect is lost without TET2 activity. Calcium
    alpha-ketoglutarate and high-dose vitamin C are both widely taken as longevity supplements
  species: not_applicable
  source_ref: yanagihara2025
  uncertainty: 'THE CHAIN IS SHORT BUT IT IS A CHAIN AND THE ARROW IS PARTLY MINE. yanagihara2025 runs the
    causality the OTHER way - reduced methylation lowers the DEMAND for 2KG, so 2KG accumulates. The
    inference that SUPPLYING 2KG would drive demethylation is the reverse arrow, and although it is
    chemically sound because 2KG is genuinely the TET co-substrate and the loop is bidirectional, no
    experiment held here tests it. EVERY OTHER LINK IS ALSO WEAK: ascorbate_tet2025 is HAP1 cells, oral
    dosing may not reach the concentrations that drive TET in culture, and no growth plate has been
    exposed to either compound in any study. AGAINST BOTH, AND IT IS NOT SMALL: ascorbate is required for
    collagen prolyl hydroxylation and scurvy disorganises the growth plate, so nothing here argues for
    deficiency. THE CLAIM IS BOUNDED TO SUPRAPHYSIOLOGICAL DOSING HAVING A PLAUSIBLE COST NOBODY HAS
    WEIGHED. It is worth stating only because the action - stay at nutritional intake, do not megadose -
    costs nothing whichever way the biology turns out.'
localization:
- 'growth plate resting zone: where the methylation loss is measured and where the leak is proposed'
- 'articular cartilage: where both rejuvenation experiments were actually done'
human_evidence: indirect
human_evidence_note: The human evidence is the DNMT1 height association at P < 4.2e-35 and the human
  chondrocyte methylation clock. The mechanism, the direction and every candidate intervention are
  rabbit, mouse or non-skeletal human cells.
species_basis:
- rabbit
- mouse
- human
translation_risk: high
translation_risk_reason: The load-bearing observation is a bulk global methylation assay in rabbit; the
  candidate interventions have no skeletal endpoint in any species; and the sign of the intervention that
  would be reached for first is unresolved.
confidence: D
confidence_note: D. The four nilsson2005 contrasts are real and were read in full, and the leak model
  explains all four, which is more than the odometer model does. But it is one paper, one species, one
  bulk assay, an explanatory hypothesis rather than a tested mechanism, and the single most consequential
  claim in the node - the sign conflict - is a comparison between two different measurement types in two
  different tissues. It is not E because three independent lines agree that loss of maintenance
  methylation is the SHORT direction for bone.
claim_grades:
- claim: Growth plate senescence is a maintenance-methylation leak specific to slow replication inside
    the niche, rather than a per-division odometer.
  grade: D
  basis: A hypothesis that accounts for four contrasts in one rabbit paper - age-dependence, zone
    independence, absence under rapid culture replication, and absence in liver - plus the restoration of
    maintenance methylation in culture. No experiment tests it directly.
- claim: The best possible addition to a yield-and-duration stack acts on the counter, not on yield.
  grade: C
  basis: Follows from herrmann2002 - lifetime zero oestrogen, plates open, growth stopped anyway at 24 -
    which makes every yield and duration lever a redistribution of a fixed budget. n=1, and the cessation
    age is a history statement rather than a measurement series.
- claim: Partial reprogramming may move the growth plate in the ageing direction on this axis.
  grade: E
  basis: A directional comparison between a bulk global 5mC measurement in rabbit growth plate and a
    site-specific methylation clock in mouse articular cartilage. These are different assays in different
    tissues and the comparison may not be valid. Stated as a sign risk to be resolved, not as a finding.
key_refs:
- ref_id: nilsson2005
  first_author: Nilsson O
  year: 2005
  type: primary
  one_line_finding: Resting-zone methylation falls with age but not between zones, not under rapid culture
    replication and not in liver - and culture restores maintenance methylation.
- ref_id: herrmann2002
  type: primary
  one_line_finding: Aromatase-deficient man grew until 24 and stopped at about 197 cm with epiphyses still
    open at 27 - the budget, not fusion, is the final constraint.
- ref_id: osk2026
  first_author: Liu YW
  year: 2026
  type: primary
  one_line_finding: AAV-OSK lowers cartilage methylation age with DNMT3a down and TET2 up, without
    dedifferentiation or tumour, and does not change the Ki67-positive fraction.
- ref_id: schoenfeldt2025
  first_author: Schoenfeldt L
  year: 2025
  type: primary
  one_line_finding: A two-molecule chemical cocktail achieves partial reprogramming and extends lifespan -
    no skeletal endpoint of any kind.
- ref_id: yanagihara2025
  type: primary
  one_line_finding: Limb-mesenchyme Dnmt1 deletion gives tibiae 44.7 per cent of control length with a
    narrowed proliferative zone; the human DNMT1 locus associates most strongly with HEIGHT.
- ref_id: ascorbate_tet2025
  year: 2025
  type: primary
  one_line_finding: Vitamin C activates DNA demethylation through TET and the effect requires TET2
    activity.
