id: the_counter_is_a_leak_not_an_odometer
name: What actually ends growth is not a spent cell count - it is a maintenance-methylation leak specific to slow replication inside the niche, and the one in vivo rejuvenation experiment pushes it the wrong way
aliases:
- what the ideal addition to the stack would be
- is it proliferative exhaustion
- the sign problem on the methylation axis
type: hypothesis
layer: L2
stub: false
summary: 'THE QUESTION THIS NODE ANSWERS IS WHAT THE SINGLE BEST ADDITION TO A YIELD-AND-DURATION STACK
  WOULD BE, AND IT TURNS ENTIRELY ON WHAT "EXHAUSTION" IS. herrmann2002 fixes the target: a man with
  lifetime aromatase deficiency, plates left anatomically open into his late twenties, STOPPED GROWING AT
  24 at about 197 cm. Removing every brake does not remove the ceiling, so the ceiling is the budget and
  everything in the current stack - FGFR3 blockade, oestrogen blockade, PDE3 - is rearranging a fixed
  quantity. The best possible addition is therefore whatever raises the budget. THE ATLAS HAS CALLED THAT
  QUANTITY "PROLIFERATIVE EXHAUSTION" SINCE PHASE 1 AND THE NAME IS WRONG IN A WAY THAT CHANGES THE TARGET.
  nilsson2005, read for its TRIPLE SPECIFICITY rather than for its marginal donor-age comparison, reports
  that global DNA methylation falls with age in resting-zone cartilage but does NOT differ between resting
  and hypertrophic zones at any single age, does NOT fall during the far more rapid replication of the
  same cells in culture, and does NOT fall with growth of the liver in vivo - AND THAT PUTTING THE CELL IN
  CULTURE RESTORES MAINTENANCE METHYLATION. Every one of those four facts is incompatible with an odometer.
  An odometer would tick faster under faster division; this ticks slower. An odometer would be carried in
  the cell; this is repaired by moving the cell. THE COUNTER IS A LEAK, NOT AN ODOMETER - a failure of
  replication-coupled maintenance specific to the SLOW replication of the resting zone inside its niche.
  THREE INDEPENDENT LINES AGREE ON THE SIGN. Deleting Dnmt1 in limb mesenchyme gives tibiae 44.7 per cent
  of control length with a NARROWED PROLIFERATIVE ZONE and accelerated hypertrophy - removing maintenance
  methylation reproduces the aged plate. The DNMT1 locus gives its most significant human MAGMA association
  with HEIGHT at P < 4.2e-35, not with density or fracture. And the loss is specific to the compartment
  that divides slowly. SO THE IDEAL ADDITION IS AN AGENT THAT RESTORES MAINTENANCE METHYLATION IN THE
  RESTING ZONE - not one that adds progenitors, which nothing does, and not one that resets the epigenome,
  which is the next paragraph. AND HERE IS THE PROBLEM THAT MAKES THIS NODE WORTH WRITING. The obvious
  candidate is partial reprogramming, and this atlas already holds the only in vivo cartilage experiment:
  osk2026 lowered predicted methylation age in mouse cartilage WITH DNMT3a DOWN AND TET2 UP - that is, by
  INCREASING demethylation. If the growth plate ages by LOSING methylation, then the one intervention that
  demonstrably rejuvenates cartilage moves the growth plate ALONG the axis it ages on. THAT IS A SIGN
  CONFLICT ON THE HIGHEST-VALUE AXIS IN THE PROJECT AND NOBODY HAS CHECKED IT. It is not yet a
  contradiction, because a methylation CLOCK is a weighted set of site-specific CpGs and global 5mC content
  is a different measurement - the two can move independently and nilsson2005 measured the second while
  osk2026 measured the first. But the risk of a sign error is real, it is cheap to resolve, and it changes
  which compound to reach for. THE PRACTICAL CONSEQUENCE THAT COSTS NOTHING: ascorbate is a cofactor of the
  TET dioxygenases and high-dose vitamin C activates DNA demethylation (ascorbate_tet2025). If the sign is
  as it appears, a high-dose vitamin C supplement is pushing the resting zone in the ageing direction. That
  is the only item in this node that can be acted on today, and the action is subtraction.'
quantitative:
- parameter: 'THE FOUR FACTS THAT KILL THE ODOMETER MODEL'
  value: methylation falls with age in the resting zone, but not between zones, not in fast culture, not
    in liver - and culture RESTORES maintenance
  unit: qualitative, four contrasts
  conditions: 'nilsson2005, rabbit. (1) Global methyl-dCMP fraction in resting-zone cartilage DECREASES
    with age. (2) It does NOT differ between resting and hypertrophic zones at any single age, so it does
    not track differentiation. (3) It does NOT fall during the far more RAPID replication of the same
    cells in culture, so it does not track divisions. (4) It does NOT fall with growth of the liver in
    vivo, so it is not a general consequence of tissue growth. And culture RESTORES maintenance
    methylation.'
  species: rabbit
  source_ref: nilsson2005
  uncertainty: 'THE ARGUMENT LIVES OR DIES ON FACT (3) AND FACT (3) IS THE ONE THIS ATLAS SHOULD PRESS
    HARDEST ON. If methylation loss were an obligate per-division event, the cells dividing fastest would
    lose the most, and they lose none. That is the observation that converts the counter from something
    carried in the genome to something imposed by the niche. WHAT IT DOES NOT ESTABLISH: this is global
    5-methyl-dCMP content by a bulk assay in ONE species, in a paper whose adjacent donor-age comparison
    was only P=0.068 (CORR-059), and "restores maintenance methylation" is the authors reading of their
    culture data rather than a direct measurement of DNMT1 activity at the fork. A bulk global measure
    can be flat while site-specific methylation at the CpGs that matter moves substantially. THE MODEL
    THIS NODE PROPOSES - a leak specific to slow replication - is a HYPOTHESIS THAT EXPLAINS FOUR
    OBSERVATIONS, not a demonstrated mechanism, and no experiment held here tests it directly.'
- parameter: 'THE SIGN CHECK, AND IT FAILS - removing maintenance methylation REPRODUCES the aged plate'
  value: 44.7 per cent of control tibial length, with a NARROWED proliferative zone
  unit: per cent of control length at 6 weeks
  conditions: Dnmt1 deleted in limb mesenchyme by Prrx1-Cre in mouse; the phenotype is a narrowed
    proliferative zone with accelerated hypertrophy. Independently, gene-level MAGMA analysis of SNPs at
    the human DNMT1 locus in the Musculoskeletal Knowledge Portal gives its most significant association
    with HEIGHT, P < 4.2e-35 - not with bone density and not with fracture
  species: mouse
  source_ref: yanagihara2025
  uncertainty: 'THIS IS THE ROW THAT SETS THE DIRECTION FOR EVERYTHING DOWNSTREAM, SO ITS LIMITS MATTER.
    A Prrx1-Cre limb-mesenchyme deletion removes DNMT1 from the whole limb bud from early development, so
    the 44.7 per cent is a DEVELOPMENTAL phenotype and not a model of a plate ageing normally - it shows
    that maintenance methylation is REQUIRED to build and hold a proliferative zone, not that its gradual
    decline is what ends growth. The human MAGMA hit is a locus association, not a direction: it says
    DNMT1 variation moves height, not which way. Together they establish that this axis has large effects
    on height in both species and that loss-of-function is the short direction. They do not establish that
    restoring methylation in an ageing plate would lengthen it, and no experiment held here does.'
- parameter: 'THE SIGN CONFLICT - the one in vivo cartilage rejuvenation experiment works by INCREASING
    demethylation'
  value: DNMT3a down, TET2 up, predicted methylation age reduced, Ki67-positive fraction unchanged
  unit: qualitative with direction
  conditions: osk2026, 12-week-old male C57BL/6, intra-articular AAV-OSK above 1e11 genome copies per
    joint at day 0 and week 4, assessed at 8 weeks in an osteoarthritis model; TET2 identified as the
    pivotal mediator; chondrocyte markers retained, no stemness rise, no dedifferentiation, no tumour
  species: mouse
  source_ref: osk2026
  uncertainty: 'THE CONFLICT STATED PRECISELY, BECAUSE IT WOULD BE EASY TO OVERSTATE. The growth plate
    resting zone loses methylation with age (nilsson2005) and losing maintenance methylation shortens
    bones (yanagihara2025). osk2026 lowers cartilage epigenetic age by turning demethylation UP. On
    their faces those point opposite ways, and if they do then the flagship rejuvenation intervention is
    contraindicated for this tissue. THREE REASONS IT MAY NOT BE A REAL CONTRADICTION. FIRST, a
    methylation CLOCK is a weighted panel of site-specific CpGs and GLOBAL 5mC content is a different
    quantity; a tissue can lose global methylation while the clock CpGs move the other way. The two
    studies measured different things. SECOND, articular and growth plate cartilage are different tissues
    with different ageing questions - degenerative against developmental. THIRD, osk2026 measured
    proliferation directly and the Ki67 fraction DID NOT DIFFER, so on the endpoint that matters here it
    did nothing in either direction. WHAT SURVIVES ALL THREE CAVEATS IS THE PRACTICAL POINT: NOBODY HAS
    MEASURED THE DIRECTION OF METHYLATION CHANGE THAT ACCOMPANIES REJUVENATION IN A GROWTH PLATE, and
    until somebody does, reaching for a reprogramming agent here is a coin flip on the sign.'
- parameter: 'THE COMPOUND THAT EXISTS FOR THE IMPOSSIBLE VERSION - partial reprogramming without genes,
    viruses or transcription factors'
  value: an optimized combination of TWO small molecules
  unit: count of molecules
  conditions: schoenfeldt2025 - chemical partial reprogramming improved genomic instability and epigenetic
    alterations in aged human cells, and a two-molecule combination was sufficient to ameliorate further
    aging phenotypes and extend lifespan. Against it, chemreprog_tox2026 reports that IN VIVO chemical
    reprogramming is associated with a toxic accumulation of lipid droplets that hinders the effect
  species: human
  source_ref: schoenfeldt2025
  uncertainty: 'THIS IS THE ANSWER TO "FIND A COMPOUND EVEN IF YOU THINK IT IS IMPOSSIBLE" AND IT IS
    GENUINELY EARLIER THAN IT SOUNDS. NO SKELETAL ENDPOINT OF ANY KIND EXISTS - not bone length, not
    growth plate, not chondrocyte, in any species. It is aged human cells in vitro plus a lifespan model.
    The in vivo counterweight is already published and is not a minor caveat: chemical reprogramming in a
    living animal accumulates lipid droplets toxically. AND IT INHERITS THE SIGN PROBLEM ABOVE INTACT,
    because chemical reprogramming targets the same epigenetic state OSK does. Listed because the
    question asked for it and because a two-molecule oral cocktail is a different accessibility class
    from AAV, NOT because the evidence supports using it.'
- parameter: 'THE ONE ITEM THAT CAN BE ACTED ON TODAY, AND THE ACTION IS SUBTRACTION'
  value: vitamin C activates DNA demethylation through TET, and the effect is lost without TET2 activity
  unit: qualitative
  conditions: ascorbate_tet2025, human HAP1 cells - ascorbate is a cofactor of the TET dioxygenases, so
    high-dose vitamin C drives ACTIVE demethylation; no skeletal tissue examined
  species: human
  source_ref: ascorbate_tet2025
  uncertainty: 'IF THE SIGN ON THIS AXIS IS WHAT IT APPEARS TO BE, A HIGH-DOSE VITAMIN C SUPPLEMENT IS
    PUSHING THE RESTING ZONE IN THE AGEING DIRECTION, and high-dose vitamin C is in most supplement
    stacks. THE CHAIN IS THREE INFERENCES LONG AND EVERY LINK IS WEAK: HAP1 cells are not chondrocytes,
    the ascorbate concentrations that drive TET in culture are not obviously reached by oral dosing, and
    the growth-plate sign itself is the unresolved question this node exists to state. AGAINST IT, AND IT
    IS NOT SMALL: ascorbate is REQUIRED for collagen prolyl hydroxylation, scurvy produces a
    disorganised growth plate, and no argument here justifies vitamin C DEFICIENCY. The claim is bounded
    to SUPRAPHYSIOLOGICAL dosing having a plausible cost that nobody has weighed, and the recommendation
    it supports is to stay at nutritional intake rather than to megadose - which costs nothing either way
    and is the only reason it is worth stating at this evidence level.'
localization:
- 'growth plate resting zone: where the methylation loss is measured and where the leak is proposed'
- 'articular cartilage: where both rejuvenation experiments were actually done'
human_evidence: indirect
human_evidence_note: The human evidence is the DNMT1 height association at P < 4.2e-35 and the human
  chondrocyte methylation clock. The mechanism, the direction and every candidate intervention are
  rabbit, mouse or non-skeletal human cells.
species_basis:
- rabbit
- mouse
- human
translation_risk: high
translation_risk_reason: The load-bearing observation is a bulk global methylation assay in rabbit; the
  candidate interventions have no skeletal endpoint in any species; and the sign of the intervention that
  would be reached for first is unresolved.
confidence: D
confidence_note: D. The four nilsson2005 contrasts are real and were read in full, and the leak model
  explains all four, which is more than the odometer model does. But it is one paper, one species, one
  bulk assay, an explanatory hypothesis rather than a tested mechanism, and the single most consequential
  claim in the node - the sign conflict - is a comparison between two different measurement types in two
  different tissues. It is not E because three independent lines agree that loss of maintenance
  methylation is the SHORT direction for bone.
claim_grades:
- claim: Growth plate senescence is a maintenance-methylation leak specific to slow replication inside
    the niche, rather than a per-division odometer.
  grade: D
  basis: A hypothesis that accounts for four contrasts in one rabbit paper - age-dependence, zone
    independence, absence under rapid culture replication, and absence in liver - plus the restoration of
    maintenance methylation in culture. No experiment tests it directly.
- claim: The best possible addition to a yield-and-duration stack acts on the counter, not on yield.
  grade: C
  basis: Follows from herrmann2002 - lifetime zero oestrogen, plates open, growth stopped anyway at 24 -
    which makes every yield and duration lever a redistribution of a fixed budget. n=1, and the cessation
    age is a history statement rather than a measurement series.
- claim: Partial reprogramming may move the growth plate in the ageing direction on this axis.
  grade: E
  basis: A directional comparison between a bulk global 5mC measurement in rabbit growth plate and a
    site-specific methylation clock in mouse articular cartilage. These are different assays in different
    tissues and the comparison may not be valid. Stated as a sign risk to be resolved, not as a finding.
key_refs:
- ref_id: nilsson2005
  first_author: Nilsson O
  year: 2005
  type: primary
  one_line_finding: Resting-zone methylation falls with age but not between zones, not under rapid culture
    replication and not in liver - and culture restores maintenance methylation.
- ref_id: herrmann2002
  type: primary
  one_line_finding: Aromatase-deficient man grew until 24 and stopped at about 197 cm with epiphyses still
    open at 27 - the budget, not fusion, is the final constraint.
- ref_id: osk2026
  first_author: Liu YW
  year: 2026
  type: primary
  one_line_finding: AAV-OSK lowers cartilage methylation age with DNMT3a down and TET2 up, without
    dedifferentiation or tumour, and does not change the Ki67-positive fraction.
- ref_id: schoenfeldt2025
  first_author: Schoenfeldt L
  year: 2025
  type: primary
  one_line_finding: A two-molecule chemical cocktail achieves partial reprogramming and extends lifespan -
    no skeletal endpoint of any kind.
- ref_id: yanagihara2025
  type: primary
  one_line_finding: Limb-mesenchyme Dnmt1 deletion gives tibiae 44.7 per cent of control length with a
    narrowed proliferative zone; the human DNMT1 locus associates most strongly with HEIGHT.
- ref_id: ascorbate_tet2025
  year: 2025
  type: primary
  one_line_finding: Vitamin C activates DNA demethylation through TET and the effect requires TET2
    activity.
