id: confetti_reporter
name: Confetti / Rainbow multicolour clonal reporters
aliases:
- R26R-Confetti
- Brainbow-2.1
- Rainbow reporter
type: method
summary: Confetti (Brainbow-2.1 knocked into Rosa26) stochastically recombines to one of four fluorophores
  (nuclear GFP, YFP, RFP, membrane CFP), so adjacent clones acquire different colours and a monochromatic
  structure can be read as clonal. It was introduced to show that intestinal crypts drift to clonality
  through neutral competition among symmetrically dividing Lgr5+ cells, and the same neutral-drift logic
  is what makes a single-coloured chondrocyte column interpretable. In the growth plate, PTHrP-creER;Confetti
  gave columns of one colour each, and Col2a1-creER;Confetti supported the same conclusion. The Rainbow
  reporter serves the same purpose in the Weissman-lab skeletal work. The critical caveats are that colour
  identity is only informative at low labelling density, that recombination frequencies of the four cassettes
  are unequal, and that a shared colour between neighbours is not proof of common ancestry - none of these
  are usually quantified in growth plate papers, which is why clonality claims here sit at confidence
  C rather than higher.
