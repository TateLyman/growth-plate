localization: >-
  growth-plate resting zone; the HSC-expansion targets localise instead to the blood
  and immune fraction of the same samples
human_evidence: indirect
human_evidence_note: >-
  The expression work is human. The two decisive functional experiments are rat organ
  culture, and the metabolic mechanism is a mouse preprint. AhR protein presence in
  human growth plate cartilage is directly shown by cedervall2015.
species_basis:
  - human
  - rat
  - mouse
translation_risk: moderate
translation_risk_reason: >-
  The negatives are strong because they combine human localisation with functional
  experiments in the right tissue. The two new contraindications - gamma-secretase
  inhibitors and bempedoic acid - are inferred from organ culture and from a preprint
  respectively, with no bone-length endpoint for either agent in any species.
confidence: B
claim_grades:
  - claim: >-
      The stem-cell-expansion pharmacopoeia is built on the haematopoietic stem cell and
      its targets are not chondrocyte transcripts
    grade: B
    basis: >-
      AHR 0.09, RCOR1 0.19, NAMPT 0.12 against calibrators that already killed two drugs
      in this file. A transcript-origin argument, subject to CORR-351
  - claim: >-
      The AhR arm is dead in the direction StemRegenin-1 acts, on a bone-length endpoint
    grade: B
    basis: >-
      cedervall2015 - agonist null across four log units, antagonist suppressive. Fetal
      rat metatarsal culture, and the suppressive concentration may be cytotoxic
  - claim: Notch maintains the resting-zone stem cell compartment
    grade: C
    basis: >-
      lin2011, bidirectional in one organ-culture experiment with both an activator and
      an inhibitor, plus PTHrP epistasis. Abstract-only, Chinese-language journal, no
      length endpoint
  - claim: Gamma-secretase inhibitors are a contraindication near an open growth plate
    grade: D
    basis: >-
      inferred from lin2011's DAPT arm. No gamma-secretase inhibitor has a growth-plate
      or bone-length endpoint in any species, and nirogacestat's paediatric reports do
      not record growth
  - claim: >-
      The growth plate makes PGE2 and carries neither Gs-coupled EP receptor, so EP4
      agonists have no receiver
    grade: C
    basis: >-
      PTGER4 0.05 and PTGER2 0.11 against PTGES 2.21 and PTGS2 70.4. A transcript
      argument only, and R306 read GSE9160 as showing PTGER4 present
  - claim: >-
      Lower glycolytic flux expands the resting zone through reduced acetyl-CoA, and the
      expansion is a jam rather than a pool
    grade: C
    basis: >-
      kobayashi2023glycolysis is a preprint, but the Acly arm is a clean dissociation of
      acetyl-CoA from ATP. The jam reading rests on the model being a short-stature
      dysplasia and on activated FGFR3 phenocopying it
  - claim: Bempedoic acid is predicted to be a contraindication
    grade: E
    basis: >-
      mechanistic only. Bempedoic acid is a prodrug requiring ACSVL1/SLC27A2, which is
      present in the plate at only 16 CPM, so local activation is itself unproven
  - claim: No drug in any species expands a chondroprogenitor pool
    grade: B
    basis: >-
      a targeted query returning zero, plus the structural reason - the indication never
      existed. An absence from searching, so it can be overturned by one paper
key_refs:
  - ref_id: cedervall2015
    year: 2015
    type: primary
    role: >-
      the kill on the AhR arm - agonist null, antagonist suppressive, with a
      longitudinal growth endpoint, plus AhR protein confirmed in human growth plate
  - ref_id: lin2011
    year: 2011
    type: primary_abstract_only
    role: >-
      the direction of Notch at the resting zone, and therefore the reason a
      gamma-secretase inhibitor is a contraindication
  - ref_id: kobayashi2023glycolysis
    year: 2023
    type: primary
    role: >-
      the new pool mechanism, and its jam signature - Acly deletion separates acetyl-CoA
      from ATP, and activated FGFR3 phenocopies the expansion
  - ref_id: bian2024
    year: 2024
    type: primary
    role: >-
      the cartilage-enriched adhesion GPCR that maintains the slow-cycling resting zone
      - already held here, and the reason ADGRG6 was not treated as new in this round
  - ref_id: mead2009
    year: 2009
    type: primary
    role: >-
      the Notch result that appears to contradict lin2011 and is reconciled by
      compartment - Rbpj deletion raises column proliferation while the reserve shrinks
  - ref_id: humphries2018
    year: 2018
    type: primary
    role: >-
      the reason the bempedoic acid contraindication does not extend to statins - 300
      children, 4.45 versus 4.60 cm per year, P=0.73
