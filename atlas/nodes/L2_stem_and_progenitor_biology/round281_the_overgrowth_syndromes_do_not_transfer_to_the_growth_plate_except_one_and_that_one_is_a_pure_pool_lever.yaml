id: round281_the_overgrowth_syndromes_do_not_transfer_to_the_growth_plate_except_one_and_that_one_is_a_pure_pool_lever
name: >-
  ROUND 281 - I TESTED ROUND 280 AND IT BROKE. The exact human Weaver allele, put into a mouse, gives ZERO
  bone length. PRC2 loss AT THE PLATE SHORTENS. So does the Sotos gene, and its own authors say so. FOUR
  GENES OF THE OVERGROWTH CLASS FAIL AT THE GROWTH PLATE - AND THE FIFTH, THE ONE THIS FILE HAD ONLY EVER
  SEEN AS A NAME IN A TABLE, IS THE CLEANEST POOL LEVER IN THE ATLAS. SPIN4 loss expands the RESTING ZONE,
  raises tibia length at two weeks, ten weeks and EIGHTEEN MONTHS, leaves terminal hypertrophic cell height
  untouched, and works through the exact mechanism this atlas has had an open gap on since round 182 -
  lowered canonical Wnt in resting chondrocytes. There is no SPIN4 drug. The compound that reaches its
  pathway implements the wrong half of it and the paper reporting it watched a growth plate fuse
aliases:
- round 281
- the overgrowth class does not transfer
- SPIN4 is the pool lever
- the Wnt inhibition arm exists
- round 280 corrected
- PORCN inhibitors elongate by discharge
type: hypothesis
layer: L2
stub: false
summary: >-
  ROUND 280 CLAIMED PRC2 LOSS BREAKS THE BONE-AGE TRADE AND IS THE ONE AXIS IN THIS FILE THAT BUYS HEIGHT
  WITHOUT PAYING MATURATION. THAT CLAIM IS NOW REFUTED, AND IT IS REFUTED BY THE EXPERIMENT ROUND 280 SAID
  NOBODY HAD RUN.

  ONE - THE WEAVER ALLELE WAS PUT IN A MOUSE AND IT DOES NOT LENGTHEN BONE. gao2024 built a knock-in of
  EZH2 p.R684C, the most common human Weaver missense variant and the one that appears three times in the
  original EZH2 mutation table. The allele works: homozygous cells show global depletion of H3K27me3. The
  skeleton does not. FEMUR LENGTH, TIBIA LENGTH AND TOTAL BODY LENGTH WERE ALL UNCHANGED at 8 weeks against
  wild-type littermates, by calipers AND by micro-CT, with 8 to 14 animals per group. A SECOND human Weaver
  allele, V626M, was also made and tibia length was also unchanged. What the allele does give is cortical
  tissue area and osteoblast activity - BONE MASS, NOT BONE LENGTH. Round 280 named the missing experiment as
  "give an EZH2 inhibitor to a normal growing animal and measure length". The genetic version of that
  experiment already existed, in the same allele the human syndrome is built from, and it is negative.

  TWO - AND AT THE PLATE ITSELF, PRC2 LOSS SHORTENS. mirzamohammadi2016 deleted Eed - the same PRC2 core
  complex, the subunit whose human loss gives Cohen-Gibson overgrowth - in Col2+ chondrocytes. The mice were
  born, then showed growth impairment, SHORTENING OF LONG BONES and severe kyphosis, with decreased
  chondrocyte proliferation and ACCELERATED hypertrophic differentiation, and usually died by four weeks.
  dudakovic2015 deleted Ezh2 in Prrx1+ limb mesenchyme and got SHORTENED FORELIMBS with craniosynostosis.
  camilleri2018 deleted Ezh2 in Col2a1+ chondrocytes and found it DISPENSABLE for chondrocyte maturation and
  endochondral ossification. So across three drivers and two subunits: shorter, shorter, or nothing. Never
  longer.

  THREE - THE SAME FAILURE REPEATS ON THE OTHER ARM OF THE CLASS, AND THE AUTHORS SAY IT OUT LOUD. shao2021
  deleted Nsd1 - the SOTOS gene, the most famous overgrowth syndrome there is - in Prx1+ mesenchyme and got
  SHORTER STATURE AND DECREASED HINDLIMB BONE LENGTH, with a thickened growth plate, disorganised
  proliferative columns and a strikingly thickened hypertrophic zone. Their own discussion records the
  contradiction: shorter stature and decreased bone length, INCONSISTENT WITH the pre- and postnatal
  overgrowth of Sotos patients. The same group reports no cartilage phenotype at all in Setd2 conditional
  mice, which is the second H3K36 overgrowth gene. FIVE GENES OF THE CLASS, FIVE SKELETAL TESTS, NOT ONE
  LENGTHENS BONE.
  THE PATTERN IS NOT NOISE - IT IS THAT THE SYNDROMES ARE NOT GROWTH-PLATE PHENOTYPES. Germline
  whole-organism haploinsufficiency produces overgrowth; the same lesion delivered to limb mesenchyme or
  cartilage produces shortening. Whatever makes these children tall is not autonomous to the plate, so an
  agent that reaches the plate does not reproduce it.

  FOUR - AND THE HUMAN CLAIM DIES TOO, KILLED BY A SENTENCE IN A PAPER THE ATLAS ALREADY HAD ON ITS OWN LIST.
  Round 280 rested on "height at least 2 SD above the mean in 59 of 65 individuals aged 1 to 70 with bone
  age advanced in 33 of 33", read as tall ADULTS despite universal maturation advance. lui2023 states the
  class rule directly: patients with epigenetic overgrowth syndromes often have advanced bone age, which
  reduces the total period for linear growth in childhood, RESULTING IN A NORMAL HEIGHT RATHER THAN TALL
  STATURE AS AN ADULT. The 1-to-70 figure pools children with adults and therefore cannot distinguish very
  tall children who regress from tall adults. THE CLASS PAYS THE TRADE. IT DOES NOT BREAK IT.

  FIVE - AND THEN THE ONE THAT DOES. SPIN4 appeared in round 280 only as a name in a review table -
  "SPIN4 (Lui-Jee-Baron)" - and was never read. Read now, it is the strongest pool result in this atlas.
  lui2023 reports a boy with a SPIN4 frameshift growing at +4.5 to +5 SDS against a midparental height of
  +1.2 SDS, with a predicted adult height of 203 cm, AND A BONE AGE ADVANCED BY ONLY ONE YEAR - the paper
  flags this as the reason he is the exception to the rule it just stated. His mother and maternal
  grandmother, heterozygous, reached ADULT heights 2 SDS above their own midparental heights. THAT IS A
  HUMAN FINAL-HEIGHT GAIN FROM A PARTIAL LOSS OF FUNCTION, WHICH IS WHAT A DRUG MAKES.
  AND HIS IGF-1 WAS 179 NG/ML - NORMAL, REPEATEDLY, AND LOWER THAN THIS SUBJECT'S 198. The fastest linear
  growth in this literature runs on an unremarkable IGF-1, so this axis is not an IGF axis and does not
  compete with the GH arm for the same limiting quantity.
  ONE QUALIFIER, FOUND IN THE SAME ROUND AND RECORDED AGAINST MY OWN ARGUMENT. chawla2025 reports a SECOND
  family with a different SPIN4 frameshift, replicating the overgrowth and the segregation - and its affected
  sibling had a BONE AGE OF 9 TO 11 YEARS AT CHRONOLOGICAL AGE 8. So the unadvanced bone age is a property of
  lui2023's proband, NOT of the gene. "SPIN4 overgrows without spending bone age" is one patient wide and
  must not be promoted to a class property. What survives the qualifier is the attained-height evidence,
  which does not depend on it: two adult carriers above their own midparental heights, and a mouse whose
  length gain is still present at eighteen months.

  SIX - AND THE MOUSE DECOMPOSES IT ONTO THE HEIGHT IDENTITY TERM BY TERM. Spin4-KO males have increased
  body length and tibia length at TEN WEEKS and already at TWO WEEKS, and lui2026 finds body length STILL
  INCREASED AT EIGHTEEN MONTHS with bone mineral density, body weight and body composition all comparable to
  wild type. Inside the plate: the RESTING ZONE height rises, resting chondrocyte NUMBER rises, and Sfrp5+
  and CD73+ progenitor markers both rise. The PROLIFERATIVE zone height, cells per column and cell height
  are ALL UNCHANGED. The HYPERTROPHIC zone height, cells per column and TERMINAL HYPERTROPHIC CELL HEIGHT
  are ALL UNCHANGED. Proliferation rate in the proliferative zone is up. Against
  round247_the_finite_number_is_N_and_the_fraction_is_not_in_the_equation that reads exactly as N UP AND LAMBDA UP WITH A AND H_TERM FLAT - the two
  terms that are still live at bone age 16, moved without touching the two that are not. Nothing else in
  this file has produced that decomposition.

  SEVEN - AND IT ANSWERS THE ATLAS'S OWN OPEN QUESTION. The gap
  g_l2_wnt_inhibition_in_resting_cells_long_columns_at_late_timepoint has stood since round 182: hallett2021
  ran the ACTIVATION arm of a two-direction experiment - raising canonical Wnt in PTHrP+ resting chondrocytes
  cut long columns at P96 from 26.5 to 7.3 - and the gap records that nobody had run the INHIBITION arm.
  lui2023 ran it without calling it that. Spin4-KO chondrocytes have reduced baseline TOPFLASH activity and
  reduced Axin2, Spin4 expression is highest in the resting zone, and the readout is more resting cells and
  a longer tibia sustained to eighteen months. It is not the exact experiment - global germline deletion, not
  a resting-cell-specific conditional, and no long-column count - but it supplies the direction and the
  endpoint the gap asked for, and it supplies them positively.

  EIGHT - AND HERE IS WHERE IT STOPS BEING SIMPLE, BECAUSE THIS ATLAS ALREADY HOLDS THE OPPOSITE RESULT.
  wnt_canonical_chondrocyte records chen2008: Col2a1-ICAT mice, a chondrocyte-restricted reduction of
  canonical beta-catenin signalling, are PROGRESSIVELY RUNTED with narrowed proliferative and hypertrophic
  zones. Lower canonical Wnt in chondrocytes shortens bone there and lengthens it in lui2023. Both are mouse,
  both are canonical, and they differ in AMPLITUDE - ICAT is a dominant blocker of the beta-catenin/TCF
  interface, Spin4 loss is a partial reduction in transcriptional output - and in ZONE, since Spin4 sits
  highest in the resting compartment. THAT MAKES CANONICAL WNT A BAND WHOSE PEAK IS NOT AT WILD TYPE. This is
  the third axis in this file that shortens bone in both directions, after hedgehog (round 268) and DNA
  methylation (round 276), but it is the first one where an interior point BEATS the wild-type setting, which
  is the difference between a band that closes an axis and a band with height in it.

  NINE - THE COMPOUND EXISTS AND IT IMPLEMENTS THE WRONG HALF. killinger2025 put two PORCN inhibitors -
  C59 and LGK974, the latter a clinical-stage agent - onto E18 mouse tibia organ cultures for eight days, and
  at 1 micromolar BOTH SIGNIFICANTLY ELONGATED THE TIBIA. That is a real length endpoint from a real drug on
  the Wnt-lowering side. But the histology is the SPIN4 result inverted: the gain came from EXPANSION OF THE
  PREHYPERTROPHIC AND HYPERTROPHIC ZONES with the PROLIFERATIVE ZONE MARKEDLY REDUCED, Col10a1 up and Ptch1
  down. At 1 micromolar the authors observed FUSION OF THE GROWTH PLATE TO HYPERTROPHIC CHONDROCYTES near the
  articular surface, and they write in their own discussion that long-term consequences may include cartilage
  exhaustion. In the only whole-organism arm they ran, zebrafish, both inhibitors SHORTENED the body axis
  dose-dependently. And dreyer2025 gave LGK974 6 mg/kg orally twice weekly for four weeks to six-week-old
  mice and found reduced vertebral trabecular number and reduced tibial cortical bone volume.
  SO THE AXIS SPLITS BY DEPTH. A mild, chronic, cell-autonomous reduction in canonical output expands the
  pool and lengthens bone for eighteen months. A complete extracellular blockade of all Wnt ligand secretion
  discharges the plate, buys length for eight days in a dish, fuses it at the top dose, and shortens a whole
  animal. THESE ARE NOT THE SAME INTERVENTION AND THE AVAILABLE DRUG IS THE SECOND ONE.

  TEN - WHAT THIS LEAVES. There is no SPIN4 ligand; it is a histone reader with no inhibitor and its loss is
  the gain, so a small molecule would have to be a degrader rather than an antagonist. The tractable
  restatement is the one the band gives: find an agent that lowers canonical Wnt TRANSCRIPTIONAL OUTPUT
  PARTIALLY AND SELECTIVELY in chondrocytes without blocking ligand secretion, and measure bone length and
  resting-zone cell number in a normal growing animal. Two compound classes exist that do canonical-only
  partial inhibition and have been in humans - tankyrase inhibitors, which stabilise Axin and act downstream
  of ligand (E7449 has a first-in-human study), and CBP/beta-catenin antagonists such as PRI-724, which block
  only the CBP-dependent arm of beta-catenin transcription. NEITHER HAS EVER BEEN GIVEN WITH A BONE LENGTH
  ENDPOINT IN ANY SPECIES. That is the named experiment now, and it replaces the one round 280 named.
  AND THE COST TERM IS ALREADY KNOWN AND IS NOT SMALL: lui2026 finds Spin4-KO males at eighteen months carry
  an INCREASED NUMBER OF TUMOURS, and reports SPIN4, EZH2 and DNMT3A all over-expressed across many human
  cancers. Every gene in this class is an oncogene or a tumour suppressor before it is a growth gene.
quantitative:
- parameter: >-
    THE HUMAN WEAVER ALLELE IN A MOUSE - ZERO EFFECT ON EVERY LENGTH MEASURE
  value: >-
    Ezh2 R684C/+ versus Ezh2 +/+ at 8 weeks: FEMUR LENGTH no difference in either sex, TIBIA LENGTH no
    difference, TOTAL BODY LENGTH no difference, distal femur trabecular structure no difference. A second
    human Weaver allele, Ezh2 V626M/+, also showed UNCHANGED TIBIA LENGTH. Positive findings were confined to
    mass and cortical geometry - cortical tissue area increased in both sexes, female bone area/tissue area
    lower, female cortical thickness trend P = 0.057, and increased body weight in females only
  unit: bone length, mm (direct calipers and micro-CT)
  conditions: >-
    gao2024. Knock-in of EZH2 p.R684C, the most common human Weaver syndrome missense variant.
    R684C/R684C mouse embryonic fibroblasts showed global depletion of H3K27me3, confirming the allele is
    catalytically compromised. n = 14 wild-type males, 9 wild-type females, 8 R684C/+ males, 10 R684C/+
    females; unpaired Student t test.
  species: mouse
  source_ref: gao2024
  uncertainty: >-
    A NULL, WITH THE LIMITS OF A NULL. One timepoint (8 weeks), heterozygous only, and the paper's positive
    controls are all mass and osteogenesis rather than length, so the study was not powered for a small
    length effect. It does NOT show that EZH2 is irrelevant to human height. It shows that the single most
    faithful available model of the human lesion produces no length phenotype, which is the specific claim
    round 280 needed and did not have.
- parameter: >-
    PRC2 AND H3K36 LOSS AT THE SKELETON - THREE DRIVERS, FOUR GENES, NEVER LONGER
  value: >-
    Eed deleted in Col2+ chondrocytes: growth impairment, SHORTENING OF LONG BONES, severe kyphosis,
    decreased chondrocyte proliferation, ACCELERATED hypertrophic differentiation, death usually by 4 weeks.
    Ezh2 deleted in Prrx1+ mesenchyme: SHORTENED FORELIMBS, craniosynostosis, clinodactyly. Ezh2 deleted in
    Col2a1+ chondrocytes: transient bone-density reduction only, DISPENSABLE for chondrocyte maturation and
    endochondral ossification. Nsd1 deleted in Prx1+ mesenchyme: SHORTER STATURE and DECREASED HINDLIMB BONE
    LENGTH with thickened growth plate and disorganised proliferative columns; Nsd1 deleted in Col2+
    chondrocytes: normal stature and normal bone length. Setd2 deleted in Prx1+ mesenchyme: no cartilage
    phenotype
  unit: direction of bone length change versus littermate control
  conditions: >-
    mirzamohammadi2016 (Eed, Col2-Cre), dudakovic2015 (Ezh2, Prrx1-Cre), camilleri2018 (Ezh2, Col2a1-Cre),
    shao2021 (Nsd1, Prx1-Cre and Col2-Cre; Setd2 result cited from the same group's prior work).
  species: mouse
  source_ref: shao2021
  uncertainty: >-
    THESE ARE CONDITIONAL NULLS, NOT PARTIAL LOSS OF FUNCTION, so they model the enzyme's requirement rather
    than the human allele's dosage - which is exactly why gao2024's knock-in matters more than any of them.
    Drivers also differ in territory and timing: Prx1/Prrx1 is limb mesenchyme from early limb bud, Col2 is
    committed chondrocytes. The consistency across drivers and genes is what carries the inference, not any
    single line. shao2021's own discussion states the Prx1 result is inconsistent with human Sotos
    overgrowth.
- parameter: >-
    SPIN4 IN HUMANS - A FINAL-HEIGHT GAIN FROM PARTIAL LOSS OF FUNCTION, WITHOUT THE BONE AGE COST
  value: >-
    Proband: birth weight 5.85 kg (+4.3 SDS), birth length 62 cm (+4.8 SDS); height tracking between +4.5
    and +5 SDS against a MIDPARENTAL HEIGHT OF +1.2 SDS; Bayley-Pinneau PREDICTED ADULT HEIGHT 203 cm;
    BONE AGE ADVANCED BY ONLY 1 YEAR (13 y 6 m at chronological age 12 y 5 m); normal pubertal timing
    (Tanner 4 pubic hair at 13); IGF-1 179 ng/mL and repeat levels unremarkable, IGF-2 normal; normal
    psychomotor development and intelligence; epiphysiodesis performed at age 13. Heterozygous MOTHER and
    MATERNAL GRANDMOTHER each reached ADULT heights 2 SDS GREATER than their own midparental heights
  unit: height SDS; predicted adult height, cm; bone age advance, years
  conditions: >-
    lui2023. Hemizygous SPIN4 frameshift c.312_313AGdel, X-linked. NSD1 sequencing and 11p15 MLPA and
    methylation analysis were normal, excluding Sotos and Beckwith-Wiedemann.
  species: human
  source_ref: lui2023
  uncertainty: >-
    ONE FAMILY, AND THE PROBAND'S OWN FIGURE IS A PREDICTION RATHER THAN AN ATTAINED HEIGHT - he had
    epiphysiodesis at 13, so his final height will never test the prediction. The attained-adult-height
    evidence is the two female carriers, n = 2, against midparental rather than against a population, and
    heterozygous rather than hemizygous. THE EXPOSURE IS ALSO GERMLINE AND PRENATAL - birth length was
    already +4.8 SDS - which is the same criticism this round levels at the PRC2 human data and it must be
    applied evenly here.
- parameter: >-
    THE SECOND SPIN4 FAMILY - INDEPENDENT REPLICATION OF THE OVERGROWTH, BUT THE BONE AGE IS ADVANCED
  value: >-
    An independent frameshift, c.648_649delTG in exon 1 of the SPIN4 Tudor domain, segregating with the
    MOTHER heterozygous and the OLDER SIBLING hemizygous and affected, with tall stature also in a maternal
    uncle. The affected sibling at 8 years of age had a HEIGHT OF 147 CM, above the 97th percentile, against
    a MID-PARENTAL HEIGHT OF 183 CM - and a BONE AGE OF 9 TO 11 YEARS AT CHRONOLOGICAL AGE 8. The proband of
    this report was diagnosed prenatally with fetal weight consistently above the 97th percentile, birth
    weight 5.0 kg, birth length 52.5 cm, and a Binder mid-facial hypoplasia phenotype. Normal
    neurodevelopment and average academic performance in the affected sibling
  unit: height, cm and percentile; bone age, years
  conditions: >-
    chawla2025, a case report of the second SPIN4 family described in the literature, in a different
    population from lui2023 and with a different variant.
  species: human
  source_ref: chawla2025
  uncertainty: >-
    A CASE REPORT, AND IT CUTS BOTH WAYS. It independently replicates the overgrowth and the segregation
    pattern with a different allele, which is what the axis most needed. BUT IT REMOVES THE PROPERTY THAT
    MADE lui2023's PROBAND SPECIAL - a bone age of 9 to 11 years at chronological age 8 is advanced by one to
    three years, so "SPIN4 overgrows WITHOUT spending bone age" is NOT established as a class property and
    must not be claimed as one. No attained adult height is reported for anyone in this family. NOTE ALSO an
    internal error in the source: its introduction states that SPIN4 loss of function results in ENHANCED Wnt
    signalling, which is backwards; its own discussion correctly states that wild-type SPIN4 enhances
    canonical Wnt and the mutant fails to. lui2023's primary functional data govern.
- parameter: >-
    SPIN4 IN MOUSE - THE POOL TERM MOVES, THE TERMINAL TERM DOES NOT, AND IT HOLDS TO EIGHTEEN MONTHS
  value: >-
    INCREASED at 2 weeks and at 10 weeks: body length, tibia length, overall proximal tibia growth plate
    height. RESTING ZONE - zone height INCREASED, resting chondrocyte number per 500 micrometre width
    INCREASED, Sfrp5+ cells INCREASED, CD73+ cells INCREASED, cell density DECREASED, EdU-labelled resting
    chondrocyte number INCREASED but resting-zone proliferative index NOT different. PROLIFERATIVE ZONE -
    zone height, cells per column and individual cell height ALL NOT DIFFERENT, but EdU proliferation rate
    INCREASED. HYPERTROPHIC ZONE - zone height, cells per column and TERMINAL HYPERTROPHIC CELL HEIGHT ALL
    NOT DIFFERENT. Wnt readouts - Spin4-KO chondrocytes had reduced baseline TOPFLASH activity and reduced
    Axin2 mRNA, rescued by Spin4 re-expression; Spin4 expression in wild type is highest in the resting zone
    (resting versus hypertrophic P = 0.033)
  unit: zone height, cell counts, EdU index, TOPFLASH luminescence
  conditions: >-
    lui2023. Spin4 long-deletion and short-deletion knockouts, male hemizygous versus wild-type littermates.
    n = 18-22 for body and tibia length, n = 14 for growth plate height, n = 8 for resting zone cell counts,
    n = 7 Sfrp5, n = 5 CD73, n = 6-8 EdU. Chondrocyte Wnt assays from 1-week-old mice.
  species: mouse
  source_ref: lui2023
  uncertainty: >-
    MAGNITUDES ARE FIGURE-ONLY - the text reports significance and direction but not the numeric increase in
    tibia length, so no effect size is recorded here and none should be quoted. The Wnt measurements were
    made on ISOLATED GROWTH PLATE CHONDROCYTES in bulk, not on resting cells specifically; the attribution to
    the resting compartment rests on the expression gradient, which is an inference. CORR-189 is satisfied
    because zone heights are accompanied by an actual bone length endpoint rather than substituting for one.
- parameter: >-
    THE SPIN4 LENGTH GAIN PERSISTS TO EIGHTEEN MONTHS, AND SO DOES THE TUMOUR COUNT
  value: >-
    At 18 months of age, male Spin4 knockout mice had INCREASED BODY LENGTH and an INCREASED NUMBER OF
    TUMOURS, while body weight, body composition and BONE MINERAL DENSITY were comparable with wild type.
    SPIN4, EZH2 and DNMT3A expression were all found elevated across many human cancer types relative to
    matched non-malignant tissue
  unit: body length; tumour count; bone mineral density
  conditions: >-
    lui2026, a PREPRINT and not peer reviewed. Aged cohort of the same Spin4 knockout line as lui2023.
  species: mouse
  source_ref: lui2026
  uncertainty: >-
    PREPRINT - graded T6 and it must not carry the same weight as the peer-reviewed lui2023. Tumour counts
    in an aged mouse cohort are strain- and housing-sensitive and the abstract gives no incidence figures.
    The cancer expression analysis is public-database correlation, which says nothing about direction of
    causation. What it does establish, and what nothing else in this class establishes, is that the length
    gain is an ATTAINED difference persisting past the end of growth rather than a rate difference.
- parameter: >-
    THE ONLY DRUG THAT LENGTHENS BONE ON THIS AXIS DOES IT BY DISCHARGE, AND FUSES THE PLATE DOING IT
  value: >-
    C59 and LGK974 at 1 micromolar SIGNIFICANTLY ELONGATED E18 mouse tibia organ cultures over 8 days;
    PF670462, a casein kinase 1 inhibitor, had NO effect on tibia length. The elongation was caused by
    EXPANSION OF THE PREHYPERTROPHIC AND HYPERTROPHIC ZONES with the PROLIFERATIVE ZONE MARKEDLY REDUCED
    (Col10a1 up, Ptch1 down). At 1 micromolar the authors observed FUSION OF THE GROWTH PLATE TO HYPERTROPHIC
    CHONDROCYTES near the articular surface of the distal plate. In zebrafish embryos in vivo both inhibitors
    caused DOSE-DEPENDENT SHORTENING OF THE BODY AXIS, still evident when dosing began at 24 hours post
    fertilisation. C59 was cytotoxic above 5 micromolar; LGK974 was not
  unit: change in tibia length over 8 days of culture; zone composition; body axis length
  conditions: >-
    killinger2025. PORCN inhibitors block palmitoleoylation and therefore SECRETION of all Wnt ligands,
    canonical and non-canonical alike. Tibia organ culture from E18 embryos, length measured proximal condyle
    to distal condyle on day 1 and day 8. Zebrafish exposure from 0, 12 or 24 hours post fertilisation.
  species: mouse
  source_ref: killinger2025
  uncertainty: >-
    AN ORGAN CULTURE OVER EIGHT DAYS IS NOT ATTAINED HEIGHT, AND THE AUTHORS SAY SO - their own discussion
    warns that long-term consequences may include cartilage exhaustion. The one whole-organism arm they ran
    went the other way. A tibia explant has no systemic endocrine input, no load and no secondary
    ossification progression, and CORR-189's cousin applies: an expanded hypertrophic zone measured over days
    is a discharge signature, not evidence of durable growth. Concentrations are 1 micromolar in a dish and
    have no defined relationship to any systemic exposure.
- parameter: >-
    THE SAME DRUG GIVEN SYSTEMICALLY TO A GROWING MOUSE - BONE COST, NO LENGTH ENDPOINT REPORTED
  value: >-
    LGK974 6 mg/kg by oral gavage twice weekly for 4 weeks from 6 weeks of age produced significant
    reductions in VERTEBRAL TRABECULAR NUMBER and lower TIBIAL CORTICAL BONE VOLUME in both loaded and
    non-loaded limbs, in males and females, WITHOUT a significant effect on body weight. Target engagement
    (Axin2 suppression) was significant only in male vertebrae. In vitro, 100 nmol/L LGK974 reduced
    osteoblast alkaline phosphatase and mineralisation and lowered Axin2, Runx2 and Ocn without affecting
    osteoclast number or resorption; 10 micromolar reduced human mesenchymal stromal cell viability
  unit: micro-CT trabecular number and cortical bone volume
  conditions: >-
    dreyer2025. Sost-/- mice, a sclerosteosis model with high bone mass; n = 11 vehicle, n = 9 LGK974. The
    dose was chosen as one previously reported to impair trabecular and cortical bone mass in wild-type mice.
  species: mouse
  source_ref: dreyer2025
  uncertainty: >-
    NO BONE LENGTH ENDPOINT WAS REPORTED, which is the measurement this atlas needs and the reason this row
    is a cost term rather than an efficacy term. The background is Sost-/- rather than wild type, so the Wnt
    setpoint is already abnormally high and the response is not a normal-animal response. Six-week-old mice
    are still growing, so the missing length measurement was available and simply not taken.
localization:
- 'growth plate resting zone: the compartment SPIN4 is most expressed in and the one whose cell number rises
  when it is lost'
- 'growth plate hypertrophic zone: the compartment PORCN inhibition expands, which is the opposite
  compartment and the opposite meaning'
- 'limb mesenchyme and committed chondrocytes: where PRC2 and NSD1 loss shorten bone, against the
  whole-organism direction of their human syndromes'
human_evidence: direct
human_evidence_note: >-
  Human evidence is direct but narrow for SPIN4 - one family, with attained adult heights only in two
  heterozygous female carriers - and the human overgrowth-syndrome literature enters here as the thing being
  corrected rather than as support. All growth-plate mechanism is mouse.
species_basis:
- mouse
- human
- zebrafish
translation_risk: high
translation_risk_reason: >-
  The positive human evidence is germline and prenatal in onset (birth length already +4.8 SDS), the mouse
  evidence is germline deletion from conception, and the proposed intervention would be partial
  pharmacological inhibition of a downstream pathway at bone age 16. Canonical Wnt is additionally a band
  with a peak that has not been located in any species, and the one available compound class overshoots it.
confidence: B
confidence_reason: >-
  The refutation of round 280 is graded high - it rests on a knock-in of the exact human allele plus four
  independent conditional deletions across two complexes and three drivers, all pointing the same way. The
  SPIN4 positive is graded B rather than A: the mouse work is single-laboratory, the human work is a single
  family, the attained-adult-height evidence is n = 2 carriers, the eighteen-month persistence is a preprint,
  and the mechanistic attribution of the Wnt reduction to the resting compartment is an inference from an
  expression gradient rather than a measurement in those cells.
claim_grades:
- claim: >-
    Loss of PRC2 function increases bone length, and PRC2 is the axis that breaks the bone-age trade.
  grade: X
  basis: >-
    REFUTED, AND THIS OVERTURNS ROUND 280. A knock-in of EZH2 p.R684C - the most common human Weaver variant,
    verified to deplete H3K27me3 - gives NO change in femur, tibia or total body length, and a second human
    allele V626M gives no change in tibia length. Eed deletion in chondrocytes SHORTENS long bones. Ezh2
    deletion in limb mesenchyme SHORTENS forelimbs. Ezh2 deletion in chondrocytes does nothing to
    endochondral ossification. And the class rule on the human side is stated in lui2023: advanced bone age
    reduces the total period for linear growth and the result is a NORMAL adult height rather than tall
    stature. The 59-of-65 figure that round 280 relied on pools ages 1 to 70 and cannot separate tall
    children from tall adults.
- claim: >-
    The epigenetic overgrowth syndromes are growth-plate phenotypes that a plate-directed drug could
    reproduce.
  grade: X
  basis: >-
    NO. Every skeletal-restricted test of the class inverts the syndrome. Nsd1 in Prx1+ mesenchyme gives
    shorter stature and decreased bone length and the authors record that this is inconsistent with Sotos
    overgrowth; Setd2 in the same driver gives no cartilage phenotype; Eed and Ezh2 shorten or do nothing.
    Whatever produces the human overgrowth is not autonomous to limb mesenchyme or cartilage, so reaching the
    plate is not the same as reproducing the syndrome.
- claim: >-
    Loss of SPIN4 increases attained bone length through an expansion of the resting-zone progenitor pool.
  grade: C
  basis: >-
    Mouse only, single laboratory, but internally complete: body and tibia length up at 2 weeks, 10 weeks and
    - in a preprint - at 18 months; resting zone height, resting cell number, Sfrp5+ and CD73+ progenitors
    all up; proliferative zone height, cells per column and cell height unchanged; hypertrophic zone height,
    cells per column and terminal hypertrophic cell height unchanged. Two deletion alleles, and a body-weight
    gene-dosage effect in females. Held at C rather than B because it is one group with no independent
    replication of the skeletal phenotype and the effect magnitudes are figure-only.
- claim: >-
    Partial loss of SPIN4 raises ATTAINED ADULT height in humans.
  grade: D
  basis: >-
    Two heterozygous carriers - the proband's mother and maternal grandmother - each reached adult heights 2
    SDS above their own midparental heights. That is an attained-height comparison against the correct
    internal control and it is the only such observation in the whole epigenetic overgrowth class. It is also
    n = 2 in one family, and the proband himself will never test the 203 cm prediction because he had
    epiphysiodesis at 13. chawla2025 independently replicates the overgrowth and the segregation in a second
    family with a different allele, but reports no attained adult height in anyone, so the adult evidence
    remains n = 2. A THIRD report exists and is paywalled - see the ask list.
- claim: >-
    Canonical Wnt tone in chondrocytes has an optimum for bone length that is NOT at the wild-type setting.
  grade: E
  basis: >-
    An inference across two mouse results that disagree. lui2023 - a mild, chronic, cell-autonomous reduction
    in canonical output - lengthens bone and expands the resting pool. chen2008, already held in
    wnt_canonical_chondrocyte - Col2a1-ICAT, a dominant blockade of the beta-catenin/TCF interface - gives
    progressively runted mice with narrowed proliferative and hypertrophic zones. Reconciling them requires
    an interior optimum below wild type, which no experiment has located and no dose-response has measured in
    any species. This is the only band in this atlas where an interior point is measured to BEAT wild type
    rather than merely differ from it, which is why it is worth an E rather than a closure.
- claim: >-
    A PORCN inhibitor is the compound implementation of the SPIN4 mechanism.
  grade: X
  basis: >-
    NO - IT IS THE OPPOSITE HALF OF THE SAME AXIS. C59 and LGK974 elongate cultured tibia, which is a real
    length endpoint, but by EXPANDING the hypertrophic zone and REDUCING the proliferative zone, the exact
    inverse of the SPIN4 zone decomposition; at the effective dose the authors watched the plate fuse to
    hypertrophic chondrocytes near the articular surface and wrote that cartilage exhaustion is the expected
    long-term consequence. In vivo the same compounds SHORTEN the zebrafish body axis dose-dependently, and
    in a growing mouse LGK974 costs trabecular number and cortical volume. Blocking secretion of all Wnt
    ligands is not the same intervention as partially lowering canonical transcriptional output in one
    compartment.
- claim: >-
    An agent exists that lowers canonical Wnt output partially and selectively enough to reproduce the SPIN4
    phenotype.
  grade: E
  basis: >-
    UNKNOWN AND UNTESTED - THIS IS THE NAMED EXPERIMENT THAT REPLACES ROUND 280'S. Two classes act downstream
    of ligand secretion and are canonical-selective and partial: tankyrase inhibitors, which stabilise Axin
    and of which E7449 has a first-in-human study, and CBP/beta-catenin antagonists such as PRI-724, which
    block only the CBP-dependent arm of beta-catenin transcription. NEITHER HAS EVER BEEN GIVEN WITH A BONE
    LENGTH ENDPOINT IN ANY SPECIES, and no dose that reproduces the SPIN4 amplitude has been defined. Graded
    E as a route, not a recommendation.
- claim: >-
    The SPIN4 axis competes with the GH/IGF arm of this stack for the same limiting quantity.
  grade: D
  basis: >-
    EVIDENCE SAYS NO. The proband grew at +4.5 to +5 SDS with an IGF-1 of 179 ng/mL - normal, repeatedly, and
    LOWER than this subject's 198 - with normal IGF-2 in him and in affected relatives. A single family is
    thin evidence, but it is direct evidence that the overgrowth is produced without an IGF elevation, which
    makes the axis mechanistically additive to rather than redundant with a GH arm.
