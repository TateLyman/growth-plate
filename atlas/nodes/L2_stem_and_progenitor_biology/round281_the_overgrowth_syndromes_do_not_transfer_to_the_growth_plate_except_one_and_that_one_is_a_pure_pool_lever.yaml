contradicts: >-
  DIRECTLY OVERTURNS
  round280_prc2_dosage_sets_the_height_per_bone_age_exchange_rate_and_it_is_the_only_axis_that_breaks_the_trade.
  Round 280's central claim - that PRC2 loss gives supranormal ADULT height despite universally advanced bone
  age, and is therefore the one axis that changes the height-per-bone-age exchange rate - does not survive.
  The exact human Weaver allele in mouse gives no length phenotype; PRC2 loss at the plate shortens bone; and
  lui2023 states the class rule that advanced bone age in epigenetic overgrowth syndromes yields a NORMAL
  adult height rather than tall stature, which is precisely the reading round 280 rejected. Round 280's
  grade-X entry against "every lever trades velocity for bone age" is withdrawn - the trade stands. What
  survives from round 280 is the syndrome direction map itself and the observation that the class is worth
  reading; what replaces its conclusion is SPIN4, the one member round 280 listed and did not read.
  It also QUALIFIES wnt_canonical_chondrocyte, which records canonical Wnt as a dose-dependent band with
  shortening at both extremes: a mild reduction now has a LENGTHENING result inside it, so the band has an
  interior optimum below wild type rather than a plateau at it.
