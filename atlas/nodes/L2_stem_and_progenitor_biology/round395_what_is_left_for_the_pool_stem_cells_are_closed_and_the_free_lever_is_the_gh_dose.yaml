  - parameter: physeal allograft transfer outcome in swine
    value: >-
      93 percent graft viability, no bars in any group, but disorganized architecture
      WITHOUT growth plate recapitulation and poor integration at 3 months
    unit: qualitative
    species: porcine
    source_ref: korpershoek2026
    note: >-
      nine domestic swine, distal femoral physeal defects, allograft versus cementation
      versus bone autograft. The most direct test of transplanting a growth plate, and
      it did not produce one. Authors note no bars formed in controls either, which
      limits the model
  - parameter: growth hormone effect on the terms of the height identity, all measured in the same animals
    value: >-
      throughput x5.00, amplification x0.77, terminal cell height x1.36; net per unit
      pool consumed x1.05, with 97 percent of the log effect being pool consumption
    unit: fold change versus saline
    species: rat
    source_ref: hunziker1994
    note: >-
      hypophysectomised rat proximal tibia, four groups of six including NORMAL
      littermates as the fourth arm, so the relation is physiological rather than a
      deficiency artefact. Amplification scales as throughput to the power -0.150
      across all four groups
  - parameter: the resting-zone stem cell hierarchy
    value: not established
    unit: qualitative
    species: multiple
    source_ref: avijgan2026
    note: >-
      systematic review - quiescence features poorly reported and underexplored,
      neither single-cell sequencing nor label retention has resolved whether distinct
      quiescent subpopulations exist. Nobody could specify which cell a cell therapy
      would inject
localization: growth-plate resting zone and its niche
human_evidence: indirect
human_evidence_note: >-
  The transplantation negative is swine. The growth hormone argument is a rat
  stereological experiment plus mouse lineage tracing, with rothenbuhler2011 as the
  only human protocol built around an IGF-1 target rather than a fixed dose - n
  equals 6, single-arm, in children with activating FGFR3 mutations.
species_basis:
  - porcine
  - rat
  - mouse
  - human
translation_risk: high
translation_risk_reason: >-
  The transplantation closure is a single large-animal feasibility study whose own
  authors flag that no bars formed in controls. The growth hormone argument rests on
  an exponent fitted to four points in one rat experiment and has never been tested
  at a dose endpoint in any species, and it runs against the clinical intuition that
  more growth hormone gives more growth.
confidence: C
claim_grades:
  - claim: Transplanting growth-plate tissue does not recreate a functioning growth plate
    grade: B
    basis: >-
      korpershoek2026, large animal, three-month readout with CT, MRI, histology and
      donor DNA. Single study, and the model is weakened by controls not forming bars
  - claim: >-
      The growth-plate cell-therapy field is entirely aimed at repairing injury, so
      none of it predicts anything about enlarging a normal plate
    grade: A
    basis: >-
      an observation about the indication of every paper in the field. CORR-203 and
      CORR-295 both apply
  - claim: >-
      mTORC1 activation is a second independent pool mechanism with no agent in the
      wanted direction
    grade: C
    basis: >-
      newton2019's Tsc1 ablation with all rate controls null; no compound search has
      found an activator, and the pathway's drugs are all inhibitors
  - claim: >-
      From a fixed pool, growth hormone is approximately height-neutral and consumes
      the reserve five times faster
    grade: C
    basis: >-
      hunziker1994's four-group stereology, including a normal-littermate arm. The
      exponent is fitted to four points in one experiment - a description, not a law
  - claim: Lowering the growth hormone dose could raise total height from the same reserve
    grade: E
    basis: >-
      a derivation from that exponent, never tested at a dose endpoint in any species,
      and running against three human tests of growth hormone SCHEDULES - though those
      tested pauses rather than dose reduction, which is a different quantity
  - claim: >-
      Terminal hypertrophic cell height is pool-free height, so dropping the CNP arm
      removed the most pool-efficient term
    grade: C
    basis: >-
      h_term is roughly 80 percent of longitudinal growth and dauber2026 showed
      velocity gain with the bone-age ratio unmoved. The compartment objection - the
      CNP axis allocates to leg while the residual is trunk - is equally real
