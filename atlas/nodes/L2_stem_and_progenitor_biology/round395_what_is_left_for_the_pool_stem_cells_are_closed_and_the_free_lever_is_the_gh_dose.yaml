id: round395_what_is_left_for_the_pool_stem_cells_are_closed_and_the_free_lever_is_the_gh_dose
name: "R395: what is actually left for the reserve - cell transplantation is closed by a swine allograft that produced no growth plate, and the two unexhausted levers are the GH dose and the h_term arm that was dropped"
aliases:
  - stem cell injection growth plate
  - physeal allograft
  - pool expansion alternatives
  - GH dose and the pool
type: hypothesis
layer: L2
stub: false
summary: >-
  The question was whether anything expands the growth-plate reserve better than a
  hedgehog agonist - cell injection, transplantation, or some unexamined niche
  approach. Three answers, and the most useful one is free.

  CELL TRANSPLANTATION IS CLOSED, AND THIS ATLAS ALREADY HELD THE ANSWER.
  korpershoek2026 has been in the bibliography since 2026-08-07 with the finding
  extracted in its own headline: transplanting a growth plate does not recreate a
  growth plate. Physeal allograft transfer in nine domestic swine, distal femoral
  defects treated with allograft from donor pigs against cementation or bone
  autograft, read at three months by CT, MRI, histology and donor DNA. The grafts
  were 93 percent viable after procurement and every animal reached endpoint without
  gross deformity - and ALL GROUPS SHOWED DISORGANIZED TISSUE ARCHITECTURE WITHOUT
  GROWTH PLATE RECAPITULATION, with poor integration and incomplete repair. That is
  the most direct version of the idea, in a large animal, and it does not work.

  THE WHOLE FIELD IS AIMED SOMEWHERE ELSE. Every recent review and experimental
  paper on growth-plate cell therapy, tissue engineering, scaffolds, hydrogels and
  extracellular vesicles is about REPAIRING AN INJURED PHYSIS - preventing or
  resecting the bony bar that forms after a Salter-Harris fracture. Nobody is trying
  to make a normal plate bigger, because being short after an injury is a disease
  and being tall is not. That is CORR-295 as an entire literature, and it means
  every result in it is restoration in a damaged system, which CORR-203 excludes
  from predicting anything here.

  AND THE FOUNDATION IS THINNER THAN THE FIELD IMPLIES. avijgan2026's systematic
  review states that features of cellular quiescence in resting-zone chondrocytes
  are poorly reported and underexplored, that neither single-cell sequencing nor
  label-retention has established whether distinct quiescent sub-populations exist,
  and that THE HIERARCHY OF RESTING-ZONE STEM CELLS IS NOT ESTABLISHED. So even
  setting delivery aside, nobody could specify which cell to inject. Against that,
  newton2019 shows the postnatal plate is fed by self-renewing stem cells IN A
  NICHE, with monoclonal columns - the architecture, not the cell count, is what
  produces growth. A hedgehog agonist works on the niche that already exists; a cell
  therapy would have to build one.

  WHAT IS GENUINELY UNEXHAUSTED, FIRST: mTORC1 ACTIVATION. newton2019's Tsc1
  ablation distributed PAR3 symmetrically in more stem-cell dyads and expanded
  multi-columnar clones from P3 to P90 while every rate control stayed null - the
  same signature as SPIN4, reached by a different pathway. It is a second,
  independent pool mechanism. There is no agent in the activating direction: every
  drug on that axis is an inhibitor, and rapalogs and metformin are already
  contraindicated here for exactly that reason. A real gap, and probably an empty
  shelf.

  WHAT IS UNEXHAUSTED, SECOND, AND MAY MATTER MORE THAN ANY COMPOUND: THE GROWTH
  HORMONE DOSE. hunziker1994 measured every term in the same animals. From a FIXED
  pool, total height is amplification times terminal cell height and NOT throughput.
  Growth hormone raises throughput 5.00-fold, lowers amplification to 0.77 and
  raises terminal cell height 1.36-fold, so per unit of pool consumed it is
  approximately height-neutral at 1.05 - and 97 percent of its effect is pool
  consumption. Fitted across all four groups, amplification scales as throughput to
  the power minus 0.150, so halving throughput buys about 11 percent more
  amplification per stem cell spent.

  Three independent lines now converge on the same direction: hunziker1994 says
  growth hormone burns the pool at break-even yield; chu2025 says pharmacological
  growth hormone promotes committed rather than self-renewing division and depletes
  the slow-cycling stem cells; karki2026 says growth hormone shortens the primary
  cilium, which is the organelle in which all hedgehog transduction occurs. If the
  pool is the binding constraint - which is the entire premise of adding a hedgehog
  agonist - then the growth hormone dose is a lever pointing the wrong way, and
  lowering it could raise total height from the same reserve.

  THE COUNTERWEIGHT IS REAL AND MUST BE STATED: R367 tested pool-sparing growth
  hormone SCHEDULES three times in humans, twice randomised, and pauses never bought
  height - a one-week gap actively lost it. But a pause is not a dose reduction. A
  pause removes treatment days; a lower dose changes the yield per stem cell
  consumed, which is a different quantity. The closest human precedent is
  rothenbuhler2011: six children with FGFR3 hypochondroplasia given growth hormone
  TITRATED TO AN IGF-1 TARGET rather than a fixed milligram-per-kilogram dose,
  deliberately discontinuous, reaching plus 1.9 height SDS over 6.1 years at a
  cumulative 0.075 mg/kg/day - with trunk-leg disproportion IMPROVED. That is n
  equals 6, single-arm, with no continuous comparator, in children with an
  ACTIVATING FGFR3 mutation rather than a wild-type subject on an inhibitor. It is a
  dosing-target precedent, not evidence the schedule works.

  AND A THIRD THING, WHICH IS AN OBSERVATION ABOUT A DECISION ALREADY MADE.
  Terminal hypertrophic cell height is roughly 80 percent of longitudinal growth and
  it is the one term that adds height WITHOUT spending a division - pool-free
  height. The CNP arm is what moved it, and dauber2026 showed velocity plus 4.0 SD
  with the bone-age ratio unmoved. Dropping vosoritide removed the most
  pool-efficient arm in the stack, which under a pool-limited model is the opposite
  of what the framework recommends. The counter is compartment: R318 puts the CNP
  axis at essentially 100 percent leg allocation while the residual is trunk. Both
  are true, and navepegritide is approved, once weekly, and labelled for open
  epiphyses - so a CNP analogue is obtainable today in a way that a hedgehog agonist
  is not.
