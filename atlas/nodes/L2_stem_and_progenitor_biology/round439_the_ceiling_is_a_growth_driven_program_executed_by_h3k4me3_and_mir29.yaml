human_evidence_note: The program itself is measured in rodent and sheep organs, never in a human and never
  in a growth plate. The human contribution is the independent burden-genetic evidence on the execution
  mark - LOXL2, KMT2B and ASH1L in 1.45M exomes - which is a different instrument answering the same question
  about H3K4me3 rather than a measurement of the program.
translation_risk: high
translation_risk_reason: The program is characterised in lung, kidney, liver and heart, not cartilage; its
  growth-plate version is inferred. No intervention exists that slows the counter without slowing growth,
  and every one that does slow it is a loan repaid rather than banked height. Anti-miR-29 carries three
  arms with three different signs.
summary: 'THE LEDGER FAILURE FIRST, BECAUSE IT IS THE LARGEST IN THIS FILE''S HISTORY. R423 found that the
  atlas''s declared primary target, amplification, was invisible to CLAUDE.md. This is bigger: it is the
  CEILING - the object every round since R355 has been trying to move. Grep on 2026-08-15 returns miR-29
  in 2 node files and 0 ledger mentions; delaney2014 2 and 0; lui2010 2 and 0; finkielstain 1 and 0; "growth-limiting
  program" 3 and 0; tryptophan 4 and 0; "arm 3" 7 and 0; sizostat 2 and 0; canalization 1 and 0. EVERY MECHANISTIC
  COMPONENT OF THE GROWTH CEILING SITS AT ZERO LEDGER PRESENCE. And the node holding it, arm3_pool_ceiling_is_imposed_not_intrinsic,
  is grade B, states its own target, and closes with the instruction that the arm is not closed and must
  not be written up as though it were. It has been written up as though it were for roughly eighty rounds.


  WHAT THE PROGRAM IS. lui2010, in juvenile rat lung, kidney and liver by expression microarray, real-time
  PCR and siRNA validation, identifies a COMMON MULTI-ORGAN PROGRAM that coordinately down-regulates a
  large set of growth-promoting genes, and offers it as the reason children grow and adults do not. It
  is not a growth-plate phenomenon - it runs simultaneously in organs that contain no growth plate. Its
  driver is GROWTH ITSELF AND NOT AGE: a tryptophan-deficient diet that stalled growth for four weeks DELAYED
  the program, with 159 of 235 uniformly age-downregulated genes significantly delayed, and the comparison
  was made AT MATCHED BODY SIZE precisely to separate prior growth history from concurrent malnutrition.
  Hypothyroidism delays it (finkielstain2009) and dexamethasone delays growth-plate senescence and epiphyseal
  fusion (gafni2001). THAT IS ALSO WHY SUPPRESS-AND-RELEASE IS A LOAN: every known way to slow the counter
  slows it BY SLOWING GROWTH. R366, R431 and R433 reached that conclusion empirically from oichi2023 and
  gafni2001 without the mechanism; here is the mechanism, and it makes the loan structural rather than incidental.


  THE JOIN NOBODY HAD MADE, AND IT IS THE ROUND. lui2010 reports that the genes the program shuts off show
  DECLINING HISTONE H3K4 TRIMETHYLATION WITH AGE AT THEIR PROMOTERS. R333 reached the same mark from a completely
  independent instrument - kosmicki2026, 1.45 million human exomes - where the H3K4me3 ERASER LOXL2 is +0.68
  cm on loss at P=1.4e-16 across 7,404 carriers while the WRITERS KMT2B and ASH1L are -0.35 and -0.41. MORE
  H3K4me3 IS TALLER. A rat microarray time course and a million-exome burden test point at one histone mark
  in one direction, this atlas has held both for many rounds, and they had never appeared in the same sentence.
  It upgrades the H3K4 arm from "the live half of the epigenetic ceiling" to the EXECUTION MECHANISM OF THE
  CEILING, and it retro-explains the AKG and megadose-ascorbate contraindications, since the KDM5 erasers
  are 2-oxoglutarate dioxygenases fed by the same cofactors.


  THE PACE IS THE SPECIES BODY-SIZE VARIABLE, AND THIS IS THE STRONGEST EVIDENCE IN THE ATLAS THAT THE CEILING
  IS A DIAL RATHER THAN A WALL. delaney2014 shows the program is CONSERVED IN SHEEP across roughly 80 million
  years of divergence - an overlapping set of age-down-regulated genes in juvenile sheep kidney and lung,
  enriched for proliferation and growth, strikingly similar to the mouse and rat set - and that its PACE
  is MOST RAPID IN MICE, MORE GRADUAL IN RATS AND MOST GRADUAL IN SHEEP. The authors conclude the program
  is conserved but evolutionarily MODULATED IN TIME COURSE, allowing more prolonged growth and therefore
  greater adult size in larger mammals. The same genes running at rates that differ by orders of magnitude
  between species is a rate that something sets, and nobody has identified what sets it. That is the largest
  unclaimed question in this file and it sits upstream of every compound in it.


  THE PROGRAM HAS A NAMED microRNA DRIVER, CAUSALLY TESTED, NEVER LOOKED AT IN A GROWTH PLATE. kamran2015
  found miR-29 target sequences over-represented among the age-down-regulated genes, then showed all three
  family members - miR-29a, -29b and -29c - strongly up-regulated from 1 to 6 weeks of age in mouse kidney
  and lung, confirmed by real-time PCR in liver, kidney, lung and heart, and higher in hepatocytes from 5-week-old
  mice than from E16.5 embryonic liver. Causality by luciferase: 3-prime UTR constructs from IGF1, IMP1/IGF2BP1
  and MEST were each suppressed by miR-29 mimics and the suppression was diminished by mutating the sites.
  A PubMed query for miR-29 AND growth plate returns ZERO records and miR-29 AND chondrocyte returns two.
  The microRNA that drives body-growth deceleration has never been studied in the tissue that makes height.
  It also joins R434 from the other side - let-7 rises with age and targets IGF2BP1 and HMGA2, miR-29 rises
  with age and targets IGF1, IGF2BP1 and MEST - two heterochronic microRNA families, both rising, converging
  on the same IGF and IGF2BP axis, with IGF2BP2 at -8.68 cm in the 207.


  AND THE ANTI-miR-29 PROPOSAL IS NOT CLEAN - THREE ARMS, THREE SIGNS, STATED BEFORE ANYONE PROMOTES IT.
  Growth-limiting program (kamran2015): miR-29 rises with age and shuts off growth genes, so blocking is
  FAVOURABLE. Osteoblast (hrdlicka2021): miR-29-3p is a positive regulator of osteoblast differentiation
  and a global tough decoy DECREASED bone formation in growing mice, so blocking is COSTLY - though the endpoint
  is bone mass and formation rate, not length. Cartilage Wnt (le2016mir29): the miR-29 family negatively
  regulates canonical WNT with FZD3, FZD5, DVL3, FRAT2 and CK2A2 validated as direct targets, so blocking
  RAISES Wnt, and R281 puts the canonical-Wnt optimum BELOW wild type. THE COST ARM IS ALSO CORR-340 IN ITS
  PUREST FORM: hrdlicka2021''s global miR-29-3p tough decoy mouse exists at 30-60 per cent knockdown, was
  built explicitly as a proxy for a systemically administered inhibitor, was phenotyped in GROWING animals
  by micro-CT and histomorphometry, and reports bone formation and trabecular volume and never femur or tibia
  length. It is the same laboratory and the same technique as thakore2026, whose miR-433 tough decoy DID report
  shortened femurs - so the group measures length when it chooses to. A useful mechanistic bonus from the
  same cartilage paper: SOX9 REPRESSES miR-29 in chondrocytes while TGF-beta1 lowers it and IL-1beta raises
  it, so the master chondrocyte transcription factor holds the brake down and the brake lifts as SOX9 output
  falls.


  WHAT IS STILL NOT TRUE. No intervention exists that slows the counter without slowing growth - the node''s
  own stated target, unmet. The program is measured in lung, kidney, liver and heart and not in a growth
  plate. No anti-miR-29 agent has a bone-length endpoint in any species, and the clinical miR-29 shelf runs
  the wrong way, since the developed agents are miR-29 MIMICS for fibrosis. delaney2014''s species comparison
  is kidney and lung expression, not bone and not length. And the honest ceiling from the source node itself
  is that three independent routes put the residual cost of suppress-then-release at 1.2 to 1.9 mm, 2 to
  4 per cent of final bone length - real, but a LOSS, and no route to more length than the animal would have
  reached anyway has ever been demonstrated.'
