id: lepr_positive_stromal_cell
name: LepR+ bone marrow stromal cell
aliases:
- LepR+ MSC
- leptin receptor-expressing stromal cell
type: cell_type
summary: 'LepR marks roughly 0.3% of mouse bone marrow cells; about 10% of these are CFU-F and they account
  for 94% of all marrow CFU-F, making LepR the highest-purity prospective marker for marrow stroma. LepR+
  cells are Scf-GFP+, Cxcl12-DsRed-high and Nestin-GFP-low, and form bone, cartilage and adipocytes in
  culture and on transplantation. Their in vivo behaviour is strongly age-restricted: they contribute
  little or nothing to developing bone or to growth plate cartilage, and become the main source of osteoblasts
  only in adult mice - after adolescence, according to dual-recombinase fate mapping, where the dominant
  osteoblast source switches from chondrocytes to LepR+ stroma and the switch begins in the diaphysis
  and spreads to the metaphysis. This is why LepR+ cells cannot be the growth plate stem cell: they occupy
  the wrong compartment at the wrong time. Their adipogenic competence also puts them on the opposite
  side of the fat-or-no-fat disagreement from the mSSC and Grem1+ schemes.'
