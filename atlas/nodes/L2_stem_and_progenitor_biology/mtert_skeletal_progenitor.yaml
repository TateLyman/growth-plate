id: mtert_skeletal_progenitor
name: mTert+ transitional skeletal progenitor
aliases:
- telomerase-expressing skeletal progenitor
type: cell_type
summary: 'Telomerase reverse transcriptase expression is a common, if imperfect, proxy for stem-cell identity
  in self-renewing tissues, and mTert-GFP reporter mice show that its expression in long bone is not constitutive
  but peaks at the time of adolescent bone growth. mTert-GFP+ cells sit in the metaphyseal stroma, the
  growth plate and the marrow, have enriched colony-forming capacity relative to unsorted cells, and contribute
  to multiple mesenchymal lineages - a distinct, transitional skeletal progenitor rather than a lifelong
  pool. The temporal restriction matters for the senescence models in this layer: it is consistent with
  a growth-associated, self-limiting progenitor compartment rather than a permanently telomerase-competent
  stem cell. Whether human growth plate chondrocytes express TERT at any age is not established (see gap
  g_l2stem_007).'
quantitative: []
localization:
- 'mouse metaphyseal stroma, growth plate and bone marrow: confirmed by mTert-GFP (carlone2021)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No measurement of TERT expression or telomerase activity in human growth plate chondrocytes
  was found.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Mouse and human telomere biology differ substantially - laboratory mice have
  long telomeres and broader somatic telomerase expression - so a murine mTert reporter is a poor guide
  to human chondrocyte replicative limits.
confidence: D
