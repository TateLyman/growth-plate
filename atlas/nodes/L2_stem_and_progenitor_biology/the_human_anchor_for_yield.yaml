id: the_human_anchor_for_yield
name: THE HUMAN ANCHOR - the decomposition holds in man at 88 per cent, terminal cell height is conserved
  across three species, and the human proliferative cycle is TEN TIMES SLOWER than the rodent one every
  result in this programme was measured in
aliases:
- human amplification
- kember1976 human growth plate
- human cell cycle time 20 days
- does the yield decomposition hold in humans
- rodent to human scaling growth plate
- round 177
type: hypothesis
layer: L2
stub: false
summary: 'THE YIELD SCREEN WAS OPENED TO FIND AN AGENT THAT RAISES AMPLIFICATION. ITS FIRST RETURN IS NOT
  AN AGENT - IT IS THE HUMAN ANCHOR THE PROGRAMME DID NOT HAVE, AND IT BOTH CONFIRMS THE DECOMPOSITION AND
  IMPOSES A SCALING FACTOR ON EVERYTHING ELSE.

  THE DECOMPOSITION HOLDS IN MAN, AT THE SAME NUMBER. kember1976 measured the human distal femur across
  growth - maturing-plus-proliferating cells per column, hypertrophic cells per column, and terminal
  hypertrophic cell height, in the same columns, with growth rates from serial radiographs in the
  Harpenden Growth Study. From birth-to-two years against thirteen-to-fourteen years, the AMPLIFYING
  COMPARTMENT falls 1.96-fold, from 49.6 to 25.3 cells per column, while TERMINAL HYPERTROPHIC CELL HEIGHT
  falls 1.10-fold, from 34.4 to 31.3 micrometres. EIGHTY-EIGHT PER CENT OF THE LOG FALL IS COMPARTMENT SIZE
  AND TWELVE PER CENT IS CELL HEIGHT. Round 174 got 88 per cent in MOUSE from a between-bone contrast;
  round 176 got 91 per cent in RABBIT from a drug. This is 88 per cent in HUMAN from ageing. THREE SPECIES,
  FOUR CONTRAST TYPES, NO SHARED DATA, SAME ANSWER.

  AND THE CONSERVED TERM IS CONSERVED ACROSS SPECIES TOO, NOT ONLY ACROSS BONES. Terminal hypertrophic cell
  height: human 25-39 micrometres across the whole of growth, mouse 18-33, rat 18-38. Three species whose
  proliferative kinetics differ TENFOLD, and the terminal cell height ranges overlap almost completely.
  Whatever varies in this tissue, it is not how tall the last cell gets.

  THE NUMBER THAT RESCALES THE PROGRAMME. At five to eight years the human distal femur grows 1.4 cm per
  year - 38 micrometres per day - which at a 33 micrometre terminal cell height is 1.2 NEW CELLS PER COLUMN
  PER DAY. With about 24 proliferating cells per column that gives a MEAN CELL CYCLE TIME OF TWENTY DAYS.
  THE RODENT FIGURE IS TWO DAYS. This atlas independently computed 10.8 and 8.33 new cells per column per
  day for the mouse femur at one and three weeks in round 174 - about ten times the human rate, arriving at
  Kember''s factor from different data fifty years later.

  EVERY KINETIC RESULT IN THIS PROGRAMME WAS MEASURED ON THE FAST CLOCK. Newton''s clone sizes, the Tsc1
  and hedgehog perturbations, the lui2018 between-bone yields - all mouse, all on a two-day cycle. The
  nilsson2014 oestrogen yield is rabbit, intermediate. The subject is human, on a twenty-day cycle. A
  five-week rodent experiment covers roughly seventeen proliferative cycles; five weeks in a human covers
  fewer than two. TIMES, DOSES AND WASHOUT INTERVALS DO NOT TRANSFER, AND NEITHER DOES ANY CLAIM THAT
  DEPENDS ON HOW MANY CYCLES AN AGENT HAD TO ACT WITHIN.

  KEMBER SAYS SO HIMSELF, ABOUT THIS EXACT TISSUE AND THIS EXACT QUANTITY: "it is unwise to extrapolate
  the findings in this tissue from mouse to man". And he names a structural reason beyond the kinetics - in
  man an INERT ZONE 0.5 to 1.2 mm thick lies between the proliferating cells and the epiphysial vessels,
  whereas in rat and rabbit those vessels nourish the proliferative zone directly. THE HUMAN AMPLIFYING
  COMPARTMENT SITS BEHIND A DIFFUSION BARRIER THE RODENT ONE DOES NOT HAVE, which is a second reason
  rodent kinetics understate human transit times and a direct connection to the atlas exposure arm.

  WHAT THE CLOSING PLATE LOOKS LIKE IN MAN. The most closed specimen in the series is a fourteen-year-old
  female with an inert zone of 0.1 mm against 0.5-1.2 in every other case, a columnar zone of 0.4 mm, TWO
  hypertrophic cells per column against six to twelve, and 21 maturing-plus-proliferating cells against a
  birth-to-two-year mean of 50. The compartment has fallen 2.4-fold and the terminal cell height 1.4-fold.
  Even at the point of closure the split is the same.

  WHAT THIS DOES NOT GIVE, STATED PLAINLY. NO HUMAN YIELD. kember1976 has no resting-zone CELL COUNT
  anywhere - only an inert-zone WIDTH - so the denominator of a yield cannot be formed. The human numbers
  above are a compartment-size decomposition across age, not an output-per-progenitor-consumed measurement.
  And the split of the measured maturing-plus-proliferating total into 24 PROLIFERATING cells is an
  assumption Kember imported FROM RABBIT, because the two cell types cannot be separated morphologically -
  so the twenty-day cycle time inherits a cross-species assumption even though the compartment counts do
  not.

  WHAT IT MEANS FOR THE CASE. At bone age 16 the amplifying compartment is near the bottom of its human
  range and turning over on a twenty-day clock. An agent acting on transit time has very few cycles left to
  act within, and any candidate whose evidence is a five-week rodent experiment has been tested over an
  effective duration an order of magnitude longer, in cycles, than it would get here.'
