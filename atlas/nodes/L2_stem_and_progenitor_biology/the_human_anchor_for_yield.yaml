human_evidence: direct
human_evidence_note: 'Direct human histology of the distal femur across the whole of growth, with growth
  rates from a longitudinal radiographic study. The weaknesses are of sample size and era - one or two
  specimens per age point, 1976 methods, and cell counts the authors themselves call subjective - not of
  species.'
species_basis:
- human
- mouse
- rat
translation_risk: low
translation_risk_reason: 'This node IS the translation check. Its purpose is to test whether the rodent
  decomposition holds in man and to quantify the rate at which the two systems differ, and it does both.
  The residual risk is small-n and 1976 histology, not extrapolation.'
confidence: C
claim_grades:
- claim: The yield decomposition holds in humans - amplification carries it, terminal cell size does not.
  grade: C
  basis: 'Human distal femur, same columns, across the whole of growth: amplifying compartment down
    1.96-fold against terminal cell height down 1.10-fold, giving 88 per cent of the log fall to
    compartment size. It matches mouse at 88 per cent and rabbit at 91 per cent from unrelated data and
    unrelated designs. C not B because it is one or two specimens per age point, 1976 histology with cell
    counts the authors call subjective, and a COMPARTMENT-SIZE decomposition rather than a yield - there is
    no resting-zone denominator in the paper.'
- claim: Terminal hypertrophic cell height is conserved across species as well as across bones.
  grade: B
  basis: 'Human 25-39 micrometres, mouse 18-33, rat 18-38, across three species whose proliferative cycle
    times differ tenfold. Three independent datasets, overlapping ranges. This is the strongest form the
    round-174 claim has taken and it now rests on human data rather than on rodent contrasts alone.'
- claim: The human proliferative cell cycle is about ten times slower than the rodent one.
  grade: B
  basis: 'kember1976 computes 20 days for human against 2 days for rodent, and this atlas independently
    computed mouse cell production at 10.8 and 8.33 cells per column per day in round 174 against Kember''s
    human 1.2 - the same factor from different data half a century apart. B not A because the human figure
    depends on a proliferative fraction assumed from rabbit.'
- claim: Rodent timings, doses and washout intervals transfer to the human plate.
  grade: X
  basis: 'NO, AND THE PROGRAMME MUST CARRY THIS. A five-week rodent experiment spans roughly seventeen
    proliferative cycles; five weeks in a human spans fewer than two. Every kinetic result this programme
    rests on - Newton''s clone sizes, the Tsc1 and hedgehog perturbations, the lui2018 yields - was measured
    on the fast clock. Kember states the conclusion himself for this exact tissue: it is unwise to
    extrapolate from mouse to man. He also names a structural reason - the human inert zone interposes a
    diffusion barrier between the proliferating cells and the epiphysial vessels that rodents do not have.'
- claim: A human yield can be computed from kember1976.
  grade: X
  basis: 'NO. The paper reports an inert-zone WIDTH and never a resting-zone CELL COUNT, so the denominator
    of a yield cannot be formed. What it gives is a compartment-size decomposition across age. The human
    yield remains uncomputed in any dataset the atlas holds.'
