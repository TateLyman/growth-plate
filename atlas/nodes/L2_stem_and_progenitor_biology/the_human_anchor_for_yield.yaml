contradicts:
- 'DOES NOT CONTRADICT the rodent decomposition - it confirms it in a third species and a fourth contrast
  type. What it contradicts is the implicit assumption, running through rounds 174 to 176, that rodent
  KINETICS could be carried across. They cannot: the human cycle is tenfold slower and the human
  compartment sits behind a diffusion barrier with no rodent equivalent.'
