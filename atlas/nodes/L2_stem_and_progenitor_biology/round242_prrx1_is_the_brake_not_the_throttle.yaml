id: round242_prrx1_is_the_brake_not_the_throttle
name: >-
  ROUND 242 - the exit switch, and a correction to the framing this programme inherited. PRRX1 DOES NOT
  MAKE ROOT CELLS PROLIFERATE, IT HOLDS THEM UNDIFFERENTIATED AND SLOW - two independent functional antler
  studies show REMOVING Prrx1 is what launches the chondrogenic burst, so PRRX1 IS THE BRAKE AND RAISING IT
  WOULD SUPPRESS OUTPUT
type: hypothesis
layer: L2
aliases:
- PRRX1 is the brake
- the exit switch
- miR-140-3p releases the root cell
- round 242
stub: false
summary: |
  THE REFRAME THAT OPENED THIS LINE NAMED A 'PRRX1+/PTHrP- ROOT STEM CELL' AND ASKED WHAT LETS IT SELF-RENEW
  WHILE CONTINUOUSLY GENERATING A COMMITTED DAUGHTER. THAT IS THE RIGHT CELL. BUT THE ONLY FUNCTIONAL
  EXPERIMENTS ANYONE HAS DONE ON PRRX1 IN A GROWTH-PLATE-LIKE TISSUE POINT THE OPPOSITE WAY FROM THE OBVIOUS
  INTERVENTION, AND THE ATLAS SHOULD SAY SO BEFORE THE FRAMING HARDENS.

  ONE - PRRX1 IS A MAINTENANCE FACTOR FOR THE UNDIFFERENTIATED, LOW-PROLIFERATION STATE. hu2024 built
  lentiviral overexpression and RNAi lines in sika deer antler reserve mesenchyme cells, three biological
  replicates per group, and found Prrx1 and miR-140-3p in RECIPROCAL NEGATIVE FEEDBACK: raising miR-140-3p
  drives Prrx1 down and interfering with miR-140-3p drives it up, in both directions, at mRNA and protein.
  The authors' own reading of what the loop does is the load-bearing sentence - as miR-140-3p rises, Prrx1
  is inhibited, THE MAINTENANCE OF RM CELL SELF-RENEWAL AND PLURIPOTENCY IS DISRUPTED, and that is what
  INITIATES the rapid chondrogenic differentiation the antler is famous for. hu2025, an independent paper on
  the sibling microRNA miR-143-3p, reports the same direction from the other side: PRRX1 OVEREXPRESSION
  DECREASES PROLIFERATION AND MAINTAINS THE UNDIFFERENTIATED STATE.

  SO IN THE ONLY TISSUE WHERE PRRX1 HAS BEEN MANIPULATED AND THE OUTPUT MEASURED, MORE PRRX1 MEANS SLOWER
  AND LESS DIFFERENTIATED, AND LESS PRRX1 IS WHAT RELEASES THE BURST. THIS IS THE SAME SHAPE AS ROUND 241
  AND IT IS NOW THE THIRD INDEPENDENT INSTANCE OF IT: the root state is actively held, and every known way
  of leaving it is a release rather than a push. Round 241 found the ligand-level brake (self-secreted WNT
  and TGF-beta antagonists); this is the transcription-factor-level brake sitting inside the same cell.

  TWO - WHAT THAT MEANS FOR INTERVENTION, STATED AGAINST THE FRAMING RATHER THAN WITH IT. 'RAISE PRRX1 TO
  GET MORE ROOT CELLS' IS NOT SUPPORTED AND THE AVAILABLE EVIDENCE CUTS AGAINST IT. Raising PRRX1 would be
  expected to enlarge and deepen the quiescent compartment while REDUCING the flow of committed daughters -
  which is pool preservation bought by stopping growth, the exact trade round 241 warned about in the other
  direction. The target condition asked for was replacement greater than or equal to loss WITHOUT losing
  output, and a PRRX1 lever fails the second half.

  THE HONEST COUNTERWEIGHT, WHICH IS SUBSTANTIAL. Prrx1 has never been tested this way in a growth plate,
  in any species. The mouse literature the reframe rests on is LINEAGE TRACING - Prrx1-CreERT2 marks cells
  that clonally generate chondrocyte columns plus stromal and osteoblastic progeny - and a marker that
  identifies a stem cell is not thereby a controller of its fate. Prrx1 knockout mice are lethal, which is
  why postnatal function is unstudied and why the antler is carrying this claim alone. And the antler
  experiments are CELL LINES IN CULTURE, not tissue, so 'differentiation initiated' is a dish result.

  THREE - PRRX1 IS ALSO NOT A SPECIFIC MARKER, WHICH WEAKENS THE FRAMING FROM A SECOND DIRECTION. ba2025a
  tested it directly: PRRX1 and TWIST1 are expressed in THY1+ mesenchymal cells of FACIAL and LIMB
  periosteum as well as antlerogenic periosteum, so neither meets the criteria for a marker of the
  antler-forming cell, and the group went looking for RXFP2 precisely because PRRX1 did not discriminate.
  In the human plate PRRX1 marks the root cluster usefully because the comparison is against other
  chondrocytes; it does not follow that PRRX1 confers root identity.

  FOUR - WHAT THE EXIT SWITCH ACTUALLY LOOKS LIKE, ASSEMBLED FROM EVERYTHING NOW HELD. Leaving the root
  state requires, so far as anyone has shown: WNT ON at the co-receptor (LRP6 knockout reduces founder-cell
  proliferation in antler), TGF-BETA/SMAD2-3 ON (growth hormone achieves this in the human resting zone by
  stripping THBS1 and DCN), and PRRX1 DOWN (miR-140-3p in antler). Three levers, three species-tissue
  combinations, ALL POINTING THE SAME WAY - and none of them has been shown to increase the self-renewing
  FRACTION, which is the variable round 240 identified. Every one of them moves cells OUT of the root pool.

  THE PROGRAMME HAS NOW SEARCHED HUMAN GROWTH PLATE, MOUSE LINEAGE TRACING AND ANTLER REGENERATION FOR A
  POSITIVE REGULATOR OF ROOT-CELL SELF-RENEWAL AND HAS NOT FOUND ONE. That is the honest state of the
  register. It is a real finding rather than an absence of searching - the field's functional handles are
  all on the exit, because exit is what every model organism was selected to study. THE GAP IS NOT THAT THE
  ANSWER IS HIDDEN; IT IS THAT NOBODY HAS RUN THE EXPERIMENT IN THE DIRECTION THIS PROGRAMME NEEDS.
quantitative:
- parameter: >-
    Prrx1 and miR-140-3p form a reciprocal negative feedback loop in antler reserve mesenchyme cells,
    verified in both directions by lentiviral overexpression and RNAi at mRNA and protein level
  value: 3
  unit: biological replicates per group, two-tailed Student t test, significance reported at P<0.05 and
    P<0.01
  conditions: >-
    sika deer antler growth centre reserve mesenchyme cell lines, lentiviral Prrx1 overexpression, Prrx1
    RNAi, miR-140-3p overexpression and miR-140-3p sponge
  species: cervid
  source_ref: hu2024
  uncertainty: >-
    cell lines in culture, not tissue; the causal statement that loss of Prrx1 initiates chondrogenesis is
    the authors' interpretation of the loop plus differentiation assays, and the proposed Prrx1-to-Sox9 link
    rests on a CUT and Tag signal the authors themselves call weak and requiring further work
- parameter: >-
    PRRX1 overexpression DECREASES proliferation of antler reserve mesenchymal cells and maintains the
    undifferentiated state - an independent paper reaching the same direction through a different microRNA
  value: not_reported
  unit: direction of effect only, no effect size extracted
  conditions: sika deer antler reserve mesenchymal cells, PRRX1/miR-143-3p axis
  species: cervid
  source_ref: hu2025
  uncertainty: >-
    ABSTRACT ONLY. The full text is not open access and was not obtained, so no effect size, no replicate
    count and no assay detail are recorded here. It is used only as an independent corroboration of
    DIRECTION and must not be cited for a magnitude
  value_unverified: true
localization:
- 'cervid antler growth centre reserve mesenchyme: the layer that stays thin throughout rapid growth while
  feeding precartilage and cartilage below it'
- 'human upper resting zone: PRRX1 marks the GP1 root cluster, but no functional manipulation exists in any
  growth plate in any species'
human_evidence: indirect
human_evidence_note: >-
  There is no human functional evidence about PRRX1 at all. The human contribution is marker-level only -
  PRRX1 identifies the root cluster in human growth plate single-cell data. Every causal statement in this
  node is cervid cell culture, and the node exists mainly to stop a marker from being treated as a lever.
species_basis:
- cervid
- human
translation_risk: high
translation_risk_reason: >-
  The functional claim rests entirely on deer antler reserve mesenchyme cell lines. The antler is a
  seasonally regenerating, vascularised, neural-crest-derived organ running at a hundredfold the rate of a
  growth plate, and there is no reason to assume a transcription factor holds the same position in the
  hierarchy of both tissues. Mouse Prrx1 nulls are lethal so the postnatal test does not exist, and no
  growth plate experiment has been done.
confidence: D
confidence_reason: >-
  Two independent studies agree on direction, which would ordinarily support C, but both are from the same
  laboratory on the same cell system, one of them is abstract-only, and both are culture rather than tissue.
  Graded D as a single functional line with corroborating direction, not as replication.
