id: marrow_stromal_cell
name: Bone marrow stromal cell (skeletal 'MSC')
aliases:
- BMSC
- mesenchymal stem cell
- CD146+ adventitial reticular cell
type: cell_type
summary: 'This node exists to hold the older, competing definition of the skeletal stem cell. Human MCAM/CD146-expressing
  subendothelial cells in marrow stroma, transplanted heterotopically, self-renew, reconstitute identical
  subendothelial cells in a miniature bone organ and transfer the hematopoietic microenvironment - the
  assay that originally defined a human skeletal stem cell. In this framework the SSC is a specific perivascular
  adventitial reticular cell that also makes marrow adipocytes. That last property is the point of collision:
  the mSSC, Grem1+ OCR and hSSC schemes all explicitly exclude adipogenesis, and the hSSC paper reports
  that CD146+ cells give smaller and fewer colonies than PDPN+CD146-CD73+CD164+ cells, while the CD146
  school argues that FACS-defined ''MSC'' populations from different tissues are not equivalent and that
  in vitro phenotype is not evidence of stemness. The disagreement is unresolved and is logged in audit/contradictions.md.'
quantitative: []
localization:
- 'human marrow sinusoidal wall (subendothelial/adventitial reticular): confirmed (sacchetti2007)'
- 'mouse perisinusoidal marrow: LepR+/Cxcl12-high equivalent (zhou2014)'
human_evidence: direct
human_evidence_note: Human CD146+ marrow stromal cells were prospectively isolated and shown to self-renew
  and organise a hematopoietic microenvironment, though again only after heterotopic transplantation into
  mice.
species_basis:
- human
- mouse
translation_risk: moderate
translation_risk_reason: The defining experiments were done on human cells, but the readout is ectopic
  ossicle formation in a mouse, which does not test the cell's role in a human growth plate.
confidence: C
