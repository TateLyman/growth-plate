localization:
- 'human upper resting zone GP1: CYTL1+, SFRP5+, APOE+, GAS1+, PTHLH-negative, secreting SFRP1 onto its own
  FZD2 and IGF1 onto a lower cluster'
- 'mouse resting zone GP1 counterpart: CYTL1+ GAS1+ PRRX1+ GHR-high, but carrying an articular and
  fibro-osteoblastic signature the human cluster does not'
- 'cervid pedicle periosteum: SFRP2+ PMC1 stromal cells and the resting PMC2 population that activates at 5
  days after casting'
human_evidence: direct
human_evidence_note: >-
  The human arm is human tissue throughout - the root-cell antagonist screen, the SFRP1 autocrine pair and
  the GH regulon response all come from human growth plate specimens. The mouse arm is this atlas's own
  re-analysis of a supplied table and is graded as re-analysis. The cervid arm is comparator only and never
  carries a human claim.
species_basis:
- human
- mouse
- cervid
translation_risk: moderate
translation_risk_reason: >-
  The central claim - that the root-cell fate decision runs through TGF-beta/Smad2-3 - now rests on four
  systems by four mechanisms, which is what lowers the risk. What keeps it at moderate rather than low is
  that the human causal evidence is one 24-hour explant experiment in three to four patients whose root
  cluster did not survive the culture, the mouse test is a re-analysis of a possibly contaminated cluster,
  and the cervid evidence is a different organ growing a hundredfold faster on a seasonal cycle.
confidence: C
confidence_reason: >-
  Graded C and not B. The TGF-beta convergence is supported in human tissue, in a mouse re-analysis, and in
  two cervid systems by independent groups - but no single link in it has been replicated in human tissue by
  an independent group, the human causal step is one experiment, and the arm of round 241 that this round
  tested actually FAILED for THBS1. A convergence that survives its first real test with one named casualty
  is a C, not a B.
