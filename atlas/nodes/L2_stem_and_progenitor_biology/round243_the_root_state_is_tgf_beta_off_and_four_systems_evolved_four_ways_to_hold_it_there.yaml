id: round243_the_root_state_is_tgf_beta_off_and_four_systems_evolved_four_ways_to_hold_it_there
name: >-
  ROUND 243 - the supplement, the Science paper and a mouse table the main text never showed. THE ROOT
  STATE IS TGF-BETA/SMAD2-3 OFF, AND FOUR INDEPENDENT SYSTEMS HOLD IT THERE BY FOUR DIFFERENT MOLECULAR
  ROUTES; the antler's own physiological activation is the same event growth hormone performs on the human
  resting zone; and THBS1, which round 241 put in the headline, FAILS in mouse
type: hypothesis
layer: L2
aliases:
- the root state is TGF-beta off
- four routes to one node
- the activation sequence
- SFRP1 to FZD2 is autocrine
- round 243
stub: false
summary: |
  THREE DOCUMENTS ARRIVED AND ONE OF THEM CONTAINED A TEST OF ROUND 241 THAT ROUND 241 COULD NOT RUN.

  ONE - THE MOUSE TEST, AND THE HEADLINE MOLECULE FAILS IT. chu2026's data file S1 is a table the paper's
  main text never shows: the complete GP1-versus-GP2 differential expression list FOR THE MOUSE, 15,983
  genes. Sign convention fixed on CYTL1 (+5.283, padj 3.8e-16) with GAS1 agreeing (+3.063), and SFRP5 and
  APOE excluded because the paper itself states they mark GP1 AND GP2. Result: THBS4 +3.546, THBS2 +2.086
  and DCN +1.786 (padj 8.2e-25) are all ROOT-ENRICHED, and THBS1 IS -0.578 AT padj 8.0e-04 - SIGNIFICANTLY
  THE WRONG WAY. Round 241 named THBS1 and THBS4 as the cross-species anchor. THBS4 holds; THBS1 does not.
  CORR-252 retracts it and re-anchors on DCN, which is stronger than what it replaces - up in the human root
  cluster, up in the mouse root cluster at padj 8.2e-25, and one of only TWO conserved blastema markers,
  with POSTN, shared across deer antler, mouse regenerative digit tip, axolotl limb and zebrafish caudal fin
  (qin2023, independent group, four species).

  THE WNT SIDE REPLICATES AS A CLASS AND NOT AS A LIST. SFRP1, SFRP2, SFRP4, DKK1, DKK3, SOST, SOSTDC1 and
  APCDD1 all have ZERO COUNTS in mouse and cannot be tested; SFRP5 is significantly GP2-enriched. But WIF1
  (+3.284, padj 5.4e-36) and FRZB (+3.302, padj 2.3e-23) are strongly root-enriched and BOTH SIT IN THE TOP
  TWENTY of an unbiased ranking of all 811 significant genes. So 'the root cell secretes soluble WNT
  antagonists' survives; 'these particular antagonists cross species' does not.

  AND THE MOST DECISION-RELEVANT HUMAN FINDING REPLICATES: GHR +1.707 AT padj 1.6e-14, ROOT-ENRICHED IN THE
  MOUSE TOO. The reciprocal half does not - IGF1R is not significant and IGF1 runs the other way - so what
  crosses species is 'GH receptor is concentrated on the root cell', not the full counter-gradient. PRRX1
  +1.783 and PTH1R +1.129 are root-enriched; CCND1 -4.390 and SOX4 -1.772 are GP2-enriched, both matching
  the human direction.

  THE LIMIT ON MY OWN RE-ANALYSIS, STATED BECAUSE IT CUTS AGAINST IT. PRG4 (+8.462) and IBSP (+8.337) are
  the two largest effects in the whole table and both land on the root side, with COL1A1, COL1A2, COL3A1,
  COL5A2, CILP, CILP2, OMD and CHAD behind them. THE MOUSE GP1 CLUSTER PROBABLY CONTAINS ARTICULAR OR
  PERICHONDRIAL CELLS THAT THE HUMAN ONE DOES NOT, and a DEG table cannot resolve it.

  TWO - qin2023 CONTAINS THE PHYSIOLOGICAL VERSION OF THE EVENT GROWTH HORMONE PERFORMS. Round 241 showed
  that GH strips THBS1 and DCN off the human resting zone and raises p-Smad2. qin2023, single-cell atlas of
  74,730 cells across antler regeneration, shows the SAME TRANSITION HAPPENING NATURALLY: as the resting
  periosteal stem population activates by five days after casting, THE WNT SUPPRESSORS SFRP1, SFRP2 AND
  SFRP4 DECLINE WHILE WNT5B, TGFBI AND TGFB1 INCREASE. No drug, no explant, in vivo, in the organ.

  THAT IS THE SENTENCE THIS ROUND EXISTS FOR. DROPPING THE WNT ANTAGONISTS AND RAISING TGF-BETA IS WHAT A
  REGENERATIVE ORGAN DOES WHEN IT DECIDES TO SPEND ITS STEM POOL. GROWTH HORMONE DOES THE SAME TWO THINGS TO
  THE HUMAN RESTING ZONE. GH is not merely correlated with pool depletion - it is administering the antler's
  own activation signal to a plate that has one pool and no casting cycle to refill it.

  The authors' own framing agrees on the maintenance side: they attribute SFRP1 and SFRP2 in the growth
  centre mesenchyme to STEM CELL MAINTENANCE, and they find WNT10A, WNT10B and WNT6 confined to the
  PRECARTILAGE layer below. Antagonists in the stem layer, ligands one layer down - the same spatial
  architecture as the human plate, where GP1 makes the inhibitors and the ligands come from elsewhere.

  Two further facts from qin2023 that constrain the programme. PRRX1+ cells are PERMANENTLY RESIDENT in
  periosteum before regeneration and are NOT produced by dedifferentiation, unlike the axolotl - so the
  antler does not solve pool replacement by making new stem cells from differentiated ones, and that route
  is not on the table. And the functional stem cell, sorted as CX43+FGFR2+, self-renews through serial
  passage to tertiary colonies, is osteogenic and chondrogenic but NOT adipogenic unlike bone marrow
  stromal cells, and forms bone in renal subcapsular xenograft.

  THREE - hu2025's FULL ABSTRACT GIVES A THIRD ROUTE TO THE SAME NODE. Round 242 cited it for direction only
  (CORR-253). Read properly: PRRX1 is an UPSTREAM POSITIVE regulator of miR-143-3p, by ATAC, CUT-and-Tag and
  dual luciferase; MIR-143-3P TARGETS IGF1R, TGFB1 AND BMP2; PRRX1 overexpression lowers proliferation and
  raises miR-143-3p; and miR-143-3p-loaded extracellular vesicles inhibit reserve mesenchymal cells, inhibit
  osteosarcoma 143B cells, inhibit tumours in osteosarcoma-bearing mice with IGF1R protein down, and block
  chondrogenic differentiation through TGFB1 and BMP2. So PRRX1 holds the root state BY POST-
  TRANSCRIPTIONALLY SUPPRESSING TGF-BETA - and, notably for the constraint the programme was given, the same
  axis is what stops the antler cell from behaving like an osteosarcoma.

  FOUR - THE CONVERGENCE, WHICH IS THE ACTUAL RESULT. Four systems, four different molecular mechanisms, one
  node:

  - human GP1 - SOLUBLE PROTEIN ANTAGONISTS: THBS1, THBS2, THBS4 and DCN, with the SMAD2 regulon lowest in
    GP1 and SOX4 absent
  - mouse GP1 - the same, minus THBS1: THBS2, THBS4, DCN root-enriched
  - antler reserve mesenchyme - POST-TRANSCRIPTIONAL: PRRX1 drives miR-143-3p, which degrades TGFB1
  - antler tip stem cell - RECEPTOR-LEVEL SINK: TGFBR3, betaglycan

  AND THE EXIT IS TGF-BETA ON, IN BOTH DIRECTIONS OF EVIDENCE: GH raises p-Smad2 and lowers p-Smad1/5 in the
  human resting zone (P = 0.0397 and P = 0.0097), and antler activation raises TGFB1 at day five in vivo.
  FOUR INDEPENDENT EVOLUTIONARY OR EXPERIMENTAL ROUTES TO HOLDING DOWN ONE PATHWAY IS NOT A GENE LIST
  COINCIDENCE. THE ROOT-CELL FATE DECISION IS A TGF-BETA/SMAD2-3 SWITCH.

  FIVE - A NAME FOR THE BRAKE, READ OFF THE HUMAN LIGAND-RECEPTOR MAP. Round 241 could only say 'nine
  soluble WNT inhibitors', unnamed. Data file S7 gives at least one by name: SFRP1 -> FZD2 WITH GP1 AS BOTH
  SOURCE AND TARGET - autocrine WNT antagonism by the human root cell on itself, at high specificity rank.
  The same panel shows IGF1 with GP1 as source acting on IGF1R in a lower cluster, which is the human
  counterpart of the antler's stem-cell-makes-IGF1, progenitor-has-IGF1R arrangement.

  SIX - WHAT GROWTH HORMONE DOES TRANSCRIPTIONALLY, AND A LIMITATION THAT MATTERS MORE THAN THE RESULT. Data
  file S3 holds the 113 regulons with vehicle and GH means. Largest increases: IRF1 2.60x, ZBTB7A 2.62x, ERF
  1.96x, KLF7 1.90x, MEF2C 1.76x. Largest decreases: DBP 0.46x, CEBPD 0.49x, SOX6 0.63x, FOS 0.84x, ATF4
  0.82x, SOX9 0.93x. GH LOWERS SOX9 AND SOX6 WHILE RAISING MEF2C - chondrogenic transcription down,
  hypertrophic transcription up, inside the stem cell compartment - though the MEF2C-positive cell COUNT was
  unchanged by immunofluorescence at 24 hours, so this is a transcriptional shift and not yet a cell-fate
  shift. THE LIMITATION: STAT5A, STAT5B, STAT3, STAT1, SMAD2, SMAD3, SOX4, KLF4, ESRRB and all TCF/LEF
  regulons ARE ENTIRELY ABSENT from the cultured-slice regulon set. Culture loses them. So the GH
  transcription-factor signature is computed over a DIFFERENT REGULON REPERTOIRE than the one used to
  characterise the native tissue, and the two analyses cannot be laid on top of each other. And every line
  of it is GP2 - the PTHrP-positive cell - because GP1 did not survive culture.

  SEVEN - WHAT THE PROTEOMICS DID AND DID NOT SETTLE. xi2026 quantified 8,173 proteins across the five
  antler zones and confirms PRRX1 and LUM AT PROTEIN LEVEL in the reserve mesenchyme, with 11 embryonic and
  23 mesenchymal stem cell markers co-expressed there. IT DOES NOT ANSWER THE QUESTION IT WAS FETCHED FOR:
  thrombospondins, decorin and SFRPs are not mentioned anywhere in the text, so the protein-level check on
  the antagonist screen remains open and would need that paper's supplementary protein table.

  EIGHT - THE INTERVENTION STATEMENT, AND THE STEP NOBODY HAS TESTED. If the root-cell fate decision is a
  TGF-beta/Smad2-3 switch, the smallest controllable intervention consistent with everything above is NOT to
  add a growth signal. IT IS TO HOLD SMAD2-3 DOWN IN THE RESTING ZONE WHILE LEAVING THE PROLIFERATIVE
  COMPARTMENT FREE TO RUN. That statement is drug-shaped, it is testable, and it sorts the existing stack
  cleanly: GROWTH HORMONE ACTS DIRECTLY AGAINST IT, and FGFR3 inhibition does not touch it, acting instead
  on the columnar compartment downstream.

  THE UNTESTED STEP IS THE WHOLE RISK AND IT IS CORR-203 AGAIN. Every observation here is that the root
  state REQUIRES low TGF-beta. NOTHING SHOWS THAT PUSHING TGF-BETA BELOW ITS NORMAL RESTING-ZONE LEVEL
  RAISES THE SELF-RENEWAL FRACTION - that is RESTORATION logic being read as ELEVATION logic, the error this
  atlas has made before. A plate whose root cells never leave is a plate that never grows. The variable to
  move is the RATIO of renewing to committed divisions, and no experiment in any species has yet shown that
  TGF-beta tone sets that ratio rather than simply gating exit.
