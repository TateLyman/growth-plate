id: resting_zone_niche
name: Resting zone as a stem cell niche
aliases:
- reserve zone niche
- RZ niche
- epiphyseal stem cell niche
type: tissue_structure
summary: 'The resting (reserve) zone is the epiphyseal-most stratum of the growth plate, containing small
  round chondrocytes in an abundant matrix that divide rarely and sit immediately below the secondary
  ossification centre. In mouse it functions as a niche rather than a passive reserve: it holds at least
  three partially overlapping slow-cycling populations (PTHrP/Pthlh+, FoxA2+, and label-retaining Col2a1-lineage
  cells) that seed the proliferative columns below. Its niche signals are defined negatively as much as
  positively - resting chondrocytes sit in a Wnt-inhibitory microenvironment (enriched for secreted Wnt
  inhibitors; forced beta-catenin activation drives them out of the zone), and their fate is instructed
  in reverse by Indian hedgehog from the hypertrophic zone, since both Smoothened agonism and antagonism
  reduce the number of columns formed from labelled resting cells. Loss of niche integrity is phenotypically
  visible: partial diphtheria-toxin ablation of PTHrP+ resting cells in mouse shrinks the proliferative
  zone and expands the hypertrophic and resting zones, and Adgrg6 loss shortens the resting zone and produces
  intra-plate cell clusters. In humans the resting zone has been mapped only transcriptionally and histologically;
  no human cell has ever been shown to behave as a resting-zone stem cell, because clonal lineage tracing
  cannot be performed in people.'
