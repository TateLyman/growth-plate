localization:
- 'mouse RZ: confirmed, PTHrP-mCherry knock-in reporter and PTHrP-creER lineage (mizuhashi2018)'
- 'mouse RZ: confirmed, H2B-EGFP label-retaining cells concentrated at the top of the plate (hallett2021_2)'
- 'human RZ: transcriptionally defined only, spatial transcriptomics of adolescent biopsies (avijgan2025,
  chu2026)'
- 'rabbit RZ: FoxA2+ cells present at the cartilage/SOC interface (muruganandan2022)'
human_evidence: indirect
human_evidence_note: Human resting zone cells have been profiled by single-cell and spatial transcriptomics
  in adolescent surgical specimens and show quiescence-associated features, but no functional stem-cell
  assay has been performed in human tissue in situ.
species_basis:
- mouse
- rabbit
- human
translation_risk: high
translation_risk_reason: Every functional claim about the niche (clonality, self-renewal, ablation, Hedgehog
  and Wnt manipulation) rests on mouse genetics. Mice never fuse their growth plates, so the terminal
  behaviour of the human niche has no murine counterpart.
confidence: C
