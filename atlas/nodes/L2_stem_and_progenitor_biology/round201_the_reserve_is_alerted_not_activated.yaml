human_evidence: direct
human_evidence_note: 'The two functional results are human organ culture from two independent groups
  (avijgan2026 Karolinska, chu2026 Karolinska and Lund) and the compartment result is a re-analysis of
  human tissue. THE MECHANISM PAPERS ARE ALL MOUSE and are used only to name candidate states, never to
  carry a cartilage claim. Donors in both human datasets are Tanner 2 to 4, aged 12 to 14, which is the
  round-197 sampling ceiling and applies to everything in this node.'
