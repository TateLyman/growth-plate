id: round201_the_reserve_is_alerted_not_activated
name: ROUND 201 - human resting-zone arrest is imposed and reversible, waking the pool does not make
  columns, and the deiodinase-thyroid-Notch axis that guards the reserve in muscle is resting-zone
  specific in the human growth plate
type: hypothesis
layer: L2
aliases:
- explant reactivation
- G0 to G(Alert)
- the second signal problem
- DIO2 resting zone
- round 201
stub: false
summary: 'ROUND 200 ENDED AT AN UNRUN EXPERIMENT. At the tissue level the human answer was arrest -
  herrmann2002''s plate was still open at 27, three years after growth stopped - but whether the CELLS
  retained divisional capacity had never been tested in any species. It had been tested. Twice, in human
  tissue, by two groups this atlas already holds, and neither paper was read for it.

  THE FIRST ANSWER IS THAT THE CEILING IS IMPOSED, AND IT IS A HUMAN ANSWER. avijgan2026 cultured intact
  human growth plate biopsies for seventeen days with three sequential thymidine analogues. Resting-zone
  poly(A) per nucleus rose from a median of 26.2 to 46.5 per cent of maximum, a 77 per cent gain, while
  the proliferative zone moved 10 per cent and THE HYPERTROPHIC ZONE FELL 14 PER CENT. The compartment
  defined by low transcriptional output nearly doubles that output once the tissue is removed from the
  body, and the two neighbouring compartments do not. That cannot be a global culture artefact and it
  cannot be produced by proliferative-zone exhaustion. The resting zone is held down by something outside
  itself.

  THE SECOND ANSWER IS THAT WAKING IT IS THE EASY HALF AND IT BUYS NOTHING ON ITS OWN. chu2026 ran the
  same tissue for two months. Cartilage survived with intact histology and proteoglycan - the authors
  attribute this to the plate being avascular and diffusion-fed - BUT BONE DID NOT EXPAND, and the root
  progenitor identity was destroyed by the culture itself, CYTL1 falling from 175 to 4 reads per positive
  cell with IGF1 absent and CYTL1 and RAMP3 appearing in hypertrophic cells where they do not belong. Read
  together the two papers describe one event from two sides. The niche signal is withdrawn, the reserve
  wakes, and the identity that made it a reserve goes with it.

  AND THE MOUSE ALREADY PRODUCED THAT EXACT PHENOTYPE UNDER A DEFINED LESION. newton2019''s Tsc1 ablation -
  constitutive mTORC1 in the resting zone - raised CD73 zone height, clone size and EdU-positive
  epiphyseal stem cells, shifted PAR3 toward symmetric division, and left recruitment into the
  proliferative layer unchanged with a DISORDERED resting zone expressing no ColX and no Ihh. trompet2024
  gave the same shape from the other direction, intra-articular SAG raising Pthrp-tdTomato-positive cells
  from 65.5 to 139.8 per square millimetre entirely within the resting zone with no change in
  proliferation. THE EXPLANT PHENOTYPE, THE Tsc1 PHENOTYPE AND THE SAG PHENOTYPE ARE ONE PHENOTYPE - the
  pool wakes and does not make columns.

  rodgers2014 NAMES THAT STATE AND THE ATLAS DID NOT HAVE IT. Quiescence is two phases, not one. G0 and
  G(Alert), a primed state that is not yet division, entered reversibly in response to injury-induced
  systemic signals, requiring mTORC1 and cMet. G(Alert) cells are not proliferating; they are positioned
  to proliferate when a second signal arrives. EVERY POOL-EXPANDING INTERVENTION THIS ATLAS HAS FOUND
  PRODUCES ALERTING AND STOPS THERE. That reframes the reserve route completely - pool size was never the
  binding constraint, and the atlas has never identified the second signal.

  THE ROUND THEN DID THE THING THAT KEEPS THIS FROM BEING A STORY. Importing a muscle mechanism into
  cartilage on resemblance is what this file forbids, so the four candidate mechanisms were tested against
  human growth plate tissue directly, using avijgan2026''s own deposited spatial data - fourteen sections,
  spot-level zone annotation, the authors'' own pseudobulk-by-area approach. The pipeline reproduces their
  controls exactly - ZNF550 at 85.7 times the proliferative zone, UCMA 22.0, CHRDL2 16.2, SFRP5 7.0, and
  COL10A1 correctly hypertrophic at 20 946 CPM.

  THE mTORC1 ARM DOES NOT SURVIVE THAT TEST AND THE THYROID ARM DOES. MTOR itself is not
  compartment-specific on a section-paired sign test (6 up, 3 down), MET is detectable in one section of
  fourteen, TRPM7 in two, RHEB in one. But DIO2 - type 2 deiodinase, which de2026a shows MARKS quiescent
  stem cells and whose loss raises proliferation while destroying self-renewal and exhausting the pool -
  is present in the resting zone at 32 CPM AND IS UNDETECTABLE IN THE PROLIFERATIVE AND HYPERTROPHIC ZONES
  IN EVERY SECTION (6 up, 0 down, sign p = 0.031). NOTCH2, the self-renewal arm that de2026a shows thyroid
  hormone sustains, is 3.4-fold resting-zone enriched (7 up, 0 down, p = 0.016), with THRA (9 up, 2 down,
  p = 0.065) and HEY1 (7 up, 1 down, p = 0.070) trending the same way. THE WHOLE D2-T3-NOTCH AXIS IS
  COMPARTMENT-MATCHED TO THE HUMAN RESERVE, and the depth objection runs the wrong way for a critic -
  across these sections the PROLIFERATIVE zone carries more total UMI than the resting zone, so a
  transcript seen in the resting zone and not the proliferative zone is not a sequencing-depth artefact.

  WHY THAT MATTERS MORE THAN A NEW MARKER. de2026a is round 198''s fixed-reserve model measured in another
  tissue - alerting a quiescent pool raises short-term output AND EXHAUSTS IT. If D2 does in cartilage what
  it does in muscle, then local T3 tone inside the resting zone sets the reserve, which is a lever nobody
  has touched and which the stack may already be perturbing without anybody costing it.

  TWO THINGS THIS ROUND WITHDRAWS. The re-entry fraction claimed from avijgan2026''s Fig 2f is
  inadmissible - the printed axes run to 150 and down to minus 100 per cent, so the quantity is normalised
  rather than a labelling index, and on exposure-corrected reading the resting-zone rate per day does not
  rise at all, it is the PROLIFERATIVE zone that collapses 25-fold. And chu2026''s resting-zone GH null is
  not a null - the point estimate is 2.8-fold IN THE SAME DIRECTION as the significant proliferative-zone
  effect, the Tukey-corrected P of 0.79 is about 0.25 unadjusted, and at n of 7 against 6 the experiment
  could only have detected a 5.0-fold rise. It could not have detected the effect it observed.'
