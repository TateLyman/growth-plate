    to ask the next question and nothing more - this is presence and relative abundance, not function. The
    sign test is section-level and several sections share a donor, so the p-value is anti-conservative and
    is reported as a screen. The depth objection runs the RIGHT way - the proliferative zone carries more
    total UMI (513 009) than the resting zone (433 659) across these sections, so a resting-zone-only
    transcript is not a depth artefact'
- parameter: NOTCH2, THRA and HEY1 resting-zone enrichment in the human growth plate
  value: NOTCH2 3.41x RZ over PZ (7 up, 0 down, p = 0.016); HEY1 5.00x (7 up, 1 down, p = 0.070); THRA
