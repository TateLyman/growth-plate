contradicts:
- 'WITHDRAWS THE RESTING-ZONE GROWTH HORMONE NULL. The plan for this round stated that chu2026 gave human
  confirmation that GH is not a pool agent, on P = 0.79. That is wrong and the arithmetic in
  explant_reactivation_ledger.py shows why - the point estimate is 2.8-fold in the SAME direction as the
  significant proliferative-zone effect, the P of 0.79 is Tukey-corrected across four groups against about
  0.25 unadjusted, and the minimum detectable difference at 80 per cent power is a 5.0-fold rise. Logged
  as CORR-194. The rat-derived claim from round 183 that GH spends the pool is untouched by this; what is
  withdrawn is the human confirmation of a resting-zone null.'
- 'WITHDRAWS ANY RE-ENTRY FRACTION FROM avijgan2026 Fig 2f. Logged as CORR-193. The axes run to 150 and to
  minus 100 per cent so the quantity is not a labelling index, and exposure correction shows the
  resting-zone rate per day FALLING slightly while the proliferative zone collapses 25-fold. The reactivation
  conclusion survives on Fig 2g, which is on an interpretable scale and is zone-specific in a direction
  exhaustion cannot produce.'
- 'RESOLVES THE APPARENT Wnt SIGN CONFLICT WITHOUT PREFERRING EITHER PAPER. hallett2021 finds Wnt
  antagonists Sfrp5, Wif1, Dkk2 and Notum UP in mouse label-retaining cells - the most quiescent - while
  avijgan2026 finds human SFRP5-positive and CHRDL2-positive cells among the LEAST quiescent. The two score
  DIFFERENT AXES - label retention over weeks against instantaneous RNA content - and avijgan2026''s own
  mouse cross-check contains the reconciling population, reporting that some label-retaining cells had
  elevated mRNA either because not all are quiescent or because they were LEAVING QUIESCENCE at collection.
  avijgan2026 further reads its own result as consistent with repressed BMP and Wnt signalling maintaining
  the resting zone, which is hallett2021''s direction. RESIDUAL, AND IT IS REAL - the reconciliation
  requires the antagonist-expressing cells to be the label-retaining subset that is exiting, and nobody has
  measured label retention and RNA content and SFRP5 in the same cells.'
- 'SHARPENS RATHER THAN OVERTURNS newton2019 AND trompet2024. Both were recorded as puzzling - a bigger
  pool with no extra flux. Under G(Alert) that is not a puzzle but the PREDICTED result of alerting without
  a second signal, and brun2022 supplies the missing link by showing that losing GLI3 alerts through
  mTORC1, which is what a hedgehog agonist does to the GLI3 repressor arm.'
- 'RE-READS cho2025 OUT OF THE MECHANOBIOLOGY FILE. It is currently registered under local hyperaemia. The
  finding that 66 per cent of children overgrew the ipsilateral UNFRACTURED femur is a REMOTE response to
  injury, which is rodgers2014''s stated stimulus for G(Alert). The two readings make different predictions
  and the discriminating measurement has never been made, because post-fracture growth is universally
  reported as leg-length DISCREPANCY, a within-patient difference that cannot detect a bilateral effect by
  construction.'
