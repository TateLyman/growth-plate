translation_risk: high
translation_risk_reason: 'The human material establishes that the resting-zone ceiling is imposed and
  reversible; it establishes NO length endpoint, because explants do not ossify. Every mechanistic
  candidate for the release signal and for the second signal is mouse muscle, marrow or skin. The one
  cartilage-adjacent test run here is a transcript-presence screen, which cannot show function.'
confidence: C
claim_grades:
- claim: the transcriptional quiescence of the human resting zone is imposed from outside the cell and
    reverses when the tissue is removed from the body
  grade: B
  basis: human tissue, author-stated medians, zone-specific with the hypertrophic zone moving the opposite
    way, n = 3 patients; single group, single culture system, no independent replication of the poly(A)
    endpoint
- claim: human resting-zone chondrocytes are capable of reversible cell cycle arrest
  grade: C
  basis: author-stated conclusion from sequential thymidine analogues; the supporting panel is on a
    normalised axis that cannot yield a re-entry fraction, the authors themselves cannot exclude a
    prolonged G1, and n = 3 patients
- claim: waking the resting-zone pool does not by itself produce columns or elongation
  grade: B
  basis: convergent across three systems - human explant loses root identity and produces no bone
    (chu2026), mouse Tsc1 gain-of-function expands the pool with recruitment explicitly unchanged
    (newton2019), mouse SAG expands the resting pool with proliferation unchanged (trompet2024)
- claim: DIO2 transcript is confined to the resting zone within the cartilage of the human growth plate
  grade: B
  basis: re-analysis of 14 human sections with a pipeline validated on four author-stated markers and one
    author-stated counter-marker; 6 up 0 down paired, p = 0.031, detected in 7 of 14 sections; the
    proliferative zone has the larger library so the direction is not a depth artefact
- claim: DIO2 sets or maintains resting-zone quiescence in the growth plate
  grade: E
  basis: PURE INFERENCE FROM ANOTHER TISSUE. de2026a demonstrates this in muscle and skin. There is no
    cartilage functional data of any kind, and this node does not claim otherwise
- claim: the mTORC1-cMet route of rodgers2014 operates in the human resting zone
  grade: E
  basis: NOT SUPPORTED by the human compartment screen - MTOR is not zone-specific, MET and TRPM7 are at
    the detection floor. Retained as an open question only because the mouse phenotype matches
- claim: growth hormone does not recruit the human resting zone
  grade: X
  basis: WITHDRAWN THIS ROUND. The only human test is underpowered by a factor of about two against its
    own point estimate, and phospho-STAT5 rises PREDOMINANTLY in the resting zone (P = 0.034) in the same
    paper. See CORR-194
- claim: no one has staged the growth plate resting zone against the G0/G(Alert) framework
  grade: A
  basis: enumeration over two logged Europe PMC sweeps, 28 and 74 hits, none in cartilage
