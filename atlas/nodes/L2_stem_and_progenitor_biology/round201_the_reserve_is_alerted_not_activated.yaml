  unit: CPM ratio and section-paired sign test
  conditions: same re-analysis and same caveats as the DIO2 row
  species: human
  source_ref: avijgan2026
  uncertainty: 'NOTCH2 clears an unadjusted 0.05; THRA and HEY1 are TRENDS and are reported as trends. No
