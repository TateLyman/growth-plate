id: soc_formation_triggers_stemness
name: 'Hypothesis: secondary ossification centre formation triggers resting-zone stem cell acquisition'
aliases:
- SOC-niche hypothesis
type: hypothesis
summary: The claim is that resting-zone chondrocytes are not stem cells from the outset but acquire self-renewal
  when the secondary ossification centre forms, which in mouse is roughly the second postnatal week. The
  evidence is entirely temporal coincidence in two mouse studies. First, PTHrP-mCherry+ resting chondrocytes
  appear at P3 and expand sharply between P6 and P9, and PTHrP-creER colony-forming cells acquire robust
  in vitro self-renewal between a P9 pulse (17/518, 3.3% secondary colonies, none passageable) and a P12
  pulse (16/98, 16.3% secondary colonies, 2/16 passageable nine times) - the authors describe this as
  occurring 'when the secondary ossification centre actively develops'. Second, multicolour clonal tracing
  found that fetal and neonatal growth depletes chondroprogenitors whereas later growth produces large
  stable monoclonal columns with symmetric division and stem cell marker expression, 'coinciding with
  the formation of the secondary ossification centre'. Neither study manipulated the SOC. A targeted Europe
  PMC search for any experiment that ablates, blocks, prevents or delays SOC formation and then assays
  resting-zone stemness returned zero records (see search log for g_l2stem_003). The hypothesis is therefore
  correlational in one species. It is load-bearing for fusion models in L7 and should be cited as a hypothesis,
  not a mechanism.
