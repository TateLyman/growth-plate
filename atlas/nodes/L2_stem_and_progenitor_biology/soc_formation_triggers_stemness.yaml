localization:
- 'mouse RZ/SOC interface: temporal association only'
human_evidence: absent
human_evidence_note: Human SOC timing is well described radiographically and varies by bone (distal femur
  around term, others through childhood), but no human study has related SOC appearance to any property
  of resting zone cells.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Two mouse studies with coincident timing; humans form SOCs at bone-specific times
  over years, which would predict staggered, bone-by-bone acquisition of resting-zone stemness - a prediction
  nobody has tested.
confidence: D
