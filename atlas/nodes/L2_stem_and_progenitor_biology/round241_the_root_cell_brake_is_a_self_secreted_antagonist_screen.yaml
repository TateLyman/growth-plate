id: round241_the_root_cell_brake_is_a_self_secreted_antagonist_screen
name: >-
  ROUND 241 - the root-cell programme read from the full human text and from three antler datasets. THE
  ROOT STATE IS NOT PASSIVE QUIESCENCE, IT IS A SELF-SECRETED DOUBLE ANTAGONIST SCREEN - soluble WNT
  inhibitors plus soluble TGF-beta inhibitors - and the SAME BRAKE, DOWN TO THBS1 AND THBS4, IS RUNNING IN
  THE DEER ANTLER. GROWTH HORMONE STRIPS IT OFF THE HUMAN RESTING ZONE
type: hypothesis
layer: L2
aliases:
- the root cell brake
- the antagonist screen
- THBS1 and THBS4 cross the species gap
- GH strips the resting zone brake
- round 241
stub: false
summary: |
  ROUND 240 BUILT THE HUMAN ARM OF THIS REGISTER FROM AN ABSTRACT AND DECLARED THE PAPER UNOBTAINABLE. THE
  FULL TEXT HAD BEEN ON DISK SINCE 2026-08-06 (CORR-250). THIS ROUND REBUILDS IT FROM THE FIGURES, ADDS THE
  ANTLER ARM THAT ROUND 199 REDUCED TO A RATE RATIO (CORR-251), AND THE TWO ARMS TURN OUT TO SAY THE SAME
  THING.

  ONE - THE HUMAN ROOT CELL HOLDS ITSELF IN THE ROOT STATE BY SECRETING ITS OWN INHIBITORS. chu2026 profiled
  early-pubertal human growth plates from growth-restricting surgery, four donors, 23,625 cells, with
  spatial validation. RNA velocity makes cluster GP1 the root of the differentiation continuum and GP5 the
  terminal end. GP1 differs from its immediate neighbour GP2 by 819 up- and 165 down-regulated genes, and
  what it is doing with them is SUPPRESSION. Of the 174 genes in the KEGG WNT pathway, GP1 expresses FOUR
  LIGANDS AND NINE SOLUBLE INHIBITORS. It up-regulates the soluble TGF-beta inhibitors THBS1, THBS2, THBS4
  and DCN. THIS IS NOT INFERRED FROM LIGAND ABSENCE - THE REGULONS AGREE: beta-catenin transcription-factor
  activity is ABSENT in GP1; among SMAD family members only SMAD2 has detectable regulon activity and it is
  LOWEST IN GP1 AND HIGHEST IN GP2; SOX4, the Smad2/3 effector, is active only in hypertrophic GP5 and
  absent from both GP1 and GP2. GP1 also carries GAS1, the quiescent-mouse-epiphyseal-stem-cell marker, and
  has the LOWEST PROLIFERATIVE INDEX of GP1, GP2 and GP3.

  SO THE ROOT STATE IS AN ACTIVE, ENERGY-SPENDING, CELL-AUTONOMOUS PROGRAMME OF SAYING NO TO TWO PATHWAYS AT
  ONCE. That is a different object from a cell that is quiescent because nothing is telling it to divide,
  and it is a different object from the thing round 240 described. A brake that a cell builds for itself is
  a brake that a drug can remove.

  TWO - GROWTH HORMONE REMOVES IT, IN HUMAN TISSUE, AT PROTEIN LEVEL. In 24-hour explant culture of the same
  human plates, GH DOWN-REGULATES THBS1 AND DCN - two of the four soluble TGF-beta inhibitors that define
  the root state - and up-regulates TGFB3, TGFBR1 and INHBA at Padj below 1e-250, with INHBA and LTBP1 the
  largest absolute increases. The consequence was then measured on the tissue rather than inferred:
  phospho-Smad2-positive nuclei in the RESTING ZONE INCREASED (P = 0.0397) and phospho-Smad1/5 nuclei
  DECREASED (P = 0.0097), with phospho-STAT5 rising predominantly in the resting zone (P = 0.034). GH turns
  the resting zone from Smad2/3-off to Smad2/3-on by taking away the antagonists.

  PUT THAT NEXT TO chu2025 AND THE CHAIN CLOSES. chu2025 showed GH depletes the label-retaining pool by
  promoting committed rather than self-renewing division and named the clinical consequence itself -
  diminishing long-term efficacy. chu2026 supplies the molecular step that was missing: GH strips the
  resting zone of the very inhibitors that hold the root state. AND THE RECEPTOR GRADIENT SAYS THE ROOT CELL
  IS THE INTENDED TARGET, NOT A BYSTANDER - GHR IS HIGHEST IN GP1 AND IGF1R IS HIGHEST IN GP5, OPPOSITE
  GRADIENTS ACROSS THE SAME TISSUE, with STAT5b, STAT3 and STAT1 regulons active in GP1/GP2. The direct arm
  of GH aims at the root cell; the indirect, IGF-1 arm aims at the hypertrophic cell.

  THE LIMIT ON THAT CLAIM, STATED PLAINLY BECAUSE IT MATTERS. GP1 DID NOT SURVIVE THE EXPLANT. CYTL1 fell
  from 175 to 4 reads per positive cell, GP1 was recoverable only by a semi-supervised model and was too
  scarce to evaluate, and THE AUTHORS EXPLICITLY DID NOT ANALYSE IT. The transcriptional GH response is
  therefore measured in c-GP2, the PTHrP-positive stem cell, NOT in the root cell. Only the phospho-Smad2
  and phospho-Smad1/5 counts are compartment-level and so include GP1 territory. THE SENTENCE THIS ATLAS IS
  ENTITLED TO IS 'GH SHIFTS THE RESTING ZONE OUT OF THE LOW-TGF-BETA STATE', NOT 'GH DOES THIS TO THE ROOT
  CELL'. The experiment that would close it - GH on a preparation in which GP1 survives - HAS NOT BEEN DONE
  BY ANYONE, and it is the highest-value missing experiment in this programme.

  THREE - THE DEER ANTLER IS RUNNING THE SAME BRAKE, AND THAT IS THE FINDING THIS ROUND WAS NOT EXPECTING.
  Round 199 recorded the antler as 2 cm/day against 2 cm/year and took nothing else. Three independent
  antler datasets, read properly, converge with the human plate on the identical molecular logic:

  - Antlerogenic periosteum (PMC12015367, Commun Biol 2025). The antler-specific founder is THY1+RXFP2+, 16
    per cent of THY1+ cells. Its cluster is defined by NEGATIVE REGULATION OF CANONICAL WNT - SFRP2, SFRP4,
    DKK2, DKK3 - and those inhibitors FALL as the cell becomes a progenitor. Among the same 119 shared
    high-expressed genes are THBS1 AND THBS4. CRISPR knockout of the WNT co-receptor LRP6 in the founder
    cell REDUCES ITS PROLIFERATION, so WNT is required on the exit side, not the root side.
  - Antler tip (PMC12690211, Front Vet Sci 2025). The tip stem cell's single highest-ranked ligand is
    SFRP4, pairing with WNT4 and WNT9A coming from chondroblasts and osteoblasts. Its high-expressed set
    includes SFRP2 and TGFBR3 - betaglycan, a second route to holding TGF-beta down.
  - Antler growth centre (ba2025, snRNA + snATAC + Stereo-seq, 53,949 nuclei, five layers). Signalling runs
    STEM-TO-PROGENITOR, not the reverse. PTHLH and PTH1R are BOTH high in the stem cell and in
    non-proliferative progenitors - the antler root cell makes the delay signal AND receives it, collapsing
    into one cell the two-step the human plate splits between PTHrP-negative GP1 and PTHrP-positive GP2.
    IGF1 is the stem cell's ligand and IGF1R the progenitor's receptor.

  RETRACTED IN PART BY CORR-252 - READ THE NEXT PARAGRAPH BEFORE USING IT. THBS1 IS SIGNIFICANTLY
  GP2-ENRICHED IN THE MOUSE (-0.578, padj 8.0e-04), so it fails the first real test of this claim and is
  withdrawn from it; THBS4 holds (+3.546) and DCN replaces THBS1 as the anchor, being root-enriched in mouse
  at padj 8.2e-25 and a conserved blastema marker across four species. Round 243 carries the corrected
  version. The original paragraph is left standing below because retracting it silently would hide the
  error:

  THBS1 AND THBS4 APPEAR IN THE HUMAN ROOT CELL AND IN THE ANTLER FOUNDER CELL. Two species, two tissues,
  three laboratories, no shared methodology, the same two thrombospondins alongside the same WNT-antagonist
  logic. THIS IS THE STRONGEST CROSS-SPECIES SIGNAL IN THE ROOT-CELL PROGRAMME and it was reachable the
  whole time.

  FOUR - THE ARCHITECTURAL ANSWER TO THE QUESTION THAT WAS ASKED. The instruction was to find the smallest
  controllable intervention that makes root-cell replacement greater than or equal to root-cell loss. THE
  ANTLER ANSWERS IT BY NOT TRYING. It does not run its root cell harder - it keeps the brake ON and puts the
  throughput in a LARGE DOWNSTREAM TRANSIT-AMPLIFYING COMPARTMENT with a vascular supply, a continuous-flow
  architecture rather than a compartmentalised one. Its root cell is, if anything, more restrained than the
  human one.

  THAT INVERTS THE INTERVENTION LOGIC AND INDICTS ONE ARM OF THIS STACK. RELEASING THE ROOT BRAKE IS NOT A
  GROWTH STRATEGY - IT IS A ONE-TIME LIQUIDATION FOLLOWED BY A SMALLER POOL. It is precisely what GH does
  and precisely why GH's efficacy wanes. THE CORRECT SHAPE OF AN INTERVENTION IS: LEAVE THE BRAKE ON,
  EXPAND WHAT HAPPENS DOWNSTREAM OF IT.

  AND BY THAT TEST THE ARM THIS ATLAS HAS ALREADY SETTLED IS ON THE RIGHT SIDE OF THE LINE. FGFR3 inhibition
  acts on the proliferative and columnar compartment, and horike2026 shows excess FGFR3 DISRUPTS resting
  zone turnover and randomises column orientation through CREB - so relieving FGFR3 tone PROTECTS the root
  compartment rather than spending it. That is the opposite of GH's ledger entry, and it is a SECOND,
  INDEPENDENT ROUTE to the conclusion round 236 reached on bone-age grounds alone. Two unrelated lines of
  evidence now put GH on the expensive side and the FGFR arm on the cheap side.

  WHAT THIS ROUND DOES NOT ESTABLISH, AND WILL NOT BE WRITTEN AS THOUGH IT DOES. There is still NO HUMAN
  NUMBER for root-cell self-renewal fraction, pool size, or replacement rate - GP1's proliferative index is
  a relative rank across clusters, not a rate. Whether raising SFRP or THBS locally would preserve the pool
  without also stopping output is UNTESTED IN ANY SPECIES. Whether the antler's large progenitor compartment
  is an expandable variable in a growth plate or a fixed developmental endowment is UNKNOWN. And the antler
  arm has a permanent ceiling: ba2025 states directly that lineage tracing is not feasible in cervids, so no
  antler result can ever reach a clonal-kinetic grade above correlative.
