    decoupleR and SCENIC
  species: human
  source_ref: chu2026
  uncertainty: >-
    expression and regulon inference, not a direct measurement of TGF-beta protein activity in the root cell
- parameter: >-
    growth hormone shifts the human resting zone out of the low-TGF-beta state - phospho-Smad2 positive
    nuclei rise and phospho-Smad1/5 nuclei fall in the resting zone after 24 hours of GH
  value: 'p-Smad2 up P = 0.0397; p-Smad1/5 down P = 0.0097; p-STAT5 up in RZ P = 0.034'
  unit: immunofluorescence-positive nuclei in the resting zone, vehicle versus GH
  conditions: >-
    human growth plate explant slices, 24 hour culture, three to four patients per group, unpaired t test
    and two-way ANOVA with Sidak correction
  species: human
  source_ref: chu2026
  uncertainty: >-
    THE ROOT CELL ITSELF WAS NOT MEASURED. GP1 did not survive explant culture and was excluded from
    analysis by the authors; these counts are resting-zone compartment level, which includes but does not
    isolate GP1. n = 3 to 4 patients
- parameter: >-
    GH down-regulates THBS1 and DCN in the resting zone cluster while up-regulating TGFB3, TGFBR1 and INHBA
    - it removes the specific antagonists that define the root state
  value: 'TGFB3, TGFBR1, INHBA up and THBS1 down at Padj < 1e-250; largest absolute changes INHBA and LTBP1
    up, DCN and THBS1 down'
  unit: differentially expressed TGF-beta pathway genes, GH versus vehicle
  conditions: single-cell RNA-seq of 24-hour cultured human growth plate slices, cluster c-GP2
  species: human
  source_ref: chu2026
  uncertainty: >-
    measured in c-GP2, the PTHrP-positive stem cell, NOT in the root cell - c-GP1 was too scarce in culture
    to evaluate
- parameter: >-
    GHR and IGF1R run opposite gradients across the human growth plate - GHR highest in the root cluster
    GP1, IGF1R highest in the hypertrophic cluster GP5 - so the direct and indirect arms of the somatotropic
    axis act on different compartments
  value: 'GHR maximal in GP1, IGF1R maximal in GP5'
  unit: relative mRNA expression gradient across the five growth plate clusters
  conditions: human single-cell RNA-seq, expression normalised to sequencing depth
  species: human
  source_ref: chu2026
  uncertainty: >-
    mRNA gradient, not receptor protein or occupancy; PTH1R was the most abundantly expressed hormone
    receptor overall in the same comparison
- parameter: >-
    the deer antler founder stem cell is defined by negative regulation of canonical WNT - SFRP2, SFRP4,
    DKK2, DKK3 - and those inhibitors fall as it becomes a progenitor, while CRISPR knockout of the WNT
    co-receptor LRP6 REDUCES its proliferation
  value: 'THY1+RXFP2+ = 16 per cent of THY1+ antlerogenic periosteal cells'
  unit: proportion of the mesenchymal population carrying the antler-specific founder identity
  conditions: >-
    sika deer antlerogenic periosteum versus facial and limb periosteum, single-cell RNA-seq, flow sorting,
    CRISPR-Cas9 LRP6 knockout, cell viability comparison at P < 0.0001
  species: cervid
  source_ref: ba2025a
  uncertainty: >-
    proliferation in culture is not self-renewal in tissue, and lineage tracing is not feasible in cervids
- parameter: >-
    THBS1 and THBS4 appear in BOTH the human root stem cell and the deer antler founder stem cell,
    alongside the same soluble-WNT-antagonist logic - the strongest cross-species convergence in the
    root-cell programme
  value: 2
  unit: thrombospondins shared between the human and antler root-cell signatures
  conditions: >-
    independent datasets, two species, two tissues, three laboratories, no shared methodology; human GP1
    differential expression versus antler THY1+ C1 shared high-expressed gene set
  species: human
  source_ref: chu2026
  uncertainty: >-
    THIS IS A CONVERGENCE OF GENE LISTS ACROSS TWO PAPERS, NOT A JOINT ANALYSIS. Neither group tested the
    other's tissue, no orthologue-level statistics were computed, and thrombospondins are broadly expressed
    matricellular proteins, so the co-occurrence could be a property of mesenchymal cells generally rather
    than of root cells specifically. It is recorded as a lead of high value and low grade
localization:
- 'human upper resting zone: GP1, CYTL1+ SFRP5+ APOE+ GAS1+ PTHLH-negative, adjacent to CYTL1+/RAMP3+ dyads
  that may be mother-daughter pairs'
- 'deer antlerogenic periosteum: THY1+RXFP2+ founder cells, and the antler tip reserve mesenchyme in which
  RXFP2 is down-regulated'
human_evidence: direct
human_evidence_note: >-
  The root-cell antagonist screen and the GH effect on it were both measured in human growth plate tissue -
  single-cell and spatial transcriptomics on surgical specimens, and immunofluorescence on explants. The
  antler arm is a separate species used as a comparator and is never allowed to carry a human claim. The
  one inference that crosses species without human support is the architectural conclusion that throughput
  belongs downstream of the brake, which is graded as inference.
species_basis:
- human
- cervid
translation_risk: moderate
translation_risk_reason: >-
  The human results are human, which removes the usual leap. The residual risk is inside the human data: the
  root cell was characterised in native tissue but was lost in the culture system used to test GH, so the
  causal claim about GH and the root cell rests on a compartment-level readout rather than a cell-level one.
  The antler arm cannot be graded above correlative because lineage tracing is not feasible in cervids.
confidence: C
confidence_reason: >-
  The human descriptive programme is direct human tissue but comes from a single study with a single
  independent preprint corroborating the SFRP5+ resting-zone subpopulation, which is grade D on its own. The
  GH-strips-the-brake result is a single study. The antler convergence is three independent datasets in one
  species, replicated for the WNT-antagonist logic across two of them, which is grade C for the animal
  claim. The node is graded C on the strength of the antler replication and the human-tissue provenance, and
  NOT higher, because no part of the central claim has been replicated in human tissue by an independent
  group.
