id: round249_hedgehog_installs_the_brake_and_elevation_is_already_demonstrated
name: >-
  ROUND 249 - the three asks closed. The contradiction was an uncited review sentence (CORR-259). THE
  ELEVATION TEST WAS ALREADY DONE AND IT IS POSITIVE - normal Wistar-Kyoto rats, contralateral control,
  +3.63 per cent femur. And SAG DOWNREGULATES WNT AS ONE OF ITS TOP TWO PATHWAYS, which means hedgehog
  agonism expands the pool BY INSTALLING THE ROOT-CELL BRAKE rounds 241 and 245 characterised
type: hypothesis
layer: L2
aliases:
- hedgehog installs the brake
- elevation is demonstrated
- the oxysterol chemotype is wrong
- round 249
stub: false
summary: |
  THREE THINGS WERE ASKED FOR. ONE WAS A REVIEW AND SETTLED NOTHING BUT POINTED CORRECTLY. ONE WAS ALREADY
  ANSWERED IN A PAPER THE ATLAS HAS HELD SINCE ROUND 204. THE THIRD RETURNS A CLEAN NEGATIVE THAT IS WORSE
  THAN ABSENCE.

  ONE - THE DISAGREEMENT DID NOT EXIST (CORR-259). cheng2025 is a REVIEW, typed as one in this bibliography
  all along, and its sentence that post-SOC SAG promoted proliferation of resting zone chondrocytes IS
  UNCITED - it follows a citation to Newton 2019 and supplies none of its own. Its substantive SAG passage
  describes trompet2024, the paper it was being set against. And the pre-SOC claim that both LDE225 and SAG
  reduce PTHrP+ cells cites Mizuhashi 2018, a different window.

  THE PRIMARY WAS NEVER IN CONFLICT WITH ITSELF - THE TWO READINGS ARE TWO ROUTES INSIDE ONE PAPER.
  SYSTEMIC SAG and GENETIC Ptch1 ablation both promoted proliferation and clonal enlargement. TRANSIENT
  INTRA-ARTICULAR SAG raised NUMBER with proliferation unchanged in the uppermost 50 microns and in the
  proliferative zone, and terminal hypertrophic cell size unchanged. Three local injections did as much for
  clonogenicity as seven systemic ones.

  AND THE CLONE COMPOSITION SAYS WHAT KIND OF EVENT IT WAS: single Tomato+ cells DECREASED, doublets and
  triplets INCREASED, LARGER CLONES UNAFFECTED. That is quiescent singletons dividing once. It is not
  amplification, and it is exactly what expanding a pool without spending it should look like.

  TWO - AND THIS IS THE FINDING THAT UNIFIES THE WHOLE LINE. RNA-seq of FACS-isolated PTHrP+CD73+ cells
  after SAG: WNT SIGNALLING WAS AMONG THE TOP TWO DOWNREGULATED PATHWAYS. The authors' own reading is that
  activating hedgehog CREATES A WNT-INHIBITORY MICROENVIRONMENT, which is permissive for these cells.

  ROUNDS 241, 245 AND 247 SPENT THREE DAYS ESTABLISHING THAT THE ROOT STATE IS A SELF-SECRETED WNT-ANTAGONIST
  SCREEN - nine named inhibitors, SFRP1, SFRP2, SFRP5, DKK1, DKK3, SOSTDC1, WIF1, SERPINF1 and PORCN, with
  beta-catenin transcription factor activity absent from GP1. HEDGEHOG AGONISM TURNS THAT PROGRAMME ON. The
  intervention that expands the pool does so by INSTALLING THE BRAKE THAT DEFINES ROOT IDENTITY, which is
  also why proliferation did not rise in the local arm. Two independent lines of this programme, built from
  different papers for different reasons, meet at one mechanism.

  THREE - THE ELEVATION TEST WAS ALREADY DONE AND IT IS POSITIVE. This was the question I called the single
  most decision-relevant number in the line. THE ANSWER WAS IN THE METHODS OF A PAPER THE ATLAS HAS HELD
  SINCE ROUND 204. The bead experiment used WISTAR-KYOTO RATS - normal animals, purchased from a commercial
  nursery, NO DISEASE MODEL - with the contralateral leg receiving DMSO beads. Femur +2.75, +2.64 and +3.63
  per cent at 1, 2 and 6 months; entire leg +1.06, +1.09 and +1.65 per cent; 6/6, 9/9 and 8/8 animals. The
  mouse arms are Pthrp-tdTomato reporter mice, also normal.

  SO HEDGEHOG AGONISM MAKES A NORMAL ANIMAL'S BONE LONGER THAN ITS OWN CONTRALATERAL CONTROL. THAT IS
  ELEVATION, NOT RESTORATION, AND IT IS THE ONLY SUCH RESULT IN THIS ATLAS. ye2026's nanoparticle rescue is
  restoration in an FGFR3-deficient plate; trompet2024 is elevation in an intact one. The two sit on
  opposite sides of CORR-203 and the atlas had been treating them as one class of evidence.

  FOUR - THE OXYSTEROL SEARCH RETURNS A NEGATIVE, AND IT IS WORSE THAN ABSENCE. Five searches for oxysterols
  against growth plate, chondrocyte, chondrogenesis, endochondral ossification and longitudinal length
  return NOTHING with a growth plate or a length endpoint. The entire oxysterol literature is INTRAMEMBRANOUS
  AND OSTEOGENIC - posterolateral spinal fusion, intramembranous bone healing, bone tissue engineering,
  osteoclastogenesis.

  THAT IS NOT A GAP TO BE FILLED, IT IS A REASON TO DROP THE CHEMOTYPE. Oxysterols were selected and
  optimised FOR OSTEOGENESIS. In the resting zone, osteogenesis is the failure mode the brief explicitly
  forbade - and this atlas already holds the demonstration that hedgehog activation in these very cells
  drives it: orikasa2024's Ptch1-deleted PTHrP+ descendants CONVERTED TO TRABECULAR OSTEOBLASTS, with
  hyperplasia that was transient and no gain in bone length. THE ONE OBTAINABLE HEDGEHOG-AGONIST CHEMOTYPE
  IS OPTIMISED FOR EXACTLY THE OFF-TARGET FATE THIS PROGRAMME MUST AVOID. Oxy133 is withdrawn as a
  candidate.

  FIVE - WHAT THE AUTHORS THEMSELVES FLAG, WHICH THE ATLAS SHOULD CARRY. They abandoned the intra-articular
  route for the bead precisely because INTRA-ARTICULAR INJECTIONS CAN CAUSE JOINT TRAUMA and because
  ACTIVATION OF HEDGEHOG MAY HARM ARTICULAR CARTILAGE. And on the genetic arm they write that EXTENSIVE
  EXPANSION OF THE STEM POPULATION IS ASSOCIATED WITH TISSUE DISORGANISATION - the hyperplasia constraint
  appearing inside their own data, in the same paper that supplies the length gain.

  SIX - THE MARKER PROBLEM GOT WORSE, NOT BETTER. Under SAG, Pthlh expression normalised to GAPDH FELL from
  7.0 to 5.4 arbitrary units (n = 4, unpaired t test, NO correction for multiple comparisons, and the
  authors describe other stem markers as showing no clear tendency). So SAG raises the COUNT of
  Pthrp-tdTomato+ cells while LOWERING PTHrP message per cell. Set beside kodama2025 - PTHLH is carried by
  17 per cent of the resting compartment and 77 per cent of Apoe+ cells carry no stem marker - MORE
  REPORTER-POSITIVE CELLS WITH LESS PTHrP EACH IS MORE CONSISTENT WITH CELLS ENTERING THE REPORTER-POSITIVE
  STATE THAN WITH EXPANSION OF A FIXED PTHrP-HIGH POPULATION. The whole-compartment count under SAG remains
  the experiment that would settle it, and nobody has done it.

  SEVEN - WHAT NOW STANDS. Pool expansion is real, in normal animals, with an accumulating length endpoint
  and a mechanism that coheres with everything rounds 241 to 247 established. Delivery from a vein into
  growth plate cartilage is built. THE GATE IS THE MOLECULE AND IT JUST NARROWED: there is no Smoothened
  agonist a human can be given, and the one obtainable chemotype is disqualified by its osteogenic
  selection. What is needed is a Smoothened agonist with NO osteogenic bias, or a way to restrict hedgehog
  activation to the resting zone for a short enough window that the osteogenic conversion orikasa2024
  observed does not have time to run.
quantitative:
- parameter: >-
    hedgehog agonism downregulates WNT signalling as one of its top two pathways - the mechanistic link
    between the pool lever and the root-cell brake
  value: 'Wnt signalling among the TOP 2 DOWNREGULATED pathways in FACS-isolated PTHrP+CD73+ cells after SAG'
  unit: pathway rank in differential expression analysis
  conditions: FACS-isolated PTHrP+CD73+ cells, systemic SAG, mouse
  species: mouse
  source_ref: trompet2024
  uncertainty: >-
    a pathway-rank statement rather than an effect size, and no individual WNT antagonist is named, so the
    connection to the nine inhibitors of round 245 is at pathway level only. Sorted cells, not tissue
- parameter: >-
    the local intra-articular arm converts quiescent singletons into pairs without touching larger clones -
    the clone-composition signature of pool expansion rather than amplification
  value: >-
    'single Tomato+ cells DECREASED, doublets and triplets INCREASED, clones of 4 or more UNCHANGED; total
    Tomato+ cells 65.5 -> 139.8 per square mm (n = 5, P = 0.017), all in the resting zone; proliferation
    unchanged in the uppermost 50 microns and the proliferative zone; terminal hypertrophic cell size
    unchanged'
  unit: clone size distribution and cell density
  conditions: intra-articular SAG on P28, P30 and P32 in Pthrp-creER R26R-tdTomato mice, analysed P37
  species: mouse
  source_ref: trompet2024
  uncertainty: >-
    n = 5 per group. And the marker carries only 17 per cent of the resting compartment (kodama2025), while
    Pthlh message per cell FELL under SAG, so a rise in reporter-positive cells is consistent with
    recruitment into the reporter-positive state
- parameter: >-
    THE ELEVATION RESULT - hedgehog agonism lengthens a NORMAL animal's bone beyond its own contralateral
    control, which is elevation rather than restoration
  value: >-
    'Wistar-Kyoto rats, commercially sourced, no disease model; SAG beads in the distal femoral SOC of one
    leg, DMSO beads contralateral. Femur +2.75 per cent at 1 month (6/6), +2.64 at 2 months (9/9), +3.63 at
    6 months (8/8); entire leg +1.06, +1.09 and +1.65 per cent'
  unit: per cent length increase over the contralateral vehicle-implanted leg
  conditions: beads implanted at 30 days of age; paired analyses recomputed by this atlas from JCI source data
  species: rat
  source_ref: trompet2024
  uncertainty: >-
    THE BEAD MOVES THREE TERMS AT ONCE - growth plate height and growth rate also rose - so the length gain
    cannot be attributed to pool expansion alone. Rat, and a rat plate does not close on a human schedule.
    The authors adopted this route because intra-articular injection risks joint trauma and hedgehog
    activation may harm articular cartilage
- parameter: >-
    SAG lowers PTHrP message per cell while raising the count of reporter-positive cells - which sharpens
    the recruitment-versus-expansion problem rather than resolving it
  value: 'Pthlh normalised to GAPDH 7.0 +/- 0.24 in control versus 5.4 +/- 0.35 under SAG, mean +/- SE, n = 4'
  unit: arbitrary units of expression
  conditions: FACS-isolated cells, unpaired two-tailed t test
  species: mouse
  source_ref: trompet2024
  uncertainty: >-
    THE AUTHORS STATE NO CORRECTION FOR MULTIPLE COMPARISONS WAS APPLIED, and describe other stem markers as
    showing no clear tendency. n = 4
  value_unverified: true
localization:
- 'mouse resting zone: where the intra-articular SAG effect on cell number is confined'
- 'rat distal femoral secondary ossification centre: where the bead sits, immediately above the growth plate'
human_evidence: indirect
human_evidence_note: >-
  No human hedgehog agonist data exists. The human anchor runs the other way - robinson2017a, three children
  whose growth arrested on the antagonist vismodegib - which establishes the pathway is required to keep a
  human plate open but says nothing about whether agonism elevates a human beyond normal.
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: >-
  Rodent throughout, with a plate that does not close on a human schedule, and a case at late bone age. The
  molecule gate is now the binding constraint: no Smoothened agonist has been given to a human and the one
  obtainable chemotype has been withdrawn here for osteogenic bias.
confidence: C
confidence_reason: >-
  The elevation result is a single paper, but with per-animal source data, every animal gaining, a
  contralateral within-animal control and an effect accumulating over six months, which is as strong as a
  single study gets. It is held at C rather than B because the bead moves three terms simultaneously, the
  pool attribution rests on a marker covering 17 per cent of the compartment whose message per cell FALLS
  under the treatment, and no independent group has repeated it.
