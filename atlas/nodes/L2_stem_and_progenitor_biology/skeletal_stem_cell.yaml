id: skeletal_stem_cell
name: Skeletal stem cell (SSC)
aliases:
- SSC
- bone-cartilage-stroma stem cell
type: cell_type
summary: '''Skeletal stem cell'' names an operational result, not a single cell: a cell that self-renews
  and generates bone, cartilage and hematopoiesis-supportive stroma in a transplantation or lineage-tracing
  assay. At least five mutually incompatible definitions are in current use - the FACS-defined mouse mSSC
  hierarchy, PTHrP+/FoxA2+ resting-zone chondrocytes, Grem1+ osteochondroreticular cells, LepR+ perisinusoidal
  stroma, and CTSK-lineage periosteal stem cells - and they disagree on anatomy, markers, adipogenic potential
  and developmental window. The disagreements are not semantic. Whether the SSC makes marrow adipocytes
  separates the CD146+ adventitial-reticular-cell definition (yes) from the mSSC/Grem1 definitions (no).
  Whether the growth plate SSC lies in the resting zone (mouse tracing) or in the pre-hypertrophic/hypertrophic
  zone (human FACS/scRNA homology mapping) is a straight contradiction in anatomy. Dual-recombinase fate
  mapping showed that even the dominant osteoblast source changes with age, from chondrocytes before adolescence
  to LepR+ stroma after - so ''the'' skeletal stem cell is time-dependent as well as site-dependent. Human
  work rests on xenotransplantation of prospectively sorted cells, never on in-situ tracing.'
quantitative: []
localization:
- 'mouse growth plate: mSSC phenotype enriched (chan2015)'
- 'mouse metaphysis: Grem1+ OCR cells concentrated, not perisinusoidal (worthley2015)'
- 'mouse perisinusoidal marrow: LepR+ stroma (zhou2014)'
- 'mouse periosteum: CTSK-lineage PSC (debnath2018)'
- 'human fetal pre-hypertrophic/hypertrophic zone: hSSC enriched (chan2018)'
human_evidence: indirect
human_evidence_note: Human SSCs are defined by prospective sorting followed by renal-capsule xenotransplantation
  in immunodeficient mice; their behaviour in situ in a human skeleton is inferred, not observed.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: The mouse and human panels share no marker, and mouse assays are in-situ genetic
  while human assays are ectopic transplantation - two different questions given the same name.
confidence: D
