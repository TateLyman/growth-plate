id: resting_zone_regenerates_the_plate
name: The resting zone rebuilds the entire growth plate in two weeks — and it makes the signal that sets the yield
type: process
layer: L2
stub: false
summary: 'Everything this atlas has concluded about budgets and exhaustion concerns the resting zone, and abad2002
  shows why: THE REST OF THE PLATE IS EXPENDABLE. The proliferative and hypertrophic zones were surgically removed
  from rabbit distal ulnar growth plates in vivo, leaving only resting zone cartilage, and A COMPLETE GROWTH PLATE
  REGENERATED - 1 of 11 plates by one week, 7 OF 12 BY TWO WEEKS. The proliferative and hypertrophic zones are not
  a resource that can run out; they are an output that the resting zone rebuilds on demand. Only the resting zone
  is irreplaceable, which is what makes nilsson2014''s irreversible depletion of resting zone cell number the whole
  of the budget rather than one term in it. THE SECOND EXPERIMENT IS STRANGER AND MORE USEFUL. Resting zone cartilage
  transplanted ECTOPICALLY alongside proliferative columns induced a NINETY-DEGREE SHIFT in the orientation of nearby
  proliferative chondrocytes, changing both the shape of individual cells and the alignment of the columns. An ectopic
  HYPERTROPHIC zone did not (n = 7), so the effect is specific to resting zone tissue and not to grafting. The authors
  infer a diffusible growth-plate-orienting factor, and - the part that matters here - they raise the possibility
  that the resting zone also produces A MORPHOGEN THAT INHIBITS TERMINAL DIFFERENTIATION OF NEARBY PROLIFERATIVE
  CHONDROCYTES. IF THAT IS RIGHT, THE RESTING ZONE ALREADY MAKES THE YIELD SIGNAL. A factor that delays hypertrophy
  lets a proliferative clone divide more times before it terminally differentiates, which is precisely more proliferative
  divisions per resting-zone cell spent - the quantity nilsson2014 named and nobody has measured. The lever this atlas
  has been looking for may not be a drug to invent but a gradient to extend.'
quantitative:
- parameter: A COMPLETE GROWTH PLATE REGENERATES FROM RESTING ZONE ALONE
  value: complete growth plate regenerated in 1 of 11 plates analysed at 1 week and 7 of 12 analysed at 2 weeks; in
    6 others proliferative columns regenerated but the plate was poorly organised or lacked a hypertrophic zone
  unit: plates regenerated per plates analysed
  conditions: 'CORRECTED ROUND 74 (CORR-067). Rabbit distal ULNAR growth plate in vivo; animals killed 6-10 DAYS after
    surgery, not two weeks. And the 7 belongs to the WRONG GROUP: the paper reports two separate series. Where the
    incision started in the resting zone but TRAVERSED INTO THE PROLIFERATIVE ZONE - so that, in the authors words,
    some proliferative chondrocytes were reinserted into the ulna along with resting zone cartilage - 7 of 13 plates
    regenerated a well-organised plate and 6 were poorly organised or lacked a hypertrophic zone. Where the incision
    was located in the RESERVE CARTILAGE, the clean condition, a complete growth plate regenerated in 5 of 12.'
  species: rabbit
  source_ref: abad2002
  uncertainty: 'THE CORRECTION MATTERS BECAUSE IT INVERTS WHICH NUMBER IS THE CLEAN ONE. The atlas cited 7 of 12 as
    resting zone alone rebuilding a plate; in fact the best-performing group is the one CONTAMINATED with reinserted
    proliferative chondrocytes, and the group that isolates resting zone gives 5 of 12. The qualitative claim survives -
    a plate does regenerate from resting zone in under two weeks, and the authors say a complete proliferative and
    hypertrophic zone often regenerated within 1 week - but it is a minority of plates in the clean condition, not a
    majority. Other limits unchanged: this is surgery, so failures cannot be separated from technical problems, and
    nobody counted resting zone cells before and after, so a plate rebuilt is not a plate rebuilt for free.'
- parameter: ECTOPIC RESTING ZONE REORIENTS PROLIFERATIVE COLUMNS BY NINETY DEGREES
  value: a 90-degree shift in the orientation of nearby proliferative zone chondrocytes, affecting both individual
    cell shape and column alignment; an ectopic hypertrophic zone produced no such shift, n = 7
  unit: degrees
  conditions: resting zone cartilage manipulated in vivo to sit alongside the proliferative columns rather than above
    them; the hypertrophic-zone graft is the specificity control
  species: rabbit
  source_ref: abad2002
  uncertainty: A LARGE, UNAMBIGUOUS, WELL-CONTROLLED EFFECT - ninety degrees is not a subtle readout, and the ectopic
    hypertrophic graft rules out grafting per se. What it does not establish is SECRETION. The authors themselves
    offer the alternative that the graft BINDS a morphogen produced elsewhere in the plate and distorts an existing
    gradient, which would produce the same reorientation without the resting zone making anything. Nothing here
    distinguishes a source from a sink.
- parameter: AND POSSIBLY A FACTOR THAT INHIBITS TERMINAL DIFFERENTIATION — WHICH WOULD BE THE YIELD SIGNAL
  value: the band of proliferative chondrocytes adjacent to the ectopic resting zone appeared to resist hypertrophic
    differentiation, raising the possibility of a resting-zone-derived morphogen that inhibits terminal differentiation
  unit: qualitative
  conditions: same ectopic-graft preparation; the authors present this as one of two readings of the same observation
  species: rabbit
  source_ref: abad2002
  uncertainty: 'THE MOST INTERESTING CLAIM IN THE PAPER AND THE WEAKEST. It is an appearance in histology, offered
    by the authors with an explicit alternative in the same paragraph - that the band of non-hypertrophic cells reflects
    something other than a hypertrophy-inhibiting signal. No molecule is identified and none is measured. THE REASON
    THIS ATLAS RECORDS IT ANYWAY is that it names a mechanism for the one quantity the therapeutic argument now turns
    on: a diffusible factor that delays hypertrophy would let a proliferative clone divide more times before terminal
    differentiation, which is more growth per progenitor consumed. THE OBVIOUS CANDIDATE IS THE IHH/PTHrP LOOP, since
    PTHrP is the canonical inhibitor of hypertrophic differentiation and mizuhashi2018 identifies PTHrP+ cells AS the
    resting zone stem cells - but THAT CONNECTION IS THIS ATLAS''S INFERENCE AND NOT ABAD''S FINDING, and abad2002
    lists PTHrP alongside IHH and BMPs as untested candidates. It is recorded as a hypothesis to test, not a result.'
localization:
- resting zone, and the proliferative zone immediately adjacent to it
human_evidence: absent
human_evidence_note: Rabbit surgery throughout, in a species chosen because it fuses at sexual maturity as humans
  do. No human growth plate has been surgically depleted and observed to regenerate, and none will be. The nearest
  human-relevant instrument is chu2026's two-month explant, in which a resting-zone-sparing injury and subsequent
  regeneration could in principle be observed.
species_basis:
- rabbit
translation_risk: high
translation_risk_reason: Surgical rabbit work from 2002 with histological endpoints and no molecular identification.
  The regeneration result is robust in kind; the morphogen inference is a reading of histology that the authors
  themselves offer alternatives to.
confidence: C
confidence_note: C. The regeneration finding is a direct in vivo observation with a clear denominator and the ectopic-graft
  experiment carries its own specificity control, which is better design than most of this literature. It is not B
  because the counts are small and surgical failure cannot be separated from biological failure, because no molecule
  is identified, and because the hypertrophy-inhibition claim is an appearance with a stated alternative. It is not
  D because the ninety-degree reorientation is a large controlled effect and the regeneration denominators are reported.
