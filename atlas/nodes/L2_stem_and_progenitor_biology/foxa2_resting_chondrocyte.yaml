id: foxa2_resting_chondrocyte
name: FoxA2+ resting zone chondrocyte
aliases:
- FoxA2+ long-term skeletal stem cell
type: cell_type
summary: 'FoxA2+ cells sit at the very top of the mouse resting zone, at the cartilage/secondary ossification
  centre interface (75% within the cartilage, 25% inside the SOC domain at P13-P17). They are a small
  population - about 98 cells per section by immunohistochemistry at P14 - and are essentially non-overlapping
  with PTHrP+ cells at the time of labelling (0.017% double-positive by flow cytometry, indistinguishable
  from the 0.014% background). By P40 a FoxA2 pulse gives rise to PTHrP+ cells (0.1% double-positive),
  placing FoxA2+ cells upstream. In colony assays FoxA2+ cells are more clonogenic and much longer-lived
  than PTHrP+ cells: 9% (10/112) of FoxA2+ colonies reached passage 9 or beyond, versus 1.4% (2/143) of
  PTHrP+ colonies reaching passage 5. FoxA2+ cells are required for growth plate regeneration after injury.
  FoxA2+ cells at this site are also present in rabbit, the only non-murine mammalian confirmation of
  any resting-zone stem cell marker, but no functional tracing has been done outside mouse.'
