id: round252_the_block_is_extrinsic
name: >-
  ROUND 252 - the mTORC1 length experiment FOUND, and the answer reframes the ceiling. Tsc1-null cartilage
  grows 52 PER CENT FASTER EX VIVO AND NOT AT ALL IN VIVO. THE BLOCK ON GROWTH IS EXTRINSIC TO THE PLATE -
  which converges with two other things this atlas already held. And ambrosi2025 delivers a human two-drug
  combination that maps onto the root-cell brake from a completely independent direction
type: hypothesis
layer: L2
aliases:
- the block is extrinsic
- 52 per cent ex vivo
- SAG21k plus DMH1
- the ceiling is not in the plate
- round 252
stub: false
summary: |
  WITHDRAWN IN PART, ROUND 253 - CORR-262. THE 52 PER CENT IS NOT A RATE. Figure 2A of newton2018, which
  this node never opened, plots CUMULATIVE growth in culture at day 2 and day 4: control 0.207 and cKO
  0.348 mm at day 2, control 0.400 and cKO 0.489 mm at day 4 - so the mutant grew 0.141 mm between those
  two timepoints against the control's 0.194 mm. The advantage is a ONE-OFF OFFSET of about 79 micrometres
  acquired in the first 24 hours, which is exactly what the paper's own wording says - "this growth
  increment was sustained" - and this node read increment as rate. THERE IS NO STANDING EX VIVO HEADROOM,
  so the central conclusion below does not follow from this experiment, and the discriminating experiment
  proposed at the end of section THREE is aimed at a quantity that does not exist. What survives is the in
  vivo null itself, the ambrosi2025 human arm, and the SAG21k plus DMH1 convergence. See
  round253_the_52_per_cent_was_transient_and_the_real_extrinsic_constraint_has_a_human_length_endpoint.
  THE ORIGINAL TEXT FOLLOWS UNCHANGED.

  THE INSTRUCTION WAS TO FIND THE mTORC1 LENGTH EXPERIMENT EVEN IF ONLY INFERRABLE. IT EXISTS, IT IS DIRECT
  RATHER THAN INFERRED, AND IT SAYS SOMETHING LARGER THAN THE QUESTION ASKED.

  ONE - THE EXPERIMENT. newton2018, Bone Reports, SAME LABORATORY, the paper newton2019 cites as its
  reference 24 for the Tsc1 phenotype. Three results, and the third is the one that matters.

  CONSTITUTIVE Col2-Cre:Tsc1 fl/fl - the mice develop abnormally with seizures and chronic wasting, but the
  authors attribute that to a NEURONAL phenotype (Col2-Cre also recombines in neurons; neuronal Tsc1
  ablation mimics it and is rapamycin-rescuable) and their own figure title is: BONES ARE RELATIVELY NORMAL.

  POSTNATAL INDUCIBLE ablation, Table 1 at 16 days: body mass p = 0.867; TIBIAL LENGTH 11.88 +/- 0.11
  (n = 5) VERSUS 11.52 +/- 0.08 (n = 3), p = 0.070 - TRENDING SHORTER, NOT LONGER; femoral length has n = 2
  and no p value. The section heading is: MICE WITH POSTNATAL CHONDROCYTE-SPECIFIC ABLATION OF Tsc1 DEVELOP
  NORMALLY.

  SO THE ANSWER TO ROUND 251'S QUESTION IS: AN mTORC1-EXPANDED, SYMMETRY-SHIFTED POOL PRODUCES NO LENGTH,
  AND IF ANYTHING TRENDS SHORT. That closes the mTORC1 arm as a height lever.

  TWO - AND THEN THE RESULT THAT REOPENS EVERYTHING. THE SAME MUTANT BONES, CULTURED EX VIVO, GREW 52 PER
  CENT MORE IN THE FIRST 24 HOURS - control metatarsals grew 150 +/- 13 microns, cKO grew 229 +/- 19
  microns, p = 0.0016, n = 18 - AND THE INCREMENT WAS SUSTAINED OVER THE CULTURE PERIOD, with NO change in
  cell proliferation and NO change in collagen X. There was no length difference before culture
  (2.711 +/- 0.046 versus 2.700 +/- 0.052 mm, p = 0.9237, n = 18), so the bones were matched at the start.

  THE AUTHORS' OWN CONCLUSION IS THE FINDING: ADDITIONAL FACTORS ARE REQUIRED FOR STIMULATION OF
  mTOR-DEPENDENT GROWTH IN VIVO.

  THE SAME CARTILAGE, WITH THE SAME LESION, GROWS HALF AGAIN AS FAST THE MOMENT IT LEAVES THE ANIMAL. THE
  BLOCK IS NOT IN THE PLATE. IT IS IMPOSED FROM OUTSIDE.

  THREE - AND THAT IS THE THIRD INDEPENDENT LINE IN THIS ATLAS SAYING THE SAME THING, WHICH IS WHY IT IS
  WORTH MORE THAN ONE PAPER.

  - ROUND 201 found that EXPLANTING a growth plate REACTIVATES the resting pool - the niche signal is
    withdrawn, the cells wake, and the identity that made them a reserve goes with it.
  - arm3_pool_ceiling_is_imposed_not_intrinsic establishes at grade B that the senescence counter is
    BODY-WIDE RATHER THAN PLATE-SPECIFIC: a common programme downregulates hundreds of growth-promoting
    genes simultaneously in kidney, lung, liver and heart, and it is DRIVEN BY GROWTH RATHER THAN TIME.
  - AND NOW: 52 per cent more growth once the bone is out of the body, with proliferation unchanged.

  THREE DIFFERENT EXPERIMENTS, THREE DIFFERENT LABORATORIES, ONE SHAPE. THE GROWTH PLATE IS NOT RUNNING AT
  ITS OWN CEILING. IT IS RUNNING AT A CEILING THE ORGANISM IMPOSES.

  FOUR - WHAT THAT DOES TO THE PROGRAMME, STATED AS THE ROI QUESTION IT IS. EVERY AGENT IN THIS STACK PUSHES
  ON THE PLATE. If the plate is not the limiting element, pushing harder on it has bounded returns - and
  that is precisely the pattern this atlas keeps finding and keeps treating as separate disappointments:
  growth hormone's amplification factor measured BELOW ONE (0.77x, round 183); a THREEFOLD difference in
  oestrogen suppression buying NO additional predicted height; the CNP arm's modest and saturating gains;
  and now mTORC1 giving 52 per cent ex vivo and nothing in vivo. FOUR AGENTS, FOUR MECHANISMS, ONE CEILING.

  THE CANDIDATES FOR THE EXTRINSIC CONSTRAINT, NAMED SO THE NEXT ROUND HAS SOMETHING TO TEST. Mechanical
  load, which is present in vivo and absent in a culture dish and which this atlas already tracks in
  every_mechanical_route_to_yield and cytoskeletal_tension_chondrocyte. Nutrient and oxygen supply, since
  the plate is avascular and hypoxic in vivo and an explant sits in rich medium with both faces exposed. A
  circulating inhibitor. Or the multi-organ programme of arm3 acting on the plate from the systemic side.
  NOTHING IN THIS ATLAS DISTINGUISHES THEM, AND THE DISCRIMINATING EXPERIMENT IS CHEAP: culture the explant
  under load, under physiological oxygen, and in serum from a same-age animal, one factor at a time, and see
  which one costs the 52 per cent back.

  FIVE - ambrosi2025, WHICH ARRIVES AT THIS PROGRAMME'S OWN CONCLUSION FROM A COMPLETELY DIFFERENT
  DIRECTION. Single-cell RNA-seq of prospectively isolated human skeletal stem cells across TEN skeletal
  sites plus adulthood. Four principal subtypes, and the CHONDROGENIC one - SKIL+PDPN+ - localises primarily
  to the RESTING AND PROLIFERATIVE ZONES of the growth plate, giving a human marker pair for the cell this
  programme is about. A FIBROGENIC SUBTYPE SWITCH drives age- and disease-related skeletal impairment.

  AND THE COMBINATION IS THE STRIKING PART. From Boolean gene-regulatory-network inference they derived a
  TWO-DRUG COCKTAIL - SAG21k, a Smoothened agonist, PLUS DMH1, a selective BMP inhibitor - which together
  raised IHH and SOX9 while lowering BMPR1A and TAGLN, and SIGNIFICANTLY ENHANCED OSTEOGENESIS OF PATIENT
  hSSCs ONLY WHEN APPLIED TOGETHER (n = 14, independent duplicates of seven patients). In vivo it improved
  ossicle formation with higher mineralised content, worked in cells from tendon, cartilage and metaphyseal
  marrow of AGED donors, and in femoral fracture the donor cells enriched for the chondrogenic subtype
  contributed to multiple lineages through endochondral ossification.

  WHY THAT MATTERS HERE: HEDGEHOG AGONISM PLUS BMP INHIBITION IS, MECHANISTICALLY, THE ROOT-CELL BRAKE.
  Round 249 established that hedgehog agonism installs the WNT-inhibitory programme. Rounds 241 and 243
  established that the root cell holds BMP-Smad1/5 DOWN - BMP genes are enriched in GP2 and GP5, not GP1,
  and growth hormone LOWERS p-Smad1/5 in the resting zone. DMH1 blocks BMP. SO AN INDEPENDENT GROUP, USING
  BOOLEAN NETWORK INFERENCE ON HUMAN CELLS FOR A FRACTURE-HEALING ENDPOINT, ARRIVED AT THE SAME TWO-ARM
  ANTAGONIST COMBINATION THIS ATLAS DERIVED FROM GROWTH PLATE TRANSCRIPTOMICS AND DEER ANTLERS.

  AND THE CAVEAT THAT KEEPS IT FROM BEING A PROTOCOL: EVERY ENDPOINT IN ambrosi2025 IS OSTEOGENESIS,
  MINERALISATION AND FRACTURE HEALING. There is no growth plate length anywhere in it. It is the same
  osteogenic application bias round 250 identified, now applied to human cells - and in the resting zone,
  driving osteogenesis is the named failure mode (orikasa2024). The combination is obtainable - SAG21k
  Biotechne 5282, DMH1 Selleck S7146, with published doses - and what it has never been asked to do is
  lengthen a bone.
quantitative:
- parameter: >-
    mTORC1 activation in chondrocytes produces NO length gain in vivo and if anything a shortening trend -
    the experiment round 251 said was untested
  value: >-
    'postnatal inducible Tsc1 ablation at 16 days: body mass 6.00 +/- 0.14 (n = 5) versus 6.03 +/- 0.07
    (n = 3), p = 0.867; TIBIAL LENGTH 11.88 +/- 0.11 versus 11.52 +/- 0.08, p = 0.070; femoral length
    8.45 +/- 0.13 (n = 5) versus 8.58 +/- 0.02 (n = 2), no p reported'
  unit: millimetres, mutant versus Cre-negative littermate
  conditions: Col2-Cre:Tsc1 floxed mouse, postnatal chondrocyte-specific ablation
  species: mouse
  source_ref: newton2018
  uncertainty: >-
    VERY SMALL GROUPS - n = 3 and n = 2 in the mutant arms, and the femoral comparison has no p value at
    all. The tibial trend at p = 0.070 is toward SHORTER, which is the opposite of the pool-expansion
    prediction, but at this n it is not a result either way. The constitutive line is confounded by a
    neuronal phenotype
- parameter: >-
    THE SAME MUTANT CARTILAGE GROWS 52 PER CENT FASTER ONCE REMOVED FROM THE ANIMAL - the block on
    mTORC1-driven growth is extrinsic
  value: >-
    'first 24 h in culture: control metatarsals grew 150 +/- 13 microns, Tsc1 cKO grew 229 +/- 19 microns,
    p = 0.0016, n = 18, increment SUSTAINED over the culture period; no change in cell proliferation or
    collagen X; no length difference before culture (2.711 +/- 0.046 versus 2.700 +/- 0.052 mm, p = 0.9237)'
  unit: microns of longitudinal growth in the first 24 hours of explant culture
  conditions: embryonic metatarsal explant culture from Col2-Cre:Tsc1 floxed mice
  species: mouse
  source_ref: newton2018
  uncertainty: >-
    METATARSAL EXPLANTS ARE EMBRYONIC AND HAVE NO SECONDARY OSSIFICATION CENTRE, so this is a
    pre-niche preparation and not the postnatal plate this programme is about. The comparison is
    mutant-versus-control in culture, not the same bone before and after explanting, so it does not directly
    measure how much explanting releases - it shows that mTORC1's growth effect APPEARS ex vivo and is
    ABSENT in vivo, which is the load-bearing contrast
- parameter: >-
    a human two-drug combination that maps onto the root-cell brake - hedgehog agonism plus BMP inhibition,
    effective only in combination
  value: >-
    'SAG21k plus DMH1 raised IHH and SOX9 and lowered BMPR1A and TAGLN, and significantly enhanced
    osteogenesis of patient hSSCs ONLY WHEN APPLIED TOGETHER, n = 14 from independent duplicates of seven
    patients. Doses: SAG21k 0.05 mM in alginate gel or 30 ng/mL in Matrigel; DMH1 4 micromolar in gel or 2
    micrograms per mL'
  unit: gene expression and alizarin-red osteogenic assay, human patient-derived cells
  conditions: >-
    prospectively isolated human skeletal stem cells; in vivo arms are subcutaneous ossicle transplants and
    femoral fracture callus in NSG mice
  species: human
  source_ref: ambrosi2025
  uncertainty: >-
    EVERY ENDPOINT IS OSTEOGENESIS, MINERALISATION OR FRACTURE HEALING. There is no growth plate length
    measurement anywhere in the paper, and in the resting zone driving osteogenesis is the failure mode this
    programme is required to avoid
- parameter: >-
    a human marker pair for the chondrogenic skeletal stem cell subtype, localised to the zones this
    programme is about
  value: 'SKIL+PDPN+ chondrogenic hSSC subtype localises primarily to the RESTING AND PROLIFERATIVE ZONES of
    the growth plate; HIC1+PDPN+ stromal subtype along the periosteum'
  unit: in situ hybridisation with co-staining, two donors, three sections per site
  conditions: human skeletal specimens across ten sites
  species: human
  source_ref: ambrosi2025
  uncertainty: >-
    two donors and three sections per site; and these are hSSC subtypes defined by eight-marker FACS, not
    the GP1/GP2 clusters of chu2026, so the relationship between SKIL+PDPN+ cells and the PTHrP-negative
    root cell is unmapped
localization:
- 'mouse embryonic metatarsal: where mTORC1 activation produces its 52 per cent growth advantage, ex vivo
  only'
- 'human growth plate resting and proliferative zones: where the SKIL+PDPN+ chondrogenic hSSC subtype sits'
human_evidence: direct
human_evidence_note: >-
  The ambrosi2025 arm is human cells across ten skeletal sites with human in situ localisation, though every
  functional endpoint in it is osteogenic. The mTORC1 arm is entirely mouse.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: >-
  The extrinsic-block conclusion rests on an embryonic mouse metatarsal explant compared with an in vivo
  mouse, and metatarsals have no secondary ossification centre, so the preparation lacks the niche this
  programme depends on. The human arm has no length endpoint at all.
confidence: C
confidence_reason: >-
  The 52-per-cent ex vivo result is a clean, well-powered comparison (n = 18, p = 0.0016) with matched
  starting lengths, and the in vivo null is from the same laboratory in the same paper, which is what makes
  the contrast strong. It is held at C rather than B because the in vivo arms have n = 2 to 3, because
  metatarsals are an embryonic preparation, and because the convergence with round 201 and with arm3 is a
  convergence of interpretations rather than of measurements.
