contradicts:
- 'CLOSES the standing claim in yield_is_amplification_not_cell_size and the_first_yield_under_a_drug that
  NOTHING RAISES THE YIELD ABOVE BASELINE. Something does - transient restriction followed by refeeding,
  with the denominator measured and unchanged. What remains unclosed is whether a raised yield converts
  into final length, and on that oichi2023 is a null: the deficit was restored, not exceeded.'
- 'LIMITS the round-171 finding that accelerators rescue a duration lever. That holds for the oestrogen
  axis, where the clock and the velocity terms are separate. It fails on the yield axis, where charging and
  driving are the same switch pointed in opposite directions.'
