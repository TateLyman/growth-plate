id: the_charge_discharge_switch
name: THE FIRST YIELD-RAISING INTERVENTION, AND THE SWITCH IT RUNS ON - IGF-1/Akt in the resting zone
  charges and discharges the progenitor pool, which means the stack's accelerator IS the discharge signal
aliases:
- first yield increase
- charge discharge cycle
- IGF-1 Akt resting zone switch
- does dietary restriction raise yield
- cycling the pool evidence
- should GH be intermittent
- round 178
type: hypothesis
layer: L2
stub: false
summary: 'THE SCREEN WAS RETARGETED FROM AGENTS TO DENOMINATORS - FIND STUDIES THAT COUNT RESTING-ZONE
  CELLS. THAT SEARCH RETURNED AN INTERVENTION THAT RAISES THE YIELD, WITH BOTH TERMS LINEAGE-TRACED IN THE
  SAME ANIMALS, AND IT IDENTIFIES THE MOLECULAR SWITCH.

  THE MEASUREMENT. oichi2023 fate-mapped Axin2-positive chondroprogenitors in the mouse proximal tibia
  through seven days of dietary restriction and then refeeding. The increase in labelled COLUMNS relative
  to the count at the end of restriction was significantly greater in the refed group at P41 (adjusted P =
  0.0043) and P48 (adjusted P < 0.0001), and the absolute column number was higher at P48 (adjusted P =
  0.0461) - WHILE THE NUMBER OF LABELLED CELLS IN THE TOP 50 MICROMETRES DID NOT DIFFER BETWEEN GROUPS AT
  ANY TIMEPOINT (adjusted P = 0.1865 at P36, P > 0.9999 at P41 and P48). NUMERATOR UP, DENOMINATOR FLAT,
  BOTH COUNTED IN THE SAME LINEAGE-TRACED ANIMALS. That is a stronger construction than either yield this
  atlas has computed - nilsson2014 and lui2018 are both ratios of separately measured standing stocks.

  WHAT THE RESTRICTION PHASE DID. It INCREASED resting-zone progenitors and SIMULTANEOUSLY INHIBITED their
  differentiation, raising the resting-zone-to-total-plate length ratio without changing any other zone
  ratio. Growth rate fell (P < 0.0001 males, P = 0.0039 females). On refeeding the accumulated progenitors
  immediately restarted differentiation, growth rate rose above control (P = 0.0095 and P = 0.0166) and
  stayed above it to at least P48.

  THE SWITCH, NAMED AND DRUGGABLE IN PRINCIPLE. Restriction lowered circulating IGF-1, growth-plate Igf-1
  AND resting-zone phospho-Akt; refeeding restored all three. Recombinant human IGF-1 reversed the p-Akt
  fall. The IGF1R inhibitor picropodophyllin lowered p-Akt-positive cells in the top 50 micrometres (P =
  0.0435). And Igf-1 transcript is HIGHER in the resting zone than the proliferative zone (P = 0.0041), so
  there is a local source as well as an endocrine one. LOW IGF-1/Akt CHARGES THE POOL AND BLOCKS
  DIFFERENTIATION. HIGH IGF-1/Akt DISCHARGES IT INTO COLUMNS. The authors state the discharge half
  directly - exogenous IGF-1 "stimulated differentiation of the pooled chondroprogenitors, DECREASING
  THEIR NUMBERS".

  THIS IS THE THIRD INDEPENDENT LINE ON THE STACK''S OWN GH ARM AND THEY DO NOT SHARE A METHOD. chu2025 -
  growth hormone shifts stem-cell divisions toward the committed side and depletes the label-retaining
  pool, cell-autonomously through GHR. dauber2026 - growth hormone and the CNP axis give almost identical
  first-year height SDS in the same three genetic conditions and then diverge, growth hormone slowing in
  subsequent years while the CNP axis sustains. oichi2023 - IGF-1 through Akt is the signal that spends
  the progenitor pool. THREE PAPERS, THREE METHODS, ONE CONCLUSION: THE GH/IGF-1 ARM IS THE DISCHARGE
  SIGNAL.

  AND HERE IS THE CONSTRAINT THAT MAKES THIS HARD, STATED BEFORE THE OBVIOUS PROPOSAL. Charging requires
  IGF-1/Akt to be LOW. Driving velocity requires it to be HIGH. THEY ARE THE SAME SWITCH, so a pool cannot
  be charged and spent at the same time. The round-171 insight - that a stack with accelerators rescues a
  duration lever whose monotherapy failed on velocity - DOES NOT TRANSFER HERE. You cannot hold velocity up
  during the charge phase, because velocity is driven by the very signal that discharges the pool. Any
  yield strategy built on this switch is FORCED TO ALTERNATE.

  THE HONEST LIMIT, AND IT IS DECISIVE. THE CYCLE RESTORED THE LENGTH DEFICIT AND DID NOT EXCEED CONTROL.
  Tibial deficit at the end of restriction fell to 0.02 mm in males and 0.10 mm in females by P62, both
  non-significant. THE YIELD ROSE AND THE TOTAL LENGTH DID NOT, because the charge phase cost growth.
  gafni2001 sits in exactly the same place from a different agent: three weeks of senescence delay, 14 per
  cent of plates fused against 88 per cent in controls, deficit 17.4 mm falling to 1.6 mm - and the study
  stopped with growth still running in the treated arm.

  SO THE STATE OF THE YIELD ARM IS PRECISE NOW. Something raises the yield. Nothing has yet been shown to
  convert a raised yield into more final length, in any species, because the two experiments that got
  closest both stopped at the point where the answer would have appeared. THE QUESTION IS NO LONGER
  WHETHER YIELD CAN BE RAISED. IT IS WHETHER A CHARGE PHASE CAN BE PAID FOR.

  A SECOND MAINTENANCE SIGNAL, WITH ITS DIRECTION STATED SO NOBODY REACHES FOR THE WRONG DRUG. hallett2021
  shows resting chondrocytes are held in a Wnt-INHIBITORY environment and that ACTIVATING Wnt in PTHrP+
  resting cells IMPAIRS column formation. So Wnt inhibition keeps cells resting - pool conservation at the
  cost of flux, the same failure mode as the Tsc1 result in newton2019. It is not an amplification lever.
  It also sits in unresolved tension with oichi2023, whose progenitors are marked by Axin2, a Wnt TARGET
  gene. Recorded as a conflict rather than smoothed over.'
