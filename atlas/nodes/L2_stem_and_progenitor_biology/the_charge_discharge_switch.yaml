human_evidence: absent
human_evidence_note: 'Mouse, one laboratory, one nutritional model. No human counterpart exists - and the
  human plate runs on a proliferative cycle roughly ten times slower (the_human_anchor_for_yield), so the
  timing of any charge and discharge phase does not transfer even if the mechanism does.'
species_basis:
- mouse
translation_risk: high
translation_risk_reason: 'Mouse nutritional model, and the intervention is starvation. The mechanism -
  IGF-1/Akt gating progenitor differentiation - is more likely to transfer than the protocol, but the human
  cycle time is tenfold slower and the charge and discharge intervals would have to be rescaled with no
  data to rescale them against.'
confidence: C
claim_grades:
- claim: An intervention has been shown to raise output per resting-zone progenitor.
  grade: C
  basis: 'YES, AND IT IS THE FIRST. oichi2023 measured labelled columns and labelled progenitors in the
    same lineage-traced animals: columns up (adjusted P = 0.0043 at P41, P < 0.0001 at P48) with
    progenitors in the top 50 micrometres unchanged (P > 0.9999). A stronger construction than either yield
    this atlas computed, both of which divide separately measured standing stocks. C not B because it is
    one experiment, one laboratory, one species, and "columns" is a coarser numerator than cells produced.'
- claim: IGF-1 acting through Akt in the resting zone is the switch between accumulating progenitors and
    spending them.
  grade: C
  basis: 'Four converging observations in one paper: restriction lowered circulating IGF-1, plate Igf-1 and
    resting-zone p-Akt together; refeeding restored all three; rhIGF-1 reversed the p-Akt fall; and an
    IGF1R inhibitor lowered p-Akt in the top 50 micrometres (P = 0.0435). The authors state that exogenous
    IGF-1 decreased progenitor numbers by driving their differentiation. C because it is a single paper and
    the causal chain is assembled from pharmacology plus correlation rather than from a conditional
    knockout of the receptor in the labelled cells.'
- claim: The growth hormone arm of this stack is the discharge signal for the progenitor pool.
  grade: C
  basis: 'THREE INDEPENDENT LINES, NO SHARED METHOD. chu2025 - GH drives committed division and depletes
    the label-retaining pool, cell-autonomously via GHR. dauber2026 - GH and the CNP axis give near
    identical first-year SDS in the same conditions and then diverge, GH slowing. oichi2023 - IGF-1 through
    Akt spends the progenitor pool. C rather than B because all three are indirect for the specific claim
    about a human on therapeutic-dose GH, and chu2025 used roughly a hundredfold therapeutic dose.'
- claim: A stack with accelerators can charge the pool while maintaining velocity.
  grade: X
  basis: 'NO, AND THIS IS THE HARD CONSTRAINT. Charging requires IGF-1/Akt LOW; driving velocity requires it
    HIGH. They are the same switch. The round-171 insight - that accelerators rescue a duration lever whose
    monotherapy failed on velocity - does not transfer to the yield arm, because here the accelerator IS
    the thing that discharges. Any strategy built on this switch is forced to alternate rather than
    combine.'
- claim: Raising the yield produces more final length.
  grade: E
  basis: 'UNDEMONSTRATED, AND THE TWO EXPERIMENTS THAT CAME CLOSEST BOTH STOPPED TOO EARLY. oichi2023
    restored the tibial deficit to 0.02 mm and 0.10 mm, non-significant, without exceeding control -
    because the charge phase cost growth. gafni2001 bought three weeks of senescence delay and left 14 per
    cent of plates fused against 88 per cent, with the deficit down from 17.4 mm to 1.6 mm AND GROWTH STILL
    RUNNING in the treated arm when the study ended. The question is no longer whether yield can be raised.
    It is whether a charge phase can be paid for.'
- claim: Wnt inhibition is an amplification lever.
  grade: X
  basis: 'NO - IT IS A POOL-CONSERVATION LEVER AND THE DIRECTION IS THE OPPOSITE OF INTUITIVE. hallett2021
    shows resting chondrocytes sit in a Wnt-INHIBITORY environment and that ACTIVATING Wnt in PTHrP+
    resting cells IMPAIRS column formation, so inhibition keeps cells resting - conserving the pool at the
    cost of flux, exactly the Tsc1 failure mode. It also conflicts unresolved with oichi2023, whose
    progenitors are marked by Axin2, a Wnt target gene.'
