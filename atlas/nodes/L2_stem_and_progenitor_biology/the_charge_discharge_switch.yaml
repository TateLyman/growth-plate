  type: primary
  role: the resting-zone maintenance signal - Wnt inhibition keeps cells resting, which conserves the pool
    without adding flux
- ref_id: newton2019
  year: 2019
  type: primary
  role: the Tsc1 precedent for pool expansion without flux, which is the failure mode any conservation
    lever must be tested against
