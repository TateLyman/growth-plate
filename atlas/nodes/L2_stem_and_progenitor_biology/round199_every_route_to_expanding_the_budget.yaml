id: round199_every_route_to_expanding_the_budget
name: ROUND 199 - EVERY ROUTE TO EXPANDING THE BUDGET, ENUMERATED - the budget is not a mammalian
  constant, a deer runs the same tissue 365 times faster on a renewable pool, and the delivery technology
  the atlas said did not exist was published this year
type: hypothesis
layer: L2
aliases:
- budget expansion routes
- the antler benchmark
- targeted delivery exists now
- round 199
stub: false
summary: 'ROUND 198 CHANGED THE OBJECTIVE FUNCTION AND NOTHING HAS BEEN RE-ENUMERATED AGAINST IT. Adult
  height is RESERVE times terminal cell height; fusion is triggered by exhaustion of proliferative
  potential; every agent that raises rate spends reserve faster. The atlas coverage audit had already
  reached the uncomfortable version - two men with zero lifetime oestrogen signal reached 197 and 204 cm
  and ONE OF THEM STOPPED GROWING AT TWENTY-FOUR WITH PLATES STILL ANATOMICALLY OPEN. Growth stopped
  while the door was open. The budget is binding, not the closure. The eight-route enumeration of round
  179 was built for a different objective - yield per progenitor consumed - and every one of its routes
  REDISTRIBUTES a fixed budget. This node enumerates the routes that would EXPAND it.

  FIRST, THE EXISTENCE PROOF, BECAUSE WITHOUT ONE THIS IS ALL THEORY. ba2025 mapped the deer antler
  growth centre by single-nucleus RNA-seq, ATAC and spatial transcriptomics and states the comparison in
  its own abstract: antler, growing by ENDOCHONDRAL OSSIFICATION, elongates UP TO TWO CENTIMETRES PER
  DAY, "far surpassing the ~2 cm annual growth of human growth plates". THREE HUNDRED AND SIXTY-FIVE
  TIMES, in a mammal, in the same tissue type. Over a season that is roughly two hundred and forty
  centimetres of new bone, five human femurs grown from nothing, annually. THE BUDGET IS NOT A MAMMALIAN
  CONSTANT.

  AND WHAT ba2025 ATTRIBUTES IT TO IS ALMOST ENTIRELY THE TERM THIS ATLAS HAS WORKED LEAST. Its own list:
  a VAST stem-progenitor pool; vigorous proliferation on paracrine support; a transcriptional programme
  with intrinsically LOW TUMORIGENIC potential tied to apoptotic regulation; a RICHLY VASCULARISED niche
  that recruits osteogenic cells; and hybrid ossification combining endochondral with direct
  hypertrophic-to-osteoblast transdifferentiation through PHEX-positive intermediates. Read against
  growth rate equals pool times amplification times terminal cell height: two of those are POOL terms,
  one is rate within the pool, one acts after the cell has already delivered its length, and NOT ONE IS
  AN AMPLIFICATION CLAIM. The atlas has spent most of its effort on amplification.

  THE POINT THE PAPER DOES NOT MAKE IS THE USEFUL ONE. An antler is cast and regrown every year from the
  pedicle periosteum. Its budget is not bigger than a human''s - IT IS RENEWABLE, refilled annually from
  a stem reservoir OUTSIDE the growth centre, with RXFP2-positive mesenchymal cells in the antlerogenic
  periosteum identified as the source. THAT IS ROUTE 8 OF THE ATLAS''S OWN ENUMERATION, external
  recruitment, which round 179 listed as never costed. The largest natural experiment in endochondral
  growth runs on the one route nobody here has worked.

  AND THE SAME TRANSCRIPTION FACTOR GUARDS THE RESERVE IN BOTH TISSUES. hu2025 shows PRRX1 drives
  miR-143-3p in antler RESERVE mesenchymal cells and that PRRX1 overexpression DECREASES their
  proliferation while holding them undifferentiated, with miR-143-3p-loaded extracellular vesicles
  suppressing chondrogenic differentiation through TGF-beta1, BMP2 and IGF1R. chu2026 marks the human and
  mouse growth plate ROOT stem cell - upstream of the PTHrP-positive population - with PRRX1. A conserved
  quiescence switch, with a known direction, in the one system where the reserve is demonstrably not
  limiting.

  SECOND, AND THIS IS THE MOST ACTIONABLE ITEM IN THE ROUND: THE DELIVERY TECHNOLOGY THE ATLAS SAID DID
  NOT EXIST WAS PUBLISHED THIS YEAR. Round 178 found the charge/discharge constraint - IGF-1 through Akt
  in the resting zone must be LOW to charge the pool and HIGH to drive velocity - and round 179 named
  zone selectivity as the only escape, concluding "nothing achieves that today". ye2026 built CT-CM-NPs:
  nanoparticles coated in primary chondrocyte membrane and modified with the collagen-II-binding peptide
  WYRGRL, explicitly to defeat the fact that growth plate cartilage is AVASCULAR AND ALYMPHATIC and
  therefore unreachable by systemic drug. In vivo they delivered the Hedgehog agonist purmorphamine into
  growth plate cartilage in a hypochondroplasia mouse and INCREASED BONE AND BODY LENGTH. That is
  cartilage-selective, pharmacological - therefore transient and dose-controllable - delivery of a POOL
  agonist. It converts round 179''s open question about the Hedgehog lever''s time-dependent sign from
  untestable to testable, and it is the missing enabling technology for every zone-selective idea in
  this file.

  THIRD, TWO METABOLIC FLOORS UNDER THE POOL, BOTH WITH AVAILABLE COMPOUNDS AND NEITHER TESTED FOR GAIN.
  warren2023 deleted Nampt from Prx1-positive limb mesenchyme and got dramatic limb shortening through
  DEATH of growth plate chondrocytes; nicotinamide riboside given in pregnancy prevented most of it, and
  post-natal NAD depletion also killed chondrocytes and halted endochondral ossification while osteoblast
  formation continued. shtaif2026 deleted Sirt1 from HYPERTROPHIC chondrocytes with a ColX-Cre driver and
  got bones 10 to 11 per cent shorter in males and 5 to 7 per cent shorter in females with reduced growth
  plate height in both - and male knockouts then OVERSHOT normally fed knockouts on refeeding. Both are
  loss-of-function, so by the inverted-U discipline established in round 197 neither licenses the
  assumption that more helps. But both sit on the pool and both have compounds - NAD precursors, and
  SIRT1 activators including the resveratrol already held in this file.

  FOURTH, THE COUNTER, WHERE THE ATLAS HAS THE DIRECTION AND HAS NEVER ENUMERATED THE AGENTS. The growth
  plate ages by LOSING maintenance methylation in the slow-replicating resting zone; removing DNMT1
  reproduces the arrested phenotype; and the atlas has already flagged that alpha-ketoglutarate and
  high-dose vitamin C - two of the commonest longevity supplements - supply the demethylation machinery
  and therefore push the plate TOWARD its senescent state. What has never been listed is the opposite
  side of the same one-carbon ledger: S-adenosylmethionine, betaine, choline, methionine and folate as
  methyl donors, and UHRF1 as the cofactor that targets DNMT1 to the replication fork. Nothing in this
  atlas tests any of them on a growth plate. This is the cheapest untried axis in the file and it points
  in the direction the atlas itself established.

  FIFTH, THE VASCULAR INVERSION, WHICH IS EITHER THE LEVER OR THE TRIGGER. The antler growth centre is
  richly vascular; the human plate is avascular and its resting zone is the most hypoxic compartment in
  it. One reading is that the human reserve is starved and vascularity is part of what the antler buys.
  Against it: hypoxia is what keeps resting-zone cells quiescent and stem-like, and vascular invasion of
  a growth plate IS fusion. Nothing in this atlas distinguishes the two, and they predict opposite signs.

  SIXTH, AN ENUMERABLE HOLE. Cellular senescence in the p16 and SASP sense - as opposed to the
  Baron-Nilsson programmed-senescence gene programme, which is a different thing that this atlas has
  conflated with it under one word - is a large, heavily drugged field. A ten-query sweep of it returns
  osteoarthritis and articular cartilage almost exclusively. NOBODY HAS ASKED WHETHER GROWTH PLATE
  RESTING-ZONE CHONDROCYTES ACCUMULATE p16-POSITIVE SENESCENT CELLS WITH AGE, OR WHETHER CLEARING THEM
  RESTORES OUTPUT. Senolytics are the one class of drug whose entire purpose is to remove cells that have
  stopped dividing from a tissue that needs divisions.

  SEVENTH, THE SPECIES RATE CONSTANT, FLAGGED IN ROUND 88 AND NEVER PURSUED. delaney2014 finds the same
  age-downregulated gene programme in juvenile sheep kidney and lung as in mouse and rat, playing out
  over YEARS rather than weeks, and offers that as the reason large mammals get large. If the programme
  is conserved and only its rate constant differs, the rate constant is the target, and no one has asked
  what sets it.'
