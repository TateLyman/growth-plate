translation_risk: high
translation_risk_reason: 'A deer antler is a seasonal, androgen-driven, castable appendage regrown from a
  dedicated periosteal organ. Nothing licenses transferring its rate to a human limb. Its value here is
  as an existence proof that the budget is not fixed and as a pointer to WHICH TERM carries the
  difference, not as a therapeutic model. The nanoparticle result is one paper in a disease model.'
confidence: C
claim_grades:
- claim: the endochondral growth budget is not a mammalian constant
  grade: B
  basis: a 365-fold rate difference in the same tissue type within Mammalia, mapped by three orthogonal
    genomic methods, with the comparison stated by the authors themselves
- claim: the antler advantage is carried by pool terms rather than by amplification
  grade: D
  basis: reading the authors' own attribution list against this atlas's decomposition; no flux
    measurement was made in the antler and no amplification term was computed
- claim: the antler budget is renewable rather than larger, refilled from periosteum outside the growth
    centre
  grade: E
  basis: inference from antler biology and a companion report of RXFP2-positive antlerogenic periosteal
    stem cells; ba2025 does not make this claim
- claim: cartilage-selective pharmacological delivery into the avascular growth plate now exists
  grade: C
  basis: one in vivo study with a bone and body length endpoint in a disease model, using a
    chondrocyte-membrane-coated collagen-II-targeted nanoparticle
- claim: NAD salvage and SIRT1 are required for normal growth plate output
  grade: C
  basis: two independent conditional knockouts with length endpoints, one with a precursor rescue
- claim: no study has examined p16-positive cellular senescence or senolytic clearance in the growth
    plate
  grade: A
  basis: enumeration over two dedicated queries returning 120 records, all articular or osteoarthritic
