  now reachable by a collagen-II-targeted nanoparticle'
human_evidence: absent
human_evidence_note: 'This round is a comparative and enumerative round in deer, mouse and rat. The human
  anchor it is written against is the atlas''s own - the two oestrogen-signal-null men at 197 and 204 cm,
  one of whom stopped growing at twenty-four with plates still anatomically open, which is what makes the
  budget rather than the closure the binding constraint.'
