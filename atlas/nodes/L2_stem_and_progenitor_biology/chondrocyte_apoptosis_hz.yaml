id: chondrocyte_apoptosis_hz
name: Hypertrophic zone chondrocyte apoptosis
type: process
summary: 'Apoptosis of terminal hypertrophic chondrocytes is the textbook mechanism by which cartilage
  is vacated for vascular invasion and bone deposition, and it remains a real fate. What has changed is
  its exclusivity: since inducible lineage tracing showed that a large fraction of hypertrophic chondrocytes
  survive and become osteoblasts, apoptosis can no longer be treated as the default fate of all hypertrophic
  cells. The two fates now have to be partitioned, and that partition has not been measured directly in
  any species - the surviving fraction is inferred from downstream osteoblast labelling (about 60% of
  young mouse trabecular osteoblasts) rather than counted at the junction. This is a genuine quantitative
  hole rather than a settled number, and it is flagged as gap g_l2stem_002 in its human form. For this
  layer the relevant consequence is that hypertrophic chondrocyte death is not a mechanism of stem cell
  loss: the resting zone is upstream and is depleted by differentiation, not by apoptosis at the far end
  of the plate.'
quantitative: []
localization:
- 'mouse terminal hypertrophic zone and zone of provisional calcification: classical site'
- 'human hypertrophic zone: histologically described; fate partition unmeasured'
human_evidence: absent
human_evidence_note: No human data partition hypertrophic chondrocyte fate between apoptosis and survival.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: The competing fate (survival/transdifferentiation) is measurable only by genetic
  tracing, so the human balance between death and survival is unknown.
