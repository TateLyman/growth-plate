id: label_retaining_chondrocyte
name: Label-retaining resting chondrocyte (LRC)
aliases:
- slow-cycling growth plate chondrocyte
- H2B-GFP label-retaining chondrocyte
type: cell_type
summary: 'Label retention is the assay that turns ''resting'' from a histological adjective into a measured
  cell-cycle property. A chondrocyte-specific Tet-Off H2B-EGFP system (Col2a1-tTA) combined with Col2a1-creER
  lineage marking allows slow-cycling cells to be identified by retained histone-bound GFP: signal halves
  with each division (measured fold change 2.03 per division), so cells at the top decile of brightness
  after a doxycycline chase are the least divided. The label-retaining fraction of Col2a1-lineage chondrocytes
  decays with a half-life of roughly one week (0.99-1.18 weeks) from 86.5% to a plateau of 2.6%, meaning
  that the durably slow-cycling compartment of the mouse growth plate is a few percent of chondrocytes.
  Transcriptomically, these LRCs are enriched for both secreted Wnt inhibitors and Wnt activators, and
  activating beta-catenin in them drives them out of the resting zone - the clearest positive definition
  of a niche signal for this compartment. Growth hormone reduces this label-retaining pool by pushing
  the cells into transit-amplifying differentiation, which links a therapeutic hormone directly to stem
  cell consumption. A 2026 PRISMA systematic review found that despite decades of the word ''quiescent'',
  functional and molecular assays of quiescence in this compartment are sparse and inconsistently defined.'
