  conditions: P21 mouse, before doxycycline chase, flow cytometry
  species: mouse
  source_ref: hallett2021
  uncertainty: SE 1.3
- parameter: Label-retaining fraction, plateau after chase
  value: '2.6'
  unit: '%'
  conditions: doxycycline chase from P21, mouse distal femur
  species: mouse
  source_ref: hallett2021
  uncertainty: SE 0.9
- parameter: Decay half-life of the label-retaining population
  value: 0.99-1.18
  unit: weeks
  conditions: non-linear decay fit, mouse
  species: mouse
  source_ref: hallett2021
  uncertainty: range of fitted values
- parameter: Growth plate chondrocytes as fraction of dissociated Col2a1-creER lineage cells
  value: '99.1'
  unit: '%'
  conditions: microdissected epiphysis after collagenase, P49 mouse
  species: mouse
  source_ref: hallett2021
  uncertainty: SD 1.4, n=4 mice
localization:
- 'mouse RZ: confirmed, brightest H2B-EGFP cells localise to the top of the growth plate (hallett2021_2)'
- 'human RZ: indirect - a subset of human resting chondrocytes shows nuclear-retained mRNA and heterochromatin
  consistent with G0 (avijgan2025)'
human_evidence: indirect
human_evidence_note: Human resting chondrocytes show quiescence-associated features (predominantly nuclear
  mRNA, abundant heterochromatin, ability to exit G0 ex vivo) in spatial transcriptomic biopsies, but
  label retention itself requires transgenic pulse-chase and has never been done in humans.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: The quantitative kinetics come from a transgenic Tet-Off system with no human
  counterpart; human evidence is descriptive and cross-sectional.
confidence: C
