id: delayed_senescence_hypothesis
name: Delayed-senescence explanation of catch-up growth
type: hypothesis
summary: 'The hypothesis: growth-inhibiting conditions suppress resting-zone chondrocyte proliferation,
  which conserves the plate''s limited proliferative capacity; when the condition resolves the plate is
  less senescent than expected for chronological age and therefore grows faster than age-matched controls.
  Three separate perturbations support it. Local intra-plate glucocorticoid in rabbit produces catch-up
  confined to the treated plate, excluding a systemic explanation for that experiment. Systemic dexamethasone
  in rabbits is followed by catch-up growth with structurally and functionally less senescent plates.
  Propylthiouracil-induced hypothyroidism in newborn rats delays the normal progression of plate senescence
  and is followed by catch-up. Mechanistically it is supported by the observation that glucocorticoid
  slows resting-zone chondrocyte proliferation and slows their numerical depletion. Limits: it does not
  explain catch-up that is not preceded by proliferation suppression, and it cannot be complete, since
  local catch-up is measurable but so is a systemic component in some clinical settings.'
quantitative: []
localization:
- 'rabbit growth plate: measured (baron1994, gafni2001, schrier2006)'
- 'rat growth plate: measured (marino2008)'
human_evidence: indirect
human_evidence_note: Human catch-up growth after treatment of hypothyroidism, glucocorticoid excess or
  coeliac disease is consistent with the model, but no human growth plate has been examined for delayed
  senescence.
species_basis:
- rabbit
- rat
translation_risk: moderate
translation_risk_reason: Replicated across two species with two different growth-inhibiting mechanisms
  and matching human clinical phenomenology, but the histological readout has never been obtained in humans.
confidence: B
