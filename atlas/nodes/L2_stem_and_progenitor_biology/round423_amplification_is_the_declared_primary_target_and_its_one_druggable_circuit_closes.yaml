id: round423_amplification_is_the_declared_primary_target_and_its_one_druggable_circuit_closes
name: >-
  R423: amplification is the atlas's own declared primary target, 88 percent of the yield, and R174/R175/
  R177 never reached CLAUDE.md. The one named druggable circuit that could deliver R175's drug spec is the
  SIK3-HDAC4 arm - and run through Step 0 properly it CLOSES on six independent grounds, the strongest of
  which is that its own literature states its purpose is to MIMIC PTH, and PTH1R agonism already returned
  0.0 percent terminal femoral length in every arm
aliases:
  - amplification primary target
  - transit time drug spec
  - SIK inhibition closed
  - SK-124 YKL-05-099
  - yield screen re-opened
type: hypothesis
layer: L2
stub: false
summary: >-
  An external audit named this as its item 3: the atlas's declared primary objective has never had a
  compound sweep and is invisible to the ledger. Verified and acted on.

  ⛔ ONE - THE LEDGER FAILURE, MEASURED. Grep across atlas/nodes versus CLAUDE.md: `amplification` 294
  files versus 11 occurrences all downstream of R360; `cells per column` 110 files versus ZERO;
  `hypertrophic commitment` 14 versus ZERO; `transit time` 17 versus ZERO; `residence time` 11 versus
  ZERO. R174, R175 and R177 never entered CLAUDE.md. That is CORR-313/CORR-352 operating on the term the
  atlas itself calls its primary target, and it is the third instance in five rounds after the androgen
  axis (R419) and the androgen_receptor closure (R420).

  ⭐ TWO - WHAT THE THREE LOST ROUNDS ACTUALLY SAY.
  · R174 - YIELD = AMPLIFICATION x TERMINAL CELL HEIGHT, and the split is not close. Mouse femur versus
    metacarpal - a bone that does not fuse against one that fuses at 2-3 weeks - yield ratio 10.4x with a
    terminal cell height ratio of only 1.32x (bootstrap 1.15-1.55), leaving an amplification ratio of
    7.9x. EIGHTY-EIGHT PER CENT OF THE LOG GAP IS AMPLIFICATION, TWELVE PER CENT IS CELL SIZE; tibia
    versus metacarpal gives 93 and 7. Rat replicates the cell-height half across five ages (1.45, 1.46,
    1.75, 1.47, 1.69), so terminal cell height is conserved to about twofold between bones whose fusion
    times differ by an order of magnitude, in two species. At fusion BOTH terms fail but amplification
    fails first and harder - metacarpal cell production collapses 6.58 to 3.35 to 1.02 cells per column
    per day while terminal cell height holds at 23.1 then 24.5 and only drops at three weeks.
  · R175 - AMPLIFICATION IS RESIDENCE TIME IN THE PROLIFERATIVE COMPARTMENT BEFORE HYPERTROPHIC
    COMMITMENT. It falls because cells LEAVE SOONER, not because they divide slower - newton2019 states
    that the change in clone size with age did not reflect changes in proliferation or growth rate, and
    that flat cells move to the hypertrophic layer more rapidly in older mice. Clone size is niche-set and
    causally movable: 7.8 +/- 0.3 cells centrally versus 5.7 +/- 0.1 laterally by proximity to the
    secondary ossification centre (P=0.0012), and delaying SOC maturation with axitinib REDUCED it
    (P=0.0023).
    ⭐ THE DRUG SPEC THAT FOLLOWS IS NOT WHAT ANY AGENT IN THIS STACK DOES: DELAY HYPERTROPHIC COMMITMENT
    WITHOUT SLOWING PROLIFERATION. Those two are routinely conflated and they are OPPOSITE in their effect
    on the pool - faster proliferation spends it, longer residence spends less of it per cell delivered.
  · R177 - the compound screen was opened and STRUCTURALLY BLOCKED. A yield needs a denominator in
    RESTING-ZONE CELLS, and almost the entire field reports the resting zone as a HEIGHT IN MICROMETRES.
    Only three datasets count a resting-zone cell and they are the three the atlas already uses. The screen
    returned a methods finding instead of an agent and was never re-opened.

  ⛔⛔ THREE - AND THE ONE NAMED DRUGGABLE CIRCUIT FOR THAT SPEC CLOSES. The hypertrophic-commitment switch
  is PTH1R to Gs to PKA to SIK3, which anchors HDAC4 in the cytoplasm and releases MEF2C. SIK inhibition
  genuinely DOES isolate the SIK3/HDAC4 arm from the CREB arm, which is the separation CLAUDE.md says
  decides everything - the audit was right about that. It is also irrelevant, on six independent grounds:
  · ① WRONG DIRECTION, MEASURED. Sik3-null mice are normal-sized as embryos and BECOME DWARFED WITH AGE,
    with hypertrophy markedly delayed, growth plates and articular cartilage EXPANDED, and chondrocytes
    accumulating in sternum, ribs and spine (sasagawa2012). Expanded plate plus shorter animal is
    CORR-292's JAM and failure mode number one. That is R302's disqualifier ②.
  · ② STEP 0 SUBSTITUTION, AND IT IS AUTHOR-STATED RATHER THAN INFERRED. choi2026sk124 opens by saying
    that SIK2/SIK3 inhibitors are a strategy TO MIMIC PTH ACTIONS; momenzadeh2024 says SIK inhibitors
    MIMIC PTH ACTION. PTH1R agonism has already been tested to a TERMINAL LENGTH ENDPOINT and returned
    0.0 PERCENT FEMORAL LENGTH IN EVERY ARM AT 26 MONTHS (CORR-269). So this is not an untested node - it
    is a downstream substitution for an intervention already measured to zero at the endpoint that matters.
  · ③ THE ONE SIK INHIBITOR WITH IN VIVO SINGLE-CELL DATA MOVES THE POOL THE WRONG WAY. momenzadeh2024's
    RNA-seq shows YKL-05-099 increased osteoblast subsets and REDUCED CHONDROCYTE PRECURSORS.
  · ④ THE CASCADE IS DOUBLY REDUNDANT - SIK1 and SIK2 substitute when SIK3 is low, and HDAC5 substitutes
    when HDAC4 is low - so a partial inhibitor is compensated.
  · ⑤ NO HUMAN SIK3 SKELETAL PHENOTYPE EXISTS; human SIK3 variants are known for the short-sleep trait.
  · ⑥ THE FAR END OF THE BAND IS A HUMAN SHORT-STATURE DISEASE. Constitutive PTH1R activation, i.e.
    maximal cAMP and therefore maximal SIK3 inhibition, is JANSEN METAPHYSEAL CHONDRODYSPLASIA, which is
    short-limbed - and ablating Hdac4 rescued that growth plate (hppner2025), which is the causal proof
    that this node controls hypertrophy and simultaneously the proof that the band has an interior optimum.
  ⚠ NO SIK INHIBITOR HAS A BONE-LENGTH ENDPOINT IN ANY SPECIES. SK-124 and YKL-05-099 report bone MASS,
  turnover and callus rigidity, in orchiectomised and fractured animals respectively - both deficit models,
  CORR-203.
  ⚠ And the other end of the circuit is closed from its own side: wang2025hdac4 shows Prx1-Cre Hdac4
  deletion in limb mesenchyme gives LIMB SHORTENING AND PREMATURE GROWTH PLATE CLOSURE. Both HDAC4 loss and
  SIK3 loss shorten. The circuit is a band with no accessible interior.

  ⛔ FOUR - R177's SCREEN RE-RUN, AND IT RETURNS NOTHING NEW. Targeted queries for an agent acting on clone
  size, cells per column, or delayed hypertrophic differentiation with a length endpoint return: one
  irrelevant historical review, five papers reporting cells per column as a descriptive readout in null
  mice or spaceflight rats, and ZERO records for delayed hypertrophy paired with a longitudinal-growth
  endpoint. R177's blocker stands - the field measures the resting zone as a height, so the quotient
  cannot be formed - and the dexamethasone probe it identified remains uncomputable, because schrier2006
  has the resting-zone cell count but no growth rate and no terminal cell size while gafni2001 has the
  growth rate and terminal cell size but reports the zone as a height. They are different experiments.
  ⚠ Glucocorticoids are contraindicated in this stack twice over anyway - at GR and at the SMO
  cysteine-rich domain (lu2025cortisol) - so that probe is a mechanism question, never a candidate.

  ⭐ WHAT R423 SETTLES. The atlas's declared primary target is real, is 88 percent of the yield, has a
  precise drug spec that no agent in the stack satisfies, and now has its one named druggable circuit
  CLOSED on direction rather than on absence. The honest state of the term is that it has NO AGENT
  ANYWHERE, and the reason is structural in two layers: the field does not report the denominator, and the
  one circuit that sets the numerator is a band whose both ends shorten. That is worth writing plainly
  rather than leaving as an open frontier that later rounds keep rediscovering.
