localization: >-
  proliferative and prehypertrophic zones - the compartment whose residence time sets amplification. The
  PTH1R-Gs-PKA-SIK3-HDAC4-MEF2C circuit is present and hypertrophy-weighted in human tissue (R306)
human_evidence: indirect
human_evidence_note: >-
  The decomposition and the transit-time mechanism are mouse and rat. The human anchors on the circuit are
  Jansen metaphyseal chondrodysplasia at one end and the teriparatide terminal-length null at the other.
species_basis:
  - mouse
  - rat
translation_risk: high
translation_risk_reason: >-
  The decomposition rests on a cross-bone comparison in rodents, and no agent for the term exists in any
  species to translate.
confidence: B
claim_grades:
  - claim: Amplification is about 88 percent of the yield and terminal cell size about 12 percent
    grade: B
    basis: >-
      two independent bone pairs in mouse giving 88/12 and 93/7, with the cell-height half replicated
      across five ages in rat. A cross-bone comparison, not a perturbation
  - claim: Amplification is residence time before hypertrophic commitment, not division rate
    grade: B
    basis: >-
      clonal tracing with the authors stating the age change did not reflect proliferation or growth rate,
      plus a causal niche manipulation with axitinib
  - claim: R174, R175 and R177 never reached CLAUDE.md
    grade: A
    basis: grep counts - cells per column 110 files versus zero occurrences, and so on
  - claim: SIK inhibition isolates the SIK3/HDAC4 arm from the CREB arm
    grade: B
    basis: >-
      it acts downstream of PKA on the SIK3 node specifically. The separation is real - it is the
      consequences that close it
  - claim: SIK inhibition is a usable lever for amplification
    grade: E
    basis: >-
      NO, on six grounds - Sik3-null dwarfs with age with expanded plates, the published rationale is
      explicitly to mimic PTH and PTH1R agonism gave 0.0 percent terminal femoral length, YKL-05-099
      reduces chondrocyte precursors, the cascade is doubly redundant, there is no human skeletal
      phenotype, and the far end of the band is Jansen dwarfism
  - claim: Any agent anywhere raises amplification
    grade: X
    basis: >-
      NOT DEMONSTRATED FOR ANY AGENT IN ANY SPECIES. R174 recorded this at grade X and R423's re-run of
      R177's screen returns nothing new
