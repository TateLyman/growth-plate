localization:
- 'the proliferative column: amplification is the number of transit-amplifying divisions between a
  resting-zone cell leaving the pool and its progeny committing to hypertrophy'
- 'the hypertrophic zone: terminal cell height, the other factor - the one the CNP axis acts on, and the
  one that barely varies between bones'
human_evidence: absent
human_evidence_note: 'Entirely rodent. No human growth plate has ever had a yield, an amplification factor
  or a resting-zone consumption rate measured, and the human terminal hypertrophic cell height is known
  only from small autopsy and epiphysiodesis series. The between-bone design that makes this computable -
  comparing a fusing to a non-fusing bone in one animal - has no human equivalent because human bones all
  fuse.'
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: 'The whole construction rests on a mouse contrast between a bone that fuses and a
  bone that never does, and no human bone behaves like the mouse femur. What transfers is the
  DECOMPOSITION and the demonstration that the two factors are separable and unequal - not the numbers.'
confidence: C
claim_grades:
- claim: The yield is a product of amplification and terminal cell height, and these are separable.
  grade: B
  basis: 'It is an identity, not a finding - micrometres of bone per progenitor spent must equal cells
    produced per progenitor times micrometres per cell. What the data add is that the two factors are
    EMPIRICALLY separable, because lui2018 measures terminal cell height and bone elongation independently
    in the same animals at the same ages.'
- claim: Most of the between-bone yield difference is terminal cell size, so yield is h_term under another
    name.
  grade: X
  basis: 'NO, AND THIS IS THE POINT OF THE NODE. Terminal cell height differs between a fusing and a
    non-fusing bone by only 1.32x in mouse (bootstrap 1.15-1.55) against a 10.4x yield gap, leaving 88 per
    cent of the log gap to amplification. The rat series independently confirms the cell-height half at
    1.45-1.75x across five ages. The CNP axis acts on the factor that barely varies.'
- claim: Amplification - the number of hypertrophic cells obtained per resting-zone progenitor consumed -
    is the variable that distinguishes a plate with years left from one about to close.
  grade: C
  basis: 'Supported by the decomposition (7.9x amplification against 1.32x cell size) and by the mouse time
    course, where metacarpal production per column collapses 6.58 to 1.02 cells per day over 1-3 weeks
    while terminal cell height is still holding. C not B because every value is this atlas re-analysing
    another group''s summary data, the yields are upper bounds (net rather than gross resting-zone loss),
    and it is two rodent species with no human counterpart.'
- claim: Terminal hypertrophic cell height is broadly conserved between bones within a species.
  grade: B
  basis: 'Two species, independently. Mouse femur-to-metacarpal 1.32x over 2-3 weeks; rat 1.45, 1.46, 1.75,
    1.47 and 1.69 at 1, 2, 4, 8 and 12 weeks. Across bones whose fusion times differ by an order of
    magnitude, the terminal cell varies by well under twofold. Consistent with cooper2013 treating cell
    enlargement as a graded modulator of proportion rather than a switch.'
- claim: FGFR inhibition, already in the stack, is an amplification agent.
  grade: E
  basis: 'HYPOTHESIS ONLY, RAISED SO IT IS TESTED RATHER THAN ASSUMED. Amplification should read out as
    PROLIFERATIVE-zone output, and kot2026 reports infigratinib increasing femur length together with
    proliferative-zone growth plate height, which is that signature rather than the hypertrophic one. But
    raising proliferation is NOT the same as raising the number of divisions obtained PER PROGENITOR
    CONSUMED - an agent could do the first while spending the pool faster and leave the yield unchanged or
    worse. Nothing in kot2026 measures the resting-zone denominator. First question of the next round.'
- claim: Anything in the current stack targets amplification.
  grade: X
  basis: 'NOT DEMONSTRATED FOR ANY AGENT. Vosoritide acts on terminal cell size (the 1.3x factor).
    Anastrozole is an exchange-rate agent on bone age. Growth hormone drives committed division of the
    progenitors, which spends the denominator rather than raising the quotient (chu2025). FGFR inhibition
    is the only candidate and it is graded E above.'
