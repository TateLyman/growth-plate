id: yield_is_amplification_not_cell_size
name: THE YIELD DECOMPOSED - 88 per cent of it is AMPLIFICATION, not terminal cell size, so yield is a
  control point in its own right and nothing in this atlas touches it
aliases:
- yield decomposition
- amplification versus h_term
- is yield just h_term renamed
- divisions per progenitor
- cells produced per resting zone cell
- round 174
type: hypothesis
layer: L2
stub: false
summary: 'YIELD IS NOW THE PRIMARY OBJECTIVE OF THIS ATLAS, AND THE FIRST THING IT NEEDED WAS A TEST OF
  WHETHER IT IS A REAL CONTROL POINT OR AN EXISTING ONE UNDER A NEW NAME. IT IS REAL.

  THE TEST. A length-yield is a PRODUCT of two independent things:
  micrometres of bone per resting-zone cell = (hypertrophic cells produced per resting-zone cell spent) x
  (micrometres of bone per hypertrophic cell), or YIELD = AMPLIFICATION x TERMINAL CELL HEIGHT. The atlas
  already has an arm on the second factor - the CNP axis, which nakao2015 partitions onto the hypertrophic
  zone and which vosoritide drives. So IF the tenfold yield gap between a bone that fuses and one that
  does not were mostly terminal cell height, yield would be h_term wearing a different name and there
  would be no new lever. IT IS NOT.

  THE RESULT, IN MOUSE, OVER THE 2-3 WEEK INTERVAL ON WHICH THE YIELD WAS COMPUTED. Femur against
  metacarpal - the bone that never fuses against the bone that fuses at 2-3 weeks - yield ratio 10.4x
  (published interval 6.1-17.3), TERMINAL CELL HEIGHT RATIO ONLY 1.32x (bootstrap 1.15-1.55), leaving an
  AMPLIFICATION RATIO OF 7.9x. EIGHTY-EIGHT PER CENT OF THE LOG GAP IS AMPLIFICATION AND TWELVE PER CENT
  IS CELL SIZE. Tibia against metacarpal gives 93 per cent and 7 per cent. The direction does not depend
  on which non-fusing bone is used.

  AND THE RAT REPLICATES THE HALF THAT CAN BE REPLICATED. lui2018 carries an independent rat series.
  Femur-to-metacarpal terminal cell height there is 1.45, 1.46, 1.75, 1.47 and 1.69 across 1, 2, 4, 8 and
  12 weeks. TERMINAL HYPERTROPHIC CELL HEIGHT IS CONSERVED TO WITHIN ABOUT TWOFOLD BETWEEN BONES WHOSE
  FUSION TIMES DIFFER BY AN ORDER OF MAGNITUDE, IN TWO SPECIES. It is not the variable that distinguishes
  a plate with years left from one about to close.

  WHAT THE MOUSE TIME COURSE ADDS, AND IT SHARPENS THE TARGET. Cell production per column per day -
  calcein growth rate divided by terminal cell height, which needs no width convention - runs 10.80, 10.60
  and 8.33 in the femur at 1, 2 and 3 weeks while the metacarpal COLLAPSES 6.58, 3.35, 1.02 over the same
  weeks. Its resting zone falls 78.2 to 48.7 to 24.1 cells per 500 micrometres. Terminal cell height in
  the metacarpal holds at 23.1 and 24.5 and only drops at 3 weeks, to 15.9. SO AT FUSION BOTH TERMS FAIL,
  BUT AMPLIFICATION FAILS FIRST AND FAILS HARDER. Cell size is a late casualty; amplification is the
  variable that is already gone.

  WHAT THIS MEANS FOR THE STACK, STATED PLAINLY. The CNP axis acts on the factor that varies by 1.3-fold
  between a fusing and a non-fusing bone. The factor that varies by nearly eightfold - the number of
  amplifying divisions a progenitor yields before its progeny hypertrophy - HAS NO AGENT IN THIS STACK AND
  NO AGENT ANYWHERE IN THIS ATLAS. That is the target.

  ONE CANDIDATE ALREADY IN THE STACK, RAISED AS A HYPOTHESIS AND NOT AS A FINDING. Amplification is, in
  physical terms, the number of transit-amplifying divisions in the proliferative column before a cell
  commits to hypertrophy - so its natural readout is PROLIFERATIVE-ZONE output, not hypertrophic-zone
  output. kot2026 reports infigratinib increasing femur length AND PROLIFERATIVE-ZONE growth plate height,
  which is the amplification signature rather than the h_term signature, and the atlas ledger already
  separates the two agents on exactly that zone basis. Whether FGFR inhibition raises amplification per
  progenitor - as opposed to raising proliferation without changing the yield per progenitor consumed -
  IS NOT ESTABLISHED BY THAT OBSERVATION and is the first question of the next round.

  A SPECIES ERROR WAS MADE AND CAUGHT, AND IT IS THE REASON THESE NUMBERS CAN BE TRUSTED. lui2018 S1 Data
  holds mouse and rat in one workbook with only one sheet naming either. The first run of the tool divided
  a mouse yield by a rat terminal cell height. Corrected to mouse throughout, with rat demoted to the
  independent replication it should always have been. Logged as CORR-185. The contaminated answer was 7.2x
  and the corrected one is 7.9x - the conclusion survived, which is luck rather than method.'
