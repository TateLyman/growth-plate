open_questions:
- g_l2_raise_the_yield_per_progenitor
- g_l2_what_sets_amplification_in_the_proliferative_column
contradicts:
- 'NARROWS the_exchange_rate_between_growth_and_pool_depletion without contradicting it. That node
  established height = pool x yield and estimated the yield. This node shows the yield is itself a product
  and that only one of its two factors carries the between-bone difference - so "raise the yield" means
  "raise amplification", not "raise terminal cell size", and the atlas already has an arm on the wrong one.'
