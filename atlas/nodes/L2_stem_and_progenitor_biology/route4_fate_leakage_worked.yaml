human_evidence: absent
human_evidence_note: 'Entirely mouse genetics with a rat pharmacology comparator. No human growth plate has
  ever had progenitor fate traced, and no human data exist on chondrocyte-to-osteoblast conversion rates at
  the plate.'
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: 'Mouse conditional genetics in a bone that never fuses, compared against a rat
  pharmacological experiment, with the human plate running a proliferative cycle roughly ten times slower.
  The hazard characterisation is more likely to transfer than any effect size.'
confidence: C
claim_grades:
- claim: Fate leakage to osteoblast is a large standing loss term worth plugging.
  grade: X
  basis: 'NO - THE BASELINE LEAK IS SMALL. orikasa2024 states that descendants of PTHrP+ resting
    chondrocytes normally contribute only a small number of osteoblasts and CAR cells to adult marrow. The
    robust conversion appears only when Hedgehog is force-activated, so it is created by the manipulation
    rather than revealed by it. Route 4 ranked first of eight on the premise that there was recoverable
    value here, and there is not much.'
- claim: Sustained Hedgehog activation in resting chondrocytes is neutral for bone length.
  grade: X
  basis: 'NO, IT IS TRANSIENTLY NEGATIVE, AND THE ATLAS HAD THIS WRONG (CORR-186). Read directly,
    orikasa2024 reports femur length equivalent at all time points EXCEPT P21, and states that Hedgehog
    activation negatively affects bone length transiently. The summarisation step that produced the
    previously held null dropped the direction.'
- claim: The discrepancy between trompet2024 and orikasa2024 is explained by duration.
  grade: E
  basis: 'DOWNGRADED FROM THE LEADING EXPLANATION TO ONE OF SEVERAL. Reading both primaries shows the
    cellular events differ in KIND: trompet2024 doubled resting-zone PTHrP+ cells with proliferation and
    terminal cell size explicitly UNCHANGED - a clean pool expansion - while orikasa2024 caused LOSS OF
    QUIESCENCE and clonal derangement that obliterated the resting-proliferative boundary. Dose,
    cell-autonomy, delivery, species and genetic-versus-pharmacological activation all differ too, and
    Ptch1 deletion is a far stronger and permanent activation than a bead whose reporter is gone by three
    weeks.'
- claim: Route 4 is a lever.
  grade: X
  basis: 'IT IS A HAZARD SPECIFICATION FOR ROUTE 1. Hedgehog is the only signal anyone has used to
    manipulate the secondary-ossification-centre niche that route 1 depends on, and orikasa2024 defines
    what happens when it is pushed too hard or too long in the same cells: the expanded pool leaves the
    plate as trabecular osteoblasts, the plate becomes hyperplastic and distorted, and the bone gets
    transiently shorter. That is worth more than the lever would have been, because it bounds the next
    route rather than opening a dead one.'
- claim: The trompet2024 pool gain is a durable chondrocyte pool gain.
  grade: D
  basis: 'UNKNOWN, AND ONE SMALL MEASUREMENT WOULD SETTLE IT. trompet2024 never lineage-traced its
    SAG-treated animals, so nobody knows whether the cells added to the resting zone stayed chondrocytes or
    followed the orikasa2024 route into the marrow on a slower timescale. Its +3.63 per cent femur at six
    months argues they did something useful; its lack of a trace means the mechanism is unattributed, and
    the atlas already records that the bead moved h_term and growth rate as well as pool.'
