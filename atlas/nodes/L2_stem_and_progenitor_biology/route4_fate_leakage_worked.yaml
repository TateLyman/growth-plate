contradicts:
- 'DOWNGRADES its own parent. every_mechanical_route_to_yield ranked fate leakage first of eight on the
  strength of an expanded pool being spent on bone with no length gain. Worked to the bottom, the baseline
  leak is small, the length effect is transiently negative rather than null, and the expansion self-resolves
  - so the route closes as a lever and survives as the hazard bound on route 1.'
