id: route4_fate_leakage_worked
name: ROUTE 4 WORKED TO THE BOTTOM - the fate leak is small so there is little to plug, and the deep dive
  converts this route from a lever into a HAZARD CHARACTERISATION of the Hedgehog lever route 1 wanted to use
aliases:
- route 4 fate leakage
- is the osteoblast leak worth plugging
- hedgehog hazard
- trompet versus orikasa reconciled
- round 180
type: hypothesis
layer: L2
stub: false
summary: 'ROUTE 4 WAS RANKED FIRST OF THE EIGHT BECAUSE IT WAS THE ONLY ONE WITH BOTH A POSITIVE LENGTH
  ENDPOINT AND AN EXISTING COMPOUND. WORKED TO THE BOTTOM IT LARGELY CLOSES AS A LEVER, AND WHAT IT LEAVES
  BEHIND IS MORE USEFUL THAN WHAT IT PROMISED.

  THE FIRST JOB WAS FIXING A PROVENANCE WEAKNESS THE ATLAS HAD FLAGGED ITSELF. orikasa2024 was held through
  a summarisation step, with an explicit warning attached. Read directly it says something different from
  what was recorded. NOT "no significant bone length change" BUT, in the authors words, that femur length
  was equivalent at all time points "EXCEPT IN EARLIER TIME POINTS OF P21, indicating that Hedgehog
  activation NEGATIVELY AFFECTS THE BONE LENGTH ONLY TRANSIENTLY". Logged as CORR-186. Sustained Hedgehog
  activation in PTHrP+ resting chondrocytes made the femur SHORTER before it made it equivalent.

  AND THE LEAK IS SMALL, WHICH IS WHAT CLOSES THE ROUTE AS A LEVER. The whole premise of route 4 was that
  progenitors lost to osteoblast fate are progenitors spent for zero length, so plugging the leak recovers
  value. orikasa2024 states the baseline: descendants of PTHrP+ resting chondrocytes normally "contribute
  to only a SMALL NUMBER of osteoblasts and CAR cells in the adult bone marrow". THE OSTEOBLAST CONVERSION
  IS SOMETHING HEDGEHOG ACTIVATION CREATES, NOT A LARGE STANDING LOSS IT REVEALS. There is little to
  recover by plugging a leak that is not normally leaking.

  TWO MORE THINGS THE SUMMARY HAD DROPPED, BOTH AGAINST THE ROUTE. The expansion is SELF-RESOLVING -
  labelled cells rose steeply between P21 and P36, then FELL at P56 and P70 and reached no statistical
  difference by P96. The pool was not permanently enlarged, it was transiently deranged. And REMOVING
  Hedgehog does not shorten bone: Smo conditional knockout in PTHrP+ cells significantly reduced their
  column contribution while BONE LENGTH AND GROWTH PLATE STRUCTURE WERE UNCHANGED, because other cells
  compensate. A pool whose contribution can be cut without costing length is not a pool whose leak is
  worth plugging.

  NOW THE RECONCILIATION WITH trompet2024, AND IT IS NOT THE ONE ROUND 179 PROPOSED. That round suggested
  the Hedgehog lever has a TIME-DEPENDENT SIGN - pulse expands and lengthens, sustained converts to bone -
  because trompet2024s transient local SAG gave +3.63 per cent femur while orikasa2024s permanent genetic
  activation gave no gain. READING BOTH PRIMARIES SHOWS THE TWO MANIPULATIONS DIFFER IN KIND, NOT ONLY IN
  DURATION. trompet2024 doubled resting-zone PTHrP+ cells from 65.5 to 139.8 per mm2 WITH PROLIFERATION IN
  THE TOP 50 MICROMETRES AND IN THE PROLIFERATIVE ZONE EXPLICITLY UNCHANGED, and with terminal
  hypertrophic cell size unchanged - a clean pool expansion. orikasa2024 caused LOSS OF QUIESCENCE and
  aberrant clonal expansion into concentric masses that obliterated the resting-proliferative boundary,
  with columns widening from about 1-2 to 5-6 cells. THOSE ARE DIFFERENT CELLULAR EVENTS. Duration is one
  candidate explanation; dose, cell-autonomy, delivery, species and the genetic-versus-pharmacological
  distinction are the others, and Ptch1 deletion is a far stronger and permanently cell-autonomous
  activation than a bead whose reporter signal is gone by three weeks. The time-dependent-sign hypothesis
  is DOWNGRADED from the leading explanation to one of several, and the gap opened for it is rewritten
  accordingly.

  WHAT ROUTE 4 LEAVES BEHIND, AND IT IS WORTH MORE THAN THE LEVER WOULD HAVE BEEN. Route 1 - raise the
  self-renewal fraction using the secondary-ossification-centre niche - is the next-ranked route, and
  Hedgehog is the only signal anyone has used to manipulate that niche. ROUTE 4 IS THEREFORE NOT A
  SEPARATE LEVER BUT THE HAZARD SPECIFICATION FOR ROUTE 1: push Hedgehog hard enough or long enough in
  PTHrP+ resting chondrocytes and the pool you expanded leaves the plate as osteoblasts, the plate becomes
  hyperplastic and distorted, and the bone gets transiently SHORTER. Any route-1 attempt has to stay below
  that threshold, and trompet2024 is the only protocol on record that appears to.

  THE ONE MEASUREMENT THAT WOULD SETTLE IT IS SMALL AND WAS NEVER TAKEN. trompet2024 never lineage-traced
  its SAG-treated animals. Nobody knows whether the cells it added to the resting zone stayed chondrocytes
  or followed the orikasa2024 route into the marrow. That single trace, on an existing protocol, decides
  whether the atlas one positive pool result is a real pool gain or a slower version of the same
  conversion.'
