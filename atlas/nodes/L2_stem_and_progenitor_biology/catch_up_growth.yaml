id: catch_up_growth
name: Catch-up growth
type: phenotype
summary: 'Catch-up growth is a height velocity above the normal range for age sustained for at least a
  year following a period of growth inhibition, best expressed as a change in height standard deviation
  score rather than as velocity because it must be separated from the pubertal spurt. It is directly observed
  in humans after treatment of hypothyroidism, glucocorticoid excess, coeliac disease and malnutrition,
  and it may be complete or incomplete. Its mechanistic significance for this layer is that it is the
  strongest functional evidence that the growth plate carries a stored, spendable growth potential: rabbit
  experiments show that catch-up can be produced within a single growth plate by local glucocorticoid,
  and that the catching-up plate is histologically and functionally less senescent than an age-matched
  control. Catch-up growth is therefore evidence FOR the finite-capacity/senescence model - specifically
  for its division-dependence rather than for a Hayflick mechanism - and evidence AGAINST catch-up requiring
  a central size sensor.'
