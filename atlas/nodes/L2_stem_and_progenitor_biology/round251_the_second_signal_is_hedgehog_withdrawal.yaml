id: round251_the_second_signal_is_hedgehog_withdrawal
name: >-
  ROUND 251 - newton2019 read in full. THE SECOND SIGNAL IS HEDGEHOG WITHDRAWAL: vismodegib forced the
  alerted Tsc1 pool to differentiate directly into columnar cells. The resting zone sits where SHH from the
  SOC meets IHH from the hypertrophic zone, which is why an intra-SOC bead works. And Newton's own
  colony-forming assay finds NO change in stem cell number under hedgehog, which downgrades the expansion
  reading
type: hypothesis
layer: L2
aliases:
- the second signal is withdrawal
- two opposing hedgehog gradients
- the CFU null
- load and release
- round 251
stub: false
summary: |
  THE FULL TEXT ANSWERS THE QUESTION I ASKED FOR IT, ANSWERS A BIGGER ONE I HAD NOT ASKED, AND DOWNGRADES
  THE CLAIM I HAVE BEEN BUILDING ON FOR THREE ROUNDS.

  ONE - THE QUESTION I ASKED: NO. NEWTON NEVER MEASURED BONE LENGTH IN THE Tsc1 MICE. 'Bone length' appears
  zero times, 'shorter' zero, 'dwarf' zero; every femur and tibia mention is Methods or the wild-type
  growth-rate panel. Round 250's claim that pool-without-flux fails to give length rested on one sentence -
  recruitment into the proliferative layer unchanged - and that is suggestive, not a length endpoint
  (CORR-260). THE LENGTH QUESTION FOR AN mTORC1-EXPANDED POOL IS UNTESTED, NOT ANSWERED.

  TWO - AND HERE IS THE SECOND SIGNAL, WHICH I HAD BEEN LOOKING FOR IN THE WRONG DIRECTION. Round 250 asked
  what makes an alerted pool discharge. Newton answers it in one experiment. THE Tsc1 CLUSTERS RETAIN
  HEDGEHOG DEPENDENCE, AND VISMODEGIB - EIGHT DOSES, TWICE DAILY FOR FOUR DAYS BEFORE ANALYSIS AT P45 -
  FORCED THEM TO DIFFERENTIATE DIRECTLY INTO COLUMNAR CELLS AND FORM MULTI-COLUMNAR CLONES. Some CD73-
  POSITIVE CELLS DETACHED FROM THE NICHE AND ENTERED THE COLUMNAR LAYER.

  SO THE ALERTED POOL CAN BE DISCHARGED, AND THE THING THAT DISCHARGES IT IS REMOVING HEDGEHOG. THAT IS THE
  OPPOSITE OF WHAT THE OBVIOUS READING PREDICTS, AND IT COHERES EXACTLY WITH ROUND 249: SAG INSTALLS THE
  WNT-INHIBITORY PROGRAMME, which is the root-cell brake. Hedgehog HOLDS cells in the niche. Withdrawing it
  lets them go. The pool lever and the discharge lever are the SAME PATHWAY IN OPPOSITE DIRECTIONS.

  THE PROTOCOL THAT FOLLOWS IS OBVIOUS AND NOBODY HAS RUN IT: LOAD THE POOL WITH AN AGONIST, THEN WITHDRAW
  TO DISCHARGE IT, THEN RELOAD. Every experiment to date runs one direction continuously. trompet2024's bead
  is a sustained agonist whose Gli1-LacZ signal was gone by three weeks - so the bead animals were, without
  anyone designing it that way, LOADED AND THEN RELEASED, and they are the ones that gained length.

  AND THE COST OF THE WITHDRAWAL ARM IS ALREADY ON RECORD AND MUST BE CARRIED: kimura2008 shows that
  TRANSIENT inhibition of hedgehog in YOUNG mice causes PERMANENT defects in bone structure. A load-release
  protocol is not two safe halves.

  THREE - THE NICHE GEOMETRY, WHICH IS NEW TO THIS ATLAS AND EXPLAINS WHY THE BEAD WORKED AND WHY SYSTEMIC
  DOSING IS BLUNT. Shh-GFP reporter mice show ABUNDANT Shh EXPRESSION IN THE SOC - by mesenchymal stem cells
  and their progenitors, and by endothelial and haematopoietic cells. Newton's reading: diffusion of SHH
  FROM THE SOC together with diffusion of IHH FROM THE HYPERTROPHIC ZONE gives MAXIMAL HEDGEHOG SIGNALLING
  SPECIFICALLY IN THE RESTING ZONE, confirmed by Gli2 in situ and Gli1-creERT recombination in round
  chondrocytes.

  THE RESTING ZONE SITS AT THE INTERSECTION OF TWO OPPOSING HEDGEHOG GRADIENTS FROM TWO DIFFERENT SOURCES.
  That is why an intra-SOC bead is not merely a local route - IT PUTS THE AGONIST AT ONE OF THE TWO
  ENDOGENOUS SOURCES. And it explains the age dependence without invoking systemic toxicity: BEFORE SOC
  FORMATION THERE IS NO SOC SHH SOURCE, so the geometry that concentrates signal on the resting zone does
  not yet exist.

  FOUR - AND NOW THE DOWNGRADE. NEWTON RAN THE SAME AGONIST EXPERIMENT AT THE SAME AGE AND GOT A DIFFERENT
  ANSWER, AND ONE HALF OF IT IS BETTER POWERED THAN THIS ATLAS HAS BEEN ASSUMING.

  - SAG, four administrations P31-P34, analysed P35: INCREASED PROLIFERATION WITHIN THE NICHE, but DID NOT
    EXPAND THE CD73-POSITIVE DOMAIN (P = 0.3, n = 5 vehicle versus 3 SAG). The atlas has dismissed this as
    underpowered, and for the domain measurement that is fair.
  - BUT THE FUNCTIONAL ASSAY IS SEPARATE AND IS NOT UNDERPOWERED: NEITHER RECOMBINANT SHH, NOR VISMODEGIB,
    NOR THE GLI1 INHIBITOR GANT61 ALTERED THE NUMBER OF COLONY-FORMING UNITS of CD73+CD49e+ cells - n = 9
    wells from 3 independent experiments for rmShh and vismodegib.

  COLONY-FORMING UNIT NUMBER IS THE MOST FUNCTIONAL STEM-CELL READOUT IN THE ENTIRE HEDGEHOG LINE AND IT IS
  NULL IN BOTH DIRECTIONS. Set that beside the three things already on record - trompet2024's Pthlh message
  per cell FALLING under SAG, kodama2025's finding that PTHLH marks only 17 per cent of the resting
  compartment, and Newton's CD73 domain not expanding - and THE RECRUITMENT READING IS NOW STRONGER THAN THE
  EXPANSION READING. Hedgehog agonism may be converting cells into the PTHrP-positive reporter state and
  raising their proliferation WITHOUT INCREASING THE NUMBER OF FUNCTIONAL STEM CELLS.

  WHAT SURVIVES THAT DOWNGRADE, AND IT IS NOT NOTHING: THE LENGTH RESULT IS UNTOUCHED. Femur +3.63 per cent
  and entire leg +1.65 per cent at six months, 8 of 8 normal rats, contralateral control. WHAT IS NOW
  UNCERTAIN IS THE MECHANISM, NOT THE EFFECT. The bead lengthened bone; whether it did so by expanding the
  pool, by raising proliferation, by raising terminal cell height, or by loading and then releasing, is open
  - and the atlas has been asserting the first.

  FIVE - TWO FURTHER NUMBERS FROM THE SAME PAPER THAT BEAR ON THE PROGRAMME. The post-SOC increase in clonal
  size DID NOT reflect changes in chondrocyte proliferation OR GROWTH RATE - the self-renewal switch is
  invisible in velocity. And morphometry with EdU shows FEWER FLAT CELLS BUT MORE EdU-LABELLED HYPERTROPHIC
  CHONDROCYTES AT P30 THAN P3, meaning flat cells do not replicate more but MOVE TO THE HYPERTROPHIC LAYER
  MORE RAPIDLY IN OLDER MICE. Transit accelerates with age. That is the amplification term falling, and it
  is measured.

  SIX - THE COMPOUND NOTE. SAG21k is real and deployed in vivo - rundle2026 released it from a 3D-printed
  scaffold into a murine endochondral segmental defect specifically TO PROMOTE CHONDROGENESIS, followed by a
  PHD2 inhibitor for angiogenesis, with PTCH1 and HIF1a up and more callus bone. It is the first agonist in
  this survey deployed for a CHONDROGENIC rather than a purely osteogenic endpoint, which weakens the
  round-250 claim that the entire chemical space is osteogenically selected - though the application is
  still fracture repair, not growth plate output.
