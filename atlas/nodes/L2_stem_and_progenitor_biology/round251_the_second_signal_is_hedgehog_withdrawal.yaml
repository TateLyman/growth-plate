    differentiate directly into columnar cells and form multi-columnar clones, with some CD73-positive cells
    DETACHING FROM THE NICHE and entering the columnar layer'
  unit: cellular fate of clustered chondroprogenitors under hedgehog blockade
  conditions: Col2-creERT:Tsc1 floxed:R26R-Confetti mice, tamoxifen P3, vismodegib P40-P44
  species: mouse
  source_ref: newton2019
