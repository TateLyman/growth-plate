    this is discharge of a LESION-EXPANDED pool, not of a drug-expanded one, and no length endpoint was
    measured in any arm. The withdrawal arm also carries kimura2008's finding that transient hedgehog
    inhibition in young mice causes PERMANENT bone structural defects
- parameter: >-
    the resting zone sits at the intersection of two opposing hedgehog gradients from two different sources
    - which is why an intra-SOC bead is a mechanistically privileged route
  value: >-
    'Shh abundantly expressed IN THE SOC by mesenchymal stem cells and progenitors and by endothelial and
    haematopoietic cells; diffusion of SHH from the SOC together with IHH from the hypertrophic zone gives
    maximal hedgehog signalling specifically in the resting zone, confirmed by Gli2 in situ and Gli1-creERT
    recombination'
  unit: spatial source and gradient architecture
  conditions: Shh-GFP reporter mice, one month old
  species: mouse
  source_ref: newton2019
  uncertainty: >-
    the two-gradient interpretation is the authors' inference from expression plus downstream reporters, not
    a measured concentration field. It does explain the age dependence without invoking toxicity, since
    before SOC formation the SOC source does not exist
- parameter: >-
    THE FUNCTIONAL NULL THAT DOWNGRADES THE EXPANSION READING - hedgehog does not change the number of
    colony-forming stem cells in either direction
  value: >-
    'neither recombinant mouse Shh (1 microgram per ml), nor vismodegib (1 micromolar), nor GANT61 (5
    micromolar) altered the NUMBER of colony-forming units of CD73+CD49e+ cells; n = 9 wells from 3
    independent experiments for rmShh and vismodegib'
  unit: colony-forming units after 10 days of culture
  conditions: FACS-sorted CD73+CD49e+ growth plate cells from one-month-old wild-type mice
  species: mouse
  source_ref: newton2019
  uncertainty: >-
    IN VITRO colony formation, which measures clonogenic capacity of sorted cells and not pool size in
    tissue, and sorting itself removes the niche whose signals are the subject. It is nonetheless the most
    functional stem-cell readout in this line and it is null both ways
- parameter: >-
    transit through the plate ACCELERATES with age - flat cells do not divide more, they leave sooner
  value: >-
    'fewer flat cells but MORE EdU-labelled hypertrophic chondrocytes at P30 than at P3; and the post-SOC
    rise in clonal size did NOT reflect any change in chondrocyte proliferation or in growth rate'
  unit: morphometry with EdU pulse-chase
  conditions: mouse tibial growth plate, P3 versus P30
  species: mouse
  source_ref: newton2019
