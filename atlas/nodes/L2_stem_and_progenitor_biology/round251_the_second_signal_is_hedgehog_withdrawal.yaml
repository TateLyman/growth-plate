  that produced length'
human_evidence: absent
human_evidence_note: >-
  Entirely mouse. The human anchor on this axis remains robinson2017a, growth arrest in three children on
  the antagonist vismodegib - which is, notably, the same manipulation that discharges the pool here.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: >-
  Mouse throughout, and the load-release idea is assembled from two experiments that were never run as a
  sequence. The withdrawal arm carries a documented permanent-damage risk in young mice, and the human
  evidence for hedgehog blockade in children is growth arrest.
confidence: C
confidence_reason: >-
  The withdrawal-discharges-the-pool observation is a single clean experiment with a clear readout and is
  the strongest new element. The two-gradient architecture is the authors' inference from reporter data. The
  colony-forming null is well powered for what it measures but is in vitro. Graded C, with the load-release
  protocol itself explicitly speculative because no one has run the sequence.
