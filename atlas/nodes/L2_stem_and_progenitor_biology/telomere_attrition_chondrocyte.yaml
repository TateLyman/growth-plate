id: telomere_attrition_chondrocyte
name: Telomere attrition in growth plate chondrocytes
type: process
summary: 'Telomere shortening is the most commonly invoked molecular clock for a finite proliferative
  capacity, and it is routinely asserted for the growth plate in review literature. A targeted Europe
  PMC search for measurements of telomere length or telomerase activity in human growth plate or resting-zone
  chondrocytes as a function of age returned no qualifying primary study (see search log for g_l2stem_007):
  the hits are osteoarthritis cartilage, general skeletal ageing reviews, and rodent work. The nearest
  positive datum is murine and indirect - mTert-GFP marks a transitional skeletal progenitor population
  whose expression peaks during adolescent bone growth rather than persisting - and the nearest negative
  datum is that rabbit resting-zone chondrocyte replicative capacity in vitro does not decline with donor
  age, which is hard to reconcile with progressive telomere-driven exhaustion in vivo. Treat telomere
  attrition in the growth plate as an untraceable claim in its human form.'
quantitative: []
localization:
- 'human growth plate: no measurement located'
- 'mouse growth plate, metaphyseal stroma, marrow: mTert-GFP+ cells present (carlone2021)'
human_evidence: absent
human_evidence_note: No primary measurement of telomere length or telomerase activity in human growth
  plate chondrocytes was found.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Laboratory mice have long telomeres and broader somatic telomerase expression
  than humans, so murine telomere data are among the least transferable in skeletal biology.
