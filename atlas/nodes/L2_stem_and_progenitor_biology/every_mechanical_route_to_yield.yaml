id: every_mechanical_route_to_yield
name: EVERY MECHANICAL ROUTE TO YIELD, ENUMERATED - eight loss terms, only one of which had been worked,
  and the two that matter are FATE LEAKAGE and a zone-selective IGF handle that could break the
  charge/discharge constraint
aliases:
- other ways to raise yield
- yield loss terms
- fate leakage osteoblast
- is there another route to amplification
- breaking the charge discharge constraint
- PAPP-A local IGF
- round 179
type: hypothesis
layer: L2
stub: false
summary: 'ROUNDS 174 TO 178 WORKED ONE ROUTE TO YIELD - LENGTHEN THE TRANSIT BEFORE HYPERTROPHIC
  COMMITMENT - AND THEN SEARCHED FOR AGENTS ON IT. THAT WAS ONE BRANCH OF A FLOW SYSTEM WITH EIGHT. Setting
  the decomposition out properly first, then asking what is known about each, changes which routes are live.

  THE FLOW. A resting-zone progenitor either self-renews or commits. A committed cell transits the
  proliferative compartment, dividing some number of times. It then exits to hypertrophy, enlarges, and is
  resorbed. YIELD IS HYPERTROPHIC CELLS DELIVERED PER PROGENITOR CONSUMED, so anything that loses cells
  between those two ends, or that spends a progenitor for nothing, lowers it.

  ROUTE 1 - RAISE THE SELF-RENEWAL FRACTION. Fewer progenitors consumed per unit output. mTORC1 activation
  does raise it and FAILS, because newton2019 found recruitment into the proliferative layer unchanged -
  pool without flux. But the same paper contains an unexploited version: CLONE SIZE VARIES 1.37-FOLD WITHIN
  ONE BONE by distance from the secondary ossification centre (7.8 against 5.7 cells, P = 0.0012), and
  delaying SOC maturation with axitinib REDUCES it (P = 0.0023). An anatomical niche sets the renewal
  decision, its effect size is measured, and NOBODY HAS ASKED WHETHER THAT NICHE SIGNAL CAN BE SUPPLIED
  PHARMACOLOGICALLY. Open.

  ROUTE 2 - LENGTHEN THE TRANSIT. The route already worked. PTHrP-Ihh sets it; Jansen metaphyseal
  chondrodysplasia is the human warning that it is a titration and not an on-switch. Open.

  ROUTE 3 - CUT ATTRITION IN TRANSIT. Real as a mechanism and CLOSED ON DIRECTION. velentza2023 shows
  chondrocyte survival is rate-limiting - venetoclax, an approved BCL-2 inhibitor, cut viability, reduced
  resting/proliferative zone height and hypertrophic cell size, and suppressed bone growth in vivo. So the
  brake exists and removing it costs growth. But the one manipulation that REDUCES chondrocyte death,
  eaton2014''s ASK1 knockout, protects the TERMINALLY DIFFERENTIATED cell - which has already delivered its
  length - and SHORTENS THE PROLIFERATIVE ZONE. Every available pharmacology on this route points the wrong
  way.

  ROUTE 4 - CUT FATE LEAKAGE, AND THIS IS THE FIRST GENUINELY NEW ONE. A progenitor that leaves the pool
  and becomes an osteoblast delivers ZERO length. orikasa2024 activated Hedgehog in PTHrP+ resting
  chondrocytes and the descendants formed clonally expanded "patched roses", widened the columns and made
  the plate hyperplastic - AND THEN MIGRATED OUT OF THE GROWTH PLATE AND BECAME TRABECULAR OSTEOBLASTS IN
  THE DIAPHYSEAL MARROW, WITH NO SIGNIFICANT BONE LENGTH CHANGE. The pool was expanded and the expansion
  was spent on bone.

  AND THAT REFRAMES THE ATLAS''S BEST POOL INTERVENTION. trompet2024 used SAG - a Smoothened agonist, the
  SAME PATHWAY - and got +3.63 per cent femur at six months, 8 of 8 animals, P = 0.00004. orikasa2024 used
  genetic Ptch1 deletion in the same cell type and got no length. THE DIFFERENCE IS DURATION AND
  REVERSIBILITY: trompet2024''s bead was LOCAL and TRANSIENT, with Gli1 reporter signal gone by three
  weeks; orikasa2024''s deletion is PERMANENT in the labelled lineage. THE HEDGEHOG LEVER APPEARS TO HAVE A
  TIME-DEPENDENT SIGN - a pulse expands the pool and lengthens the bone, sustained activation converts the
  pool into osteoblasts. That is a testable, actionable distinction and neither paper states it, because
  neither cites the other for this purpose.

  ROUTE 5 - CUT CLONE STALLING AND FAILED COLUMN ENTRY. yuan2023 shows that joining a column is an ACTIVE,
  integrin-mediated ROTATION step, imaged directly by two-photon time-lapse: alpha-parvin loss disorganises
  the proliferative zone, raises binucleation and cell death, dilates the resting zone and gives dwarfism.
  A cell that fails to rotate does not join a column, and its progenitor''s investment is wasted. Distinct
  from division number and from transit time. The evidence is entirely loss-of-function, so the route is
  real and has no lever. Related and unexploited: oichi2023 and newton2019 both count SHORT versus LONG
  columns as separate categories, which is the same loss expressed as an outcome.

  ROUTE 6 - COLUMN DENSITY. weise2001 measures columns per mm of plate width and finds it DECLINES with
  senescence and declines faster under oestrogen. Fewer columns per unit width is less output per unit
  plate. Untouched by any intervention.

  ROUTE 7 - TERMINAL CELL SIZE. The small term, 1.1 to 1.5-fold across bones, species and ages, and owned
  by IGF-1 (cooper2013). Already double-covered by the stack.

  ROUTE 8 - EXTERNAL RECRUITMENT. If the groove of Ranvier or perichondrial Gli1+ stromal cells feed new
  progenitors into the plate, the pool is not a closed account and the denominator is not fixed. This
  changes the accounting rather than the ratio, and the atlas has never costed it.

  THE ONE IDEA THAT COULD BREAK THE ROUND-178 CONSTRAINT. That round found the charge/discharge switch -
  IGF-1 through Akt in the resting zone - and the constraint that killed the obvious therapy: charging needs
  it LOW, driving velocity needs it HIGH, one control pointed opposite ways. THE ESCAPE WOULD BE ZONE
  SELECTIVITY. oichi2023 reports Igf-1 transcript HIGHER in the resting zone than the proliferative zone, so
  the resting zone has its own local source. harboe2024 shows PAPP-A sets LOCAL IGF bioavailability in
  cartilage by cleaving IGF binding proteins, with knockout giving shorter femora and disorganised columns,
  rescued by exogenous IGF-I. IF LOCAL RESTING-ZONE IGF AVAILABILITY COULD BE LOWERED WHILE SYSTEMIC IGF
  WAS MAINTAINED, THE POOL WOULD CHARGE WHILE VELOCITY CONTINUED. Nothing achieves that today, and the
  unselective version is harmful by harboe2024''s own result. It is a mechanism with no agent - but it is
  the only route found that dissolves the constraint rather than working around it.

  WHAT THE ENUMERATION CHANGES. Two routes were being treated as the whole problem and there are eight.
  One closes on direction (attrition). Two are real with no lever (column entry, column density). One
  changes the accounting (recruitment). One is already covered (cell size). And two are live and new -
  FATE LEAKAGE, where the Hedgehog sign appears to depend on duration, and the SOC NICHE, where a 1.37-fold
  effect within one bone has never been pursued pharmacologically.'
