localization:
- 'the resting-zone/proliferative-zone boundary: routes 1 and 4 - the renewal decision and the fate leak'
- 'the proliferative column: routes 2, 3 and 5 - transit length, attrition, and failure to enter a column'
- 'the perichondrium and groove of Ranvier: route 8 - whether the pool is a closed account at all'
human_evidence: absent
human_evidence_note: 'Every route here is rodent. The only human touchpoints are indirect: Jansen
  metaphyseal chondrodysplasia as the warning on route 2, and the human column-composition decline in
  kember1976 as evidence that the amplifying compartment shrinks in man as it does in rodents.'
species_basis:
- mouse
- rat
- multiple
translation_risk: high
translation_risk_reason: 'A mechanistic enumeration built almost entirely on mouse loss-of-function
  genetics, in a species whose proliferative cycle is roughly ten times faster than the human one and whose
  femur never fuses. What transfers is the LIST of loss terms; none of the effect sizes should be.'
confidence: C
claim_grades:
- claim: Lengthening transit before hypertrophic commitment is the only mechanical route to a higher yield.
  grade: X
  basis: 'NO, AND TREATING IT THAT WAY FOR FIVE ROUNDS NARROWED THE SEARCH. A flow system with a renewal
    decision, a transit, an exit and two fate branches has at least eight loss terms. Transit length is one.
    Attrition, fate leakage, failed column entry, column density, external recruitment and the renewal
    fraction are separate quantities that were never enumerated before agents were hunted.'
- claim: Fate leakage to osteoblast is a real yield loss term.
  grade: C
  basis: 'orikasa2024 traced PTHrP+ resting chondrocytes under sustained Hedgehog activation and found the
    descendants leaving the growth plate and becoming trabecular osteoblasts in the diaphyseal marrow, with
    the plate hyperplastic and no significant bone length change. A progenitor spent on an osteoblast
    delivers zero length. C not B because the atlas holds this paper through a summarisation step, and the
    length null is a reported non-significance rather than an equivalence bound.'
- claim: The Hedgehog lever has a time-dependent sign - transient expands the pool and lengthens bone,
    sustained converts the pool to osteoblasts.
  grade: E
  basis: 'THE COMPARISON IS THIS ATLAS''S AND NEITHER PAPER MAKES IT. trompet2024, local transient SAG with
    Gli1 signal gone by three weeks, gave +3.63 per cent femur at six months in 8 of 8 animals. orikasa2024,
    permanent genetic Ptch1 deletion in the same cell type, gave hyperplasia, osteoblast conversion and no
    length. The two differ in duration, reversibility, delivery and genetic versus pharmacological
    activation all at once, so duration is one of four candidate explanations rather than the demonstrated
    one. It is graded E and stated because it is testable and because it bears directly on how the atlas
    best pool result should be dosed.'
- claim: Reducing chondrocyte attrition in transit would raise the yield.
  grade: X
  basis: 'CLOSES ON DIRECTION. The mechanism is real - velentza2023 shows removing the BCL-2 brake with
    venetoclax cuts viability and suppresses growth in cells, metatarsals and mice. But the one manipulation
    that reduces chondrocyte death, eaton2014''s ASK1 knockout, protects the TERMINALLY DIFFERENTIATED cell
    - which has already delivered its length - and SHORTENS the proliferative zone. No available
    pharmacology raises survival of the cells that matter.'
- claim: Failure to enter a column is a distinct and addressable loss term.
  grade: D
  basis: 'DISTINCT YES, ADDRESSABLE NOT YET. yuan2023 images chondrocyte rotation directly and shows it is
    an active integrin-mediated step whose loss gives dwarfism with a disorganised proliferative zone. It is
    genuinely separate from division number and transit time. But the entire evidence base is
    loss-of-function, there is no gain-of-function, and no agent targets the rotation step.'
- claim: A zone-selective IGF handle could charge the pool without giving up velocity.
  grade: E
  basis: 'THE ONLY ROUTE FOUND THAT DISSOLVES THE ROUND-178 CONSTRAINT RATHER THAN WORKING AROUND IT, AND IT
    HAS NO AGENT. Two facts make it conceivable: oichi2023 reports Igf-1 transcript HIGHER in the resting
    zone than the proliferative zone, so the resting zone has a local source; and harboe2024 shows PAPP-A
    sets local IGF bioavailability in cartilage by cleaving IGFBPs. If resting-zone IGF availability could
    be lowered while systemic IGF was maintained, charging and driving would stop being the same switch.
    Against it: harboe2024 also shows the UNSELECTIVE version is harmful - global PAPP-A loss shortens
    femora and disorganises columns - and nothing delivers zone selectivity in any tissue.'
- claim: The progenitor pool is a closed account.
  grade: D
  basis: 'ASSUMED THROUGHOUT THIS PROGRAMME AND NEVER CHECKED. If the groove of Ranvier or perichondrial
    Gli1-expressing stromal cells feed new progenitors into the plate, the denominator is not fixed and
    every yield computed here is measuring flow through an open system. Graded D because the atlas holds
    the anatomy but has never costed the flux.'
