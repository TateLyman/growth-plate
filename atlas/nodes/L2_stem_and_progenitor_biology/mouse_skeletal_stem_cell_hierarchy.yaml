id: mouse_skeletal_stem_cell_hierarchy
name: Mouse skeletal stem cell (mSSC) hierarchy
aliases:
- Chan-Longaker mSSC scheme
- AlphaV+ skeletal hierarchy
type: hypothesis
summary: 'Dissociated mouse femoral growth plate was fractionated on CD45, Ter119, Tie2 and AlphaV (CD51),
  and the CD45-Ter119-Tie2-AlphaV+ compartment further split on CD105, Thy (CD90), 6C3 and CD200 into
  eight subpopulations. The apex population, CD45- Ter119- Tie2- AlphaV(CD51)+ Thy(CD90)- 6C3- CD105-
  CD200+, generates all seven other subpopulations in a linear sequence both in vitro (25-day culture
  then re-fractionation) and in vivo (renal capsule transplantation, explanted at one month), and single
  sorted cells regenerate the full set including on secondary single-cell replating - the formal self-renewal
  plus multipotency test. Its immediate descendants are pre-BCSP (CD105-CD200-) and BCSP (CD105+). The
  hierarchy explicitly excludes fat, muscle and fibroblast output, which is where it collides with the
  CD146+/MSC literature. Two structural caveats: transplanted single mSSCs engraft poorly without 5,000
  carrier cells, so ''multipotency'' is measured in a supported niche; and the same CD200+CD105-Thy-6C3-
  immunophenotype is carried by the CTSK-lineage periosteal stem cell, meaning the surface panel alone
  does not specify anatomical identity.'
quantitative:
- parameter: Subpopulations resolved within the CD45-Ter119-Tie2-AlphaV+ compartment
  value: '8'
