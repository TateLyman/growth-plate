  species: mouse
  source_ref: chan2015
  uncertainty: not reported
- parameter: mSSCs co-expressing BMP2 and BMPR1a
  value: '28'
  unit: '% of mSSCs'
  conditions: single-cell RNA sequencing, mouse
  species: mouse
  source_ref: chan2015
  uncertainty: not reported
localization:
- 'mouse growth plate: confirmed, high frequency of AlphaV+ cells (chan2015)'
- 'mouse fracture callus: confirmed expansion (chan2015)'
- 'mouse periosteum: the same CD200+CD105- phenotype is present but Ctsk-lineage (debnath2018)'
human_evidence: absent
human_evidence_note: 'The mouse marker panel does not transfer: the human SSC was defined with an entirely
  different set of antigens (PDPN, CD146, CD73, CD164).'
species_basis:
- mouse
translation_risk: high
translation_risk_reason: 6C3 and Thy1.1/1.2 have no directly usable human equivalents in this assay, and
  CD105 and CD200 do not partition human skeletal progenitors the same way; the human scheme had to be
  built de novo from transcriptional homology.
