id: amplification_is_transit_time
name: AMPLIFICATION IS TRANSIT TIME, NOT DIVISION RATE - the target is the residence of a chondrocyte
  in the proliferative compartment before hypertrophic commitment, and the circuit that sets it is PTHrP-Ihh
aliases:
- what sets amplification
- clone size is amplification
- transit time hypertrophic commitment
- yield mechanism
- PTHrP Ihh sets the yield
- round 175
type: hypothesis
layer: L2
stub: false
summary: 'ROUND 174 SHOWED THAT 88 PER CENT OF THE YIELD IS AMPLIFICATION AND THAT NO AGENT TOUCHES IT.
  THIS ROUND ASKS WHAT AMPLIFICATION PHYSICALLY IS. IT HAS AN ANSWER, IT IS MEASURED, AND THE ANSWER CHANGES
  WHAT KIND OF DRUG WE ARE LOOKING FOR.

  AMPLIFICATION IS CLONE SIZE, AND NEWTON MEASURED IT. newton2019 traced single Col2-labelled progenitors
  with a multicolour reporter and counted the cells each one produced. That number IS the amplification
  factor. It is not fixed: clone size correlates with proximity to the SECONDARY OSSIFICATION CENTRE -
  7.8 +/- 0.3 cells per clone centrally against 5.7 +/- 0.1 laterally (P = 0.0012, n = 4, traced P6.5-P18)
  - and delaying SOC maturation with axitinib REDUCED clone size (P = 0.0023). So amplification is set
  by an anatomical niche and it is causally movable.

  AND THE MECHANISM OF ITS DECLINE IS NOT WHAT A VELOCITY MINDSET PREDICTS. The authors state it plainly:
  the change in clone size with age "did not reflect changes in chondrocyte proliferation or growth rate",
  and morphometry with EdU showed FEWER FLAT CELLS BUT MORE LABELLED HYPERTROPHIC CELLS at P30 than at
  P3, indicating that flat cells "do not exhibit increased replication, but MOVE TO THE HYPERTROPHIC LAYER
  MORE RAPIDLY in older mice". AMPLIFICATION IS RESIDENCE TIME IN THE PROLIFERATIVE COMPARTMENT BEFORE
  HYPERTROPHIC COMMITMENT. It falls because cells leave sooner, not because they divide slower.

  THAT REDEFINES THE DRUG. The lever is NOT "make chondrocytes proliferate faster" - which is what every
  velocity agent in this atlas does and what every assay in this literature measures. It is "DELAY HYPERTROPHIC
  COMMITMENT WITHOUT SLOWING PROLIFERATION", so that a progenitor''s progeny divide more times before
  they leave. Those two are routinely conflated and they are opposite in their effect on the pool: faster
  proliferation spends the pool, longer residence spends less of it per cell delivered.

  THE CIRCUIT IS ALREADY IN THIS ATLAS AT GRADE B AND WAS NEVER CONNECTED TO THE YIELD. pthrp_ihh_feedback_loop,
  written 2026-08-05, says it in one clause - PTHrP acts on PTH1R in late proliferative and prehypertrophic
  cells "to keep those cells cycling and to DELAY THE SWITCH TO HYPERTROPHY", chondrocytes that leave
  the effective range of PTHrP exit the cycle and switch on Ihh, and the loop is "a negative feedback
  loop whose GEOMETRY SETS THE LENGTH OF THE PROLIFERATIVE COLUMN". Column length is amplification. The
  atlas has held the mechanism of the untouched term for four days without noticing what term it was.
  mizuhashi2018 closes the circle and makes the coupling BIDIRECTIONAL: transit-amplifying chondrocytes
  are "concertedly maintained by a forward signal from undifferentiated cells (PTHrP) and a reverse signal
  from hypertrophic cells (Ihh)" and themselves "provided instructive cues to maintain the cell fates
  of PTHrP-positive chondrocytes". The amplifying compartment is not merely downstream of the pool - it
  maintains the pool.

  COOPER SETTLES WHICH ARM OWNS THE OTHER FACTOR, AND IT IS NOT A FREE ARM. cooper2013 both challenges
  and vindicates the round-174 decomposition, and the resolution is RATE versus YIELD. Its headline is
  that hypertrophic cell VOLUME is the largest contributor to elongation RATE and to differences in rate
  between elements - centimetres per day. But volume is not length: jerboa metatarsal chondrocytes reach
  about 23,000 fl against roughly 8,000 fl in mouse, a 2.9-fold VOLUME ratio, while their HEIGHT is up
  only 58 per cent, because volume includes radial expansion that adds nothing to elongation. Axial height
  ratios between plates are modest in three independent datasets - 1.32x mouse, 1.45-1.75x rat, 1.58x
  jerboa-versus-mouse. AND THE OWNER IS IGF-1: Igf1-deficient mice are 35 per cent smaller with THE SAME
  NUMBER of hypertrophic chondrocytes, each 30 per cent shorter axially, and the between-bone height difference
  is ABOLISHED in the mutant. So GH/IGF-1 and the CNP axis both act on terminal cell height. H_TERM IS
  COVERED TWICE AND AMPLIFICATION IS COVERED ZERO TIMES.

  RATE IS NOT YIELD, AND AT BONE AGE 16 YIELD IS THE BINDING QUANTITY. Cooper is right that cell volume
  dominates how fast a plate grows. Round 174 is right that amplification dominates how much a plate yields
  per progenitor spent. A subject with years of pool left should buy rate; a subject with months of pool
  left should buy yield. That is the whole argument for making this the primary objective.

  TWO INTERVENTIONS EXIST AND BOTH CARRY A NULL THAT MUST TRAVEL WITH THEM. mTORC1 activation by Tsc1
  ablation raised resting-zone clone size (P = 0.0342), CD73-positive zone height (P = 0.0025) and EdU-
  positive epiphyseal stem cells (62.4 +/- 7.5 against 24.7 +/- 3.7, P = 0.014), and shifted PAR3 toward
  symmetric division - BUT "neither proliferation of chondroprogenitors nor their recruitment into the
  proliferative layer changed detectably", the resting zone became DISORDERED, and the expanded clusters
  expressed neither ColX nor Ihh. THAT IS POOL EXPANSION WITHOUT FLUX, the precise failure mode g_l2_larger_pool_with_intact_flux
  was written to catch. The opposite manipulation gave fewer columns and MILD GROWTH RETARDATION. And
  hedgehog is REQUIRED rather than merely helpful: extending vismodegib by two doses FUSED the growth
  plate at P37, while SAG raised proliferation in the niche without expanding the CD73-positive domain
  (P = 0.3).

  THE HUMAN WARNING AGAINST THE OBVIOUS DRUG, STATED BEFORE ANYONE PROPOSES IT. The obvious handle on
  delayed hypertrophic commitment is PTH1R agonism, and constitutive PTH1R activation is a human experiment:
  JANSEN METAPHYSEAL CHONDRODYSPLASIA, which is SHORT-LIMBED. Delayed commitment is therefore NOT monotonically
  good - the loop has an optimum and Jansen sits past it. Any amplification agent has to be titrated against
  that, and PTH1R loss (Blomstrand) is lethal at the other end.

  WHAT NILSSON ADDS, NOW THAT THE FIGURE IS IN HAND. Figure 2 digitised by eye: a structural amplification
  index - proliferative cells per column over resting cells per mm width - declines with age in both bones
  and both arms and is LOWER UNDER OESTROGEN at every post-baseline age (tibia 0.954 then 0.847 of vehicle;
  radius 0.972 then 0.941). That is the direction the paper asserts and never quantified. It is 5-15 per
  cent, it is standing stocks rather than fluxes so it is NOT the yield, and 16-21 weeks is a WASHOUT
  - the deficit persists with no drug present in either arm.'
