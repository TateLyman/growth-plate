contradicts:
- RECONCILES rather than contradicts cooper2013. That paper's "hypertrophic volume is the largest contributor
  to differential elongation" is about RATE and about VOLUME; the round-174 finding is about YIELD and
  about AXIAL HEIGHT. Both hold, and the distinction is the reason yield is the right objective for a
  subject with little pool left rather than little time left.
