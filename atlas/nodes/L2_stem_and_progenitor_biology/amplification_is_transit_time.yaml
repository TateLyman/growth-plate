localization:
- 'the proliferative column: amplification is the number of divisions completed during residence, and
  residence ends at hypertrophic commitment'
- 'the PTHrP source in the periarticular and resting zone, and the Ihh source in the hypertrophic zone:
  the two ends of the loop whose geometry sets column length'
- 'the secondary ossification centre: an anatomical determinant of amplification, worth 1.37-fold within
  a single bone'
human_evidence: indirect
human_evidence_note: 'No human clone size, transit time or amplification measurement exists. The human
  evidence is genetic and it is a WARNING rather than a support: PTH1R gain of function causes Jansen
  metaphyseal chondrodysplasia, which is short-limbed, and PTH1R loss causes lethal Blomstrand chondrodysplasia.
  Delayed hypertrophic commitment is not monotonically beneficial in humans.'
species_basis:
