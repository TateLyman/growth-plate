translation_risk: high
translation_risk_reason: The mechanism is mouse clonal genetics in a species whose femur never fuses,
  and the secondary-ossification-centre dependence may not transfer to a human plate at bone age 16 where
  the SOC is long established. The one human read-out on the proposed target is a dysplasia.
confidence: C
claim_grades:
- claim: Clone size from a labelled resting-zone progenitor is a direct measurement of amplification.
  grade: B
  basis: It is close to a definition, and newton2019 performs it - Col2-creERT R26R-Confetti tracing with
    3D counting in Imaris, clone size quantified across ages and perturbations. B rather than A because
    the denominator is a LABELLED progenitor rather than a CONSUMED one, so it measures output per progenitor
    tracked, not output per progenitor spent, and those differ whenever progenitors self-renew.
- claim: Amplification falls with age because cells leave the proliferative compartment sooner, not because
    they divide more slowly.
  grade: B
  basis: Stated by newton2019 from two independent measurements - clonal change "did not reflect changes
    in chondrocyte proliferation or growth rate", and EdU with morphometry gave fewer flat cells but more
    labelled hypertrophic cells at P30 than P3. Mouse only, and inferred from standing compartment sizes
    plus a pulse rather than from a directly measured transit time.
- claim: The PTHrP-Ihh loop sets amplification.
  grade: C
  basis: The loop is established at grade B in pthrp_ihh_feedback_loop as setting the LENGTH OF THE PROLIFERATIVE
    COLUMN, and mizuhashi2018 shows the amplifying compartment reciprocally maintains PTHrP+ cell fate.
    Column length and amplification are the same quantity viewed statically and dynamically. C rather
    than B because no experiment has ever measured amplification, or clone size, as a function of PTHrP
    or Ihh dose - the loop has never been characterised quantitatively in any species (g_l3core_001).
- claim: Terminal cell height, not amplification, is what IGF-1 and the CNP axis act on.
  grade: B
  basis: cooper2013 for IGF-1 - Igf1-deficient mice have the SAME NUMBER of hypertrophic chondrocytes,
    each 30% shorter axially, with the between-bone height difference abolished. nakao2015 partitions
    the CNP axis onto the hypertrophic zone. Two arms of the stack, one term, and it is the term that
    varies least between a fusing and a non-fusing bone.
- claim: Raising mTORC1 is an amplification lever.
  grade: X
  basis: NO - IT IS POOL EXPANSION WITHOUT FLUX. Tsc1 ablation raised clone size, CD73 zone height and
    EdU-positive stem cells and shifted division toward symmetric, and newton2019 states in the same paragraph
    that "neither proliferation of chondroprogenitors nor their recruitment into the proliferative layer
    changed detectably". The resting zone became disordered and the clusters expressed neither ColX nor
    Ihh - progenitors that accumulate without entering the amplifying compartment. No bone length gain
    is reported; the opposite manipulation caused mild growth retardation.
- claim: PTH1R agonism is the drug to reach for.
  grade: E
  basis: IT IS THE OBVIOUS HANDLE AND THE HUMAN GENETICS IS A WARNING. PTHrP acts through PTH1R to delay
    the hypertrophic switch, which is exactly the proposed mechanism - but constitutive PTH1R activation
    in humans is JANSEN METAPHYSEAL CHONDRODYSPLASIA, which is SHORT-LIMBED. Delayed commitment is not
    monotonically good; the loop has an optimum and the human gain-of-function sits past it. Any agent
    here is a titration problem, not an on-switch, and nothing has ever been titrated against amplification
    because amplification has never been the endpoint.
- claim: Hedgehog tone is required to keep the plate open.
  grade: C
  basis: 'newton2019 - extending vismodegib by two doses FUSED the growth plate at P37. Single study,
    one species, a pharmacological knockdown rather than a dose-response, and fusion in a mouse plate
    that otherwise does not fuse is an unusual readout. Recorded because it bounds the direction: hedgehog
    cannot be reduced in this system without cost.'
