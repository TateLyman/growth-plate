localization:
- 'mouse primary spongiosa, trabeculae and endosteum: confirmed by two independent Cre systems (zhou2014a,
  yang2014)'
- 'mouse fracture callus: confirmed (zhou2014a)'
- 'human: unconfirmed - no lineage-resolving method available'
human_evidence: absent
human_evidence_note: The fraction of human osteoblasts derived from hypertrophic chondrocytes has never
  been measured; the process is inferred in humans purely by analogy with mouse.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: The measurement requires irreversible genetic labelling of a transient cell state.
  Humans also differ in the relevant window - human growth plates fuse, mouse plates do not - so even
  the developmental boundary reported by dual-recombinase tracing has no direct human analogue.
