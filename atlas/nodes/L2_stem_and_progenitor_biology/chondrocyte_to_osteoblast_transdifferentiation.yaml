id: chondrocyte_to_osteoblast_transdifferentiation
name: Chondrocyte-to-osteoblast transdifferentiation
aliases:
- chondrocyte-derived osteoblast
- cartilage-to-bone lineage continuum
type: process
summary: 'A century-old question was settled in mice in 2014 by two independent groups using different
  drivers. With Col10a1-Cre (constitutive, hypertrophic-chondrocyte-specific) and Agc1-CreERT2 (tamoxifen-inducible,
  chondrocyte-specific), neither of which labels perichondrium, periosteum or any osteoblast-lineage cell
  at induction, labelled descendants appear as osteocalcin-positive, 2.3kb-Col1a1-GFP-positive osteoblasts
  on trabecular surfaces and endosteum and as embedded osteocytes. The magnitude is large: about 63% of
  trabecular osteocalcin+ cells and 62% of endosteal osteocalcin+ cells were chondrocyte-derived in one-month-old
  mice, and about 60% of trabecular and 68% of endosteal Col1-GFP+ osteoblasts in three-week-old mice.
  Independent work using inducible recombination showed the same cells survive the cartilage-to-bone transition
  and persist into adulthood. Dual-recombinase fate mapping later added the temporal boundary: chondrocytes
  are the main osteoblast source only before adolescence, after which LepR+ marrow stroma takes over,
  starting in the diaphysis. The residual controversy is quantitative and technical rather than existential
  - the authors themselves flag that 60% could be an overestimate if Col10a1-Cre had any ectopic activity,
  and Cre-driver specificity is the standing objection. No human measurement of this fraction exists.'
