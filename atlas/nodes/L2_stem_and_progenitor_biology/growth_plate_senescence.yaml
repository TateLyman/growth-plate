id: growth_plate_senescence
name: Growth plate senescence
aliases:
- programmed growth plate senescence
- growth plate maturation
type: process
summary: 'Growth plate senescence is the coordinated, age-related decline in plate function: falling chondrocyte
  proliferation rate, decreasing plate height, fewer resting zone cells per unit area, reduced hypertrophic
  cell size and altered matrix - not cellular senescence in the p16/SASP sense. It is intrinsic and local
  rather than systemic, demonstrated by local catch-up growth after local glucocorticoid in rabbit, and
  it is division-dependent rather than time-dependent, demonstrated by the PARTIAL conservation of growth
  potential during growth-inhibited periods in rabbit and rat. Partial is the operative word and is
  frequently dropped: in the rat propylthiouracil model that carries this claim, catch-up growth was
  statistically INCOMPLETE at final measurement for body mass, tail length and tibia length, and the
  authors offer two explanations for the shortfall, both of which entail that the stem-cell division
  budget is not perfectly conserved (marino2008). That study also suppressed the gonadal axis only
  incompletely - uterine mass ~0.16 g against ~0.1 g ovariectomised and ~0.5 g intact - leaving
  oestrogen, the leading alternative driver of plate senescence, present and potentially unequal
  between arms. It is molecularly accompanied by progressive loss
  of global DNA methylation in resting zone chondrocytes, an effect specific to slow in vivo resting-zone
  proliferation. Ageing also acts on the progenitor compartment more broadly, though on a DIFFERENT compartment:
  aged (24-month) mouse marrow and periosteal skeletal stem cells lose bone and cartilage potential and
  produce an inflammatory, pro-resorptive stroma not reversed by heterochronic parabiosis (ambrosi2021).
  Those are not growth plate resting-zone chondrocytes, and in that study growth plate attenuation appears
  only as a descriptive ageing correlate, so this evidence bounds the systemic niche, not the clock
  internal to the plate. The division economy of the resting zone is now in question from the other direction: PTHrP+
  resting-zone chondrocytes acquire self-renewing stem cell behaviour after secondary ossification centre
  formation (mizuhashi2018, newton2019), which is hard to reconcile with a strictly fixed, finite division
  budget and has never been tested against the senescence model. The species
  boundary is critical: rodent plates senesce nearly to cessation without fusing, so senescence and fusion
  are separable processes, and human growth plate senescence has been characterised histologically but
  never functionally.'
quantitative: []
localization:
- 'rabbit and rat growth plate: measured across age (schrier2006, marino2008)'
- 'human growth plate: histological description only'
human_evidence: indirect
human_evidence_note: Human evidence is the clinical growth-velocity curve and its response to removing
  growth-inhibiting conditions; there are no direct human measurements of plate proliferative kinetics
  across age.
species_basis:
- rabbit
- rat
- mouse
- human
translation_risk: moderate
translation_risk_reason: 'The phenomenon is cross-species and matches human growth curves, but its endpoint
  differs: rodents never fuse, so the terminal phase of human senescence has no faithful model.'
confidence: B
