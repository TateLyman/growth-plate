id: periosteal_stem_cell
name: Periosteal stem cell (PSC)
aliases:
- CTSK-lineage periosteal stem cell
- PSC
type: cell_type
summary: 'Cathepsin K-cre unexpectedly labels periosteal rather than osteoclastic mesenchyme from E14.5
  onward, and within the CTSK-lineage mesenchymal cells three populations separate on flow cytometry,
  all THY- 6C3- CD49f-dim CD51-dim: PSC (CD200+ CD105-), periosteal progenitor 1 (CD200- CD105-) and periosteal
  progenitor 2 (CD105+, CD200 variable). PSCs show clonal multipotency and self-renewal and sit at the
  apex of this hierarchy; they mediate intramembranous bone formation, which is the functional distinction
  from the endosteal compartment. The uncomfortable observation for the field is that the PSC immunophenotype
  (CD200+CD105-Thy-6C3-) is the same as the mSSC immunophenotype - the two are separated by anatomy and
  by Ctsk lineage history, not by surface markers. Subsets of CTSK-lineage cells also express Gremlin1
  and Nestin, so three published ''distinct'' stem cell schemes intersect within the periosteum.'
