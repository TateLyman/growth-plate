localization:
- 'mouse PZ columns: confirmed clonal by Confetti (mizuhashi2018) and by multicolour clonal tracing (newton2019)'
- 'human PZ columns: unconfirmed - clonality cannot be assayed'
human_evidence: absent
human_evidence_note: Column clonality in humans has never been measured; no method exists to do so in
  vivo.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Clonality is defined by multicolour Cre reporters. Human columns are morphologically
  similar but their clonal structure is unknown, and the mouse clonal switch is tied to a postnatal window
  that has no verified human equivalent.
