id: monoclonal_column_formation
name: Monoclonal column formation in the growth plate
aliases:
- clonal column
- chondrocyte column clonality
type: process
summary: 'A chondrocyte column is the unit of longitudinal growth, and whether a column is a clone is
  the operational test of resting-zone stemness. In mouse, PTHrP-creER;Confetti labelling gives columns
  each marked by a single colour, and PTHrP-creER-labelled cells first make short columns (<10 cells,
  peaking at P18) then long columns (>10 cells, appearing at P18 and increasing to P36), with the number
  of labelled columns falling until about 6 months of chase and then plateauing. Multicolour clonal tracing
  independently showed a switch: during fetal and neonatal growth, progenitors are consumed and columns
  are polyclonal or transient, whereas later in life large stable monoclonal columns appear, with progenitors
  adopting symmetric division and expressing stem cell markers. Dlx5-creER-labelled proliferative and
  hypertrophic chondrocytes make only short columns that disappear, confirming that column founders live
  above the proliferative zone. Hedgehog and mTORC1 signalling set the size of the self-renewing pool.
  No human column has ever been shown to be clonal.'
quantitative:
- parameter: Short columns (<10 cells) from PTHrP-creER P6 pulse, peak
  value: P18
  unit: postnatal day of peak
