id: clonal_exhaustion
name: Clonal exhaustion of growth plate progenitors
type: process
summary: 'Clonal exhaustion is the loss of individual founder clones from the growth plate over time,
  as distinct from a fall in per-cell proliferation. It is directly visible in mouse lineage tracing:
  after a single P6 PTHrP-creER pulse the number of labelled columns falls progressively until about six
  months of chase and then plateaus, meaning most labelled founders stop contributing while a minority
  persist for at least a year. In vitro the same asymmetry appears as a small tail of long-lived clones
  - 12.5% of secondary colonies from a P12 pulse could be passaged nine times, giving roughly 2-3% of
  PTHrP+ colony-forming cells with long-term self-renewal, and 9% of FoxA2+ colonies versus 1.4% of PTHrP+
  colonies reaching late passage. Clonal exhaustion therefore behaves like neutral drift with a surviving
  minority rather than synchronous failure of a whole compartment. Interventions that consume the pool
  accelerate it: growth hormone reduces the slow-cycling label-retaining population by pushing cells into
  transit-amplifying differentiation.'
quantitative:
- parameter: Time at which labelled column number plateaus after a single P6 pulse
  value: '6'
  unit: months of chase
  conditions: PTHrP-creER;tdTomato mouse
  species: mouse
