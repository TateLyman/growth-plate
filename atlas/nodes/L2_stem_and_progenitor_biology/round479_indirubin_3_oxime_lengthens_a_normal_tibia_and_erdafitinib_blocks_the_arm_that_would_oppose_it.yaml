id: round479_indirubin_3_oxime_lengthens_a_normal_tibia_and_erdafitinib_blocks_the_arm_that_would_oppose_it
name: >-
  R479 - indirubin-3-oxime raises tibial length in NORMAL mice with body weight controlled, it is the clean
  GSK3-beta arm of the KY19382 chemotype, and kapadia2005's sign was recorded backwards in R462
aliases:
  - I3O indirubin-3-oxime
  - GSK3 beta inhibition limb length
  - kapadia2005 sign correction
type: intervention
layer: L2
stub: false
confidence: C
last_verified: '2026-08-27'
species_basis: mouse
human_evidence: absent
human_evidence_note: >-
  No indirubin compound has been given to a human with any skeletal endpoint. The human anchor for the axis is
  absent in both directions - CXXC5 is not in kosmicki2026's 207 and neither is any GSK3 paralogue.
translation_risk: high
translation_risk_reason: >-
  Research reagent, intraperitoneal route, mouse only, all in vivo magnitudes figure-only, and the compound class
  is a broadly kinase-active chemotype whose selectivity was not profiled by a kinome scan.
summary: >-
  THE OPERATOR OPENED THE LIMB COMPARTMENT AND THIS IS THE CANDIDATE WITH THE CLEANEST TIBIAL ENDPOINT. Read in
  full from the publisher PDF. NORMAL three-week-old C57BL/6 mice, indirubin-3-oxime at 0.05 or 0.5 mg/kg
  INTRAPERITONEALLY, DAILY, FOR TEN WEEKS, n=13 per group: TIBIAL LENGTH INCREASED DOSE-DEPENDENTLY, marked at
  P<0.05 and P<0.005, with BODY WEIGHT NOT DIFFERING ACROSS THE TEN WEEKS. Per campion2022tofacitinib a length
  endpoint must be read against body weight before it is read as a bone effect, and here that control is run and
  passed. Micro-computed tomography found no trabecular or cortical difference at n=5, articular cartilage was
  unchanged and liver histology was unchanged.
  AND THE ZONE DECOMPOSITION PASSES CORR-292 WITH THE RESORPTION CONTROL ACTUALLY RUN, WHICH IS RARE HERE. A
  separate two-week arm at 0.5 mg/kg, n=5, P<0.0005: HYPERTROPHIC ZONE HEIGHT UP with RESTING AND PROLIFERATIVE
  ZONE HEIGHTS UNCHANGED, BrdU-positive cells UP at P<0.005, and TRAP-POSITIVE FOCI AT THE CARTILAGE-BONE
  INTERFACE UNCHANGED. A taller hypertrophic zone with unchanged resorption and a longer bone is charge WITH
  discharge, not the jam that has failed nine times in this file - and it is the same pairing R469 credited to
  ADAM12-S.
  IT IS ALSO THE MISSING CONTROL FOR AN ARM THIS FILE ALREADY WORKS. R460 and R473 built on KY19382, which raises
  tibial length about 2.9 per cent over ten weeks from three weeks of age - the same chemotype, the same schedule,
  the same strain. R462's central objection to KY19382 is that it is DUAL, inhibiting CXXC5-DVL at 1.9e-8 M and
  GSK3-beta at 1e-8 M, so a beta-catenin-dependent result cannot separate the two routes. INDIRUBIN-3-OXIME IS THE
  PARENT INDIRUBIN WITH NO CXXC5 ARM, AND IT WORKS. That does not prove KY19382 acts through GSK3-beta, but it
  removes the possibility that the GSK3-beta route is inert.
  AND KAPADIA2005'S SIGN WAS RECORDED BACKWARDS IN R462, IN THE DIRECTION THAT MATTERS FOR THIS SUBJECT. R462
  recorded it as an objection - that KY19382's GSK3-beta arm is predicted to be ATTENUATED in a subject on a
  continuous pan-FGFR inhibitor. Read verbatim, kapadia2005 reports that inhibition of GSK3 strongly REPRESSED
  chondrocyte and perichondrial osteoblast differentiation and INHIBITED chondrocyte proliferation, mechanistically
  through beta-catenin to FGF18 to FGFR3, and that the effect of GSK3 inhibition on chondrocyte proliferation IS
  REPRESSED IN TISSUES LACKING FGFR3. THE ARM THAT IS ATTENUATED BY REMOVING FGFR3 IS THE SUPPRESSIVE ONE. So a
  subject on a pan-FGFR inhibitor is the one in whom GSK3 inhibition's own built-in negative-feedback brake is
  pharmacologically blocked.
  THE LIMITS OF THAT CORRECTION, STATED BEFORE ANYONE USES IT. kapadia2005 is EX VIVO metatarsal culture; its
  inhibitors are SB216763 and lithium, not an indirubin; it characterised only the SUPPRESSIVE regime, so it is
  genuinely ambiguous whether removing FGFR3 also abolishes a low-dose stimulatory effect rather than only the
  brake; and the combination of a GSK3 inhibitor with an FGFR inhibitor has never been given to any animal. Grade
  E for the interaction, grade C for the compound's own endpoint.
  AND WHAT ARGUES AGAINST THE WHOLE AXIS IS ALREADY IN THIS FILE AND IS BETTER POWERED THAN THE POSITIVE.
  R462 holds harvey2015 - oral lithium chloride at 20 mg/kg/day in growing broilers, n=48 PER GROUP, no difference
  in bone length at P at least 0.52, with femoral stiffness falling about 22 per cent. And R462's dose ladder puts
  every intracellular Wnt-raising perturbation above the mildest at shorter or dead: Gsk3b single cartilage
  conditional knockout is null, the Gsk3a/Gsk3b double gives SHORTER long bones and is lethal, and postnatal
  stabilised beta-catenin gives growth retardation with PREMATURE GROWTH PLATE CLOSURE. If the window is real it is
  narrow, and 0.05-0.5 mg/kg is at the very bottom of the range others use for this compound - the paper notes
  anti-osteoporosis and anti-obesity work at 10 mg/kg, so this is 20 to 200 times lower.
  OBTAINABILITY, UNDER R401'S THREE-WAY SPLIT. No approved medicine. Chemical matter real and catalogued -
  indirubin-3-oxime is an ordinary research reagent. No purchasable pharmaceutical-grade material, no human
  exposure of any indirubin with a skeletal endpoint, and the only in vivo route demonstrated is intraperitoneal.
quantitative:
  - parameter: tibial length after indirubin-3-oxime in NORMAL mice
    value: increased dose-dependently at 0.05 and 0.5 mg/kg
    unit: 'marked P<0.05 and P<0.005; magnitudes are FIGURE-ONLY, no mm or per cent in the text'
    species: mouse
    source_ref: choi2019i3o
    note: >-
      Three-week-old C57BL/6, intraperitoneal, DAILY, TEN WEEKS, n=13 per group. CORR-318 applies to the magnitude.
  - parameter: body weight across the ten-week dosing period
    value: not different
    unit: between vehicle and either dose, Supplementary Figure S1c
    species: mouse
    source_ref: choi2019i3o
    note: >-
      The campion2022tofacitinib control, run and passed - so the length gain is not a body-size artefact.
  - parameter: growth-plate zone decomposition, two-week arm at 0.5 mg/kg
    value: hypertrophic zone height UP, resting and proliferative zone heights UNCHANGED
    unit: 'n=5, P<0.0005; BrdU-positive cells UP at P<0.005'
    species: mouse
    source_ref: choi2019i3o
    note: >-
      An h_term signature with the pool terms flat, which is the opposite decomposition from PORCN inhibition.
  - parameter: TRAP-positive foci at the cartilage-bone interface
    value: unchanged
    unit: two-week arm
    species: mouse
    source_ref: choi2019i3o
    note: >-
      THE CONTROL THAT SEPARATES h_term FROM A JAM. The hypertrophic expansion is not delayed resorption, so the
      taller zone is accompanied by an unchanged discharge rate and a longer bone.
  - parameter: dose relative to other in vivo uses of the same compound
    value: 20 to 200-fold lower
    unit: 0.05-0.5 mg/kg here against 10 mg/kg in anti-osteoporosis and anti-obesity work
    species: mouse
    source_ref: choi2019i3o
    note: Stated by the authors. Consistent with R462's finding that harder pushes on this axis shorten.
  - parameter: effect of GSK3 inhibition on chondrocyte proliferation in tissues lacking FGFR3
    value: repressed
    unit: ex vivo metatarsal culture, SB216763 and lithium
    species: mouse
    source_ref: kapadia2005
    note: >-
      THE SIGN R462 RECORDED BACKWARDS. GSK3 inhibition SUPPRESSES chondrocyte proliferation and differentiation
      through beta-catenin to FGF18 to FGFR3, so removing FGFR3 removes the SUPPRESSIVE arm. It does not establish
      that a stimulatory arm survives, which is the unresolved half.
