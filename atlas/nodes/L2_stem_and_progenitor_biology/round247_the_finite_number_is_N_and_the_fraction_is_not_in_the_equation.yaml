id: round247_the_finite_number_is_N_and_the_fraction_is_not_in_the_equation
name: >-
  ROUND 247 - the question posed properly and answered. THE SELF-RENEWAL FRACTION CANCELS OUT OF THE OUTPUT
  EQUATION ENTIRELY - committed output is exactly one cell per stem division for EVERY value of r. What is
  finite is N, the resting zone progenitor number, and oestrogen depletes it IRREVERSIBLY AND WITHOUT
  APOPTOSIS while suppressing every other term REVERSIBLY
type: hypothesis
layer: L2
aliases:
- the fraction is not in the equation
- N is the finite number
- reversible versus irreversible
- lambda N A h_term
- round 247
stub: false
summary: |
  THE INSTRUCTION WAS TO ASK WHAT DRAGS THE SELF-RENEWAL FRACTION BELOW ONE HALF AS A PLATE CLOSES, BECAUSE
  THE DIRECTION HAS TO BE RESHAPING HEIGHT RATHER THAN VELOCITY. Asking it properly dissolves it: THE
  FRACTION IS NOT IN THE OUTPUT EQUATION AT ALL.

  ONE - THE ALGEBRA, WHICH TAKES TWO LINES AND WHICH THIS PROGRAMME NEVER WROTE DOWN. Under population
  asymmetry a stem division has three outcomes: symmetric renewal with probability r giving two stem and
  zero committed, symmetric loss with probability r giving zero stem and two committed, and asymmetric with
  probability 1-2r giving one of each. Expected change in stem number is r - r = ZERO for every r, which is
  what neutral means. AND EXPECTED COMMITTED OUTPUT IS 2r + (1-2r) = EXACTLY ONE, FOR EVERY r. THE r
  CANCELS.

  SO THE SELF-RENEWAL FRACTION IS A DISPERSION PARAMETER, NOT A PRODUCTION PARAMETER. It sets how fast
  lineages are lost to drift - the clone-size scatter and the 138-day lineage half-life round 246 derived -
  and it sets nothing about how much cartilage is made. Round 246 was right that it is pinned and WRONG to
  treat reaching neutrality as a goal. NEUTRALITY IS A CONSTRAINT THAT KEEPS N FROM COLLAPSING. IT IS NOT A
  SOURCE OF HEIGHT.

  WHAT REPLACES IT: HEIGHT = the integral over the plate's lifetime of lambda x N x A x h_term, where lambda
  is the stem division rate, N the stem number, A the transit amplification a committed daughter undergoes
  in the proliferative zone, and h_term the terminal hypertrophic cell height. FOUR TERMS, AND THEY ARE NOT
  INTERCHANGEABLE, BECAUSE ONLY THE FIRST TWO ARE COUPLED TO THE SENESCENCE COUNTER.

  TWO - THE QUESTION, ANSWERED. WHAT MAKES THE SYSTEM NON-NEUTRAL IS OESTROGEN, AND THE EVIDENCE SPLITS ITS
  EFFECTS EXACTLY ALONG THE LINE THE ALGEBRA DRAWS. nilsson2014 gave ovariectomised juvenile rabbits
  oestradiol for five weeks then left them UNTREATED FOR FIVE MORE - the withdrawal arm is the whole design
  and it is what makes the paper decisive.

  REVERSIBLE, all normalising after withdrawal: GROWTH RATE, CHONDROCYTE PROLIFERATION RATE, AND
  HYPERTROPHIC CELL SIZE. Those are lambda and h_term.

  IRREVERSIBLE, still advanced five weeks after withdrawal: growth plate height, number of proliferative and
  hypertrophic chondrocytes, and RESTING ZONE CHONDROCYTE NUMBER. That is N. AND THE RESTING ZONE LOSS DID
  NOT APPEAR TO BE DUE TO APOPTOSIS - the cells left by COMMITMENT, not by death, which is precisely net
  stem exit. Transient exposure hastened epiphyseal fusion.

  SO THE FINITE NUMBER THE PROGRAMME HAS BEEN CIRCLING IS N, AND OESTROGEN SPENDS IT PERMANENTLY WHILE
  SUPPRESSING EVERYTHING ELSE ONLY TEMPORARILY. That is a clean answer to a question that had no answer in
  this atlas an hour ago, and it was sitting in a paper the bibliography already held with a one-line
  summary that said only 'estrogen irreversibly depletes resting zone progenitor cell number'.

  THREE - THE ONE INTERVENTION THAT HAS EVER RAISED N, AND WHY IT DOES NOT HELP. schrier2006, same
  laboratory: dexamethasone for two weeks LOWERED resting zone proliferation (P < 0.001) while RAISING
  resting zone cell number (P = 0.016), with IGF-I unchanged. N IS NOT A ONE-WAY RATCHET - IT CAN BE PUSHED
  UP. But it went up because lambda went down, which is exactly the algebra: fewer stem divisions means
  fewer commitment events. This is arm3's trap in its purest form - the counter is slowed BY SLOWING GROWTH,
  and arm3_pool_ceiling_is_imposed_not_intrinsic already established that every such intervention delays
  the programme by suppressing output rather than sparing it.

  AND schrier2006 CONTAINS A NEGATIVE THAT MUST BE CARRIED: at two weeks, oestrogen lowered proliferation
  (P = 0.011) and left resting zone cell number UNCHANGED. nilsson2014 needed five weeks to see the
  depletion. TWO STUDIES FROM ONE LABORATORY DISAGREEING BY DURATION IS NOT A CONTRADICTION, BUT IT MEANS
  THE DEPLETION IS SLOW AND THE SHORT-EXPOSURE NULL IS REAL.

  FOUR - THE TERM THAT IS FREE, AND THE EVIDENCE THE ATLAS ALREADY HELD WITHOUT DRAWING THE CONCLUSION.
  Raising A costs no stem divisions: every amplification division happens in a cell that has ALREADY left
  the stem compartment and is already committed to being spent. The obvious objection is that the
  senescence counter might be advanced by total divisions rather than stem divisions, in which case A is not
  free and everything collapses back to velocity.

  nilsson2005's TRIPLE SPECIFICITY, already at grade B in this atlas, bears on that directly and nobody has
  used it this way. Global methylation falls with age in resting zone cartilage, but it DOES NOT DIFFER
  BETWEEN THE RESTING AND HYPERTROPHIC ZONES AT ANY SINGLE AGE. Hypertrophic cells are the descendants of
  resting cells that have since undergone the entire amplification series. IF AMPLIFICATION DIVISIONS
  ADVANCED THE COUNTER, THE HYPERTROPHIC ZONE SHOULD BE LOWER THAN THE RESTING ZONE. IT IS NOT. The same
  paper's second specificity points the same way - the loss does NOT occur during the far more rapid
  replication of the same cells in culture.

  THAT IS AN INFERENCE FROM A NULL AND IS GRADED AS ONE. A null between two zones sampled at one age can
  hide a real effect, the assay is global methylation rather than the counter itself, and nobody has ever
  measured senescence markers as a function of amplification number. BUT IT IS THE ONLY EVIDENCE EITHER WAY,
  AND IT FAVOURS A BEING FREE.

  FIVE - WHAT THIS DOES TO THE STACK, INCLUDING THE PART THAT CONTRADICTS IT. If N is the irreversible term
  and oestrogen is what spends it, protecting N should be the highest-value action available, and the stack
  already contains an aromatase inhibitor.

  BUT THE ATLAS HOLDS A GRADE A RESULT THAT CUTS AGAINST THAT: head to head over three years in 79 pubertal
  boys, anastrozole versus letrozole, A THREEFOLD DIFFERENCE IN THE INTENSITY OF OESTROGEN SUPPRESSION
  BOUGHT NO DIFFERENCE IN PREDICTED ADULT HEIGHT, with a combined three-year gain of only +1.3 cm. Taken
  alone that says oestrogen suppression is not rate-limiting.

  THE ATLAS ALSO HOLDS, AT GRADE B, A REASON THE TWO MIGHT BOTH BE TRUE. the_intracrine_oestrogen_control_
  point establishes that the growth plate runs the ENTIRE intracrine steroid pathway - aromatase,
  17beta-HSD types I and II, STEROID SULFATASE and 5alpha-reductase are all transcribed in proliferating and
  hypertrophic chondrocytes - and that aromatase inhibition does NOT block the sulfatase route from the
  oestrone sulfate pool, which is the established mechanism of aromatase-inhibitor resistance in breast
  cancer. SYSTEMIC OESTROGEN SUPPRESSION IS NOT PLATE OESTROGEN SUPPRESSION. That is a reconciliation
  hypothesis, it is not tested in a growth plate, and it is recorded as such rather than as a rescue.

  SIX - WHAT IS NOW OPEN, WHICH IS DIFFERENT FROM WHAT WAS OPEN THIS MORNING.

  - Does the falling resting zone cell number mean fewer STEM cells, or a smaller resting compartment of
    which stem cells are a minority? nilsson2014 counted resting zone chondrocytes, not marker-defined stem
    cells, and chu2026 says GP1 is one of two populations in that zone.
  - Is oestrogen's depletion cell-autonomous or does it act through the niche? ESR1 is expressed in the
    plate, but nothing localises the effect to the root cell.
  - DOES ANYTHING RAISE N WITHOUT LOWERING LAMBDA? Still nothing, in any species. This is the same empty
    cell stem_pool_size_versus_flux identified from a different direction, and it remains the place a height
    therapy would have to live.
  - AND THE DECISIVE ONE: does amplification advance the counter? Measure senescence markers as a function
    of amplification number rather than of age. If A is free, the whole downstream half of the equation is
    available and the FGFR and CNP arms are on the right side of the line. If it is not, everything is
    velocity and the programme's ceiling is much lower than it has been assuming.
quantitative:
- parameter: >-
    expected committed output per stem division under population asymmetry, as a function of the
    self-renewal fraction r
  value: 'exactly 1 for every r; expected change in stem number exactly 0 for every r'
  unit: committed daughters produced per stem cell division
  conditions: >-
    three-outcome population-asymmetry model - symmetric renewal probability r, symmetric loss probability
    r, asymmetric probability 1-2r - which is the mode chu2025 demonstrates for the growth plate
  species: not_applicable
  source_ref: chu2025
  uncertainty: >-
    ALGEBRA, NOT MEASUREMENT. It holds only where the neutral assumption holds; a non-neutral system with
    renewal below loss produces MORE than one committed cell per division while shrinking, which is exactly
    what a closing plate is doing. The model also treats the stem compartment as homogeneous, and
    clonal_exhaustion records that it is not - roughly 2 to 3 per cent of PTHrP+ colony-forming cells show
    long-term self-renewal against a majority that do not
- parameter: >-
    oestrogen's effects on the growth plate separate by REVERSIBILITY, and the split maps exactly onto which
    terms of the output equation are coupled to the senescence counter
  value: >-
    'IRREVERSIBLE after 5 weeks of withdrawal: growth plate height, proliferative and hypertrophic cell
    number, and RESTING ZONE CELL NUMBER, the last NOT by apoptosis. REVERSIBLE, normalising after
    withdrawal: growth rate, chondrocyte proliferation rate, hypertrophic cell size'
  unit: persistence of the effect five weeks after treatment stopped
  conditions: >-
    ovariectomised juvenile rabbits, estradiol cypionate for 5 weeks then 5 weeks untreated, proximal tibia
    and distal femur
  species: rabbit
  source_ref: nilsson2014
  uncertainty: >-
    READ FROM THE ABSTRACT - the full text is not open access and was not obtained, so no effect sizes,
    group sizes or P values are recorded here. Rabbit. And 'resting zone chondrocytes' is a histological
    compartment count, not a marker-defined stem cell count
  value_unverified: true
- parameter: >-
    the only intervention on record that RAISES resting zone cell number - and it does so by lowering
    proliferation, which is the trap rather than the escape
  value: 'dexamethasone 0.5 mg/kg/d for 2 weeks: resting zone proliferation DOWN (P < 0.001), resting zone
    cell number UP (P = 0.016), IGF-I unchanged'
  unit: BrdU labelling index and cells per mm in the resting zone
  conditions: rabbit, distal femur and proximal tibia
  species: rabbit
  source_ref: schrier2006
  uncertainty: >-
    two weeks only; and the same study found oestrogen at two weeks lowered proliferation (P = 0.011) while
    leaving resting zone cell number UNCHANGED, so the depletion nilsson2014 reports at five weeks is not
    visible at two
- parameter: >-
    evidence that amplification divisions do NOT advance the epigenetic senescence counter - the null that
    makes A a free term
  value: >-
    'global methylation in resting zone cartilage falls with age but DOES NOT DIFFER between resting and
    hypertrophic zones at any single age, and does NOT fall during far more rapid replication of the same
    cells in culture'
  unit: global DNA methylation, zone-versus-zone and in-vivo-versus-culture comparisons
  conditions: rabbit growth plate, resting versus hypertrophic zone at matched ages
  species: rabbit
  source_ref: nilsson2005
  uncertainty: >-
    AN INFERENCE FROM A NULL, AND NULLS ARE WEAK. Hypertrophic cells are recent descendants of resting cells
    and have undergone the amplification series, so if amplification advanced the counter the hypertrophic
    zone should read lower - but a two-zone comparison at one age can hide a real effect, global methylation
    is a proxy for the counter rather than the counter, and NOBODY HAS MEASURED SENESCENCE AS A FUNCTION OF
    AMPLIFICATION NUMBER. This is the decisive missing experiment
localization:
- 'rabbit resting zone: where the irreversible cell-number loss occurs, without apoptosis'
- 'the proliferative zone: where A lives, downstream of the stem compartment and of the counter'
human_evidence: indirect
human_evidence_note: >-
  The reversibility split and the depletion are rabbit. The human input is the grade A anastrozole head-to-
  head, which cuts AGAINST the therapeutic reading of this mechanism, and the grade B intracrine node that
  offers a reason both could be true. No human measurement of resting zone cell number over time exists.
species_basis:
- rabbit
- human
translation_risk: high
translation_risk_reason: >-
  Every mechanistic number is rabbit. The one human test of the implied intervention - suppressing oestrogen
  to protect N - found a threefold difference in suppression intensity bought no predicted height, and the
  proposed reconciliation via the sulfatase bypass is untested in cartilage. The algebra transfers between
  species but tells you nothing about magnitudes.
confidence: C
confidence_reason: >-
  The algebra is exact but is algebra. The reversibility split is a single rabbit study read from its
  abstract, which is D on its own, though it is corroborated in direction by weise2001 and schrier2006 from
  the same programme. The claim that A is free rests on an inference from a null. Graded C for the framework
  and the individual rows carry their own limits; the therapeutic reading is explicitly NOT graded, because
  the only human test of it is negative.
