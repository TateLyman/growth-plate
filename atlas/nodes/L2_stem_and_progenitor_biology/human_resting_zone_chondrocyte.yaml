id: human_resting_zone_chondrocyte
name: Human resting zone chondrocyte
type: cell_type
summary: 'What is actually known about human resting zone chondrocytes comes from two 2025-2026 studies
  on rare surgical specimens, because human growth plate tissue is otherwise inaccessible and lineage
  tracing is impossible. Spatially resolved transcriptomics of healthy adolescent biopsies produced zonal
  marker sets and showed that a subset of resting chondrocytes is functionally quiescent in vivo - predominantly
  nuclear mRNA, abundant heterochromatin, and the ability to exit G0 under defined ex vivo conditions
  - and resolved overlapping sub-populations in which CHRDL2+ and/or SFRP5+ cells are among the least
  quiescent. Independently, single-cell plus spatial analysis of early pubertal plates resolved two stem-like
  resting populations, one of which is PTHLH-negative. Disease genes map onto zones: NKX3-2, SGMS2 and
  WNK4 expression is restricted to specific human growth plate zones. None of this establishes self-renewal,
  clonal output, or lifespan of any human resting cell; those remain formally untested and, by current
  methods, untestable in vivo.'
