id: cxcl12_abundant_reticular_cell
name: CXCL12-abundant reticular (CAR) cell
aliases:
- CAR cell
- adipo-osteogenic progenitor
type: cell_type
summary: 'CAR cells are reticular marrow stromal cells producing high CXCL12 and SCF. Short-term in vivo
  ablation of CAR cells does not destroy the candidate niches (bone-lining osteoblasts, endothelium) but
  severely impairs the adipogenic and osteogenic differentiation potential of marrow cells and cuts CXCL12
  and SCF production, reducing HSC number and cell size and driving HSCs into quiescence, with a marked
  loss of cycling lymphoid and erythroid progenitors. They are therefore an adipo-osteogenic progenitor
  and a hematopoietic niche cell simultaneously. Their relevance to this layer is that they are a documented
  terminal destination of growth plate output: PTHrP-creER-labelled resting chondrocyte descendants leave
  the plate and become Cxcl12-GFP+ stromal cells beneath the labelled columns, with the number of double-positive
  cells rising for the first three months of chase and then plateauing. CAR cells overlap heavily with
  LepR+ stroma (LepR+ cells are Cxcl12-DsRed-high), which is one reason the marrow stromal nomenclature
  is unresolved.'
quantitative:
- parameter: Time to plateau of chondrocyte-derived Cxcl12-GFP+ stromal cells
  value: '3'
  unit: months of chase
  conditions: PTHrP-creER pulsed at P6, mouse
  species: mouse
  source_ref: mizuhashi2018
  uncertainty: osteoblast-derived counts fell after the same point
localization:
- 'mouse marrow reticular network: confirmed (omatsu2010)'
- 'mouse primary spongiosa beneath labelled columns: confirmed as chondrocyte-derived (mizuhashi2018)'
human_evidence: absent
human_evidence_note: CAR cell identity and ablation experiments are murine; no equivalent human population
  has been functionally defined.
species_basis:
