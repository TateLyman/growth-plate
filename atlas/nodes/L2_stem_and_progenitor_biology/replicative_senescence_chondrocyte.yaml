id: replicative_senescence_chondrocyte
name: Replicative (Hayflick) senescence of growth plate chondrocytes
type: process
summary: 'The intuitive molecular explanation for a finite proliferative capacity is classical replicative
  senescence - a cell-autonomous division counter of the Hayflick type. The decisive test was done and
  it failed: rabbit resting zone chondrocytes harvested from young and old animals achieved the same number
  of population doublings in culture, so the in vivo limit is not carried by the cells as a fixed replicative
  reserve that survives explantation. The same study found that global DNA methylation declined with in
  vivo growth plate senescence but not during rapid proliferation in vitro or across the resting-to-hypertrophic
  transition, which argues for an epigenetic timer coupled specifically to slow in vivo resting-zone division
  rather than for telomere-driven crisis. This node is therefore a negative result that is frequently
  re-asserted as positive in secondary literature; treat ''growth plate chondrocytes undergo replicative
  senescence'' as unsupported in its cell-autonomous form.'
quantitative:
- parameter: Population doublings of cultured rabbit RZ chondrocytes vs donor age
  value: no dependence
  unit: population doublings
  conditions: rabbit resting zone chondrocytes in vitro
  species: rabbit
