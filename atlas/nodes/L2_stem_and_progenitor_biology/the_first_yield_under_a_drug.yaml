contradicts:
- 'CLOSES the measurement half of g_l2_raise_the_yield_per_progenitor, which recorded that the yield had
  never been measured in any species. It still has not been MEASURED - it has now been COMPUTED, twice, by
  two independent routes from one published experiment, and the two agree to two per cent.'
- 'REFINES the_exchange_rate_between_growth_and_pool_depletion. That node inferred from schrier2006 that
  oestrogen must be lowering the yield because both observable state variables were excluded. It is now
  quantified at 0.57, and the node''s implicit assumption that the effect is banked is WRONG - the yield
  recovers on washout even though the pool does not.'
