localization:
- 'the proliferative column: where the 91 per cent sits - divisions obtained per progenitor consumed'
- 'the resting zone: the denominator, and the compartment whose loss is the irreversible half'
human_evidence: absent
human_evidence_note: 'Rabbit, one experiment, ovariectomised and juvenile. No human yield has ever been
  computed and the three measurements it needs have never been reported together in a human growth plate.
  The reversibility finding is the one most likely to transfer, because it concerns a drug effect rather
  than a species-specific plate architecture.'
species_basis:
- rabbit
translation_risk: high
translation_risk_reason: 'One experiment in one species, with every value read off a published plot by
  eye. The ratio construction is robust to the unit convention and to the net-versus-gross bias because
  both arms carry them equally, but nothing protects against a species difference or against a single
  study being wrong.'
confidence: C
claim_grades:
- claim: Oestrogen lowers the number of proliferative divisions obtained per resting-zone chondrocyte
    consumed.
  grade: C
  basis: 'PROPOSED IN 2006, RESTATED IN 2014, QUANTIFIED HERE FOR THE FIRST TIME AT 0.57 OF VEHICLE. Two
    independent constructions from the same experiment agree - 0.57 from growth rate and terminal cell size,
    0.55 from BrdU flux, sharing only the denominator. C not B because every input is read off a plot by
    eye, it is one experiment in one species, and the resting-zone loss is net rather than gross.'
- claim: The oestrogen yield effect is carried by amplification rather than by terminal cell size.
  grade: C
  basis: 'Amplification 0.598 against terminal cell size 0.953, so 91 per cent of the log effect. It
    replicates the round-174 mouse between-bone figure of 88 per cent in a different species using a drug
    rather than an anatomical contrast, which is the strongest form of agreement available here - the two
    analyses share no data and no design.'
- claim: The yield suppression persists after oestrogen is withdrawn.
  grade: X
  basis: 'NO, AND THIS IS THE MOST DECISION-RELEVANT LINE IN THE NODE. Over the five-week washout the
    oestrogen arm ran at 1.12 of vehicle by the length route and 0.88 by the BrdU route - bracketing unity.
    The 43 per cent on-treatment deficit is gone. What does NOT recover is the pool: the resting-zone
    deficit created during treatment is still present at 21 weeks. Oestrogen damages the DENOMINATOR
    permanently and the EXCHANGE RATE only while present.'
- claim: Anastrozole protects the yield.
  grade: E
  basis: 'INFERENCE FROM THE MIRROR IMAGE, AND IT IS A NEW JUSTIFICATION FOR AN AGENT ALREADY IN THE STACK.
    If oestrogen exposure lowers the yield to 0.57 while present and the effect reverses on withdrawal,
    then removing oestrogen should hold the yield at its untreated trajectory - worth roughly the doubling
    of decay rate that oestrogen imposes. E because no aromatase inhibitor has ever had a yield computed
    under it, in any species, and an inhibitor is not the same as the absence of the hormone.'
- claim: Anything raises the yield ABOVE the untreated baseline.
  grade: X
  basis: 'NOTHING KNOWN DOES. Oestrogen removal restores the yield to baseline; the untreated baseline
    itself falls 1.94-fold every five weeks in this preparation. The entire remaining prize on this axis is
    slowing that decay, and no agent has been shown to do it in any species. This is the bar, and it is now
    a number rather than an aspiration.'
- claim: The yield can only be obtained from purpose-built experiments.
  grade: X
  basis: 'NO - AND THIS IS THE SECOND DELIVERABLE. Three measurements in the same animals suffice: a
    longitudinal growth rate, a terminal hypertrophic cell size, and a resting-zone cell count. Many
    published growth-plate papers report all three and none has taken the quotient. The quantity has gone
    unmeasured for twenty years not because it is hard to obtain but because nobody divided.'
