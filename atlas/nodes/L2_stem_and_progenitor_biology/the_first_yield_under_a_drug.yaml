id: the_first_yield_under_a_drug
name: THE FIRST YIELD UNDER A DRUG - oestrogen cuts the yield 43 per cent, 91 per cent of it is
  amplification, and the effect is REVERSIBLE while the pool it burned is not
aliases:
- yield under oestrogen
- schrier hypothesis quantified
- nilsson2014 yield computed
- does anastrozole protect the yield
- yield decay rate
- round 176
type: hypothesis
layer: L2
stub: false
summary: 'SCHRIER PROPOSED THE YIELD TERM IN 2006 AFTER EXCLUDING BOTH OBSERVABLE STATE VARIABLES OF THE
  POOL BY MEASUREMENT. NILSSON RESTATED IT IN 2014 AS "FEWER PROLIFERATIVE CHONDROCYTE REPLICATIONS PER
  LOST RESTING ZONE CHONDROCYTE". NEITHER PUT A NUMBER ON IT, BECAUSE THE NUMERATOR AND THE DENOMINATOR
  SIT IN TWO DIFFERENT FIGURES. BOTH FIGURES ARE NOW IN HAND AND THE NUMBER EXISTS.

  THE RESULT, RABBIT PROXIMAL TIBIA, ON TREATMENT 11-16 WEEKS. Vehicle grew 7,980 micrometres while losing
  9.0 resting-zone cells per mm of plate width - a yield of 887. Oestradiol grew 7,130 micrometres while
  losing 14.1 - a yield of 506. THE OESTROGEN YIELD IS 0.57 OF VEHICLE. Growth fell only 11 per cent while
  resting-zone consumption rose 57 per cent: OESTROGEN SPENT 57 PER CENT MORE POOL TO DELIVER 11 PER CENT
  LESS BONE.

  AND THE DECOMPOSITION REPLICATES ACROSS SPECIES AND ACROSS THE KIND OF CONTRAST. Terminal hypertrophic
  cell size fell to 0.953 of vehicle; amplification fell to 0.598. NINETY-ONE PER CENT OF THE LOG EFFECT IS
  AMPLIFICATION AND NINE PER CENT IS CELL SIZE. Round 174 found 88 per cent in MOUSE from a BETWEEN-BONE
  contrast; this is 91 per cent in RABBIT from a DRUG. Two species, two entirely different experimental
  designs, the same split.

  AN INDEPENDENT ROUTE AGREES, USING NO LENGTH MEASUREMENT AT ALL. BrdU-labelled cells per column
  integrated over the treatment interval and divided by resting-zone cells lost gives 3.32 for vehicle and
  1.82 for oestradiol - A RATIO OF 0.55 against 0.57 from the length route. The two constructions share
  only the denominator; the numerators are calcein-derived bone growth with cell size in one case and
  BrdU incorporation in the other. They agree to two per cent.

  THE PART THAT CHANGES WHAT WE DO - THE YIELD EFFECT IS REVERSIBLE AND THE POOL LOSS IS NOT. Over the
  WASHOUT interval, 16-21 weeks with no drug in either arm, the oestrogen-exposed plates ran at a yield of
  512 against vehicle 457 - A RATIO OF 1.12, slightly ABOVE vehicle. The BrdU route gives 0.88 for the same
  interval, so the two methods bracket unity rather than agreeing precisely; what they agree on is that the
  43 per cent on-treatment deficit is GONE. Oestrogen suppresses the yield WHILE PRESENT. What it leaves
  behind is a smaller pool, not a permanently worse exchange rate. That maps exactly onto nilsson2014''s
  own reversible-function versus irreversible-pool framing, and it assigns the yield term to the
  REVERSIBLE half - which nobody had done, because nobody had computed the yield.

  THE NUMBER THAT SETS THE BAR FOR ANY FUTURE AGENT. The VEHICLE yield fell from 887 to 457 across the two
  intervals - THE UNTREATED YIELD HALVES IN FIVE WEEKS in an adolescent rabbit. Expressed against that
  natural decay, five weeks of oestrogen exposure cost 4.2 WEEKS OF EXTRA YIELD DECAY: oestrogen roughly
  DOUBLES the rate at which the exchange rate runs down. Any candidate amplification agent has to be
  measured against a baseline that is falling by half every five weeks on its own.

  WHAT THIS SAYS ABOUT THE STACK, AND IT IS A NEW JUSTIFICATION FOR AN AGENT ALREADY IN IT. Anastrozole has
  been carried in this atlas as a DURATION agent, and round 173 reframed it as an EXCHANGE-RATE agent on
  bone age. This adds a third and more direct reading: removing oestrogen PROTECTS THE YIELD, and the
  protection is worth roughly a doubling of the yield decay rate for as long as the exposure is avoided.
  THAT IS NOT A NEW LEVER - IT IS THE SAME LEVER SCORED ON THE RIGHT AXIS FOR THE FIRST TIME.

  AND IT BOUNDS WHAT IS LEFT. Oestrogen removal restores the yield TO baseline. Nothing known raises it
  ABOVE baseline. The whole remaining prize on this axis is the difference between a yield that decays at
  the untreated rate and one that decays more slowly, and no agent has ever been shown to do that in any
  species.

  THE METHOD IS THE OTHER DELIVERABLE. Any experiment reporting three things in the same animals - a
  longitudinal growth rate, a terminal hypertrophic cell size, and a resting-zone cell count - yields a
  yield. That is a small set of measurements and a large number of published papers make all three. The
  quantity that has gone unmeasured for twenty years is not hard to obtain; it has simply never been
  divided out.'
