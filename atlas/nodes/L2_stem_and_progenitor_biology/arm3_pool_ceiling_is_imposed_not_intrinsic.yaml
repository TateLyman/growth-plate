id: arm3_pool_ceiling_is_imposed_not_intrinsic
name: The resting-zone pool ceiling is imposed, not cell-intrinsic
aliases:
- arm 3 restated
- growth-limiting genetic program
- why the pool runs out
type: process
layer: L2
stub: false
summary: 'The atlas has treated arm 3 as a closed door - the resting zone holds a finite number of divisions,
  they are spent, and that is that. Three independent measurements say the ceiling is NOT carried inside
  the cell, and they change what arm 3 is. FIRST - and REVISED once the full text was read - the strongest thing nilsson2005
  shows is not the donor-age comparison, which is a marginal P=0.068 and which this node previously
  overstated as a clean null (CORR-059). It is the TRIPLE SPECIFICITY of the methylation loss. Global
  DNA methylation falls with age in resting-zone cartilage, but it does NOT differ between the resting
  and hypertrophic zones at any single age, does NOT fall during the far more rapid replication of the
  same cells in culture, and does NOT fall with growth of the liver in vivo. Loss of methylation is
  therefore not an obligate consequence of chondrocyte division; it is a property of the SLOW replication
  of the resting zone inside its niche, and putting the cell in culture restores maintenance methylation
  (nilsson2005).
  SECOND, it is not telomeric: telomere restriction fragment length in mouse resting-zone chondrocytes
  did not shorten measurably between 1 and 56 weeks (nwosu2005). THIRD, the counter is body-wide rather
  than plate-specific. A common program downregulates hundreds of growth-promoting genes simultaneously
  in kidney, lung, liver and heart with declining H3K4 trimethylation at their promoters (finkielstain2009,
  lui2010, lui2014), it includes an eleven-gene imprinted network - Igf2, H19, Plagl1, Mest, Peg3, Dlk1,
  Gtl2, Grb10, Ndn, Cdkn1c, Slc38a4 - whose decline tracks the decline in growth rate - though lui2008 TESTED
  and REFUTED the obvious mechanism for that arm, finding promoter methylation of Mest, Peg3 and Plagl1
  unchanged with age (CORR-060), and its
  targets are enriched for miR-29 binding sites while all three miR-29 family members rise steeply from
  1 to 6 weeks of age (kamran2015). CRUCIALLY THE PROGRAM IS DRIVEN BY GROWTH, NOT BY TIME. A tryptophan-deficient
  diet that stalled growth for four weeks DELAYED the program (lui2010); propylthiouracil-induced hypothyroidism
  delayed it (finkielstain2009, marino2008); dexamethasone delayed growth-plate senescence and epiphyseal
  fusion (gafni2001); and locally administered glucocorticoid produced catch-up growth restricted to the
  treated plate, which is what proves the mechanism is intrinsic to the plate rather than a neuroendocrine
  set-point (baron1994). AND THE PROGRAM RUNS AT DIFFERENT SPEEDS IN DIFFERENT SPECIES. The same downregulated
  gene set appears in juvenile sheep kidney and lung as in mouse and rat, but plays out over years rather
  than weeks, which is offered as the reason large mammals get large (delaney2014). WHAT THIS MEANS FOR
  ARM 3. Every intervention that slows the program does so BY SLOWING GROWTH, which is why catch-up growth
  restores a trajectory rather than exceeding it - the divisions are spent more slowly, not spared. The tryptophan
  experiment is the sharpest version: 159 of 235 uniformly age-downregulated genes were significantly
  delayed by four weeks of prior deprivation, and the comparison was made at MATCHED BODY SIZE precisely
  to separate prior growth history from concurrent malnutrition (lui2010). The
  arm-3 target, stated precisely for the first time, is to decouple the program''s progression from growth
  output: to run the counter slowly while the plate keeps producing. Nothing does this. But a ceiling that
  is epigenetic, growth-driven, reversible in culture, and set at different rates in different species
  is a dial, not a wall, and the atlas has been describing it as a wall.'
quantitative:
- parameter: resting-zone BrdU labelling index, late fetal versus 5, 9 and 17 weeks
  value: 95.6, 9.2, 9.2, 7.6
  unit: '% of resting-zone cells labelled'
  conditions: distal femur, New Zealand White rabbits, one-week continuous BrdU infusion by osmotic minipump
    at 200 ug/kg/h; animals at 9 and 17 weeks castrated at 6 weeks to remove gonadal steroid confounding;
    n=6-12 per group; P<0.001 by ANOVA
  species: rabbit
  source_ref: schrier2006
  uncertainty: 'SEM 0.8, 1.2, 1.1 and 1.5 respectively. THE SHAPE OF THIS CURVE MATTERS MORE THAN ITS
    ENDPOINTS. The resting zone does not wind down gradually across childhood - it collapses more than
    tenfold before 5 weeks and then coasts near 8-9 per cent. By the time any growth intervention could
    be given, the pool has long since stopped cycling fast and is simply being consumed.'
- parameter: number of resting-zone chondrocytes per mm of growth plate versus age
  value: decreases
  unit: cells per mm, measured perpendicular to the long axis
  conditions: same animals; significant in the overall resting zone, the epiphyseal region and the reserve
    region separately, each P<0.001; distal femur, proximal tibia and distal tibia
  species: rabbit
  source_ref: schrier2006
  uncertainty: 'Figure values not extractable from text. This is the only direct measurement of POOL SIZE
    against age that the atlas has, and it is the quantity arm 3 exists to change.'
- parameter: effect of dexamethasone on resting-zone proliferation and on numerical depletion
  value: both decreased
  unit: qualitative
  conditions: 0.5 mg/kg s.c. daily for two weeks from 4 weeks of age, supraphysiological; n=6-7 per group;
    estradiol cypionate 70 ug/kg i.m. weekly as the comparator arm
  species: rabbit
  source_ref: schrier2006
  uncertainty: 'A drug that conserves the pool - but by suppressing it, so the conservation is bought
    with growth. Estradiol at near-physiological adult levels ALSO slowed resting-zone proliferation,
    which the authors could not reconcile with oestrogen accelerating senescence; they speculate oestrogen
    acts by a proliferation-independent route or by raising the loss of capacity per cell cycle. That
    unresolved sign is a real problem for the atlas, because anastrozole is in the stack on the assumption
    that oestrogen depletes the pool.'
- parameter: maximal population doublings of cultured resting-zone chondrocytes before plateau
  value: '14'
  unit: population doublings
  conditions: rib resting-zone cartilage from fetal, 4- and 16-week-old male rabbits; approximately 50
    days and three passages to plateau, with senescence-associated beta-galactosidase appearing as the
    plateau was approached
  species: rabbit
  source_ref: nilsson2005
  uncertainty: 'For comparison the authors cite 8-10 doublings for adult rabbit ARTICULAR chondrocytes
    and 35-40 for young adult human articular chondrocytes (Evans & Georgescu 1983). So growth plate
    resting-zone cells do undergo the Hayflick phenomenon in culture; they are not immortal.'
- parameter: effect of donor age on maximal population doublings in culture
  value: 'P = 0.068'
  unit: Kruskal-Wallis
  conditions: fetal versus 4-week versus 16-week donor rabbits
  species: rabbit
  source_ref: nilsson2005
  uncertainty: 'CORRECTED ROUND 69 (CORR-059). The atlas previously reported this as a clean null showing
    the ceiling is not carried in the cell. It is NOT clean - P=0.068 is a marginal near-miss with three
    small donor groups, and the direction is the one the intrinsic hypothesis predicts. The authors
    conclude no dependence; the atlas grades it as WEAK EVIDENCE AGAINST a cell-intrinsic limit, not as
    proof. This is the CORR-056 failure repeated: a negative treated as strong when it is marginal.'
- parameter: global DNA methylation versus age, resting zone
  value: decreased
  unit: fraction methyl-dCMP
  conditions: rib growth plate resting zone from fetal, 4- and 16-week rabbits, n=9 per group, P=0.004;
    and all three zones of distal ulnar plates fetal versus 4 weeks, P<0.001
  species: rabbit
  source_ref: nilsson2005
  uncertainty: association with age, not a causal test
- parameter: 'the zone- and context-specificity of the methylation loss - the finding that actually
    localises the counter'
  value: resting zone in vivo only
  unit: qualitative
  conditions: within each age, methylation did NOT differ between resting zone and hypertrophic zone;
    methylation did NOT fall during in vitro replication of the same cells; and it did NOT fall with
    growth of the liver in vivo
  species: rabbit
  source_ref: nilsson2005
  uncertainty: 'THIS IS THE MOST INFORMATIVE ROW IN THE NODE AND IT REPLACES THE OVERSTATED ONE ABOVE.
    Methylation is lost specifically during the SLOW replication of resting-zone chondrocytes in vivo,
    and not during the far more rapid replication of the proliferative zone, not in culture, and not in
    growing liver. Loss of methylation is therefore not an obligate consequence of chondrocyte division -
    it is a property of the resting zone in its niche. The authors infer that maintenance methylases are
    upregulated when the cells are placed in culture. That is a mechanistic statement of what "imposed
    rather than intrinsic" means: the niche fails to maintain the mark, and removing the cell restores
    maintenance.'
- parameter: proliferative-zone BrdU-labelled cells per column versus age
  value: about 7-fold decline
  unit: fold
  conditions: approximately 3-fold from fetal to 5 weeks (P<0.001) and a further 2.5-fold from 5 to 16
    weeks (P=0.002); rabbit, 90 min BrdU at 50 mg/kg, 25 columns per animal, n=3 per age group
  species: rabbit
  source_ref: nilsson2005
  uncertainty: none stated
- parameter: telomere restriction fragment length in resting-zone chondrocytes, 1 to 56 weeks
  value: no measurable shortening
  unit: kb
  conditions: Mus casteneus at 1, 4, 8 and 56 weeks
  species: mouse
  source_ref: nwosu2005
  uncertainty: abstract only; a negative result with unstated power, so it bounds rather than excludes
    a telomeric contribution
- parameter: imprinted genes coordinately downregulated with age across multiple organs
  value: '11'
  unit: genes
  conditions: Igf2, H19, Plagl1, Mest, Peg3, Dlk1, Gtl2, Grb10, Ndn, Cdkn1c, Slc38a4; temporal pattern
    similar to the decline in growth rate
  species: mouse
  source_ref: lui2008
  uncertainty: 'AND THE OBVIOUS MECHANISM WAS TESTED AND REFUTED IN THE SAME PAPER. The authors
    hypothesised that the coordinate decline in these imprinted genes is caused by altered methylation
    silencing the expressed allele, and state plainly that contrary to the hypothesis, the methylation
    status of the promoter regions of Mest, Peg3 and Plagl1 did not change with age. The imprinted network
    declines in EXPRESSION without a promoter methylation change, so it is not a second instance of the
    nilsson2005 methylation mechanism and must not be cited as one.'
- parameter: genes in the growth-limiting program significantly delayed by prior tryptophan deficiency
  value: 159 of 235
  unit: genes, 68 per cent, each P<0.05
  conditions: newborn Sprague-Dawley rats, tryptophan-deficient diet 0-4 weeks then recovery; the critical
    comparison is made at MATCHED BODY SIZE - deprived animals at 8-9 weeks against controls at 5-6 weeks -
    explicitly in order to isolate prior growth history from concurrent malnutrition
  species: rat
  source_ref: lui2010
  uncertainty: 'THE EXPERIMENT THAT SEPARATES TIME FROM GROWTH, AND THE MATCHED-SIZE DESIGN IS WHAT MAKES
    IT WORK. The program tracks growth, not the calendar. Body mass, tail length, tibia length and organ
    BrdU-labelling index were all measured through the deprivation and recovery. Down-regulated genes in
    the program show declining promoter H3K4 trimethylation with age, and siRNA knockdown of Mest, Plagl1
    and Peg3 in cultured hepatocytes confirmed they are growth-promoting.'
- parameter: proliferation in juvenile organs transplanted into adult recipients
  value: continues rapidly
  unit: qualitative
  conditions: cited by lui2010 as the evidence that declining growth rate is an intrinsic property of the
    organ rather than of the host environment
  species: multiple
  source_ref: lui2010
  uncertainty: 'RECORDED BECAUSE IT IS THE MOST ENCOURAGING FACT IN THE CORPUS FOR ARM 3. A young organ
    put into an old animal keeps growing - the program is not driven by a systemic ageing signal and an
    old host does not accelerate it. Cited rather than performed in this paper, so the atlas holds it at
    second hand until the primary sources are read.'
- parameter: pace of the same genetic program across species
  value: mouse fastest, rat intermediate, sheep slowest
  unit: rank order
  conditions: expression microarray and real-time PCR on the overlapping age-downregulated gene set;
    C57BL/6 mice, Sprague-Dawley rats and female Suffolk sheep; the shared gene set is conserved across
    the roughly 80 million years since sheep and rodents diverged
  species: multiple
  source_ref: delaney2014
  uncertainty: 'Three species, one laboratory, expression only - so this is consistent with the hypothesis
    that program pace sets adult size rather than a demonstration of it. The authors say as much and call
    for more species. But it is the only evidence in this atlas that the rate is a settable parameter.'
- parameter: miR-29 target validation against growth genes
  value: 3 of 3 suppressed
  unit: luciferase reporters
  conditions: 3'UTRs of Igf1, Imp1 and Mest each placed in a luciferase reporter; miR-29 mimics suppressed
    activity for all three, and suppression was diminished by mutating the predicted target sequences
  species: in_vitro_animal_cell
  source_ref: kamran2015
  uncertainty: 'Direct molecular target validation, which is stronger than the atlas previously credited -
    Igf1 is a validated miR-29 target. What is still absent is any organismal test: no miR-29 gain- or
    loss-of-function animal has had a bone measured (g_l2_mir29_causality_for_skeletal_length).'
- parameter: adult height in Beckwith-Wiedemann spectrum, the human imprinted-overgrowth natural experiment
  value: 180.6 and 166.3
  unit: cm at 18 years, males and females
  conditions: 581 individuals from the Netherlands, Italy and the United States; GAMLSS modelling; +0.6
    and +0.5 SDS against WHO charts; enhanced growth rate reported during puberty and adolescence
  species: human
  source_ref: maas2025
  uncertainty: 'abstract only. THE POINT OF THIS ROW IS THAT THE OVERGROWTH PERSISTS. This is not the
    CORR-054 trap - in Sotos, predicted and adult heights were not significantly different, whereas here
    adult height is genuinely shifted. But the shift is +0.6 SDS, roughly 4 cm, from disrupting the entire
    11p15.5 imprinting apparatus and accepting embryonal tumour risk. It sets the SCALE of what the imprinted
    arm of the program is worth, and the scale is modest.'
- parameter: elongation rate of deer antler versus human growth plate
  value: 2 per day versus about 2 per year
  unit: cm
  conditions: sika deer antler growth centre; stated by the authors as over 300-fold
  species: multiple
  source_ref: ba2025
  uncertainty: 'The comparator is a whole-organ rate against a single-plate rate and the tissues are not
    homologous, so the 300-fold figure is an order-of-magnitude statement, not a controlled comparison.'
- parameter: 'the three innovations the antler uses, per the authors'
  value: 3
  unit: named mechanisms
  conditions: snRNA-seq, snATAC-seq (57,722 nuclei) and Stereo-seq (57,311 cells); 87.6% cell-type agreement
    across modalities; PHEX+ cells about 5% and osteoblasts about 13% of the growth centre
  species: multiple
  source_ref: ba2025
  uncertainty: 'The three are: extensive progenitor proliferation with intrinsically low tumorigenic potential
    (MYC driving a non-oncogenic program, balanced by apoptosis rather than by enhanced DNA repair); VASCULARIZED
    CARTILAGE meeting the metabolic demand; and hybrid ossification combining endochondral ossification
    with direct hypertrophic-chondrocyte-to-osteoblast transdifferentiation via PHEX+ intermediates. The
    authors state plainly that this defies the conventional paradigm, which depends on AVASCULAR growth
    plates.'
localization:
- 'growth plate resting zone: where the program is cashed out into height; pool size and labelling index
  both fall with age'
- 'kidney, lung, liver, heart: the same growth-limiting program runs simultaneously, which is what makes
  it a body-wide counter rather than a plate-specific one'
- 'deer antler growth centre: a mammalian endochondral tissue with a vascularized cartilage matrix and
  a large progenitor pool'
human_evidence: indirect
human_evidence_note: The pool measurements are rabbit, the program is rat, mouse and sheep, and the antler
  is deer. The one direct human readout is Beckwith-Wiedemann adult height, which perturbs one arm of
  the program (the 11p15.5 imprinted locus) and moves adult height by about +0.6 SDS.
species_basis:
- rabbit
- rat
- mouse
- ovine
- human
- multiple
translation_risk: high
translation_risk_reason: 'Two distinct risks. The program itself is explicitly claimed to be conserved
  with a species-specific TIME COURSE (delaney2014), so its existence should transfer while its rate will
  not - a mouse experiment measures the program in fast-forward. The antler is worse: antler stem cells
  are cranial neural crest derived, the organ is seasonal and shed annually, and its cartilage is vascularized,
  which in a human growth plate is not a feature but the definition of closure. Nothing about the antler
  should be assumed to transfer; it is being read as an existence proof about what a mammalian endochondral
  tissue CAN do, not as a template.'
confidence: B
claim_grades:
- claim: The limit on resting-zone replicative capacity is not a cell-intrinsic Hayflick limit and is
    not telomeric.
  grade: C
  basis: Two independent negative results in two species - donor-age-independent population doublings
    in rabbit culture, and no telomere shortening in mouse. Both read at abstract level, both negatives,
    so graded C rather than B.
- claim: Growth deceleration is driven by a multi-organ, epigenetically encoded genetic program rather
    than by a systemic hormonal signal or by time.
  grade: B
  basis: Replicated across organs, across three rodent studies and one ruminant, with converging chromatin
    (H3K4me3, H3K27me3), DNA methylation, imprinted-gene and microRNA evidence, plus the local-glucocorticoid
    experiment that excludes a neuroendocrine set-point.
- claim: The program's progression is a function of growth itself, so it can be delayed by anything that
    slows growth.
  grade: B
  basis: Three independent growth-inhibiting manipulations - tryptophan deficiency, propylthiouracil and
    dexamethasone - each delayed the program or growth-plate senescence, in three separate studies.
- claim: Delaying the program by slowing growth is therefore height-neutral rather than height-additive.
  grade: E
  basis: 'INFERENCE, and the most consequential one in the node. It follows from the program being division-
    or growth-counted, but no study has run a full charge-then-discharge cycle to adult height and compared
    the total against untreated controls. If it is wrong, cycling is a lever; if it is right, cycling
    only buys time in which to spend the pool at higher yield. This is the single assumption the whole
    late-start strategy rests on and it is ungraded evidence.'
- claim: Adult body size differences between mammalian species are set by the speed of this program.
  grade: D
  basis: One study comparing sheep against mouse and rat by expression microarray, offered as consistent
    with the hypothesis. A two-species comparison cannot establish that the program's rate is the causal
    determinant of adult size.
- claim: The antler achieves a large progenitor pool by vascularizing its cartilage, which the growth
    plate cannot do without closing.
  grade: D
  basis: One single-cell multi-omics study in one species with no perturbation. The incompatibility with
    growth-plate biology is the atlas's inference, not the authors' claim.
key_refs:
- ref_id: nilsson2005
  pmid: '16002553'
  first_author: Nilsson O
  year: 2005
  type: primary_abstract_only
  one_line_finding: Population doublings of rabbit resting-zone chondrocytes in culture did not depend
    on donor age, while DNA methylation in the resting zone fell with age in vivo - the ceiling is not
    carried in the cell.
- ref_id: nwosu2005
  pmid: '15795509'
  first_author: Nwosu BU
  year: 2005
  type: primary_abstract_only
  one_line_finding: No measurable telomere shortening in mouse resting-zone chondrocytes between 1 and
    56 weeks.
- ref_id: schrier2006
  pmid: '16614378'
  first_author: Schrier L
  year: 2006
  type: primary
  one_line_finding: Resting-zone labelling index falls from 95.6% late fetal to 7.6% at 17 weeks and cell
    number per mm falls with age; dexamethasone slows both, and oestrogen unexpectedly also slows proliferation.
