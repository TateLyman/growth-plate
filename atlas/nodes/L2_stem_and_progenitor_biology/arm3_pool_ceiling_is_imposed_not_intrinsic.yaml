  first_author: Baron J
  year: 1994
  type: primary_abstract_only
  one_line_finding: Local glucocorticoid to one plate produced catch-up growth restricted to that plate,
    excluding a neuroendocrine set-point and proving the counter is intrinsic to the growth plate.
