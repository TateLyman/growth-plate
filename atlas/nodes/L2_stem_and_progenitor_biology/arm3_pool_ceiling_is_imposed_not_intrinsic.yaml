  year: 2010
  type: primary_abstract_only
  one_line_finding: A common growth-limiting program across lung, kidney and liver with declining H3K4
    trimethylation; four weeks of tryptophan deficiency delayed it, showing it is driven by growth rather
    than age.
- ref_id: lui2008
