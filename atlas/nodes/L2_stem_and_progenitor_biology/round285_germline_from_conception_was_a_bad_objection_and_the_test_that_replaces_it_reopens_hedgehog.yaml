id: round285_germline_from_conception_was_a_bad_objection_and_the_test_that_replaces_it_reopens_hedgehog
name: >-
  ROUND 285 - the operator refused the closure and was right. "GERMLINE FROM CONCEPTION" IS NOT A VALID
  OBJECTION AND THIS FILE'S OWN LEAD AGENT REFUTES IT: FGFR3 is germline, prenatal and whole-organism, and
  blocking it POSTNATALLY in a NORMAL mouse still adds 8.2 per cent of femur. Replace the question with "is
  the gene still working in an OPEN plate" and run it against the six. HHIP PASSES - limb-restricted deletion
  of the hedgehog brake gives a LONGER FEMUR AT 10 AND 53 WEEKS WITH NO WEIGHT CHANGE. LCORL FAILS, and it
  fails in the liver. And the difference between the two hedgehog results names a rule that re-ranks the
  whole target list
aliases:
- round 285
- the germline objection is refuted
- HHIP passes the open-plate test
- haraguchi2025
- secreted modulator versus intracellular brake
- LCORL is hepatic
type: hypothesis
layer: L2
stub: false
summary: >-
  ONE - THE OBJECTION I USED THREE TIMES IS WRONG, AND THE COUNTEREXAMPLE IS THE STACK'S OWN LEAD AGENT.
  Round 281 dismissed the PRC2 class, round 282 qualified SPIN4 and round 283 qualified all six taller-genes
  with the same sentence: the exposure is germline and lifelong from conception, so it says nothing about an
  intervention at bone age 16. THAT ARGUMENT PROVES TOO MUCH. FGFR3 is a germline gene whose human
  phenotypes are prenatal in onset and whole-organism in expression - and dabogratinib given ORALLY TO
  WILD-TYPE C57BL/6J MICE FROM FOUR TO EIGHT WEEKS OF AGE, a purely postnatal juvenile exposure in a normal
  animal, produced femur +8.2 per cent, tibia +6.4 per cent and nasoanal +7.3 per cent. Vosoritide and
  infigratinib do the same thing in children, postnatally, on a prenatally-established phenotype. THE AGE AT
  WHICH AN ALLELE STARTS ACTING IS NOT THE SAME QUESTION AS THE AGE AT WHICH THE PATHWAY CAN STILL BE MOVED.
  THE QUESTION THAT REPLACES IT IS EMPIRICAL AND HAS A DECISIVE TEST CLASS: IS THE GENE STILL DOING WORK IN
  AN OPEN GROWTH PLATE, AND DOES A TISSUE-RESTRICTED OR POSTNATALLY-INDUCED PERTURBATION OF IT CHANGE BONE
  LENGTH? Everything below is that test, run against round 283's six.

  TWO - HHIP PASSES, AND IT PASSES ON EVERY CRITERION THIS FILE HAS. haraguchi2025 built a conditional
  Hhip1 allele and crossed it to Prx1-Cre, deleting the hedgehog antagonist in LIMB MESENCHYME ONLY.
  FEMUR LENGTH SIGNIFICANTLY INCREASED AT TEN WEEKS AND STILL SIGNIFICANTLY INCREASED AT FIFTY-THREE WEEKS.
  BODY WEIGHT DID NOT DIFFER AT EITHER AGE, and the authors state the point explicitly - the skeletal
  phenotype is NOT attributable to generalised somatic overgrowth. THAT IS LIMB-AUTONOMOUS BONE LENGTHENING,
  SUSTAINED FOR A YEAR, WITH NO SYSTEMIC PHENOTYPE. The plate: overall epiphyseal cartilage height increased
  with widening of BOTH the proliferative AND hypertrophic zones, Gli1 markedly upregulated in growth-plate
  chondrocytes and primary spongiosa, and the authors describe "persistent growth plate activity". Hhip1's
  own mRNA sits in RESTING ZONE chondrocytes, the periosteum and the primary spongiosa.
  AND BOTH DIRECTIONS ARE DONE. Transgenic Hhip1 OVEREXPRESSION reduces the zone of undifferentiated
  chondrocytes. Ptch1-deficient mice - constitutive hedgehog activation - show growth plate expansion and
  excessive bone elongation. In HUMANS, kosmicki2026 has HHIP loss-of-function at PLUS 9.92 CM and an HHIP
  gain-of-function missense at MINUS 3.96 CM. Mouse and human, both directions, one axis, monotonic.

  THREE - AND THAT CONTRADICTS ROUND 268, SO THE CONTRADICTION HAS TO BE RESOLVED RATHER THAN CHOSEN
  BETWEEN. Round 268 graded "sustained cell-autonomous hedgehog gain expands the plate and converts that
  expansion into length" as X, on xiu2022: SUFU deletion expanded the plate and DESTROYED ITS ZONAL ORDER at
  P30 with no femur gain, then gave premature closure and SIGNIFICANTLY SHORTER femurs at P120 - the seventh
  and worst instance of charge-without-discharge in this file. haraguchi2025 removes a hedgehog brake and
  gets the opposite outcome. BOTH ARE MOUSE, BOTH ARE GENETIC, BOTH RAISE HEDGEHOG TONE.
  THE DIFFERENCE IS WHAT KIND OF BRAKE WAS REMOVED. SUFU IS AN INTRACELLULAR NEGATIVE REGULATOR DOWNSTREAM
  OF SMOOTHENED - deleting it gives constitutive, ligand-independent, maximal pathway output in every cell
  that lost it, and the readout is a plate with its zonal order destroyed. HHIP IS A SECRETED,
  MEMBRANE-BOUND LIGAND-BINDING ANTAGONIST - deleting it raises the effective concentration and diffusion
  range of Ihh while leaving the pathway LIGAND-DEPENDENT and the Ihh-PTHrP feedback loop intact, and the
  readout is a plate with its zones ENLARGED BUT ORDERED. One saturates the pathway; the other shifts the
  setpoint inside a still-functioning regulatory envelope.

  FOUR - AND THAT IS THE THIRD TIME THIS EXACT DISTINCTION HAS DECIDED AN AXIS IN THIS FILE, SO IT IS NOW A
  RULE. Round 281: SPIN4 loss, a mild chronic reduction in canonical Wnt transcriptional output, LENGTHENS
  bone; PORCN inhibition, total blockade of all Wnt ligand secretion, expands the hypertrophic zone, shrinks
  the proliferative zone and FUSES the plate. Round 275: FGFR3-selective inhibition lengthens a wild-type
  mouse; the pan-FGFR agents carry the FGFR1/2/4 liabilities. Round 285: HHIP loss lengthens; SUFU loss
  shortens.
  THE RULE - REMOVING A SECRETED OR EXTRACELLULAR MODULATOR OF A PATHWAY IS NOT THE SAME INTERVENTION AS
  DISABLING AN INTRACELLULAR BRAKE OR FLOODING THE PATHWAY WITH AN AGONIST. The first shifts a setpoint
  inside a feedback-regulated envelope and can add length; the second two saturate the pathway, destroy
  zonal order and subtract it. IT RE-RANKS THE WHOLE TARGET LIST IN A SPECIFIC DIRECTION: prefer secreted
  antagonists, decoys and clearance receptors over intracellular components. That is exactly what this
  atlas's own derived compound already is - an NPR3-SELECTIVE CLEARANCE-RECEPTOR BLOCKER - and it is why
  osteocrin, an endogenous secreted NPR3 decoy, elongates long bones while flooding the same axis with
  ligand does not.

  FIVE - LCORL FAILS, AND IT FAILS IN THE LIVER. Round 283 called LCORL the most cross-species-replicated
  taller-gene in existence - human +9.99 cm per allele, convergent truncating selection in eight
  domesticated species, and bai2025's gene-edited mice at +3.0 per cent body length. wyler2024 made an Lcorl
  knockout and got the OPPOSITE: Lcorl-null pups are BORN SMALLER than wild-type littermates and only reach
  normal weight by seven to nine weeks, stay lean with reduced food intake, have improved glucose tolerance
  and insulin sensitivity, and THE STUNTED GROWTH IS LINKED TO REDUCED CIRCULATING IGF-1 with altered
  GH-signalling gene expression IN THE LIVER.
  TWO KNOCKOUTS OF ONE GENE, OPPOSITE DIRECTIONS. And the mechanism wyler2024 reports is hepatic GH/IGF-1,
  not cartilage. Set that beside round 283's own cross, where LCORL was NOT cluster-restricted in the mouse
  growth plate (baseMean 2.70, padj 0.55), and LCORL looks like a WHOLE-ORGANISM METABOLIC SETPOINT GENE
  whose human height effect is not plate-autonomous. THAT IS PRECISELY THE PROPERTY THAT FAILS THE
  OPEN-PLATE TEST, and it is the property round 281 correctly identified in the PRC2 class. LCORL is
  downgraded from lead to unresolved.

  SIX - SO THE SIX RE-SORT, AND THE SORT IS THE DELIVERABLE.
  PASSES the open-plate test: HHIP (not one of the six, but the strongest thing round 283 turned up) -
  limb-restricted deletion, length endpoint, sustained to 53 weeks, no systemic phenotype, both directions
  in human and mouse.
  FAILS: LCORL - hepatic mechanism, mouse-knockout conflict, not plate-enriched.
  UNTESTED - TET1, ZFAT, NRK and CHD8 have NO tissue-restricted and NO postnatally-induced perturbation with
  a bone-length endpoint in any species. For NRK there is no skeletal experiment of any kind.
  [CORRECTED IN ROUND 286: FBN1 WAS LISTED HERE AS UNTESTED AND IT IS NOT. This atlas already held sedes2022
  in perichondrial_tgfb_restraint, from a full text the operator supplied on 2026-08-06 - Fbn1 loss in limb
  mesenchyme gives limb bones about 7 per cent longer, NORMAL AT BIRTH AND DIVERGING BETWEEN ONE AND THREE
  MONTHS, with chondrocyte-specific deletion producing NO overgrowth. FBN1 PASSES. Two of the six pass, not
  one - and both passing genes are SECRETED EXTRACELLULAR ANTAGONISTS, which is CORR-300 reached a second
  time from a different direction.]

  SEVEN - AND THE LIMIT ON HHIP, STATED BEFORE ANYONE ELSE STATES IT. Prx1-Cre recombines in the limb bud
  from mid-gestation, so haraguchi2025's deletion is EMBRYONIC IN ONSET, not tamoxifen-induced after birth.
  What makes it bear on a postnatal question is that the authors describe the phenotype as PROGRESSIVE and
  as a role in maintaining POSTNATAL growth plate architecture, and that it is present at 10 weeks and still
  present at 53. A progressive divergence means the effect is still accruing after birth, which is what a
  postnatal intervention would need. IT IS NOT PROOF THAT STARTING AT BONE AGE 16 WOULD WORK. The missing
  experiment is a tamoxifen-inducible Hhip1 deletion switched on in a juvenile animal, read out for bone
  length at skeletal maturity - and there is now a floxed allele in existence to do it with.
  AND ROUND 268 IS NOT WITHDRAWN. Hedgehog INHIBITION still causes irreversible physeal fusion in children
  at grade A and reduces attained height at grade B, and Smo deletion still costs 21 to 30 per cent of femur.
  Nothing here touches the withdrawal arm. What is withdrawn is the claim that the GAIN direction is closed.
quantitative:
- parameter: >-
    LIMB-RESTRICTED DELETION OF THE HEDGEHOG BRAKE - LONGER FEMUR AT TEN WEEKS AND AT FIFTY-THREE, WITH NO
    WEIGHT CHANGE
  value: >-
    Prx1-Cre; Hhip1 flox/flox mice showed visibly elongated femurs on gross examination at both 10 and 53
    weeks, with a STATISTICALLY SIGNIFICANT INCREASE IN FEMUR LENGTH AT BOTH STAGES. BODY WEIGHT DID NOT
    DIFFER SIGNIFICANTLY FROM WILD-TYPE AT EITHER AGE. Growth plate: overall epiphyseal cartilage height
    significantly increased with widening of BOTH the proliferative AND the hypertrophic zones; Gli1 markedly
    upregulated in growth-plate chondrocytes and primary spongiosa. Hhip1 mRNA localises to RESTING ZONE
    chondrocytes, periosteum and primary spongiosa; Ihh mRNA to the hypertrophic zone. The converse
    manipulation, transgenic Hhip1 overexpression, reduces the zone of undifferentiated chondrocytes;
    Ptch1-deficient mice, with constitutive hedgehog activation, show growth plate expansion and excessive
    bone elongation
  unit: femur length, mm; zone heights
  conditions: >-
    haraguchi2025. Novel CRISPR/Cas9 Hhip1 conditional allele (exon 2 floxed, frameshift on excision,
    abolishing the hedgehog ligand-binding domain), validated against the known pulmonary phenotype of the
    global knockout via CMV-Cre. Prx1-Cre drives recombination in limb mesenchyme.
  species: mouse
  source_ref: haraguchi2025
  uncertainty: >-
    PRX1-CRE IS EMBRYONIC IN ONSET, from the limb bud - this is a tissue-restricted, not a
    postnatally-induced, deletion, and the paper does not report a tamoxifen-inducible arm. Numeric effect
    sizes for femur length are in the figures rather than the text, so no percentage is recorded here. Only
    the femur is reported; no tibia, no vertebral measurement, no bone-age-equivalent maturation readout, so
    the trade this file prices for every other agent is unpriced here. The zone widening is a zone HEIGHT
    (CORR-189) and is only safe to cite because it is accompanied by a length endpoint.
- parameter: >-
    THE SAME AXIS, THE OPPOSITE OUTCOME, AND THE DIFFERENCE IS WHICH BRAKE WAS REMOVED
  value: >-
    SUFU deletion (intracellular negative regulator downstream of Smoothened): plate EXPANDED and ZONAL
    ORDER DESTROYED at P30 with NO significant femur gain, then premature closure and SIGNIFICANTLY SHORTER
    femurs at P120. HHIP deletion (secreted, membrane-bound, ligand-binding antagonist): plate EXPANDED WITH
    ZONES INTACT and femur SIGNIFICANTLY LONGER at 10 weeks and at 53 weeks, no weight change. Same pathway,
    same direction of tone, opposite length outcomes
  unit: femur length, direction
  conditions: >-
    xiu2022 for the Sufu arm (held by this atlas since round 268); haraguchi2025 for the Hhip1 arm.
  species: mouse
  source_ref: xiu2022
  uncertainty: >-
    THE RECONCILIATION IS AN INTERPRETATION, NOT A MEASUREMENT - no experiment has compared the two alleles
    side by side, and they differ in genetic background, Cre driver, timepoints and laboratory as well as in
    the molecular position of the deleted gene. An alternative reading is simply that Sufu deletion is a
    larger perturbation of the same variable, which would make this a dose story rather than a
    ligand-dependence story; the two are not distinguished by present data. What is NOT in doubt is that the
    grade-X claim of round 268 - that sustained hedgehog gain cannot convert to length - is contradicted by
    a length endpoint in a second genetic model.
- parameter: >-
    TWO LCORL KNOCKOUTS, OPPOSITE DIRECTIONS - AND THE MECHANISM IS HEPATIC
  value: >-
    wyler2024: Lcorl-/- pups are BORN SMALLER than wild-type littermates and reach normal weight only by 7
    to 9 weeks; they remain LEAN with DECREASED daily food intake, improved glucose tolerance and insulin
    sensitivity, are protected against high-fat diet challenge and show reduced exercise capacity. THE
    STUNTED GROWTH IS LINKED TO REDUCED CIRCULATING IGF-1, with altered expression of genes downstream of GH
    signalling and of glucose and lipid metabolism IN THE LIVER. Against bai2025, where gene-edited LCORL
    homozygotes were 11 per cent HEAVIER with BODY LENGTH UP 3.0 per cent in males and 2.6 per cent in
    females at 7 weeks, dose-dependently. And against kosmicki2026, where human singleton LCORL
    loss-of-function is +9.99 cm per allele
  unit: body weight, body length, circulating IGF-1
  conditions: >-
    wyler2024, Lcorl knockout mice with metabolic phenotyping. bai2025, gene-edited mice carrying the
    cattle-derived frameshift. kosmicki2026, human exomes.
  species: mouse
  source_ref: wyler2024
  uncertainty: >-
    THE TWO MOUSE LINES ARE NOT THE SAME ALLELE - bai2025 knocked in the specific ACT-to-A frameshift under
    selection in cattle, wyler2024 made a knockout - and the human variants are HETEROZYGOUS while both mouse
    experiments centre on homozygotes. Background, diet and housing all differ. So this is a genuine conflict
    and not a refutation of either. What it does do is remove LCORL's claim to be the best-replicated
    taller-gene, and wyler2024's hepatic GH/IGF-1 mechanism, together with round 283's finding that LCORL is
    not cluster-restricted in the growth plate, points away from a plate-autonomous effect.
- parameter: >-
    THE COUNTEREXAMPLE THAT KILLS THE GERMLINE OBJECTION - A GERMLINE, PRENATAL, WHOLE-ORGANISM AXIS MOVED
    POSTNATALLY IN A NORMAL ANIMAL
  value: >-
    Dabogratinib (TYRA-300), FGFR3-isoform-selective, dosed ORALLY ONCE DAILY TO WILD-TYPE C57BL/6J MICE FROM
    FOUR TO EIGHT WEEKS OF AGE: NASOANAL +7.3 per cent at 14 mg/kg, TIBIA +3.9 per cent at 12 mg/kg and +6.4
    per cent at 14, FEMUR +5.0 per cent at 12 mg/kg and +8.2 per cent at 14. Dose-dependent with significant
    effects also at 8 and 10 mg/kg, and NO DIFFERENCE IN BODY WEIGHT between groups
  unit: per cent length versus vehicle
  conditions: >-
    tyra300_2025, held by this atlas since round 275. FGFR3's human phenotypes - achondroplasia,
    hypochondroplasia, CATSHL - are germline and prenatal in onset and whole-organism in expression.
  species: mouse
  source_ref: tyra300_2025
  uncertainty: >-
    FOUR TO EIGHT WEEKS IN A MOUSE IS JUVENILE, NOT ADOLESCENT-EQUIVALENT-TO-BONE-AGE-16, and mice do not
    fuse their plates. So this refutes the general form of the germline objection without establishing that
    any particular agent works at this subject's maturity. That narrower question remains open for every
    agent in the file, including this one.
localization:
- 'growth plate resting zone, periosteum and primary spongiosa: where Hhip1 mRNA sits'
- 'hypertrophic zone: where Ihh is made, so HHIP loss raises the range of a signal originating there'
- 'liver: where wyler2024 locates the Lcorl growth mechanism, which is why LCORL fails the open-plate test'
human_evidence: indirect
human_evidence_note: >-
  The human contribution is kosmicki2026's HHIP loss-of-function at +9.92 cm and gain-of-function missense at
  -3.96 cm, both below or at the edge of exome-wide significance. All tissue-level and length evidence is
  mouse.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: >-
  A limb-mesenchyme conditional deletion from mid-gestation is not a drug started at bone age 16, and no
  HHIP-directed pharmacology exists. The hedgehog axis also carries a grade-A human harm in the opposite
  direction - irreversible physeal fusion on inhibitors - so the therapeutic window, if there is one, is
  bounded on one side by a documented human catastrophe.
confidence: C
confidence_reason: >-
  The methodological correction in section one is secure and rests on data this atlas already held. The HHIP
  result is a single paper, single laboratory, figure-only effect sizes, femur only, and embryonic-onset Cre
  - but it is a length endpoint with a clean systemic control and it is corroborated in direction by human
  population genetics and by Ptch1 genetics. The LCORL downgrade rests on a conflict between two mouse lines
  and is graded as a conflict rather than as a resolution.
claim_grades:
- claim: >-
    A germline, lifelong-from-conception human phenotype implies that the axis cannot be moved by a drug
    started postnatally.
  grade: X
  basis: >-
    REFUTED BY THIS FILE'S OWN LEAD AGENT, AND I USED THIS ARGUMENT THREE TIMES BEFORE CHECKING IT. FGFR3 is
    germline, prenatal in onset and whole-organism; dabogratinib given to WILD-TYPE mice from four to eight
    weeks of age - postnatal, juvenile, normal animal - gives femur +8.2 per cent, tibia +6.4, nasoanal +7.3,
    dose-dependent, with no weight difference. Vosoritide and infigratinib do the same in children. The valid
    question is not when the allele started but whether the gene is still doing work in an open plate.
- claim: >-
    Loss of the hedgehog antagonist HHIP lengthens bone cell-autonomously in the limb, and the effect is
    sustained.
  grade: C
  basis: >-
    Prx1-Cre limb-restricted Hhip1 deletion: femur length significantly increased at BOTH 10 and 53 weeks,
    with NO body-weight difference at either age, which the authors state excludes generalised somatic
    overgrowth. Epiphyseal cartilage height up with both proliferative and hypertrophic zones widened, Gli1
    up in chondrocytes and primary spongiosa. Corroborated in direction by human HHIP loss-of-function at
    +9.92 cm, by Hhip1 overexpression shrinking the undifferentiated zone, and by Ptch1-deficient mice
    showing excessive bone elongation. Graded C, not B: one laboratory, one paper, effect sizes figure-only,
    femur only, and the Cre is embryonic in onset.
- claim: >-
    Sustained hedgehog gain cannot convert plate expansion into length.
  grade: X
  basis: >-
    THIS WAS ROUND 268's GRADE-X CLAIM AND IT IS NOW CONTRADICTED. Round 268 rested it on xiu2022's Sufu
    deletion - plate expanded, zonal order destroyed, shorter femurs at P120. haraguchi2025 removes a
    different hedgehog brake and gets a longer femur at 10 and 53 weeks with zones intact. ROUND 268'S
    WITHDRAWAL ARM IS UNTOUCHED and stands at grade A for human physeal fusion and grade B for reduced
    attained height. What is withdrawn is the closure of the GAIN direction.
- claim: >-
    Removing a secreted extracellular modulator of a pathway is the same intervention as disabling an
    intracellular brake or adding an agonist.
  grade: X
  basis: >-
    NO, AND THIS IS NOW THE THIRD AXIS ON WHICH THE DISTINCTION DECIDES THE OUTCOME. Hedgehog - HHIP loss
    (secreted ligand-binding antagonist) lengthens with zones intact; SUFU loss (intracellular, downstream of
    Smoothened) shortens with zones destroyed. Wnt - SPIN4 loss (mild reduction in transcriptional output)
    lengthens and expands the resting pool; PORCN inhibition (total blockade of ligand secretion) expands the
    hypertrophic zone, shrinks the proliferative zone and fuses the plate. FGFR3 - isoform-selective
    inhibition lengthens a wild-type mouse. THE RULE RE-RANKS THE TARGET LIST: prefer secreted antagonists,
    decoys and clearance receptors over intracellular components - which is what this atlas's own derived
    compound, an NPR3-selective clearance blocker, already is.
- claim: >-
    LCORL is the best cross-species-replicated height-increasing loss-of-function gene.
  grade: X
  basis: >-
    WITHDRAWN FROM ROUND 283. wyler2024's Lcorl-/- mice are born SMALLER, reach normal weight only at 7 to 9
    weeks, and their stunted growth is linked to REDUCED CIRCULATING IGF-1 with altered GH-signalling genes
    in the LIVER - the opposite direction to bai2025's gene-edited line and to the human +9.99 cm. Two mouse
    knockouts disagree, the mechanism on offer is hepatic rather than chondral, and round 283's own cross
    found LCORL not cluster-restricted in the growth plate. Not refuted as a human height gene; refuted as a
    plate-autonomous one, which is what the open-plate test asks.
- claim: >-
    Any of TET1, ZFAT, NRK, CHD8 or FBN1 has been tested for a postnatal or tissue-restricted length effect.
  grade: E
  basis: >-
    NONE OF THEM HAS. There is no tissue-restricted and no postnatally-induced perturbation of any of the
    five with a bone-length endpoint in any species, and for NRK there is no skeletal experiment of any kind.
    The test class is cheap, it now has a template in haraguchi2025, and it has never been applied to them.
- claim: >-
    The HHIP result licenses starting a hedgehog-directed agent in this subject.
  grade: X
  basis: >-
    NO. The deletion is embryonic in onset even though the phenotype is progressive; no HHIP-directed
    pharmacology exists in any species; the only pharmacological hedgehog agonism with a length endpoint in
    this file is either systemic SAG, which raised the pool and left length unchanged, or purmorphamine
    delivered by cartilage-targeted nanoparticle into a RESCUE model, where CORR-203 applies. And the
    opposite direction of this same axis carries a grade-A human harm - irreversible physeal fusion in
    children. What the round delivers is that the gain direction is open, not that it is safe or reachable.
key_refs:
- ref_id: haraguchi2025
  pmid: '41509161'
  year: 2025
  type: primary
  one_line_finding: >-
    Limb-restricted deletion of the hedgehog antagonist Hhip1 gives a significantly LONGER FEMUR at 10 AND 53
    weeks with NO body-weight difference at either age, zones enlarged but ordered, and Gli1 up - the
    postnatal, tissue-autonomous, length-endpoint evidence the hedgehog gain direction never had
- ref_id: xiu2022
  year: 2022
  type: primary
  one_line_finding: >-
    The comparator that reverses the sign - Sufu deletion, an INTRACELLULAR brake, expands the plate while
    destroying its zonal order and gives significantly SHORTER femurs at P120
- ref_id: wyler2024
  pmid: '39467326'
  year: 2024
  type: primary
  one_line_finding: >-
    Lcorl-null mice are born smaller with REDUCED CIRCULATING IGF-1 and altered hepatic GH-signalling genes -
    the opposite direction to bai2025 and a hepatic rather than chondral mechanism, which is what removes
    LCORL from the plate-autonomous list
- ref_id: tyra300_2025
  year: 2025
  type: primary
  one_line_finding: >-
    The counterexample that kills the germline objection - a germline, prenatal, whole-organism axis moved
    POSTNATALLY in a WILD-TYPE mouse for femur +8.2 per cent
- ref_id: kosmicki2026
  year: 2026
  type: preprint
  one_line_finding: >-
    Human HHIP loss-of-function +9.92 cm and an HHIP gain-of-function missense -3.96 cm, which is the human
    half of the same monotonic relationship haraguchi2025 shows in mouse
contradicts: >-
  WITHDRAWS THE GAIN-DIRECTION CLOSURE OF
  round268_hedgehog_is_bounded_on_both_sides_and_the_withdrawal_lever_is_refuted_in_three_species. Round 268
  graded "sustained cell-autonomous hedgehog gain expands the plate and converts that expansion into length"
  as X on xiu2022's Sufu deletion. haraguchi2025 removes a SECRETED hedgehog antagonist in limb mesenchyme
  and gets a significantly longer femur at 10 and 53 weeks with no weight change and zones intact. Round
  268's WITHDRAWAL arm is untouched - human physeal fusion on hedgehog inhibitors stays at grade A and
  reduced attained height at grade B.
  It also OVERTURNS A METHOD used by
  round281_the_overgrowth_syndromes_do_not_transfer_to_the_growth_plate_except_one_and_that_one_is_a_pure_pool_lever,
  round282_the_third_spin4_family_replicates_the_male_and_breaks_the_female_and_hands_us_a_free_measurement
  and round283_the_six_genes_whose_loss_makes_humans_taller_and_why_this_atlas_kept_missing_them, all three of
  which dismissed or discounted a human genetic result because the exposure was germline from conception.
  That objection is refuted by dabogratinib in wild-type mice and by vosoritide and infigratinib in children.
  And it DOWNGRADES round 283's LCORL claim from "most cross-species-replicated taller-gene in existence" to
  an unresolved conflict with a hepatic mechanism.
