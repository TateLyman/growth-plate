contradicts:
- >-
  The stack's treatment of growth hormone as a velocity agent with a bone-age cost. Under the reserve
  objective it is also a POOL-DEPLETING agent, which is a second and independent way of spending adult height.
- >-
  The framing of the FGFR arm as a proliferation-rate lever. FGFR3 tone governs the root-cell exit decision
  and the ORIENTATION of the resulting column, which is the fate decision itself.
- >-
  Any assumption that the growth plate stem cell hierarchy is known well enough to compute yields against.
  Five marker-defined populations, no established hierarchy, and the human root cell is PTHLH-negative.
