id: round240_the_root_cell_reframe_the_controllable_variable_is_the_self_renewal_fraction
name: >-
  ROUND 240 - the programme reframed onto the root cell. Renewal is by POPULATION ASYMMETRY, so the
  controllable variable is the SELF-RENEWAL FRACTION; pharmacological growth hormone LOWERS it and depletes
  the pool; and FGFR3 tone sets root-cell turnover and column ORIENTATION through CREB
type: hypothesis
layer: L2
aliases:
- the root cell reframe
- the self-renewal fraction is the variable
- GH depletes the pool
- FGFR3 to CREB sets column orientation
- round 240
stub: false
summary: |
  THE INSTRUCTION IS TO STOP OPTIMISING VELOCITY AND SOLVE THE ROOT CELL. THAT IS THE RIGHT REFRAME, IT IS
  ROUND 198's OWN OBJECTIVE FUNCTION TAKEN SERIOUSLY - ADULT HEIGHT IS RESERVE TIMES TERMINAL CELL HEIGHT -
  AND ACTING ON IT INDICTS AN ARM OF THIS STACK.

  ONE - THE MECHANISM IS NOT AN ASYMMETRIC-DIVISION SWITCH, WHICH CHANGES WHAT THERE IS TO CONTROL. chu2025
  shows by clonal and lineage tracing that growth plate stem cells RENEW BY POPULATION ASYMMETRY - the pool
  is maintained statistically across many divisions rather than by every cell dividing into one stem and one
  committed daughter. SO THERE IS NO SWITCH TO FLIP. THE CONTROLLABLE VARIABLE IS THE FRACTION OF DIVISIONS
  THAT ARE SELF-RENEWING, and any intervention has to move a ratio rather than install a behaviour. The
  target condition asked for - replacement greater than or equal to loss - is exactly the statement that
  this fraction is at or above one half.

  TWO, AND IT IS THE MOST CONSEQUENTIAL FINDING IN THIS SESSION - PHARMACOLOGICAL GROWTH HORMONE LOWERS THAT
  FRACTION AND DEPLETES THE POOL. chu2025, in NON-GH-DEFICIENT mice: GH reduces the pool of slow-cycling
  label-retaining stem cells BY PROMOTING COMMITTED RATHER THAN SELF-RENEWING DIVISION, expanding transit
  amplifying progenitors and raising proliferation throughout the plate WHILE SPENDING THE ROOT POPULATION
  THAT GENERATES IT. Deleting the GH receptor in stem cells impairs their ability to make chondrocytes, so
  the action is direct, and JAK2/STAT5 activation is spatially restricted to the RESTING ZONE. The authors
  name the consequence themselves - it may underpin both the therapeutic action AND THE DIMINISHING
  LONG-TERM EFFICACY of GH.

  PUT THAT BESIDE ROUND 236. GROWTH HORMONE ADVANCES BONE AGE AT 1.37 YEARS PER CALENDAR YEAR (mauras2008,
  randomised) AND IT DEPLETES THE ROOT STEM CELL POOL. THOSE ARE TWO INDEPENDENT MECHANISMS BY WHICH GH
  SPENDS ADULT HEIGHT TO BUY CURRENT VELOCITY. Under the reserve objective, GH is the arm that most clearly
  trades the thing being maximised for the thing being measured - and its own literature already records the
  clinical signature, which is that it works less well the longer it is given.

  THE COUNTERWEIGHT IS REAL AND MUST BE CARRIED. The direction is DOSE AND CONTEXT DEPENDENT: physiological
  GH in HYPOPHYSECTOMISED rats did the OPPOSITE, increasing slowly-dividing resting zone cells, and GHR
  deletion impairs chondrocyte generation, so GH is required for normal stem cell output. The depletion
  result is PHARMACOLOGICAL dosing in GH-SUFFICIENT mice. And chu2026 reports GH acting directly
  on human growth plate explants, activating JAK/STAT, TGF-beta and ERK, inhibiting AKT, and STIMULATING
  PROLIFERATION OF BOTH CARTILAGE STEM CELLS AND PROLIFERATIVE-ZONE CHONDROCYTES. Stimulating proliferation
  of stem cells and depleting them are not contradictory under population asymmetry - the pool can cycle
  faster and still shrink if the renewing fraction falls.

  THREE - FGFR3 TONE SETS ROOT-CELL TURNOVER AND COLUMN ORIENTATION, THROUGH A DRUGGABLE NODE. horike2026
  knocked the achondroplasia p.Gly380Arg mutation into mice and found an EXPANDED RESTING ZONE caused by
  DISRUPTED TURNOVER and IMPAIRED STEM-CELL-LIKE BEHAVIOUR, with cells accumulating in the resting zone
  instead of entering columns. Confetti clonal tracing gives the decisive image: control plates show
  single-colour stacked columns, while in the mutant ONLY A FEW CLONAL CELLS STACKED AND THE ANGLES OF THE
  CLONAL STACKS RELATIVE TO THE LONGITUDINAL AXIS WERE MORE VARIABLE - progeny moved in random directions
  and stayed in the resting zone. Pathway analysis and functional experiments name CREB as the effector that
  disrupts stem-cell-like properties, and THE CREB INHIBITOR 666-15 RESTORED GROWTH PLATE PATHOLOGY AND BONE
  LENGTH.

  THAT IS THE BRIDGE FROM THE ARM THIS PROGRAMME JUST SETTLED TO THE QUESTION IT NOW ASKS. The FGFR arm was
  being treated as a proliferation-rate lever. horike2026 says FGFR3 tone governs the ROOT-CELL EXIT
  DECISION and the ORIENTATION of the column that follows it - which is precisely the fate decision named in
  the reframe, and precisely the failure mode named as forbidden. IT ALSO SUPPLIES THE ONE THING THE
  PROGRAMME HAS NEVER HAD - A DRUGGABLE NODE DOWNSTREAM OF FGFR3 THAT IS NOT FGFR3.

  AND THE RESTORATION TRAP IS OPEN AGAIN, EXPLICITLY. horike2026 is achondroplasia - hyperactive FGFR3
  returned toward normal, which is CORR-203's RESTORATION and not ELEVATION. Nothing here shows that pushing
  FGFR3 BELOW normal tone in a wild-type plate raises the self-renewal fraction further, and the same
  question defeated the erdafitinib analysis at round 234.

  FOUR - THE REGISTER, AS FAR AS IT GOES, AND ITS DENOMINATOR PROBLEM. cheng2025 enumerates FIVE
  marker-defined growth plate stem cell populations - PTHrP, CD73, Axin2, FoxA2 and ApoE - and avijgan2026's
  PRISMA review concludes the HIERARCHY IS NOT ESTABLISHED, with neither single-cell sequencing at any age
  nor label retention resolving whether the resting zone holds distinct quiescent subpopulations. THE HUMAN
  ROOT CELL IS PTHLH-NEGATIVE, which means the mouse marker that defines the field does not mark the human
  cell with the most stem-like profile. EVERY YIELD IN THIS PROGRAMME IS COMPUTED AGAINST A MARKER RATHER
  THAN A CELL TYPE, AND THAT REMAINS TRUE.

  POSITIVE ON RENEWAL OR ON POOL SIZE - HEDGEHOG AFTER SECONDARY OSSIFICATION CENTRE FORMATION, where SAG
  promotes resting zone proliferation and vismodegib causes premature fusion around P35 in mouse and
  WIDESPREAD PERSISTENT GROWTH PLATE FUSIONS IN THREE CHILDREN (robinson2017a), which is the human
  loss-of-function proof that hedgehog is required to keep the plate open; mTORC1 activation, which expands
  the colony-forming pool toward symmetric division with CD73 up; physiological GH; and a niche LOW IN WNT
  AND TGF-BETA, which is the human root cell's own microenvironment.

  NEGATIVE - PHARMACOLOGICAL GH; EXCESS FGFR3 THROUGH CREB; and HEDGEHOG BEFORE SOC FORMATION, where both
  the agonist and the antagonist reduced PTHrP-expressing stem cells and their progeny. THE STAGE
  DEPENDENCE FAVOURS THIS CASE - a subject at bone age 16 is as far post-SOC as it is possible to be.

  FIVE - THE SMALLEST CONTROLLABLE INTERVENTION, RANKED BY WHAT IT WOULD COST TO BE WRONG. THE CHEAPEST IS A
  SUBTRACTION - REMOVE OR MINIMISE PHARMACOLOGICAL GH, because it is the one agent shown to lower the
  self-renewal fraction, it carries an independent 1.37 years per year of bone age, and stopping it requires
  no new molecule and no new risk. NEXT IS THE CHARGE-AND-DISCHARGE PAIR ALREADY IN THIS ATLAS - mTORC1
  activation expands the pool but produces POOL WITHOUT FLUX, and newton2019 supplies the release in the
  same paper, because its Tsc1-expanded clusters RETAIN HEDGEHOG DEPENDENCE and vismodegib FORCED THEM TO
  DIFFERENTIATE DIRECTLY INTO COLUMNAR CELLS forming multi-columnar clones. Charge with mTORC1, discharge by
  lowering hedgehog. THIRD IS CREB INHIBITION, which is new this round, sits downstream of a receptor this
  programme is already engaging, and has a compound and an in vivo length result behind it.

  AND THE FORBIDDEN FAILURE MODES ARE NOT HYPOTHETICAL. LOSS OF COLUMN ORGANISATION IS THE OBSERVED
  PHENOTYPE of perturbing this axis - horike2026's randomised stack angles. OSTEOGENIC ESCAPE IS BUILT INTO
  THE LINEAGE, because Prrx1 clonal tracing yields stromal AND OSTEOBLASTIC progeny alongside chondrocytes.
  And orikasa2024's pre-SOC hedgehog pulse produced clonal derangement, OSTEOBLAST CONVERSION and a
  transient length DECREMENT - all three failure modes in one experiment.
quantitative:
- parameter: how growth plate stem cells renew, and what growth hormone does to it
  value: >-
    RENEWAL IS BY POPULATION ASYMMETRY, established by clonal and lineage tracing - the pool is maintained
    statistically rather than by obligate one-stem-one-committed division, so the controllable variable is
    THE FRACTION OF SELF-RENEWING DIVISIONS. In non-GH-deficient mice, PHARMACOLOGICAL GH REDUCES THE POOL
    OF SLOW-CYCLING LABEL-RETAINING STEM CELLS by promoting committed rather than self-renewing division,
    expanding transit-amplifying progenitors and raising proliferation throughout the plate. GHR deletion in
    stem cells impairs chondrocyte generation, so the action is direct; JAK2/STAT5 activation is spatially
    restricted to the RESTING ZONE
  unit: mode of renewal, and direction of change in stem cell pool
  conditions: multiple transgenic mouse models, pharmacological GH dosing in GH-sufficient animals
  species: mouse
  source_ref: chu2025
  uncertainty: >-
    MOUSE, AND THE DIRECTION IS DOSE- AND CONTEXT-DEPENDENT - physiological GH in HYPOPHYSECTOMISED rats
    increased slowly-dividing resting zone cells, the opposite result, and the authors say so. GHR deletion
    impairing chondrocyte output shows GH is REQUIRED for normal stem cell function, so this is not a case
    against GH as such but against PHARMACOLOGICAL exposure in a GH-sufficient plate. The downstream
    molecular mechanism is unelucidated by the authors' own statement
- parameter: FGFR3 tone governs root-cell turnover and the orientation of the column that follows
  value: >-
    Fgfr3-Ach knock-in mice (p.Gly380Arg) show an EXPANDED RESTING ZONE from DISRUPTED TURNOVER and IMPAIRED
    STEM-CELL-LIKE BEHAVIOUR, cells accumulating instead of entering columns. Confetti clonal tracing -
    control plates give single-colour stacked columns; in the mutant ONLY A FEW CLONAL CELLS STACKED and THE
    ANGLES OF CLONAL STACKS RELATIVE TO THE LONGITUDINAL AXIS WERE MORE VARIABLE, so progeny moved in random
    directions and remained in the resting zone. CREB is identified as the effector disrupting stem-cell-like
    properties, and THE CREB INHIBITOR 666-15 RESTORED GROWTH PLATE PATHOLOGY AND BONE LENGTH
  unit: zone architecture, clonal stack angle, and rescue by a small molecule
  conditions: knock-in mouse of the human achondroplasia mutation, Col11a2-CreERT with R26R-Confetti
  species: mouse
  source_ref: horike2026
  uncertainty: >-
    ACHONDROPLASIA - HYPERACTIVE FGFR3 RETURNED TOWARD NORMAL, which is RESTORATION and not ELEVATION
    (CORR-203). Nothing here shows that pushing FGFR3 BELOW normal tone in a wild-type plate raises the
    self-renewal fraction further, and that is the same question that defeated the dose analysis at round
    234. Mouse, and 666-15 has no paediatric human exposure of any kind
- parameter: the population register, and its denominator problem
  value: >-
    FIVE marker-defined growth plate stem cell populations are enumerated - PTHrP, CD73, Axin2, FoxA2 and
    ApoE - and a PRISMA systematic review concludes the HIERARCHY IS NOT ESTABLISHED, with neither
    single-cell sequencing at any age nor label retention resolving whether the resting zone contains
    distinct quiescent subpopulations. THE HUMAN ROOT CELL IS PTHLH-NEGATIVE, so the mouse marker defining
    the field does not mark the human cell with the most stem-like profile
  unit: number of marker-defined populations, and status of the hierarchy
  conditions: review-level enumeration plus a PRISMA systematic review of resting-zone quiescence
  species: human
  source_ref: chu2026
  uncertainty: >-
    EVERY YIELD IN THIS PROGRAMME IS COMPUTED AGAINST A MARKER RATHER THAN A CELL TYPE. The human root-cell
    paper is NOT OPEN ACCESS and its figures have never been read here, so no clonal kinetic numbers exist
    in this atlas for the human population it describes
localization:
- 'the upper resting zone, where the PTHLH-negative root cell sits in a low-WNT low-TGF-beta niche'
- 'the resting-to-proliferative transition, which is both the fate decision and the orientation decision'
human_evidence: indirect
human_evidence_note: >-
  The root-cell identification and the direct GH effect are human, from pubertal growth plate tissue, but
  the paper is paywalled and its figures unread here. The renewal mode, the GH depletion result and the
  FGFR3-CREB axis are all mouse.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: >-
  The two load-bearing new results are mouse, one of them in a disease model where the perturbation is
  restoration rather than elevation. The human marker does not match the mouse marker, which is itself
  evidence that the species map is not aligned.
confidence: C
claim_grades:
- claim: the controllable variable is the self-renewal fraction rather than an asymmetric-division switch
  grade: C
  basis: >-
    Clonal and lineage tracing show renewal by POPULATION ASYMMETRY. Mouse, one study, but it reframes what
    an intervention has to do - move a ratio rather than install a behaviour
- claim: pharmacological growth hormone depletes the growth plate stem cell pool
  grade: C
  basis: >-
    Multiple transgenic mouse models, label-retention and clonal tracing, with the authors linking it to the
    known diminishing long-term efficacy of GH. Mouse; and physiological GH in hypophysectomised rats gives
    the opposite, so the claim holds for PHARMACOLOGICAL exposure in a GH-sufficient plate
- claim: growth hormone spends adult height by two independent mechanisms
  grade: C
  basis: >-
    A randomised human bone-age cost of 1.37 years per calendar year (mauras2008) and a mouse stem-cell
    depletion (chu2025). Different species, different endpoints, same direction - and under the reserve
    objective both subtract from the quantity being maximised
- claim: FGFR3 tone sets root-cell turnover and column orientation via CREB
  grade: C
  basis: >-
    Knock-in mouse with clonal tracing, scRNA-seq, pathway analysis and a small-molecule rescue restoring
    bone length. Mouse and achondroplasia, so restoration rather than elevation
- claim: lowering FGFR3 below normal tone raises the self-renewal fraction in a wild-type plate
  grade: E
  basis: >-
    NOT SHOWN BY ANYTHING. This is the restoration-versus-elevation trap (CORR-203) in its newest location,
    and it is the same question that bounded the dose analysis at round 234
- claim: the growth plate stem cell hierarchy is established
  grade: X
  basis: >-
    FALSE by a PRISMA systematic review's own conclusion. Five marker-defined populations, no resolved
    hierarchy, and the human root cell does not express the defining mouse marker
