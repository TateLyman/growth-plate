id: round246_all_three_questions_answered
name: >-
  ROUND 246 - the three questions closed. GH's effect on the root cell is inferrable from LABEL RETENTION,
  not from chu2025's markers, which are PTHrP and never Prrx1. The SMAD2-versus-SMAD3 escape is REFUTED -
  both maintain the resting pool and wang2016 tested it in 2016. And the self-renewal fraction is NOT A FREE
  PARAMETER: under neutral drift it is pinned at one half, so the target is RESTORATION to it, not elevation
  above it
type: hypothesis
layer: L2
aliases:
- the three questions answered
- the fraction is pinned at one half
- Smad2 does not oppose Smad3
- lineage half-life
- round 246
stub: false
summary: |
  THREE QUESTIONS WERE LEFT OPEN AS 'NEEDING EXPERIMENTS NOBODY HAS RUN'. TWO OF THE THREE WERE ALREADY
  ANSWERED IN PAPERS, AND THE THIRD TURNS OUT TO HAVE BEEN THE WRONG QUESTION.

  QUESTION ONE - WHAT DOES GROWTH HORMONE DO TO THE ROOT CELL? Partly answerable, and the first thing that
  had to be fixed was my own citation. CORR-256: chu2025 uses Pthrp-mCherry, Pthrp-CreERT2, CD73, H2B-GFP
  and Col2a1-CreERT2. THE WORDS PRRX1, GP1 AND ROOT APPEAR ZERO TIMES IN IT. Four rounds of this atlas cited
  its depletion result as being about the root pool. It is about the PTHrP-POSITIVE population, which
  chu2026 defines as GP2 and explicitly NOT the root cluster. Shared first author and laboratory carried an
  inference they do not support.

  WHAT SURVIVES IS THE LABEL-RETENTION ARM, AND IT IS THE CLOSEST THING TO A GP1 MEASUREMENT THAT EXISTS.
  The H2B-GFP experiment is COMPARTMENT-LEVEL rather than marker-restricted - after the chase, label-
  retaining cells sit predominantly in the resting zone - and GH significantly reduced them (n = 4,
  P < 0.001). GP1 is the slowest-cycling cluster in the human plate by chu2026's own cell-cycle analysis,
  which makes it precisely the population most enriched among label-retaining cells. SO GH REDUCES THE
  SLOWEST-CYCLING RESTING-ZONE CELLS, AND GP1 IS THE POPULATION MOST LIKELY TO BE AMONG THEM. That is an
  inference from label retention, graded as one, and it is stronger than the 'nobody has measured it' this
  atlas had been writing.

  THE MECHANISM IS EXIT, NOT SLOWER DIVISION, AND THE NUMBERS SAY SO. PTHrP+ cells fell (n = 6, P < 0.0001)
  and CD73+ cells fell, while EdU incorporation in mCherry+ cells was UNCHANGED and Ki67 showed only a
  non-significant decrease. Lineage tracing gives the same picture from the other side: GH increased clone
  size (P = 0.011), reduced the proportion of single-labelled cells - the ones that never divided - and MORE
  THAN DOUBLED the frequency of large clones over five cells. GH does not make stem cells divide slower or
  die. IT MAKES THEM LEAVE.

  QUESTION TWO - THE SMAD2-VERSUS-SMAD3 SPLIT. REFUTED, AND THE EXPERIMENT WAS PUBLISHED IN 2016. CORR-254
  proposed that the root brake might be Smad2-borne while the hypertrophy restraint is Smad3-borne, and
  called it the sharpest experiment the line generates. wang2016 ran it: Smad2fx/fx;Col2a1-Cre, global
  Smad3-/-, and the double mutant, open access since 2016.

  SMAD2 DOES NOT OPPOSE SMAD3. IT DOES THE SAME THING, HARDER. The RESTING ZONE IS SHORTER in Smad2CKO and
  in double mutants while columnar and hypertrophic zones are LONGER; there is a 2- TO 3-FOLD INCREASE IN
  PCNA-POSITIVE CELLS IN THE RESTING ZONE in all three genotypes with NO change in the columnar zone and no
  TUNEL difference. The authors' conclusion is that loss of Smad2 and/or Smad3 PROMOTES THE ENTRY OF RESTING
  CHONDROCYTES INTO THE PROLIFERATIVE COLUMNAR PHASE, and that BOTH SMADS MAINTAIN THE POOL OF RESTING
  CHONDROCYTES.

  THAT LEAVES THE CONTRADICTION WITH chu2026 SHARPER, NOT SOFTER, AND IT IS NOT PAPERED OVER HERE. If Smad2
  is REQUIRED to hold resting cells back, the root cluster having the LOWEST SMAD2 regulon activity is odd,
  and GH raising resting-zone p-Smad2 while depleting label-retaining cells is odder. Two of CORR-254's
  three options survive - ZONE, since the genetics are whole-cartilage and cannot separate GP1 from GP2, and
  CAUSALITY, since low SMAD2 activity in GP1 may be a consequence rather than a cause. A third is now worth
  naming: THE ANTAGONISTS GP1 SECRETES ARE SOLUBLE AND MAY ACT ON ITS NEIGHBOURS RATHER THAN ON ITSELF, in
  which case GP1 imposes low TGF-beta downstream while remaining Smad2-dependent itself. NOTHING AVAILABLE
  DISTINGUISHES THESE THREE.

  AND wang2016 DELIVERS SOMETHING THE PROGRAMME HAS WANTED SINCE ROUND 198 - A GENETIC EXISTENCE PROOF OF
  THE EXCHANGE RATE. Double mutants have LONGER growth plates at midgestation and at P0, then PROGRESSIVE
  POSTNATAL DWARFISM: body 9.7 per cent shorter at P0 (n = 4, P = 0.04) and 12.5 per cent shorter at one
  month (n = 3, p = 0.05), which the authors attribute to premature depletion of the resting pool. BIGGER
  PLATE AND FASTER PROLIFERATION NOW; SMALLER ANIMAL LATER; BECAUSE THE POOL WAS SPENT. That is round 198's
  objective function demonstrated by mutation rather than by drug, and it is the cleanest such demonstration
  the atlas holds.

  QUESTION THREE - THE SELF-RENEWAL FRACTION. IT IS NOT A FREE PARAMETER, AND ASKING FOR IT WAS THE ERROR.
  chu2025's Fig. 4D and 4E give average clone size and clone density from 2 to 7 months. Read off the
  published figure: size 11.3, 12.6, 14.2, 21.0, 21.2 cells per clone; density 43.0, 14.2, 16.5, 13.2, 7.7
  clones per mm. Size times density is NOT conserved - it falls from 486 to 163 - because the growth plate
  is a FLOW-THROUGH system whose labelled progeny leave through the hypertrophic zone. So the neutral-drift
  algebra applies to the stem compartment only, with clone density as its observable.

  A LINEAGE HALF-LIFE IS DERIVABLE AND THE PAPER DOES NOT STATE ONE: 138 days across the post-washout window
  from 3 to 7 months, or 61 days if the 2-month point is included. The two disagree by more than twofold and
  the reason is in the data - the 2-to-3-month collapse from 43.0 to 14.2 is far steeper than anything after
  it, and the 4-month point is HIGHER than the 3-month point, so the series is not monotonic. The early
  collapse reads as clones that never contained a stem cell washing out. THE POST-WASHOUT NUMBER IS THE
  DEFENSIBLE ONE AND IT CARRIES THE NON-MONOTONICITY AS ITS ERROR.

  BUT THE FRACTION ITSELF CANNOT BE EXTRACTED, AND THAT IS NOT A LIMITATION OF THE DATA. Under population
  asymmetry with neutral competition - which is exactly what chu2025 demonstrates, and what the exponential
  clone-size scaling at R-squared 0.96 confirms - THE PROBABILITY OF SYMMETRIC RENEWAL EQUALS THE
  PROBABILITY OF SYMMETRIC LOSS. The fraction is pinned at one half BY THE DEFINITION OF NEUTRALITY, and no
  clone-size dataset can measure it because every neutral system returns the same answer. What clone data
  measures is the EXTINCTION RATE, which is the product of the division rate and the symmetric-division
  probability, and separating the two needs a division rate the clone data does not contain.

  SO THE TARGET HAS TO BE RESTATED, AND RESTATING IT CHANGES WHAT COUNTS AS SUCCESS.

  RAISING THE FRACTION ABOVE ONE HALF DOES NOT PRODUCE A BIGGER POOL AT STEADY STATE - IT ABOLISHES
  NEUTRALITY. A population in which renewal reliably exceeds loss is a clonally expanding population, which
  is precisely the hyperplasia the brief forbade. The instruction that opened this line asked for root-cell
  replacement greater than or equal to loss WITHOUT hyperplasia, and those two clauses turn out to define
  the SAME point rather than a range: THE TARGET CONDITION IS EXACTLY NEUTRALITY.

  A CLOSING GROWTH PLATE IS NOT AT NEUTRALITY. Its pool is declining, so renewal is BELOW loss. Moving it
  back toward one half is RESTORATION, not elevation - which is CORR-203 pointing, for once, in the
  direction this programme is allowed to want. THE SEARCH SHOULD THEREFORE STOP LOOKING FOR A LEVER THAT
  RAISES THE FRACTION AND START LOOKING FOR WHATEVER DRAGS IT BELOW ONE HALF AS A PLATE APPROACHES CLOSURE.
  That is a different question and the atlas has not asked it.
quantitative:
- parameter: >-
    growth hormone reduces label-retaining cells in the resting zone - the compartment-level result that is
    the closest available proxy for the root cell, since GP1 is the slowest-cycling cluster
  value: 'significant reduction, n = 4 mice per group, P < 0.001'
  unit: GFP-positive label-retaining cells in the resting zone, vehicle versus GH
  conditions: >-
    H2B-GFP:Tet-On mice, doxycycline P10-P23 to label, chase to P38, GH or vehicle P28-P38, xylenol to mark
    mineralised tissue
  species: mouse
  source_ref: chu2025
  uncertainty: >-
    COMPARTMENT-LEVEL, NOT MARKER-RESOLVED. Label retention enriches for the slowest cyclers and GP1 is the
    slowest cluster in human, but no Prrx1 or CYTL1 marker was used anywhere in this paper. The inference
    from 'slowest-cycling resting cells' to 'GP1' is mine and is graded as inference
- parameter: >-
    GH depletes the PTHrP-positive stem cell pool WITHOUT changing its proliferation - so the loss is by
    exit rather than by slower division or death
  value: 'PTHrP-mCherry+ cells significantly reduced, n = 6, P < 0.0001; EdU in mCherry+ cells UNCHANGED;
    Ki67 a non-significant decrease; CD73+ cells also reduced'
  unit: reporter-positive cells per growth plate, vehicle versus GH
  conditions: PTHrP-mCherry mice, GH or vehicle P28-P38, four EdU pulses P34-P37
  species: mouse
  source_ref: chu2025
  uncertainty: >-
    THIS IS GP2, NOT THE ROOT CELL (CORR-256). mCherry reports PTHrP expression as well as cell number,
    which the authors address by confirming with CD73
- parameter: >-
    GH pushes stem cells out of quiescence into productive division - fewer single-cell clones, more than
    double the large clones
  value: 'clone size increased P = 0.011 (Mann-Whitney); proportion of single-labelled cells declined;
    two-cell clones unchanged; clones over five cells MORE THAN DOUBLED; n = 5 mice per group'
  unit: clone size distribution after 13 days of tracing
  conditions: Pthrp-CreERT2:R26R-tdTomato, tamoxifen P25-P26, GH or vehicle P28-P38
  species: mouse
  source_ref: chu2025
  uncertainty: recombination was sparse enough for clonality - only 2 to 6 recombined cells per 160 um
    section - but this is the PTHrP+ population
- parameter: >-
    both Smad2 and Smad3 maintain the resting pool - losing either accelerates resting-zone exit, refuting
    the proposal that they oppose each other
  value: '2- to 3-fold increase in PCNA-positive cells in the RESTING ZONE in Smad2CKO, Smad3-/- and double
    mutants; no change in the columnar zone; no TUNEL difference; resting zone SHORTER and columnar and
    hypertrophic zones LONGER'
  unit: proliferating cells by zone, and zone lengths, mutant versus littermate control
  conditions: Smad2fx/fx;Col2a1-Cre, global Smad3-/-, and Smad2fx/fx;Col2a1-Cre;Smad3-/-, neonatal mouse
  species: mouse
  source_ref: wang2016
  uncertainty: >-
    Col2a1-Cre is constitutive and whole-cartilage, so it cannot separate GP1 from GP2 and does not resolve
    the contradiction with chu2026's regulon result - it only closes the effector-identity escape
- parameter: >-
    THE EXCHANGE RATE, GENETICALLY - longer plates and faster proliferation in the neonate, then progressive
    dwarfism, attributed by the authors to premature depletion of the resting pool
  value: 'body 9.7 per cent shorter at P0 (n = 4, P = 0.04); 12.5 per cent shorter at one month (n = 3,
    p = 0.05); growth plates LONGER at midgestation and P0'
  unit: per cent of littermate control body length
  conditions: Smad2CKO;Smad3-/- double mutants versus Smad2fx/fx littermates
  species: mouse
  source_ref: wang2016
  uncertainty: >-
    n = 3 and n = 4 with p values at the 0.05 boundary; the attribution to pool depletion is the authors'
    interpretation rather than a lineage measurement, and Smad2 is also a negative regulator of Ihh in this
    model, so more than one route to the phenotype is open
- parameter: >-
    lineage half-life in the mouse growth plate, derived here from clone density and not stated by the
    authors
  value: '138 days across the post-washout window from 3 to 7 months; 61 days if the 2-month point is
    included'
  unit: days for half of surviving stem-cell lineages to be extinguished
  conditions: >-
    Col2-CreERT2:R26R-Confetti, tamoxifen at 1 month; clone density read off Fig. 4E as 43.0, 14.2, 16.5,
    13.2 and 7.7 clones per mm at 2, 3, 4, 5 and 7 months
  species: mouse
  source_ref: chu2025
  uncertainty: >-
    A FIGURE READ AND A DERIVED FIGURE, graded as re-analysis. The two windows disagree by more than
    twofold; the series is NOT monotonic, with the 4-month density higher than the 3-month; and size times
    density is not conserved, so this tracks the stem compartment only under an assumption the data cannot
    check
  value_unverified: true
localization:
- 'mouse resting zone: label-retaining cells after chase, and the PTHrP+ and CD73+ populations within it'
- 'mouse neonatal growth plate: resting zone shortened and columnar and hypertrophic zones lengthened in
  Smad2 and Smad3 mutants'
human_evidence: absent
human_evidence_note: >-
  Every measurement in this node is mouse. The only human input is chu2026's cell-cycle ranking of GP1 as
  the slowest-cycling cluster, which is what licenses the inference from label retention to the root cell,
  and that is an inference rather than a measurement.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: >-
  Mouse growth plates do not close. Every kinetic number here comes from a plate that never fuses, and the
  question the programme is asking is about a plate approaching closure, where the pool is by hypothesis
  declining rather than at neutrality. The neutral-drift argument is a general result about population
  asymmetry and transfers better than the numbers do.
confidence: C
confidence_reason: >-
  The wang2016 genetics are a clean published result and would be B on their own. The GH-to-root-cell answer
  is an inference from a compartment-level assay and is D. The neutral-drift argument is a mathematical
  consequence of a demonstrated property rather than a measurement, so it is as good as the demonstration -
  one paper, R-squared 0.96. Graded C as the weighted whole, and the individual quantitative rows carry
  their own limits.
