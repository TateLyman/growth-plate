id: stem_cell_niche_vascular_coupling
name: Vascular coupling of the skeletal stem cell niche
type: process
summary: 'Skeletal progenitor behaviour is set in part by a specific vessel type. Type H capillaries (CD31-high,
  endomucin-high) in the murine metaphysis are surrounded by osteoprogenitors, couple angiogenesis to
  osteogenesis, and decline with age in parallel with bone formation. This is the vascular arm of the
  argument that the secondary ossification centre creates the resting zone niche: the SOC is itself a
  vascular invasion event, and cartilage canals carrying vessels precede it. The strongest mechanistic
  link demonstrated so far is indirect - in the mSSC scheme, VEGF blockade during BMP2-induced ossicle
  formation shifts the output from bone with a marrow cavity to predominantly cartilage, showing that
  vascular signalling steers skeletal progenitor fate. What has not been shown is that manipulating the
  epiphyseal vasculature specifically changes resting-zone stem cell acquisition, which is the experiment
  that would test the SOC hypothesis (gap g_l2stem_003).'
quantitative: []
localization:
- 'mouse metaphysis: type H vessels confirmed (kusumbe2014)'
- 'mouse epiphysis/SOC: vascular invasion precedes SOC formation; niche consequence unconfirmed'
human_evidence: absent
human_evidence_note: Type H vessel biology and VEGF-blockade fate switching are murine; no human epiphyseal
  equivalent has been tested functionally.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Depends on mouse vascular subtype markers and pharmacological blockade in mice;
  human epiphyseal vascular anatomy differs in timing and canal structure.
