id: route1_closed_the_pool_is_partitioned
name: ROUTE 1 CLOSED - the resting pool is a partition not a hierarchy, its self-renewal fraction differs
  three and a half fold between subsets, and no manipulation of it has ever lengthened a normal bone
aliases:
- route 1 closure
- the resting zone is partitioned
- self-renewal fraction measured
type: hypothesis
layer: L2
stub: false
summary: 'ROUND 182 CLOSES ROUTE 1 BY READING THE FOUR DEFINING PRIMARIES IN FULL. The closure is not a
  shrug. Three of the four supply numbers this atlas did not have, one of them settles a question carried
  open since the five-population node, and together they say route 1 is the wrong lever FOR THIS CASE for a
  reason that can be stated quantitatively rather than assumed.

  FIRST - THE HIERARCHY QUESTION IS ANSWERED, AND THE ANSWER IS THAT THERE IS NO HIERARCHY. kodama2025
  measured Pthlh, Axin2 and Foxa2 IN THE SAME CELLS for the first time, by single-cell sequencing of a
  4-week mouse growth plate with FISH validation on the same tissue. Within the resting-chondrocyte cluster
  of 1,359 cells: Apoe positive in 97 per cent (1,324), Pthlh in 17 per cent (237), Foxa2 in 4 per cent
  (57), Axin2 in 2 per cent (32). Of the Apoe-positive cells, 77 per cent (1,023 of 1,324) are negative for
  all three stem markers. Of the 301 that carry one, more than 95 per cent (286) carry EXACTLY ONE, and
  there was NOT A SINGLE triple-positive cell. avijgan2026 concluded by systematic review that the
  hierarchy is not established; kodama2025 shows why nobody found one. It is a PARTITION - near-disjoint
  subsets of a single Apoe-positive compartment, together accounting for about 23 per cent of it.

  THE CONSEQUENCE IS A READING RULE, NOT A DOSING RULE. Every lineage-tracing paper in this programme
  reports on one slice. mizuhashi2018 column counts are a statement about 17 per cent of the resting
  compartment; muruganandan2022 about 4 per cent; oichi2023 about 2 per cent. None of them can be scaled to
  the plate, and this atlas has repeatedly written as though they could.

  SECOND - IT ALSO DISSOLVES THE ROUND-178 CONFLICT WITHOUT SMOOTHING IT. hallett2021 was registered as IN
  APPARENT TENSION with oichi2023: one says resting chondrocytes sit in a Wnt-INHIBITORY niche, the other
  marks progenitors with Axin2, a Wnt TARGET gene. Axin2-positive cells are 2 per cent of the compartment.
  The two papers were never describing the same cells. A 2 per cent Wnt-active subset inside a 97 per cent
  Wnt-inhibited compartment is not a contradiction, it is a measured minority. Recorded as a resolution
  with the resolving number attached, not as a reconciliation of convenience.

  THIRD - THE SELF-RENEWAL FRACTION HAS ACTUALLY BEEN MEASURED, AND IT IS SUBSET-SPECIFIC.
  muruganandan2022 ran the colony assay both ways. At plating PTHrP+ cells gave 40 per cent MORE primary
  colonies than FoxA2+ (51 versus 37) - so the more abundant subset looks better on the first pass and is
  worse on every pass after. Only 11 per cent of PTHrP+ primaries (6 of 51) formed secondaries against 38
  per cent of FoxA2+ (14 of 37). Nine per cent of FoxA2+ colonies (10 of 112) reached passage 9 and beyond;
  1.4 per cent of PTHrP+ colonies (2 of 143) reached passage 5. THAT 38-VERSUS-11 IS THE TERM-1 NUMBER THIS
  PROGRAMME HAS BEEN LOOKING FOR - a three and a half fold difference in self-renewal fraction between two
  subsets of one zone. Route 1 assumed a pool with a fraction to be raised. There is no such fraction;
  there are at least two, and the abundant one is the exhaustible one.

  FOURTH - AND THIS ONE CUTS AGAINST ROUTE 4, WHICH THIS PROGRAMME RANKED FIRST. muruganandan2022 traced
  the same population labelled early and late. Labelled P14-P18, clone number falls from 138 per hindlimb
  to 41 by three months - a 70 per cent loss, most of it to the secondary ossification centre as bone.
  Labelled P28-P37, clone number goes 55 to 57 over the same interval: NO LOSS. Resting-zone cells stop
  expressing col10 by P21 and their contribution to epiphyseal bone winds down after P28. FATE LEAKAGE TO
  OSTEOBLAST IS AN EARLY-LIFE LOSS TERM, NOT A LATE ONE. In a subject at bone age 16 the leak route 4 was
  built to plug has largely already shut on its own, which lowers route 4 headroom in this case
  specifically. Mouse, one population, one paper - but it is the only measurement of that term across age
  and it points the wrong way for the ranking.

  FIFTH - THE POOL IS SMALL AND THE ONE DIRECTIONAL LEVER ANYONE PULLED IS NEGATIVE. hallett2021 gives
  pool size by a method that needs no marker at all: label-retention decay in the Col2-Q quadruple
  transgenic fits a curve from 86.5 +/- 1.3 per cent down to a PLATEAU OF 2.6 +/- 0.9 PER CENT, half-life
  about one week. The residual 2.6 per cent is the slow-cycling compartment. And when Wnt was activated in
  PTHrP+ cells by Apc haploinsufficiency, resting cell number fell at P9, P12 and P21 and then converged -
  but LONG COLUMNS AT P96 FELL FROM 26.5 +/- 12.4 TO 7.3 +/- 2.5, a 72 per cent loss of long-column output
  at three months from a manipulation the authors themselves call modest. That is the most yield-relevant
  number in the four papers: the resting-to-column coupling has a gain large enough to lose most of, on a
  long latency, from a change that barely moves the cell count.

  SIXTH - THE ONE RESTING-ZONE DRUG WITH A LENGTH ENDPOINT IS NULL IN A NORMAL PLATE. horike2026 found
  CREB to be the resting-zone-specific limb of FGFR3 signalling, independent of ERK, and the inhibitor
  666-15 rescued plate structure and bone length in Fgfr3-Ach mice. IN CONTROL MICE IT CHANGED NEITHER
  WEIGHT NOR FEMUR LENGTH NOR RESTING-ZONE CD73. It is a corrector of a pathological defect, not an
  enhancer.

  WHY ROUTE 1 CLOSES. Not because the biology is absent - it is the best-populated route of the eight.
  Because after reading every defining primary, the count of manipulations that raised the resting pool AND
  lengthened a NORMAL bone is ONE, trompet2024, post-SOC intra-articular SAG at +3.63 per cent femur in
  rat, which the ledger already carries as the only pool intervention with a length endpoint. Everything
  else was either not measured for length (newton2019 Tsc1 charge, and the vismodegib discharge that
  nobody ran to a length endpoint), measured and null in wild-type (horike2026), or traded flux for pool
  (hallett2021 Wnt, newton2019 Tsc1). The gap is not an unfound paper. The experiment has not been run.

  AND THE STRUCTURAL REASON IT WAS NEVER GOING TO BE THE LEVER HERE. kodama2025 followed the Apoe-positive
  fraction to one year: it peaks at 9 weeks, declines with age, and is STILL PRESENT at one year in a mouse
  whose plate never closes. Human plates close with resting chondrocytes still in them. YOU DO NOT RUN OUT
  OF RESTING CHONDROCYTES, YOU RUN OUT OF PLATE. At bone age 16 the binding constraint is duration and the
  per-progenitor yield, which is why yield was made the objective in round 174. Route 1 was worth mapping
  to closure because it is where the field has spent its effort - but the pool was never the term that
  binds in this case, and now that is a measured statement rather than an assumption.

  WHAT ROUTE 1 HANDS FORWARD. One well-posed unrun experiment: hallett2021 activated Wnt in PTHrP+ resting
  chondrocytes and lost 72 per cent of long columns at P96. Nobody has run the mirror - Wnt INHIBITION in
  the same cells, long columns and bone length at the same late timepoint. That is the only live thread
  route 1 leaves, and it belongs to the amplification term rather than the pool term.'
