localization:
- 'the Apoe-positive resting compartment as the whole, with Pthlh, Foxa2 and Axin2 as near-disjoint minority
  subsets inside it'
- 'upper resting zone: FoxA2, Clu, the long-term self-renewing tier'
- 'lower resting zone: Ccnd1-positive and overlapping the proliferative zone, cells already entering cycle'
- 'the resting-to-column interface, where hallett2021 shows the gain that can be lost'
human_evidence: indirect
human_evidence_note: 'One anchor only. kodama2025 detected APOE protein by immunofluorescence in the resting
  zone of HUMAN radial growth plate, higher than in the proliferative zone, establishing that the pan-marker
  is conserved. No human experiment has manipulated any of these populations, measured a self-renewal
  fraction, or produced a length endpoint from a pool intervention.'
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: 'Four mouse papers with one human immunostain. The partition result is the most
  likely to transfer, because it is an observation about compartment composition rather than about rates,
  and the human APOE stain shows the compartment exists. The rates almost certainly do not transfer: the
  mouse proliferative cycle runs roughly ten times faster than the human one, mouse plates never close, and
  every timepoint here is expressed in postnatal days against a human case at bone age 16.'
confidence: C
claim_grades:
- claim: The resting-zone stem populations form a hierarchy that further work will resolve.
  grade: X
  basis: 'NO - THEY FORM A PARTITION. kodama2025 measured all three markers in the same 1,359 cells: Pthlh
    17 per cent, Foxa2 4 per cent, Axin2 2 per cent, 77 per cent of the Apoe compartment carrying none of
    them, more than 95 per cent of the marked cells carrying exactly one, and zero triple-positives. There
    is no ordering to find because the sets barely intersect. avijgan2026 concluded the hierarchy was not
    established; this is why.'
- claim: Results from PTHrP, FoxA2 or Axin2 lineage tracing describe the resting zone.
  grade: X
  basis: 'THEY DESCRIBE 17, 4 AND 2 PER CENT OF IT RESPECTIVELY (kodama2025). This atlas has repeatedly
    written column counts from single-marker tracing as though they were plate-level quantities. They
    cannot be scaled, because the unmarked 77 per cent has never been traced by anyone.'
- claim: hallett2021 and oichi2023 contradict each other on Wnt tone in the resting zone.
  grade: X
  basis: 'REGISTERED AS AN UNRESOLVED CONFLICT IN ROUND 178 AND NOW RESOLVED BY MEASUREMENT. Axin2+ cells are
    2 per cent of the resting compartment (kodama2025). oichi2023 describes that 2 per cent; hallett2021
    describes the bulk. A Wnt-active minority inside a Wnt-inhibited compartment is a composition fact, not
    a contradiction.'
- claim: The resting zone has a single self-renewal fraction that an intervention could raise.
  grade: X
  basis: 'NO. muruganandan2022 measured it in two subsets of one zone and got 38 per cent versus 11 per cent
    secondary-colony formation, with FoxA2+ reaching passage 9+ at 9 per cent against PTHrP+ reaching
    passage 5 at 1.4 per cent. Route 1 was posed as raising a scalar that does not exist. Worse for the
    route, the ABUNDANT subset is the exhaustible one.'
- claim: Fate leakage to the osteoblast lineage is a loss term worth attacking in a late case.
  grade: D
  basis: 'PROBABLY NOT, AND THIS DEMOTES THE ROUND-180 RANKING. muruganandan2022 labelled the same population
    early and late: 138 clones falling to 41 over three months when labelled P14-P18, against 55 to 57 when
    labelled P28-P37. Resting cells stop expressing col10 by P21 and their contribution to epiphyseal bone
    winds down after P28. D rather than C because it is one population in one paper, and because mouse P28
    is not human bone age 16 - but it is the only across-age measurement of that term and it points against
    route 4 in this case.'
- claim: Manipulating the resting pool lengthens a normal bone.
  grade: E
  basis: 'ONE POSITIVE RESULT IN THE WHOLE ROUTE. trompet2024, post-SOC intra-articular SAG, +3.63 per cent
    femur in rat - which the ledger already carries as the only pool intervention with a length endpoint.
    Against it: newton2019 Tsc1 charge expanded the pool with recruitment unchanged and no length measured,
    the vismodegib discharge step was never run to a length endpoint by anyone, horike2026 measured 666-15
    in WILD-TYPE mice and found no change in weight, femur length or resting-zone CD73, and hallett2021 Wnt
    activation cost 72 per cent of long columns. E because the informative experiment has not been run, not
    because it was run and failed.'
- claim: The pool is the binding constraint at bone age 16.
  grade: E
  basis: 'ARGUED, NOT SHOWN, AND THE EVIDENCE AVAILABLE POINTS AWAY. kodama2025 followed Apoe+ resting cells
    to one year and found them reduced but STILL PRESENT, in a species whose plates never close; human
    plates close with resting chondrocytes still in them. That is consistent with plate duration binding
    before pool exhaustion does, but the mouse cannot demonstrate it because the mouse never runs the
    experiment humans run. Held at E deliberately - it is the premise on which route 1 is being closed and
    it deserves to be visible as an inference.'
