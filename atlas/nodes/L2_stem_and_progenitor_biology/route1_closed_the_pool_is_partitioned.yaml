contradicts:
- 'DEMOTES THE ROUND-180 ROUTE RANKING. Route 4, fate leakage, was ranked first. muruganandan2022 shows the
  leak is an early-life term - 70 per cent clone loss when labelled P14-P18, none when labelled P28-P37 -
  so its headroom in a late case is smaller than the ranking assumed. Route 4 is not wrong, it is
  age-gated, and the gate is on the wrong side for this subject.'
- 'RESOLVES the round-178 hallett2021-versus-oichi2023 conflict recorded in the bibliography as an
  unresolved tension. The resolution is that Axin2+ cells are 2 per cent of the compartment, so the two
  papers were never describing the same cells.'
- 'CORRECTS THIS ATLAS ON SCALING. Multiple nodes in this programme treat single-marker lineage-tracing
  column counts as plate-level quantities. kodama2025 shows the markers cover 17, 4 and 2 per cent of the
  resting compartment with almost no overlap, and that 77 per cent of it has never been traced by anyone.'
