id: hypertrophic_chondrocyte_survival
name: Hypertrophic chondrocyte survival at the chondro-osseous junction
type: process
summary: 'The classical model has terminal hypertrophic chondrocytes dying, with osteoblasts arriving
  from the perichondrium with the invading vasculature. Inducible lineage tracing overturned the exclusivity
  of that model: a substantial fraction of hypertrophic chondrocytes survive the cartilage-to-bone transition,
  downregulate the chondrocyte programme and become osteogenic cells that persist into adulthood. The
  two fates therefore coexist and their relative weights are the interesting quantity - roughly 60% of
  young mouse trabecular osteoblasts are chondrocyte-derived, so survival is not a rare escape event.
  Cells at the growth plate periphery behave differently again: borderline chondrocytes, aligned perpendicular
  to the columns adjacent to the perichondrium, behave as transient mesenchymal precursors rather than
  long-term stem cells. The mechanism licensing survival is not settled; candidate regulators reported
  in the mouse include Wnt/beta-catenin and mechanotransductive signalling, and none has been tested in
  human tissue.'
quantitative:
- parameter: Lower bound on hypertrophic chondrocyte survival, inferred from osteoblast output
