stub: false
summary: |
  THE QUESTION WAS WHETHER SELF-RENEWAL IS ACTUALLY POSSIBLE OR WHETHER THIS IS SCIENCE FICTION. IT IS
  POSSIBLE, IT HAS BEEN DONE IN A MAMMAL WITH A LENGTH ENDPOINT, AND ROUND 247 SAID THE OPPOSITE BECAUSE I
  SEARCHED THE GRAPH BADLY (CORR-258).

  ONE - THE EXPERIMENT THAT FILLS THE EMPTY CELL. trompet2024, full text and JCI numeric source data both
  held here since 2026-08-07. INTRA-ARTICULAR SAG at P28, P30, P32, analysed P37: total Pthrp-tdTomato+
  cells rose from 65.5 TO 139.8 CELLS PER SQUARE MM, n = 5, P = 0.017, ALL OF IT INSIDE THE RESTING ZONE,
  WITH NO CHANGE IN PROLIFERATION in the top 50 microns or the proliferative zone AND NO CHANGE IN TERMINAL
  HYPERTROPHIC CELL SIZE. In round 247's terms that is N UP WITH LAMBDA AND h_term BOTH HELD. It is exactly
  the cell round 247 declared empty.

  AND THE LENGTH ENDPOINT EXISTS AND ACCUMULATES. SAG beads in the distal femoral secondary ossification
  centre of one rat leg: FEMUR +2.75, +2.64 and +3.63 PER CENT at 1, 2 and 6 months; ENTIRE LEG +1.06, +1.09
  and +1.65 PER CENT, in 6 of 6, 9 of 9 and 8 of 8 animals, with P values down to below 0.00001 on paired
  tests recomputed here from per-animal values. THE EFFECT GROWS WITH TIME RATHER THAN FADING, which is what
  an expanded pool being spent through the plate should look like and is not what a velocity effect looks
  like. Gli1-LacZ bead signal was gone by three weeks; no osteoarthritis at six months.

  TWO - THE DELIVERY PROBLEM, WHICH THE LEDGER NAMED AS THE RECOMMENDED NEXT DIVE, WAS SOLVED THIS YEAR.
  ye2026 built CT-CM-NPs: PLGA nanoparticles coated with CHONDROCYTE-DERIVED CELL MEMBRANE and decorated
  with WYRGRL, the collagen-II-binding hexapeptide, loaded with PURMORPHAMINE - a Smoothened agonist.
  INTRAVENOUS tail vein, 1 mg/kg every two days for five weeks. Growth plate accumulation peaks at about 24
  hours and is markedly better than untargeted or red-cell-membrane particles. In Fgfr3V376D/+
  hypochondroplasia mice treated from 3 to 8 weeks, BODY LENGTH REACHED 8.94 CM WITH NO SIGNIFICANT
  DIFFERENCE FROM WILD TYPE, femur length improved with membrane coating and further with targeting, and
  GLI1, PTCH1 and acetylated alpha-tubulin all rose with ciliogenesis restored.

  SO THE TWO HALVES EXIST SEPARATELY: A MECHANISM THAT EXPANDS THE POOL, AND A VEHICLE THAT PUTS A HEDGEHOG
  AGONIST INTO A GROWTH PLATE FROM A VEIN. NOBODY HAS COMBINED THEM.

  THREE - AND NOW THE FOUR THINGS THAT ARE WRONG WITH READING THAT AS A THERAPY, WHICH MATTER MORE THAN THE
  RESULT.

  RETRACTED IN PART BY CORR-259 - THE FIRST OF THESE FOUR IS WITHDRAWN. cheng2025 is a REVIEW and its
  SAG-promotes-proliferation sentence is UNCITED; the apparent disagreement is two ROUTES inside trompet2024
  (systemic and genetic raise proliferation, local intra-articular raises number without it). The other three
  caveats stand. The original paragraph is left below because retracting it silently would hide the error:

  THE MECHANISMS DO NOT MATCH. trompet2024's pool expansion came with PROLIFERATION UNCHANGED. ye2026's
  rescue came with Ki67 UP and proliferation increased PARTICULARLY IN COLUMNAR AND HYPERTROPHIC
  CHONDROCYTES - that is the amplification and hypertrophy compartments, not the pool. And cheng2025, from a
  third group, reports that post-SOC SAG PROMOTES PROLIFERATION of resting zone chondrocytes. THREE PAPERS,
  ONE PATHWAY, ONE DEVELOPMENTAL WINDOW, THREE DIFFERENT CELLULAR READINGS. The atlas has been treating
  hedgehog agonism as one intervention and it is not yet one result.

  ye2026 IS RESTORATION, NOT ELEVATION, AND IT IS THE PUREST FORM OF CORR-203 IN THIS PROGRAMME. An
  FGFR3-gain-of-function mouse returned to wild-type length. Nothing in it shows a hedgehog agonist makes a
  NORMAL plate longer, and the paper contains no treated wild-type arm reported for length. The mechanism it
  rescues is CILIOGENESIS, which is specifically deranged by the FGFR3 mutation - so the effect may be
  correction of an FGFR3-specific defect rather than a lever that works on an intact plate.

  ye2026's BODY-LENGTH EFFECT IS MOSTLY SPINE, AND THE AUTHORS SAY SO. They attribute it to accumulation in
  VERTEBRAL cartilage, note that red-cell-membrane particles also worked there because vertebrae are more
  accessible to circulating agents, and state explicitly that human height depends far more on long bones
  because of upright posture. THAT IS CORR-195 ARRIVING FROM THE OTHER DIRECTION - the atlas was warned
  never to collapse this case to the spine, and here is a delivery platform whose headline number is largely
  spinal.

  THE MARKER PROBLEM IS SEVERE AND IT IS THIS ATLAS'S OWN FINDING. kodama2025 measured Pthlh, Axin2 and
  Foxa2 in the SAME cells: within the resting compartment Apoe is positive in 97 per cent, PTHLH IN ONLY 17
  PER CENT, Foxa2 in 4, Axin2 in 2, with no triple-positive cell and 77 per cent of Apoe+ cells negative for
  all three. THE RESTING ZONE IS A PARTITION, NOT A HIERARCHY. trompet2024 counted Pthrp-tdTomato+ cells. A
  2.1-fold rise in a marker carried by 17 per cent of the compartment is EQUALLY CONSISTENT WITH RECRUITMENT
  OF MARKER-NEGATIVE Apoe+ CELLS INTO PTHrP IDENTITY as with net expansion of the pool. Nobody has counted
  the whole compartment under SAG.

  FOUR - WHAT THE ACTUAL GATE IS, STATED PLAINLY. IT IS NOT THE MECHANISM AND IT IS NO LONGER THE DELIVERY
  VEHICLE. IT IS THE MOLECULE. Every hedgehog drug that has ever been given to a human is an ANTAGONIST -
  vismodegib, sonidegib, glasdegib - and this atlas already holds the human proof that the antagonist
  direction stops growth: robinson2017a, three children on vismodegib with growth arrest. SAG and
  purmorphamine are tool compounds. A ClinicalTrials.gov search for a Smoothened agonist returns nothing but
  antagonist combination trials.

  THE ONE DELIVERABLE AGONIST CHEMOTYPE THAT EXISTS IS THE OXYSTEROLS. nachtergaele2012 established that
  oxysterols are ALLOSTERIC activators of Smoothened at a site distinct from the SAG and cyclopamine site,
  and montgomery2014's Oxy133 is a synthetic osteogenic oxysterol that activates hedgehog and promotes bone
  formation, carried through a rat two-level posterolateral spinal fusion model and into a biomimetic bone
  graft. IT HAS NO GROWTH PLATE DATA AND NO LENGTH ENDPOINT. It is named here as the chemotype most likely
  to be obtainable, not as a candidate with evidence.

  FIVE - THE HONEST STANDING. Pool expansion is real, mammalian, and length-bearing at grade B in one study.
  Delivery to the growth plate from a vein is built and published. What is missing is a Smoothened agonist
  a human can be given, a demonstration in an INTACT plate rather than a deficient one, and a count of the
  whole resting compartment rather than one 17-per-cent marker. NONE OF THOSE THREE IS SCIENCE FICTION AND
  ALL THREE ARE UNDONE.
