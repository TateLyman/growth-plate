human_evidence: indirect
human_evidence_note: >-
  No human hedgehog agonist data of any kind exists. The only human evidence on this axis runs the other
  way and is already in the atlas - robinson2017a, three children whose growth arrested on the hedgehog
  ANTAGONIST vismodegib, which establishes that the pathway is required to keep a human plate open but says
  nothing about whether agonism can push it beyond normal.
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: >-
  Three separate leaps. Species - every result is rodent. Direction - the nanoparticle result is restoration
  of a deficient plate and the SAG result is in an intact rodent plate that never closes, while the case is
  a late human plate. And molecule - there is no Smoothened agonist that has been given to a human, so the
  route from this evidence to a person runs through a chemotype (oxysterols) with no growth plate data at
  all.
confidence: C
confidence_reason: >-
  trompet2024 alone would be B - a length endpoint with per-animal source data, every animal gaining, effect
  accumulating over six months. It is held to C here because the pool attribution rests on a marker covering
  17 per cent of the compartment, because the bead moves three terms at once, and because the three hedgehog
  papers in this atlas report three different cellular readings of the same manipulation in the same window.
  The delivery result is a single 2026 paper and the oxysterol chemotype is graded not at all, because it
  has no growth plate evidence.
