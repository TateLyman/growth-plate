id: clonal_lineage_tracing
name: Clonal lineage tracing (genetic fate mapping)
type: method
summary: 'Nearly every claim in this layer is a claim about a tamoxifen-inducible Cre driver crossed to
  a reporter. The method''s resolution is set by three parameters that are frequently unreported: labelling
  efficiency, driver specificity, and clonal density. In the growth plate literature these are sometimes
  quantified - FoxA2-creER labelled 8%, 23% or 38% of FoxA2+ cells depending on tamoxifen dose and reporter
  allele copy number, and PTHrP-creER preferentially marks an immature CD105-low subset of PTHrP-mCherry+
  cells rather than all of them - which means a negative tracing result can be a labelling failure and
  a ''population'' can be an artefact of driver bias. Multicolour reporters (Confetti, Rainbow) convert
  fate mapping into clonal analysis by making neighbouring clones distinguishable. Dual-recombinase (Cre
  plus Dre) systems allow intersectional labelling and were needed to show that osteoblast origin switches
  from chondrocytes to LepR+ stroma at adolescence. The decisive limitation for this atlas is that none
  of this can be applied to humans: germline transgenesis and tamoxifen pulse-chase are not available,
  so human stem-cell identity in the growth plate is method-blocked rather than merely unstudied.'
quantitative:
- parameter: FoxA2-creER labelling efficiency, two tamoxifen doses
  value: '8'
  unit: '% of FoxA2+ cells'
  conditions: P14-P15 tamoxifen, one floxed reporter allele, mouse
