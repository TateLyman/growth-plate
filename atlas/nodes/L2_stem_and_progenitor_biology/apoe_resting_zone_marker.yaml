id: apoe_resting_zone_marker
name: ApoE as a pan-resting-zone chondrocyte marker
aliases:
- Apolipoprotein E resting zone marker
type: protein
summary: 'Every previously proposed resting-zone stem cell marker (PTHrP/Pthlh, FoxA2, Axin2, CD73) labels
  only a subset of resting chondrocytes, which leaves the zone itself defined by the ambiguous histological
  criterion of ''small round cells without columns''. Apolipoprotein E was identified as a marker expressed
  by essentially all chondrocytes of the mouse resting zone and not by proliferative or hypertrophic chondrocytes,
  so it provides a molecular definition of the compartment rather than of a stem cell within it. This
  matters operationally: comparisons of ''resting zone height'' or ''resting cell number'' across laboratories,
  including the senescence-depletion literature, currently rest on morphology rather than on a marker,
  and ApoE offers a way to standardise them. ApoE is a marker of compartment identity, not of stemness
  - its expression does not by itself imply self-renewal. Human validation has not been reported.'
quantitative: []
localization:
- 'mouse RZ: confirmed, ApoE labels essentially all resting chondrocytes (kodama2025)'
- 'mouse PZ/HZ: negative (kodama2025)'
- 'human RZ: unconfirmed'
human_evidence: absent
human_evidence_note: No study has tested ApoE as a resting zone marker in human growth plate tissue.
species_basis:
- mouse
translation_risk: moderate
translation_risk_reason: A zonal expression marker is more likely to translate than a functional stem-cell
  claim, but human zonal expression has not been checked and human and mouse growth plate zonal transcriptomes
  differ.
