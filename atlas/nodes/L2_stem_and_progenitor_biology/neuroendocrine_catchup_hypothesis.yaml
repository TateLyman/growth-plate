id: neuroendocrine_catchup_hypothesis
name: Neuroendocrine ('sizostat') explanation of catch-up growth
type: hypothesis
summary: 'The older explanation, proposed in 1963, is that the central nervous system compares actual
  body size with an age-appropriate set point and adjusts growth rate through a circulating factor; after
  a period of growth restriction the deficit is sensed and growth accelerates. The set point has never
  been identified experimentally. The decisive evidence against it being the whole story is that catch-up
  growth occurs locally: glucocorticoid administered to a single rabbit growth plate is followed by catch-up
  restricted to that plate, which a circulating signal cannot explain. The hypothesis is not dead, only
  demoted - the local experiment shows a growth-plate-intrinsic mechanism is sufficient for local catch-up,
  not that systemic modulation is absent, and clinical catch-up after nutritional or endocrine rescue
  involves unambiguous systemic changes in GH/IGF-1 signalling. On the evidence reviewed here, the intrinsic
  delayed-senescence mechanism is supported by direct experimental data and the neuroendocrine set point
  is supported by none; the honest position is that catch-up is at least partly intrinsic and possibly
  additionally modulated centrally.'
quantitative: []
localization:
- 'not_applicable SYS: systemic hypothesis'
human_evidence: indirect
human_evidence_note: Human catch-up growth is well documented clinically, but no human study has demonstrated
  a size-sensing set point or its circulating mediator.
species_basis:
- rabbit
- human
translation_risk: unknown
translation_risk_reason: The mechanism itself is unidentified in any species, so there is no defined entity
  whose human relevance could be assessed.
confidence: D
