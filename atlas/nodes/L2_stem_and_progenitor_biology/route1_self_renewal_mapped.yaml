id: route1_self_renewal_mapped
name: ROUTE 1 MAPPED - five stem populations with no established hierarchy, a Hedgehog lever whose sign
  depends on developmental STAGE rather than duration, a charge-and-discharge pair sitting unexploited
  inside one paper, and a contested sign on GH
aliases:
- route 1 self renewal
- SOC niche mapped
- stage-specific hedgehog
- charge with mTORC1 discharge with vismodegib
- does GH expand or spend the pool
- round 181
type: hypothesis
layer: L2
stub: false
summary: 'ROUTE 1 IS RAISING THE SELF-RENEWAL FRACTION SO FEWER PROGENITORS ARE CONSUMED PER UNIT OUTPUT.
  MAPPED PROPERLY IT CONTAINS FOUR THINGS, TWO OF WHICH CHANGE EARLIER CONCLUSIONS.

  FIRST, THE POPULATION MAP, AND IT IS NOT ONE CELL TYPE. cheng2025 enumerates FIVE marker-defined
  growth-plate skeletal stem cell populations - PTHrP, CD73, Axin2, FoxA2 and ApoE - and avijgan2026, a
  PRISMA systematic review of every study using the word quiescent about resting-zone chondrocytes,
  concludes that the HIERARCHY OF RESTING-ZONE STEM CELLS IS NOT ESTABLISHED and that neither single-cell
  sequencing at any age nor label-retention has revealed whether the resting zone contains distinct
  quiescent sub-populations. Every experiment in this programme labels one of the five and generalises. The
  denominator of every yield computed here is a marker, not a cell type.

  SECOND, AND IT LIKELY REPLACES THE ROUND-179 HYPOTHESIS - HEDGEHOG IS STAGE-SPECIFIC, NOT MERELY
  DURATION-SPECIFIC. cheng2025 sets it out: BEFORE secondary ossification centre formation, BOTH the
  antagonist LDE225 AND the agonist SAG significantly REDUCED PTHrP-expressing stem cells and their
  progeny - both directions harmful. AFTER SOC formation the roles change: vismodegib reduced clonal
  expansion and caused PREMATURE GROWTH PLATE FUSION around P35, while SAG PROMOTED PROLIFERATION of
  resting zone chondrocytes. THE TWO EXPERIMENTS THIS ATLAS COULD NOT RECONCILE SIT ON OPPOSITE SIDES OF
  THAT BOUNDARY: orikasa2024 pulsed at P6, at or before SOC formation, and got clonal derangement,
  osteoblast conversion and a transient length DECREMENT; trompet2024 dosed at P28, P30 and P32, well
  after, and got a clean pool doubling and +3.63 per cent femur. Round 179 proposed DURATION as the
  discriminator and round 180 downgraded it to one of several. STAGE is a better candidate than either,
  and it is the one that favours this case - a subject at bone age 16 is as far post-SOC as it is possible
  to be.

  THIRD, AND NOBODY HAS FRAMED IT THIS WAY - THERE IS A CHARGE-AND-DISCHARGE PAIR INSIDE newton2019.
  The Tsc1 result has been carried in this atlas as a failure: mTORC1 activation expands the colony-forming
  pool by shifting divisions toward symmetric, with CD73 up and clone size up, but "neither proliferation
  of chondroprogenitors nor their recruitment into the proliferative layer changed detectably" - pool
  without flux. THE SAME PAPER SUPPLIES THE RELEASE. Its Tsc1-expanded clusters "retain hedgehog
  dependence, as vismodegib FORCED THEM TO DIFFERENTIATE DIRECTLY INTO COLUMNAR CELLS and form
  multi-columnar clones". CHARGE WITH mTORC1, DISCHARGE WITH HEDGEHOG INHIBITION. The failure mode is the
  charge phase. NO BONE LENGTH WAS MEASURED AFTER THE DISCHARGE STEP, in that paper or any other, and that
  is the whole experiment.

  BUT THE SAME PAPER BOUNDS IT. Extending vismodegib by two doses FUSED the plate at P37. The discharge
  agent has a hard stop, and the therapeutic window between forcing differentiation and forcing fusion has
  never been mapped.

  FOURTH, AND IT CORRECTS THIS ATLAS RATHER THAN THE FIELD - THE SIGN OF GH ON THE PROGENITOR POOL IS
  CONTESTED, AND BOTH SIDES WERE ALREADY HERE. Rounds 172, 176 and 178 asserted three converging lines that
  GH spends the pool. ohlsson1992 says the opposite with a cleaner design for this specific question:
  hypophysectomised rats, [3H]thymidine minipump, LOCAL GH by cannula into one proximal tibia against the
  CONTRALATERAL LEG, and label-retaining cells in the germinal layer rose to a ratio of 1.95 +/- 0.13. In
  the same experiment IGF-I DID NOTHING to the germinal cells - ratio 0.96 +/- 0.04 - with the authors
  concluding IGF-I acts only on the proliferation of the resulting chondrocytes. So GH and IGF-1 are NOT
  interchangeable at the resting zone, and reading oichi2023 IGF-1 result as evidence about GH was a
  substitution this atlas should not have made. Logged as CORR-187.

  THE RECONCILIATION IS DOSE, ROUTE AND BACKGROUND, AND chu2025 NAMES THE GAP ITSELF. ohlsson1992 used 1
  microgram of GH locally in a GH-DEFICIENT animal; chu2025 used 5 mg/kg/day systemically, about a
  hundredfold therapeutic, in GH-REPLETE mice, and states in its limitations that the GH-deficient context
  "remains to be explored". ohlsson1992 IS that context. And the atlas own dual_effector_hypothesis node,
  written 2026-08-05 and never connected to this programme, already holds the resolution: GH BOTH recruits
  germinal cells into the proliferative pool (gevers1996a - GH raises the NUMBER of proliferating
  chondrocytes without raising the labelling index of cells already cycling) AND multiplies them
  (ohlsson1992). Opposite signs on pool size, net depending on dose and background.

  ONE COMPLICATION KEPT RATHER THAN SMOOTHED. schlechter1986 reports that a somatomedin antiserum abolishes
  the local response to intra-arterial GH, so GH direct plate effect is IGF-1-MEDIATED - which sits
  awkwardly against ohlsson1992 null for exogenous IGF-I on germinal cells. Locally induced and injected
  IGF-1 may not be equivalent in reach or kinetics. Unresolved, and recorded as such.

  WHERE THAT LEAVES ROUTE 1. It is the best-populated route of the eight and the worst-characterised. It
  has five candidate cell populations with no hierarchy, one lever whose sign flips at a developmental
  boundary our case is safely past, one two-step protocol assembled from a single paper that nobody has run
  to a length endpoint, and a contested sign on the agent already in the stack.'
