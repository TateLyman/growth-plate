human_evidence: absent
human_evidence_note: 'Entirely mouse and rat. ApoE is reported in human resting-zone chondrocytes
  (kodama2025) and PTHrP+ cells are present in one adolescent human specimen (chu2025), but no human
  experiment has manipulated any of these populations or measured self-renewal.'
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: 'Mouse conditional genetics and rat local infusion, in species whose proliferative
  cycle is roughly ten times faster than the human one. The STAGE argument may transfer better than the
  effect sizes, because the secondary ossification centre boundary is a developmental landmark that exists
  in humans too - but its equivalence at bone age 16 is an assumption.'
confidence: C
claim_grades:
- claim: The resting-zone stem compartment is one population that the various markers all label.
  grade: X
  basis: 'NO. cheng2025 enumerates five marker-defined populations - PTHrP, CD73, Axin2, FoxA2, ApoE - and
    avijgan2026 concludes by systematic review that the hierarchy is NOT established and that no
    single-cell or label-retention study has resolved quiescent sub-populations. muruganandan2022 reports
    FoxA2+ cells with HIGHER clonogenicity and longevity than PTHrP+ cells, so they are not equivalent.
    Every yield in this programme has a marker as its denominator, not a cell type.'
- claim: The trompet2024 and orikasa2024 discrepancy is explained by developmental stage relative to SOC
    formation.
  grade: E
  basis: 'THE BEST CANDIDATE SO FAR AND STILL NOT DEMONSTRATED. cheng2025 sets out that Hedgehog is
    stage-specific, with BOTH agonist and antagonist reducing the stem pool BEFORE SOC formation and
    opposite roles after. orikasa2024 pulsed at P6, at or before SOC; trompet2024 dosed P28-P32, well
    after. Stage explains the sign flip more economically than duration (round 179) or than the four-way
    confound (round 180). It remains E because no experiment has varied stage alone, and the two studies
    still differ in dose, delivery, species and genetic-versus-pharmacological activation.'
- claim: mTORC1 activation followed by Hedgehog inhibition is a charge-and-discharge protocol.
  grade: E
  basis: 'ASSEMBLED FROM TWO RESULTS IN ONE PAPER THAT NOBODY HAS PUT TOGETHER. newton2019 shows Tsc1
    ablation expands the colony-forming pool by symmetric division WITHOUT changing recruitment - the
    charge, previously recorded here only as a failure - and separately that vismodegib FORCED those
    expanded clusters to differentiate directly into columnar cells and form multi-columnar clones - the
    discharge. NO BONE LENGTH WAS MEASURED after the discharge step. And the same paper bounds it:
    extending vismodegib by two doses FUSED the plate at P37, so the window between forcing differentiation
    and forcing fusion is real and unmapped.'
- claim: Three independent lines show the GH arm of this stack spends the progenitor pool.
  grade: X
  basis: 'OVERSTATED, AND CORRECTED AS CORR-187. ohlsson1992 nearly DOUBLED germinal-layer label-retaining
    cells with LOCAL GH in hypophysectomised rats against a contralateral control - ratio 1.95 +/- 0.13 -
    which is a cleaner design for this question than chu2025. chu2025 itself states the GH-deficient
    context remains unexplored, and ohlsson1992 is that context. Both papers have been in this
    bibliography throughout and no node compared them.'
- claim: GH and IGF-1 can be treated as one signal at the resting zone.
  grade: X
  basis: 'NO. In the same experiment and by the same route, GH gave a germinal-cell label-retention ratio of
    1.95 and IGF-I gave 0.96 - no effect - with the authors concluding IGF-I acts only on the proliferation
    of the resulting chondrocytes. The oichi2023 charge/discharge switch is an IGF-1 result and does not
    license a claim about GH.'
- claim: The sign of GH on the progenitor pool is known.
  grade: D
  basis: 'CONTESTED AND CONTEXT-DEPENDENT. The atlas own dual_effector_hypothesis node already holds both
    halves: GH RECRUITS germinal cells into the proliferative pool (gevers1996a - more proliferating
    chondrocytes without a higher labelling index among cells already cycling) AND multiplies them
    (ohlsson1992). Opposite signs on pool size, with the net depending on dose, route and GH status. That
    is a better account of chu2025 surprise than anything this atlas previously wrote.'
