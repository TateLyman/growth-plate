contradicts:
- 'CORRECTS this atlas on GH (CORR-187). Rounds 172, 176 and 178 built a three-line convergence that GH
  spends the progenitor pool. ohlsson1992 contradicts it with a cleaner design, IGF-I turns out not to act
  on germinal cells at all, and the atlas own dual_effector_hypothesis node held the reconciliation the
  whole time.'
- 'LIKELY SUPERSEDES the round-179 duration hypothesis and the round-180 four-way confound as explanations
  for trompet2024 against orikasa2024. Developmental stage relative to SOC formation is more economical
  than either and is the variable cheng2025 organises the whole Hedgehog literature around.'
