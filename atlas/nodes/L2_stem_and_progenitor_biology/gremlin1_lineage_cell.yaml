id: gremlin1_lineage_cell
name: Grem1+ osteochondroreticular (OCR) stem cell
aliases:
- OCR stem cell
- Gremlin1 lineage cell
type: cell_type
summary: Grem1-creER labels a population concentrated in the metaphysis immediately adjacent to the growth
  plate and trabecular bone, not in the perisinusoidal space. Traced Grem1+ cells generate columns of
  chondrocytes by P5, osteoblasts and reticular marrow stroma, self-renew, and are required for bone development,
  remodelling and fracture repair - but they do not make adipocytes (0 of 19 single clones by oil red
  O; polyclonal cultures also failed). About 40% of Grem1+ cells are CD105+, versus under 2% of Grem1-negative
  CD45-CD31-Ter119- cells, and only 5.9% co-express Acta2-RFP. They are explicitly non-overlapping with
  Nestin-GFP perisinusoidal MSCs. Two conflicts follow. First, Grem1+ OCR cells and LepR+ stroma disagree
  on adipogenic output and on anatomical position for the same claimed role. Second, PTHrP+ resting chondrocytes
  do not express Grem1, so the metaphyseal OCR cell and the resting-zone stem cell are different cells
  even though both are said to supply growth plate chondrocytes.
