id: calcium_intake_growth
name: Dietary calcium intake and linear growth
type: process
summary: 'Dietary calcium has a large effect on bone mineral accrual and a small-to-absent effect on linear
  growth, and the cleanest experimental separation of the two comes from the milk fractionation trials.
  In a 2x2 factorial randomised trial in 57 eight-year-old boys, drinks delivering the calcium and phosphorus
  content of 1.5 L of skim milk were compared with low-mineral drinks against the same protein background:
  there were no independent effects of high milk-mineral intake on serum IGF-1 or on fasting insulin,
  and no interaction between the mineral and protein factors (hoppe2009). Since the IGF-1 rise seen with
  milk is carried entirely by casein, the growth-relevant component of milk is not its calcium. Calcium''s
  genuine entry point into the atlas is through the L4 calcium homeostasis loop - ionised calcium sets
  PTH secretion through CASR, and PTH plus calcitriol control phosphate, which is required for hypertrophic
  chondrocyte apoptosis. Below the rachitic threshold, calcium deficiency therefore deranges the growth
  plate through the same phosphate route as vitamin D deficiency; above it, calcium is not a linear growth
  variable.'
