id: population_height_variation
name: Between-population variation in height
type: phenotype
summary: 'The spread of mean adult height across human populations is about 19-20 cm and it has not narrowed.
  A century ago the tallest and shortest national means differed by 19-20 cm; a century later the differential
  is unchanged for women and has widened for men, despite a near-complete reshuffling of the country ranking
  (ncd2016). The extremes are Dutch men born in the last quarter of the 20th century (>182.5 cm) and Guatemalan
  women born in 1896 (140.3 cm, 95% CrI 135.8-144.8). The same spread is present in adolescents: in 2019
  the difference between the tallest and shortest national means at age 19 was 20 cm or more (ncd2020).
  The structural point for the atlas is that the between-population range (~20 cm) and the largest observed
  within-population secular gain (~20 cm) are the same magnitude, so environmental change alone can move
  a population across essentially the entire observed between-population range. That does not make the
  differences purely environmental - the ranking changed while the spread did not - but it does mean that
  inferring a genetic difference from a contemporary height difference between two populations is unidentified
  without cohort data.'
