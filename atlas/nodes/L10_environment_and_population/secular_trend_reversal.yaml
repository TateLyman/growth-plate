- claim: Mean adult height fell by about 5 cm from its peak in several sub-Saharan African countries for
    cohorts born after the early 1960s.
  grade: A
  basis: ncd2016 pooled measured-height model with per-country credible intervals.
- claim: Reversals are sex-asymmetric, appearing in men before or without women in Central Asia and MENA.
  grade: B
