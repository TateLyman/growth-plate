id: secular_trend_reversal
name: Reversal of the secular height trend
type: process
aliases:
- negative secular trend
- population height decline
summary: The secular increase in height is neither monotonic nor irreversible, and the reversals are the
  most informative part of the record because they show the trend depends on a continuously supplied environmental
  input rather than on a ratchet. In the NCD-RisC century reanalysis, mean adult height decreased or stopped
  rising in many sub-Saharan African countries for cohorts born after the early 1960s, falling by around
  5 cm from its peak in Niger, Rwanda, Sierra Leone and Uganda (ncd2016). The same pattern appeared later
  in men but not women in parts of Central Asia (Azerbaijan, Uzbekistan) and the Middle East and North
  Africa (Egypt, Yemen), while both sexes continued to gain in Iran (ncd2016). A loss of about 5 cm within
  two to three birth cohorts is a quarter of the largest century gain ever recorded, which constrains
  any model treating population stature as a slowly moving genetic quantity. The reversals are attributed
  to deteriorating nutrition, infection burden and conflict, but no study has measured IGF-1, IGFBP-3
  or inflammatory markers in a declining birth cohort against its taller predecessor, so the mechanism
  of the reversal is imported from the mechanism proposed for the rise rather than demonstrated.
