id: preterm_birth_growth
name: Preterm birth and linear growth
type: phenotype
summary: 'Preterm birth removes the fetus from the intrauterine environment during the period of fastest
  linear growth and costs adult height. A systematic review of 27 studies of adults born prematurely found
  reduced height among the endocrine outcomes, alongside hypothalamic-pituitary-adrenal axis dysfunction,
  lower bone mineral density and increased odds of hypothyroidism (claffey2025). The most informative
  exposure in this population is iatrogenic rather than gestational: antenatal glucocorticoid, given to
  accelerate fetal lung maturation, is a direct environmental manipulation of the L4 glucocorticoid receptor
  at a defined developmental moment. In a single-centre cohort recruited from 1994 with a median of 19
  height measurements per child to a median age of 15.8 years, SITAR modelling of 202 children found that
  in girls (n=59 with covariates) antenatal steroid exposure was positively associated with the SITAR
  size and intensity random effects, equating to a predicted final height 2.8 cm greater (95% CI 0.3-5.3)
  than in unexposed girls after adjustment for gestational age and both parents'' heights (lawrence2025).
  The direction is opposite to the growth suppression produced by postnatal glucocorticoid, which makes
  it a sharp test case: the same receptor, opposite sign, different developmental window. The result is
  sex-restricted, from one centre, and needs replication before it can be treated as a general property
  of prenatal GR activation.'
