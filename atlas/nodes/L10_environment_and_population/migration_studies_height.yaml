id: migration_studies_height
name: Migrant population height studies
type: process
aliases:
- immigrant child growth
- environment-transfer natural experiment
summary: 'Migration is the cleanest natural experiment separating population environment from population
  genotype, because it moves a genotype into a new environment within one generation. The Dutch surveys
  carry the sharpest version: between 1997 and 2009 Turkish- and Moroccan-origin children living in the
  Netherlands gained 2-3 cm in mean height at age 18, reaching 177 cm for boys and 163 cm for girls, during
  exactly the interval in which Dutch-origin children showed no gain at all (schnbeck2015, schnbeck2013).
  At the same time these adolescents remained 5.5 cm (boys) to 7 cm (girls) shorter than Dutch-origin
  peers, and within the migrant groups height showed no significant difference across parental educational
  level, geographical region, home language or immigrant generation (schnbeck2015). Two conclusions follow.
  The continuing gain in the migrant groups shows the Dutch environment was not saturated for everyone
  in that decade, which is evidence against reading the Dutch plateau as a property of the environment.
  The persisting 5.5-7 cm gap, flat across the measured social covariates, is either genetic, a lagged
  effect of maternal and intergenerational environment, or an unmeasured exposure; this design cannot
  separate them.'
