id: psychosocial_dwarfism
name: Psychosocial short stature
type: phenotype
aliases:
- deprivation dwarfism
- emotional deprivation growth failure
- hyperphagic short stature
summary: 'Psychosocial short stature is the strongest evidence in this layer that an environmental exposure
  with no nutritional component can shut down linear growth through the GH axis, and it is the only exposure
  here whose removal reverses the phenotype. The defining description is the two-part 1967 New England
  Journal of Medicine series by Powell and colleagues, which characterised children with emotional deprivation
  whose growth retardation clinically simulated idiopathic hypopituitarism (Part I, clinical evaluation)
  and whose endocrine testing was abnormal (Part II, endocrinologic evaluation) - the observation that
  named the syndrome and placed its lesion in GH secretion rather than in nutrition. Neither record carries
  an abstract in Europe PMC, so the specific hormone values, sample size and recovery kinetics reported
  in those papers have not been verified here; the full text is queued for retrieval and this node''s
  confidence is reduced accordingly. The mechanistic significance for the atlas is that psychosocial short
  stature enters the graph at gh_secretion_pulsatility rather than at the growth plate: the pituitary
  is the lesion, the plate is normal, and removal of the child from the environment restores growth. That
  entry point is asserted from the title-level content of the 1967 series and from the syndrome''s clinical
  definition, not from a number verified in this sweep.'
localization:
- 'human SYS: hypothalamic-pituitary GH secretion'
- 'human growth plate: never examined in this syndrome'
human_evidence: direct
human_evidence_note: An entirely human clinical syndrome defined by endocrine evaluation of emotionally
  deprived children; the quantitative endocrine findings were not verifiable from the indexed record in
