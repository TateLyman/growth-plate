id: microbiome_igf1_axis
name: Microbiome-IGF-1 axis
type: pathway
summary: 'The proposed molecular link from gut bacteria to the growth plate is short-chain fatty acids
  raising hepatic and adipose IGF-1 production. In mice, colonisation of germ-free animals substantially
  increased serum IGF-1 with increased IGF-1 production in liver and adipose tissue; antibiotic treatment
  of conventional mice decreased serum IGF-1 and inhibited bone formation; and supplementing antibiotic-treated
  mice with short-chain fatty acids - products of microbial fermentation - restored IGF-1 and bone mass
  to untreated levels (yan2016). That restoration experiment is the load-bearing evidence: it converts
  a correlation between microbiota and IGF-1 into a sufficiency claim for a specific class of microbial
  metabolite. The somatotropic axis is also the route by which monocolonising lactobacilli promote juvenile
  growth (schwarzer2016). Two things are missing before this can be used as a human entry point. No SCFA
  receptor or transporter has been localised or functionally tested in growth plate chondrocytes in any
  species, so the metabolite may act entirely on the liver. And no human study has manipulated the microbiota
  and measured IGF-1 and linear growth together, so the entire axis is a mouse construct with a human
  motivation.'
quantitative:
- parameter: serum IGF-1 response to short-chain fatty acid supplementation in antibiotic-treated mice
  value: restored to non-antibiotic-treated levels
  unit: qualitative
