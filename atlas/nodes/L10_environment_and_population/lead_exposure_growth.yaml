  species: human
  source_ref: xu2014
  uncertainty: P<0.05 for the group differences in height, weight, IGF-1 and blood lead
localization:
- 'human SYS: blood lead, bone lead stores'
- 'human growth plate: no lead target identified'
human_evidence: direct
human_evidence_note: Two human datasets with measured blood lead and measured stature, one national survey
  and one clinical series with serum IGF-1.
species_basis:
- human
- rat
translation_risk: high
translation_risk_reason: The only mechanistic data are a rat lead-poisoning model with whole-tissue phosphoprotein
  immunoblots, not chondrocyte-resolved and not replicated.
confidence: D
claim_grades:
- claim: Blood lead is inversely associated with stature in children at moderate concentrations.
  grade: B
  basis: National survey sample of 1454 children with measured blood lead and measured height (frisancho1991);
    observational and confounded with socioeconomic position.
- claim: Lead lowers serum IGF-1 in children.
  grade: D
  basis: Single clinical series in which the low-IGF-1 group also had higher blood lead; no adjustment
    for referral bias or socioeconomic position reported in the abstract (xu2014).
- claim: Lead has a molecular entry point at the growth plate.
  grade: X
  basis: No study identifies a lead target in physeal cartilage; the rat data show increased, not decreased,
    MAPK and Akt phosphorylation. Logged as g_l10env_007.
