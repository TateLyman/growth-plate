  species: human
  source_ref: frisancho1991
  uncertainty: inverse relationship reported across the range; effect size not stated in the abstract
- parameter: children screened in the lead / short stature clinical series
  value: '880'
  unit: children
  conditions: referred for short stature, split into GH-deficient and idiopathic-short-stature groups
