id: lead_exposure_growth
name: Lead exposure and linear growth
type: process
summary: Blood lead is inversely associated with stature at concentrations that were once considered unremarkable,
  and the association has no established molecular entry point at the growth plate. In 1454 Mexican-American
  children aged 5-12 from the Hispanic Health and Nutrition Examination Survey (1982-1984), blood lead
  across the range 0.14-1.92 umol/L was inversely related to stature, the authors' point being that growth
  retardation appears at moderate and not merely at toxic concentrations (frisancho1991). A clinical series
  of 880 children referred for short stature found blood lead higher, and height, weight and serum IGF-1
  lower, in the GH-deficient group than in the idiopathic-short-stature group (P<0.05), and in a companion
  rat lead-exposure model the phosphorylation of ERK1/2, JNK, p38, Akt(S473) and Akt(T308) was increased
  (P<0.01) (xu2014) - a result whose direction is the opposite of what a simple IGF-I-signalling blockade
  would predict and which has not been replicated. Nothing connects lead to a named growth plate protein.
  Lead is a calcium mimic that accumulates in mineralising tissue, which makes hydroxyapatite nucleation
  and the calcium-sensing receptor plausible targets, but neither has been tested with a physeal readout.
  Recorded here as an epidemiological association with an explicitly missing mechanistic link.
