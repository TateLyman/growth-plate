id: sga_catch_up
name: Catch-up growth after small-for-gestational-age birth
type: process
summary: Catch-up growth after SGA birth is fast, early and mostly complete, and its timing constrains
  any mechanism proposed for it. In a Goteborg population series, 82.9% of SGA infants showed catch-up
  during the first 6 months and 94.3% reached a final height within the normal range; of the 66 infants
  still short at 6 months (21 SGA and 45 non-SGA), 10 (15.2%) remained short into adulthood while 56 caught
  up spontaneously - which led the authors to argue that fetal growth should be defined by body size at
  6 months rather than at birth (karlberg2002). In the larger 3650-child cohort, catch-up in length-defined
  SGA infants occurred during the first 6 months, cutting the proportion below -2 SDS to 13.4% by 1 year
  and 7.9% by 18 years, and the magnitude of catch-up depended on mid-parental target height and on birth
  length but not on birth weight or BMI at birth (karlberg1995). Two features matter mechanistically.
  Catch-up is essentially over before the infancy-to-childhood transition, so it is completed while growth
  is still nutrition- and IGF-dependent rather than GH-dependent. And it is target-height dependent, meaning
  the recovering child grows towards a set point rather than simply growing fast - which is the phenotype
  the L2 catch_up_growth and delayed_senescence_hypothesis nodes have to explain at the level of the plate.
