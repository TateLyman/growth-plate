confidence: B
claim_grades:
- claim: Catch-up growth after SGA birth is largely complete by 6 months of age.
  grade: B
  basis: Two population-based Swedish series (karlberg1995, karlberg2002); the 6-month figures come from
    an abstract-only record.
- claim: The magnitude of catch-up depends on mid-parental target height and on birth length, not on birth
    weight or BMI at birth.
  grade: A
  basis: Multiple linear regression in the 3650-child cohort with final height (karlberg1995).
- claim: Catch-up reflects a growth plate that retains proliferative capacity because senescence was delayed
    during restriction.
  grade: E
  basis: The delayed-senescence account is an L2 hypothesis; no human growth plate has been examined during
    or after catch-up.
