id: netherlands_tallest_population
name: The Dutch height plateau
type: phenotype
aliases:
- world's tallest population
- Dutch stature ceiling
summary: 'Dutch men born in the last quarter of the 20th century have the highest population mean height
  ever recorded, above 182.5 cm (ncd2016), and the Dutch series is the only one long enough to show a
  clean stop. In the fifth Dutch nationwide growth study (2009; 5811 boys and 6194 girls aged 0-21) mean
  final height was 183.8 cm (SD 7.1) in men and 170.7 cm (SD 6.3) in women, and height-by-age was the
  same as in the 1997 survey after 150 years of continuous increase (schnbeck2013). The decisive observation
  against reading this as a shared environmental ceiling comes from the same surveys: Turkish- and Moroccan-origin
  children living in the Netherlands gained 2-3 cm between 1997 and 2009 while Dutch-origin children were
  flat, and at age 18 remained 5.5 cm (boys) to 7 cm (girls) shorter than their Dutch peers (schnbeck2015).
  Two populations sharing one country, food supply and health system sat on opposite sides of the plateau
  in the same decade. Within the Dutch population height still correlates with the child''s and the parents''
  educational level (schnbeck2013), so a social gradient persists inside the plateaued population, which
  a saturated environment does not predict. Whether the plateau is a genetic ceiling or an unmeasured
  persisting constraint has never been tested.'
