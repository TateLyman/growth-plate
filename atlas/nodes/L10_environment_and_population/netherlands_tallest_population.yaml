confidence: A
claim_grades:
- claim: Dutch height stopped increasing between 1997 and 2009 after 150 years of rise.
  grade: A
  basis: Nationwide measured survey, n=12005, direct comparison with the 1997 survey (schnbeck2013).
- claim: The plateau is population-specific and not a property of the Dutch environment.
  grade: A
  basis: Turkish- and Moroccan-origin children in the same country and the same surveys continued to gain
    2-3 cm over the same interval (schnbeck2015).
- claim: The plateau represents an attained genetic ceiling for Dutch stature.
  grade: X
  basis: Offered by the authors as one of two alternatives; no discriminating test has been performed.
    Logged as g_l10env_005.
