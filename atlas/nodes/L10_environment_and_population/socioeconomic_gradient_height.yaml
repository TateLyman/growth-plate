id: socioeconomic_gradient_height
name: Socioeconomic gradient in height
type: process
summary: Height tracks socioeconomic position within populations, including populations whose nutrition
  is nominally adequate, and the part of that gradient surviving nutritional adjustment is the mechanistically
  interesting residual. In the Netherlands in 2009 - the world's tallest population, at its plateau -
  mean height was still positively correlated with both the child's and the parents' educational level
  (schnbeck2013). In the INCAP Guatemalan birth cohort (n=1386, followed 1967-2018) adults who were upwardly
  wealth-mobile from birth were 1.88 cm taller (95% CI 1.04-2.72) in middle adulthood than the stable-low
  group, with the exposure defined by household wealth rather than by diet (varghese2021). Across five
  long-running low- and middle-income-country birth cohorts, undernutrition indices were strongly associated
  with shorter adult height, less schooling and lower income, but those analyses do not separate the nutritional
  from the non-nutritional component of social position (victora2008), and a social gradient in linear
  growth persists in high-income countries where frank undernutrition is rare (freer2026). No published
  analysis reports the socioeconomic-height gradient with and without adjustment for measured energy and
  protein intake in the same cohort, so the size of the non-nutritional residual - the part that would
  have to run through infection, stress, sleep or care rather than substrate - is unknown.
quantitative:
- parameter: adult height difference, upwardly wealth-mobile vs stable-low
  value: '1.88'
