confidence: B
claim_grades:
- claim: Height is positively associated with socioeconomic position within populations, including affluent
    ones.
  grade: A
  basis: Nationwide Dutch survey (schnbeck2013), INCAP cohort with 50-year follow-up (varghese2021), five-cohort
    pooled analysis (victora2008).
- claim: A quantifiable component of the gradient is not explained by nutritional intake.
  grade: E
  basis: No cohort reports the gradient with and without adjustment for measured intake; the residual
    is inferred from persistence of the gradient in well-fed populations. Logged as g_l10env_003.
