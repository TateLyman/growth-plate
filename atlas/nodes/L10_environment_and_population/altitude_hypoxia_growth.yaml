  uncertainty: significant across most age groups except 16-year-olds; per-age means in the paper
localization:
- 'human growth plate: pO2 never measured at any altitude (see L3 oxygen_gradient_growth_plate)'
- 'human SYS: reduced arterial pO2, elevated haemoglobin, reduced birth weight at altitude'
human_evidence: direct
human_evidence_note: Human anthropometric field studies in Andean and Tibetan high-altitude populations;
  the mechanistic step is not measured in humans.
species_basis:
- human
translation_risk: unknown
translation_risk_reason: No animal model of chronic hypobaric hypoxia with a growth plate oxygen or HIF
  readout is available to translate from.
confidence: D
claim_grades:
- claim: Children native to high altitude show slowed somatic growth and delayed skeletal maturation with
    accelerated lung volume growth.
  grade: B
  basis: Six decades of Andean field anthropometry summarised by the original investigator (frisancho2025);
    a narrative account of primary work, not a re-analysis.
- claim: Height at high altitude has risen substantially over 15 years at constant altitude.
  grade: A
  basis: Four waves of a standardised national survey of Tibetan school students aged 7-18 (zhang2026).
- claim: Chronic hypoxia acts on the growth plate through HIF-1alpha in chondrocytes.
  grade: X
  basis: No measurement of growth plate pO2 or HIF-1alpha under altitude exposure in any species; the
    human plate pO2 has never been measured at all. Logged as g_l10env_010.
