id: altitude_hypoxia_growth
name: High altitude and growth
type: process
summary: 'Chronic hypoxia is the environmental exposure with the most attractive candidate molecular entry
  point in this layer and the least evidence that the entry point is used. Andean field studies from Nunoa,
  Peru (4000 m) established that indigenous children grow slowly in body size with delayed skeletal maturation
  while lung volume growth is accelerated, and that acclimatisation during the developmental period rather
  than in adulthood is what produces the adult functional phenotype (frisancho2025). The obvious mechanistic
  candidate is HIF-1alpha, which the atlas carries at L3 as hif1a_chondrocyte, but the inference has a
  specific and disqualifying problem: L3 records that the oxygen tension of the human growth plate has
  never been measured, so there is no baseline against which to say whether residence at 4000 m changes
  physeal pO2 at all. The plate is avascular and already hypoxic at sea level; a reduction in arterial
  pO2 need not translate into a change in the interior of cartilage. Meanwhile the population signal is
  dominated by the environment rather than by altitude: in Tibetan children at ~3600 m surveyed in 2005,
  2010, 2014 and 2019 (Chinese National Survey on Students'' Constitution and Health), height rose across
  survey years in most age groups of both sexes despite unchanged altitude, with the largest gains in
  13-year-old boys and 10-year-old girls (zhang2026). Altitude is therefore not a fixed ceiling.'
