id: zinc_deficiency_growth
name: Zinc deficiency and linear growth
type: process
summary: 'Zinc supplementation produces one of the largest micronutrient effects on child height that
  has ever been demonstrated in randomised trials, and it has no established molecular entry point at
  the growth plate. In a meta-analysis of 33 randomised controlled trials in prepubertal children, supplemental
  zinc increased height with a weighted mean effect size of 0.350 SD (95% CI 0.189-0.511) and weight by
  0.309 SD (0.178-0.439), with no effect on weight-for-height (-0.018, 95% CI -0.132 to 0.097); serum
  zinc rose by 0.820 SD (0.499-1.14), confirming exposure, and the growth response was larger in children
  with low baseline status (brown2002). The selectivity is informative: zinc lengthens children without
  fattening them, which is what a growth plate effect rather than a general anabolic effect looks like.
  Despite this, no study has identified which zinc-dependent protein at the plate is rate-limiting. Zinc
  is a structural cofactor of hundreds of enzymes and of every zinc-finger transcription factor, including
  those in the SOX and RUNX families that the atlas already carries at L3, but no experiment has shown
  that dietary zinc restriction changes SOX9, RUNX2 or IGF1R signalling in chondrocytes at physiologically
  attainable concentrations. This is registered as a scale gap, not papered over.'
