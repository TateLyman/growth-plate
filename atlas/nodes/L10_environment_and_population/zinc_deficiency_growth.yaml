claim_grades:
- claim: Zinc supplementation increases linear growth in prepubertal children by about 0.35 SD.
  grade: A
  basis: Random-effects meta-analysis of 33 RCTs with meta-regression on baseline status (brown2002).
- claim: The effect is specific to linear growth rather than to general weight gain.
  grade: A
  basis: Height and weight both increased while weight-for-height did not (brown2002).
- claim: Zinc acts on chondrocytes through a named zinc-dependent protein.
  grade: X
  basis: Widely asserted in reviews; no primary experiment identifies a rate-limiting zinc-dependent target
    at the growth plate. Logged as g_l10env_007.
