human_evidence: direct
human_evidence_note: Human anthropometry with paired serum IGF-1 and inflammatory markers, plus pooled
  randomised supplementation trials.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: A human phenotype defined against a human growth reference.
confidence: A
claim_grades:
- claim: Stunted children have low circulating IGF-1 and inflammation is its strongest negative correlate.
  grade: A
  basis: Cross-sectional human cohort n=740 with measured IGF-1, CRP, AGP and malaria testing (madigan2026).
- claim: Nutrient supplementation recovers about one tenth of the attainable linear growth deficit.
  grade: A
  basis: Pooled 15 RCTs, n=36970, prespecified proportion-of-maximal-benefit metric (watson2025).
- claim: The low circulating IGF-1 acts by reducing IGF1R occupancy on growth plate chondrocytes.
  grade: E
  basis: No human growth plate measurement in stunted children exists; inferred from IGF1R biology in
    other systems.
