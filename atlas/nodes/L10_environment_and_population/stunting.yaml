id: stunting
name: Stunting
type: phenotype
aliases:
- height-for-age Z-score below -2
- linear growth faltering
summary: 'Stunting is height-for-age below -2 SD of the WHO standard and is the population-scale phenotype
  this layer has to connect to the growth plate. Its proximate biochemical correlate in humans is a low
  circulating IGF-1: in 740 stunted Ugandan children aged 12-59 months (mean HAZ -3.02, SD 0.74) median
  serum IGF-1 was 37.4 ug/L (IQR 24.2-53.3), inflammation markers were the strongest negative correlates
  of IGF-1, and a positive malaria test was associated with -4.7 ug/L (95% CI -7.8 to -1.6) before inflammation
  adjustment (madigan2026). In the same cohort plasma concentrations of 18 of 21 amino acids were lower
  in children with elevated inflammatory markers (larnkjr2026), which puts substrate limitation and inflammatory
  GH resistance on the same node rather than in competition. Supplementation moves the phenotype only
  slightly: pooled across 15 randomised trials of small-quantity lipid-based nutrient supplements in 10
  countries (n=36970) the effect on length-for-age Z was +0.15 (95% CI 0.12-0.17), equal to 12 days of
  height-age (95% CI 9-14) and 11% of the maximal attainable benefit (95% CI 9.4-12; between-trial I2
  = 90%) (watson2025). That 11% is the most important number about stunting: the deficit is overwhelmingly
  not closed by adding energy and micronutrients to the diet.'
