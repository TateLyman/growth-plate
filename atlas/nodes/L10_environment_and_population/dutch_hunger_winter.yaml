claim_grades:
- claim: Prenatal famine exposure abolishes the detectable genetic contribution to birthweight.
  grade: B
  basis: Prespecified gene-environment interaction in a genotyped famine cohort with obstetric records
    (taeubert2026); single cohort.
- claim: Famine exposure in childhood costs 1-2 cm of adult height measured four decades later.
  grade: A
  basis: Retrospective cohort with two independent control groups and adjusted differences with CIs (abera2026).
- claim: The famine effect on stature is mediated by suppressed IGF-1 at the growth plate.
  grade: E
  basis: No famine cohort has a contemporaneous endocrine or skeletal measurement; the mediator is imported
    from nutrition-IGF-1 studies.
