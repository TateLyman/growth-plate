id: dutch_hunger_winter
name: Dutch Hunger Winter natural experiment
type: process
aliases:
- Dutch Famine 1944-45
- Hongerwinter
summary: 'The Dutch Hunger Winter of November 1944 to May 1945 is the best-documented famine natural experiment
  in human growth biology because rations were recorded, obstetric records survive, the population was
  previously well nourished, and the famine ended abruptly - so exposure timing within gestation can be
  resolved to weeks. The Dutch Hunger Winter Families Study comprises 283 individuals conceived before
  the famine and therefore exposed in mid-to-late gestation, 145 conceived during the famine and exposed
  in early gestation, and 161 unexposed controls, all with obstetric records and genotypes (taeubert2026).
  Its most incisive result for this atlas is not an effect size but a loss of one: a birthweight polygenic
  index explained 14% of birthweight variance in controls (r=0.38, p<0.001) yet had no detectable influence
  in famine-exposed individuals, especially those exposed in mid-to-late gestation (r=0.10). Severe substrate
  restriction did not merely shift the mean of fetal growth; it abolished the genotype-phenotype relationship.
  The comparison case for postnatal famine and adult stature comes from Ethiopia: 40 years after the 1984-85
  Great Ethiopian Famine, exposed survivors were 1.4 cm shorter (95% CI -2.4 to -0.3) than matched controls
  and 2.4 cm shorter (-3.7 to -1.1) than post-famine-born controls, with lower weight and handgrip strength
  (abera2026). A one-to-two-year famine therefore costs on the order of 1-2 cm of adult height - an order
  of magnitude smaller than the ~20 cm secular range.'
