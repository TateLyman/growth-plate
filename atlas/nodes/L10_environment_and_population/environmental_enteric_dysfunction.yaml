id: environmental_enteric_dysfunction
name: Environmental enteric dysfunction
type: phenotype
aliases:
- EED
- environmental enteropathy
- tropical enteropathy
summary: 'Environmental enteric dysfunction is subclinical small-intestinal inflammation with increased
  permeability, and it is the proposed reason that water, sanitation and hygiene interventions improve
  infection rates without improving height. The Indonesian Action Against Stunting Hub birth cohort provides
  the mechanistic chain in humans: faecal myeloperoxidase, faecal alpha-1 antitrypsin and plasma intestinal
  fatty-acid binding protein (IFABP) were measured at 6 months with anthropometry at 6 and 12 months,
  elevated EED markers were present in more than 80% of infants, and structural equation modelling showed
  IFABP positively associated with soluble CD14 and CD14 negatively associated with IGF-1, with maternal
  height, birth weight and IGF-1 the significant determinants of length-for-age Z at 12 months (htet2026).
  The pathway is therefore gut barrier failure -> microbial translocation -> systemic inflammation ->
  suppressed IGF-1 -> shorter children, with each link measured rather than assumed. A systematic review
  of 81 studies covering 31996 children found all EED domains - intestinal damage and repair, absorption
  and permeability, microbial translocation, intestinal inflammation and systemic inflammation - associated
  with linear growth, while noting that the measured association depends strongly on which biomarker is
  used (lowe2025). The last step, from suppressed IGF-1 to the chondrocyte, remains inferential.'
