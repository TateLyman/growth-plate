id: protein_intake_growth
name: Dietary protein intake and linear growth
type: process
summary: 'Dietary protein reaches the growth plate through two verified molecular entry points and one
  unverified one. The verified systemic route is hepatic IGF-1: in 24 healthy 8-year-old boys randomised
  to 1.5 L skimmed milk or an isonitrogenous quantity of lean meat for 7 days, protein intake rose 61%
  and 54% respectively, yet serum IGF-I rose 19% (P=0.001) and the IGF-I/IGFBP-3 ratio 13% (P<0.0001)
  only in the milk arm and not at all in the meat arm (hoppe2004). Protein quantity is therefore not the
  operative variable; protein source is. A 2x2 factorial follow-up in 57 boys separated the fractions:
  casein raised serum IGF-1 by 15% (P<0.0001) with no change in fasting insulin, while whey raised fasting
  insulin by 21% (P=0.006) with no change in IGF-1, and milk minerals (Ca, P) had no independent effect
  on either (hoppe2009). The second entry point is amino-acid substrate itself: in 711-730 stunted Ugandan
  children plasma concentrations of 18 of 21 amino acids were lower where inflammatory markers were elevated,
  and plasma amino acids were examined as correlates of serum IGF-1 and linear growth (larnkjr2026). The
  third proposed entry point, direct leucine-sensing by mTORC1 in growth plate chondrocytes, has not been
  demonstrated for a dietary protein manipulation in any species and is registered as a gap.'
