localization:
- 'human SYS: diet -> liver -> circulating IGF-1'
- 'human growth plate: no direct measurement of any dietary protein effect exists'
human_evidence: direct
human_evidence_note: Two randomised human dietary interventions in prepubertal boys with serum IGF-I,
  IGFBP-3 and insulin as endpoints.
species_basis:
- human
translation_risk: low
translation_risk_reason: The IGF-1 response was measured directly in human children; only the chondrocyte-level
  step is extrapolated.
confidence: B
claim_grades:
- claim: Milk protein, but not an equal quantity of meat protein, raises serum IGF-I in prepubertal children
    within 7 days.
  grade: A
  basis: Randomised human intervention with weighed dietary records and RIA IGF-I (hoppe2004), fraction-resolved
    in a second randomised trial (hoppe2009).
- claim: The casein fraction carries the IGF-1 effect and the whey fraction carries the insulin effect.
  grade: A
  basis: 2x2 factorial randomised design in 57 boys with no protein x mineral interaction (hoppe2009).
- claim: Dietary amino acid supply acts on the growth plate through chondrocyte mTORC1.
  grade: E
  basis: No dietary protein manipulation has been coupled to a growth plate mTORC1 readout in any species.
    Logged as g_l10env_002.
