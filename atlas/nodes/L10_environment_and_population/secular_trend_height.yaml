id: secular_trend_height
name: Secular trend in adult height
type: process
aliases:
- secular increase in stature
- positive secular trend
summary: 'Between the 1896 and 1996 birth cohorts, mean adult height rose in almost every country for
  which measured data exist, and the size of that rise is the tightest empirical bound the atlas has on
  how much of human stature is environmentally set. In a Bayesian pooled reanalysis of 1472 population-based
  studies with measured (not self-reported) height on 18.6 million adults in 200 countries, the largest
  century-scale gains were +20.2 cm in South Korean women (95% CrI 17.5-22.7) and +16.5 cm in Iranian
  men (13.3-19.7) - about 2.0 and 1.65 cm per decade sustained for a hundred years (ncd2016). The rate
  is not constant: in German armed-forces conscripts born 1865-1975 it moved from 0.45 mm/yr before 1916
  to 2.15 mm/yr in 1916-1933, 1.87 mm/yr in the early Federal Republic, 1.45 mm/yr in the late Federal
  Republic, and 4 mm/yr in East German conscripts after 1989 (scheffler2025), so the trend tracks political
  and economic discontinuities rather than a smooth nutritional ramp. The trend is also age-structured:
  in the Zurich Longitudinal Studies (n=236, born 1978-1993) height rose 0.35-0.46 SD per decade at ages
  4, 9 and 14 but was no longer detectable at age 18 (eichelberger2024), so part of the secular change
  is tempo rather than final size. No study has measured the growth plate, the GH-IGF axis or any chondrocyte
  parameter across a secular gradient, so the route from a population''s improving environment to a longer
  femur is an inference, not an observation.'
