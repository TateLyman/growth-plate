localization:
- 'human SYS: population-level phenotype, not zone-localized'
human_evidence: direct
human_evidence_note: 'Entirely human: 18.6 million measured adult heights across 200 countries and 100
  birth cohorts, plus national conscript and longitudinal cohort series.'
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: A human population measurement; no animal extrapolation is involved.
confidence: B
claim_grades:
- claim: Mean adult height rose by up to about 20 cm over the 20th century in the fastest-changing populations.
  grade: A
  basis: 1472 measured-height studies, 18.6M participants, Bayesian pooled estimates with credible intervals
    (ncd2016).
- claim: The rate of secular gain changes step-wise with political and economic regime rather than smoothly.
  grade: B
  basis: German conscript series 1865-1975 with period-specific slopes and coherence analysis (scheffler2025);
    single country, ecological design.
- claim: The secular gain is transduced through the GH-IGF axis acting at the growth plate.
  grade: E
  basis: No measurement of GH, IGF-1, bone age or growth plate morphology across a secular gradient exists;
    inference from nutrition-IGF-1 intervention studies.
