translation_risk: unknown
translation_risk_reason: No animal dietary vitamin A restriction experiment with a growth plate readout
  is available to translate from.
confidence: B
claim_grades:
- claim: Vitamin A supplementation does not improve linear growth in children in LMIC settings.
  grade: A
  basis: Meta-analysis of RCTs, 6340 children, prespecified HAZ endpoint (peng2025).
- claim: Dietary vitamin A status reaches the growth plate through RAR/RXR signalling.
  grade: E
  basis: Retinoid receptor biology is established in other systems; no study links dietary vitamin A status
    to a receptor-level readout at the plate. Logged as g_l10env_007.
