id: vitamin_a_growth
name: Vitamin A status and linear growth
type: process
summary: Vitamin A supplementation does not increase linear growth, and this negative result is a useful
  boundary on the nutrition-to-plate story. In a meta-analysis of 12 randomised controlled trials in 6340
  children aged 0-14 years in low- and middle-income countries, vitamin A supplementation alone had no
  significant effect on height-for-age Z, weight-for-age Z or weight-for-height Z; in the same analysis
  vitamin D3 alone also failed to change height-for-age Z (Z=0.43, P=0.67), improving only weight-for-age
  Z (Z=2.72, P=0.007) (peng2025). Vitamin A is nevertheless the one micronutrient with an unambiguous
  pharmacological effect on the growth plate at supraphysiological doses, since retinoids act through
  nuclear RAR/RXR receptors that repress SOX9-driven chondrogenesis - but the atlas carries no RAR or
  RXR node in L3 or L4, and no study has shown that a dietary vitamin A deficit reaches the plate through
  those receptors. The honest position is that vitamin A deficiency has a molecular receptor system in
  principle and no demonstrated dietary entry point at the human growth plate, while the randomised evidence
  says supplementation does not make children taller.
quantitative:
- parameter: effect of vitamin A supplementation alone on height-for-age Z
  value: no significant effect
  unit: z-score
  conditions: meta-analysis of RCTs in children aged 0-14 y in LMICs, 12 RCTs and 6340 children in total
  species: human
  source_ref: peng2025
  uncertainty: reported as no significant impact on HAZ, WAZ or WHZ
- parameter: effect of vitamin D3 supplementation alone on height-for-age Z
  value: no significant effect
  unit: z-score
  conditions: same meta-analysis
  species: human
  source_ref: peng2025
  uncertainty: Z=0.43, P=0.67
