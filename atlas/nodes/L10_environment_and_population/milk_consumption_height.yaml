human_evidence_note: Two randomised controlled dietary interventions in prepubertal boys with measured
  serum IGF-I, IGFBP-3 and insulin.
species_basis:
- human
translation_risk: low
translation_risk_reason: The endocrine response is a direct human measurement; only the plate-level consequence
  is inferred.
confidence: B
claim_grades:
- claim: Milk raises circulating IGF-I in prepubertal children and an isonitrogenous meat load does not.
  grade: A
  basis: Randomised human intervention, weighed dietary records (hoppe2004).
- claim: The IGF-1-raising component is casein, not whey and not milk minerals.
  grade: A
  basis: 2x2 factorial randomised trial, n=57 (hoppe2009).
- claim: Milk-induced IGF-1 elevation translates into faster chondrocyte proliferation at the plate.
  grade: E
  basis: Never measured; inferred from IGF-1 action in other systems.
