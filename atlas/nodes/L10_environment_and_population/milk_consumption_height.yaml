id: milk_consumption_height
name: Cow's milk intake and linear growth
type: process
summary: Cow's milk is the single dietary item with a reproducible, source-specific effect on the human
  GH-IGF axis, and it is the best-characterised environmental input into that axis. In a randomised 7-day
  intervention in 24 healthy 8-year-old boys, 1.5 L/day of skimmed milk raised serum IGF-I by 19% (P=0.001)
  and IGF-I/IGFBP-3 by 13% (P<0.0001), while the same quantity of protein as lean meat raised neither,
  even though protein intake rose by 54-61% in both arms (hoppe2004). A 2x2 factorial trial in 57 boys
  localised the effect to the casein fraction (+15% IGF-1, P<0.0001) and separated it from the whey fraction,
  which instead raised fasting insulin by 21% (P=0.006); high milk-mineral content had no independent
  effect on IGF-1 or insulin (hoppe2009). The growth-promoting component of milk is therefore neither
  its total protein nor its calcium and phosphorus. Observationally, milk intake associates with linear
  growth in both undernourished and well-nourished populations, an association the field reads through
  the IGF axis (hoppe2006). What is missing is any demonstration that the milk-induced increment in circulating
  IGF-1 changes chondrocyte proliferation or hypertrophy - no milk intervention has ever been coupled
  to a growth plate readout.
