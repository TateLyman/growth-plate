id: inflammation_growth_suppression
name: Inflammatory suppression of linear growth
type: process
aliases:
- cytokine-induced GH resistance
- inflammatory growth failure
summary: 'Chronic inflammation suppresses linear growth through two mechanistically distinct and independently
  demonstrated routes. The hepatic route is SOCS-mediated interruption of GH signalling: LPS pretreatment
  abolished GH-induced STAT5 activation in wild-type and TNFR1-null mice but not in IL-6-null mice, GHR
  abundance was unchanged, and the loss of STAT5 activation was temporally coupled to STAT3 phosphorylation
  and upregulation of CIS and SOCS-3 protein (denson2003). The plate-intrinsic route is direct cytokine
  interference with IGF-I signalling in chondrocytes: in the RCJ3.1C5.18 rat chondrogenic line, IL-1beta
  (10 ng/mL), IL-6 (100 ng/mL) or TNF-alpha (50 ng/mL) co-incubated with IGF-I cut IGF-I-driven proliferation
  by 50% without altering baseline proliferation, attenuated IGF-I-induced AKT phosphorylation by 30-50%
  and ERK phosphorylation by 50-75%, and blocked IGF-I-enhanced differentiation (choukair2014). At the
  organ level, 8 days of IL-1beta or TNF-alpha reduced murine metatarsal growth by 71% and 45% respectively,
  with an additive 110% reduction in combination; a 2-day single-cytokine exposure was fully reversible,
  but the combination left growth 59% below control after 6 days of recovery (macrae2006). SOCS2 is the
  specific brake: TNF-alpha exposure of growth plate chondrocytes increased SOCS2 protein (macrae2009),
  SOCS2 is the only SOCS induced by GH in chondrocytes and its loss increases chondrocyte STAT1/3/5 phosphorylation,
  growth plate width and bone growth rate (pass2012), and Socs2-null mice are protected from the skeletal
  effects of DSS colitis (dobie2018). The therapeutic irony is quantified: 4-6 years of inhaled budesonide
  from age 5-13 left adult height 1.2 cm lower (95% CI -1.9 to -0.5) in 943 CAMP participants (kelly2012).'
