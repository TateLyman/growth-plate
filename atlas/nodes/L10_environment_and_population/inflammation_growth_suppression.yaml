localization:
- 'mouse growth plate: TNF-alpha increases SOCS2 protein in growth plate chondrocytes (macrae2009)'
- 'mouse growth plate: SOCS2 loss increases phospho-STAT5-positive hypertrophic chondrocytes (pass2012)'
- 'human growth plate: no cytokine, SOCS or phospho-STAT5 measurement in human physeal tissue exists'
human_evidence: indirect
human_evidence_note: Human evidence is the association of inflammatory markers with low IGF-1 in stunted
  children and the randomised adult-height cost of inhaled glucocorticoid; the SOCS/STAT5 and chondrocyte
  signalling steps are rodent and rodent-cell-line only.
species_basis:
- mouse
- rat
- in_vitro_animal_cell
- human
translation_risk: high
translation_risk_reason: Every mechanistic step - SOCS3/CIS induction, STAT5 blockade, AKT/ERK attenuation,
  metatarsal growth arrest - is rodent. Mice do not fuse their growth plates, so the irreversibility observed
  in metatarsal culture cannot be mapped onto human final height.
confidence: B
claim_grades:
- claim: IL-6 is required for endotoxin-induced loss of hepatic GH-STAT5 signalling, and the loss is mediated
    by CIS and SOCS-3 rather than by GHR downregulation.
  grade: C
  basis: Mouse genetic dissection with IL-6-null and TNFR1-null strains, immunoblot, EMSA and RT-PCR (denson2003);
    no human replication.
- claim: Pro-inflammatory cytokines halve IGF-I-driven chondrocyte proliferation and attenuate AKT and
    ERK phosphorylation.
  grade: D
  basis: Single study in one rat chondrogenic cell line (choukair2014).
- claim: Combined IL-1beta and TNF-alpha exposure produces growth suppression that does not fully recover
    after withdrawal.
  grade: C
  basis: Murine metatarsal organ culture with washout design (macrae2006); not tested in vivo or in human
    tissue.
- claim: SOCS2 is the specific negative regulator of GH action in growth plate chondrocytes.
  grade: C
  basis: Socs2-null mouse genetics with metatarsal culture, growth plate histomorphometry and phospho-STAT
    quantification (pass2012, macrae2009, dobie2015, dobie2018).
- claim: Suppressing childhood inflammation with inhaled glucocorticoid costs about 1.2 cm of adult height.
  grade: A
  basis: Randomised trial with adult height measured in 943 of 1041 participants and a dose-response (kelly2012).
key_refs:
- ref_id: denson2003
  pmid: '12519742'
  first_author: Denson LA
  year: 2003
  type: primary
  one_line_finding: LPS abolished GH-induced hepatic STAT5 activation in wild-type and TNFR1-null but
    not IL-6-null mice, with unchanged GHR and upregulated CIS and SOCS-3.
- ref_id: choukair2014
  pmid: '24941214'
  first_author: Choukair D
  year: 2014
  type: primary
  one_line_finding: IL-1beta, IL-6 and TNF-alpha each cut IGF-I-driven chondrocyte proliferation by 50%
    and attenuated IGF-I-induced AKT (30-50%) and ERK (50-75%) phosphorylation.
- ref_id: macrae2006
  pmid: '16648299'
  first_author: MacRae VE
  year: 2006
  type: primary
  one_line_finding: IL-1beta and TNF-alpha reduced murine metatarsal growth by 71% and 45% over 8 days,
    additively by 110%, with incomplete recovery (59% deficit) after combined exposure.
- ref_id: pass2012
  pmid: '22228213'
  first_author: Pass C
  year: 2012
  type: primary
  one_line_finding: SOCS2, not SOCS1 or SOCS3, is GH-induced in chondrocytes; its deletion increases chondrocyte
    STAT1/3/5 phosphorylation, growth plate width, chondrocyte proliferation and bone growth rate.
- ref_id: macrae2009
  pmid: '18803233'
  first_author: Macrae VE
  year: 2009
  type: primary
  one_line_finding: TNF-alpha exposure of growth plate chondrocytes for 48 h increased SOCS2 protein;
    Socs2-null mice were 6% longer with 24% wider growth plates.
- ref_id: dobie2018
  pmid: '29343614'
  first_author: Dobie R
  year: 2018
  type: primary
  one_line_finding: Socs2 deletion protected mouse trabecular bone from DSS colitis, placing SOCS2 in
    the inflammation-to-skeleton pathway.
- ref_id: kelly2012
  pmid: '22938716'
  first_author: Kelly HW
  year: 2012
  type: primary
  one_line_finding: Budesonide 400 ug/day for 4-6 years in childhood lowered adult height by 1.2 cm (95%
    CI -1.9 to -0.5) in 943 CAMP participants, with a dose-response of -0.1 cm per ug/kg/day.
