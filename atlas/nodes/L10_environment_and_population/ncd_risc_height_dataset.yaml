id: ncd_risc_height_dataset
name: NCD-RisC pooled height database
type: dataset
aliases:
- NCD Risk Factor Collaboration height data
summary: NCD-RisC is the reference source for population height and the only one pooling measured rather
  than self-reported stature at global scale. The adult analysis covers 1472 population-based studies
  with measured height on 18.6 million adults in 200 countries, modelled by a Bayesian hierarchical model
  to give mean height by birth cohort from 1896 to 1996 (ncd2016). The child and adolescent analysis pools
  2181 studies with height and weight on 65 million participants aged 5-19 in 200 countries and territories,
  giving mean height by single year of age from 1985 to 2019 (ncd2020). Two structural features matter
  for anyone using these numbers. First, the model borrows strength across countries within a region,
  so estimates in data-sparse regions are partly regional and must be quoted with their credible intervals.
  Second, adult height for early birth cohorts is estimated from participants who were measured at older
  ages, so the divergence between the fitted line and the raw data in early cohorts is an age effect built
  into the model, not a data error (ncd2016). The database contains no biological covariate - no IGF-1,
  no bone age, no dietary measure - so it can bound the size of environmental effects on stature but cannot
  attribute them to a mechanism.
