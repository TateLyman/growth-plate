id: small_for_gestational_age
name: Small for gestational age
type: phenotype
aliases:
- SGA
summary: 'Small for gestational age is birth size below -2 SDS for gestational age and is the population-scale
  readout of a restricted intrauterine environment. In a population-based Swedish cohort of 3650 healthy
  full-term singletons followed from birth to final height at about 18 years, infants defined SGA on birth
  length (SGAL) showed catch-up growth in the first 6 months, so that by 1 year only 13.4% remained below
  -2 SDS in height, falling further to 7.9% at 18 years; SGAL infants nevertheless carried a 7.1-fold
  higher relative risk of short final stature (95% CI 3.7-13.6), and those who failed to catch up constituted
  21% of all short prepubertal children (karlberg1995). Definition matters: 22% of short 18-year-olds
  had been short at birth by length, but only 14% had been light at birth by weight. In a second population-based
  Swedish series, 88% of healthy full-term singleton SGA infants achieved catch-up during the first 2
  years, most of the increase occurring by 2 months, and the SGA children still short at 2 years had a
  markedly higher risk of short stature later; about 20% of all short children had been born SGA (karlberg2002
  and its companion series). The endocrine entry point is the fetal-to-infant transition of the IGF system,
  which no SGA cohort has measured longitudinally alongside height.'
