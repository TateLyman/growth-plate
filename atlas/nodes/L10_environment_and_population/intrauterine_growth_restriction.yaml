id: intrauterine_growth_restriction
name: Intrauterine growth restriction
type: phenotype
aliases:
- IUGR
- fetal growth restriction
summary: 'Intrauterine growth restriction is failure to achieve the genetically expected fetal growth
  trajectory, and it is the point at which environmental exposure and the fetal IGF axis meet most directly.
  Its importance for adult stature is quantified through birth size: in a population-based Swedish cohort
  of 3650 healthy full-term singletons followed to final height at about 18 years, infants short at birth
  (birth length below -2 SDS) carried a 7.1-fold higher risk of short adult stature (95% CI 3.7-13.6)
  than non-short-at-birth infants, and 22% of the short 18-year-olds had been short at birth while only
  14% had been light at birth (karlberg1995) - birth length, not birth weight, is the informative measure.
  Across five long-running birth cohorts, intrauterine growth restriction was among the indices most strongly
  related to shorter adult height (victora2008). The Dutch Hunger Winter shows what the restriction does
  to the genotype-phenotype map: severe mid-to-late gestational famine abolished the detectable influence
  of a birthweight polygenic index (taeubert2026). The mechanistic entry point is the fetal IGF system
  - IGF-2 dominates fetal growth and PAPP-A2 sets IGF bioavailability - but no human study links a measured
  IUGR exposure to a measured fetal IGF-axis parameter and a growth plate readout.'
