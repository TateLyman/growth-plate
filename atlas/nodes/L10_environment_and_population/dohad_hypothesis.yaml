id: dohad_hypothesis
name: Developmental origins of health and disease
type: hypothesis
aliases:
- DOHaD
- fetal programming
- Barker hypothesis
summary: 'DOHaD holds that the early-life environment permanently sets adult physiology, and for stature
  the claim is that size attained by about 2 years of age largely fixes adult height. The pooled evidence
  is strong for the association: across five long-running birth cohorts in Brazil, Guatemala, India, the
  Philippines and South Africa, maternal height, birthweight, intrauterine growth restriction and weight,
  height and BMI at 2 years were all related to adult height, schooling, income and offspring birthweight,
  with undernutrition strongly associated with shorter adult height and reduced economic productivity
  (victora2008). The mechanistic claim - permanent programming rather than continuous exposure - is much
  less secure, because in most settings the environment at age 2 and the environment at age 12 are the
  same environment. The Dutch Hunger Winter provides the design that separates them, and there the finding
  is a gene-environment interaction on fetal growth: a birthweight polygenic index explained 14% of birthweight
  variance in unexposed controls (r=0.38, p<0.001) but had no detectable effect in famine-exposed individuals,
  particularly those exposed in mid-to-late gestation (r=0.10) (taeubert2026). A severe environmental
  insult can therefore erase the expression of genetic influence on growth altogether. No DOHaD study
  has measured a growth plate, and the proposed epigenetic mediators have never been assayed in physeal
  cartilage; L8 carries dna_methylation_growth_plate as the corresponding placeholder.'
