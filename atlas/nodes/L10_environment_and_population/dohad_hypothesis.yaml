  species: human
  source_ref: taeubert2026
  uncertainty: r=0.38, p<0.001
- parameter: correlation of the birthweight polygenic index with birthweight in famine-exposed individuals
  value: '0.10'
  unit: Pearson r
  conditions: exposed in mid-to-late gestation, n=283
  species: human
  source_ref: taeubert2026
  uncertainty: not statistically distinguishable from zero as reported
localization:
- 'human SYS: whole-organism developmental programming'
human_evidence: direct
human_evidence_note: Five prospective LMIC birth cohorts with adult follow-up, plus a genotyped famine
  natural experiment with obstetric records.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: The evidence cited here is entirely human cohort and natural-experiment data.
confidence: B
claim_grades:
- claim: Size at 2 years predicts adult height, schooling and income across diverse populations.
  grade: A
  basis: Pooled analysis of five prospective birth cohorts with adult follow-up plus systematic reviews
    (victora2008).
- claim: Severe prenatal undernutrition suppresses the expression of genetic influence on fetal growth.
  grade: B
  basis: Genotyped famine cohort with obstetric records and prespecified gene-environment interaction
    test (taeubert2026); single cohort, n=589 total.
- claim: Early-life exposure programmes the growth plate epigenetically.
  grade: E
  basis: No DOHaD study has measured DNA methylation, chromatin or transcription in growth plate cartilage
    in any species.
