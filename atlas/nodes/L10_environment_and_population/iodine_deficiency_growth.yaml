localization:
- 'human SYS: dietary iodine -> T4/T3 -> THRA in prehypertrophic chondrocytes (L4)'
- 'human growth plate: thyroid hormone receptor action inferred from L4, not measured under iodine repletion'
human_evidence: direct
human_evidence_note: Three prospective double-blind iodine repletion trials with measured urinary iodine,
  thyroid function, IGF-I, IGFBP-3 and growth, plus a systematic review of 18 studies.
species_basis:
- human
translation_risk: low
translation_risk_reason: Human interventional data with human endocrine endpoints; only the chondrocyte-level
  thyroid hormone step is imported from L4.
confidence: B
claim_grades:
- claim: Iodine repletion raises IGF-I and IGFBP-3 and improves somatic growth in iodine-deficient school-age
    children.
  grade: A
  basis: Three prospective double-blind interventions across three severity strata with exposure verified
    by urinary iodine (zimmermann2007).
- claim: Postnatal growth benefit is inconsistent in non-cretinous, mildly deficient children.
  grade: A
  basis: Systematic review with GRADE assessment of 18 studies, n=5729 (farebrother2018).
- claim: The growth effect is transduced by T3 acting on THRA in prehypertrophic chondrocytes.
  grade: B
  basis: Thyroid hormone action at the plate is established in the L4 thra_receptor and thyroid_hormone_t3
    nodes; not measured in any iodine trial.
