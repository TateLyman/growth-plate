id: iodine_deficiency_growth
name: Iodine deficiency and linear growth
type: process
summary: 'Iodine is the micronutrient whose route to the growth plate is fully specified by an existing
  endocrine node: iodine is the substrate for thyroxine, and thyroid hormone acting through THRA on prehypertrophic
  chondrocytes is required for hypertrophic differentiation. The human interventional evidence closes
  the loop at the level of the GH-IGF axis. Three prospective double-blind intervention studies - severely
  deficient Moroccan children aged 7-10 given iodised salt for 10 months (n=71), moderately deficient
  Albanian children aged 10-12 given 400 mg iodine as oral iodised oil for 6 months (n=310), and mildly
  deficient South African children aged 5-14 given two 200 mg doses (n=188) - all raised median urinary
  iodine above 100 ug/L, and iodine repletion increased IGF-I and IGFBP-3 concentrations and improved
  somatic growth, with the smallest effect in the mildly deficient South African group where IGF-I rose
  only modestly (zimmermann2007). A systematic review of 18 studies (13 RCTs, n=5729) found iodine supplementation
  of severely deficient pregnant women increased mean birthweight by 200 g, while postnatal growth effects
  in non-cretinous children were inconsistent (farebrother2018). Iodine therefore behaves as a threshold
  nutrient like vitamin D: severe deficiency has large effects, mild deficiency has small and inconsistent
  ones.'
