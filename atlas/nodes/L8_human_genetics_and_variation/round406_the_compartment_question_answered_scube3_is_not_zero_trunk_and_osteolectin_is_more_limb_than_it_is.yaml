human_evidence: direct
human_evidence_note: >-
  451,921 Europeans, three absolute anthropometric traits measured in one cohort, all
  effects aligned to the height-increasing allele.
species_basis:
  - human
translation_risk: moderate
translation_risk_reason: >-
  The genetics are human and large, but the alleles are common regulatory variants near the
  genes rather than the coding loss-of-function alleles that motivated both candidates, and
  the windows are 150 kb in gene-dense regions.
confidence: B
claim_grades:
  - claim: R318's figure of about 104 percent leg for SCUBE3 is an artefact of ratio-selection
    grade: A
    basis: >-
      same trait, same cohort, same method except the selection step - the trunk arm goes
      from P=0.47 to P=1.4e-17. This is precisely the artefact R323 identified and quantified
  - claim: SCUBE3's height allele puts about 30 percent of its effect into the trunk
    grade: B
    basis: >-
      standing-height lead with both component traits significant. A common-variant lead
      allele, not the coding burden allele
  - claim: >-
      CLEC11A is more limb-dominant than SCUBE3, with a trunk arm not distinguishable from
      zero
    grade: B
    basis: sitting-height P=0.12 against leg P=1.3e-15 on the same variant
  - claim: Both candidates are limb-leaning and neither is a trunk lever
    grade: B
    basis: >-
      29.5 and 18.0 percent trunk. Real for these alleles; whether it holds for the coding
      alleles is untested
  - claim: The compartment argument no longer favours osteolectin over SCUBE3
    grade: B
    basis: >-
      it now runs slightly the other way, while power, monotonicity and the completed animal
      experiment continue to favour osteolectin
