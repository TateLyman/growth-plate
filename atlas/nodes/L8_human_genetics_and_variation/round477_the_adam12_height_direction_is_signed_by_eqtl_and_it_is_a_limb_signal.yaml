id: round477_the_adam12_height_direction_is_signed_by_eqtl_and_it_is_a_limb_signal
name: >-
  R477 - the ADAM12 height direction, signed by eQTL colocalisation: raising ADAM12 is TALLER, the
  effect is entirely in the LEG, and the region's height lead is a UROS/DHX32 signal not an ADAM12 one
aliases:
  - ADAM12 eQTL direction
  - ADAM12 limb compartment
  - UROS DHX32 confound at the ADAM12 locus
type: hypothesis
layer: L8
stub: false
confidence: C
last_verified: '2026-08-27'
species_basis: human
human_evidence: direct
human_evidence_note: >-
  Common-variant human genetics throughout: GTEx v8 cis-eQTL effect sizes for ADAM12 crossed against
  standing height, sitting height and leg length measured in the same cohort of 451,921 Europeans
  (bartell2026, GCST90728584 / 86 / 87). No animal data enters the inference; kveiborg2006's mouse
  transgenic is used only as the direction this result agrees with.
translation_risk: moderate
translation_risk_reason: >-
  A common regulatory variant changing fibroblast ADAM12 by roughly 20 per cent establishes a SIGN and
  says nothing about what supraphysiological supply of the secreted isoform would do. GTEx contains no
  cartilage, so cultured fibroblasts are the mesenchymal proxy, and ADAM12 in the human growth plate is
  32.6 CPM at a purity ratio of 0.24 (R465).
summary: >-
  THE PROBLEM R466 LEFT: ADAM12's top GWAS trait is human height, with nine conditionally independent
  yengo2022 signals inside a 376 kb gene body and a best P of 6e-73, and the signals split five
  height-decreasing against four height-increasing - so the locus carried no GENE direction at all. The
  fix is to align every variant to its ADAM12-RAISING allele using the GTEx normalised effect size, which
  is defined per ALT allele relative to REF, and then read the height beta. Run over all 588 GTEx v8 cis
  variants tested against ENSG00000148848 (metasoft endpoint) against the three absolute traits.
  FIRST, THE CRUDE AGGREGATE IS AN ARTEFACT AND IT POINTS THE WRONG WAY. Pooled over 346 variant-tissue
  pairs at eQTL p below 1e-4 it reads 211 shorter against 135 taller, and among the 71 genome-wide
  significant height variants it is 71 shorter and 0 taller - which taken at face value would refute the
  mouse outright. It is wrong for a checkable reason: the region carries TWO INDEPENDENT REGULATORY
  SIGNALS 208 kb APART AND THE ONE CARRYING THE HEIGHT ASSOCIATION IS NOT AN ADAM12 eQTL.
  THE GENE-SPECIFICITY QUERY SETTLES IT. The region's standing-height lead rs34845021 (chr10:126,019,392,
  P=7.7e-11) is a UROS eQTL at p=1.35e-39 in fibroblasts and a DHX32 eQTL at p=4.25e-28 in tibial nerve;
  its ADAM12 arm is p=6.71e-05 in visceral adipose alone, thirty-five orders of magnitude weaker, and at
  NES +0.118 it is the OPPOSITE SIGN to the whole-blood NES of -0.198 that drove the aggregate. By
  contrast chr10:126,227,914 (rs3858310) is ADAM12 at p=3.47e-26 in fibroblasts with the next gene,
  C10orf90, nineteen orders weaker. The two are mutually null: the fibroblast lead has whole-blood NES
  +0.000 at p=0.99, and the height lead has fibroblast NES -0.008 at p=0.79.
  THE RESULT, ON THE CLUSTER THAT IS ACTUALLY AN ADAM12 eQTL: THE ADAM12-RAISING ALLELE IS ASSOCIATED
  WITH LONGER LEGS. Of 33 variants at fibroblast eQTL p below 1e-8, 27 have the ADAM12-raising allele
  taller, and the 6 exceptions are a separate sub-block at 126.468-126.471 Mb whose height p is 0.15 to
  0.16, i.e. null. The best is rs34925916 (chr10:126,229,943, raising allele C, EAF 0.381): standing
  +0.00734 at p=3.3e-05, LEG +0.00973 at p=8.3e-08, SITTING +0.00065 at p=0.82. That is the first human
  directional evidence that raising ADAM12 lengthens bone, and it agrees with the mouse transgenic.
  AND IT WITHDRAWS R476'S OWN COMPARTMENT COORDINATE, WHICH WAS THE MOST FAVOURABLE FACT IN THAT ROUND.
  R476 computed 55.2 per cent trunk from rs34845021 - a UROS/DHX32 variant. The ADAM12-attributable
  compartment is the opposite: sitting height is NULL and the entire effect sits in the leg. ADAM12 IS A
  LIMB SIGNAL, and the residual at bone age 16 is trunk-dominant. The compartment discordance is also
  independent evidence that the two clusters are separate signals rather than one in LD, because two
  variants tagging one causal signal must share a compartment shape and these do not.
quantitative:
  - parameter: >-
      standing height per ADAM12-RAISING allele, best variant of the fibroblast eQTL cluster
      (rs34925916, chr10:126,229,943, raising allele C, EAF 0.381)
    value: '+0.00734'
    unit: inverse-normalised SD per allele (SE 0.00168, P=3.3e-05)
    species: human
    source_ref: bartell2026
    note: GCST90728584, 451,921 Europeans. ADAM12 fibroblast eQTL at this variant p=8.69e-18, NES -0.223.
  - parameter: LEG LENGTH per ADAM12-raising allele, same variant
    value: '+0.00973'
    unit: SD per allele (SE 0.00178, P=8.3e-08)
    species: human
    source_ref: bartell2026
    note: GCST90728587. The strongest of the three traits by more than two orders of magnitude.
  - parameter: SITTING HEIGHT per ADAM12-raising allele, same variant
    value: '+0.00065'
    unit: SD per allele (SE 0.00188, P=0.82)
    species: human
    source_ref: bartell2026
    note: >-
      GCST90728586. NULL. So the ADAM12-attributable compartment is essentially 0 per cent trunk, against
      the 55.2 per cent trunk R476 computed from the region's standing-height lead, which is a UROS/DHX32
      variant rather than an ADAM12 one.
  - parameter: >-
      fibroblast eQTL cluster variants (eQTL p below 1e-8) whose ADAM12-raising allele is TALLER
    value: 27 of 33
    unit: variants
    species: human
    source_ref: gtex_v8
    note: >-
      The 6 exceptions are a separate sub-block at chr10:126.468-126.471 Mb (rs72237050, rs11244991) whose
      height p is 0.15 to 0.16, i.e. null rather than opposing.
  - parameter: ADAM12 cis-eQTL strength at the region's standing-height lead rs34845021, fibroblasts
    value: '-0.008'
    unit: NES (p=0.79)
    species: human
    source_ref: gtex_v8
    note: >-
      Against UROS p=1.35e-39 and DHX32 p=4.25e-28 at the same variant. The height lead is not an ADAM12
      eQTL in any mesenchymal tissue; its only ADAM12 signal is visceral adipose p=6.71e-05 at NES +0.118,
      the opposite sign to the whole-blood arm.
  - parameter: ADAM12 cis-eQTL at the fibroblast lead rs3858310, whole blood
    value: '+0.000'
    unit: NES (p=0.99)
    species: human
    source_ref: gtex_v8
    note: >-
      Mutual nullity with the height lead's fibroblast p=0.79 establishes two independent regulatory
      signals 208 kb apart rather than one signal in LD.
  - parameter: genes at the ADAM12 locus reaching the kosmicki2026 207
    value: '0'
    unit: genes, of ADAM12, UROS, DHX32, C10orf90, FANK1 and BCCIP
    species: human
    source_ref: kosmicki2026
    note: >-
      Zero burden rows for any of them at any variant class. Exactly what R469's gain-only prediction
      requires - a heterozygous pLoF burden test cannot see a lever whose loss is null - and simultaneously
      it means the locus has no human coding anchor in either direction.
