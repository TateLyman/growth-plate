id: round478_the_isotretinoin_age_gradient_is_a_human_measurement_of_the_window
name: >-
  R478 - schmidt2026 obtained: its own Table 2 carries a WITHIN-EXPOSURE isotretinoin initiation-age
  gradient swinging 2.3 cm of adult height, dismissed by its authors against a 5 cm relevance threshold
aliases:
  - isotretinoin adult height age gradient
  - minimal clinically important difference as an imported filter
  - tetracycline adult height arm
type: phenotype
layer: L8
stub: false
confidence: B
last_verified: '2026-08-27'
species_basis: human
human_evidence: direct
human_evidence_note: >-
  Danish military conscription records linked to nationwide prescription registries, 379,196 individuals
  with ADULT HEIGHT MEASURED AT A FIXED AGE (median 19 years) by a standardised examination, not
  self-reported and not predicted. Every number below is read directly from the accepted manuscript
  obtained from the LSHTM institutional repository, not from the abstract.
translation_risk: low
translation_risk_reason: >-
  Human, nationwide, attained adult height at a fixed age. The load-bearing comparison is WITHIN one
  exposure group, so confounding by indication and by health-seeking behaviour is controlled by design.
summary: >-
  THE DOCUMENT R477 ASKED FOR IS IN HAND AND R477's DESCRIPTION OF IT WAS WRONG. R477 recorded that
  schmidt2026 "reports detailed numbers only for the isotretinoin arm, not even disclosing the number of
  tetracycline users" and filed it as a document request. The tetracycline numbers are in Table 2 of the
  main text; only the ABSTRACT omits them. Obtained lawfully as a green open-access accepted manuscript
  from the LSHTM repository (the published version is behind the JAMA gate and its PMC deposit is embargoed
  to 2027-05-20).
  THE TETRACYCLINE WATCH-ITEM IS LARGELY DEFUSED. In men, oral tetracycline-class antibiotics (17,527 users,
  defined as at least 90 tablets dispensed within any six-month period, isotretinoin-naive) gave an adjusted
  mean height difference of PLUS 0.43 cm (95 per cent CI 0.33 to 0.54) against 315,370 men with no acne -
  the TALLEST group in the study - with stunting prevalence 1.67 per cent against 2.14 per cent and an
  adjusted prevalence ratio of 0.79 (0.70 to 0.89). Women: plus 0.33 cm (-0.17 to 0.83), 587 users. There is
  no signal of tetracycline-associated height reduction in 17,527 men. R477's concern rested on MMP-13
  inhibition inside the achievable serum range plus a 1963 oxytetracycline fibula observation at roughly
  sixty times the acne dose; it now also has a well-powered human arm running the other way, alongside
  defigueiredo2019's null rat femur. It is not proof of safety - confounding by indication and healthy-user
  effects run in the favourable direction and the authors invoke them explicitly - but the question is no
  longer open in the direction of harm.
  AND THE THING THAT MATTERS MORE IS IN THE SAME TABLE AND IS NOT ABOUT TETRACYCLINES. Isotretinoin in men,
  stratified by AGE AT FIRST PRESCRIPTION, adjusted difference in adult height against the no-acne reference:
  initiation before 13 years, MINUS 1.70 cm (-3.15 to -0.25), n=84; at 13 years, MINUS 1.81 cm (-2.43 to
  -1.19), n=464; at 14 years, MINUS 0.95 cm (-1.29 to -0.60), n=1,484; at 15 years or later, PLUS 0.51 cm
  (0.40 to 0.63), n=14,707. A MONOTONE GRADIENT IN BOTH MAGNITUDE AND PRECISION, SWINGING 2.32 cm ACROSS
  THE AGE RANGE, WITH EVERY CONFIDENCE INTERVAL EXCLUDING ZERO.
  THAT COMPARISON IS WITHIN THE ISOTRETINOIN ARM, WHICH IS WHAT MAKES IT STRONG. Same drug, same disease,
  same health-seeking behaviour, same registry, same conscription measurement - the only variable is WHEN in
  the growth window the drug was given. Confounding by indication cannot produce a 2.3 cm swing across age
  at initiation within one exposure. The pooled isotretinoin estimate of plus 0.31 cm that the abstract
  reports is the average of a large late-initiating group in which the drug costs nothing and a small
  early-initiating group in which it costs of the order of 1.8 cm.
  IT ALSO COMPLETES AN ARC THIS FILE HELD IN TWO DISCONNECTED PIECES. R457's FAERS analysis returns
  ISOTRETINOIN at a reporting odds ratio of 187.6 (146.5 to 240.2, 91 co-reports) for the term EPIPHYSES
  PREMATURE FUSION - the strongest single agent in that query, recovered from spontaneous human reports.
  This supplies the population magnitude and localises it to the open window. A pharmacovigilance signal, an
  attained-height number and an age gradient, in one direction.
  READ FOR THE SUBJECT, IT CUTS BOTH WAYS AND THE SECOND READING IS THE UNCOMFORTABLE ONE. The retinoid
  contraindication is essentially spent for a male past 15 - which is reassuring. But the same gradient is a
  direct human measurement of HOW MUCH REMAINING GROWTH IS AT RISK at each age, and by 15 or later, in an
  average Danish male, a drug that closes growth plates costs nothing measurable, because there is almost
  nothing left for it to close. CORR-195 states this subject is off that distribution - knees
  radiographically open and demonstrably growing at bone age 16 - and that correction now has to carry more
  weight than before, because this is the population number it is an exception to.
quantitative:
  - parameter: adult height, isotretinoin initiated BEFORE AGE 13, men, vs no-acne reference
    value: '-1.70'
    unit: cm, adjusted (95% CI -3.15 to -0.25), n=84, mean height 178.6 (SD 6.17)
    species: human
    source_ref: schmidt2026
    note: Unadjusted -1.64 (-3.09 to -0.19). Adjusted for birth cohort year and education level.
  - parameter: adult height, isotretinoin initiated AT AGE 13, men
    value: '-1.81'
    unit: cm, adjusted (95% CI -2.43 to -1.19), n=464, mean height 178.5 (SD 6.44)
    species: human
    source_ref: schmidt2026
    note: >-
      The largest and best-determined negative in the table. Unadjusted -1.78 (-2.40 to -1.16). Against a
      no-acne reference of 180.2 cm in 315,370 men.
  - parameter: adult height, isotretinoin initiated AT AGE 14, men
    value: '-0.95'
    unit: cm, adjusted (95% CI -1.29 to -0.60), n=1,484, mean height 179.3 (SD 6.40)
    species: human
    source_ref: schmidt2026
    note: Monotone between the age-13 and age-15-or-later rows, and the CI narrows as n rises.
  - parameter: adult height, isotretinoin initiated AT AGE 15 OR LATER, men
    value: '+0.51'
    unit: cm, adjusted (95% CI 0.40 to 0.63), n=14,707, mean height 180.8 (SD 6.57)
    species: human
    source_ref: schmidt2026
    note: >-
      SIGN FLIP. Total swing from the age-13 row is 2.32 cm. This group is 88 per cent of all isotretinoin
      users and is what drives the pooled estimate of +0.31 cm the abstract reports.
  - parameter: adult height, ORAL TETRACYCLINE-class antibiotics, men
    value: '+0.43'
    unit: cm, adjusted (95% CI 0.33 to 0.54), n=17,527, mean height 180.7 (SD 6.63)
    species: human
    source_ref: schmidt2026
    note: >-
      The tallest exposure group in the study. Women +0.33 (-0.17 to 0.83), n=587. Stunting in men 1.67 per
      cent versus 2.14 in the reference, adjusted prevalence ratio 0.79 (0.70 to 0.89). Exposure defined as
      at least 90 tablets dispensed within any six-month period before conscription, isotretinoin-naive.
  - parameter: adult height, TOPICAL acne treatment, men - the internal health-seeking control
    value: '+0.01'
    unit: cm, adjusted (95% CI -0.09 to 0.11), n=18,702
    species: human
    source_ref: schmidt2026
    note: >-
      FLAT. Topical users are acne patients with the same health-seeking behaviour as the systemic arms, so
      a pure healthy-user effect should appear here and does not. It does not fully exonerate the systemic
      positives, because topical treatment also marks MILDER disease and acne severity tracks androgen
      exposure - but it decomposes the confound rather than leaving it undifferentiated.
  - parameter: the authors' predefined minimal clinically important difference
    value: '5'
    unit: cm or greater
    species: human
    source_ref: schmidt2026
    note: >-
      Against which -1.81 cm with a confidence interval of -2.43 to -1.19 is reported as no meaningful
      variation by age at initiation. This atlas's entire pharmacological stack is worth 1 to 3 cm.
