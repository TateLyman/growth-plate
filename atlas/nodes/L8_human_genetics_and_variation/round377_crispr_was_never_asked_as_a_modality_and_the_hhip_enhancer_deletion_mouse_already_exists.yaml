human_evidence: absent
human_evidence_note: 'No gene-editing or oligonucleotide intervention has ever been directed at a human growth
  plate. The human evidence here is of two other kinds: the target genetics (HHIP pLoF +9.92 cm) and the
  regulatory precedent that a bespoke oligonucleotide can be designed, manufactured and dosed in one person
  within a year (kim2019milasen) - which is a fact about process, not about this indication, and the
  eligibility criteria for every such pathway exclude a healthy subject with a height goal.'
