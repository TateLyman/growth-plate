contradicts:
- claim: R294 and every round since have written that HHIP has no agent in any species and that the target is
    the best-validated in the atlas but unavailable.
  resolution: 'Still true of a MOLECULE, and now false as a statement about what has been done to the gene in
    cartilage. darbellay2024 deleted an Hhip chondrocyte enhancer in vivo and lowered Hhip in limb. The gap
    is no longer "nobody can touch this gene" but "nobody measured a bone after touching it", which is a
    different and much cheaper problem.'
- claim: R376 concluded that an ASO is the right modality for HHIP because it is reversible and its delivery
    is demonstrated.
  resolution: 'That ranking stands for the FIRST move, but R377 records the argument against it that is
    specific to this target: HHIP is the one hedgehog node where permanence is not a liability, because it
    sits above Ptch1 and leaves the feedback intact. Reversibility is worth most when the dose-response has
    an unmeasured interior optimum, which is exactly the situation - so the ASO goes first BECAUSE the
    optimum is unknown, not because editing is wrong in principle.'
