translation_risk: high
translation_risk_reason: 'The enhancer results are germline zygote edits in mice with either no skeletal
  endpoint (Hhip) or the wrong gene for this stack (Fgfr3); somatic editing of a growth plate has never been
  done in any species; and the oligonucleotide route, though technically routine and precedented, has no
  regulatory pathway open to a non-disease indication.'
