id: round377_crispr_was_never_asked_as_a_modality_and_the_hhip_enhancer_deletion_mouse_already_exists
name: Round 377 - CRISPR HAS 56 FILES IN THIS ATLAS AND EVERY ONE USES IT AS A SCREEN OR A MOUSE MODEL. Asked
  for the first time as a MODALITY it returns three things - enhancer deletion is a proven cartilage dosage
  dial with a clean wild-type arm, an HHIP chondrocyte enhancer has ALREADY been deleted in vivo and nobody
  measured a bone, and the oligonucleotide route has a one-year regulatory template whose blocker is
  eligibility rather than chemistry
aliases:
- can we CRISPR HHIP
- is the HHIP ASO synthesizable
- gene editing for height
- enhancer deletion dosage tuning
- milasen n-of-1 antisense
- HHIP CE2 CE3 enhancer
type: hypothesis
layer: L8
stub: false
summary: 'The operator asked whether the HHIP oligonucleotide is actually synthesizable and whether CRISPR had
  ever been explored. The second question was worth asking: grepping the atlas returns 56 files mentioning
  CRISPR, 30 mentioning Cas9 and 8 mentioning gene editing, and EVERY ONE OF THEM USES IT AS A GENOME-WIDE
  SCREEN (R311''s GSE225878), A KNOCK-IN DISEASE MODEL, OR A CONDITIONAL ALLELE. Not one asks whether editing
  is a route for this case. Prime editing returns zero files, milasen zero, n-Lorem zero.

  ⭐⭐⭐ ONE - THE FINDING OF THE ROUND, AND IT IS ANOTHER LOSSY-LEDGER FAILURE ON THE ATLAS''S OWN BEST TARGET.
  darbellay2024 has been in this bibliography since 2026-08-05 with a one-line finding recording its enhancer
  COUNT and its height-variant statistic, cited by ZERO nodes - and the arm it omitted is that THE PAPER
  DELETED AN Hhip CHONDROCYTE ENHANCER IN VIVO. Full text: two LIMB-ENRICHED chondrogenic enhancers at the
  Hhip locus, CE2 and CE3; a homozygous 3.5 kb CRISPR-Cas9 deletion removing both reduced Hhip transcripts by
  15 PER CENT IN LIMB WITH NO SIGNIFICANT REDUCTION IN TRUNK. ⛔ AND NO SKELETAL PHENOTYPE WAS MEASURED - the
  readout was RNA-seq of E14.5 fetuses, no bone length, no growth plate. → THE MOUSE THAT LOWERS Hhip IN
  CARTILAGE ALREADY EXISTS AND NOBODY PUT A CALIPER ON IT. That is CORR-340 at the genetic level and it is
  now the cheapest validating experiment available on this target.
  ⚠ Three honest caveats, all of which matter: 15 per cent is modest against a human heterozygous pLoF, which
  removes roughly half of one allele''s product; CE2-3 are LIMB-restricted, which is the wrong compartment
  for a trunk-dominant residual; and E14.5 is embryonic, so it says nothing about an open plate.

  ⭐⭐ TWO - AND THE METHOD HAS A CLEAN WILD-TYPE PROOF IN THE SKELETON. angelozzi2025 (JCI): an enhancer 29 kb
  upstream of mouse Fgfr3 confers a cartilage expression domain matching Fgfr3''s own, and its CRISPR
  deletion IN OTHERWISE WILD-TYPE MICE REDUCED Fgfr3 EXPRESSION IN THAT DOMAIN BY HALF WITHOUT ADVERSE
  PHENOTYPES. In achondroplasia mice the same deletion largely normalised LONG BONE AND VERTEBRAL BODY
  growth, reduced spinal canal and foramen magnum stenosis, improved craniofacial defects and removed
  lethality; -29E is highly conserved in humans. ⭐ WHAT TRANSFERS IS THE METHOD, NOT THE GENE: an enhancer
  deletion halves a gene IN CARTILAGE ONLY, which is the shape of a heterozygous pLoF and exactly what
  R281''s interior-optimum-below-wild-type requires - and unlike every systemic agent in this file it reached
  VERTEBRAL BODY growth. ⛔ FGFR3 itself is erdafitinib''s arm, so as an intervention this is a Step 0
  substitution, not an addition.

  ⭐ THREE - THE COMPARTMENT PARTITION EXISTS AT THE REGULATORY-ELEMENT LEVEL, WHICH IS R318 ONE LAYER DOWN.
  Of 2,704 chondrocyte enhancers: 2,003 (74 per cent) pan-chondrogenic, 483 (18 per cent) LIMB-restricted,
  218 (8 per cent) TRUNK-restricted - and variants overlapping chondrogenic enhancers explain height better
  than variants overlapping non-chondrogenic ones. → A trunk-directed intervention is in principle
  ADDRESSABLE BY CHOOSING THE ELEMENT, which no drug in this file can do.

  ⛔ FOUR - BUT NO SOMATIC EDITING OF A GROWTH PLATE HAS EVER BEEN REPORTED IN ANY SPECIES. Every skeletal
  CRISPR result here is GERMLINE - zygote editing to make a mouse line. The therapeutic version needs
  delivery, and the payload is the problem: SpCas9 is about 160 kDa against farnum2006''s growth-plate
  partition curve where 40 kDa is already undetectable, and SpCas9 plus a guide sits at the top of AAV''s
  roughly 4.7 kb capacity. yoon2021aav screened 14 serotypes and found only AAV2, 5, 6 and 6.2 substantially
  transduce chondrocytes, concluding AAV2 and AAV6.2 are best FOR INTRA-ARTICULAR CARTILAGE - and the growth
  plate is not intra-articular (R361). ✓ The one route that bypasses partition is a vesicle: lou2026cas9exo
  delivered CRISPR-Cas9 to chondrocytes in vivo in chondrocyte-affinity-peptide-modified exosomes and cut
  target expression 61.7 per cent - the editing analogue of yuan2024''s siRNA exosome, and articular, not
  physeal.

  ⭐⭐ FIVE - IS THE OLIGONUCLEOTIDE SYNTHESIZABLE? YES, AND IT IS THE MOST MANUFACTURABLE CLASS OF DRUG THERE
  IS. A 16-20mer phosphorothioate gapmer is standard solid-phase phosphoramidite chemistry against a known
  human transcript. kim2019milasen is the template: molecular diagnosis, rational design, proof of concept in
  the patient''s own cells, tox, GMP manufacture and an N-OF-1 STUDY WITHIN ONE YEAR OF FIRST CONTACT, no
  serious adverse events. The FDA subsequently issued dedicated guidance for individualised ASO INDs
  (chemistry-manufacturing-controls and clinical), and standing infrastructure exists - n-Lorem, which
  provides bespoke ASOs free for life, plus NATA, the Rare Therapies Launch Pad and the Dutch Centre for RNA
  Therapeutics.
  ⛔ AND THE BLOCKER IS ELIGIBILITY, NOT CHEMISTRY, WHICH IS THE HONEST ANSWER. Every one of those pathways is
  written for a SEVERELY DEBILITATING OR LIFE-THREATENING disease caused by a specific pathogenic variant;
  n-Lorem requires a nano-rare condition of 1 to 30 patients worldwide. A healthy subject with a height goal
  and no pathogenic variant meets none of them. The molecule is buildable; the indication is the wall.

  ⭐ SIX - AND FOR THIS PARTICULAR TARGET, PERMANENCE IS ACCEPTABLE, WHICH IS UNUSUAL AND IS AN ARGUMENT FOR
  EDITING OVER AN OLIGONUCLEOTIDE. R375 established that HHIP removal is the ONE hedgehog intervention that
  does not need pulsing, because it sits ABOVE Ptch1 and therefore leaves the pathway''s own Gli-target
  negative feedback intact; haraguchi2025 shows sustained Hhip loss still working at 53 weeks with the zones
  ORDERED. So the usual objection to editing - that it cannot be stopped - costs less here than it would
  anywhere else in this file. ⛔ Against that: it is irreversible in a growing person for a non-disease
  indication, off-target editing is an efficacy risk as well as a safety one given how many load-bearing
  genes sit in this tissue (ACAN -16.55 cm), and HHIP is two-sided as a tumour suppressor and the top
  COPD/lung-function locus.

  🧭 SEVEN - THE RANKING BETWEEN THE TWO MODALITIES, HONESTLY.
  1. ASO (phosphorothioate gapmer) - the delivery is DEMONSTRATED in growth-plate cartilage (posey2017), the
     chemistry is routine, the regulatory template exists and it is REVERSIBLE, which matters most where the
     dose-response has an interior optimum nobody has measured. This is the better first move.
  2. siRNA in a WYRGRL chondrocyte exosome (yuan2024) - same target, demonstrated systemic route to the
     growth plate, but a more complex product than a naked gapmer.
  3. Somatic enhancer editing - the most elegant, because it is the only route that can pick a TRUNK-restricted
     element, and permanence is tolerable for this target. But it has no growth-plate delivery precedent in
     any species and is irreversible.
  ⭐ AND THE STEP THAT PRECEDES ALL THREE COSTS ALMOST NOTHING: MEASURE THE BONES OF THE Hhip_deltaCE2-3 MOUSE
  THAT ALREADY EXISTS.'
