human_evidence: direct
human_evidence_note: >-
  The effect sizes are human common-variant associations in centimetres from a conditionally
  independent set. The causal gene assignment is nearest-gene, and for SERPINA1 the variant is a
  known functional coding allele inside the gene.
species_basis:
  - human
translation_risk: high
translation_risk_reason: >-
  No SERPINA1 perturbation has a bone-length endpoint in any species, the PiZ mechanism confounds
  loss-of-function with ER stress, the local-versus-systemic question is open, and the only
  lowering agent is hepatocyte-targeted by design.
confidence: C
claim_grades:
  - claim: >-
      140 blind-spot genes acquire a signed height effect by joining to the conditionally
      independent GWAS set
    grade: A
    basis: direct join of two tables already on disk; the arithmetic is not in question
  - claim: The SERPINA1 deficiency allele raises adult height by about 1.19 cm per copy
    grade: A
    basis: >-
      -log10 P of 130.2 in a conditionally independent analysis, coding variant at zero distance,
      identity confirmed against ClinVar and gnomAD
  - claim: Therefore lowering alpha-1-antitrypsin would raise height
    grade: D
    basis: >-
      the inference requires that PiZ acts by loss of extracellular function rather than by
      intracellular ER stress, and the discriminating allele PiS is not in this table. Unresolved
  - claim: The effect is local to cartilage
    grade: E
    basis: >-
      not established. 1,606 CPM at 3.8x says chondrocytes transcribe it; the protein is a
      high-abundance liver-derived plasma protein and a systemic route is at least as likely
  - claim: Alpha-1-antitrypsin augmentation therapy is predicted to shorten
    grade: C
    basis: >-
      the direct inverse of the allelic result, with no measurement in any species. Free to record
      as a contraindication
  - claim: >-
      Enrichment screens are structurally biased toward load-bearing genes and therefore toward
      the undruggable direction
    grade: B
    basis: >-
      three consecutive modules from this screen (vitamin K, zinc, PANX3) all closed on being
      required rather than restraining, and every brake this file works sits at low-to-middling
      abundance. CORR-349 sharpened
