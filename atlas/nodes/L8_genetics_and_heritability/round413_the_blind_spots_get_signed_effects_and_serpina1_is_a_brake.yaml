id: round413_the_blind_spots_get_signed_effects_and_serpina1_is_a_brake
name: "R413: the missing step - join the blind-spot list to the 3,034 conditionally independent height GWAS variants and 140 of them acquire a SIGNED effect in centimetres. The headline is SERPINA1: the alpha-1-antitrypsin DEFICIENCY allele adds +1.19 cm per copy at -log10P 130, the gene is 1,606 CPM and cartilage-enriched with zero atlas coverage, and a clinical-stage agent that lowers it already exists"
aliases:
  - SERPINA1 height PiZ
  - alpha-1-antitrypsin growth plate
  - blind spot signed effects
  - fazirsiran height
type: hypothesis
layer: L8
stub: false
summary: >-
  R411 and R412 produced 1,492 blind-spot genes and three zonal programmes, and every module
  worked out of them closed the same way - vitamin K, zinc, PANX3 - because they were all
  LOAD-BEARING. That is not bad luck, it is structural: a screen that ranks by "the tissue
  invests heavily in this" preferentially finds what is REQUIRED, required things must be
  RAISED, and raising is the direction the pharmacopoeia does not serve. CORR-349 said abundance
  finds the matrix; this sharpens it - ENRICHMENT FINDS WHAT IS REQUIRED, and the brakes this
  file actually works (HHIP 62 CPM, STC2 211, CHAD 455, ECRG4 695, CLEC3A 1,069) all sit at
  low-to-middling abundance.
  ⭐ SO THE SCREEN NEEDED A SIGNED EFFECT, AND THE SOURCE WAS ON DISK AND UNOPENED. kosmicki2026
  Supplementary Table 6 covers only the 207 significant genes, which is why the blind spots had
  no direction. Supplementary Table 2 is different: 3,034 CONDITIONALLY INDEPENDENT height GWAS
  variants, genome-wide, with effect sizes IN CENTIMETRES and a nearest-gene annotation. Joining
  the two gives 140 blind-spot genes a signed human effect.

  ⭐⭐ THE HEADLINE. SERPINA1, alpha-1-antitrypsin. Variant 14:94378610:C:T, allele frequency
  1.47 percent, JOINT EFFECT +1.19 cm PER ALLELE at -log10 P = 130.2, distance to gene ZERO.
  That variant is rs28929474 - the PiZ / E342K allele, the classic cause of alpha-1-antitrypsin
  deficiency (position and frequency both confirmed against ClinVar and gnomAD, where European
  non-Finnish frequency is 1.8 percent).
  → THE DEFICIENCY ALLELE MAKES PEOPLE TALLER. LESS ALPHA-1-ANTITRYPSIN IS MORE HEIGHT.
  SERPINA1 IS A BRAKE, AND THE THERAPEUTIC DIRECTION IS TO LOWER IT.
  ✓ And it is in the tissue: 1,606 CPM in pure cartilage at 3.8x sex-corrected enrichment,
  detected in 12 of 12 samples, with ZERO mentions anywhere in this atlas before R411.
  ✓ Step 0 is clean - serine protease inhibition is moved by nothing in this stack.
  ⭐ It also completes a module the atlas had half-built: this file has worked the PROTEASES of
  the growth plate (CLEC3A enhancing plasminogen activation at 950 CPM in R345; thrombin
  cleaving ECRG4 in R348) and never the INHIBITORS - yet SERPINE2 is 2,197 CPM at 3.89x
  (R348 noted it), SERPINA1 is 1,606 at 3.8x and SERPINA3 is 499 at 5.7x. Three abundant,
  cartilage-enriched serpins, one of which now has a signed human effect.

  ⭐ AND UNUSUALLY FOR THIS FILE, A LOWERING AGENT IS IN LATE CLINICAL DEVELOPMENT. The
  alpha-1-antitrypsin liver disease field builds SERPINA1-SILENCING siRNA precisely because the
  Z protein polymerises in hepatocytes - the direction of interest here is their therapeutic
  direction. Patents for Serpina1 siRNA compositions are granted and a GalNAc-conjugated siRNA
  against SERPINA1 has reached late-phase trials for AAT-deficiency liver disease.

  ⛔ AND NOW THE OBJECTIONS, WHICH ARE SERIOUS AND ARE STATED BEFORE THE CANDIDATE IS PROMOTED.
  · THE MECHANISM OF PiZ IS NOT SIMPLY LESS PROTEIN. The Z variant polymerises and is RETAINED
    IN THE ENDOPLASMIC RETICULUM, so the allele is simultaneously an extracellular
    loss-of-function and an intracellular gain-of-toxic-function. If the height effect runs
    through ER stress rather than through loss of protease inhibition, then "inhibit AAT" is the
    wrong reading. This is the identical trap that disqualified the heterozygous MGP dysplasia in
    R411 and that MMP13's frameshift short-stature variant also runs through.
    ⛔ THE DISCRIMINATING TEST IS THE PiS ALLELE (rs17580), which is deficient but far less
    polymerising. If PiS also raises height it is the loss of function; if only PiZ does it is
    ER stress. Table S2 contains only ONE SERPINA1 variant, so this round CANNOT RESOLVE IT, and
    that single question decides whether the candidate is real.
  · LOCAL OR SYSTEMIC IS UNRESOLVED. Alpha-1-antitrypsin is a liver-made plasma protein present
    at enormous concentration. The 1,606 CPM and 3.8x enrichment say chondrocytes transcribe it,
    but the height effect could be entirely systemic. This is the PDE3B question (R310) on a new
    gene, and it matters because the available agent is GalNAc-conjugated and therefore
    HEPATOCYTE-TARGETED BY DESIGN - ASGR1 is 3.2 CPM in the growth plate (R376), so a GalNAc
    siRNA cannot reach cartilage. If the effect is systemic that is exactly right; if local, the
    agent misses the compartment.
  · NO SERPINA1 PERTURBATION HAS A BONE-LENGTH ENDPOINT IN ANY SPECIES, and SERPINA1 is not
    among the 207 (a burden test and a single common coding variant are different instruments).
  · AND LOWERING IT IS THE DISEASE DIRECTION. Reducing alpha-1-antitrypsin is what causes
    emphysema; the therapy that exists for most patients is AUGMENTATION, which by this result
    is the SHORTENING direction. Risk is deprioritised for this case, but the mechanism means
    the proposal is to induce a deficiency state, not to correct one.
  ⛔ ⭐ ONE IMMEDIATE AND UNAMBIGUOUS OUTPUT REGARDLESS: ALPHA-1-ANTITRYPSIN AUGMENTATION THERAPY
  IS PREDICTED TO SHORTEN. Narrow, but it is a new contraindication and it is free.

  ⭐ THE SECOND FINDING, SMALLER BUT CLEANER. ID4: +0.978 cm per allele at -log10 P = 261.9 -
  the most significant blind-spot association in the whole join - variant inside the gene, 84 CPM
  at 2.1x. And R412 independently returned ID1 among the blind spots at 444 CPM and 11.3x with
  IMPC Id1-homozygote TIBIA LENGTH -1.264 at P=9.85e-09... (that row is Mmp13; Id1's own row is
  tibia -1.264 at P=0.00112). Two ID-family HLH factors, both blind spots, both height-relevant,
  and ID1 is the canonical BMP readout - so BMP OUTPUT is a blind spot with two independent
  entries. ⚠ ID4's direction is opposite to ID1's mouse row, so the family is not monotone and
  no direction is claimed.
  ⭐ THIRD: IMPAD1 +0.223 cm. IMPAD1 is the Golgi PAP phosphatase that relieves product
  inhibition of the sulfotransferases, and its loss causes a human chondrodysplasia with short
  stature - so R410's sulfation arm acquires a genome-wide signed common-variant effect from an
  independent instrument. ⚠ Weak: the nearest-gene distance is 205 kb.

  ⛔ THE GOVERNING LIMITATION OF THE WHOLE JOIN: NEAREST GENE IS NOT CAUSAL GENE. What makes it
  more than usually credible here is the conjunction - a gene that is cartilage-enriched, abundant
  and carries a coding variant at zero distance is a far better bet than a regulatory lead 200 kb
  out, which is why SERPINA1 and ID4 rank and IMPAD1 does not.
  ⭐ WHAT THE ROUND DELIVERS: the step that converts the inverse search from a module-finder into
  a candidate-finder. The blind-spot inventory now carries direction, and the first thing it
  returns pointing the RIGHT WAY - a brake, in the tissue, with a clinical-stage lowering agent -
  is a gene this atlas had never mentioned.
