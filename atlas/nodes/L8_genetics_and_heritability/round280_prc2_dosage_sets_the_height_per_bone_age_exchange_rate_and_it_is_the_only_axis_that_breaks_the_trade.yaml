human_evidence: direct
human_evidence_note: >-
  Three named human overgrowth syndromes from three subunits of one complex, with aggregated height and
  bone age data in EZH2-related overgrowth across ages 1 to 70.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The human evidence is germline haploinsufficiency from conception; the proposed intervention is
  time-limited partial pharmacological inhibition at bone age 16. Those are different exposures over
  different windows.
confidence: B
confidence_reason: >-
  Internally replicated human genetics across three PRC2 subunits plus an independent livestock-genomics
  line with mouse validation. Graded B rather than A because the height figures come from an aggregated
  clinical synthesis with ascertainment bias, the syndrome table is a review, and no interventional data
  exists in any species.
claim_grades:
- claim: >-
    Every lever on height trades velocity against bone age at parity or worse.
  grade: X
  basis: >-
    PRC2 LOSS APPEARS NOT TO. In EZH2-related overgrowth, bone age was advanced in 33 of 33 individuals
    evaluated and height was still at least 2 SD above the mean in 59 of 65 across ages 1 to 70, mean +3.5
    SD. That is supranormal ADULT stature despite universally accelerated maturation - more height per unit
    of bone age, which is a property nothing else in this atlas has.
- claim: >-
    Loss of PRC2 function increases human height.
  grade: B
  basis: >-
    Three core subunits, three separate named overgrowth syndromes - EZH2/Weaver, EED/Cohen-Gibson,
    SUZ12/Imagawa-Matsumoto - plus a fourth line from PRC2-associated PALI2/LCORL, convergently selected for
    body size in seven domesticated species and validated in mice at +3.0 per cent body length with reduced
    H3K27me3. Held at B because the height figures come from clinical syntheses subject to ascertainment
    bias.
- claim: >-
    An approved EZH2 inhibitor reproduces the molecular lesion of Weaver syndrome.
  grade: C
  basis: >-
    The Weaver EZH2 variants are characterised as causing PARTIAL loss of H3K27 methyltransferase activity
    rather than a null, and a small-molecule EZH2 inhibitor produces a partial, dose-titratable reduction of
    the same activity. Tazemetostat is marketed and given to children in oncology. Graded C because
    equivalence of a germline partial-LOF allele and a reversible active-site inhibitor is argued from the
    enzymology, not demonstrated, and the timing of exposure differs completely.
- claim: >-
    An EZH2 inhibitor is a candidate addition to this stack at bone age 16.
  grade: X
  basis: >-
    NO, AND THE REASON IS THE MECHANISM RATHER THAN THE SAFETY. The Weaver phenotype accrues across an
    entire childhood from conception, and the axis's own signature is ACCELERATED BONE AGE in 33 of 33. At
    bone age 16 the remaining window is the binding constraint, so an agent that universally advances
    maturation plausibly consumes more window than it buys height. The safety is the second argument, not
    the first - tumours in 7 of 70, EZH2 is an oncogene, tazemetostat carries a secondary T-cell lymphoma
    warning, and no EZH2 inhibitor has ever been given for growth in any species.
- claim: >-
    The bone-age cost of PRC2 inhibition in a normal growing animal is known.
  grade: E
  basis: >-
    IT IS NOT, AND THIS IS THE NAMED EXPERIMENT. Nobody has given a titrated EZH2 inhibitor to a wild-type
    growing animal and measured BONE LENGTH AND BONE AGE TOGETHER. Round 254's bone-age-cost axis exists to
    price exactly that trade and has never been applied to this class. If PRC2 inhibition lengthens bone
    faster than it advances maturation, it is the first agent here that beats the trade rather than working
    around it; if not, the human phenotype is explained by lifelong exposure and the class closes.
