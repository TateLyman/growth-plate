id: round280_prc2_dosage_sets_the_height_per_bone_age_exchange_rate_and_it_is_the_only_axis_that_breaks_the_trade
name: >-
  ROUND 280 - the strongest human height axis in this file, and the only one that BREAKS THE BONE-AGE
  TRADE. Loss of PRC2 gives supranormal ADULT height DESPITE 100 per cent advanced bone age - mean +3.5 SD,
  replicated across THREE subunits as three separate overgrowth syndromes - and the Weaver mutations are
  PARTIAL loss of function, which is exactly what a drug does. The drug exists. It is also the wrong drug
  for this subject, and the reason is the same bone age
aliases:
- round 280
- PRC2 is the exchange rate
- EZH2 Weaver syndrome
- the overgrowth syndrome compound class
- tall stature despite advanced bone age
type: hypothesis
layer: L8
stub: false
summary: >-
  EVERY LEVER IN THIS ATLAS IS BOUNDED BY ONE TRADE: buy velocity, pay bone age, net approximately zero on
  attained height. Growth hormone does it. Aromatase inhibition works by delaying the other side of it. The
  entire ROI framework of round 254 is built on it. THIS ROUND FOUND THE ONE AXIS THAT DOES NOT OBEY IT,
  and it is human genetics rather than mouse.

  ONE - THE SYNDROME TABLE, WHICH SORTS CHROMATIN MODIFIERS BY DIRECTION AND IS INTERNALLY REPLICATED.
  lui2024 tabulates childhood growth disorders by epigenetic regulator. Loss of the PRC2 H3K27
  machinery gives OVERGROWTH at all three core subunits - EZH2 gives Weaver syndrome, EED gives
  Cohen-Gibson syndrome, SUZ12 gives Imagawa-Matsumoto syndrome. Loss of the H3K36 methyltransferases gives
  overgrowth twice more - NSD1 gives Sotos, SETD2 gives Luscan-Lumish. AND THE H3K4 WRITERS GO THE OTHER
  WAY: KMT2D gives Kabuki syndrome and KMT2A gives Wiedemann-Steiner, both SHORT STATURE. DNMT3A loss gives
  Tatton-Brown-Rahman overgrowth, which is worth noting against round 276, where DNMT1 loss SHORTENED bone -
  maintenance and de novo methyltransferases have opposite skeletal phenotypes and must not be conflated.
  THREE SUBUNITS OF ONE COMPLEX, THREE SEPARATE NAMED SYNDROMES, ONE DIRECTION. That is as close to internal
  replication as human genetics gets.

  TWO - AND A FOURTH LINE ARRIVES FROM ANIMAL BREEDING. bai2025 reconstructed ancestral recombination graphs
  in beef cattle and found selection sweeps at LCORL and STC2. The LCORL variant is an ACT-to-A FRAMESHIFT,
  and CONVERGENT TRUNCATING MUTATIONS AT THE SAME GENE WERE FOUND IN SHEEP, GOATS, PIGS, HORSES, DOGS,
  RABBITS AND CHICKENS - seven domesticated species independently selected for the same broken gene because
  it makes animals bigger. Validated in gene-edited mice: homozygotes 11 per cent heavier, and BODY LENGTH
  increased 3.0 per cent in males and 2.6 per cent in females, dose-dependently with heterozygotes
  intermediate. LCORL ENCODES PALI2, A COMPONENT OF THE PRC2 COMPLEX, and the paper reports H3K27me3
  REDUCED in the knockouts. So the fourth line is the same complex, reached from livestock genomics.

  THREE - AND HERE IS THE PROPERTY NOTHING ELSE IN THIS FILE HAS. In EZH2-related overgrowth, height was at
  least two standard deviations above the mean in 59 OF 65 INDIVIDUALS AGED ONE TO SEVENTY YEARS, with mean
  postnatal height 3.5 SD ABOVE THE MEAN. And bone age was ADVANCED IN 33 OF 33 EVALUATED - one hundred per
  cent. THE TALL STATURE PERSISTS TO ADULTHOOD DESPITE UNIVERSALLY ACCELERATED SKELETAL MATURATION.
  EVERY OTHER AGENT IN THIS ATLAS BUYS RATE AND PAYS BONE AGE AT PARITY OR WORSE. PRC2 LOSS APPEARS TO
  CHANGE THE EXCHANGE RATE ITSELF - more height per unit of maturation, not more maturation for the same
  height. If that is what it does, it is a different KIND of lever from everything catalogued here, and
  lui2024 names the pathway EZH2 acts through as IGF SIGNALLING.

  FOUR - AND THE MOLECULAR LESION IS THE ONE A DRUG MAKES. The Weaver EZH2 mutations are reported as causing
  a PARTIAL loss of H3K27 histone methyltransferase activity - not a null. A small-molecule EZH2 inhibitor
  produces exactly that state: partial, dose-titratable reduction of the same enzymatic activity. AND THE
  DRUG IS APPROVED. Tazemetostat is a marketed EZH2 inhibitor, given to children in oncology indications.
  THE GENETIC MODEL AND THE PHARMACOLOGY MATCH BETTER HERE THAN ANYWHERE ELSE IN THIS FILE.

  FIVE - AND IT IS STILL THE WRONG DRUG FOR THIS SUBJECT, FOR A REASON THAT IS NOT SAFETY. THE WEAVER
  PHENOTYPE IS BUILT OVER AN ENTIRE CHILDHOOD FROM CONCEPTION. The +3.5 SD accrues across the whole growth
  period in someone whose bone age has been running ahead the entire time and who still ends up tall. A
  subject at BONE AGE 16 HAS ALMOST NO RUNWAY OVER WHICH TO ACCRUE IT, and the axis's own signature is
  ACCELERATED MATURATION - 33 of 33. Starting an agent whose phenotype includes universal bone-age
  advancement, at the maturity where the remaining window is the binding constraint, plausibly consumes
  more window than it buys height. THE PROPERTY THAT MAKES THE AXIS INTERESTING IS THE SAME PROPERTY THAT
  MAKES THE TIMING WRONG.
  AND THE SAFETY IS NOT NOTHING EITHER, THOUGH IT IS THE SECOND ARGUMENT AND NOT THE FIRST. Tumours occurred
  in 7 of 70 individuals with EZH2-related overgrowth - five neuroblastomas between the neonatal period and
  age four, plus one each of acute lymphoblastic leukaemia, acute myeloid leukaemia and pre-T-cell
  non-Hodgkin lymphoma - and US guidelines recommend imaging and urine biochemistry surveillance to age ten.
  Intellectual disability affected 52 of 61, mild in 49 per cent. Those are germline, developmental
  consequences of lifelong haploinsufficiency and do NOT transfer directly to time-limited pharmacology in
  an adolescent, but EZH2 is an oncogene, tazemetostat carries its own secondary T-cell lymphoma warning,
  and NOBODY HAS EVER GIVEN AN EZH2 INHIBITOR FOR GROWTH IN ANY SPECIES.

  SIX - SO WHAT THIS ROUND ACTUALLY DELIVERS IS A TARGET PROPERTY AND A NAMED EXPERIMENT, NOT A PRESCRIPTION.
  The property is HEIGHT PER UNIT BONE AGE, and PRC2 is the first thing in this file measured to raise it.
  The named experiment is the one nobody has run: give a titrated EZH2 inhibitor to a NORMAL growing animal
  and measure BONE LENGTH AND BONE AGE TOGETHER. Round 254's bone-age-cost axis exists precisely to price
  that trade, and it has never been applied to this class. If PRC2 inhibition raises length faster than it
  advances maturation in a wild-type animal, that is the first agent in this atlas that beats the trade
  rather than working around it. If it does not, the human genetics is explained by lifelong exposure and
  the class closes.
quantitative:
- parameter: >-
    EZH2-RELATED OVERGROWTH - SUPRANORMAL ADULT HEIGHT WITH UNIVERSAL BONE AGE ADVANCEMENT
  value: >-
    height at least 2 SD above the mean in 59 of 65 individuals aged 1 to 70 years; mean postnatal height
    3.5 SD above the mean; bone age ADVANCED IN 33 OF 33 evaluated; intellectual disability in 52 of 61
    (mild 49 per cent, moderate 21, severe 5); tumours in 7 of 70 - neuroblastoma 5 (neonatal to age 4),
    plus one each of ALL, AML and pre-T-cell non-Hodgkin lymphoma
  unit: height SD score, counts of individuals
  conditions: >-
    generereviews_ezh2_overgrowth, the aggregated EZH2-related overgrowth cohort. Weaver syndrome is caused
    by heterozygous germline EZH2 variants; the JCEM characterisation reports them as causing PARTIAL loss
    of H3K27 methyltransferase activity rather than a null.
  species: human
  source_ref: generereviews_ezh2_overgrowth
  uncertainty: >-
    A CLINICAL SYNTHESIS RATHER THAN A COHORT STUDY, aggregating published cases with the ascertainment bias
    that implies - individuals are identified BECAUSE they are tall and dysmorphic, so the height figure is
    inflated relative to the true mutation effect. The 1-to-70-year age span establishes that tall stature
    persists into adulthood but is not a longitudinal final-height series. Bone age was evaluated in only
    33. AND THE EXPOSURE IS GERMLINE AND LIFELONG FROM CONCEPTION, which is the single most important
    difference from any pharmacological use.
- parameter: >-
    THREE PRC2 SUBUNITS, THREE OVERGROWTH SYNDROMES - AND THE H3K4 WRITERS GO THE OTHER WAY
  value: >-
    OVERGROWTH from loss of EZH2 (Weaver), EED (Cohen-Gibson), SUZ12 (Imagawa-Matsumoto) - all PRC2/H3K27;
    NSD1 (Sotos) and SETD2 (Luscan-Lumish) - both H3K36; DNMT3A (Tatton-Brown-Rahman) and SPIN4
    (Lui-Jee-Baron). SHORT STATURE from loss of KMT2D (Kabuki 1) and KMT2A (Wiedemann-Steiner) - both H3K4
    writers - and KDM3B, KDM6A, HDAC8, MECP2
  unit: gene-to-direction mapping
  conditions: lui2024, review tabulating childhood growth disorders by epigenetic regulator and mark.
  species: human
  source_ref: lui2024
  uncertainty: >-
    A REVIEW TABLE, WHICH THIS ATLAS TREATS AS AN INDEX AND NOT A SOURCE - each syndrome's height data must
    be read in its own primary before being graded, and only EZH2 has been so read here. The direction
    mapping is nonetheless internally consistent across three PRC2 subunits and two H3K36 writers, which is
    what raises it above a list. NOTE AGAINST ROUND 276: DNMT3A loss gives OVERGROWTH while round 276
    established DNMT1 loss SHORTENS bone - de novo and maintenance methyltransferases have opposite
    skeletal phenotypes and the two must not be conflated.
- parameter: >-
    THE FOURTH LINE - A PRC2 COMPONENT CONVERGENTLY SELECTED FOR BODY SIZE ACROSS SEVEN DOMESTICATED SPECIES
  value: >-
    an ACT-to-A frameshift in LCORL under selection in central-European beef cattle, with CONVERGENT
    TRUNCATING MUTATIONS in sheep, goats, pigs, horses, dogs, rabbits and chickens; validated in gene-edited
    mice where homozygotes were 11 per cent heavier and BODY LENGTH rose 3.0 per cent (2.9 mm) in males and
    2.6 per cent (2.3 mm) in females at 7 weeks, dose-dependently with heterozygotes intermediate; H3K27me3
    was REDUCED in the knockouts
  unit: per cent body length and weight versus wild type
  conditions: >-
    bai2025. Ancestral recombination graph analysis of beef cattle selection sweeps, plus gene-edited mouse
    validation. LCORL encodes PALI2, a component of the PRC2 complex. Male n = 14 wild-type, 23
    heterozygous, 19 homozygous.
  species: mouse
  source_ref: bai2025
  uncertainty: >-
    THE PRIMARY ENDPOINT IS BODY WEIGHT AND THE LENGTH EFFECT IS SMALLER THAN THE WEIGHT EFFECT - 3.0 per
    cent against 11 per cent - so much of what selection captured in livestock is mass rather than stature,
    which is what breeders were selecting for. Body length at 7 weeks in a mouse is a growth-rate readout
    in a non-fusing species, not attained height. NO BONE AGE was measured, so this line says nothing about
    the exchange rate that makes the EZH2 human data interesting.
localization:
