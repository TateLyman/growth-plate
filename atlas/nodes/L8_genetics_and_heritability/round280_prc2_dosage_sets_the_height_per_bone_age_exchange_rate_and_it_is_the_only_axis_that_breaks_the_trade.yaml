- ref_id: generereviews_ezh2_overgrowth
  year: 2018
  type: review
  one_line_finding: >-
    Height at least 2 SD above the mean in 59 of 65 individuals aged 1 to 70, mean postnatal height +3.5
    SD, with bone age ADVANCED IN 33 OF 33 - supranormal adult stature despite universally accelerated
    maturation - alongside intellectual disability in 52 of 61 and tumours in 7 of 70
- ref_id: lui2024
  pmid: '38370361'
  year: 2024
  type: review
  one_line_finding: >-
    The direction map - loss of PRC2 (EZH2, EED, SUZ12) and of the H3K36 writers (NSD1, SETD2) gives
    OVERGROWTH, while loss of the H3K4 writers (KMT2A, KMT2D) gives SHORT STATURE, and DNMT3A loss gives
    overgrowth where round 276 found DNMT1 loss shortens bone
- ref_id: bai2025
  pmid: '40094447'
  year: 2025
  type: primary
  one_line_finding: >-
    LCORL, encoding the PRC2 component PALI2, carries convergent truncating mutations selected for body size
    in cattle, sheep, goats, pigs, horses, dogs, rabbits and chickens - and gene-edited mice are 11 per cent
    heavier with body length up 3.0 per cent and H3K27me3 reduced
- ref_id: yanagihara2025
  pmid: '41188231'
  year: 2025
  type: primary
  one_line_finding: >-
    The contrast that keeps the methyltransferases separate - DNMT1, the MAINTENANCE enzyme, shortens bone
    when lost, while DNMT3A, the de novo enzyme, causes an overgrowth syndrome when lost
contradicts: >-
  Does not overturn a prior node but REOPENS THE HISTONE ARM that
  round276_the_epigenetic_ceiling_is_a_band_not_a_brake_and_both_directions_shorten_bone explicitly left
  open. That round closed the DNA METHYLATION arm of arm3's epigenetic ceiling as a band and recorded that
  the histone arm used different enzymes and had no intervention with a length endpoint. Here the histone
  arm has both: PRC2 loss gives three human overgrowth syndromes and a mouse body-length gain of 3.0 per
  cent. It also qualifies round 276 directly - DNMT3A loss causes OVERGROWTH while DNMT1 loss SHORTENS bone,
  so maintenance and de novo methyltransferases have opposite skeletal phenotypes. And it challenges the
  bone-age trade that round 254's ROI framework is built on, because EZH2-related overgrowth reaches
  supranormal ADULT height with bone age advanced in 100 per cent of those evaluated.
