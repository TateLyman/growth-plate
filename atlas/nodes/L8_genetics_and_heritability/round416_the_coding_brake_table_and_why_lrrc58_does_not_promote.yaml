id: round416_the_coding_brake_table_and_why_lrrc58_does_not_promote
name: "R416: search from RESTRAINT instead of investment - Table S3 gives 34 CODING loss-of-function variants that RAISE height, i.e. brakes with a READABLE direction, and the table validates itself by re-finding this file's own targets. The one large novel entry, LRRC58 at +5.20 cm with zero atlas coverage, is worked to a conclusion and does NOT promote - and the reason is a new failure mode: a gene is not a unit of function"
aliases:
  - coding brakes height
  - LRRC58 body size
  - gene is not a unit of function
  - CHST3 common variant
type: hypothesis
layer: L8
stub: false
summary: >-
  R415 closed the fifth consecutive module out of the inverse search and made the reason
  structural: a screen ranking by what the tissue INVESTS in finds what is REQUIRED, and required
  things need raising. The correction is to search from RESTRAINT. That needs a direction that
  can actually be read, and a common-variant beta at a nearest gene cannot supply one - the
  allele raises height, but whether it raises or lowers the gene is unknown.
  ⭐ THE INSTRUMENT THAT CAN: kosmicki2026 Supplementary Table 3, 126 Bonferroni-significant
  SINGLE-VARIANT EXOME associations, each annotated with its VARIANT EFFECT (pLoF, frameshift,
  stop gained, splice donor, deleterious missense) and an effect in CENTIMETRES. Filtering to
  loss-of-function-type variants with a POSITIVE effect gives BRAKES WITH A READABLE DIRECTION.
  There are 34.

  ⭐ THE TABLE VALIDATES ITSELF BY RE-FINDING THIS FILE'S OWN TARGETS, which is the control the
  screen needed: STC2 +3.16 cm at P=3.0e-40 (250 CPM, 11.3x enriched) · CLEC3A +1.91 at 1.4e-25
  (1,013 CPM, 18.9x - the highest enrichment in the whole table) · NPR3 +2.29 · PTCH1 +1.34 ·
  PTH1R +1.14 · ZFAT, PDE3B, PDE5A, POR, TGFB3, LCORL, SCMH1, ESR1, GLI3, FBN2, KAT2B. Every one
  of those was reached by a different route in an earlier round. A method that independently
  returns STC2 and CLEC3A at the top is doing something right.

  ⭐ AND THE GENUINELY NOVEL ENTRIES, RANKED BY THE ATLAS'S OWN GATES (in the tissue, brake
  direction, low prior coverage):
  · LRRC58 +5.20 cm, P=8.43e-12, deleterious missense p.Ser336Phe, 55 CPM, ratio 1.45, ZERO
    atlas mentions - the fourth largest brake effect in the table
  · COL16A1 +0.70 cm, P=6.5e-11, 445 CPM at 4.7x ENRICHED, 3 mentions
  · AEBP1 +0.53 cm, P=9.8e-10, SPLICE DONOR (an unambiguous loss of function), 422 CPM at 3.0x
    ENRICHED, 5 mentions - and Aebp1 loss in osteoprogenitors gives skeletal defects resembling
    Ehlers-Danlos by diminishing Wnt/beta-catenin, which is R281's band
  · RPL5 +0.71, 1,203 CPM at 6.8x, ZERO mentions (ribosomal, so housekeeping-adjacent)
  · DAP +1.18, STOP GAINED, 115 CPM, 1 mention - a negative regulator of autophagy
  · MTMR11 +1.02, 6 CPM at 3.4x, ZERO mentions

  ⛔⛔ AND LRRC58 WAS WORKED TO A CONCLUSION IN THE SAME ROUND. IT DOES NOT PROMOTE, AND THE
  REASON IS INSTRUCTIVE. It is not an obscure gene - it has two mechanisms published in 2025-26,
  and THEY POINT IN OPPOSITE DIRECTIONS:
  · THE BODY-SIZE MECHANISM IS THE 3' UTR, NOT THE PROTEIN. Two Genes and Development papers
    identify a target-directed microRNA degradation (TDMD) trigger site in the Lrrc58 3' UTR that
    destroys miR-503-5p, with Plagl1 doing the same for miR-322-5p. Mice in which those trigger
    sites are DELETED are SMALLER, with miR-322/503-dependent EMBRYONIC growth restriction.
    → So the growth-PROMOTING function is a NONCODING site, its loss makes animals SMALLER, and
    the phenotype is EMBRYONIC - CORR-299's exact objection.
  · THE PROTEIN MECHANISM IS A CYSTEINE-SENSING E3 LIGASE. LRRC58 is a CUL2/CUL5 substrate
    receptor, stabilised under cysteine starvation, that ubiquitylates CYSTEINE DIOXYGENASE 1
    (CDO1) at Lys8, with cryo-EM structures and a mapped interface.
  ⭐ A MISSENSE HITS ONLY THE PROTEIN. That is a clean explanation for why the human coding
  variant (+5.20 cm, a brake) and the mouse 3' UTR deletion (smaller, so growth-promoting) point
  opposite ways: THEY ARE DIFFERENT FUNCTIONS OF ONE TRANSCRIPT.

  ⛔ AND THE ATTRACTIVE CHAIN FAILS ITS OWN TEST. Because LRRC58 degrades CDO1, less LRRC58 means
  more CDO1, more cysteine catabolism and more sulfate - which would connect the largest novel
  brake in this table to R320/R321/R410's sulfate arm and to this file's one obtainable compound.
  Three checks were run before proposing it and it does not survive them:
  · THE CHAIN IS PRESENT BUT UNIFORMLY UNCONCENTRATED in the human growth plate - LRRC58 1.45,
    CDO1 1.42, CSAD 1.42, SUOX 1.44, all 12 of 12, none reaching the 1.96 benchmark. That is what
    a housekeeping metabolic pathway looks like, not a chondrocyte specialisation.
  · NO OTHER GENE IN THE CHAIN CARRIES A HEIGHT SIGNAL. CDO1, SUOX, CSAD, CTH, GOT1, SLC26A2 and
    PAPSS2 return nothing in either the coding table or the 3,034 independent common variants. If
    LRRC58 acted through CDO1 to sulfate, the enzymes between them should show something.
  · No LRRC58 perturbation has a bone-length endpoint in any species, and no agent exists.
  ⭐ WHAT THE LOCALISATION DOES SUPPORT IS THE ARCHITECTURE R410 ALREADY FOUND: sulfate
  PRODUCTION is systemic and unconcentrated (CDO1 1.42, PAPSS2 0.91, SLC26A2 1.35) while sulfate
  CONSUMPTION is local and enriched (SLC35B2 9.37, CHST3 1.84). Production elsewhere, consumption
  here.
  ⭐ AND CHST3 GAINS A THIRD INSTRUMENT: an independent common variant, 10:71978155:T:C at
  -0.0728 cm and -log10P 12.5, DISTANCE ZERO. Small, and a common-variant sign cannot be read as
  a gene direction - but the sulfotransferase R409 and R410 built on is now a named height locus
  as well as a recessive dysplasia gene and a zonally-graded enriched transcript.

  ⭐⭐ THE DURABLE OUTPUT IS A NEW FAILURE MODE, AND IT APPLIES BEYOND THIS GENE. A GENE IS NOT A
  UNIT OF FUNCTION. One transcript can carry a CODING function and a NONCODING function with
  OPPOSITE effects on growth, and the instrument you use silently selects which one you see: a
  missense or pLoF burden reads the protein, a regulatory or 3' UTR variant reads the RNA, and a
  knockout destroys both. LRRC58 is the demonstration - protein-braking and 3'-UTR-promoting in
  the same gene. Before reading a direction off any variant, ask WHICH FUNCTION OF THE TRANSCRIPT
  THAT VARIANT CLASS ACTUALLY TOUCHES.
