confidence: B
claim_grades:
  - claim: >-
      Filtering the exome table to loss-of-function-type variants with positive effect yields 34
      brakes with a readable direction
    grade: A
    basis: >-
      direct filter on annotated variant consequence and signed effect. The method's control is
      that it independently re-finds STC2, CLEC3A, NPR3, PTCH1 and PTH1R
  - claim: LRRC58 loss of protein function raises human height by about 5.2 cm per allele
    grade: B
    basis: >-
      p.Ser336Phe deleterious missense at P=8.43e-12. A single missense is a weaker instrument
      than a burden test and its functional consequence for the E3 is not established
  - claim: LRRC58 should be promoted as a target
    grade: E
    basis: >-
      NO. Its published body-size mechanism is a 3' UTR TDMD trigger whose loss makes mice SMALLER
      and is embryonic; its protein mechanism has no skeletal data; it is not cartilage-enriched;
      no other gene in its candidate chain carries a height signal; and no agent exists
  - claim: LRRC58 acts on height through CDO1 and sulfate
    grade: E
    basis: >-
      attractive and unsupported. The chain is uniformly unconcentrated in the plate and CDO1,
      SUOX, CSAD, CTH, SLC26A2 and PAPSS2 all return nothing in either variant table
  - claim: A gene is not a unit of function
    grade: A
    basis: >-
      demonstrated within LRRC58 - a coding function and a 3' UTR TDMD function with opposite
      effects on growth, where the variant class silently selects which one is measured
