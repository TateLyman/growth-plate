confidence: B
claim_grades:
- claim: Common variation at ZBTB38 is associated with adult height at genome-wide significance.
  grade: A
  basis: weedon2008 discovery plus follow-up genotyping; the locus persists in yengo2022.
- claim: ZBTB38 genotype also tracks birth length and growth hormone treatment response.
  grade: D
  basis: Single cohort of 261 ISS patients with 93 treated (parsons2022); not replicated.
- claim: ZBTB38 influences height through the growth plate.
  grade: E
  basis: No chondrocyte expression or perturbation evidence; the only functional work is siRNA
    knockdown in a cervical carcinoma line. Flagged as inference. See gap g_l8gen_009.
