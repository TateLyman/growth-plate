id: zbtb38_gene
name: ZBTB38
aliases:
- zinc finger and BTB domain containing 38
- CIBZ
- rs724016
type: gene
layer: L8
stub: false
summary: 'ZBTB38 is one of the 20 loci in the first-generation height GWAS (Weedon 2008) and is
  retained in this layer for a specific reason: it is a methyl-CpG-binding zinc-finger transcription
  factor, so it is the one top height locus whose annotated molecular function is the reading
  of DNA methylation - the same mark that tracks growth plate senescence in rabbit and that is
  required for normal bone length in mouse. That makes ZBTB38 the natural place to test whether
  the height-associated methylation biology and the height-associated genetic biology are the
  same system, and no retrieved study has done so. The association itself is solid and has been
  replicated outside the discovery ancestry: rs724016 is associated with height in individuals
  of African ancestry with sickle cell anaemia, in a sample where it is also associated with fetal
  haemoglobin. What is missing is everything downstream. No human growth-plate expression, no
  chondrocyte eQTL, and no functional experiment linking ZBTB38 genotype to any growth plate parameter
  was retrieved, so the node stands as a well-replicated association with an unexploited mechanistic
  handle rather than as a characterised growth gene.


  Direct functional work on the locus does exist, and it moved this node''s grade. Parsons 2022

  genotyped rs6764769 and rs724016 in 261 idiopathic-short-stature patients, showed the two SNPs
  are

  in linkage disequilibrium, and found the rs724016 GG genotype associated with lower birth length

  (P = 0.01) and with a smaller height SDS gain over the first year of recombinant human growth

  hormone in 93 treated patients (P = 0.02); ZBTB38 expression rose with age across 87 normal

  children and young adults, and siRNA knockdown in SiHA cells increased proliferation without

  altering MCM10 expression. So ZBTB38 genotype tracks a prenatal growth measure and a treatment

  response, not only adult stature. What is still missing is a per-allele centimetre effect for

  ZBTB38 in a general population and any demonstration that the gene acts in chondrocytes.'
