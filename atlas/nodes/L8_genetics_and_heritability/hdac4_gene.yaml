id: hdac4_gene
name: HDAC4
aliases:
- histone deacetylase 4 gene
- 2q37 deletion syndrome gene
type: gene
layer: L8
stub: false
summary: 'HDAC4 encodes the class IIa histone deacetylase that restrains RUNX2-driven and MEF2C-driven

  chondrocyte hypertrophy, and human haploinsufficiency of it defines the skeletal component of
  2q37

  deletion syndrome. Williams 2010 analysed six individuals with overlapping 2q37.3 deletions
  to

  reduce the critical region from more than 20 candidate genes to HDAC4 alone, then found HDAC4

  point lesions - an intragenic deletion disrupting splicing and an intragenic insertion causing
  a

  frameshift and premature stop - in individuals with the same clinical picture but no 2q37 deletion.

  That two-step argument (interval narrowing followed by intragenic mutation in deletion-negative

  cases) is what establishes HDAC4 as the causal gene rather than a positional bystander. The

  skeletal phenotype is brachydactyly type E - shortened metacarpals and metatarsals - together
  with

  short stature, alongside developmental delay, behavioural abnormalities and craniofacial

  dysmorphism. Penetrance is markedly incomplete: in 103 individuals with 2q37 deletion the

  supposedly cardinal features were present in only a fraction, with brachydactyly type E in 48%
  and

  overweight/obesity in 34%. The mechanistic significance for the growth plate is the direction
  of

  effect: losing a repressor of hypertrophy shortens the digits, which is the phenotype expected
  if

  premature or excessive hypertrophic differentiation exhausts the plate rather than extends it.'
