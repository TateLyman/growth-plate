  endpoint has been tested.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: Human method development.
confidence: B
claim_grades:
- claim: DNA methylation predicts chronological age in children to within about 0.4 years.
  grade: A
  basis: Training and independent test sets totalling 1,721 profiles across 11 cohorts (mcewen2020).
- claim: Epigenetic age acceleration is associated with growth in children, weakly.
  grade: B
  basis: 'Two independent longitudinal cohorts: ALSPAC n=1,018 (simpkin2017, 0.23 cm per year
    of AA) and n=135 (kim2024, PHV beta 0.018, P=0.0008). Directions are partly conflicting within
    simpkin2017 and both papers describe the effect as small.'
- claim: Epigenetic age acceleration indexes skeletal maturation, i.e. tracks bone age or predicts
    epiphyseal fusion.
  grade: D
  basis: No study relating any epigenetic clock to radiographic bone age or fusion status exists;
    established by explicit search (g_l8gen_014, 33 hits, none qualifying). Downgraded from an
    initial grade-X assessment after the search returned two genuine growth-endpoint primaries.
