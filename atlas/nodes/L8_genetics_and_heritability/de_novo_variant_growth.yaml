claim_grades:
- claim: Positive selection in the male germline enriches pathogenic de novo mutations above the
    neutral rate.
  grade: A
  basis: Genome-wide duplex sequencing of 81 sperm samples identifying 40 positively selected
    genes (neville2025) plus locus-resolved subclonal expansion mapping in testis for FGFR3 (moura2024).
- claim: This mechanism explains the paternal-age association of achondroplasia specifically.
  grade: B
  basis: Age-correlated FGFR3 subclonal expansions measured directly in human testis (moura2024);
    the epidemiological link to achondroplasia incidence is inferred rather than jointly measured
    in the same study.
