id: duration_lever_is_a_switch_not_a_slope
name: Why the pharmacological duration lever is not the genetic one - the dose-response is a switch
type: hypothesis
layer: L8
stub: false
summary: 'Men with complete loss of ESR1 or CYP19A1 reach 204 cm - about +4 SD - which is an order of magnitude beyond
  anything pharmacology has achieved, and this atlas attributed the gap to three addressable differences: the drugs
  are given too late, too weakly, and for too short a time. TWO INDEPENDENT LINES OF EVIDENCE NOW SAY THE GAP IS MOSTLY
  SOMETHING ELSE. First, the common-variant test. This atlas looked up the GIANT 2022 European height summary statistics
  in windows around eleven genes of the oestrogen/fusion axis and twelve of the CNP/GH velocity axis. If duration
  were the bigger lever, graded genetic variation in it should move height more. IT DOES NOT: median lead-common-variant
  effect 0.022 SD per allele for the duration axis against 0.028 for the velocity axis, a difference of 0.005 SD with
  a permutation p of 0.53. Both sit about five-fold above negative-control genes and about two-fold below established
  top height loci. In graded variation the two axes are indistinguishable. Second, the size of the non-linearity.
  The lead common CYP19A1 variant moves height by 0.054 SD per allele - both copies is about 0.8 cm - while complete
  loss of the same gene moves it about 4 SD. THAT IS A SEVENTY-FOLD GAP BETWEEN GRADED AND COMPLETE PERTURBATION OF
  THE SAME GENE. The reading that fits both, and fits the biphasic oestrogen dose-response the atlas already holds,
  is that fusion is a THRESHOLD rather than a slope. Partial reduction of oestrogen moves along a flat part of the
  curve; only removal of the signal crosses the threshold. That reframes the therapeutic question from WHEN TO START
  to HOW HARD TO BLOCK - and it predicts, correctly, that the more potent aromatase inhibitor beats the less potent
  one on real height while both look similar on surrogates.'
quantitative:
- parameter: DURATION AXIS vs VELOCITY AXIS in common human genetic variation
  value: median lead-variant effect 0.0222 vs 0.0276 SD of height per allele; difference 0.0054, permutation p = 0.53
  unit: SD of adult height per allele
  conditions: GIANT Yengo 2022 European summary statistics, 1.37M SNPs, GRCh37 build confirmed empirically against
    rs143384. Windows of +/-100 kb around 11 duration-axis genes (CYP19A1, ESR1, ESR2, HSD17B3, SHBG, CYP17A1, LIN28B,
    MKRN3, KISS1, KISS1R, TACR3) and 12 velocity-axis genes (NPR2, NPPC, NPR3, FGFR3, MME, GHR, IGF1, IGF1R, IGFALS,
    STAT5B, PAPPA2, GH1). Lead variant is the minimum-P common variant (MAF >= 0.01) in each window. IQRs 0.0130-0.0461
    and 0.0134-0.0433
  species: human
  source_ref: yengo2022
  uncertainty: 'DERIVED BY THIS ATLAS 2026-08-06, GRADE D, AND IT IS A WINDOWED LOOKUP RATHER THAN A GENE-BASED TEST.
    There is no LD reference here, so a window can capture a neighbouring gene''s signal; class sizes are 11 and 12;
    the statistic is a median of maxima, which is biased upward by the number of SNPs per window; and the permutation
    test on 11 versus 12 medians has little power to detect a small difference. WHAT IT CAN SUPPORT is the absence
    of a large one: the duration axis is not an order of magnitude ahead, which is what the atlas''s own ledger implied
    it should be. GUARDS: positive controls GDF5, HMGA2, ZBTB38 and LCORL all reach P below the double-precision floor;
    all four negative controls fail genome-wide significance, the strongest at P = 7.3e-8 with beta 0.0057. AN EARLIER
    VERSION OF THIS ANALYSIS SELECTED LEAD SNPs BY EFFECT SIZE, which picks rare high-variance noise - a negative
    control then out-scored every positive control - and it was not reported.'
- parameter: THE NON-LINEARITY - same gene, graded versus complete perturbation
  value: about 70-fold
  unit: ratio of effect on height
  conditions: 'CYP19A1: lead common variant rs1902586, MAF 0.046, beta 0.0538 SD per allele, P = 7.8e-103, so both
    copies is about 0.11 SD or roughly 0.8 cm. Complete loss of function in males gives an adult height of 204 cm
    against a population mean near 176 cm, about +4 SD'
  species: human
  source_ref: yengo2022
  uncertainty: 'DERIVED BY THIS ATLAS, GRADE E - it divides a population-genetic effect by a case-report effect and
    the two are not the same kind of quantity. THE COMMON-VARIANT SIDE IS NOT A KNOWN FUNCTIONAL CHANGE: rs1902586
    is a tag, its effect on aromatase activity is unmeasured, and the true functional dose difference between carriers
    and non-carriers is unknown - so the ''70-fold'' is a ratio of PHENOTYPE, not of dose, and cannot be read as a
    dose-response curvature without the dose. THE COMPLETE-LOSS SIDE IS FIFTEEN PUBLISHED MALE CASES with a range
    of 188-204 cm. What the comparison does establish is that the relationship between oestrogen-axis perturbation
    and height is very far from linear, which is the only claim the node makes from it.'
- parameter: the prediction this makes, and the test that already exists
  value: the more potent aromatase inhibitor beats the less potent one on REAL height and not on the surrogate
  unit: cm, near-final height minus initial predicted adult height
  conditions: letrozole median +4.2 cm (IQR 0.6-13) against anastrozole +0.8 cm (IQR -2.6 to 3.5), P = 0.013, in 72
    males followed to near-final height (nearfinal2026). At one year on PREDICTED height the same two drugs rank the
    other way, anastrozole +4.2 vs letrozole +1.4 cm, P = 0.03 (neely2014). A 3-year randomised comparison found no
    difference between them on predicted height and a combined gain of only +1.3 cm, with the year-1 gain not persisting
    (neely2024)
  species: human
  source_ref: nearfinal2026
  uncertainty: 'A THRESHOLD MODEL PREDICTS THAT DEPTH OF BLOCKADE MATTERS MORE THAN DURATION OF IT, and the one comparison
    at a real endpoint agrees. It is retrospective, uncontrolled, and the randomised comparison of the same two drugs
    on the surrogate is null - so this is a consistent prediction rather than a confirmed one. The atlas records it
    as the node''s falsifiable content: if a properly dosed, deeply suppressing aromatase inhibitor produces no more
    height than a shallow one at a true endpoint, the threshold model is wrong.'
- parameter: has the decisive condition ever been tested in a human
  value: no - oestrogen blockade begun BEFORE puberty in a child with NORMAL steroidogenesis
  unit: none
  conditions: literature sweep 2026-08-06 across prepubertal aromatase inhibition, ESR1 and CYP19A1 heterozygous carriers,
    untreated hypogonadism, aromatase excess syndrome and infant exposure
  species: human
  source_ref: aexs2024
  uncertainty: 'RECORDED AS AN ABSENCE AND IT SURVIVED THE SEARCH. Every prepubertal-start aromatase inhibitor case
    or trial that could be found enrolled a child with a disorder of steroid EXCESS - central or peripheral precocious
    puberty, congenital adrenal hyperplasia, McCune-Albright, aromatase excess syndrome. THE TWO NEAREST APPROXIMATIONS
    POINT OPPOSITE WAYS. In aromatase excess syndrome, letrozole started at age 7 gave an adult height of 179 cm against
    an affected untreated father at 171 cm - n=1, in a disorder of excess. In congenital adrenal hyperplasia, a randomised
    prepubertal regimen containing an aromatase inhibitor was NULL on adult height (95% CI -0.29 to 0.82, P = 0.35)
    and its authors recommend against it. THIS NODE''S OWN ARGUMENT PREDICTS THE CAH NULL: a partial block does not
    cross the threshold no matter how early it starts.'
localization:
- systemic
human_evidence: direct
human_evidence_note: 'Both lines are human: population-scale common variation in 1.37 million SNPs from up to 1.6
  million people, and fifteen published cases of complete loss of function. The weakness is that neither is an experiment
  - one is observational genetics and the other is a natural knockout with no dose axis.'
species_basis:
- human
translation_risk: low
translation_risk_reason: Human throughout. The risk is inferential - a windowed lookup is not a gene-based test, and
  a phenotype ratio is not a dose-response.
confidence: D
confidence_note: D, and deliberately so. The underlying data are grade A - GIANT is the largest human GWAS ever run
  and the loss-of-function phenotypes are well documented - but everything this node CLAIMS is an inference by this
  atlas from a windowed lookup with no LD model, comparing 11 genes against 12, with a permutation test that can only
  exclude a large difference. The node earns its place because it is the first thing in this atlas to give a mechanistic
  reason why the pharmacological and genetic duration levers differ by an order of magnitude, and because it makes
  a falsifiable prediction that existing data already tests once and agrees with.
