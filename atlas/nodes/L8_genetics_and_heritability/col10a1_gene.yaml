claim_grades:
- claim: COL10A1 mutations cause metaphyseal chondrodysplasia Schmid.
  grade: A
  basis: Original linkage kindred at lod 18.2 (warman1993) plus a 128-case genotype-phenotype
    series (meng2025).
- claim: Missense (dominant-negative) COL10A1 alleles reduce stature more than truncating (haploinsufficient)
    alleles.
  grade: B
  basis: Single pooled cohort of 128 cases with P=0.013 (meng2025); the comparison is within one
    literature aggregation rather than two independent cohorts.
