id: round432_the_recessive_class_the_two_instruments_cannot_see_and_the_positive_control_comes_back_as_the_answer
name: The recessive class both systematic instruments are blind to - run, and the positive control comes
  back as the answer
aliases:
- R432
- CORR-358
- the recessive screen
- the zygosity blind spot
type: hypothesis
layer: L8
stub: false
summary: 'The conclusion this atlas has been converging on - the elevation direction is fully occupied
  (R331), nothing passes both tests (R312) - rests on exactly two systematic human-genetics instruments,
  and NEITHER CONTAINS CYP19A1. Aromatase deficiency is the single largest human height effect the file
  holds and the mechanistic reason anastrozole is in the stack, and it is invisible to both screens. That
  is checkable rather than speculative and it was checked against both files on disk before this round
  was written.

  WHY THE 207 CANNOT SEE IT is structural and unfixable: kosmicki2026 is a HETEROZYGOUS burden test and
  aromatase deficiency is recessive, so no number of exomes recovers it. WHY R323b MISSED IT is different
  from what was supposed, and the real reason is more general and more damaging. CYP19A1 IS annotated
  to HP:0000098 Tall stature under ORPHA:91 and to HP:0002750 Delayed skeletal maturation under ORPHA:91
  and OMIM:613546 - the vocabulary was never the problem. R323b took a SET DIFFERENCE AT THE GENE LEVEL,
  tall-annotated genes minus short-annotated genes, and CYP19A1 carries HP:0004322 Short stature and HP:0005616
  Accelerated skeletal maturation under ORPHA:178345, which is aromatase EXCESS - the opposite lesion
  of the same gene. TWO OPPOSITE CONDITIONS OF ONE GENE CANCELLED EACH OTHER IN A SET OPERATION. That
  is CORR-309''s error committed against a gene instead of a paper: record the DISEASE, not the gene.
  CLAUDE.md already reported the size of the damage without knowing what it was - 74 of 180 annotated
  both ways, leaving 106 directional.

  THE FIX, AND THE ASYMMETRY IS THE POINT. Key DIRECTION per (gene, disease) and never per gene; union
  INHERITANCE and axis coverage per gene but only over diseases that already passed the direction filter.
  Moving to disease level takes the mechanism-positive set from 188 genes to 319, RECOVERING 131, of which
  80 are recessive and 21 carry the tall axis. The B1 guard, declared before results: CYP19A1 is recovered,
  and ESR1, NPR3 and CBS all survive both designs.

  A SECOND STRUCTURAL DEFECT WAS FOUND BY THE GUARD RATHER THAN ASSUMED. HPO records the same condition
  twice, once as OMIM and once as ORPHA, and annotates them differently - for CYP19A1 inheritance sits
  on OMIM:613546 while tall stature and eunuchoid habitus sit on ORPHA:91. Joining on disease_id splits
  one condition in two, and a naive recessive filter returns zero for the positive control.

  THEN THE SCREEN WAS RUN TO THE END, AND THE ANSWER IS A CONFIRMATION RATHER THAN A LEVER. The recessive
  mechanism-positive class is real and large - 208 genes - and it is NEARLY DISJOINT FROM THE 207, sharing
  only 12 members. Its dominant cluster is 78 genes on the puberty axis and is the hypogonadotropic-hypogonadism
  set: absent or delayed puberty, no oestrogen, no epiphyseal fusion, eunuchoid proportions with continued
  growth. That is CYP19A1''s phenotype reached by a different route, it is closure program (A), and anastrozole
  already occupies it. Of the 16 members that are cartilage-ENRICHED in the purity-corrected human plate,
  exactly one has substantial chemical matter pointing anywhere useful, and it is CYP19A1 itself at 3,937
  ChEMBL molecules. THE POSITIVE CONTROL CAME BACK AS THE ANSWER.

  AND THE THIRD CLUSTER CLOSES ON A HUMAN ADULT-HEIGHT ENDPOINT, WHICH IS A REAL RESULT RATHER THAN A
  NULL. Familial glucocorticoid deficiency is five genes on one disease record (MC2R, MRAP, STAR, NNT,
  TXNRD2, ORPHA:361) with decreased circulating cortisol and tall stature - the human loss-of-function
  arm of the glucocorticoid axis, which this file contraindicates twice on mechanism and has never had
  a human genetic anchor for. It is better than an association: duan2023fgd reports that after roughly
  two years of hydrocortisone the excessive growth was reduced to near normal, a within-patient reversal.
  THEN karakilicozturan2025 kills it as a lever - seven MC2R-deficient patients, all with early or precocious
  puberty at a mean onset of 8.6 years in boys, and FINAL HEIGHT BELOW TARGET at -2.6 and -0.7 SDS. Tall
  as a child, short as an adult. Failure mode one with a human adult-height endpoint, and the proposed
  mechanism - elevated ACTH stimulating kisspeptin neurons - means the trade is STRUCTURAL for the axis
  rather than incidental, because every agent that lowers cortisol or blocks GR raises ACTH by feedback.


  MECHANISM AND STRUCTURE OF THE RECESSIVE CLASS.

  The screen keys on MECHANISM rather than on the label "tall", because the phenotype this project wants
  is an extended growth period with an open plate. Four axes: PERIOD (delayed skeletal maturation, dysharmonic
  delayed bone age, delayed epiphyseal ossification and its four site-specific children), TALL (tall,
  disproportionate tall, proportionate tall), PROPORTION (eunuchoid habitus, increased arm span) and PUBERTY_UNCOUPLED
  (absent pubertal growth spurt, delayed puberty). The opposing set - six short-stature terms plus accelerated
  skeletal maturation, reduced arm span and premature phalangeal epiphyseal fusion - is applied WITHIN
  a disease and never across a gene.

  What the recessive class contains, once run: 38 per cent of it is the hypogonadotropic hypogonadism
  gene set (ANOS1, CHD7, DUSP6, FGF8, FGF17, FGFR1, GNRH1, GNRHR, HS6ST1, KISS1, KISS1R, NHLH2, NSMF,
  PROK2, PROKR2, SPRY4, TAC3, TACR3, WDR11) - which is the atlas''s own duration arm arrived at from the
  gonadotropin side rather than the aromatase side. A second cluster is connective tissue and microfibril
  (EFEMP2, FBLN5, MYH11, MYLK, ZNF469, PLOD1, CHST14, DSE, FKBP14, COL6A1, EMILIN1, SMAD2), which is CORR-325''s
  band already worked. A third is adrenal steroidogenesis. The remainder is GPI-anchor, mitochondrial,
  X-linked intellectual disability and ribosomal - abundance artefacts of the kind CORR-349 predicts.

  THE BRIDGE GENES are the twelve in both instruments, and four are CONCORDANT in direction across zygosity:
  NPR3 (het +2.35 cm, biallelic tall), PLOD1 (het +1.03 cm, biallelic kEDS type 1 with marfanoid habitus),
  HERC1 (het +2.07 cm at P=9.2e-10, biallelic overgrowth) and KIF7 (het +0.80 cm at P=7.3e-05 across 1,222
  carriers, biallelic acrocallosal). POR is concordant and its mechanism is the aromatase electron donor,
  i.e. the same arm as the positive control read at a different dose.

  AND THE RECESSIVE CLASS RESCUES POWER, NOT ONLY GENES. FGFR3''s pure-pLoF row in the 207 is +1.75 cm
  at P=0.23 across 23 carriers - uninformative in both directions - while the biallelic and monoallelic
  human phenotype, CATSHL syndrome, is unambiguous: camptodactyly, TALL STATURE, scoliosis and hearing
  loss from FGFR3 loss of function. That is the human germline validation of the direction the stack''s
  lead agent pushes, and it comes from the class the het table cannot see.


  WHAT WOULD FALSIFY: Tracing the remaining 73 both-ways genes to their disease records and finding that
  most are single ambiguous conditions rather than opposite-lesion pairs would show the CYP19A1 case is
  idiosyncratic rather than a class, and would shrink the methodological correction to one gene. Separately,
  an untreated adult cohort of familial glucocorticoid deficiency reaching ABOVE target height would overturn
  the closure of the cortisol arm, which currently rests on two patients in one series.


  NOTES: CORR-295 IN REVERSE, applied and stated rather than assumed: recessive tall-stature genes have
  the opposite ascertainment problem to short ones, because the tall phenotype is treated away on diagnosis.
  duan2023fgd is the demonstration - the excessive growth was reduced to near normal on hydrocortisone.
  So absence of published extreme heights in this class is not absence of the effect, and the nulls here
  are not read as negatives. The one place a real endpoint exists - karakilicozturan2025''s final heights
  - is read as a result precisely because it is an endpoint and not an absence. WHAT THIS ROUND DOES NOT
  DO. It produces no addition to the stack. Every cartilage-enriched member of the recessive class is
  either an arm already occupied (CYP19A1, the hypogonadism cluster, AIP via GH), a band already worked
  (the microfibril and EDS genes), a discharge protease (MMP13, 2,085 CPM at 11.89-fold, whose direction
  is failure mode one), or has no chemical matter at all. That is R298''s base rate holding on a gene
  set it was never computed over.'
