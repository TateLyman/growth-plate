translation_risk: low
translation_risk_reason: 'Every element is human: HPO disease annotations, kosmicki2026''s exome burden
  table, human growth-plate transcriptomes and human case series with final heights. The residual risk
  is not cross-species but ascertainment - an HPO annotation is a curated statement about a syndrome with
  no effect size and no allele, and the closing result rests on two patients in one series.'
human_evidence_note: Direct throughout. The positive control (CYP19A1), the closing endpoint (karakilicozturan2025's
  final heights of -2.6 and -0.7 SDS), the within-patient reversal (duan2023fgd) and the direction validation
  (CATSHL) are all human. The screen's inputs are the Human Phenotype Ontology and a 1.45M-exome burden
  table.
