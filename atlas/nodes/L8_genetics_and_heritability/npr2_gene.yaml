localization:
- 'human: germline; effector receptor localizes to growth plate chondrocytes'
human_evidence: direct
human_evidence_note: Human genotype-stature data at three dose levels (biallelic LoF, monoallelic
  LoF, GoF), each with an independent cohort and in vitro cyclase confirmation.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: All stature claims rest on measured human height; the mouse Npr2 literature
  is cited only in the protein node npr2_receptor.
confidence: A
claim_grades:
- claim: Reduced NPR2 gene dosage lowers human adult stature and increased signalling raises it.
  grade: A
  basis: Loss-of-function height z-scores measured in a controlled family design (olney2006) plus
    independent gain-of-function pedigrees (miura2012, hannema2013).
- claim: The heterozygous effect size is about -1.4 SDS relative to non-carriers.
  grade: B
  basis: Single family (olney2006, 16 vs 23); not replicated at that precision in an independent
    cohort.
