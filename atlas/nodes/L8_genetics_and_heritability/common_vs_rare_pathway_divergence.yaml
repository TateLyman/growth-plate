localization:
- 'human: genome-wide comparison of two ranking procedures, not tissue-localized'
human_evidence: direct
human_evidence_note: Both rankings are compiled from human data - GWAS pathway enrichment on measured
  stature and curated human monogenic disorder catalogues.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: A comparison of two human evidence bases.
confidence: C
claim_grades:
- claim: Published height GWAS pathway-enrichment analyses list paracrine signalling and matrix
    genes, not the GH-IGF endocrine axis.
  grade: A
  basis: Direct reading of the enrichment results in weedon2008, lango2010 and wood2014, plus
    a reproducible null search (g_l8gen_001).
- claim: Monogenic short stature is dominated by GH-IGF axis and structural collagen genes.
  grade: A
  basis: The 2023 nosology (unger2023) and ClinGen curation (webb2026), together with the measured
    stature effects in ghr_gene, stat5b_gene, igfals_gene, col2a1_gene, col10a1_gene and comp_gene.
- claim: Hedgehog, CNP/NPR2 and proteoglycan synthesis are the pathway families where the two
    rankings converge.
  grade: B
  basis: IHH and ACAN appear in weedon2008 and in monogenic ISS panels (andrade2022); proteoglycan/GAG
    synthesis is named at the rare coding tier by marouli2017. Convergence is by inspection rather
    than by a formal overlap statistic.
- claim: The divergence arises because feedback-buffered endocrine genes tolerate common variation
    while dose-linear local genes do not.
  grade: E
  basis: Explanatory hypothesis, not tested. The discriminating test is stated in gap g_l8gen_001.
