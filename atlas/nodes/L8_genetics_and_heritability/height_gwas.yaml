contradicts:
- 'yengo2022 internal discrepancy: the peer-reviewed Nature version states the 7,209 segments have a MEAN
  size of ~90 kb, whereas the bioRxiv preprint of the same analysis states a MEDIAN of ~90 kb. For a right-skewed
  size distribution these cannot both be ~90 kb. Logged in audit/contradictions.md; the published value
  is used here and the discrepancy is flagged rather than silently resolved.'
- SNP-based (56%, SE 2.3%) versus twin/pedigree (~0.80 adult) heritability estimates disagree in magnitude.
  This is the missing-heritability problem and is recorded as an open contradiction, not collapsed into
  a single figure.
last_verified: '2026-08-05'
claim_grades:
- claim: These 12,111 independent SNPs associate with adult height at the reported effect sizes.
  grade: B
  basis: 'Yengo 2022, n=5.4M. NOT independently replicated by another GWAS - Wood 2014 and Wainschtein
    2026 are NESTED inside the same 5.4M sample, so GWAS cannot replicate its own flagship estimate. The
    legitimate independent test is a DIFFERENT evidence type: out-of-sample polygenic prediction in a
    non-overlapping cohort. Wang X 2026 supplies one (HCHS/SOL admixed Latinos, European-derived
    weights, R2 improving ~0.05 with ancestry PCs), which corroborates that the variant effects carry
    real predictive signal outside the discovery sample.'
- claim: Height is highly heritable.
  grade: A
  basis: Independently corroborated by twin and pedigree designs, which share NO inferential route with
    GWAS. Dewau 2025 meta-analysis (162,293 twin pairs, 380,195 parent-offspring pairs). This is a genuinely
    independent replication in the propositional sense - a different study design testing the same proposition.
- claim: SNP-based and family-based heritability estimates agree in magnitude.
  grade: D
  basis: THEY DO NOT. GREML-LDMS gives 56% (SE 2.3%), inferred true 60-70%; twin designs give ~0.80 in
    adults and 0.57 (95% CI 0.52-0.61) under age 5. That disagreement IS the missing-heritability problem
    and is recorded as a contradiction, not resolved into a single number.
- claim: The pathways enriched in height GWAS signal are the pathways that mechanistically build the growth
    plate.
  grade: E
  basis: Weakest claim on the node and graded lowest. Enrichment is demonstrated (Richard 2025, Darbellay
    2024); the variance PARTITION across tissues has never been computed (g_l8gwas_001). And per common_vs_rare_pathway_divergence,
    0 of 3 GWAS enrichment lists names the somatotropic axis despite it carrying the largest monogenic
    stature effects - so GWAS enrichment is NOT a readout of mechanistic importance.
