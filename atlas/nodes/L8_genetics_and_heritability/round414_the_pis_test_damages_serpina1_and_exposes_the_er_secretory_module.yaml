id: round414_the_pis_test_damages_serpina1_and_exposes_the_er_secretory_module
name: "R414: the discriminating allele was pulled from the 451,921-person height GWAS and it damages SERPINA1 - PiS is taller in the SAME direction at P=1.3e-4 but TEN-FOLD smaller while removing only half as much protein, so the dose-response fails 4.5-fold and most of the PiZ effect is not lowered antitrypsin. What the failure exposes is bigger than the candidate: an ER / SECRETORY-PROTEOSTASIS module of 31 blind-spot genes, five with independent height signals, and three human stature alleles that all act through ER stress"
aliases:
  - PiS PiZ height dose response
  - SERPINA1 lever withdrawn
  - ER stress chondrocyte stature
  - secretory proteostasis growth plate
type: hypothesis
layer: L8
stub: false
summary: >-
  R413 promoted SERPINA1 on one allele and named the test that would decide it: PiS (rs17580),
  which lowers alpha-1-antitrypsin like PiZ but barely polymerises and carries no liver disease.
  If PiS is also taller, the mechanism is loss of function and SERPINA1 is a real brake. If only
  PiZ is taller, the mechanism is the Z protein's polymerisation and endoplasmic-reticulum
  retention, and the candidate closes like the MGP dysplasia did in R411.
  The test was run against the harmonised summary statistics of the same 451,921-person standing
  height GWAS, so both alleles come from one cohort and one instrument.

  ⭐ THE RESULT, AND IT IS NEITHER A PASS NOR A CLEAN KILL.
  · PiZ, rs28929474, chr14:94,378,610, effect allele T, EAF 1.99 percent:
    beta +0.1375 SD, SE 0.0058, P = 4.9e-125.
  · PiS, rs17580, chr14:94,380,925, effect allele A, EAF 4.79 percent:
    beta +0.0138 SD, SE 0.0038, P = 1.3e-04.
  ✓ THE DIRECTION SURVIVES. Both alpha-1-antitrypsin deficiency alleles associate with GREATER
  adult height, and PiS does so independently at P=1.3e-4. That is real and it was not
  guaranteed.
  ⛔ THE DOSE-RESPONSE FAILS, AND THAT IS WHAT MATTERS. The observed effect ratio is
  0.1375 / 0.0138 = 9.97. The protein ratio is not: a PiMZ heterozygote carries roughly 55-60
  percent of normal serum antitrypsin and a PiMS heterozygote roughly 80 percent, so the Z allele
  removes about 40-45 percent per copy and the S allele about 20 percent - a ratio of
  approximately 2.1 to 2.25. A pure loss-of-function model therefore predicts PiZ to be about
  2.2 times PiS and it is TEN times PiS: THE MODEL UNDER-PREDICTS BY ROUGHLY 4.5-FOLD.
  → SO AT MOST ABOUT A FIFTH OF THE PiZ HEIGHT EFFECT IS EXPLAINED BY HOW MUCH ANTITRYPSIN THE
  ALLELE REMOVES. The residual belongs to something the Z allele does and the S allele does not,
  and the obvious candidate is the one that defines the Z allele: POLYMERISATION AND ER
  RETENTION.

  ⛔⛔ THE CONSEQUENCE FOR THE THERAPEUTIC PROPOSAL IS SEVERE AND IS STATED PLAINLY. A silencing
  RNA lowers antitrypsin protein WITHOUT creating polymers, so it can only reproduce the
  loss-of-function component - the small one. Scaling from PiS, a 20 percent reduction buys about
  0.014 SD, of order a millimetre-to-centimetre scale effect rather than the 1.19 cm the PiZ
  allele carries, and extrapolating beyond the observed range is not justified anyway.
  ⛔ WORSE, THE DRUG'S OWN POPULATION RUNS AGAINST IT: a SERPINA1 siRNA is developed for PiZZ
  liver disease precisely to REMOVE the polymer, which on this reading is the arm that carries
  most of the height association. R413's candidate is therefore WITHDRAWN as a lever. What
  remains is a real but small loss-of-function component with no agent aimed at it.
  ✓ ONE OUTPUT SURVIVES INTACT AND IS ARGUABLY STRENGTHENED: ALPHA-1-ANTITRYPSIN AUGMENTATION
  THERAPY IS PREDICTED TO SHORTEN, because the loss-of-function arm is genuine and augmentation
  is its inverse. Narrow, free, and unchanged by the dose-response failure.
  ⚠ Recorded honestly: the locus carries other signals in the same region (rs112635299 at
  +0.131 and P=9.6e-120, almost certainly tagging PiZ; and separate weaker signals rs7151526
  +0.056 at P=4.4e-48 and rs112963922 +0.079 at P=1.5e-33), so the architecture is not a single
  variant and the conditional assignment of the whole locus to SERPINA1 is an assumption.

  ⭐⭐ AND THE FAILURE IS MORE INTERESTING THAN THE CANDIDATE WAS, BECAUSE IT NAMES A MECHANISM
  THAT KEEPS RECURRING. Three independent human stature alleles in this atlas act through
  ENDOPLASMIC-RETICULUM STRESS rather than through the function of the protein involved:
  · MGP, dominant Cys19 variants - spondyloepiphyseal dysplasia by ER-stress-induced APOPTOSIS
    OF GROWTH PLATE CHONDROCYTES, not by loss of mineralisation inhibition (R411).
  · MMP13, a frameshift variant - short stature via enhanced interaction with HSPA5/BiP, the
    master ER chaperone, and activated ER stress (surfaced in R412).
  · SERPINA1 PiZ - polymerises and is ER-retained, and on this round's arithmetic that arm
    carries most of its height effect.
  TWO SHORTEN AND ONE LENGTHENS, so ER stress is not uniformly good or bad - which is exactly
  what makes it an axis rather than a direction.
  ⭐ AND SERPINA1 IS TRANSCRIBED IN CHONDROCYTES AT 1,606 CPM, so a PiZ carrier makes Z protein
  IN THE GROWTH PLATE. If chondrocyte ER handling is where this acts, the effect is LOCAL after
  all - and it is a gain of function in the plate rather than a loss. Untested in any species.

  ⭐⭐⭐ AND THE MODULE IS ALREADY IN THE BLIND-SPOT DATA, LARGE AND COHERENT. Querying the
  R411 inventory for the ER and secretory pathway returns 31 OF 62 GENES WITH ZERO ATLAS
  MENTIONS, all cartilage-enriched and abundant: SEC61G 453 CPM at 12.3x · HSP90B1 840 ·
  RCN1 454 · PDIA6 335 · SRP14 344 · KDELR2 305 at 6.6x · FKBP10 298 · PRDX4 293 at 8.3x ·
  OSTC 293 · RPN2 278 · TMED9 261 · SEC61B 207 · RCN2 208 · OS9 197 · TMED10 194 · KDELR1 166 ·
  PDIA4 148 · SRP9 124 · TMED2 109 · MANF 104 · UFC1 91 · KDELR3 88 · DDOST 70 · TMED7 69 ·
  CRELD2 64 · DDIT3 54 · CNIH4 51 · DERL2 45 · TMED1 44 at 8.6x · SRPRB 43 · SYVN1 21.
  ⭐ FIVE OF THEM CARRY AN INDEPENDENT HEIGHT GWAS SIGNAL: PDIA4 +0.188 cm at -log10P 101.6 ·
  TMED7 +0.186 at 55.2 · RPN2 +0.160 at 46.6 with distance ZERO · CNIH4 -0.176 at 39.4 with
  distance ZERO · KDELR2 -0.186 at 8.1 with distance ZERO.
  ⭐ AND THE MECHANISTIC CASE IS THE STRONGEST PART: the growth plate secretes COL2A1 at roughly
  70,000 CPM, one of the largest secretory burdens of any tissue in the body, and SERPINH1/HSP47
  - the collagen-specific chaperone - is 394 CPM at 3.39x. If matrix output is part of
  elongation, then ER FOLDING AND EXPORT CAPACITY IS A CANDIDATE THROUGHPUT LIMIT ON IT, and this
  atlas has never had a node, a gap or a reference for it.
  ⛔ NO DIRECTION IS CLAIMED. The five GWAS signals point both ways, the three disease alleles
  point both ways, nothing here has a bone-length endpoint in any species, and a screen that
  finds an abundant housekeeping apparatus is exactly the artefact R411's own negative control
  warned about. This is recorded as a NAMED UNEXAMINED AXIS, not a lead.
