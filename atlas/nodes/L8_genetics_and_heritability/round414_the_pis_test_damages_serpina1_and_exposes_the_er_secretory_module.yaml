human_evidence: direct
human_evidence_note: >-
  Both allelic effects are human, from one cohort, with the serum antitrypsin levels taken from
  standard clinical figures. The mechanistic attribution of the residual to polymerisation is an
  inference from the discrepancy, not a measurement.
