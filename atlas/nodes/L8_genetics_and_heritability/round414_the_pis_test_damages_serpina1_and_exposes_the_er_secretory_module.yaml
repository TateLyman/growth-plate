  population runs the other way, and nothing in the ER module has a bone-length endpoint in any
  species.
confidence: B
claim_grades:
  - claim: Both alpha-1-antitrypsin deficiency alleles associate with greater adult height
    grade: A
    basis: >-
      PiZ P = 4.9e-125 and PiS P = 1.3e-04 in the same 451,921-person cohort, same direction
  - claim: >-
      The loss-of-function model fails quantitatively, so most of the PiZ effect is not lowered
      antitrypsin
    grade: B
    basis: >-
      a 10-fold effect ratio against a 2.1-2.25-fold protein ratio. Rests on standard clinical
      figures for PiMZ and PiMS serum levels rather than on levels measured in this cohort
  - claim: SERPINA1 lowering is a lever for height
    grade: E
    basis: >-
      WITHDRAWN. A silencing RNA reproduces only the loss-of-function component, which scales to a
      small fraction of the allelic effect, and the drug's own indication removes the polymer that
      appears to carry most of it
  - claim: Alpha-1-antitrypsin augmentation therapy is predicted to shorten
    grade: C
    basis: >-
      the loss-of-function arm is genuine and augmentation is its inverse. No measurement in any
      species
  - claim: >-
      ER and secretory proteostasis is a large uncovered axis in the growth plate with human
      genetic entries
    grade: C
    basis: >-
      31 blind-spot genes, five with independent height signals, and three human stature alleles
      acting through ER stress. But the signals point both ways and an abundant housekeeping
      apparatus is exactly the artefact this screen's own control warned about
  - claim: The SERPINA1 height effect acts in chondrocytes
    grade: E
    basis: >-
      SERPINA1 is 1,606 CPM in the plate so Z protein would be made there, but antitrypsin's
      canonical target proteases are effectively absent from the tissue (ELANE 1.1 CPM, PRTN3 0.1,
      CTSG 0.0), which argues the opposite. Unresolved
