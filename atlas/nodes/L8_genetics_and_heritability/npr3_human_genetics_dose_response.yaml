id: npr3_human_genetics_dose_response
name: THE HUMAN DOSE-RESPONSE FOR NPR3 - a gene-dosage series in one family, a first-rank GWAS locus that
  assigns cleanly, and a common-variant direction that does not
aliases:
- is NPR3 a human height gene
- heterozygous NPR3 carriers height
- NPR3 GWAS
- what does partial NPR3 loss do in humans
type: gene
layer: L8
stub: false
summary: 'ROUND 140 INTERROGATED THE HUMAN GENETICS OF EVERY PHOSPHATASE GENE AND OF NPR2. IT NEVER QUERIED
  NPR3 - the gene the whole route now targets. That omission is closed here, and it produces the single most
  decision-relevant human datum on this branch plus one result that cuts against the enthusiasm.
  ONE - THE GENE-DOSAGE SERIES, WHICH IS THE CLOSEST HUMAN ANALOGUE OF A PARTIAL PHARMACOLOGICAL BLOCKER.
  A drug does not knock a gene out; it blocks a fraction of receptor for a while. The human read-out for
  that is the HETEROZYGOTE, and lauffer2022 Table 2 has one family genotyped end to end. Biallelic proband
  A315T/I432F +3.93 SDS; heterozygous father A315T/wt +1.46 SDS at 194.2 cm; heterozygous mother I432F/wt
  +0.71 SDS at 175.2 cm; two wild-type sisters minus 0.92 and plus 0.92 SDS. ZERO ALLELES ABOUT ZERO SDS,
  ONE ALLELE ABOUT PLUS ONE, TWO ALLELES ABOUT PLUS FOUR. A monotonic dosage series in a single family, and
  the heterozygotes carry no reported skeletal or cardiovascular phenotype at all.
  AND THE BIALLELIC FIGURE IS A FLOOR, NOT A CEILING. The proband had PERCUTANEOUS EPIPHYSIODESIS OF BOTH
  KNEES at 13.5 years and of both halluces at 12 years. He was surgically stopped. His trajectory before
  that was ACCELERATING - from +2.5 SDS to +3.93 SDS by 14.7 years. boudin2018 individual 4 likewise had
  surgery to stop hallux growth. The untreated biallelic phenotype has been observed in nobody.
  UPDATED ROUND 150. THE CARRIER SERIES IS NO LONGER ONE FAMILY. boudin2018 adds four obligate carriers -
  family 1 father +0.1 SDS and mother +1.4 SDS (their sons are compound heterozygous and the parents are
  non-consanguineous, so each must carry one allele), and family 2 parents at an estimated 165-170 cm and
  a measured 171 cm with no SDS given. With SDS for four the series is +0.1, +0.71, +1.4, +1.46, mean about
  +0.92 - the roughly one-SD-per-allele central estimate holds, but one carrier sits at the population
  mean and the picture is more heterogeneous than the first two suggested (CORR-160).
  AND THE CARDIOVASCULAR CLAIM ATTACHED TO THIS GENOTYPE IS CORRECTED HERE. boudin2018 reports PROGRESSIVE
  AORTIC ROOT DILATATION in two of its four biallelic individuals, in a paper titled "Enhanced Growth and
  Connective Tissue Abnormalities". Blood pressure was normal in every patient in every family, so the
  mouse hypotension prediction stays refuted - but CORR-151 generalised that to "no cardiovascular
  phenotype", and that is withdrawn (CORR-159).
  TWO - NPR3 IS A FIRST-RANK HUMAN HEIGHT LOCUS AND, UNLIKE THE PHOSPHATASE GENES, IT ASSIGNS CLEANLY.
  GWAS Catalog returns 405 associations at NPR3, of which 95 are height or stature. Multiple independent
  leads reach p = 1E-300 in Yengo 2022 across 5.3 million people, with per-allele effects of 0.017 to 0.074
  SD. THEN THE CORR-142 TEST, WHICH IS WHERE THE PHOSPHATASE ARM DIED: every one of the four leads checked
  is a significant eQTL for NPR3 AND FOR NO OTHER GENE. PPP2R5D dissolved into a seven-gene locus in which
  CUL7 and PEX6 outranked it. NPR3 does not dissolve. The locus is the gene.
  THREE - AND THE DIRECTION DOES NOT AGREE WITH ITSELF, WHICH IS THE PART THAT MATTERS AND THE PART THAT
  CUTS AGAINST THE ROUTE. Orienting each eQTL to the HEIGHT-INCREASING allele: rs1173771 gives LESS NPR3 in
  taller people (NES minus 0.400 across five tissues) and rs10057069 the same (minus 0.190, three tissues) -
  both the direction a blocker needs. But rs3792752 gives MORE NPR3 in taller people (plus 0.189, one
  tissue) and rs11740580 likewise (plus 0.233, one tissue). TWO EACH WAY. The split tracks evidence weight -
  eight tissue-observations favour the drug direction against two - but it is not a clean answer, and it
  should not be reported as one.
  THE STRUCTURAL REASON NOT TO OVER-READ EITHER SIDE: GTEx CONTAINS NO CARTILAGE AND NO GROWTH PLATE. Every
  tissue in which these eQTLs were detected is nerve, testis, adrenal, lung or cultured fibroblast. The
  direction of an NPR3 eQTL in tibial nerve is not evidence about chondrocytes, and the tissue the question
  is about does not exist in the resource.
  WHAT THIS DOES TO THE ROUTE, STATED WITHOUT SPIN. It ADDS the human dosage series, which is new and is the
  best available model of what a partial blocker would do - about +1 SD per allele lost, no phenotype in
  carriers. It CONFIRMS NPR3 as a genuine human height gene at population scale with a clean causal
  assignment, which is strictly more than the phosphatase arm ever achieved. It DOES NOT confirm the
  direction at common-variant resolution, and anyone citing "NPR3 is a first-rank height locus" as support
  for a blocker must also cite that two of four leads point the other way.'
quantitative:
- parameter: 'THE GENE-DOSAGE SERIES - ZERO, ONE AND TWO NPR3 LOSS-OF-FUNCTION ALLELES IN ONE FAMILY'
  value: 'Biallelic proband (A315T/I432F), 14.7 y male: +3.93 SDS, 205.1 cm. HETEROZYGOUS father
    (A315T/wt), 43.6 y: +1.46 SDS, 194.2 cm. HETEROZYGOUS mother (I432F/wt), 47.2 y: +0.71 SDS, 175.2 cm.
    WILD-TYPE sister 1, 12.3 y: minus 0.92 SDS. WILD-TYPE sister 2, 10.8 y: +0.92 SDS. Target height for
    the sibship +0.8 SDS'
  unit: height SDS
  conditions: lauffer2022 Table 2, one family of mixed Dutch and Surinamese origin, full genotyping of
    proband, both parents and both sisters. Full text read at round 146; this table extracted at round 149.
  species: human
  source_ref: lauffer2022
  uncertainty: 'UPDATED ROUND 150 (CORR-160): THE CARRIER SERIES IS NO LONGER n = 2. boudin2018 supplies
    four more obligate carriers - family 1 father 185 cm (+0.1 SDS) and mother 180 cm (+1.4 SDS), who must
    each carry one allele because their sons are compound heterozygous (p.Ser148Pro / p.Tyr508*) and the
    parents are non-consanguineous; and family 2 father (estimated 165-170 cm) and mother (171 cm), obligate
    carriers of a homozygous consanguineous proband, with NO SDS reported and the father height ESTIMATED
    RATHER THAN MEASURED. With SDS available for four carriers the series reads +0.1, +0.71, +1.4, +1.46,
    mean about +0.92 - so the central estimate of roughly +1 SD per lost allele SURVIVES, but the range now
    includes a carrier at essentially the population mean, and family 2 parents are not obviously tall in
    any reference. THE PICTURE IS MORE HETEROGENEOUS THAN THE FIRST TWO CARRIERS SUGGESTED.
    THE ORIGINAL n = 2 CAVEATS STILL APPLY AND ARE COMPOUNDED BY ASCERTAINMENT. FOUR THINGS LIMIT IT AND ONE IS CIRCULAR. (a) The heterozygotes are the PARENTS, and the
    sibship target height of +0.8 SDS is COMPUTED FROM THEIR HEIGHTS, so comparing carriers to the target
    is circular; the only non-circular internal comparison is carriers against wild-type sisters.
    (b) THE SISTERS ARE CHILDREN, 12.3 and 10.8 years, so their height SDS is not attained adult height and
    one is likely prepubertal - comparing adult carriers to paediatric non-carriers is not a clean contrast.
    (c) Mixed ancestry - the father is of Surinamese descent and is scored against a Dutch reference.
    (d) small n per genotype class. THE DOSAGE PATTERN IS THEREFORE SUGGESTIVE, NOT ESTABLISHED. The
    boudin2018 carriers are now obtained; the moffatt2025 family is CLOSED - parental samples were reported
    unavailable, so there are no carrier genotypes or heights there and homozygosity was never confirmed as
    biparental. That is user-supplied and NOT independently verified by this atlas.
    AND THE BIALLELIC NUMBER IS A FLOOR: epiphysiodesis of BOTH KNEES at 13.5 y and both halluces at 12 y,
    with the trajectory still accelerating from +2.5 to +3.93 SDS. boudin2018 individual 4 likewise had
    surgery to stop hallux growth. The untreated biallelic phenotype is unobserved in anyone.
    AND THE CARDIOVASCULAR CLAIM ATTACHED TO THIS GENOTYPE HAS BEEN CORRECTED - SEE CORR-159. boudin2018
    reports PROGRESSIVE AORTIC ROOT DILATATION in 2 of its 4 biallelic individuals (individual 1 from +2.9
    to +3.78 SDS over one year; individual 3 from 3.2 to 3.55 cm over three years, with mitral valve
    prolapse), in a paper titled "Enhanced Growth and Connective Tissue Abnormalities". Blood pressure was
    normal in every patient in every family, so the HYPOTENSION prediction from the mouse null stays
    refuted - but "no cardiovascular phenotype" was my over-generalisation and is withdrawn.'
- parameter: 'NPR3 IS A FIRST-RANK HEIGHT LOCUS AND IT SURVIVES THE ASSIGNMENT TEST THAT KILLED PPP2R5D'
  value: 'GWAS Catalog: 405 associations at NPR3, 95 of them height or stature. Independent leads at
    p = 1E-300 in Yengo 2022 (5,314,291 people): rs3792752-G beta +0.032, rs7731703-T beta minus 0.0294,
    rs3762988-T +0.0276, rs11740580-A +0.0744 (MAF 0.043), rs1173771-A +0.038 to +0.0401, rs10057069-C
    +0.0316 (p = 4E-284). EQTL ASSIGNMENT: all four leads tested are significant eQTLs for NPR3 AND NO
    OTHER GENE'
  unit: p-value; SD of height per allele
  conditions: 'GWAS Catalog download API queried by this atlas 2026-08-09 on ensemblMappedGenes NPR3;
    GTEx v8 singleTissueEqtl API for chr5_32768528_A_G_b38, chr5_32814922_A_G_b38, chr5_32765351_C_A_b38 and
    chr5_32716483_T_C_b38.'
  species: human
  source_ref: gwas_catalog_npr3
  atlas_derived: true
  uncertainty: 'THE CLEAN ASSIGNMENT IS THE STRONGEST PART AND IT IS A GENUINE CONTRAST WITH THE PHOSPHATASE
    ARM. CORR-142 killed the PPP2R5D signal because the same variant was an eQTL for seven genes, with CUL7
    and PEX6 - both established human short-stature genes - outranking the nominal target. Applying the
    identical test to NPR3 returns NPR3 alone in every case. LIMITS: only four of the leads were tested, not
    all 95 associations; colocalisation proper was not run, and shared-eQTL is a weaker test than a
    colocalisation posterior; and eQTL detection is limited to the 49 GTEx tissues, so a variant acting
    through a gene not expressed in GTEx would be missed.'
- parameter: 'THE COMMON-VARIANT DIRECTION IS INCONSISTENT, AND GTEx HAS NO CARTILAGE'
  value: 'Effect on NPR3 expression of the HEIGHT-INCREASING allele, four independent leads:
    rs1173771-A LESS NPR3 (NES minus 0.400, 5 tissues - nerve, testis, adrenal, fibroblast, lung);
    rs10057069-C LESS NPR3 (minus 0.190, 3 tissues - nerve, testis, lung);
    rs3792752-G MORE NPR3 (plus 0.189, 1 tissue - tibial nerve);
    rs11740580-A MORE NPR3 (plus 0.233, 1 tissue - cultured fibroblasts).
    TWO EACH WAY; 8 tissue-observations favour LESS-NPR3-IS-TALLER against 2'
  unit: normalised effect size (NES) on NPR3 expression, oriented to the height-increasing allele
  conditions: GTEx v8, computed by this atlas 2026-08-09; allele orientation taken from the GWAS Catalog
    STRONGEST SNP-RISK ALLELE field and flipped where the height allele is the reference rather than the
    alternate.
  species: human
  source_ref: gtex_v8
  atlas_derived: true
  uncertainty: 'THIS IS THE RESULT THAT CUTS AGAINST THE ROUTE AND IT IS RECORDED FIRST-CLASS RATHER THAN AS
    A CAVEAT. The monogenic evidence is unambiguous - biallelic loss makes people tall - but the
    common-variant evidence does not reproduce that direction consistently, and a drug produces a partial
    reduction, which is nearer the common-variant regime than the knockout regime.
    THE STRONGEST SINGLE REASON NOT TO SETTLE IT EITHER WAY: GTEx CONTAINS NO GROWTH PLATE, NO CARTILAGE AND
    NO BONE. Every detection here is nerve, testis, adrenal, lung or cultured fibroblast. An eQTL direction
    in tibial nerve carries no information about chondrocytes, where NPR3 is CNP-inducible (agoston2007) and
    therefore under regulatory control that other tissues do not share. FURTHER LIMITS: the two leads
    favouring the drug direction have 5 and 3 supporting tissues against 1 and 1 for the opposing pair, so
    the split is not evenly weighted; the four leads are not demonstrated to be conditionally independent,
    so some may tag one signal; and no colocalisation was performed.'
localization:
- 'the eQTLs are detected in nerve, testis, adrenal, lung and fibroblast - the tissue the question concerns,
  growth plate cartilage, is absent from GTEx entirely'
human_evidence: direct
human_evidence_note: 'Entirely human - one fully genotyped family with a dosage series, and a 5.3-million-
  person GWAS with eQTL assignment. The weakness is n for the family and tissue relevance for the eQTLs.'
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: All of it is human. The risk here is tissue relevance within humans, not species
  transfer.
confidence: C
claim_grades:
- claim: NPR3 is a genuine human height gene whose GWAS signal assigns to NPR3 itself.
  grade: B
  basis: 'Multiple independent leads at p = 1E-300 in 5.3 million people, and all four leads tested are
    eQTLs for NPR3 and no other gene - the same test that dissolved the PPP2R5D signal into a seven-gene
    locus. Not A because only four leads were assignment-tested and formal colocalisation was not run.'
- claim: Losing one NPR3 allele makes a human about one standard deviation taller.
  grade: D
  basis: 'A monotonic dosage series in ONE family - 0 alleles about 0 SDS, 1 allele +0.71 and +1.46, 2
    alleles +3.93 - with n = 2 heterozygotes, a circular target-height comparison, adult carriers contrasted
    against paediatric non-carriers, and mixed ancestry. Suggestive and cheap to settle with carrier heights
    from the other two published families.'
- claim: Human common-variant data confirm that reducing NPR3 increases height.
  grade: D
  basis: 'THEY DO NOT, CONSISTENTLY. Two of four leads point that way (with 5 and 3 supporting tissues) and
    two point the opposite way (1 tissue each). GTEx has no cartilage, so none of it is measured in the
    relevant tissue. Recorded as unresolved rather than as support.'
- claim: The published biallelic NPR3 heights bound the phenotype.
  grade: X
  basis: 'They are FLOORS. Both published biallelic cases were surgically truncated - the lauffer2022
    proband had epiphysiodesis of both knees at 13.5 y with his trajectory still accelerating from +2.5 to
    +3.93 SDS, and the atlas records the same for moffatt2025. The untreated biallelic phenotype has never
    been observed.'
