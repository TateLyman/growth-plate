id: round453_the_recessive_instrument_confirms_r432_and_names_the_scan_nobody_has_run
name: 'R453 - the recessive instrument run at population scale: homozygosity LOWERS height at P below 1e-300 across
  354,224 people and four continental groups, first-cousin offspring are 1.2 cm shorter, and the authors read it
  as evidence that TALL STATURE HAS BEEN POSITIVELY SELECTED - which confirms R432 and explains why the recessive
  class keeps returning shortening genes'
