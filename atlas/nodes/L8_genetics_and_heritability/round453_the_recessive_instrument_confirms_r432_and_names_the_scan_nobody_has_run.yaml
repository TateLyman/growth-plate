summary: 'R432 concluded that the recessive class of height genes is real, large and nearly disjoint from kosmicki2026''s
  207 - and that its content is overwhelmingly oestrogen-deficiency and connective-tissue biology this file already
  works. It reached that from HPO disease annotations. The population-scale instrument says the same thing quantitatively
  and adds a reason.


  ONE - THE DIRECTION AND THE MAGNITUDE. joshi2015: runs of homozygosity against 16 health-related traits in 354,224
  individuals from 102 cohorts. HEIGHT IS THE STRONGEST ASSOCIATION IN THE STUDY AT P BELOW 1e-300, increased homozygosity
  associated with DECREASED height, EQUIVALENT TO THE OFFSPRING OF FIRST COUSINS BEING 1.2 CM SHORTER. Similar effect
  sizes across four continental groups and across populations with different baseline homozygosity, which the authors
  take as evidence that homozygosity itself rather than confounding drives it. Notably, blood pressure and LDL showed
  nothing, so this is not a generic inbreeding-depression artefact spread across all traits.


  TWO - AND THE AUTHORS'' OWN INTERPRETATION IS THE USEFUL PART FOR THIS FILE. Directional dominance is predicted
  for traits under directional evolutionary selection, so they conclude that INCREASED STATURE HAS BEEN POSITIVELY
  SELECTED IN HUMAN EVOLUTION. That is a structural reason why the recessive instrument returns shortening genes
  almost exclusively: selection has already driven the height-increasing alleles toward fixation and left the recessive
  load on the other side. R432 observed the asymmetry (HPO: 1,483 short-stature genes against 180 tall) and CORR-295
  explained it by ascertainment - being short brings a child to a clinic. joshi2015 supplies a second, non-ascertainment
  reason, and the two are additive.


  THREE - THE SCAN THAT WOULD ACTUALLY TEST R432 EXISTS AS A COHORT AND HAS NEVER BEEN RUN. koch2026: the Pakistan
  Genome Resource, 173,303 participants with high familial relatedness, collectively carrying naturally occurring
  HOMOZYGOUS loss-of-function variants in 6,476 GENES, built explicitly because such variants mimic pharmacological
  inhibition. CORR-358 says a heterozygous burden test cannot contain a recessive gene by construction; this is
  the cohort in which that constraint lifts. But F_ROH is an AGGREGATE - it says the recessive load lowers height
  on average, not which genes. A GENE-LEVEL HOMOZYGOUS-LoF SCAN AGAINST HEIGHT HAS NEVER BEEN PUBLISHED IN ANY COHORT.
  That is the largest cheap gap this round found, it needs no new data collection, and it is the only instrument
  that could return a recessive gene whose loss LENGTHENS.


  FOUR - A NUMBER I AM NOT ASSERTING. An F_ROH-on-height effect of -0.05 SD at P=1.6e-48 in the PGR was reported
  to me second-hand and is NOT in koch2026''s abstract. It is recorded as value_unverified and the height claim
  here rests on joshi2015, which is verbatim.'
