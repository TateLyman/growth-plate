id: round421_the_cnp_compartment_numbers_were_artefactual_and_r318_got_the_right_verdict_from_the_wrong_gene
name: >-
  R421: the R406 correction re-run on the CNP axis and FGFR3, with the positive control declared first
  and passed to six decimals. NPR3 moves from -4.12 percent trunk to 59.2 percent at P=4.9e-90 - the
  largest compartment artefact yet found, on the gene that carried the verdict. But NPPC and NPR2, the
  two genes that actually constitute the axis vosoritide acts on, come back mildly LIMB-leaning, so the
  verdict survives while its evidence does not. What does NOT survive is the FGFR3-versus-CNP comparison
aliases:
  - CNP compartment correction
  - NPR3 trunk artefact
  - NPR2 compartment first assignment
  - FGFR3 73 percent trunk withdrawn
type: process
layer: L8
stub: false
summary: >-
  An external audit of this repository observed that R406 demonstrated R318's compartment method to be
  selection on the outcome, corrected two genes, and stopped - and that NO CNP GENE WAS EVER CORRECTED
  while NPR2, the receptor vosoritide actually binds, was never assessed at all. R421 runs the
  correction on NPPC, NPR2, NPR3 and FGFR3, with NPR1 as a comparator.

  ⭐ METHOD AND THE GUARD, DECLARED BEFORE ANY CNP RESULT WAS LOOKED AT. Three absolute traits from one
  cohort of 451,921 Europeans - GCST90728584 standing height, GCST90728586 sitting height, GCST90728587
  leg length. Each gene's STANDING-HEIGHT lead is taken, then the same variant is read out of the other
  two scans and aligned to the height-increasing allele. Regions of plus or minus 150 kb were pulled by
  parsing the tabix linear index and issuing HTTP range requests, because the local htslib has no libcurl.
  The header was read rather than assumed: chromosome, base_pair_location, effect_allele, other_allele,
  beta, standard_error, effect_allele_frequency, p_value, variant_id, rsid, info, rs_id,
  hm_coordinate_conversion, hm_code. Build was resolved empirically - base_pair_location is GRCh38 while
  the position embedded in variant_id is GRCh37, confirmed because R406's published SCUBE3 lead is
  chr6:35,313,194 with variant_id 6_35280971_T_C.
  ⭐ THE GUARD PASSED EXACTLY. Regenerated through the new extraction path, SCUBE3 returns 29.5 percent
  trunk with sitting height +0.045480 at P=1.4e-17, standing +0.098348 at P=8.2e-94 and leg +0.108591 at
  P=9.1e-98; CLEC11A returns 18.0 percent with sitting +0.021065 at P=0.12. Both reproduce the published
  R406 values to six decimal places, so the CNP numbers from the same path are admissible.

  ⭐⭐⭐ ONE - THE HEADLINE, AND IT IS THE LARGEST COMPARTMENT ARTEFACT THIS FILE HAS FOUND.
  NPR3 was recorded in R318 at a sitting-height beta of -0.00195 and -4.12 percent trunk, LIMB-DOMINANT.
  Corrected it is a sitting-height beta of +0.036334 AT P=4.9e-90 AND 59.2 PERCENT TRUNK. The trunk arm
  is roughly nineteen times larger and of the opposite sign, and it is now one of the most significant
  compartment arms in the atlas. The auditor predicted this on the arithmetic alone: R318 gave NPR3
  -4.12 percent and SCUBE3 -4.05 percent, the same number to two significant figures, and SCUBE3's was
  already proven artefactual.

  ⛔ TWO - AND THE OTHER SIDE OF THE COMPARISON MOVES TOO, AGAINST THE STACK'S OWN REASONING.
  FGFR3 was 73.43 percent trunk in R318 and is the line CLAUDE.md uses to say the FGFR3 arm reaches the
  spine. Corrected it is 49.1 PERCENT - dead average. So the pro-erdafitinib half of the compartment
  comparison was computed by the same retired method and does not survive it either.
  → ON CORRECTED NUMBERS NPR3 (59.2 percent) IS MORE TRUNK-DIRECTED THAN FGFR3 (49.1 percent). The
  compartment argument that ranked the FGFR3 arm above the CNP arm is inverted by its own data.

  ⭐⭐ THREE - BUT THE VERDICT ON THE ARM SURVIVES, BY A DIFFERENT ROUTE, AND THIS IS THE HONEST RESULT.
  The axis is not uniform, and the split is mechanistically sensible:
  · NPPC, the LIGAND - 30.9 percent trunk, limb-leaning (R318 had 21.66 percent, so this one moved little).
  · NPR2, the SIGNALLING RECEPTOR vosoritide binds - 29.8 percent trunk, limb-leaning. NEVER PREVIOUSLY
    ASSESSED IN ANY ROUND. This is the first compartment assignment of the actual drug target.
  · NPR3, the CLEARANCE receptor - 59.2 percent trunk. Its job is to REMOVE CNP, so there is no reason its
    compartment should equal the signalling arm's, and R318 built the case on the one gene in the axis
    whose direction does not represent the axis.
  → R318 REACHED THE RIGHT VERDICT FROM THE WRONG GENE. The two genes that constitute the pathway
  vosoritide acts through are both mildly limb-leaning, which supports the original conclusion - but no
  round had ever measured either of them correctly, and the gene that was quoted was inverted.

  ⭐ FOUR - THE BASE-RATE CHECK, RUN ON THE CORRECTED METHOD'S OWN 22 GENES (round323).
  Distribution of percent trunk: median 45.0, mean 41.0, range 8.2 (LTBP2) to 55.2 (TET1), with 15 of 22
  below 50 percent. So the corrected method is itself mildly limb-leaning on an unrelated gene set, and
  the sign alone is not informative - magnitude against that distribution is.
  · NPR3 at 59.2 percent EXCEEDS ALL TWENTY-TWO. It is the most trunk-dominant value the corrected method
    has produced anywhere in this atlas.
  · NPPC 30.9 and NPR2 29.8 sit below the median and are unremarkable - comparable to FBN2 at 28.6.
  · FGFR3 49.1 and NPR1 54.0 are ordinary, sitting just above the median.

  ⛔ FIVE - WHAT THIS DOES NOT TOUCH, STATED SO NOBODY OVERREADS IT.
  Three lines against the CNP arm are PHARMACOLOGICAL and are untouched by any of this: vosoritide's
  L1-L4 null in the EMA report, the axial null outright in monkeys, and the rat axial dose that works
  causing scoliosis, kyphosis and fractures. Those are direct and they remain the actual case.
  ⚠ Every lead here is a WINDOW lead at plus or minus 150 kb, not a gene lead - NPR2's is about 102 kb
  from the gene, NPPC's about 125 kb, and FGFR3's about 46 kb upstream in a gene-dense region containing
  NSD2 and LETM1. Units are inverse-normalised SD, not centimetres. A common regulatory variant need not
  allocate height the way a coding or pharmacological perturbation does.
  ⚠ R317 shares the defect class - its outcome variable IS the sitting-height ratio - and was not re-run
  here. Whether that makes it more or less exposed than R318 is unresolved.

  ⭐ WHAT R421 SETTLES. The compartment case against the CNP arm as WRITTEN was built on a number that was
  inverted, and the compartment case FOR the FGFR3 arm was built on a number that was inflated. The
  conclusion about the CNP axis nonetheless holds on the corrected data, because the ligand and the
  signalling receptor are both limb-leaning. The comparison BETWEEN the two arms does not hold, and should
  not be restated. NPR2 now has its first compartment assignment in any round.
