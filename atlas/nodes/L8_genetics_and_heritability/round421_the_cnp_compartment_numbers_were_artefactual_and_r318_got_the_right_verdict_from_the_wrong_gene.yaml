confidence: B
claim_grades:
  - claim: R318's CNP compartment numbers are artefactual
    grade: A
    basis: >-
      the same tool and the same cohort, with the selection step corrected, moves NPR3 from -4.12 to
      59.2 percent trunk, and the positive control reproduces the published values to six decimals
  - claim: NPR3's height allele is trunk-dominant
    grade: B
    basis: >-
      sitting-height arm +0.036334 at P=4.9e-90, exceeding all 22 genes in the corrected method's
      reference distribution. A window lead, not a gene lead
  - claim: The CNP signalling axis is limb-leaning
    grade: C
    basis: >-
      NPPC 30.9 percent and NPR2 29.8 percent, both below the method's own median of 45.0 but well inside
      its observed range, so this is an unremarkable rather than an extreme value
  - claim: The FGFR3 arm reaches the spine preferentially
    grade: E
    basis: >-
      WITHDRAWN as a GWAS claim. 73.43 percent was computed by the retired method; corrected it is 49.1
      percent, at the median. The direct evidence for FGFR3 axial reach is dabogratinib's L4-L6 result,
      which this does not touch
  - claim: The compartment comparison ranking the FGFR3 arm above the CNP arm holds
    grade: E
    basis: >-
      NO. On corrected numbers NPR3 is more trunk-directed than FGFR3. Both sides of that comparison were
      computed by the retired method
  - claim: Vosoritide should be restarted on these data
    grade: E
    basis: >-
      NOT ESTABLISHED HERE. The three pharmacological lines - EMA L1-L4 null, monkey axial null, rat axial
      scoliosis and kyphosis and fractures - are untouched and remain the actual case against the arm
