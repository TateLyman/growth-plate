claim_grades:
- claim: The narrow-sense heritability of adult height is approximately 0.7-0.8.
  grade: A
  basis: Twin pooling across 143,390 pairs (jelenkovic2016a) and an independent sibling IBD estimate
    0.76 +/- 0.05 that does not use the equal-environments assumption (sidorenko2024).
- claim: Height heritability rises from birth through adolescence rather than being constant.
  grade: A
  basis: Meta-analysis of 28 twin and 26 family studies (dewau2025) and pooled analysis of 45
    twin cohorts with 180,520 paired measurements (jelenkovic2016), by independent groups and
    designs.
- claim: Height heritability does not increase as living standards improve.
  grade: A
  basis: 143,390 twin pairs across birth years 1886-1994 and three geographic-cultural regions
    show no secular pattern (jelenkovic2016a).
