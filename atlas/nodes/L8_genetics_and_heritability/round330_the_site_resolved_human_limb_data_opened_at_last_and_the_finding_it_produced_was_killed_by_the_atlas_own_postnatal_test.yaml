- NPR3 is a distal femur gene
- the knee-elbow brake mirror
type: hypothesis
layer: L8
stub: false
summary: >-
  THE OPERATOR SUPPLIED SEVEN richard2025 SUPPLEMENT FILES ON 2026-08-12 AND NOT ONE HAD BEEN OPENED. They
  contain what this atlas has never had: human embryonic limb ATAC-seq, RNA-seq and height-GWAS integration
  resolved to EIGHT INDIVIDUAL GROWTH PLATES - distal and proximal femur, tibia, humerus and radius - plus
  joint-level differential expression for knee, hip, shoulder and elbow and a hindlimb-versus-forelimb
  contrast. Every compartment argument in rounds 317, 318 and 323 was fought with adult GWAS on whole-body
  proportions. This is the tissue.

  ONE - NPR3 IS AN ALMOST PRIVATE REGULATORY FEATURE OF THE DISTAL FEMUR. In richard2025's own integrated
  per-site prioritisation, NPR3 is the FOURTH-RANKED gene for the distal femur, and the separation is not
  marginal: accessibility percentile 0.93 and site GWAS score 0.94 AT THE DISTAL FEMUR, against 0.02 to
  0.08 at every one of the seven other plates, with expression 0.79 there against 0.10 to 0.22 elsewhere
  (log2FC +1.50, padj 9.5e-05, baseMean 95). Its AVG_EXP_GWAS is 0.04, so this is NOT a gene with diffuse
  height association - the signal is specific to distal femur regulatory elements. NPR3 appears in only one
  of the eight site blocks. No other CNP-axis gene appears in any block. THE DISTAL FEMUR IS THE FASTEST
  GROWING PLATE IN THE HUMAN BODY AND HALF OF THE KNEE, WHICH IS THIS SUBJECT'S DEMONSTRABLY LIVE
  COMPARTMENT - so for one afternoon this looked like the finding that inverts round 302's demotion of NPR3.

  TWO - AND THE JOINT-LEVEL CONTRASTS GAVE IT A COHERENT MECHANISM. Crossing this atlas's own target list
  against the four joint contrasts returns an internally consistent brake map. AT THE KNEE: NPPC +1.22
  (padj 2.5e-04) and NPR3 +0.97 (2.1e-03) UP, HHIP -0.92 (2.2e-07) and STC2 -0.56 (3.7e-02) DOWN. AT THE
  ELBOW, THE EXACT MIRROR: NPR3 -1.27, HHIP +1.26, STC2 +1.20, PAPPA +0.79, all at padj 1.2e-05 or better.
  The hindlimb-versus-forelimb contrast agrees independently - HHIP -1.05, STC2 -1.13, NPR3 +0.88. So the
  fast lower-limb plates run LOW secreted brakes and HIGH CNP tone, and the slow upper-limb plates run the
  opposite. Four of this atlas's targets fall out of an analysis that knew nothing about them.

  THREE - THEN THE ATLAS'S OWN POSTNATAL TEST KILLED THE LEAD, IN THE SAME ROUND. CORR-299 says the valid
  question is never "is the gene there" but "is the gene still doing work in an OPEN PLATE", and
  richard2025 is HUMAN EMBRYONIC limb at Carnegie stages E54 and E67, roughly eight to nine weeks
  post-conception. Run against GSE288028 - 14 postnatal human growth plates, 79,934 cells - the CNP axis
  does not carry: NPR3 is 5 of 14 samples at 1.63 CPM in at most 3.8 per cent of cells, and NPPC is 0 of 14
  at 0.12 CPM, which this atlas established in round 308 and confirms again here. A gene that is 1.63 CPM
  postnatally cannot be a knee-directed target at bone age 16 on the strength of an embryonic patterning
  signal. THE FINDING IS A DEVELOPMENTAL RESULT, NOT A THERAPEUTIC ONE, AND ROUND 302'S DEMOTION OF NPR3
  STANDS - now by an independent route that has nothing to do with round 302's non-additivity argument.

  FOUR - WHAT SURVIVES BOTH TESTS, AND IT IS THE AXIS FROM THE PREVIOUS ROUND. Three genes are BOTH
  site-patterned in embryonic limb AND robustly present in postnatal human growth plate: HHIP (12/14, 21.4
  CPM, up to 44.7 per cent of cells), STC2 (12/14, 18.1 CPM, up to 59.8 per cent) and PAPPA (12/14, 88.5
  CPM, up to 53.0 per cent). STC2 and PAPPA are round 328's axis, and this is independent tissue-level
  corroboration arriving one round later from a dataset that was never opened when round 328 was written.
  PAPPA also appears in its own right as the sixth-ranked gene for the PROXIMAL RADIUS.

  FIVE - AND A COMPARTMENT WARNING THAT CUTS AGAINST BOTH SURVIVORS, RECORDED BECAUSE IT IS INCONVENIENT.
  HHIP and STC2 are both BRAKES whose loss makes humans taller (+9.92 cm and +1.37 cm). Both are configured
  LOW in the fast lower-limb plates and HIGH in the slow upper-limb plates. If those genes set growth rate,
  the variance they control is concentrated where growth is slow - the elbow and shoulder - AND THE UPPER
  LIMB CONTRIBUTES NOTHING TO STANDING HEIGHT. That is a prediction, not a result: a relative expression
  contrast does not establish where a systemic blocker would have its largest absolute effect, and a brake
  that is already low can still be lowered further. But it is the first tissue-level reason to doubt that
  an anti-HHIP or anti-STC2 agent would act preferentially on the segments that carry stature, and it
  should be tested before either is promoted further.
quantitative:
- parameter: >-
    NPR3 IS SITE-PRIVATE TO THE DISTAL FEMUR - the largest site specificity for any atlas target in the
    dataset
  value: >-
    distal femur accessibility percentile 0.93 and site GWAS score 0.94, against accessibility 0.03, 0.05,
    0.08, 0.05, 0.02, 0.03, 0.05 and site GWAS 0.04, 0.04, 0.08, 0.04, 0.03, 0.03, 0.05 at the seven other
    plates; expression score 0.79 at distal femur against 0.12 to 0.22 elsewhere; AVG_EXP_GWAS 0.04;
    log2FoldChange +1.496, padj 9.51e-05, baseMean 95.0. Ranked 4th of 14 nominated genes for that site
  unit: percentile scores, log2 fold change
  conditions: >-
    richard2025 supplement 3, "Tissue-Specific Ranking" sheet - integrated per-site prioritisation combining
    site-specific chromatin accessibility, differential expression and height GWAS signal across eight human
    embryonic limb growth plates at Carnegie stages E54 and E67.
  species: human
  source_ref: richard2025
  uncertainty: >-
    HUMAN EMBRYONIC LIMB AT EIGHT TO NINE WEEKS POST-CONCEPTION - this is a developmental patterning dataset
    and the contrast between plates is as much about positional identity as about growth rate, which is why
    HOX genes dominate several of the eight blocks. The exact normalisation behind the accessibility and
    GWAS percentile columns is taken as printed and not re-derived here. Sample numbers per site are small.
    AND THE DECISIVE LIMIT IS CORR-299, APPLIED BELOW - the signal does not persist postnatally.
- parameter: >-
    THE JOINT-LEVEL BRAKE MAP - knee and elbow are mirror images on four atlas targets
  value: >-
    KNEE - NPPC +1.219 (padj 2.47e-04), NPR3 +0.966 (2.14e-03), HHIP -0.919 (2.15e-07), STC2 -0.561
    (3.70e-02), LOXL2 -0.347 (1.14e-05). ELBOW - HHIP +1.259 (1.39e-14), PAPPA +0.785 (4.56e-13), STC2
    +1.200 (2.58e-08), NPR3 -1.270 (1.20e-05), IHH +1.346, SFRP1 -0.864, FGFR3 +0.378. HINDLIMB versus
    FORELIMB - HHIP -1.050 (1.11e-09), STC2 -1.125 (2.28e-08), NPR3 +0.877 (6.28e-03), PAPPA -0.474,
    LOXL2 -0.207, IHH -0.855
  unit: log2 fold change, with adjusted P
  conditions: >-
    richard2025 supplement 2, KNEE_DE (1,929 genes), HIP_DE (777), SHOULDER_DE (5,142), ELBOW_DE (3,622) and
    HIND-vs-FORE (2,012) sheets; 24 atlas target genes queried, hits reported in full with no selection on
    direction.
  species: human
  source_ref: richard2025
  uncertainty: >-
    THESE ARE REGIONAL CONTRASTS WITHIN EMBRYONIC LIMB, so a gene "up at the knee" is up relative to other
    limb regions and not against any absolute standard. Joint-region dissection includes more than growth
    plate. The knee and hind-vs-fore contrasts share samples and are therefore not independent of each
    other, though the elbow mirror is a separate contrast and agrees. NPPC's baseMean is 8.4, which is very
    low, so its large fold change rests on few counts.
- parameter: >-
    CORR-299 APPLIED - the CNP axis does not survive into the postnatal plate, and the three brakes do
  value: >-
    postnatal human growth plate - NPR3 5/14 samples, 1.63 CPM, at most 3.8 per cent of cells; NPPC 0/14,
    0.12 CPM, 0.5 per cent; NPR2 10/14, 7.50 CPM. Against them - HHIP 12/14, 21.39 CPM, up to 44.7 per cent
    of cells; STC2 12/14, 18.08 CPM, up to 59.8 per cent; PAPPA 12/14, 88.45 CPM, up to 53.0 per cent;
    LOXL2 12/14, 186.34 CPM
  unit: samples detected of 14, median CPM, maximum per cent of cells
  conditions: >-
    GSE288028, 14 postnatal human growth-plate samples, 79,934 cells, presence and abundance computed at
    round 308.
  species: human
  source_ref: chu2026
  uncertainty: >-
    PSEUDOBULK TRANSCRIPT WITH NO ZONE AND NO CELL-TYPE RESOLUTION, and for secreted proteins in particular
    local concentration need not track local transcription. Droplet protocols under-recover terminal
    hypertrophic chondrocytes. The comparison across genes is within one dataset and one normalisation,
    which is what makes the 1.63 against 21.4, 18.1 and 88.5 contrast usable. NPPC at 0/14 reproduces the
    round 308 result and the GSE9160 result 19 years apart on different platforms.
localization:
- 'distal femur growth plate: where NPR3 accessibility and site GWAS are 0.93 and 0.94 - embryonic'
- 'postnatal human growth plate: where NPR3 is 1.63 CPM and HHIP, STC2 and PAPPA are 21, 18 and 88'
- 'upper limb plates (elbow, shoulder): where the HHIP and STC2 brakes are configured HIGH'
human_evidence: direct
human_evidence_note: >-
  Both datasets are human. The site-resolved data are human EMBRYONIC limb; the postnatal check is human
  postnatal growth plate. No animal data are used in this round.
species_basis:
- human
translation_risk: high
translation_risk_reason: >-
  The lead result is embryonic and the target population is a skeletally mature adolescent. That gap is not
  a species gap but a developmental one, and this round measures it rather than assuming it away - which is
  what turns the finding from a lead into a negative.
confidence: C
confidence_reason: >-
  The site-specificity measurement and the joint-level map are clean and graded higher on their own terms;
  the node is capped at C because its therapeutic implication is negative and its one positive - independent
  corroboration of the STC2/PAPPA axis - is a presence and patterning result with no length endpoint.
claim_grades:
- claim: >-
    NPR3's distal-femur specificity rehabilitates the CNP arm as a knee-directed lever for this subject.
  grade: X
  basis: >-
    NO, AND THE ATLAS'S OWN TEST IS WHY. richard2025 is human EMBRYONIC limb at eight to nine weeks
    post-conception. CORR-299 asks whether the gene is still doing work in an OPEN plate, and postnatally
    NPR3 is 5 of 14 samples at 1.63 CPM in at most 3.8 per cent of cells while NPPC is 0 of 14. Round 302's
    demotion of NPR3 stands, now by a route independent of its non-additivity argument.
- claim: >-
    NPR3 is a distal-femur gene in the developing human limb.
  grade: B
  basis: >-
    Accessibility 0.93 and site GWAS 0.94 at the distal femur against 0.08 or less at all seven other
    plates, with AVG_EXP_GWAS 0.04 showing the association is not diffuse, and NPR3 appearing in only one of
    eight site blocks. Corroborated independently by the joint contrasts, where NPR3 is +0.97 at the knee
    and -1.27 at the elbow.
- claim: >-
    Secreted brakes and CNP tone are configured oppositely in fast lower-limb and slow upper-limb plates.
  grade: C
  basis: >-
    Knee HHIP -0.92 and STC2 -0.56 with NPPC +1.22 and NPR3 +0.97; elbow the mirror at HHIP +1.26, STC2
    +1.20, NPR3 -1.27; hind-versus-fore agreeing at HHIP -1.05, STC2 -1.13, NPR3 +0.88. Graded C because
    these are regional contrasts in embryonic limb, the knee and hind-vs-fore contrasts share samples, and
    dissected joint regions contain more than growth plate.
- claim: >-
    An anti-HHIP or anti-STC2 agent would act preferentially on the segments that carry standing height.
  grade: E
  basis: >-
    UNTESTED AND THE TISSUE DATA POINT THE OTHER WAY. Both brakes are configured LOW in the fast lower-limb
    plates and HIGH in the slow upper-limb plates, and the upper limb contributes nothing to standing
    height. A relative expression contrast does not establish where a systemic blocker acts most in absolute
    terms, and a low brake can still be lowered - so this is a prediction to test, not a result. It is
    recorded because it is inconvenient for two targets this file likes.
- claim: >-
    The richard2025 DECONVOLUTION sheet resolves CORR-339's axial contamination question.
  grade: X
  basis: >-
    IT DOES NOT - the sheet deconvolves the LIMB bulk samples (proximal humerus, distal femur and so on) and
    contains no lumbar or thoracic rows. CORR-339 stands and the axial ATAC sheets remain unusable for
    cross-site contrasts.
