id: round330_the_site_resolved_human_limb_data_opened_at_last_and_the_finding_it_produced_was_killed_by_the_atlas_own_postnatal_test
name: >-
  ROUND 330 - the operator-supplied richard2025 supplements opened for the first time. They give the first
  SITE-RESOLVED human integration of chromatin, expression and height GWAS per individual growth plate.
  NPR3 turns out to be an almost private regulatory feature of the DISTAL FEMUR - accessibility 0.93 and
  GWAS 0.94 there against 0.08 or less at all seven other sites - and the atlas's own CORR-299 postnatal
  test then kills it, because NPR3 is 5/14 at 1.63 CPM in postnatal growth plate. What survives both tests
  is HHIP, STC2 and PAPPA
aliases:
- round 330
- richard2025 opened
