contradicts: >-
  Does not overturn a node. It CONFIRMS round 302's demotion of NPR3 by an independent route - round 302
  demoted it for non-additivity against a CNP analogue, and this round finds the postnatal transcript is
  1.63 CPM in 5 of 14 samples, so the demotion no longer depends on the non-additivity argument at all. It
  independently corroborates round 328's STC2 and PAPPA axis at the tissue level from a dataset that had
  never been opened when round 328 was written. And it puts the first tissue-level caution against HHIP and
  STC2 as levers on STANDING height, because both brakes are configured high in the upper limb.
