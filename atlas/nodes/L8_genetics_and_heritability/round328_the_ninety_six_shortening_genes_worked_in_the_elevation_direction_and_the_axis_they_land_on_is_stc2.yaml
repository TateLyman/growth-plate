id: round328_the_ninety_six_shortening_genes_worked_in_the_elevation_direction_and_the_axis_they_land_on_is_stc2
name: >-
  ROUND 328 - CORR-303's standing instruction executed. The 96 human genes whose LOSS SHORTENS have only
  ever been used here as a contraindication screen; worked in the ELEVATION direction they converge on one
  enzymatic step, and that step has a bidirectional human control structure in a single dataset - PAPPA
  minus 4.57 cm, PAPPA2 minus 2.10 cm, and their endogenous inhibitor STC2 PLUS 1.37 cm at P = 4.5e-34.
  STC2 has never been a target in this atlas. It is secreted, it is in the tissue, and the therapeutic
  direction is to block it
aliases:
- round 328
- the elevation direction
- STC2
- stanniocalcin-2
- the ISPa axis
- IGFBP4-STC2-PAPP-A
type: hypothesis
layer: L8
stub: false
summary: >-
  CORR-303 HAS SAID "WORK BOTH SIGNS" SINCE ROUND 287 AND IT WAS NEVER DONE. `kosmicki2026` gives 135 genes
  with a pure-pLoF row at P less than 1e-4: 39 lengthen on loss and 96 SHORTEN. Round 300 used the 96 once,
  as a contraindication screen - asking only which of them have approved INHIBITORS, which would be drugs to
  avoid. Nobody has ever asked the other question: for a gene whose loss shortens, the therapeutic direction
  is to RAISE its function, and the pharmacopoeia's supply-side tools - substrate donors, cofactors,
  recombinant proteins, and blockade of an endogenous INHIBITOR - are a different shelf from the inhibitors
  round 298 found empty. THIS IS ALSO THE SHAPE OF THE ONLY ROUND IN THIS FILE THAT EVER PRODUCED AN
  OBTAINABLE COMPOUND: rounds 320 and 321 took SLC13A1, whose loss shortens, and arrived at oral sodium
  sulfate by supplying the substrate rather than inhibiting anything.

  ONE - WHERE THE 96 CONVERGE. Sorted by effect, the largest are structural and undruggable - ACAN minus
  16.60, IHH minus 13.10, SHOX minus 12.00, COL1A1 minus 10.40. But one MODULE appears four times with a
  coherent mechanism and a bidirectional control structure, and it is the regulation of IGF-1
  BIOAVAILABILITY by proteolysis:
  PAPPA minus 4.57 cm (P = 1.9e-19, 194 hets), the metalloproteinase that cleaves IGFBP-4 to release bound
  IGF-1 in tissue; PAPPA2 minus 2.10 cm (P = 1.7e-13, 610 hets), which cleaves IGFBP-3 and -5; IGFALS minus
  0.92; IGF1 minus 6.41, IGF1R minus 5.23 (P = 4.0e-43) and IRS1 minus 5.23 - ligand, receptor and adaptor
  all load-bearing.
  AND THE INHIBITOR OF THAT PROTEASE RUNS THE OTHER WAY. STC2 - stanniocalcin-2, a secreted glycoprotein
  whose only well-characterised function is INHIBITING the pappalysins - is PLUS 1.37 cm at P = 4.51e-34
  across 3,927 carriers. LOSE THE PROTEASE AND YOU ARE SHORTER; LOSE THE PROTEASE'S INHIBITOR AND YOU ARE
  TALLER. That is the NPR2 / NPR3 control structure - this atlas's own standard for a validated axis - on a
  third axis, in one dataset and one ascertainment. STC2's row is among the best-powered in the entire
  table, and this atlas has never named STC2 as a target in any round.

  TWO - THE RECEIVER TEST PASSES COMPLETELY, AND IT DELIVERS THE ROUND'S SHARPEST CORRECTION. In GSE288028,
  14 postnatal human growth-plate samples and 79,934 cells: PAPPA 88.5 CPM in 12 of 14, up to 53.0 per cent
  of cells; STC2 18.1 CPM in 12 of 14, up to 59.8 per cent of cells; IGFBP4 - PAPP-A's substrate - 34.5 CPM
  in 12 of 14; IGF1R 80.4 CPM in 34.6 per cent of cells. Ligand, substrate, protease, inhibitor and receptor
  are ALL present in the target tissue. IGFALS is 0 of 14 at 0.049 CPM, independently reconfirming this
  atlas's own size-filter argument that the plate cannot assemble or admit the 140-150 kDa ternary complex
  and only ever sees the free fraction.
  AND PAPPA2 IS 3.8 CPM. THE PROTEASE THIS ATLAS ALREADY TESTED IN A WILD-TYPE ANIMAL IS THE MINOR
  PAPPALYSIN OF THIS TISSUE, TWENTY-THREE-FOLD BELOW PAPP-A - and the human burden effects agree with the
  abundance ordering, minus 4.57 against minus 2.10.

  THREE - WHICH MATTERS BECAUSE THE WILD-TYPE ARM WAS RUN, AND IT FAILED. `fernndezarjona2026` gave
  recombinant PAPP-A2 to wild-type mice from PND5 to PND35 and, on the supplementary tables this atlas
  retrieved in CORR-108, body length did NOT rise in either sex - males 15.33 saline against 15.15 treated,
  numerically lower - while rhGH did. What survived was a PROPORTION shift, femur-to-body 0.72 to 0.75 and
  tibia-to-body 0.93 to 0.97 at p less than 0.001 with total length unchanged: limb lengthened relative to
  trunk. THAT IS A REAL PRIOR AGAINST THIS AXIS AND IT IS RECORDED FIRST, BEFORE THE ARGUMENT FOR IT. It is
  also doubly unfavourable, because rounds 317 and 318 say the residual here is TRUNK-dominant and this is
  redistribution toward LIMB.
  TWO THINGS SEPARATE THE PROPOSAL FROM THAT FAILURE, AND BOTH ARE THIS FILE'S OWN RULES. The first is the
  abundance correction above: the wrong pappalysin was supplied. The second is CORR-300, the rule this atlas
  has now derived three independent times - REMOVING A SECRETED EXTRACELLULAR MODULATOR IS NOT THE SAME
  INTERVENTION AS FLOODING WITH AGONIST. Injecting recombinant protease is the flood. Blocking STC2 shifts a
  setpoint inside a feedback-regulated envelope by removing a secreted brake, which is the category CORR-300
  says ADDS length while the other two subtract it. CORR-300 predicted the flood would fail.

  FOUR - LOSING STC2 MAKES NORMAL ANIMALS BIGGER IN THREE SPECIES, AND NOT ONE MEASUREMENT IS A BONE LENGTH.
  `wang2025stc2a`: genetic deletion of Stc2a in zebrafish increased developmental speed and growth rate,
  giving enlarged adult ORGAN AND BODY SIZE. `lionikas2023`: Stc2-/- mice, 21 against 15 wild-types, up to
  10 per cent larger MUSCLE MASS by fibre cross-sectional area - the knockout mouse exists and is already
  phenotyped. `bai2025`: an STC2 missense A60P conserved across vertebrates, validated in GENE-EDITED MICE
  where homozygous carriers gain 11 per cent average WEIGHT.
  BODY SIZE, MUSCLE MASS AND WEIGHT. NO FEMUR, NO TIBIA, NO VERTEBRA, IN ANY MAMMAL. Under the operator's
  round 302 rule that is a GAP and not a disqualification - but it is the gap, and it is a caliper on a
  mouse that already exists.

  FIVE - THE MODALITY IS THE ONE THAT WORKS. Round 314 established that this atlas had applied a
  small-molecule filter to a class of targets where it is least informative, and that SECRETED proteins are
  the easiest class for a biologic - extracellular, no membrane to cross - with SOST and romosozumab as the
  worked precedent: a secreted antagonist neutralised by an approved antibody. STC2 IS A SECRETED
  GLYCOPROTEIN AND THE THERAPEUTIC DIRECTION IS TO BLOCK IT. That is precisely the shape round 314 named as
  tractable, and unlike HHIP - where the atlas's target is a TUMOUR SUPPRESSOR and blocking it runs toward
  medulloblastoma and basal cell carcinoma - STC2's entire oncology literature reports it as a tumour
  PROMOTER, upregulated in colorectal, lung and osteosarcoma and driving progression. FOR ONCE THE CANCER
  LITERATURE RUNS IN THE SAME DIRECTION WE DO. No anti-STC2 therapeutic antibody was found; PAPP-A-directed
  antibodies exist and are being developed for atherosclerosis and oncology, in the OPPOSITE direction.

  SIX - THE OBJECTION THAT DECIDES IT, STATED AS THE STRONGEST VERSION OF ITSELF. THIS IS THE GH / IGF-1
  ARM, WHICH THE STACK ALREADY CONTAINS AND WHICH THIS FILE PRICES AT APPROXIMATELY ZERO ATTAINED HEIGHT
  AFTER MID-PUBERTY. Step 0 and CORR-297 exist to catch exactly this, and they are what demoted LUM-201 and
  eliminated sacubitril.
  THE DEFENCE IS NOT NEW AND WAS ALREADY MADE IN ROUND 326: `yakar2016` finds that liver-derived CIRCULATING
  IGF-1 drives mainly RADIAL bone growth with little effect on LONGITUDINAL growth, while cartilage-specific
  Igf1r deletion disorganises columns and cuts proliferation. GH raises the circulating ternary-complex
  pool, which IGFALS at 0 of 14 says the plate cannot admit. PAPP-A acts pericellularly, on IGFBP-4 in the
  matrix, on the LOCAL free fraction. Those are different pools, and the SETTLED row "serum IGF-1 does not
  predict growth potential" is a statement about the first one.
  BUT A DEFENCE IS NOT A PROOF, AND THE DISCRIMINATING MEASUREMENT DOES NOT EXIST - nobody has measured free
  against total IGF-1 in growth-plate zones in any species, which is the gap this atlas opened in
  `only_free_igf_reaches_the_plate` and has never closed. SO THE VERDICT IS: DO NOT ADD IT. What this round
  produces is the best-specified target the elevation direction has yielded, a named human axis with a
  bidirectional control structure, a knockout mouse sitting on a shelf, and one experiment - a caliper on
  Stc2-/- femur, tibia and vertebrae - that would settle it.
quantitative:
- parameter: >-
    THE BIDIRECTIONAL CONTROL STRUCTURE - one enzymatic step, one dataset, one ascertainment, opposite signs
  value: >-
    PAPPA pLoF minus 4.57 cm (P = 1.87e-19, 194 hets); PAPPA2 pLoF minus 2.10 cm (P = 1.74e-13, 610 hets);
    STC2 pLoF plus deleterious missense PLUS 1.37 cm (P = 4.51e-34, 3,927 carriers), with the deleterious
    missense class alone plus 1.37 at P = 6.22e-34 and the wider <1 per cent bin plus 0.99 at P = 8.99e-22.
    Supporting the same module: IGF1 minus 6.41, IGF1R minus 5.23 (P = 4.00e-43, 344 carriers), IRS1 minus
    5.23 (P = 3.20e-28), IGFALS minus 0.92
  unit: centimetres per allele
  conditions: >-
    kosmicki2026 Supplementary Table 6, held here as atlas/data/round300/s6_burden_effects.json - 826,066
    discovery exomes with replication in 624,567 more, 207 genes by 7 variant classes by 5 allele-frequency
    bins. Rows selected as the most significant PURE pLoF row per gene for the shortening genes, and the
    most significant row of any class for STC2 because STC2 has no pure-pLoF row passing threshold.
  species: human
  source_ref: kosmicki2026
  uncertainty: >-
    THE STC2 ROW IS NOT PURE pLoF - it is pLoF plus deleterious missense, and the deleterious-missense class
    alone carries the same point estimate, so the signal is missense-driven and a missense burden is a
    weaker analogue of pharmacological blockade than a truncating one. The effect is also an order of
    magnitude smaller than the top of the table: 1.37 cm against ACAN's 16.60. Burden effects are
    associations in adults and carry no developmental timing, no compartment and no statement about whether
    the gene is doing work in an OPEN plate (CORR-299's test is not run here). The direction of the axis is
    consistent across five genes, which is the part that does not depend on any single row.
- parameter: >-
    CORR-327 RECEIVER TEST - the whole axis is in the postnatal human growth plate, and the protease the
    atlas already tested is the MINOR one
  value: >-
    PAPPA 88.5 CPM, detected in 12/14 samples, up to 53.0 per cent of cells; STC2 18.1 CPM, 12/14, up to
    59.8 per cent of cells; IGFBP4 34.5 CPM, 12/14; IGFBP5 91.1 CPM, 12/14; IGFBP3 91.4 CPM, 11/14; IGF1R
    80.4 CPM, 12/14, 34.6 per cent of cells median; IGF2 15.0 CPM, 12/14; IGF1 4.3 CPM, 8/14. AGAINST THEM -
    PAPPA2 3.8 CPM, 8/14 (23-fold below PAPPA) and IGFALS 0/14 at 0.049 CPM. Scale controls COL2A1 9,200 CPM
    and ACAN 1,826 CPM
  unit: median CPM, samples detected of 14, per cent of cells
  conditions: >-
    GSE288028, 14 postnatal human growth-plate samples, 79,934 cells, presence and abundance computed in
    round 308 and held at atlas/data/round308/gse288028_pseudobulk_presence.json. Pseudobulk - no zone and
    no cell-type resolution.
  species: human
  source_ref: chu2026
  uncertainty: >-
    TRANSCRIPT, NOT PROTEIN, AND PSEUDOBULK. For SECRETED proteins specifically this is the weakest kind of
    evidence, because local concentration reflects accumulated secretion and delivery from serum rather than
    the transcription of the nearest cell - a caveat this atlas already wrote into
    `only_free_igf_reaches_the_plate`. The 23-fold PAPPA-to-PAPPA2 ratio is therefore a statement about
    local synthesis, not necessarily about local enzyme activity, and PAPP-A2 could still arrive from
    circulation. What the query does establish is that no member of this axis fails the presence test the
    way NPPC, MME, AGTR1 and SOST did.
- parameter: >-
    LOSING STC2 ENLARGES A NORMAL ANIMAL IN THREE SPECIES - and not one endpoint is a bone length
  value: >-
    zebrafish, genetic deletion of Stc2a - increased developmental speed and growth rate, enlarged adult
    organ and BODY SIZE; mouse, Stc2-/- against wild-type (n = 21 against 15) - up to 10 per cent larger
    MUSCLE MASS by greater fibre cross-sectional area; gene-edited mice carrying the STC2 A60P missense -
    homozygous carriers gain 11 per cent average WEIGHT
  unit: qualitative body size; per cent muscle mass; per cent body weight
  conditions: >-
    wang2025stc2a (zebrafish, and the same paper shows stc2a is a Hif2-dependent hypoxic brake);
    lionikas2023 (mouse knockout, plantaris and whole-muscle morphometry); bai2025 (cattle-derived variant
    validated in gene-edited mouse models, the STC2 arm of a paper this atlas held only for its LCORL arm).
  species: multiple
  source_ref: lionikas2023
  uncertainty: >-
    NONE OF THESE IS A LONGITUDINAL BONE MEASUREMENT. Muscle mass, body weight and gross body size are not
    stature, and this file's failure mode number one is exactly the substitution of a proxy for a length.
    The zebrafish result is the only one where overall body SIZE is the endpoint and it is a fish. bai2025's
    11 per cent is WEIGHT in homozygotes for a missense allele, and that paper's OTHER arm - LCORL - was
    contradicted by wyler2024's knockout, so its gene-edited mouse work is not independently corroborated.
    COST RECORDED: stc2a-null zebrafish grew faster under hypoxia but showed REDUCED SURVIVAL, so this is a
    stress-response brake being removed, not a free gain.
- parameter: >-
    THE WILD-TYPE GAIN-OF-FUNCTION ON THIS AXIS WAS RUN AND DID NOT ADD STATURE
  value: >-
    PND35 body length in wild-type males 15.33 +/- 0.17 saline against 15.15 +/- 0.14 on rhPAPP-A2 (not
    significant, numerically lower); females 14.47 +/- 0.13 against 14.71 +/- 0.31 (not significant); rhGH
    significant in both sexes. What did change - wild-type males femur-to-body-length 0.72 to 0.75 and
    tibia-to-body-length 0.93 to 0.97, both p less than 0.001, total body length unchanged
  unit: cm body length; mm/cm bone-to-body ratio
  conditions: >-
    fernndezarjona2026 Supplementary Tables iv and vi, retrieved and read in the round that issued CORR-108.
    Daily rhPAPP-A2 PND5 to PND35 in Pappa2 wild-type mice.
  species: mouse
  source_ref: fernndezarjona2026
  uncertainty: >-
    THIS IS THE PRIOR AGAINST THE WHOLE PROPOSAL AND IT IS RECORDED AS SUCH. Arms differed by up to 0.6 cm
    at PND5 before treatment began, so the study is not clean in either direction. It tests PAPP-A2, the
    minor pappalysin of the human growth plate at 3.8 CPM against PAPPA's 88.5, and it tests SUPPLEMENTATION
    rather than disinhibition - two reasons it may not bound what STC2 blockade would do, and neither reason
    has been tested. The proportion shift toward LIMB is the part that transfers most directly, and for a
    trunk-dominant residual it points the wrong way.
localization:
- 'growth plate, pericellular matrix: PAPPA 88.5 CPM and IGFBP4 34.5 CPM - where the proteolysis happens'
- 'growth plate: STC2 18.1 CPM in up to 59.8 per cent of cells - the brake is made locally'
- 'liver and circulation: IGFALS 0/14 in the plate, so the ternary complex is assembled where the plate cannot use it'
human_evidence: direct
human_evidence_note: >-
  The burden effects are human, from 1.45M exomes, and the localisation is human postnatal growth plate.
  Every functional perturbation of STC2 is zebrafish or mouse, and none has a bone-length endpoint.
species_basis:
- human
- mouse
- multiple
translation_risk: moderate
translation_risk_reason: >-
  The human genetics and the tissue localisation are both direct and in the right species, which is unusual
  for this file. The risk is not species but ENDPOINT - every functional result is body size, muscle mass or
  weight, and the one wild-type experiment on the axis measured length and found none.
confidence: C
confidence_reason: >-
  The bidirectional human control structure is graded higher than C on its own (five genes, consistent
  direction, P down to 4.5e-34) and the localisation is a clean measured pass. The node is capped at C
  because the therapeutic claim depends on a distinction between disinhibition and supplementation that is
  argued from CORR-300 rather than measured, and because the only wild-type length experiment on this axis
  was null.
claim_grades:
- claim: >-
    The 96 shortening genes have been mined.
  grade: X
  basis: >-
    THEY HAVE BEEN USED ONCE, AS A CONTRAINDICATION SCREEN. Round 300 asked only which of them have approved
    INHIBITORS. CORR-303 has said "work both signs" since round 287 and the elevation direction had never
    been run. This is the same shape as rounds 320 and 321, which took SLC13A1 - a shortening gene - and
    reached an obtainable oral compound by supplying its substrate.
- claim: >-
    STC2 blockade and PAPP-A supplementation are the same intervention, so fernndezarjona2026's wild-type
    null bounds both.
  grade: D
  basis: >-
    PROBABLY NOT, ON TWO OF THIS FILE'S OWN RULES, AND NEITHER HAS BEEN TESTED. (i) CORR-300: removing a
    secreted extracellular modulator is a setpoint shift and adds length, while flooding with agonist
    saturates and subtracts - the rule has been derived independently three times and it PREDICTED this
    failure. (ii) The experiment supplied PAPP-A2, which is 3.8 CPM in the human growth plate against
    PAPPA's 88.5, and the human burden effects order the same way. Graded D, not higher, because both are
    arguments and the null is a measurement.
- claim: >-
    STC2 is a new target for this atlas.
  grade: B
  basis: >-
    YES. STC2 appears in this atlas only as an incidental row in an expression table and has never been
    named as a target in any round. Its human number - plus 1.37 cm at P = 4.51e-34 across 3,927 carriers -
    is among the best-powered in kosmicki2026's table and was never extracted. It is secreted, present in
    12 of 14 human growth-plate samples in up to 59.8 per cent of cells, and the therapeutic direction is
    blockade, which round 314 identified as the tractable modality for exactly this class.
- claim: >-
    Losing STC2 lengthens bone.
  grade: E
  basis: >-
    UNMEASURED IN ANY SPECIES. Stc2-null zebrafish are larger, Stc2-/- mice have up to 10 per cent more
    muscle mass, and STC2-A60P gene-edited mice weigh 11 per cent more - body size, muscle and weight, never
    a femur, tibia or vertebra. Under the round 302 rule this is a gap rather than a disqualification, and
    it is the specific gap, because the knockout mouse already exists.
- claim: >-
    This clears Step 0 against the GH arm already in the stack.
  grade: D
  basis: >-
    CONTESTED, AND THE DEFENCE IS ARGUED RATHER THAN MEASURED. For: yakar2016 separates circulating IGF-1
    (mainly radial) from local IGF-1 (longitudinal); IGFALS is 0 of 14 in the plate so the GH-driven ternary
    pool cannot be admitted; PAPP-A acts pericellularly on IGFBP-4 in the matrix. Against: it is still the
    IGF-1 axis, this file prices GH after mid-puberty at approximately zero attained height, and NOBODY HAS
    MEASURED FREE AGAINST TOTAL IGF-1 IN GROWTH-PLATE ZONES IN ANY SPECIES. Until that exists the
    substitution question is open, which is why the verdict is do not add.
- claim: >-
    The axis is compartment-neutral.
  grade: D
  basis: >-
    NO - THE ONE COMPARTMENT MEASUREMENT ON IT POINTS AT LIMB. rhPAPP-A2 in wild-type males raised
    femur-to-body and tibia-to-body ratios at p less than 0.001 with total length unchanged. Rounds 317 and
    318 say this subject's residual is trunk-dominant, so on present evidence this axis redistributes toward
    the compartment that is running out - the same objection that demoted the CNP arm.
