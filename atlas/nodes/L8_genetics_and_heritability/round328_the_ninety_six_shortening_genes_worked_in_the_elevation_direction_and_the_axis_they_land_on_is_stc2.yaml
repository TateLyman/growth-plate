contradicts: >-
  Does not overturn `only_free_igf_reaches_the_plate` - it extends it and repairs it. That node retracted
  the wild-type rhPAPP-A2 length claim as CORR-108, and the retraction had never been propagated to the
  bibliography entry or to the node's own key_ref line, both of which still asserted the withdrawn finding
  until this round (CORR-345). It also corrects `bai2025`, which sat in the bibliography with NO
  one_line_finding at all because it was added solely as a foil for the LCORL argument, dropping an STC2 arm
  for a gene with zero atlas coverage (CORR-344). And it executes CORR-303, which has instructed the file to
  work both signs since round 287.
