claim_grades:
- claim: A height polygenic score explains about 40-46% of phenotypic variance in the population
    it was trained in.
  grade: A
  basis: Out-of-sample prediction in yengo2022 (40%, 12,111 SNPs) and an independent method on
    WGS data (depope2026, ~46%).
- claim: Height PGS accuracy falls by roughly half to three quarters outside the training ancestry.
  grade: A
  basis: Measured out of sample in yengo2022 and corroborated by partial signal transfer in graff2021.
- claim: The transferability loss is caused by linkage disequilibrium and allele frequency differences
    rather than different underlying biology.
  grade: B
  basis: Supported by similar per-allele effect sizes and gene prioritisation across ancestries
    within yengo2022 and 643/802 directional concordance in graff2021, but not established by
    a purpose-designed decomposition.
