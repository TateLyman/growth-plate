human_evidence: indirect
human_evidence_note: 'The human arm is genetic association only: LIN28B was the first locus shown by GWAS
  to set human pubertal timing, alleles advancing menarche give shorter adult height (ong2009), and a
  second variant influences final height in boys (widn2010). IGF2BP2, a let-7 target family member, is
  in kosmicki2026''s 207 at -8.68 cm. There is no human perturbation of this axis and no human length
  endpoint under any agent that touches it.'
translation_risk: high
translation_risk_reason: 'zhu2010 is germline transgenic overexpression from conception across the entire
  growth period, and its stated mechanism is metabolic. jouan2022 is ARTICULAR cartilage in adult mice,
  and its protective arm is an OA rescue. Neither is a growth plate and neither reports a bone-length
  endpoint at the plate. CORR-299 governs: whether a heterochronic gene is still doing work in an OPEN
  PLATE at bone age 16 is a fact to look up, and nobody has looked.'
summary: 'CORR-359 - I GREPED AND DID NOT SEARCH, AND THAT IS THE FAILURE CORR-267/284 NAMES. R433 answered
  the question ''where else could large height come from'' by greping the atlas, which correctly returned
  the file''s own worked closures (telomerase dead by direct test, reprogramming backwards for this tissue)
  but CANNOT RETURN WHAT NOBODY PUT IN. Running the external search instead returns a LAYER.


  ONE - THE LAYER. Post-transcriptional microRNA control of the growth plate. Atlas coverage before this
  round: microRNA 4 node files, miRNA and miR-1 zero, antagomir zero, anti-miR zero; CLAUDE.md returns
  ZERO for LIN28, let-7 and HMGA2. thakore2025, a 2025 review dedicated to exactly this layer, was not
  held. Many miRNAs are differentially expressed across resting, proliferating and hypertrophic zones
  and are differentially enriched in MATRIX VESICLES; miR-1 and miR-140 converge on their mutual target
  HDAC4, a node this file already works; a human GAIN-OF-FUNCTION mutation in miR-140 causes skeletal
  dysplasia; and miR-26b is a marker for idiopathic short stature.


  TWO - AND LIN28/let-7 IS THE ONLY AXIS IN THIS FILE THAT MOVES BOTH TERMS WITH ONE PERTURBATION. zhu2010
  (Nat Genet, already in this bibliography): transgenic mice expressing Lin28a show INCREASED BODY SIZE,
  INCREASED CROWN-RUMP LENGTH and DELAYED ONSET OF PUBERTY. A length endpoint and a period endpoint in
  the same animals. Every other arm in the stack moves one term and pays on the other. The human side
  is a GRADE-A node in this atlas (lin28b_gene) that has never been in the ledger: LIN28B blocks let-7
  maturation and was the first locus shown by GWAS to set human pubertal timing; alleles advancing menarche
  by 0.12 years also give SHORTER adult height, so the delaying direction is the taller one; and a second,
  partially correlated variant influences FINAL HEIGHT IN BOYS.


  THREE - IT HAS A CARTILAGE-AUTONOMOUS ARM, AND THAT IS WHAT MAKES IT MORE THAN AN ENDOCRINE STORY. jouan2022
  (Sci Adv): cartilage-specific Lin28a OVEREXPRESSION stimulated chondrocyte PROLIFERATION and raised
  Sox9 and Prg4; cartilage-specific Lin28a DELETION IN INTACT MICE raised Mmp13. The chain is causal rather
  than correlative - Lin28a inhibited let-7b and let-7c, up-regulated HMGA2 and activated SOX9 transcription,
  and HMGA2 siRNA KNOCKDOWN ABOLISHED THE EFFECT. LIN28 to let-7 to HMGA2 to SOX9, inside the chondrocyte,
  landing on the master chondrocyte transcription factor.


  FOUR - AND A THIRD INDEPENDENT LINE FALLS OUT OF R432''S OWN INSTRUMENT. zhu2010 names the relevant
  let-7 targets as Myc, Kras, Igf2bp1 and Hmga2. IGF2BP2 is in kosmicki2026''s 207 at -8.68 cm - loss
  SHORTENS, so the gene family is load-bearing and RAISING it, which is what lowering let-7 does, is the
  taller direction. Human, unbiased ascertainment, and reached from a completely different instrument
  than the mouse transgenic or the pubertal-timing GWAS.


  FIVE - THE MODALITY EXISTS AND THIS ATLAS ALREADY SHOWED IT REACHES THE TISSUE. R376 established that
  PS-ASO gapmers were delivered to growth-plate cartilage in vivo (posey2017) and that the Donnan exclusion
  argument does NOT apply to a protein-bound, endocytosed phosphorothioate. An ANTI-let-7 oligonucleotide
  is the agent this axis wants. Chemical matter on LIN28 itself is all INHIBITORS, which is the wrong
  direction - R342''s inhibitor-shelf problem again, because the indication that built those molecules
  was cancer.


  SIX - AND THE COST, WHICH IS THE HONEST ANSWER TO ''INSANE''. let-7 is one of the most important tumour-suppressor
  microRNA families known and LIN28B is a bona fide oncogene. This is demonstrated, not speculative: LIN28
  cooperates with WNT signalling to drive invasive intestinal and colorectal adenocarcinoma in mice and
  humans, and Lin28b is sufficient to drive liver cancer and necessary for its maintenance; LIN28B also
  drives hepatoblastoma, neuroblastoma and Wilms tumour. LOWERING let-7 IS MECHANISTICALLY ONCOGENE ACTIVATION
  - and HMGA2, the required mediator in jouan2022, is itself the canonical lipoma and leiomyoma driver.
  Every other risk in this file is a side effect of the mechanism. Here the risk IS the mechanism, which
  is why it is recorded as the identified big swing and not as a proposal.


  SEVEN - WHAT WOULD SINK IT FOR THIS SUBJECT, STATED BEFORE ANYONE ACTS. ''Heterochronic'' means the
  timing of developmental transitions, and at bone age 16 those transitions are nearly spent. zhu2010''s
  perturbation is germline from conception across the whole growth period; jouan2022 is adult articular
  cartilage. NO let-7 OR LIN28 PERTURBATION HAS EVER BEEN GIVEN A GROWTH-PLATE LENGTH ENDPOINT IN ANY
  SPECIES. And zhu2010''s own stated mechanism is metabolic - increased glucose metabolism and insulin
  sensitivity - which raises the Step 0 question of whether the whole-body arm is simply the GH/IGF axis
  again, an arm this file prices at approximately zero attained height after mid-puberty. jouan2022''s
  cartilage-autonomous arm is the reason to think there is also a local one.


  EIGHT - THE LAYER''S NEGATIVE CONTROL IS BRAND NEW, WAS ALREADY IN THIS BIBLIOGRAPHY, AND WAS UNEXTRACTED.
  thakore2026 was added on 2026-08-05 with a one_line_finding that merely restated its own title and is
  cited by no node - CORR-351''s shape, a one-liner recording a paper''s title instead of its numbers
  is invisible to every later query. Read: a conditional miR-433 TOUGH DECOY in Prrx1 skeletal progenitors
  gave SHORTENED AND NARROWER FEMURS in both sexes, with disorganised growth plates, FEWER RESTING ZONE
  CELLS, abnormal hypertrophic-like cells in the proliferative zone and delayed secondary ossification
  centre development, accompanied by elevated Sox9, Ihh, PTHrP and Bmpr1a. So INHIBITING a growth-plate
  microRNA SHORTENS BONE. That makes miR-433 inhibition a contraindication, and it establishes that this
  layer carries real bone-length endpoints in both directions rather than only expression patterns.'
