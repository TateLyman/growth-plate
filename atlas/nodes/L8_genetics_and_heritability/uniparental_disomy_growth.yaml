claim_grades:
- claim: Maternal UPD14 causes pre- and postnatal growth failure plus central precocious puberty
    in the great majority of patients.
  grade: A
  basis: 60 genetically confirmed patients with three distinct molecular mechanisms giving concordant
    phenotypes (ogawa2025).
- claim: Growth hormone improves height SDS in Temple syndrome by about 1.0 SDS.
  grade: D
  basis: Single uncontrolled treated subgroup of 32 patients (ogawa2025); no randomised comparison
    exists.
