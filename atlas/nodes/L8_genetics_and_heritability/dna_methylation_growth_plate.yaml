claim_grades:
- claim: DNA methylation changes substantially across human cartilage development and colocalises
    with skeletal disease risk variants.
  grade: A
  basis: 72-sample human developmental methylome with 8,200 DMRs and 24 mQTL-GWAS colocalisations
