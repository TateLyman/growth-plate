claim_grades:
- claim: Estrogen acting through ESR1 is required for epiphyseal fusion in humans of both sexes.
  grade: A
  basis: Male ESR1-null with unfused plates and continued growth despite high estradiol (smith1994)
    plus independent female estrogen-resistance case (quaynor2013), and the concordant aromatase-deficiency
    series which removes ligand rather than receptor.
- claim: The adult-height effect of ESR1 loss is about +204 cm / continued growth.
  grade: D
  basis: Single male patient; no cohort exists because the genotype is exceptionally rare.
