claim_grades:
- claim: Assortative mating is genetically detectable and raises genetic variance and relative
    similarity for assorted traits.
  grade: A
  basis: Path-analytic prediction plus empirical confirmation in 47,135 co-parents with the predicted
    distant-versus-close relative gradient (sunde2024).
- claim: Assortative mating for height specifically inflates height heritability estimates by
    a quantified amount.
  grade: D
  basis: No height-specific inflation magnitude was located; the effect is established in principle
    and for the trait class but not measured for stature. See gap g_l8gen_011.
