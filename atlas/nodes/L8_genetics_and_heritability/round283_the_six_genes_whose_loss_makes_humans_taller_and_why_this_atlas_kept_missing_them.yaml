  round276_the_epigenetic_ceiling_is_a_band_not_a_brake_and_both_directions_shorten_bone. That round closed
  the arm on DNMT1, the writer, and on IDH-mutant blockade of demethylation. TET1 is the eraser and its human
  loss-of-function is +8.32 cm per allele in 1.45 million people, which is the new primary data CLAUDE.md
  requires for a reopening. It also strengthens round 276's alpha-ketoglutarate contraindication by giving it
  a human number.
  It RESCUES the LCORL row from
  round281_the_overgrowth_syndromes_do_not_transfer_to_the_growth_plate_except_one_and_that_one_is_a_pure_pool_lever
  - round 281 killed PRC2 at the growth plate across five genes, and LCORL was carried into that class by
  round 280's PALI2 framing. The human +9.99 cm effect does not depend on that framing and stands.
  And it QUALIFIES the closure in
  round268_hedgehog_is_bounded_on_both_sides_and_the_withdrawal_lever_is_refuted_in_three_species without
  overturning it: human HHIP pLoFs are +9.92 cm and an HHIP gain-of-function missense is -3.96 cm, so a mild
  lifelong shift in hedgehog-antagonist dosage moves human height monotonically in centimetres. Round 268
  killed acute pharmacological withdrawal and agonism, which is a different object, and the HHIP result is
  below exome-wide significance - so this is recorded as a pointer, not a reopening.
