id: round283_the_six_genes_whose_loss_makes_humans_taller_and_why_this_atlas_kept_missing_them
name: >-
  ROUND 283 - 1.45 MILLION EXOMES NAME SIX GENES WHOSE LOSS MAKES A HUMAN TALLER, BY UP TO 11 CM PER SINGLE
  ALLELE - and three of them have NO DISEASE ENTRY AT ALL. That absence is the finding: syndrome genes are
  FIVE TIMES more likely to make people short than tall, so a literature of disease is a literature of short
  stature, and every search this atlas has ever run inherited that bias. Two of the six are ENZYMES. One of
  those two has ZERO skeletal literature in any species - and is sitting, expressed and regionalised, in a
  growth-plate dataset this atlas has held since round 243
aliases:
- round 283
- the six taller genes
- kosmicki2026
- NRK is the novel lead
- why the atlas kept finding short-stature genes
- HHIP reopens hedgehog
type: hypothesis
layer: L8
stub: false
summary: >-
  ONE - THE STUDY, AND ITS SCALE AGAINST OURS. kosmicki2026 ran rare protein-altering variants against adult
  height in 826,066 exomes and replicated 98 per cent of 207 genes in a further 624,567 people. In 17 genes,
  SINGLETON putative-loss-of-function variants - the rarest and most deleterious class, frequency below
  0.0001 per cent - move adult height by a MEAN ABSOLUTE 8.92 CM PER ALLELE, which the authors compute as
  ABOUT 52 TIMES the average common height-associated variant and comparable to the one per cent tails of a
  whole common-variant polygenic score. Range: ACAN at MINUS 16.55 cm to FBN1 at PLUS 11.14 cm. Set that
  against this file's SCALE section - CNP analogues +1.24 cm at 52 weeks, aromatase inhibition +1.3 cm over
  three years, GH after mid-puberty about zero. SINGLE HETEROZYGOUS ALLELES IN HUMANS ARE MOVING TEN TIMES
  WHAT THE ENTIRE PHARMACOLOGICAL STACK MOVES.

  TWO - SIX OF THE SEVENTEEN GO THE RIGHT WAY, AND HERE THEY ARE. FBN1 +11.14 cm (40 carriers), CHD8 +10.22
  (21), LCORL +9.99 (71), TET1 +8.32 (42), ZFAT +7.86 (41), NRK +3.79 (56). Every one is a LOSS-of-function
  effect, which is the direction a drug can imitate. Eleven go the other way and include the familiar
  short-stature machinery - ACAN, ANKRD11, COL1A1, EXT1, IGF2BP2, ADAMTS6, ADAMTS10, IGF1R, DTL, SCUBE3, NF1.

  THREE - AND THE PAPER EXPLAINS, IN ONE STATISTIC, WHY THIS ATLAS KEPT FINDING THE WRONG HALF. Among genes
  with a pLoF height association AND a Mendelian syndrome in OMIM, THIRTY-SIX OF FORTY-THREE (83 PER CENT)
  ARE ASSOCIATED WITH DECREASED HEIGHT AND ONLY SEVEN (17 PER CENT) WITH INCREASED HEIGHT - a greater than
  fivefold asymmetry. Of the six height-INCREASING genes here, only FBN1 has an OMIM entry describing
  stature, and LCORL, NRK and TET1 HAVE NO OMIM SYNDROME ENTRY AT ALL. THE REASON IS NOT BIOLOGY, IT IS
  ASCERTAINMENT: being short brings a child to a clinic and being tall does not, so the medical literature
  is a catalogue of things that shorten people. EVERY QUERY THIS ATLAS HAS EVER RUN AGAINST THAT LITERATURE
  INHERITED THE BIAS, and that is a better explanation of rounds 268, 272, 276 and 281 - four axes where the
  atlas found shortening in both directions - than any claim about the biology being bounded. A
  population-scale unbiased-ascertainment study is the correct instrument for finding height-INCREASING
  genes, and this is the first one large enough to have found them.

  FOUR - THE ATLAS ALREADY HAD THE GENE LIST AND COULD NOT USE IT. The node
  clean_gwas_search_for_unhit_targets took an Open Targets ranking for human body height and recorded, at
  the top: ZFAT 0.738, ADAMTS17 0.737, ACAN 0.737, NPR3 0.724, IGF1R 0.720, ADAMTS10 0.718, SCUBE3 0.705,
  FGFR3 0.703, LCORL 0.698, DTL 0.695, IGF2BP2 0.695, STC2 0.683. NINE OF THOSE OVERLAP kosmicki2026's
  SEVENTEEN. The two methods agree almost gene for gene. WHAT THE ATLAS DID NOT HAVE WAS A SIGN OR A
  MAGNITUDE - an Open Targets score is an unsigned aggregate of evidence types, so ZFAT sitting at the very
  top of the ranking told this programme nothing about whether to push it up or down, and nothing was done
  with it. NOW IT IS SIGNED AND IN CENTIMETRES: ZFAT LOSS IS PLUS 7.86 CM. That node is also an ORPHAN in
  this graph - the atlas's single best unbiased target enumeration was never wired to anything.

  FIVE - LCORL SURVIVES ROUND 281 AND IS NOW THE MOST CROSS-SPECIES-REPLICATED TALLER-GENE IN EXISTENCE.
  Round 280 reached LCORL through cattle genomics and framed it as PALI2, a PRC2 component; round 281 then
  killed PRC2 as a growth-plate length lever across five genes and five skeletal tests. LCORL is untouched
  by that, because it was never the PRC2 framing that carried it. HUMAN: +9.99 cm per allele, 71 carriers,
  P = 6.21x10^-33, NO OMIM SYNDROME. LIVESTOCK: convergent truncating mutations independently selected for
  body size in CATTLE, SHEEP, GOATS, PIGS, HORSES, DOGS, RABBITS AND CHICKENS. MOUSE: gene-edited
  homozygotes +3.0 per cent body length, dose-dependent, heterozygotes intermediate. Nine species, one
  direction, and a ten-centimetre human effect with no attached disease. THERE IS NO LCORL DRUG - it is a
  transcription factor of poorly defined function - AND NOBODY HAS DELETED IT IN CARTILAGE.

  SIX - TET1 REOPENS AN ENTRY THIS FILE MARKED DEAD, AND IT REOPENS IT WITH THE ONLY CURRENCY THAT COUNTS.
  Round 276 closed the DNA-methylation arm of the epigenetic ceiling as A BAND, NOT A BRAKE, on the grounds
  that Dnmt1 loss shortens bone and IDH-mutant blockade of demethylation diverts chondrocytes into
  enchondroma. TET1 IS THE ERASER, NOT THE WRITER, AND ITS HUMAN LOSS IS WORTH PLUS 8.32 CM (42 carriers,
  P = 2.23x10^-14, no OMIM syndrome). CLAUDE.md's own rule is that reopening requires NEW PRIMARY DATA
  rather than a new argument; a 1.45-million-person exome study is that. AND IT RETRO-VALIDATES A
  CONTRAINDICATION THIS FILE MADE ON MECHANISM ALONE: ALPHA-KETOGLUTARATE is the co-substrate TET enzymes
  require, round 276 contraindicated it at grade E with no human anchor, and the human anchor is now a
  number - if losing TET1 is worth +8.3 cm, then supplementing its co-substrate pushes the axis in the
  height-LOSING direction. THE HONEST LIMIT: no Tet1 conditional has ever been read out for bone LENGTH in
  any species, and a search for TET inhibitors with any bone endpoint returns nothing.

  SEVEN - AND THE ONE NOBODY HAS EVER LOOKED AT, WHICH IS THIS ROUND'S ACTUAL FIND. NRK - Nik-related kinase,
  X-linked - is +3.79 cm per allele (56 carriers, P = 1.29x10^-9), has NO OMIM syndrome, and IS A KINASE,
  which is the most tractable target class in the entire table. Its literature is a placental cell-death
  protein, a labyrinth-layer function in delayed-delivery mouse placentas, and a prostate hyperplasia paper.
  THERE IS NO SKELETAL LITERATURE ON NRK IN ANY SPECIES. So this round crossed it against a dataset the
  atlas has held since round 243 - chu2026's mouse GP1-versus-GP2 growth-plate differential expression table
  - with atlas/tools/round283_height_genes_against_the_root_cluster.py. NRK HAS A baseMean OF 6.10 IN THE
  MOUSE GROWTH PLATE, WHICH IS HIGHER THAN FGFR3 (2.30) AND HIGHER THAN NT5E/CD73 (3.21) IN THE SAME TABLE,
  AND IT IS SIGNIFICANTLY CLUSTER-RESTRICTED (padj 4.55x10^-3). Of the six height-increasing genes only
  three are expressed and cluster-restricted there - NRK, FBN1 and CHD8 - and NRK has the highest expression
  of the three. A gene with a human height effect, a druggable enzyme class, no disease burden, and no
  skeletal literature whatsoever is expressed and regionalised in the growth plate.

  EIGHT - AND THE PART THAT DID NOT WORK, REPORTED BECAUSE IT MATTERS MORE THAN THE PART THAT DID. The tool
  was written to assign each gene to a growth-plate COMPARTMENT, and it was built to REFUSE rather than
  guess: it calibrates the sign convention against a resting-marker panel and a differentiation panel chosen
  before the height genes were looked at, and reports nothing directional unless they separate. THEY DO NOT
  SEPARATE. SFRP5 (-2.36, padj 1.3x10^-16), PTHLH (-1.45) and NT5E (-0.80) run one way, while GAS1 - which
  round 241 records as a GP1 marker and which is the quiescent epiphyseal-stem-cell marker - runs the other
  at +3.06 with padj 1.8x10^-10; and the global skew among 1,480 significant genes is 1,039 positive to 441
  negative, which matches round 241's 819-up / 165-down for GP1 and therefore also says POSITIVE EQUALS GP1.
  TWO INDEPENDENT ANCHORS SAY POSITIVE IS THE ROOT AND THE CANONICAL RESTING PANEL SAYS NEGATIVE IS. That is
  a real, unresolved tension in a dataset FOUR ROUNDS OF THIS ATLAS ARE BUILT ON - chu2026's RNA-velocity
  root cluster is evidently not co-extensive with the resting zone as marked - and no compartment assignment
  can be trusted until it is settled. Everything in section seven is therefore reported direction-free:
  presence and regionalisation only.

  NINE - HHIP, WHICH IS NOT IN THE SEVENTEEN AND MAY MATTER MORE THAN SOME THAT ARE. Reported in passing
  while the authors argued a different point: RARE HHIP pLoF SINGLETONS ARE ASSOCIATED WITH PLUS 9.92 CM
  (P = 3.72x10^-7), and an HHIP p.V496E missense found only in the Mexico City Prospective Study is MINUS
  3.96 cm, which they read as gain of function. HHIP IS A SECRETED HEDGEHOG ANTAGONIST. So in humans, losing
  one copy of a hedgehog brake is worth about ten centimetres and gaining hedgehog-brake function costs four
  - both directions of ONE axis, monotonic, in centimetres, in a population sample. ROUND 268 CLOSED
  HEDGEHOG AS BOUNDED IN BOTH DIRECTIONS on withdrawal-causes-fusion in three species and agonism-causes-
  premature-closure. THIS DOES NOT REFUTE THAT AND MUST NOT BE READ AS DOING SO - round 268 killed large
  ACUTE pharmacological perturbations and a load-and-release protocol, while HHIP is a MILD LIFELONG shift
  in the dosage of one antagonist. IT IS THE SAME SHAPE AS ROUND 281'S WNT FINDING: the band's optimum is
  not at wild type, and human population genetics locates it. The P value is below exome-wide significance
  and the observation was incidental to the authors' argument, so this is a POINTER, not a reopening.

  TEN - WHAT THIS DOES NOT LICENSE, STATED PLAINLY AND APPLIED EVENLY. Every one of these is a GERMLINE
  HETEROZYGOUS LOSS PRESENT FROM CONCEPTION, accruing across an entire growth period. That is exactly the
  objection round 281 levelled at the PRC2 class and round 282 at SPIN4, and it applies here unchanged:
  NOTHING IN A 1.45-MILLION-PERSON EXOME STUDY SAYS THAT INHIBITING ANY OF THESE AT BONE AGE 16 RECOVERS ANY
  PART OF THE EFFECT. Carrier counts are 17 to 71 per gene, so individual effect sizes carry winner's curse
  even though 98 per cent of genes replicate. And two of the six come with heavy freight - FBN1 loss is
  Marfan syndrome with its aorta, CHD8 loss is autism, intellectual disability and macrocephaly. The three
  clean ones are LCORL, TET1 and NRK, and of those only TET1 and NRK are enzymes.
quantitative:
- parameter: >-
    THE SEVENTEEN SINGLETON-pLoF HEIGHT GENES, IN CENTIMETRES PER ALLELE - AND THE SIX THAT GO UP
  value: >-
    HEIGHT-INCREASING: FBN1 +11.14 (SE 1.11, P 1.45x10^-23, 40 carriers, ECM/TGF-beta, Marfan); CHD8 +10.22
    (1.54, 3.44x10^-11, 21, transcription/Wnt-beta-catenin, ASD/ID/macrocephaly); LCORL +9.99 (0.84,
    6.21x10^-33, 71, transcription, NO OMIM); TET1 +8.32 (1.09, 2.23x10^-14, 42, epigenetic mark
    maintenance, NO OMIM); ZFAT +7.86 (1.10, 9.58x10^-13, 41, transcription, OMIM entry is autoimmune
    thyroid disease with no stature component); NRK +3.79 (0.62, 1.29x10^-9, 56, transcription, NO OMIM).
    HEIGHT-DECREASING: ACAN -16.55, ANKRD11 -11.16, COL1A1 -10.36, EXT1 -8.70, IGF2BP2 -8.68, ADAMTS6 -8.40,
    ADAMTS10 -8.24, IGF1R -8.23, DTL -7.34, SCUBE3 -7.18, NF1 -5.55. MEAN ABSOLUTE EFFECT 8.92 cm, about 52
    times the average common height-associated variant, comparable to the 1 per cent tails of a common
    variant polygenic score
  unit: cm of adult height per allele
  conditions: >-
    kosmicki2026. Discovery 826,066 exomes; 98 per cent of 207 associated genes replicate in a further
    624,567 individuals. Singleton = allele frequency below 0.0001 per cent. 14 of the 17 genes are
    loss-of-function-intolerant.
  species: human
  source_ref: kosmicki2026
  uncertainty: >-
    A PREPRINT, not peer reviewed, and graded accordingly. Carrier counts per gene are 17 to 71, so
    individual effect sizes carry winner's curse even with a 98 per cent replication rate at the gene level.
    Effects are estimated in ADULTS who carried the variant FROM CONCEPTION - they measure a lifetime
    developmental setpoint, not what any intervention would buy from a late start. Aggregating more frequent
    pLoFs attenuated effects by 35 per cent, which the authors read as many pLoF-annotated variants not being
    complete loss of function.
- parameter: >-
    WHY A DISEASE LITERATURE CANNOT FIND TALL GENES - THE ASCERTAINMENT ASYMMETRY, QUANTIFIED
  value: >-
    Among genes with both a pLoF height association and a Mendelian syndrome listed in OMIM, 36 OF 43 (83
    PER CENT) ARE ASSOCIATED WITH DECREASED HEIGHT AND 7 OF 43 (17 PER CENT) WITH INCREASED HEIGHT - more
    than fivefold. Among the eleven height-DECREASING singleton-pLoF genes, EIGHT (73 per cent) have an OMIM
    entry describing stature or skeletal growth. Among the six height-INCREASING genes, ONLY FBN1 does, and
    LCORL, NRK and TET1 have no OMIM syndrome entry at all. The authors found NO difference in pleiotropy
    (average number of associated traits across >2,000 UK Biobank phenotypes) and NO difference in
    loss-of-function constraint between the height-increasing and height-decreasing gene sets
  unit: proportion of genes with a documented stature syndrome
  conditions: kosmicki2026, comparison of the 207 height-associated genes against OMIM.
  species: human
  source_ref: kosmicki2026
  uncertainty: >-
    OMIM curation is itself an imperfect proxy for what clinicians notice, and the comparison is against a
    database rather than against a systematic phenotyping effort. But the controls the authors ran are the
    right ones - matched pleiotropy and matched constraint - which excludes the two obvious alternative
    explanations and leaves ascertainment. THE CONSEQUENCE FOR THIS PROGRAMME IS METHODOLOGICAL, NOT
    BIOLOGICAL, and it is large: a literature search is a search of a disease literature.
- parameter: >-
    THE SIX TALLER-GENES CROSSED AGAINST THE GROWTH PLATE - NRK IS EXPRESSED ABOVE FGFR3
  value: >-
    In chu2026's mouse GP1-versus-GP2 differential expression table (14,755 genes), of the six
    height-increasing genes THREE are expressed and significantly cluster-restricted: NRK baseMean 6.10,
    |log2FC| 0.565, padj 4.55x10^-3; FBN1 baseMean 2.12, |log2FC| 0.804, padj 1.14x10^-3; CHD8 baseMean
    0.73, |log2FC| 0.666, padj 3.84x10^-2. NOT cluster-restricted: LCORL (baseMean 2.70, padj 0.55), TET1
    (0.45, padj 0.19), ZFAT (0.29, no padj). FOR SCALE IN THE SAME TABLE: COL2A1 783.51, ACAN 47.35, NT5E
    3.21, FGFR3 2.30 - so NRK at 6.10 is expressed ABOVE both CD73 and the receptor this stack is built
    around
  unit: DESeq2 baseMean and adjusted P, mouse growth-plate clusters
  conditions: >-
    atlas/tools/round283_height_genes_against_the_root_cluster.py against
    atlas/data/round243_supplied/chu2026_supp/adw3590_data_file_s1.csv ("Table S2: differentially regulated
    genes between mouse GP1 and GP2 clusters"). Output archived at atlas/data/round283/.
  species: mouse
  source_ref: chu2026
  uncertainty: >-
    DIRECTION IS DELIBERATELY NOT ASSIGNED AND THE TOOL REFUSES TO ASSIGN IT. The sign calibration failed:
    SFRP5 (-2.36), PTHLH (-1.45) and NT5E (-0.80) say negative is the resting compartment, while GAS1
    (+3.06, padj 1.8x10^-10), which round 241 records as a GP1 marker, and the global 1,039-positive to
    441-negative skew matching round 241's 819-up/165-down for GP1, both say positive is GP1. Until that is
    resolved no compartment can be assigned. Beyond that: mouse clusters against human genetics; a
    GP1-vs-GP2 contrast is two clusters and not the whole plate, so "not cluster-restricted" is NOT "absent
    from the growth plate"; and transcript abundance is neither protein nor function (CORR-270).
- parameter: >-
    HHIP - BOTH DIRECTIONS OF ONE HEDGEHOG BRAKE, IN HUMANS, IN CENTIMETRES
  value: >-
    Rare HHIP pLoF singletons associated with PLUS 9.92 cm (P = 3.72x10^-7). An HHIP p.V496E missense,
    observed only in the Mexico City Prospective Study at allele frequency 0.05 per cent in the AMR
    subpopulation, associated with MINUS 3.96 cm (P = 1.52x10^-9) - which the authors interpret as GAIN of
    function precisely because the pLoFs run the other way
  unit: cm of adult height per allele
  conditions: >-
    kosmicki2026, reported incidentally while arguing that p.V496E is a gain-of-function allele. HHIP
    encodes a secreted hedgehog-interacting protein, an antagonist of hedgehog signalling.
  species: human
  source_ref: kosmicki2026
  uncertainty: >-
    THE pLoF RESULT IS BELOW EXOME-WIDE SIGNIFICANCE (3.72x10^-7) and HHIP is NOT among the 17 genes in the
    main table - it appears only in support of a separate argument, with no carrier count given. It is a
    POINTER AND NOT A REOPENING of round 268, which closed hedgehog on large ACUTE pharmacological
    perturbations in three species; a heterozygous lifelong shift in one antagonist's dosage is a different
    object. What it does establish is that the two directions are not symmetric in humans and that the
    optimum is not obviously at wild type.
localization:
- 'whole organism, human: all effect sizes are adult standing height, not a compartment'
- 'mouse growth plate: NRK, FBN1 and CHD8 expressed and cluster-restricted; compartment deliberately
  unassigned because the sign calibration failed'
human_evidence: direct
human_evidence_note: >-
  1,450,633 individuals with exome sequencing and measured adult height. This is the largest human evidence
  base in the atlas by two orders of magnitude, and the only one whose ascertainment is not conditioned on
  being short.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  Germline heterozygous loss present from conception, measured as attained adult height. Nothing here speaks
  to a pharmacological intervention started at bone age 16, and two of the six genes carry Marfan and autism
  respectively.
confidence: B
confidence_reason: >-
  The human genetics is as strong as human genetics gets - 826,066 discovery exomes with 98 per cent gene-
  level replication in 624,567 more, matched controls for pleiotropy and constraint. Held at B rather than A
  because it is a preprint, because per-gene carrier counts are small enough for winner's curse on
  individual effect sizes, and because the growth-plate cross this round performed is mouse, direction-free
  and expression-only.
claim_grades:
- claim: >-
    Loss of function in FBN1, CHD8, LCORL, TET1, ZFAT or NRK increases human adult height, by 3.8 to 11.1 cm
    per allele.
  grade: B
  basis: >-
    826,066 discovery exomes with 98 per cent of 207 genes replicating in 624,567 independent individuals;
    P values from 1.29x10^-9 to 6.21x10^-33; 14 of the 17 genes loss-of-function-intolerant; no difference
    in pleiotropy or constraint between the height-increasing and height-decreasing sets. Held at B for
    preprint status and for per-gene carrier counts of 21 to 71, which is enough for winner's curse on the
    individual centimetre figures even where the gene-level association is secure.
- claim: >-
    This atlas's prior searches were systematically biased toward genes that SHORTEN bone.
  grade: B
  basis: >-
    NOT AN EXCUSE, A MEASURED ASYMMETRY. Genes with a pLoF height association and an OMIM syndrome are more
    than FIVE TIMES more likely to be annotated with decreased than increased height (36 of 43 against 7 of
    43), and three of the six height-increasing genes here have no OMIM entry at all. The authors excluded
    the two obvious confounds by showing matched pleiotropy and matched loss-of-function constraint between
    the two sets. A disease literature is an inventory of things that go wrong, and tall is not a
    presentation. This reframes rounds 268, 272, 276 and 281 - the four axes where the atlas found
    shortening in both directions - as partly a property of where it was looking.
- claim: >-
    LCORL is the most cross-species-replicated height-increasing loss-of-function gene known.
  grade: B
  basis: >-
    HUMAN +9.99 cm per allele, 71 carriers, P = 6.21x10^-33, no OMIM syndrome. LIVESTOCK convergent
    truncating mutations independently selected for body size in cattle, sheep, goats, pigs, horses, dogs,
    rabbits and chickens. MOUSE gene-edited homozygotes +3.0 per cent body length, dose-dependent. Nine
    species, one direction. Round 281's refutation of PRC2 at the growth plate does not touch this, because
    the PALI2/PRC2 framing was never what carried the LCORL result. Held at B because there is no cartilage
    conditional in any species and no drug.
- claim: >-
    The DNA-methylation arm of the epigenetic ceiling is closed.
  grade: X
  basis: >-
    REOPENED, AND BY THE STANDARD THIS FILE SET FOR REOPENING. Round 276 closed the arm as a band on Dnmt1
    (the WRITER) shortening bone and IDH-mutant demethylation blockade causing enchondroma. TET1 is the
    ERASER, and human loss of it is +8.32 cm with no attached syndrome, in 1.45 million people. CLAUDE.md
    requires new PRIMARY DATA rather than a new argument to reopen, and this is that. It also converts the
    ALPHA-KETOGLUTARATE contraindication from a grade-E mechanistic inference into one with a human anchor:
    AKG is the TET co-substrate, and if losing TET1 is worth +8.3 cm then feeding TET activity runs the
    wrong way.
- claim: >-
    A TET1-directed intervention has been tested for bone length in any species.
  grade: E
  basis: >-
    IT HAS NOT. No Tet1 conditional has been read out for bone LENGTH in any species; the nearest is a Tet1
    and Tet2 study of bone AGEING and marrow stromal metabolism. A search for TET inhibitors with any bone
    endpoint returns nothing - the entire TET-inhibitor literature is about 130 records and none of it is
    skeletal. So the human genetics points at an enzyme with no pharmacology and no skeletal experiment.
- claim: >-
    NRK is a plausible, entirely unexamined growth-plate target.
  grade: D
  basis: >-
    THE NOVEL LEAD OF THIS ROUND AND IT IS PART ATLAS-GENERATED. Human: +3.79 cm per allele, 56 carriers,
    P = 1.29x10^-9, NO OMIM syndrome, and it is a KINASE - the most tractable class in the table. Literature:
    a placental cell-death protein, a mouse placental labyrinth function, and a prostate hyperplasia paper -
    ZERO SKELETAL LITERATURE IN ANY SPECIES. Atlas cross: in chu2026's mouse growth-plate table NRK has
    baseMean 6.10, above FGFR3 at 2.30 and NT5E at 3.21, and is significantly cluster-restricted at padj
    4.55x10^-3. Graded D because the human effect is the smallest of the six, the expression cross is mouse
    and direction-free, and no NRK inhibitor is known to exist.
- claim: >-
    The growth-plate compartment of these genes can be assigned from the data the atlas holds.
  grade: X
  basis: >-
    NO, AND THE TOOL REFUSED TO. The sign convention of chu2026's GP1-vs-GP2 table cannot be calibrated:
    SFRP5, PTHLH and NT5E place the resting compartment on the negative side, while GAS1 - recorded by round
    241 as a GP1 marker - sits at +3.06 with padj 1.8x10^-10, and the 1,039-to-441 positive skew among
    significant genes matches round 241's 819-up/165-down for GP1 and also says positive is GP1. TWO ANCHORS
    AGAINST THREE MARKERS. This is an unresolved tension inside a dataset four rounds of this atlas are
    built on and it should be settled before any further compartment claim is made from it.
- claim: >-
    Any of these six genes is an intervention for this subject at bone age 16.
  grade: X
  basis: >-
    NO, AND THE OBJECTION IS THE ONE THIS FILE HAS ALREADY MADE TWICE THIS SESSION. These are germline
    heterozygous losses present from conception and measured as attained adult height; round 281 rejected
    the PRC2 class and round 282 qualified SPIN4 on exactly this ground, and it applies here unchanged. There
    is no drug for LCORL, ZFAT or CHD8; TET1 and NRK have no skeletal pharmacology of any kind; FBN1 loss is
    Marfan and CHD8 loss is autism with intellectual disability. WHAT THE ROUND DELIVERS IS A RANKED,
    SIGNED, HUMAN-VALIDATED TARGET LIST WITH EFFECT SIZES - which this programme did not have - not a
    prescription.
