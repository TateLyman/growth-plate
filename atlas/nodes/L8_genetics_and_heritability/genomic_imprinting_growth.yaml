- human
translation_risk: not_applicable
translation_risk_reason: Human imprinting disorders; mouse distal chromosome 7 models are not
  used to support these claims because parental-transmission phenotypes are known to differ between
  the species.
confidence: B
claim_grades:
- claim: Reciprocal methylation defects at imprinted growth loci produce reciprocal growth phenotypes.
  grade: A
  basis: Two independent clusters (11p15.5 SRS/BWS, 14q32.2 Temple/Kagami-Ogata) each with reciprocal
    patient groups and molecular confirmation.
- claim: 14q32.2 hypomethylation acts partly by lowering IGF2 at 11p15.5, explaining Temple/Silver-Russell
    overlap.
  grade: D
  basis: Single transcriptional profiling study (abi2019); not independently replicated.
- claim: Maternal UPD14 causes pre- and postnatal growth failure plus central precocious puberty
    in the great majority of patients.
  grade: A
  basis: 60 genetically confirmed patients across three distinct molecular mechanisms with concordant
    phenotypes (ogawa2025).
