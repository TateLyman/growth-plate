id: hmga2_gene
name: HMGA2
aliases:
- high mobility group AT-hook 2
- rs1042725
type: gene
layer: L8
stub: false
summary: 'HMGA2 was the first common variant reproducibly associated with normal human height and remains
  the cleanest example of the effect size the common-variant regime actually delivers. Weedon 2007 found
  rs1042725 in 4,921 individuals, replicated it in 19,064 adults from four further studies (overall P
  = 4e-16), and confirmed it in 6,827 children and a tall/short case-control sample: the C allele adds
  approximately 0.4 cm of adult height and the variant explains about 0.3% of population height variance.
  That is the scale at which the polygenic architecture operates - about 1/25th of the effect of a rare
  coding variant of the kind catalogued in this layer, and it took ~30,000 individuals to establish. HMGA2
  is also a strong biological candidate rather than a statistical accident, because severe rare lesions
  in the gene alter body size in both mouse and human, and rare aggregate variation proximal to the related
  HMGA1 locus is worth ~5 cm in whole-genome sequencing. The gene reappears in the rare-disease direction
  as a cause of Silver-Russell syndrome, so HMGA2 spans the full allelic spectrum from a 0.4 cm common
  variant to a syndromic growth disorder - which is the argument that the common/rare divide in height
  genetics is one of allele frequency, not of biology. What HMGA2 does not yet have in this atlas is a
  growth plate mechanism: no human growth-plate localization or chondrocyte-level function was retrieved.'
