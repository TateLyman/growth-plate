localization:
- 'human: germline; ligand acts on NPR2 in growth plate cartilage'
human_evidence: direct
human_evidence_note: Overgrowth from NPPC overexpression is documented in three independent translocation
  patients; loss of function is documented in two families with functional cGMP assays.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: Stature claims rest entirely on measured human phenotypes; the mouse
  lbab allele is cited only as convergent support for pathogenicity of one variant.
confidence: A
claim_grades:
- claim: Increased NPPC expression causes human skeletal overgrowth.
  grade: A
  basis: Three independent patients with different translocation partners, each with measured
    NPPC overexpression (bocciardi2007, moncla2007).
- claim: Heterozygous NPPC loss of function causes autosomal dominant short stature.
  grade: B
  basis: Two mutations in one screening study with in vitro cGMP confirmation and cosegregation;
    no independent replication cohort and no reported SDS effect size.
