human_evidence: direct
human_evidence_note: Heterozygous, homozygous and null alleles all characterised in humans with
  measured stature and hand radiology.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: Human allelic series only; the extensive murine Ihh literature is held
  in ihh_protein.
confidence: A
claim_grades:
- claim: Heterozygous IHH loss of function causes mild-to-moderate short stature with incomplete
    penetrance.
  grade: A
  basis: 16-proband cosegregating series (sentchordimont2020) plus independent panel yield in
    an unselected ISS cohort (andrade2022).
- claim: BDA-1 missense alleles act by a mechanism other than reduced IHH dosage.
  grade: B
  basis: Inferred from the phenotypic non-overlap between gao2001 missense families and haploinsufficient
    carriers; not directly tested by an allele-matched functional comparison.
