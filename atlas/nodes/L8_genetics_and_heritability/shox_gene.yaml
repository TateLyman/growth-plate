localization:
- 'human: germline PAR1 (Xp22.33/Yp11.32), escapes X-inactivation'
human_evidence: direct
human_evidence_note: The entire allelic series - nullizygous, haploinsufficient, and heterozygous-mild
  - is defined in humans with measured stature; there is no mouse orthologue of SHOX.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: SHOX is absent from the rodent genome, so no cross-species inference
  is possible or attempted.
confidence: A
claim_grades:
- claim: SHOX gene dosage sets human stature in a monotonic 0/1/2-copy series.
  grade: A
  basis: Three independent human cohorts (rao1997 discovery, shears1998 LWD/LMD allelism, doan2026
    quantified SDS by dose).
- claim: SHOX acts as a transcription factor within growth plate chondrocytes to produce this
    effect.
  grade: D
  basis: Asserted in reviews; no human growth-plate localization primary was reached in this sweep.
    See gap g_l8gen_004.
