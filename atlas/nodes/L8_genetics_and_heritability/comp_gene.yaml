claim_grades:
- claim: COMP mutations cause both pseudoachondroplasia and multiple epiphyseal dysplasia type
    1 as one allelic continuum.
  grade: A
  basis: Original allelism demonstration (briggs1995) plus 830-case aggregation with domain mapping
    (ni2026); ClinGen definitive (webb2026).
- claim: PSACH is significantly shorter than EDM1 at the same locus.
  grade: B
  basis: One systematic aggregation of published cases (ni2026, P<0.001); vulnerable to ascertainment
    because diagnosis labels are partly assigned on stature.
