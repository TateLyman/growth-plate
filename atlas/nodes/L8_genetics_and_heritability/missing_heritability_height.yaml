claim_grades:
- claim: The missing heritability of height is largely accounted for by rare and non-coding variation
    not assayed on genotyping arrays.
  grade: B
  basis: One very large WGS variance partition (wainschtein2026) plus concordant discovery of
    large-effect rare non-coding signals (hawkes2024); the 88% figure is a cross-trait average
    not independently replicated at that precision.
- claim: Common SNP discovery for height is saturated.
  grade: A
  basis: 12,111 independent SNPs capture nearly all common-SNP heritability in 5.4M individuals
    (yengo2022), consistent with the 68% common-variant share measured by WGS (wainschtein2026).
