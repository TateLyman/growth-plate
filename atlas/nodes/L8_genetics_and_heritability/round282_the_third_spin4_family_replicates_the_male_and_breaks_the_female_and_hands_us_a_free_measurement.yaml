id: round282_the_third_spin4_family_replicates_the_male_and_breaks_the_female_and_hands_us_a_free_measurement
name: >-
  ROUND 282 - the operator supplied the paper I asked for and it splits cleanly in two. THE HEMIZYGOUS MALE
  REPLICATES - same variant, different country, predicted adult height +2.75 SDS above his own midparental
  target, with BONE AGE NOT ADVANCED AT TANNER 5. THE FEMALE CARRIERS DO NOT - the only attained ADULT
  heights in this whole class now point in opposite directions in two families carrying the identical allele,
  so that claim is withdrawn. And the paper measured the thing nobody had measured: the Wnt-lowering state
  costs BONE, in humans, and the cost is CORTICAL - readable for free off the bone-age film we already take
aliases:
- round 282
- the third SPIN4 family
- polluaas2026
- SPIN4 female carriers fail to replicate
- the Bone Health Index is free
- SPIN4 is the first charge that discharged
type: hypothesis
layer: L8
stub: false
summary: >-
  ONE - WHAT REPLICATED, AND IT IS THE HALF THAT MATTERS FOR THIS CASE. plluaas2026 reports an Estonian boy
  carrying the EXACT SAME SPIN4 allele as lui2023's proband - c.312_313del, p.(Arg104Serfs*24) - found
  incidentally, because tall stature alone was not the reason for testing. At 14.09 years: height 179 cm
  (+2.0 SD) against a MIDPARENTAL TARGET OF 180 CM, with a Bayley-Pinneau PREDICTED ADULT HEIGHT OF 198 CM,
  which the authors compute as +2.75 SDS ADDED TO HIS GENETIC POTENTIAL. lui2023's proband was +3.3 SDS over
  his own midparental. TWO INDEPENDENT HEMIZYGOTES, SAME ALLELE, BOTH ROUGHLY THREE SD ABOVE THE HEIGHT THEIR
  PARENTS PREDICT.

  TWO - AND THE BONE AGE STILL DOES NOT MOVE, WHICH IS THE PROPERTY THIS FILE IS ACTUALLY HUNTING. Greulich-
  Pyle 13.99 years at chronological age 14.09 (Z +0.16), Tanner-Whitehouse-3 14.03, manual read 13 years 6
  months (Z -0.58). NOT ADVANCED - and he was ALREADY TANNER 5, genitalia 5, pubic hair 5, with testicular
  volume above 25 mL, at fourteen. FULL GONADAL MATURATION WITHOUT SKELETAL MATURATION ADVANCE. Every other
  axis in this atlas that buys height buys it by running the clock; this phenotype does not, in two probands
  out of two. THE AUTHORS THEMSELVES SUPPLY THE CONFOUND AND I AM RECORDING IT RATHER THAN BURYING IT: his
  FREE T4 WAS 12.2 pmol/L AGAINST A REFERENCE RANGE OF 12.6-21.0 - below range - and they write that this may
  have contributed to the lack of bone-age advance. So for THIS patient the unadvanced bone age has a second
  explanation that has nothing to do with SPIN4.

  THREE - AND NOW THE HALF THAT BROKE, WHICH WAS THE HALF ROUND 281 GRADED. Round 281's only human
  attained-adult-height evidence was lui2023's mother and maternal grandmother, each reaching ADULT heights 2
  SDS above their own midparental heights. IN THIS FAMILY, CARRYING THE IDENTICAL VARIANT, THE MOTHER AND
  MATERNAL GRANDMOTHER HAVE NO GAIN AT ALL - mother 172 cm against her own midparental 168 cm, maternal
  GRANDMOTHER 166.8 cm against her own midparental 176 cm, which is NINE CENTIMETRES SHORT. The authors offer
  skewed X-inactivation as the explanation - 20/80 in the mother and 22/78 in the grandmother - but state
  plainly that THEY DID NOT DETERMINE WHICH X CARRIES THE VARIANT, and that skewing alone is insufficient
  because inactivation can differ between blood and growth plate. SO THE EXPLANATION IS UNTESTED AND THE
  OBSERVATION STANDS: THE ONLY ATTAINED ADULT HEIGHTS IN THIS CLASS DISAGREE ACROSS TWO FAMILIES WITH THE
  SAME ALLELE. Round 281's grade-D claim that partial SPIN4 loss raises attained adult height in humans is
  WITHDRAWN AND REGRADED.
  AND THE SHARPER PROBLEM UNDERNEATH IT: NO HEMIZYGOUS MALE HAS EVER REACHED AN ADULT HEIGHT ON RECORD.
  lui2023's proband had epiphysiodesis at 13. This one is 14. chawla2025's are an infant and an
  eight-year-old. BOTH MALE FIGURES ARE BAYLEY-PINNEAU PREDICTIONS, and plluaas2026's own discussion warns
  that Bayley-Pinneau accuracy is reduced where pubertal progression is atypical or epiphyseal closure is
  delayed - which is exactly this phenotype. The male replication is real and it is a replication of a
  PREDICTION.

  FOUR - THE NEW FACT, AND IT IS A COST NOBODY HAD MEASURED IN A HUMAN. lui2023 showed the mechanism is
  LOWERED canonical Wnt. Low Wnt/beta-catenin is an established cause of low bone mass. So these authors did
  the obvious experiment nobody had done and ran a DXA. TOTAL BODY LESS HEAD BMD Z-SCORE -2.03 UNADJUSTED AND
  -3.29 HEIGHT-ADJUSTED. Bone Health Index, which is metacarpal cortical thickness, -2.34 SD. Lumbar L1-L4
  was +0.19 unadjusted and only -1.08 height-adjusted. Normal PTH, normal vitamin D, normal ionised calcium
  and phosphate, no fractures. THE SIGNATURE IS CORTICAL AND APPENDICULAR RATHER THAN LUMBAR TRABECULAR -
  which is a different compartment from the one round 278 established the aromatase arm spends. n = 1, and
  graded as n = 1, but it is the first human bone measurement on the entire Wnt-lowering direction and it
  agrees with dreyer2025's mouse cortical loss and with the atlas's own note that beta-catenin is required
  for osteoblast fate.

  FIVE - AND IT HANDS THIS PROGRAMME A FREE INSTRUMENT, WHICH IS THE MOST DIRECTLY USABLE THING IN THE ROUND.
  THE BONE HEALTH INDEX IS COMPUTED BY BONEXPERT FROM THE SAME LEFT-HAND RADIOGRAPH THAT IS TAKEN TO READ
  BONE AGE. Round 278 established that this stack's bone cost is an EFFICACY term and not a safety footnote,
  because the residual is vertebral and vertebral wedging subtracts height, and it prescribed serial lateral
  thoracolumbar films and DXA. Add this: EVERY BONE-AGE FILM ALREADY BEING TAKEN CAN ALSO RETURN A CORTICAL
  BONE READOUT AT ZERO EXTRA RADIATION, ZERO EXTRA VISITS AND ZERO EXTRA COST, if it is read on BoneXpert
  rather than by eye. That applies to the CURRENT stack - anastrozole is already running - not to a
  hypothetical future agent. It also gives the automated Greulich-Pyle and Tanner-Whitehouse-3 reads
  alongside the manual one, and in this very paper those three methods disagreed by half a year, which is
  most of the annual bone-age budget at this maturity.

  SIX - ONE ROUND-281 CLAIM SHRINKS AND MUST BE SAID PLAINLY. Round 281 wrote that the SPIN4 proband's IGF-1
  of 179 ng/mL was "LOWER than this subject's 198", and used it to argue the axis is not an IGF axis. THIS
  PROBAND'S IGF-1 IS 363 ug/L, with IGFBP-3 6.8 mg/L, both squarely inside the reference range. The
  rhetorical point does not survive. WHAT SURVIVES IS THE WEAKER AND STILL USEFUL VERSION: IGF-1 is WITHIN
  the normal range in both probands, so SPIN4 overgrowth does not require an ELEVATED IGF-1 and the axis is
  therefore not competing with the GH arm for the same limiting quantity. That claim is unaffected.

  SEVEN - AND HERE IS WHY SPIN4 STILL MATTERS MORE THAN ANYTHING ELSE IN THIS FILE, DESPITE LOSING HALF ITS
  HUMAN EVIDENCE. This atlas has catalogued the same failure seven times under one name: CHARGE WITHOUT
  DISCHARGE. horike2026 - expanded resting zone, SHORT bones. newton2019 Tsc1 - pool up, no flux. reyes2023
  Jansen - amplification, cells die instead of hypertrophying. trompet2024 systemic SAG - pool up, length
  unchanged. koyama2021 CD2665 - plate expanded, tibia unchanged. EVERY POOL EXPANSION IN THIS FILE HAS COME
  WITH EQUAL OR SHORTER BONE. SPIN4 IS THE FIRST ONE WHERE THE POOL EXPANDS AND THE BONE IS LONGER, AND IT
  STAYS LONGER AT EIGHTEEN MONTHS. That is a mouse length endpoint and it is untouched by anything in
  plluaas2026.
  THE COMPARISON IS EXACT AND IT IS ALREADY IN THIS ATLAS. horike2026's Fgfr3-Ach mice ALSO have an expanded
  resting zone - but a pathological one, with weak safranin O, weak type II collagen, and reduced migration
  of progeny into the proliferative zone - and SHORT bones. SPIN4's expanded resting zone has more Sfrp5+ and
  CD73+ progenitors and a LONGER bone. THE HISTOLOGY IS THE SAME AND THE MEANING IS OPPOSITE. Only the length
  endpoint separates a bigger pool from a jam. That is CORR-189 restated in its strongest form and it is now
  a rule, not an observation.

  EIGHT - THE THYROID LEVER THIS PAPER OPENS, TESTED AND CLOSED IN THE SAME ROUND. plluaas2026's below-range
  free T4 is a tempting denominator lever: if low thyroid tone slows bone age, deliberately holding free T4
  low would buy growth window, which is the binding constraint at bone age 16. IT DOES NOT WORK AND IT IS
  CONTRAINDICATED. The atlas's own grade-A thyroid node has T3 INHIBITING proliferation while INDUCING
  hypertrophy - so lowering it is a discharge blockade, which is failure mode one, seven instances. And the
  human data are unambiguous: cammisa2024's systematic review of acquired hypothyroidism finds growth arrest,
  catch-up on levothyroxine that is frequently INCOMPLETE, many children never reaching expected genetic
  height, and THE WORST OUTCOMES IN THOSE DIAGNOSED DURING PUBERTY, precisely because treatment then
  accelerates skeletal maturation. Lowering thyroid tone at this maturity would buy a slower clock and stop
  the growth it was meant to protect. THE ACTIONABLE INVERSION IS THE MONITORING ONE: if free T4 drifts BELOW
  range on this stack, that is a HEIGHT COST and not a bonus, and it should be measured and corrected. Whether
  growth hormone itself lowers free T4 in this subject is a separate question this round did NOT source and
  must not assert.
quantitative:
- parameter: >-
    THIRD SPIN4 FAMILY, SAME ALLELE - THE HEMIZYGOUS MALE REPLICATES AND THE BONE AGE STILL DOES NOT MOVE
  value: >-
    Variant NM_001012968.3:c.312_313del:p.(Arg104Serfs*24) - IDENTICAL to lui2023, absent from gnomAD v4.1.
    Birth weight 4980 g (+3.0 SD), birth length 55 cm (+1.5 SD). At 14.09 years: height 179 cm (+2.0 SD),
    weight 58 kg (+0.75 SD), head circumference 58 cm (+1.5 SD). Father 175 cm, mother 172 cm, MIDPARENTAL
    TARGET 180 cm. BONE AGE - Greulich-Pyle 13.99 y (Z +0.16), Tanner-Whitehouse-3 14.03 y, manual 13 y 6 m
    (Z -0.58): NOT ADVANCED. Puberty Tanner 5 (G5, PH5) with testicular volume above 25 mL AT AGE 14.
    Bayley-Pinneau 90.2 per cent of height complete at bone age 13.5 gives PREDICTED ADULT HEIGHT 198 cm
    (+2.75 SDS), or 195.8 cm (+2.64 SDS) if bone age 14 is used. IGF-1 363 ug/L (reference 115-489),
    IGFBP-3 6.8 mg/L (reference 3.0-10.0), TSH 2.24 mU/L (0.51-4.30) - all normal. FREE T4 12.2 pmol/L
    AGAINST A REFERENCE RANGE OF 12.6-21.0, i.e. BELOW RANGE. Splenomegaly, protruding joints, mild genu
    varum, inward-turned ankles and feet, exercise intolerance and distal lower-limb fatigue; normal
    intelligence and schooling; normal brain MRI
  unit: height cm and SD; bone age years; predicted adult height cm and SDS
  conditions: >-
    plluaas2026. Estonian family; SD scores against local Estonian growth references. Variant found
    incidentally during testing for a family history of McArdle disease - tall stature alone was not the
    indication, which reduces ascertainment bias relative to lui2023.
  species: human
  source_ref: plluaas2026
  uncertainty: >-
    THE HEIGHT FIGURE IS A PREDICTION, NOT AN ATTAINED HEIGHT, and the paper's own discussion says
    Bayley-Pinneau accuracy is reduced where pubertal progression is atypical or epiphyseal closure delayed -
    which describes this patient. The three bone-age methods disagree by about half a year (13.5 to 14.03),
    and the predicted adult height moves 2.2 cm across that range. AND THE UNADVANCED BONE AGE IS CONFOUNDED:
    the authors attribute it in part to the below-range free T4, so it cannot be attributed cleanly to SPIN4
    in this patient.
- parameter: >-
    THE FEMALE CARRIERS - NO HEIGHT GAIN, WHICH CONTRADICTS THE ONLY ADULT DATA IN THE CLASS
  value: >-
    MOTHER: height 172 cm against her own midparental height 168 cm (+4 cm). MATERNAL GRANDMOTHER: height
    166.8 cm against her own midparental height 176 cm (MINUS 9.2 cm). The authors state both carriers "did
    not exceed their expected mid-parental height range". For comparison, lui2023's mother and maternal
    grandmother EACH reached adult heights 2 SDS ABOVE their own midparental heights, on the SAME variant.
    Androgen-receptor CAG methylation assay found unequal X-inactivation - 20/80 in the mother, 22/78 in the
    grandmother - but WHICH X CARRIES THE VARIANT WAS NOT DETERMINED. Two other family members are tall and
    untested: the maternal grandmother's father at 200 cm, and the son of her father's sister. A half-sister
    and half-brother tested negative and are not tall
  unit: adult height, cm, against own midparental height
  conditions: >-
    plluaas2026, pedigree in the source's Fig. 2. Heterozygous female carriers, adult, attained heights.
  species: human
  source_ref: plluaas2026
  uncertainty: >-
    THIS IS A FAILURE TO REPLICATE, NOT A REFUTATION OF THE GENE. n = 2 carriers against n = 2 carriers, in
    two families, on a trait with enormous polygenic variance - midparental height explains only part of
    adult height and a nine-centimetre deficit in one woman is well inside normal scatter. The skewed-XCI
    explanation is plausible and UNTESTED, and the authors say so. What it does establish is that the
    heterozygous female effect is NOT ROBUST, and since heterozygous females were the only source of attained
    adult heights in the whole class, the attained-height claim cannot be graded above speculative.
- parameter: >-
    THE FIRST HUMAN BONE MEASUREMENT ON THE WNT-LOWERING DIRECTION - AND THE COST IS CORTICAL
  value: >-
    Total body less head BMD Z-score -2.03 UNADJUSTED and -3.29 HEIGHT-ADJUSTED (CHOP paediatric calculator).
    Lumbar L1-L4 BMD Z +0.19 unadjusted and -1.08 height-adjusted. BONE HEALTH INDEX 4.22 = -2.34 SD, which
    BoneXpert derives from CORTICAL THICKNESS OF METACARPALS II-IV on the bone-age radiograph. No fracture
    history. Normal ionised calcium 1.27 mmol/L, phosphate 1.62 mmol/L, PTH 2.97 pmol/L (1.6-7.2), vitamin D
    (25-OH) 63.0 nmol/L, normal physical activity
  unit: BMD Z-score; Bone Health Index SD
  conditions: >-
    plluaas2026. DXA performed specifically because lui2023 established the mechanism as WNT/beta-catenin
    suppression and low canonical Wnt is an established cause of low bone mass. The authors state they
    cautiously attribute the low BMD to the SPIN4 variant after excluding PTH, vitamin D and inactivity.
  species: human
  source_ref: plluaas2026
  uncertainty: >-
    ONE PATIENT. Height-adjusted Z-scores in a very tall adolescent are the correct adjustment but they are
    also the most unstable, since the reference curves thin out at the extremes. Attribution to SPIN4 is the
    authors' cautious speculation, not a demonstration - no bone marrow stromal or osteoblast Wnt measurement
    exists in SPIN4 loss in any species, and lui2026's aged Spin4-KO mice had bone mineral density COMPARABLE
    to wild type, which points the other way. The compartment split (lumbar relatively spared, total-body and
    metacarpal cortical hit) is a single observation and must not be treated as a mechanism.
- parameter: >-
    LOWERING THYROID TONE TO SLOW BONE AGE - CLOSED BEFORE IT WAS PROPOSED
  value: >-
    In acquired childhood hypothyroidism, growth arrest is a frequent presenting sign with substantial
    proportions below the third height percentile; levothyroxine induces rapid catch-up growth that MAY BE
    INCOMPLETE where treatment starts during puberty or deficiency was prolonged; and MANY CHILDREN DO NOT
    REACH THEIR EXPECTED GENETIC HEIGHT. Those diagnosed DURING PUBERTY experience the LEAST catch-up,
    explicitly because of accelerated skeletal maturation on treatment
  unit: direction of final-height outcome
  conditions: cammisa2024, systematic review, 16 included studies, children with acquired hypothyroidism.
  species: human
  source_ref: cammisa2024
  uncertainty: >-
    A REVIEW, WHICH THIS ATLAS TREATS AS AN INDEX AND NOT A SOURCE, and it describes FRANK hypothyroidism
    rather than a deliberate low-normal free T4. It therefore does not exclude an interior optimum in the
    euthyroid range - nobody has tested one. It is nonetheless sufficient to close the proposal, because the
    mechanism is already known from the atlas's grade-A thyroid node: T3 induces hypertrophy, so lowering it
    blocks discharge, which is this file's most-repeated failure mode.
localization:
- 'growth plate: unchanged bone age at Tanner 5 in two hemizygous probands - gonadal maturation and skeletal
  maturation decoupled'
- 'cortical bone, appendicular: where the human Wnt-lowering cost was measured, by DXA total-body-less-head
  and by metacarpal cortical thickness'
- 'lumbar spine: relatively spared in this patient, which is the compartment the aromatase arm spends'
human_evidence: direct
human_evidence_note: >-
  Three human SPIN4 families now exist. This round is entirely human except where it reaches back to
  lui2023's and horike2026's mouse work for interpretation.
species_basis:
- human
translation_risk: high
translation_risk_reason: >-
  The male height figures are Bayley-Pinneau predictions in a phenotype whose epiphyseal closure timing the
  authors say is unknown; the female data disagree between families; and the bone cost is a single DXA.
confidence: C
confidence_reason: >-
  A single well-documented family report, but one that carries an exact-allele replication of the male
  phenotype and an exact-allele contradiction of the female phenotype. Graded C because the load-bearing
  height numbers on both sides are small-n and, for the males, predicted rather than attained.
claim_grades:
- claim: >-
    Hemizygous SPIN4 loss raises height above the subject's own midparental prediction.
  grade: C
  basis: >-
    TWO INDEPENDENT PROBANDS, THE SAME ALLELE, DIFFERENT COUNTRIES AND DIFFERENT ASCERTAINMENT ROUTES -
    lui2023 +3.3 SDS over midparental with a predicted adult height of 203 cm, plluaas2026 +2.75 SDS over
    midparental with a predicted adult height of 198 cm. plluaas2026's case was found INCIDENTALLY during
    testing for an unrelated family history, which is the cleanest ascertainment in the class. Held at C and
    not higher because BOTH figures are Bayley-Pinneau PREDICTIONS - no hemizygote has reached an adult height
    on record, one had epiphysiodesis at 13, and plluaas2026's own discussion cautions that Bayley-Pinneau is
    less accurate in exactly this phenotype.
- claim: >-
    Partial (heterozygous) SPIN4 loss raises attained ADULT height in humans.
  grade: E
  basis: >-
    DOWNGRADED FROM D. Round 281 graded this on lui2023's mother and maternal grandmother, each +2 SDS above
    their own midparental heights. plluaas2026's mother and maternal grandmother, carrying the IDENTICAL
    variant, have no gain - mother +4 cm over midparental, grandmother 9.2 cm SHORT of it. Two families, same
    allele, opposite direction, n = 2 each. The skewed X-inactivation explanation offered is untested, since
    the authors did not determine which X carries the variant and note that inactivation may differ between
    blood and growth plate. The only attained adult heights in the entire epigenetic overgrowth class do not
    agree with each other.
- claim: >-
    SPIN4 loss produces overgrowth without advancing bone age.
  grade: D
  basis: >-
    THE EVIDENCE IS NOW MIXED AND THE HONEST GRADE IS D. In favour: lui2023's proband advanced by only one
    year, and plluaas2026's is at Greulich-Pyle 13.99 against chronological 14.09 WHILE ALREADY TANNER 5 with
    testicular volume above 25 mL - full gonadal maturation with no skeletal advance. Against: chawla2025's
    affected sibling had bone age 9-11 at chronological age 8, and plluaas2026's own authors attribute part
    of their patient's lack of advance to a BELOW-RANGE FREE T4 rather than to SPIN4. So the property is
    present in 2 of 3 families and confounded in one of those two.
- claim: >-
    Lowering canonical Wnt costs bone mass in humans, and the cost is cortical.
  grade: D
  basis: >-
    ONE PATIENT, but the first human measurement on the axis and it was taken for the right mechanistic
    reason. Total-body-less-head BMD Z -3.29 height-adjusted and metacarpal cortical Bone Health Index -2.34
    SD, with lumbar spine only -1.08 height-adjusted, on normal PTH, vitamin D, calcium and activity. It
    agrees in direction with dreyer2025's mouse cortical and trabecular loss under a PORCN inhibitor and with
    the established requirement for beta-catenin in osteoblast fate. It DISAGREES with lui2026's aged
    Spin4-KO mice, whose bone mineral density was comparable to wild type - which is why this is D and not C.
- claim: >-
    An expanded resting zone is evidence of a larger progenitor pool.
  grade: X
  basis: >-
    NO - THE SAME HISTOLOGY CARRIES OPPOSITE MEANINGS AND ONLY A LENGTH ENDPOINT SEPARATES THEM. horike2026's
    Fgfr3-Ach mice have an EXPANDED resting zone that is pathological - weak safranin O, weak type II
    collagen, reduced migration of progeny into the proliferative zone - and SHORT bones: an expansion by
    JAM. lui2023's Spin4-KO mice have an expanded resting zone with more Sfrp5+ and CD73+ progenitors and a
    LONGER bone: an expansion by POOL. This is CORR-189 in its strongest form and it is now a stop condition,
    not a caveat.
- claim: >-
    SPIN4 is the first pool expansion in this atlas that came with a longer bone.
  grade: C
  basis: >-
    Against this file's own charge-without-discharge ledger - horike2026 expanded resting zone with short
    bones, newton2019 Tsc1 pool up with no flux, reyes2023 amplification with cells dying instead of
    hypertrophying, trompet2024 systemic SAG pool up with length unchanged, koyama2021 CD2665 plate expanded
    with tibia unchanged - every prior instance gave equal or shorter bone. Spin4-KO gives more resting
    progenitors AND greater tibia and body length, at two weeks, ten weeks and eighteen months. Graded C
    because it is single-laboratory mouse work and because a germline developmental setpoint is not the same
    object as an intervention that charges and then discharges a plate.
- claim: >-
    Deliberately holding thyroid hormone low to delay bone age would extend the growth window.
  grade: X
  basis: >-
    CONTRAINDICATED. The atlas's grade-A thyroid node has T3 INHIBITING proliferation and INDUCING
    hypertrophy, so lowering it is a discharge blockade - failure mode one, seven instances. cammisa2024
    finds that acquired hypothyroidism causes growth arrest, that catch-up on levothyroxine is often
    incomplete, that many children never reach expected genetic height, and that PUBERTAL-ONSET cases do
    WORST because treatment then accelerates skeletal maturation. The inversion is the useful part: a free T4
    that drifts BELOW range on this stack is a height cost to be corrected, not a bone-age bonus to be
    enjoyed.
- claim: >-
    Cortical bone can be monitored on this stack at no additional cost or radiation.
  grade: B
  basis: >-
    YES, AND IT IS THE MOST DIRECTLY USABLE ITEM IN THIS ROUND. BoneXpert derives the Bone Health Index from
    CORTICAL THICKNESS OF METACARPALS II-IV on the SAME left-hand radiograph taken to read bone age, and
    plluaas2026 reports it alongside automated Greulich-Pyle and Tanner-Whitehouse-3 reads from that one
    film. Round 278 established that this stack's bone cost is an EFFICACY term because the residual is
    vertebral. Serial bone-age films are already indicated for this subject; reading them through BoneXpert
    adds a cortical bone-quality channel and two independent maturity estimates for nothing. Graded B rather
    than A because the Bone Health Index measures CORTICAL bone and the aromatase arm's documented cost is
    LUMBAR TRABECULAR, so it supplements rather than replaces the lateral thoracolumbar film and DXA that
    round 278 specified.
