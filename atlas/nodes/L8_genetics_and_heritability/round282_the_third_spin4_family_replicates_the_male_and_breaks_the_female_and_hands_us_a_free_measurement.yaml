  one_line_finding: >-
    The third SPIN4 family, carrying the SAME allele as lui2023 - the hemizygous male replicates at +2.75 SDS
    over his own midparental target with bone age UNADVANCED at Tanner 5, the two heterozygous adult female
    carriers have NO gain and contradict lui2023, and the first human DXA on the axis shows a CORTICAL bone
