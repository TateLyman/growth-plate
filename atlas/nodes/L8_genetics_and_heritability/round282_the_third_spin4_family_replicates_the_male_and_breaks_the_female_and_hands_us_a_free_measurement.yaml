contradicts: >-
  DIRECTLY DOWNGRADES ONE CLAIM OF
  round281_the_overgrowth_syndromes_do_not_transfer_to_the_growth_plate_except_one_and_that_one_is_a_pure_pool_lever.
  Round 281 graded "partial SPIN4 loss raises attained ADULT height in humans" at D on the strength of
  lui2023's two heterozygous female carriers. plluaas2026's two heterozygous female carriers, on the
  IDENTICAL allele, show no gain - one is 9.2 cm below her own midparental height. That claim is regraded E.
  Round 281's statement that the proband's IGF-1 of 179 was "lower than this subject's 198" is also
  withdrawn as a class property: this proband's IGF-1 is 363. The weaker claim - IGF-1 is within the normal
  range in both, so the axis does not require an elevated IGF-1 and does not compete with the GH arm -
  survives intact.
  It STRENGTHENS round 281 in two places. The hemizygous male phenotype replicates on the same allele in an
  incidentally ascertained case, and the round-281 observation that SPIN4 is the first pool expansion in this
  atlas with a longer bone is unaffected, because that rests on a mouse length endpoint.
