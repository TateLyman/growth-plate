claim_grades:
- claim: Heterozygous glycine substitutions in the COL2A1 triple-helical domain cause spondyloepiphyseal
    dysplasia congenita.
  grade: A
  basis: Seven unrelated families (zhan2025) plus ClinGen definitive gene-disease classification
    (webb2026); a very large independent literature exists.
- claim: The mechanism is dominant-negative incorporation into the collagen II homotrimer rather
    than haploinsufficiency.
  grade: C
  basis: Consistent with the severity gradient and with the mild phenotype of whole-gene deletions,
    but no allele-matched human trimer-assembly experiment was reached in this sweep. See gap
    g_l8gen_005.
