claim_grades:
- claim: K650M produces roughly three times the constitutive FGFR3 kinase activity of K650E in transient
    transfection, yet is survivable while K650E (thanatophoric II) is lethal.
  grade: B
  basis: In-vitro kinase activity plus human phenotype in the four originally reported individuals; small
    n but the phenotypic contrast is unambiguous.
- claim: Phenotypic severity is therefore NOT monotonic in constitutive kinase activity across the FGFR3
    KINASE-DOMAIN allelic series.
  grade: B
  basis: Rests on the K650E/K650M pair specifically. Both are kinase-domain alleles.
- claim: Severity is non-monotonic in activation across the whole FGFR3 allelic series including transmembrane
    variants.
  grade: D
  basis: 'CONTRADICTED IN PART: the biochemical ordering K650E > G380R matches the phenotypic ordering
    thanatophoric > achondroplasia. Monotonicity HOLDS across that comparison and breaks only within the
    kinase-domain pair. The general claim is not supported.'
contradicts:
- 'SCOPE LIMIT: the non-monotonicity result is specific to the kinase-domain pair K650E/K650M. Across
  the kinase-domain-to-transmembrane comparison (K650E vs G380R) activation and severity DO track together.
  Any therapeutic inference drawn from non-monotonicity must state which alleles it applies to - see g_mr002_allele.'
