  documented in living achondroplasia growth plates'
- 'human HZ: truncated hypertrophic zone described in thanatophoric dysplasia autopsy material (wilcox1998)'
- 'mouse RZ: resting-zone chondrocyte turnover disrupted by excess Fgfr3 signalling via CREB (horike2026)'
human_evidence: direct
human_evidence_note: Mutation, receptor biochemistry and adult height are all established directly
  in humans; only the growth plate cellular phenotype rests on autopsy material from the lethal allelic
  variants and on mouse models.
