claim_grades:
- claim: COL10A1 mutations cause Schmid metaphyseal chondrodysplasia.
  grade: A
  basis: Single-kindred linkage at lod 18.2 with an identified 13 bp deletion (warman1993) and
    an independent 128-case unrelated-patient mutation series (meng2025) - different designs,
    different cohorts, different eras.
- claim: COL10A1 missense variants reduce stature about 1.6 SDS more than truncating variants.
  grade: B
  basis: One pooled 128-case cohort with P=0.013 (meng2025), mechanistically corroborated by an
    independent trimerisation assay (yang2025); the height comparison itself has not been repeated
    in a second cohort.
- claim: The phenotype is a pure hypertrophic-zone readout because collagen X is expressed only
    there.
  grade: B
  basis: Inference from the restricted expression of collagen X plus the radiographic metaphyseal-only
    distribution; no zone-resolved human MCDS growth plate has been examined.
