quantitative:
- parameter: height, stature or body-proportion data in the definitive natural history
  value: none reported
  unit: none
  conditions: international questionnaire survey of 629 patients with cystathionine beta-synthase deficiency, 31 pages,
    the largest series ever assembled and the reference natural history for this disorder
  species: human
  source_ref: mudd1985
  uncertainty: 'RECORDED AS AN ABSENCE, and it is the load-bearing one. Full text read 2026-08-06 and searched: the
    words height, stature, growth, scoliosis, arachnodactyly, arm span and body proportion do not appear anywhere
    in the paper. The disorder this atlas has been treating as the human natural experiment in tall stature has never
    had its stature measured in the series that defines it. This does not show patients are not tall - it shows the
    claim is not quantified where it would most be expected, and that no analysis of WHERE the extra length comes
    from is possible from this source.'
- parameter: clinical features leading to investigation
  value: ectopia lentis 85.6; mental retardation 55.7; Marfanoid characteristics 36.9; bony abnormality 23.5; developmental
    retardation 22.5; early thromboembolic disorder 16.1
  unit: '% of patients in whom the feature was a sole or contributory cause'
  conditions: 472 of the 629 patients, restricted to those ascertained on clinical grounds rather than by newborn
    or sibling screening
  species: human
  source_ref: mudd1985
  uncertainty: 'These are ASCERTAINMENT features - what led to the diagnosis - not prevalences, so they are biased
    toward whatever prompts investigation, and lens dislocation dominates for that reason. Note what stands in for
    stature: Marfanoid CHARACTERISTICS at 36.9% and bony ABNORMALITY at 23.5%, both unquantified descriptors. Neither
    separates a long-bone growth phenotype from a connective-tissue one.'
- parameter: radiologic spinal osteoporosis by age 15, untreated
  value: 36 vs 64
  unit: '% (B6-responsive vs B6-non-responsive)'
  conditions: time-to-event analysis restricted to patients reported either to have or not to have osteoporosis on
    a lateral radiograph of the spine, which is the papers definition of the finding
  species: human
  source_ref: mudd1985
  uncertainty: P<0.002 between the two groups. THE DOMINANT PROGRESSIVE SKELETAL FINDING IN THIS DISORDER IS BONE
    FRAGILITY, NOT ACCELERATED GROWTH - which is a bone-quality and connective-tissue picture rather than a growth-plate-velocity
    one, and points the interpretation of the skeletal phenotype away from the physis.
- parameter: adult height of an HCU cohort against the general population
  value: about +1
  unit: standard deviation score
  conditions: 48 Irish pyridoxine-NONresponsive HCU patients, weight and height at nine set time points to 18 years,
    SDS against British 1990 and UK-WHO reference data. Birth weight was normal (male 3.71 and 3.37 vs 3.55 kg; female
    3.33 and 3.36 vs 3.40 kg)
  species: human
  source_ref: purcell2017
  uncertainty: 'THE QUANTIFICATION mudd1985 DOES NOT CONTAIN, and it settles the physeal-versus-structural question
    this atlas asked: birth weight is normal and the excess appears afterwards, so the extra length is accrued POSTNATALLY
    and therefore at the growth plate. Weight rose by the same amount with no BMI difference, i.e. a balanced increase.
    HEAVY CAVEAT THE ABSTRACT DOES NOT CARRY: 77% of late-diagnosed and 75% of screened patients grew WITHIN their
    expected midparental height range, so most of the cohort is inside its own genetic target and the disease effect
    is smaller than a bare +1 SD against the population implies. Single centre, single country, no untreated arm.'
- parameter: adult height by duration of untreated homocysteine exposure
  value: '+7.97'
  unit: cm at 18 years, late-diagnosed minus newborn-screened
  conditions: same cohort; late-diagnosed n=12, mean age at diagnosis 5.09 years (range 1.33-11.79) against newborn-screened
    n=36. Weight +4.97 kg, P=0.0058. No difference in growth RATE between the groups after 10 years of age, so the
    divergence is accrued before then
  species: human
  source_ref: purcell2017
  uncertainty: 'P=0.0204. THIS IS THE INTERNAL DOSE-RESPONSE AND IT IS THE STRONGEST EVIDENCE IN THE NODE: within
    one disease, roughly five years of additional untreated hyperhomocysteinaemia is worth about 8 cm of adult height.
    The late-diagnosed group is also the OLDER cohort (mean current age 34.6 vs 23.7 years), so the secular trend
    in population height runs AGAINST the finding and strengthens it. Against that: n=12, retrospective, single centre,
    and diagnosis age is confounded with everything else that changed in care between the two eras.'
- parameter: effect of dietary homocysteine on long bone length in a growing animal
  value: tibial length significantly increased; tibial weight +12% and not significant
  unit: mm, chick tibia at 8 weeks
  conditions: chicks fed 0.6% dl-homocysteine for the first 8 weeks of life, n=8, against n=10 controls; body weight
    rose faster and was significantly greater at the end (P<0.01)
  species: chicken
  source_ref: mass2003
  uncertainty: 'P<0.01 for length. THE ANIMAL COUNTERPART OF THE HUMAN FINDING, and it localises the effect: radiographs
    showed generalised osteopenia and ACCELERATED EPIPHYSEAL OSSIFICATION with metaphyseal and suprametaphyseal lucencies
    that the authors call similar to human homocystinurics, and they describe the model as reproducing "accelerated
    skeletal growth, epiphyseal growth plate lesions". Tibiae were stronger, but strength was proportional to the
    increased length and cortical thickness, so there is no intrinsic material change - the bone is bigger, not better.
    High-dose dietary exposure producing a disease, in a fast-growing bird; not a model of therapeutic intent.'
- parameter: molecular target of homocysteine in the connective tissue phenotype
  value: fibrillin-1, not collagen cross-linking
  unit: qualitative
  conditions: recombinant fragments spanning the entire fibrillin-1 molecule plus tropoelastin; homocysteinylation
    but NOT cysteinylation caused abnormal self-interaction traced to reduced multimerisation of the fibrillin-1 C
    terminus, and greatly reduced fibrillin-1 network deposition by human dermal fibroblasts
  species: in_vitro_human_cell
  source_ref: hubmacher2010
  uncertainty: 'THIS IS WHY THE HOMOCYSTINURIA STEP DOES NOT BELONG TO g_l1arch_018. That gap proposes collagen cross-link
    density as the mechanical converter; homocysteine acts on FIBRILLIN, the Marfan protein, and orth1994 showed it
    leaves cross-links in non-lesional cartilage unchanged. The authors note that Marfan and homocystinuria share
    long bone overgrowth, scoliosis and ectopia lentis from fundamentally different origins, which is the clue that
    the shared axis is the fibrillin microfibril and its control of TGF-beta rather than anything about collagen.
    IN VITRO ONLY: recombinant protein and dermal fibroblasts, no growth plate, no animal.'
confidence_note: 'Held at C on 2026-08-06 despite the new quantification. What improved is the phenotype: measured,
  postnatal, dose-responsive within the disease, with an animal counterpart showing longer tibiae. What did not improve
  is the mechanism, which rests on in vitro homocysteinylation of recombinant fibrillin-1 and dermal fibroblast cultures
  with nothing in a growth plate. B would require the fibrillin/TGF-beta step shown in physeal tissue.'
