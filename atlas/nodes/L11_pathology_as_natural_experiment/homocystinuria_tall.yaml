id: homocystinuria_tall
name: Classical homocystinuria (CBS deficiency)
aliases:
- cystathionine beta-synthase deficiency
- CBS deficiency
type: phenotype
layer: L11
stub: false
summary: 'Classical homocystinuria is the metabolic overgrowth experiment: a biallelic defect in

  cystathionine beta-synthase raises homocysteine, and the skeletal phenotype is marfanoid -

  tall stature, dolichostenomelia, arachnodactyly, scoliosis and osteoporosis - closely enough

  to Marfan syndrome that patients are routinely misdiagnosed, and late diagnosis is common. The

  mechanistic interest for this atlas is that the lesion is neither a matrix gene nor a growth

  factor: homocysteine is thought to interfere with collagen and fibrillin cross-linking, so the

  connective tissue phenotype is a downstream chemical consequence of an amino-acid metabolic

  block. That makes homocystinuria the human demonstration that skeletal proportion can be

  distorted by a purely metabolic perturbation acting on matrix chemistry. It is also the only

  tall-stature disorder in this layer that is treatable metabolically - pyridoxine responsiveness

  and methionine restriction modify the course - which is why diagnostic delay is the dominant

  clinical variable and why the untreated adult height distribution is poorly characterised.

  Ectopia lentis and thromboembolism, not stature, drive the clinical burden. RESOLVED 2026-08-06 AND MOVED OFF THE
  CROSS-LINK HYPOTHESIS. The tall stature is real, postnatal and quantified: an Irish cohort of 48 pyridoxine-nonresponsive
  patients runs about +1 SD taller and heavier than the population with no BMI difference and NORMAL BIRTH WEIGHT,
  and within the disease the late-diagnosed are 7.97 cm taller at 18 years than the newborn-screened, with the divergence
  complete before age 10 (purcell2017). Normal birth weight with postnatal excess means the length is accrued at the
  growth plate, which answers the physeal-versus-structural question this atlas raised. The animal counterpart agrees
  and localises it: chicks fed homocysteine grow faster with significantly longer tibiae and accelerated epiphyseal
  ossification (mass2003). But the mechanism is NOT collagen cross-linking - homocysteine modifies FIBRILLIN-1 and
  blocks microfibril network deposition (hubmacher2010) while leaving cross-links in non-lesional cartilage unchanged
  (orth1994). So this node belongs with the fibrillin/TGF-beta overgrowth axis shared with Marfan syndrome, not with
  g_l1arch_018. Caveat that limits all of it: about three quarters of the cohort still grew within their own midparental
  target range.'
localization:
- 'human growth plate: not examined in homocystinuria'
human_evidence: direct
human_evidence_note: 'REVISED TWICE ON 2026-08-06. mudd1985, the 629-patient reference natural history, reports no
  height or stature data at all - the words do not appear in 31 pages. purcell2017 supplies what it lacks: measured
  height SDS at nine time points to 18 years in 48 patients, about +1 SD above the population, normal birth weight,
  and a 7.97 cm within-disease difference by duration of untreated exposure. So the human evidence is DIRECT and quantified
  for the stature itself and for its postnatal (therefore physeal) timing, and IN VITRO ONLY for the mechanism.'
