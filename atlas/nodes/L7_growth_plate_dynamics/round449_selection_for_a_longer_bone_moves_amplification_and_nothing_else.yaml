id: round449_selection_for_a_longer_bone_moves_amplification_and_nothing_else
name: R449 - artificial selection for a longer bone raises the NUMBER of proliferative chondrocytes and changes
  nothing else, and every human growth-plate atlas was built from constitutionally tall donors with no control
