translation_risk_reason: The Longshanks decomposition is mouse and a secondary report has the length difference
  present at birth, which if true fails the open-plate test. The tall-donor observation carries no translation risk
  because it is about human tissue directly.
summary: 'THE CLEANEST TERM RANKING THAT EXISTS, AND IT IS AN EVOLUTIONARY EXPERIMENT RATHER THAN A DRUG. marchini2018
  took the Longshanks mice - roughly twenty generations of artificial selection on tibia length relative to body
  mass against random-bred controls on the same background - with cross-sectional growth curves plus histomorphometry
  and proliferation assays on the proximal tibial growth plate. The length difference is NOT due to prolonged growth
  but to accelerated growth rates; it is associated with an INCREASED NUMBER OF PROLIFERATIVE CHONDROCYTES; and
  there is NO difference in the rate of chondrocyte proliferation nor in the size or number of hypertrophic cells.
  ASK BIOLOGY, WITH NO HYPOTHESIS, WHAT IT CHANGES WHEN YOU SELECT FOR A LONGER BONE, AND IT CHANGES THE NUMBER
  OF AMPLIFYING CELLS - not the division rate, not terminal cell size, not the period. That is R423''s decomposition
  reached independently: R423 computed from mouse femur against metacarpal that 88 per cent of the log yield gap
  is amplification and 12 per cent terminal cell height, and that amplification has no agent anywhere. Longshanks
  is the perturbation experiment and it landed on exactly that term - which is a second independent argument that
  h_term is not what selection moves when it is free to move anything. The genomic follow-up validates this atlas
  as an instrument: marchini2021 names Fxyd2, Npr3, Dlk1, Sox9 and Sfrp1 as moved by the selection, and four of
  those five are already in this ledger. The one that is not is FXYD2, a sodium-potassium ATPase regulatory subunit
  reduced in long-boned mice with pharmacological pump inhibition disrupting chondrocyte differentiation - an ion
  pump, the same machinery class as R408 and R409''s cell-volume module, with zero prior coverage. Caveats before
  anyone builds on it: the selected alleles must act postnatally rather than on limb-bud patterning and a secondary
  report has the difference present at birth, which would fail CORR-299; FXYD2 has no bone-length endpoint under
  any agent; and the only pharmacology on its target runs the wrong way, since cardiac glycosides are pump INHIBITORS
  and digoxin is given to children for years through the growth window.


  AND A FACT ABOUT EVERY HUMAN DATASET THIS FILE RELIES ON. The only source of healthy human growth-plate tissue
  is surgery performed to destroy it, and that surgery is only done on children who are too tall. avijgan2026 states
  it plainly - biopsies from healthy adolescents undergoing epiphysiodesis for IDIOPATHIC TALL STATURE, aged 12
  to 14. chu2026, the pubertal human atlas this file has built four rounds on, describes its material as surgical
  specimens from growth-restricting procedures. THE FIELD''S CANONICAL DESCRIPTION OF THE HUMAN GROWTH PLATE IS
  A DESCRIPTION OF THE TALL TAIL, PHENOTYPE-SELECTED, WITH NO NORMAL-STATURE OR SHORT-STATURE COMPARATOR, AND NEITHER
  PAPER FRAMES IT THAT WAY. Every zone marker, every resting-zone sub-population and every abundance number quoted
  here from those datasets inherits that selection. Read favourably it is the best possible bias, since the reference
  tissue is the phenotype we want; read carefully it means no human plate has ever been compared against a control.
  And it makes a free experiment available on data that already exist, because predicted adult height IS the surgical
  indication so every donor has a height SDS in the clinical record.


  THE TALL TAIL IS A KNEE PHENOMENON AND HALF THE EVIDENCE FOR THAT IS ALLOMETRY. Five lines put the excess in the
  leg - Dinaric relative sitting height 52.0 to 52.3 per cent, constitutionally tall adolescents sitting below age
  norms with knee epiphysiodesis normalising the ratio, tanner1982leg''s Japanese secular gain being almost entirely
  leg with sitting height practically unchanged, and Maya migrants gaining 11.54 cm of which 6.83 is leg. But fredriks2005,
  across 14,500 Dutch children, shows the sitting-height ratio correlates NEGATIVELY with height SDS, so tall people
  have relatively long legs by construction and cross-sectional leg dominance is substantially an allometric artefact.
  What survives is the LONGITUDINAL evidence where the population is held constant and only the environment changes,
  and there the trunk does not move at all. That is a genuine anatomical localisation and it is unfavourable for
  a trunk-dominant residual. aeppli2025 adds the in-human demonstration that the compartments run independently:
  after knee epiphysiodesis girls gained 8.0 plus or minus 0.5 cm of sitting height and 0.2 plus or minus 0.4 cm
  of leg.


  THE ANTLER DECOMPOSED FOR THE FIRST TIME, AND THE ANSWER IS ARCHITECTURE NOT KINETICS. muir1988 places the antler
  mineralisation front 5 to 10 centimetres below the tip, so the unmineralised growth zone is 50 to 100 millimetres
  long, and blood volume rises about 194 millilitres per kilogram of antler. At 2 centimetres per day a cell transits
  that zone in 2.5 to 5 days, and a sub-millimetre mammalian growth plate has a transit time also measured in days.
  THE ANTLER IS NOT FAST BECAUSE ITS CELLS ARE FASTER OR BIGGER - IT IS FAST BECAUSE IT STACKS A ZONE TWO ORDERS
  OF MAGNITUDE LONGER IN SERIES, AND THE ENABLING CONDITION IS THAT ANTLER CARTILAGE IS VASCULAR so a five-centimetre
  depth of cartilage does not starve. That is R448''s oxygen ceiling read from the other end: the plate is a millimetre
  thick because that is what avascular cartilage supports, and the only organism that beat it did so by vascularising
  the cartilage - which connects to R443, where the human plate is avascular in bulk and breached focally. The transit
  arithmetic is derived here from two cited numbers; no label or transit study of the antler exists and its cell-cycle
  time, chondrocyte height and matrix per cell are unmeasured.


  AN INDEPENDENT TISSUE IN WHICH DELETING AN FGF RECEPTOR LOWERS HEDGEHOG AND SHORTENS THE STRUCTURE. pei2024 shows
  Gli1-CreER driven Fgfr2 conditional deletion gives shortened roots with impaired hedgehog signalling, rescued
  by modulating hedgehog. The subject is wild-type FGFR3 on a continuous pan-FGFR inhibitor, and R362 and R363 named
  the cilium-length question as the most urgent experiment in the file while R370 de-escalated it because the only
  cartilage measurement ran the other way. This is the same directional result in a third tissue, in a Gli1-positive
  mesenchymal progenitor, owing nothing to the cilium argument - though it is a tooth root and a conditional germline
  deletion rather than a drug or a plate. Its companion is the mammalian never-stopping engine: pei2023 shows loss
  of sensory innervation decreases mesenchymal stem cell number in the continuously growing incisor, with nerve-derived
  FGF1 acting on FGFR1 through an mTOR and autophagy axis that can be rescued. A NERVE IS A STEM-CELL NICHE, and
  autophagy sustaining a quiescent stem cell is one of R437''s eight zero-coverage processes. Nerve-to-physis signalling
  has only ever been studied as pathology.


  THE GREY LITERATURE, THREE ITEMS, EACH WITH ITS EVIDENCE GRADE. A Chinese patent claims a gene-edited SLC13A1
  minipig short-stature model that does not appear in the literature, and chondroitin sulfate at 70 mg/kg giving
  18.5 per cent height gain in mutants and 12.6 per cent in WILD-TYPE animals at n=3 with body weight unchanged
  - agent-reported and not independently verified here, recorded as a lead to verify rather than a result. brighton1983
  gave a dose-response for a non-invasive 60 kilohertz capacitively coupled field on oxytetracycline-labelled rabbit
  growth rate peaking near five volts peak-to-peak, and armstrong1986 then ran six weeks at that setting and found
  no significant difference in tibial LENGTH while stating in its own abstract that the apparatus may have impaired
  the animals'' overall growth - R441''s LIPUS shape exactly, a positive short-term rate proxy failing to convert
  into a length endpoint with a confound inside the null. dodge2007 forbids treating electrical stimulation as one
  thing: invasive direct current through an electrode in the plate causes bony bridging and growth ARREST and is
  proposed as an epiphysiodesis. And a structural negative completes CORR-350: a full-text query of the openFDA
  label corpus for increased bone length returns exactly one drug, somatropin, and it states a mechanism rather
  than reporting an animal measurement. CORR-350 is right that these reviews contain serial limb lengths invisible
  to PubMed; the distribution of those lengths is one-sided by construction, because a juvenile toxicity package
  is an adverse-findings document and being taller is not an adverse finding.


  AND THE FINDING THAT RUNS HARDEST AGAINST THIS PROJECT. The auxology literature agrees that most of the adult
  secular height increment has already accrued by age one and a half to two years, that the growth period ADVANCED
  IN TIMING AND SHRANK IN DURATION while height rose, and that South Korean women gained 20.2 centimetres in a century
  on a completely different genome. Every documented secular height gain in history was achieved with a growth period
  that got SHORTER and with the increment banked before school age. R440 already derived the consequence and it
  stands: if the plate carries a finite division budget then a gain delivered in a shortened period cannot be extra
  divisions either, so it must be YIELD PER DIVISION - which lands on CORR-361''s matrix term. And the compartment
  is wrong for this subject, since the secular mechanism is leg-directed and delivered before eighteen months.

  R452-ERA ADDENDUM, 2026-08-27: THE FULL TABLE 1 READ FROM THE PDF, AND IT IS STRONGER AND MORE SPECIFIC THAN
  THE ABSTRACT. Least-squares means with standard errors, ALL CONTROLLED FOR BODY MASS, at postnatal day 14,
  Control n=16, Longshanks 1 n=16, Longshanks 2 n=17. Tibia length 11.39, 12.11, 12.16 mm - both selected
  lines significantly above Control. Proximal growth plate 0.408, 0.506, 0.545 mm, significant. Total growth
  plate 0.516, 0.566, 0.601, significant. RESTING ZONE 0.050, 0.061, 0.078 mm, i.e. plus 22 and plus 56 per
  cent, with LS2 significantly above both. PROLIFERATIVE ZONE 0.200, 0.253, 0.273 mm, plus 27 and plus 37 per
  cent, both significant. NUMBER OF PROLIFERATIVE CHONDROCYTES PER COLUMN 25, 29, 33, plus 16 and plus 32 per
  cent, both significant. And then the three that did not move, none of which carries a significance
  superscript: HYPERTROPHIC ZONE 0.249, 0.228, 0.231 mm - numerically SMALLER in both selected lines; NUMBER
  OF HYPERTROPHIC CHONDROCYTES 18, 18, 18 - identical; LAST HYPERTROPHIC CHONDROCYTE HEIGHT 0.030, 0.029,
  0.030 mm - IDENTICAL TO THREE DECIMAL PLACES. Growth rate 0.35, 0.41, 0.43 mm/day, ANCOVA P below 0.001,
  while growth was 99 per cent complete on day 69, 70 and 71 - so RATE differs and DURATION does not. And
  labelling indices did not differ between the three groups at two, six or 24 hours, so the proliferative
  chondrocytes do not cycle faster.


  SO THE DECOMPOSITION IS EXACT: TWENTY GENERATIONS OF DIRECTIONAL SELECTION ON TIBIA LENGTH MOVED THE
  RESTING POOL AND THE NUMBER OF AMPLIFYING CELLS, AND MOVED NEITHER PROLIFERATION RATE, NOR TERMINAL CELL
  SIZE, NOR THE PERIOD, BY ANY DETECTABLE AMOUNT.


  AND THE REFRAME THAT MATTERS, WHICH THE ABSTRACT CANNOT SUPPORT AND THE TABLE CAN: SELECTION MOVES WHAT HAS
  VARIANCE, NOT WHAT HAS LEVERAGE. Terminal cell enlargement contributes 44 to 59 per cent of daily elongation
  by wilsman1996''s closed partition, and it was INVARIANT to twenty generations of selection - 0.030, 0.029,
  0.030 mm. That does not make it unimportant. It makes it a HARD-CONSTRAINED term, and it means a
  PHARMACOLOGICAL handle on terminal cell height accesses variance that selection cannot reach, rather than
  being redundant with what evolution already optimised. R436 read this paper as evidence against the h_term
  arm; on the full table the correct reading is the opposite one.


  THE AUTHORS'' OWN CAVEAT, VERBATIM IN SUBSTANCE AND UNCHANGED: the cell proliferation data provide evidence
  that the differences in Longshanks likely derive from an earlier developmental time point, whether through a
  larger pool of undifferentiated resting-zone cells or through early embryonic factors such as anlagen size
  or the timing of the primary and secondary ossification centres. CORR-299 therefore governs any inference
  from this to an open postnatal plate - but note that the FIRST of the two mechanisms the authors offer is
  the resting-zone pool, which is exactly the N term, and which their own Table 1 shows expanded by 56 per
  cent in the longer-tibia line.'
