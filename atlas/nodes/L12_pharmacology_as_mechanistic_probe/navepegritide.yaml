localization:
  - "human growth plate: presumed site of action via NPR2; drug concentration at the plate unmeasured"
human_evidence: direct
human_evidence_note: >-
  Randomised, double-blind, placebo-controlled phase 2b trial with a prespecified
  annualised growth velocity endpoint and posted results, followed by US accelerated approval.
species_basis: [human]
translation_risk: low
translation_risk_reason: >-
  The efficacy estimate comes from a human RCT with posted results. The residual risk is
  not species translation but endpoint translation: growth velocity at 52 weeks is a
  surrogate for adult height, and the target-tissue exposure that supposedly drives it
  has never been measured.
confidence: A
claim_grades:
  - claim: Once-weekly navepegritide 100 ug/kg raises annualised growth velocity by 1.49 cm/yr over 52 weeks versus placebo in achondroplasia aged 2-11 y.
    grade: A
    basis: Double-blind placebo-controlled RCT with posted results, n=84.
  - claim: The growth benefit is produced by sustained CNP occupancy of NPR2 in growth plate chondrocytes.
    grade: C
    basis: Mechanism is inferred from NPR2 biology and animal work; no human growth plate pharmacodynamic measurement, and plasma cGMP is the only engagement biomarker.
  - claim: Continuous weekly exposure is pharmacologically superior to daily peak dosing.
    grade: D
    basis: Contradicted by cross-trial comparison - see cnp_analog_pk_challenge; the 1.49 cm/yr effect overlaps the 1.57 cm/yr from once-daily vosoritide despite a ~300-fold difference in exposure duration.
