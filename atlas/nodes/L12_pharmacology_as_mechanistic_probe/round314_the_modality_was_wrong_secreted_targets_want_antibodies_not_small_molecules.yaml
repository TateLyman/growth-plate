- romosozumab precedent
- CORR-337
- CHAD axis in human growth plate
- SOST is not in the growth plate
type: hypothesis
layer: L12
stub: false
summary: "ZERO - THE ERROR, AND IT IS A FRAMING ERROR RATHER THAN A SEARCH ERROR. Round 298 ran every gene\nthe\
  \ atlas had ever nominated against Open Targets, found 202 of 298 with no drug, and concluded: \"growth-plate\n\
  control is TFs, secreted morphogen modulators, matrix and channels; the pharmacopoeia is kinases, GPCRs and\n\
  nuclear receptors. Stop treating each 'no molecule' as news.\" That sentence has governed every round since,\n\
  and for the SECRETED subset it is wrong. **Secreted proteins are the EASIEST class for a biologic** - they sit\n\
  in the extracellular space, need no membrane traversal and no cell entry, and neutralising them is routine,\n\
  industrialised antibody engineering. The atlas applied a small-molecule filter to the one target class where\n\
  that filter is least informative, and then read the resulting emptiness as a fact about biology.\n**This matters\
  \ because R287's LAYER - the extracellular control of morphogen availability - is where BOTH of\nthe atlas's open-plate\
  \ passes live.** HHIP and FBN1 are secreted. CHAD is secreted. SCUBE3 is secreted.\n\nONE - THE TRACTABILITY CHECK,\
  \ RUN ON THE MODALITY I HAD NEVER QUERIED.\n| target | antibody tractability | small-molecule tractability | drugs\
  \ |\n|---|---|---|---|\n| **SOST** | **Approved Drug**, loc high conf, GO CC high conf, signal peptide | High-Quality\
  \ Ligand | **ROMOSOZUMAB (approved)** |\n| **CHAD** | loc med conf, signal peptide, GO CC med conf | **none**\
  \ | 0 |\n| **HHIP** | loc med conf, signal peptide, GO CC med conf | Structure with Ligand, High-Quality Pocket\
  \ | 0 |\n| **SCUBE3** | loc **high** conf, GO CC high conf, signal peptide, HPA loc | **none** | 0 |\n| NRK |\
  \ **none** (intracellular kinase) | Druggable Family | 0 |\n⭐ **SOST IS THE PROOF OF PRINCIPLE AND IT IS EXACT.**\
  \ Sclerostin is a SECRETED antagonist of a morphogen\npathway, with a bone phenotype, and the approved drug against\
  \ it is **an ANTIBODY, not a small molecule** -\nromosozumab, monthly subcutaneous, approved for osteoporosis\
  \ with fracture endpoints in humans. That is the\nsame target architecture as HHIP and CHAD, in the same organ\
  \ system, already solved.\n✓ **NRK behaves as the negative control it should be:** it is an intracellular kinase,\
  \ so it has SM\ntractability and NO antibody tractability. The classification is doing real work, not labelling\
  \ everything.\n\nTWO - ⛔ AND THE SAME QUERY KILLS THE OBVIOUS SHORTCUT, WHICH IS WHY IT WAS WORTH RUNNING.\nRomosozumab\
  \ is approved, cheap to reason about, and raises Wnt. Two independent reasons it is not a candidate:\n· **SOST\
  \ IS ABSENT FROM THE POSTNATAL HUMAN GROWTH PLATE - 0 of 14 samples, 0.09 CPM, max 0.26% of cells**\n  (GSE288028).\
  \ CORR-327's receiver rule: the target is not in the tissue.\n· ⭐ **AND THAT RETRO-CONFIRMS A SUSPICION FROM ROUND\
  \ 312.** Sost appeared in R312's brake-like list\n  (age +1.74/+2.54, site +2.44/+4.42) and was flagged there\
  \ as probable osteocyte contamination alongside\n  Bglap and Mepe. It was. **BGLAP is 11/14 at 50.7 CPM and SP7\
  \ 12/14 in the same human data, so the\n  osteoblast lineage genuinely is in these samples** - the contamination\
  \ R312 measured in rodent dissections\n  is real in human tissue too, and SOST specifically is not a growth-plate\
  \ gene.\n· Direction would have failed anyway: R281's band says LOWER canonical Wnt is the lengthening direction,\
  \ and\n  blocking sclerostin RAISES Wnt.\n\nTHREE - ✓ THE FULL CHAD AXIS IS IN THE POSTNATAL HUMAN GROWTH PLATE,\
  \ AND IT PASSES CORR-327 COMPLETELY.\nGSE288028, 14 samples, 79,934 cells:\n· **CHAD itself 60.1 CPM, 12/14 samples,\
  \ up to 75.6% of cells** - abundant, not marginal.\n· **The integrin receptor is there** - ITGB1 **299.5 CPM in\
  \ 62% of cells**, ITGA2 14.1 CPM 12/14.\n· **The heparan-sulfate arm is there too**, which the C-terminal peptide\
  \ needs: SDC2 166.4, SDC4 113.7,\n  GPC1 180.1, GPC6 197.7.\n· CHADL, the paralogue, is also present at 48.0.\n\
  => Ligand, receptor and co-receptor system all present in the target tissue. Very few things in this atlas\nclear\
  \ that bar; the CNP arm does not (NPPC is 0/14), the RAAS does not, PDE5A does not.\n⚠ **ONE COMPOSITIONAL SURPRISE\
  \ WORTH RECORDING: ITGA10 is 192.3 CPM, THIRTEEN-FOLD ABOVE ITGA2.** Alpha-10-\nbeta-1 is the cartilage-specific\
  \ collagen receptor, so in this tissue alpha-2-beta-1 is a minor collagen\nreceptor - which makes alpha-2-beta-1\
  \ blockade less indiscriminate here than the general integrin literature\nwould suggest.\n\nFOUR - ⛔ BUT THE RECEPTOR\
  \ SHORTCUT IS STILL CLOSED, BY DATA ALREADY ON DISK.\nClinical-stage alpha-2-beta-1 antagonists exist, so the\
  \ tempting move is to block CHAD's receptor rather than\nCHAD. **IMPC: Itga2-null TIBIA LENGTH -1.072, P=0.041,\
  \ homozygote.** Losing the receptor SHORTENS the bone.\n⚠ Graded with CORR-329 applied: 63.7% of all IMPC knockouts\
  \ are shorter and the median effect is -0.212, so\nthe SIGN here is the common direction and only the magnitude\
  \ is notable. It is not a strong result. But it\npoints the wrong way for a receptor-blockade strategy, and there\
  \ is no countervailing evidence.\n=> **The target is the CHAD-alpha2beta1 INTERACTION, or CHAD itself, not the\
  \ integrin.** Which is exactly\nwhat a neutralising antibody against CHAD would do and a receptor blocker would\
  \ not.\n\nFIVE - ✓ BINDERS AGAINST HHIP ALREADY EXIST, AND HHIP HAS ALREADY BEEN MADE AS A BIOLOGIC.\n· **Monoclonal\
  \ and polyclonal anti-HHIP antibodies are sold by multiple vendors** (including a mouse\n  monoclonal clone 5D11\
  \ and rabbit monoclonal HL1969). These are RESEARCH REAGENTS, not neutralising or\n  therapeutic antibodies, and\
  \ the distinction is the whole ballgame - but they establish that the protein is\n  immunogenic, that binders\
  \ are obtainable, and that the epitope space is accessible.\n· **Fc-fused HHIP has already been manufactured and\
  \ dosed in mice** (`ye2025`, already in this atlas) - the\n  wrong direction therapeutically, but proof that HHIP\
  \ is a manufacturable, administrable biologic. The\n  reverse construct is the same technology stack.\n· `griffiths2021`\
  \ supplies the epitope map a neutralising antibody would aim at: two SHH-binding sites, two\n  GAG-binding sites\
  \ (site 1 on the beta-propeller, site 2 on the EGF repeats), and a cholesterol-binding CRD.\n=> **What is missing\
  \ for HHIP is not a modality, a manufacturing route, or an epitope. It is one\nfunction-blocking antibody that\
  \ nobody has made.**\n\nSIX - WHAT THIS ROUND CHANGES, STATED CAREFULLY SO IT IS NOT OVERSOLD.\nIt does NOT produce\
  \ a compound. No anti-HHIP or anti-CHAD neutralising antibody exists, and asserting that\none would work is exactly\
  \ the kind of claim this file exists to prevent.\nWhat it changes is the STANDING CONCLUSION. \"No molecule exists,\
  \ and that is the base rate for this biology\"\nbecomes: **\"no SMALL molecule exists, which is the base rate\
  \ for SECRETED targets and says almost nothing\nabout whether they are addressable.\"** The correct reading of\
  \ R298's 202-of-298 is that the atlas's target\nlist is enriched for a class the small-molecule pharmacopoeia\
  \ does not serve and the biologics pharmacopoeia\ndoes. Rounds 294, 301, 302, 311, 312 and 313 all closed items\
  \ partly on \"no molecule\"; every one of those\nclosures that concerned a SECRETED target should be re-read with\
  \ this in mind.\n⭐ **THE RANKED ASK, AND IT IS NOW A CONSTRUCTION PROBLEM RATHER THAN A DISCOVERY PROBLEM:**\n\
  1. **A function-blocking anti-HHIP antibody** - best-validated target in the atlas (human pLoF +9.92 cm;\n   haraguchi2025\
  \ femur +4.5% at 53 wk with the plate held open; two-species low-output-plate enrichment from\n   R312), epitopes\
  \ mapped, protein already made as an Fc fusion, binders commercially available.\n2. **A neutralising anti-CHAD\
  \ antibody, or a blocker of the LRRWLEAK318-alpha2beta1 interaction** - human\n   pLoF +2.63 cm at P=4.0e-10,\
  \ whole axis present in human tissue, motif known to eight residues.\n3. **Recombinant SCUBE3** - the one target\
  \ whose direction is to SUPPLY rather than block, declining with age\n   in two species (R312), highest antibody-tractability\
  \ confidence of the three.\n✗ All three still need the same thing the atlas has always needed and never had: **a\
  \ length endpoint in a\nnormal growing animal.**"
human_evidence: indirect
human_evidence_note: The tractability classifications and the SOST/romosozumab precedent are human. The expression
  data are human - GSE288028, 14 postnatal growth-plate samples, 79,934 cells - and supply both the positive result
  (CHAD 60.1 CPM with ITGB1 at 299.5 and the syndecan/glypican system present) and the negative one (SOST 0 of 14).
  The burden effects are human (CHAD +2.63 cm, HHIP +9.92 cm). The Itga2 length result is mouse. No antibody against
  HHIP or CHAD has been tested in any species for any skeletal endpoint.
species_basis: human
translation_risk: moderate
translation_risk_reason: 'MODERATE, unusually for this file, because the central claim is about MODALITY rather
  than about biology, and it rests on human tractability annotation plus an approved human drug against a structurally
  analogous target in the same organ system. What remains high-risk is everything downstream: no neutralising antibody
  exists against either target, a research-grade binder is not a function-blocking antibody, and the step from ''antibody-tractable''
  to ''antibody that changes bone length'' has never been taken for any target in this atlas. The Itga2 receptor
  result is mouse and sits at the common sign for IMPC knockouts.'
confidence: B
confidence_reason: 'Graded B. The modality argument is A - it rests on an approved drug, romosozumab, against a
  secreted morphogen-pathway antagonist with a bone indication, and on tractability annotations that classify NRK
  correctly as antibody-untractable, so the classification is discriminating. The CHAD axis expression result is
  A, from 14 human samples with internal controls. The SOST exclusion is A and doubles as confirmation of a contamination
  call from round 312. What holds the round to B is that it produces no agent: every forward step is a construction
  project, and the file''s own history says construction projects that nobody has funded do not become compounds.'
limitations: No neutralising antibody against HHIP, CHAD or SCUBE3 exists in any species, so the round converts
  a search problem into a construction problem rather than solving it. Open Targets tractability is an annotation
  pipeline, not an experiment - 'signal peptide plus extracellular localisation' predicts that an antibody CAN reach
  the target, not that blocking it does anything useful. Commercially available anti-HHIP antibodies are research
  reagents; none is characterised as function-blocking. Antibody access to the growth plate is itself unestablished
  - the plate is avascular and alymphatic, which is the exact problem ye2026's chondrocyte-membrane nanoparticles
  were built to solve for a SMALL molecule, and a 150 kDa IgG faces it far more severely than vosoritide's 4.1 kDa
  peptide does. That objection is serious and is not resolved here. The Itga2 result is a single IMPC line at the
  common sign for the screen.
