claim_grades:
- claim: The atlas's secreted targets are undruggable.
  grade: X
  species: human
  source_ref: opentargets_tractability
  basis: 'NO - they are un-SMALL-MOLECULE-able, which is a different and much weaker statement. CHAD, HHIP and SCUBE3
    all carry antibody tractability from confirmed extracellular localisation and signal peptides; CHAD and SCUBE3
    have no small-molecule tractability at all. The decisive precedent is SOST: a secreted antagonist of a morphogen
    pathway with a bone phenotype, whose approved drug is the ANTIBODY romosozumab. Round 298''s conclusion that
    the pharmacopoeia does not serve this biology was computed on drug counts dominated by small molecules, and
    is the wrong filter for the one target class where both of the atlas''s open-plate passes live. The classification
    discriminates properly - NRK, an intracellular kinase, comes back antibody-untractable and small-molecule-tractable.'
- claim: Romosozumab is a candidate for this case.
  grade: X
  species: human
  source_ref: gse288028
  basis: 'NO, on the atlas''s own receiver rule. SOST is detected in 0 of 14 postnatal human growth-plate samples
    at 0.092 CPM and a maximum of 0.26% of cells, while BGLAP (50.7 CPM, 11/14) and SP7 (12/14) show the osteoblast
    lineage IS present in the same samples - so the absence is specific, not a sensitivity floor. This also retro-confirms
    round 312''s flag that its brake-like Sost signal was osteocyte contamination. The direction would have failed
    independently: R281''s band makes LOWER canonical Wnt the lengthening direction and blocking sclerostin raises
    it.'
- claim: The whole CHAD axis is present in the postnatal human growth plate.
  grade: A
  species: human
  source_ref: gse288028
  basis: 'CHAD 60.1 CPM in 12 of 14 samples and up to 75.6% of cells; the integrin partner ITGB1 at 299.5 CPM in
    62% of cells with ITGA2 at 14.1 in 12/14; and the heparan-sulfate co-receptor system the C-terminal peptide
    requires - SDC2 166.4, SDC4 113.7, GPC1 180.1, GPC6 197.7. Ligand, receptor and co-receptor all present in the
    target tissue, which the CNP arm does not manage (NPPC 0/14), nor the RAAS, nor PDE5A. Compositional note: ITGA10
    at 192.3 CPM is 13-fold above ITGA2, so alpha-2-beta-1 is a MINOR collagen receptor in cartilage.'
- claim: Blocking integrin alpha-2-beta-1 is a usable route to CHAD.
  grade: X
  species: mouse
  source_ref: impc_statistical_results
  basis: 'NO on present evidence. IMPC Itga2-null tibia length is -1.072 at P=0.041 - losing the receptor SHORTENS
    the bone, the opposite of what is wanted. Graded X rather than merely unsupported because there is no countervailing
    evidence, but held weakly: CORR-329 says 63.7% of IMPC knockouts are shorter with a median of -0.212, so the
    sign is the common direction and only the magnitude stands out. The consequence is that the target is the CHAD-alpha2beta1
    INTERACTION or CHAD itself, not the integrin - which is what a neutralising antibody addresses and a receptor
    blocker does not.'
- claim: A function-blocking antibody against HHIP or CHAD exists.
  grade: X
  species: human
  source_ref: opentargets_tractability
  basis: NO, and this is the honest limit of the round. Multiple vendors sell anti-HHIP monoclonal and polyclonal
    antibodies, but these are research reagents and none is characterised as function-blocking; the distinction
    between a binder and a neutraliser is the entire remaining problem. What the reagents do establish is that the
    protein is immunogenic and its epitope space accessible, and ye2025 already shows Fc-fused HHIP can be manufactured
    and dosed in mice, so the modality and the manufacturing route both exist. griffiths2021 maps the epitopes a
    neutraliser would target. The missing item is one antibody nobody has made, not a technology.
