id: round314_the_modality_was_wrong_secreted_targets_want_antibodies_not_small_molecules
name: ROUND 314 - the atlas has spent fifteen rounds asking whether its targets have a SMALL MOLECULE, and its two
  best targets are SECRETED proteins, for which the natural modality is a neutralising antibody or a trap. CHAD,
  HHIP and SCUBE3 all carry the antibody-tractability profile that SOST carries, and SOST's antibody is approved
  for a bone indication. The class is not undruggable - it is un-small-molecule-able
aliases:
