contradicts: This round REFRAMES round 298's druggability base rate, which has governed every round since, and therefore
  partially reopens closures made on 'no molecule exists' wherever the target was SECRETED - rounds 294, 301, 302,
  311, 312 and 313 all contain such closures. The corrected statement is that no SMALL molecule exists, which for
  a secreted protein is close to uninformative, because the natural modality is a neutralising antibody and the
  precedent is an approved one against an analogous target in the same organ system. It simultaneously CLOSES romosozumab
  itself, on the receiver rule, and in doing so confirms round 312's suspicion that its brake-like Sost signal was
  osteocyte contamination. It does NOT produce an agent, and the avascular, alymphatic nature of the growth plate
  is a serious unresolved objection to any 150 kDa biologic reaching it.
