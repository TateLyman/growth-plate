contradicts:
- 'OVERTURNS THE ROUND-191 CONCLUSION THAT NO BONE-LENGTH DOSE-RESPONSE EXISTS. That round documented
  five studies that measured length and did not report it and concluded the gap was a discipline
  artifact. The artifact claim survives for the other four, but vahle2002 DID report it - dose-dependently,
  in 60 animals per sex per group, across four dose levels.'
- 'WALKS BACK THE ROUND-191 HEAD-TO-HEAD. wang2023 was recorded as favouring abaloparatide on condylar
  length in adolescent wild-type rats. The effect required 8 milligrams per kilogram and there was none at
  80 micrograms per kilogram, which is the dose ogawa2002 used.'
