id: round193_femoral_length_found_and_the_complete_gap_list
name: ROUND 193 - PTH(1-34) increases femoral length dose-dependently in normal rats, the head-to-head
  deflates to a 100-fold overdose, and the complete list of what is still missing
type: hypothesis
layer: L12
aliases:
- femoral length found
- vahle2002 read
- the complete gap list
- round 193
stub: false
summary: 'THE NUMBER THIS PROGRAMME HAS BEEN HUNTING FOR SINCE ROUND 184 EXISTS, AND IT WAS IN THE
  CARCINOGENICITY PAPER THAT EVERYONE CITES FOR OSTEOSARCOMA AND NOBODY READS FOR LENGTH.

  vahle2002, Methods: "Length and lateral-medial width was measured for the femur using calipers."
  Results: "PTH(1-34) DOSE-DEPENDENTLY INCREASED FEMORAL LENGTH BY 5 PER CENT IN MALES AND 6 PER CENT IN
  FEMALES and femoral width by 33 per cent in males and 32 per cent in females."

  THE DESIGN IS STRONGER THAN ANYTHING ELSE IN THIS FILE. Fischer 344 rats randomised at SIX TO EIGHT
  WEEKS OF AGE - actively growing - given daily subcutaneous PTH(1-34) for TWO YEARS at 0, 5, 30 and 75
  micrograms per kilogram, SIXTY PER SEX PER GROUP, femoral length by calipers, ANOVA with Fisher''s
  protected least significant difference. Wild-type animals, no disease model, four dose levels, and an
  actual limb-bone length rather than a zone height or a nose-to-tail measurement. This is the
  dose-response that round 191 concluded did not exist anywhere.

  THREE CAVEATS AND THE FIRST IS THE AUTHORS'' OWN. They write that "although skeletal growth is reduced
  after approximately 12 months, there continues to be longitudinal skeletal growth throughout life.
  This is in contrast to primates whose growth plates close and longitudinal growth ceases between 18 to
  30 years of age. Thus, extreme gains in bone mass can be induced in rats by daily injections of PTH
  throughout their life. In contrast, comparable changes are not possible in osteonal remodeling species
  given PTH daily for a relatively short portion of the normal life span." THE 5 TO 6 PER CENT ACCRUED
  OVER TWO YEARS IN AN ANIMAL WHOSE GROWTH PLATES NEVER CLOSE. A human at bone age 16 has months, not a
  lifetime, and a plate that will fuse.

  SECOND, WIDTH ROSE SIX TIMES MORE THAN LENGTH - 33 against 5 per cent. This is overwhelmingly a
  periosteal appositional agent and longitudinal gain is a minor side effect of it.

  THIRD, AND THIS ONE IS UNRESOLVED AND MATTERS: caliper femoral length in an animal with marked
  trabecular hypertrophy and focal bone proliferative lesions could be inflated by PERIARTICULAR NEW
  BONE rather than by physeal elongation. Nothing in the paper distinguishes them. The histology exists -
  vahle2004 describes taking a longitudinal femoral section containing diaphysis, distal metaphysis and
  epiphysis - but no growth plate histomorphometry is reported in either paper.

  AND THE PER-DOSE VALUES ARE IN FIGURE 1, NOT IN THE TEXT. Whether the effect is already significant at
  5 micrograms per kilogram, or only at 75, is the number that decides whether this is reachable in a
  human. It is unknown to this atlas.

  NOW THE DEFLATION, AND ROUND 191 HAS TO WALK BACK. wang2023 was recorded last round as a head-to-head
  favouring abaloparatide, on condylar length in adolescent wild-type rats. THE DOSES ARE 8 MILLIGRAMS
  PER KILOGRAM, 800 MICROGRAMS PER KILOGRAM AND 80 MICROGRAMS PER KILOGRAM. The paper states that "the
  condylar length in the TPTDhigh and ABLhigh groups were significantly greater than that in the control
  group, whilst MID- OR LOW-DOSE TPTD OR ABL HAD NO EFFECTS ON THE CONDYLAR GROWTH." The condylar length
  effect required EIGHT MILLIGRAMS PER KILOGRAM - one hundred times the ogawa2002 dose and roughly six
  thousand times the approved human dose per kilogram. AT 80 MICROGRAMS PER KILOGRAM, EXACTLY THE
  ogawa2002 DOSE, THERE WAS NO EFFECT. Mandibular body length required drug PLUS mechanical loading;
  drug alone did nothing at any dose. And n = 5 per group across 14 groups. The "abaloparatide more
  potent" conclusion rests on mandibular body HEIGHT at high dose with five animals.

  SO THE EVIDENCE BASE FOR LENGTH IN A NORMAL GROWING ANIMAL IS NOW FOUR STUDIES AND THEY DISAGREE BY
  DOSE. vahle2002: rat femur, +5 to 6 per cent, DOSE-DEPENDENT across 5 to 75 micrograms per kilogram,
  n=60 per sex per group, two years. ogawa2002: rat proximal tibia, +13.5 per cent longitudinal growth
  rate at 80 micrograms per kilogram over three weeks, n=6. bartlow2017: mouse, NO enduring body length
  change at 40 micrograms per kilogram over eight weeks, n=9 per timepoint, crude endpoint. wang2023:
  rat condyle, nothing at 80 or 800 micrograms per kilogram, an effect only at 8 milligrams per
  kilogram. Two positives, one null, one dose-absurd positive - and the largest and best-powered study
  is a positive with a dose-response.'
