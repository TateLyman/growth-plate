localization:
- 'the whole femur by calipers - which cannot distinguish physeal elongation from periarticular new bone'
human_evidence: absent
human_evidence_note: 'This round is entirely rat. The human position is unchanged from round 192 - no
  eucalcaemic human has received a PTH1R agonist with a growth endpoint, and the only human growth data
  is replacement dosing in hypoparathyroid children.'
species_basis:
- rat
translation_risk: high
translation_risk_reason: 'The authors state the transferability problem themselves and it is the decisive
  one: rat growth plates never close, so two years of daily PTH acts on a permanently open physis, while
  a human at bone age 16 has a closing plate and months of runway. The 5 to 6 per cent is also an
  integral over two years, not a rate.'
confidence: C
claim_grades:
- claim: No study reports bone length under a PTH1R agonist in a normal growing animal with a
    dose-response.
  grade: X
  basis: 'FALSE, AND THIS ATLAS SAID IT FOR TEN ROUNDS. vahle2002 measured femoral length by calipers in
    Fischer 344 rats from 6 to 8 weeks of age across four dose levels with 60 animals per sex per group
    and reports a dose-dependent increase of 5 per cent in males and 6 per cent in females. It is the
    largest, best-powered, multi-dose wild-type length result in the literature and it was in the paper
    the field cites for osteosarcoma.'
- claim: PTH(1-34) lengthens the femur in a normal growing rat.
  grade: C
  basis: 'DOSE-DEPENDENT, n=60 PER SEX PER GROUP, SIGNIFICANT AGAINST VEHICLE. Held at C not B for three
    reasons: the gain accrued over two years in an animal whose growth plates never close, which the
    authors themselves flag as the reason rat results do not transfer; femoral width rose six times more
    than length so the agent is primarily appositional; and caliper length cannot distinguish physeal
    elongation from periarticular new bone in a skeleton with marked trabecular hypertrophy and
    proliferative lesions.'
- claim: The wang2023 head-to-head supports abaloparatide at a clinically meaningful dose.
  grade: X
  basis: 'NO, AND ROUND 191 OVERSTATED IT. The condylar length effect required 8 MILLIGRAMS PER KILOGRAM -
    100 times the ogawa2002 dose. The paper states mid-dose (800 mcg/kg) and low-dose (80 mcg/kg) had NO
    effect on condylar growth. Mandibular body length needed drug plus mechanical loading. n=5 per group.
    The head-to-head remains the only one that exists but it does not speak to reachable doses.'
- claim: The femoral length gain in vahle2002 is growth plate elongation.
  grade: E
  basis: 'ASSUMED, NOT SHOWN, AND THERE IS A SPECIFIC ALTERNATIVE. These animals had marked trabecular
    hypertrophy and focal bone proliferative lesions. Caliper length measures end to end and would include
    periarticular new bone. No growth plate histomorphometry is reported in either Vahle paper, although
    vahle2004 describes taking longitudinal femoral sections containing epiphysis and metaphysis, so the
    slides exist.'
