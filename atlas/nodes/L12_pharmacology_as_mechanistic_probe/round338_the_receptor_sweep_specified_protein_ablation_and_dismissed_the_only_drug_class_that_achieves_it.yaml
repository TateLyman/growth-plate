id: round338_the_receptor_sweep_specified_protein_ablation_and_dismissed_the_only_drug_class_that_achieves_it
name: 'Round 338 - the receptor-level sweep derived that plate closure needs ERalpha PROTEIN and then filed
  the one drug class that destroys protein under the blockers. The first approved PROTAC changes what is
  obtainable.'
aliases:
- vepdegestrant growth plate
- ARV-471 height
- ERalpha PROTAC versus SERD at the growth plate
- protein ablation versus AF-2 blockade
- the oestrogen ceiling is at the receptor not the ligand
type: hypothesis
layer: L12
stub: false
summary: 'THE OPERATOR ASKED FOR SOMETHING LARGE AND EXPLICITLY DEPRIORITISED RISK. This is the largest
  mechanistically-anchored proposal this file has produced, it is built almost entirely out of data the
  atlas ALREADY HELD, and the reason it was never assembled is a single miscategorisation inside the atlas''s
  own closing argument.

  WHAT THE ATLAS ALREADY CONCLUDED. the_receptor_level_oestrogen_sweep ran every antioestrogen class and
  closed them ALL - not on absence of data but on a stated mechanism. Growth plate closure is driven by
  ERalpha functions that DO NOT require ligand: brjesson2012 showed ERalphaAF-1(0) mice have a HYPERACTIVE
  receptor whose plates CLOSE while wild-type plates stay open, and movrareskrtic2014 showed ERalpha lacking
  AF-2 is constitutively active without ligand. Every marketed antioestrogen - SERM, pure antagonist, SERD,
  CERAN, SERCA - is an AF-2 agent, i.e. it removes or blocks LIGAND-DEPENDENT signalling. They are aimed
  at a function that does not need the thing they block. The sweep''s own words for what WOULD work: "it
  is the whole receptor protein that is gone, both activation functions and the membrane pool with it.
  No drug does that."

  THE MISCATEGORISATION. Nine lines later the same node lists "the ERalpha PROTAC vepdegestrant" among
  agents that "are also all AF-2 agents by design, so the mechanism above predicts the same null." A PROTAC
  is not an AF-2 agent. It is a heterobifunctional molecule that binds an E3 ubiquitin ligase and the receptor
  simultaneously and triggers UBIQUITINATION AND PROTEASOMAL DESTRUCTION OF THE ERalpha PROTEIN - AF-1,
  AF-2, the DNA-binding domain and the membrane pool going together, catalytically. Its ER-binding warhead
  engages the ligand-binding domain, which is presumably why it was filed with the blockers, but the warhead
  is the addressing mechanism and degradation is the effect. THE NODE SPECIFIED PROTEIN ABLATION AS THE
  REQUIREMENT AND THEN DISMISSED THE ONLY DRUG CLASS THAT ACHIEVES IT, IN THE SAME PARAGRAPH.

  AND A SECOND ARM WAS DROPPED - CORR-309 FOR THE FIFTH TIME, AND AGAIN IT IS THE ARM THAT SUPPORTS THE
  LEVER. The sweep used brjesson2010 to argue the compartment is wrong: cartilage-specific ERalpha-null
  mice "grew NORMALLY through sexual maturation", so plate ERalpha is not carrying the pubertal effect.
  True, and it is half the paper. THE ABSTRACT CONTINUES: "Adult cartilage-specific ERalpha(-/-) mice continued
  to grow after 4 months of age, whereas growth was limited in control mice, resulting in INCREASED FEMUR
  LENGTH in 1-year-old cartilage-specific ERalpha(-/-) mice." The authors'' own conclusion is that plate
  ERalpha is unimportant during early sexual maturation and IS essential for the reduction of longitudinal
  bone growth in ELDERLY mice. So plate ERalpha is dispensable early and becomes the operative brake LATE
  - which inverts the compartment objection for this subject specifically, because bone age 16 is the late
  window, not the pubertal one.

  THE RESULT THAT ASSEMBLES: A PROTEIN-ABLATION DOSE-RESPONSE WITH LENGTH ENDPOINTS. Four perturbations
  of one receptor, ordered by how much PROTEIN is removed, all with bone length or plate status measured
  - see the quantitative block. Remove the whole protein and the plate stays open and the bone lengthens
  (ERalpha-/-, tibia +8.3%, plate height +18%). Remove the protein only in cartilage and growth continues
  past the age at which controls stop. Remove one DOMAIN while retaining the protein and you get a hyperactive
  receptor that CLOSES every plate. Block the ligand or the ligand-binding function and nothing happens
  in a wild-type animal at all. The ordering is monotone in protein removed and it is the opposite of the
  ordering in ligand blocked. brjesson2012''s authors state the human parallel themselves - the ERalpha-null
  phenotype "resembl[es] the growth phenotype of patients with inactivating mutations in ERalpha or aromatase".

  WHY THIS IS NOT THE ANASTROZOLE ARM AGAIN (Step 0). Anastrozole removes LIGAND. R274 established that
  removing MORE ligand buys nothing - and R337 closed the last loophole in that finding by showing letrozole
  suppresses every estrogen fraction more deeply than anastrozole, including the tissue estrone-sulfate
  reservoir (90.1% vs 72.9%), and still delivers no extra height. Those two facts together are not evidence
  that oestrogen stopped mattering; they are evidence that THE LIGAND ARM IS SATURATED AND THE RESIDUAL
  DRIVE IS LIGAND-INDEPENDENT - which is exactly what brjesson2012 and movrareskrtic2014 say the closure
  function is. The ligand-independent component is the step nothing in this stack touches. That is a genuinely
  different node, and it also EXPLAINS the aromatase-inhibitor ceiling rather than merely restating it.

  WHAT IS OBTAINABLE, AND THIS IS NEW SINCE THE SWEEP WAS WRITTEN. VEPDEGESTRANT (ARV-471, Veppanu) WAS
  APPROVED BY THE FDA ON 1 MAY 2026 - the first PROTAC ever approved - oral, 200 mg once daily with food,
  well tolerated at that dose with no dose-limiting toxicities in phase 1 and a randomised phase 3 (VERITAC-2)
  run head-to-head against FULVESTRANT, which is the very AF-2 agent this atlas tested at a growth plate
  and found null. When the sweep was written this class was investigational; it is now prescribable.

  WHAT WOULD KILL IT, STATED BEFORE IT IS PROPOSED. (1) sims2012 IS THE WARNING SHOT AND IT IS A HUMAN
  PAEDIATRIC TRIAL: fulvestrant in 30 growing girls slowed bone-age advancement significantly (1.99 to
  1.06, p=0.0007) and PREDICTED ADULT HEIGHT DID NOT MOVE (163.0 to 163.5 cm) because growth velocity fell
  with the clock. Slowing maturation without preserving velocity buys nothing - failure mode 1 inverted.
  The defence is that fulvestrant is an AF-2 blocker and a poor in-vivo degrader, so the atlas''s own mechanism
  PREDICTS that null; but the defence is untested and the observation is human. (2) smith2008: in the human
  ESR1-null propositus bone age STILL ADVANCED, 15 to 17.5 years, so even total receptor absence slows
  the clock rather than stopping it, and spine BMD fell to Z -3.85 - which under R278 is an EFFICACY term,
  not a safety footnote, because the cost is vertebral and the residual is trunk-dominant. (3) brjesson2012
  is OLD FEMALE mice and rodent plates do not fuse, so "closure" there is not human fusion. (4) Degradation
  is never complete and nobody has measured ERalpha protein in growth-plate chondrocytes under ANY degrader
  - the sweep flagged this as its one open measurement and it is still open. (5) Cartilage is avascular;
  R315''s delivery wall applies, unmeasured for an ~800 Da PROTAC. (6) ZERO skeletal, chondrocyte or growth
  data for vepdegestrant in any species - a GAP under R302''s rule, not a disqualification, but real. (7)
  Vepdegestrant is a CYP3A4 SUBSTRATE and erdafitinib is handled by CYP3A4/CYP2C9 - the interaction is
  UNRESOLVED and would have to be checked. (8) Approved for adult ESR1-mutant metastatic breast cancer
  only; there is no paediatric experience of any kind.

  WHAT THIS IS AND IS NOT. It is not a recommendation and no centimetre figure is offered for a human.
  It is the first agent whose MECHANISM matches the requirement this atlas derived for itself, arriving
  at the same time as the first approval in its class, on an axis where five human subjects across four
  families define the direction. THE DISCRIMINATING EXPERIMENT IS CHEAP AND HAS NEVER BEEN RUN: give an
  ERalpha PROTAC to a normal growing animal and measure ERalpha PROTEIN in growth-plate chondrocytes, plate
  height, and BONE LENGTH - with fulvestrant as the internal comparator, since the mechanism predicts the
  degrader moves length and the blocker does not.'
quantitative:
- parameter: 'THE PROTEIN-ABLATION ORDERING - four perturbations of one receptor, ranked by how much ERalpha
    PROTEIN is removed, every row with a length or plate-status endpoint'
  value: 'ERalpha-/- (whole protein absent): tibia +8.3% (P<0.01), growth plate height +18% (P<0.05), growth
    continues in old age. Cartilage-specific ERalpha-/-: normal through sexual maturation, then continued
    growth past 4 months while controls stopped, INCREASED FEMUR LENGTH at 1 year. ERalphaAF-1(0) (protein
    retained, one domain deleted, receptor hyperactive): longitudinal growth CEASED, tibia -4.9% (P<0.01),
    proximal tibial plates CLOSED IN ALL animals while open in ALL wild-types. Fulvestrant/ICI 182,780
    (AF-2 blockade, protein largely retained): NO effect on longitudinal growth in wild-type animals in
    three independent studies.'
  unit: per cent difference in bone length versus control, and growth plate open/closed
  conditions: 'brjesson2012 - old (16-19 month) FEMALE mice, ERalpha-/- and ERalphaAF-1(0) against wild
    type. brjesson2010 - cartilage-specific ERalpha inactivation, femur length at 1 year. movrareskrtic2014
    - ICI 182,780 in ovariectomised wild-type mice for 3 weeks, no effect on growth plate height, with
    uterus, fat and thymus as internal controls. sibonga1998 and turner2000 are the other two wild-type
    nulls, each carrying its own positive control (complete uterine antagonism; orchiectomy respectively).'
  species: mouse
  source_ref: brjesson2012
  uncertainty: 'THE ORDERING IS THE RESULT AND IT IS MONOTONE IN PROTEIN REMOVED, WHICH IS WHY IT IS WORTH
    MORE THAN ANY SINGLE ROW. But every caveat is real. brjesson2012 is OLD FEMALE mice at 16-19 months
    and this subject is an adolescent male, so both age and sex are wrong. RODENT GROWTH PLATES DO NOT FUSE
    the way human plates do, so "closure" in these experiments is a reduction to a closed-appearing plate
    in aged animals, not human epiphyseal fusion - this is the single largest translation gap and it applies
    to every row. The cartilage-specific result is the most relevant to a late window and is also the one
    with the least quantification in the abstract - "increased femur length" with no percentage given.
    Genetic ablation from conception is not pharmacological degradation in an adolescent (CORR-299 cuts
    both ways here: the valid question is whether ERalpha is still doing work in an open plate, and brjesson2010
    answers that it is doing MORE work late than early, which is the favourable direction).'
- parameter: the human phenotype that defines the direction, and the price recorded with it
  value: '204 cm at age 28 with UNFUSED epiphyses and continued linear growth despite normal virilisation;
    five ESR1-null subjects now across four families. In the same propositus followed longitudinally, spine
    areal BMD fell 0.745 to 0.684 g/cm2 (Z -3.85) over 3.5 years WHILE BONE AGE STILL ADVANCED from 15
    to 17.5 years.'
  unit: centimetres, Z-score, years of bone age
  conditions: smith1994 and smith2008 - homozygous disruptive ESR1 mutation, single male propositus followed
    longitudinally with iliac crest biopsy (cortex 641 micrometres, trabecular bone volume 10.6%); bernard2017
    (three siblings), feigerlova2025 and soltani2024 complete the series to five subjects.
  species: human
  source_ref: smith1994
  uncertainty: 'THIS IS THE DIRECTION AND IT IS NOT AN EFFECT SIZE FOR A DRUG. n=5 across four families,
    all with the protein absent from conception - so the phenotype includes never having advanced through
    a normal oestrogen-exposed puberty, which a subject at bone age 16 cannot recover. THE MOST IMPORTANT
    QUALIFIER IS INSIDE THE FOLLOW-UP: bone age advanced 15 to 17.5 years even with the receptor completely
    absent, so complete ablation SLOWS the clock, it does not stop it. And the bone cost is severe and
    was unresponsive to both ethinyl-oestradiol and tamoxifen in feigerlova2025 (lumbar Z -3.9 worsening
    to -5.6). Under R278 that cost is an efficacy term because it is vertebral and this subject''s residual
    is trunk-dominant.'
- parameter: 'the human paediatric test of the WRONG half of the class, and its height endpoint is null'
  value: rate of bone age advancement fell from 1.99 to 1.06 (mean change -0.93, 95% CI -1.43 to -0.43,
    p=0.0007) while predicted adult height went 163.0 +/- 6.9 cm to 163.5 +/- 6.3 cm and growth velocity
    Z-score change was -1.14 (95% CI -2.67 to 0.38, p=0.135)
  unit: delta bone age over delta chronological age, and centimetres of predicted adult height
  conditions: sims2012 - 30 girls, mean age 5.9 y, McCune-Albright syndrome with progressive precocious
    puberty, fulvestrant 4 mg/kg intramuscular monthly for 12 months, prospective international multicentre
    single-arm, carried on the FDA label. Uterine and ovarian volumes unchanged, demonstrating no partial
    agonism.
  species: human
  source_ref: sims2012
  uncertainty: 'THIS IS THE STRONGEST SINGLE ARGUMENT AGAINST THE WHOLE IDEA AND IT IS RECORDED FIRST IN
    THE CLAIM GRADES FOR THAT REASON. The clock slowed and growth slowed with it, so nothing was gained
    - which is what a rescue-only agent does. THE DEFENCE IS MECHANISTIC AND UNTESTED: fulvestrant is an
    AF-2 blocker and movrareskrtic2014 found it does not measurably act at a wild-type plate at all, so
    the atlas''s own mechanism predicts this null and does not extend it to a degrader that removes the
    protein. THE DEFENCE IS ALSO CONVENIENT, and it should be held to account: if an ERalpha PROTAC were
    given and produced the same shape - maturation slowed, velocity slowed, predicted height unchanged
    - the class would be closed for good. The population is also wrong twice over: girls with a pathological
    oestrogen EXCESS, aged 5.9, i.e. a restoration setting (CORR-203) in the early window rather than an
    elevation in the late one.'
- parameter: the obtainable agent, its dose, and the interaction that is not resolved
  value: vepdegestrant (ARV-471, Veppanu) 200 mg ONCE DAILY oral with food; FDA approved 1 May 2026; no
    dose-limiting toxicities at that dose, treatment-related adverse events grade 1 except one grade 2 anaemia;
    geometric mean Cmax 630.9 ng/mL and AUC24 10,400 ng.hr/mL single dose, 1,056 ng/mL and 18,310 ng.hr/mL
    on multiple dosing
  unit: milligrams per day, and plasma exposure
  conditions: vepdegestrant_approval2026 for the approval and indication (adults, ESR1-mutated advanced
    or metastatic breast cancer); vepdegestrant_ddi2026 for the recommended phase 3 dose selection and the
    CYP3A4 substrate finding; vepdegestrant_jp2025 for the phase 1 safety and PK at 200 mg once daily (n=6
    adult female patients); veritac2_2024 for the randomised phase 3 against fulvestrant.
  species: human
  source_ref: vepdegestrant_ddi2026
  uncertainty: 'OBTAINABILITY IS REAL AND EVERYTHING ELSE ABOUT THE APPLICATION IS NOT. The approval is
    for ADULTS with ESR1-mutated metastatic breast cancer; there is no paediatric experience of any kind,
    and no skeletal, chondrocyte or growth endpoint has been measured for this molecule in any species.
    VEPDEGESTRANT IS A CYP3A4 SUBSTRATE and erdafitinib is handled by CYP3A4 and CYP2C9, so the interaction
    with the stack''s lead agent is UNRESOLVED - the sweep''s clean-interaction finding was for FULVESTRANT
    and does not transfer to a different molecule. The PK figures are from six adult female cancer patients.
    Degradation efficiency in cartilage is unmeasured, and PROTAC degradation is never complete.'
localization:
- 'growth plate chondrocyte: ESR1 detected in 12 of 14 postnatal human growth plates at 33.1 CPM in up
  to 36.3 per cent of cells, the dominant oestrogen receptor there (ESR2 7/14 at 1.2 CPM, GPER1 10/14 at
  2.5 CPM) - so the receptor is present, though brjesson2010 shows the plate compartment matters late rather
  than during sexual maturation'
- 'systemic GH/IGF-1 axis: where total ERalpha loss produced its effect on longitudinal growth in brjesson2010,
  and the compartment a systemic oral agent also reaches'
human_evidence: indirect
human_evidence_note: 'The direction is anchored on five human ESR1-null subjects across four families and
  on ESR1 burden data in 26,176 carriers, and the receptor is measured present in human growth plate tissue.
  The one human PHARMACOLOGICAL test on this axis in growing children (sims2012) used the AF-2 blocker
  half of the class and its height endpoint was NULL. No human has received an ERalpha degrader with any
  growth endpoint.'
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: The load-bearing ordering is mouse, and rodent growth plates do not fuse as human
  plates do, so the closure endpoint does not transfer cleanly. The strongest rows are old female mice.
  The human genetic phenotype is lifelong absence from conception, which a subject at bone age 16 cannot
  reproduce, and the only human drug test on the axis in children was null on height.
confidence: C
claim_grades:
- claim: Growth plate closure is driven by ERalpha functions that do not require ligand, so every AF-2-directed
    antioestrogen is aimed at the wrong function.
  grade: B
  basis: 'Two independent mouse genetics results state it directly. brjesson2012 - ERalphaAF-1(0) mice have
    a hyperactive receptor and CLOSED plates in every animal while all wild-types stayed open, and the authors
    conclude closure is induced by ERalpha functions not requiring AF-1. movrareskrtic2014 - ICI acts at
    the plate only once AF-2 is disabled, and the authors propose plate ERalpha lacking AF-2 is constitutively
    active without ligand. Supported by three independent wild-type nulls for pure antagonism, each with
    its own internal positive control. This claim is the atlas''s, not new here; it is restated because
    everything below follows from it.'
- claim: A PROTAC is mechanistically distinct from every antioestrogen previously tested at a growth plate.
  grade: B
  basis: 'Definitional and sourced. A PROTAC binds an E3 ubiquitin ligase and the receptor simultaneously
    and triggers ubiquitination and proteasomal degradation of the ER PROTEIN (veritac2_2024, vepdegestrant_approval2026),
    removing AF-1, AF-2, the DNA-binding domain and the membrane pool together, whereas SERMs, pure antagonists
    and conventional SERDs act on ligand-dependent signalling. the_receptor_level_oestrogen_sweep filed
    vepdegestrant as "an AF-2 agent by design" in the same paragraph in which it stated that only loss of
    the whole receptor protein reproduces the phenotype. That is a category error and this claim corrects
    it.'
- claim: Removing ERalpha PROTEIN extends the growth period and lengthens bone, where blocking its ligand
    does not.
  grade: C
  basis: 'The four-row ordering is monotone in protein removed and every row has a length or plate-status
    endpoint - ERalpha-/- tibia +8.3% with plate height +18%; cartilage-specific null longer femur at 1
    year; AF-1 deletion (protein retained, hyperactive) plates closed and tibia -4.9%; AF-2 blockade nothing
    in wild type. Not higher than C because the rows are mouse, the strongest are OLD FEMALE mice, rodent
    plates do not fuse as human plates do, and the cartilage-specific length gain is unquantified in the
    abstract.'
- claim: Plate ERalpha is the wrong compartment for a late-window subject.
  grade: X
  basis: 'WITHDRAWN - this is what the_receptor_level_oestrogen_sweep concluded from one arm of brjesson2010,
    and the paper''s other arm reverses it. The abstract states that adult cartilage-specific ERalpha-null
    mice continued to grow after 4 months while controls did not, giving increased femur length at 1 year,
    and the authors conclude plate ERalpha is unimportant during early sexual maturation but IS essential
    for reduction of longitudinal growth in elderly mice. Plate ERalpha is dispensable early and operative
    late. CORR-309, fifth instance, and again the dropped arm is the one that supports the lever.'
- claim: An ERalpha PROTAC would extend the growth period in this subject.
  grade: E
  basis: 'UNTESTED AND THE NEAREST HUMAN EVIDENCE RUNS AGAINST IT. No skeletal, chondrocyte or growth endpoint
    exists for vepdegestrant in any species. sims2012 gave the AF-2 half of the class to 30 growing children
    and predicted adult height did not move (163.0 to 163.5 cm) because velocity fell with the clock; the
    mechanism above predicts that null for a blocker and not for a degrader, but that prediction has never
    been tested. smith2008 shows bone age advanced even with the receptor entirely absent. Degradation completeness
    in avascular cartilage is unmeasured. Recorded as the specification for an experiment, not as a recommendation.'
- claim: This is a substitution for the anastrozole arm.
  grade: X
  basis: 'NO - and the argument is the atlas''s own. Anastrozole removes LIGAND; R274 showed removing more
    ligand buys nothing, and R337 closed the last loophole by showing letrozole suppresses every fraction
    more deeply including the tissue estrone-sulfate reservoir (90.1% versus 72.9%) with still no height
    gain. Read with brjesson2012, those facts say the ligand arm is SATURATED and the residual closure drive
    is ligand-independent - the step nothing in this stack touches. It is a different node, and it explains
    the aromatase-inhibitor ceiling rather than restating it.'
key_refs:
- ref_id: brjesson2012
  year: 2012
  type: primary
  one_line_finding: Old female ERalpha-null mice kept growing (tibia +8.3%, plate height +18%) while ERalphaAF-1-null
    mice stopped with plates CLOSED in every animal and open in every wild type - closure is induced by
    ERalpha functions that do not require AF-1.
- ref_id: brjesson2010
  year: 2010
  type: primary
  one_line_finding: Cartilage-specific ERalpha-null mice grew normally through sexual maturation but CONTINUED
    GROWING PAST 4 MONTHS when controls stopped, giving increased femur length at 1 year - plate ERalpha
    is dispensable early and operative late.
- ref_id: movrareskrtic2014
  year: 2014
  type: primary
  one_line_finding: ICI 182,780 had no effect on growth plate height in wild-type mice, and acted only once
    AF-2 was disabled - as an inverse agonist enhancing longitudinal growth, implying plate ERalpha is constitutively
    active without ligand.
- ref_id: smith1994
  year: 1994
  type: primary
  one_line_finding: Man with homozygous disruptive ESR1 mutation - 204 cm at 28, unfused epiphyses, continued
    linear growth despite normal virilisation.
- ref_id: smith2008
  year: 2008
  type: primary
  one_line_finding: The same propositus followed - spine BMD fell to Z -3.85 over 3.5 years WHILE BONE AGE
    STILL ADVANCED 15 to 17.5 years, so total receptor absence slows the clock rather than stopping it.
- ref_id: sims2012
  year: 2012
  type: primary
  one_line_finding: Fulvestrant in 30 growing girls slowed bone age advancement significantly but predicted
    adult height did not move (163.0 to 163.5 cm) - the clock slowed and growth slowed with it.
- ref_id: vepdegestrant_approval2026
  year: 2026
  type: review
  one_line_finding: Vepdegestrant (Veppanu) approved by FDA on 1 May 2026, the first PROTAC ever approved
    - oral, degrading ER protein via E3-ligase-mediated ubiquitination rather than blocking a domain.
- ref_id: vepdegestrant_ddi2026
  year: 2026
  type: primary
  one_line_finding: 200 mg once daily oral with food is the recommended phase 3 dose, and vepdegestrant
    is a CYP3A4 substrate - so the interaction with erdafitinib is unresolved.
- ref_id: vepdegestrant_jp2025
  year: 2025
  type: primary
  one_line_finding: Phase 1 at 200 mg once daily - no dose-limiting toxicities, adverse events grade 1 except
    one grade 2 anaemia, with measured exposure.
- ref_id: veritac2_2024
  year: 2024
  type: primary
  one_line_finding: Randomised phase 3 of the PROTAC degrader against FULVESTRANT - the head-to-head between
    protein degradation and AF-2 blockade, in oncology.
