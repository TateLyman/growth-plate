contradicts:
- 'INTERNAL TENSION: navepegritide shows a clear within-trial dose-response (ACcomplisH) while vosoritide
  exposure does not predict growth within its cohort (galetaki2026). Both cannot be simple exposure-response
  relationships over the same effective range. The most economical resolution is a shared ceiling with
  navepegritide sampling the sub-saturating region and vosoritide sitting at or above it - but that is
  inference, not measurement.'
