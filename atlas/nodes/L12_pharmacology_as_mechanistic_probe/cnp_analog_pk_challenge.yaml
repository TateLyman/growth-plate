id: cnp_analog_pk_challenge
name: CNP analogue pharmacokinetic challenge
aliases: [CNP half-life problem, NEP resistance engineering]
type: process
layer: L12
stub: false
summary: |
  Native CNP is cleared within minutes by neutral endopeptidase and by NPR3-mediated
  internalisation, so every therapeutic CNP has been engineered for exposure rather than
  for potency. Two opposite solutions reached the clinic. Vosoritide is a
  NEP-resistant analogue with a mean apparent plasma half-life of 21.0-27.9 minutes and
  Tmax 15 minutes, given once daily, so the plate sees a brief daily spike. Navepegritide
  is a TransCon prodrug releasing unmodified CNP with an apparent half-life of 5.3 days,
  given once weekly, so the plate sees a near-continuous plateau at a steady-state Cmax of
  36.0 pmol/L. These are roughly opposite exposure profiles, differing by about three
  orders of magnitude in the fraction of the dosing interval spent above threshold. Yet
  the placebo-controlled growth velocity gains are statistically indistinguishable:
  1.57 cm/yr (95% CI 1.22-1.93) for vosoritide and 1.49 cm/yr (95% CI 1.05-1.93) for
  navepegritide, and a class meta-analysis of four RCTs (n=326) pools them at 1.36 cm/yr
  (95% CI 1.05-1.68). The engineering premise that continuous CNP exposure is required
  is therefore not supported by the human comparison, and the ceiling on effect size
  is more consistent with a saturable step downstream of NPR2 than with insufficient exposure.
quantitative:
  - parameter: mean apparent plasma half-life, vosoritide
    value: '21.0-27.9'
    unit: minutes
    conditions: 15 ug/kg once daily subcutaneous over 52 weeks, n=58 children with achondroplasia aged 5-13 y
    species: human
    source_ref: fda_voxzogo_label_2025
    uncertainty: SD 4.7-9.9 min across visits
  - parameter: mean apparent plasma half-life, CNP released from navepegritide
    value: '5.3'
    unit: days
    conditions: 0.1 mg/kg once weekly subcutaneous, population PK model
    species: human
    source_ref: fda_yuviwel_label_2026
    uncertainty: model-derived mean
  - parameter: ratio of exposure duration, navepegritide-released CNP to vosoritide
    value: '~300'
    unit: fold
    conditions: computed from the two label half-lives (5.3 d vs ~24 min); comparison across labels, not a head-to-head study
    species: human
    source_ref: fda_yuviwel_label_2026
    uncertainty: derived quantity, no CI
    value_unverified: true
  - parameter: placebo-controlled AGV gain, vosoritide vs navepegritide
    value: 1.57 vs 1.49
    unit: cm/yr
    conditions: separate trials, different age ranges (5 to <18 y vs 2-11 y); confidence intervals overlap almost completely
    species: human
    source_ref: nct05598320
    uncertainty: 95% CI 1.22-1.93 and 1.05-1.93 respectively; no head-to-head trial exists
  - parameter: pooled class effect on AGV, CNP analogues
    value: '1.36'
    unit: cm/yr
    conditions: meta-analysis of 4 RCTs, n=326, children <18 y with genetically confirmed achondroplasia
    species: human
    source_ref: kamrulhasan2026
    uncertainty: 95% CI 1.05-1.68
localization:
  - "human growth plate: exposure profile at the target never measured for either agent"
human_evidence: direct
human_evidence_note: >-
  Both pharmacokinetic profiles are human label data from patients with achondroplasia,
  and both efficacy estimates are from human placebo-controlled RCTs.
species_basis: [human]
translation_risk: low
translation_risk_reason: >-
  All the numbers are human. The inference that draws them together - that similar
  efficacy despite dissimilar exposure implies a saturable downstream step - is a
  cross-trial comparison, not a randomised contrast, and is graded accordingly.
confidence: A
claim_grades:
  - claim: Vosoritide and navepegritide deliver CNP with plasma half-lives differing by roughly 300-fold.
    grade: A
    basis: Both values are FDA label pharmacokinetics measured in children with achondroplasia.
  - claim: Their placebo-controlled effects on annualised growth velocity are indistinguishable.
    grade: B
    basis: Two separate RCTs with almost completely overlapping confidence intervals; no head-to-head trial, and the age ranges differ.
  - claim: The similarity implies the rate-limiting step is downstream of NPR2 occupancy rather than CNP exposure.
    grade: E
    basis: Flagged inference; consistent with the L3 finding that NPR2 is uniform across zones while PKG-I/II is hypertrophic-biased, but not directly tested.
key_refs:
  - ref_id: fda_voxzogo_label_2025
    year: 2025
    type: regulatory
    one_line_finding: Vosoritide mean apparent half-life 21.0-27.9 minutes, Tmax 15 min; urinary cGMP near saturation at 15 ug/kg/day.
  - ref_id: fda_yuviwel_label_2026
    year: 2026
    type: regulatory
    one_line_finding: Released CNP half-life 5.3 days, steady state after ~3 weekly doses, Cmax 36.0 pmol/L.
  - ref_id: savarirayan2020
    pmid: '32891212'
    first_author: Savarirayan R
    year: 2020
    type: primary
    one_line_finding: Vosoritide +1.57 cm/yr vs placebo (95% CI 1.22-1.93).
  - ref_id: nct05598320
    year: 2025
    type: trial_registry
    one_line_finding: Navepegritide +1.49 cm/yr vs placebo (95% CI 1.05-1.93).
  - ref_id: kamrulhasan2026
    pmid: '42306228'
    first_author: Kamrul-Hasan ABM
    year: 2026
    type: meta_analysis
    one_line_finding: Pooled CNP-analogue AGV effect 1.36 cm/yr (95% CI 1.05-1.68) across 4 RCTs, n=326.
open_questions: [g_l12b_001, g_l12b_002, g_l12pharm_002]
contradicts: []
last_verified: '2026-08-05'
