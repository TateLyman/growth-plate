id: round466_adam12_worked_to_a_decision_the_protein_is_purchasable_and_the_null_was_never_calipered
name: 'R466 - ADAM12 worked to a decision: a mechanism result with a purchasable protein whose vendor bioactivity assay
  IS the mechanism, a 23-year-old null nobody has calipered, human HEIGHT as its top GWAS trait at P=6e-73, and a substrate
  chain landing on the PAPP-A/STC2 axis - but no loss-direction anchor and a contradicted adhesion arm'
