human_evidence: indirect
human_evidence_note: ADAM12 is NOT in kosmicki2026 207-gene burden table and has ZERO HPO rows and no OMIM disease entry.
  But its most represented GWAS Catalog trait is HEIGHT, with nine conditionally independent intronic signals inside
  a 376 kb gene body, best P=6e-73 - a regulatory signal a coding burden test is blind to by construction (CORR-358).
  The nine signals split in direction, so the locus is human-anchored and the gene DIRECTION is not.
translation_risk: high
translation_risk_reason: The one length result is lifelong transgenic overexpression of a human protein in mouse circulation
  under a muscle promoter, with a documented sex-dependent adiposity phenotype in the same line and no body weight reported
  alongside the length. There is no loss-direction result in any species, and one of the two stated mechanisms is contradicted
  by chondrocyte-specific integrin ablation.
summary: 'R464 surfaced ADAM12-S as the largest positive length endpoint in a normal-background animal in this atlas
  and the

  only one naming vertebrae. R465 showed it passes the receiver test by the route that applies to it - the transgene
  is

  expressed in the CIRCULATION, and its named substrates FN1 and ITGB1 are cartilage-enriched at 10,529 and 311 CPM.

  R466 works it to a decision. It is a MECHANISM RESULT, not yet a target - but for an unusual reason: the direction
  is

  to RAISE a secreted protein, and the protein is on a catalogue shelf with an endotoxin specification and a vendor

  bioactivity assay that is literally the mechanism. The missing object is not a molecule. It is two measurements.


  ONE - THE LOSS DIRECTION DOES NOT EXIST, AND THAT IS THE STRUCTURAL PROBLEM. IMPC has ZERO Adam12 rows in the bulk

  length file, zero in the full statistical-results file, and the live API returns latest_phenotype_status None with

  numFound zero for genotype-phenotype - CORR-348 case one, never phenotyped, says nothing in either direction. MGI

  carries 23 Adam12 rows and CORR-341 is load-bearing here: NINETEEN of them are QUADRUPLE knockouts, Adam12 with Adam15

  and Adam17 and Adam9, or Adam12 with Adam15 and Adam19 and Adam9, and every cardiac, valve, septal and eyelid term

  belongs to those. Only four rows are Adam12-alone and they are brown adipose tissue, skeletal muscle morphology, muscle

  fibre density and postnatal lethality. No skeletal term at all. kurisaki2003 states the viable homozygous mutants

  appear normal and are fertile - a qualitative gross observation with NO BONE MEASURED, in a mouse that has existed
  for

  23 years. Human loss is tolerated: gnomAD pLI 2.9e-15, LOEUF 0.803, 70 observed pLoF against 106 expected, one

  homozygote, no OMIM disease entry and zero HPO rows. SO THE +17 PER CENT IS AN UNOPPOSED GAIN OF FUNCTION WITH NO

  LOSS-DIRECTION ANCHOR IN ANY SPECIES, which is what every other well-validated target in this file has.


  TWO - BUT ADAM12''S TOP GWAS TRAIT IS HUMAN HEIGHT, AT P=6e-73, AND THIS ATLAS HAD NO IDEA. ADAM12 is not in

  kosmicki2026''s 207 and has no HPO annotation. The GWAS Catalog tells a different story: of its associations the single

  most represented trait is HEIGHT, with Yengo 2022 mapping NINE conditionally independent signals to ADAM12, best

  rs7920091 at P=6e-73. Every one is an INTRON variant inside a 376 kb gene body rather than a lead in a window, which
  is

  stronger than R413''s usual nearest-gene caveat allows. It also explains the discordance with the burden table: the

  signal is REGULATORY and a coding burden test is blind to it by construction, which is CORR-358''s shape. What it does

  NOT give is a gene direction - the nine signals split five height-decreasing and four height-increasing, and

  independent signals at one locus have allele-specific directions.


  The one direction-concordant human result is hao2016kbd, a bivariate GWAS of Kashin-Beck disease using joint deformity

  AND BODY HEIGHT, in which ADAM12 is the most significant gene at P=9.25e-9 with replication, and ADAM12-positive

  chondrocytes are 47.6 per cent in Kashin-Beck cartilage against 64.7 per cent healthy. Articular rather than physeal,

  n=8 for the immunohistochemistry, and an endemic environmental osteochondropathy, so grade C.


  THREE - AND R401''s THREE-WAY SPLIT RETURNS A YES ON THE THIRD QUESTION. No approved medicine: correct, zero, and

  ChEMBL CHEMBL5030 has no mechanism records at all. No chemical matter: essentially correct, seven activities, and any

  small molecule would be an inhibitor, the wrong direction. NO PURCHASABLE PROTEIN: FALSE. Recombinant human ADAM12
  is

  sold CHO-derived at over 90 per cent purity with endotoxin below 1.0 EU per microgram, furin-activatable, AND ITS

  STATED VENDOR BIOACTIVITY ASSAY IS ITS ABILITY TO CLEAVE IGFBP-3 - which is the mechanism. Research use only, and two

  construct caveats: shi2000adam12 implicates the CYSTEINE-RICH domain in IGFBP-3 binding and the catalogued construct

  stops before it, and a separate E. coli product sold under a similar name is an immunoassay control rather than an

  active enzyme.


  R342''s empty-shelf prediction is therefore HALF-TESTED AND HALF-FAILS in a way that matters. The inhibitor shelf is

  real and the activator shelf is empty exactly as R342 says - ray2011''s own closing sentence names therapeutic

  DOWN-regulation of ADAM-12 in cancer, arthritis and cardiac hypertrophy as the field''s goal. But ADAM12-S is SECRETED,

  so CORR-344''s other shelf applies: you do not need an activator, you supply the enzyme. This is the SCUBE3 and

  osteolectin architecture of R401 to R405, not the HHIP architecture.


  FOUR - THE SUBSTRATE CHAIN LANDS EXACTLY ON THIS FILE''S OWN IGF WORK. loechel2000, verified verbatim: ADAM12-S cleaves

  IGFBP-3 AND IGFBP-5 and DOES NOT cleave IGFBP-1, -2, -4 or -6, with both cleavages inhibited by TIMP-3, and the authors

  propose it is the IGFBP-5 protease secreted by osteoblasts. THOSE ARE EXACTLY THE TWO IGFBPs PAPP-A2 CLEAVES, AND

  POINTEDLY NOT PAPP-A''s SUBSTRATE IGFBP-4. Against this file''s own numbers - PAPPA minus 4.57 cm, PAPPA2 minus 2.10
  cm,

  STC2 plus 1.37 cm at P=4.5e-34, and R453''s marouli2017 causal chain in which rare STC2 alleles compromise proteolytic

  inhibition of PAPP-A and raise height 1 to 2 cm per allele - ADAM12-S IS A PAPPALYSIN-PARALLEL, STC2-INDEPENDENT ENZYME

  REACHING THE SAME ENDPOINT, and the only member of that whole axis with both a purchasable enzyme and a positive length

  result in a normal animal. Qualifier recorded because it runs against: mohan2002adam9 purified the IGFBP-5 protease

  from human osteoblast conditioned medium and concludes ADAM-9, not ADAM-12.


  FIVE - AND THE OTHER STATED MECHANISM IS CONTRADICTED AT THE GENETIC EXTREME. kveiborg2006 attributes part of the

  effect to ADAM12-S inhibiting chondrocyte adhesion to fibronectin and collagen II. aszodi2003 inactivated beta1

  integrin in chondrocytes and produced a CHONDRODYSPLASIA caused by loss of adhesion to collagen type II and reduced

  binding to and impaired spreading on fibronectin - the exact two substrates, and removing that adhesion genetically

  SHORTENS the bone. lu2007flnb corroborates: Flnb-null mice have shortened distal limbs with decreased chondrocyte ECM

  adhesion. Not a kill, because genetic receptor ablation is not partial soluble competition and R281''s band shape allows

  a narrow favourable window - but the mechanism as stated is contradicted at the extreme and nobody has measured the

  dose-response.


  SIX - THE COSTS, AND ONE IS AN EFFICACY TERM SITTING INSIDE THE HEADLINE NUMBER. kawaguchi2002 is the same laboratory,

  the same ADAM12-S construct and the same protease-dead truncation control, and it names the promoter: MUSCLE CREATINE

  KINASE - a postnatally-activating driver secreting into the circulation, which is favourable for CORR-299. It also

  reports that FEMALE transgenics gained body weight, total body fat, abdominal fat and herniation. CRITICALLY, AND THIS

  REFINES THE OBJECTION RATHER THAN REMOVING IT: MALE TRANSGENICS WERE ONLY SLIGHTLY OVERWEIGHT AND DID NOT BECOME

  OBESE. kveiborg2006''s abstract does not state the sex of its 6-month animals or report body weight, so a body-size

  confound must be read against the +17 per cent - but it is sex-dependent and much weaker in the relevant sex.'
