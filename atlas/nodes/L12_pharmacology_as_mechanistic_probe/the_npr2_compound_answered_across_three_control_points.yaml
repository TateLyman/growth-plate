id: the_npr2_compound_answered_across_three_control_points
name: WHICH COMPOUND FOR NPR2 - the phosphatase arm cannot be de-risked, and the better molecule is an
  allosteric enhancer whose binding site already exists in GC-B and is blocked by one side chain
aliases:
- which compound for the NPR2 arm
- GC-B allosteric enhancer
- compound 20 andresen
- Thr640 Ile624
- is the phosphatase inhibitor the right molecule
- the answer to the phosphatase compound question
type: intervention
layer: L12
stub: false
summary: 'FOR MANY ROUNDS THIS ARM HAS ASKED WHICH PHOSPHATASE INHIBITOR TO CARRY. THAT WAS THE WRONG
  QUESTION, AND THE EVIDENCE THAT SHOWS IT IS NOW IN HAND. There are THREE separable control points on
  this receptor, not one, and the atlas had been optimising the hardest of them.
  CONTROL POINT A - LIGAND SUPPLY. Vosoritide and navepegritide. Already in the stack, already priced,
  capped by a systemic exposure margin, and every agent on it is a peptide sitting partway down the
  farnum2006 size curve.
  CONTROL POINT B - RECEPTOR PHOSPHORYLATION STATE. This is the arm the atlas has been building, and the
  genetic proof is the strongest on the whole axis: wagner2021 GC-B(7E) lengthens femur 4.3 to 8.8 per cent
  ON A WILD-TYPE FGFR3 BACKGROUND, which is our subject condition. THE PROBLEM WAS NEVER THE MECHANISM. IT
  IS THAT THE ENZYME HAS NEVER BEEN IDENTIFIED - AND ROUND 155 ESTABLISHED THAT THIS IS NOT AN ACCIDENT OF
  NOBODY LOOKING. The Jaffe and Potter laboratories have hunted it directly. egbert2024 ran quantitative
  phosphoproteomics on rat preovulatory follicles and found the two PPP regulatory subunits most strongly
  phosphorylated by the upstream signal - PPP2R5D, which is PP2A B56delta, and PPP1R12A, which is MYPT1,
  at 4 to 10 fold. Serine-to-alanine knock-in mice for each: NPR2 dephosphorylation NORMAL. egbert2025 then
  crossed them into a DOUBLE 5A/5A mutant to test redundancy: NPR2 dephosphorylation still normal, meiotic
  resumption normal, ovulation normal, six-month fertility normal. potter2024, the field leader own review,
  still describes the kinases and phosphatases of these receptors as POTENTIAL. SO BOTH SIDES OF THE
  PHOSPHORYLATION SWITCH ARE UNIDENTIFIED, AND THE IDENTITY HAS RESISTED PHOSPHOPROTEOMICS PLUS
  COMBINATORIAL KNOCK-IN MICE IN THE BEST-CHARACTERISED SYSTEM THERE IS. This atlas should stop treating
  enzyme identification as a gap it can wait out.
  CONTROL POINT C - ALLOSTERIC GAIN, INDEPENDENT OF BOTH LIGAND AND PHOSPHORYLATION. THIS IS NEW AND IT IS
  THE BEST-DEFINED CHEMISTRY PROBLEM ON THE AXIS. andresen2023 screened and optimised small-molecule
  allosteric ENHANCERS of GC-A. Compound 20 raises BNP potency 2.8-fold and maximum cGMP 30 per cent, is
  not competitive with the peptide, and does not touch peptide affinity - it raises EFFICACY. Critically,
  IT IS ORTHOGONAL TO PHOSPHORYLATION: in the GC-A 7E phosphomimetic, which is already locked in the
  activated state, compound 20 raised cGMP a FURTHER 183 per cent. It therefore stacks on control point B
  rather than duplicating it, which is exactly the design rule this atlas works to.
  AND THE SITE IS ALREADY PRESENT IN GC-B. This is the finding that changes the arm. andresen2023 mapped
  compound 20 through GC-A/GC-B chimeras to residues 621 to 663, then to ONE AMINO ACID. GC-A T640I is
  completely inactive. GC-B I624T GAINS FULL ACTIVITY - compound 20 raises maximum CNP-mediated cGMP by 35
  per cent and lowers the CNP EC50 by 4.4-fold at that single-point mutant. The pocket, the mechanism and
  the chemotype all transfer to GC-B intact. ONE SIDE CHAIN - a threonine hydroxyl against an isoleucine
  methyl - is the entire difference between a compound that works on the cardiac receptor and one that
  works on the growth-plate receptor. And the intolerance is narrow rather than absolute: compound 20 is
  active at GC-B I624V, I624A and I624S, and dead only at Tyr and Leu.
  SO THE COMPOUND THIS PROJECT ACTUALLY NEEDS IS A GC-B-SELECTIVE ANALOGUE OF THE andresen2023 CHEMOTYPE,
  RE-OPTIMISED FROM Thr640 TO Ile624. Against the alternatives that is a far better problem. It needs no
  new target, no new binding site, no new screening campaign and no enzyme identification - it needs
  medicinal chemistry against a defined single-residue difference, with a validated counter-screen (GC-A)
  and a validated positive control (GC-B I624T) already built. It is a SMALL MOLECULE, so it sits at the
  TOP of the farnum2006 partition curve where every peptide on this axis sits partway down.
  WITHDRAWN AT ROUND 160 (CORR-174) - THE SENTENCE THAT USED TO END THIS PARAGRAPH SAID compound 2 already
  has some native GC-B activity so the starting point is not zero. IT IS ZERO. andresen2023 counter-screened
  the series at wild-type GC-B and reported that NEITHER compound 2 NOR compound 20 modulated the potency of
  CNP or increased maximum CNP-mediated cGMP. The hedged phrase about compound 2 having some activity at
  high concentrations refers to a different panel and is negated by the next sentence in the same paper. All
  roughly 100 analogues in that series were made and screened AGAINST GC-A. The GC-B numbers quoted anywhere
  in this atlas for this chemotype come from the I624T POINT MUTANT ONLY: the site transfers, no molecule
  does.
  THE OBJECTION THAT APPLIES TO IT, AT FULL STRENGTH, AND IT IS THE SAME ONE THAT DEMOTED THE PAM NODE.
  An enhancer raises gain wherever ligand and receptor meet, and the_plate_consumes_cnp_it_does_not_make_it
  established that the plate is a CONSUMER - NPPC sits at array floor across all five microdissected human
  growth-plate compartments. With no local production, plate ligand cannot exceed vascular ligand, so a
  systemic GC-B enhancer raises signalling at the vascular liability at least as much as at the target.
  THIS IS NOT SOLVED BY ANYTHING FOUND THIS ROUND AND MUST NOT BE WAVED AWAY. What can honestly be said is
  that the liability CHARACTER is better: hypotension is monitorable, titratable and reversible, and the
  ACcomplisH protocol already monitors orthostatic blood pressure at every visit, whereas control point B
  offers systemic pan-PPP inhibition with grade 4 reversible hepatotoxicity.
  AND ONE STANDING OBJECTION TO CONTROL POINT B GOT WEAKER, WHICH IS WORTH RECORDING EVEN THOUGH THE ARM
  STAYS HELD. CORR-125 held that a systemic phosphatase inhibitor lifts a tonic brake wherever NPR2 and the
  phosphatase coexist, and that this is a liability. wagner2022 is the closest genetic analogue of that
  off-target at the sister receptor: GC-A 8E/8E mice, in which GC-A CANNOT BE INACTIVATED BY
  DEPHOSPHORYLATION for life and systemically. The result in males is a 12 per cent lower heart weight to
  body weight ratio, 14 per cent smaller cardiomyocytes, improved ejection fraction and UNCHANGED BLOOD
  PRESSURE AND HEART RATE. That is not a liability, it is the phenotype cardiology tries to buy. The
  caveats are real - no cardiac effect in females, aldosterone elevated in mutant males, altered creatinine
  handling, a germline phosphomimetic rather than a promiscuous drug - but the presumption that
  dephosphorylation-blockade is systemically dangerous is no longer the default reading.
  CORRECTION ENTERED AT ROUND 156 (CORR-171), AND IT CHANGES WHICH MOLECULE IS FIRST. The paragraph above
  reads as though the GC-B allosteric field were empty. IT IS NOT. ma2024 - already in this atlas - is
  MCUF-42, a real, published, GC-B-SELECTIVE small-molecule PAM: EC50 0.80 microM, Emax 86 per cent,
  4-fold cGMP potentiation with CNP, no agonism alone, no activity at GC-A, MW 393.3 and NEUTRAL, giving
  the best computed plate partition on this axis at 0.97. THE CORRECT STATEMENT IS THAT GC-B HAS TWO
  ALLOSTERIC SITES ON OPPOSITE FACES OF THE MEMBRANE. MCUF-42 binds the EXTRACELLULAR domain at KD 710 nM
  and raises CNP AFFINITY - a 6.4-fold potency shift with NO increase in maximal cGMP. andresen2023
  compound 20 binds the INTRACELLULAR kinase homology domain at Thr640/Ile624 and raises EFFICACY,
  independently of phosphorylation. Different sites, different mechanisms, NEVER TESTED TOGETHER.
  WHICH MEANS THE RECOMMENDATION SPLITS. The compound that EXISTS is MCUF-42, and its two problems are
  0.26 per cent oral bioavailability and a potency-only mechanism that is maximally exposed to the
  consumer-tissue objection. The compound that would be BETTER is an efficacy-raiser at the intracellular
  site, and it does not exist for GC-B. AND THE MOST ACTIONABLE IDEA IS NEITHER: make MCUF-42 CATIONIC. A
  monovalent cation is CONCENTRATED by the plate fixed charge density at 1.8 to 2.7 times free plasma
  rather than excluded, taking net partition from 0.97 to about 2.2 - and the GC-A sibling MCUF-651
  already carries a basic amine and is orally bioavailable, so the scaffold tolerates the change and the
  change may fix absorption too. That is tissue selectivity bought by physicochemistry rather than by a
  ligand gradient the plate does not have.
  WHAT THIS NODE DOES NOT CLAIM. No GC-B-active compound of this chemotype exists today. andresen2023
  reports NO structure, NO potency figure and NO in vivo data for a GC-B-selective analogue, because they
  were not trying to make one - they wanted the cardiac receptor and treated GC-B activity as an
  off-target to remove. Nothing here has a bone endpoint in any species. The recommendation is a DIRECTION
  for chemistry, graded accordingly, not a molecule to obtain.'
quantitative:
- parameter: 'THE ALLOSTERIC SITE EXISTS IN GC-B AND ONE RESIDUE BLOCKS IT'
  value: 'andresen2023 chimera mapping. Compound 20 activity followed GC-A residues 621-729, then 621-663,
    within which only NINE residues differ between GC-A and GC-B, and finally ONE: GC-A Thr640, which
    corresponds to GC-B Ile624. GC-A T640I is COMPLETELY INACTIVE. GC-B I624T GAINS ACTIVITY - compound 20
    raises maximum CNP-mediated cGMP by 35 +/- 6 per cent and lowers the CNP EC50 by 4.4 +/- 0.7-fold.
    Compound 20 is ALSO active at GC-B I624V, I624A and I624S, and inactive at Tyr and Leu substitutions.
    Glutamate or aspartate at either position produces a NON-FUNCTIONAL receptor'
  unit: per cent change in maximum cGMP; fold change in EC50
  conditions: andresen2023, FULL TEXT READ 2026-08-09 (PMC10952227), sections 3.10 and 3.11 and Figures 7
    and 8. AlphaScreen cGMP in QBI-HEK293A cells transfected with GC-A, GC-B or chimeric receptors.
  species: not_applicable
  source_ref: andresen2023
  uncertainty: 'THE AUTHORS THEMSELVES FLAG THAT THE SINGLE-RESIDUE STORY IS NOT CLEAN, AND THE ATLAS
    SHOULD CARRY THAT RATHER THAN THE HEADLINE. Compound 20 is INACTIVE at GC-A T640V but ACTIVE at GC-B
    I624V - the same substitution, opposite outcomes in the two receptor backgrounds - so context beyond
    residue 640 contributes and the pocket is not fully defined by one side chain. The paper also notes
    that at some chimeras compound 20 changed only the EC50 or only the maximum but not both, which they
    attribute to differing expression and receptor reserve. THESE ARE TRANSFECTED HEK CELLS, not
    chondrocytes; there is no growth-plate, no cartilage and no in vivo measurement anywhere in this paper.
    And the GC-B I624T number is a MUTANT RECEPTOR result - it demonstrates the pocket transfers, not that
    a compound can be made to fit the wild-type isoleucine.'
- parameter: 'THE ENHANCER IS ORTHOGONAL TO PHOSPHORYLATION, SO CONTROL POINTS B AND C STACK'
  value: 'Compound 20 raised ANP- or BNP-mediated cGMP in the GC-A 7E PHOSPHOMIMETIC - a receptor already
    locked in the phosphorylated, activated state and immune to dephosphorylation - by a FURTHER 183 +/- 26
    per cent, and compound 2 by 151 +/- 23 per cent. On wild-type GC-A the same compounds raised BNP
    potency 2.8 +/- 0.4 and 2.4 +/- 0.5-fold and maximum BNP-mediated cGMP by 30 +/- 6 and 42 +/- 5 per
    cent respectively, without changing peptide binding affinity'
  unit: per cent increase in cGMP; fold increase in agonist potency
  conditions: andresen2023 section 3.8 and Figure 5c,d; and section 3.1 and Figure 2. Full text read
    2026-08-09.
  species: not_applicable
  source_ref: andresen2023
  uncertainty: 'THIS IS THE DESIGN-RULE CHECK AND IT PASSES CLEANLY AT GC-A - additivity on a
    phosphomimetic background is the strongest available demonstration that an enhancer is not simply
    re-doing what phosphorylation does. IT HAS NOT BEEN SHOWN AT GC-B. The 7E experiment is a GC-A
    experiment, and the atlas must not transfer it to GC-B without saying so - the GC-B phosphomimetic
    (7E) mouse exists (egbert2022, wagner2021) but no enhancer has been tested against it. Also note this
    cuts against a convenient assumption: because the enhancer works on top of full phosphorylation, it
    does NOT substitute for control point B, so choosing C does not retire B.'
- parameter: 'THE PHOSPHATASE HAS RESISTED DIRECT IDENTIFICATION BY PHOSPHOPROTEOMICS PLUS COMBINATORIAL
    KNOCK-IN MICE'
  value: 'egbert2024: quantitative mass spectrometry of rat preovulatory follicles 30 min after LH found
    the largest PPP-regulatory-subunit phosphorylation increases on PPP2R5D (PP2A B56delta) and PPP1R12A
    (MYPT1) at 4 to 10 fold, with smaller 2-3 fold increases on PPP1R9A, PPP2R5A and PPP2R5C. Knock-in mice
    with serines 53, 81, 82 and 566 of PPP2R5D or serine 507 of PPP1R12A changed to alanine showed NORMAL
    NPR2 dephosphorylation. egbert2025: the DOUBLE 5A/5A mouse combining both showed NO effect on
    LH-induced NPR2 dephosphorylation (Phos-tag), no delay in meiotic resumption, no reduction in oocytes
    ovulated after kisspeptin, and normal fertility over 6 months'
  unit: fold change in phosphopeptide intensity; qualitative genetic outcome
  conditions: egbert2024 abstract read and egbert2025 FULL TEXT READ 2026-08-09 (PMC13278114). Rat
    phosphoproteomics; mouse knock-in genetics. NPR2 phosphorylation state read by Phos-tag gel in mice
    carrying an HA tag knocked into endogenous Npr2.
  species: mouse
  source_ref: egbert2025
  uncertainty: 'THIS IS A NEGATIVE RESULT ABOUT A PHOSPHO-SWITCH, NOT ABOUT ENZYME IDENTITY, AND THE
    DISTINCTION MATTERS. It shows that LH-induced PHOSPHORYLATION OF THESE TWO SUBUNITS is not the trigger.
    It does NOT show PP2A is not the enzyme - B56delta could still be the targeting subunit while being
    regulated some other way, and the authors explicitly note that other regulatory subunits, undetected
    phosphosites, or an entirely different mechanism (inactivation of a KINASE rather than activation of a
    phosphatase) remain live. TISSUE: this is ovarian follicle, not growth plate, and the upstream trigger
    is LH rather than FGF - the atlas holds robinson2017 for the FGF version in chondrocytes. WHAT IT
    LICENSES is a claim about TRACTABILITY, not about biology: the best-equipped laboratory in this field
    has attacked the question directly and has not closed it.'
- parameter: 'THE FEARED SYSTEMIC OFF-TARGET OF DEPHOSPHORYLATION BLOCKADE IS CARDIOPROTECTIVE AT THE
    SISTER RECEPTOR'
  value: 'wagner2022, GC-A 8E/8E knock-in mice expressing a GC-A that cannot be inactivated by
    dephosphorylation, lifelong and systemic. Heart and kidney membrane GC-A ACTIVITY increased with no
    change in protein. In MALES: heart weight to body weight ratio 12 per cent LOWER, cardiomyocyte
    cross-sectional area 14 per cent SMALLER, ejection fraction INCREASED, ventricular ERK1/2
    phosphorylation reduced further and for longer after a long-acting ANP analogue. BLOOD PRESSURE AND
    HEART RATE UNCHANGED. NO cardiac phenotype in females. Plasma cGMP and testosterone elevated in both
    sexes; ALDOSTERONE ELEVATED IN MUTANT MALES; plasma creatinine decreased and urinary creatinine
    increased'
  unit: per cent change in cardiac mass and myocyte area
  conditions: wagner2022, abstract read 2026-08-09 (PMC8826535). Germline glutamate substitution at known
    GC-A phosphorylation sites; mouse.
  species: mouse
  source_ref: wagner2022
  uncertainty: 'THE INFERENCE TO A DRUG IS INDIRECT AT THREE STEPS AND SHOULD NOT BE OVERSOLD. IT IS A
    DIFFERENT RECEPTOR - GC-A, not GC-B - and the tissue-selectivity worry for the phosphatase arm concerns
    NPR2 in vasculature, which this does not measure. IT IS A GENETIC PHOSPHOMIMETIC, which perturbs one
    receptor cleanly, whereas a pan-PPP inhibitor perturbs hundreds of substrates and the phosphatase-arm
    liability was never only about guanylyl cyclases. AND IT IS LIFELONG AND GERMLINE. THE REAL LIABILITIES
    IT DOES SURFACE are the elevated aldosterone in males - which is a cardiovascular risk factor and runs
    opposite to the beneficial cardiac remodelling - and the sex-dependence, since the cardiac benefit was
    absent in females. What it removes is the PRESUMPTION of harm, not the requirement to measure.'
- parameter: 'THE EXISTING PHOSPHOMIMETICS UNDERSTATE THE PHOSPHORYLATED STATE, SO THE GENETIC EFFECT
    SIZES ON THIS ARM ARE LIKELY CONSERVATIVE'
  value: 'otto2022: single glutamate substitutions at GC-A phosphorylation sites give an enzyme activated
    by natriuretic peptide but with an ELEVATED Km and consequently low activity, whereas VICINAL (double
    adjacent) glutamates - mimicking both negative charges of a phosphate - give a NEAR WILD-TYPE enzyme
    with low Km. The negative charge, from phosphorylation or from glutamate, is REQUIRED for allosteric
    activation of GC-A by ATP. The authors further suggest the functionally identified sites Ser-473 in
    GC-A and Ser-489 in GC-B are NOT phosphorylation sites at all'
  unit: qualitative - Km and activity relative to wild type
  conditions: otto2022, abstract read 2026-08-09 (PMC9672810, open access). GC-A biochemistry.
  species: not_applicable
  source_ref: otto2022
  uncertainty: 'THE CONSEQUENCE FOR THIS ATLAS IS A DIRECTION, NOT A NUMBER, AND IT IS FAVOURABLE. Every
    length figure this arm rests on - wagner2021 at 4.3 to 8.8 per cent femur on a wild-type FGFR3
    background - comes from a SINGLE-glutamate 7E receptor. If single glutamates are partial
    phosphomimetics with elevated Km, the true ceiling of full phosphorylation protection is HIGHER than
    those figures, not lower. THIS IS AN INFERENCE ACROSS RECEPTORS: otto2022 measured GC-A, and the
    quantitative penalty for single glutamates at GC-B has not been measured. The Ser-489 claim is
    explicitly a SUGGESTION in the source and would, if correct, make the GC-B count six chemically
    identified sites rather than seven - the atlas should not restate seven as settled.'
localization:
- 'control point C acts at the kinase homology domain of GC-B, around residue Ile624, in any tissue
  expressing GC-B and exposed to CNP'
- 'the growth plate is a CNP consumer, not a producer, so an enhancer cannot exploit a local ligand
  gradient for selectivity'
human_evidence: indirect
human_evidence_note: 'No human data for any compound in this node. The human anchors for the TARGET are
  jeong2026 (NPR2 activity score tracks standing height near-linearly, R squared 0.438, P = 5.8e-10) and
  npr2_gain_of_function_tall (p.Arg655Cys in the kinase homology domain amplifies the CNP response and
  produces tall stature) - the latter being the mechanism of an allosteric enhancer occurring as a human
  natural experiment, in the same domain the andresen2023 site sits in.'
species_basis:
- mouse
- not_applicable
translation_risk: high
translation_risk_reason: 'The recommended molecule does not exist; the evidence supports the DRUGGABILITY
  of the site in GC-B, not any compound acting on it. And the vascular selectivity objection that demoted
  the PAM node applies here unchanged.'
confidence: D
claim_grades:
- claim: The allosteric binding site targeted by the andresen2023 enhancers is present and intact in GC-B,
    blocked by a single residue difference.
  grade: B
  basis: 'Chimera mapping narrowing from a 109-residue region to a 43-residue region to nine differing
    residues to one, with a reciprocal gain-of-function - GC-A T640I loses activity and GC-B I624T gains
    it, at 35 per cent higher maximum cGMP and 4.4-fold lower CNP EC50. Reciprocal swaps in both directions
    are the strong form of this experiment. Not A because it is one paper in transfected HEK cells with no
    orthogonal confirmation, and because the authors own data contradict a strict single-residue model -
    GC-A T640V is inactive while GC-B I624V is active.'
- claim: An allosteric enhancer is orthogonal to receptor phosphorylation and therefore stacks with control
    point B.
  grade: C
  basis: 'Compound 20 raised cGMP a further 183 per cent in the GC-A 7E phosphomimetic, which is already
    locked active - the cleanest available demonstration of independence. Graded C not B because it was
    measured at GC-A only, in one paper, in transfected cells, and has never been tested at GC-B or in any
    tissue.'
- claim: A GC-B-selective analogue of the andresen2023 chemotype is the compound this arm should pursue.
  grade: E
  basis: 'DESIGNED HERE, NOT TESTED, AND NO SUCH COMPOUND EXISTS. It follows from four things the atlas
    now holds: the site transfers to GC-B intact, the mechanism is orthogonal to phosphorylation, a small
    molecule sits at the top of the farnum2006 partition curve where every current agent on this axis is a
    peptide, and compound 2 of the same series already shows some native GC-B activity. Against it: no
    structure, no potency, no in vivo data, no bone endpoint, and the vascular selectivity objection is
    unresolved.'
- claim: The identity of the NPR2 phosphatase is a gap this atlas can expect to see closed.
  grade: X
  basis: 'NO. egbert2024 and egbert2025 are a direct, well-powered attack by the leading laboratory -
    phosphoproteomics, then single knock-in mice, then a combinatorial double knock-in - and all of it
    came back negative on NPR2 dephosphorylation, meiosis, ovulation and fertility. potter2024 still
    describes the kinases and phosphatases of these receptors as potential. Planning around eventual
    enzyme identification is not admissible.'
- claim: Blocking receptor dephosphorylation systemically is presumptively dangerous.
  grade: D
  basis: 'WEAKENED. wagner2022 GC-A 8E/8E mice - lifelong, systemic, undephosphorylatable receptor -
    produce 12 per cent lower heart weight to body weight, 14 per cent smaller cardiomyocytes, improved
    ejection fraction and unchanged blood pressure in males. Different receptor, genetic rather than
    pharmacological, sex-specific, and with elevated aldosterone as a genuine countervailing finding - so
    the presumption is removed rather than reversed.'
