contradicts:
- 'REFRAMES the_best_phosphatase_compound and the_receptor_phosphorylation_branch_is_the_live_one. Neither
  is withdrawn - control point B keeps the strongest genetic proof on the axis - but both were written on
  the assumption that the right molecule for this receptor is an enzyme inhibitor. andresen2023 shows a
  receptor-side small molecule is available in principle, orthogonal in mechanism, and better matched to
  the delivery constraint.'
- 'WEAKENS the CORR-125 tissue-selectivity objection as applied to receptor dephosphorylation blockade,
  via wagner2022. It does NOT weaken it as applied to a pan-PPP inhibitor, whose liability was never only
  about guanylyl cyclases.'
