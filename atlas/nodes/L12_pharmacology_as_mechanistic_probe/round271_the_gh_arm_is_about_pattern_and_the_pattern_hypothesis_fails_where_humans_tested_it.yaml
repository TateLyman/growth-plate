    The mechanism this round set out to test - GH raises Socs2 mRNA seventeen-fold at the plate and
    wild-type metatarsals do not lengthen under GH at all, while Socs2-null ones do
contradicts: >-
  Does not overturn a prior node. It TESTS a prediction that
  round269_the_sweep_the_atlas_owed_itself_and_the_three_levers_it_was_sitting_on implied but did not state
  - that GH exposure PATTERN should matter more than dose because GH induces its own inhibitor at the plate
  - and finds it REFUTED in humans across the daily-to-weekly range, while gaining that round's SOCS2 loop
  its first human correlate. It also adds an isocaloric feeding-pattern result with a body length endpoint
  which CORR-203 classifies as restoration rather than elevation, and therefore as inapplicable to a
  well-fed subject.
