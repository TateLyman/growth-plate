id: round271_the_gh_arm_is_about_pattern_and_the_pattern_hypothesis_fails_where_humans_tested_it
name: >-
  ROUND 271 - round 269's SOCS2 loop predicts that FLATTER growth hormone exposure should grow bone worse.
  It gains a HUMAN correlate (serum SOCS2 independently predicts lower height SDS in children) and a free
  isocaloric rodent lever (meal-feeding versus grazing preserves body length through GH burst number). AND
  THEN THE PREDICTION IS REFUTED WHERE HUMANS ACTUALLY TESTED IT - weekly growth hormone is non-inferior
  and in several analyses SUPERIOR to daily on height velocity
aliases:
- round 271
- GH pattern not dose
- meal-feeding and GH pulsatility
- weekly GH beats daily
- the pulsatility prediction fails
type: hypothesis
layer: L12
stub: false
summary: >-
  ROUND 269 FOUND THAT GROWTH HORMONE INDUCES ITS OWN INHIBITOR AT THE PLATE - Socs2 messenger RNA up
  SEVENTEEN-FOLD, with wild-type metatarsals failing to lengthen under GH at all while Socs2-null ones do.
  THE OBVIOUS PREDICTION IS THAT EXPOSURE PATTERN SHOULD MATTER MORE THAN DOSE: continuous GH would hold
  SOCS2 up and keep the plate refractory, while pulses would let it decay between hits. This round tests
  that prediction in three places. It survives twice and FAILS in the only place where humans have run the
  experiment, which is the place that counts.

  ONE - THE HUMAN CORRELATE, WHICH ROUND 269 DID NOT HAVE. deja2026 measured serum SOCS2 in 55 children
  with chronic kidney disease and 27 age- and sex-matched healthy controls. SOCS2 was HIGHER in CKD -
  median 1526.5 versus 1294.6 pg/ml, p < 0.001 - it correlated NEGATIVELY with height standard deviation
  score (r = -0.30, p = 0.029), and in multivariate analysis it was an INDEPENDENT predictor of lower
  height SDS alongside eGFR, with an ROC AUC of 0.78 for short stature. Until now the entire SOCS2 case in
  this atlas was one ex vivo mouse metatarsal study. THE CAVEAT IS SERIOUS AND STRUCTURAL: SOCS2 IS AN
  INTRACELLULAR ADAPTOR PROTEIN, so what a serum ELISA is measuring - leakage, a secreted pool, or
  cross-reactivity - is not established by this paper, and the design is cross-sectional in a population
  with GH resistance from many causes. r = -0.30 is a modest correlation.

  TWO - A FREE, ISOCALORIC LEVER ON GH BURST NUMBER, WITH A BODY LENGTH ENDPOINT. hornsby2025 fed male rats
  for six weeks in one of three patterns: ad libitum; GRAZING (small amounts every 30 minutes through the
  dark phase); or MEAL-FEEDING (three one-hour ad libitum windows). Both restricted patterns cut cumulative
  calories by 20 per cent versus ad libitum, and - THIS IS WHAT MAKES IT CLEAN - calorie intake did not
  differ between grazing and meal-fed at any point (3,560 versus 3,460 kcal, P > 0.999). SO THE TWO
  PATTERNS ARE ISOCALORIC AND EVERYTHING THAT DIFFERS BETWEEN THEM IS TIMING.
  Body weight gain fell about 12 per cent in BOTH restricted arms and did not differ between them. But BODY
  LENGTH fell 3 per cent in grazing rats (P = 0.0108 versus ad libitum) AND NOT AT ALL IN MEAL-FED ANIMALS.
  Tibial epiphyseal plate width fell 17 per cent in grazing (P = 0.0001) and was UNAFFECTED in meal-fed
  (P = 0.3299 versus ad libitum; P = 0.0064 versus grazing), the loss falling on the PROLIFERATIVE (-18 per
  cent) and HYPERTROPHIC (-17 per cent) zones with the GERMINAL zone untouched.
  THE MEDIATOR IS GH BURST ARCHITECTURE, AND IT IS GHRELIN-DEPENDENT: meal-feeding TRIPLED GH secretion,
  augmented burst height and added TWO EXTRA BURSTS PER DAY, while grazing left episodic GH largely
  unchanged; the protection required ghrelin and its receptor GHS-R.
  TWO LIMITS THAT THIS ATLAS'S OWN RULES FORCE. FIRST, CORR-203 - THIS IS RESTORATION, NOT ELEVATION.
  Meal-fed animals matched ad libitum; they did not exceed it. Nobody showed meal-feeding grows a
  well-fed animal taller, and the subject of this programme is not calorie-restricted. SECOND, THE RAT ARM
  CONFOUNDS AMOUNT WITH PATTERN - meal-feeding tripled TOTAL GH as well as re-patterning it, so this
  experiment cannot separate "more GH" from "better-timed GH".
  AND THE HUMAN ARM HAS NO GROWTH ENDPOINT AT ALL. In men, continuous nasogastric feed failed to suppress
  ghrelin and produced continuously elevated GH with MINIMAL RHYTHMICITY, while bolus feed produced
  postprandial ghrelin troughs with LOWER circulating GH but ENHANCED ultradian rhythmicity. Note the
  direction: in the human the better-patterned arm had LESS total GH, which is the opposite of the rat.

  THREE - AND HERE THE PREDICTION FAILS, IN THE ONLY PLACE HUMANS HAVE TESTED IT AT SCALE. If flatter GH
  exposure blunted the plate through sustained SOCS2, then once-weekly long-acting GH should underperform
  daily GH on height velocity. IT DOES NOT. ying2026, in treatment-naive Chinese children with GH
  deficiency, reports annualised height velocity at 52 weeks of 10.66 plus or minus 0.22 cm/year for weekly
  lonapegsomatropin against 9.75 plus or minus 0.26 for daily somatropin - NON-INFERIORITY AND SUPERIORITY,
  a difference of 0.91 plus or minus 0.28 cm/year. Independent syntheses agree: one network meta-analysis
  found lonapegsomatropin gave significantly higher annualised height velocity and height SDS change at
  week 52 than both daily somatropin and somapacitan, and another concluded long-acting GH is the preferred
  platform with superior first-year height velocity.
  WHAT THAT DOES AND DOES NOT KILL, STATED CAREFULLY SO IT IS NOT A RESCUE. It kills the strong form: over
  the daily-to-weekly range, at therapeutic doses, flattening GH exposure does not cost height velocity and
  may add it. IT DOES NOT TEST TRUE ULTRADIAN PULSATILITY, because physiological GH pulses arrive every few
  hours and a DAILY subcutaneous injection is already a single non-physiological bolus - so both arms of
  every one of these trials sit on the same side of the contrast that isgaard1988 and hornsby2025 are
  about, which is pulses versus a genuinely constant level. And lonapegsomatropin is a prodrug releasing
  unmodified GH on a defined curve, not a flat infusion. The honest position is that the pattern hypothesis
  is UNTESTED at the frequency that matters and REFUTED at the frequency that has been tried.

  FOUR - WHAT THIS MEANS FOR THE STACK, WHICH IS THE POINT OF ASKING. There is no evidence-based reason to
  prefer daily over weekly GH for this case, and some evidence to prefer weekly. That is the opposite of
  what round 269's mechanism predicted, and the human trial data outrank the mechanism. The SOCS2 loop
  remains the best available explanation for why GH after mid-puberty adds so little - but it is an
  explanation of the CEILING, not a prescription for beating it by re-timing the dose.
quantitative:
- parameter: >-
    SERUM SOCS2 INDEPENDENTLY PREDICTS LOWER HEIGHT SDS IN CHILDREN - THE FIRST HUMAN DATUM ON THIS AXIS
  value: >-
    median serum SOCS2 1526.5 pg/ml in 55 children with CKD versus 1294.6 in 27 matched controls
    (p < 0.001); correlation with height SDS r = -0.30 (p = 0.029); independent predictor of lower height
    SDS in multivariate analysis alongside eGFR; ROC AUC 0.78 (95 per cent CI 0.64-0.91) for short stature,
    sensitivity 79.5 per cent, specificity 68.8 per cent
  unit: pg/ml, correlation coefficient, area under curve
  conditions: >-
    deja2026, cross-sectional, high-sensitivity ELISA, children with CKD stages 2-5 versus age- and
    sex-matched healthy controls.
  species: human
  source_ref: deja2026
  uncertainty: >-
    THE ANALYTE IS THE PROBLEM. SOCS2 is an INTRACELLULAR adaptor protein, and this paper does not
    establish what a circulating pool represents - leakage from damaged tissue, a genuine secreted form, or
    ELISA cross-reactivity. In a CKD population, reduced renal clearance of any small protein is an obvious
    alternative explanation for higher serum levels, and eGFR entered the same model. Cross-sectional, one
    cohort, r = -0.30, and a disease population with GH resistance from many causes. It is a correlate
    consistent with the mouse mechanism, not a demonstration of it in man.
- parameter: >-
    ISOCALORIC FEEDING PATTERN CHANGES BODY LENGTH - AND THE MEDIATOR IS GH BURST NUMBER
  value: >-
    body length reduced 3 per cent in grazing rats (P = 0.0108 versus ad libitum) and NOT reduced in
    meal-fed rats; tibial epiphyseal plate width reduced 17 per cent in grazing (P = 0.0001) and unaffected
    in meal-fed (P = 0.3299 versus ad libitum, P = 0.0064 versus grazing), from -18 per cent proliferative
    and -17 per cent hypertrophic zone width with the GERMINAL zone unaffected; meal-feeding TRIPLED GH
    secretion with augmented burst height and TWO ADDITIONAL BURSTS PER DAY
  unit: per cent versus ad libitum controls
  conditions: >-
    hornsby2025, male rats, 6 weeks. Grazing = small amounts every 30 minutes through the dark phase;
    meal-feeding = three 1-hour ad libitum windows at 1800, 2330 and 0500. BOTH cut cumulative calories by
    20 per cent versus ad libitum, and intake did not differ between the two patterns at any timepoint
    (3,560 plus or minus 346 versus 3,460 plus or minus 75 kcal at day 42, P > 0.999). Protection required
    ghrelin and GHS-R. Human arm: continuous nasogastric feed gave continuously elevated GH with minimal
    rhythmicity; bolus feed gave LOWER circulating GH with enhanced ultradian rhythmicity.
  species: rat
  source_ref: hornsby2025
  uncertainty: >-
    CORR-203 APPLIES AND IS DECISIVE FOR THIS PROGRAMME - THIS IS RESTORATION, NOT ELEVATION. Meal-fed
    animals MATCHED ad libitum; they did not exceed it. The experiment shows a feeding pattern that
    protects growth against a 20 per cent calorie deficit, and says nothing about a well-fed subject, which
    is what this case is. SECOND, THE RAT ARM CONFOUNDS AMOUNT WITH PATTERN, because meal-feeding tripled
    TOTAL GH as well as re-timing it. THIRD, the human arm measured only ghrelin and GH and has NO growth
    endpoint - and it went the other way on total GH, with the better-patterned arm showing LESS GH. Plate
    width is a proxy and not a rate per CORR-189, though the authors also measured linear growth rate by
    BrdU.
- parameter: >-
    THE PATTERN PREDICTION, TESTED IN HUMANS AT THE ONLY FREQUENCY ANYONE HAS TRIED - AND IT FAILS
  value: >-
    annualised height velocity at 52 weeks 10.66 plus or minus 0.22 cm/year for WEEKLY lonapegsomatropin
    versus 9.75 plus or minus 0.26 for DAILY somatropin - non-inferiority AND superiority, difference 0.91
    plus or minus 0.28 cm/year
  unit: cm per year
  conditions: >-
    ying2026, treatment-naive Chinese children with growth hormone deficiency, 52 weeks, primary endpoint
    annualised height velocity, safety profile similar between groups. Independent syntheses agree in
    direction - one network meta-analysis found lonapegsomatropin significantly higher than both daily
    somatropin and somapacitan on annualised height velocity and height SDS change at week 52; another
    concluded long-acting GH offers superior first-year height velocity.
  species: human
  source_ref: ying2026
  uncertainty: >-
    THIS REFUTES THE STRONG FORM AND NOT THE WEAK ONE, AND THE DISTINCTION IS NOT A RESCUE - IT IS WHAT THE
    TRIALS DID AND DID NOT VARY. Physiological GH pulses arrive every few hours; a DAILY subcutaneous
    injection is already a single non-physiological bolus. Both arms of every trial here therefore sit on
    the same side of the pulses-versus-constant contrast that isgaard1988 and hornsby2025 concern. And
    lonapegsomatropin is a PRODRUG releasing unmodified GH on a defined curve rather than a flat infusion.
    Superiority may also reflect total weekly exposure and adherence rather than kinetics. First-year
    height velocity is a RATE, not attained height - round 254 already established that the two come apart
    for this drug class.
localization:
- 'growth plate chondrocyte: where SOCS2 gates the GH response'
- 'proliferative and hypertrophic zones: where the grazing rats lost plate width, with the germinal zone
  untouched'
human_evidence: direct
human_evidence_note: >-
  Two direct human datasets - deja2026's serum SOCS2 against height SDS in children, and ying2026's
  randomised comparison of weekly against daily GH with annualised height velocity. The feeding-pattern
  human arm measured only ghrelin and GH rhythm and carries no growth endpoint.
species_basis:
- human
- rat
- mouse
translation_risk: moderate
translation_risk_reason: >-
  The mechanism is rodent and ex vivo; the two human datasets are a cross-sectional correlate in a disease
  population and a trial whose endpoint is first-year velocity rather than attained height.
confidence: B
confidence_reason: >-
  The refutation is carried by a randomised trial with a prespecified primary endpoint and is supported by
  two independent syntheses, which is strong. The supporting rodent and human-correlate rows are graded
  lower individually for the reasons in their own uncertainty fields.
claim_grades:
- claim: >-
    Flattening growth hormone exposure blunts longitudinal growth in humans, as the SOCS2 loop predicts.
  grade: X
  basis: >-
    REFUTED WHERE IT HAS BEEN TESTED. ying2026 - weekly lonapegsomatropin gave annualised height velocity
    10.66 versus 9.75 cm/year for daily somatropin, non-inferior AND superior. Two independent syntheses
    agree in direction. This was my prediction from round 269 and the human trial data outrank the
    mechanism.
- claim: >-
    The pattern hypothesis has been tested at the frequency that matters.
  grade: X
  basis: >-
    IT HAS NOT, AND SAYING SO IS NOT A RESCUE OF THE ABOVE. Physiological GH pulses arrive every few hours;
    a daily subcutaneous injection is already a single non-physiological bolus, so daily-versus-weekly does
    not span the pulses-versus-constant contrast that isgaard1988 and hornsby2025 concern. Both statements
    are recorded because both are true and they bound the question from opposite sides.
- claim: >-
    Serum SOCS2 is associated with shorter stature in children.
  grade: C
  basis: >-
    deja2026 - higher in CKD than controls, r = -0.30 with height SDS, independent predictor in
    multivariate analysis, AUC 0.78. Held at C because SOCS2 is an intracellular protein whose circulating
    pool is of unestablished provenance, the design is cross-sectional, the population is CKD with reduced
    renal clearance as an obvious alternative explanation, and it is one cohort.
- claim: >-
    Isocaloric feeding pattern changes skeletal growth through GH burst architecture.
  grade: C
  basis: >-
    hornsby2025 - grazing and meal-fed rats ate identically and only the grazing animals lost 3 per cent of
    body length and 17 per cent of plate width, with meal-feeding tripling GH secretion and adding two
    bursts per day, ghrelin- and GHS-R-dependent. C rather than B because the rat arm confounds GH AMOUNT
    with GH PATTERN and the human arm has no growth endpoint.
- claim: >-
    Meal-feeding would make a well-fed subject taller.
  grade: X
  basis: >-
    NOT SHOWN AND CORR-203 COVERS IT BY NAME - THIS IS RESTORATION, NOT ELEVATION. Meal-fed animals matched
    ad libitum controls and did not exceed them. Every effect in hornsby2025 is protection against a 20 per
    cent calorie deficit. The subject of this programme is not calorie-restricted.
- claim: >-
    Daily GH should be preferred over weekly GH in this stack.
  grade: X
  basis: >-
    NO EVIDENCE SUPPORTS IT AND SOME OPPOSES IT. ying2026 and two syntheses put weekly at least equal and
    probably better on first-year height velocity, with similar safety. The mechanistic argument for daily
    dosing was mine and it did not survive contact with the trials.
