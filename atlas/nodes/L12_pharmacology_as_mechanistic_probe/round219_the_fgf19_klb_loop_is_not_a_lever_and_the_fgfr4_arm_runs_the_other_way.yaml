translation_risk_reason: 'The two mechanistic anchors are mouse germline genetics read against a partial
  postnatal pharmacological block in a human adolescent, which is precisely the substitution CORR-046
  retracted an argument for making.'
confidence: B
claim_grades:
- claim: blocking the FGF19/klotho-beta compensatory loop would steepen the FGFR3 dose-response
  grade: X
  basis: 'FALSE, on four independent grounds - the ligand is absent from human cartilage, the obligate
    co-receptor is essentially absent, the compensatory rise is 300- to 1700-fold below any concentration
    shown to shorten a bone, and erdafitinib already removes 5 to 20 per cent of the receptor. Rounds 217
    and 218 named it as the one untried lever; three of the four disproofs were already in this atlas'
- claim: a soluble co-receptor supplied in trans can reconstitute FGF19 signalling in a tissue that does not
    express beta-klotho
  grade: C
  basis: DEMONSTRATED BY fgf19cart2025's OWN DESIGN and previously missed - FGF19 alone did nothing to
    cultured metatarsals and the effect required added recombinant KLB. This is a real route and it means
    the CORR-041 tissue-expression argument does not by itself close the endocrine question. Mouse organ
    culture, one concentration, no dose-response
- claim: a functional soluble beta-klotho circulates in humans at concentrations able to do this
  grade: E
  basis: NOT ESTABLISHED. An Olink panel reports a plasma KLB analyte that rises; the well-characterised
    soluble klotho in human serum is ALPHA-klotho at 0.2 to 0.9 ng/mL. Recorded as a gap, not asserted in
    either direction
- claim: the FGFR4 signal operating in human growth plate cartilage is growth-promoting rather than
    growth-restraining
  grade: E
  basis: 'REGRADED FROM C THE SAME DAY BY CORR-218. The argument was that FGF19/KLB restrains but needs a
    co-receptor that is ABSENT, while FGF18 promotes and needs none. beta-klotho is NOT absent - it is
    detected in ten of ten samples of the zone-resolved human array, on both probe sets, inside this
    atlas''s own low-abundance calibrator band. BOTH ARMS MAY OPERATE AND FGFR4''s NET DIRECTION IN HUMAN
    CARTILAGE IS UNRESOLVED'
- claim: beta-klotho and FGF19 are absent from the human growth plate
  grade: X
  basis: 'FALSE, AND IT WAS FALSE WHEN CORR-041 AND CORR-042 WROTE IT. Both read droplet scRNA-seq detection
    percentages, a platform CORR-114 disqualifies for this transcript class because PTHLH and GDF5 sit at
    the same floor. On GSE9160 KLB runs 180-847 on one probe set and 23-339 on the other across all ten
    samples, against an NPPC floor of 4-20. Recorded as CORR-218'
- claim: erdafitinib's off-target FGFR1 and FGFR4 occupancy is a net cost in centimetres
  grade: E
  basis: 'INADMISSIBLE AS STATED - this is the receptor ledger CORR-046 retracted, approached for a fourth
    time. The OCCUPANCY is computed and defensible; the conversion to height is not, because only FGFR3 has
    a human exchange rate and it is worth roughly 65 cm between its directions while FGFR1 and FGFR4 have no
    human stature phenotype'
- claim: FGFR3 inhibition is self-limiting because it also blocks FGF18-induced autophagy
  grade: E
  basis: IN VITRO ONLY. Fgfr3 RNAi blocks FGF18-induced autophagy in RCS chondrocytes, but the same paper
    found a significant LC3-II fall in Fgfr4-/- growth plates and NOT in Fgfr3-/-, concluding the effect is
    mainly FGFR4. Attractive and unsupported in vivo
- claim: an autophagy activator is a ranked addition to the stack
  grade: E
  basis: NOT YET. It has the only in vivo bone-length increase under a drug in this thread, but the rescued
    genotype is a germline null rather than a partial postnatal block, and whether it elevates a WILD-TYPE
    bone is unknown. Two answerable questions stand between it and a ranking
