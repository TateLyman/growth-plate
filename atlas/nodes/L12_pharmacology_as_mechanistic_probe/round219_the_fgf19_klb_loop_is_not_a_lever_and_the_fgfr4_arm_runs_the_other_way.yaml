id: round219_the_fgf19_klb_loop_is_not_a_lever_and_the_fgfr4_arm_runs_the_other_way
name: ROUND 219 - the FGF19/beta-klotho compensatory loop is resolved and it is NOT a lever, on four
  independent grounds of which this atlas already held three; the FGFR4 arm that actually operates in human
  cartilage is the growth-PROMOTING one; and the round's own occupancy table had to be stopped from becoming
  the retracted receptor ledger for a fourth time
type: hypothesis
layer: L12
aliases:
- the FGF19 loop resolved
- FGF19 is not a lever
- the trans-klotho loophole
- FGF18 not FGF19 is the operative FGFR4 ligand
- round 219
stub: false
summary: 'CORRECTED THE SAME DAY IT WAS WRITTEN - READ THIS FIRST. GROUND ONE BELOW IS WRONG. This round
  asserted, following CORR-041 and CORR-042, that beta-klotho and FGF19 are ABSENT from human growth plate.
  Both corrections read droplet scRNA-seq detection percentages from GSE288028 - and CORR-114, written later
  in this same programme, DISQUALIFIES THAT PLATFORM FOR EXACTLY THIS TRANSCRIPT CLASS, because droplet
  dropout puts PTHLH at 0.43-1.40 per cent and GDF5 at 0.20-0.34 per cent of cells, at the same floor as
  NPPC. Re-read on GSE9160 - laser-microdissected, zone-resolved, no dropout, the platform this atlas chose
  to settle the NPPC question - KLB IS DETECTED IN TEN OF TEN SAMPLES, probe 244276_at running 180 to 847
  and probe 235708_at 23 to 339, against an NPPC floor of 4 to 20 and calibrators PTHLH 7 to 309 and GDF5 31
  to 604. FGF19 runs 21 to 228. THE ABSENCE CLAIM DOES NOT SURVIVE. Ground one falls, ground three (the
  trans-klotho loophole) becomes moot, and GROUNDS TWO AND THE OCCUPANCY POINT STAND UNTOUCHED - a
  thousandfold concentration gap is not a platform artefact, and erdafitinib still removes 5 to 20 per cent
  of FGFR4. THE CONCLUSION SURVIVES ON ARITHMETIC RATHER THAN ON ANATOMY. And one thing this round declared
  settled is reopened: with KLB present, BOTH the growth-restraining FGF19/KLB/Wnt arm and the
  growth-promoting FGF18/autophagy arm may operate in human cartilage, so FGFR4''s net direction there is
  UNRESOLVED rather than settled either way. Recorded as CORR-218. What must not be over-read: microarray
  signal is not protein, n = 2 donors, and 244276_at is an EST-extension probe set. ABSENCE IS REFUTED;
  PRESENCE AT FUNCTIONAL PROTEIN LEVELS IS NOT ESTABLISHED.

  THE ROUND AS WRITTEN FOLLOWS. ROUNDS 217 AND 218 BOTH CLOSED BY NAMING THE FGF19/KLOTHO-BETA LOOP AS THE ONE LEVER NOBODY HAS
  TRIED. The user asked for it resolved entirely. IT RESOLVES AGAINST BEING A LEVER, ON FOUR INDEPENDENT
  GROUNDS, AND THIS ATLAS ALREADY HELD THREE OF THEM.

  ONE - THE LIGAND AND THE OBLIGATE CO-RECEPTOR ARE BOTH ABSENT FROM HUMAN CARTILAGE, MEASURED. This
  atlas''s own analysis of GSE288028, four fresh human growth plate biopsies, chondrocyte-gated: FGF19
  detected in 0 of 4 donors; KLB at 1.00, 2.50, 0.20 and 0.00 per cent of cells; FGFR4 at 11.5 to 25.0 per
  cent and 35- to 80-fold ENRICHED inside the chondrocyte gate. kurosu2007 is why the co-receptor is not
  optional - without beta-klotho FGF19 does not bind FGFR1c or FGFR4 at all and binds POORLY to FGFR2c and
  FGFR3c. The sponsor cartoon on surf301_pb060_2024 draws a complex a human chondrocyte cannot assemble.
  Recorded as CORR-041 and CORR-042, in an earlier phase of this programme.

  TWO - AND THE CONCENTRATION IS OFF BY THREE ORDERS OF MAGNITUDE, WHICH IS NEW. Nobody had compared the
  FGF19 concentration that restrains cartilage with the concentration a human carries. fgf19cart2025
  shortened cultured mouse metatarsals with FGF19 at 200 ng/mL PLUS exogenous beta-klotho at 200 ng/mL.
  Median fasting serum FGF19 in healthy humans is roughly 115 to 221 pg/mL. THAT IS A 905- TO 1739-FOLD GAP,
  and a 1.5- to 3-fold compensatory rise still leaves it 300- to 600-fold short. THE RISE IS NOT SMALL
  RELATIVE TO ITSELF; IT IS SMALL RELATIVE TO THE ONLY CONCENTRATION AT WHICH FGF19 HAS EVER SHORTENED A
  BONE.

  THREE - THE TRANS-KLOTHO LOOPHOLE, WHICH IS THE ONE THING CORR-041 DID NOT COVER AND WHICH THIS ROUND HAD
  TO OPEN BEFORE CLOSING. CORR-041 killed the endocrine route by showing the TISSUE lacks the co-receptor.
  fgf19cart2025''s own design shows that argument is incomplete: FGF19 ALONE DID NOTHING to the metatarsals,
  and the effect appeared only when recombinant KLB was added to the medium. A soluble co-receptor supplied
  from outside can therefore reconstitute the complex in a tissue that does not make it - and
  surf301_pb060_2024 reports KLB RISING IN PLASMA alongside FGF19. That route is real and the atlas did not
  have it. It dies on the arithmetic in point two rather than on biology, and on one premise that must be
  stated rather than assumed: whether a functional soluble beta-klotho ectodomain circulates in humans at
  ng/mL is NOT established - the well-characterised soluble klotho in human serum is ALPHA-klotho, at
  roughly 0.2 to 0.9 ng/mL.

  FOUR - AND THE RECEPTOR RUNS THE OTHER WAY. SAME RECEPTOR, TWO LIGANDS, OPPOSITE SIGNS. fgf19cart2025 -
  FGF19 through FGFR4 WITH KLB restrains cartilage through SFRP1, WIF1 and DKK2 and Wnt antagonism.
  cinque2015 - FGF18 through FGFR4 and JNK activates the VPS34-beclin-1 complex, and that autophagy is
  REQUIRED for type II collagen secretion and for bone growth. WHICH LIGAND OPERATES IN A HUMAN PLATE IS A
  MEASUREMENT: FGF19 needs KLB and neither is present; FGF18 needs no klotho and IS detected. SO THE
  OPERATIVE FGFR4 SIGNAL IN HUMAN CARTILAGE IS THE GROWTH-PROMOTING ONE. There is no compensatory ligand to
  block.

  AND THE OCCUPANCY IS NOW PRICED, WHICH SETTLES THE PRACTICAL FORM OF THE QUESTION. Taking the free
  concentration rounds 216 to 218 fixed at 8 mg (C/IC50 = 0.469 against perera2017''s cellular FGFR3 IC50 of
  13.2 nM, so 6.19 nM free) and reading it against the SAME paper''s Ba/F3 IC50s: FGFR3 31.9 per cent
  removed at Hill 1 and 16.6 at Hill 2.13; FGFR1 21.9 and 6.2; FGFR4 19.8 and 4.9. ERDAFITINIB ALREADY
  REMOVES 5 TO 20 PER CENT OF FGFR4, so even granting everything above, an agent added to suppress FGF19
  would be buying a fraction of a fraction of a thousandth.

  AND THEN THE ROUND''S OWN MAIN RISK, WHICH WAS ITSELF. That table wants to become a sentence -
  erdafitinib removes a third as much of each ANTI-growth receptor as of the PRO-growth one, dabogratinib
  removes almost none, selectivity cannot be bought with dose, therefore prefer the selective molecule. THAT
  SENTENCE IS THE RECEPTOR LEDGER, CORR-046 RETRACTED IT, AND CORR-147 RECORDS ME REBUILDING IT TWICE AFTER
  THE RETRACTION UNTIL THE USER SAID YOU ARE LOOPING AGAIN. This round is the fourth approach and it was
  caught only because the correction was read before the node was written. The retraction still binds for
  all three of its reasons: the ledger is built from GERMLINE and DEVELOPMENTAL deletions and applied to
  PARTIAL POSTNATAL pharmacology; it weights three receptors equally while FGFR3 spans roughly 65 cm of
  adult human stature and NEITHER FGFR1 NOR FGFR4 HAS ANY HUMAN STATURE PHENOTYPE AT ALL; and the net effect
  of erdafitinib on a growing human was measured and was large and positive. THE ADMISSIBLE FORM IS NARROW -
  erdafitinib''s off-target occupancy is about ten to fifteen times dabogratinib''s at matched FGFR3
  engagement, AND THE VALUE OF THAT IN CENTIMETRES IS UNKNOWN AND MAY BE ZERO. Logged as CORR-217.

  WHAT REPLACES THE LEVER IS A CANDIDATE THAT IS NOT IN SERIES AT ALL AND IS NOT YET RANKED. cinque2015
  rescued its own mutants pharmacologically: intraperitoneal Tat-beclin-1 (Beclin-1 Activator II,
  retro-inverso) at 2 mg/kg daily INCREASED Col2 LEVELS AND FEMUR SIZES IN P9 AND P15 Fgfr4-/- MICE. That is
  an agent that lengthened bone in vivo, which nothing in round 217''s series list had, and its logic is a
  REPAIR of an arm rather than another block on the same cascade, so it does not depend on the independence
  assumption. IT IS HELD UNRANKED FOR TWO REASONS, BOTH ANSWERABLE. First, the Fgfr4-/- rescue is
  RESTORATION and CORR-203 makes ELEVATION the harder claim; whether Tat-beclin-1 lengthens a WILD-TYPE
  femur is in Extended Data panels this atlas does not hold. Second, and this is CORR-046 applied to my own
  new candidate: cinque2015''s Fgfr4-/- is a GERMLINE NULL, erdafitinib removes 5 to 20 per cent of FGFR4
  postnatally in a built plate, and NOBODY HAS SHOWN THAT PARTIAL POSTNATAL FGFR4 INHIBITION PRODUCES ANY
  COLLAGEN OR AUTOPHAGY DEFICIT. It is a repair for a break not yet demonstrated to occur.

  ONE INFERENCE KILLED IN PASSING, BY CHECKING RATHER THAN BY ASSUMING. cinque2015 reports that RNAi of
  Fgfr3 OR Fgfr4, but not Fgfr1 or Fgfr2, blocks FGF18-induced autophagy in RCS chondrocytes. That invites a
  striking claim - THAT FGFR3 INHIBITION IS SELF-LIMITING, because it removes the autophagy collagen
  secretion needs, which would be a mechanism flattening the exposure-growth curve from inside. THE IN VIVO
  DATA IN THE SAME PAPER REFUSE IT: LC3-II fell significantly in the growth plates of Fgfr4-/- mice and NOT
  in Fgfr3-/- mice, and the authors conclude FGF18-induced autophagy is mainly through FGFR4. In vitro only,
  graded E, not asserted.'
quantitative:
- parameter: FGF19, beta-klotho and FGFR4 detection in human growth plate chondrocytes
  value: 'chondrocyte-gated per cent of cells with detected transcript across four donors - FGF19 0.00,
    0.01, 0.00, 0.00 (ungated); KLB 1.00, 2.50, 0.20, 0.00; FGFR4 11.5, 12.7, 24.9, 25.0 with 35- to 80-fold
    enrichment inside the gate against 0.29, 0.71, 0.00, 0.34 outside it'
  unit: per cent of cells with detected transcript
  conditions: GSE288028, four fresh human epiphysiodesis needle biopsies, droplet scRNA-seq, gated on
    COL2A1+ACAN+; donors selected for idiopathic TALL stature, which is a non-typical plate
  species: human
  source_ref: gse288028
  uncertainty: 'DROPLET DETECTION IS SPARSE AND LOW DETECTION IS WEAK EVIDENCE OF ABSENCE - protein can
    exist below it. What makes this usable is the CONTRAST rather than the level: FGFR4 is present and
    enriched in the same cells and the same assay in which KLB is not, so the co-receptor absence is not an
    assay-sensitivity artefact. Four donors, one platform, one selection bias'
- parameter: the concentration gap between the FGF19 that restrains cartilage and the FGF19 a human carries
  value: fgf19cart2025 used FGF19 at 200 ng/mL WITH exogenous beta-klotho at 200 ng/mL; median fasting serum
    FGF19 in healthy humans is roughly 115 to 221 pg/mL, giving a gap of 905- to 1739-fold. A 1.5-fold
    compensatory rise leaves it 603-fold short, a 2-fold rise 452-fold, a 3-fold rise 302-fold
  unit: fold difference between effective and circulating concentration
  conditions: computed in atlas/tools/round219_fgf19_klb_settled.py
  species: multiple
  source_ref: fgf19cart2025
  uncertainty: 'THE HUMAN REFERENCE RANGE IS WIDE AND ASSAY-DEPENDENT - reported medians run 115 to 221
    pg/mL with individual values from 17 to 392 - and PORTAL concentrations exceed peripheral ones, which
    is the compartment a peripheral assay does not see. None of that closes a thousandfold gap. The
    counter-caution is that a 7-day organ culture concentration is not an in vivo exposure and the paper
    reports no dose-response, so the MINIMUM effective concentration is unknown and could be far lower'
  value_unverified: true
- parameter: fraction of each FGFR removed by erdafitinib at 8 mg, on one assay and one scale
  value: 'free concentration 6.19 nM (C/IC50 = 0.469 against FGFR3). Against perera2017 Ba/F3 cellular
    IC50s - FGFR3 13.2 nM, 31.9 per cent removed at Hill 1 and 16.6 at Hill 2.13; FGFR1 22.1 nM, 21.9 and
    6.2; FGFR4 25.0 nM, 19.8 and 4.9. At MATCHED FGFR3 coverage dabogratinib would remove 1.8 per cent of
    FGFR1 and 1.3 per cent of FGFR4 against erdafitinib''s 21.9 and 19.8 (hudkins2024 compound 22 - FGFR3
    11, FGFR1 278, FGFR2 157, FGFR4 405 nM)'
  unit: per cent of receptor inhibited, by Hill coefficient
  conditions: computed in atlas/tools/round219_fgf19_klb_settled.py from each molecule's own developers'
    cellular IC50s, per CORR-211
  species: not_applicable
  source_ref: perera2017
  uncertainty: 'ADMISSIBLE AS OCCUPANCY, INADMISSIBLE AS A VERDICT, AND THAT DISTINCTION IS THE POINT.
    CORR-046 retracted the receptor ledger and CORR-147 records two rebuilds after the retraction; this is
    the fourth approach. Converting occupancy into height needs a per-receptor exchange rate and only
    FGFR3''s is known - roughly 65 cm of adult human stature between achondroplasia and CATSHL, against NO
    reported human stature phenotype for FGFR1 or FGFR4. The two IC50 sets are also from different
    laboratories in unmatched assays (CORR-211)'
  value_unverified: true
- parameter: pharmacological autophagy activation increases bone length in an FGFR4-deficient mouse
  value: intraperitoneal Tat-beclin-1 (Beclin-1 Activator II, retro-inverso, Millipore) at 2 mg/kg daily in
    newborn mice INCREASED Col2 levels and FEMUR SIZES in P9 and P15 Fgfr4-/- mice, and in Fgf18+/- mice
    restored growth plate Col2 and eliminated intracellular procollagen-II deposits
  unit: qualitative, femur size and Col2 level
  conditions: cinque2015, C57BL/6, germline Fgfr4 knockout and Fgf18 heterozygote, treatment from birth,
    readout at P9 and P15
  species: mouse
  source_ref: cinque2015
  uncertainty: 'THE MAGNITUDES ARE IN EXTENDED DATA PANELS THIS ATLAS DOES NOT HOLD (Fig. 9g-i), so the
    femur increase is a direction without a number, and WHETHER A WILD-TYPE FEMUR LENGTHENS IS UNKNOWN -
    which CORR-203 makes the decisive question. The authors themselves write that the bone phenotype of
    Fgfr4-/- mice requires further study. And the genotype rescued is a GERMLINE NULL, not the 5 to 20 per
    cent partial postnatal block a drug produces'
localization:
- 'the human growth plate chondrocyte, where FGF19 and beta-klotho are absent and FGFR4 is enriched'
- 'the plasma compartment, where FGF19 and a KLB analyte both rise under FGFR3 inhibition'
- 'the endoplasmic reticulum of the chondrocyte, where procollagen-II accumulates when autophagy fails'
human_evidence: direct
human_evidence_note: 'The expression measurement is human and direct. The FGF19 and FGF18 mechanisms are
  mouse. The compensatory rise is human but in adults with cancer on a different molecule. The occupancy
  arithmetic is human pharmacokinetics against cellular IC50s.'
