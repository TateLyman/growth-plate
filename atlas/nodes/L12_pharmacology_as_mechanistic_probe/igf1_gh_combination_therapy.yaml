localization:
  - "human growth plate: both agents presumed to act on chondrocytes; no tissue-level partition measured"
human_evidence: direct
human_evidence_note: >-
  A randomised multi-arm dose-selection trial in 106 children with posted height-velocity
  results by arm and year.
species_basis: [human]
translation_risk: low
translation_risk_reason: >-
  Entirely human data. The unresolved part is not species translation but early
  termination: velocity was measured for four years and adult height never.
confidence: B
claim_grades:
  - claim: Adding rhIGF-1 to a full rhGH dose increases first-year height velocity by roughly 1-2 cm/yr.
    grade: B
    basis: Randomised open-label multi-arm trial with posted results, n=106, but non-monotonic across doses and no confidence intervals posted.
  - claim: The incremental effect of added rhIGF-1 wanes with continued treatment.
    grade: C
    basis: Between-arm spread narrows from ~1.9 cm/yr at year 1 to ~0.7 cm/yr at year 4 in the posted data; not formally tested for interaction.
  - claim: Combination therapy increases adult height.
    grade: X
    basis: The trial was designed to answer this over six years and was terminated for strategic reasons; no adult-height data exist.
