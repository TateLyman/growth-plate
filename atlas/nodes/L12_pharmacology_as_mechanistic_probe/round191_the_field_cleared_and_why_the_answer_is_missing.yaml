human_evidence: absent
human_evidence_note: 'This round is animal and bibliometric. The human evidence is unchanged from round
  190 - winer2018 with normal height velocity over a mean 6.9 years at 0.75 micrograms per kilogram per
  day and final heights at or above target in the unconfounded arm.'
species_basis:
- rat
- mouse
translation_risk: high
translation_risk_reason: 'The positive length data are a rat proximal tibia at a dose twice what the null
  used, and a rat mandibular condyle which is secondary cartilage. The null is a mouse whole-body length
  measured nose to tail-base. No two of the three studies share a species, a dose and an endpoint, so
  the disagreement between them may be entirely methodological.'
confidence: D
claim_grades:
- claim: The decision-relevant literature has been cleared.
  grade: B
  basis: 'FOR THE SLICE THAT CAN CHANGE THE ANSWER, YES. The 275-record slice was auto-classified: Tier
    1, the only combination that can contain the result, held five papers and all five are read; Tier 2
    is empty; Tier 3 has no growth endpoints. Three orthogonal queries covering 509 further records
    yielded four Tier-1 candidates, two already known and two new, both now read. The unrestricted
    2,727-record space is not cleared and is mostly osteoporosis, dental and fracture healing.'
- claim: Nobody has measured what a PTH1R agonist does to the growth plate progenitor pool.
  grade: A
  basis: 'ESTABLISHED BY ENUMERATION, NOT BY FAILED SEARCHING. Tier 2 of the classified slice - an
    agonist plus a resting-zone, reserve-zone, label-retention, chondroprogenitor or skeletal-stem-cell
    readout - contains ZERO papers. This is the strongest form the claim can take short of reading every
    record in the field.'
- claim: Abaloparatide is more potent than teriparatide at a growing cartilage.
  grade: D
  basis: 'ONE HEAD-TO-HEAD STUDY SAYS SO AND IT IS THE ONLY ONE. wang2023 randomised 70 adolescent
    wild-type rats across 14 groups and concluded abaloparatide seems more potent than teriparatide, with
    both raising condylar length and suppressing collagen X. D because the tissue is SECONDARY cartilage
    rather than a physis, because potency was a qualitative conclusion rather than a fitted comparison,
    and because it bears on efficacy only - it does not touch the round-188 immunogenicity argument,
    which was never about potency.'
- claim: bartlow2017 refutes ogawa2002.
  grade: E
  basis: 'IT IS A NEGATIVE AND IT IS NOT A REFUTATION. Half the dose - 40 against 80 micrograms per
    kilogram on the same schedule - a different species, and body length measured rostrum to base of tail
    against a double-tetracycline-labelled proximal tibial elongation rate. A 13 per cent tibial gain
    over three weeks is invisible in a whole-animal composite dominated by the axial skeleton. It does
    establish that PTH(1-34) at 40 micrograms per kilogram for eight weeks does not grossly lengthen a
    healthy juvenile mouse.'
- claim: The missing amplification answer means the drug was tested for growth and failed.
  grade: X
  basis: 'NO - IT MEANS IT WAS NEVER MEASURED, AND THAT IS NOW DOCUMENTED FOUR TIMES OVER. liao2026,
    altman2015 and bartlow2017 each had a length measurement in a growing animal under a PTH1R agonist
    and each reported bone volume, density, architecture or strength instead. The field that dosed these
    drugs is the bone-densitometry field, whose endpoints are not length. The gap is a discipline
    artifact.'
