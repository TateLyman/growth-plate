contradicts:
- 'PARTIALLY REVERSES THE ROUND-188 MOLECULE CALL ON EFFICACY GROUNDS WHILE LEAVING ITS BASIS INTACT.
  Round 188 switched to teriparatide on immunogenicity - 26 per cent neutralising antibodies against 3
  per cent, plus cross-neutralisation of endogenous PTHrP. wang2023 is the only head-to-head at a growing
  cartilage and judges ABALOPARATIDE more potent. Both can be true: the choice is now an explicit
  trade-off between potency and a 26 per cent neutralising rate, not a one-sided call.'
- 'ADDS THE FIRST WILD-TYPE NULL TO THE LENGTH EVIDENCE. Rounds 184 to 190 treated ogawa2002 as the only
  wild-type length result. bartlow2017 is a second, in healthy juvenile mice, and it is negative - though
  at half the dose and on a much cruder endpoint.'
