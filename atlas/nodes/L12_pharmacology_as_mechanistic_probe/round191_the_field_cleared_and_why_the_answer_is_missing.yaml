id: round191_the_field_cleared_and_why_the_answer_is_missing
name: ROUND 191 - the decision-relevant literature is cleared, a head-to-head in growing rats favours
  abaloparatide, a wild-type null appears at half the dose, and FOUR studies measured length and never
  reported it
aliases:
- the field cleared
- head to head in growing rats
- the missing endpoint is a discipline artifact
- round 191
type: hypothesis
layer: L12
stub: false
summary: 'THE SYSTEMATIC SCREEN IS FINISHED FOR THE SLICE THAT CAN CHANGE THE ANSWER, AND IT PRODUCED
  TWO PAPERS THE FIRST QUERY HAD HIDDEN, ONE OF WHICH IS A HEAD-TO-HEAD AND ONE OF WHICH IS A NULL.

  HOW THE SCREEN CLOSED. The 275-record decision-relevant slice was auto-classified by evidence type.
  TIER 1 - a PTH1R agonist AND a length endpoint AND an in vivo model, the only combination that can
  contain the result - contained FIVE papers, and all five are now read. TIER 2 - an agonist plus a
  resting-zone or fusion mechanism - contained ZERO. That is an independent confirmation, by
  enumeration rather than by failing to find things, that nobody has measured what a PTH1R agonist does
  to the progenitor pool. Tier 3, eleven papers, is entirely bone microarchitecture with no growth
  endpoint.

  THEN THE VOCABULARY PROBLEM. The slice required both a growth-plate term and a length term, so a
  study titled around "mandibular growth" or "juvenile mouse femur" was invisible to it. Three
  orthogonal queries returned 509 records outside the original 275; screened for the same decisive
  combination they yielded FOUR, of which two were already known and TWO WERE NEW AND BOTH MATTER.

  THE HEAD-TO-HEAD, AND IT FAVOURS ABALOPARATIDE. wang2023 randomised SEVENTY four-week-old male
  Sprague-Dawley rats - adolescent, wild-type, no disease model - into fourteen groups on intermittent
  teriparatide or abaloparatide at various doses for four weeks. BOTH DRUGS INCREASED CONDYLAR LENGTH
  AND CARTILAGE THICKNESS, with SOX9 and collagen II UP and COLLAGEN X DOWN. Down-regulated collagen X
  with up-regulated SOX9 is the commitment-delay signature, measured in vivo in a normal growing
  animal. In vitro the same: proliferation, glycosaminoglycan synthesis, COL2 and SOX9 up, COL10, Ihh
  and PTH1R down. AND THE AUTHORS CONCLUDE THAT ABALOPARATIDE SEEMS MORE POTENT THAN TERIPARATIDE IN
  THIS CONTEXT. Mechanical loading by mandibular advancement ATTENUATED the effect, which is its own
  finding.

  THE CAVEAT THAT KEEPS THIS FROM SETTLING IT: mandibular condylar cartilage is SECONDARY cartilage. It
  has a fibrous progenitor layer at its surface, grows appositionally, and is far more
  mechanoresponsive than a physis. Transfer to a long-bone growth plate is an assumption, and the
  loading result shows the tissue behaves in ways a physis does not.

  THE NULL, AND IT IS AT HALF THE DOSE. bartlow2017 gave BALB/cJ mice PTH(1-34) at 40 MICROGRAMS PER
  KILOGRAM, five days a week, for eight weeks from four weeks of age, and followed 189 animals across
  seven timepoints to 26 weeks. THERE WERE NO ENDURING DIFFERENCES IN BODY LENGTH OR MASS. PTH raised
  distal femur volume only transiently at weeks 4 to 12 and the authors conclude that in healthy
  juvenile mice limited-duration PTH did not exert a strong anabolic effect and had no adverse effect
  on growth.

  THIS IS NOT A CLEAN CONTRADICTION OF ogawa2002 AND THE REASONS ARE SPECIFIC. The dose is HALF -
  40 against 80 micrograms per kilogram on the same five-days-a-week schedule. The species differs. And
  the endpoint is BODY LENGTH MEASURED ROSTRUM TO BASE OF TAIL, a whole-animal composite dominated by
  the axial skeleton, against ogawa2002''s double-tetracycline-labelled longitudinal growth rate of the
  proximal tibia. A 13 per cent rise in tibial elongation over three weeks would be a small fraction of
  nose-to-tail length and invisible at that resolution. It is still a negative and it is recorded as
  one, but it is a negative on a crude endpoint at half the dose.

  AND HERE IS THE FINDING THAT REFRAMES THE WHOLE QUESTION. bartlow2017 DEFINED ITS REGIONS OF INTEREST
  RELATIVE TO TOTAL FEMUR LENGTH. It had femur length. It did not report a treatment comparison for it.
  THAT IS NOW THE FOURTH INSTANCE. liao2026 dosed abaloparatide into growing wild-type mice for thirty
  days and reported tibia length in every genotype table and no drug table. altman2015 measured the
  linear growth rate of young rat proximal tibia at 0.31 millimetres per day under intermittent PTH and
  reported it as a METHOD VALIDATION figure rather than as a treatment comparison. And bartlow2017
  normalised to femur length without reporting it.

  THE ABSENCE OF THE ANSWER IS A DISCIPLINE ARTIFACT, NOT A NEGATIVE RESULT. PTH1R agonists have been
  studied almost entirely by the bone-densitometry community, whose endpoints are bone volume fraction,
  mineral density, trabecular number and mechanical strength. Longitudinal length is the growth
  community''s endpoint and they have never had a reason to dose these drugs. Four separate groups had
  the measurement in hand and reported everything except the one number this programme needs. That is a
  much better explanation for the gap than "it was tested and it failed", and it is now documented
  rather than asserted.

  ONE MORE POSITIVE FROM THE SWEEP. sun2020 found that PTH(1-34) PARTIALLY RESTORED THE BODY LENGTH
  PHENOTYPE of Osx-Cre Gpr126 conditional knockout mice, acting through osteoblast cAMP-CREB. That is a
  second instance, after qiu2015, of PTH1R signalling in the OSTEOBLAST compartment governing body
  length - reinforcing that a real part of the growth effect is indirect, and that the drug can restore
  length in a genetic short-body model.

  WHERE THE EVIDENCE NOW STANDS ON LENGTH IN A NORMAL GROWING ANIMAL. FOR: ogawa2002, rat proximal
  tibia, +13.5 per cent longitudinal growth rate at 80 micrograms per kilogram, P<0.05, with terminal
  cell height flat so the gain is entirely cell production. wang2023, rat, condylar length up on both
  drugs with the commitment-delay molecular signature. AGAINST: bartlow2017, mouse, no enduring body
  length difference at 40 micrograms per kilogram on a crude endpoint. UNMEASURED: liao2026,
  altman2015, bartlow2017 femur length. That is the whole evidence base. It is three studies, and one
  of them is negative.'
