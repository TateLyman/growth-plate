contradicts:
- 'ROUND 213''s use of a single Ba/F3 panel as though it were the only one. The discovery paper''s
  supporting information gives TYRA-300 an FGFR3 IC50 of 11 nmol/L against the conference panel''s 1.75,
  with selectivity folds of 25/14/37 against 63/19/55. The RATIO round 213 computed survives because both
  drugs came from one panel; the ABSOLUTE multiples do not. Recorded as CORR-209.'
- 'ROUND 214''s weighting of the lysosome evidence, which treated perera2017 as an abstract-level assertion
  against englinger2018''s quantified sink. The full text shows a matched-pair design with a
  non-lysosomotropic analogue at ten times the concentration and bafilomycin controls in both directions.
  The depot reading is the better-evidenced one. Recorded as CORR-210.'
- 'ROUND 214''s ranking of the lysosome-alkaliniser route fifth with a weak prior. qiu2026''s full text adds
  that hydroxychloroquine is hepatoprotective against a lysosomotropic TKI, so for ERDAFITINIB the
  alkaliniser potentiates the target and protects the liver at once. It still does not transfer to
  TYRA-300.'
