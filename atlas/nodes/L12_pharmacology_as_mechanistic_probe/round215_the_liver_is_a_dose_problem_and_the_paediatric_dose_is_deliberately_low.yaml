id: round215_the_liver_is_a_dose_problem_and_the_paediatric_dose_is_deliberately_low
name: ROUND 215 - the SURF301 exposure-response settles the liver as a dose problem with a clean band at
  60 mg and below, the mechanism is named as BSEP inhibition rather than FGFR, and the paediatric
  achondroplasia programme is deliberately dosing at one sixth to one half of the growth exposure
type: hypothesis
layer: L12
aliases:
- the liver is a dose problem
- BSEP
- BEACH301 doses
- round 215
stub: false
summary: 'ROUND 214 ENDED WITH A NAMED REQUEST - the SURF301 exposure-response for transaminitis and the
  unreported twice-daily arms. The supplied bundle contains the investor webcast that breaks every
  treatment-related adverse event out BY DOSE BAND, the full redacted SURF301 protocol, the erdafitinib
  discovery paper in full, the TYRA-300 discovery paper''s supporting information with the primary Ba/F3
  SAR table, TYRA''s August 2026 corporate deck with the paediatric dose levels, and the deposited
  individual-animal mouse growth data.

  THE LIVER IS A DOSE PROBLEM AND THE STEP IS SHARP. At 60 mg and below, in 22 patients, ALT rose in ONE
  patient at grade 1-2 and AST in NONE AT ALL. At 90 mg, in 15 patients, ALT rose in 7 with 2 at grade 3
  and AST in 7 with 1 at grade 3. At 120 mg, in only 4, AST reached grade 3 in TWO. In exposure terms the
  step is 4,360 against 10,300 ng.h/mL - a 2.4-fold jump. This is not an idiosyncratic monitoring problem;
  it is a concentration effect with a threshold between 60 and 90 mg.

  AND THE SPONSOR NAMES A MECHANISM THAT IS NOT FGFR. The protocol states that pan-FGFR inhibitors,
  particularly those with potency against FGFR4, are associated with hepatotoxicity, AND THEN ADDS THAT
  TYRA-300 IS AN INHIBITOR OF BILE SALT EXPORT PUMP IN VITRO. Round 214 computed free concentration at 8
  per cent of the FGFR4 IC50 at 90 mg and 18 per cent at 120, concluded the transaminitis was probably not
  an FGFR effect, and predicted that more selectivity would not fix it. THAT PREDICTION IS CONFIRMED AND
  THE MECHANISM NOW HAS A NAME. BSEP inhibition is a chemical property of the scaffold and one of the
  best-established in vitro predictors of drug-induced liver injury. It also changes which antidote is
  right - round 214 put S-adenosyl-L-methionine forward on qiu2026''s TFEB mechanism, but the matched
  pharmacology for a bile-salt export lesion is URSODEOXYCHOLIC ACID. Neither is tested for this drug, and
  the observed signal is transaminitis rather than cholestasis, so BSEP is a flagged risk rather than a
  demonstrated cause.

  THE PROTOCOL ALSO SHOWS WHAT ACTUALLY COSTS DOSE, AND IT IS LESS THAN THE HEADLINE RATE SUGGESTS. Grade 1
  transaminitis continues at the current dose. Grade 2 continues at the current dose or holds at
  investigator discretion and RESUMES AT THE SAME DOSE LEVEL. Only grade 3 forces a reduction. So the 47
  per cent ALT and AST rate at 90 mg is mostly not dose-costing; what binds is the grade 3 rate, 13 per
  cent for ALT and 7 per cent for AST at 90 mg and ZERO for both at 60 mg and below.

  THE PAEDIATRIC PROGRAMME IS DELIBERATELY DOSING BELOW THE GROWTH EXPOSURE, AND THE COMPANY SAYS SO ON ITS
  OWN SLIDE. BEACH301 runs a sentinel safety cohort in achondroplasia aged 5-10 at 0.125, 0.25, 0.375 and
  0.50 mg/kg and two run-in cohorts aged 3-10 at 0.25 to 0.625 mg/kg, about 25 participants in total. The
  deck''s own equivalence chart maps 0.625 mg/kg to ONE HALF the adult oncology dose and 0.25 mg/kg to ONE
  SIXTH of it. So the top planned paediatric dose is about 45 mg adult-equivalent - BELOW the 60 mg that
  already matches the murine growth exposure and roughly a quarter of the 90 mg that matches the free FGFR3
  coverage of the child who grew 19.06 cm/year. THIS IS THE SAME CONSERVATISM THAT CAPPED INFIGRATINIB, and
  TYRA''s slide 40 draws the dose-response explicitly - infigratinib at 6.0 cm/year labelled ONE SIXTH
  ONCOLOGY DOSE against pan-FGFR at 19.2 cm/year labelled ONCOLOGY DOSE CAUSING FRACTURES. The company has
  plotted the curve and then chosen the bottom of it.

  THE MOUSE GROWTH CURVE IS NOT SATURATING - RE-ANALYSIS OF THE DEPOSITED DATA SAYS IT IS ACCELERATING. In
  wild-type mice, tibia runs 15.720 mm on vehicle, 16.327 at 12 mg/kg and 16.734 at 14 mg/kg; femur 13.171,
  13.830 and 14.255. THE MARGINAL GAIN PER mg/kg IS ABOUT FOUR TIMES HIGHER OVER THE 12-TO-14 STEP THAN
  AVERAGED OVER 0-TO-12, in both bones. The last 2 mg/kg buys about as much as the first 12 did. The honest
  reading is that with only three dose points and nothing between 0 and 12 a threshold below 12 fits
  equally well, and the 14-against-12 increment is p = 0.055 for tibia and 0.084 for femur, not significant
  alone. WHAT THE DATA WILL NOT SUPPORT IS SATURATION AT 14 mg/kg.

  TWO THINGS CORRECT EARLIER ROUNDS. FIRST, THE Ba/F3 PANEL ROUND 213 USED IS ONE OF TWO THE SPONSOR HAS
  AND THEY DISAGREE. The discovery paper''s supporting information gives compound 22, which is TYRA-300, a
  Ba/F3 FGFR3 IC50 of 11 nmol/L with FGFR1 278, FGFR2 157 and FGFR4 405 - folds of 25, 14 and 37. The
  conference panel round 213 read gives about 1.75 nmol/L at FGFR3 with folds of 63, 19 and 55. Same
  company, same assay name, roughly sixfold apart on absolute potency, and the marketed selectivity figures
  are from the more favourable set. ROUND 213''s COMPARISON SURVIVES BECAUSE IT IS A RATIO WITHIN ONE PANEL
  - erdafitinib''s 1.35 nmol/L came from the same slide as TYRA-300''s 1.75 - but the ABSOLUTE multiples
  are dataset-specific and must be labelled as such. Recorded as CORR-209.

  SECOND, ROUND 214 UNDERRATED THE LYSOSOME EVIDENCE ON ERDAFITINIB''s SIDE. The discovery paper''s Figure
  3D is a far better experiment than the abstract implied and better than the englinger2018 sink result it
  was weighed against. In KATO III cells, erdafitinib at 30 nmol/L given for one hour suppressed
  phospho-FGFR COMPLETELY FOR 4 HOURS and to 24 HOURS after washout, while JNJ-42883919 - a
  NON-LYSOSOMOTROPIC ANALOGUE FROM THE SAME CHEMICAL SERIES, tested at TEN TIMES the concentration -
  returned to basal within 2 hours. Bafilomycin pre-treatment collapsed erdafitinib to the analogue''s
  kinetics and did NOT alter the analogue''s duration. A matched-pair design with a causal control in both
  directions, reading the actual target. THE DEPOT READING IS BETTER EVIDENCED THAN THE SINK READING, and
  round 214''s steady-state capacitor argument still stands for continuous human dosing while the depot
  advantage on an interrupted schedule is now firmly established. Recorded as CORR-210.

  AND ONE ROUTE ROUND 214 RANKED FIFTH WITH A WEAK PRIOR MOVES UP. qiu2026''s full text shows
  HYDROXYCHLOROQUINE at 10 mg/kg significantly reduced hepatic necrotic area in osimertinib-treated mice,
  and that S-adenosyl-L-methionine was the best hit from a screen of clinically available hepatoprotectants.
  So a lysosome-directed agent is hepatoprotective for a lysosomotropic TKI, and englinger2018 says the same
  class of agent potentiates FGFR target engagement 5.1-fold. FOR ERDAFITINIB THOSE POINT THE SAME WAY.
  THEY DO NOT TRANSFER TO TYRA-300, which is neither lysosomotropic nor, on the protocol''s account,
  injuring the liver by that mechanism.'
