localization:
- 'the hepatocyte canalicular membrane, where BSEP exports bile salts and where TYRA-300 is an in vitro
  inhibitor'
- 'the lysosome, where erdafitinib is trapped and from which it appears to re-release over 24 hours'
- 'the growth plate of a wild-type mouse, where the dose-response is still steepening at 14 mg/kg'
- 'the achondroplasia growth plate of children aged 3 to 10, where the only FGFR3-selective paediatric
  programme is dosing at one sixth to one half of the adult oncology exposure'
human_evidence: direct
human_evidence_note: 'The liver exposure-response, the dose-modification rules, the paediatric dose levels
  and the adult PK are all human and all from primary sponsor documents. The growth dose-response is mouse.
  The lysosomal experiments are human cell lines. NO CHILD HAS RECEIVED TYRA-300 AT AN EXPOSURE MATCHING
  THE ERDAFITINIB GROWTH CASE, and no child has received it at all outside BEACH301.'
species_basis:
- human
- mouse
- in_vitro_human_cell
translation_risk: high
translation_risk_reason: 'The hepatic band is defined in elderly heavily pretreated cancer patients, and
  paediatric hepatic tolerance to a BSEP inhibitor is not the same problem. The growth dose-response that
  motivates going above 60 mg is entirely murine.'
confidence: B
claim_grades:
- claim: TYRA-300 transaminitis is exposure-dependent with a threshold between 60 and 90 mg
  grade: B
  basis: a clean step across three dose bands with 22 patients in the clean band showing one grade 1-2 ALT
    rise and no AST signal at all. Investor-deck source, small numbers at 120 mg, and 10 to 60 mg pooled
- claim: the transaminitis is an FGFR-isoform effect that more selectivity would fix
  grade: X
  basis: FALSE, as round 214 predicted from the FGFR4 margin and as the sponsor's own protocol now names -
    TYRA-300 is a BSEP inhibitor in vitro, which is a chemical property of the scaffold
- claim: BSEP inhibition is the demonstrated cause of the clinical transaminitis
  grade: E
  basis: NOT ESTABLISHED. It is an in vitro flag in a protocol risk section with no IC50 given, and BSEP
    inhibitors classically give cholestatic or mixed injury rather than the transaminitis observed
- claim: grade 1 and grade 2 transaminitis cost dose
  grade: X
  basis: FALSE per the protocol. Grade 1 continues at current dose and grade 2 resumes at the SAME dose
    level. Only grade 3 forces a reduction
- claim: the paediatric programme is dosing below the exposure that produces the growth effect
  grade: B
  basis: the deck's own equivalence chart puts the top BEACH301 dose at half the adult oncology dose, which
    is below the 60 mg that matches the murine growth exposure. Corporate-deck source and an assumed body
    weight for the conversion
- claim: the FGFR3 growth dose-response saturates within the tested range
  grade: X
  basis: FALSE. Re-analysis of the deposited individual-animal data shows the marginal gain per mg/kg is
    about four times higher over the 12-to-14 step than averaged over 0-to-12, in both tibia and femur
- claim: erdafitinib's lysosomal compartment acts as a depot that prolongs target suppression
  grade: B
  basis: a matched-pair washout experiment with a non-lysosomotropic analogue from the same series at ten
    times the concentration, plus bidirectional bafilomycin controls, reading phospho-FGFR. Cancer cell
    lines and a washout condition only
