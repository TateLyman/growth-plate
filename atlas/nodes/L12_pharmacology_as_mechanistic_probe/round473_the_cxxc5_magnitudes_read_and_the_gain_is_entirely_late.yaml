id: round473_the_cxxc5_magnitudes_read_and_the_gain_is_entirely_late
name: 'R473 - the CXXC5 tibial-length magnitudes read from the figures: +2.9 per cent on drug, +3.7 per cent genetic,
  and the entire genetic gain accrues between 9 and 12 weeks'
aliases:
- choi2019 Fig 3B
- choi2019 Fig 5J
- KY19382 magnitude
- CXXC5 late gain
- bunger2006 orientation resolved
type: intervention
layer: L12
stub: false
confidence: C
last_verified: '2026-08-27'
species_basis: mouse
human_evidence: absent
human_evidence_note: No human arm on the CXXC5 axis at all. CXXC5 is absent from kosmicki2026 207 height genes, so there
  is no population anchor in either sign. The oestrogen-induction step was shown in human C28/I2 chondrocytes.
translation_risk: high
translation_risk_reason: Mouse, and mice do not fuse their growth plates - so delayed senescence here is a slowed decline
  and not a postponed fusion. The compound is dual against CXXC5-DVL and GSK3beta at nearly equal potency, so it does
  not cleanly test the target. And the one length endpoint starts in EARLY puberty.
summary: 'R460 named the magnitudes in choi2019cxxc5 Figures 3B and 5J as the numbers everything about CXXC5 turns on
  and recorded them as existing only as bars; R462 could not price the compound without them. Both figures were rendered
  from the operator-supplied scan and read. ONE - BOTH AXES ARE PER CENT AND NOT MILLIMETRES, which is why no mm value
  appears anywhere in the text. Fig 5J, the drug arm, 0.1 mg/kg intraperitoneally daily for TEN WEEKS FROM 3 TO 13 WEEKS:
  vehicle mean 100.0 against KY19382 about 102.9, P<0.0005, roughly 7 vehicle against 17 drug animals, vehicle scatter
  about 98.4 to 102. SO THE COMPOUND IS WORTH ABOUT +2.9 PER CENT OF TIBIAL LENGTH, and R460 figure-read estimate of
  about 3 per cent is confirmed. TWO - AND THE GENETIC ARM SHAPE IS THE FINDING, NOT ITS SIZE. Fig 3B is normalised to
  Cxxc5+/+ at 3 weeks = 100. At 3 weeks the KNOCKOUT IS ABOUT 3 PER CENT SHORTER. At 6 weeks 115.0 against 115.3 and
  at 9 weeks 118.7 against 119.1 - indistinguishable. At 12 weeks 121.5 against 126.0, ** P<0.005, the knockout about
  3.7 per cent longer. THE ENTIRE DIVERGENCE ACCRUES BETWEEN 9 AND 12 WEEKS: wild type gained 2.8 points and the knockout
  6.9, a ratio of about 2.5, in the window in which a mouse tibia is decelerating toward its plateau. That is the strongest
  shape argument in this atlas for a LATE-STAGE agent - the effect does not exist until the plate is slowing - and it
  removes a developmental patterning explanation, because a germline knockout that is SHORTER at 3 weeks and LONGER at
  12 cannot be acting by patterning. It also means the gene early role is OPPOSITE to its late one. And the two arms
  agree: 3.7 per cent genetic against 2.9 per cent pharmacological. THREE - THE LIMITATION THAT MATTERS MOST FOR THIS
  CASE, AND IT IS NEW. choi2019cxxc5 HAS THREE IN VIVO DOSING ARMS AND ONLY ONE HAS A LENGTH ENDPOINT. The two-week arm
  starting at 7 weeks - which the authors call LATE PUBERTY and which is the stage-matched arm - was read out on plate
  height, cells per column, BrdU, RUNX2, beta-catenin and TRAP, and NO BONE LENGTH WAS MEASURED. The length number comes
  from the 3-to-13-week arm, which starts in early puberty. AND THE TWO WINDOWS DEMONSTRABLY DIFFER: TRAP-positive foci
  at the growth plate/trabecular interface were UNCHANGED when dosing 3 to 5 weeks and ELEVATED when dosing 7 to 9 weeks,
  which the authors read as activation of the whole maturation process including preparation of the space to be replaced
  by bone. So the early-window length result cannot simply be carried across, and R463 and R471 both establish that plate
  and zone height are readouts that do not track length. FOUR - what the full text does add in the compound favour is
  specificity: the in vitro effects were ABOLISHED by siRNA knockdown of Ctnnb1, and 19 genes reporting on other pathways
  were unaltered while Wisp1 and Axin2 rose. And Fig 3J confirms R462 reading of the target-selective PTD-DBM arm - it
  is CELL NUMBER PER ZONE, with no length. FIVE - SEPARATELY, bunger2006 was in the same bundle and it RESOLVES R454
  orientation ambiguity, which R468 had demoted rather than settled. The Figure 7 legend states the convention: predominant
  orientation is depicted IN THE DIRECTION OF THE LARGE DIMENSIONS OF THE PLATE - in-plane, perpendicular to the growth
  axis - and in the growth plate the particles are predominantly oriented that way. That is the HOOP reading R454 model
  requires. THEN THE ZONE-RESOLVED DATA CUT AGAINST THE MODEL WHERE IT MATTERS: the degree of orientation is 31 +/- 13
  per cent in trabecular bone, about 24 per cent at the plate centre, and THE LOWEST VALUE IN THE WHOLE SCAN, 12 +/-
  15 per cent, at the plate edge the authors identify as the HYPERTROPHIC ZONE. The particles are least ordered in exactly
  the zone where the cell expands axially - which independently corroborates prein2016 random fibril orientation and
  R463 conclusion that the anisotropy is collagen DENSITY and not fibre angle, from a different modality, species and
  skeletal site.'
quantitative:
- parameter: KY19382, tibial length, 0.1 mg/kg i.p. daily for 10 weeks from 3 to 13 weeks of age
  value: vehicle mean 100.0 per cent versus KY19382 mean about 102.9 per cent, P<0.0005 (***)
  unit: per cent of vehicle tibial length
  species: mouse
  source_ref: choi2019cxxc5
  note: Fig 5J read from the operator-supplied scan - THE AXIS IS PER CENT, NOT mm, which is why no mm value appears
    in the text; roughly 7 vehicle against 17 drug points, vehicle scatter about 98.4-102; value_unverified per CORR-318
- parameter: Cxxc5-/- versus Cxxc5+/+ tibial length across age
  value: 3 wk 100 versus about 97 (KNOCKOUT SHORTER); 6 wk 115.0 versus 115.3; 9 wk 118.7 versus 119.1; 12 wk 121.5 versus
    126.0, ** P<0.005 (knockout about 3.7 per cent longer)
  unit: per cent of Cxxc5+/+ at 3 weeks
  species: mouse
  source_ref: choi2019cxxc5
  note: Fig 3B, n=4-10 per group, ANOVA P=2.37e-2; value_unverified per CORR-318. The overall ANOVA p of 0.024 is weak
    and the effect is carried by the 12-week timepoint alone
- parameter: Where the genetic gain accrues
  value: between 9 and 12 weeks wild type gained 2.8 points and the knockout 6.9 - a ratio of about 2.5 - while the two
    were indistinguishable at 6 and 9 weeks and the knockout was BEHIND at 3 weeks
  unit: percentage points of the 3-week baseline
  species: mouse
  source_ref: choi2019cxxc5
  note: computed in R473 from the Fig 3B reads; the divergence occurs in the window in which a mouse tibia is decelerating,
    which is the shape a late-stage agent needs and which no other pool or period lever in this atlas has demonstrated
- parameter: TRAP-positive foci at the growth plate / trabecular interface, by dosing window
  value: NOT different from vehicle when dosing 3 to 5 weeks of age; ELEVATED compared with vehicle when dosing 7 to
    9 weeks of age
  unit: foci
  species: mouse
  source_ref: choi2019cxxc5
  note: the authors read the late-window rise as activation of the overall maturation process including preparation of
    the space to be replaced by osteoblastic bone formation - so the drug does not do the same thing in the two windows,
    which is why the early-window length result cannot be carried across
- parameter: Specificity controls
  value: in vitro effects ABOLISHED by siRNA knockdown of Ctnnb1; of 20 pathway reporter panels only Wnt/beta-catenin
    targets Wisp1 and Axin2 rose, the other 19 unaltered; no histological abnormality in articular cartilage or liver
    and no weight difference over 10 weeks
  unit: qualitative
  species: mouse
  source_ref: choi2019cxxc5
- parameter: PTD-DBM peptide arm readout
  value: 1 mg/kg i.p. daily for 2 weeks in 7-week-old mice, n=10, with in vivo fluorescent imaging confirming presence
    at the tibial growth plate - and the quantitative endpoint is CELL NUMBER IN THE RZ, PZ AND HZ, with NO bone length
  unit: cells per zone
  species: mouse
  source_ref: choi2019cxxc5
  note: Fig 3H-J; confirms R462 reading that the one target-selective reagent has no length endpoint
- parameter: Degree of preferred orientation of matrix particles across a growth plate, by region
  value: 31 +/- 13 per cent in trabecular bone about 500 micron from the plate centre; about 24 per cent at the plate
    centre (roughly resting and proliferative zones); 7-11 per cent in the vertebral body 75-300 micron away; and 12
    +/- 15 per cent - THE LOWEST IN THE SCAN - at the plate edge 50-100 micron from centre, identified by the authors
    as the HYPERTROPHIC ZONE
  unit: per cent PDO
  species: porcine
  source_ref: bunger2006
  note: scanning SAXS, pig L4 neurocentral growth plate, 50 micron pixels; the orientation convention is stated in the
    Fig 7 legend as the direction of the LARGE DIMENSIONS OF THE PLATE, i.e. in-plane and perpendicular to the growth
    axis - the hoop reading R454 needed - but the ordering is weakest in the zone that produces the length
- parameter: Matrix particle size across the growth plate
  value: overall Rg 32.1 +/- 2.7 to 39.8 +/- 3.8 nm, corresponding to cylinder diameters of 90.8 +/- 7.6 to 112.6 +/-
    10.7 nm; thickness parameter T falls from up to 9 nm at the plate centre to about 3 nm outward at constant Rg
  unit: nm
  species: porcine
  source_ref: bunger2006
  note: the paper describes these as MINERAL particles throughout, which sits awkwardly with a 90-112 nm cylinder in
    unmineralised cartilage and with the authors own alternation to the word molecules
