contradicts:
- 'INVERTS part of round 156, which framed a small-molecule PAM as the agent that might make a peptide
  unnecessary. The feedback finding argues the reverse: a PAM has no intrinsic activity and multiplies a
  pool that pathway activation actively suppresses, so it needs a feedback-immune exogenous ligand
  underneath it. The peptide is not displaced by the small molecule; it is what makes the small molecule
  work.'
- 'QUALIFIES the round-156 verdict that a potency-only mechanism is the worst case. That judgement was
  about SELECTIVITY and it stands. On EFFICACY the same mechanism is gated by phosphorylation state, which
  means it should deliver MORE in a normal-FGFR3 subject than in achondroplasia - the opposite of the
  direction every trial on this axis is powered for.'
