id: do_the_two_npr2_arms_collapse_or_multiply
name: DO THE TWO NPR2 ARMS COLLAPSE OR MULTIPLY - they move different kinetic parameters, so they
  multiply; but the phosphatase arm GATES the allosteric arm, and a feedback loop nobody had caps both
aliases:
- are A and B redundant
- do the GC-B PAM and the phosphatase inhibitor stack
- keep or remove the phosphatase arm
- keep or remove the GC-B PAM
- CNP feedback suppression
- is another compound better
type: hypothesis
layer: L12
stub: false
summary: 'THE QUESTION WAS WHETHER THE TWO NPR2 ARMS ARE THE SAME TARGET. THEY ARE NOT, AND THE PROOF IS
  KINETIC RATHER THAN ANATOMICAL - THEY MOVE DIFFERENT PARAMETERS OF THE SAME ENZYME.
  THE RECEPTOR HAS THREE SEPARABLE KINETIC HANDLES AND EACH ARM HOLDS A DIFFERENT ONE. robinson2012:
  natriuretic peptide raises the MAXIMUM RATE more than tenfold, cooperatively, and ATP acting at an
  allosteric site LOWERS THE MICHAELIS CONSTANT - but only when peptide is bound, because peptide binding
  is REQUIRED to communicate the allosteric signal to the catalytic site. edmund2019 localises that
  allostery to the PSEUDOKINASE DOMAIN and shows it is PHOSPHORYLATION-INDEPENDENT: the ATP effect
  survives in a glutamate-substituted phosphomimetic, and kinase-inactivating mutations abolish the Km
  effect WITHOUT touching peptide-dependent activation. yoder2012 shows the third handle: KHD
  phosphorylation is REQUIRED for activation at all, and GC-B-6E reaches only about 20 per cent of
  wild-type. SO: LIGAND MOVES Vmax. PHOSPHORYLATION GATES WHETHER Vmax CAN BE MOVED. KHD ALLOSTERY MOVES
  Km. Three parameters, three arms, no overlap. THEY MULTIPLY.
  BUT THE RELATIONSHIP IS NOT SYMMETRICAL, AND THIS IS THE FINDING OF THE ROUND. THE PHOSPHATASE ARM GATES
  THE ALLOSTERIC ARM. MCUF-42 is a PURE POTENCY-SHIFTER - it left-shifts the CNP curve 6.4-fold with NO
  increase in maximal cGMP. Dephosphorylation removes activation competence, and robinson2017 established
  that FGF-induced dephosphorylation is NOT SURMOUNTABLE BY LIGAND, with the same IC50 at sub-saturating
  and saturating CNP. A COMPOUND WHOSE ENTIRE MECHANISM IS MAKING LIGAND MORE POTENT THEREFORE CANNOT
  RESCUE A DEPHOSPHORYLATED RECEPTOR. Its benefit is conditional on phosphorylation state and scales with
  it. That is genuine SYNERGY rather than additivity - each arm raises the other marginal return - and it
  is the opposite of redundancy.
  THE andresen2023 COMPOUND IS THE ONE THAT ESCAPES THE GATE IN PRINCIPLE - BUT ROUND 160 ESTABLISHED THAT
  NO MOLECULE IN THAT SERIES ENGAGES WILD-TYPE GC-B AT ALL (CORR-174), so this is a statement about a
  mechanism, not about an available compound. It raises EFFICACY, not affinity, and it demonstrably works on top of a receptor already
  locked phosphorylated - plus 183 per cent on GC-A 7E. An efficacy-raiser lifts the ceiling; a
  potency-raiser only helps you reach it. THE COMPOUND THAT EXISTS AT GC-B IS THE POTENCY-RAISER; THE
  MECHANISM WE WANT IS THE EFFICACY-RAISER, AND IT HAS NO GC-B-ACTIVE MOLECULE.
  AND THEN THE INTERACTION NOBODY IN THIS ATLAS HAD, WHICH CAPS EVERY ARM ON THE AXIS. prickett2021
  measured endogenous CNP production across five years of vosoritide in 28 achondroplasia children:
  EXOGENOUS CNP AGONISM SUPPRESSES ENDOGENOUS CNP PRODUCTION. Two components. An INDIRECT fall as growth
  accelerates in the first three months, and a DIRECT fall 4 hours after each injection - absent at day 29
  to 127, then minus 5.0 pmol/L at day 183 (P = 0.003), minus 4.3 at day 365 (P = 0.006), minus 4.2 at day
  730 (P = 0.015) against a pre-injection baseline near 40. The size of the fall tracks the prevailing
  degree of hormone resistance. kanakatti2026 replicates the decline in a SECOND disorder, hypochondroplasia.
  WHY THAT MATTERS MORE FOR A PAM THAN FOR ANYTHING ELSE ON THE AXIS. A POSITIVE ALLOSTERIC MODULATOR HAS
  NO EFFECT OF ITS OWN - MCUF-42 produces zero cGMP without CNP. It is a multiplier on whatever ligand is
  present. If raising pathway output suppresses endogenous ligand production, THE PAM IS PARTLY MULTIPLYING
  A POOL IT IS ITSELF SHRINKING. An exogenous analogue does not have this problem, because its
  concentration is set by the syringe rather than by the feedback loop.
  SO THE FEEDBACK ARGUES FOR A PAIRING, NOT A SUBSTITUTION: THE PAM SHOULD RIDE ON TOP OF A CNP ANALOGUE,
  WHICH SUPPLIES FEEDBACK-IMMUNE SUBSTRATE FOR IT TO AMPLIFY. That is a real reason to keep control point
  A rather than treat the small molecule as its replacement - and it inverts the round-156 framing, which
  treated the PAM as the thing that might make a peptide unnecessary.
  AND IT RAISES THE QUESTION THE WHOLE PAIRING DEPENDS ON: DOES A GC-B PAM POTENTIATE VOSORITIDE, OR ONLY
  NATIVE CNP? ma2024 tested CNP alone. ROUND 160 RESOLVED THIS TO PROBABLY YES WITHOUT AN EXPERIMENT, ON TWO
  INDEPENDENT GROUNDS. STRUCTURAL: vosoritide is Pro-Gly appended to the 37 C-terminal residues of human
  CNP-53, and it RETAINS THE INTACT CNP-22 RECEPTOR-BINDING RING - it differs from native CNP only by an
  N-terminal extension for protease resistance, while MCUF-42 acts on the extracellular domain that the ring
  engages. CROSS-LIGAND: PAMs in this receptor family are not ligand-specific - sangaralingham2021 MCUF-651
  potentiates BOTH ANP AND BNP at GC-A and potentiates endogenous ANP and BNP from human plasma ex vivo, and
  the andresen2023 compounds enhance both. THE GAP IS THEREFORE DOWNGRADED FROM DECISIVE TO CONFIRMATORY.
  What could still break it is the 17-residue N-terminal extension, which is exactly the part native CNP
  lacks and which could obstruct a cleft-adjacent modulator.
  IS ANOTHER COMPOUND BETTER - FOUR CHECKED, NONE DISPLACES EITHER ARM. BMN 333 is BioMarin long-acting
  CNP, reported to give more than 13-fold higher free-CNP exposure than another long-acting CNP agent and
  supporting weekly dosing; it is a BETTER CONTROL POINT A, not a third arm, and it is now in head-to-head
  Phase 2/3 against vosoritide. KK8398 is simply INFIGRATINIB under a Kyowa Kirin code - the FGFR arm this
  atlas already holds, not a new mechanism. ACTIVATING ANTIBODIES are real and work in vivo - liu2026
  shows XX16 stabilises GC-A in an active conformation without ANP and lowers blood pressure in
  obesity-induced hypertension - but an IgG is about 150 kDa and farnum2006 puts plate partition at
  undetectable by 40 kDa, SO THE ANTIBODY ROUTE IS DEAD ON DELIVERY FOR A GROWTH-PLATE TARGET REGARDLESS OF
  ITS PHARMACOLOGY. And the downstream cGMP control point remains dead twice over on direct evidence.
  THE VERDICT, AND IT IS DIFFERENT FOR THE TWO ARMS. KEEP BOTH CONTROL POINTS - they are not redundant by
  any test applied here. BUT ONLY ONE OF THEM HAS AN EXECUTABLE COMPOUND. The allosteric arm has a
  purchasable molecule with a measured dose-response and an identified, structurally mapped target. The
  phosphatase arm has the strongest genetic proof on the whole axis and NO compound, NO identified enzyme,
  and SD-008 forbidding any plan that waits for one. KEEP FOR THE PHOSPHATASE ARM MEANS KEEP THE CONTROL
  POINT, NOT KEEP A DRUG - and its practical value in this stack is bounded by the 1.42-fold tonic,
  FGF-independent component, because an FGFR inhibitor is already taking the FGF-driven part.'
quantitative:
- parameter: 'THE THREE KINETIC HANDLES, MEASURED - LIGAND MOVES Vmax, PHOSPHORYLATION GATES IT, ALLOSTERY
    MOVES Km'
  value: 'robinson2012: natriuretic peptides raise the MAXIMUM RATE of GC-A and GC-B MORE THAN 10-FOLD,
    positively cooperative, in the absence of ATP; ATP alone shifts substrate-velocity from cooperative to
    linear WITHOUT changing Km; ATP in the PRESENCE of peptide lowers Km, and peptide binding is REQUIRED
    to communicate the allosteric signal to the catalytic site. edmund2019: the ATP effect is located in
    the PSEUDOKINASE DOMAIN, is PHOSPHORYLATION-INDEPENDENT (survives in a Glu-substituted phosphomimetic),
    and kinase-inactivating mutations abolish the Km effect WITHOUT affecting peptide-dependent activation;
    rigidifying the PKD spines raised activity, raised NATRIURETIC PEPTIDE SENSITIVITY, or lowered Km with
    no ATP. yoder2012: KHD phosphorylation is REQUIRED for activation; GC-B-6E reaches only ~20 per cent of
    wild-type, and Ser-489 is a Km-regulating site (S489E lowers Km, S489A raises it)'
  unit: fold change in Vmax; qualitative Km direction
  conditions: robinson2012, edmund2019 and yoder2012, all abstract-level, read 2026-08-09. Purified and
    cell-expressed GC-A and GC-B; substrate-velocity kinetics.
  species: not_applicable
  source_ref: robinson2012
  uncertainty: 'THE DECOMPOSITION IS THE STRONGEST ARGUMENT AGAINST REDUNDANCY THIS ATLAS HAS, AND IT IS
    ENZYMOLOGY, NOT PHYSIOLOGY. All three papers are purified-enzyme or transfected-cell kinetics, mostly
    on GC-A, none in chondrocytes, none with a length endpoint. NOTE ALSO THAT Km HERE IS FOR GTP, THE
    SUBSTRATE - not for CNP - so the ATP/KHD handle and a ligand-affinity PAM are not the same quantity
    either, which if anything strengthens the separation. AND THE MAPPING FROM PARAMETER TO ARM IS AN
    ATLAS INFERENCE: no experiment has manipulated two of these handles simultaneously and measured the
    product.'
- parameter: 'THE PHOSPHATASE ARM GATES THE ALLOSTERIC ARM - A POTENCY-SHIFTER CANNOT RESCUE A
    DEPHOSPHORYLATED RECEPTOR'
  value: 'MCUF-42 left-shifts the CNP concentration-response 6.4-fold (EC50 3.0 nM to 0.31 nM at 5 microM
    compound) WITH NO INCREASE IN MAXIMAL cGMP. robinson2017 established that FGF-induced dephosphorylation
    of GC-B is NOT SURMOUNTABLE BY LIGAND - the same IC50 at sub-saturating and at saturating CNP. Since
    dephosphorylation removes activation competence rather than ligand potency, and MCUF-42 supplies only
    ligand potency, the two act on non-overlapping terms and the output is their PRODUCT. By contrast
    andresen2023 compound 20 raises EFFICACY and adds a further 183 per cent on the GC-A 7E phosphomimetic,
    a receptor already locked in the activated state'
  unit: fold potency shift; per cent additional cGMP
  conditions: ma2024 and andresen2023 full texts read at rounds 156-157; robinson2017 held from earlier
    rounds. The product relationship is DERIVED BY THIS ATLAS from the parameter decomposition, not
    measured.
  species: not_applicable
  source_ref: ma2024
  atlas_derived: true
  uncertainty: 'THIS IS THE CENTRAL CLAIM OF THE NODE AND IT IS AN INFERENCE FROM THREE SEPARATE PAPERS
    THAT WERE NEVER RUN TOGETHER. Nobody has applied a GC-B PAM to a dephosphorylated or phosphomimetic
    GC-B. The 183 per cent additivity is at GC-A, with a DIFFERENT compound, at a DIFFERENT site from
    MCUF-42. AND THE GATING DIRECTION HAS A PRACTICAL STING THAT CUTS BOTH WAYS: if plate receptors are
    substantially dephosphorylated by FGF tone, the PAM absolute benefit is scaled down by exactly that
    factor - which argues the PAM is worth MORE in a normal-FGFR3 subject like this one than in
    achondroplasia, the opposite of the direction every trial is powered for.'
- parameter: 'EXOGENOUS CNP AGONISM SUPPRESSES ENDOGENOUS CNP PRODUCTION - A HOMEOSTATIC CAP ON EVERY ARM'
  value: 'prickett2021, 28 achondroplasia children, 5 years of vosoritide. Plasma NTproCNP SDS was RAISED
    before treatment and fell significantly within the first 3 months of accelerating growth. A DIRECT 4-h
    post-injection suppression emerged with duration of therapy: no significant fall at days 29, 43 or 127;
    then MINUS 5.0 +/- 1.6 pmol/L at day 183 (P = 0.003), MINUS 4.3 +/- 1.4 at day 365 (P = 0.006), MINUS
    4.2 +/- 1.5 at day 730 (P = 0.015), against pre-injection values near 40 pmol/L. The magnitude of the
    4-h fall was proportional to pre-injection NTproCNP SDS. kanakatti2026 replicates the decline in
    hypochondroplasia: NTproCNP SDS significantly lower at 6 and 12 months on vosoritide'
  unit: pmol/L change in plasma NTproCNP
  conditions: prickett2021 FULL TEXT READ 2026-08-09 (PMC8688426); kanakatti2026 abstract read.
  species: human
  source_ref: prickett2021
  uncertainty: 'UNIT DISCIPLINE FIRST: THESE ARE NTproCNP, THE BIO-INACTIVE AMINOTERMINAL FRAGMENT used as
    a production marker, NOT bioactive CNP. No bioactive CNP concentration is carried from this paper, and
    a fall in the production marker is not the same quantity as a fall in receptor-available ligand.
    SECOND, EVERY SUBJECT IS CNP-RESISTANT with raised baseline NTproCNP, and the suppression scaled with
    that resistance - so the feedback posture of a NON-RESISTANT subject, which is this case, is not
    established and could be larger or smaller. THIRD, the absolute falls are 10 to 12 per cent of
    baseline, which is a real but not dominant effect. What makes it matter is not its size but WHO IT
    HITS: an agent with no intrinsic activity that multiplies endogenous ligand is uniquely exposed to a
    loop that lowers endogenous ligand.'
- parameter: 'THE THREE RIVAL COMPOUNDS CHECKED, AND WHY NONE DISPLACES EITHER ARM'
  value: 'BMN 333 - BioMarin long-acting CNP, reported to raise free-CNP exposure MORE THAN 13-FOLD versus
    another long-acting CNP agent and to support WEEKLY dosing, now in head-to-head Phase 2/3 against
    vosoritide (NCT07441876). It is CONTROL POINT A. KK8398 - the Kyowa Kirin development code for
    INFIGRATINIB (NCT06926491, Phase 3 in achondroplasia); the FGFR arm this atlas already holds, not a new
    mechanism. ACTIVATING ANTIBODIES - liu2026 shows XX16 stabilises GC-A in an active conformation WITHOUT
    ANP and lowers blood pressure in obesity-induced hypertensive mice, and REGN5308 does so ANP-dependently;
    but an IgG is about 150 kDa against the farnum2006 partition curve, which is UNDETECTABLE ALREADY AT
    40 kDa'
  unit: qualitative - control point assignment; kDa
  conditions: BMN 333 from BioMarin ENDO 2026 disclosures and NCT07441876; KK8398 identity from the
    NCT06926491 record retrieved by this atlas 2026-08-09; liu2026 abstract read.
  species: not_applicable
  source_ref: liu2026
  atlas_derived: true
  uncertainty: 'THE ANTIBODY EXCLUSION IS ON SIZE ALONE AND IS THEREFORE AS STRONG OR AS WEAK AS THE
    farnum2006 CURVE, which was measured with inert tracers rather than antibodies and says nothing about
    transport routes a targeted biologic might exploit. It is a hard exclusion for PASSIVE partition into
    the matrix and should not be stated more broadly than that. THE BMN 333 FIGURES ARE FROM COMPANY
    DISCLOSURES, not peer-reviewed primary literature, and the comparator in the more-than-13-fold claim is
    not named here. INFIGRATINIB IS NOT DISMISSED - it is simply already in the stack on a different arm.'
- parameter: 'WHETHER A GC-B PAM POTENTIATES VOSORITIDE - RESOLVED BY INFERENCE TO PROBABLY YES, STILL
    NOT MEASURED'
  value: 'VOSORITIDE IS Pro-Gly APPENDED TO THE 37 C-TERMINAL RESIDUES OF HUMAN CNP-53, 39 residues total,
    cyclic 23-39 disulfide - so IT RETAINS THE INTACT CNP-22 RECEPTOR-BINDING RING UNCHANGED and differs
    from native CNP only by an N-terminal extension conferring protease resistance. MCUF-42 acts on the
    EXTRACELLULAR DOMAIN by accelerating ligand association 2.6-fold, and the ring is the pharmacophore
    that engages that domain. INDEPENDENTLY, PAMs in this receptor family are NOT LIGAND-SPECIFIC:
    sangaralingham2021 MCUF-651 potentiates BOTH ANP AND BNP at GC-A and potentiates endogenous ANP and
    BNP from the plasma of normal subjects and of patients ex vivo, and andresen2023 compounds enhance
    both ANP and BNP'
  unit: qualitative - structural and cross-ligand inference
  conditions: Vosoritide composition from the BMN 111 literature and regulatory descriptions, checked
    2026-08-09; MCUF-42 mechanism from ma2024 full text; cross-ligand behaviour from sangaralingham2021
    and andresen2023.
  species: not_applicable
  source_ref: sangaralingham2021
  atlas_derived: true
  uncertainty: 'STILL AN INFERENCE, AND TWO THINGS COULD BREAK IT. FIRST, the 17-residue N-terminal
    extension is exactly the part of vosoritide that native CNP does not have, and a PAM binding near the
    ligand-binding cleft could be sterically obstructed by it - nobody has looked. SECOND, the cross-ligand
    evidence is from GC-A with a DIFFERENT compound series; ANP and BNP are both natural ligands sharing
    the ring motif, which is a weaker test than a synthetic analogue with an engineered extension. THE
    EXPERIMENT REMAINS ONE PLATE and is still the right thing to run, but the atlas should no longer carry
    this as unknown - the prior is now clearly on the yes side, and the gap is downgraded from decisive to
    confirmatory.'
localization:
- 'all three control points act on NPR2 in growth-plate chondrocytes; the ligand and PAM sites are
  extracellular, the phosphorylation and KHD-allosteric sites are intracellular'
human_evidence: indirect
human_evidence_note: 'The kinetic decomposition is enzymology. The feedback finding is HUMAN - 28 children
  over 5 years, replicated in a second disorder - but measures a production marker rather than a growth
  outcome. The human anchor for the target remains jeong2026 (NPR2 activity score against standing height,
  R squared 0.438, P = 5.8e-10).'
species_basis:
- human
- not_applicable
translation_risk: high
translation_risk_reason: 'The multiplicativity of the two arms is derived from three papers that were never
  run together, and no experiment anywhere has combined a GC-B PAM with anything.'
confidence: C
claim_grades:
- claim: The ligand arm, the phosphatase arm and the allosteric arm are non-redundant because they move
    different kinetic parameters of the same enzyme.
  grade: C
  basis: 'robinson2012 shows peptide moves Vmax and allostery moves Km; edmund2019 shows the KHD allosteric
    effect is phosphorylation-INDEPENDENT and does not affect peptide-dependent activation; yoder2012 shows
    phosphorylation gates activation itself. Three independent handles from three primary papers. Graded C
    not B because all of it is purified-enzyme and transfected-cell kinetics, largely at GC-A, and no
    experiment has manipulated two handles at once and measured the product.'
- claim: The phosphatase arm gates the allosteric arm, so the two are synergistic rather than additive.
  grade: E
  basis: 'DERIVED HERE, NOT MEASURED. It follows from MCUF-42 being a pure potency-shifter with no Emax
    change and from robinson2017 showing dephosphorylation is not surmountable by ligand - a potency
    shifter cannot recover what dephosphorylation removes. Nobody has applied a GC-B PAM to a
    dephosphorylated or phosphomimetic receptor. The one additivity experiment that exists (+183 per cent
    on GC-A 7E) used a different compound at a different site on a different receptor.'
- claim: Exogenous CNP agonism suppresses endogenous CNP production.
  grade: B
  basis: 'prickett2021, 28 humans, 5 years, with a dose- and duration-dependent 4-h post-injection fall
    reaching P = 0.003, and the magnitude scaling with baseline resistance; replicated in a second disorder
    by kanakatti2026. Not A because the readout is NTproCNP, a bio-inactive production marker rather than
    receptor-available ligand, and every subject was CNP-resistant at baseline.'
- claim: A GC-B PAM would potentiate vosoritide, not only native CNP.
  grade: D
  basis: 'INFERRED, NOT MEASURED, but the prior is now clearly favourable. Vosoritide retains the intact
    CNP-22 disulfide ring - it is Pro-Gly plus the 37 C-terminal residues of CNP-53 - and the ring is the
    pharmacophore engaging the extracellular domain where MCUF-42 acts. And PAMs in this family are not
    ligand-specific: MCUF-651 potentiates ANP, BNP and endogenous plasma pools at GC-A. Against it: the
    N-terminal extension is precisely what native CNP lacks and could obstruct a cleft-adjacent PAM, and
    the cross-ligand evidence is from the sister receptor with a different series.'
- claim: A GC-B PAM should be paired with a CNP analogue rather than replace it.
  grade: D
  basis: 'A PAM has no intrinsic activity - MCUF-42 makes no cGMP without CNP - so it multiplies whatever
    ligand is present, and prickett2021 shows the endogenous pool is actively suppressed as pathway output
    rises. An exogenous analogue is not under that feedback control. The logic is sound and the components
    are measured, but the pairing has never been tested and the decisive question - whether MCUF-42
    potentiates vosoritide at all - is unanswered.'
- claim: Another compound should displace either arm.
  grade: X
  basis: 'NO, on four checks. BMN 333 is a better control point A, not a third arm. KK8398 is infigratinib
    under a development code and is already in the stack on the FGFR arm. Antibody allosteric activators
    of this receptor family are real and work in vivo but an IgG at about 150 kDa is excluded by the
    farnum2006 partition curve, which is undetectable by 40 kDa. Downstream cGMP is dead twice over.'
- claim: Both arms should be kept.
  grade: C
  basis: 'KEEP BOTH CONTROL POINTS - no test applied here makes them redundant, and the gating relationship
    makes each raise the other value. BUT THE TWO ARE NOT IN THE SAME STATE OF READINESS: the allosteric
    arm has a purchasable compound and a structurally mapped target; the phosphatase arm has the strongest
    genetic proof on the axis and no compound, no identified enzyme, and SD-008 barring any plan that waits
    for one. Its incremental value in a stack that already contains an FGFR inhibitor is bounded by the
    1.42-fold tonic component.'
