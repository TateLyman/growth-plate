id: round224_the_bone_ages_found_and_the_confound_that_may_explain_them
name: ROUND 224 - the bone ages are found and the FGFR arm appears NOT to spend them, but all three children
  were sex-steroid deficient and sex steroids are what drive skeletal maturation, so the observation may be
  a property of the patients - which is exactly the state anastrozole is in this stack to reproduce; and the
  human dose-response curve turns out to be unidentifiable because its lower anchor splices two patients
type: hypothesis
layer: L12
aliases:
- the bone ages found
- physeal widening without bone maturation
- the sex steroid confound
- the human curve is unidentifiable
- round 224
stub: false
summary: 'THE TASK WAS TO FIND THE BONE AGES FOR THE FGFR ARM. THEY EXIST, THEY ARE QUALITATIVE, AND THEY SAY
  SOMETHING IMPORTANT - AND THEN A CONFOUND APPEARS THAT MAY EXPLAIN THE WHOLE OBSERVATION.

  WHAT WAS FOUND. raimann2024 - Horm Res Paediatr 2024;98(6):753-757 - reports serial WRIST IMAGING in two
  children on erdafitinib and states it in one line: ATYPICAL PHYSEAL WIDENING WITHOUT APPARENT PROGRESSION
  OF BONE MATURATION, with PROFOUND METAPHYSEAL SCLEROSIS appearing at treatment onset and NORMALIZATION OF
  BONE MINERALIZATION AFTER TREATMENT HALT. And erdachild2024 records a bone age of 14.0 at a chronological
  age of 16.2, more than two standard deviations below the mean, WITH NO BASELINE BONE AGE.

  SO THE FGFR ARM GREW THESE CHILDREN FAST WITHOUT VISIBLY ADVANCING SKELETAL MATURATION. Set against the
  COACH combination, which round 223 computed at 1.33 and 1.57 BONE-AGE YEARS PER CALENDAR YEAR from the
  paper''s own ratios, THAT IS THE CONTRAST THIS CASE MOST NEEDED - one arm appears to buy height without
  spending the clock and the other measurably spends it.

  AND THEN THE CONFOUND, WHICH IS THE REAL FINDING OF THIS ROUND. ALL THREE CHILDREN WERE SEX-STEROID
  DEFICIENT. raimann2024 patient 1 - male, 13.8 years, HYPOGONADOTROPIC HYPOGONADISM with UNDETECTABLE LH,
  FSH AND TESTOSTERONE, testicular volume 6 mL, and the authors state there was NO EVIDENCE FOR PUBERTAL
  PROGRESSION. Patient 2 - female, 10.9 years, PREPUBERTAL TANNER STAGE 1 with OESTRADIOL BELOW 5 pg/mL.
  erdachild2024 - a PRE-PUBESCENT boy with PRE-PUBERTAL testosterone. SEX STEROIDS ARE THE PRINCIPAL DRIVER
  OF SKELETAL MATURATION AND EPIPHYSEAL FUSION, and this atlas holds that as a core claim. THREE CHILDREN
  WITH NO SEX STEROIDS DID NOT ADVANCE THEIR BONE AGE. THAT MAY BE A PROPERTY OF THE PATIENTS RATHER THAN OF
  THE DRUG, and nothing in these reports separates the two.

  AND THE STACK ALREADY CONTAINS THE AGENT THAT REPRODUCES THAT STATE. Anastrozole is in this stack, and its
  role has been understood as buying time by slowing fusion. THE ERDAFITINIB OBSERVATIONS SUGGEST A DIFFERENT
  AND STRONGER READING - that a sex-steroid-poor background may be the CONDITION UNDER WHICH the FGFR arm
  produces growth without maturation, rather than an independent lever added alongside it. If that holds,
  aromatase inhibition is not a parallel arm but a PREREQUISITE, and the two must be dosed together or not at
  all. THAT IS A HYPOTHESIS GENERATED BY A COINCIDENCE OF THREE CASES AND IT IS GRADED E, but it is the first
  mechanistic reason this atlas has had for why the anastrozole arm and the FGFR arm belong in the same
  regimen rather than merely in the same list.

  THE COUNTER-READING MUST BE STATED BECAUSE IT IS EQUALLY LIVE. Physeal WIDENING with metaphyseal SCLEROSIS
  that REVERSES ON STOPPING is also what a growth plate looks like when mineralisation and vascular invasion
  at the chondro-osseous junction are inhibited - the plate accumulates because it is not being resorbed.
  ON THAT READING THE ABSENT BONE-AGE PROGRESSION IS NOT PRESERVED RESERVE BUT ARRESTED REMODELLING, and the
  height is being taken from a plate that is backing up rather than one that is being spared. The two
  readings predict opposite things about what happens on withdrawal, and raimann2024''s observation that
  mineralisation NORMALISED AFTER THE TREATMENT HALT is weak evidence for the second.

  WHAT THIS DOES TO THE CURVE, AND IT IS WORSE THAN CORR-214 ALREADY SAID. Round 217 fitted a human power law
  through two points. THE LOWER ANCHOR SPLICES TWO DIFFERENT PATIENTS. It is recorded as erdaseries2025
  PATIENT 1 AT 3 mg giving about 10 cm/year - but the paper gives 3 mg/day as PATIENT 1''s dose after
  reduction from 5 mg, and gives 10 cm/year as PATIENT 2''s velocity, and PATIENT 2''s DOSE IS NOT STATED
  ANYWHERE IN THE PAPER while PATIENT 1''s VELOCITY IS NOT QUANTIFIED IN THE TEXT. The dose and the velocity
  come from different children. AND THE UPPER ANCHOR WAS ALREADY FLAGGED BY THIS ATLAS - erdafitinib.yaml
  and CORR-062 record that erdachild2024 ran 7 mg for five months WITH FREQUENT INTERRUPTIONS for
  hyperphosphataemia and then 5 mg, so the 14.3 cm cannot be assigned to 7 mg. WITH ONE ANCHOR SPLICED AND
  THE OTHER TIME-AVERAGED OVER AN UNKNOWN EXPOSURE, A TWO-PARAMETER POWER LAW CANNOT BE IDENTIFIED AT ALL.
  CORR-214 said the human exponent was an artefact of a Hill assumption. It is worse than that: THERE ARE NOT
  TWO USABLE HUMAN POINTS. Only the mouse fit in dose units survives from rounds 217 and 218.

  AND ROUND 223 OVERCLAIMED, ONE ROUND AGO, AGAINST A PAPER THIS ATLAS ALREADY HELD. Round 223 graded X the
  claim that any growth plate has been measured in a human with normal FGFR3 under these drugs, and wrote
  that none exists. raimann2024 HAS SERIAL WRIST IMAGING OF THE PHYSIS in exactly that population, showing
  widening, metaphyseal sclerosis, and reversal on withdrawal. It is radiographic and qualitative rather than
  histological and quantitative, so the SPIRIT of the gap survives - nobody has measured a zone height or a
  cell - but the claim as written is false. FIFTH INSTANCE OF THE OWN-FILES FAILURE MODE, and the shortest
  interval yet between the atlas holding a source and my asserting its absence.

  ONE VERIFICATION THAT CAME BACK NEGATIVE, WHICH IS WHY IT WAS FLAGGED. Round 223 recorded, from a secondary
  summary and marked unverified, that low-dose infigratinib enlarged the hypertrophic zone WHILE REDUCING
  hypertrophic cell number - which would have been an h_term gain bought with fewer cells, the best possible
  term assignment. demuynck2024, read directly, says the opposite of the second half: quantitative
  measurement of the HYPERTROPHY AREA showed A SIGNIFICANT SWELLING OF HYPERTROPHIC CELLS at 0.5 mg/kg/day
  and 1 mg/kg every three days. THE CELLS GOT BIGGER AND NOTHING WAS SAID ABOUT THEIR NUMBER. It is also an
  AREA in square millimetres, which CORR-190 forbids reading as a length. The h_term direction is right and
  the decomposition is still absent.

  AND THE SAME PAPER CARRIES THE LARGEST AXIAL NUMBER IN THE FGFR FILE. L4-L6 lumbar segment length rose 18.4
  per cent at infigratinib 0.5 mg/kg/day, against 4.5 per cent at 0.2 mg/kg/day and 6.4 per cent with 1 mg/kg
  every three days, with intervertebral disc area and outer annulus fibrosus area also improved at 0.5
  mg/kg/day. DAILY BEAT INTERMITTENT ON THE AXIAL SEGMENT THREEFOLD - though the daily arm also received more
  total drug per week, so this is not a clean schedule comparison the way breinholt2019''s was.'
quantitative:
- parameter: bone maturation under erdafitinib in children
  value: 'raimann2024 - serial WRIST IMAGING in two children showed ATYPICAL PHYSEAL WIDENING WITHOUT
    APPARENT PROGRESSION OF BONE MATURATION, with profound metaphyseal sclerosis at treatment onset and
    normalisation of bone mineralisation after the treatment halt. erdachild2024 - bone age 14.0 at
    chronological age 16.2, more than two standard deviations below the mean, WITH NO BASELINE BONE AGE.
    Against these, the COACH growth hormone combination advances 1.33 to 1.57 bone-age years per calendar
    year'
  unit: qualitative bone maturation progression, and one single-timepoint bone age
  conditions: three children, all with CNS tumours, all heavily pretreated, all sex-steroid deficient
  species: human
  source_ref: erdaseries2025
  uncertainty: 'NO NUMERIC BONE AGE SERIES EXISTS FOR ANY CHILD ON THIS DRUG. raimann2024 gives a qualitative
    radiological impression - WITHOUT APPARENT PROGRESSION - and no Greulich-Pyle or Tanner-Whitehouse
    readings; erdachild2024 gives one value with no baseline, so no rate can be computed from it. n = 3
    across two reports. AND THE OBSERVATION IS CONFOUNDED AT ITS ROOT by the sex-steroid status of all three
    patients'
- parameter: the sex-steroid status of every child in whom the FGFR arm was observed
  value: 'raimann2024 patient 1 - male 13.8 years, HYPOGONADOTROPIC HYPOGONADISM with undetectable LH, FSH
    and testosterone, testicular volume 6 mL, no evidence for pubertal progression, and additionally
    GH-deficient on replacement with IGF-1 falling 297 to 187 ng/mL during treatment. Patient 2 - female 10.9
    years, PREPUBERTAL Tanner stage 1, oestradiol below 5 pg/mL, IGF-1 at minus 3.8 and minus 3.5 SDS.
    erdachild2024 - PRE-PUBESCENT boy with pre-pubertal GH, IGF-I, IGFBP-3 and testosterone'
  unit: pubertal stage and sex steroid concentrations
  conditions: the complete set of children in whom erdafitinib-associated growth acceleration has been
    reported
  species: human
  source_ref: erdaseries2025
  uncertainty: 'THIS IS THE CONFOUND AND IT IS TOTAL - there is no erdafitinib growth observation in a child
    with normal gonadal function anywhere in the literature this atlas has located. Sex steroids are the
    principal driver of skeletal maturation, so absent bone-age progression in sex-steroid-deficient children
    is exactly what would be expected WITHOUT any drug effect on maturation. Nothing in these three cases
    separates a drug property from a patient property'
- parameter: the human dose-response curve cannot be identified from two points
  value: 'round 217 fitted the human exponent through erdaseries2025 PATIENT 1 AT 3 mg giving about 10
    cm/year and erdachild2024 AT 7 mg giving 19.06 cm/year. THE LOWER ANCHOR SPLICES TWO PATIENTS - 3 mg/day
    is patient 1''s dose after reduction from 5 mg, 10 cm/year is PATIENT 2''s velocity, patient 2''s dose is
    NOT STATED and patient 1''s velocity is NOT QUANTIFIED. THE UPPER ANCHOR is 7 mg for five months WITH
    FREQUENT INTERRUPTIONS for hyperphosphataemia then 5 mg, which erdafitinib.yaml and CORR-062 already
    record as unassignable'
  unit: dose in mg/day against velocity in cm/year
  conditions: verified against the raimann2024 full text, which states each quantity separately by patient
  species: human
  source_ref: erdaseries2025
  uncertainty: 'THIS IS A DEFECT AT THE FOUNDATION OF ROUNDS 216 TO 218 AND IT COMPOUNDS CORR-214 RATHER THAN
    REPLACING IT. CORR-214 established the fitted exponent was an artefact of an assumed Hill slope; this
    establishes there were never two usable points to fit. What survives is the MOUSE fit in dose units,
    which needs no human anchor'
- parameter: low-dose infigratinib in the achondroplasia mouse - the hypertrophic cell and the lumbar segment
  value: quantitative measurement of the HYPERTROPHY AREA of the growth plate in square millimetres showed a
    significant SWELLING OF HYPERTROPHIC CELLS exclusively at 0.5 mg/kg/day and 1 mg/kg every 3 days, with
    enlargement of the secondary ossification centre and a larger type X collagen positive area. L4-L6 lumbar
    segment length rose 18.4 per cent at 0.5 mg/kg/day, 4.5 per cent at 0.2 mg/kg/day and 6.4 per cent with 1
    mg/kg every 3 days; intervertebral disc area and outer annulus fibrosus area improved at 0.5 mg/kg/day
  unit: per cent increase in segment length, and hypertrophy area in mm2
  conditions: demuynck2024, Fgfr3Y367C/+ mice, n = 10 to 11 per group
  species: mouse
  source_ref: demuynck2024
  uncertainty: 'THE CELL MEASURE IS AN AREA IN SQUARE MILLIMETRES AND CORR-190 FORBIDS READING IT AS A
    LENGTH, and cells per column is not reported, so the Hunziker decomposition is still not closed for this
    arm. Round 223 recorded from a secondary summary that the paper showed FEWER hypertrophic cells; reading
    it directly, cell NUMBER IS NOT REPORTED AT ALL and the finding is swelling. The daily arm also received
    more total weekly drug than the intermittent arm, so the axial comparison is not a clean schedule test'
localization:
- 'the distal radius and ulna physis, where widening appeared without maturation on serial wrist films'
- 'the metaphysis, where sclerosis appeared at treatment onset and normalised after withdrawal'
- 'the hypothalamic-pituitary-gonadal axis, absent in all three children and the confound of the whole
  observation'
human_evidence: direct
human_evidence_note: 'Three children across two reports, all with CNS tumours, all heavily pretreated, all
  sex-steroid deficient. The imaging is radiographic and qualitative; no zone height or cell dimension has
  been measured in any of them.'
