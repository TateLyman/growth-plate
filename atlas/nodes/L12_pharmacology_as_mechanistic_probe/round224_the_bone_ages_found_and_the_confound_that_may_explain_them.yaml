translation_risk: high
translation_risk_reason: 'The bone-age observation comes from three sex-steroid-deficient children with brain
  tumours, and the property being attributed to the drug is one their endocrine state predicts on its own.'
confidence: C
claim_grades:
- claim: the FGFR arm produces growth without advancing bone age
  grade: E
  basis: 'REPORTED AND CONFOUNDED. raimann2024 states physeal widening WITHOUT APPARENT PROGRESSION OF BONE
    MATURATION on serial wrist imaging in two children, and erdachild2024 gives a bone age 2.2 years delayed
    at chronological age 16.2 with no baseline. But ALL THREE CHILDREN WERE SEX-STEROID DEFICIENT, and sex
    steroids are the principal driver of skeletal maturation, so the observation is exactly what their
    endocrine state predicts without any drug effect'
- claim: a sex-steroid-poor background is a PREREQUISITE for the FGFR arm to grow without maturing rather
    than an independent lever
  grade: E
  basis: THE HYPOTHESIS THIS ROUND GENERATES AND CANNOT TEST. Every erdafitinib growth observation on record
    occurred in a child with absent sex steroids, and this stack already contains anastrozole. If the
    coincidence is causal, aromatase inhibition and FGFR inhibition must be dosed together; if it is
    selection, they are independent. Three cases, no controls, no alternative background exists to compare
- claim: physeal widening without bone-age progression means the reserve is being preserved
  grade: E
  basis: 'ONE OF TWO LIVE READINGS. The other is that widening with metaphyseal sclerosis reversing on
    withdrawal is what a plate looks like when mineralisation and vascular invasion at the chondro-osseous
    junction are INHIBITED - accumulation rather than sparing. raimann2024''s normalisation of mineralisation
    after the halt is weak evidence for the second reading. The two predict opposite withdrawal behaviour'
- claim: the human erdafitinib dose-response curve has two usable points
  grade: X
  basis: 'FALSE. The lower anchor pairs patient 1''s 3 mg dose with patient 2''s 10 cm/year; patient 2''s
    dose is not stated and patient 1''s velocity is not quantified. The upper anchor is 7 mg with frequent
    interruptions then 5 mg, already unassignable under CORR-062. A two-parameter power law cannot be
    identified from one usable point'
- claim: any growth plate has been observed in a human with normal FGFR3 under an FGFR inhibitor
  grade: C
  basis: 'TRUE, AND ROUND 223 GRADED IT X ONE ROUND AGO AGAINST A PAPER THIS ATLAS ALREADY HELD. raimann2024
    has serial wrist radiographs showing physeal widening, metaphyseal sclerosis and reversal on withdrawal.
    Radiographic and qualitative, not histological - no zone height and no cell dimension - so the
    quantitative gap survives and the absolute claim does not'
- claim: low-dose infigratinib enlarges the hypertrophic zone while reducing hypertrophic cell number
  grade: X
  basis: FALSE AS TO THE SECOND HALF. demuynck2024 reports a significant SWELLING of hypertrophic cells and
    does not report cell number at all. Round 223 took this from a secondary summary and flagged it
    unverified, which is why it never entered a claim
