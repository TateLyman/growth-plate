human_evidence: direct
human_evidence_note: Human paediatric observations exist for BOTH the growth acceleration and the skeletal
  toxicity, but the efficacy signal is a retrospective case series in children with tumours and severe
  pre-existing growth impairment, and the toxicity signal is a case report plus FDA postmarketing reports.
  There is no controlled human growth study of this drug.
