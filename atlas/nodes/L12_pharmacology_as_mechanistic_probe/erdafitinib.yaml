summary: 'Erdafitinib is an oral ATP-competitive inhibitor of FGFR1, 2, 3 and 4, licensed in adults for
  FGFR-altered urothelial carcinoma. It is in this atlas because it is the ONLY compound that has been
  observed to accelerate human linear growth through FGFR inhibition, and because the same observation
  carries the class''s growth-plate toxicity.

  HUMAN GROWTH ACCELERATION. In paediatric CNS-tumour patients on compassionate-use erdafitinib, linear
  growth accelerated unexpectedly, and it did so INDEPENDENTLY of sex steroids and IGF-1 - remarkable
  because these were heavily pretreated neuro-oncology patients with severe pre-existing growth impairment.
  The acceleration was accompanied by a distinct WIDENING OF THE GROWTH PLATE and enhanced metaphyseal
  mineralization shortly after starting therapy (erdaseries2025, retrospective case series). This is the
  human counterpart of the achondroplasia FGFR3-inhibition logic, arriving from oncology rather than from
  a growth programme.

  THE SAME MECHANISM IS THE TOXICITY. A 13-year-old on erdafitinib for an FGFR1-KD-ITD optic pathway glioma
  developed SLIPPED CAPITAL FEMORAL EPIPHYSIS at 12 weeks, requiring surgical pinning (brizini2024). SCFE
  displaces through the hypertrophic zone, which is the mechanically weakest layer of the plate, so a
  widened hypertrophic zone is a weakened one. The FDA has since published postmarketing cases of erdafitinib-associated
  skeletal growth toxicity in paediatric patients (nadeaunguyen2026). The atlas cannot currently quantify that
  risk because the direction of the zonal stiffness gradient is an unresolved contradiction (g_l5matrix_008).

  THE HIDDEN MECHANISM IS PHOSPHATE. FGFR1 with alpha-Klotho is the renal FGF23 receptor, so pan-FGFR
  inhibition blocks FGF23 signalling and raises serum phosphate. Hyperphosphataemia is the class''s commonest
  on-target effect, is used clinically as a pharmacodynamic marker for dose titration, and at the extreme
  causes calcinosis cutis and calciphylaxis (ghimire2025, 10 reviewed cases across the class). Phosphate
  is not a bystander in the growth plate: hypertrophic chondrocyte apoptosis and the mineralisation front
  are phosphate-dependent (sabbagh2005). So the drug simultaneously removes the FGFR3 brake AND raises
  the substrate for terminal mineralisation, which is consistent with the ''enhanced metaphyseal mineralization''
  erdaseries2025 observed - and the atlas has no edge for that second arm.

  PHARMACOKINETICS THAT CHANGE THE ANSWER. Metabolised mainly by CYP2C9 and CYP3A4; a dual inducer (carbamazepine)
  cuts free AUC by 48-55% and free Cmax by 22% (jaiprasart2024) - relevant because anticonvulsants are
  common in the neuro-oncology population in which the growth acceleration was seen. tmax ~3 h; mild-to-moderate
  hepatic impairment does not require dose adjustment (zhu2026). CYP2C9 is polymorphic, so exposure varies
  with genotype, and no growth-plate exposure has ever been measured for this or any other growth-modifying
  drug (g_l12b_002).

  SELECTIVITY IS THE UNRESOLVED PROBLEM. Erdafitinib inhibits all four FGFRs. P8-01 re-analysis found
  FGFR1, FGFR2, FGFR3 and FGFR4 all present in human growth plate, so nothing about this drug is FGFR3-selective
  in the tissue that matters, and the atlas cannot separate which receptor carries either the growth acceleration
  or the SCFE.'
