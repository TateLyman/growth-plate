provenance_note: 'Created 2026-08-06 in response to a compound-simulation query that found erdafitinib
  absent from the atlas entirely. The absence was a real coverage gap: this is the only compound with
  a HUMAN observation of FGFR-inhibition-driven growth acceleration.'
translation_risk_reason: All evidence is human, so species translation is not the risk. The risks are
  that the growth signal comes from an uncontrolled series in children with severe pre-existing growth
  impairment, where catch-up growth is an unexcluded confounder, and that the drug is pan-FGFR in a tissue
  expressing all four receptors.
