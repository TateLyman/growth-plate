claim_grades:
- claim: Erdafitinib accelerates linear growth in children, independently of sex steroids and IGF-1.
  grade: D
  basis: One retrospective case series in paediatric neuro-oncology patients (erdaseries2025). No control
    group, severe pre-existing growth impairment means regression to the mean and catch-up growth are
    not excluded.
- claim: FGFR inhibition widens the growth plate in humans.
  grade: D
  basis: Radiographic observation in the same series (erdaseries2025). Consistent with the mouse FGFR3-loss
    phenotype but human-observed only once.
- claim: Pan-FGFR TKIs cause skeletal growth toxicity in children, including SCFE.
  grade: C
  basis: One detailed case with imaging and surgical confirmation (brizini2024) plus an FDA postmarketing
    case series (nadeaunguyen2026) - independent routes, same signal.
- claim: Hyperphosphataemia is an on-target class effect that can reach calcinosis cutis.
  grade: B
  basis: Consistent across the FGFR-inhibitor class with 10 reviewed cases and a mechanistic explanation
    through renal FGF23/FGFR1-Klotho (ghimire2025).
