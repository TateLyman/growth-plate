- parameter: DOES A LOW IGF-1 CHANGE THE CASE FOR ADDING GH? — THE PATIENT-LEVEL TABLE ANSWERS IT DIRECTLY
  value: 'erdaseries2025 Table 1, and it contains both arms of the question. PATIENT 2, NOT ON GH AND
    PROFOUNDLY IGF-1 DEFICIENT: IGF-1 20 ng/mL at -3.7 SDS pre-treatment and 21 ng/mL at -3.8 SDS on
    treatment, Tanner 1 throughout with estradiol below detection, no BMI increase - AND GROWTH VELOCITY
    10 cm/YEAR ON ERDAFITINIB. PATIENT 1, ON GH AT A STABLE DOSE THROUGHOUT (16, 14, 15 microg/kg/d):
    IGF-1 FELL from 297 to 226 to 187 ng/mL, SDS -0.04 to -0.9 to -1.4, WHILE GROWING; after both drugs
    stopped, IGF-1 50 ng/mL at -3.8 SDS. Serum phosphate was above range at every erdafitinib timepoint in
    patient 1 (2.47, 1.88, 2.01 against 1.28-1.82). The authors state it plainly: the first cases of a
    pharmacologic induction of linear growth INDEPENDENT OF ENDOGENOUS OR EXOGENOUS GH, IGF-I, OR SEX
    STEROIDS.'
  unit: ng/mL and SDS for IGF-1; cm/year for velocity; microg/kg/d for GH
  conditions: erdaseries2025, two paediatric CNS-tumour patients on compassionate-use erdafitinib,
    retrospective; patient 1 on rhGH throughout the first 6 months, patient 2 never on GH
  species: human
  source_ref: erdaseries2025
  uncertainty: 'THIS IS THE DIRECT ANSWER TO WHETHER A LOW IGF-1 ARGUES FOR ADDING GH TO ERDAFITINIB, AND
    FOR HEIGHT THE ANSWER IS NO. A prepubertal child at IGF-1 -3.7 SDS, on no GH, grew 10 cm/year. The
    FGFR3 lever does not run through IGF-1 and does not need it, so a low IGF-1 is neither a reason
    erdafitinib will underperform nor a deficiency that must be corrected before it works. BUT THE
    QUESTION SPLITS AND THIS ATLAS HAD BEEN FLATTENING IT. Rounds 46 and 47 argued GH is REDUNDANT with
    FGFR3 blockade, and every experiment behind that argument - sawamura2025 above all - ADDED GH TO AN
    INTACT AXIS. That is a supraphysiological-addition question. REPLACING GH in a genuinely deficient
    child is a different question that none of the cited evidence addresses, and in that child GH''s
    JAK/STAT5 and TGF-beta arms (chu2026) are at ZERO rather than redundant. These are post-cranial-
    irradiation oncology patients, where GH deficiency carries body-composition, bone-mineral and
    metabolic costs INDEPENDENT OF STATURE - so stopping GH because it adds no centimetres would be the
    wrong inference from a height-only analysis. THE HONEST POSITION: treat documented GH deficiency on
    its own indication, do not add GH expecting height on top of erdafitinib, and watch the slip risk,
    because nadeaunguyen2026 lists concomitant growth hormone as a confounder in one of its five SCFE
    cases and SCFE is a known rare adverse effect of GH alone - two independent risk factors stacked in a
    child already growing fast. AND ONE MONITORING POINT FALLS OUT OF PATIENT 1: IGF-1 FELL BY 1.4 SDS ON
    AN UNCHANGED GH DOSE. n = 1 and confounded by progressive illness, but it means a falling IGF-1 under
    erdafitinib on stable GH is a finding to investigate, not noise - and it is the opposite of what the
    hypothesis in the next row predicted.'
- parameter: A HYPOTHESIS GENERATED AND KILLED IN THE SAME ROUND — FGFR1 BLOCKADE DOES NOT RELIEVE GH RESISTANCE HERE
  value: 'THE HYPOTHESIS: FGF21 signals through FGFR1 plus beta-Klotho and causes GH RESISTANCE at the
    chondrocyte - guasti2014, in HUMAN paediatric primary chondrocytes, found FGF21 upregulates SOCS2,
    inhibits GH-induced STAT5 phosphorylation, and inhibits GH-induced COLII, ALP, IGF-1 expression and
    proliferation, WHILE NOT AFFECTING IGF-1-INDUCED proliferation; and in human very preterm infants
    FGF21 level was negatively associated with change in length SDS (beta -0.415, P < .005). Erdafitinib
    engages FGFR1 HARDER than FGFR3 (1.20 vs 3.00 nM). So the FGFR1-first ordering this atlas has treated
    as erdafitinib''s defining defect should BLOCK FGF21-driven GH resistance, at doses BELOW those
    engaging FGFR3 - predicting synergy with GH in exactly the chronically ill, high-FGF21, low-IGF-1
    population where the growth was observed. THE PREDICTION IS THAT IGF-1 SHOULD RISE ON ERDAFITINIB. IT
    DID NOT. Patient 2: 20 to 21 ng/mL. Patient 1, on stable GH: 297 to 187, FALLING.'
  unit: not_applicable
  conditions: hypothesis constructed by this atlas from guasti2014 and the ChEMBL selectivity ordering,
    then tested against the only human data that bears on it, erdaseries2025 Table 1 (n = 2)
  species: human
  source_ref: guasti2014
  uncertainty: 'RECORDED BECAUSE A HYPOTHESIS THAT WAS BUILT AND THEN REFUTED IN ONE ROUND IS WORTH MORE
    IN THE LOG THAN OUT OF IT, AND BECAUSE IT NEARLY WENT WRONG TWICE. First, it is not supported: two
    patients, and IGF-1 moved the wrong way or not at all. Second, the mouse literature it would naturally
    have leaned on is PARTLY RETRACTED - wu2013 was withdrawn in 2020 (J Biol Chem 295:13137) and
    CORR-004 already struck the claim that FGF21 mediates undernutrition-induced growth-plate GH
    insensitivity. guasti2014 is an INDEPENDENT group (Guasti and Dunkel, UCL and Kuopio) and carries no
    retraction, which is the only reason the hypothesis was worth stating at all. WHAT SURVIVES IS
    NARROWER AND STILL USEFUL: guasti2014 remains good human evidence that FGF21 blunts GH action at the
    chondrocyte WITHOUT blunting IGF-1 action, which means a chronically ill child can be GH-resistant at
    the growth plate while their IGF-1 receptor pathway is intact - an argument for IGF-1 rather than GH
    if the aim were to push that axis at all. n = 2 cannot refute a mechanism, only fail to support it,
    and serum IGF-1 is a hepatic readout that need not track what FGF21 is doing in cartilage. It is
    listed as not-supported, not as disproved.'
- parameter: A WITHIN-PATIENT DRUG CONTROL THAT NOBODY HAS QUOTED — NINTEDANIB 2.6 cm/YEAR, ERDAFITINIB 10 cm/YEAR, SAME CHILD
  value: patient 2 was treated with nintedanib before erdafitinib. Growth velocity on nintedanib 2.6
    cm/year; growth velocity on erdafitinib 10 cm/year
  unit: cm/year
  conditions: erdaseries2025, sequential therapies in one child; nintedanib is a triple angiokinase
    inhibitor targeting VEGFR1-3, PDGFR-alpha and -beta AND FGFR1-3
  species: human
  source_ref: erdaseries2025
  uncertainty: 'RARE AND VALUABLE BECAUSE THE CHILD IS THEIR OWN CONTROL - same tumour, same age band,
    same nutritional state, two drugs that both nominally hit FGFR1-3, and a four-fold difference in
    velocity. IT DOES NOT ESTABLISH THAT ERDAFITINIB IS MOLECULARLY SPECIAL, WHICH IS THE READING TO
    RESIST. Nintedanib is an angiokinase inhibitor whose FGFR activity is secondary and far weaker, so the
    contrast is most simply explained by how much FGFR3 inhibition each drug actually delivers at its
    clinical dose - which is the atlas''s standing position that the 19 cm/year is evidence about the
    DOSE-RESPONSE OF FGFR3 BLOCKADE rather than about erdafitinib''s uniqueness. Read that way it is
    supporting evidence for a selective agent dosed properly, not against one. Confounds are heavy: the
    two exposures are at different times in a progressive illness, disease control differed, and n = 1.'
human_evidence: direct
human_evidence_note: Human paediatric observations exist for BOTH the growth acceleration and the skeletal
  toxicity, but the efficacy signal is a retrospective case series in children with tumours and severe
  pre-existing growth impairment, and the toxicity signal is a case report plus FDA postmarketing reports.
  There is no controlled human growth study of this drug.
species_basis:
- human
translation_risk: not_applicable
confidence: C
claim_grades:
- claim: Erdafitinib accelerates linear growth in children, independently of sex steroids and IGF-1.
  grade: D
  basis: One retrospective case series in paediatric neuro-oncology patients (erdaseries2025). No control
    group, severe pre-existing growth impairment means regression to the mean and catch-up growth are
    not excluded.
- claim: FGFR inhibition widens the growth plate in humans.
  grade: D
  basis: Radiographic observation in the same series (erdaseries2025). Consistent with the mouse FGFR3-loss
    phenotype but human-observed only once.
- claim: Pan-FGFR TKIs cause skeletal growth toxicity in children, including SCFE.
  grade: C
  basis: One detailed case with imaging and surgical confirmation (brizini2024) plus an FDA postmarketing
    case series (nadeaunguyen2026) - independent routes, same signal.
- claim: Hyperphosphataemia is an on-target class effect that can reach calcinosis cutis.
  grade: B
  basis: Consistent across the FGFR-inhibitor class with 10 reviewed cases and a mechanistic explanation
    through renal FGF23/FGFR1-Klotho (ghimire2025).
