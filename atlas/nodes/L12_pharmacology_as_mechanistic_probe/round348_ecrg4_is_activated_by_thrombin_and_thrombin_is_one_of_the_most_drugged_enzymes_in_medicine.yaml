id: round348_ecrg4_is_activated_by_thrombin_and_thrombin_is_one_of_the_most_drugged_enzymes_in_medicine
name: 'Round 348 - ECRG4 has no chemical matter but its ACTIVATING PROTEASE does: the active fragment is
  released by THROMBIN, a thrombin-cleavage mutant abolishes activity, and dabigatran is oral, approved and
  paediatric-labelled; the bone-safety objection is a WARFARIN effect that does not transfer, and the growing
  animal has never been dosed'
aliases:
- dabigatran
- ECRG4 thrombin cleavage
- augurin activation
- direct thrombin inhibitor growth plate
- the warfarin objection does not transfer
- SERPINE2 protease nexin-1 in the growth plate
type: intervention
layer: L12
stub: false
summary: 'R347 ended with ECRG4 as the best new target in the file and NO COMPOUND - zero human ChEMBL target
  record, the same wall as HHIP, CHAD, SCUBE3, STC2 and CLEC3A. That verdict was computed on the TARGET.
  CORR-312 says search the fold, not the drug, and the fold here is not ECRG4 - it is the protease that
  switches ECRG4 on.

  ONE - ECRG4 IS A MEMBRANE-TETHERED PRECURSOR AND THROMBIN IS THE ACTIVATING ENZYME. baird2012 established
  the architecture: full-length 14 kDa ECRG4 sits ON THE CELL SURFACE and is released as a soluble ligand;
  membrane-bound ECRG4 marks QUIESCENT cells while the released C-terminal fragment is the active signal.
  lee2015ecrg4 then did the discriminating experiment. The sequence carries putative FURIN and THROMBIN
  processing sites; thrombin cleaves at a thrombin-like consensus near Arg131 to release the C-terminal
  peptide; and conditioned media from cells expressing WILD-TYPE Ecrg4 and the FURIN MUTANT activated
  microglia while the THROMBIN MUTANT DID NOT. THROMBIN CLEAVAGE IS REQUIRED FOR BIOLOGICAL ACTIVITY AND
  FURIN CLEAVAGE IS NOT. That converts an undruggable secreted protein into a step catalysed by one of the
  most thoroughly drugged enzymes in medicine.

  TWO - THE RECEIVER TEST DISCRIMINATES BETWEEN THE TWO CANDIDATE HANDLES, AND IT KILLS THE OBVIOUS ONE.
  ECRG4s published receptor is the endotoxin receptor complex, which invites a TLR4 antagonist - eritoran,
  TAK-242. In the purity-corrected human growth plate that complex is CONTAMINANT-LEANING: TLR4 10.9 CPM at
  0.99x, CD14 13.1 at 0.63x, LY96/MD-2 2.7 at 0.21x, MSR1 1.0 at 0.07x. RECEPTOR BLOCKADE FAILS CORR-327.
  The substrate arm passes emphatically: ECRG4 694.6 CPM at 16.35x. And the tissue is actively restraining
  thrombin - SERPINE2, protease nexin-1, the classic tissue thrombin inhibitor, is 2,197.4 CPM at 3.89x
  enrichment, one of the most abundant transcripts in the panel, with two prior atlas mentions. A TISSUE DOES
  NOT SPEND THAT ON AN ENZYME IT NEVER SEES.

  THREE - AND THE SOURCE OF THAT THROMBIN IS NOT WHAT I FIRST WROTE. My first reading was the NPPC/NPR2
  configuration - enzyme circulating, substrate local - because prothrombin is 0.1 CPM in pure cartilage and
  the whole generation cascade is absent locally (F7 0.3, F10 0.0, F5 1.6, SERPINC1 0.1). brent2018 corrects
  it: OSTEOCLASTS SYNTHESISE AND SECRETE THROMBIN, and osteoblasts express thrombin receptors. The
  chondro-osseous junction is the osteoclast-rich zone, and a pure-cartilage sample cannot see it. So thrombin
  is available at the plate by BOTH routes, which is better for the hypothesis than the version I started
  with - but the framing had to be corrected inside the round.

  FOUR - THE COMPOUND. DABIGATRAN ETEXILATE: oral, approved, generic-adjacent, and it carries a PAEDIATRIC
  INDICATION for venous thromboembolism with established paediatric pharmacokinetics from birth to 16 years.
  It is a DIRECT thrombin inhibitor, so it blocks the enzyme that performs the activating cleavage rather
  than a receptor that is not in the tissue. Factor Xa inhibitors (rivaroxaban, apixaban) reduce thrombin
  GENERATION and are also paediatric-approved, but they act one step upstream and are a weaker instrument.

  FIVE - THE OBVIOUS OBJECTION IS THAT ANTICOAGULANTS HARM THE GROWING SKELETON, AND IT IS A WARFARIN
  OBJECTION THAT DOES NOT TRANSFER. Warfarin embryopathy - stippled epiphyses, nasal hypoplasia - is a
  vitamin-K/GGCX effect on matrix Gla protein, and long-term warfarin lowers bone density. A DIRECT THROMBIN
  INHIBITOR DOES NOT TOUCH VITAMIN-K-DEPENDENT CARBOXYLATION. The discrimination has been tested head to
  head: in rats, warfarin significantly DECREASED bone volume and increased trabecular separation in femur
  AND vertebrae while dabigatran was indistinguishable from control. And brent2018 in healthy mice found NO
  MAJOR DELETERIOUS EFFECT on bone in either sex at a relatively high dose, with a weak POSITIVE at female
  tibial cortical bone.

  SIX - AND THE SAME TWO PAPERS ARE CORR-340 AGAIN, TWICE. Both dosed the animal and never took the
  measurement. brent2018: 52 healthy C57BL/6 mice, oral dabigatran for 3 or 6 weeks, DEXA plus microCT plus
  mechanical testing plus histomorphometry of TIBIA, FEMUR AND VERTEBRA - and no femur, tibia or body LENGTH
  anywhere. The rat comparison did the same. The experiment this axis needs is not a new experiment; it is a
  caliper on animals that have already been dosed. The one real defect is age: brent2018s mice were 14 WEEKS
  OLD, which is adult, so the growing animal has still never been dosed.

  SEVEN - WHAT WOULD KILL IT, STATED BEFORE PROPOSING. (a) NO THROMBIN INHIBITOR HAS A BONE-LENGTH ENDPOINT
  IN ANY SPECIES. (b) ECRG4 CLEAVAGE BY THROMBIN HAS NEVER BEEN SHOWN IN CARTILAGE - the requirement is
  established in microglia and myeloid cells, and the growth-plate mechanism is entirely unmapped. (c) ge2026
  runs against the proposal: thrombin INHIBITS osteogenic differentiation of primary osteoblasts, so removing
  it should ACCELERATE ossification - which at the chondro-osseous junction is failure mode 1, charge without
  discharge, in reverse. (d) THE DECISIVE GENETIC TEST WAS NEVER RUN - Serpine2, the tissue thrombin
  inhibitor, has ZERO IMPC rows (CORR-348 case one), and F2 heterozygote tibia length is +0.394 at P=0.411.
  Serpine1-null body length -1.158 (P=0.0025) and Plat-null -1.476 (P=0.0031) are both in the COMMON
  direction, where 64.1% of all rows sit, so under CORR-329 they carry almost no information. (e) BLEEDING IS
  THE DOSE-LIMITING TOXICITY AND THE DOSE THAT WOULD BLOCK CLEAVAGE IN CARTILAGE IS UNKNOWN - it may require
  full anticoagulation, and that, not the bone data, is the real practical objection. (f) ECRG4 has no human
  height effect size at all.

  EIGHT - A FREE BY-PRODUCT THAT SHARPENS AN EXISTING CONTRAINDICATION. baird2012 reports ECRG4 promoter
  hypermethylation of 45-90% in cell lines, REVERSIBLE BY 5-AzaC. yang2025ecrg4 shows DNMT1 silences ECRG4 by
  methylating its promoter, and that ECRG4 over-expression decreases proliferation. So a HYPOMETHYLATING AGENT
  RE-EXPRESSES ECRG4 - a secreted senescence-inducing proliferation brake - which is a specific, gene-level
  mechanism for the DNMT-inhibitor contraindication this file has carried since R276 and human-anchored in
  R343. It also connects R347s two halves with a citation rather than an inference: more DNMT1 activity means
  less ECRG4. CORR-203 applies - both are cancer-cell findings, not growth-plate ones.'
quantitative:
- parameter: 'THROMBIN CLEAVAGE IS REQUIRED FOR ECRG4 ACTIVITY AND FURIN CLEAVAGE IS NOT'
  value: 'ECRG4 is synthesised as a membrane-anchored precursor - full-length 14 kDa protein localised on the
    PMN and monocyte cell surface by flow cytometry, immunofluorescence and cell-surface biotinylation
    (baird2012). The sequence carries putative FURIN and THROMBIN processing sites at the C-terminus;
    incubating recombinant ECRG4 with thrombin ex vivo releases a C-terminal fragment (Ecrg4 133-148), and the
    released peptide corresponds to cleavage at Arg131. THE DISCRIMINATING RESULT: conditioned media from
    cells transfected with WILD-TYPE Ecrg4 and with the FURIN MUTANT increased microglial activity; media from
    the THROMBIN MUTANT DID NOT'
  unit: qualitative - which protease is required
  conditions: baird2012 and lee2015ecrg4, abstracts read 2026-08-13; both open access. Myeloid cells, microglia
    and glioma models.
  species: mouse
  source_ref: lee2015ecrg4
  uncertainty: 'THE REQUIREMENT IS ESTABLISHED IN MYELOID AND MICROGLIAL SYSTEMS AND HAS NEVER BEEN TESTED IN
    CARTILAGE. Nobody has shown that growth-plate ECRG4 is thrombin-cleaved, that the soluble fragment is
    present in the plate, or that the fragment rather than the membrane form carries the growth phenotype.
    The Ecrg4-null mouse that is longer removes BOTH forms, so the mouse phenotype does not by itself
    establish that the soluble fragment is the one to block - which is the single largest inferential step in
    this node.'
- parameter: 'THE RECEIVER TEST - THE PROTEASE HANDLE PASSES AND THE RECEPTOR HANDLE FAILS'
  value: 'Pure-cartilage CPM with pure/contaminated ratio, GSE288028 purity-corrected, all 12/12 detected
    unless stated. SUBSTRATE: ECRG4 694.6 (16.35x). TISSUE THROMBIN INHIBITOR: SERPINE2 / protease nexin-1
    2,197.4 (3.89x); SERPINE1 330.9 (1.38x); THBD 25.0 (1.99x); PROS1 22.5 (1.16x). NOT MADE LOCALLY:
    F2 0.1 (0.69x), F7 0.3, F10 0.0 (7/12), F5 1.6, SERPINC1 0.1, SERPIND1 0.0 (9/12), PROC 0.3.
    THROMBIN RECEPTORS ARE WEAK: F2R/PAR1 10.9 (0.61x), F2RL1/PAR2 4.2 (2.32x), F2RL2 0.0 (0.28x),
    F2RL3 4.3 (1.04x). THE ENDOTOXIN RECEPTOR COMPLEX IS CONTAMINANT-LEANING: TLR4 10.9 (0.99x), CD14 13.1
    (0.63x), LY96 2.7 (0.21x), MSR1 1.0 (0.07x). FURIN IS PRESENT AND ENRICHED - 127.6 (2.53x) - but is the
    wrong protease per lee2015ecrg4'
  unit: CPM; pure/contaminated ratio
  conditions: computed 2026-08-13 from atlas/data/round344/gse288028_human12_cpm.npy, 5 purest vs 5 most
    blood-contaminated human samples by COL2A1.
  species: human
  source_ref: gse288028
  atlas_derived: true
  uncertainty: 'THE SERPINE2 ARGUMENT IS THE STRONGEST PART AND IT IS STILL INDIRECT - abundant expression of
    a thrombin inhibitor is evidence that the tissue encounters thrombin, not a measurement of thrombin
    activity there, and SERPINE2 also inhibits urokinase and plasmin. The absence of prothrombin from PURE
    CARTILAGE does not exclude local thrombin, because brent2018 says osteoclasts make it and the
    osteoclast-rich chondro-osseous junction is exactly what a pure-cartilage sample excludes. And weak PAR
    expression cuts both ways: it means blocking thrombin is unlikely to disrupt a needed local PAR pathway,
    but it also means the tissue may simply not be very thrombin-responsive.'
- parameter: 'THE BONE-SAFETY OBJECTION IS A WARFARIN OBJECTION - AND BOTH STUDIES DOSED THE ANIMAL WITHOUT A CALIPER'
  value: 'brent2018: 28 male and 24 female C57BL/6 mice, 14 WEEKS OLD at start, dabigatran etexilate in chow
    ad libitum giving 1.70 mg/g body weight (female) and 1.52 mg/g (male), for 3 or 6 weeks. DEXA aBMD and
    BMC, microCT 3D microstructure, mechanical testing and bone histomorphometry on TIBIA, FEMUR and VERTEBRA.
    RESULT: no major deleterious effect on bone in either sex; in females significantly higher tibial aBMD at
    6 weeks with increased tibial diaphyseal cortical area and increased shaft strength; no effect on femoral
    cortical bone or on femoral and vertebral trabecular microstructure; MS/BS and Oc.S/BS unaffected; in
    males nothing. NO FEMUR, TIBIA OR BODY LENGTH REPORTED. SEPARATELY, in 10-week-old female Sprague-Dawley
    rats over 6 weeks, WARFARIN significantly DECREASED bone volume and increased trabecular separation in
    femur and vertebrae (P<0.05 to P<0.001) while DABIGATRAN was similar to control - and that study also
    reported no length'
  unit: mg/g body weight; weeks; qualitative bone outcomes
  conditions: brent2018 abstract read 2026-08-13 (open access); the rat comparison extracted 2026-08-13 from
    the open-access full text at PMC4524674.
  species: mouse
  source_ref: brent2018
  uncertainty: 'THE AGE IS THE DEFECT. 14-week-old mice are adult, so this is a bone-mass study in a mature
    skeleton and says nothing directly about a growing plate - and the same is true of the 10-week-old rats.
    What it does establish is that a high oral dose of a direct thrombin inhibitor for six weeks does not
    damage bone, which is the objection that would otherwise close the axis on sight. THE ROUTE FROM HERE IS A
    RE-MEASUREMENT, NOT A NEW EXPERIMENT (CORR-340): dose a GROWING mouse and put a caliper on the femur,
    tibia and vertebrae. The rat warfarin/dabigatran contrast is a single study and I have not independently
    verified its group sizes beyond n=10 dabigatran, n=14 warfarin with 7 surviving, n=10 control.'
- parameter: 'THE GENETIC ARM IS NEITHER SUPPORTED NOR REFUTED - THE DECISIVE GENE WAS NEVER PHENOTYPED'
  value: 'IMPC, queried 2026-08-13. SERPINE2 - the tissue thrombin inhibitor and the gene whose loss would
    directly test whether more local thrombin shortens - HAS ZERO ROWS. F2 heterozygote TIBIA LENGTH +0.394,
    P=0.411, n=5m/5f (the homozygote is embryonic lethal). Furin heterozygote tibia -1.046, P=0.198. F2R has
    no rows. Plau homozygote tibia +0.449, P=0.661. Plaur homozygote tibia -0.974 (P=0.306) and -0.109
    (P=0.582). IN THE COMMON DIRECTION AND THEREFORE UNINFORMATIVE UNDER CORR-329: Serpine1 homozygote body
    length -1.158 (P=0.0025, tibia ns) and Plat homozygote body length -1.476 (P=0.0031, second row -0.228
    ns)'
  unit: IMPC standardised effect size; P-values
  conditions: IMPC statistical-results-ALL, operator-supplied 2026-08-12, queried 2026-08-13.
  species: mouse
  source_ref: impc_statistical_results
  atlas_derived: true
  uncertainty: 'CORR-348 CASE ONE FOR SERPINE2 - zero rows means never phenotyped, which says nothing in
    either direction and must not be read as a null. The Serpine1 and Plat body-length reductions are
    directionally consistent with more local protease activity being shorter, but 64.1% of all IMPC body-length
    rows are negative and only 24.8% of significant rows are positive, so a negative row in this dataset is
    the base rate rather than a result. F2 het at n=5m/5f is badly underpowered. The honest position is that
    the genetics do not currently bear on this hypothesis at all.'
- parameter: 'THE COUNTER-ARGUMENT: THROMBIN IS A DIFFERENTIATION BRAKE IN THE OSTEOBLAST LINEAGE'
  value: 'ge2026: primary rat osteoblasts treated with thrombin at 20 U/mL during osteogenic induction.
    Thrombin PROMOTED osteoblast proliferation and INHIBITED osteogenic differentiation - reduced ALP activity,
    reduced calcium influx, reduced Col1a1, Runx2 and osteocalcin, reduced mineralised nodule formation - by
    raising IL-1beta and activating a feedback loop between MEK-Erk1/2 and NF-kB with MMP-9 downstream. The MEK
    inhibitor PD0325901 at 0.1 microM reversed it'
  unit: U/mL; qualitative direction
  conditions: ge2026, abstract read 2026-08-13 (open access).
  species: rat
  source_ref: ge2026
  uncertainty: 'THIS RUNS AGAINST THE PROPOSAL AND IS RECORDED FOR THAT REASON. If thrombin restrains
    osteogenic differentiation, then inhibiting thrombin should ACCELERATE it - and at the chondro-osseous
    junction accelerated ossification spends the plate. That is the mirror of failure mode 1 and it is not
    resolved here. AGAINST THE COUNTER-ARGUMENT: 20 U/mL is a high pharmacological concentration in vitro,
    these are osteoblasts and not chondrocytes, and brent2018 dosed whole animals for six weeks and saw no
    deleterious bone effect - so whatever this mechanism does in a dish, it did not produce a bone phenotype
    in vivo. Direction unresolved; no length endpoint on either side.'
- parameter: 'THE HYPOMETHYLATING-AGENT CONTRAINDICATION GETS A GENE AND A MECHANISM'
  value: 'baird2012: in human cell lines ECRG4 gene expression is low, protein undetectable, promoter
    hypermethylation 45-90 per cent - and REVERSIBLE BY THE METHYLATION INHIBITOR 5-AzaC. In fresh normal human
    PBMCs and PMNs, ECRG4 expression is 600-800 times higher than in cultured lines with promoter methylation
    below 3 per cent. yang2025ecrg4: DNMT1 silences ECRG4 by methylating its promoter, within an
    ECRG4/IRF3/IFN-gamma/miR-29b/DNMT1 positive feedback loop, and ECRG4 over-expression significantly
    decreases proliferation in vitro and in vivo'
  unit: per cent promoter methylation; fold expression
  conditions: baird2012 and yang2025ecrg4, abstracts read 2026-08-13; both open access.
  species: in_vitro_human_cell
  source_ref: baird2012
  uncertainty: 'CORR-203 APPLIES TO BOTH - these are cancer cell lines and leukocytes, not growth-plate
    chondrocytes, and a promoter methylation percentage in a cultured line is a notoriously culture-dependent
    measurement. What the pair licenses is narrow: ECRG4 is a methylation-silenced gene and a hypomethylating
    agent re-expresses it. That makes azacitidine and decitabine specifically predicted to RAISE a secreted
    senescence-inducing proliferation brake, which sharpens the existing DNMT-inhibitor contraindication from a
    pathway-level argument to a named gene. It is NOT evidence that methyl-donor supply raises DNMT1 output at
    the plate, which remains the unmeasured step from R347.'
localization:
- 'the substrate ECRG4 is chondrocyte-restricted in the postnatal human growth plate (694.6 CPM, 16.35x), and
  the tissue thrombin inhibitor SERPINE2 is 2,197.4 CPM at 3.89x - but prothrombin itself is 0.1 CPM, so the
  enzyme is imported from the circulation and, per brent2018, also secreted by osteoclasts at the
  chondro-osseous junction that a pure-cartilage sample excludes'
- 'the published ECRG4 receptor complex (TLR4, CD14, LY96) is contaminant-leaning in the growth plate, so
  receptor blockade fails the CORR-327 receiver test while protease blockade passes'
human_evidence: indirect
human_evidence_note: 'The expression is human (12 postnatal human growth-plate samples). The thrombin
  requirement for ECRG4 activity is mouse and human myeloid cells with no skeletal endpoint. The bone-safety
  data are mouse and rat. Dabigatran has extensive human paediatric pharmacokinetic and safety data for
  venous thromboembolism, but NO human growth or height data of any kind, and no cohort of anticoagulated
  children has ever been reported with height velocity as an outcome.'
species_basis:
- human
- mouse
- rat
translation_risk: high
translation_risk_reason: 'The activating-protease requirement is established in myeloid cells and has never
  been tested in cartilage; no thrombin inhibitor has a bone-length endpoint in any species; the only in-vivo
  bone studies used adult animals and omitted length; and bleeding is the dose-limiting toxicity with the
  cartilage-effective dose entirely unknown.'
confidence: C
claim_grades:
- claim: Thrombin cleavage is required for ECRG4's biological activity and furin cleavage is not.
  grade: B
  basis: 'lee2015ecrg4 ran the mutant comparison directly - wild-type and furin-mutant conditioned media
    activated microglia, thrombin-mutant did not - with the cleavage site mapped to a thrombin consensus near
    Arg131 and confirmed by ex-vivo thrombin digestion of recombinant protein. baird2012 independently
    establishes the membrane-anchored precursor architecture the result depends on. Graded B not A because it
    is one laboratory and one cell system.'
- claim: A direct thrombin inhibitor would lower augurin signalling at the growth plate.
  grade: E
  basis: 'INFERENCE. It chains a myeloid-cell cleavage requirement to a cartilage phenotype through a step
    nobody has measured. No one has shown ECRG4 is thrombin-cleaved in cartilage, quantified soluble augurin
    in a growth plate, or demonstrated that the soluble rather than the membrane form carries the length
    phenotype - and the Ecrg4-null mouse removes both.'
- claim: The skeletal harm of anticoagulation is a warfarin effect that does not transfer to direct thrombin inhibition.
  grade: B
  basis: 'Mechanistically distinct - warfarin embryopathy and warfarin bone loss run through vitamin-K-dependent
    carboxylation of matrix Gla protein, which a direct thrombin inhibitor does not touch - and tested head to
    head in rats, where warfarin significantly decreased bone volume in femur and vertebrae while dabigatran
    was indistinguishable from control. brent2018 adds a high-dose six-week mouse study with no deleterious
    bone effect in either sex. Graded B not A because both studies are in adult animals and neither measured a
    growing skeleton.'
- claim: Dabigatran is an addable compound for this stack.
  grade: D
  basis: 'It is obtainable, oral, approved, paediatric-labelled, Step 0 clean, and aimed at the activating step
    of a target whose null mouse is longer at P=4.45e-07 with increased bone density. That is more than any
    other candidate this file has produced for the N term. But NO thrombin inhibitor has a bone-length endpoint
    in any species, the cartilage cleavage step is unmeasured, ge2026 gives a mechanism by which it could
    accelerate ossification instead, and bleeding is the dose-limiting toxicity with the required exposure
    unknown. Grade D is a specification and a re-measurement, not a recommendation.'
- claim: Blocking the ECRG4 receptor is a viable alternative handle.
  grade: X
  basis: 'NO. The published receptor is the endotoxin receptor complex and in the purity-corrected human growth
    plate TLR4 is 0.99x, CD14 0.63x, LY96 0.21x and MSR1 0.07x - all contaminant-leaning. TLR4 antagonists
    fail CORR-327 at this tissue. The protease handle and the receptor handle were separated by a free local
    query.'
