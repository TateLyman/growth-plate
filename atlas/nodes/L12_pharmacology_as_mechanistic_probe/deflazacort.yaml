human_evidence_note: >-
  Approved on a randomised placebo- and active-controlled trial in 196 boys, with
  longitudinal growth centile modelling available from corticosteroid-treated DMD cohorts.
species_basis: [human]
translation_risk: low
translation_risk_reason: >-
  All the relevant data are human clinical trial and cohort data in DMD; the unresolved
  question is a comparative one within humans, not a species one.
confidence: B
claim_grades:
  - claim: Deflazacort at 0.9 mg/kg/day improves outcomes in Duchenne muscular dystrophy.
    grade: A
    basis: Randomised, placebo- and active-controlled trial in 196 boys underpinning FDA approval.
  - claim: Deflazacort is growth-sparing relative to prednisone at equipotent doses.
    grade: D
    basis: The US label makes no such claim, and growth suppression persists in treated cohorts; the comparison has not been settled by a dedicated randomised growth endpoint.
  - claim: Growth suppression and functional benefit are inseparable for classical glucocorticoids in DMD.
    grade: C
    basis: Joint modelling of growth and motor function centiles shows them tracking together, but this is observational within treated boys.
