id: abaloparatide
name: Abaloparatide (PTHrP 1-34 analogue)
aliases: [TYMLOS, BA058, PTHrP(1-34) analog]
type: intervention
layer: L12
stub: false
summary: |
  Abaloparatide is a synthetic analogue of PTHrP(1-34) acting as a PTH1R agonist, given
  once daily at 80 mcg subcutaneously for osteoporosis. Because PTHrP is the endogenous
  ligand that maintains the proliferative pool of the growth plate through PTH1R, an
  exogenous PTHrP analogue is the most direct pharmacological mimic of the plate's own
  pace-setting signal available as an approved drug - and, like teriparatide, it is barred
  from the growing skeleton. The FDA label states abaloparatide is not recommended in
  paediatric patients with open epiphyses or hereditary disorders predisposing to
  osteosarcoma because of increased baseline osteosarcoma risk, and that safety and
  effectiveness in paediatric patients have not been established. The result is a
  structural hole in the atlas: the two approved PTH1R agonists both target the receptor
  whose ligand sets growth plate output, and neither has ever been given to a human growth
  plate. Whether an abaloparatide-like PTHrP analogue would expand the proliferative zone,
  delay hypertrophy and lengthen bones in a child is therefore unknown and, under current
  regulatory constraints, not directly testable.
quantitative:
  - parameter: approved dose and route
    value: '80'
    unit: mcg/day subcutaneous
    conditions: postmenopausal women and men with osteoporosis at high fracture risk; periumbilical abdominal injection
    species: human
    source_ref: fda_tymlos_label_2025
    uncertainty: label dose
  - parameter: paediatric trials of abaloparatide with any growth endpoint
    value: '0'
    unit: trials
    conditions: not recommended in paediatric patients with open epiphyses; safety and effectiveness not established
    species: human
    source_ref: fda_tymlos_label_2025
    uncertainty: absence established from labelling and search - see gap g_l12b_019
localization:
  - "human growth plate: PTH1R present on prehypertrophic chondrocytes; no human pharmacological exposure"
human_evidence: absent
human_evidence_note: >-
  No human paediatric exposure and no growth endpoint; all human data are adult
  osteoporosis outcomes.
species_basis: [human, rat]
translation_risk: high
translation_risk_reason: >-
  The anabolic effect is characterised in rats and monkeys and in adult human bone density;
  nothing is known about its action on a growing plate, and the rodent carcinogenicity
  signal that motivates the paediatric restriction is itself a species-translation question.
confidence: D
claim_grades:
  - claim: Abaloparatide is a PTH1R agonist acting through cAMP in target cells.
    grade: A
    basis: Mechanism established in the approved label and supported by adult bone turnover marker data.
  - claim: Abaloparatide is not recommended in patients with open epiphyses.
    grade: A
    basis: Explicit FDA label statement.
  - claim: A PTHrP analogue would expand the proliferative zone and lengthen bone in a growing human.
    grade: E
    basis: Inference from PTHrP-PTH1R growth plate biology; no human data of any kind.
