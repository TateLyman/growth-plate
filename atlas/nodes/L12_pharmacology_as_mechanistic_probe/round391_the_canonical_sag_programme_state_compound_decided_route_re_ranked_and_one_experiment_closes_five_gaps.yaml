id: round391_the_canonical_sag_programme_state_compound_decided_route_re_ranked_and_one_experiment_closes_five_gaps
name: "R391: the canonical hedgehog-agonist programme state - compound decided (SAG dihydrochloride, SAG21k as fallback), route re-ranked upward for systemic, and one study design closes five of the nine open gaps"
aliases:
  - SAG programme state
  - SAG versus SAG21k
  - which smoothened agonist
  - the canonical systemic protocol
  - hedgehog agonist answered and unanswered ledger
type: intervention
layer: L12
stub: false
summary: >-
  Nineteen rounds (R368 to R390) accumulated on this axis and they contradict each
  other in places, because the route changed twice and the dose changed three
  times. This node is the consolidated state: what the compound is, what the route
  is, what every parameter is, what is answered, what is not, and which single
  experiment unblocks the most. It supersedes the protocol paragraphs in R373,
  R374, R385, R386, R387 and R388 wherever they differ.

  THE COMPOUND. Physicochemistry does not decide it: SAG free base 490.1 Da XLogP
  6.3, SAG dihydrochloride 563.0, SAG21k 556.1 XLogP 6.5, Hh-Ag1.5 526.0,
  purmorphamine 520.6 XLogP 6.5. Every agonist is 490 to 556 Da at XLogP 6.3 to
  6.5, and R371 already showed the cartilage partition wall does not exist at that
  size. So the choice falls to evidence in the target tissue, and there it is not
  close. BOTH LOAD-BEARING EFFICACY RESULTS AT THE GROWTH PLATE ARE SAG:
  trompet2024's 61 percent resting-zone pool expansion in NORMAL mice, which is the
  one result CORR-203 cannot touch; and li2021's third lumbar vertebra at plus 32.1
  percent, which is the entire compartment argument for going systemic at all.
  SAG21k's advantages are real - several-fold more potent, the only demonstrated
  aqueous in vivo vehicle (PBS), adult systemic safety with organ endpoints, a
  published fibrin loading, and a systemic bone study - but every one of them is
  either in a tissue that is not the target or is a formulation convenience.
  DECISION: SAG DIHYDROCHLORIDE, with SAG21k held as the named fallback. The single
  thing that would force the switch is formulation failure, because SAG21k solves
  concentration and potency together - at the cost of severing the direct link to
  the only two efficacy anchors this programme has.

  THE ROUTE, AND THIS IS A REVERSAL WORTH STATING PLAINLY. R375 ranked systemic
  FOURTH and called it "not the maximum"; R388 switched to it on compartment
  grounds without re-examining R375's reasoning. R375's case for going local rested
  on one premise - that systemic hedgehog activation is the hazard and a depot
  confines it. R390 tested that premise in three organs and it did not survive.
  Colon: a systemic agonist ameliorates colitis AND decreases colitis-associated
  tumour burden while the antagonist increases it. Pancreas: agonism protects beta
  cells, and hedgehog inhibitors are reported to raise diabetes incidence in
  patients. Skin: the human cutaneous squamous-cell-carcinoma signal attaches to
  the marketed antagonists. On every organ where systemic hedgehog tone has been
  manipulated and measured, the harm is on the SUPPRESSION side. Combined with the
  compartment fact - the residual at bone age 16 is trunk-dominant and a knee depot
  cannot reach a vertebral plate at all - systemic moves from fourth to second,
  behind only HHIP knockdown, which has no molecule and a three-to-four-year
  timeline.

  THE COMBINATION IS EXPLICITLY NOT RECOMMENDED, and the reason is specific rather
  than cautious. Adding a knee depot to a systemic pulse costs 2.70 mg, which is
  0.27 percent more drug, and looks free. But R384 established that this stack is
  already Ihh-elevating because erdafitinib is pharmacological postnatal chondrocyte
  FGFR3 deficiency, and that cartilaginous lesions form a band with enchondroma at
  the low end and chondroma-like lesions at the high end. Stacking systemic plus
  local pushes one compartment furthest up that band. Systemic alone, one pulse,
  read out at six months; a knee depot becomes a candidate only if the trunk moves
  and the knee does not.

  THE LEDGER. Sixteen things are answered: the regimen exists and is published; two
  independent mouse regimens cross-check to about one gram per human pulse at a
  ratio of 1.26; the route reaches the trunk; the pool mechanism is demonstrated in
  a normal animal; the post-secondary-ossification-centre stage is the favourable
  one on three independent lines; an aqueous vehicle for a Smoothened agonist has
  been used in vivo; the adult gut is protected rather than harmed on both
  inflammation and cancer; the gastrointestinal lesion that does exist is
  mesenchymal and mechanical rather than epithelial or neoplastic; hedgehog-gain
  tumorigenesis in the gut is specific to stomach and gastroesophageal junction; the
  human harm attaches to hedgehog loss across three organ systems; the pathway
  self-limits by Gli-level adaptation even below Patched; a systemic agonist induces
  PTCH1 and HHIP in vivo; intermittent dosing at Smoothened retains effect and
  sheds toxicity in humans; an activated Smoothened sequesters the PKA catalytic
  subunit, aligning the arm with erdafitinib's CREB-lowering; and the compound is a
  demonstrated teratogen.

  Nine remain open, and five of them are downstream of a single unmeasured curve.
  The dose-response at the growth plate sets the formulation demand, the size of
  the pharmaceutical-grade batch and the margin on the gut liability, and the same
  study design that measures it also delivers the systemic length endpoint and the
  adult-gut answer. The published effective systemic range spans forty-fold - 0.5
  mg/kg engaged the pathway in colon, 5 to 20 mg/kg/day is the stated effective
  range, 20 to 25 mg/kg produced both the stature correction and the pool
  expansion - and nobody has asked where in that range a growth plate responds. One
  experiment closes five gaps: 0.5, 2, 5, 10 and 20 mg/kg subcutaneously every other
  day for three weeks plus vehicle, in normal post-SOC mice, n at least 10, read at
  maturity for femur, tibia and vertebral length by caliper, resting-zone cell
  number and Ki67, growth-plate Gli1, Ptch1 and Hhip, and muscularis thickness by
  gut segment, with a withdrawal arm at plus 2, 10 and 21 days for the rebound
  question. Everything else on this axis is either free or a manufacturing
  contract.
quantitative:
  - parameter: physicochemistry of every available Smoothened agonist
    value: >-
      SAG free base 490.1 Da XLogP 6.3; SAG dihydrochloride 563.0; SAG21k 556.1 XLogP
      6.5; Hh-Ag1.5 526.0 XLogP 6.5; purmorphamine 520.6 XLogP 6.5
    unit: daltons and XLogP
    species: not_applicable
    source_ref: chen2002smo
    value_unverified: true
    note: >-
      retrieved from PubChem in R391 (CIDs 5284330, 154884292, 16678532, 44195701,
      5284329); source_ref is nominal - these are database values, not from a paper.
      The point is that they do not differ enough to decide anything, and R371 showed
      the cartilage partition wall does not exist at this size
  - parameter: published effective systemic SAG dose range in mice
    value: 5 to 20 mg/kg/day, with pathway engagement demonstrated as low as 0.5 mg/kg
    unit: mg/kg/day
    species: mouse
    source_ref: rundle2023
    note: >-
      the 0.5 mg/kg figure is lee2016colitis (SAG21k, colon Gli1 up 2.8-fold). The
      forty-fold span across which the pathway demonstrably responds, and inside which
      the growth-plate dose has never been placed, is the central open quantity
  - parameter: consequence of the dose being unmeasured
    value: >-
      human pulse ranges from tens of milligrams to about 1.07 g at 60 kg depending on
      where in the published range the plate responds
    unit: grams per three-week pulse
    species: not_applicable
    source_ref: li2021
    value_unverified: true
    note: >-
      derived in R391. At the low end the formulation requirement disappears, the
      material becomes a catalogue purchase, and the gut liability seen at 20 mg/kg
      plausibly falls below threshold - three blockers collapse on one curve
  - parameter: cost of adding a local knee depot to a systemic pulse
    value: 2.70 mg against about 1000 mg, i.e. 0.27 percent more drug
    unit: percent
    species: not_applicable
    source_ref: trompet2024
    value_unverified: true
    note: >-
      derived in R391 from R386's depot dose. Cheap in drug terms and rejected anyway,
      because the Ihh band and this stack's existing Ihh elevation make the knee the
      wrong compartment to push furthest
localization: systemic, with the trunk as the compartment that decides the route
human_evidence: indirect
human_evidence_note: >-
  No Smoothened agonist has been given to a human by any route, re-confirmed in R390
  by three clinicaltrials.gov queries. All human evidence on this axis concerns the
  LOSS direction - the FAERS cutaneous squamous-cell-carcinoma signal on the marketed
  antagonists, higher diabetes incidence in patients on hedgehog inhibitors, the
  GLI1-altered gastric mesenchymal tumour class, and liu2026gorlin's two-person
  schedule comparison on an antagonist.
species_basis:
  - mouse
  - human
translation_risk: high
translation_risk_reason: >-
  Every efficacy result is mouse, the dose is scaled by body-surface-area allometry
  with no pharmacokinetic data in any species, both mouse regimens are
  early-postnatal while the subject is at bone age 16, and no hedgehog agonist has
  been given to any animal at an equivalently late skeletal stage. The compound
  decision rests on which agent carries the two growth-plate results, not on any
  head-to-head comparison, because none exists.
confidence: C
claim_grades:
  - claim: >-
      Physicochemistry does not distinguish the available Smoothened agonists and
      cannot be used to choose between them
    grade: B
    basis: >-
      PubChem values across five agonists, read against farnum2006's partition curve
      and R371's Donnan arithmetic
  - claim: >-
      SAG rather than SAG21k is the lead, because both growth-plate efficacy results
      are SAG
    grade: C
    basis: >-
      a decision rule applied to the existing evidence, not a head-to-head comparison.
      No study has compared the two agents at a growth plate in any species
  - claim: >-
      The safety premise that motivated the local route did not survive - systemic
      hedgehog activation is protective in colon, pancreas and airway, and the human
      cancer signal attaches to suppression
    grade: B
    basis: >-
      lee2016colitis (pharmacological, both directions), kong2025dhh, zheng2025faers.
      The FAERS component is disproportionality analysis and hypothesis-generating
  - claim: Systemic is the obtainable maximum-effect route, ranking second behind HHIP knockdown
    grade: C
    basis: >-
      a re-ranking from the compartment argument plus the weakened safety premise. The
      depot retains the only true length endpoint in a normal animal, so this is a
      judgement between an established local effect in the smaller compartment and an
      unestablished systemic effect in the larger one
  - claim: >-
      Systemic and local should not be combined, because the stack is already
      Ihh-elevating and cartilaginous lesions form a band
    grade: D
    basis: >-
      composed from zhou2015a and li2021's two ends. No experiment has combined a
      systemic and a local hedgehog agonist in any species
  - claim: >-
      Five of the nine open gaps are downstream of the growth-plate dose-response and
      one study design closes them
    grade: B
    basis: >-
      a dependency argument over gaps this atlas itself defined; the study design is
      conventional and each readout is standard
key_refs:
  - ref_id: trompet2024
    year: 2024
    type: primary
    role: >-
      the reason the compound is SAG - 61 percent resting-zone pool expansion in NORMAL
      mice, the one efficacy result CORR-203 cannot touch, plus the local bead's length
      gain that the depot route still owns
  - ref_id: li2021
    year: 2021
    type: primary
    role: >-
      the second reason the compound is SAG, and the whole basis of the route decision -
      the only study on this axis that measured a vertebra, at plus 32.1 percent
  - ref_id: rundle2023
    year: 2023
    type: primary
    role: >-
      the published 5 to 20 mg/kg/day systemic range, the statement that SAG21k is
      several-fold more active, and the femur that was measured and used as a normaliser
  - ref_id: lee2016colitis
    year: 2016
    type: primary
    role: >-
      the strongest single argument for the systemic route - an adult systemic agonist
      that protects the colon on both inflammation and cancer, dosed in an aqueous
      vehicle, with PTCH1 and HHIP measured in vivo
  - ref_id: kong2025dhh
    year: 2025
    type: primary_abstract_only
    role: the pancreatic and airway arms of the same inversion, with a human diabetes signal
  - ref_id: zheng2025faers
    year: 2025
    type: primary_abstract_only
    role: the human pharmacovigilance arm - the cancer signal attaches to hedgehog suppression
  - ref_id: zhou2015a
    year: 2015
    type: primary
    role: >-
      why systemic and local must not be combined - this stack already raises Ihh
      through erdafitinib, and the lesion risk is a band
  - ref_id: mao2026sag
    year: 2026
    type: primary
    role: the teratogenicity that sets the contraception requirement
  - ref_id: chen2002smo
    year: 2002
    type: primary
    role: the potency the whole dose calculation is anchored to - SMO Kd 59 nM, Gli EC50 about 3 nM
