id: round266_the_senolytic_arm_is_empty_for_a_reason_and_dynamin_is_a_new_node
name: ROUND 266 - the senolytic arm is empty for a principled reason, not an accidental one, and the sweep turned
  up ONE genuinely new node with a wild-type length result - DYNAMIN, where a low-dose inhibitor increases longitudinal
  bone growth and a high dose abolishes it
aliases:
- round 266
- senolytics are the wrong tool
- dynasore
- dynamin
type: hypothesis
layer: L12
stub: false
summary: 'A BROAD SWEEP ACROSS FOUR AXES THIS ATLAS HAD NOT SEARCHED - Wnt-driven column formation, senolytics,
  hypoxia/HIF, and metabolic/autophagy/sirtuin - returned two things worth keeping and a principled negative that
  is more useful than either.

  ONE - THE NEGATIVE, AND IT IS STRUCTURAL RATHER THAN A GAP IN THE LITERATURE. A senolytic sweep (dasatinib, quercetin,
  navitoclax, fisetin) against growth plate, physis and longitudinal bone growth returns 374 records and NOT ONE
  is a longitudinal growth experiment. They are osteoarthritis, bone loss, disc degeneration, fracture repair and
  progeria. The nearest approach to a growing skeleton is liu2026cih, in which chronic intermittent hypoxia induced
  senescence in young mice with growth retardation - and single-cell sequencing identified the senescent cells as
  OSTEOPROGENITORS IN THE METAPHYSIS, NOT GROWTH PLATE CHONDROCYTES. THE REASON THAT ARM IS EMPTY IS THAT GROWTH
  PLATE SENESCENCE IS NOT CELLULAR SENESCENCE. arm3_pool_ceiling_is_imposed_not_intrinsic established the counter
  as a BODY-WIDE, GROWTH-DRIVEN EPIGENETIC PROGRAMME - hundreds of growth-promoting genes downregulated in kidney,
  lung, liver and heart with declining H3K4 trimethylation at their promoters, an eleven-gene imprinted network
  tracking growth rate, delayed by tryptophan deprivation and by hypothyroidism because those SLOW GROWTH. It is
  not p16, not SASP, not damage-associated, and nilsson2005 showed the methylation loss does NOT occur during rapid
  replication in culture and does NOT occur in liver. SENOLYTICS CLEAR CELLS THAT ARE SENESCENT IN THE p16/SASP
  SENSE. The growth plate does not run out that way, so there is nothing for them to clear. THIS CLOSES THE ARM
  ON MECHANISM RATHER THAN ON ABSENCE OF EVIDENCE, which is a stronger closure and it should stop this axis being
  proposed again.

  TWO - AND ONE GENUINELY NEW NODE, WITH THE RAREST KIND OF RESULT IN THIS FILE. marchanalvarez2026 applied DYNASORE,
  a reversible dynamin inhibitor, to mouse metatarsals cultured ex vivo and found a DOSE-DEPENDENT HORMETIC effect
  on bone elongation: 220 micromolar IMPAIRED growth and abolished chondrocyte proliferation, while 40 MICROMOLAR
  SIGNIFICANTLY INCREASED LONGITUDINAL BONE GROWTH, with histology showing augmented epiphyseal cartilage expansion
  and matrix accumulation. DYNAMIN IS A NODE THIS ATLAS HAS NEVER HELD. In chondrocytes it is required for mitochondrial
  fission, for Golgi vesicle shuttling and for both clathrin- and caveolin-mediated endocytosis. WHY IT IS INTERESTING
  BEYOND NOVELTY. Every velocity agent in the stack is a SIGNALLING intervention - receptor, kinase, cyclic nucleotide,
  nuclear receptor. Dynamin is TRAFFICKING, and endocytosis is how a chondrocyte controls how long a receptor stays
  on its surface. That is orthogonal to every node in the collision matrix of round 262 by construction, which is
  the property the stack needs and rarely gets. AND THE OBVIOUS MECHANISTIC LINK TO THE EXISTING STACK IS SPECIFIC
  RATHER THAN VAGUE: FGFR3 is internalised and degraded via endocytosis, and blocking its internalisation changes
  its residence time at the membrane. Whether low-dose dynamin inhibition raises or lowers effective FGFR3 signalling
  is NOT determined by this paper and could go either way - which makes it the first thing to ask, not a detail.
  THE LIMITS ARE SERIOUS AND THEY ARE THE SAME ONES THAT KILLED OTHER EX VIVO POSITIVES. This is an ex vivo metatarsal,
  and caetanosilva2021 established that such cultures run at about FIFTY PER CENT of the in vivo rate while newton2018''s
  ex vivo advantage vanished in the animal. A hormetic dose-response with a narrow window between benefit at 40
  micromolar and abolition of proliferation at 220 is a five-fold therapeutic index in a dish, which is not a therapeutic
  index in an animal. And dynamin is required in every cell in the body.

  THREE - WHAT THE SWEEP DID NOT FIND, RECORDED SO IT IS NOT REPEATED. No HIF or oxygen-tension intervention with
  a longitudinal growth endpoint in a normal animal. No autophagy, NAD or sirtuin intervention with a bone length
  endpoint. No Wnt or beta-catenin manipulation that produces columns rather than terminal differentiation - the
  resting_zone_niche entry that forced beta-catenin activation DRIVES CELLS OUT OF THE ZONE remains the only directional
  statement, and it exits the wrong way.'
quantitative:
- parameter: DYNASORE ON LONGITUDINAL BONE GROWTH - HORMETIC, WITH A WILD-TYPE POSITIVE AT LOW DOSE
  value: 40 micromolar SIGNIFICANTLY INCREASED longitudinal bone growth with augmented epiphyseal cartilage expansion
    and matrix accumulation; 220 micromolar IMPAIRED growth and ABOLISHED chondrocyte proliferation
  unit: bone length, ex vivo culture
  conditions: marchanalvarez2026, BMC Biology. Mouse metatarsal bones cultured ex vivo with dynasore, a reversible
    dynamin inhibitor. Readouts were bone length measurement with EdU detection, immunostaining, super-resolution
    microscopy and transmission electron microscopy.
  species: mouse
  source_ref: marchanalvarez2026
  uncertainty: EX VIVO METATARSAL, WHICH IS THE PREPARATION THIS ATLAS HAS TWICE BEEN BURNED BY - caetanosilva2021
    puts such cultures at about half the in vivo rate and newton2018's ex vivo advantage did not survive into the
    animal. The window between a positive at 40 micromolar and abolished proliferation at 220 is five-fold IN A
    DISH. NOT OPEN ACCESS - the effect size, the EdU and matrix quantification, and whether resting-zone cell number
    was measured at all are unknown to this atlas and are on the ask list. Dynamin is required in every cell in
    the body, so systemic inhibition has no plausible therapeutic index without targeting.
- parameter: THE SENOLYTIC SWEEP - 374 RECORDS AND NO LONGITUDINAL GROWTH EXPERIMENT
  value: zero senolytic studies with a longitudinal bone growth or bone length endpoint; the nearest is senescence
    of METAPHYSEAL OSTEOPROGENITORS, not growth plate chondrocytes
  unit: count of records
  conditions: Europe PMC query pairing dasatinib, quercetin, navitoclax or fisetin with growth plate, physis or
    longitudinal bone growth; 374 hits, all osteoarthritis, bone loss, disc, fracture or progeria. liu2026cih is
    the nearest approach - chronic intermittent hypoxia in young mice caused growth retardation via senescent cells
    identified by single-cell sequencing as predominantly osteoprogenitors in the metaphysis, through HIF-1alpha
    suppression of EZH2 and loss of H3K27me3.
  species: mouse
  source_ref: liu2026cih
  uncertainty: 'A SEARCH RESULT IS A CLAIM ABOUT THE QUERY - CORR-267 - and this one was run on a single database
    with four compound names. What raises it above a bare null is the MECHANISTIC reason attached: arm3 established
    growth plate senescence as a growth-driven epigenetic programme rather than p16/SASP cellular senescence, so
    the absence is predicted rather than merely observed.'
