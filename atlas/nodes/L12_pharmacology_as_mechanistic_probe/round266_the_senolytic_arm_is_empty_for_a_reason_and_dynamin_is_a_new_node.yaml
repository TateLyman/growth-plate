translation_risk: high
translation_risk_reason: The one positive is an ex vivo metatarsal with a five-fold dose window against a target
  required in every cell in the body.
confidence: C
confidence_reason: The senolytic negative is graded B below because it has a mechanistic reason and not merely an
  empty search. The dynasore result is C - a single ex vivo study in a preparation with a poor record of transferring,
  read from an abstract.
claim_grades:
- claim: Senolytics are a candidate arm for growth plate senescence.
  grade: X
  basis: NO, AND ON MECHANISM RATHER THAN ON ABSENCE OF EVIDENCE. arm3 established the counter as a body-wide growth-DRIVEN
    epigenetic programme with declining H3K4me3, delayed by anything that slows growth, and nilsson2005 showed the
    methylation loss does not occur during rapid replication in culture. That is not p16/SASP cellular senescence,
    so there is nothing for a senolytic to clear. The 374-record empty search is the prediction, not the argument.
- claim: Low-dose dynamin inhibition increases longitudinal bone growth.
  grade: C
  basis: marchanalvarez2026, one ex vivo metatarsal study, dose-dependent and hormetic, read from an abstract. Held
    at C because the preparation is the one caetanosilva2021 puts at half the in vivo rate and in which newton2018's
    advantage vanished in the animal.
- claim: Dynamin is orthogonal to every node in the current stack.
  grade: E
  basis: 'Argued from what dynamin does - trafficking and endocytosis rather than signalling - not measured. And
    the specific link that would break the orthogonality is named: FGFR3 is internalised by endocytosis, so dynamin
    inhibition alters its membrane residence time, in a direction this paper does not determine.'
