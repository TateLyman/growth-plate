contradicts:
- REVERSES R371 PROVISIONAL RANKING. R371 put halcinonide first on physicochemistry - smallest and least
  lipophilic. On the SMO-over-GR window, the only criterion that survived R371 own analysis, halcinonide is
  LAST and has no window at all.
- REMOVES THE ASSUMPTION THAT SAG IS PHARMACOLOGICALLY SUPERIOR. It is not - the approved steroids match its
  SMO binding and beat its Gli potency. The case for SAG rests entirely on the absence of a glucocorticoid
  receptor, and the case against it rests entirely on the absence of any human exposure.
- DOES NOT CONSTITUTE A DOSE RECOMMENDATION. Every figure is scaled or computed from rodent data, the depot
  calculation ignores clearance, and no Smoothened agonist has ever been administered to a human.
