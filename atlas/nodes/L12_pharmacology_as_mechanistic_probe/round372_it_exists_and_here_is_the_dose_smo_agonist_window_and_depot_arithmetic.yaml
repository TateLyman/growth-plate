id: round372_it_exists_and_here_is_the_dose_smo_agonist_window_and_depot_arithmetic
name: Round 372 - IT EXISTS AND HERE IS THE DOSE. SAG is purchasable at 98 per cent purity and as a
  water-soluble salt; the approved steroids bind SMO at the SAME affinity as SAG and beat it on Gli output;
  only TWO of the four have any window over the glucocorticoid receptor; and the local depot arithmetic comes
  out FAVOURABLE at human scale - microgram payloads and 19-33 mm of diffusion reach
aliases:
- does a dosable SMO agonist exist
- SAG dose human equivalent
- SMO over GR window fluocinonide clobetasol
- how much drug for a human epiphyseal depot
- how do we dose this
type: hypothesis
layer: L12
stub: false
summary: 'The operator asked whether a dosable SMO agonist exists and how it would be dosed. Both are now
  computed. Tool: atlas/tools/round372_smo_agonist_dose_and_window.py.

  ⭐ ONE - IT EXISTS AND IS PURCHASABLE. SAG (CAS 364590-63-6) is stocked by Tocris (4366), Sigma-Aldrich /
  Calbiochem (566660), Abcam, Santa Cruz, BOC Sciences and others at GREATER THAN OR EQUAL TO 98 PER CENT
  HPLC purity, with certificates of analysis. ⭐ AND IT IS ALSO SOLD AS THE DIHYDROCHLORIDE (Tocris 6390),
  which is the water-soluble salt - directly relevant because the free base has cLogP 6.79. Vendor-stated
  potency, tracing to chen2002smo: SMO Kd 59 nM, Hedgehog pathway activation in Shh-LIGHT2 cells EC50 about
  3 nM. ⛔ IT IS A RESEARCH CHEMICAL, NOT A MEDICINE - no GMP material, no human pharmacokinetics, no
  toxicology package, and zero registry trials of any Smoothened agonist in humans.

  ⭐⭐⭐ TWO - THE COMPARISON THAT REFRAMES THE CHOICE. On DIRECT SMO BINDING the approved steroids are
  INDISTINGUISHABLE from SAG: clobetasol propionate 57 nM, fluticasone propionate 58 nM, halcinonide 78 nM,
  against SAG Kd 59 nM. And on FUNCTIONAL Gli output they are BETTER: clobetasol 0.2 nM, fluticasone 0.3 nM,
  fluocinonide 0.3 nM, halcinonide 1.8 nM, against SAG about 3 nM. THE APPROVED COMPOUNDS ARE EQUAL OR
  SUPERIOR TO SAG AT SMOOTHENED ON BOTH MEASURES. The only thing SAG has that they lack is the absence of a
  glucocorticoid receptor.

  ⭐⭐⭐ THREE - SO THE WINDOW IS THE WHOLE QUESTION, AND ONLY TWO OF THE FOUR HAVE ONE. Gli EC50 against
  human glucocorticoid-receptor potency from ChEMBL:
  · FLUOCINONIDE - Gli 0.3 nM vs GR 2.39 (best) / 5.26 (median) nM = window 8.0x to 17.5x. BEST.
  · CLOBETASOL PROPIONATE - Gli 0.2 vs GR 0.66 / 1.46 = window 3.3x to 7.3x.
  · FLUTICASONE PROPIONATE - Gli 0.3 vs GR 0.04 / 0.50 = 0.13x to 1.7x. NO USABLE WINDOW.
  · HALCINONIDE - Gli 1.8 vs GR 0.73 / 1.61 = 0.41x to 0.9x. NO WINDOW - GR is engaged FIRST.
  → HALCINONIDE, WHICH R371 RANKED FIRST ON PHYSICOCHEMISTRY, IS THE WORST ON THE ONLY CRITERION THAT
  SURVIVED. That reversal is the value of doing the arithmetic.
  ⚠ AND FLUOCINONIDE WINS ON A NUMBER THAT DOES NOT COHERE WITH ITS OWN BINDING: its SMO displacement is
  1,000 nM, 17-fold weaker than the other three, yet its Gli EC50 is 0.3 nM - a 3,333-fold binding-to-function
  gap against 285x for clobetasol and 43x for halcinonide. Reporter amplification explains some of that but
  not the outlier. ON THAT GROUND CLOBETASOL IS THE MORE DEFENSIBLE PICK: a 3-7x window, the best Gli
  potency of all four, and SMO binding equal to SAG.

  ⭐ FOUR - THE SYSTEMIC DOSE, IF THE SYSTEMIC ROUTE IS TAKEN. From the only in vivo growth-plate experiment
  that exists (trompet2024, SAG 25 micrograms per gram per day i.p., mouse, P31-P37), FDA body-surface-area
  allometry with mouse Km 3 and human Km 37 gives a HUMAN EQUIVALENT DOSE OF 2.03 mg/kg/day - about 101 mg
  at 50 kg, 122 mg at 60 kg, 142 mg at 70 kg, i.e. ROUGHLY 0.7 TO 1.0 GRAMS PER SEVEN-DAY PULSE.

  ⭐⭐⭐⭐ FIVE - AND THE LOCAL DEPOT ARITHMETIC IS THE ENCOURAGING PART, BECAUSE IT SCALES BY GEOMETRY RATHER
  THAN BODY MASS. The trompet2024 bead held 7 micrograms of SAG in 1.5 microlitres, placed in the distal
  femoral secondary ossification centre, with the Gli1-LacZ signal present at one week and GONE BY THREE
  WEEKS - and it produced femur plus 3.63 per cent at six months with the effect still widening.
  · CONCENTRATION: 7 micrograms is 14.3 nanomoles; distributed through an approximately 19 microlitre rat
    epiphysis that is about 750 nanomolar, roughly 250-fold over the 3 nM EC50. THE DEPOT IS NOT
    POTENCY-LIMITED - it is a reservoir maintaining a gradient.
  · REACH: for a 500 Da solute in cartilage at D of 1 to 3 times 10^-6 cm2/s, the diffusion length over the
    bead measured three-week life is sqrt(2Dt) = 19 to 33 MILLIMETRES. A human adolescent distal femoral
    epiphysis is 70-80 mm wide, so the half-distance from a central placement is 35-40 mm. A SINGLE CENTRAL
    DEPOT REACHES MOST OF IT AND TWO OR THREE COVER IT.
  · PAYLOAD: the mass needed to hold a WHOLE human distal femoral epiphysis at 100 times the EC50 is
    26 MICROGRAMS. The rat bead held 7. THE HUMAN DEPOT IS A MICROGRAM-TO-LOW-MILLIGRAM PROBLEM, not a gram
    problem, because the requirement is concentration times volume rather than milligrams per kilogram.
  ⛔ THE HONEST CORRECTION TO ALL OF PART FIVE: a depot must BALANCE CLEARANCE, not fill a volume once. Drug
  is continuously washed out by the epiphyseal vasculature, so the real requirement is a sustained RELEASE
  RATE. The fill calculation is a LOWER BOUND that shows the scale is not prohibitive; it does not set a
  dose. Clearance from the epiphysis has never been measured for any SMO agonist in any species.'
quantitative:
- parameter: SAG IS PURCHASABLE, ITS POTENCY IS VENDOR-STATED, AND A WATER-SOLUBLE SALT EXISTS
  value: 'SAG, CAS 364590-63-6, stocked by Tocris (catalogue 4366), Sigma-Aldrich / Calbiochem (566660),
    Abcam (ab142160), Santa Cruz, BOC Sciences and Focus Biomolecules, at 98 per cent or greater HPLC purity
    with certificates of analysis, for laboratory research use only. SAG DIHYDROCHLORIDE is sold separately
    (Tocris 6390) - the water-soluble salt form. Vendor-stated potency: potent Smoothened receptor agonist
    with Kd = 59 nM that antagonises cyclopamine at the Smo receptor, activating the Hedgehog pathway in
    Shh-LIGHT2 cells with EC50 about 3 nM, and inducing pathway activation independently of Patched.'
  unit: nanomolar; per cent purity
  conditions: Vendor product data retrieved 2026-08-13, tracing to chen2002smo. Research-use-only material.
  species: not_applicable
  source_ref: chen2002smo
  uncertainty: 'VENDOR-STATED POTENCY IS NOT A PRIMARY MEASUREMENT AND IS MARKED value_unverified - the Kd
    59 nM and EC50 3 nM are catalogue figures that trace to the original characterisation but were not read
    from a paper here. RESEARCH-GRADE IS NOT PHARMACEUTICAL-GRADE: 98 per cent HPLC purity permits 2 per cent
    of uncharacterised material, there is no GMP chain, no impurity qualification, no sterility, and no
    human pharmacokinetic or toxicology data of any kind for this or any other Smoothened agonist.'
- parameter: ON SMO ITSELF THE APPROVED STEROIDS EQUAL OR BEAT SAG, ON BOTH BINDING AND FUNCTION
  value: 'DIRECT SMO BINDING - SAG Kd 59 nM; clobetasol propionate 57 nM, fluticasone propionate 58 nM,
    halcinonide 78 nM (Bodipy-cyclopamine displacement); fluocinonide 1,000 nM.
    FUNCTIONAL Gli OUTPUT - SAG EC50 about 3 nM; clobetasol 0.2 nM, fluticasone 0.3 nM, fluocinonide 0.3 nM,
    halcinonide 1.8 nM.
    BINDING-TO-FUNCTION RATIO - SAG 20x, halcinonide 43x, fluticasone 193x, clobetasol 285x, fluocinonide
    3,333x.'
  unit: nanomolar
  conditions: SAG from vendor data tracing to chen2002smo; the four steroids from wang2010smo full text
    (PMC2889058). Different laboratories and different assay formats.
  species: mouse
  source_ref: wang2010smo
  uncertainty: 'CROSS-LABORATORY AND CROSS-ASSAY COMPARISON, which is the main weakness. The binding numbers
    are displacement of a labelled ligand and the functional numbers are reporter EC50s, and reporter
    amplification systematically flatters functional potency - which is why every compound shows a large
    binding-to-function gap. FLUOCINONIDE 3,333-FOLD GAP IS AN OUTLIER that neither assay explains, and it is
    the compound the window calculation ranks first, so that ranking should be held loosely.'
- parameter: THE SMO-OVER-GR WINDOW - ONLY TWO OF THE FOUR APPROVED AGONISTS HAVE ONE
  value: 'Gli-luciferase EC50 against human glucocorticoid receptor potency (ChEMBL CHEMBL2034, best and
    median of nM records):
    FLUOCINONIDE 0.3 nM vs GR 2.392 best / 5.263 median -> window 8.0x to 17.5x
    CLOBETASOL PROPIONATE 0.2 vs 0.662 / 1.456 -> 3.3x to 7.3x
    FLUTICASONE PROPIONATE 0.3 vs 0.040 / 0.500 -> 0.13x to 1.7x, NO USABLE WINDOW
    HALCINONIDE 1.8 vs 0.732 / 1.611 -> 0.41x to 0.9x, NO WINDOW, GR ENGAGED FIRST
    For reference dexamethasone GR is 0.100 best / 3.000 median across 118 records.'
  unit: fold separation between Gli EC50 and GR potency
  conditions: Computed 2026-08-13. GR records from ChEMBL, Gli EC50 from wang2010smo.
  species: human
  source_ref: wang2010smo
  atlas_derived: true
  uncertainty: 'THIS COMPARES A FUNCTIONAL REPORTER EC50 AGAINST A BINDING Ki OR IC50 AND THAT IS NOT
    APPLES-TO-APPLES - it should be read as a RANKING, not as an occupancy calculation. THREE OF THE FOUR
    REST ON ONLY TWO GR RECORDS. And the biologically relevant quantity is not GR affinity but the GR
    occupancy at which longitudinal growth is suppressed, which is chronic, cumulative and lower than any
    binding constant would suggest. A 17-fold window on paper may be no window at all in a growing child.'
- parameter: THE SYSTEMIC HUMAN EQUIVALENT DOSE OF SAG
  value: 'trompet2024 dosed SAG at 25 micrograms per gram body weight, i.e. 25 mg/kg/day, intraperitoneally,
    once daily P31-P37 in mice. FDA body-surface-area conversion with mouse Km 3 and human Km 37 gives a
    human equivalent dose of 2.03 mg/kg/day: 101 mg/day at 50 kg, 122 mg/day at 60 kg, 142 mg/day at 70 kg,
    or approximately 709 to 993 mg per seven-day pulse.'
  unit: mg/kg/day and mg/day
  conditions: Computed 2026-08-13 by standard FDA allometric scaling from the trompet2024 schedule.
  species: not_applicable
  source_ref: trompet2024
  atlas_derived: true
  uncertainty: 'BODY-SURFACE-AREA ALLOMETRY IS A STARTING-DOSE HEURISTIC FOR FIRST-IN-HUMAN ONCOLOGY TRIALS,
    NOT A PREDICTION OF EQUIVALENT TISSUE EXPOSURE. It ignores species differences in protein binding,
    metabolism and clearance, all of which matter enormously for a compound with cLogP 6.79. The mouse route
    was INTRAPERITONEAL and no oral bioavailability figure exists for SAG in any species. And the mouse
    experiment measured a stem-cell endpoint, not bone length, so this scales a dose that has never been
    shown to lengthen a bone systemically.'
- parameter: THE LOCAL DEPOT - CONCENTRATION, DIFFUSION REACH AND PAYLOAD AT HUMAN SCALE
  value: 'CONCENTRATION: the trompet2024 bead held 7 micrograms of SAG = 14.3 nanomoles; distributed through
    an estimated 19 microlitre P30 rat distal femoral epiphysis that is about 750 nanomolar, roughly 250-fold
    over the 3 nM EC50.
    DIFFUSION REACH over the bead measured lifetime (Gli1-LacZ present at 1 week, gone by 3 weeks), for a
    500 Da solute in cartilage: sqrt(2Dt) = 19.0 mm at D = 1e-6 cm2/s, 26.9 mm at 2e-6, 33.0 mm at 3e-6.
    Human adolescent distal femoral epiphysis is 70-80 mm wide, so the half-distance from a central placement
    is 35-40 mm.
    PAYLOAD to hold a human epiphysis at a target concentration: half-epiphysis (35 mm sphere, 22 mL) needs
    0.03 micrograms at 1x EC50, 0.33 at 10x, 3.30 at 100x; whole epiphysis (70 mm sphere, 180 mL) needs 0.26,
    2.64 and 26.41 micrograms respectively. The rat bead held 7 micrograms.'
  unit: micrograms; millimetres; nanomolar
  conditions: Computed 2026-08-13 from the trompet2024 bead composition and lifetime, with an estimated rat
    epiphysis volume and literature-range cartilage diffusion coefficients.
  species: not_applicable
  source_ref: trompet2024
  atlas_derived: true
  uncertainty: 'EVERY NUMBER HERE IS ORDER-OF-MAGNITUDE AND THE CENTRAL ONE IS WRONG IN A KNOWN DIRECTION.
    A DEPOT MUST BALANCE CLEARANCE, NOT FILL A VOLUME ONCE - drug is continuously removed by the epiphyseal
    vasculature, so the fill calculation is a LOWER BOUND on payload and not a dose. The rat epiphysis volume
    is estimated rather than measured; the diffusion coefficient of SAG in cartilage has never been measured
    in any species; sqrt(2Dt) ignores binding, metabolism and the fact that the resting zone is a surface
    rather than a filled volume; and the human epiphysis is not a sphere. What survives all of that is the
    SCALE - micrograms to low milligrams and tens of millimetres - which is the only claim being made.'
localization:
- the distal femoral secondary ossification centre, immediately above the resting zone, which trompet2024
  authors describe as stable, relatively large and easily accessible in humans
human_evidence: absent
human_evidence_note: 'No Smoothened agonist has ever been given to a human for any indication and there are
  zero registry trials. The four glucocorticoid SMO agonists have extensive human safety data as
  corticosteroids only, and their glucocorticoid arm is a documented human growth suppressant. Every dose
  figure in this node is scaled or computed, none is observed.'
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: 'Allometric scaling of a research chemical from a seven-day mouse stem-cell
  experiment, and a depot calculation resting on estimated volumes and an unmeasured diffusion coefficient.
  The window calculation compares functional against binding potencies across laboratories. None of this has
  been observed in any human, and the local route additionally requires a surgical placement that has never
  been performed for this purpose.'
confidence: D
claim_grades:
- claim: A dosable Smoothened agonist exists.
  grade: B
  basis: 'SAG (CAS 364590-63-6) is stocked by at least six suppliers at 98 per cent or greater HPLC purity
    with certificates of analysis, including as the water-soluble dihydrochloride salt, and its dose,
    schedule and route in the one in vivo growth-plate experiment are published. Grade B rather than A
    because research-use-only material is not pharmaceutical-grade: no GMP chain, no impurity qualification,
    no sterility, and no human pharmacokinetics or toxicology for any SMO agonist.'
- claim: SAG is the most potent Smoothened agonist available.
  grade: X
  basis: 'NO. On direct SMO binding, clobetasol propionate (57 nM), fluticasone propionate (58 nM) and
    halcinonide (78 nM) are indistinguishable from SAG (Kd 59 nM), and on functional Gli output all four
    approved steroids BEAT it - 0.2 to 1.8 nM against about 3 nM. The approved compounds are equal or
    superior at Smoothened. What SAG uniquely has is the ABSENCE of a glucocorticoid receptor.'
- claim: All four approved SMO agonists have a usable window over the glucocorticoid receptor.
  grade: X
  basis: 'ONLY TWO DO. Fluocinonide 8.0-17.5x and clobetasol propionate 3.3-7.3x; fluticasone propionate
    0.13-1.7x and halcinonide 0.41-0.9x have NO usable window, with GR engaged at or below the SMO
    concentration. Halcinonide, which R371 ranked first on physicochemistry, is worst on the only criterion
    that survived.'
- claim: Fluocinonide is the compound to use.
  grade: D
  basis: 'IT RANKS FIRST AND THE RANKING IS THE LEAST SECURE OF THE FOUR. Its window is 8-17.5x, the best,
    but only because its GR potency is the weakest - and its own Gli EC50 of 0.3 nM sits 3,333-fold below its
    SMO binding of 1,000 nM, an outlier gap that neither assay explains. CLOBETASOL PROPIONATE IS THE MORE
    DEFENSIBLE PICK: a 3.3-7.3x window, the best Gli potency of all four, and SMO binding equal to SAG.'
- claim: The local depot is feasible at human scale.
  grade: D
  basis: 'THE ARITHMETIC IS FAVOURABLE ON ALL THREE AXES. Concentration - the rat bead ran about 250-fold over
    EC50, so the depot is a reservoir rather than a potency-limited dose. Reach - 19 to 33 mm of diffusion
    over the bead measured three-week lifetime against a 35-40 mm half-epiphysis, so one central depot
    reaches most of a human epiphysis and two or three cover it. Payload - 26 micrograms holds a whole human
    epiphysis at 100 times EC50, against 7 micrograms in the rat bead. Grade D because a depot must balance
    clearance rather than fill a volume, epiphyseal clearance has never been measured, and the diffusion
    coefficient is assumed.'
