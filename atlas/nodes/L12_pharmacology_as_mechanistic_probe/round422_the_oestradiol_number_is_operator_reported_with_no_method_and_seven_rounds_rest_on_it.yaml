claim_grades:
  - claim: No assay method for the subject's oestradiol is recorded anywhere in the atlas
    grade: A
    basis: grep of every node and of CLAUDE.md; R355 records it explicitly as an operator-stated value
  - claim: Seven rounds take the figure as a premise, and R360's regime framework is the load-bearing one
    grade: A
    basis: counted directly; R360 states the dependency in its own text
  - claim: A near-normal bone-age advance would falsify the reported oestradiol
    grade: C
    basis: >-
      an inference from lanfranco2008's natural experiment, in which near-complete oestrogen absence left
      bone age at 15.5 at chronological age 26.8. It is a strong qualitative expectation, not a calibrated
      dose-response between oestradiol and bone-age velocity
  - claim: The ferris2017 2x2 resolves target engagement without mass spectrometry
    grade: C
    basis: >-
      the discriminating variables are testosterone, LH, FSH and haematocrit, all routine. Rests on a
      single retrospective series of 21 boys for the expected pattern
  - claim: Anastrozole should be stopped or changed
    grade: E
    basis: >-
      NO, and nothing here supports it. R274 and R329 keep it as the best agent in class and R363 calls
      adherence the highest-leverage item in the file
