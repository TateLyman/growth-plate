id: round422_the_oestradiol_number_is_operator_reported_with_no_method_and_seven_rounds_rest_on_it
name: >-
  R422: the dependency audit on the oestradiol figure. It is operator-reported, no assay method is
  recorded anywhere in the atlas, R355 itself noted it sits below routine immunoassay sensitivity, and
  SEVEN rounds now rest on it. The round's contribution is not the work order - it is that the bone-age
  film FALSIFIES the blood test, and that a 2x2 with the ferris2017 panel resolves it without needing
  mass spectrometry at all
aliases:
  - oestradiol assay floor
  - Regime 2 dependency
  - aromatase inhibitor target engagement 2x2
  - bone age falsifies the assay
type: process
layer: L12
stub: false
summary: >-
  An external audit named this as its item 2. R419 had found the problem and not acted on it. R422 does
  the audit properly and adds the part that makes it decidable without new technology.

  ⛔ ONE - THE PROVENANCE, AND IT IS WORSE THAN "UNVERIFIED". Grep of every node and of CLAUDE.md returns
  NO ASSAY METHOD ANYWHERE for the subject's oestradiol. The value enters the atlas in R355's node as, in
  its own words, an OPERATOR-STATED SUBJECT VALUE of 3.3 to 6 pmol/L on anastrozole 1 mg. That same node,
  at line 113, already records that the value is operator-reported at a concentration below routine
  immunoassay sensitivity. So the file flagged its own problem in the round that introduced the number,
  and then built on it for sixty rounds anyway. This is not a new discovery; it is an unactioned flag,
  which is CORR-352's failure mode in its most expensive form.

  ⛔ TWO - THE DEPENDENCY, COUNTED. Seven rounds name the value: R351, R355, R358, R359, R360, R363 and
  R419. What each takes from it:
  · R355 - "he is 10 to 25 times below the closure threshold", the whole argument that the hormonal
    accelerator is covered and the residual is the pool.
  · R360 - THE LOAD-BEARING ONE. Its entire Regime 1 versus Regime 2 framework turns on anastrozole
    having removed the oestrogen deadline. Regime 2 is what prices throughput agents at near zero, makes
    the pool the binding constraint, and gives the SAG programme its priority. R360 states the dependency
    itself.
  · R351 and R358 - the ligand-deplete argument that made a receptor degrader coherent.
  · R359 - "his ER-alpha is overwhelmingly unliganded".
  · R339 - the degrader gate, which is the round that first computed that 6.5 pmol/L is about 1.8 pg/mL
    and therefore below the functional sensitivity of routine immunoassays.
  If the number is an assay-floor artefact, REGIME 2 DOES NOT HOLD, and the de-ranking of every throughput
  arm goes with it.

  ⭐⭐ THREE - AND R419 SUPPLIED THE REASON THIS IS NOW A LIVE ALTERNATIVE RATHER THAN A CAVEAT.
  `ferris2017`, 21 boys on an aromatase inhibitor, split by Tanner stage: OESTRADIOL DID NOT
  SIGNIFICANTLY CHANGE IN EITHER GROUP, while peak testosterone rose to 650 +/- 458 ng/dL early and
  1156 +/- 302 ng/dL late, and in late puberty FSH (p=0.002), LH (p=0.002), haematocrit (p=0.0001), BMI
  z-score (p=0.0005) and acne (p=0.01) all rose. The authors single out LATE-PUBERTY INITIATION as the
  concerning configuration, which is this subject's exact configuration. Mechanistically coherent -
  blocking aromatase releases hypothalamic feedback, raises LH and testosterone, and the risen substrate
  can overwhelm a partial blockade.

  ⭐⭐⭐ FOUR - THE CONTRIBUTION THIS ROUND ADDS: THE BONE-AGE FILM FALSIFIES THE BLOOD TEST, AND NOBODY
  HAS FRAMED IT THAT WAY. The atlas has treated delta-bone-age over delta-chronological-age as a
  measurement to be taken and the oestradiol as a measurement already taken. THE RELATIONSHIP IS THE
  OTHER WAY ROUND. If oestradiol were truly 3.3 to 6 pmol/L - ten to twenty-five fold below the
  concentration at which closure was observed to proceed - then skeletal maturation should be close to
  arrested. That is what the human natural experiment looks like: `lanfranco2008`'s aromatase-deficient
  man was BONE AGE 15.5 AT CHRONOLOGICAL AGE 26.8, with unfused epiphyses and continuing growth.
  → SO A NEAR-NORMAL delta-BA over delta-CA ON THE CURRENT STACK IS PRIMA FACIE EVIDENCE THAT THE
  OESTRADIOL NUMBER IS WRONG, or that closure in this subject is oestrogen-independent - and R360 already
  supplies the decision rule for telling those apart (0.2 to 0.4 confirms Regime 2; 0.7 to 1.0 despite a
  low reported E2 matches `smith2008`'s complete-receptor-loss residual, in which case no
  oestrogen-directed agent reaches it).
  ⭐ The film is therefore not merely the most overdue measurement in the file. It is a FALSIFICATION TEST
  of the number seven rounds depend on, and it uses radiographs he may already have.

  ⭐⭐ FIVE - AND THE 2x2 THAT RESOLVES IT WITHOUT MASS SPECTROMETRY. `ferris2017` gives the engagement
  panel, and crossing it with the oestradiol reading is diagnostic in every cell:
  · E2 GENUINELY LOW and T/LH/FSH RAISED - the aromatase inhibitor is engaging and suppressing. The
    current framework stands, Regime 2 holds, and everything built on it is safe.
  · E2 GENUINELY LOW and T/LH/FSH NOT RAISED - the low oestradiol is not being produced by the drug.
    Something else is suppressing it and should be found before any further inference.
  · E2 NOT ACTUALLY SUPPRESSED and T/LH/FSH RAISED - THIS IS `ferris2017`'s CONFIGURATION. The drug is
    doing things and is not lowering oestradiol. Regime 2 fails, the throughput arms are re-priced upward,
    and R360, R355, R351, R358 and R359 all need restating.
  · E2 NOT SUPPRESSED and T/LH/FSH NOT RAISED - the drug is not being absorbed or not being taken.
    R363 calls adherence the highest-leverage item in the file, so this is the cheapest thing to exclude.
  ⭐ Note that THREE OF THE FOUR CELLS ARE REACHABLE ON A ROUTINE PANEL PLUS A FULL BLOOD COUNT, because
  the discriminating variables are testosterone, LH, FSH and HAEMATOCRIT rather than oestradiol itself.
  The mass-spectrometry oestradiol sharpens the answer; it is not required to get one.
  ⚠ And the comparator for testosterone is not a normal reference range - it is `ferris2017`'s
  1156 +/- 302 ng/dL in Tanner IV-V boys ON an aromatase inhibitor.

  ⛔ SIX - THE HONEST COUNTERWEIGHT, SO NOBODY OVERREADS THIS. `ferris2017` is n=21, retrospective, mean
  0.9 years of treatment in the late-puberty group, and its height endpoint is PREDICTED adult height. It
  cannot establish that anastrozole fails, and nothing here is an argument to stop it - R274 and R329
  keep it as the best agent in its class and R363 calls adherence the highest-leverage item in the file.
  What is established is narrower and is a fact about this atlas rather than about the drug: TARGET
  ENGAGEMENT IN THIS SUBJECT HAS NEVER BEEN CHECKED, the check is a blood draw, and seven rounds have been
  built on an unverified number that the file itself flagged as unverifiable on the day it was introduced.

  ⭐ THE RULE, so this does not recur: any subject-specific value that enters this atlas from the operator
  carries the ASSAY METHOD or it is recorded as UNVERIFIED and may not be used as a premise. The
  oestradiol figure should be restated in every round that uses it as "operator-reported, method unknown,
  at a concentration below routine immunoassay functional sensitivity" until the method is confirmed.
