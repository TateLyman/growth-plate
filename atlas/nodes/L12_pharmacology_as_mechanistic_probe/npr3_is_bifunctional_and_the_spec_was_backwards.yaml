id: npr3_is_bifunctional_and_the_spec_was_backwards
name: THE SPEC ASKED FOR AN ANTAGONIST AND THAT IS THE WRONG MOLECULE - NPR-C clears CNP in cartilage and
  SIGNALS protection in the aorta, so the drug must occupy without blocking
aliases:
- is the NPR3 arm worth adding
- why M372049 is the wrong compound
- NPR-C aortopathy
- what compound do we actually want on the clearance arm
- cANF agonist versus antagonist
type: hypothesis
layer: L12
stub: false
summary: 'THE USER ASKED WHETHER THIS ARM IS WORTH ADDING TO THE STACK AND THE ANSWER IS NOT YET, FOR A
  REASON THAT ALSO TELLS US WHICH MOLECULE TO BUILD. The aortopathy found at round 150 is not an artefact
  of tall habitus and not a consequence of raised CNP. It is a direct consequence of losing NPR-C itself,
  and that fact inverts the compound specification this atlas has carried since thread 3.
  NPR-C DOES TWO JOBS AND THEY HAVE OPPOSITE SIGNS FOR THIS PROGRAMME. In cartilage it is a CLEARANCE SINK:
  it internalises CNP, the plate makes none of its own, and blocking the sink raises local ligand for NPR-B.
  That is the growth mechanism and it wants NPR-C SILENCED. In the vasculature it is a Gi-COUPLED SIGNALLING
  RECEPTOR, and aubdool2025 shows it is the receptor through which CNP protects the aorta - not NPR-B. That
  is the safety mechanism and it wants NPR-C ACTIVE.
  THE EVIDENCE THAT SETTLES WHICH WAY THE AORTOPATHY RUNS. Global NPR-C-null mice have an ELONGATED STATURE
  AND LONG DIGITS at baseline - they reproduce the human growth phenotype - AND a DILATED ASCENDING AORTA at
  baseline mirroring Marfan syndrome. Angiotensin II augments that dilation WITH NO CHANGE IN BLOOD
  PRESSURE, so it is structural rather than haemodynamic. CNP infusion protects wild-type animals and does
  NOT protect NPR-C-nulls, so the protection is routed through NPR-C. The mouse therefore reproduces both
  halves of the human biallelic phenotype, which removes the two comfortable explanations - that the human
  aortic dilatation was a Z-score artefact of extreme height, or a marfanoid habitus without mechanism.
  IT IS NOT A CNP-ELEVATION EFFECT, AND THAT MATTERS FOR THE REST OF THE STACK. CNP is aortoPROTECTIVE here;
  CNP-null mice in the same paper have WORSE aneurysms. And vosoritide, which raises CNP-axis signalling
  pharmacologically in thousands of children, carries no aortic signal in any safety table this atlas holds.
  SO THE LIGAND ARM IS NOT IMPLICATED. The liability is specific to REMOVING NPR-C.
  AND THAT IS WHY THE COMPOUND SPECIFICATION WAS BACKWARDS. the_compound_this_thread_needs asks for a
  SUB-KILODALTON NPR3-SELECTIVE ANTAGONIST, and at round 145 this atlas identified M372049 as exactly that
  molecule - 887 Da, best-in-class, published synthesis. IN THIS PAPER M372049 IS THE TOOL USED TO ABOLISH
  CNP AORTOPROTECTION in primary human aortic smooth muscle cells at 10 micromolar. A functional antagonist
  of NPR-C signalling is predicted to phenocopy the NPR-C-null aorta. M372049 IS THE WRONG MOLECULE, and
  every published use of it - villar2007, smith2022, aubdool2025 - is to block a protective vascular action.
  THE RIGHT PROFILE IS AN OCCUPANT THAT SIGNALS, NOT A BLOCKER. cANF(4-23) is described throughout this
  literature as a selective NPR-C AGONIST, and infused at 0.4 mg/kg/day it REDUCED ascending and abdominal
  aortic expansion in wild-type mice while downregulating Tgf-beta1, Smad2, Mmp2/9, Bmpr2, Runx2, Eng and
  Bax. The same molecule is the classical tool for BLOCKING NP CLEARANCE. One ligand, both properties:
  it occupies the clearance receptor - which raises endogenous ligand and is the growth mechanism - while
  supplying the Gi-coupled signal that protects the aorta.
  WHICH RESHUFFLES THE TWO CANDIDATES COMPLETELY. nishizawa2017 compound 23 is built FROM the cANF/ANP(5-15)
  scaffold and its own paper attributes its final substitutions to increased NPR3 AGONIST ACTIVITY. It is in
  the protective class. M372049 is in the antagonist class. The molecule with the better mass, the better
  partition and the published synthesis is the one with the wrong pharmacology, and the molecule with the
  right pharmacology is the bigger peptide that has never been given for bone.
  SO IS THE ARM WORTH ADDING. NOT NOW, AND THE REASONS ARE NOT THE ONES THIS ATLAS HAD. It is additive with
  a CNP analogue on two independent experiments; the human effect is large, proportionate and includes
  lumbar spine; exposure has 95 to 381-fold headroom. Against that: NO pharmacological NPR3 ligand has a
  bone endpoint in ANY species; the NPR-B counter-screen does not exist for either candidate; the
  best-characterised small molecule has the wrong sign at the receptor; and the human dosage series is n = 4
  carriers with one at the population mean. IT IS WORTH ONE EXPERIMENT, NOT A PLACE IN THE STACK - and that
  experiment must now carry an AORTIC ENDPOINT alongside the bone endpoint, which nobody has ever paired.'
quantitative:
- parameter: 'THE MOUSE NULL REPRODUCES BOTH HALVES OF THE HUMAN PHENOTYPE - GROWTH AND AORTA - WHICH KILLS
    THE ARTEFACT EXPLANATIONS'
  value: 'Global NPR-C-null mice have ELONGATED STATURE AND LONG DIGITS at baseline and a DILATED ASCENDING
    AORTA at baseline, described as mirroring Marfan syndrome. Angiotensin II (1.44 mg/kg/day, 28 days)
    AUGMENTED ascending thoracic dilation in NPR-C-null against control WITH NO SIGNIFICANT CHANGE IN BLOOD
    PRESSURE, and worsened abdominal disease with immune infiltrate, elastin strand breaks, fibrosis and
    calcification. CNP infusion at 0.2 mg/kg/day reduced aortic expansion in WILD-TYPE but NOT in NPR-C-null
    animals'
  unit: qualitative structural phenotype
  conditions: aubdool2025, male mice only, AAV-PCSK9-D377Y gain-of-function plus Western diet, or ApoE-null
    background, with angiotensin II by osmotic minipump for 28 days; n = 5 to 8 per group.
  species: mouse
  source_ref: aubdool2025
  uncertainty: 'THIS REMOVES THE TWO COMFORTABLE READINGS OF THE HUMAN AORTIC FINDING. It is not a Z-score
    artefact of extreme height, because the mouse shows it; and it is not an unexplained marfanoid
    association, because deleting the receptor produces it and restoring the ligand does not fix it.
    LIMITS THAT ARE REAL. The aneurysm model is AGGRESSIVE and multi-hit - angiotensin II plus a PCSK9
    gain-of-function plus a Western diet - which is not normal physiology and not a growing child; the
    BASELINE dilation is the more transferable observation and it is reported qualitatively against an
    ApoE-null comparator rather than as a clean wild-type contrast. Male mice only. And a germline null is
    not partial pharmacological blockade for a few years, which is the SD-001 rule and it applies here in
    the direction that FAVOURS the drug.'
- parameter: 'THE COMPOUND SPECIFICATION IS INVERTED - THE ANTAGONIST ABOLISHES PROTECTION, THE AGONIST
    DELIVERS IT'
  value: 'The selective NPR-C AGONIST cANF(4-23) at 0.4 mg/kg/day by osmotic pump for 28 days SIGNIFICANTLY
    REDUCED expansion of both ascending and abdominal aorta in wild-type mice, with downregulation of
    Tgf-beta1, Smad2, Mmp2/9, Bmpr2, Runx2, Eng and Bax. The selective NPR-C ANTAGONIST M372049 at 10
    micromolar ABOLISHED the protective effect of CNP on angiotensin-II-driven inflammation, remodelling,
    phenotypic switching and apoptosis in PRIMARY HUMAN AORTIC SMOOTH MUSCLE CELLS'
  unit: qualitative direction of effect
  conditions: aubdool2025 Figures 6 and 7; in vivo mouse for cANF(4-23), primary human aortic smooth muscle
    cells for the M372049 blockade, n = 4 independent experiments.
  species: multiple
  source_ref: aubdool2025
  uncertainty: 'THE AGONIST/ANTAGONIST DISTINCTION AT NPR-C IS NOW LOAD-BEARING RATHER THAN SEMANTIC, WHICH
    IS EXACTLY WHAT CORR-156 WARNED ABOUT WITHOUT KNOWING WHY IT MATTERED. Both classes occupy the receptor
    and both therefore block clearance and raise endogenous ligand - the growth mechanism is common to them.
    They differ in whether they supply the Gi-coupled signal, and that is the difference between protecting
    the aorta and removing its protection. WHAT IS NOT ESTABLISHED: nobody has shown that cANF-class
    agonism is SUFFICIENT to prevent aortopathy during sustained clearance blockade, which is the actual
    therapeutic situation; the protective experiment is 28 days in an induced model, not chronic dosing in a
    growing animal. AND compound 23 Gi agonism rests on ONE PHRASE in its own paper - increased NPR3 agonist
    activity - with no cAMP readout reported, so its class membership is inferred from scaffold and from
    that sentence, not measured.'
- parameter: 'THE LIGAND ARM IS NOT IMPLICATED, AND THAT SEPARATION IS WHAT KEEPS THE REST OF THE STACK INTACT'
  value: 'CNP is aortoPROTECTIVE - endothelium-restricted, fibroblast-restricted and global CNP-null mice
    all show AGGRAVATED aneurysm with greater dilation, fibrosis, elastin degradation and macrophage
    infiltration, and CNP infusion rescues wild-type animals. Against that, the vosoritide safety record
    across the pooled randomised trials records injection-site reaction, urticaria and swelling as the only
    elevated risks, with no aortic or structural cardiovascular signal in any table this atlas holds'
  unit: qualitative
  conditions: aubdool2025 for the CNP-null aggravation; cnpmeta2026 pooled safety table and the 2026
    vosoritide systematic review for the human safety record.
  species: multiple
  source_ref: aubdool2025
  uncertainty: 'THIS IS THE ROW THAT PREVENTS THE AORTIC FINDING FROM CONTAMINATING THE WHOLE CNP AXIS.
    Raising CNP is protective; removing NPR-C is harmful; they are different interventions and only the
    second is implicated. THE HUMAN SAFETY ARGUMENT IS AN ABSENCE, HOWEVER, AND SHOULD BE READ AS ONE -
    aortic root dimensions are not a prespecified endpoint in any vosoritide trial this atlas holds, so
    no aortic signal means it was not looked for as much as it means it was not there. canopyspine2026
    imaged the SPINE, not the aorta.'
localization:
- 'growth plate cartilage: NPR-C is a clearance sink and blocking it is the growth mechanism'
- 'aorta and vascular smooth muscle: NPR-C is the Gi-coupled receptor through which CNP protects structure,
  and blocking it is the liability'
human_evidence: indirect
human_evidence_note: 'The decisive structural experiments are mouse; the human components are primary
  aortic smooth muscle cells, aneurysmal tissue expression, and the 2 of 4 biallelic patients with
  progressive aortic root dilatation reported in boudin2018.'
species_basis:
- mouse
- human
translation_risk: moderate
translation_risk_reason: 'The mouse null reproduces both the growth and the aortic halves of the human
  biallelic phenotype, which is unusually good concordance - but the aneurysm challenge model is aggressive
  and multi-hit, and germline deletion is not partial pharmacological blockade.'
confidence: C
claim_grades:
- claim: The aortic phenotype of NPR3 loss is caused by losing NPR-C itself, not by raised natriuretic peptide.
  grade: B
  basis: 'Global NPR-C-null mice have baseline ascending aortic dilation and reproduce the growth phenotype
    too; CNP protects wild-type but not NPR-C-null animals, so protection is routed through the receptor;
    and CNP-null mice have WORSE disease, so the ligand is protective rather than harmful. Concordant with
    2 of 4 human biallelic cases. Not A because the in vivo work is one paper in an aggressive induced model
    in male mice only.'
- claim: M372049 is the compound this route needs.
  grade: X
  basis: 'WITHDRAWN. Round 145 identified it as satisfying the sub-kilodalton NPR3-selective antagonist
    specification. aubdool2025 uses that same molecule at 10 micromolar as the tool that ABOLISHES CNP
    aortoprotection in human aortic smooth muscle cells, and every other published use - villar2007,
    smith2022 - is likewise to block a protective vascular action. A functional antagonist of NPR-C
    signalling is predicted to phenocopy the null aorta.'
- claim: The right molecule occupies NPR-C and signals through it rather than blocking it.
  grade: C
  basis: 'cANF(4-23), the classical clearance-blocking ligand, is a selective NPR-C AGONIST and reduced
    aortic expansion in vivo while downregulating fibrosis, remodelling, calcification and apoptosis genes.
    Occupancy delivers the growth mechanism and agonism delivers the protection. Not higher because nobody
    has tested whether agonism is SUFFICIENT to prevent aortopathy during sustained clearance blockade, and
    no cANF-class ligand has a bone endpoint.'
- claim: The NPR3 arm should be added to the stack for this case.
  grade: D
  basis: 'NOT YET. For it - additive with a CNP analogue on two independent experiments, large proportionate
    human effect including lumbar spine, 95 to 381-fold exposure headroom, clean GWAS gene assignment.
    Against it - no pharmacological NPR3 ligand has a bone endpoint in any species, the NPR-B counter-screen
    does not exist for either candidate, the best-characterised small molecule has the wrong sign at the
    receptor, the carrier series is n = 4 with one at the population mean, and the common-variant eQTL
    direction is inconsistent. Worth one experiment, not a place in the stack.'
