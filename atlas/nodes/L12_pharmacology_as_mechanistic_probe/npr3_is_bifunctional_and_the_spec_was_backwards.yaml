- g_l12_npr3_agonist_vs_antagonist_at_the_aorta
contradicts:
- 'REVERSES the central design statement of the_compound_this_thread_needs, which specifies a SUB-KILODALTON
  NPR3-SELECTIVE ANTAGONIST. That specification was derived from cartilage constraints alone and did not
  model NPR-C signalling in the vessel wall. The corrected specification is an NPR-C OCCUPANT THAT AGONISES
  - small, clearance-blocking, and Gi-active rather than Gi-silent.'
