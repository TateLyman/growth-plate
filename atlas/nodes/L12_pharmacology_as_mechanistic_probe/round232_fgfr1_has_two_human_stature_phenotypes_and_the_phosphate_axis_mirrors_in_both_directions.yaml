contradicts:
- >-
  CORR-217's statement that neither FGFR1 nor FGFR4 has any reported human stature phenotype, and its use as
  an anchor in rounds 230 and 231. False for FGFR1 in two conditions. Recorded as CORR-240.
- >-
  Any reading of this round that inverts the anchor into "FGFR1 inhibition subtracts height". That is the
  retracted receptor ledger rebuilt from the other side and CORR-046's first reason forbids it.
- >-
  Any node citing kot2026 for an increase in bone LENGTH. The result is female only and CORR-191 excludes it.
