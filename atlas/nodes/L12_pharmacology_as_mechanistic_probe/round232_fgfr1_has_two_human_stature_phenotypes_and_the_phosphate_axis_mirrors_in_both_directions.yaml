id: round232_fgfr1_has_two_human_stature_phenotypes_and_the_phosphate_axis_mirrors_in_both_directions
name: >-
  ROUND 232 - FGFR1 has two human stature phenotypes and both are SHORT, which falsifies the anchor rounds
  230 and 231 leaned on; the phosphate axis mirrors in both directions and confirms the attribution instead;
  and the mouse paper the atlas cited at round 223 had two results nobody extracted
type: hypothesis
layer: L12
aliases:
- FGFR1 has a human stature phenotype after all
- osteoglophonic dysplasia and the MED frameshifts
- the phosphate mirror
- the anchor withdrawn not inverted
- round 232
stub: false
summary: |
  THE LOAD-BEARING GAP AFTER ROUND 231 WAS WHETHER FGFR1 COVERAGE CONTRIBUTES HEIGHT. Rounds 230 and 231
  answered it by quoting CORR-217 - "neither FGFR1 nor FGFR4 has any reported human stature phenotype at
  all" - and concluding that dropping FGFR1 coverage costs nothing. THAT SENTENCE IS FALSE FOR FGFR1.

  FGFR1 HAS AT LEAST TWO HUMAN STATURE PHENOTYPES AND THEY SIT AT OPPOSITE ENDS OF RECEPTOR ACTIVITY.
  OSTEOGLOPHONIC DYSPLASIA is caused by GAIN-of-function FGFR1 variants in or near the transmembrane domain
  and gives PROFOUND SHORT STATURE WITH RHIZOMELIA, multisuture craniosynostosis, multiple cystic long-bone
  lesions, failure of tooth eruption, and in some patients FGF23-mediated HYPOphosphataemia. At the other
  end, aubert2026 assembles THIRTEEN INDIVIDUALS IN THREE FAMILIES carrying C-terminal frameshift variants
  in FGFR1 - all three producing the same 164-residue C-terminal elongation, modelled as potentially
  ANTIMORPHIC - with MULTIPLE EPIPHYSEAL DYSPLASIA: abnormal and DELAYED EPIPHYSEAL OSSIFICATION, complete
  penetrance, onset 3 to 13 years, GENU VALGUM very frequent and usually surgically corrected,
  hypogonadotropic hypogonadism in about half, and ADULT HEIGHT MEDIAN 164.0 cm IN MALES (-1.7 SDS) AND
  153.1 cm IN FEMALES (-1.6 SDS). BOTH DIRECTIONS ARE SHORT. FGFR1 is dose-sensitive for normal epiphyseal
  ossification in humans and there is no direction of perturbation that makes a person taller.

  AND THE NAIVE INFERENCE FROM THAT IS FORBIDDEN, WHICH IS THE POINT OF THE ROUND. The tempting reading -
  reduced FGFR1 function costs 1.7 SD, so FGFR1 inhibition subtracts height, so switching to FGFR3-selective
  GAINS - IS THE RETRACTED RECEPTOR LEDGER REBUILT, and CORR-046's first reason forbids it in exactly these
  words: germline-and-developmental applied to partial-and-postnatal. aubert2026's variant is present from
  conception with onset at 3 to 13 years; erdafitinib removes a fraction of FGFR1 in an already-built
  adolescent plate for months. AND THE COUNTER-EXAMPLE IS THIS ATLAS'S OWN BEST DATA POINT - the largest
  human growth response ever recorded came from DEBIO1347, WHICH COVERS FGFR1. Whatever FGFR1 inhibition
  does, it did not prevent +2.43 height SD over forty months.

  SO THE ANCHOR IS WITHDRAWN, NOT INVERTED, AND THE RECOMMENDATION SURVIVES ON ITS OTHER LEG. The case for
  FGFR3-selectivity now rests ENTIRELY on the phosphate arm - 75 and 80 per cent on the two FGFR1-covering
  agents against 13 per cent on the FGFR1-sparing one - which is measured, in humans, at pharmacological
  doses. That was always the strong leg; "costs nothing on the other side" was decoration and it was false.

  AND HUMAN GENETICS CONFIRMS THE PHOSPHATE ATTRIBUTION FROM THE OTHER DIRECTION, WHICH IS NEW AND CLEAN.
  FGFR1 GAIN of function in osteoglophonic dysplasia produces FGF23-mediated HYPOPHOSPHATAEMIA. FGFR1
  INHIBITION produces HYPERPHOSPHATAEMIA. Two opposite perturbations of one receptor, two opposite phosphate
  phenotypes, both in humans. Round 231 established the attribution pharmacologically across three agents;
  this closes it genetically across two directions. THE PHOSPHATE ARM IS FGFR1 AND THE QUESTION IS SETTLED.

  A PHENOTYPIC CONVERGENCE WORTH RECORDING, ON A DEFORMITY THIS ATLAS HAD LOGGED AND NEVER CONNECTED.
  aubert2026's FGFR1 patients get GENU VALGUM, very frequent, usually needing surgery. farouk2023 subject 3,
  on the FGFR1-covering Debio1347 for forty months, developed BILATERAL COXA VALGA. reddy2026's
  hyperphosphataemic tumoral calcinosis patient - genetic loss of FGF23, which signals through FGFR1 -
  presented with a VALGUS slipped capital femoral epiphysis, which is the rare direction. VALGUS DEFORMITY
  PLUS AN EPIPHYSEAL DISORDER APPEARS IN GENETIC FGFR1 DYSFUNCTION, IN GENETIC FGF23-AXIS LOSS, AND UNDER
  PHARMACOLOGICAL FGFR1 INHIBITION. Three routes to one axis and one deformity.

  AND THE MOUSE PAPER THE ATLAS HAS CITED SINCE ROUND 223 HAD TWO RESULTS NOBODY EXTRACTED. kot2026 is
  infigratinib in Aga2/+ mice, cited here for wild-type harm. Read in full it also reports that the growth
  plate lengthened IN BOTH SEXES AND SPECIFICALLY IN THE PROLIFERATIVE ZONE, with reduced phospho-ERK1/2 and
  SOX9 in lower hypertrophic chondrocytes - a zone-level decomposition this atlas has wanted for many
  rounds. AND THAT TREATED MALES OF BOTH GENOTYPES SHOWED ELEVATED SERUM TESTOSTERONE. If that translated to
  humans it would be bad in a specific way - raised testosterone accelerates fusion and shortens the window
  that rounds 228 and 229 identified as the only remaining lever - and it interacts directly with the
  anastrozole already in this stack. IT IS A MOUSE FINDING AND IT IS FILED AS A GAP, NOT A FACT.

  ONE MORE THING kot2026 SETTLES BY THIS ATLAS'S OWN RULE. Its femur length result is FEMALE ONLY. CORR-191
  holds that a length result in one sex only is not a length result. So kot2026 supplies a growth plate
  result and a bone-strength result and NOT a length result, and any node citing it for length is
  overreading it.
quantitative:
- parameter: the two human FGFR1 stature phenotypes, at opposite ends of receptor activity
  value: >-
    OSTEOGLOPHONIC DYSPLASIA, FGFR1 GAIN of function in or near the transmembrane domain - PROFOUND SHORT
    STATURE WITH RHIZOMELIA, multisuture craniosynostosis including cloverleaf skull, short broad hands and
    feet, multiple cystic long-bone lesions, failure of tooth eruption, and FGF23-mediated
    HYPOPHOSPHATAEMIA in some patients. FGFR1 C-TERMINAL FRAMESHIFT MULTIPLE EPIPHYSEAL DYSPLASIA, 13
    individuals in 3 families, all variants producing the same 164-residue C-terminal elongation modelled
    as potentially ANTIMORPHIC - delayed and abnormal epiphyseal ossification, complete penetrance, onset 3
    to 13 years, GENU VALGUM very frequent and usually surgically corrected, hypogonadotropic hypogonadism
    in about half, ADULT HEIGHT MEDIAN 164.0 cm MALES (-1.7 SDS) and 153.1 cm FEMALES (-1.6 SDS)
  unit: adult height in cm and SDS, by FGFR1 variant class
  conditions: germline human variants, present from conception, with childhood symptom onset
  species: human
  source_ref: aubert2026
  uncertainty: >-
    THE MED COHORT IS THIRTEEN PEOPLE IN THREE FAMILIES, so the height figures are medians over a handful
    of related individuals and carry family background. The C-terminal elongation is modelled as antimorphic
    and NOT PROVEN TO BE - it could be neomorphic, in which case it is not a loss-of-function readout at
    all. AND THE DECISIVE LIMIT IS THE ONE CORR-046 NAMES - these are germline and developmental, and
    nothing converts them into the effect of months of partial postnatal receptor inhibition
- parameter: the phosphate axis mirrors in both directions across one receptor, in humans
  value: >-
    FGFR1 GAIN of function (osteoglophonic dysplasia) produces FGF23-mediated HYPOPHOSPHATAEMIA. FGFR1
    INHIBITION (erdafitinib pan-FGFR1-4 about 75 per cent, Debio1347 FGFR1-3 four of five children)
    produces HYPERPHOSPHATAEMIA, while the FGFR1-sparing TYRA-300 sits at 13 per cent. Two opposite
    perturbations of the same receptor give two opposite phosphate phenotypes
  unit: direction of serum phosphate against direction of FGFR1 perturbation
  conditions: human genetics against human pharmacology, three agents and one dysplasia
  species: human
  source_ref: othman1993
  uncertainty: >-
    The genetic arm is a phenotype-index statement from a GeneReviews chapter used for its feature list
    rather than as a data source, and hypophosphataemia is present only in SOME osteoglophonic patients.
    What the mirror establishes is the DIRECTION AND THE RECEPTOR, which is all it is used for
- parameter: kot2026 read in full - the two results the atlas never extracted
  value: >-
    infigratinib in growing Aga2/+ mice. GROWTH PLATE LENGTHENED IN BOTH SEXES AND SPECIFICALLY IN THE
    PROLIFERATIVE ZONE, with reduced phospho-ERK1/2 and SOX9 in lower hypertrophic chondrocytes. FEMUR
    LENGTH INCREASED IN FEMALES ONLY. No effect on cortical bone; reduced male trabecular bone in Aga2/+.
    Three-point bending gave increased strength in treated Aga2/+ males but REDUCED BONE STRENGTH IN
    TREATED WILD-TYPE MALES. TREATED MALES OF BOTH GENOTYPES SHOWED ELEVATED SERUM TESTOSTERONE
  unit: zone lengths, femur length, bone strength, serum testosterone
  conditions: Aga2/+ osteogenesis imperfecta model and wild-type littermates, growing mice
  species: mouse
  source_ref: kot2026
  uncertainty: >-
    MOUSE, AND THE MOUSE DOES NOT FUSE, so nothing here speaks to adult height. THE LENGTH RESULT IS FEMALE
    ONLY AND BY CORR-191 IS THEREFORE NOT A LENGTH RESULT. The testosterone finding has no human counterpart
    - erdaseries2025 patient 1 had testosterone below 0.03 ng/mL throughout, though he was hypogonadotropic
    from prior irradiation, and erdachild2024 had a normal axis at Tanner 2-3. It is filed as a gap
localization:
- 'the epiphysis, where FGFR1 dysfunction of either sign produces dysplasia and valgus'
- 'the kidney, where the same receptor sets phosphate in both directions'
human_evidence: direct
human_evidence_note: >-
  Two human genetic conditions with adult heights and phosphate phenotypes, set against three human
  pharmacological cohorts. The mouse material is labelled and used only where no human data exists.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The human material here is GERMLINE AND DEVELOPMENTAL and the target is PARTIAL AND POSTNATAL. That gap is
  the exact reason CORR-046 retracted the receptor ledger, and it is why this round withdraws an anchor
  rather than replacing it with the opposite anchor.
confidence: B
claim_grades:
- claim: FGFR1 has no reported human stature phenotype
  grade: X
  basis: >-
    FALSE, AND IT WAS QUOTED FROM CORR-217 AS AN ANCHOR IN ROUNDS 230 AND 231. Osteoglophonic dysplasia
    (FGFR1 gain of function) gives profound short stature with rhizomelia; FGFR1 C-terminal frameshift MED
    gives adult height -1.7 SDS in males and -1.6 in females across 13 individuals
- claim: reduced FGFR1 function subtracts height, so an FGFR3-selective agent would gain height
  grade: E
  basis: >-
    NOT SUPPORTED AND DELIBERATELY NOT ASSERTED - this is the retracted receptor ledger rebuilt from the
    other side. Germline antimorphism from conception does not convert into months of partial postnatal
    inhibition, and the largest human growth response on record came from an FGFR1-covering agent
- claim: the case for FGFR3-selectivity survives the loss of its FGFR1 anchor
  grade: B
  basis: >-
    YES, ON THE PHOSPHATE ARM ALONE, which is the leg that was measured all along - 75 and 80 per cent on
    the FGFR1-covering agents against 13 per cent on the FGFR1-sparing one, in humans at pharmacological
    doses, now with a genetic mirror in both directions
- claim: the phosphate arm of FGFR inhibition is an FGFR1 effect
  grade: A
  basis: >-
    SETTLED FROM TWO INDEPENDENT DIRECTIONS. Pharmacologically across three agents where sparing FGFR4
    changes nothing and sparing FGFR1 collapses it six-fold (round 231); genetically because FGFR1 GAIN of
    function produces the OPPOSITE phosphate phenotype, hypophosphataemia via FGF23
- claim: kot2026 shows an FGFR inhibitor increases bone length
  grade: X
  basis: >-
    OVERREAD. The femur length result is FEMALE ONLY, and CORR-191 holds that a length result in one sex
    only is not a length result. What kot2026 supports is a growth-plate result and a bone-strength result
- claim: FGFR inhibition raises testosterone
  grade: D
  basis: >-
    MOUSE ONLY, in treated males of both genotypes in one study, with no human counterpart measured. It
    matters because raised testosterone would accelerate fusion and shorten the only lever this programme
    has left, and because anastrozole is already in this stack
