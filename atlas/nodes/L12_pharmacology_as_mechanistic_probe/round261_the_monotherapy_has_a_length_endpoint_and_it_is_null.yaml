translation_risk: not_applicable
translation_risk_reason: >-
  The load-bearing result here is a negative in mouse, and negatives do not require translation to constrain
  a programme built on the positive.
confidence: B
confidence_reason: >-
  The monotherapy null is a directly reported result from a full text, in the right species, with
  demonstrated assay sensitivity in the same figure and demonstrated pharmacodynamic effect in the same
  animals. It is B rather than A because the arm carries no numbers or statistics and was dropped rather
  than powered, and because the compound is not RARgamma-selective.
claim_grades:
- claim: >-
    An RARgamma antagonist given alone lengthens bones in a normal growing animal.
  grade: X
  basis: >-
    NO. koyama2021 measured it - CD2665 1.5 mg/kg daily P20 to P31 - and body length, body weight and tibia
    length were all essentially unaffected, with the arm dropped "given the paucity of responses". The same
    animals showed plate expansion, so the drug was active, and the same figure detected a 10-15 per cent
    change in the LDE225 arm, so the assay had the sensitivity.
- claim: >-
    Growth plate expansion under an RARgamma antagonist indicates it will add length.
  grade: X
  basis: >-
    THE FIFTH INSTANCE OF THIS ERROR IN THIS ATLAS. horike2026, newton2019/Tsc1, reyes2023/Jansen and
    trompet2024's systemic SAG all showed expansion or pool gain without length, and CORR-189 established
    that zone heights are not growth rates. Round 255 recorded that caveat and let the headline stand on the
    zone measurement anyway.
- claim: >-
    An RARgamma antagonist protects a growth plate against a closing agent.
  grade: B
  basis: >-
    koyama2021 - LDE225 cut body length and weight 10-15 per cent and shortened the tibia; CD2665
    co-administration largely rescued both, preserved plate architecture by histomorphometry, and restored
    Sox9, Col II, Col X and osteopontin expression. Restoration toward normal, explicitly incomplete, and
    CORR-203 keeps it separate from elevation.
- claim: >-
    The BMP-Smad conflict is an artefact of the ectopic BMP-2 pellet model.
  grade: X
  basis: >-
    NO. uchibe2017 reports broadened pSmad1/5/8 in RARgamma-NULL GROWTH PLATE - genetic, in the physis, no
    BMP pellet involved. Round 260 offered this as one of three possible reconciliations and it is now
    excluded.
- claim: >-
    The growth plate defends a low-retinoid set point and that defence is load-bearing.
  grade: C
  basis: >-
    uchibe2017 cites that Cyp26b1 ablation - removing the enzyme that degrades retinoic acid - caused marked
    reduction of chondrocyte proliferation in growth plate, which is the genetic support round 257 proposed
    for the buffer model and could not source. Held at C because this atlas has read it as a citation within
    uchibe2017 rather than in the primary.
