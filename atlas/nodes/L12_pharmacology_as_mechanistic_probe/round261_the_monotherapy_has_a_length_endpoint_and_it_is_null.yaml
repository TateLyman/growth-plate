id: round261_the_monotherapy_has_a_length_endpoint_and_it_is_null
name: >-
  ROUND 261 - the supplied full texts settle it and the answer is NO. koyama2021 DID measure tibia length
  under the RARgamma antagonist ALONE in normal mice, and body length, weight and TIBIA LENGTH were all
  ESSENTIALLY UNAFFECTED while the growth plate expanded - the authors dropped the arm "given the paucity of
  responses". The fifth instance of expansion without flux, and this time the length endpoint exists
aliases:
- round 261
- the CD2665 monotherapy null
- expansion without flux
- the antagonist does not lengthen
type: hypothesis
layer: L12
stub: false
summary: >-
  FOUR FULL TEXTS SUPPLIED, ALL FOUR ASKS FROM THE ROUND 260 LIST ANSWERED, AND THE ARM THIS PROGRAMME HAS
  BUILT FOR SIX ROUNDS DOES NOT SURVIVE IN THE FORM IT WAS BUILT.

  ONE - THE RESULT. koyama2021, read in full, contains the experiment round 258 specified and round 260 said
  did not exist. Mice were given the RARgamma antagonist CD2665 at 1.5 mg/kg daily by gavage from P20 to
  P31, with a vehicle arm, an LDE225 arm and a combination arm, and body length, body weight and TIBIA
  LENGTH were measured by caliper and whole-body X-ray. THE MONOTHERAPY ARM IS EXPLICITLY REPORTED: "All the
  above skeletal parameters were essentially unaffected in companion mice receiving RARgamma antagonist
  alone (Fig. 2). GIVEN THE PAUCITY OF RESPONSES, THIS TREATMENT REGIMEN WAS NOT INCLUDED IN SUBSEQUENT
  EXPERIMENTS."
  AND THE PLATE DID RESPOND, WHICH IS WHAT MAKES THE NULL INFORMATIVE RATHER THAN AMBIGUOUS. The same mice
  showed "an appreciable delay in chondrocyte maturation and ossification indicated by a slight increase in
  overall growth plate height compared to control at P31" plus "an expansion of Col II-expressing upper
  zones and Col X-expressing hypertrophic zone". THE DRUG REACHED THE PLATE, CHANGED IT, AND DID NOT
  LENGTHEN THE BONE.

  TWO - AND THIS IS THE FIFTH TIME THIS ATLAS HAS SEEN THIS EXACT SHAPE. horike2026 - expanded resting zone,
  short bones. newton2019 and the Tsc1 line - pool without flux. reyes2023 and Jansen - amplification
  without discharge, the accumulated cells dying instead of hypertrophying. trompet2024's short systemic SAG
  - pool up, length unchanged. AND NOW CD2665 - growth plate expanded, tibia unchanged. EXPANSION OF A ZONE
  IS NOT PRODUCTION OF BONE, and CORR-189 said zone heights cannot be trusted as growth-rate proxies. Round
  255 carried that caveat in its uncertainty field and then let the headline claim stand on the zone
  measurement anyway. The length endpoint was in the same paper the whole time.

  THREE - WHAT THE PAPER DOES SHOW, WHICH IS REAL AND IS NOT WHAT WE WANTED. LDE225 alone cut body length
  and weight by 10-15 per cent by P31 and appreciably shortened the tibia; co-administration of CD2665
  LARGELY BUT NOT COMPLETELY RESCUED both, preserved growth plate architecture visually and by
  histomorphometry, and restored Sox9, Col II, Col X and osteopontin expression patterns that LDE225 had
  abolished. THAT IS RESTORATION TOWARD NORMAL, NOT ELEVATION ABOVE IT - the CORR-203 distinction, and it
  applies with full force. The antagonist is a PROTECTIVE agent against drug-induced closure. It is not a
  growth agent.

  FOUR - AND THE REFRAME THAT SURVIVES, WHICH IS SMALLER BUT COHERENT. An RARgamma antagonist expands the
  plate and does not ship it. That is a CHARGE without a DISCHARGE - precisely the configuration round 251
  identified as the recurring failure. Read that way, koyama2021 is not a failed growth experiment but a
  successful PAIRING experiment: hedgehog withdrawal is the discharge, it fuses the plate two doses later,
  and the RARgamma antagonist is what makes that discharge survivable. THE RETINOID ARM'S VALUE IS ENABLING
  A DIFFERENT LEVER, NOT BEING ONE. That is a real place for it in the stack and it is not the place rounds
  255 to 260 were putting it.

  FIVE - THE OTHER THREE TEXTS, AND WHAT THEY CLOSE. uchibe2017 gives the systemic dosing that round 260
  could not reach: 4 mg/kg by ORAL GAVAGE for CD2665 and the other antagonists, 1 mg/kg for the agonist
  NRX204647, dosed on days 3, 5 and 7 (or 7, 9 and 11) after implantation. It confirms the specificity
  control with data rather than by assertion - "Administration of RARgamma antagonists significantly
  stimulated ectopic bone formation in wild type BUT NOT IN RARgamma-NULL MICE". IT CONTAINS NO BONE LENGTH
  DATA OF ANY KIND - it is a defect and heterotopic-ossification model in 2-month-old mice - so the genetic
  elevation question is still unanswered.
  AND IT CONFIRMS THE BMP CONFLICT AT THE GROWTH PLATE ITSELF, WHICH ROUND 260 COULD ONLY INFER: "we also
  confirmed BROADENED EXPRESSION OF pSmad1/5/8 IN RARgamma-NULL GROWTH PLATE compared to that of wild type".
  Removing RARgamma raises BMP-Smad in the plate, genetically, not just pharmacologically in an ectopic
  pellet. The conflict with this atlas's BMP-Smad-low root cell is therefore real and is not a model
  artefact.
  IT ALSO SUPPLIES THE BUFFER MODEL'S GENETIC SUPPORT, WHICH ROUND 257 PROPOSED AND COULD NOT SOURCE:
  uchibe2017 cites that ablation of Cyp26b1 - the enzyme that degrades retinoic acid - caused MARKED
  REDUCTION OF CELL PROLIFERATION IN GROWTH PLATE, "indicating that reduction of RA levels is important for
  proliferation of chondrocytes". Raising retinoid tone by removing its degrading enzyme suppresses
  proliferation. The plate defends a low-retinoid set point and that defence is load-bearing.
  matsuoka2025, read in full, closes the last one by saying it plainly. Its length data are entirely in the
  AGONIST direction - local RARgamma agonist nanoparticles shortened the tibia against the contralateral
  drug-free control - and it proposes the antagonist version as a future possibility: implantation of NPs
  with "a selective RARgamma antagonist or agonist COULD BE USED" to correct long bone length. THE GROUP
  THAT OWNS THE COMPOUND, THE CARRIER AND THE MODEL STATES THE ANTAGONIST-LENGTHENING EXPERIMENT AS AN
  UNREALISED POSSIBILITY.

  SIX - WHAT IS LEFT OF THE ARM, STATED WITHOUT SOFTENING. The receptor logic survives - williams2009's
  ligand-less repressor, janesick2014's reciprocal in vivo test, the human expression of rounds 256 and 257.
  The one normal-animal length test of an RARgamma antagonist is NULL. The compound tested was CD2665, which
  le2019a showed is not RARgamma-selective, at one dose, for eleven days; 7C has never been given to a
  normal growing animal at all. So the arm is not refuted, it is DEMOTED: from a candidate yield agent to a
  plate-protective adjunct whose only demonstrated skeletal benefit is rescuing a plate that another drug is
  closing. Anyone reviving it as a growth agent has to explain why eleven days of a plate-expanding dose
  produced no length, and the honest answer available - too short, wrong compound, wrong dose - is exactly
  the answer that is always available and is worth very little.
quantitative:
- parameter: >-
    THE MONOTHERAPY ARM - GROWTH PLATE EXPANDS, BONE DOES NOT LENGTHEN
  value: >-
    body length, body weight and tibia length ALL essentially unaffected by RARgamma antagonist alone; the
    same mice showed a slight increase in overall growth plate height and expansion of Col II and Col X
    zones
  unit: body length (caliper, nose to tail base), body weight, tibia length (whole-body X-ray)
  conditions: >-
    koyama2021, read in full. CD2665 1.5 mg/kg daily by gavage from P20 and P21 and thereafter daily until
    P30-P31, in male and female mice, alongside vehicle, LDE225 (100 mg/kg) and combination arms. The
    antagonist dose was chosen from prior mouse effectiveness studies. Assay sensitivity is demonstrated
    within the same figure: LDE225 alone produced a 10-15 per cent decrease in body length and weight by P31
    and an appreciable reduction in tibia length, both detected. The authors state "All the above skeletal
    parameters were essentially unaffected in companion mice receiving RARgamma antagonist alone (Fig. 2).
    Given the paucity of responses, this treatment regimen was not included in subsequent experiments."
  species: mouse
  source_ref: koyama2021
  uncertainty: >-
    ELEVEN DAYS OF TREATMENT, ONE DOSE, ONE COMPOUND, AND NO NUMBERS OR ERROR BARS FOR THE MONOTHERAPY ARM -
    it is reported as a negative sentence and a figure, not a table, and the arm was dropped rather than
    powered. The compound is CD2665, which le2019a showed also antagonises RARalpha with opposite
    co-regulator behaviour, so this is not a clean RARgamma test. 7C was never given. WHAT MAKES THE NULL
    WORTH TAKING SERIOUSLY DESPITE ALL OF THAT: the same animals showed a measurable plate response, so
    exposure and pharmacodynamics are established, and the same figure detected a 10-15 per cent change in
    the LDE225 arm, so the assay could see an effect of that size had one existed.
- parameter: >-
    WHAT THE ANTAGONIST DOES DO - RESCUE OF DRUG-INDUCED SHORTENING, NOT ELEVATION
  value: >-
    LDE225 alone reduced body length and weight by about 10-15 per cent by P31 and appreciably shortened the
    tibia; co-administration of CD2665 rescued both largely but not completely, preserved growth plate
    architecture, and restored Sox9, Col II, Col X and osteopontin expression that LDE225 had abolished
  unit: per cent change in body length and weight; tibia length; in situ marker expression
  conditions: >-
    koyama2021. LDE225 100 mg/kg and CD2665 1.5-1.6 mg/kg by daily gavage in 100-200 microlitres; tibias
    harvested at P31 for serial longitudinal sections and in situ hybridisation.
  species: mouse
  source_ref: koyama2021
  uncertainty: >-
    THIS IS RESTORATION TOWARD A NORMAL TRAJECTORY, NOT ELEVATION ABOVE ONE, and CORR-203 requires the two to
    be graded separately. The rescue is explicitly incomplete. It establishes the antagonist as a protective
    adjunct against a closing agent and says nothing about whether it can add length to an untreated animal -
    which the monotherapy arm in the same experiment answers in the negative.
- parameter: >-
    THE SYSTEMIC DOSE AND THE GENETIC SPECIFICITY CONTROL, WITH DATA RATHER THAN BY ASSERTION
  value: >-
    4 mg/kg by oral gavage for CD2665 and the other antagonists, 1 mg/kg for the agonist NRX204647, dosed on
    days 3, 5 and 7 or days 7, 9 and 11; RARgamma antagonists stimulated ectopic bone formation in wild type
    BUT NOT in RARgamma-null mice
  unit: mg/kg by oral gavage
  conditions: >-
    uchibe2017, read in full. rhBMP-2-containing Matrigel (1 microgram) injected subcutaneously at two
    ventral sites in 2-month-old CD-1 mice; drugs in corn oil vehicle by 20-gauge gavage needle. Tibial
    cortical defect model (1 mm hole) in 2-month-old female RARgamma-null and wild-type mice, analysed at 7
    or 14 days by microCT, calcein labelling and histology.
  species: mouse
  source_ref: uchibe2017
  uncertainty: >-
    THIS PAPER CONTAINS NO BONE LENGTH DATA OF ANY KIND. It is a heterotopic-ossification and cortical-defect
    model in skeletally mature 2-month-old mice, so the genetic question - do RARgamma-null mice have longer
    or shorter bones - is NOT answered here and remains open. The dosing is for a 3-dose schedule in an
    ectopic model, not a chronic growth regimen.
- parameter: >-
    THE BMP CONFLICT CONFIRMED GENETICALLY, IN THE GROWTH PLATE ITSELF
  value: broadened expression of pSmad1/5/8 in RARgamma-null growth plate compared with wild type
  unit: direction of BMP-Smad signalling in the physis
  conditions: >-
    uchibe2017, immunostaining of growth plates in RARgamma-null versus wild-type mice, reported alongside
    higher pSmad1/5/8 in cartilaginous tissue of healing bone defects in the same animals and increased
    pSmad1/5/8 and Id1-luc activity in RARgamma antagonist-treated chondrogenic cells.
  species: mouse
  source_ref: uchibe2017
  uncertainty: >-
    Round 260 raised this conflict from an ectopic BMP-2 pellet and could not exclude that it was a property
    of that model. It is now confirmed GENETICALLY AND IN THE PHYSIS: removing RARgamma broadens pSmad1/5/8
    in the growth plate. The conflict with this atlas's BMP-Smad1/5-LOW root cell (rounds 241, 243) and with
    ambrosi2025's independently derived BMP inhibitor is therefore real and not a model artefact.
    Immunostaining pattern, not quantified here.
