contradicts: >-
  DEMOTES THE RETINOID ARM ACROSS round255, round256, round257, round258, round259 AND round260. Those rounds
  built an RARgamma antagonist into a candidate YIELD agent - the first thing in this atlas pointed at
  amplification. koyama2021, read in full, shows the monotherapy was measured for length in normal mice and
  produced none, while expanding the plate. The receptor logic (williams2009, janesick2014) and the human
  expression (rounds 256-257) are unaffected; what is withdrawn is the expectation that blocking RARgamma
  adds length on its own. The arm is reassigned from candidate growth agent to PLATE-PROTECTIVE ADJUNCT,
  whose demonstrated value is making a hedgehog-withdrawal discharge survivable - which is the role round
  251 said the discharge step needed filling. ALSO EXCLUDES one of the three reconciliations round 260
  offered for the BMP-Smad conflict: uchibe2017 confirms broadened pSmad1/5/8 in RARgamma-null growth plate,
  so it is not an artefact of the ectopic pellet model. CORR-268.
