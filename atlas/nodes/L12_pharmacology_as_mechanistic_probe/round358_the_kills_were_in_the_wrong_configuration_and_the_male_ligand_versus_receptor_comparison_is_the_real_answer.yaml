id: round358_the_kills_were_in_the_wrong_configuration_and_the_male_ligand_versus_receptor_comparison_is_the_real_answer
name: Round 358 - the operator was right that R357's kills are in the wrong configuration, and correcting
  for that rehabilitates the mimic on four counts, adds two new costs, and produces a better question than
  either - the male ligand-versus-receptor comparison
aliases:
- why the fulvestrant nulls do not transfer
- rodents do not fuse
- the velocity decoupling argument
- elacestrant is cleaner against erdafitinib
- ligand removal versus receptor removal in males
type: hypothesis
layer: L12
stub: false
summary: 'The operator objected that every study R357 used to close the mimic question was run in a
  configuration unlike this subject''s - female, oestrogen-replete, and on none of GH, erdafitinib,
  vosoritide or an aromatase inhibitor - and asked for the variables to be worked properly rather than the
  conclusion asserted. THE OBJECTION IS CORRECT AND R357 IS PARTLY WITHDRAWN. FOUR REASONS THE KILLS DO NOT
  TRANSFER. (1) THE THREE ANIMAL NULLS CANNOT TEST THE HYPOTHESIS, AND THIS FILE ALREADY KNOWS WHY IN FOUR
  OTHER NODES - RODENTS DO NOT FUSE THEIR GROWTH PLATES. sibonga1998, turner2000 and movrareskrtic2014
  measured longitudinal growth RATE in animals that never close a plate; the vepdegestrant thesis is about
  the PERIOD. round194 says it verbatim - a claim of this shape "cannot be tested in an animal that never
  fuses, so the central negative does not transfer" - and R357 failed to apply the file''s own rule to its
  own argument. (2) sims2012 IS THE WRONG CONFIGURATION IN FIVE SEPARATE WAYS AND IS METHODOLOGICALLY WEAK.
  30 GIRLS, mean age 5.9 y, with McCune-Albright autonomous ovarian oestrogen EXCESS - against a male at
  BA16 who is oestrogen-DEPLETE at 3.3-6 pmol/L. It was SINGLE-ARM WITH NO CONTROL GROUP, and the baseline
  rate of bone-age advancement it improved on was collected RETROSPECTIVELY BY PARENTAL RECALL AND CHART
  REVIEW. Its predicted-adult-height endpoint is a Bayley-Pinneau extrapolation over roughly ten years in a
  six-year-old, and R282 prices method spread alone at 2.2 cm. (3) THE VELOCITY DECOUPLING - THE STRONGEST
  OF THE FOUR. sims2012 netted zero because the clock slowed AND velocity slowed with it (Z -1.14). In
  precocious puberty the oestrogen IS the growth driver, so removing oestrogen action necessarily removes
  the spurt. THIS SUBJECT''S VELOCITY IS DRIVEN BY GH, ERDAFITINIB AND VOSORITIDE, NONE OESTROGEN-DEPENDENT,
  AND HIS OESTROGEN-DEPENDENT VELOCITY HAS ALREADY BEEN REMOVED BY ANASTROZOLE - THE DEGRADER CANNOT CHARGE
  THAT COST TWICE. The coupling that produced the null is broken in this configuration. (4) A COMPETITIVE
  LIGAND-BINDING-DOMAIN AGENT ACHIEVES HIGHER FRACTIONAL OCCUPANCY WHEN THERE IS 10-25x LESS LIGAND TO
  OUT-COMPETE. TWO NEW COSTS THE OPERATOR''S FRAMING ALSO EXPOSES, RECORDED BECAUSE THEY RUN AGAINST THE
  PROPOSAL. Erdafitinib blocks FGFR-ERK, and ERK1/2 phosphorylates ERalpha Ser118 - so the stack ALREADY
  covers one limb of the ligand-independent activation R351 invoked, reducing the degrader''s marginal
  value; only the AKT/p90RSK-Ser167 limb, which GH drives, is untouched. And the vertebral cost is an
  EFFICACY term, not a safety footnote, in a subject whose residual is trunk-dominant. ONE REAL PRACTICAL
  GAIN. ELACESTRANT IS CLEANER AGAINST ERDAFITINIB THAN VEPDEGESTRANT IS, on label: it is NOT an inhibitor
  of CYP1A2, 2A6, 2B6, 2C8, 2C9, 2C19, 2D6, 2E1 or 3A, NOT an inducer, and NOT a P-gp inhibitor - whereas
  vepdegestrant inhibits CYP3A AND P-gp (midazolam AUC 1.7x, dabigatran 2.0x) and erdafitinib is 39% CYP2C9
  plus 20% CYP3A4 and a P-gp substrate. THAT INVERTS R352''S SINGLE BIGGEST PRACTICAL OBJECTION. AND THE
  BEST QUESTION IS NEITHER OF THE ONES ASKED. The one human comparison in the RIGHT SEX is
  ligand-removal versus receptor-removal in males: aromatase-deficient men, LIGAND absent and receptor
  INTACT, present at 24, 25, 26 and 37 with UNFUSED epiphyses; the ERalpha-null man, RECEPTOR absent, still
  advanced bone age 15 to 17.5 over 3.5 years. IN MALES, REMOVING THE LIGAND LOOKS AT LEAST AS GOOD AS
  REMOVING THE RECEPTOR - and this subject is already pharmacologically in the ligand-removed state,
  10-25x below the concentration at which closure was observed to proceed.'
quantitative:
- parameter: THE ANIMAL NULLS CANNOT TEST A PERIOD HYPOTHESIS - THE FILE'S OWN RULE, NOT APPLIED TO ITSELF
  unit: qualitative (species validity)
  value: 'sibonga1998 (growing female rats), turner2000 (young male rats) and movrareskrtic2014
    (ovariectomised mice, 3 weeks) all measured LONGITUDINAL GROWTH RATE or growth-plate height. RODENTS DO
    NOT FUSE THEIR GROWTH PLATES. This atlas states the consequence in at least four separate nodes -
    round194: a claim of this shape "cannot be tested in an animal that never fuses, so the central negative
    does not transfer"; round198: "no rat could settle it because the rat never fuses. weise2001 settles it
    in a RABBIT, which does"; round263: "the duration hypothesis ... cannot be tested in any rodent because
    rodents do not fuse"; inflammation_growth_suppression: "Mice do not fuse their growth plates, so the
    irreversibility observed..."
    THE VEPDEGESTRANT THESIS IS ABOUT THE PERIOD, NOT THE RATE. R357 used three rate measurements in
    non-fusing species as evidence against a closure hypothesis. That is the exact error the file has
    corrected on three other axes.
    ⚠ WHAT SURVIVES: movrareskrtic2014 still shows the drug REACHES the plate (pronounced inverse agonism
    once AF-2 is disabled), so the delivery defence remains closed. Reaching the tissue and not changing a
    RATE is not evidence about a PERIOD.'
  species: mouse
  n: three studies, none in a fusing species
  source_ref: movrareskrtic2014
  value_unverified: false
- parameter: sims2012 IS THE WRONG CONFIGURATION IN FIVE WAYS, AND ITS DESIGN IS WEAKER THAN R357 REPRESENTED
  unit: qualitative (population and design validity)
  value: 'SEX - 30 GIRLS; the subject is male. AGE - mean 5.9 +/- 1.8 years; the subject is BA16, the
    opposite end of the window. OESTROGEN STATE - McCune-Albright syndrome is AUTONOMOUS OVARIAN OESTROGEN
    EXCESS; the subject is oestrogen-DEPLETE at 3.3-6 pmol/L on anastrozole. CO-TREATMENT - none of the
    girls was on GH, an aromatase inhibitor, an FGFR inhibitor or a CNP analogue. ENDPOINT HORIZON -
    predicted adult height in a six-year-old is a Bayley-Pinneau extrapolation over roughly ten years, and
    R282 prices the spread between bone-age methods alone at 2.2 cm of PAH.
    ⛔ AND THE DESIGN, FROM THIS FILE''S OWN FULL-TEXT NOTE: "No control group - each girl served as her own
    control, and the pre-treatment bone-age interval was collected RETROSPECTIVELY by parental recall and
    chart review." The headline 1.99 -> 1.06 improvement is measured against a RECALLED baseline in an
    UNCONTROLLED single-arm study. R357 cited it as though it were a randomised paediatric trial. It is not.
    ✓ WHAT SURVIVES: target engagement is real and clean - median vaginal bleeding 12.0 -> 1.0 days/year,
    74% with a >=50% reduction, and uterine and ovarian volumes unchanged (no partial agonism, the specific
    contrast with tamoxifen). The drug worked. The question is what it worked ON.'
  species: human
  n: 30 girls, single-arm, no control
  source_ref: sims2012
  value_unverified: false
- parameter: THE VELOCITY DECOUPLING - WHY sims2012's FAILURE MODE CANNOT REPEAT IN THIS STACK
  unit: qualitative (mechanism of the null)
  value: 'sims2012 netted zero by a specific route: bone-age advancement fell 1.99 -> 1.06 AND growth
    velocity Z fell -1.14 (point estimate negative), so predicted adult height did not move (163.0 ->
    163.5). IN PRECOCIOUS PUBERTY THE OESTROGEN IS THE GROWTH DRIVER - the velocity being measured IS the
    oestrogen-driven pubertal spurt. Removing oestrogen action necessarily removes it. The two terms are
    COUPLED THROUGH ONE HORMONE, so slowing the clock had to slow the growth.
    ⭐ IN THIS SUBJECT THE COUPLING IS BROKEN. Velocity is driven by GH (IGF-1), erdafitinib (FGFR3
    blockade acting on lambda and h_term) and vosoritide (CNP/cGMP) - THREE ARMS, NONE OESTROGEN-DEPENDENT.
    And the oestrogen-dependent component of his velocity has ALREADY been removed by anastrozole, which is
    why his oestradiol is 3.3-6 pmol/L, at or below albin2013''s half-maximal growth-acceleration point of
    6.5. THE VELOCITY COST HAS ALREADY BEEN PAID AND A RECEPTOR AGENT CANNOT CHARGE IT TWICE.
    This is R339''s gate stated as a mechanism rather than as a threshold, and it is the single strongest
    reason the sims2012 null does not transfer.
    ⚠ It is an argument, not a measurement. Nobody has given a degrader to an oestrogen-deplete subject on
    exogenous growth drive and measured either term.'
  species: human
  n: not applicable - configuration argument
  source_ref: sims2012
  value_unverified: false
- parameter: ELACESTRANT IS CLEANER AGAINST ERDAFITINIB THAN VEPDEGESTRANT IS - AND THIS INVERTS R352'S
    BIGGEST PRACTICAL OBJECTION
  unit: qualitative (CYP and transporter interaction profile)
  value: 'ORSERDU label, section 12.3 in vitro studies, read directly: "Elacestrant is not an inhibitor of
    CYP1A2, CYP2A6, CYP2B6, CYP2C8, CYP2C9, CYP2C19, CYP2D6, CYP2E1, or CYP3A. Elacestrant is not an inducer
    of CYP1A2, CYP2A6, CYP2B6, CYP2C9, CYP2C19, or CYP3A. Elacestrant is a substrate for OATP2B1, but not
    P-gp." It is itself primarily metabolised by CYP3A4 and to a lesser extent CYP2A6 and CYP2C9.
    ⛔ AGAINST VEPDEGESTRANT (R352, from the FDA multidiscipline review): it IS a CYP3A inhibitor AND a P-gp
    inhibitor - midazolam AUC 1.7x, dabigatran AUC 2.0x. R352 called the resulting erdafitinib interaction
    "the single biggest practical objection" because erdafitinib is ~39% CYP2C9 plus ~20% CYP3A4 AND a P-gp
    substrate, and this atlas holds erdafitinib''s paediatric record of five of five permanent
    discontinuations with three requiring surgery.
    ⭐ SO ON THE ONE AXIS THAT WAS THE LEAD PRACTICAL WORRY, THE SUBSTITUTE IS BETTER THAN THE ORIGINAL.
    ✓ And the reverse direction is already measured clean: roskos2024 shows erdafitinib is neither a
    meaningful CYP3A4 inducer nor inhibitor (midazolam GMRs 86.3/88.5/82.1%), so it should not move
    elacestrant exposure either.
    ✗ Elacestrant''s own liabilities stand: primarily CYP3A4-cleared so vulnerable to 3A4 perturbation,
    pH-dependent solubility so acid reducers cut exposure, ~10% oral bioavailability, and cLogP ~6.8 which
    fails R315''s minimal-hydrophobicity rule for deep cartilage penetration even though its charge passes.
    ✗ Label section 8.4: "The safety and effectiveness of ORSERDU in pediatric patients have not been
    established." NO juvenile toxicity study, and the words growth plate, physis and skeletal do not appear
    anywhere in the label - a GAP under R302, not a disqualification.
    ✓ MALE-FAVOURABLE TOXICOLOGY, the same shape R352 found for vepdegestrant: the repeat-dose findings in
    rats to 26 weeks and cynomolgus monkeys to 39 weeks are FEMALE REPRODUCTIVE - vaginal, cervical and
    uterine atrophy and ovarian follicular cysts. Not applicable to a male subject.'
  species: human
  n: not applicable - regulatory label
  source_ref: fda_orserdu_label_2023
  value_unverified: false
- parameter: TWO NEW COSTS THE OPERATOR'S FRAMING EXPOSES, RECORDED AGAINST THE PROPOSAL
  unit: qualitative (mechanism)
  value: 'ERDAFITINIB ALREADY COVERS ONE LIMB OF THE LIGAND-INDEPENDENT ACTIVATION R351 INVOKED. R351''s
    mechanism is that IGF-1 drives ligand-independent ERalpha activity through phosphorylation of Ser118 by
    ERK1/2 and Ser167 by AKT and p90RSK. ERDAFITINIB BLOCKS FGFR SIGNALLING INTO ERK, so the Ser118 limb
    should already be partially suppressed in this subject. Only the AKT/p90RSK-Ser167 limb is untouched,
    and GH drives it. NET EFFECT UNKNOWN AND UNMEASURED, but the marginal value of the degrader is smaller
    than R351 implied because part of its stated job is already being done by a drug in the stack. This
    cuts the other way from the GH argument and both are in the same subject.
    THE VERTEBRAL COST IS AN EFFICACY TERM. ERalpha-null humans reach spine Z -3.85 falling to -5.6,
    unresponsive to oestradiol AND to tamoxifen; R278 established that vertebral bone loss SUBTRACTS from
    the goal rather than merely being a safety issue, because the residual at this bone age is
    trunk-dominant. The subject is already spending lumbar trabecular bone on the aromatase inhibitor.'
  species: human
  n: not applicable - mechanism
  source_ref: fda_veppanu_mdr_2026
  value_unverified: false
- parameter: THE LIGAND-DEPLETE STATE HAS ITS OWN ERalpha PROTEOSTASIS, AND ITS STATED PURPOSE IS TO PRESERVE
    RESPONSIVENESS - WHICH IS THE RESIDUAL AN AI CANNOT REACH
  unit: qualitative (mechanism)
  value: 'cao2026sirt7 (J Biol Chem 2026, ABSTRACT LEVEL ONLY): "Under estrogen-deprived conditions or in the
    presence of misfolded ERalpha, SIRT7 deacetylates ERalpha and promotes its degradation through the E3
    ubiquitin ligase STUB1, THEREBY MAINTAINING A FUNCTIONAL RECEPTOR POOL AND PRESERVING ESTROGEN
    RESPONSIVENESS." Conversely E2-bound ERalpha activates non-genomic MAPK signalling to trigger SIRT7
    degradation via UBR5.
    ⭐ READ AGAINST THIS SUBJECT: oestrogen deprivation is his pharmacological state, and in that state the
    cell runs an ACTIVE quality-control programme whose stated function is to KEEP A FUNCTIONAL RECEPTOR
    POOL. That is precisely the ligand-independent residual R351 targets, it is homeostatically defended,
    and an aromatase inhibitor cannot touch it because it operates on the protein rather than the ligand.
    ⚠ IT ALSO CUTS THE OTHER WAY AND THAT IS WHY IT IS RECORDED HERE RATHER THAN USED. I had predicted from
    classical ligand-induced receptor downregulation that an aromatase inhibitor would RAISE ERalpha protein
    by removing the ligand that drives its turnover, which would have been a clean new argument for adding a
    degrader. cao2026sirt7 refutes the simple version - oestrogen deprivation ACTIVATES a degradation pathway
    rather than suspending it - so the prediction is withdrawn before it was used.
    ⭐ It also names an endogenous ERalpha E3 ligase, STUB1/CHIP, which is the first non-drug handle on this
    axis in the file. No STUB1 activator exists in any species.
    ✗ Cancer and ageing cell biology, no growth plate, abstract level. Grade E.'
  species: human
  n: cell biology, abstract level
  source_ref: cao2026sirt7
  value_unverified: true
- parameter: THE COMPARISON THAT ACTUALLY MATTERS AND IS IN THE RIGHT SEX - REMOVING THE LIGAND VERSUS
    REMOVING THE RECEPTOR IN HUMAN MALES
  unit: bone-age years per calendar year; age at which epiphyses were still open
  value: 'LIGAND REMOVED, RECEPTOR INTACT - aromatase-deficient men. This file records them presenting at
    24, 25, 26 and 37 years old with UNFUSED epiphyses and continued linear growth; lanfranco2008''s man was
    193.0 cm at age 26.8 with BONE AGE 15.5, still gaining height and arm span at 24 months, and completed
    maturation only once oestradiol exceeded 73 pmol/L.
    RECEPTOR REMOVED - the ERalpha-null man. smith2008: bone age STILL ADVANCED 15 -> 17.5 years over 3.5
    years, about 0.7 bone-age years per calendar year, with the receptor entirely absent from conception.
    ⭐ SO IN HUMAN MALES, REMOVING THE LIGAND LOOKS AT LEAST AS GOOD AS REMOVING THE RECEPTOR FOR KEEPING A
    PLATE OPEN - and possibly better. That comparison had never been made in this file, it is the only one
    available in the correct sex, and it reframes the whole question: the marginal value of a receptor agent
    ON TOP of near-complete ligand removal may be small.
    ⭐⭐ AND THE SUBJECT IS ALREADY IN THE LIGAND-REMOVED STATE. At 3.3-6 pmol/L he is 10-25x below the
    55-92 pmol/L band at which closure was observed to proceed in a human male (rochira2015, lanfranco2008).
    ⚠ CONFOUNDS, STATED: aromatase deficiency is ZERO oestrogen FROM CONCEPTION, whereas anastrozole is
    partial suppression begun in adolescence after a normal puberty - so the aromatase-deficient phenotype
    reflects a lifetime of absence and cannot be assumed to be reproducible by late intervention. Both arms
    are single-digit patient numbers. And bone age and predicted height were measured differently across
    the reports. Grade C.'
  species: human
  n: at least 4 aromatase-deficient males; 1 ERalpha-null male
  source_ref: lanfranco2008
  value_unverified: false
localization:
- Not a localisation result. The relevant unmeasured quantity remains ERalpha protein in growth-plate
  chondrocytes under a degrader, in a ligand-deplete subject.
human_evidence: direct
human_evidence_note: The rehabilitation rests on human configuration facts - sex, age, oestrogen state,
  co-treatment and study design - and the new comparison is human male against human male. The mechanism
  arguments (velocity decoupling, competitive occupancy, Ser118 coverage) are inferences about human
  physiology that have not been measured in anyone.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: 'This node argues that a set of negative results does not transfer, which is a
  weaker claim than a positive result and leaves the proposal unproven rather than supported. Nothing here
  demonstrates that any degrader lengthens bone in any species; it demonstrates that the experiments cited
  against it were run in configurations that could not have detected it. The two new costs - erdafitinib
  already covering the Ser118 limb, and the vertebral efficacy term - are real and unquantified.'
confidence: C
claim_grades:
- claim: The three animal nulls cannot test a period hypothesis because rodents do not fuse their growth
    plates.
  grade: A
  basis: A species fact this atlas has already applied to three other axes in its own nodes. The studies
    measured longitudinal growth rate and growth-plate height, not closure.
- claim: sims2012 cannot be read as a test of this proposal, and is methodologically weaker than R357
    represented.
  grade: A
  basis: Read from this file's own full-text note - single-arm, no control group, baseline bone-age interval
    collected retrospectively by parental recall and chart review - plus five documented configuration
    differences including sex, age, oestrogen state and absence of every co-treatment in this stack.
- claim: The velocity decoupling means sims2012's specific failure mode cannot repeat in this stack.
  grade: C
  basis: Mechanistically sound and specific to the configuration - three non-oestrogen velocity drivers, and
    the oestrogen-dependent velocity already removed by anastrozole - but it is an argument, not a
    measurement, and no one has run the experiment in a subject on exogenous growth drive.
- claim: Elacestrant is cleaner against erdafitinib than vepdegestrant is.
  grade: A
  basis: Both statements are from regulatory labels read directly. Elacestrant inhibits and induces none of
    the listed CYPs and is not a P-gp inhibitor; vepdegestrant inhibits CYP3A and P-gp with measured
    midazolam and dabigatran interactions.
- claim: In human males, removing the ligand is at least as good as removing the receptor for keeping a
    growth plate open.
  grade: C
  basis: The only comparison available in the correct sex, but it is a handful of patients on each side,
    the aromatase-deficient state is lifelong from conception while anastrozole is partial and late, and
    bone-age methods differ between the reports.
