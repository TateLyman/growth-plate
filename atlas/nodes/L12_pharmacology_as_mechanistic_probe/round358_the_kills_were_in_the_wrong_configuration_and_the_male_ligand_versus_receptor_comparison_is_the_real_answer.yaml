contradicts:
- PARTLY WITHDRAWS R357. Its three animal nulls are rate measurements in species that never fuse, and its
  human trial is an uncontrolled single-arm study in oestrogen-replete six-year-old girls with a
  retrospectively recalled baseline. R357's conclusion that the mimic is dead is downgraded to "unproven in
  either direction, and untested in this configuration".
- CORRECTS R357's READING OF VERITAC-2. The full-population arm contains 270 of 624 ESR1-mutant patients, so
  it is diluted rather than a clean wild-type comparison, and the ESR1 wild-type subgroup was not separately
  reported in the sources read. R357 wrote "no demonstrated advantage in the receptor genotype this subject
  has"; the defensible statement is that the overall population did not reach significance.
- ADDS TWO COSTS TO R351. Erdafitinib already suppresses the ERK-Ser118 limb of the ligand-independent
  activation R351 invoked, so the degrader's marginal value is smaller than stated; and the vertebral cost
  is an efficacy term in a trunk-dominant residual.
- WITHDRAWS A PREDICTION BEFORE IT WAS USED. I predicted an aromatase inhibitor would raise ERalpha protein
  by removing ligand-induced receptor turnover. cao2026sirt7 shows oestrogen deprivation ACTIVATES a SIRT7-STUB1
  degradation pathway instead. The argument was dropped rather than published.
- REFRAMES THE QUESTION AGAINST BOTH R351 AND R357. The male ligand-versus-receptor comparison suggests the
  ligand arm may already deliver most of the available open-plate effect, which makes the receptor arm a
  smaller prize than R351 claimed and its absence a smaller loss than the operator feared.
