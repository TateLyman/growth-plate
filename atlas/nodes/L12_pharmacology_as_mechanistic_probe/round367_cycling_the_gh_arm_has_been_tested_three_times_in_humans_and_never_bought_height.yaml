id: round367_cycling_the_gh_arm_has_been_tested_three_times_in_humans_and_never_bought_height
name: Round 367 - the pool-sparing schedule was proposed by chu2025 authors and HAS ALREADY BEEN TESTED IN
  HUMANS THREE TIMES, TWICE RANDOMISED. It never bought height, and the shortest cycle LOST height. The cycle
  PERIOD is the variable that orders the three results, and the only thing intermittent GH buys is the same
  height on 56 per cent of the drug
aliases:
- should the GH arm be cycled
- intermittent versus continuous growth hormone
- does pool-sparing scheduling buy height
- GH holiday
- the IGF-1-titrated discontinuous FGFR3 protocol
type: hypothesis
layer: L12
stub: false
summary: 'R366 ended on a pattern - PULSE BEATS SUSTAINED on hedgehog, on mTORC1 and on GH - and on the
  observation that chu2025 own authors propose exploring INTERMITTENT GH THERAPY, especially in
  non-GH-deficient children, to spare the stem-cell pool. That is the one intervention in this whole file
  needing no molecule, no trial and no access: a SCHEDULE. So I asked whether anyone had run it. THEY HAVE,
  THREE TIMES, TWICE RANDOMISED, AND THE ANSWER IS NO.

  ⛔⛔⛔ THE THREE HUMAN TESTS, AND THEY DISAGREE IN A WAY THAT IS ITSELF THE RESULT - THE ORDERING VARIABLE
  IS THE CYCLE PERIOD.
  · hakeem1993, RANDOMISED, daily GH versus GH for THREE WEEKS OF EVERY FOUR, in children already on GH for
    two years: growth velocity fell in both arms but THE FALL WAS SIGNIFICANTLY GREATER IN THE INTERMITTENT
    ARM. A ONE-WEEK PAUSE COSTS HEIGHT.
  · simon2006, RANDOMISED, 58 SGA children, TOTO (alternating treatment and observation years) versus TTOO
    (two years treatment then two years observation) at the same 67 microg/kg/day: gain in height SDS 1.4 +/-
    0.1 versus 1.6 +/- 0.2, both ending at mean height -2.0 SDS, AND THE RATE OF BONE MATURATION WAS SIMILAR.
    Both arms received two years of drug, so this is scheduling at MATCHED TOTAL EXPOSURE. A YEAR-SCALE PAUSE
    IS NEUTRAL.
  · bougneres1994, retrospective, 86 GH-deficient children of whom 29 had an unplanned 9.7-month pause:
    continuous gained 12.2 +/- 0.5 cm on 43 +/- 3 U/kg, paused gained 12.1 +/- 0.3 cm on 24 +/- 2 U/kg
    (p<0.0005). SAME HEIGHT ON 56 PER CENT OF THE CUMULATIVE DOSE, via what the authors call an important
    RE-ACCELERATION on re-initiation.
  → SHORT PAUSES LOSE, LONG PAUSES ARE NEUTRAL, AND NOTHING BEATS CONTINUOUS. That ordering is coherent: a
  one-week gap only subtracts treatment days, while a multi-month gap allows the catch-up re-acceleration to
  repay the lost time. But repayment is the ceiling. NO SCHEDULE IN ANY OF THE THREE PRODUCED MORE HEIGHT
  THAN CONTINUOUS DOSING.

  ⛔⛔ AND THAT IS A DIRECT NEGATIVE ON THE MECHANISM, NOT MERELY AN ABSENCE. chu2025 predicts that sparing
  the resting-zone pool by intermittent dosing should yield more growth over the full course. Three human
  cohorts with height endpoints, two of them randomised, had the opportunity to show it and none did - and
  simon2006 specifically measured bone maturation and found it similar between arms, so the schedule did not
  buy period either. Under this file own rules a height endpoint outranks a mechanism.
  ⭐ WHAT SURVIVES IS REAL BUT IS NOT A HEIGHT ARGUMENT: intermittent dosing appears to deliver the SAME
  height for roughly HALF the cumulative hormone. That is a cost, burden, adherence and exposure argument -
  and for a subject whose GH arm this file already prices at approximately zero attained height after
  mid-puberty, halving the exposure for the same result is not nothing. It is simply not extra centimetres.

  ⭐ THE ONE GENUINELY USEFUL POSITIVE, AND IT IS THE CLOSEST PUBLISHED PROTOCOL TO THIS SUBJECT
  CONFIGURATION. rothenbuhler2011 treated six children with FGFR3 N540K hypochondroplasia with rGH TITRATED
  TO AN IGF-1 LEVEL NEAR +1.5 SDS rather than to a fixed mg/kg dose, DELIBERATELY DISCONTINUOUS - off one day
  per week, one month per year, and six months every two years - and got +1.9 height SDS over 6.1 years with
  TRUNK-LEG DISPROPORTION IMPROVED, on an average cumulative 0.075 mg/kg/day. It is the only published GH
  protocol built around the FGFR3 axis and around an IGF-1 target, and both features are directly relevant to
  a subject on an FGFR3 inhibitor with an IGF-1 of 198. ✗ It is n=6, single-arm, non-randomised, in young
  children with an ACTIVATING FGFR3 mutation, and its schedule was chosen for the same reasons this round
  just failed to validate. IT IS A DOSING-TARGET PRECEDENT, NOT EVIDENCE THAT THE SCHEDULE WORKS.

  ⛔ AND THE SHARED LIMIT OF ALL THREE NEGATIVE TESTS, STATED SO NOBODY REOPENS THIS ON A TECHNICALITY: NONE
  RAN TO ADULT HEIGHT. simon2006 is four years in 2-5 year olds, bougneres1994 is two years, hakeem1993 is
  two years. All are GH-deficient or SGA children rather than a bone-age-16 male on a four-drug stack, so
  CORR-203 applies in the usual direction. None counted a resting-zone cell. What they establish is that the
  PREDICTED HEIGHT BENEFIT DID NOT APPEAR ON THE TIMESCALES TESTED, which is the claim this round makes and
  no more.'
quantitative:
- parameter: RANDOMISED SHORT-CYCLE INTERMITTENT GH LOSES HEIGHT VELOCITY
  value: 'Daily GH versus GH given for THREE WEEKS OF EVERY FOUR, randomised, in children who had already
    received recombinant GH for two years before randomisation. Growth velocity decreased in both groups in
    years one and two of the study, BUT THE EFFECT WAS SIGNIFICANTLY GREATER IN THE GROUP RECEIVING
    INTERMITTENT GROWTH HORMONE.'
  unit: height velocity, direction only
  conditions: hakeem1993, abstract read 2026-08-13. Randomised, children on established GH therapy.
  species: human
  source_ref: hakeem1993
  uncertainty: 'ABSTRACT ONLY AND THIN - the abstract gives no n, no numeric velocities and no P value, the
    paper is from 1993 with 2 citations, and the population is not specified in the abstract beyond having
    had two years of prior GH. It is nonetheless the only randomised head-to-head at a SHORT cycle period,
    and its direction is unambiguous.'
- parameter: RANDOMISED YEAR-SCALE GH SCHEDULING IS NEUTRAL ON BOTH HEIGHT AND BONE MATURATION
  value: '58 short SGA children aged 2-5, randomised to TOTO - four years alternating treatment and
    observation, n=30 - or TTOO - two years treatment then two years observation, n=28 - both at 67
    microg/kg/day. After four years: gain in height SDS 1.4 +/- 0.1 (TOTO) versus 1.6 +/- 0.2 (TTOO), both
    reaching a mean height of -2.0 SDS (+/- 1.0 and +/- 0.8). THE RATE OF BONE MATURATION WAS SIMILAR IN THE
    TWO GROUPS. Authors conclude treatment interruption after one year did not influence the overall gain in
    height SDS compared with two years continuous treatment.'
  unit: height standard deviation score gain
  conditions: simon2006, abstract read 2026-08-13. Randomised, four-year follow-up.
  species: human
  source_ref: simon2006
  uncertainty: 'THE CLEANEST OF THE THREE BECAUSE BOTH ARMS RECEIVED TWO YEARS OF DRUG, so it isolates
    SCHEDULE at matched total exposure. Limits: SGA rather than GH-deficient or normal, ages 2-5 rather than
    late puberty, four years rather than to adult height, and the point estimate slightly favours the more
    continuous arm without reaching significance. The bone-maturation result is the load-bearing one for this
    atlas, because it says the schedule did not buy PERIOD either.'
- parameter: INTERMITTENT GH DELIVERS THE SAME HEIGHT ON 56 PER CENT OF THE CUMULATIVE DOSE
  value: '86 GH-deficient children transferred from extractive to recombinant GH; 57 transferred directly and
    29 experienced a 9.7 +/- 1 month pause. Over the two years from one year before to one year after
    starting recombinant GH: CONTINUOUS gained 12.2 +/- 0.5 cm on a cumulative 43 +/- 3 U/kg; PAUSED gained
    12.1 +/- 0.3 cm on a cumulative 24 +/- 2 U/kg, p<0.0005 for the dose difference. The children who paused
    grew less in the year before starting and then grew more rapidly in the first year of recombinant GH,
    which the authors attribute to an important RE-ACCELERATION of growth rate on re-initiation.'
  unit: centimetres over two years; units per kilogram cumulative
  conditions: bougneres1994, abstract read 2026-08-13. Retrospective analysis of an unplanned interruption.
  species: human
  source_ref: bougneres1994
  uncertainty: 'RETROSPECTIVE AND THE PAUSE WAS NOT PLANNED OR RANDOMISED - it arose from the extractive-to-
    recombinant transfer, so the two groups may differ systematically. The endpoint is two-year height gain,
    not adult height, and the title phrase final height gain in the abstract refers to that window. The
    children are GH-DEFICIENT, i.e. a restoration setting, so CORR-203 applies. What it supports is EQUAL
    HEIGHT ON LESS DRUG; it does not show intermittent exceeding continuous, and the authors themselves ask
    only for prospective randomised confirmation.'
- parameter: THE ONLY PUBLISHED GH PROTOCOL BUILT AROUND THE FGFR3 AXIS AND AN IGF-1 TARGET IS DELIBERATELY
    DISCONTINUOUS
  value: 'Six children with FGFR3 N540K hypochondroplasia, mean age 2.6 +/- 0.7 years, mean height -3.0 +/-
    0.5 SDS. rGH dosage TITRATED TO AN IGF-1 LEVEL CLOSE TO +1.5 SDS of the normal range rather than to a
    fixed mg/kg. Therapy INTERRUPTED ONE DAY PER WEEK, ONE MONTH PER YEAR AND SIX MONTHS EVERY TWO YEARS.
    Result over 6.1 +/- 0.9 years: mean height SDS increased by 1.9, reaching -0.8 to -1.3 at age 8.7 +/- 1;
    IGF-1 from -1.6 +/- 0.5 at baseline to +1.4 +/- 0.3 in the last year; average cumulative rGH dose 0.075
    +/- 0.018 mg/kg/day, range 0.059-0.100. TRUNK-LEG DISPROPORTION WAS IMPROVED.'
  unit: height standard deviation score; IGF-1 standard deviation score; mg per kg per day
  conditions: rothenbuhler2011, abstract read 2026-08-13. Open-label, single-centre, non-randomised pilot
    running 2003-2020 and intended to reach final stature.
  species: human
  source_ref: rothenbuhler2011
  uncertainty: 'NO CONTINUOUS COMPARATOR AND n=6, so nothing here attributes the result to the schedule -
    that is precisely the inference this round refuted elsewhere. The children carry an ACTIVATING FGFR3
    mutation and are 2-8 years old, whereas the subject is wild-type FGFR3 on an FGFR3 INHIBITOR at bone age
    16, which is a different configuration in both direction and stage. The trunk-leg result is reported
    without numbers in the abstract. Recorded as a DOSING-TARGET precedent - titrate to IGF-1, not to
    mg/kg - rather than as support for cycling.'
localization:
- whole organism; the endpoint in all four studies is height or height SDS, with no growth-plate measurement
  in any of them
human_evidence: direct
human_evidence_note: 'All four studies are human and all four have height endpoints - two randomised
  (hakeem1993, simon2006), one retrospective with a natural experiment (bougneres1994), one single-arm pilot
  (rothenbuhler2011). This is unusually strong evidence by the standards of this file, and it points at a
  negative. The shared limitation is that none ran to adult height and all are in GH-deficient, SGA or
  FGFR3-mutant children rather than in a late-pubertal male on a multi-drug stack.'
species_basis:
- human
translation_risk: low
translation_risk_reason: 'The evidence is human, with height endpoints, and the conclusion is to NOT change
  something rather than to change it - so the risk of acting on it is minimal. The residual risk is that all
  three negative tests are in younger children over 2-4 year windows and none reached adult height, so a
  pool-sparing benefit that only manifests near skeletal maturity would have been invisible to them.'
confidence: B
claim_grades:
- claim: The GH arm should be cycled on and off to spare the resting-zone stem-cell pool.
  grade: X
  basis: 'TESTED THREE TIMES IN HUMANS, TWICE RANDOMISED, AND IT NEVER BOUGHT HEIGHT. hakeem1993 randomised a
    three-weeks-on one-week-off schedule and the velocity decline was significantly GREATER on intermittent.
    simon2006 randomised year-scale on-off at matched total exposure and found 1.4 versus 1.6 height SDS gain
    with SIMILAR BONE MATURATION. bougneres1994 found equal height on 56 per cent of the dose. The mechanism
    predicted extra growth; three cohorts with height endpoints had the chance to show it and none did.'
- claim: The cycle PERIOD orders the three results.
  grade: C
  basis: 'A one-week pause loses height (hakeem1993), a one-year pause is neutral (simon2006), a ten-month
    pause is neutral on height and halves the dose (bougneres1994). The coherent reading is that a short gap
    only subtracts treatment days while a long gap permits the catch-up re-acceleration bougneres1994 names,
    so repayment is the ceiling. Grade C - this is a pattern across three studies with different populations,
    designs, ages and endpoints, not a dose-response measured within one experiment.'
- claim: Intermittent GH delivers the same height for roughly half the cumulative hormone.
  grade: D
  basis: 'bougneres1994: 12.1 +/- 0.3 cm on 24 +/- 2 U/kg versus 12.2 +/- 0.5 cm on 43 +/- 3 U/kg, p<0.0005.
    Grade D because it is retrospective with an unplanned pause, in GH-deficient children, over a two-year
    window. It is a cost, burden and exposure argument rather than a height argument.'
- claim: chu2025 pool-sparing mechanism is refuted.
  grade: X
  basis: 'NO - that overstates it. What is refuted is the CLINICAL PREDICTION that intermittent dosing yields
    more height on the timescales tested. The mechanism itself is untouched: no study here counted a
    resting-zone cell, chu2025 own depletion result is at roughly 100 times the human therapeutic dose, and
    its GHR conditional knockout did not change bone length either. The mechanism may be real and simply too
    small to surface as height, or may need adult-height follow-up to appear.'
- claim: rothenbuhler2011 shows the discontinuous schedule works in FGFR3 disease.
  grade: X
  basis: 'IT CANNOT SHOW THAT - there is no continuous comparator and n=6. What it provides is a DOSING-TARGET
    precedent: rGH titrated to IGF-1 near +1.5 SDS rather than to a fixed mg/kg, in the FGFR3 axis, with
    trunk-leg disproportion improving. That is worth having for a subject on an FGFR3 inhibitor with a
    measured IGF-1; the schedule is not.'
key_refs:
- ref_id: hakeem1993
  year: 1993
  type: primary
  role: the randomised SHORT-cycle test - three weeks on, one week off - in which intermittent lost velocity
- ref_id: simon2006
  year: 2006
  type: primary
  role: the randomised YEAR-scale test at matched total exposure - neutral on height SDS AND on bone
    maturation, which is the cleanest single result in the round
- ref_id: bougneres1994
  year: 1994
  type: primary
  role: equal height on 56 per cent of the cumulative dose after a ten-month pause, via re-acceleration on
    re-initiation
- ref_id: rothenbuhler2011
  year: 2011
  type: primary
  role: the IGF-1-titrated discontinuous protocol in FGFR3 hypochondroplasia - a dosing-target precedent for
    this subject, not evidence for the schedule
- ref_id: chu2025
  year: 2025
  type: primary
  role: the source of the hypothesis - GH shifts divisions toward the committed side, and its authors
    explicitly call for exploration of intermittent GH in non-GH-deficient children
open_questions:
- g_l2_cycling_the_progenitor_pool
contradicts:
- ANSWERS THE PHARMACOLOGICAL HALF OF g_l2_cycling_the_progenitor_pool IN THE NEGATIVE, FOR GH. That gap asks
  whether cycling the pool nets more final height than steady state and notes the pharmacological version
  would substitute a transient resting-zone IGF-1/Akt block for the dietary restriction phase. Exogenous GH
  cycling is the nearest available human instance of that manoeuvre, and three cohorts show it does not add
  height. The dietary and glucocorticoid versions of the gap are untouched.
- CLOSES THE SCHEDULE HOPE RAISED AT THE END OF R366. The pulse-beats-sustained pattern across hedgehog,
  mTORC1 and GH is real as a pattern, but on the one axis where it could be tested in humans with a height
  endpoint it did not translate. A mechanism-level pattern is not a clinical prediction until someone runs it,
  and here someone did.
- DOES NOT ARGUE FOR STOPPING GH. Every study here compares schedules of GH against other schedules of GH;
  none compares GH with none, and chu2025 own finding is that GH signalling is REQUIRED for the stem-cell
  pool to function.
