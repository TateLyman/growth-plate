id: round326_the_akt_axis_agent_screen_and_the_compound_that_beats_compound_7_on_accessibility
name: >-
  ROUND 326 - the PI3K-AKT-mTOR axis swept systematically for an accessible agent, because rounds 324 and
  325 converged on it from two unrelated targets. 41 nodes, signed by hand, joined to human growth-plate
  expression and to every drug Open Targets knows. THIRTY-SIX OF FORTY-ONE HAVE NO AGENT IN THE WANTED
  DIRECTION. The Step-0 objection to the class DISSOLVES on a distinction the atlas had not drawn -
  circulating IGF-1 drives RADIAL growth, local IGF1R transduction drives LONGITUDINAL - and the best
  accessible substitute for round 325's compound 7 is TRODUSQUEMINE, which completed human phase 1
aliases:
- round 326
- the AKT axis agent screen
- trodusquemine
- MSI-1436
- radial versus longitudinal IGF-1
- the AKT contraindication list
type: hypothesis
layer: L12
stub: false
summary: >-
  ZERO - THE QUESTION. Round 324 (NRK) and round 325 (PTPN9) arrived at the same axis from unrelated
  directions, and neither target is usable - NRK is Tdark with a kinase-independent function, PTP-MEG2 has a
  superb tool compound with no supplier. The operator's question is the right one: is there a molecule on
  this axis that is as well characterised as compound 7 and actually obtainable? This round answers it by
  sweeping the axis instead of by association.


  ONE - THE SCREEN. `atlas/tools/round326_akt_axis_accessible_agent_screen.py`. Forty-one nodes -
  receptors, adaptors, lipid kinases, lipid phosphatases, the receptor tyrosine phosphatases, the kinase
  core, mTORC1/2, the GATOR/sestrin amino-acid brakes, AMPK, the AKT phosphatases and the readouts. **Each
  gene carries a hand-assigned direction: which way must it be pushed to RAISE AKT output.** A brake
  (PTEN, TSC1/2, INPPL1, PTPN1/2/9, PHLPP1/2, FOXO1/3, SESN2, GATOR1, AMPK) must be INHIBITED; a positive
  node (IGF1R, INSR, IRS1/2, PIK3CA, AKT1-3, PDPK1, MTOR, RHEB, RPTOR, RICTOR) must be ACTIVATED. Then every
  Open Targets drug is direction-classified and kept only if it points the wanted way, and every gene is
  checked against GSE288028 for CORR-327.


  TWO - ⛔ THE HEADLINE IS A NEGATIVE, AND IT IS THE MOST INFORMATIVE PART. **THIRTY-SIX OF FORTY-ONE NODES
  HAVE NO AGENT IN THE WANTED DIRECTION AT ALL.** That includes **every single phosphatase** - PTEN, PTPN1,
  PTPN2, PTPN9, INPPL1, INPP4B, PHLPP1, PHLPP2, PIK3IP1 - and the whole mTORC1 brake set (TSC1, TSC2,
  DEPDC5, NPRL2, NPRL3, SESN2, PRKAA1/2) and every positive node except the two receptors.
  **The five with anything at all:**
  · **IGF1R - MECASERMIN, approved** (plus mecasermin rinfabate, clinical)
  · **INSR - the insulins, approved** (not a growth agent in any usable sense)
  · **GSK3B - LITHIUM, approved**, plus tideglusib, elraglusib, LY-2090314, AZD-1080 clinical
  · **MTOR and RPTOR - indoximod only**, which is an IDO-pathway drug and a keyword artefact
  This is R298's druggability base rate demonstrated on the one axis with the best human anchoring in the
  whole file, and it is why compound 7 looked so good: molecules that push this axis UP barely exist.


  THREE - ⭐⭐⭐ AND THE STEP-0 OBJECTION TO THE WHOLE CLASS DISSOLVES ON A DISTINCTION THIS ATLAS HAD NOT
  DRAWN. Round 325 rejected PTP-MEG2 partly because its substrates are the insulin receptor, IGF1R and
  STAT5, and "the GH/IGF-1 arm is already in the stack and priced at zero". `yakar2016` splits that arm in
  two: **liver-derived CIRCULATING IGF-1 regulates mainly RADIAL bone growth and has little effect on
  LONGITUDINAL growth**, while **cartilage-specific Igf1r deletion disorganises the columns, delays
  ossification and cuts chondrocyte proliferation.**
  ⭐ **And the human burden data says the local arm is load-bearing and enormous: IGF1R pLoF+deleterious
  missense -5.23 cm at P=4.0e-43 across 344 carriers, and IRS1 pLoF -5.23 cm at P=3.2e-28 across 219.**
  Those are among the largest and most significant effects in kosmicki2026's entire table.
  **So raising serum IGF-1 (what GH does, what mecasermin does) and raising IGF1R signal transduction
  inside the chondrocyte (what a receptor phosphatase inhibitor does) are DIFFERENT INTERVENTIONS on
  different halves of one axis** - and the atlas's own settled row, "serum IGF-1 does not predict growth
  potential", is a statement about the first half only. Round 325's Step-0 rejection is therefore
  SOFTENED, not withdrawn: the class is not automatically a substitution.
  ⛔ **The same distinction disqualifies the one approved PRO agent.** Mecasermin supplies circulating
  ligand. That is the radial half. It is accessible and it is aimed at the wrong term.


  FOUR - ⭐⭐ SO THE ANSWER TO "EQUAL OR BETTER AND ACCESSIBLE" IS **TRODUSQUEMINE (MSI-1436)**, AND IT BEATS
  COMPOUND 7 ON EVERY AXIS EXCEPT TARGET GENETICS.
  · **It completed PHASE 1 AND 1b IN HUMANS and was well tolerated** (`smith2017msi1436`). Compound 7 has
    never been in a human.
  · **It is an ALLOSTERIC, NON-COMPETITIVE, highly selective PTP1B inhibitor** - a natural aminosterol from
    dogfish shark. **It is NOT an active-site phosphonate**, so it does not carry the charge-driven
    permeability and drug-likeness problem that defines the potent PTP-MEG2 chemotype (compound 7 is MW 680
    to 1241 with a difluoromethylphosphonate).
  · **The animal-effective doses are 5 to 50 FOLD BELOW the maximum well tolerated human dose** - a stated
    therapeutic window, which compound 7 does not have.
  · **It is obtainable.** A natural product with a completed clinical file and commercial research supply,
    against an academic peptidomimetic with no supplier at all.
  · Mechanism is the same half of the axis: PTP1B dephosphorylates the insulin receptor and IGF1R, so
    inhibiting it raises receptor autophosphorylation and AKT. **PTPN1 is present in the postnatal human
    growth plate at 34.6 CPM in 47.8% of cells - MORE than PTPN9's 25.3 CPM in 24.0%.**
  · `lantz2010` is the in vivo package that took it into humans - fat-specific weight loss in DIO mice.
  · `smith2017msi1436` shows it stimulates regeneration in heart and several other tissues, i.e. the
    growth-positive direction in a living mammal.


  FIVE - ⛔ AND THE PROBLEM THAT NOW APPLIES TO THE WHOLE CLASS, NOT TO ONE GENE. **BOTH DRUGGED RECEPTOR
  PHOSPHATASES HAVE A SHORTER KNOCKOUT MOUSE.**
  · Ptpn9 (round 325): decreased body size, embryonic growth retardation, abnormal long bone diaphysis
    morphology, >90% late embryonic lethality.
  · **Ptpn1: MGI records DECREASED BODY LENGTH (MP:0001258) and DECREASED BONE MINERAL DENSITY
    (MP:0000063), with abnormal postnatal growth/weight/body size.**
  Two independent genes, one class, the same direction, both against the human heterozygote height data.
  ⚠ A defence exists for each - Ptpn9's null is a secretory-vesicle catastrophe, Ptpn1's mice are lean with
  reduced adiposity and the length effect may be secondary - and the atlas has learned to distrust exactly
  this kind of defence. **Recorded as the single strongest argument against the class.**
  ✗ PTPN1 is also NOT among kosmicki2026's 207 genes, so unlike PTPN9 it carries no human height number at
  all. **Trodusquemine wins on chemistry and accessibility and loses on target genetics.**


  SIX - ⚠ THE CONTRAINDICATION LIST, WHICH IS THE OTHER HALF OF THE SCREEN AND MAY MATTER MORE.
  Approved agents that push this axis DOWN: **capivasertib** (AKT1/2/3); **alpelisib, copanlisib,
  inavolisib** (PIK3CA); **idelalisib, duvelisib, umbralisib, leniolisib, parsaclisib** (PIK3CD);
  **teprotumumab** (IGF1R, already flagged in round 300); **perhexiline and ridaforolimus** (mTOR); and
  **acadesine**, an AMPK activator.
  ⛔⛔ **AND THAT LAST ONE EXPOSES A CONFLICT INSIDE THIS FILE. Round 297 named METFORMIN "the ONLY one of
  the thirty that targets the PERIOD" and made a fasting-insulin blood test the deciding input. Metformin's
  mechanism is AMPK activation, which INHIBITS mTORC1 - the same direction as rapamycin, which halves a
  rat's longitudinal growth rate.** The two rounds have never been read against each other. This does not
  settle it - metformin's proposed benefit is decelerating bone age, which is a different term from growth
  rate - but **any future metformin proposal has to price the mTORC1 cost, and R297 did not.**


  SEVEN - WHAT THE ROUND DOES NOT DELIVER. No agent on this axis has a bone-LENGTH endpoint in a normal
  growing animal, in any species, at any dose - not compound 7, not trodusquemine, not mecasermin, not
  lithium. And the two experiments that would settle the class are the same shape as the ones this file
  keeps finding unrun: give trodusquemine to a growing wild-type mouse at a dose inside its published
  window and put a caliper on the femur, tibia and spine, with growth-plate phospho-IGF1R and phospho-AKT
  S473 as the readout.
human_evidence: indirect
human_evidence_note: >-
  The axis direction is anchored in human burden genetics (IGF1R -5.23 cm, IRS1 -5.23 cm, MTOR -3.65 cm,
  PTPN9 +3.56 cm) and human clinical genetics (PTEN, AKT1, PIK3CA overgrowth). Trodusquemine's human data
  are phase 1 safety and tolerability only, with no skeletal endpoint. Every efficacy result on the axis is
  mouse or rat.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  Both drugged receptor phosphatases have knockout mice that are SHORTER, which is the opposite of the human
  heterozygote direction the class is proposed on. No agent on the axis has ever been given with a skeletal
  endpoint. And systemic PI3K-AKT elevation is the mechanism of several overgrowth-with-cancer syndromes.
confidence: C
confidence_reason: >-
  C. The screen itself is complete and reproducible and its negative - 36 of 41 nodes with no agent in the
  wanted direction - is solid. The radial-versus-longitudinal distinction is well supported and materially
  changes round 325's Step-0 call. What keeps this at C is that the recommended compound's target has no
  human height number, its knockout mouse is shorter, and nothing on this axis has a length endpoint.
limitations:
- Open Targets mechanism strings are keyword-classified; a match is triage, not a drug label, and
  trodusquemine itself does not appear in that database because it is a discontinued clinical asset.
- Directions were assigned by hand from pathway biology; a node with context-dependent sign (PTPN11 for
  RAS/MAPK) was excluded rather than guessed.
- Raising AKT is a pathway-level statement; second-messenger and phospho-signalling compartmentalisation
  is real (CORR-332) and no agent here has been shown to raise phospho-AKT in a growth plate.
- IMPC has no significant length endpoint for any node on this axis - the best is Prkaa2-null tibia +0.414
  at P=0.13 - so the mouse phenotyping resource neither supports nor refutes the direction.
