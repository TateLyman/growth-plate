claim_grades:
- claim: The PI3K-AKT-mTOR axis has almost no pharmacology in the growth-promoting direction.
  grade: A
  basis: 36 of 41 nodes return no agent at all, including every phosphatase and every mTORC1 brake. The five
    exceptions are the two receptors, GSK3B, and a keyword artefact.
- claim: Round 325's Step-0 rejection of the receptor-phosphatase class was too strong.
  grade: B
  basis: yakar2016 separates circulating IGF-1 (radial) from local IGF1R transduction (longitudinal), and
    kosmicki2026 prices the local arm at -5.23 cm for IGF1R and -5.23 cm for IRS1. The stack's GH arm acts
    on the first; a receptor phosphatase inhibitor acts on the second. B not A because the distinction rests
    on a review of mouse models rather than on a direct measurement in this tissue.
- claim: Mecasermin is the accessible answer.
  grade: X
  basis: 'NO. It is approved and obtainable and it supplies CIRCULATING ligand, which is the radial half of
    the axis. The atlas already prices serum IGF-1 at no predictive value for growth potential, and this
    subject''s is 198.'
- claim: Trodusquemine is better characterised and more accessible than compound 7.
  grade: A
  basis: Completed human phase 1 and 1b with good tolerability against a compound that has never been in a
    human; allosteric rather than an active-site phosphonate; a stated 5-50 fold window between
    animal-effective and maximum tolerated human doses; commercially obtainable as a natural product against
    an academic peptidomimetic with no supplier.
- claim: Trodusquemine should be added to this stack.
  grade: X
  basis: 'NO. Its target has no human height number - PTPN1 is not among kosmicki''s 207 - and Ptpn1-null
    mice have DECREASED BODY LENGTH and decreased bone mineral density, which together with Ptpn9''s
    smaller null makes two independent genes in one class pointing the wrong way. And no agent on this axis
    has a bone-length endpoint in any species.'
- claim: Metformin's period argument is unaffected by this axis.
  grade: X
  basis: 'NO, AND THE TWO ROUNDS HAVE NEVER BEEN READ TOGETHER. Metformin activates AMPK, which inhibits
    mTORC1 - the same direction as rapamycin, which halves a rat''s longitudinal growth rate, and the same
    direction as acadesine, which this screen returns as a CONTRA agent. Round 297 proposed metformin as the
    only period-directed agent in its audit without pricing that cost.'
