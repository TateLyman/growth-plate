id: round225_the_bone_age_rates_measured_and_round_224_gives_two_legs_back
name: ROUND 225 - both things asked for were found and both destroy the hypothesis they were meant to test;
  a randomised placebo-controlled Greulich-Pyle bone-age rate exists in children with intact gonadal axes
  and shows 1.02 against 1.14 years per year, the Wong child was mid-pubertal rather than pre-pubescent, and
  the one FGFR-inhibitor bone-age claim in this atlas has no prespecified endpoint behind it
type: hypothesis
layer: L12
aliases:
- the bone age rates measured
- 1.02 against 1.14
- the Wong child was Tanner 2-3
- anastrozole is not a prerequisite after all
- round 225
stub: false
summary: 'THE TASK WAS TO FIND TWO THINGS - A BASELINE BONE AGE FOR THE WONG CASE, AND A BONE AGE IN A CHILD
  WITH INTACT GONADAL FUNCTION. BOTH WERE FOUND. BOTH DESTROY THE HYPOTHESIS THEY WERE MEANT TO TEST.

  THE SECOND ONE FIRST, BECAUSE IT IS THE STRONGER. The Voxzogo CHMP assessment report - a file this atlas
  has held since round 207 - contains a RANDOMISED, PLACEBO-CONTROLLED BONE-AGE RATE measured by the
  GREULICH AND PYLE atlas method on left hand and wrist X-rays. Study 111-301, baseline bone age about 8
  years in both arms, 52 weeks: MEAN CHANGE FROM BASELINE 1.02 YEARS (SD 0.83) ON VOSORITIDE AGAINST 1.14
  YEARS (SD 0.82) ON PLACEBO, similar in males and females, with no acceleration to Month 48 in the
  111-202/205 studies. THE TREATED ARM MATURED SLIGHTLY LESS THAN PLACEBO.

  CHILDREN WITH ACHONDROPLASIA HAVE NORMAL GONADAL FUNCTION. So the question round 224 could not answer from
  three case reports is answered by a randomised trial: AN AGENT THAT SUPPRESSES THE FGFR3-MAPK AXIS GREW
  CHILDREN WITHOUT ADVANCING BONE AGE, IN A POPULATION WITH INTACT SEX STEROIDS. A sex-steroid-poor
  background is NOT required for the effect.

  AND THE OTHER LEG BREAKS TOO. erdachild2024, read directly rather than through this atlas''s own one-line
  summary: the boy was AGED 15 YEARS 4 MONTHS AT START, TANNER STAGE 2-3, with total testosterone CONSISTENT
  WITH THE EARLY PUBERTAL STAGE and GH, IGF-I and IGFBP-3 WITHIN NORMAL RANGES FOR PUBERTAL STAGE II-III, and
  no pituitary or gonadal deficiency reported. The bibliography entry called him a PRE-PUBESCENT boy with
  PRE-pubertal hormones and round 224 built on that. HE WAS MID-PUBERTAL WITH NORMAL GROWTH-AXIS HORMONES,
  and he is the 19.06 cm/year child - the strongest case in the whole series. ROUND 224''s "ALL THREE
  CHILDREN WERE SEX-STEROID DEFICIENT" IS FALSE.

  SO ROUND 224''s CENTRAL HYPOTHESIS - that a sex-steroid-poor background is the CONDITION under which the
  FGFR arm grows without maturing, making anastrozole a PREREQUISITE rather than a parallel lever - LOSES
  BOTH ITS LEGS IN ONE ROUND. Its premise was factually wrong for the strongest case, and its conclusion is
  contradicted by a randomised trial in children with intact axes. ANASTROZOLE RETURNS TO BEING AN
  INDEPENDENT LEVER, which is what it was before round 224 promoted it. Recorded as CORR-229.

  THE BASELINE BONE AGE DOES NOT EXIST AND THE AUTHORS SAY SO IN TERMS - BONE AGE ASSESSMENTS HAD NOT BEEN
  PERFORMED PRIOR TO OR DURING ERDAFITINIB THERAPY. What exists is two readings, both after the drug: bone
  age 14.0 at chronological age 16.2 at cessation, and still about two years delayed at chronological age 17
  years 5 months. Taken literally that interval gives 0.98 to 1.15 bone-age years per calendar year - but
  THERAPY HAD ALREADY CEASED AT 16.2, SO THE INTERVAL IS LARGELY OFF DRUG and it is not an on-treatment rate.
  THE ON-TREATMENT BONE-AGE RATE FOR ERDAFITINIB DOES NOT EXIST AND CANNOT BE RECOVERED FROM THIS CASE
  BECAUSE THE FILMS WERE NEVER TAKEN.

  AND THE COACH CONTRAST HAS TO BE RESTATED TWICE OVER. FIRST, THE COMPARATOR IS WRONG. Round 223 read
  COACH''s 1.33 and 1.57 bone-age years per calendar year against an implicit normal rate of 1.0. The only
  measured contemporaneous control on this axis matured at 1.14, so the excess attributable to adding growth
  hormone is about PLUS 0.19 AND PLUS 0.43 rather than plus 0.33 and plus 0.57. SECOND, THE NOISE SWALLOWS
  PART OF WHAT IS LEFT. The EPAR supplies the only dispersion anywhere in this comparison - SD about 0.82
  years on a 52-week bone-age change, which is Greulich-Pyle reader variability as much as biology. COACH
  reports NO dispersion for its ratios and has n = 12 and 9; at n = 9 a 95 per cent interval spans about plus
  or minus 0.54 years, which comfortably contains the gap between 1.57 and 1.14. THE CONTRAST IS DIRECTIONAL
  AND NOT STATISTICALLY ESTABLISHED, and round 223 stated it as though it were.

  WHAT SURVIVES IS STILL WORTH HAVING AND IS NOW BETTER SOURCED. Suppressing the FGFR3-MAPK axis grows
  children without measurably advancing bone age, and that is now a RANDOMISED, PLACEBO-CONTROLLED result
  with numbers and a method rather than three uncontrolled case reports. Growth hormone added on top is
  directionally the arm that carries the bone-age cost, and it remains the only agent in this file that moves
  the ratio at all.

  AND ONE PROVENANCE PROBLEM THAT IS WORSE THAN IT LOOKS. This atlas''s claim that infigratinib shows NO
  ACCELERATED PROGRESSION OF BONE AGE comes from propel3_2026, recorded as a T3 CONFERENCE PRESENTATION PDF.
  Querying the registry directly, NCT06164951 HAS NO BONE-AGE OUTCOME MEASURE AT ALL - not primary, not
  secondary, not exploratory - and the NEJM abstract contains no bone-age statement. THE ONLY BONE-AGE CLAIM
  FOR THE DRUG CLASS THIS STACK ACTUALLY USES HAS NO PRESPECIFIED ENDPOINT BEHIND IT. The vosoritide numbers
  are excellent and they are a DIFFERENT MOLECULE reaching the same axis from the other end; transferring
  them to an FGFR inhibitor is the same style of assumption round 223 flagged, one axis over.'
quantitative:
- parameter: randomised placebo-controlled bone-age rate on the CNP arm, Greulich-Pyle
  value: 'study 111-301, baseline bone age approximately 8 years in both arms, 52 weeks - mean change from
    baseline 1.02 years (SD 0.83) on vosoritide against 1.14 years (SD 0.82) on placebo, a difference of
    minus 0.12 years, similar in males and females. Studies 111-202/205 showed no abnormal acceleration or
    abnormal change in skeletal maturity up to Month 48'
  unit: bone-age years per calendar year
  conditions: EMA/397108/2021, children with achondroplasia and normal gonadal function, Greulich and Pyle
    atlas method on left hand and wrist X-rays
  species: human
  source_ref: ema_voxzogo_epar_2021
  uncertainty: 'THE SD OF 0.82 TO 0.83 YEARS IS THE POINT TO HOLD ONTO - that is Greulich-Pyle reader
    variability as much as biology, and it is the only dispersion figure available anywhere in this
    comparison. Regulatory prose over a study report this atlas has not seen. It is a CNP agent, not an FGFR
    inhibitor, so it reaches the axis from the opposite end'
- parameter: the pubertal and hormonal status of the 19.06 cm/year child, read directly
  value: age 15 years 4 months at start, TANNER STAGE 2-3 described as delayed, total testosterone consistent
    with the EARLY PUBERTAL STAGE with free testosterone low, and GH, IGF-I and IGFBP-3 WITHIN NORMAL RANGES
    for a male at pubertal stage II-III, with no pituitary or gonadal deficiency reported. Erdafitinib 7 mg
    daily for 5 months with frequent interruptions for hyperphosphataemia, then 5 mg
  unit: Tanner stage and hormone status
  conditions: erdachild2024 full text, replacing this atlas's own one-line summary which described him as
    pre-pubescent with pre-pubertal hormones
  species: human
  source_ref: erdachild2024
  uncertainty: 'A SINGLE CASE, AND THE HORMONE VALUES ARE REPORTED QUALITATIVELY AS CONSISTENT WITH STAGE
    RATHER THAN AS NUMBERS. What is unambiguous is Tanner 2-3 and the explicit statement that the growth-axis
    hormones were within normal ranges for that stage, which is incompatible with the description round 224
    relied on'
- parameter: the absent baseline bone age, and what the two post-treatment readings do and do not give
  value: 'the authors state that BONE AGE ASSESSMENTS HAD NOT BEEN PERFORMED PRIOR TO OR DURING ERDAFITINIB
    THERAPY. Two readings exist, both after cessation - bone age 14.0 at chronological age 16.2 at cessation,
    and still about 2 years delayed at chronological age 17 years 5 months, which taken literally gives 0.98
    to 1.15 bone-age years per calendar year over that interval'
  unit: bone-age years per calendar year, off treatment
  conditions: erdachild2024; therapy ceased at chronological age 16.2 so the interval is largely off drug
  species: human
  source_ref: erdachild2024
  uncertainty: 'THIS IS NOT AN ON-TREATMENT RATE AND MUST NOT BE USED AS ONE. The second reading is
    qualitative - REMAINED 2 YEARS DELAYED - so the derived rate depends on whether the delay was 2.0 or 2.2
    years, and the whole interval postdates the drug. The on-treatment rate cannot be recovered because the
    films were never taken'
- parameter: the COACH bone-age excess restated against the measured control and against the noise
  value: 'against the vosoritide trial''s PLACEBO rate of 1.14 rather than an implicit 1.0, the COACH
    combination''s excess is plus 0.19 (treatment-naive, 1.33) and plus 0.43 (navepegritide-experienced,
    1.57) bone-age years per calendar year. At n = 9 and an SD of 0.82, a 95 per cent interval on a mean
    bone-age change spans about plus or minus 0.54 years, which contains the gap between 1.57 and 1.14'
  unit: excess bone-age years per calendar year, with a noise floor
  conditions: computed in atlas/tools/round225_the_bone_age_rates.py, using the EPAR SD as the only available
    dispersion estimate
  species: human
  source_ref: mcdonnell2026
  uncertainty: 'THE SD IS BORROWED FROM A DIFFERENT TRIAL IN A DIFFERENT COHORT, which is the best available
    and is not the right one. COACH reports no dispersion for its ratios at all. THE CONTRAST IS DIRECTIONAL
    AND NOT STATISTICALLY ESTABLISHED, and no test has been run on it by the paper or by this atlas'
  value_unverified: true
localization:
- 'the left hand and wrist, where every bone age in this comparison was read'
- 'the hypothalamic-pituitary-gonadal axis, intact in the randomised population and mid-pubertal in the case'
human_evidence: direct
human_evidence_note: 'The bone-age rate is randomised, placebo-controlled and human, by a stated method. The
  case-report pubertal status is human and single. No on-treatment bone age exists for any FGFR inhibitor.'
species_basis:
- human
translation_risk: moderate
translation_risk_reason: 'The randomised bone-age evidence is for a CNP agent in achondroplasia and is being
  read across to an FGFR inhibitor in a normal background - two transfers, both flagged elsewhere in this
  atlas as untested.'
confidence: B
claim_grades:
- claim: a sex-steroid-poor background is the condition under which the FGFR arm grows without maturing
  grade: X
  basis: 'FALSE ON BOTH LEGS. The randomised vosoritide bone-age data show 1.02 against 1.14 years per year
    in children with INTACT gonadal function, so the effect does not require sex-steroid deficiency. And the
    premise was wrong - the 19.06 cm/year child was Tanner 2-3 with normal GH, IGF-I and IGFBP-3, not
    pre-pubescent. Round 224 proposed this and it does not survive one round'
- claim: anastrozole is a prerequisite for the FGFR arm rather than a parallel lever
  grade: X
  basis: WITHDRAWN WITH THE HYPOTHESIS IT RESTED ON. It returns to being an independent lever, which is what
    it was before round 224 promoted it
- claim: suppressing the FGFR3-MAPK axis grows children without advancing bone age
  grade: B
  basis: 'UPGRADED FROM E AND NOW RANDOMISED. Bone age by Greulich and Pyle in a placebo-controlled trial,
    1.02 years on drug against 1.14 on placebo over 52 weeks from a baseline of about 8 years, similar in
    both sexes, with no acceleration to Month 48 in the extension studies. It is a CNP agent rather than an
    FGFR inhibitor, and the SD of 0.83 years means only a large effect could have been detected'
- claim: an on-treatment bone-age rate exists for erdafitinib
  grade: X
  basis: FALSE, AND THE AUTHORS STATE IT - bone age assessments had not been performed prior to or during
    erdafitinib therapy. The two readings that exist both postdate cessation, so they measure off-drug
    maturation
- claim: the COACH combination's bone-age excess is established
  grade: E
  basis: 'DIRECTIONAL ONLY. Against the measured placebo rate of 1.14 rather than an implicit 1.0 the excess
    falls to plus 0.19 and plus 0.43, and at n = 9 with an SD of 0.82 a 95 per cent interval spans about plus
    or minus 0.54 years, which contains it. Round 223 presented it as established'
- claim: infigratinib has been shown not to accelerate bone age
  grade: D
  basis: 'ASSERTED IN A CONFERENCE SLIDE DECK WITH NO PRESPECIFIED ENDPOINT BEHIND IT. NCT06164951 registers
    NO bone-age outcome measure of any kind and the NEJM abstract contains no bone-age statement. The only
    bone-age claim for the drug class this stack uses rests on a sentence in a T3 source'
