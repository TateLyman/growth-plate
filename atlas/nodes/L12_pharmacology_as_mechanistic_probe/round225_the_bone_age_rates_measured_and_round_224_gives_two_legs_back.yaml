contradicts:
- 'ROUND 224''s central hypothesis that a sex-steroid-poor background is the condition for growth without
  bone-age advance, and that anastrozole is therefore a prerequisite. Both legs fail - the randomised
  vosoritide bone-age data come from children with intact gonadal axes, and the 19.06 cm/year child was
  Tanner 2-3 with normal growth-axis hormones. Recorded as CORR-229.'
- 'This atlas''s own bibliography entry for erdachild2024, which described a PRE-PUBESCENT boy with
  PRE-pubertal GH, IGF-I, IGFBP-3 and testosterone. The paper reports age 15 years 4 months, Tanner 2-3, and
  those hormones WITHIN NORMAL RANGES for that stage. Corrected in place.'
- 'ROUND 223''s presentation of the COACH bone-age excess as established. Against the measured placebo rate
  of 1.14 and a 0.82-year noise floor it is directional only. Recorded as CORR-230.'
