contradicts:
- 'ROUNDS 213 AND 215, on the absolute coverage figures. Both used a TYRA conference panel roughly eightfold
  more potent than either developer''s own primary characterisation, so every stated multiple of IC50 was
  inflated by about eight. The RATIO between the two drugs survives because both came from that one panel.
  Recorded as CORR-211.'
- 'ROUND 213''s implication that dabogratinib is the molecule because of selectivity. On attainable doses
  the ranking inverts - erdafitinib at 9 mg delivers 2.8-fold more free FGFR3 coverage than the top
  paediatric dabogratinib dose and 1.8-fold more than its hepatically clean dose.'
- 'ROUND 215''s upgrade of the lysosome-alkaliniser route. It is incompatible with the pulsed schedule that
  is the better idea, because the depot is what carries target suppression through the off period.'
