id: round216_erdafitinib_is_ahead_on_attainable_coverage_and_the_fix_is_the_schedule
name: ROUND 216 - on the developers' own potency numbers the two molecules are equipotent at FGFR3, erdafitinib
  at its label maximum beats dabogratinib at every dose the paediatric programme will use, the whole human
  growth record sits on the bottom shoulder of the curve, and the one untried fix is the schedule
type: hypothesis
layer: L12
aliases:
- erdafitinib fully mapped
- can erda climb the curve
- the pemigatinib schedule precedent
- round 216
stub: false
summary: 'THE USER ASKED WHETHER ERDAFITINIB CAN BE MADE TO WORK MAXIMALLY AGAINST THE ACCELERATING CURVE
  ROUND 215 ESTABLISHED, AND WHETHER ITS PROBLEMS ARE FIXABLE WITH ANYTHING NICHE. The reason is cost -
  dabogratinib is investigational, erdafitinib is a marketed tablet. The answer turns on a number this atlas
  had wrong twice.

  ROUNDS 213 AND 215 EXPRESSED TARGET COVERAGE AS MULTIPLES OF FGFR3 CELLULAR IC50 USING THE PANEL ON A
  TYRA CONFERENCE SLIDE. Both developers'' own primary papers are now in hand. perera2017, the erdafitinib
  discovery paper, gives erdafitinib a Ba/F3 FGFR3 IC50 of 13.2 nmol/L. hudkins2024''s supporting
  information gives dabogratinib, compound 22, 11 nmol/L. THE TWO DEVELOPERS AGREE WITH EACH OTHER WITHIN
  1.2-FOLD AND BOTH DISAGREE WITH THE MARKETING PANEL BY ROUGHLY EIGHTFOLD. Every absolute coverage figure
  in rounds 213 and 215 was inflated by about eight. The RATIO survived because both drugs were taken from
  one slide; the absolute framing did not. Recorded as CORR-211.

  AND THE CORRECTED READING IS MORE USEFUL, BECAUSE ON THE DEVELOPERS'' OWN NUMBERS THE TWO MOLECULES ARE
  ESSENTIALLY EQUIPOTENT AT FGFR3. Everything then reduces to free concentration, which is a pure
  pharmacokinetic question.

  AT THE DOSES EACH DRUG CAN ACTUALLY BE GIVEN, ERDAFITINIB IS AHEAD. Erdafitinib at its 9 mg label maximum
  reaches 0.53 times its own cellular IC50 in free plasma. Dabogratinib reaches 0.19 at the TOP BEACH301
  PAEDIATRIC DOSE of about 45 mg adult-equivalent, 0.29 at the hepatically clean 60 mg, 0.69 at 90 mg where
  the liver signal appears, and 1.58 at 120 mg where AST reached grade 3 in two of four. SO ERDAFITINIB AT
  ITS LABEL MAXIMUM BEATS DABOGRATINIB BY 2.8-FOLD AT THE TOP PAEDIATRIC DOSE AND BY 1.8-FOLD AT ITS
  HEPATICALLY CLEAN DOSE, and dabogratinib only overtakes it by accepting the hepatic signal - and even at
  90 mg the margin is about a third. THAT IS THE OPPOSITE OF WHAT THE SELECTIVITY STORY IMPLIES, and it is
  consistent with the clinical record, because erdafitinib is the only FGFR inhibitor that has ever produced
  19 cm/year in a child.

  AND NOTICE WHERE EVERYONE SITS ON THE CURVE. On the developers'' own cellular IC50 nobody reaches 1x free
  coverage except dabogratinib at 120 mg. Erdafitinib produced 19.06 cm/year at 0.41x and about 10 cm/year
  at 0.18x. THE ENTIRE HUMAN GROWTH RECORD SITS ON THE BOTTOM SHOULDER OF THE CONCENTRATION-RESPONSE, WHICH
  IS EXACTLY WHERE ROUND 215''s MOUSE RE-ANALYSIS SAID THE CURVE IS STEEPEST. Two independent lines agreeing
  that the top has never been approached. THE CAVEAT THAT MATTERS - a four-day Ba/F3 PROLIFERATION IC50 is a
  harsher endpoint than pathway inhibition, and perera2017''s own washout work suppressed phospho-FGFR
  completely at 30 nmol/L nominal for one hour, so the concentration needed to inhibit the pathway is
  probably well below the concentration needed to stop a cell dividing.

  WHAT ACTUALLY GATES ERDAFITINIB IS FOUR EPITHELIAL TOXICITIES, AND THEY ARE NOT EQUALLY FIXABLE. Nail
  disorders drive 22 per cent of interruptions and 27 per cent of reductions and turn over across months -
  the hardest. Stomatitis drives 19 and 19 and recovers in one to two weeks. Eye disorders drive 16 and 17,
  and ohagan2026 across five studies plus RAGNAR now shows retinopathy at 21.5 and 13.7 per cent with GRADE
  3 IN ONLY 2.3 AND 1.0 PER CENT, no grade 4, discontinuation in 2.9 and 1.0, and roughly two thirds
  RESOLVED by data cutoff - so the scariest of the four is largely reversible. Hyperphosphataemia has the
  highest incidence at 75 per cent and the lowest dose cost at 7 and 4.4 per cent, and its management is
  fully codified in surf301_protocol_v4 - dietary restriction to 600-800 mg/day, sevelamer 800-1600 mg three
  times daily, acetazolamide above 9 mg/dL. THE INDEX CHILD''S INTERRUPTIONS WERE FOR HYPERPHOSPHATAEMIA, so
  in that one case this lever alone might have kept him on drug.

  THE ONE GENUINELY UNTRIED FIX IS THE SCHEDULE, AND THE CLASS ALREADY HAS AN APPROVED PRECEDENT. patel2023
  - pemigatinib''s FDA-approved dosage is 13.5 mg once daily for FOURTEEN CONSECUTIVE DAYS FOLLOWED BY SEVEN
  DAYS OFF, and it delivers an objective response rate of 36 per cent against erdafitinib''s 35.3 per cent
  on CONTINUOUS dosing. Same class, same target family, equivalent efficacy, and the schedule exists
  precisely because of these toxicities. ERDAFITINIB IS THE CLASS MEMBER BEST SUITED TO INTERMITTENT DOSING
  AND IS THE ONE GIVEN CONTINUOUSLY - a 59-hour plasma half-life PLUS the lysosomal depot that perera2017
  showed holds complete phospho-FGFR suppression for four hours and only returns to basal at 24 hours after
  a ONE-HOUR exposure, against two hours for a matched non-lysosomotropic analogue at ten times the
  concentration. THE EPITHELIUM GETS A HOLIDAY THAT THE GROWTH PLATE LARGELY DOES NOT. What a pulse cannot
  fix is nail toxicity, whose turnover is months.

  TWO LEVERS THAT LOOK GOOD AND ARE NOT WHAT THEY SEEM. PHARMACOKINETIC BOOSTING IS REAL BUT DOES NOT BEAT
  THE GATE - erdafitinib is cleared 39 per cent by CYP2C9 and 20 per cent by CYP3A4, so an inhibitor of
  either raises exposure at the same milligram dose, which LOWERS COST PER UNIT EXPOSURE and is therefore
  responsive to the user''s actual constraint, but it scales FGFR3 and FGFR2 together and is arithmetically
  identical to raising the dose, which the label already permits to 9 mg. AND THE LYSOSOME ALKALINISER IS
  ACTIVELY COUNTERPRODUCTIVE UNDER A PULSED SCHEDULE - the whole point of pulsing erdafitinib is that the
  depot carries target suppression through the off period, and chloroquine empties the depot. THE TWO BEST
  IDEAS IN THIS FILE ARE MUTUALLY EXCLUSIVE and the schedule one is far better evidenced.

  AND THE THING THAT IS NOT FIXABLE PHARMACOLOGICALLY IS THE SPINE, WHICH IS THE TERM THAT DECIDES ADULT
  HEIGHT. Five of five paediatric cases discontinued at a median of 137 days and three required surgery. A
  kyphoscoliotic spine is shorter and a spinal fusion ENDS spinal growth, converting a yield gain into a
  permanent yield loss. What exists is orthopaedic rather than pharmacological - serial Cobb-angle imaging,
  bracing at threshold rather than after deformity, and the open question of prophylactic in-situ pinning
  for the slipped capital femoral epiphysis. THIS ATLAS HAS NO EVIDENCE THAT ANY OF IT WORKS UNDER AN FGFR
  INHIBITOR. Until it does, erdafitinib''s ceiling is still a clock, and the clock caps the integral no
  matter how favourable the coverage arithmetic looks.'
quantitative:
- parameter: the three FGFR3 cellular potency datasets reconciled
  value: perera2017, the erdafitinib developers - erdafitinib Ba/F3 FGFR3 IC50 13.2 nmol/L, with enzyme IC50
    for FGFR1-4 of 1.2, 2.5, 3.0 and 5.7 nmol/L, KINOMEscan Kd of 0.24, 2.2, 1.1 and 1.4, VEGFR2 cellular
    1160 and IL-3 rescue above 7000. hudkins2024 supporting information, the dabogratinib developers -
    dabogratinib Ba/F3 FGFR3 11 nmol/L. THE TWO AGREE WITHIN 1.2-FOLD. The TYRA conference panel used in
    rounds 213 and 215 gives 1.35 and 1.75 nmol/L, roughly EIGHTFOLD more potent than either developer's own
    primary data
  unit: nmol/L, Ba/F3 cellular IC50
  conditions: perera2017 Table 1 against hudkins2024 supporting information against surf301_ena2024 slide 6
  species: in_vitro_animal_cell
  source_ref: perera2017
  uncertainty: 'THIS CORRECTS THE ABSOLUTE FRAMING OF TWO PREVIOUS ROUNDS. Both developers characterise
    their own molecule at 11 to 13 nmol/L in Ba/F3, and the marketing panel that put both near 1.5 nmol/L
    is the outlier. THE RATIO IN ROUND 213 SURVIVES because both drugs came from one panel. Assay
    conditions are not matched across sources - ATP concentration, readout and incubation all differ, and
    perera2017 used a 4-day proliferation endpoint'
- parameter: free FGFR3 coverage at the doses each drug can actually be given
  value: erdafitinib (fu 0.3 per cent, IC50 13.2 nmol/L) - 3 mg gives 0.18 times IC50, 7 mg 0.41, 8 mg 0.47,
    9 mg label maximum 0.53. Dabogratinib (fu about 1 per cent derived, IC50 11 nmol/L) - about 45 mg, the
    TOP BEACH301 PAEDIATRIC DOSE, gives 0.19; 60 mg, the hepatically clean dose, 0.29; 90 mg, where the
    liver signal appears, 0.69; 120 mg 1.58. SO ERDAFITINIB AT LABEL MAXIMUM IS 2.8-FOLD ABOVE THE TOP
    PAEDIATRIC DABOGRATINIB DOSE AND 1.8-FOLD ABOVE ITS HEPATICALLY CLEAN DOSE
  unit: multiples of each drug's own Ba/F3 FGFR3 cellular IC50, free steady-state average
  conditions: erdafitinib from zhu2026 population PK; dabogratinib from surf301_ena2024's C1D15 AUC table
    with the protein binding derived in round 214; potency from each developer's own paper
  species: human
  source_ref: perera2017
  uncertainty: 'THE ANSWER TO THE USER''s QUESTION AND IT FAVOURS THE CHEAPER MOLECULE. It inherits round
    214''s derived dabogratinib protein binding, which is still not a measured value, and it compares a free
    plasma concentration with a nominal cell-assay IC50 - defensible in kind but not exact. NEITHER DRUG''s
    CONCENTRATION HAS EVER BEEN MEASURED IN CARTILAGE'
  value_unverified: true
- parameter: where the human growth record sits on the concentration-response
  value: erdafitinib produced 19.06 cm/year at 0.41 times its cellular IC50 and about 10 cm/year at 0.18
    times. On the developers' own numbers NOBODY in either programme reaches 1 times free coverage except
    dabogratinib at 120 mg
  unit: multiples of cellular IC50 against cm/year
  conditions: erdachild2024 at 7 mg and erdaseries2025 at 3 mg, coverage computed as above
  species: human
  source_ref: erdachild2024
  uncertainty: 'THE ENTIRE HUMAN GROWTH RECORD IS ON THE BOTTOM SHOULDER OF THE CURVE, which agrees
    independently with round 215''s mouse re-analysis showing the marginal gain per mg/kg is four times
    steeper over 12-to-14 than over 0-to-12. AGAINST OVERREADING - a four-day proliferation IC50 is a
    harsher endpoint than pathway inhibition, and perera2017 suppressed phospho-FGFR completely at 30 nmol/L
    nominal, so the pathway EC50 is probably well below the proliferation IC50 and these fractions
    understate pathway engagement by an unknown factor'
  value_unverified: true
- parameter: the approved intermittent-dosing precedent in the same class
  value: pemigatinib's FDA-approved dosage is 13.5 mg orally once daily for FOURTEEN CONSECUTIVE DAYS
    FOLLOWED BY SEVEN DAYS OFF THERAPY, and in FIGHT-202 it produced an objective response rate of 36 per
    cent with a median duration of response of 9.1 months - against erdafitinib's 35.3 per cent on
    CONTINUOUS daily dosing
  unit: schedule and objective response rate
  conditions: patel2023, FDA approval summary for pemigatinib in FGFR2-rearranged cholangiocarcinoma,
    efficacy in 107 patients and safety in 466
  species: human
  source_ref: patel2023
  uncertainty: 'THE STRONGEST ARGUMENT IN THE ROUND AND IT IS A REGULATORY FACT RATHER THAN A HYPOTHESIS -
    a one-week-in-three drug holiday costs nothing in response rate in this class. AGAINST TRANSFER - it is
    a different molecule, a different tumour and a different FGFR isoform driving the disease, and a tumour
    response rate is not a growth plate. Nobody has run an intermittent schedule for growth in any species'
- parameter: the FGFR2 ocular gate is largely reversible
  value: FGFR-inhibitor-associated retinopathy in 103 of 479 (21.5 per cent) across five pooled mUC studies
    and 43 of 314 (13.7 per cent) in RAGNAR; MOST GRADE 1 OR 2, grade 3 in only 11 of 479 (2.3 per cent) and
    3 of 314 (1.0 per cent), NO GRADE 4; 78.6 per cent occurred within 90 days; managed by interruption in
    8.6 and 7.3 per cent and reduction in 12.1 and 6.7 per cent, with DISCONTINUATION IN ONLY 2.9 AND 1.0
    PER CENT, and 63.1 and 65.1 per cent RESOLVED by data cutoff
  unit: per cent incidence, grade distribution and resolution
  conditions: ohagan2026, pooled erdafitinib clinical trial programme
  species: human
  source_ref: ohagan2026
  uncertainty: 'MATERIALLY SOFTENS ONE OF THE FOUR GATES. Eye disorders drive 16 to 17 per cent of dose
    modifications but almost never force discontinuation and mostly resolve. IT DOES NOT SOFTEN THE OTHER
    THREE, and nail toxicity - the largest driver at 22 and 27 per cent - has a turnover time of months and
    is the one a drug holiday cannot rescue'
localization:
- 'the nail matrix, oral mucosa, palms, soles and retinal pigment epithelium, where FGFR2 sits and where
  erdafitinib actually loses its dose'
- 'the lysosome, which is why erdafitinib holds target suppression twelve times longer than a matched
  analogue and is therefore the class member best suited to a pulsed schedule'
- 'the spine, where the yield is actually lost and where no pharmacological lever exists'
human_evidence: direct
human_evidence_note: 'Both potency datasets are from the developers'' own primary papers. The PK, the
  dose-modification rates, the retinopathy outcomes and the pemigatinib schedule precedent are all human.
  What is not human is any growth result under an intermittent schedule, in any species.'
species_basis:
- human
- in_vitro_animal_cell
- in_vitro_human_cell
translation_risk: high
translation_risk_reason: 'The coverage comparison rests on a derived protein binding for one drug and on
  comparing free plasma with a nominal cell-assay IC50 in a tissue neither drug has been measured in. The
  schedule argument transfers a tumour response rate to a growth plate.'
confidence: B
claim_grades:
- claim: erdafitinib and dabogratinib are essentially equipotent at FGFR3 in cells
  grade: B
  basis: each developer's own primary characterisation of their own molecule, 13.2 against 11 nmol/L in the
    same assay format. Different laboratories, unmatched assay conditions
- claim: the coverage multiples reported in rounds 213 and 215 were correct in absolute terms
  grade: X
  basis: FALSE. They used a conference panel roughly eightfold more potent than either developer's own
    primary data, inflating every absolute figure by about eight. The ratio survived
- claim: erdafitinib at its label maximum delivers more free FGFR3 coverage than dabogratinib at any dose
    the paediatric programme will use
  grade: B
  basis: 0.53 against 0.19 times IC50, a 2.8-fold margin, and 1.8-fold against the hepatically clean 60 mg.
    Inherits a derived protein binding for dabogratinib
- claim: the entire human growth record sits on the bottom shoulder of the concentration-response
  grade: C
  basis: 0.41 times cellular IC50 for the 19.06 cm/year case and 0.18 for the 10 cm/year case, agreeing
    independently with the mouse re-analysis. A proliferation IC50 overstates the concentration needed for
    pathway inhibition by an unknown factor
- claim: an intermittent schedule preserves FGFR-inhibitor efficacy
  grade: B
  basis: pemigatinib is APPROVED 14 days on and 7 days off with a 36 per cent response rate against
    erdafitinib's 35.3 on continuous dosing. Different molecule, different tumour, and a tumour endpoint
- claim: an intermittent schedule preserves the GROWTH effect
  grade: E
  basis: NEVER TESTED IN ANY SPECIES. It is mechanistically motivated by erdafitinib's 59-hour half-life
    and its lysosomal depot holding target suppression twelve times longer than a matched analogue
- claim: pharmacokinetic boosting raises erdafitinib's ceiling
  grade: X
  basis: FALSE. It scales FGFR3 and FGFR2 exposure together and is arithmetically identical to raising the
    dose, which the label already permits to 9 mg. It lowers COST per unit exposure, which is a different
    and real benefit
- claim: the spinal deformity is pharmacologically addressable
  grade: X
  basis: FALSE. Nothing in this atlas addresses it. The available levers are orthopaedic and none has been
    studied under an FGFR inhibitor
