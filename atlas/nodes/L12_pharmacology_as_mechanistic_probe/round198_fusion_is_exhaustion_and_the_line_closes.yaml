id: round198_fusion_is_exhaustion_and_the_line_closes
name: ROUND 198 - fusion is triggered by exhaustion of proliferative potential, the receptor is still
  there but saturated, and the PTH1R line closes negative on a mechanism rather than on a pile of nulls
type: hypothesis
layer: L12
aliases:
- fusion is exhaustion
- weise2001 closes the gap
- the receptor persists but is saturated
- round 198
stub: false
summary: 'BOTH DECISIVE GAPS ARE NOW ANSWERED, ONE BY A PAPER FROM 2001 AND ONE BY A PAPER FROM 2000, AND
  NEITHER NEEDED NEW TISSUE.

  GAP ONE WAS WHETHER AN ACCELERATED SIX MONTHS IS BANKED IN A SPECIES WHOSE PLATE FUSES. Round 194
  raised it, round 195 called it the only question the line turns on, and every subsequent round said no
  rat could settle it because the rat never fuses. weise2001 settles it in a RABBIT, which does.
  Juvenile ovariectomised rabbits, proximal tibia, distal tibia and distal femur at 2, 4, 6 and 8 weeks
  of treatment. In vehicle animals there is a gradual senescent decline in growth rate, chondrocyte
  proliferation rate, growth plate height, proliferative cell number, hypertrophic cell number, TERMINAL
  HYPERTROPHIC CELL SIZE and column density. And the conclusion, in the authors'' own words:
  "epiphyseal fusion is triggered when the proliferative potential of growth plate chondrocytes is
  exhausted", with fusion occurring "when the rate of chondrocyte proliferation approached zero".
  Oestrogen "does not induce growth plate ossification directly; instead, estrogen accelerates the
  programmed senescence of the growth plate, thus causing earlier proliferative exhaustion and
  consequently earlier fusion."

  FUSION IS NOT A CLOCK. IT IS A FUEL GAUGE. That single fact rewrites the objective function. Adult
  height is reserve times terminal cell height, not rate times time. An agent that only raises the rate
  of proliferation brings fusion forward by as much as it raises growth and banks NOTHING. THE ANSWER TO
  THE GAP IS NEGATIVE, and it is negative for growth hormone at least as much as for teriparatide,
  because round 183 showed GH buys its rate by consuming the resting pool five times faster while
  amplification falls to 0.77.

  IT ALSO RETROSPECTIVELY EXPLAINS THE RAT TERMINAL TABLE. Round 194 found femur length 32.8 to 33.9 mm
  at eight months under teriparatide, 34.2 to 35.2 mm at twelve, and 35 mm in every arm at twenty-six
  including the two dosed continuously to termination. A fixed reserve predicts exactly that shape:
  treated animals reach the ceiling earlier and stop. The rat''s ceiling is asymptotic rather than
  abrupt because its plate never closes, but the accounting is identical.

  GAP TWO WAS WHETHER A LATE PLATE STILL HAS A RECEPTOR TO HIT. Round 197 established that no human
  growth plate has ever been sampled past Tanner 4 and that the surgical route which produced every
  existing specimen cannot reach bone age 16. The question was therefore unanswerable in human tissue -
  but it is answerable in the species where the ages CAN be sampled, and it was answered in 2000.
  van2000 characterised the rat growth plate at 1, 4, 7 and 12 weeks in both sexes, spanning early life
  through puberty. PTH1R messenger RNA and protein were present AT ALL AGES in prehypertrophic and
  hypertrophic chondrocytes, with no sex difference. The receptor does not disappear as the plate
  matures. What DOES fade is the extra component: "especially in the younger age groups, faint
  expression of PTH/PTHrP receptor mRNA also was shown in stem cells and proliferative chondrocytes".
  So the target that persists is the pre-hypertrophic one, and the stem-cell and proliferative-zone
  receptor expression is a young-animal feature.

  AND THE RECEPTOR THAT PERSISTS IS LOAD-BEARING, NOT VESTIGIAL. hirai2011 made a tamoxifen-inducible
  cartilage-specific PTH1R knockout and switched it off POSTNATALLY. The result was accelerated
  chondrocyte differentiation, a rise in TUNEL-positive cells and caspase-3 and caspase-9 activity, and
  DISAPPEARANCE OF THE GROWTH PLATE. The authors conclude the consequences of receptor activation are
  similar in fetal and postnatal plates. Endogenous PTH1R tone is holding the postnatal plate together.

  PUT THE TWO TOGETHER WITH ROUND 197 AND THE LINE CLOSES ON A MECHANISM RATHER THAN ON A PILE OF NULLS.
  The receptor is present in the late plate. Endogenous tone through it is load-bearing and
  pool-preserving - correa2010 showed that removing the effector collapses the resting zone from five or
  more cell layers to one or two, and hirai2011 showed that removing the receptor destroys the plate.
  But the system is SATURATED, which is what the inverted U of round 197 means and what every wild-type
  agonist null measures. TERIPARATIDE IS NOT A RESERVE-SPENDING AGENT, WHICH IS THE GOOD NEWS, AND IT IS
  NOT A RESERVE-EXPANDING ONE EITHER, WHICH IS FATAL. There is nothing left on this axis to buy.

  ONE GENUINELY NEW AND STACK-SPECIFIC QUESTION OPENS, AND IT IS THE ONLY REASON NOT TO DELETE THE LINE
  OUTRIGHT. chou2025 shows that oestrogen acting through the membrane receptor GPER-1 SUSTAINS growth
  plate PTHrP tone: activation with G1 thickened the proliferative zone, raised proliferation, shrank
  the hypertrophic zone and type X collagen area, and RAISED THE PTHrP/Ihh RATIO at four and eight
  weeks, while blockade or chondrocyte-specific deletion did the reverse and expanded the hypertrophic
  zone. Anastrozole removes oestrogen. If aromatase inhibition lowers growth-plate PTHrP tone, IT MOVES
  THE PLATE DOWN THE INVERTED U, and a plate below the optimum is the one state in which a PTH1R agonist
  has ever added length. THE STACK WOULD BE MANUFACTURING ITS OWN INDICATION.

  THE COUNTERWEIGHT IS EQUALLY SPECIFIC AND IT IS WHY THIS DOES NOT REOPEN THE LINE ON ITS OWN.
  Oestrogen has two opposing arms at the plate: through GPER-1 it is pro-proliferative and pro-PTHrP,
  and through the senescence programme it spends the reserve. An aromatase inhibitor removes both, and
  the reason it nets positive for adult height in humans is that the reserve arm dominates. Restoring
  the lost GPER-1 arm with a PTH1R agonist would restore PROLIFERATION - which under a fixed reserve is
  precisely the arm you did not want back. The deficit anastrozole creates is a RATE deficit, and
  weise2001 has just established that rate is not what sets adult height. The stack-specific hypothesis
  is therefore self-limiting unless PTH1R agonism can be shown to expand the reserve rather than spend
  it, and correa2010 is the only dataset that speaks to that, from the loss-of-function direction only.'
quantitative:
- parameter: trigger for epiphyseal fusion
  value: exhaustion of the proliferative potential of growth plate chondrocytes; fusion occurred when
    the rate of chondrocyte proliferation approached zero
  unit: mechanism
  conditions: juvenile ovariectomised female rabbits, 70 micrograms per kilogram estradiol cypionate or
    vehicle intramuscularly once weekly, growth plates from proximal tibia, distal tibia and distal
    femur analysed after 2, 4, 6 or 8 weeks; fusion observed as an abrupt event in which all remaining
    chondrocytes are rapidly replaced by bone elements
  species: rabbit
  source_ref: weise2001
  uncertainty: 'CLOSES THE GAP OPEN SINCE ROUND 194, in a species that actually fuses. Under a fixed
    reserve an accelerated interval is not banked - it brings fusion forward by as much as it raises
    growth'
- parameter: parameters that decline together during senescence in the untreated plate
  value: growth rate, chondrocyte proliferation rate, growth plate height, number of proliferative
    chondrocytes, number of hypertrophic chondrocytes, SIZE OF TERMINAL HYPERTROPHIC CHONDROCYTES, and
    column density
  unit: all declining together with age in vehicle-treated animals
  conditions: same study; oestrogen accelerated the decline in all of them
  species: rabbit
  source_ref: weise2001
  uncertainty: 'terminal hypertrophic cell size declines with senescence too, so h_term is not a fixed
    constant a late subject can rely on - it is itself being spent'
- parameter: PTH1R expression across postnatal age in the rat growth plate
  value: present at all ages in prehypertrophic and hypertrophic chondrocytes, by RT-PCR, in situ
    hybridisation and immunohistochemistry, with no sex difference
  unit: qualitative presence across 1, 4, 7 and 12 weeks of age
  conditions: female and male rats, ages representative for early life and puberty; the additional faint
    PTH1R signal in stem cells and proliferative chondrocytes was seen ESPECIALLY IN THE YOUNGER AGE
    GROUPS; no expression in perichondrium
  species: rat
  source_ref: van2000
  uncertainty: 'SEMIQUANTITATIVE, so it establishes persistence rather than a quantitative trajectory.
    The receptor does not vanish as the plate matures; the stem-cell and proliferative-zone component
    does'
- parameter: consequence of deleting PTH1R from cartilage AFTER birth
  value: accelerated chondrocyte differentiation, increased TUNEL-positive cells and caspase-3 and
    caspase-9 activity, decreased Bad phosphorylation at Ser155, and DISAPPEARANCE OF THE GROWTH PLATE
  unit: phenotype
  conditions: tamoxifen-inducible cartilage-specific PTH1R knockout mice; a low-phosphate diet, which
    prevents chondrocyte apoptosis, prevented the disappearance of the plate
  species: mouse
  source_ref: hirai2011
  uncertainty: 'the receptor that persists into postnatal life is LOAD-BEARING. Endogenous tone is
    holding the plate together, which is the other half of why adding more does nothing'
- parameter: effect of GPER-1 on the growth plate PTHrP to Ihh ratio
  value: activation raised the PTHrP/Ihh ratio, thickened the proliferative zone, raised proliferation
    and shrank the hypertrophic zone and type X collagen area; blockade or chondrocyte-specific deletion
    lowered PTHrP/Ihh, shrank the proliferative zone and expanded the hypertrophic zone
  unit: as stated, at 4 and 8 weeks of age
  conditions: C57BL/6 mice, total 48 animals, GPER-1 agonist G1, antagonist G15 and Col2a1-Cre GPER-1
    floxed conditional knockout, both sexes; confirmed in micromass 3D chondrocyte culture
  species: mouse
  source_ref: chou2025
  uncertainty: 'OPENS THE STACK-SPECIFIC QUESTION. Oestrogen SUSTAINS growth plate PTHrP tone through
    GPER-1, so an aromatase inhibitor is predicted to lower it and move the plate down the inverted U.
    No study has measured growth plate PTHrP tone under an aromatase inhibitor in any species'
localization:
- 'PTH1R across postnatal age - prehypertrophic and hypertrophic chondrocytes at every age tested; stem
  cells and proliferative chondrocytes only faintly and only in the youngest animals'
- 'the fusion trigger - the proliferative compartment, exhausted rather than switched off'
human_evidence: absent
human_evidence_note: 'This round is rabbit, rat and mouse. Round 197 established that the human tissue
  needed to test the receptor question directly cannot be obtained through the route that produced every
  existing specimen, so the question was answered in the species where the ages are samplable. The human
  interventional position is unchanged - a three-year randomised null on linear growth.'
species_basis:
- rabbit
- rat
- mouse
translation_risk: moderate
translation_risk_reason: 'The fixed-reserve model of fusion is a rabbit result, but it is the model the
  human aromatase-inhibitor and precocious-puberty literature already assumes and it predicts the rat
  terminal table it was not fitted to. The receptor-persistence result is rat and semiquantitative. What
  does not transfer is any quantitative claim about where a human plate at bone age 16 sits on the curve.'
confidence: B
claim_grades:
- claim: epiphyseal fusion is triggered by exhaustion of proliferative potential rather than by elapsed
    time or a direct ossification signal
  grade: C
  basis: single study but in a fusing species, across three growth plates and four timepoints, with a
    pharmacological manipulation that moved the trigger; independently predicts the rat terminal table
    it was not fitted to
- claim: an agent that raises only the rate of proliferation cannot add adult height
  grade: E
  basis: inference from the fixed-reserve model, not a measurement; it is the model's central prediction
    and the rat terminal null is consistent with it
- claim: PTH1R is present in the growth plate at every postnatal age including puberty
  grade: C
  basis: rat, three methods agreeing across four ages and both sexes, semiquantitative
- claim: the stem-cell and proliferative-zone component of PTH1R expression is a young-animal feature
  grade: D
  basis: a single qualitative statement in one study, from in situ hybridisation described as faint
- claim: endogenous PTH1R signalling is required to maintain the postnatal growth plate
  grade: C
  basis: inducible postnatal conditional knockout with a rescue arm identifying the apoptotic mechanism
- claim: oestrogen sustains growth plate PTHrP tone through GPER-1
  grade: C
  basis: agonist, antagonist and conditional knockout arms agreeing in vivo at two ages, confirmed in
    culture
- claim: aromatase inhibition lowers growth plate PTHrP tone
  grade: E
  basis: inference from chou2025 only; nobody has measured growth plate PTHrP under an aromatase
    inhibitor in any species
