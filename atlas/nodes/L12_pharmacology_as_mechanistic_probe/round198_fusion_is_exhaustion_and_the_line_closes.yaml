contradicts:
- 'ANSWERS AND CLOSES g_l12_is_the_pth1r_acceleration_banked_or_does_it_advance_fusion, NEGATIVELY.
  Round 195 named this the only question the line turns on and said no rat could settle it. weise2001
  settles it in a rabbit: fusion is triggered by exhaustion of proliferative potential, so an
  accelerated interval is spent rather than banked.'
- 'DOWNGRADES GROWTH HORMONE BY THE SAME ARGUMENT. Round 183 established that GH raises pool consumption
  five-fold while amplification falls to 0.77. Under a fixed reserve that is not a neutral trade - it is
  a net loss of adult height unless something replaces the reserve. The stack contains an agent that
  spends the very thing weise2001 identifies as the fusion trigger.'
- 'PARTIALLY REVERSES THE ROUND-197 FRAMING OF THE RECEPTOR QUESTION. Round 197 concluded the decisive
  gap could not be closed because human tissue past Tanner 4 does not exist. It could not be closed IN
  HUMAN TISSUE. van2000 and hirai2011 answer the underlying biology in species where the ages are
  samplable: the receptor persists and its signalling is load-bearing. What remains genuinely unmeasured
  in human is the quantitative level, not the presence.'
