id: mecasermin_igf1
name: Mecasermin (recombinant human IGF-1)
aliases: [rhIGF-1, INCRELEX, Increlex]
type: intervention
layer: L12
stub: false
summary: |
  Mecasermin is recombinant human IGF-1 given twice daily subcutaneously, and it is the
  only way to test in humans what IGF-1 does to the growth plate when the GH signal
  upstream of it is broken. It is licensed narrowly: growth failure in children aged 2 y
  and older with severe primary IGF-1 deficiency, defined by the FDA label as height SDS
  <= -3.0 AND basal IGF-1 SDS <= -3.0 AND normal or elevated GH, or with GH gene deletion
  plus neutralising anti-GH antibodies. Dosing is 0.04-0.08 mg/kg twice daily, escalating
  to a maximum of 0.12 mg/kg twice daily, with hypoglycaemia the dose-limiting toxicity.
  The near-adult height data are the informative part: in 102 registry patients reaching
  near-adult height (mean age at start 11.8 y, median treatment 3.9 y) the mean height SDS
  gain was 0.9 (SD 1.1), rising to 1.4 (SD 1.0) in treatment-naive prepubertal patients,
  of whom almost half reached near-adult height within the normal range. In Laron syndrome
  only 10.5% reached the normal range. IGF-1 replacement therefore restores a substantial
  but incomplete fraction of growth, and the gap is largest where GH signalling is
  completely absent - consistent with a GH contribution to the plate that IGF-1 does not
  reproduce. The evidence base has also been limited by supply rather than biology: the
  IGFD registry was terminated because of an Increlex shortage.
quantitative:
  - parameter: mean height SDS gain from rhIGF-1 initiation to near-adult height
    value: '0.9'
    unit: SDS
    conditions: >-
      Global IGFD Registry (NCT00903110), 102 patients with severe primary IGF-1 deficiency
      reaching near-adult height, mean age at initiation 11.8 y, median treatment 3.9 y
    species: human
    source_ref: ramonkrauel2026
    uncertainty: SD 1.1
  - parameter: mean height SDS gain, treatment-naive prepubertal subgroup
    value: '1.4'
    unit: SDS
    conditions: same registry; almost half of this subgroup reached near-adult height within the normal range
    species: human
    source_ref: ramonkrauel2026
    uncertainty: SD 1.0
  - parameter: proportion of Laron syndrome patients reaching near-adult height within the normal range
    value: '10.5'
    unit: percent
    conditions: same registry; only 3 Laron patients were treatment-naive prepubertal
    species: human
    source_ref: ramonkrauel2026
    uncertainty: proportion as reported
  - parameter: labelled dose range
    value: 0.04-0.12
    unit: mg/kg per dose, twice daily
    conditions: subcutaneous; start 0.04-0.08 mg/kg twice daily, escalate by 0.04 mg/kg per dose after >=1 week of tolerance
    species: human
    source_ref: fda_increlex_label_2025
    uncertainty: label range
  - parameter: starting dose in the 22-year Laron cohort
    value: '40'
    unit: ug/kg per dose, twice daily
    conditions: escalated to a maximum of 120 ug/kg per dose; n=28 patients treated 1998-2020 in Saudi Arabia
    species: human
    source_ref: alashwal2026
    uncertainty: retrospective single-centre
localization:
  - "human growth plate: acts on the type 1 IGF-1 receptor on chondrocytes per the FDA label; no zonal data in treated humans"
human_evidence: direct
human_evidence_note: >-
  Licensed on paediatric growth data, with a global registry reporting near-adult height in
  102 treated patients and independent long-term cohorts.
species_basis: [human]
translation_risk: low
translation_risk_reason: >-
  Efficacy, dosing and adult-height outcome are all human. Mechanistic attribution to a
  direct chondrocyte action is asserted in the label rather than measured in treated patients.
confidence: A
claim_grades:
  - claim: rhIGF-1 raises near-adult height in severe primary IGF-1 deficiency by about 0.9 height SDS, and 1.4 SDS if started prepubertally and treatment-naive.
    grade: A
    basis: Registry of 102 patients reaching near-adult height, with prespecified subgroups and linear regression on predictors.
  - claim: IGF-1 replacement alone does not fully substitute for GH action on the growth plate.
    grade: B
    basis: Only 10.5% of Laron patients reached the normal range despite improvement; confounded by late treatment start, so not a clean test.
  - claim: rhIGF-1 acts directly on growth plate chondrocytes via IGF1R.
    grade: C
    basis: Stated in the FDA label from receptor biology; no human plate measurement.
