contradicts:
- 'Any reading of cinque2015 as evidence that an autophagy activator ELEVATES bone growth. The inventors''
  own patent shows the wild-type treatment arm was never run, and the treated null never exceeds the
  wild-type bar.'
- 'The patent''s own claim to mTORC1 inhibitors as a treatment for bone growth disorders. Its background
  section cites the evidence against it, and this atlas retrieved two of those sources independently -
  rapamycin halves growth plate elongation in a growing rat and sirolimus lowers growth velocity in children.
  Recorded as CORR-223.'
- 'ROUND 219''s self-limiting hypothesis, at one end of the axis only. Activating FGFR3 BLOCKS autophagic
  flux, so overactivity suppresses the arm - but that says nothing about partial inhibition of a NORMAL
  receptor, which is where this case sits, and the hypothesis stays at E rather than being retired.'
