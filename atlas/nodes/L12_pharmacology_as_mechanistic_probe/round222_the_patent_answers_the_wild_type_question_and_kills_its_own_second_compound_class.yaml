id: round222_the_patent_answers_the_wild_type_question_and_kills_its_own_second_compound_class
name: ROUND 222 - the inventors' own patent answers the wild-type question and the answer is that the arm
  was never run; it kills its own mTORC1 compound class in its own background section; its Example 2 shows
  activating FGFR3 BLOCKS autophagic flux, which runs against my self-limiting worry at one end of the axis
  and not at the end this case sits on; and the published Breinholt table turns out to carry a wild-type
  spine elevation of 25 per cent
type: hypothesis
layer: L12
aliases:
- there is no wild-type Tat-Beclin arm
- the autophagy patent
- rapamycin halves growth plate elongation
- the wild-type spine grew 25 per cent
- round 222
stub: false
summary: 'THREE SUPPLIED DOCUMENTS, AND THE PATENT CLOSES ASK #1 IN THE MOST INFORMATIVE POSSIBLE WAY.

  ASK #1 WAS WHETHER Tat-Beclin 1 LENGTHENS A WILD-TYPE BONE OR ONLY RESTORES A DEFICIENT ONE. CORR-203
  makes that the whole question, because ELEVATION above a normal baseline is the claim this case needs and
  RESTORATION is not. The Nature Extended Data was out of reach. WO 2017/055370 A1 - Fondazione Telethon,
  with Settembre and Cinque among the inventors - carries the same panel as Figure 17 f-h, and its legend
  lists exactly THREE keys: Fgfr4 +/+ VEHICLE, Fgfr4 -/- VEHICLE, and Fgfr4 -/- TAT-BECLIN 1. THERE IS NO
  WILD-TYPE TREATMENT ARM. Read against the printed axis: collagen amount about 100, 65 and 90 per cent;
  femur length at P9 about 100, 89 and 97; at P15 about 100, 93 and 98. THE TREATED NULL LANDS JUST BELOW
  THE WILD-TYPE BAR AND NEVER ABOVE IT, AND THE WILD-TYPE ANIMAL WAS NEVER TREATED - not in the paper, not
  in the patent, which is where a filer puts every result they have.

  AND THE PATENT''s OWN NUMBERS PREDICT WHY THERE MAY BE NO HEADROOM. The Fgfr4-null deficit is 35 per cent
  on COLLAGEN and only 7 to 11 per cent on LENGTH, and Tat-Beclin 1 recovers collagen to about 90 per cent
  while recovering length to 97-98. The length response to collagen is strongly SATURATING near the
  wild-type point, so adding collagen to an animal already at 100 per cent may buy nothing. THAT IS A
  PREDICTION AND NOT A RESULT, and it is exactly why the trivial wild-type arm should be run rather than
  assumed in either direction.

  THEN THE SAME PATENT KILLS ITS OWN SECOND COMPOUND CLASS, IN ITS OWN BACKGROUND SECTION. It claims three
  activator classes - a Beclin 1 peptide, an mTORC1 INHIBITOR, or a BH3 MIMETIC - and names the mTORC1 list
  explicitly: rapamycin, KU0063794, WYE354, deforolimus, Torin 1, Torin 2, temsirolimus, everolimus,
  sirolimus, NVP-BEZ235, PI103. Its background then cites three sources showing mTORC1 inhibitors REDUCE
  longitudinal growth. This atlas retrieved two independently. alvarezgarcia2007 - 4-week-old male rats,
  rapamycin 2 mg/kg/day intraperitoneally for 14 days, BONE LONGITUDINAL GROWTH RATE 94 AGAINST 182
  MICROMETRES PER DAY, A 48 PER CENT REDUCTION, with disturbed maturation and hypertrophy and decreased
  cartilage resorption. hymes2011 - paediatric renal transplant recipients on sirolimus, significantly lower
  growth velocity and smaller change in height SDS at 6, 12 and 24 months. RAPAMYCIN AT THE SAME 2 mg/kg/day
  INTRAPERITONEAL DOSE cinque2015 USED FOR Tat-Beclin 1 HALVES GROWTH PLATE ELONGATION IN A GROWING RAT. AN
  AUTOPHAGY ACTIVATOR IS NOT A CLASS - the route matters more than the endpoint, and mTORC1 inhibition buys
  autophagy by shutting down the anabolic programme a growing chondrocyte needs. The third class, BH3
  mimetics, is claimed with NO BONE DATA ANYWHERE IN THE PATENT.

  EXAMPLE 2 OF THE PATENT RUNS AGAINST MY OWN SELF-LIMITING HYPOTHESIS, AT ONE END OF THE AXIS. RCS
  chondrocytes stably expressing FGFR3 wild-type, G380R (achondroplasia) or R248C (thanatophoric), made by
  retroviral transduction, put through the standard flux assay with leupeptin at 50 micromolar for 2 hours
  and bafilomycin at 200 nanomolar for 4 hours. LEUPEPTIN AND BAFILOMYCIN FAILED TO RAISE LC3-II IN THE
  MUTANT LINES against FGFR3 wild-type cells, with FACS confirming lower endogenous LC3. ACTIVATING FGFR3
  BLOCKS AUTOPHAGIC FLUX. With wang2015_ach_autophagy reporting the same in an achondroplasia mouse plate,
  and COL9A1 rising dose-dependently under an FGFR3 inhibitor in humans, three observations now argue that
  FGFR3 overactivity SUPPRESSES the collagen arm and inhibition relieves it.

  BUT THE RESOLUTION IS PROBABLY THAT BOTH SIGNS ARE TRUE AT DIFFERENT POINTS OF ONE CURVE, AND THE
  UNCOMFORTABLE COROLLARY IS THAT THIS CASE SITS AT THE WRONG POINT. Acute FGF18-driven FGFR3 signalling
  CONTRIBUTES to autophagy induction - cinque2016_editorial states the authors'' own view that FGF18 acts
  mainly through FGFR4 and TO A LESSER EXTENT THROUGH FGFR3. Chronic constitutive FGFR3 overactivation
  BLOCKS flux. Tonic and phasic signalling through one receptor need not share a sign. OUR PATIENT HAS
  NORMAL FGFR3, so inhibition removes a small positive contribution WITHOUT a pathological block to relieve,
  and the achondroplasia data do not transfer. The human COL9A1 rise is the only observation taken at the
  relevant point of the curve and it is reassuring but indirect. THE CLAIM STAYS AT E, and the middle of the
  axis - what partial pharmacological inhibition does to flux in a NORMAL chondrocyte - is empty.

  AND THE PUBLISHED BREINHOLT TABLE ANSWERS ASK #4 WITH A NUMBER THIS ATLAS HAS BEEN LOOKING FOR SINCE
  CORR-203. Round 221 could only say continuous infusion produced significantly more growth. Table 5 of the
  typeset JPET version, FVB mice, five weeks, CNP-38 at 203 micrograms/kg/day, THE SAME DOSE IN BOTH ARMS:
  femur +5.5 against +7.1 per cent (not separated), tibia +4.0 AGAINST +12.2 (3.05-fold), SPINE +11.3
  AGAINST +25.0 (2.21-fold), with tibia and spine formally different from the bolus arm. THESE ARE WILD-TYPE
  FVB MICE AND THE SPINE GREW 25 PER CENT. The authors say it themselves - bone growth EVEN IN A HEALTHY
  ANIMAL WITH NORMAL ENDOGENOUS CNP LEVELS could be greatly accelerated by sustained exposure. That is an
  ELEVATION result with a magnitude, on the axial skeleton, which is the site profile this case needs, and
  the CNP axis has been carried in this atlas largely as an achondroplasia drug. hirota2018 already gave the
  DIRECTION by minipump, so what is new is the magnitude on the spine and that it comes from a SAME-DOSE
  schedule contrast rather than a dose contrast.

  AND ONE DISSOCIATION IN THE SAME PAPER THAT SHOULD CHANGE HOW A SURROGATE IS READ. Table 6, 26-week
  cynomolgus - TransCon CNP at 100 micrograms/kg/week raised BAP 14 per cent and PINP 53; the daily CNP-39
  molecule raised BAP 51 and PINP 144. THE ARM WITH ROUGHLY THREE TIMES THE BONE-FORMATION MARKER RESPONSE
  DELIVERED ONE THIRD TO ONE HALF THE LENGTH. A bone turnover marker is not a growth readout and here they
  run OPPOSITE. Any monitoring plan that titrated a CNP agent on BAP or PINP would have titrated toward the
  worse molecule.'
quantitative:
- parameter: the wild-type arm that does not exist in the Tat-Beclin 1 bone experiment
  value: 'WO 2017/055370 A1 Figure 17 f-h has exactly three keys and three bars - Fgfr4 +/+ vehicle, Fgfr4
    -/- vehicle, Fgfr4 -/- Tat-Beclin 1. Read against the printed axis: collagen amount about 100, 65 and 90
    per cent; femur length at P9 about 100, 89 and 97; femur length at P15 about 100, 93 and 98, with the
    treated null significantly different from the untreated null in every panel and never above the
    wild-type bar. NO Fgfr4 +/+ Tat-Beclin 1 ARM EXISTS'
  unit: per cent of wild-type vehicle
  conditions: image-only patent OCRed by this atlas; Figure 17 read from a 300-dpi render of the quadrant
    containing it, bar heights good to about 2 percentage points
  species: mouse
  source_ref: wo2017055370
  uncertainty: 'THE BAR HEIGHTS ARE READ AND APPROXIMATE; THE ARM COUNT IS NOT - the legend lists three keys
    and the panels show three bars. What this establishes is that the elevation experiment was NOT RUN, not
    that it would be negative. The saturation pattern in the same figure - a 35 per cent collagen deficit
    producing only a 7 to 11 per cent length deficit - predicts limited headroom above wild-type, and that
    is an inference from three bars'
- parameter: mTORC1 inhibition reduces longitudinal bone growth in rat and in children
  value: alvarezgarcia2007 - 4-week-old male rats, rapamycin 2 mg/kg/day intraperitoneally for 14 days, bone
    longitudinal growth rate 94 +/- 3 against 182 +/- 3 micrometres per day, a 48 per cent reduction, with
    disturbed maturation and hypertrophy and decreased cartilage resorption in the growth plate and body
    weight gain 60.2 against 113.6 g. hymes2011 - paediatric renal transplant recipients on sirolimus had
    significantly lower growth velocity in cm/year and smaller change in height SDS at 6, 12 and 24 months
  unit: micrometres per day, and cm/year
  conditions: rat pharmacology and a paediatric transplant cohort; both cited in wo2017055370's own
    background while it claims mTORC1 inhibitors as the therapy
  species: multiple
  source_ref: alvarezgarcia2007
  uncertainty: 'THE RAT RESULT IS DIRECT AND LARGE AND THE HUMAN ONE IS OBSERVATIONAL IN TRANSPLANT
    RECIPIENTS, where steroids, uraemia and graft function all confound growth. The direction is consistent
    across both and the rat dose is the SAME 2 mg/kg/day intraperitoneal that cinque2015 used for
    Tat-Beclin 1. The patent''s third citation, Gonzalez et al. Pediatr Nephrol 2010, has NOT been retrieved
    by this atlas; hymes2011 is an independent report of the same direction'
- parameter: activating FGFR3 mutations block autophagic flux in chondrocytes
  value: RCS chondrocytes stably expressing FGFR3 wild-type, G380R (achondroplasia) or R248C (thanatophoric)
    by retroviral transduction. Leupeptin at 50 micromolar for 2 hours and bafilomycin at 200 nanomolar for
    4 hours FAILED TO RAISE LC3-II in the mutant lines against the FGFR3 wild-type cells, and FACS showed
    decreased endogenous LC3 fluorescence in both mutants
  unit: qualitative flux assay with lysosomal clamp
  conditions: wo2017055370 Example 2; rat chondrosarcoma line with transduced human receptor
  species: in_vitro_animal_cell
  source_ref: wo2017055370
  uncertainty: 'A TRANSDUCED CELL LINE WITH CONSTITUTIVE OVERACTIVATION, WHICH IS THE OPPOSITE END OF THE
    AXIS FROM PARTIAL PHARMACOLOGICAL INHIBITION OF A NORMAL RECEPTOR. It shows overactivity suppresses
    flux; it does not show what removing 17 to 32 per cent of normal FGFR3 signal does. That middle is empty
    and this case sits in it'
- parameter: the same-dose schedule contrast in wild-type mice, with magnitudes
  value: 'FVB mice, five weeks, CNP-38 at 203 micrograms/kg/day, identical dose in both arms, bone length by
    X-ray with per cent change from control - femur +5.5 (bolus) against +7.1 (continuous infusion), not
    separated; tibia +4.0 against +12.2, a 3.05-fold difference; SPINE +11.3 AGAINST +25.0, a 2.21-fold
    difference. Tibia and spine are formally different from the bolus arm by one-factor ANOVA on
    log-transformed data at P<0.05'
  unit: per cent increase in bone length over vehicle
  conditions: breinholt2019 Table 5, published JPET version; wild-type FVB mice with normal endogenous CNP
  species: mouse
  source_ref: breinholt2019
  uncertainty: 'ONE EXPERIMENT, ONE LABORATORY, FIVE WEEKS, BY THE SPONSOR OF THE SUSTAINED-RELEASE PRODUCT,
    and an osmotic pump is not a prodrug. hirota2018 already established wild-type CNP elevation by minipump
    so the direction is confirmatory. What is genuinely new is the SPINE MAGNITUDE of 25 per cent in a normal
    animal and that it comes from a same-dose schedule contrast rather than a dose contrast'
- parameter: bone formation markers run OPPOSITE to delivered bone length
  value: 26-week cynomolgus - TransCon CNP at 100 micrograms CNP/kg/week raised bone-specific alkaline
    phosphatase 14 per cent and PINP 53 per cent while delivering tail +9 and tibia +6 per cent; the daily
    CNP-39 molecule at 20 micrograms/kg/day raised BAP 51 per cent and PINP 144 per cent while delivering
    tail +3 and tibia +3
  unit: per cent increase in marker against per cent increase in length
  conditions: breinholt2019 Tables 6 and 7, same animals
  species: non_human_primate
  source_ref: breinholt2019
  uncertainty: n = 4 per group and markers were not the study's primary endpoint. The dissociation is
    nonetheless within one study in the same animals, which is the only way to see it, and it means a
    monitoring plan titrating a CNP-axis agent on BAP or PINP would have titrated toward the worse molecule
localization:
- 'the Fgfr4-null femur, restored to 97-98 per cent of wild-type and never beyond it'
- 'the achondroplasia and thanatophoric chondrocyte, where autophagic flux is blocked'
- 'the wild-type mouse spine, which grew 25 per cent under continuous CNP'
human_evidence: indirect
human_evidence_note: 'The mTORC1 growth penalty has a human paediatric cohort behind it. Everything else is
  mouse, rat, primate or a transduced cell line; the human COL9A1 rise from round 221 is the only human
  observation on the FGFR3-autophagy question.'
