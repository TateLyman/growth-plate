translation_risk: high
translation_risk_reason: 'The autophagy candidate rests on a germline null rescued to normal, the FGFR3 flux
  result on a transduced cell line at the opposite end of the axis from our case, and the wild-type spine
  elevation on one five-week mouse experiment by an interested sponsor.'
confidence: B
claim_grades:
- claim: Tat-Beclin 1 elevates bone length above a normal baseline
  grade: E
  basis: 'THE EXPERIMENT HAS NEVER BEEN RUN. The inventors'' own patent has exactly three arms - +/+ vehicle,
    -/- vehicle, -/- treated - so no wild-type animal has ever received the peptide, in the paper or in the
    filing. What is demonstrated is RESTORATION to 97-98 per cent of wild-type, never above it. The grade is
    unchanged and the basis is now definite rather than uncertain'
- claim: an autophagy activator is a class from which a growth agent can be chosen
  grade: X
  basis: 'FALSE, AND THE PATENT REFUTES ITSELF. It claims mTORC1 inhibitors as activators while its own
    background cites rapamycin impairing longitudinal growth. alvarezgarcia2007 gives a 48 per cent
    reduction in growth plate elongation in rats at the same 2 mg/kg/day dose cinque2015 used for
    Tat-Beclin 1, and hymes2011 gives lower growth velocity in children on sirolimus. THE ROUTE MATTERS MORE
    THAN THE ENDPOINT'
- claim: BH3 mimetics are a candidate route to bone growth
  grade: E
  basis: CLAIMED IN THE PATENT WITH NO BONE DATA ANYWHERE IN IT - ABT-737, navitoclax, obatoclax, gossypol,
    AT-101, apogossypol, ApoG2 and sabutoclax appear only as a compound list. A mechanistic extrapolation
    from Beclin 1 being sequestered by Bcl-2, and nothing more
- claim: activating FGFR3 mutations block autophagic flux in chondrocytes
  grade: C
  basis: DEMONSTRATED WITH THE CORRECT ASSAY - lysosomal clamp with leupeptin and bafilomycin failing to
    raise LC3-II in G380R and R248C lines against FGFR3 wild-type, with FACS agreement - and independently
    reported in an achondroplasia mouse growth plate. Transduced rat chondrosarcoma cells, one laboratory
- claim: partial pharmacological FGFR3 inhibition impairs the autophagy-collagen arm in a NORMAL chondrocyte
  grade: E
  basis: 'BOTH ENDS OF THE AXIS ARE NOW CHARACTERISED AND THE MIDDLE IS EMPTY. Overactivation blocks flux;
    acute FGF18 signalling induces it partly through FGFR3. Neither tells you the sign of removing 17 to 32
    per cent of a normal receptor''s signal, which is where this case sits. The human COL9A1 rise is the only
    observation at the right point and it is indirect'
- claim: a CNP-axis agent elevates bone length above a normal baseline
  grade: C
  basis: 'WILD-TYPE FVB MICE, CNP-38 AT THE SAME DAILY DOSE BY TWO ROUTES - spine +11.3 per cent on bolus and
    +25.0 on continuous infusion, tibia +4.0 and +12.2, with both formally different from the bolus arm.
    hirota2018 gives the same direction by minipump in rats. One five-week experiment per source, sponsor-run'
- claim: bone formation markers track the growth a CNP agent delivers
  grade: X
  basis: FALSE AND INVERTED IN THE ONE STUDY THAT MEASURED BOTH IN THE SAME ANIMALS. The daily molecule
    raised BAP 51 and PINP 144 per cent while delivering a third to a half the length of the weekly arm,
    which raised BAP 14 and PINP 53
