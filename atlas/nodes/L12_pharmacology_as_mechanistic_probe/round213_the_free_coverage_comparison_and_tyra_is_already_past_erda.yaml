localization:
- 'plasma, where both drugs are heavily bound - erdafitinib 99.7 per cent to alpha-1-acid glycoprotein and
  TYRA-300 about 99 per cent, so total concentrations mislead by two orders of magnitude'
- 'the nail bed, oral mucosa, palms, soles and ocular surface, where FGFR2 sits and where the erdafitinib
  dose is actually lost'
- 'the kidney, where FGFR1 sets phosphate handling - the most frequent erdafitinib toxicity and the least
  dose-limiting'
- 'the liver, which is TYRA-300''s new ceiling and which the arithmetic says is not an FGFR effect'
- 'the growth plate, where NEITHER drug has ever had its concentration measured in any species'
human_evidence: direct
human_evidence_note: 'Both sides of the comparison are now human and quantitative - erdafitinib''s
  population PK, protein binding, label and registrational toxicity; TYRA-300''s steady-state AUC at four
  dose levels in 34 patients, its toxicity in 41, and its target-coverage lines. The Ba/F3 IC50 panel is
  in vitro but run for all five molecules under identical conditions. What remains non-human is everything
  about growth under TYRA-300, which is mouse, and the drug has never been given to a child.'
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: 'The exposure comparison is now solid on both sides. What it cannot establish is
  that matching erdafitinib''s free FGFR3 coverage reproduces erdafitinib''s growth effect - that assumes
  the growth is FGFR3-mediated and that cartilage penetration is comparable between two molecules of
  different physicochemistry, neither of which is measured.'
confidence: B
claim_grades:
- claim: TYRA-300 is about 99 per cent plasma protein bound
  grade: C
  basis: derived from the offset between three plotted target-coverage lines and three measured Ba/F3
    IC50s, all giving 93 to 109-fold, with a fourth line falling out at a sensible Hill slope. Read by
    pixel off a log axis and not printed anywhere
- claim: TYRA-300 at 90 mg QD achieves the same free FGFR3 target coverage as the erdafitinib dose that
    produced 19.06 cm/year
  grade: B
  basis: printed AUCs in 13 patients against published population PK, both converted to free multiples of
    each drug's own measured cellular IC50. Inherits the protein-binding derivation
- claim: TYRA-300 can be dosed above erdafitinib's absolute ceiling on free FGFR3 coverage
  grade: B
  basis: 120 mg gives 9.91x against erdafitinib's label maximum of 5.16x, and the MTD has not been reached.
    n = 3 at 120 mg
- claim: erdafitinib's dose is capped by FGFR1-mediated hyperphosphataemia
  grade: X
  basis: FALSE as round 212 stated it. Hyperphosphataemia is the most frequent toxicity but drives only 7
    per cent of interruptions and 4.4 per cent of reductions. The dose comes down for FGFR2 epithelial
    toxicity. What survives is that the label titrates UP on phosphate
- claim: the pan-FGFR inhibitors have no meaningful FGFR3 selectivity
  grade: D
  basis: TRUE ONLY AT FGFR2, where they run 0.8 to 1.4-fold. At FGFR1 they run 2.2 to 4.9-fold and at FGFR4
    7.6 to 67-fold. The atlas has been overstating this since round 210
- claim: TYRA-300's transaminitis is an FGFR-isoform effect that more selectivity would fix
  grade: E
  basis: ARGUED AGAINST. Free concentration at 90 mg is 8 per cent of the FGFR4 cellular IC50 and 18 per
    cent at 120 mg, so FGFR4 is barely engaged. Ba/F3 IC50 is not hepatocyte sensitivity and liver
    concentration is not plasma concentration
- claim: matching erdafitinib's free FGFR3 coverage will reproduce its growth effect
  grade: E
  basis: THE LOAD-BEARING UNTESTED ASSUMPTION OF THE WHOLE COMPARISON. It requires the growth to be
    FGFR3-mediated and cartilage penetration to be comparable between two molecules of different
    physicochemistry. Neither is measured for either drug in any species
- claim: TYRA-300 has been shown tolerable for longer than erdafitinib's paediatric skeletal-toxicity window
  grade: C
  basis: time on treatment up to 16.6 months with patients ongoing, against a median 137 days to skeletal
    toxicity onset for erdafitinib. BUT SURF301 IS AN ADULT POPULATION WITH CLOSED PLATES, so this bears on
    general tolerability and says nothing about physeal failure
