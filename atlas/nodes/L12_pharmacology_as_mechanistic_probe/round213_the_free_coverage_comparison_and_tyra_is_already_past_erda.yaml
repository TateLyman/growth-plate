    THAT - FGFR4 IC50 here is a Ba/F3 transfected-cell number and hepatocyte sensitivity is not measured;
    liver concentration is not plasma concentration and first-pass exposure is higher than systemic'
- parameter: the murine growth exposure translated to a human dose
