contradicts:
- 'ROUND 212''s mechanism. It said erdafitinib''s dose gate is FGFR1-mediated hyperphosphataemia.
  Hyperphosphataemia is the most FREQUENT toxicity and among the least dose-limiting - 7 per cent of
  interruptions, 4.4 per cent of reductions - while FGFR2 epithelial toxicity drives 22 to 27 per cent.
  Recorded as CORR-206.'
- 'ROUND 210''s statement that the pan-FGFR inhibitors show "no meaningful FGFR3 selectivity at all". True
  only at FGFR2 (0.8 to 1.4-fold). At FGFR1 they run 2.2 to 4.9-fold and at FGFR4 7.6 to 67-fold. Recorded
  as CORR-207.'
- 'ROUND 212''s closing statement that TYRA-300''s human free concentration "cannot be computed at all"
  without published protein binding. It can, because the sponsor plotted protein-binding-adjusted target
  lines against total concentration and thereby published the binding factor implicitly.'
