id: round213_the_free_coverage_comparison_and_tyra_is_already_past_erda
name: ROUND 213 - the free-concentration comparison round 212 could not compute, and TYRA-300 at 90 mg
  already sits at the exact FGFR3 coverage that grew a child 19 cm per year while 120 mg sits at twice
  erdafitinib's absolute ceiling
type: hypothesis
layer: L12
aliases:
- the free coverage comparison
- SURF301 PK
- the gate is FGFR2
- round 213
stub: false
summary: 'ROUND 212 CLOSED WITH ONE NAMED MISSING NUMBER - TYRA-300''s human free plasma concentration
  against its FGFR3 cellular IC50 - and said that without TYRA-300''s plasma protein binding the comparison
  could not be computed at all. surf301_ena2024 supplies every piece, and one piece it was not obvious it
  contained.

  THE PROTEIN BINDING IS RECOVERABLE FROM THE FIGURE ITSELF. The PK slide plots TOTAL plasma concentration
  and draws four horizontal target lines on the same axis - FGFR1, FGFR2 and FGFR4 cellular IC50 and FGFR3
  IC90. Those lines sit about a hundredfold above the measured Ba/F3 IC50s, because they are
  protein-binding-adjusted. FGFR1 gives 109-fold, FGFR2 102-fold, FGFR4 93-fold - mean 101, so the fraction
  unbound is about 1.0 PER CENT. The fourth line then falls out as a check with no free parameters: the
  FGFR3 IC90 at 277 ng/mL becomes 4.89 nmol/L unadjusted, which is 2.8 times the 1.75 nmol/L IC50, a Hill
  slope near 2.2 and entirely ordinary for a 48-hour viability assay.

  A DISCIPLINE NOTE THAT BELONGS IN THE RECORD. On first pass the text layer of the slide exposed only two
  numbers, 459 and 142, and dividing them by the printed 63-fold and 19-fold selectivities gave a
  self-consistent FGFR3 IC50 of about 7.3 nmol/L. RENDERING THE FIGURE SHOWED THOSE TWO NUMBERS ARE
  INFIGRATINIB''S AND PEMIGATINIB''S FGFR4 VALUES SITTING PAST AN AXIS BREAK, and TYRA-300''s FGFR3 IC50 is
  about 1.75 nmol/L - a fourfold error, self-consistent and wrong. It was caught before it entered anything.
  Text extraction of a figure is not reading the figure.

  NOW THE COMPARISON, IN FREE MULTIPLES OF EACH DRUG''S OWN FGFR3 IC50, WHICH IS THE ONLY FAIR AXIS.
  Erdafitinib is fu 0.3 per cent with a Ba/F3 FGFR3 IC50 of 1.35 nmol/L; TYRA-300 is fu about 1.0 per cent
  with 1.75 nmol/L. THE CHILD WHO GREW 19.06 cm PER YEAR, ON 7 mg, SAT AT 4.01 TIMES HIS DRUG''S FGFR3
  IC50. TYRA-300 AT 90 mg ONCE DAILY SITS AT 4.33 TIMES - the same exposure, in free terms, already
  achieved in thirteen humans. TYRA-300 at 120 mg sits at 9.91 times. Erdafitinib''s absolute label maximum
  of 9 mg is 5.16 times. SO 120 mg IS 1.92 TIMES ABOVE ANYTHING ERDAFITINIB CAN EVER REACH, AND THE MTD HAS
  NOT BEEN REACHED. The question the user asked - is TYRA-300 even possible at a dose we can benefit from
  beyond erdafitinib - is answered yes, with room, and it has already been dosed there.

  ERDAFITINIB IS SLIGHTLY THE MORE POTENT MOLECULE AT THE TARGET, 1.35 against 1.75 nmol/L. The selectivity
  is not bought with on-target potency and it is not free either - the entire difference is what the two
  molecules do to the other three isoforms.

  THE MURINE BRIDGE CLOSES INDEPENDENTLY. The PK slide draws the murine 18 mg/kg AUC across the human dose
  groups at about 6,500 ng.h/mL - that is the oncology dose giving 96 per cent tumour growth inhibition and
  beating erdafitinib head to head. tyra300_2025 grew WILD-TYPE mice at 12 to 14 mg/kg, which interpolates
  to roughly 4,300 to 5,100 ng.h/mL. HUMAN 60 mg QD IS 4,360 ng.h/mL - the mouse growth exposure, exactly.
  90 mg is 2.4 times it and 120 mg is 5.4 times it. Two independent routes, the free-coverage arithmetic
  and the murine anchor, put the human growth-relevant dose at 60 to 90 mg and put 120 mg well past it.

  AND ROUND 212 GOT THE GATE WRONG, WHICH IS THE CORRECTION THIS ROUND OWES. Round 212 said erdafitinib''s
  dose is capped by FGFR1-mediated hyperphosphataemia. HALF RIGHT AND THE WRONG HALF. Hyperphosphataemia is
  the MOST FREQUENT erdafitinib toxicity at about 75 per cent, but only about 4 per cent reaches grade 3 and
  it drives just 7 per cent of interruptions and 4.4 per cent of reductions - it is managed with diet and
  binders, not with dose. THE DOSE COMES DOWN FOR FGFR2 EPITHELIAL TOXICITY: nail disorders 22 per cent
  interruption and 27 per cent reduction, stomatitis 19 and 19, eye disorders 16 and 17, palmar-plantar
  erythrodysesthesia 15 and 12. Overall interruption 72 per cent, reduction 69 per cent, discontinuation 14
  per cent. What survives from round 212 is that the LABEL TITRATES UP on phosphate, which is an FGFR1
  pharmacodynamic marker, and that the index child WAS interrupted for hyperphosphataemia - n = 1, and a
  growing skeleton handles phosphate differently from an elderly urothelial cancer patient.

  THE CORRECTION MAKES THE SELECTIVITY ARGUMENT SHARPER AND MORE PRECARIOUS AT ONCE. FGFR2 is where
  TYRA-300''s margin is THINNEST - 19-fold, against 63-fold at FGFR1 and 55-fold at FGFR4. But erdafitinib''s
  FGFR2 margin is 1.4-fold, futibatinib''s 1.3, and pemigatinib and infigratinib are INVERTED at 0.8-fold,
  more potent at FGFR2 than at FGFR3. So on the axis that actually gates the dose, TYRA-300 is about
  fourteenfold better than erdafitinib. AND IT SHOWS: at 90 mg QD in fifteen patients, nail disorders were
  7 per cent, stomatitis 7 per cent, dry eye ZERO and PPE 13 per cent, with dose reduction 27 per cent
  against erdafitinib''s 69 and discontinuation 7 per cent against 14. No phosphorus above 7.0 mg/dL at any
  dose, one patient needing a binder.

  BUT THE CEILING MOVED RATHER THAN DISAPPEARING, AND IT IS NOW THE LIVER. At 90 mg QD, ALT rose in 47 per
  cent and AST in 47 per cent, both with a substantial grade 3 component. The single dose-limiting toxicity
  in the whole study was grade 3 diarrhoea at 90 mg and the single drug-related discontinuation was grade 3
  ALT at 90 mg. AND THE ARITHMETIC SAYS IT IS NOT AN FGFR EFFECT - free Cav at 90 mg is 7.58 nmol/L against
  an FGFR4 IC50 of 98, which is 8 per cent of IC50, and at 120 mg it is 18 per cent. FGFR4 IS BARELY
  ENGAGED, SO MORE SELECTIVITY WILL NOT FIX THE TRANSAMINITIS. It is a property of this molecule and it is
  the new ceiling. Whether that ceiling sits above or below the growth-optimal dose is the question this
  document opens and cannot answer - what it establishes is that the ceiling is at least 9.9 times FGFR3
  coverage, because 120 mg was given.

  ONE MORE THING THE DOCUMENT DELIVERS AND IT IS FRAGILE. A HUMAN EXPOSURE-RESPONSE FOR FGFR3 BLOCKADE AND
  GROWTH NOW EXISTS, WITH TWO POINTS. At 1.72 times IC50 a child grew about 10 cm/year; at 4.01 times a
  child grew 19.06. A 2.3-fold rise in coverage travelling with a 1.9-fold rise in velocity. THEY ARE TWO
  PATIENTS who differ in age, growth hormone status, gonadal status and available catch-up, and neither
  paper reports velocity by dose period. IT IS NOT A CURVE. It is recorded so a third point can be placed
  against it, and nothing here justifies extrapolating velocity to the 9.9 times that 120 mg reaches.

  AND THE CLOCK, WHICH ROUND 212 MADE THE BINDING CONSTRAINT, IS STILL NOT ANSWERED. SURF301 patients have
  been on drug up to 16.6 months with a 100 per cent disease control rate in the FGFR3-positive urothelial
  group at 90 mg or above and six confirmed partial responses in eleven. THAT IS AN ADULT POPULATION WITH
  CLOSED GROWTH PLATES. It proves the molecule is tolerable for over a year; it says nothing whatever about
  whether a driven physis fails at 137 days.'
quantitative:
- parameter: TYRA-300 plasma protein binding, recovered from the target-coverage lines
  value: the FGFR1, FGFR2 and FGFR4 IC50 lines sit 109-, 102- and 93-fold above the measured Ba/F3 cellular
    IC50s of 113, 35 and 98 nmol/L respectively - mean 101-fold, so FRACTION UNBOUND ABOUT 1.0 PER CENT.
    Consistency check on the unused fourth line - FGFR3 IC90 at 277 ng/mL is 495 nmol/L total, 4.89 nmol/L
    unadjusted, 2.8 times the 1.75 nmol/L IC50, implying a Hill slope near 2.2
  unit: fold offset and per cent unbound
  conditions: surf301_ena2024 slide 12, horizontal target lines on a log ng/mL concentration-time plot,
    against slide 6's Ba/F3 cellular IC50 panel; MW 559.5 from PubChem CID 170647464
  species: human
  source_ref: surf301_ena2024
  uncertainty: 'THE KEY DERIVATION OF THE ROUND AND IT IS NOT A PRINTED NUMBER. The line positions are read
    by pixel against the decade ticks of a log axis, so each carries maybe 10 to 15 per cent error - but
    THREE INDEPENDENT ISOFORMS GIVE THE SAME FACTOR within that spread, and the fourth line then falls out
    with a physically sensible Hill slope, which is a strong internal check. The alternative reading, that
    the lines are raw unadjusted IC50s, is excluded because it would put the FGFR1 line a hundredfold above
    the measured value for no reason'
  value_unverified: true
- parameter: free FGFR3 target coverage, both drugs on one axis
  value: erdafitinib (fu 0.3 per cent, IC50 1.35 nmol/L) - 3 mg gives 1.72x IC50, 5 mg 2.86x, 7 mg 4.01x,
    8 mg 4.58x, 9 mg 5.16x. TYRA-300 (fu about 1.0 per cent, IC50 1.75 nmol/L) - 40 mg gives 0.95x, 60 mg
    1.83x, 90 mg 4.33x, 120 mg 9.91x. THE 19.06 cm/YEAR CHILD WAS AT 4.01x AND TYRA-300 AT 90 mg IS AT
    4.33x; 120 mg IS 1.92 TIMES ERDAFITINIB'S ABSOLUTE LABEL MAXIMUM
  unit: multiples of each drug's own Ba/F3 FGFR3 cellular IC50, free steady-state average
  conditions: erdafitinib from zhu2026 population PK (CL/F 0.362 L/h, 99.7 per cent bound) with dose from
    erdaseries2025 and erdachild2024; TYRA-300 from surf301_ena2024's printed C1D15 AUC table (2,270 /
    4,360 / 10,300 / 23,578 ng.h/mL at 40 / 60 / 90 / 120 mg, n = 10 / 8 / 13 / 3)
  species: human
  source_ref: surf301_ena2024
  uncertainty: 'THE COMPARISON ROUND 212 SAID WAS IMPOSSIBLE, AND IT LANDS ALMOST EXACTLY ON TOP OF THE
    GROWTH CASE. It inherits the protein-binding derivation above, uses adult population clearance for an
    adolescent on the erdafitinib side, and compares Ba/F3 transfected-cell IC50s rather than chondrocyte
    potency for either drug. NEITHER DRUG HAS EVER HAD ITS CONCENTRATION MEASURED IN CARTILAGE'
  value_unverified: true
- parameter: what actually caps the erdafitinib dose
  value: 'hyperphosphataemia has the HIGHEST incidence at about 75 per cent but only about 4 per cent grade
