- 'the extracellular space, where a ligand trap acts and where achondroplasia may be the wrong background
  to test it'
- 'the concentration-to-inhibition transformation, which is where the round-217 headline was manufactured'
human_evidence: direct
human_evidence_note: 'The recifercept failure is human, randomised across three dose levels, with measured
  exposure. The statin refutation includes human control and thanatophoric chondrocytes. The Hill
  sensitivity is arithmetic on human PK and human growth observations.'
species_basis:
- human
- mouse
- rat
translation_risk: high
translation_risk_reason: 'What survives is a supra-linear exposure-response fitted from two confounded
  children and two mouse dose points, and a combination framework with no measured inputs.'
confidence: B
claim_grades:
- claim: statins act as a receptor-abundance node in series with an FGFR3 kinase inhibitor
  grade: X
  basis: REFUTED. Four statins, four systems, no change in FGFR3 protein for wild-type or either activating
    mutant, with AZD4547 rescuing in the same experiments and Ras prenylation confirming statin activity.
    Statins alone inhibited tibia growth at 1 micromolar
- claim: a soluble FGFR3 decoy is an available ligand node
  grade: X
  basis: FALSE AS AN ASSET. Recifercept failed its phase 2 primary at three dose levels with demonstrated
    twentyfold exposure range and was terminated for futility, along with its extension, its
    natural-history study and a Chinese phase 1
- claim: a ligand trap would fail in a pathway-intact growth plate
  grade: E
  basis: UNRESOLVED. Achondroplasia is the wrong background if G380R is ligand-independent, and this atlas
    grades that contested. The failure is uninformative for a normal plate and no asset survives to test it
- claim: the growth curve is supra-linear in FRACTIONAL PATHWAY INHIBITION
  grade: E
  basis: DOES NOT SURVIVE. The fitted exponent runs 2.38 at Hill 1 down to 0.94 at Hill 2.13, which is the
    value this atlas's own round 214 implies. Round 217's headline was an artefact of the assumption
- claim: the growth curve is supra-linear in EXPOSURE
  grade: C
  basis: SURVIVES AND NEEDS NO MODEL. Human exponent 1.87 in C/IC50 units, mouse 3.23 and 3.33 in dose
    units. Two confounded patients and a narrow mouse dose span remain the limits
- claim: adding one modest series partner to 8 mg erdafitinib is worth about 2.2 to 2.9-fold
  grade: E
  basis: SURVIVES THE HILL SENSITIVITY BY CANCELLATION, but remains a framework with no measured per-agent
    input, and assumes an independence the FGF19 rise argues against
- claim: the series-node inventory named in round 217 is intact
  grade: X
  basis: FALSE. Two of four are refuted, the receptor-abundance tier is now EMPTY with no replacement
    found, and the strongest surviving partner is not in series at all
