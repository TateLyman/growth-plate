id: round218_the_curve_audit_two_nodes_dead_and_the_exponent_was_mine
name: ROUND 218 - the audit of round 217, in which two of the four series nodes turn out to be refuted,
  the headline exponent is substantially an artefact of a Hill assumption my own atlas had already
  estimated differently, and the practical conclusion survives anyway
type: hypothesis
layer: L12
aliases:
- the round 217 audit
- statins do not touch FGFR3
- recifercept failed
- the Hill artefact
- round 218
stub: false
summary: 'THE USER ASKED ME TO BE SURE. Two supplied documents test round 217 directly and both come back
  negative, and re-examining my own arithmetic finds a third problem nobody supplied.

  ONE. THE RECEPTOR-ABUNDANCE NODE IS REFUTED. Round 217 put statins in the series list on the mechanism
  ENHANCED DEGRADATION OF FGFR3 PROTEIN, taken from yamashita2014 via the atlas''s own statin node.
  fafilek2017 tested exactly that claim with FOUR statins - atorvastatin, fluvastatin, lovastatin,
  pravastatin - across FOUR systems - RCS chondrocytes, cultured mouse embryonic tibias, limb bud
  micromasses, and human control and thanatophoric chondrocytes from the International Skeletal Dysplasia
  Registry. NO CHANGE IN FGFR3 PROTEIN LEVEL for wild-type, G380R or K650M, transfected or
  CRISPR-flag-tagged endogenous, at 12, 24, 48 and 72 hours. No effect on FGF2-driven growth arrest,
  extracellular matrix loss, senescence markers or hypertrophic differentiation. AND THE CONTROLS RUN BOTH
  WAYS - AZD4547 rescued every readout in the same experiments, so the systems could show a rescue; and Ras
  prenylation band-shift confirmed the statins were pharmacologically active, so they were working and
  simply not touching FGFR3. WORSE THAN NULL - in cultured embryonic tibias, 1 micromolar statins ALONE
  INHIBITED TIBIA GROWTH comparably to FGF2 and worsened it in combination. The authors conclude the
  earlier rescue is likely not intrinsic to growth plate cartilage.

  TWO. THE LIGAND NODE WAS ALREADY DEAD IN THIS ATLAS''S OWN FILES AND I DID NOT READ THEM. The recifercept
  phase 2 results - NCT04638153, EudraCT 2020-001189-13, Pfizer C4181005 - randomised children aged 2 to 10
  with achondroplasia to 1 mg/kg weekly, 2 mg/kg twice weekly or 1.5 mg/kg daily. The primary efficacy
  endpoint, the ratio of observed to expected change in standing height, was 0.9, 1.1 and 1.0 at month 6;
  1.0, 1.0 and 1.0 at month 9; 0.9, 1.1 and 0.8 at month 12. A RATIO OF 1.0 IS GROWTH EXACTLY AS EXPECTED
  WITHOUT TREATMENT. AND IT WAS NOT AN EXPOSURE FAILURE - trough serum concentrations at day 61 were 183.8,
  974.8 and about 3800 ng/mL, dose-proportional, accumulating, spanning roughly twentyfold. The register
  states the termination reason verbatim: DUE TO NOT MEETING THE PRE-SPECIFIED 6 MONTH EFFICACY CRITERIA AT
  THE TESTED DOSES AND NOT DUE TO ANY SAFETY CONCERNS. THE ATLAS NODE soluble_fgfr3_decoy ALREADY CONTAINED
  ALL OF THIS and described the trial as the cleanest available human test of ligand-dependence. I listed
  the decoy as a series node without opening it. SECOND INSTANCE OF THE CORR-205 FAILURE MODE IN TEN ROUNDS.

  WHAT THE RECIFERCEPT FAILURE DOES NOT SETTLE, AND THIS MATTERS FOR OUR CASE. Achondroplasia is the wrong
  background for a ligand trap if the G380R receptor signals without ligand, and this atlas already grades
  that claim CONTESTED - naski1996 and webster1996 report ligand-independent activation, monsonegoornan2000
  disputes it. So the decoy is DEAD AS AN ASSET and UNRESOLVED AS A MECHANISM in a pathway-intact plate,
  which is the background that matters here. And nobody will resolve it, because the programme, its
  open-label extension, its natural-history study and a Chinese phase 1 were terminated together.

  THREE, AND THIS ONE IS MINE. THE HEADLINE EXPONENT WAS SUBSTANTIALLY AN ARTEFACT OF A HILL ASSUMPTION.
  Round 217 converted C/IC50 into fractional inhibition as 1 minus 1/(1 + C/IC50) - a Hill slope of 1 -
  flagged it as an assumption, then fitted a power law to the resulting axis and reported an exponent of
  2.38. BUT ROUND 214 HAD ALREADY ESTIMATED THE HILL SLOPE FROM THE SAME SPONSOR FIGURE: the FGFR3 IC90
  line sat at about 2.8 times the IC50, and IC90/IC50 equals 9 to the power 1/n, giving n = 2.13. I USED n
  = 1 ANYWAY, IN A ROUND THAT CITED ROUND 214 THROUGHOUT. At n = 2.13 the fitted exponent collapses to
  0.94 - essentially LINEAR. Across n from 1 to 3 it runs 2.38, 1.43, 1.01, 0.94, 0.78, 0.64. ROUND 217''s
  HEADLINE CLAIM, THAT THE CURVE IS SUPRA-LINEAR IN FRACTIONAL PATHWAY INHIBITION, DOES NOT SURVIVE.

  WHAT DOES SURVIVE IS THE VERSION THAT NEEDED NO ASSUMPTION, AND ROUND 217 SHOULD HAVE LED WITH IT. Fit
  the gain against CONCENTRATION directly and no Hill slope enters: the human exponent in C/IC50 units is
  1.87, and the mouse exponents in dose units are 3.23 and 3.33. BOTH SUPRA-LINEAR, BOTH ASSUMPTION-FREE.
  The robust claim is that GROWTH GAIN IS SUPRA-LINEAR IN EXPOSURE, not in pathway inhibition. The two
  differ by exactly the Hill transformation and only the first is measured.

  AND THE PRACTICAL CONCLUSION SURVIVES EVERY HILL SLOPE, WHICH IS PARTLY LUCK. A partner removing 26.5 per
  cent of the pathway added to 8 mg erdafitinib is worth 2.91-fold at n = 1, 2.37 at 1.5, 2.22 at 2, 2.21
  at 2.13, 2.21 at 2.5 and 2.26 at 3. THE TWO EFFECTS CANCEL - a steeper Hill slope lowers the fitted
  exponent, which shrinks the payoff, but it also lowers the fractional inhibition that 8 mg achieves, so a
  fixed partner contribution moves the total proportionally further. Against the 8-to-9 mg dose bump, whose
  incremental gain is 20 to 22 per cent on every assumption, the partner''s incremental gain is about six
  to ten times larger. THE STRATEGY CONCLUSION HOLDS AND THE MECHANISTIC HEADLINE DOES NOT.

  WHAT IS ACTUALLY LEFT IN THE INVENTORY IS MUCH THINNER THAN ROUND 217 IMPLIED. LIGAND - dead in humans,
  unresolved for a normal plate, no asset. RECEPTOR ABUNDANCE - EMPTY; the statin mechanism is refuted and
  a literature sweep finds an erdafitinib-based FGFR2-selective degrader but NO FGFR3 degrader and nothing
  in cartilage. KINASE - erdafitinib 8 mg, the anchor. MAPK DOWNSTREAM - meclizine, alive but weak, with a
  solo human effect of +0.11 cm/year. THE ERK-INDEPENDENT CREB LIMB - 666-15, which restored bone length in
  the achondroplasia mouse and WAS NULL IN WILD-TYPE, and wild-type is the relevant background here. THE
  STRONGEST SURVIVING PARTNER IS NOT IN SERIES AT ALL - it is the CNP cAMP/PKA arm acting on hypertrophic
  zone elongation, which hirota2022 showed is abolished by H89, which ADDS on a term FGFR3 blockade does
  not touch rather than multiplying, and for which this atlas already specifies an unrun 2x2 in wild-type.
  And the FGF19/klotho-beta compensatory loop remains the one lever nobody has tried.'
quantitative:
- parameter: statins do not alter FGFR3 protein or FGFR signalling in chondrocytes
  value: four statins across four systems produced NO change in FGFR3 protein level for wild-type, G380R or
    K650M, transfected or CRISPR-flag-tagged endogenous, at 12, 24, 48 and 72 hours, and no effect on
    FGF2-driven growth arrest, extracellular matrix loss, senescence markers or hypertrophic
    differentiation. AZD4547 rescued every readout in the same experiments and Ras prenylation band-shift
    confirmed statin activity. At 1 micromolar, statins ALONE inhibited cultured embryonic tibia growth
    comparably to FGF2
  unit: qualitative, with positive controls in both directions
  conditions: fafilek2017, RCS rat chondrosarcoma chondrocytes, cultured mouse embryonic tibias, limb bud
    micromasses, and human control and thanatophoric chondrocytes
  species: multiple
  source_ref: fafilek2017
  uncertainty: 'A REPLICATION FAILURE WITH BETTER CONTROLS THAN THE ORIGINAL, AND IT REFUTES THE EXACT
    MECHANISM ROUND 217 CITED. The authors state their own limits honestly - statins might act indirectly
    in vivo through AKT, BMP or Hedgehog, and their robust FGF2 stimulation could mask a subtle effect. So
    it does not exclude an in vivo statin benefit by some other route; it excludes the FGFR3 mechanism,
    which is the only thing that would make a statin a SERIES NODE'
- parameter: recifercept phase 2 efficacy and exposure
  value: 'ratio of observed to expected change in standing height - month 6: 0.9, 1.1, 1.0; month 9: 1.0,
    1.0, 1.0; month 12: 0.9, 1.1, 0.8 across 1 mg/kg weekly (n=20), 2 mg/kg twice weekly (n=19) and 1.5
    mg/kg daily (n=18). Trough serum concentration at day 61 was 183.8, 974.8 and about 3800 ng/mL -
    dose-proportional and accumulating across roughly twentyfold. Terminated 18 November 2022 for not
    meeting the pre-specified 6-month efficacy criteria at the tested doses and NOT for safety'
  unit: ratio of observed to expected height change, and ng/mL trough
  conditions: EudraCT 2020-001189-13 posted results, Pfizer C4181005 / NCT04638153, children aged 2-10 with
    achondroplasia
  species: human
  source_ref: recifercept_euctr_2023
  uncertainty: 'A CLEAN HUMAN NEGATIVE WITH DEMONSTRATED EXPOSURE ACROSS THREE DOSE LEVELS, which is as
    definitive as a failure gets. WHAT IT DOES NOT SETTLE is whether a ligand trap would work in a
    PATHWAY-INTACT plate, because achondroplasia is the wrong background if G380R signals without ligand -
    and this atlas grades that CONTESTED. The month-3 values are uninterpretable, with standard deviations
    of 290 and 533 from dividing by a small expected change'
- parameter: the fitted growth exponent as a function of the assumed Hill slope
  value: 'at Hill n of 1.0, 1.5, 2.0, 2.13, 2.5 and 3.0, erdafitinib 8 mg achieves 31.9, 24.3, 18.0, 16.6,
    13.1 and 9.4 per cent fractional inhibition, and the exponent fitted to the two human growth points is
    2.38, 1.43, 1.01, 0.94, 0.78 and 0.64. ROUND 214''s OWN IC90/IC50 READ OF ABOUT 2.8 IMPLIES n = 2.13,
    AT WHICH THE EXPONENT IS 0.94 - ESSENTIALLY LINEAR'
  unit: per cent inhibition and fitted exponent, by Hill coefficient
  conditions: computed in atlas/tools/round218_the_curve_audit.py from round 216's coverage values and the
    same two human growth observations round 217 used
  species: not_applicable
  source_ref: erdachild2024
  uncertainty: 'THE HEADLINE OF ROUND 217 WAS AN ARTEFACT OF A PARAMETER THIS ATLAS HAD ALREADY ESTIMATED
    DIFFERENTLY IN ROUND 214. The Hill slope has never been measured in a chondrocyte for either drug, so
    the true value is unknown, but n = 1 is not a neutral default and should not have been used silently
    alongside a round that derived 2.13'
  value_unverified: true
- parameter: the assumption-free version of the curve
  value: fitting growth gain against CONCENTRATION rather than against inhibition removes the Hill slope
    from the problem entirely. The human exponent in C/IC50 units is 1.87 and the mouse exponents in dose
    units are 3.23 for tibia and 3.33 for femur
  unit: exponent of gain against exposure
  conditions: same two human points against round 216's coverage; mouse from the deposited individual-animal
    data re-analysed in round 215
  species: multiple
  source_ref: tyra300_2025
  uncertainty: 'THIS IS WHAT SHOULD HAVE BEEN THE HEADLINE. It carries the same two-patient and
    baseline-sensitivity limits as before on the human side, but it needs no pharmacological model. THE
    CLAIM THAT SURVIVES IS SUPRA-LINEARITY IN EXPOSURE, NOT IN PATHWAY INHIBITION'
  value_unverified: true
- parameter: robustness of the combination conclusion to the Hill slope
  value: a partner removing 26.5 per cent of the pathway added to 8 mg erdafitinib is worth 2.91-fold at n
    = 1, 2.37 at 1.5, 2.22 at 2, 2.21 at 2.13, 2.21 at 2.5 and 2.26 at 3. The 8-to-9 mg dose bump is worth
    20 to 22 per cent across the same range, so the partner's INCREMENTAL gain is about six to ten times
    the dose bump's on every assumption
  unit: fold gain against 8 mg alone, by Hill coefficient
  conditions: residual signal multiplied across series nodes, gain raised to the Hill-matched fitted
    exponent
  species: not_applicable
  source_ref: erdachild2024
  uncertainty: 'THE ONE ROUND-217 CONCLUSION THAT SURVIVES THE AUDIT, AND IT SURVIVES BY CANCELLATION
    RATHER THAN BY DESIGN - a steeper Hill slope lowers the exponent but also lowers the inhibition 8 mg
    achieves, and the two nearly offset. IT STILL ASSUMES INDEPENDENCE BETWEEN NODES, which the FGF19 and
    klotho-beta rise argues against, and it still has no measured per-agent inhibition fraction for any
    candidate'
  value_unverified: true
localization:
