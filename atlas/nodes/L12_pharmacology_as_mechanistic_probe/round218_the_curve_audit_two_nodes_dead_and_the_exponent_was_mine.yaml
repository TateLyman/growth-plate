contradicts:
- 'ROUND 217''s series-node inventory. The receptor-abundance node (statins) is refuted by fafilek2017 and
  the ligand node (soluble FGFR3 decoy) is refuted in humans by the recifercept phase 2. Recorded as
  CORR-213.'
- 'ROUND 217''s headline that the curve is a power law with exponent 2.4 to 3.3 in fractional pathway
  inhibition. That exponent is substantially an artefact of assuming a Hill slope of 1, when round 214 had
  already implied 2.13 from the same figure, at which the exponent is 0.94. Recorded as CORR-214.'
