id: round337_five_obtainable_routes_taken_down_and_the_one_length_endpoint_that_sat_unread_in_the_bibliography_for_a_week
name: 'Round 337 - five obtainable routes taken down, and the chondrocyte length endpoint that sat unread
  in this bibliography for a week'
aliases:
- penicillamine is the wrong half of the lysyl oxidase axis
- the intervertebral disc is not a growth reserve after age 12
- beta-2 adrenoceptor answered in both directions
- the generic drug-versus-height Mendelian randomization screen is not usable
type: hypothesis
layer: L12
stub: false
summary: 'This round was run under a standing instruction to widen scope to the WHOLE BODY and not stop until
  a usable compound validates. No new addition survived. What the round produced instead is five closures,
  each on a route that looked obtainable and prescribable before it was checked, plus one standing gap
  ANSWERED and one contraindication independently doubled. Recorded in full because CORR-313 says this
  file drifts pessimistic by selection - closures get written down and positives do not - and the honest
  correction is to write the closures down WITH their reasons so the next context cannot re-derive them
  as if they were new.

  ONE - PENICILLAMINE IS THE WRONG HALF OF THE LYSYL OXIDASE AXIS, AND THE REASON SHARPENS THE SPEC. The
  collagen cross-linking pathway is this file''s best-powered genetic signal (R334: LOXL3 +0.96, PLOD2
  +0.91, LOXL2 +0.68, PLOD1 +0.54 cm, all P<=1e-11, 20,751 carriers) and its only named compound, PXS-5505,
  is not marketed. D-penicillamine is marketed, oral, generic and has decades of paediatric use, and it
  is a classical lathyrogen - so it looked like the obtainable substitute. It is not. rucker1977 states
  the mechanism: penicillamine blocks cross-linking by forming THIAZOLIDINE COMPLEXES WITH THE ALDEHYDE,
  i.e. it scavenges allysine, the PRODUCT of lysyl oxidase, rather than inhibiting the enzyme. That matters
  because of R333: the LOXL2 height signal is probably NOT collagen at all but H3K4me3 DEAMINATION at
  the CATALYTIC AMINE OXIDASE SITE, and R332 already measured the collagen arm directly - mcnerny2015 gave
  BAPN to growing male mice, significantly reduced mature cross-linking in the same animals, and tibia
  length did not move (p=0.580). SO PENICILLAMINE ENGAGES PRECISELY THE ARM ALREADY SHOWN NULL AND MISSES
  THE ARM THAT MAY CARRY THE SIGNAL. Against it as well: steinmann1979 is the first human dermato-osteolathyrism
  from D-penicillamine, in a boy treated from age 2 for nearly 6 years, and the phenotype includes SCOLIOSIS
  - an axial cost in the compartment where this subject''s residual is. THE SPEC THAT SURVIVES IS SHARPER
  THAN BEFORE THE ROUND: a catalytic-site amine oxidase inhibitor (BAPN, PXS-5505), NOT an aldehyde scavenger,
  and NOT copper depletion - collagen_crosslinking already records that a copper-deficient diet is one
  of four independent ways to INDUCE tibial dyschondroplasia in chicks.

  TWO - RAISING AGGRECAN BY BLOCKING ITS CATABOLISM IS THE RANKL TRAP. ACAN pLoF is -16.60 cm at P=1.9e-52,
  the largest single number in kosmicki2026, and the atlas holds a standing gap that nobody has raised
  aggrecan above normal. Aggrecan cannot be supplied, so the only elevation modality is to reduce its
  degradation, and clinical-stage aggrecanase inhibitors exist. Three measurements kill it before any
  literature search. ADAMTS4 is 4.2 CPM in 8.5% of cells and ADAMTS5 is 17.1 CPM in 15.8%, while MMP13
  is 85.6 CPM in 96.3% of cells - the aggrecanases are minor in this tissue. NEITHER ADAMTS4 NOR ADAMTS5
  IS IN kosmicki2026''s 207, so losing an aggrecanase carries no human height signal. And the direction
  is failure mode number one: clearance of hypertrophic cartilage at the chondro-osseous junction is REQUIRED,
  which is exactly why R317 made denosumab a contraindication - blocking resorption gives osteopetrosis
  with RETAINED CARTILAGE, CORR-292''s jam. Charge without discharge, for the eighth time.

  THREE - THE INTERVERTEBRAL DISC IS NOT A GROWTH RESERVE, AND THIS CORRECTS R319''s FRAMING. R319 called
  the disc a SECOND, FUSION-INDEPENDENT trunk component holding about a quarter of the spinal column, and
  that framing made it the most attractive compartment in the file for a subject at BA16: no closing window,
  right compartment, Step 0 completely clean. stokes2006disc measures it directly - 406 spinal stereoradiographic
  studies of 188 adolescents aged 7.5 to 20, vertebral bodies and discs measured separately - and DISCAL
  HEIGHT GROWTH IS ESTIMATED TO BE EFFECTIVELY ZERO AFTER AGE 12 YEARS, with spinal growth from 10 to
  20 occurring almost exclusively in the VERTEBRAE. What survives of R319 is exactly what R319 itself
  hedged: the disc governs the DIURNAL OSCILLATION and therefore the measurement protocol, not a reserve
  to be grown. Caveat recorded: the cohort is idiopathic scoliosis.

  FOUR - AND THE OESTROGEN WORRY ON THE DISC IS VOID, WHICH IS A RELIEF FOR THE AI ARM. stevenson2023 is
  titled as an effect of hormone replacement on disc height and is widely readable that way, so it would
  have predicted that anastrozole COSTS disc height. Its own numbers refuse it: within-arm rises of 0.16
  cm (1 mg, P=0.015) and 0.21 cm (2 mg, P=0.006) against placebo 0.13 cm (P=0.096) - and the paper states
  that BETWEEN-GROUP DIFFERENCES WERE NOT STATISTICALLY SIGNIFICANT. A conclusion drawn from within-arm
  p-values while the between-arm test is null. CORR-320''s shape - a citation filed under a conclusion it
  does not carry - caught before it entered the file as a cost.

  FIVE - THE BETA-2 ADRENOCEPTOR, ANSWERED IN BOTH DIRECTIONS, AND THE LEDGER FAILURE THAT NEARLY HID IT.
  kuhn2026 was added to this bibliography on 2026-08-06 with NO one_line_finding, tier null and type null.
  It contains a chondrocyte-specific LENGTH endpoint. Read in full: Adrb2 deleted with Col2a1-Cre gives
  significantly reduced FEMUR AND TIBIA length at 6, 12 AND 40 weeks in BOTH sexes - six groups, all in
  the same direction - with increased Collagen 10+ and Collagen 2+ chondrocytes and unchanged Runx2+,
  i.e. a FASTER proliferative-to-hypertrophic transition. That is a period-like mechanism on the term
  this file cares most about, and the therapeutic direction is AGONISM, for which salbutamol, terbutaline
  and formoterol are approved, oral or inhaled, cheap and given to children. It also PASSES the CORR-327
  receiver test cleanly: ADRB2 is 12/14 samples at 8.4 CPM in up to 21.4% of cells in the postnatal human
  growth plate and is THE ONLY ADRENOCEPTOR THERE - ADRB1 0/14, ADRB3 0/14, ADRA1A 1/14, ADRA2A 4/14 -
  with GNAS 564.8 CPM in 97% of cells downstream. AND THE PLATE MAKES NO CATECHOLAMINE OF ITS OWN: TH
  0/14, DBH 0/14, PNMT 0/14, SLC6A2 1/14, which is the NPPC/NPR2 structure again (receptor present, ligand
  supplied from outside) and is the configuration that favours a systemic agonist. IT STILL DOES NOT SURVIVE,
  for four independent reasons - see the claim grades. The decisive one is Step 0.

  SIX - THE GENERIC DRUG-VERSUS-HEIGHT SCREEN WAS RUN AND IS NOT USABLE. xi2024 is a genome-wide Mendelian
  randomization of 27,094 genes against height in three biobanks with drug mapping through DGIdb - on
  its face the exact unbiased drug-level screen CORR-295 asks for, and never cited in this atlas. Two
  defects. Its significant genes are assigned to non-skeletal tissues (oesophagus mucosa, spleen, whole
  blood, brain nucleus accumbens; NPPC in PANCREAS; HLA-C across seventeen tissues) - CORR-339''s shape,
  an eQTL tissue label is not the causal tissue. And its drug DIRECTION column is CURATED FROM PRIOR LITERATURE,
  NOT DERIVED: the authors themselves note that corticosteroids and BMN-111 map to the SAME target, NPPC,
  with OPPOSITE height effects. Its positive list includes TAMOXIFEN, which this file closed on mechanism
  (R274, chagin2007, permanent arrest by resting-zone apoptosis). ONE GENERALISATION IS WORTH KEEPING:
  every drug on that positive list except vosoritide is a RESTORATION story in an inflammatory or deficiency
  state - amoxicillin, infliximab, colchicine, propionyl-L-carnitine - so CORR-203 excludes them for a
  healthy subject. That is why generic screens keep returning nothing usable here, and it is an argument
  for the targeted approach rather than a failure of searching.

  SEVEN - ALPHA-KETOGLUTARATE AND MEGADOSE VITAMIN C ARE NOW CONTRAINDICATED TWICE, INDEPENDENTLY. Both
  were already listed against on the TET arm (R283: TET1 loss is +8.32 cm, so feeding the TET co-substrate
  runs height-LOSING; R302 added ascorbate as the other cofactor of the same family). R333 established
  the H3K4me3 module in the opposite direction - MORE H3K4me3 IS TALLER, with LOXL2 the eraser at +0.68
  cm and the writers KMT2B and ASH1L at -0.35 and -0.41. The KDM5 demethylases that erase H3K4me3 are
  Fe(II)/2-oxoglutarate dioxygenases of the SAME FOLD AS TET, so raising 2-OG feeds them too: more KDM5,
  less H3K4me3, shorter. Same supplement, same cofactor logic, second independent arm. A TENSION IS RECORDED
  RATHER THAN EXPLAINED AWAY: GLS (glutaminase), which supplies 2-OG, is -3.28 cm on loss at 325 CPM in
  87% of cells, which runs the other way - though GLS loss removes glutamate, glutathione and nucleotide
  precursors as well, so it is not a clean 2-OG experiment, while TET1''s +8.32 cm is direct. The caveat
  from R316 stands unchanged and is about MEGADOSING ONLY, never adequacy - ascorbate is required for
  collagen hydroxylation and scurvy is a skeletal disease.'
quantitative:
- parameter: 'ADRB2 is the only adrenoceptor in the postnatal human growth plate, and the plate synthesises
    no catecholamine of its own'
  value: 'ADRB2 12/14 samples, 8.4 CPM, up to 21.4 per cent of cells; ADRB1 0/14; ADRB3 0/14; ADRA1A 1/14;
    ADRA2A 4/14; TH 0/14; DBH 0/14; PNMT 0/14; SLC6A2 1/14; GNAS 564.8 CPM in 97.0 per cent of cells'
  unit: samples detected of 14, median CPM, maximum per cent of cells
  conditions: 'GSE288028, 14 postnatal human growth-plate samples, 79,934 cells, operator-supplied and already
    used for R308/R310/R314/R320/R328. Scale references from the same table: COL2A1 9,200.7 CPM in 100 per
    cent of cells, ACAN 1,826.4 in 99.5 per cent.'
  species: human
  source_ref: kuhn2026
  uncertainty: 'THE RECEIVER TEST PASSES AND THE SPECIFICITY IS UNUSUALLY CLEAN - one of four adrenoceptors
    present, the other three effectively absent, so an ADRB2-directed agent has no adrenergic cross-target
    in this tissue. The ABSENT SYNTHESIS MACHINERY is the more interesting half and cuts both ways: it
    reproduces the NPPC/NPR2 configuration (receptor present, ligand not made locally) which is what makes
    a systemic agonist a sensible tool rather than a clearance blocker - but it equally means adrenergic
    tone at the plate is set by circulating catecholamine and sympathetic innervation that were never measured
    here. THE ABUNDANCE IS LOW. 8.4 CPM in a fifth of cells is far below GNAS, PTH1R or the PDE4 family,
    and CORR-332 says abundance does not decide which pool carries a signal - but it is not a strong presence
    either. The expression call is mine from the supplied table; the source_ref is the paper that motivated
    the query, not the source of these numbers.'
- parameter: 'the human test of beta-blockade during the fastest growth phase of human life, and it is null
    for linear growth'
  value: '185 infants with monthly prospective heights showed no deviation from WHO normative data and the
    authors conclude propranolol does not impair growth; an independent 51-child cohort found no significant
    difference in height before versus after treatment (P greater than 0.05)'
  unit: number of children and significance of the height comparison
  conditions: 'giese2021 - 185 children on propranolol for infantile haemangioma 2008-2013, monthly heights
    and weights collected prospectively, compared with WHO weight-for-age and weight-to-length z-scores,
    split 142 without and 43 with comorbidities. lin2023propranolol - 51 children with proliferative infantile
    haemangioma on a uniform oral regimen, paired Wilcoxon rank sum on height. A separate 2025 JAAD report
    (PMID 39615547) states propranolol is not associated with growth impairment at age 4 years.'
  species: human
  source_ref: giese2021
  uncertainty: 'THIS IS THE CLOSEST HUMAN TEST OF THE kuhn2026 AXIS THAT EXISTS AND IT RUNS AGAINST TRANSLATION,
    BUT IT IS NOT THE EXPERIMENT. Propranolol is NON-SELECTIVE, so it blocks beta-1 as well as beta-2;
    receptor blockade is partial at clinical doses; and infancy is not adolescence. Most importantly, ABSENCE
    OF HARM FROM BLOCKADE DOES NOT STRICTLY EXCLUDE BENEFIT FROM AGONISM - the two are only equivalent
    if the receptor sits mid-range on a monotone dose-response, which is precisely what this file keeps
    finding to be false (five bands and counting). WHAT IT DOES ESTABLISH is that the axis is not RATE-LIMITING
    for human longitudinal growth: months of systemic beta-blockade during the fastest growth phase of
    human life, in cohorts with monthly height measurement and four-year follow-up, moved nothing. giese2021
    did find deviation in BMI-for-age and weight-for-age z-scores beyond 7 months of treatment, so the
    study was not insensitive - it detected a body-composition signal and not a length one.'
- parameter: 'discal height growth is effectively zero after age 12, so the disc is not a growth reserve
    at bone age 16'
  value: 'about 17 mm per year vertebral and 8 mm per year discal at age 7.5, with discal growth estimated
    at effectively zero after age 12; spinal length T5 to L5 rose from about 250 to 350 mm across ages 7.5
    to 20'
  unit: millimetres per year of height contribution
  conditions: stokes2006disc. 406 spinal stereoradiographic studies of 188 adolescents with idiopathic scoliosis
    aged 7.5 to 20 years, vertebral body heights and intervertebral disc heights measured separately from
    T5 to L5.
  species: human
  source_ref: stokes2006disc
  uncertainty: 'THIS IS THE MEASUREMENT R319 NEEDED AND DID NOT HAVE, AND IT CORRECTS R319''s FRAMING RATHER
    THAN ITS OBSERVATIONS. R319 is right that disc height is set osmotically and is not limited by physeal
    fusion, and right that the diurnal swing is large - up to about 2 cm standing. It does not follow that
    the disc is a growth reserve, and this says it is not: whatever growth the disc contributes is spent
    by age 12. THE COHORT IS IDIOPATHIC SCOLIOSIS, which is the main caveat and is not trivial, since disc
    geometry is abnormal in scoliosis by definition - but the direction is large and the alternative reading,
    that healthy discs keep growing after 12 while scoliotic ones do not, has no support. THE PRACTICAL
    CONSEQUENCE IS UNCHANGED FROM R319 (a): the disc governs measurement protocol. An unstandardised measurement
    time can hide or fabricate a centimetre of apparent annual growth.'
- parameter: 'the aggrecanases are minor enzymes in this tissue while the collagenase is near-universal,
    and neither aggrecanase carries a human height signal'
  value: 'ADAMTS4 4.2 CPM in 8.5 per cent of cells; ADAMTS5 17.1 CPM in 15.8 per cent; against MMP13 85.6
    CPM in 96.3 per cent and TIMP3 425.8 CPM in 84.4 per cent. Neither ADAMTS4 nor ADAMTS5 appears in kosmicki2026''s
    207 height genes. ACAN itself is 1,826.4 CPM in 99.5 per cent of cells and its pLoF is -16.60 cm at
    P=1.9e-52.'
  unit: median CPM, per cent of cells, centimetres per allele
  conditions: GSE288028 (14 postnatal human growth plates) joined to the kosmicki2026 Supplementary Table
    6 burden effects already held at atlas/data/round300/s6_burden_effects.json.
  species: human
  source_ref: kosmicki2026
  uncertainty: 'THE ABSENCE FROM THE 207 IS THE WEAKEST OF THE THREE ARGUMENTS AND IS STATED AS SUCH - the
    207 is a significance-thresholded set and CORR-310 warns against importing another group''s cutoff, so
    ADAMTS4/5 could be sub-threshold rather than null. THE DECISIVE ARGUMENT IS DIRECTIONAL AND NEEDS NO
    STATISTICS: resorption of hypertrophic cartilage at the chondro-osseous junction is REQUIRED for the
    plate to discharge, which is why R317 made denosumab a contraindication on exactly this reasoning -
    RANKL deficiency gives osteopetrosis with RETAINED CARTILAGE. Blocking aggrecan catabolism to raise
    aggrecan is charge without discharge, failure mode number one. THE STANDING GAP IS NOT CLOSED BY THIS:
    nobody has raised aggrecan above normal in a normal animal by any route, and a SYNTHESIS-side route
    would not inherit this objection.'
localization:
- 'postnatal human growth plate: ADRB2 present and the only adrenoceptor; catecholamine synthesis machinery
  absent; aggrecanases minor and MMP13 near-universal'
- 'intervertebral disc: measured directly and contributes effectively nothing to spinal growth after age
  12'
human_evidence: direct
human_evidence_note: 'Four of the seven items rest on human data - the propranolol growth cohorts (n=185
  prospective monthly heights, n=51 paired, plus a 4-year follow-up), the disc growth measurement (188 adolescents,
  406 radiographic studies), the penicillamine osteolathyrism case and the JCA height series, and the burden
  effects and expression tables. The beta-2 mouse phenotype is the only load-bearing animal result, and
  the human arm of that axis is what closes it.'
species_basis:
- human
- mouse
translation_risk: low
translation_risk_reason: The conclusions of this round are closures, and each is anchored on human data
  in the relevant direction rather than on transferring an animal result. The one animal result that would
  have needed transferring - kuhn2026 - is the one the human data refuses.
confidence: B
claim_grades:
- claim: D-penicillamine is a usable substitute for a lysyl oxidase inhibitor on the cross-linking axis.
  grade: X
  basis: 'REFUTED ON MECHANISM. rucker1977 states penicillamine blocks cross-linking by forming thiazolidine
    complexes with the ALDEHYDE - it scavenges allysine, the product of lysyl oxidase, and does not inhibit
    the enzyme. R333 argues the LOXL2 height signal is carried by H3K4me3 deamination at the CATALYTIC AMINE
    OXIDASE SITE, which penicillamine does not touch, and R332 already measured the collagen arm directly
    with BAPN and got tibia length p=0.580. So penicillamine hits the arm shown null and misses the arm
    that may carry the signal. Independently, steinmann1979 documents human dermato-osteolathyrism including
    SCOLIOSIS in a boy treated from age 2.'
- claim: Blocking aggrecan catabolism is a route to raising aggrecan and therefore to h_term.
  grade: X
  basis: 'Three independent measurements against. ADAMTS4 and ADAMTS5 are minor in this tissue (8.5 and
    15.8 per cent of cells) while MMP13 is in 96.3 per cent; neither aggrecanase is among kosmicki2026''s
    207; and the direction is failure mode number one - hypertrophic cartilage must be resorbed to discharge,
    which is the exact reasoning that made denosumab a contraindication in R317. The synthesis-side route
    to raising aggrecan is untouched by this and the standing gap stays open.'
- claim: The intervertebral disc is a fusion-independent growth reserve available at bone age 16.
  grade: X
  basis: 'REFUTED BY DIRECT MEASUREMENT. stokes2006disc estimates discal height growth as effectively zero
    after age 12 across 188 adolescents, with spinal growth from 10 to 20 occurring almost exclusively in
    the vertebrae. R319''s physiology is right and its inference is not. Caveat: idiopathic scoliosis cohort.'
- claim: Lowering oestrogen with an aromatase inhibitor costs intervertebral disc height.
  grade: X
  basis: NOT SUPPORTED BY THE PAPER USUALLY CITED FOR IT. stevenson2023's within-arm rises are significant
    on drug and not on placebo, but the paper states BETWEEN-GROUP DIFFERENCES WERE NOT STATISTICALLY SIGNIFICANT,
    and placebo rose 0.13 cm against 0.16 and 0.21 on drug. A null between-arm comparison cannot establish
    a drug effect.
- claim: Beta-2 adrenoceptor signalling in chondrocytes is required for normal long bone growth in mouse.
  grade: C
  basis: 'UPGRADED FROM D ON FULL TEXT. kuhn2026 read in full gives femur AND tibia significantly reduced
    at 6, 12 AND 40 weeks in BOTH sexes - six groups, one direction - with increased Collagen 10+ and Collagen
    2+ and unchanged Runx2+, supporting the faster proliferative-to-hypertrophic reading. Not higher than
    C because effect sizes are FIGURE-ONLY (the text reports no percentage or millimetre value), the driver
    is Col2a1-Cre and therefore embryonic-onset rather than an inducible postnatal deletion (CORR-299),
    and there is no independent replication.'
- claim: A beta-2 agonist is an addition to this stack.
  grade: X
  basis: 'FOUR INDEPENDENT REASONS, AND THE FIRST IS DECISIVE. (i) STEP 0 - ADRB2 is Gs-coupled, so it runs
    to cAMP, PKA and CREB, and R307/R309 built three independent lines against raising cAMP here (Jansen''s
    metaphyseal chondrodysplasia at the gain end, horike2026''s CREB jam of the resting zone, and reduced
    PDE4D in ACRDYS2 giving raised pCREB at -4.81 SDS); erdafitinib''s contribution to this stack IS lowering
    CREB, so a beta-2 agonist pushes the node the lead drug exists to suppress. (ii) THE HUMAN TEST IS NULL
    - months of systemic beta-blockade in infancy moved no height across giese2021 (n=185, monthly heights),
    lin2023propranolol (n=51) and a four-year follow-up, so the axis is not rate-limiting in humans. (iii)
    NO HUMAN HEIGHT GENETICS - ADRB2 returns zero rows in kosmicki2026''s burden table. (iv) CHRONIC GPCR
    AGONISM SELF-LIMITS - beta-2 agonists desensitise and downregulate their receptor within days to weeks,
    which is a poor match for an indication requiring years of tonic drive. R306 already reached the general
    form of (iv) from the other side and this is a worked instance of it: enter at production or degradation,
    not at receptor agonism.'
- claim: Sympathetic tone or beta-blockade affects human longitudinal growth.
  grade: D
  basis: 'ANSWERED IN THE NEGATIVE, WHICH IS AN UPGRADE FROM THE X THIS FILE CARRIED. The question was recorded
    as never asked; it has been asked, repeatedly, in the infantile haemangioma literature. Three cohorts
    with height as an explicit endpoint show no linear-growth impairment on systemic propranolol. Graded
    D rather than higher because none was designed as a growth study, all are in infants rather than adolescents,
    and propranolol is non-selective.'
- claim: A genome-wide drug-target Mendelian randomization screen can rank compounds for height.
  grade: X
  basis: 'RUN AND NOT USABLE. xi2024''s significant genes localise to oesophagus mucosa, spleen, whole blood
    and brain, with NPPC assigned to PANCREAS and HLA-C to seventeen tissues - an eQTL tissue label is not
    a causal tissue (CORR-339). Its drug direction column is curated from prior literature rather than derived,
    and the authors themselves note corticosteroids and BMN-111 map to the same target with opposite effects.
    Its positive list includes tamoxifen, closed here on mechanism. Recorded as a measured negative so the
    next round does not chase it.'
- claim: Alpha-ketoglutarate and megadose ascorbate are contraindicated on a second, independent arm.
  grade: E
  basis: 'MECHANISTIC, AND STATED AS SUCH. The KDM5 enzymes that erase H3K4me3 are Fe(II)/2-oxoglutarate
    dioxygenases of the same fold as TET, so raising 2-OG should raise KDM5 activity and lower H3K4me3 -
    and R333''s module says MORE H3K4me3 IS TALLER (LOXL2 eraser +0.68 cm; KMT2B -0.35; ASH1L -0.41). Same
    supplements, same cofactor logic, second arm. A tension is recorded and not explained away: GLS supplies
    2-OG and its loss is -3.28 cm, running the other way, though GLS loss is pleiotropic while TET1''s +8.32
    cm is direct. The megadose caveat from R316 is unchanged - this is never about adequacy.'
key_refs:
- ref_id: rucker1977
  year: 1977
  type: primary
  one_line_finding: Penicillamine blocks cross-linking by forming thiazolidine complexes with the ALDEHYDE,
    i.e. it scavenges lysyl oxidase's product rather than inhibiting the enzyme; dosed to young growing
    chicks with no bone length measured.
- ref_id: steinmann1979
  year: 1979
  type: primary
  one_line_finding: First human dermato-osteolathyrism from D-penicillamine - a boy treated from age 2 for
    nearly 6 years developed scoliosis, pectus carinatum, flat feet and joint hypermobility; no height reported.
- ref_id: ansell1977
  year: 1977
  type: primary
  one_line_finding: Height on penicillamine in juvenile chronic polyarthritis tracked disease activity rather
    than the drug - an absence-of-harm observation, not an elevation result.
- ref_id: stokes2006disc
  year: 2006
  type: primary
  one_line_finding: Discal height growth is effectively zero after age 12; spinal growth from 10 to 20 years
    occurs almost exclusively in the vertebrae, across 188 adolescents and 406 radiographic studies.
- ref_id: stevenson2023
  year: 2023
  type: primary
  one_line_finding: Hormone replacement and disc height - within-arm rises significant on drug and not placebo,
    but the between-group difference is explicitly not significant, so no drug effect is established.
- ref_id: kuhn2026
  year: 2026
  type: primary
  one_line_finding: Chondrocyte-specific Adrb2 deletion reduces femur and tibia length at 6, 12 and 40 weeks
    in both sexes via a faster proliferative-to-hypertrophic transition; effect sizes figure-only, driver
    embryonic-onset.
- ref_id: giese2021
  year: 2021
  type: primary
  one_line_finding: 185 infants on propranolol with monthly prospective heights showed no deviation from
    WHO normative data - systemic beta-blockade during the fastest human growth phase did not impair linear
    growth.
- ref_id: lin2023propranolol
  year: 2023
  type: primary
  one_line_finding: Independent 51-child replication of the propranolol linear-growth null, paired Wilcoxon
    on height P greater than 0.05.
- ref_id: xi2024
  year: 2024
  type: primary
  one_line_finding: Genome-wide Mendelian randomization of drug targets against height - unusable here because
    hits localise to non-skeletal tissues and the drug direction column is curated rather than derived.
