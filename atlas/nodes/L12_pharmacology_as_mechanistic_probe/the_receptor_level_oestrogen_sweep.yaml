id: the_receptor_level_oestrogen_sweep
name: THE RECEPTOR-LEVEL OESTROGEN SWEEP - every compound class checked, and the class fails for a stated
  mechanism - antagonists block AF-2 while plate closure runs on functions that do not need ligand
aliases:
- go back to receptor level
- fulvestrant growth plate
- ICI 182,780 growth plate
- SERD growth plate
- pure antiestrogen height
- has receptor blockade ever been achieved at a growth plate
- sims2012
- round 169
type: hypothesis
layer: L12
stub: false
summary: 'THE TASK WAS TO GO BACK TO RECEPTOR LEVEL AND CHECK EVERY COMPOUND. IT IS DONE, AND THE ANSWER
  IS NO - BUT FOR A REASON THE ATLAS DID NOT PREVIOUSLY HAVE, AND THE REASON GENERALISES TO THE WHOLE
  DRUG CLASS.

  WHAT WAS BEING TESTED. Anastrozole removes LIGAND. smith1994 got 204 cm by destroying the RECEPTOR.
  Those are different control points, and the atlas had only ever tested two receptor-level compounds
  - tamoxifen, which kills resting-zone chondrocytes by a mechanism that is NOT ER antagonism (neither
  oestradiol nor IGF-I rescued it, chagin2007), and raloxifene, which turned out to be a plate AGONIST
  (nilsson2003_raloxifene). Both failures were compound-specific. That left the real question open: pure
  antagonists and degraders had, apparently, never been tried.

  CORRECTION FIRST - THEY HAD (CORR-181). Fulvestrant under its research code ICI 182,780 has been at
  a growth plate at least four times since 1998. The atlas missed them because it searched the trade and
  generic names in titles, and this literature uses the compound code in abstracts. This is the second
  instance of the CORR-171 failure mode - depth on one paper mistaken for coverage of a field.

  AND WHAT THOSE FOUR STUDIES SAY IS THE ANSWER. In WILD-TYPE animals a pure antagonist does nothing to
  longitudinal growth, three times independently: sibonga1998 - growing female rats, 1.5 mg/kg s.c., COMPLETE
  uterine antagonism in the same animals as the internal proof of target engagement, and NO EFFECT on
  tibial longitudinal growth rate. turner2000 - young MALE rats, no effect on endochondral OR intramembranous
  bone growth, while orchiectomy in the same experiment DID reduce longitudinal growth. The positive control
  fired and the drug arm did not. movrareskrtic2014 - ovariectomised mice, three weeks: ICI had NO EFFECT
  in wild-type mice on growth plate height, bone mass, uterus, fat or thymus. gunther1999 is the only
  positive and it is a RESCUE, not a gain - Faslodex cancelled OESTRADIOL- ACCELERATED skeletal maturation
  in neonatal mice back to control, with no reported effect below control on its own.

  WHY, AND THIS IS THE PART THAT CLOSES THE CLASS. movrareskrtic2014 found that ICI DOES act at the plate
  once ERalpha AF-2 is disabled - as a pronounced INVERSE AGONIST, enhancing longitudinal growth - and
  the authors propose that plate ERalpha lacking AF-2 is CONSTITUTIVELY ACTIVE IN THE ABSENCE OF LIGAND.
  brjesson2012, already in this atlas, is the other half: closure is driven by ERalpha functions that
  do NOT require AF-1, and AF-1 actively OPPOSES closure - deleting AF-1 gives a hyperactive receptor
  and CLOSES the plates. Put together: the closure function of plate ERalpha has a ligand-independent
  component, and every drug in this class - SERM, pure antagonist, SERD, CERAN, SERCA - acts by removing
  or blocking LIGAND-DEPENDENT signalling. They are AF-2 agents aimed at a function that does not need
  AF-2. gustafsson2022 adds a third mode, membrane-initiated ERalpha, widening the same gap. zhang2023_era_chondrocyte
  shows the ligand-independent function of ERalpha protein directly in human chondrocytes.

  THE HUMAN DATA FITS EXACTLY, AND IT IS BETTER DATA THAN EXPECTED. sims2012 is the trial the atlas assumed
  did not exist: 30 girls, mean age 5.9 y, McCune-Albright with progressive precocious puberty, fulvestrant
  4 mg/kg IM monthly for 12 months, prospective, international, multicentre, and carried on the FDA label.
  Rate of bone age advancement fell from 1.99 to 1.06 (mean change -0.93, 95% CI -1.43 to -0.43, p=0.0007),
  progressively (-0.83 at 6 months, -1.10 at 12). No serious treatment-related adverse events. Uterine
  and ovarian volumes unchanged - the clean demonstration that this agent has no partial agonism, which
  is what tamoxifen and raloxifene failed.

  AND THE HEIGHT ENDPOINT IS NULL. Growth velocity Z-score did not change significantly, and the point
  estimate is NEGATIVE (mean change -1.14, 95% CI -2.67 to 0.38, p=0.135). Predicted adult height was
  163.0 +/- 6.9 cm before and 163.5 +/- 6.3 cm after. The FDA label states it as no clinically meaningful
  change in PAH. THE CLOCK SLOWED AND THE GROWTH SLOWED WITH IT. That is precisely what a rescue-only,
  AF-2-limited agent predicts, and it is the same shape as gunther1999: cancel a pathological oestrogen
  excess, return to baseline, gain nothing beyond it.

  THE COMPARTMENT WAS ALSO WRONG. brjesson2010 made cartilage-specific ERalpha-null mice: they grew NORMALLY
  through sexual maturation. The tall phenotype of TOTAL ERalpha loss ran through the GH/IGF-1 axis, not
  through cartilage. Plate ERalpha only became essential for the high-dose-oestradiol response and in
  elderly animals. A plate-directed antioestrogen is aimed at a compartment that is not carrying the pubertal
  effect - while systemic ligand removal, which is what anastrozole already does, acts on the one that
  is.

  ONLY COMPLETE RECEPTOR ABLATION REPRODUCES THE PHENOTYPE, AND ONLY IN GENETICS. The human ESR1-null
  series is now five subjects across four families - smith1994/smith2008, bernard2017 (three siblings),
  feigerlova2025, soltani2024 - and it is the whole receptor protein that is gone, both activation functions
  and the membrane pool with it. No drug does that. Fulvestrant is nominally a degrader, yet movrareskrtic2014
  finds no wild-type plate phenotype, so either it does not degrade plate ERalpha appreciably or what
  survives is enough. Nobody has ever measured ERalpha protein in growth-plate chondrocytes under fulvestrant.
  That is the one genuinely open question this sweep leaves, and it is a measurement, not a lever.

  THE PRICE, RECORDED EVEN THOUGH RISK IS OUT OF SCOPE FOR THIS CASE. The genetic route buys its height
  at a skeletal cost that is quantified twice: smith2008, spine aBMD falling 0.745 to 0.684 g/cm2, Z -3.85,
  with cortex 641 microm and trabecular volume 10.6%, WHILE BONE AGE STILL ADVANCED from 15 to 17.5 y;
  feigerlova2025, lumbar Z -3.9 worsening to -5.6 and femoral neck -1.8 to -4.4, unresponsive to ethinyl-oestradiol
  AND to tamoxifen. The FDA label states that the effect of fulvestrant on bone mineral density in children
  has not been studied and is not known.

  THE STACK ANALYSIS, RUN ANYWAY, BECAUSE IT IS THE ONE PLACE THIS COMPOUND WINS. Fulvestrant is CLEAN
  AGAINST ERDAFITINIB - the label states no known drug-drug interactions, no significant inhibition of
  CYP1A2, 2C9, 2C19, 2D6 or 3A4 in vitro, no CYP3A4 inhibition against midazolam in vivo, and neither
  rifampin nor ketoconazole altered its own PK. That is exactly the objection that disqualified resveratrol,
  and fulvestrant clears it. Against GH the direction is favourable rather than hostile: oestrogen SUPPRESSES
  hepatic IGF-I (gibney2005) and antagonises GH metabolic actions (wolthers2001), so blocking oestrogen
  action should not lower IGF-I the way resveratrol did in humans - though no one has measured IGF-I under
  fulvestrant in anyone, so this is inference, not data. Against anastrozole the two are NOT redundant
  in the only human randomised test that exists (mehta2012/mehta2019, anastrozole plus fulvestrant beat
  anastrozole alone on PFS and OS) - but that is breast cancer, not a growth plate, and at a growth plate
  the antagonist has no measured effect to add. NONE OF THIS MATTERS, because the compound that stacks
  cleanly is the compound with a null height endpoint.

  THE REST OF THE CLASS, CHECKED AND EMPTY. Six oral SERDs (elacestrant, giredestrant, camizestrant, imlunestrant,
  amcenestrant, palazestrant), the ERalpha PROTAC vepdegestrant, the covalent SERCA class, and the remaining
  SERMs (toremifene, bazedoxifene, lasofoxifene, ospemifene, arzoxifene, droloxifene) have ZERO growth-plate,
  chondrocyte or longitudinal-growth studies between them. They are also all AF-2 agents by design, so
  the mechanism above predicts the same null before any of them is tested. basu2026 adds that giredestrant
  and camizestrant cause ON-TARGET Esr1-mediated bradycardia while fulvestrant does not - so the newer,
  more potent members of the class are not even the safer ones.

  VERDICT: ADD NOTHING AT RECEPTOR LEVEL. The duration arm remains at its ceiling with anastrozole, and
  it is now closed on a mechanism rather than on an absence of data.

  == AMENDED R338, ON TWO POINTS, BOTH AGAINST THIS NODE ==

  (1) THE PROTAC IS MISCLASSIFIED ABOVE AND THE ERROR IS LOAD-BEARING. This node states that only loss
  of the whole receptor protein - "both activation functions and the membrane pool with it" - reproduces
  the phenotype, and that "no drug does that". Nine lines later it files "the ERalpha PROTAC vepdegestrant"
  among agents that "are also all AF-2 agents by design". THAT IS A CATEGORY ERROR. A PROTAC binds an E3
  ubiquitin ligase and the receptor simultaneously and triggers ubiquitination and PROTEASOMAL DEGRADATION
  OF THE PROTEIN, catalytically, taking AF-1, AF-2, the DNA-binding domain and the membrane pool together.
  Its ER-binding warhead engages the ligand-binding domain, which is presumably why it was grouped with
  the blockers, but the warhead is the addressing mechanism and degradation is the effect. THIS NODE SPECIFIED
  PROTEIN ABLATION AS THE REQUIREMENT AND DISMISSED THE ONLY DRUG CLASS THAT ACHIEVES IT, IN THE SAME PARAGRAPH.
  Since this node was written, VEPDEGESTRANT WAS APPROVED BY THE FDA ON 1 MAY 2026 - the first PROTAC ever
  approved, oral, 200 mg once daily - so the class is no longer investigational.

  (2) THE brjesson2010 COMPARTMENT ARGUMENT USES ONE ARM AND THE OTHER ARM REVERSES IT (CORR-309, fifth
  instance). This node says cartilage-specific ERalpha-null mice "grew NORMALLY through sexual maturation",
  concluding a plate-directed antioestrogen aims at a compartment that is not carrying the effect. The
  same abstract continues: "Adult cartilage-specific ERalpha(-/-) mice CONTINUED TO GROW AFTER 4 MONTHS
  OF AGE, whereas growth was limited in control mice, resulting in INCREASED FEMUR LENGTH in 1-year-old
  cartilage-specific ERalpha(-/-) mice", and the authors conclude plate ERalpha is unimportant during early
  sexual maturation but IS essential for the reduction of longitudinal bone growth in elderly mice. Plate
  ERalpha is dispensable EARLY and operative LATE - which inverts the compartment objection for a late-window
  subject rather than supporting it.

  WHAT SURVIVES UNCHANGED: everything about the AF-2 agents. The three wild-type nulls with internal positive
  controls, sims2012''s null height endpoint in growing children, and the mechanism that predicts both,
  all stand. The amendment is that the mechanism''s own corollary - remove the PROTEIN - now has an approved
  drug and had never been tested. See round338_the_receptor_sweep_specified_protein_ablation_and_dismissed_the_only_drug_class_that_achieves_it.'
