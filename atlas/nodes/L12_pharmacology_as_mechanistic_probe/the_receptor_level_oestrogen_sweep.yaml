localization:
- 'growth plate chondrocyte ERalpha: present, but brjesson2010 shows it is NOT the operative compartment
  during sexual maturation - cartilage-specific deletion grew normally and the total-null phenotype ran
  through the GH/IGF-1 axis'
- 'the ligand-independent / AF-1-independent closure function of ERalpha: the actual target, and the one
  no compound in this class engages'
human_evidence: direct
human_evidence_note: Unusually strong for an L12 node. sims2012 is a prospective multicentre trial of
  a pure oestrogen-receptor antagonist in 30 growing children with bone age, growth velocity and predicted
  adult height as endpoints, and its results are reproduced on the FDA label. The human ESR1-null series
  (smith1994/smith2008, bernard2017, feigerlova2025, soltani2024) supplies the genetic comparator with
  height and bone density. What is absent is any human measurement of ERalpha protein or signalling in
  a growth plate under any of these drugs.
species_basis:
- human
- mouse
- rat
translation_risk: low
translation_risk_reason: The central negative claim rests on a human trial with a null height endpoint,
  agreeing with three independent wild-type animal nulls in two species and both sexes, and explained
  by a mechanism established in mouse genetics. The residual risk runs the other way - that the class
  is being closed on agents and exposures that never achieved receptor blockade at the plate, which is
  exactly the unmeasured quantity named in the open question.
confidence: B
claim_grades:
- claim: No pure oestrogen-receptor antagonist or degrader has ever been tested at a growth plate.
  grade: X
  basis: FALSE, AND THIS ATLAS ASSERTED IT BEFORE CHECKING PROPERLY (CORR-181). ICI 182,780 has been tested
    against growth-plate and longitudinal-growth endpoints in sibonga1998, turner2000, gunther1999 and
    movrareskrtic2014. The search failed because it used trade and generic names in titles while this
    literature uses the compound code in abstracts.
- claim: A pure oestrogen-receptor antagonist increases longitudinal bone growth in an unchallenged wild-type
    animal.
  grade: X
  basis: NO, three times independently and in both sexes. sibonga1998 - no effect on tibial longitudinal
    growth rate in growing female rats despite complete uterine antagonism proving engagement. turner2000
    - no effect on endochondral or intramembranous growth in young male rats while orchiectomy in the
    same experiment did reduce growth. movrareskrtic2014 - no effect on growth plate height in wild-type
    mice. The one positive, gunther1999, is a rescue of exogenous oestradiol back to control, not a gain
    below it.
- claim: Fulvestrant slows skeletal maturation in growing children.
  grade: B
  basis: YES, and the effect is large - deltaBA/deltaCA 1.99 to 1.06, mean change -0.93, p=0.0007, progressive
    over the 12 months, in 30 children, reproduced on the FDA label (sims2012). Graded B not A because
    it is single-arm with each subject her own control, the pre-treatment bone-age interval was collected
    retrospectively, the population has pathologically accelerated maturation from an autonomous oestrogen
    source, and it has never been replicated.
- claim: Slowing skeletal maturation with fulvestrant increases predicted or attained adult height.
  grade: X
  basis: 'NO - the height endpoint in the only human study is NULL. Predicted adult height 163.0 vs 163.5
    cm, described on the FDA label as no clinically meaningful change, because growth velocity Z-score
    fell alongside the bone-age clock (mean change -1.14, p=0.135, point estimate negative). No final
    height was ever reported: 24 of 29 girls entered an extension phase that has never been published.
    CAVEAT ADDED 2026-08-09 (CORR-182): this is a PREDICTED-height null on a MONOTHERAPY, and both qualifiers
    weaken it. nearfinal2026 shows predicted adult height can rank agents backwards against attained height,
    and mauras2008/mauras2016 show an oestrogen agent that looks inert alone converts once a velocity
    agent holds the growth term up. The receptor arm nonetheless stays closed, for a reason this correction
    does not touch: sibonga1998, turner2000 and movrareskrtic2014 find NO growth-plate effect of the antagonist
    in wild-type animals at all, so there is no duration effect for a velocity agent to multiply, and
    the sims2012 bone-age effect is cancellation of a PATHOLOGICAL oestrogen excess that anastrozole already
    covers outside McCune-Albright syndrome.'
- claim: Growth plate closure is driven by oestrogen-receptor functions that a ligand-directed drug cannot
    block.
  grade: C
  basis: Mouse genetics, two studies, converging. brjesson2012 - closure requires ERalpha functions that
    do NOT require AF-1, and AF-1 opposes closure. movrareskrtic2014 - ICI is inert at the wild-type plate
    but an inverse agonist once AF-2 is disabled, from which the authors infer plate ERalpha is constitutively
    active without ligand. zhang2023_era_chondrocyte demonstrates ligand-independent ERalpha function
    in human chondrocytes, though articular not physeal. C rather than B because no human allele separates
    the activation functions and the inference to drug classes is the atlas making it, not any paper.
- claim: The tall ESR1-null phenotype is a growth-plate-autonomous effect that a plate-directed drug could
    reproduce.
  grade: X
  basis: NO. brjesson2010 made cartilage-specific ERalpha-null mice and they grew NORMALLY during sexual
    maturation; the total-null growth phenotype was associated with alterations in the GH/IGF-1 axis.
    Cartilage ERalpha mattered only for the high-dose-oestradiol response and in elderly mice. The operative
    compartment at the age in question is systemic, which is where anastrozole already acts.
- claim: Fulvestrant is pharmacokinetically safe to combine with erdafitinib.
  grade: B
  basis: The FDA label states no known drug-drug interactions, no significant inhibition of CYP1A2, 2C9,
    2C19, 2D6 or 3A4 in vitro, no CYP3A4 inhibition against midazolam in vivo, and unchanged fulvestrant
    PK with rifampin or ketoconazole. Erdafitinib is 39% CYP2C9 and 20% CYP3A4, so this is the exact objection
    that disqualified resveratrol and fulvestrant clears it. B not A because the label speaks to fulvestrant
    as perpetrator and victim generally, and no study has co-administered these two agents.
- claim: Blocking the oestrogen receptor will not lower IGF-1 and so does not threaten the GH arm.
  grade: E
  basis: INFERENCE ONLY. Oestrogen suppresses hepatic IGF-I (gibney2005, dose-dependently in humans) and
    antagonises GH metabolic actions by a route-dependent hepatic mechanism (wolthers2001), so removing
    oestrogen action should be neutral to favourable - the opposite of resveratrol, which lowered IGF-I
    and IGFBP-3 in all volunteers (brown2010). But no one has measured IGF-I under fulvestrant in any
    population, and the human studies cited are oral oestrogen in postmenopausal and hypopituitary adults.
- claim: Aromatase inhibition and receptor antagonism are non-redundant, so adding fulvestrant to anastrozole
    would add growth-plate effect.
  grade: X
  basis: THE PREMISE IS TRUE IN HUMANS AND THE CONCLUSION DOES NOT FOLLOW. mehta2012/mehta2019 show anastrozole
    plus fulvestrant beats anastrozole alone on PFS and OS in metastatic breast cancer, so residual receptor
    signalling under full ligand suppression is real - in a tumour. At a growth plate the antagonist has
    no measured longitudinal-growth effect of its own in any wild-type animal and a null height endpoint
    in the one human trial, so there is nothing to add. Non-redundant plus zero is still zero.
- claim: A newer or more potent member of the class - an oral SERD, a PROTAC degrader, a covalent antagonist
    - would do better.
  grade: E
  basis: NOT PREDICTED, AND UNTESTED. Zero growth-plate, chondrocyte or longitudinal-growth studies exist
    for any of the six oral SERDs, vepdegestrant, or the SERCA class. All are AF-2-directed by design,
    so the brjesson2012/movrareskrtic2014 mechanism predicts the same null. basu2026 further shows the
    newer oral SERDs carry ON-TARGET Esr1-mediated bradycardia that fulvestrant does not, so potency is
    not buying safety either. The only mechanistically distinct proposition is COMPLETE protein removal,
    and zhang2023_era_chondrocyte warns that removing the protein removes ligand-independent chondroprotective
    functions that blocking the ligand does not touch.
