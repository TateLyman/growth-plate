- g_l12_final_height_of_the_sims2012_extension_cohort
contradicts:
- SUPERSEDES the round-168 statement in the_vegf_control_point_is_the_wrong_lever that the receptor route
  is dead because of two compound-specific failures (tamoxifen off-target toxicity, raloxifene agonism).
  The conclusion is unchanged but the basis is now a class mechanism plus a human trial, which is stronger
  and also predicts the failure of compounds that have never been tested.
- CORRECTS this atlas own round-169 working claim, recorded as CORR-181, that no pure antagonist or SERD
  had ever been tested at a growth plate.
- 'CORRECTED BY CORR-182 in one respect: this node treated the sims2012 predicted-height null as evidence
  that slowing skeletal maturation does not buy height. It is not - the null is monotherapy and on a surrogate.
  The arm still closes, on the wild-type animal nulls and the AF-2 mechanism, which the correction leaves
  intact.'
