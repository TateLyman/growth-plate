human_evidence: absent
human_evidence_note: Every primary read in this round is an animal study. The human relevance is indirect and runs through
  the corrections each one makes to claims this atlas holds about human-directed levers. hoffer2001 is the one human
  paper in the set and its refutation of an R457 inference is recorded in that round's own entry.
translation_risk: high
translation_risk_reason: Rabbit, rat, mouse and porcine growth plates differ from an adolescent human plate in fusion
  behaviour, transit time and absolute dimensions. What transfers here is not effect size but three structural facts
  - a study design (the normal-reference-group requirement), a regulatory strategy (activity not mass), and a geometric
  assignment (which septum is the axial path) - each of which is a property of how the tissue is organised rather than
  of a species-specific magnitude.
summary: 'Seven primaries the atlas had listed as blocked or unread were supplied and read. Five change something.

  ONE - hansson1967 (Acta Orthop Scand Suppl 101, the sole citer of schneider1963 in 63 years) CLOSES THE MEDULLARY OCCLUSION
  AND LOCAL IRRITATION ARM, and it does so with a design nobody has matched since. Young rabbits, proximal tibial marrow
  cavity plugged with homologous cortical bone at 30 days, daily growth by oxytetracycline in five growth regions from
  2 days before to 100 days after, PLUS a seven-arm sham ladder in litter mates PLUS a normal unoperated reference group.
  Three results. (a) The gain is transient and then reverses: proximal tibia peaked at +25 micron/day (4.9%) and +60-70
  micron cumulative at day 6, and at 40 days the cumulative difference was about 105 micron IN FAVOUR OF THE CONTROL
  SIDE; proximal fibula peaked at +331 micron cumulative at 7 days and the control side led by 119 micron at 40 days;
  at 60-100 days the operated side grew about 10% slower with shorter cell columns. (b) The sham ladder orders cleanly
  - anaesthesia and skin incision nothing, periosteal incision small and short, cortical drilling real, marrow destruction
  more, plugging most. (c) The decisive arm, which requires the normal reference group: the operation RETARDED growth
  below normal in EVERY region on BOTH sides INCLUDING THE DISTAL RADIUS OF THE FORELIMB (-12.5% by day 4), and at the
  distal fibula the control side fell 51-71 micron/day while the operated side was UNCHANGED - so the apparent stimulation
  there is entirely control-side retardation. The author states the generalisation: the difference between sides is due
  to a larger extent to retardation on the unoperated side than to stimulation on the operated side. And the data refute
  Trueta''s local-hyperaemia model from inside: the plate whose OWN metaphyseal vessels were destroyed showed the SMALLEST
  early difference while plates with INTACT vessels showed the largest, making the stimulus limb-wide and vascular rather
  than local - which is also a mechanism for the cross-bone overgrowth anomaly.

  TWO - hunziker1999organelle supplies the unit R447 and R454 said the matrix term does not have, and then reverses R447''s
  reading of itself. Matrix GAG production per terminal hypertrophic chondrocyte is 54.2 / 62.6 / 25.2 micron^3 per hour
  at 21 / 35 / 80 days; 62.6 x 24 = about 1502 micron^3 per cell per day against R454''s independently derived 1473,
  agreeing to 2%. All three organelles regulate by ACTIVITY and not by MASS - the +16% GAG rise came from a 65% rise
  in activity per unit Golgi membrane while total Golgi membrane fell about 22%; RER activity per unit membrane rose
  261% across 21 to 80 days while RER membrane fell. But the discussion names the exception explicitly: in cell systems
  that are CONTINUALLY STIMULATED and sustain high activity, TOTAL ORGANELLAR MASS IS MODULATED instead, and the plate
  uses activity because its phase durations are short. A sustained pharmacological input is therefore the regime in which
  organelle expansion is the documented response, which is the opposite of what R447 concluded from the abstract.

  THREE - and the same paper carries a composition shift this atlas has never had. Matrix volume per cell had to be corrected
  for changing constituent densities because during hypertrophy the volume density of FIBRILLAR COLLAGEN INCREASES while
  the density of GLYCOSAMINOGLYCANS DECREASES, and at 80 days collagen concentration is higher and GAG concentration
  significantly lower than at 21 and 35 days. A slow plate makes a compositionally different matrix - more collagen,
  less GAG - and GAG is the fixed charge that R448 shows is leveraged at an exponent of 1.73. That is a mechanism for
  the age-related decline of the swelling term, and it converges with R446 (ARSI, a desulfatase about 300-fold enriched
  into the hypertrophic zone) and R410 from a third direction.

  FOUR - prein2016 answers the direction question and R463''s reading of it was geometrically inverted. The TRANSVERSE
  septum is the pericellular plus territorial matrix BETWEEN CELLS WITHIN A COLUMN - the material a hypertrophic cell
  displaces to get TALLER - and the LONGITUDINAL septum is the interterritorial matrix BETWEEN COLUMNS, what it displaces
  to get WIDER. The transverse septum is ALWAYS SIGNIFICANTLY SOFTER, roughly by a factor of one half throughout all
  measurements. So the axial path is the soft one at about 2.25x, against the 2.47:1 that R454''s cell-shape arithmetic
  requires. And the anisotropy is COMPOSITIONAL rather than ORIENTATIONAL - collagen density is lower in the transverse
  septum and fibril orientation appeared RANDOM in both compartments - which dissolves the plant fibre-angle paradox,
  because no hoop is required. The authors propose the same constraint mechanism R463 derived independently.

  FIVE - ramesh2022 closes A4 and the in vivo length effect decays nine-fold: 0.28 cm at the end of four weekly high-energy
  sessions falling to 0.03 cm at sacrifice six weeks later, with the paper''s own primary outcome being the value at
  sacrifice and the plates fused by then. Dose is 3000 impulses, 180 mJ, 5 Hz weekly x 4.

  SIX - leem2002 closes B7 and is not a contradiction: intraperitoneal lovastatin, n=5, a 48-hour tetracycline rate proxy,
  +59.6%, with no attained-length endpoint - the fifth instance in this atlas of a large short-term rate proxy that has
  never been converted into length.

  SEVEN - and one item is NOT answered: the buckwalter1986 fetch returned the JBJS volume 68-A index rather than the
  paper, so the per-zone organelle tables remain unread.'
quantitative:
- parameter: Medullary plugging - proximal tibia, difference between operated and control side
  value: peak +25+/-25 micron/day (4.9%) on days 3-6; cumulative peak +60-70 micron at day 6; CUMULATIVE -105 micron
    IN FAVOUR OF THE CONTROL SIDE at 40 days; about 10% slower on the operated side at 60, 80 and 100 days with shorter
    cell columns
  unit: micron per day and cumulative micron
  species: rabbit
  source_ref: hansson1967
  note: oxytetracycline daily growth, n per group not stated in the read section; the reversal is the result
- parameter: Medullary plugging - proximal fibula, difference between operated and control side
  value: peak +60-70 micron/day (14-16%) on days 3-6; cumulative +331 micron at 7 days; equal at 25-30 days; CUMULATIVE
    -119 micron IN FAVOUR OF THE CONTROL SIDE at 40 days
  unit: micron per day and cumulative micron
  species: rabbit
  source_ref: hansson1967
- parameter: Medullary plugging - effect on growth measured against a NORMAL UNOPERATED REFERENCE GROUP
  value: proximal tibia control side -36 micron (6.3%) day 1 to -63 micron (11.3%) day 4 and operated side -40 to -60
    micron (7-11%); DISTAL RADIUS OF THE FORELIMB -26 micron (5.3%) day 1 to -60 micron (12.5%) day 4 with cell columns
    10.7% shorter; distal fibula control side -51 to -71 micron/day while the OPERATED SIDE WAS UNCHANGED
  unit: micron per day and per cent of normal
  species: rabbit
  source_ref: hansson1967
  note: this is the arm that requires the normal reference group and it is what shows the apparent stimulation to be
    largely systemic retardation the operated limb is spared from
- parameter: Seven-arm sham ladder, effect on rate of growth
  value: anaesthesia alone and skin incision - no demonstrable effect; periosteal incision - similar but less pronounced
    and shorter; cortical drilling - real, first few days; marrow destruction without plug - more; marrow plugging -
    most
  unit: ordinal
  species: rabbit
  source_ref: hansson1967
- parameter: Matrix glycosaminoglycan production per terminal hypertrophic chondrocyte
  value: 54.2 at 21 days, 62.6 at 35 days, 25.2 at 80 days (+16% then -60%)
  unit: micron^3 per cell per hour
  species: rat
  source_ref: hunziker1999organelle
  note: 62.6 x 24 h = about 1502 micron^3 per cell per day against R454 independently deriving 1473 from hunziker1994
    plus wilsman1996 - the two agree to 2 per cent, and this is the unit R447 said the matrix term does not have
- parameter: Fibrillar collagen production per terminal hypertrophic chondrocyte
  value: 44.9 at 21 days, 77.6 at 35 days, 82.5 at 80 days (+73% then +6%)
  unit: micron^3 per cell per hour
  species: rat
  source_ref: hunziker1999organelle
  note: collagen output per cell is maintained or rising across growth deceleration while GAG output falls 60 per cent
    - the two arms of the matrix term are oppositely regulated
- parameter: How the chondrocyte changes matrix output - activity versus organellar mass
  value: Golgi activity per unit membrane area +65% on acceleration while total Golgi membrane surface area per cell
    FELL about 22%; RER activity per unit membrane +71% then +53%, and +261% across 21 to 80 days, while RER membrane
    surface fell 31% and RER volume 56% between 35 and 80 days; total mitochondrial volume unchanged on acceleration
    and -35% on deceleration
  unit: per cent change
  species: rat
  source_ref: hunziker1999organelle
  note: the authors attribute activity-not-mass to the short phase durations of this cell and state that in CONTINUALLY
    STIMULATED cell systems total organellar mass is modulated instead
- parameter: Matrix composition shift with growth deceleration
  value: volume density of fibrillar collagen INCREASED and density of glycosaminoglycans DECREASED during hypertrophy;
    at 80 days collagen concentration higher and GAG concentration significantly lower than at 21 and 35 days
  unit: volume density
  species: rat
  source_ref: hunziker1999organelle
  note: matrix volume per cell had to be corrected for this before synthetic activity could be assessed - so hunziker1994
    near-invariant matrix VOLUME per cell coexists with a changing matrix COMPOSITION
- parameter: Septal elastic modulus by compartment, newborn murine proliferative zone
  value: TRANSVERSE septum (pericellular plus territorial matrix, the AXIAL path) 7.5-48.3 kPa; LONGITUDINAL septum (interterritorial
    matrix, the RADIAL path) 8.9-137.9 kPa with Gaussian maxima at 26.1+/-0.4 and 59.9+/-2.1 kPa; transverse ALWAYS significantly
    softer, roughly by a factor of one half throughout all measurements
  unit: kPa
  species: mouse
  source_ref: prein2016
  note: about 2.25x axial-over-radial softness against the 2.47:1 linear anisotropy R454 cell-shape arithmetic requires;
    fibril ORIENTATION appeared RANDOM in both compartments, so the anisotropy is collagen DENSITY rather than fibre
    angle
- parameter: Septal widths, newborn murine proliferative zone
  value: transverse septa 2-3 micron; longitudinal septa 10-30 micron
  unit: micron
  species: mouse
  source_ref: prein2016
- parameter: Per-zone transverse-over-axial modulus ratio E1/E3, newborn porcine ulnar growth plate
  value: 17.0 complete plate, 23.1 reserve, 13.7 proliferative, 12.1 HYPERTROPHIC
  unit: dimensionless ratio
  species: porcine
  source_ref: sergerie2009
  note: computed in R468 from Table 1; the anisotropy holds in the zone where the cell actually elongates, and the hypertrophic
    zone is also 4.2x more permeable than the reserve zone
- parameter: Complete growth plate axial modulus versus the sum of its own zones
  value: measured 0.51+/-0.05 MPa versus a three-springs-in-series prediction of 0.353+/-0.02 MPa
  unit: MPa
  species: porcine
  source_ref: sergerie2009
  note: significantly different; the authors attribute it to sectioning interrupting continuous collagen and proteoglycan
    networks spanning the three zones - an independent argument for a transphyseal fibre system
- parameter: Radial shockwave, adolescent rabbit tibial length versus untreated contralateral limb
  value: mean difference 0.28 cm at 26 weeks immediately after four weekly sessions (p=0.008), falling to 0.03 cm at
    sacrifice at 32 weeks (p=0.001) - a nine-fold decay, with the value at sacrifice being the paper stated primary outcome
    and the plates fused by then
  unit: cm
  species: rabbit
  source_ref: ramesh2022
  note: dose 3000 impulses, 180 mJ, 5 Hz, weekly x 4; intra-assay coefficient of variation 4 per cent
- parameter: Radial shockwave, immature rabbit distal femur - cell-level versus zone-level readout
  value: column density per mm rose at low (40+/-12 vs 32+/-9, p=0.0049) and high energy (51+/-13 vs 37+/-3, p=0.0005)
    and PCNA-positive cells rose at high energy (114+/-9 vs 74+/-13, p=0.02) WHILE average growth plate height and area
    did NOT increase and resting and hypertrophic zone heights were unaffected
  unit: columns per mm and cells per field
  species: rabbit
  source_ref: ramesh2022
  note: another instance of R463 finding that the zone-height readout is blind to a cell-level effect
- parameter: Lovastatin, longitudinal bone growth rate in normal adolescent rats
  value: 489.0+/-70.1 to 780.5+/-72.8 micron per 48 h (P<0.05, +59.6%); BrdU labelling index 19.0+/-7.8 to 32.5+/-5.7
    per cent (P<0.05)
  unit: micron per 48 h and per cent
  species: rat
  source_ref: leem2002
  note: 5 mg/kg INTRAPERITONEAL for five days, n=5 per group, a 48-hour tetracycline rate proxy with NO attained-length
    endpoint - so it does not contradict humphries2018 in children
