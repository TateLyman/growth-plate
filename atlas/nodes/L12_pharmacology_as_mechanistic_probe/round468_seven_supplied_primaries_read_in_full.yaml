id: round468_seven_supplied_primaries_read_in_full
name: 'R468 - seven operator-supplied primaries read in full: the occlusion/irritation arm closes on a 1967 seven-arm
  design, the matrix term gets its unit and its composition shift, and the direction question is answered with R463''s
  own geometry inverted'
