translation_risk: moderate
translation_risk_reason: 'The appendicular bias is now seen in three species by different methods, which
  is the strongest pattern evidence in this file for any site claim. The GUSB compartment result is a
  clean mechanistic localisation. The FGFR-lysosome interaction is a cell line and is flagged as a
  hypothesis only.'
confidence: B
claim_grades:
- claim: the CNP axis produces a smaller and less reliable response in the axial skeleton than in the
    appendicular skeleton
  grade: B
  basis: convergent across three species by different methods - L4-L6 the only non-significant segment
    in TD mice at both doses, an outright L1-L4 null at 7 per sex in juvenile primates, and in rats an
    axial gain that arrives with scoliosis, kyphosis and fractures
- claim: the sex difference in the primate and rat skeletal response is biological
  grade: X
  basis: WITHDRAWN. The assessors attribute it to higher vosoritide exposures in males, which resolves the
    round-205 CORR-191 flag in the benign direction
- claim: the CNP-axis growth effect emerges in adolescence rather than early development
  grade: C
  basis: an observation about when effects appeared in a juvenile rat toxicology study, not a designed
    age-response experiment; concordant in direction with cnpmeta2026's age subgroup
- claim: bone deconjugation of polyphenol glucuronides is carried out by hematopoietic marrow cells
  grade: A
  basis: localised to marrow, abolished by a specific GUSB inhibitor, and reduced or absent in two
    genetic strains
- claim: growth plate cartilage deconjugates polyphenol glucuronides
  grade: E
  basis: DOWNGRADED THIS ROUND. The enzyme source is named as marrow, and the growth plate is avascular
    and marrow-free with the resting zone at the maximum diffusion distance. Still untested, now less
    likely
- claim: FGFR inhibition alters chondrocyte lysosomal enzyme handling
  grade: C
  basis: a chondrosarcoma line with double FGFR3/FGFR4 knockout, rescued by pathway restoration; not a
    pharmacological inhibitor and not primary chondrocytes
- claim: erdafitinib and a polyphenol would interact at the activation step
  grade: E
  basis: PURE INFERENCE across two literatures, and the direction is not even determined - hypersecretion
    and impaired lysosomal function push opposite ways
