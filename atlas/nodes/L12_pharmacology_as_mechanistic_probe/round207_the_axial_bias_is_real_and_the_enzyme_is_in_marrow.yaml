contradicts:
- 'SHARPENS RATHER THAN OVERTURNS CORR-201. Round 205 recorded the primate L1-L4 null and downgraded the
  proportionate-growth claim to D. The EPAR shows the null is at 7 animals per sex rather than a handful,
  and adds a mouse segment table where L4-L6 is the only segment failing significance at both doses. The
  appendicular bias is now a three-species pattern and is upgraded to B, while the human achondroplasia
  segment-ratio result remains the one datum pointing the other way.'
- 'WITHDRAWS THE SEX-DIFFERENCE FLAG RAISED IN ROUND 205. The high-dose female femur being negative and
  the statement that females showed minimal increases looked like a CORR-191 situation. The assessors
  attribute the sex difference to higher exposures in males, so it is a pharmacokinetic artefact rather
  than a biological insensitivity.'
- 'DOWNGRADES THE HYPOTHESIS THIS ATLAS RAISED LAST ROUND. Round 206 proposed the resting zone as the
  compartment most likely to deconjugate polyphenol glucuronides, because GUSB is lysosomal and
  avijgan2026 finds resting-zone chondrocytes lysosome-rich. kunihiro2019 names the enzyme source as
  hematopoietic marrow cells and localises the reaction there. The growth plate is avascular and
  marrow-free. The hypothesis moves from plausible to unlikely, and the experiment that would settle it
  is unchanged.'
