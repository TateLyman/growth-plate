id: round228_the_bone_age_closed_by_exhaustion_and_the_dose_response_is_flat
name: ROUND 228 - the bone-age question is CLOSED by exhaustion across five independent routes, the archive
  route recommended last round does not work, and the FDA case series that closes it quantifies a child this
  atlas had as unquantified - which makes the human erdafitinib dose-response FLAT from 3 to 7 mg
type: hypothesis
layer: L12
aliases:
- the bone age closed
- closure by exhaustion
- the flat dose response
- 19.6 against 19.1 at half the dose
- round 228
stub: false
summary: 'THE QUESTION IS CLOSED, AND CLOSED MEANS THE DATA DOES NOT EXIST RATHER THAN THAT I FAILED TO FIND
  IT. Five independent routes were checked and all five are negative.

  ONE - TRIAL REGISTRIES. Round 226 queried five paediatric FGFR-inhibitor trials against the
  ClinicalTrials.gov API and NONE registers a bone-age or skeletal-maturation outcome of any kind. TWO - THE
  ONE COHORT THAT TOOK FILMS. APEC1621B mandates baseline and serial proximal tibial physeal radiographs in
  every patient with central submission, and its only publication, ASCO abstract 10007, contains not one word
  about them. THREE - THE NCTN DATA ARCHIVE, AND THIS WITHDRAWS ROUND 226''s OWN RECOMMENDATION. The public
  catalogue lists 27 trials and 35,240 patients, every entry carrying a PMID FROM WHICH DATA ARE AVAILABLE.
  APEC1621B IS NOT LISTED, because deposition follows full publication and APEC1621B has no full paper. THE
  REQUEST ROUTE I NAMED AS THE ONE THAT WOULD WORK DOES NOT WORK. FOUR - THE CANCER IMAGING ARCHIVE. 155
  collections queried through the NBIA API; no Pediatric MATCH, no APEC1621, no COG FGFR collection. FIVE -
  AND THE DECISIVE ONE. nadeaunguyen2026 is the FDA Office of Surveillance and Epidemiology''s own postmarket
  evaluation of every reported paediatric skeletal toxicity on this drug, and NO BONE AGE WAS ASSESSED OR
  REPORTED IN ANY OF THE FIVE CASES.

  THAT LAST FACT IS ITSELF THE FINDING. In a drug whose signature paediatric toxicity is accelerated growth
  and slipped epiphyses, the agency reviewed every case and NOBODY - not the treating teams, not the case
  authors, not the regulator - EVER MEASURED A BONE AGE. The one measurement that would say whether the
  growth is bought or borrowed has never been taken by anyone.

  AND THE FIVE-CASE SERIES IS THE ONE THIS PROGRAMME HAS BEEN CITING SINCE CORR-046 WITHOUT HAVING READ.
  Case 1 - 13-year-old male, astrocytoma, SLIPPED CAPITAL FEMORAL EPIPHYSIS at 84 days, obese, surgery. Case
  2 - 13-year-old male, glioma, SCFE at 137 days, obese, surgery. Case 3 - 15-year-old male, astrocytoma,
  ACCELERATED GROWTH OF 14.3 cm OVER 9 MONTHS at 274 days, severe kyphoscoliosis, surgery. Case 4 -
  13-year-old male, glioma, ACCELERATED GROWTH OF 9.8 cm OVER 6 MONTHS at 183 days, ON GROWTH HORMONE, with
  testosterone management. Case 5 - 10-year-old female, ependymoma, accelerated growth at 120 days on growth
  chart. Median onset 137 days, range 84 to 274. ALL FIVE DISCONTINUED, THREE REQUIRED SURGERY.

  CASE 3 IS erdachild2024, CASE 5 IS raimann2024 PATIENT 2, AND CASE 4 IS raimann2024 PATIENT 1 - WHOSE
  VELOCITY BOTH THE PAPER AND CORR-226 RECORDED AS UNQUANTIFIED. THE FDA QUANTIFIES IT AT 9.8 cm OVER SIX
  MONTHS.

  AND THAT NUMBER MAKES THE HUMAN DOSE-RESPONSE FLAT. raimann2024 patient 1 took erdafitinib at 5 mg reduced
  to 3 mg and grew 9.8 cm in six months, which annualises to 19.6 cm/year. erdachild2024 took 7 mg reduced to
  5 mg and grew 14.3 cm in nine months, which annualises to 19.1 cm/year. TWO CHILDREN, DOSES DIFFERING
  ROUGHLY TWOFOLD, THE SAME ANNUALISED VELOCITY TO WITHIN THREE PER CENT.

  ROUNDS 216 TO 218 BUILT A DOSE-RESPONSE CURVE ACROSS 3 TO 9 mg ON THE PREMISE THAT MORE EXPOSURE BUYS MORE
  GROWTH. CORR-226 showed the curve was unidentifiable because its lower anchor spliced two patients. This is
  worse for the premise and better for the evidence - THE ANCHOR IS NOW UNSPLICED, AND WHAT IT SHOWS IS NO
  DOSE-RESPONSE AT ALL ACROSS 3 TO 7 mg.

  THE CONFOUND IS REAL AND CUTS BOTH WAYS, AND BOTH READINGS MATTER FOR THIS STACK. Case 4 was ON GROWTH
  HORMONE and hypogonadotropic; case 3 was not on growth hormone and had normal growth-axis hormones for
  Tanner 2-3. So the flat comparison is GROWTH-HORMONE-PLUS-LOW-DOSE against ERDAFITINIB-ALONE-AT-HIGHER-DOSE.
  EITHER the erdafitinib dose-response is flat in this range, OR growth hormone substituted for the missing
  two to four milligrams. THIS STACK CONTAINS BOTH AGENTS, AND NEITHER READING SUPPORTS THE ROUND-217 PREMISE
  THAT THE WAY UP IS MORE ERDAFITINIB.

  THE THIRD CHILD SITS AT 10 cm/YEAR AND IS THE ONLY ONE WHOSE DOSE IS UNKNOWN - raimann2024 patient 2, FDA
  case 5, prepubertal at 10.9 years, with the dose stated nowhere in either document. So the three quantified
  velocities are 19.6, 19.1 and 10, and the only one below 19 is the only one that cannot be placed on a dose
  axis at all.

  AND TWO OF THE FIVE DID NOT GROW. Cases 1 and 2 presented with SLIPPED EPIPHYSES at 84 and 137 days, both
  obese, both requiring surgery, with no growth acceleration recorded. With brizini2024 that is THREE
  CHILDREN IN WHOM THE PHYSIS FAILED MECHANICALLY WITHOUT THE HEIGHT MOVING. Round 227 read that dissociation
  as favouring arrested remodelling over preserved reserve; the FDA series adds two more instances of it, and
  the obesity shared by both SCFE cases is the same confound brizini2024 carried.

  SO WHAT REPLACES THE BONE-AGE QUESTION AS THE LIVE ONE IS ROUND 227''s - preserved reserve or arrested
  remodelling - because unlike the bone age it CAN be answered from data that exists, and because five of
  five FDA cases plus brizini2024 now bear on it.'
quantitative:
- parameter: the five FDA postmarketing cases of erdafitinib skeletal growth toxicity
  value: 'case 1 - 13M astrocytoma, SCFE, onset 84 days, obese, surgery. Case 2 - 13M glioma, SCFE, onset 137
    days, obese, surgery. Case 3 - 15M astrocytoma, ACCELERATED GROWTH 14.3 cm over 9 months, onset 274 days,
    severe kyphoscoliosis, surgery. Case 4 - 13M glioma, ACCELERATED GROWTH 9.8 cm OVER 6 MONTHS, onset 183
    days, ON GROWTH HORMONE with testosterone management. Case 5 - 10F ependymoma, accelerated growth, onset
    120 days, confirmed on growth chart. MEDIAN ONSET 137 DAYS, RANGE 84 TO 274; all five discontinued, three
    required surgery. NO BONE AGE ASSESSED OR REPORTED IN ANY CASE'
  unit: cases, centimetres and days to onset
  conditions: nadeaunguyen2026, FDA Office of Surveillance and Epidemiology; all five from the literature,
    three also reported through FAERS
  species: human
  source_ref: nadeaunguyen2026
  uncertainty: 'A POSTMARKETING CASE SERIES HAS NO DENOMINATOR AND NO CONTROLS, and spontaneous reporting is
    biased toward the dramatic - two of the five required surgery, which is exactly what gets written up.
    Erdafitinib doses are NOT reported for any case in the FDA document; the doses used here come from the
    underlying case reports. The atlas has carried the headline counts since CORR-046 without reading the
    source; what is new is the case-level detail'
- parameter: the human erdafitinib dose-response, unspliced, is flat from 3 to 7 mg
  value: raimann2024 patient 1, FDA case 4 - erdafitinib 5 mg reduced to 3 mg, 9.8 cm over 6 months, which
    annualises to 19.6 cm/year, ON GROWTH HORMONE and hypogonadotropic. erdachild2024, FDA case 3 -
    erdafitinib 7 mg reduced to 5 mg with frequent interruptions, 14.3 cm over 9 months, annualising to 19.1
    cm/year, Tanner 2-3 with normal GH and IGF-1. Two children, doses differing roughly twofold, THE SAME
    ANNUALISED VELOCITY TO WITHIN THREE PER CENT. The third quantified child, FDA case 5, grew 10 cm/year at
    a dose stated nowhere
  unit: cm/year against mg/day
  conditions: computed in atlas/tools/round228_the_bone_age_closed.py from the two case reports and the FDA
    series
  species: human
  source_ref: nadeaunguyen2026
  uncertainty: 'TWO CHILDREN, AND THE COMPARISON IS CONFOUNDED IN A WAY THAT MATTERS FOR THIS STACK - case 4
    was on GROWTH HORMONE and case 3 was not, so it is GH-plus-low-dose against erdafitinib-alone-at-higher
    dose. Both doses were also reduced mid-course and case 3 had frequent interruptions, so neither child
    has a clean exposure. What the comparison cannot support is the round-217 premise that more erdafitinib
    buys more growth in this range'
  value_unverified: true
- parameter: the five negative retrieval routes
  value: 'trial registries - five paediatric FGFR trials, no bone-age endpoint registered in any. APEC1621B
    publication - only the ASCO abstract, no mention of the growth plate. NCTN Data Archive - public
    catalogue of 27 trials and 35,240 patients, EVERY ENTRY CARRYING A PMID FROM WHICH DATA ARE AVAILABLE,
    and APEC1621B NOT LISTED. The Cancer Imaging Archive - 155 collections through the NBIA API, no
    Pediatric MATCH and no APEC1621. FDA postmarketing evaluation - no bone age in any of five cases'
  unit: routes checked and outcome
  conditions: queried 2026-08-10 through the ClinicalTrials.gov v2 API, the DCTD catalogue spreadsheet and
    the TCIA NBIA API
  species: not_applicable
  source_ref: apec1621b_protocol
  uncertainty: 'ABSENCE FROM A PUBLIC CATALOGUE IS NOT ABSENCE FROM THE WORLD - the APEC1621B films exist in
    the COG operational database and could be released if the trial were published or if an investigator
    requested them directly. What is established is that NO PUBLIC ROUTE RETRIEVES THEM TODAY, which is
    different from and stronger than not having found them'
