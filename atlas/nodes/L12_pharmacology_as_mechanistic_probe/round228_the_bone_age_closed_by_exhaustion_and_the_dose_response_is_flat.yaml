confidence: A
claim_grades:
- claim: an on-treatment bone age under an FGFR inhibitor exists somewhere in the public record
  grade: X
  basis: 'FALSE, ESTABLISHED BY EXHAUSTION ACROSS FIVE ROUTES - no registered endpoint in five trials, no
    mention in the one publication of the one cohort that took films, not deposited in the NCTN Data
    Archive, not in the Cancer Imaging Archive, and no bone age in any of the FDA''s five postmarketing
    cases. This is closure, not failure to look'
- claim: the NCTN Data Archive request would retrieve the APEC1621B films
  grade: X
  basis: 'FALSE, AND IT WAS ROUND 226''s OWN RECOMMENDATION. The public catalogue lists 27 trials, every one
    carrying a PMID from which data are available; deposition follows full publication and APEC1621B has no
    full paper, so it is not listed and cannot be requested'
- claim: the human erdafitinib growth response rises with dose between 3 and 7 mg
  grade: X
  basis: 'FALSE ON THE ONLY TWO QUANTIFIED CHILDREN. 5-then-3 mg gave 19.6 cm/year and 7-then-5 mg gave 19.1
    cm/year. Confounded - the lower-dose child was on growth hormone - but no reading of it supports a rising
    dose-response, and rounds 216 to 218 assumed one'
- claim: growth acceleration is the usual manifestation of erdafitinib skeletal toxicity in children
  grade: D
  basis: THREE OF FIVE FDA CASES, WITH THE OTHER TWO PRESENTING AS SLIPPED EPIPHYSES WITHOUT GROWTH. With
    brizini2024 that is three children whose physis failed mechanically while the height did not move.
    Spontaneous reporting has no denominator and favours the dramatic
- claim: the atlas had read the five-case series it has been citing since CORR-046
  grade: X
  basis: FALSE. The headline counts - five cases, median onset 137 days, range 84 to 274, all discontinued,
    three surgeries - were carried correctly, but the case-level detail was never read, which is why case
    4's 9.8 cm over 6 months sat unrecorded while CORR-226 described that child's velocity as unquantified
