claim_grades:
  - claim: >-
      JAG1-Fc and DLL1-Fc, the clustered Notch agonist form, are catalogue reagents in
      the relevant species
    grade: B
    basis: >-
      multiple vendor listings with stated bioactivity assays and ED50 values, checked
      2026-08-14. Catalogue listings can change and were not independently verified by
      purchase
  - claim: >-
      Recombinant SCUBE3 is sold and is vendor-validated on chondrogenic cells, contrary
      to R287 and R312
    grade: B
    basis: >-
      vendor listing with purity, endotoxin and a chondrogenic-cell bioactivity assay.
      The correction to this file's own record is certain; the product specification is
      taken from the supplier
  - claim: >-
      No function-blocking anti-HHIP, neutralising anti-STC2, CHAD antagonist or NRK
      inhibitor is sold
    grade: B
    basis: >-
      an absence from a vendor sweep, which is weaker than a positive finding, but it
      agrees with the prior ChEMBL and Open Targets results for all four
  - claim: >-
      None of these products is usable as a treatment
    grade: A
    basis: research-grade reagents without impurity, endotoxin-release or toxicology packages
  - claim: >-
      "No molecule exists" must be split three ways, and the third query had never been
      run
    grade: A
    basis: >-
      a statement about this file's own method. CORR-347 split it two ways; the
      recombinant-protein catalogue is a third source that a secreted-protein atlas
      cannot afford to skip
