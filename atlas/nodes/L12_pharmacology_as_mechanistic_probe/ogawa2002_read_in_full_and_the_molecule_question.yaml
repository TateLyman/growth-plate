localization:
- 'the commitment boundary - where the receptor arm acts and where both 1-34 drugs act'
- 'the chondrocyte nucleus - where the PTHrP 67-139 arm acts and where no available drug reaches'
human_evidence: absent
human_evidence_note: 'Rat and mouse only in this node. The human anchors sit in the round-185 verdict:
  imaizumi2026 negative and confounded on the continuous arm, Jansen constitutive and short, huang2026
  PTHLH loss of function short. No human has received a PTH1R agonist at an anabolic dose with a growth
  endpoint at any schedule.'
species_basis:
- rat
- mouse
translation_risk: high
translation_risk_reason: 'Unchanged in kind from round 185 and slightly improved in degree. The adult
  cohort now provides a same-direction effect in a slow, late plate, which is the closer analogue to
  bone age 16, and the flat h_term at both ages is a consistent signature across two independent age
  groups. The schedule benchmark still stands and is untouched by anything in the full text.'
confidence: C
claim_grades:
- claim: The ogawa2002 growth-rate gain comes from terminal hypertrophic cell height.
  grade: X
  basis: 'ELIMINATED. h_term recovered by inverting the authors own CPR construction is 19.90 to 19.58
    micrometres in the young cohort and 21.20 to 21.50 in the adult - ratios of 0.984 and 1.014.
    Terminal cell height does not move at either age and the entire effect is cell production. This is
    the first agent in the programme with a clean flux-only signature.'
- claim: The effect disappears in older animals, and that is the most serious limitation.
  grade: X
  basis: 'ROUND 185 SAID THIS AND THE FULL TEXT REFUTES IT. Adult LGR rose 10.1 per cent against 13.5
    per cent in the young, with Cohen d = 1.11 and 41 per cent power at n=6; fourteen animals per group
    would have been needed. The authors sentence about young rats only is accurate for the
    unloading-prevention arm and for zone thickness and cell number, which the full text states
    explicitly, and not for LGR and CPR.'
- claim: intermittent PTH1R agonism raises AMPLIFICATION rather than pool-consumption rate.
  grade: E
  basis: 'EXACTLY AS UNKNOWN AS BEFORE, AND THIS IS STILL THE QUESTION. CPR is the product of the two
    and ogawa2002 measures no resting-zone kinetics. Round 183 is the precedent that makes this
    non-negotiable: GH raised CPR 3.87-fold and 97 per cent of that was faster pool consumption, with
    amplification actually falling to 0.77. A clean flux signature is necessary for the amplification
    claim and nowhere near sufficient.'
- claim: Abaloparatide is the better molecule for this purpose.
  grade: E
  basis: 'WEAKENED, NOT REFUTED, AND IT SHOULD HAVE BEEN FLAGGED IN ROUND 184. The only wild-type growth
    experiment used hPTH(1-34), which IS teriparatide. The abaloparatide preference rested on it being a
    PTHrP analogue and shorter-acting, which remains a coherent argument and is now in tension with the
    schedule benchmark being the binding constraint - but it points away from the sole supporting
    experiment and that was not said.'
- claim: Teriparatide and abaloparatide cannot work because they are only fragments of PTHrP.
  grade: X
  basis: 'THE OBJECTION IS HALF RIGHT AND DOES NOT DISQUALIFY. hashmi2026 shows the PTHrP 67-139 domain
    carrying the nuclear localization sequence and C-terminus independently maintains chondrocytes in an
    immature state, so a 1-34 drug is a partial mimic. But schipani1997 shows a constitutively active
    PTH1R with NO LIGAND rescues the growth plate of a complete PTHrP null, so the commitment-delay
    function this programme is targeting is carried by the receptor arm alone. The fragments are the
    right tool for the term, with a ceiling below full-length ligand.'
- claim: An existing product can deliver the ogawa2002 exposure on the ogawa2002 schedule.
  grade: X
  basis: 'NO, AND THE TWO CONSTRAINTS PULL APART. Daily abaloparatide is 6.9-fold short on cumulative
    dose and 20-fold too frequent; weekly teriparatide is 2.9-fold too frequent and 68-fold short. The
    regimen satisfying both is roughly 11.6 milligrams every three weeks for a 60 kg subject, which no
    product provides and nobody has given.'
