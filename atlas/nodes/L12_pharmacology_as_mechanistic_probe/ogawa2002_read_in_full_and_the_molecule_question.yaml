id: ogawa2002_read_in_full_and_the_molecule_question
name: ogawa2002 READ IN FULL - it reports the flux quantities, h_term is flat, the age gate was
  overstated, and the molecule that worked was TERIPARATIDE
aliases:
- ogawa2002 full text
- PTH does not act on terminal cell height
- the age gate was underpowered
- teriparatide not abaloparatide
- round 186
type: hypothesis
layer: L12
stub: false
summary: 'THE PAYWALLED PAPER IS NOW IN HAND AND IT IS A BETTER PAPER THAN ITS ABSTRACT. Rounds 184 and
  185 both judged it on the abstract, which reports "growth plate thickness, chondrocyte number, and LGR
  were increased" - two of which are the quantities CORR-189 says cannot be trusted. Round 185
  downgraded the candidate partly on that. THE FULL TEXT REPORTS THE FLUX QUANTITIES, AND THREE OF THIS
  ATLAS''S OWN CONCLUSIONS HAVE TO MOVE.

  ONE - IT REPORTS CELL PRODUCTION RATE, AND THAT MAKES TERMINAL CELL HEIGHT RECOVERABLE. Tables 1 and
  2 give longitudinal growth rate by DOUBLE TETRACYCLINE LABEL and cell production rate, computed by
  the authors as CPR = LGR divided by the height of the degenerative cell, citing Thorngren and Hansson
  1973. That is the Kember-Sissons construction. Inverting it gives terminal hypertrophic cell height
  directly: 19.90 micrometres in young controls against 19.58 under PTH, and 21.20 against 21.50 in
  adults. Both land inside the 19.5 to 29.8 micrometre range hunziker1994 measured by stereology in the
  same bone of the same species - an independent study by an independent method.

  TWO - THE ENTIRE EFFECT IS CELL PRODUCTION AND NONE OF IT IS TERMINAL CELL HEIGHT. The identity LGR =
  CPR x h_term closes exactly. YOUNG: LGR 1.135 = CPR 1.154 x h_term 0.984, so 90 per cent of the log
  effect is cell production and the h_term term is slightly NEGATIVE. ADULT: LGR 1.101 = CPR 1.086 x
  h_term 1.014, 85 per cent cell production. THIS IS THE OPPOSITE SIGNATURE TO GROWTH HORMONE, which
  took 1.36-fold of its effect out of terminal cell height. PTH is a pure flux agent at both ages.

  BUT IT DOES NOT FOLLOW THAT THIS IS AMPLIFICATION, AND THAT REMAINS THE OPEN QUESTION. CPR is
  amplification MULTIPLIED BY pool-consumption rate, and ogawa2002 measures no resting-zone kinetics.
  Round 183 is the standing warning: GH also raised CPR, by 3.87-fold, and 97 per cent of that was the
  pool being spent faster. What this round eliminates is the h_term explanation - one of three - which
  is real progress and is not the answer.

  THREE - THE AGE GATE WAS OVERSTATED AND ROUND 185 WAS WRONG ABOUT IT. That round called the age gate
  the most serious limitation, worse than the dose gap, "because no dose escalation fixes an age gate".
  Table 2 shows the adult point estimates moving the SAME WAY by a SIMILAR RELATIVE AMOUNT: LGR 74.2 to
  81.7, plus 10.1 per cent against plus 13.5 per cent in the young, with Cohen''s d of 1.11. At n = 6
  per group that study had 41 PER CENT POWER to detect its own effect, and would have needed 14 per
  group. THE ADULT ARM IS AN UNDERPOWERED POSITIVE, NOT A NULL. The authors'' sentence "observed only in
  young rats" is accurate about the unloading-prevention arm and about zone thickness and cell number -
  the full text says so explicitly - but not about LGR and CPR. AND THE ADULT COHORT IS THE MORE
  RELEVANT ONE: a 15-week rat plate growing at 74 micrometres a day, 36 per cent of the young rate, is
  a closer analogue to a human plate at bone age 16 than a 6-week one is.

  FOUR - AND THE AUTHORS MAKE THE CORR-189 POINT THEMSELVES, IN 2002. In the adult unloading arm, plate
  thickness and cell number did not move while LGR and CPR did, and they conclude that growth plate
  thickness and cell number "do not directly reflect the LGR" and that LGR and CPR "may be more
  sensitive indices". This atlas derived that rule in round 183 from hunziker1994 and logged it as
  CORR-189. It was already in print in the very paper the candidate rests on.

  NOW THE MOLECULE QUESTION, WHICH WAS ASKED AND IS WORTH ASKING.

  FIVE - THE EXPERIMENT USED TERIPARATIDE. The Methods and Acknowledgments state synthetic human
  PTH(1-34), supplied by Asahi Chemical Industries. hPTH(1-34) IS TERIPARATIDE. Round 184 recommended
  ABALOPARATIDE over teriparatide, on the argument that abaloparatide is a PTHrP(1-34) analogue and
  PTHrP rather than PTH is the plate''s endogenous ligand. THAT PREFERENCE POINTS AWAY FROM THE ONLY
  WILD-TYPE GROWTH DATA THAT EXISTS. The mechanistic argument is not thereby refuted, but it was made
  without noticing it contradicted the sole supporting experiment.

  SIX - THE COMPOSITION OBJECTION IS REAL AND IT DOES NOT DISQUALIFY. Native PTHrP is a polyhormone,
  not a 34-residue peptide: an N-terminal receptor-binding domain, a mid-region, a NUCLEAR LOCALIZATION
  SEQUENCE and a C-terminus. hashmi2026 deleted the whole 67-139 region carrying the NLS and
  C-terminus and the mice have REDUCED EPIPHYSEAL CARTILAGE HEIGHT with shorter resting, proliferative
  AND hypertrophic zones, raised Ihh and Col10a1, raised Adamts5 and Mmp13, reduced proliferation and
  matrix, and reduced IGF-1/IGF-1R - the authors conclude the domain is required to MAINTAIN
  CHONDROCYTES IN AN IMMATURE STATE and that its loss causes PREMATURE DIFFERENTIATION. That is the
  same functional direction as the receptor arm, running in parallel to it, and NO 1-34 DRUG TOUCHES
  IT. Teriparatide and abaloparatide are both partial mimics of their own endogenous ligand.

  BUT THE RECEPTOR ARM ALONE IS SUFFICIENT FOR THE FUNCTION WE ARE TARGETING, AND THIS IS THE DECISIVE
  OLD EXPERIMENT. schipani1997 targeted a CONSTITUTIVELY ACTIVE PTH1R to the growth plate with the
  collagen alpha1(II) promoter and it "corrected at birth the growth plate abnormalities of PTHrP-/-
  mice and allowed their prolonged survival", while in wild-type animals it delayed mineralisation,
  decelerated conversion of proliferative into hypertrophic cells, and prolonged the presence of
  hypertrophic chondrocytes. RECEPTOR SIGNALLING ALONE, WITH NO LIGAND AT ALL, RESCUES THE GROWTH PLATE
  OF A COMPLETE PTHrP NULL. So the commitment-delay function - which is the amplification term and the
  only thing this programme wants from the molecule - is carried by PTH1R and does not require the
  intracrine arm. A 1-34 fragment is the right tool for the term being targeted, with a ceiling below
  what full-length PTHrP could do.

  SEVEN - AND THE TWO CORRECTIONS THIS ATLAS HAS MADE NOW PULL AGAINST EACH OTHER. Round 185 says the
  licensed daily schedule is 20-fold too frequent against the human chondrocyte clock. Round 184 says
  the dose is short of the human equivalent. FIXING EITHER WORSENS THE OTHER. Daily abaloparatide is
  the closest on cumulative exposure - about 6.9-fold short - and the worst on schedule at 20 pulses
  per human chondrocyte cycle. Weekly teriparatide 56.5 micrograms is the best available on schedule at
  2.9 pulses per cycle and the worst on dose, about 68-fold short. NO EXISTING PRODUCT SATISFIES BOTH.
  What would is a single large pulse at a long interval, on the order of 11.6 milligrams every three
  weeks for a 60 kg subject, which is arithmetically just more of the same peptide at the interval the
  benchmark asks for, and which nobody has ever administered.

  WHAT THE PRIZE IS, STATED PLAINLY RATHER THAN BURIED. A 10 to 13 per cent rate increase applied to a
  human plate at bone age 16 growing 3 to 4 centimetres a year is plus 0.3 to 0.5 centimetres a year,
  or roughly HALF A CENTIMETRE TO ONE CENTIMETRE over the remaining growth such a subject plausibly
  has. Even taking the rat result at face value and assuming it transfers, this is a small
  intervention. The case for it is mechanistic interest and the absence of anything better, not the
  size of the prize.

  THE STATE OF THE CANDIDATE AFTER READING THE PAPER. Stronger than round 185 concluded and weaker
  than round 184 claimed. Cleared on two charges - the h_term explanation is eliminated by the
  authors'' own flux data, and the age gate is an underpowered positive rather than a null. Not cleared
  on the central one: whether the cell-production gain is amplification or pool consumption is exactly
  as unknown as it was, and it is the same question that turned GH from an apparent amplification agent
  into a pool-spending one. Plus a new problem: the schedule and dose constraints cannot both be met
  with anything that exists.'
