id: round302_the_named_experiment_has_a_compound_and_it_finished_first_in_human
name: >-
  ROUND 302 - the operator changed the grading rule: mechanical plausibility without a documented length
  endpoint is a GAP, not a disqualification. Re-triaged under that rule, and the winner is the experiment
  ROUND 281 ALREADY NAMED and never followed up. Tankyrase is IN the human growth plate - both paralogues,
  both donors, never checked before today. Tankyrase inhibition LOWERS beta-catenin in HUMAN chondrocytes
  and is chondro-ANABOLIC. And the class's fatal gut toxicity was engineered out: basroparib is
  tankyrase-selective, oral, and finished first-in-human with NO dose-limiting toxicities
aliases:
- round 302
- tankyrase is the lead
- basroparib STP1002
- the all-207 localisation sweep
- no length endpoint is a gap not a kill
- vitamin C may run the height-losing direction
type: hypothesis
layer: L12
stub: false
summary: >-
  ZERO - THE RULE CHANGED, AND IT CHANGED RETROACTIVELY. The operator's instruction: if a candidate works
  MECHANICALLY but has no documented bone-length endpoint, that is not a disqualification. This atlas has
  been treating "no length endpoint in any species" as near-fatal - it appears as the closing line against
  HHIP, LOXL2, TET1, sulfate donors, polyamines, tankyrase inhibitors, PRI-724 and aggrecan elevation. That
  is inconsistent with the file's own convention that A MISSING NUMBER IS A GAP AND A WRONG NUMBER IS A
  DEFECT. Under the corrected rule the disqualifiers are: the target is ABSENT FROM THE TISSUE, the
  DIRECTION is wrong, or the candidate is REDUNDANT with an arm already in the stack (CORR-297 Step 0). A
  missing caliper is a gap to be recorded and, where possible, filled.

  ONE - THE INFRASTRUCTURE, BECAUSE "CHECK EVERYTHING" MEANT A SWEEP AND NOT A LIST. Rounds 292, 300 and 301
  each typed a HAND-PICKED gene list into GSE9160, so each answer was bounded by what I thought to ask.
  This round ran ALL 207 genome-wide-significant human height genes plus 60 druggable-pathway genes the
  atlas had named but never localised - 251 symbols, one pass, free. Result: 185 PRESENT in both donors, 5
  donor-1 only, 30 donor-2 only, 26 not detected, 10 not on platform. Committed as
  atlas/data/round302/gse9160_all207_localisation.tsv. AFTER THIS, "IS IT IN THE TISSUE?" IS A LOOKUP AND
  NOT A ROUND.

  TWO - THE LEAD, AND IT IS ROUND 281'S OWN NAMED EXPERIMENT WITH A COMPOUND ATTACHED.
  Round 281 specified it exactly: "find an agent that lowers canonical Wnt TRANSCRIPTIONAL OUTPUT PARTIALLY
  AND SELECTIVELY in chondrocytes WITHOUT BLOCKING LIGAND SECRETION, and measure bone length and
  resting-zone cell number in a normal growing animal." It named two classes - tankyrase inhibitors and
  CBP/beta-catenin antagonists - graded the route E, and stopped there because neither had a length
  endpoint. Under the corrected rule that stopping point was wrong. FOUR THINGS ARE NOW ESTABLISHED THAT
  ROUND 281 DID NOT HAVE.
  · ✓ THE TARGET IS IN THE HUMAN GROWTH PLATE, AND NOBODY HAD EVER CHECKED. TNKS and TNKS2 are both detected
  in BOTH donors (TNKS peaking hypertrophic, TNKS2 prehypertrophic), alongside AXIN1, AXIN2 (4,322
  hypertrophic) and CTNNB1 (9,208 proliferative). Round 281 proposed a compound class without knowing
  whether its target was in the tissue. It is.
  · ✓ THE DIRECTION IS VERIFIED IN HUMAN CARTILAGE CELLS. hotta2024: XAV939 in human articular chondrocytes
  SUPPRESSED NUCLEAR TRANSLOCATION OF BETA-CATENIN - the mechanism round 281 asked for, shown in human
  cells. This is the direction check the atlas never had.
  · ✓ AND IT IS CHONDRO-ANABOLIC, NOT CHONDRO-DEGENERATIVE - WHICH IS WHERE LOXL2 FAILS. In the same
  experiment XAV939 ABROGATED the stress-induced fall in COL2A1, ACAN and SOX9 and suppressed ADAMTS-5,
  MMP-13 and IL-1beta. Compare round 301's surviving candidate: Loxl2 deletion TRIGGERS temporomandibular
  osteoarthritis. Same question, opposite answers. Tankyrase inhibition preserves the matrix programme.
  · ✓ THE CLASS'S FATAL OBJECTION HAS BEEN ENGINEERED OUT AND TESTED IN HUMANS. Every earlier tankyrase
  inhibitor was limited by on-target INTESTINAL toxicity - crypt loss - which is why round 281 could only
  point at E7449, a DUAL PARP/tankyrase agent and therefore mechanistically confounded. kim2022 built
  STP1002 to be tankyrase-SELECTIVE (TNKS1 IC50 29.94 nM, TNKS2 3.68 nM) and showed antitumour efficacy
  WITHOUT GI toxicity. lieu2025 then took it into humans: ORAL, once daily, 25 patients, seven dose levels
  30-360 mg, NO DOSE-LIMITING TOXICITIES, no fatal treatment-related events, commonest events fatigue and
  nausea of mild/moderate severity, MTD 360 mg. The authors' own framing is that tankyrase was "a desirable
  but difficult target because of safety concerns" and that this agent's profile was favourable.
  · ✓ STEP 0 PASSES CLEANLY. Canonical Wnt output is moved by NOTHING in this stack - not vosoritide
  (CNP/cGMP), not erdafitinib (FGFR3/ERK/CREB), not GH/IGF-1, not anastrozole. And round 281 already
  supplied the additivity argument for the GH arm specifically: the SPIN4 proband overgrew at +4.5 to +5 SDS
  with an IGF-1 of 179, LOWER than this subject's 198, so the axis does not need or compete for IGF-1.
  · ✓ IT IS THE SAME NODE AS THE ATLAS'S CLEANEST POOL LEVER. SPIN4's mechanism is reduced BASELINE canonical
  Wnt in chondrocytes (TOPFLASH down, Axin2 down); tankyrase inhibition stabilises AXIN and lowers the same
  output. Spin4-KO is longer at 2 weeks, 10 weeks AND 18 months with normal BMD, and moves N and lambda with
  A and h_term flat - a POOL expansion with a length endpoint, which is the rarest thing in this file.

  THREE - WHAT WOULD KILL IT, STATED IN ADVANCE SO THE NEXT ROUND CANNOT CALL IT NEW.
  ✗ NO TANKYRASE INHIBITOR HAS A BONE-LENGTH ENDPOINT IN ANY SPECIES. Under the corrected rule this is the
  GAP, and it is the whole gap - it is also cheap to fill.
  ✗ THE BAND HAS AN INTERIOR OPTIMUM AND OVERSHOOT RUNTS THE ANIMAL. chen2008's Col2a1-ICAT mice - strong
  chondrocyte-restricted Wnt reduction - are PROGRESSIVELY RUNTED. Mild reduction lengthens, strong
  reduction shortens, and no dose reproducing the SPIN4 amplitude has been defined in any species. An
  oncology MTD is emphatically not that dose.
  ✗ CORR-290 IS THE DISCRIMINATING TEST AND IT IS ALREADY WRITTEN. Same pathway plus same direction does NOT
  equal same lever - PORCN inhibitors also lower Wnt and produce the INVERSE zone decomposition (hypertrophic
  zone expanded, proliferative zone reduced, plate exhausted). THE EXPERIMENT MUST MATCH SPIN4'S DECOMPOSITION
  - resting zone UP with proliferative and hypertrophic zone heights UNCHANGED - or it is a different
  intervention wearing the same label.
  ✗ TANKYRASE IS NOT A WNT-ONLY ENZYME. It PARsylates telomeric TRF1 and regulates YAP through angiomotin -
  basroparib's own mechanism literature is partly about angiomotin stabilisation. Off-Wnt effects are
  unmapped in cartilage.
  ✗ AND THE AXIS'S OWN COSTS ARE KNOWN AND NOT SMALL. Spin4-KO males carry an INCREASED TUMOUR COUNT at 18
  months, and the one human hemizygote measured has cortical bone deficit - Bone Health Index -2.34 SD, TBLH
  BMD Z -3.29 height-adjusted. This is an oncology agent with a 21-days-on/7-off schedule, never given to an
  adolescent, for a non-cancer indication.

  FOUR - THE RE-RANK UNDER THE CORRECTED RULE, EVERYTHING ELSE.
  · ⬆ TET1 (+8.32 cm, P=2.2e-14) IS PROMOTED AND WAS BEING HELD DOWN BY EXACTLY THE RULE THAT CHANGED. It is
  PRESENT IN BOTH DONORS, peaking HYPERTROPHIC, and Open Targets scores it "High-Quality Ligand, Small
  Molecule Binder" - it is a dioxygenase, the most drugged enzyme fold there is. TET2 and TET3 are donor-2
  only, so TET1 is the TET of this tissue. Step 0 passes: no arm in this stack touches DNA demethylation.
  Its only disqualifier was "no Tet1 conditional has a bone-length endpoint", which is now a gap.
  · ⚠ AND TET1 GENERATES A CHEAP CONTRAINDICATION THAT NOBODY HAS LOOKED AT. CLAUDE.md already
  contraindicates ALPHA-KETOGLUTARATE because it is the TET co-substrate and feeding TET runs the
  height-LOSING direction. ASCORBATE IS THE OTHER TET COFACTOR, by the identical argument - it regenerates
  Fe(II) for the same dioxygenase family, and the 5hmC literature uses vitamin C precisely to RAISE TET
  output. Supra-physiological vitamin C is therefore predicted to run the same losing direction, and it is a
  ubiquitous supplement. GRADE E, MECHANISM ONLY, AND WITH A HARD CAVEAT: ascorbate is also required for
  collagen prolyl/lysyl hydroxylation and scurvy is a skeletal disease, so this is an argument about
  MEGADOSING and never about adequacy. Recorded because it costs nothing to check and the atlas already
  accepted the identical inference for AKG.
  · ⬆ AMD1 (+7.18 cm) is promoted on the same basis: PRESENT both donors, prehypertrophic peak, "High-Quality
  Pocket", and a clinical-stage inhibitor exists (SAM486A/sardomozide). The whole polyamine pathway is in the
  tissue and heavily regulated - OAZ1 at 55,413 and SAT1 at 12,731/15,704 are among the highest-expressed
  genes in the entire panel, which says this system is actively controlled here rather than incidental. ✗ The
  SIGN remains genuinely unresolved (CORR-325): DFMO treats an ODC1 GAIN-of-function disorder, and polyamines
  are reported to stimulate the differentiated chondrocyte phenotype.
  · ⬆ LOXL2/pan-LOX strengthens: LOXL4 is at 21,618 HYPERTROPHIC - higher than LOXL2 anywhere - and LOX,
  PLOD3 (10,274), P4HA1 (17,346) and P4HB (59,234) are all present. PXS-5505 is a PAN-LOX inhibitor, so the
  family co-expression is an argument FOR it. ✗ But hotta2024 versus the Loxl2-deletion osteoarthritis result
  is a direct head-to-head on cartilage safety, and tankyrase wins it.
  · ⬇ NPR3 IS DEMOTED FOR THIS STACK, BY THE ARGUMENT THAT KILLED SACUBITRIL. hakata2024 showed that raising
  ENDOGENOUS CNP is NOT ADDITIVE with a CNP analogue - they saturate the same step. NPR3 blockade raises
  endogenous CNP by the other clearance route. The same non-additivity should therefore be expected against
  vosoritide, and Step 0 demotes it for THIS subject. The human genetics are untouched and it remains a
  first-rate target for someone not already on a CNP analogue.
human_evidence: direct
human_evidence_note: >-
  Human throughout on the two load-bearing points. The localisation is human primary data - GSE9160, the only
  zone-resolved transcriptome of a human growth plate, all 251 symbols read against each array's
  preregistered detection threshold with zonal order from the clean donor only. The direction check is human
  primary data - hotta2024, human articular chondrocytes. The safety and tolerability are human - lieu2025,
  25 patients, dose escalation to 360 mg. The effect sizes are human, 1.45M exomes. What is NOT human: the
  pool-expansion phenotype the whole proposal is modelled on is MOUSE (Spin4-KO), the human SPIN4 evidence is
  two hemizygotes with predicted rather than attained adult height, and NO tankyrase inhibitor has been given
  to any species with a bone-length endpoint.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The chain has one unmeasured link and it is the important one - no tankyrase inhibitor has ever been given
  with a length endpoint, so the step from "lowers beta-catenin in human chondrocytes" to "lengthens a bone"
  is inference. The band's interior optimum makes DOSE the dominant risk rather than target validity: mild
  reduction lengthens, strong reduction runts (chen2008), and an oncology MTD is not a growth dose. hotta2024
  is ARTICULAR cartilage under mechanical stress, not growth plate, so the anabolic result transfers by
  analogy. Tankyrase has substantial Wnt-independent functions unmapped in cartilage. And the modelling
  phenotype, SPIN4, carries an increased tumour count in aged mice and a cortical-bone deficit in its one
  measured human.
confidence: B
confidence_reason: >-
  The localisation sweep is deterministic and reproducible and is graded high. The compound facts - selective,
  oral, phase I complete, no DLTs, GI toxicity engineered out - are straight from two primary papers and are
  graded high. The direction check in human chondrocytes is a single paper in the wrong cartilage and is
  graded lower. The central claim - that this lengthens a bone - is explicitly UNTESTED and is graded E, and
  the round's value is that it converts a vague route into one specified, cheap, decisive experiment.
claim_grades:
- claim: >-
    Tankyrase is expressed in the human growth plate.
  grade: B
  basis: >-
    TNKS and TNKS2 are both detected in BOTH donors of GSE9160 against each array's preregistered threshold -
    TNKS peaking hypertrophic, TNKS2 prehypertrophic - together with AXIN1, AXIN2 (4,322 hypertrophic) and
    CTNNB1 (9,208 proliferative), so the whole destruction-complex axis the drug acts on is present. NEVER
    CHECKED BEFORE THIS ROUND: round 281 nominated tankyrase inhibitors as its named experiment without
    knowing whether the target was in the tissue. Graded B not A because it is n=2 donors on one microarray
    platform, one of whom had a failed dissection.
  species: human
  source_ref: gse9160
- claim: >-
    A tankyrase-selective inhibitor exists that is oral, has completed first-in-human, and does not carry the
    class's intestinal toxicity.
  grade: A
  basis: >-
    Basroparib/STP1002. kim2022 established tankyrase-selectivity (TNKS1 IC50 29.94 nM, TNKS2 3.68 nM) with
    antitumour efficacy and NO on-target gastrointestinal toxicity - the crypt liability that had limited
    every previous agent in the class and the reason round 281 could only point at E7449, which is a DUAL
    PARP/tankyrase compound and therefore confounded. lieu2025 then reported the first-in-human dose
    escalation (NCT04505839): oral capsules once daily, 28-day cycles, 25 patients, seven dose levels from 30
    to 360 mg, NO dose-limiting toxicities, no fatal treatment-related adverse events, commonest events
    fatigue and nausea of mild/moderate severity, MTD and recommended phase II dose 360 mg.
  species: human
  source_ref: lieu2025
- claim: >-
    Tankyrase inhibition lowers canonical Wnt output in human cartilage cells and preserves the matrix
    programme.
  grade: C
  basis: >-
    hotta2024, human articular chondrocytes under cyclic tensile strain: XAV939 SUPPRESSED NUCLEAR
    TRANSLOCATION OF BETA-CATENIN - which is the mechanism round 281 specified, shown in human cells - and
    ABROGATED the stress-induced fall in COL2A1, ACAN and SOX9 while suppressing ADAMTS-5, MMP-13 and
    IL-1beta. So the agent is chondro-ANABOLIC, which is the direct contrast with round 301's surviving
    candidate, where Loxl2 deletion TRIGGERS temporomandibular osteoarthritis. Graded C: single study,
    ARTICULAR not growth-plate cartilage, in vitro, under a mechanical-stress paradigm rather than a growth
    paradigm.
  species: human
  source_ref: hotta2024
- claim: >-
    A tankyrase inhibitor lengthens bone.
  grade: E
  basis: >-
    UNTESTED IN ANY SPECIES, AND THIS IS THE ROUND'S WHOLE GAP RATHER THAN A REASON TO STOP. The inference
    chain is: tankyrase inhibition stabilises AXIN, lowering canonical Wnt transcriptional output DOWNSTREAM
    of ligand secretion; SPIN4 loss lowers the same output and gives a longer bone with a bigger resting pool
    at 2 weeks, 10 weeks and 18 months in mouse; therefore a partial tankyrase inhibitor should reproduce it.
    THE CHAIN HAS TWO WEAK LINKS, BOTH DOSE-SHAPED. chen2008's Col2a1-ICAT mice show that STRONG
    chondrocyte-restricted Wnt reduction runts the animal, so the band has an interior optimum and no dose
    reproducing the SPIN4 amplitude has been defined. And CORR-290 supplies the discriminating test: PORCN
    inhibitors also lower Wnt and give the INVERSE zone decomposition, so the experiment must reproduce
    SPIN4's - resting zone up, proliferative and hypertrophic heights unchanged - or it is a different lever.
  species: not_applicable
- claim: >-
    Supra-physiological vitamin C runs the height-losing direction through TET.
  grade: E
  basis: >-
    MECHANISM ONLY, RECORDED BECAUSE THE ATLAS ALREADY ACCEPTED THE IDENTICAL INFERENCE FOR ALPHA-KETOGLUTARATE
    AND BECAUSE CHECKING IT COSTS NOTHING. TET1 loss is +8.32 cm in 1.45M humans, so the height-favourable
    direction is TET INHIBITION; CLAUDE.md contraindicates AKG on exactly this basis, as the TET co-substrate.
    Ascorbate is the other cofactor of the same dioxygenase family, regenerating Fe(II), and the 5hmC
    literature uses vitamin C specifically to RAISE TET output. TET1 is present in both donors of the human
    growth plate, peaking hypertrophic. HARD CAVEAT, AND IT IS NOT OPTIONAL: ascorbate is required for
    collagen prolyl and lysyl hydroxylation and scurvy is a skeletal disease - this is an argument about
    MEGADOSING, never about adequacy, and no experiment has tested vitamin C dose against bone length.
  species: not_applicable
key_refs:
- ref_id: lieu2025
  year: 2025
  type: primary
  one_line_finding: >-
    The compound fact that converts round 281's route into a proposal - basroparib, tankyrase-SELECTIVE, oral,
    once daily, first-in-human complete with NO dose-limiting toxicities to 360 mg
- ref_id: kim2022
  year: 2022
  type: primary
  one_line_finding: >-
    Removes the objection that made round 281 stop - the class's on-target intestinal toxicity was engineered
    out by selectivity, and E7449, the only agent round 281 could name, is a confounded dual PARP/tankyrase
- ref_id: hotta2024
  year: 2024
  type: primary
  one_line_finding: >-
    The direction check the atlas never had, in HUMAN cells - XAV939 suppresses beta-catenin nuclear
    translocation while preserving COL2A1, ACAN and SOX9, so the agent is chondro-anabolic rather than
    chondro-degenerative, which is exactly where LOXL2 fails the same test
- ref_id: gse9160
  year: 2007
  type: dataset
  one_line_finding: >-
    Run exhaustively for the first time - all 207 height genes plus 60 never-localised druggable targets, 251
    symbols in one free pass - and it put TNKS, TNKS2, AXIN1, AXIN2 and CTNNB1 in the human growth plate,
    which nobody had checked in the rounds since tankyrase was first nominated
- ref_id: kosmicki2026
  year: 2026
  type: primary
  one_line_finding: >-
    Supplies the promotions under the corrected rule - TET1 +8.32 cm and AMD1 +7.18 cm, both present in human
    growth plate and both previously held down only by the absent-length-endpoint criterion
open_questions:
- g_l2_does_a_tankyrase_inhibitor_reproduce_the_spin4_zone_decomposition_and_lengthen_bone
- g_l5_does_lysyl_oxidase_inhibition_lengthen_bone_in_any_species
- g_l3_what_is_ap811_selectivity_over_npr2
contradicts: >-
  This round does not overturn a finding; it overturns a GRADING PRACTICE, at the operator's instruction, and
  the consequences are retroactive. "No bone-length endpoint in any species" has been used as a closing line
  against HHIP, LOXL2, TET1, polyamines, sulfate donors, tankyrase inhibitors, PRI-724 and aggrecan
  elevation. It is a GAP, not a refutation, and treating it as fatal was inconsistent with the file's own
  convention that a missing number is a gap while a wrong number is a defect. Round 281 in particular stopped
  at exactly this line after naming the right experiment, and three of the four things needed to act on it
  were already available or one query away. One demotion is also recorded: NPR3 falls for THIS stack - not in
  general - because hakata2024's non-additivity result applies to any agent that raises endogenous CNP
  against a CNP analogue already in the stack.
