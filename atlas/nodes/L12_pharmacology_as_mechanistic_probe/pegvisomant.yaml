  - parameter: labelled dose range in adults
    value: 10-30
    unit: mg/day
    conditions: after a 40 mg loading dose; titrated in 5 mg steps to age-adjusted normal IGF-1, never to GH concentration
    species: human
    source_ref: fda_somavert_label_2025
    uncertainty: label range
localization:
  - "human growth plate: no direct measurement; effect on the plate is inferred from arrest of linear overgrowth"
human_evidence: direct
human_evidence_note: >-
  Large adult acromegaly cohorts including the full ACROSTUDY dataset, plus case-level
  paediatric use carried to final height.
species_basis: [human]
translation_risk: low
translation_risk_reason: >-
  All pharmacology and outcome data are human. The paediatric growth claim rests on case
  reports rather than a cohort, which is a sample-size limit rather than a species one.
confidence: B
claim_grades:
  - claim: Pegvisomant blocks GH receptor signalling and lowers serum IGF-1 in a dose-dependent way.
    grade: A
    basis: Mechanism and IGF-1 titration are the basis of the approved label and of the full ACROSTUDY cohort.
  - claim: GH receptor blockade is sufficient to arrest pathological linear overgrowth in a child with open epiphyses.
    grade: D
    basis: Demonstrated to final height in a single X-linked acrogigantism patient; no paediatric cohort exists and the label states paediatric effectiveness is not established.
