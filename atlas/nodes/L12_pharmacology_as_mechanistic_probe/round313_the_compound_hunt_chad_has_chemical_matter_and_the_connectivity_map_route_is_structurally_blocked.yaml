claim_grades:
- claim: CHAD has no chemical matter.
  grade: X
  species: human
  source_ref: haglund2011
  basis: NO - this was round 312's claim and it came from a single Open Targets drug count. CHAD's cell-binding
    activity is mapped to the octamer LRRWLEAK318; a cyclic peptide mimetic CQLRGLRRWLEAKASRPDATC326 exists; a separate
    C-terminal 13-residue heparin-binding peptide exists and selectively binds heparan sulfate; the receptor is
    integrin alpha-2-beta-1; and the cyclic peptide has been dosed in mice with bone endpoints, counteracting bone
    loss after ovariectomy and reducing bone metastasis incidence. CORR-312 said the material lives under interface,
    motif and binding domain rather than 'inhibitor', and that is exactly where it was.
- claim: The existing CHAD peptides are usable for this case.
  grade: X
  species: human
  source_ref: kosmicki2026
  basis: 'NO, and this is the useful half. Human CHAD pLoF is +2.63 cm at P=4.0e-10 in 282 heterozygotes, so the
    height-adding direction is LOSS of CHAD function, and cyclicCHAD MIMICS chondroadherin rather than blocking
    it. Every published molecule on this target runs the wrong way. What the round delivers is a specification instead
    of an assertion: an antagonist of the CHAD-alpha2beta1 interaction or of the C-terminal heparan-sulfate interaction,
    read out against bone length in a normal growing animal. The motif is known to eight residues and the scaffold
    is published, so this is a far shorter path than the usual ''undruggable secreted protein''. Caveat: alpha-2-beta-1
    is the principal collagen receptor, so receptor blockade is not CHAD-selective.'
- claim: Connectivity-map signature reversal can find compounds for growth-plate biology.
  grade: X
  species: human
  source_ref: l1000cds2
  basis: NOT WITH THE EXISTING COMPENDIUM. A confound-filtered aged/low-output growth-plate signature from GSE114919
    matched only 32 of 199 genes (16.1%) across all returned signatures with a best score of 0.075, while a known-landmark
    control through the identical endpoint matched 17 of 20 at 0.450 - six-fold higher. HHIP, CHAD, SCUBE3, NRK,
    ACAN, COL2A1 and SOX9 never appear among matched genes; the ones that do are generic stromal and inflammatory
    genes. This is CORR-334 for a third time - GSE225878 could not see HHIP at 0.10 CPM in its screened cells, and
    L1000's cancer cell lines do not transcribe growth-plate genes either. The approach is sound in principle and
    was validated in cartilage by PMID 41223767; what fails is the reference library. The top-scoring hits were
    vorinostat and trichostatin A, an HDAC class round 298 already recorded as contraindicated, so the noise pointed
    at a known trap.
- claim: Canagliflozin lowers HHIP and is therefore a route to the atlas lead.
  grade: X
  species: mouse
  source_ref: zhao2025b
  basis: NO. The paper's chain is Hhip -> Sglt2 expression in renal proximal tubular cells, and canagliflozin acts
    downstream by inhibiting SGLT2; it offsets the consequences of excess Hhip and does not lower HHIP itself. SGLT2
    is not expressed in the growth plate, so there is no route from this to cartilage. The title made it look like
    an approved oral drug acting on the atlas's best-validated target in the wanted direction, and one abstract
    closed it.
- claim: Meclozine is an addition to this stack.
  grade: X
  species: mouse
  source_ref: sawamura2025
  basis: 'NO, on two grounds, and it was already in this atlas with 185 mentions and its own node. It acts on FGFR3
    signalling, the arm erdafitinib already occupies. And the 2025 four-arm experiment settles additivity directly
    rather than by inference: meclozine 2 mg/kg/day and GH 0.35 mg/kg/day each increased body and bone length in
    an achondroplasia model from day 7 to 56, but the combination gave NO ADDITIVE EFFECT on bone growth - only
    BMD was additive. That is CORR-297''s substitution trap with an experiment behind it.'
