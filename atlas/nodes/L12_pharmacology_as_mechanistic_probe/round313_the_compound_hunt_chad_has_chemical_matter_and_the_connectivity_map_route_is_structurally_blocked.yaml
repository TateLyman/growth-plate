contradicts: 'This round WITHDRAWS one part of round 312''s conclusion. ''CHAD has zero drugs, zero tool compounds,
  no perturbation in any species'' is FALSE - a mapped eight-residue motif, a published cyclic peptide mimetic,
  a second heparan-sulfate-binding peptide, a defined receptor and in vivo mouse dosing with bone endpoints all
  exist, and I had run only Open Targets. That is CORR-312 repeated one round after I re-derived it, and it is recorded
  as CORR-335. Round 312''s broader conclusion survives, because the existing CHAD molecules run in the wrong direction
  and the round replaces the assertion with a specification. It also establishes a NEW structural limit: connectivity-map
  signature reversal, the one approach that does not require a druggable fold, cannot reach this biology with the
  existing L1000 compendium, for the same reason GSE225878 could not - which is CORR-334 on a second independent
  platform.'
