localization:
- 'growth plate chondrocytes, proliferating and hypertrophic zones: aromatase, 17beta-HSD I and II, STS
  and 5alpha-reductase mRNA and, for three of them, measured enzyme activity (rat)'
- 'human growth plate, zone of maturation and hypertrophic zone: aromatase protein by immunohistochemistry,
  greatest in the hypertrophic zone (oz2001, n=2)'
- 'resting zone: the largest oestradiol producer in the rat costochondral preparation (sylvia2002)'
human_evidence: direct
human_evidence_note: 'Mixed by strand. The intracrine pathway itself is rat, with only aromatase protein
  localised in two human plates and no human STS measurement anywhere in cartilage. The CLOSURE argument,
  by contrast, is entirely human: a placebo-controlled adult-height trial (varimo2019), a randomised suppression-depth
  comparison (zegarra2024), a receptor-blockade trial (sims2012), and the absence of any stature phenotype
  in the human STS knockout (fryze2026).'
species_basis:
- human
- rat
translation_risk: moderate
translation_risk_reason: 'The control point is established in rat and only partially in human, so its
  existence in a human plate is an inference. That cuts both ways and does not rescue the lever: if the
  human plate has less intracrine capacity than the rat, the route matters less; if it has more, the zegarra2024
  result - deeper blockade, no extra height - already covers the outcome.'
confidence: B
claim_grades:
- claim: The growth plate synthesises sex steroids locally, including by the aromatase-independent sulfatase
    route.
  grade: C
  basis: Rat, one comprehensive study with two methods - in situ hybridisation for five enzymes plus direct
    activity assays for three, including STS, with developmental regulation peaking at sexual maturation
    (vandereerden2002) - supported by independent measurement of oestradiol RELEASE from rat chondrocytes
    (sylvia2002) and by aromatase protein in two human plates (oz2001). C not B because no human physeal
    STS measurement exists and local output has never been quantified against systemic delivery in any
    species.
- claim: Because the plate has an aromatase-independent oestrogen route, anastrozole is not at its ceiling
    and blocking steroid sulfatase would add height.
  grade: X
  basis: NO, ON THREE INDEPENDENT LINES. (1) Lifelong complete STS loss in humans is X-linked ichthyosis,
    reviewed across 1960-2025 with endocrine and cardiac involvement catalogued and NO stature, bone-age
    or epiphyseal finding reported (fryze2026). (2) zegarra2024 randomised deeper versus shallower oestrogen
    suppression and a threefold difference in intensity produced NO difference in predicted adult height
    - so a second parallel blockade has no headroom. (3) The dose-limiting toxicity of the available drug
    is the pharmacological reproduction of the phenotype whose carriers show no benefit (palmieri2017).
- claim: Aromatase inhibitor monotherapy increases attained adult height.
  grade: X
  basis: 'NOT DEMONSTRATED, AND THE ONLY PLACEBO-CONTROLLED TEST IS NULL. varimo2019 - randomised, double-blind,
    placebo-controlled, followed to ADULT height: 164.8 vs 163.7 cm, p=0.49, and neither arm beat its
    own baseline prediction. zegarra2024 - the year-1 predicted-height gain did not persist to years 2-3,
    total +1.3 cm. Graded X for the general claim while noting the boundary below: both trials are early-puberty,
    and cui2025 is positive in late bone age with GH.'
- claim: Slowing bone-age advancement through the oestrogen axis converts into adult height WHEN A VELOCITY
    AGENT IS ON BOARD THAT PRESERVES THE PUBERTAL SPURT.
  grade: B
  basis: 'YES - AND THIS REVERSES WHAT THIS NODE ORIGINALLY CLAIMED (CORR-182). The three nulls cited
    below are all MONOTHERAPY, where the oestrogen agent suppresses velocity as it slows the clock, and
    two of the three are PREDICTED-height nulls, an endpoint nearfinal2026 shows can rank agents backwards
    against attained height. With growth hormone supplying the velocity term the surrogate converts: mauras2008,
    placebo-controlled, LINEAR GROWTH COMPARABLE between arms while bone-age advance slowed (+2.5 vs +4.1
    y at 3 y, P<0.0001), giving predicted adult height +6.7 vs +1.0 cm; mauras2016, randomised three-arm
    at near-final height, absolute change AI +18.2, GH +20.6, COMBINATION +22.5 cm (P=0.01) against +13.0
    expected; tanriverdi2023, true adult height +3.3 cm (P=0.044) in those exposed at least two years.
    See duration_velocity_combination, which the atlas already held at grade B when this node was written.'
- claim: The oestrogen axis is at its ceiling for a subject at bone age 16 specifically.
  grade: E
  basis: 'INFERENCE, AND NOW A NARROWER ONE (CORR-182). The monotherapy nulls do not establish a ceiling
    for the COMBINATION, which works - see the corrected claim above. What bounds the prize instead is
    measured: nearfinal2026, 72 males with ADVANCED bone age followed to near-final height, overall median
    gain only +1.2 cm (IQR -1.9 to +4.2), with EARLIER PUBERTAL STAGE at start (P=0.012), longer treatment
    (P=0.005) and concurrent growth hormone (P=0.022) each independently predicting more gain. Starting
    late is a measured penalty, not a hypothesised one. And no dataset reaches bone age 16 - mauras2016
    ended at 15.3 - so the band this case occupies is extrapolated from a gradient that runs against it.
    cui2025 remains the one positive attained-height dataset at bone age 13 and above, and it is the regimen
    already running.'
