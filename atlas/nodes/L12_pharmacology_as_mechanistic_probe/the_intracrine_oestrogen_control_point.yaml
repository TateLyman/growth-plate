id: the_intracrine_oestrogen_control_point
name: THE INTRACRINE OESTROGEN CONTROL POINT - the plate makes its own oestrogen by a route anastrozole
  cannot reach, a human drug exists for it, and it still closes - because suppression depth is not the
  rate-limiting variable
aliases:
- steroid sulfatase growth plate
- STS
- irosustat
- estrone sulfate bypass
- intracrine oestrogen
- local oestrogen synthesis plate
- is anastrozole at its ceiling
- what is left on oestrogen and closure
- round 170
type: hypothesis
layer: L12
stub: false
summary: 'THE QUESTION WAS WHAT IS LEFT ON THE WHOLE OESTROGEN/CLOSURE AREA AFTER THE RECEPTOR ARM CLOSED.
  ONE UNTOUCHED CONTROL POINT WAS FOUND, IT HAS A HUMAN DRUG, AND IT CLOSES ON EVIDENCE THE ATLAS ALREADY
  HELD. The closure is more valuable than the lever would have been, because the reason it closes applies
  to the entire axis.

  THE CONTROL POINT. Anastrozole blocks AROMATASE - the androgen to oestrogen route. It does not block
  the SULFATASE route, in which steroid sulfatase (STS) liberates oestrone from circulating oestrone sulfate
  and 17beta-HSD type I converts it to oestradiol. Oestrone sulfate is the largest and longest-lived circulating
  oestrogen pool, and STS bypass is the established mechanism of aromatase-inhibitor resistance in breast
  cancer - the reason dual aromatase-sulfatase inhibitors were built at all.

  AND THE GROWTH PLATE RUNS THE WHOLE PATHWAY. vandereerden2002 surveyed the rat tibial physis and found
  mRNA for aromatase P450, 17beta-HSD types I and II, STEROID SULFATASE and 5alpha-reductase in proliferating
  and hypertrophic chondrocytes, with aromatase, 17beta-HSD and STS STRONGLY UP-REGULATED AROUND SEXUAL
  MATURATION at 7 weeks - the exact moment the axis matters - and confirmed aromatase, type I 17beta-HSD
  and STS by direct ENZYME ACTIVITY in isolated chondrocytes. Their conclusion is that intracrinology
  in the plate may be a major source of local sex steroid delivery. sylvia2002 shows chondrocytes actually
  RELEASE oestradiol, most in the RESTING ZONE. oz2001 localises aromatase protein in the HUMAN plate
  to the maturation and hypertrophic zones. THE ATLAS HELD NONE OF THIS AS A CONTROL POINT: before round
  170 the terms steroid sulfatase, oestrone sulfate and intracrine appeared in ZERO growth-plate nodes.

  THE DRUG EXISTS AND SO DOES THE TRIAL DESIGN. Irosustat (STX64 / BN83495), an orally active irreversible
  STS inhibitor, 40 mg daily. palmieri2017 is the IRIS study - irosustat ADDED TO a first-line aromatase
  inhibitor in women who had progressed on it. It met its pre-defined success criterion (clinical benefit
  rate 18.5%). So the compound, the dose, and the add-on-to-an-AI design all exist in humans.

  IT CLOSES ANYWAY, ON THREE INDEPENDENT LINES.

  ONE - THE HUMAN KNOCKOUT HAS NO SKELETAL PHENOTYPE. Genetic STS deficiency is X-linked ichthyosis, a
  well-described multisystem disorder. fryze2026 reviews it across 1960-2025 and catalogues cutaneous,
  neurodevelopmental, ENDOCRINE and cardiac involvement - and lists no stature, no bone-age and no epiphyseal
  finding. A lifelong complete loss of the enzyme, in males, and nobody has reported a growth phenotype.
  That is the cheapest available test of whether this control point moves the skeleton, and it returns
  nothing.

  TWO - THE TOXICITY IS THE PHENOTYPE. The dose-limiting grade 3/4 toxicity of irosustat in IRIS was DRY
  SKIN at 28%. The drug reproduces the ichthyosis pharmacologically. That is not a reason to stop on its
  own - but it means the achievable window is bounded by inducing the very condition whose carriers show
  no height benefit.

  THREE, AND THIS IS THE ONE THAT SETTLES IT - DEEPER OESTROGEN SUPPRESSION DOES NOT BUY HEIGHT, AND THE
  ATLAS ALREADY PROVED IT. zegarra2024 randomised 79 pubertal boys to letrozole versus anastrozole for
  3 years. Letrozole produced markedly deeper suppression - higher testosterone, lower oestradiol, SLOWER
  BONE AGE ADVANCE - and there was NO DIFFERENCE IN PREDICTED ADULT HEIGHT. The combined gain was +1.3
  cm, and the year-1 gain DID NOT PERSIST at years 2 and 3. A threefold difference in the intensity of
  oestrogen blockade bought nothing. Adding a SECOND, PARALLEL blockade of oestrogen supply has no headroom
  to work in.

  THE PATTERN THAT UNIFIES THE WHOLE AXIS - THREE HUMAN TESTS, THREE CONTROL POINTS, ONE RESULT. LIGAND
  SYNTHESIS: varimo2019, the only randomised DOUBLE-BLIND PLACEBO-CONTROLLED aromatase-inhibitor trial
  followed to ADULT HEIGHT - letrozole 164.8 +/- 4.0 cm versus placebo 163.7 +/- 3.7 cm, p=0.49, and neither
  group beat its own baseline prediction. LIGAND DEPTH: zegarra2024 - triple the suppression, same predicted
  height, transient gain that evaporates. RECEPTOR: sims2012 - bone age advancement HALVED (1.99 to 1.06,
  p=0.0007) and predicted adult height UNCHANGED, because growth velocity fell with the clock. SLOWING
  THE BONE-AGE CLOCK THROUGH THE OESTROGEN AXIS DOES NOT CONVERT INTO ADULT HEIGHT. The axis is at its
  ceiling not because a better blocker is missing but because BLOCKADE DEPTH IS NOT THE RATE-LIMITING
  VARIABLE. That is why the receptor sweep found nothing, and it is why the sulfatase route would have
  found nothing either.

  THE HONEST BOUNDARY, AND IT HAPPENS TO DESCRIBE THIS CASE. Every one of those three null trials is in
  a YOUNG subject with years of growth ahead - varimo2019 stopped at bone age 10.2-10.8, zegarra2024 required
  bone age under 14, sims2012 had a mean age of 5.9 years. None of them tests bone age 16. And the atlas
  holds one dataset pointing the other way in exactly the late band: cui2025, where anastrozole plus rhGH
  gave the HIGHEST target-height-adjusted adult height SDS (0.81 +/- 0.34) of three matched regimens in
  ISS boys with BONE AGE 13 OR ABOVE. So the ceiling claim is bounded: the oestrogen axis is demonstrably
  at its ceiling in early puberty, and in late bone age with GH on board the only positive attained-height
  evidence is the regimen this stack is already running.

  VERDICT: ADD NOTHING. Irosustat is not worth adding, and the reason is not its toxicity - it is that
  the arm it would strengthen has been shown not to respond to being strengthened.'
