contradicts:
- 'DOES NOT CONTRADICT the_receptor_level_oestrogen_sweep - it explains it. The receptor sweep found the
  class fails because its drugs are AF-2 agents aimed at a ligand-independent function. This node finds
  that even the ligand arm, blocked deeper, buys nothing. Both are instances of one fact: depth of oestrogen
  blockade is not what limits adult height.'
- QUALIFIES aromatase_inhibitor_anastrozole. That node already recorded the zegarra2024 dissociation and
  drew the right inference. What is added here is varimo2019 - the placebo-controlled adult-height null
  the atlas did not hold - and the explicit boundary that every null is in early puberty while the only
  positive attained-height dataset (cui2025) is in late bone age with GH.
