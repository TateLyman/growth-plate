termination_note: Recifercept NCT04638153/NCT05116046 stopped for "lack of efficacy at any of the tested
  doses"; posted observed/expected height ratio 1.0 (95% CI 0.8-1.1) in all three arms. This IS negative
  evidence about soluble FGFR3 decoys.
