localization:
- 'human growth plate: intended target; no measured penetration of a ~100 kDa decoy into avascular cartilage'
- 'mouse cranial base synchondrosis: recifercept prevented premature ossification in Fgfr3-ach/+ mice'
human_evidence: direct
human_evidence_note: Two terminated interventional trials in children with achondroplasia with posted
  results and an explicit registry statement of lack of efficacy at all tested doses.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: The mouse data were positive - recifercept prevented premature synchondrosis
  closure in Fgfr3-ach/+ mice - and the human trials were null at every dose. This is a documented mouse-to-human
  translation failure, and the reason for it was not established because target-tissue exposure was never
  measured in either species.
confidence: A
claim_grades:
- claim: Recifercept did not increase growth at any tested dose in children with achondroplasia.
  grade: A
  basis: Posted phase 2 results, observed/expected height ratio 1.0 (95% CI 0.8-1.1) at month 12 in all
    arms, and an explicit registry termination statement.
- claim: The failure shows FGFR3-G380R signalling in the human growth plate is ligand-independent.
  grade: E
  basis: One of two competing explanations; not distinguishable from a delivery failure without tissue
    exposure data.
- claim: Soluble FGFR3 decoys engage FGF ligands in growth plate cartilage in vivo.
  grade: C
  basis: Supported only by mouse synchondrosis histology, not by any human or large-animal tissue measurement.
