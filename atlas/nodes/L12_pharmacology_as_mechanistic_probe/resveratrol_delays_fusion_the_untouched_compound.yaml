contradicts:
- 'EXTENDS the closure-timing arm rather than contradicting anything. Aromatase inhibition lowers the
  oestrogen signal driving the fusion clock; this proposes suppression of growth-plate VEGF and laminin,
  blocking the vascular invasion fusion requires. Different control points, so stackable in principle -
  which is the atlas design rule, not a result.'
- 'CLOSES the GPER1 question that kang2020 did not cover. The earlier elimination of receptor subtype was
  ERalpha versus ERbeta; GPER1 is a third receptor and was untouched until now. It is now closed on a
  direct length endpoint under agonist.'
