id: resveratrol_delays_fusion_the_untouched_compound
name: RESVERATROL - the compound this atlas never touched, on the highest-ranked arm, with a final-length
  endpoint from the laboratory that killed tamoxifen
aliases:
- resveratrol growth plate
- delays growth plate fusion
- untouched compound duration arm
- GPER1 is closed
- trans-resveratrol bone growth
type: intervention
layer: L12
stub: false
summary: 'THE INSTRUCTION WAS TO FIND A COMPOUND ON AN AXIS WE HAVE NOT TOUCHED. THIS IS ONE, AND IT IS ON
  THE HIGHEST-RANKED ARM. RESVERATROL APPEARS IN ZERO NODES AND ZERO BIBLIOGRAPHY ENTRIES ACROSS 690 NODES.
  It was never searched.
  WHAT karimian2013 FOUND, AND WHO FOUND IT. Pre-pubertal ovary-intact rabbits on oral trans-resveratrol
  200 mg/kg/day until fusion: INCREASED TIBIAL AND VERTEBRAL GROWTH AND IMPROVED FINAL LENGTH over sixteen
  weeks. In pubertal OVARIECTOMISED rabbits it DELAYED FUSION AT THREE SEPARATE PHYSES - distal tibia,
  distal femur, proximal tibia - with increased femur length and vertebral growth. THE ENDPOINTS ARE
  FINAL LENGTH AND FUSION TIMING, which is exactly what the duration arm needs and exactly what almost
  nothing in this atlas has. AND THE PROVENANCE IS THE STRONGEST POSSIBLE: Karimian, Chagin, Ohlsson and
  Savendahl - the same laboratory whose chagin2007 and karimian2008 killed tamoxifen for this project.
  The negative control and this positive come from the same hands.
  THE MECHANISM IS VASCULAR AND IT IS COHERENT. Histomorphometry showed SUPPRESSED CHONDROCYTE EXPRESSION
  OF VEGF AND LAMININ, and the authors propose impaired growth plate vascularisation. That is mechanistically
  the right shape: epiphyseal fusion REQUIRES vascular invasion of the plate, so an agent that suppresses
  VEGF should delay fusion by preventing the invasion rather than by altering the hormonal clock. It is a
  different control point from aromatase inhibition, which lowers the oestrogen signal that drives the
  clock. IF BOTH ARE REAL THEY ARE STACKABLE ACROSS CONTROL POINTS, WHICH IS THE ATLAS DESIGN RULE.
  NOW EVERY REASON TO DOUBT IT, AND THERE ARE FIVE.
  ONE - SD-006 APPLIES TO HALF THE HISTOLOGY AND MUST BE APPLIED. The paper reports a wider plate, an
  ENLARGED RESTING ZONE and an INCREASED HYPERTROPHIC ZONE HEIGHT. This atlas has a standing decision that
  zone thickness is not evidence of growth - a zone thickens when clearance slows. Those figures are
  mechanism, not endpoint. WHAT SURVIVES SD-006 IS THE FINAL LENGTH AND THE FUSION TIMING, which are
  independent measurements and are the reason this node exists.
  TWO - THE DOSE OBJECTION IS WITHDRAWN, AND MY REASONING FOR IT WAS WRONG (CORR-177). Round 166 scaled
  200 mg/kg rabbit by body surface area to about 4.5 g/day human and called that unreachable. THE RIGHT
  COMPARISON IS CONCENTRATION. The full text states human peak plasma concentrations of 0.3 to 2.4 microM
  across doses from 0.3 mg to 5 g; the ex vivo ACTIVE concentration is 0.3 microM, at the bottom of that
  range, and the INHIBITORY concentrations of 10 and 50 microM are FOUR TO TWENTY TIMES ABOVE the top of
  it. The human window sits in the stimulatory band and CANNOT REACH the inhibitory band, which also
  defuses the biphasic objection. THE REAL PHARMACOKINETIC CAVEAT IS DIFFERENT: brown2010 shows conjugate
  AUC exceeds parent by up to 20.3-fold, so total Cmax badly overstates FREE resveratrol and what reaches
  a chondrocyte is unknown.
  THREE - AND THE THING IT DOES NOT DO IS THE THING THAT KILLED TAMOXIFEN. Apoptosis on resveratrol was
  0.2 per cent, identical to control, while E2 raised it to 1.1 per cent. The resting zone MORE THAN
  DOUBLED, 0.26 against 0.11 mm2. chagin2007 killed tamoxifen for this project because it induced
  apoptosis in RESTING-ZONE chondrocytes and spent the pool irreversibly. In the same laboratory,
  resveratrol does the opposite on that exact liability. SD-006 still forbids reading the enlarged zone as
  a larger pool - but not killing chondrocytes is a real and different finding.
  FOUR - THE CHEMOTYPE IS A KNOWN FREQUENT HITTER. Resveratrol is a canonical pan-assay interference
  compound with an enormous and poorly reproducible literature. A single positive, however well conducted,
  carries less prior weight in this chemotype than it would in another.
  FIVE - THE OVX MODEL IS OESTROGEN-DEFICIENT, so the fusion-delay arm is a delay on top of an already
  disrupted clock. The ovary-intact arm did show increased growth and final length, which is the more
  relevant condition, but the fusion-delay result specifically is in the OVX animals.
  AND THE HUMAN DATA EXIST, WITH A CNP INTERACTION WHOSE DIRECTION IS GENUINELY AMBIGUOUS. prickett2023 is
  a 125-subject randomised crossover in postmenopausal women: plasma NTproCNP DECLINED after resveratrol
  (p = 0.011), alkaline phosphatase rose (p = 0.008), and NTproCNP was inversely associated with lumbar
  spine BMD after resveratrol only. THE OBVIOUS READING - resveratrol suppresses CNP and therefore
  antagonises the arm this atlas spent fifteen rounds on - IS NOT SAFE. prickett2021, same author,
  established that NTproCNP FALLS WHEN CNP PATHWAY OUTPUT RISES, because raising pathway activity
  suppresses production by feedback. A fall in the production marker is consistent with less ligand OR
  more signalling, and this study has no receptor-side readout to discriminate. THE INTERACTION IS REAL
  AND UNRESOLVED, and it must be resolved before resveratrol and a CNP agent are ever put in the same
  stack.
  NOW THE STACK, WHICH IS ERDAFITINIB PLUS VOSORITIDE PLUS GH PLUS ANASTROZOLE, AND RESVERATROL COLLIDES
  WITH TWO OF THE FOUR.
  GROWTH HORMONE IS ANTAGONISED, IN HUMANS, AND THIS IS THE CLEANEST CONFLICT. karimian2013 found serum
  IGF-I unchanged in rabbit. brown2010 gave 40 healthy humans 0.5 to 5 g daily for 29 days and found
  CIRCULATING IGF-I AND IGFBP-3 DECREASED IN ALL VOLUNTEERS, p less than 0.04 for both, most marked at
  2.5 g. GH acts on the plate substantially through IGF-I and SD-002 records it as the largest single
  contributor in the only combination trial with a height endpoint. HUMAN DATA BEAT RABBIT DATA FOR A
  HUMAN DECISION. The magnitude is not in the abstract, and that magnitude decides whether this is a
  nuisance or disqualifying.
  ERDAFITINIB HAS A PHARMACOKINETIC PROBLEM THAT IS MORE DANGEROUS THAN THE PHARMACODYNAMIC ONE.
  Erdafitinib is cleared 39 per cent by CYP2C9 and 20 per cent by CYP3A4 - FIFTY-NINE PER CENT THROUGH TWO
  ENZYMES RESVERATROL INHIBITS. The atlas already holds that drug paediatric record: five of five cases
  permanently discontinued, three requiring surgery. Raising its exposure is not a theoretical concern.
  SEPARATELY AND SMALLER, resveratrol SIGNIFICANTLY REDUCED BrdU incorporation in the plate while
  erdafitinib works by relieving the FGFR3 brake ON PROLIFERATION - opposite directions on one parameter,
  though the paper argues under 10 per cent of growth comes from proliferation against 60 per cent from
  hypertrophy, which resveratrol raises.
  ANASTROZOLE LOOKS CLEAN AND THE TEST IS WEAKER THAN IT LOOKS. Uterus weight was unaffected by
  resveratrol at every timepoint with or without gonads - 0.5 against 0.6 g, versus 18 g on E2 - which
  tests estrogenicity and aromatase inhibition at once. BUT nilsson2003_raloxifene, same model same
  laboratory, found RALOXIFENE PASSES THAT SAME TEST while acting as a FULL OESTROGEN AGONIST AT THE
  PLATE, hastening fusion. Uterus weight is therefore not a sufficient proxy. What actually saves the
  combination is the direction of the plate outcome itself: resveratrol DELAYS fusion where an agonist
  HASTENS it. The residual risk is REDUNDANCY not harm - the authors cannot exclude ERalpha antagonism,
  and if that is the mechanism then resveratrol and anastrozole are the same control point.
  VOSORITIDE CARRIES THE UNRESOLVED CNP DIRECTION, PLUS A NEW OVERLAP QUESTION: resveratrol raises
  hypertrophic cell number and terminal cell size, which is the term the CNP axis serves. Different
  mechanisms, possibly the same term, never combined in any species.
  AND EVERY ANIMAL IN THE STUDY IS FEMALE - ovary-intact and ovariectomised females, oestradiol as the
  positive control. The same laboratory ran its tamoxifen work in MALE rats, so this was a choice. The
  subject here is male and no resveratrol growth-plate data in a male animal exists anywhere this atlas
  has looked.
  SEPARATELY, GPER1 IS CLOSED AND IT CLOSED FAST. The atlas had eliminated receptor SUBTYPE on kang2020,
  but that was ERalpha versus ERbeta - GPER1 is a third, membrane oestrogen receptor and was never
  covered. iravani2019 tested the selective agonist G1 directly on the endpoint that matters: NO EFFECT on
  mouse metatarsal growth at any concentration ex vivo, and NO EFFECT on tibia or femur growth in
  ovariectomised mice in vivo, in the same experiment where oestradiol suppressed growth as expected.
  THAT IS A CLEAN NEGATIVE ON THE THERAPEUTIC QUESTION. chou2021 and chou2025 report the opposite
  knockout direction and a proliferation phenotype, and the two groups DIRECTLY CONTRADICT on whether
  ablating GPER1 lengthens or shortens bone - but chou2025 measures zone thicknesses and PTHrP/Ihh rather
  than length, and even at face value its profile is a TRADE, raising proliferation while SUPPRESSING
  hypertrophy. Length was measured once, by iravani2019, and it did not move.'
quantitative:
- parameter: 'RESVERATROL DELAYS FUSION AT THREE PHYSES AND IMPROVES FINAL LENGTH IN RABBIT'
  value: 'Ovary-intact pre-pubertal New Zealand white rabbits, oral trans-resveratrol 200 mg/kg/day for 16
    weeks until fusion: INCREASED tibial and vertebral bone growth and IMPROVED FINAL LENGTH. Pubertal
    OVARIECTOMISED rabbits, 7 or 10 weeks: DELAYED FUSION of the DISTAL TIBIA, DISTAL FEMUR and PROXIMAL
    TIBIA epiphyses, with increased femur length and vertebral growth. Histomorphometry of the OVX distal
    femur: wider plate, enlarged resting zone, increased number and size of hypertrophic chondrocytes,
    increased hypertrophic zone height, and SUPPRESSED VEGF AND LAMININ expression. Cultured fetal rat
    metatarsals: growth STIMULATED at 0.3 microM, INHIBITED at 10 and 50 microM'
  unit: mg/kg/day; micromolar; qualitative length and fusion outcomes
  conditions: karimian2013, abstract read 2026-08-09 (PMC3695926, open access). Longitudinal X-ray plus
    endpoint digital caliper for length; histomorphometry at endpoint.
  species: rabbit
  source_ref: karimian2013
  uncertainty: 'SD-006 APPLIES AND IS APPLIED: the enlarged resting zone and increased hypertrophic zone
    height are NOT evidence of more growth and are recorded as mechanism only - a zone thickens when
    clearance slows. The final-length and fusion-timing endpoints are independent of that and are what
    the node rests on. THE DOSE IS THE BIGGEST PROBLEM: 200 mg/kg/day in rabbit scales by body surface
    area to roughly 65 mg/kg/day in human, about 4.5 g/day at 70 kg, which is far above supplement doses
    and at the level where human trials report gastrointestinal toxicity. THE BIPHASIC IN VITRO RESULT
    means exposure errors reverse the sign. NO n IS RECORDED HERE - the abstract does not give group sizes
    and the full text has not been read. The fusion-delay result is specifically in OVARIECTOMISED
    animals, an oestrogen-deficient model; the ovary-intact arm showed growth and final length but the
    abstract does not state whether fusion timing was altered there.'
- parameter: 'THE HUMAN RESVERATROL-CNP INTERACTION, AND WHY ITS DIRECTION IS UNRESOLVED'
  value: 'prickett2023, RESHAW randomised crossover, 125 postmenopausal women with mild osteopenia,
    resveratrol versus placebo over 2 years. Within-individual crossover: plasma NTproCNP DECLINED after
    resveratrol versus placebo (p = 0.011); alkaline phosphatase INCREASED (p = 0.008); CTX and osteocalcin
    unchanged. After resveratrol only, NTproCNP inversely associated with lumbar spine BMD (r = -0.31,
    p = 0.025) and osteocalcin positively associated (r = 0.32, p = 0.022)'
  unit: p-values and correlation coefficients on plasma NTproCNP
  conditions: prickett2023, abstract read 2026-08-09 (PMC10184013, open access). Stored plasma from a
    completed RCT; NTproCNP as the CNP production marker.
  species: human
  source_ref: prickett2023
  uncertainty: 'THE DIRECTION IS AMBIGUOUS AND THE OBVIOUS READING IS UNSAFE. Read naively this says
    resveratrol suppresses CNP and therefore fights the axis this atlas spent fifteen rounds on. But
    prickett2021, the same author, established that NTproCNP FALLS WHEN PATHWAY OUTPUT RISES - the marker
    is under negative feedback, and it fell in children whose growth was accelerating on vosoritide. So a
    decline is consistent with LESS LIGAND or with MORE SIGNALLING, and this study carries no receptor-side
    or cGMP readout to tell them apart. FURTHER LIMITS: postmenopausal women with osteopenia are not a
    growing skeleton and have no growth plates at all, so nothing here speaks to the plate directly; and
    NTproCNP is the bio-inactive fragment, not bioactive CNP.'
- parameter: 'GPER1 CLOSED - THE AGONIST DOES NOT MOVE BONE LENGTH, AND THE TWO GROUPS CONTRADICT ON THE
    KNOCKOUT'
  value: 'iravani2019: the selective GPER1 agonist G1 applied locally to mouse metatarsal bones for 14 days
    ex vivo had NO EFFECT on growth at ANY concentration; systemic G1 in ovariectomised C57BL/6 mice had NO
    EFFECT on tibia or femur growth, in the same experiment where beta-estradiol suppressed growth as
    expected; and the authors state ABLATION of GPER1 INCREASED bone length. AGAINST THAT, chou2021 reports
    chondrocyte-specific GPER-1 knockout DECREASED crown-rump length and tibia and femur length with a
    reduced proliferative zone, and chou2025 reports G1 raising proliferative zone thickness and PTHrP/Ihh
    while DECREASING hypertrophic zone thickness and type X collagen'
  unit: qualitative - direction of effect on bone length
  conditions: iravani2019, chou2021 and chou2025, all abstracts read 2026-08-09; all three open access.
  species: mouse
  source_ref: iravani2019
  atlas_derived: true
  uncertainty: 'THE CONFLICT IS REAL AND THIS NODE DOES NOT RESOLVE IT - global versus chondrocyte-specific
    deletion is the obvious reconciliation, since a global knockout permits systemic compensation, but
    neither group tested the other model. WHAT DECIDES THE THERAPEUTIC QUESTION IS NARROWER THAN THE
    BIOLOGY: only iravani2019 measured BONE LENGTH under the AGONIST, which is the intervention a drug
    would make, and it found nothing ex vivo or in vivo. chou2025 measures zone thicknesses and a
    signalling ratio, to which SD-006 applies in full, and reports no length endpoint. AND EVEN AT FACE
    VALUE chou2025 describes a TRADE - proliferation up, hypertrophy down - which is not obviously a net
    gain in the atlas own decomposition.'
- parameter: 'FULL TEXT READ - THE ACTUAL MAGNITUDES, WHICH ARE SMALL AND INCONSISTENT ACROSS BONES'
  value: 'OVARY-INTACT rabbits, n = 24, 16 weeks: TIBIA 111.6 +/- 0.6 mm RES versus 109.5 +/- 0.6 control,
    p less than 0.05 - a gain of 2.1 mm or 1.9 PER CENT. FEMUR 103 +/- 0.8 versus 101.5 +/- 0.6,
    p = 0.1, NOT SIGNIFICANT. OVX rabbits: FEMUR 102.4 +/- 0.6 versus 100.9 +/- 0.4, p less than 0.05, a
    gain of 1.5 mm or 1.5 PER CENT; TIBIA 107.5 +/- 0.5 versus 107.1 +/- 0.6, NO DIFFERENCE, and no effect
    on tibial growth by X-ray at any timepoint. EX VIVO metatarsals at 0.3 microM: 125.3 +/- 2.1 per cent
    length increase versus 118.7 +/- 1.9 in controls over 19 days, p less than 0.05'
  unit: millimetres; per cent
  conditions: karimian2013 FULL TEXT READ 2026-08-09. Digital caliper at endpoint; longitudinal X-ray for
    growth curves.
  species: rabbit
  source_ref: karimian2013
  uncertainty: 'THE PATTERN IS INCONSISTENT IN A WAY THE ABSTRACT CONCEALS. In ovary-intact animals the
    TIBIA reached significance and the FEMUR did not (p = 0.1); in OVX animals the FEMUR reached
    significance and the TIBIA showed no difference at all. A real systemic growth effect should not swap
    bones between arms. THE MAGNITUDES ARE 1.5 TO 1.9 PER CENT, which on a 175 cm human is of order 3 cm
    if it transferred proportionally - not nothing, but far from the 204 cm ESR1 anchor - and these are
    rabbit long bones under 16 weeks of treatment, not human adult stature.'
- parameter: 'THE FUSION DATA, WHICH IS THE STRONGEST PART OF THE PAPER'
  value: 'OVX rabbits, per cent of animals with UNFUSED growth plates. DISTAL TIBIA at 4 weeks: 57 per cent
    unfused on RES (8 of 14) versus 6 PER CENT on control (1 of 17) and 0 per cent on E2 - p less than
    0.05. DISTAL FEMUR at 7 weeks: 100 per cent unfused RES, 90 per cent control, 60 per cent E2. DISTAL
    FEMUR at 10 weeks: 33 per cent unfused RES versus 10 per cent control. PROXIMAL TIBIA at 10 weeks: NO
    plate fused on RES versus 50 PER CENT FUSED in controls, p less than 0.05. Fusion defined as 50 per
    cent or more of cartilage replaced by bone bridges, scored by a blinded observer'
  unit: per cent of animals with unfused plate
  conditions: karimian2013 full text, Figure 3. Ovariectomised pubertal rabbits; rabbit chosen because
    fusion occurs at sexual maturation as in humans, unlike small rodents.
  species: rabbit
  source_ref: karimian2013
  uncertainty: 'THIS IS THE PART THAT CARRIES THE NODE. A ten-fold difference in unfused distal tibiae at
    4 weeks, a blinded observer, a working positive control (E2 fused everything), and the effect
    reproduced at THREE anatomically distinct plates that normally fuse in sequence. THE PROXIMAL TIBIA
    RESULT MATTERS MOST because the authors note it is the LAST epiphysis to fuse and therefore the one
    that determines final length. LIMITS: all in OVARIECTOMISED animals, so the clock being delayed is
    already an abnormal one; group sizes are small (14 and 17 at the best-powered timepoint, 5 or fewer in
    the E2 histology arm); and delayed fusion was NOT separately reported for the ovary-intact arm, which
    is the more physiological condition.'
- parameter: 'THE HUMAN DOSE QUESTION RESOLVES FAVOURABLY - THE ACTIVE CONCENTRATION IS REACHABLE AND THE
    INHIBITORY ONE IS NOT (CORR-177)'
  value: 'karimian2013 states that human pharmacokinetic studies across doses from 0.3 mg to 5 g per person
    produce PEAK PLASMA CONCENTRATIONS OF 0.3 TO 2.4 microMOLAR with no detrimental side effects. The ex
    vivo STIMULATORY concentration is 0.3 microM - the bottom of that range. The INHIBITORY concentrations
    are 10 and 50 microM - FOUR TO TWENTY TIMES ABOVE THE TOP OF THE ACHIEVABLE HUMAN RANGE. Rat renal
    toxicity appears at 1 to 3 g/kg, five to fifteen times the 200 mg/kg rabbit dose, which itself produced
    NO effect on food intake or body weight in either rabbit study'
  unit: micromolar plasma; g per person
  conditions: karimian2013 discussion, citing human PK studies; ex vivo dose-response from the same paper.
  species: human
  source_ref: karimian2013
  uncertainty: 'THIS WITHDRAWS THE ROUND-166 DOSE OBJECTION AND THE REASONING BEHIND IT WAS WRONG, NOT JUST
    THE NUMBER (CORR-177). I scaled 200 mg/kg rabbit by body surface area to about 4.5 g/day human and
    called the dose unreachable. THE RIGHT COMPARISON IS CONCENTRATION, NOT MILLIGRAMS PER KILOGRAM, and
    on concentration the human window brackets the active band and CANNOT REACH the inhibitory band -
    which also defuses the biphasic worry. THE REAL CAVEAT IS DIFFERENT AND IT IS bioavailability:
    brown2010 shows conjugate AUC exceeds parent by UP TO 20.3-FOLD, so total plasma Cmax badly overstates
    FREE resveratrol, and the concentration actually reaching a chondrocyte is unknown and probably well
    below 0.3 microM. The 2.5 and 5 g doses also cause mild to moderate gastrointestinal symptoms.'
- parameter: 'IT DOES NOT DO THE THING THAT KILLED TAMOXIFEN - THE POOL IS PRESERVED, NOT SPENT'
  value: 'Apoptosis in the RES group was 0.2 +/- 0.1 per cent, IDENTICAL to control at 0.2 +/- 0.1 per
    cent, while E2 raised it to 1.1 +/- 0.4 per cent (p less than 0.05). RESTING ZONE AREA MORE THAN
    DOUBLED on RES: 0.26 +/- 0.05 versus 0.11 +/- 0.02 mm2, p less than 0.01. Hypertrophic chondrocytes per
    column 5.0 +/- 0.1 versus 3.3 +/- 0.1 (p less than 0.05); terminal hypertrophic cell size 12.4 +/- 0.6
    versus 10.5 +/- 0.6 microns (p less than 0.05); hypertrophic zone height 95 +/- 5 versus 71 +/- 5
    (p less than 0.01)'
  unit: per cent apoptotic; mm2; microns
  conditions: karimian2013 full text, Table 1 and Figures 4-5; distal femur growth plate, 7 weeks OVX.
  species: rabbit
  source_ref: karimian2013
  uncertainty: 'THIS IS THE MOST IMPORTANT CONTRAST IN THE NODE AND IT IS THE OPPOSITE SIGN FROM TAMOXIFEN
    ON THE EXACT LIABILITY THAT KILLED IT. chagin2007 killed tamoxifen for this project because it induced
    APOPTOSIS IN RESTING-ZONE CHONDROCYTES with no catch-up after washout - it spent the pool
    irreversibly. Resveratrol, in the same laboratory, leaves apoptosis unchanged and MORE THAN DOUBLES the
    resting zone area. SD-006 STILL APPLIES TO THE ZONE FIGURES - an enlarged resting zone is not a larger
    pool and can be a turnover failure, and the hypertrophic zone height must not be read as growth. What
    the apoptosis number licenses is narrower and still valuable: whatever resveratrol is doing, IT IS NOT
    KILLING CHONDROCYTES.'
- parameter: 'STACK INTERACTION 1 - ERDAFITINIB. TWO CONFLICTS, AND THE PHARMACOKINETIC ONE IS SERIOUS'
  value: 'PHARMACOKINETIC: erdafitinib is primarily metabolised by CYP2C9 and CYP3A4, contributing 39 PER
    CENT and 20 PER CENT of total clearance respectively - FIFTY-NINE PER CENT of clearance through two
    enzymes resveratrol is a documented inhibitor of. PHARMACODYNAMIC: resveratrol SIGNIFICANTLY REDUCED
    BrdU incorporation in the growth plate (p less than 0.05 versus control), with proliferative
    chondrocytes per column 4.5 +/- 0.6 versus 5.2 +/- 0.9 and proliferative zone height 125 +/- 14 versus
    173 +/- 24. Erdafitinib works by relieving the FGFR3 brake ON PROLIFERATION. The two act on the same
    parameter in opposite directions'
  unit: per cent of clearance; BrdU-positive cells
  conditions: Erdafitinib metabolism from the PubChem/DrugBank metabolism record retrieved 2026-08-09;
    proliferation data from karimian2013 Table 1 and Figure 5.
  species: not_applicable
  source_ref: karimian2013
  atlas_derived: true
  uncertainty: 'THE PK CONFLICT IS THE MOST SERIOUS THING IN THIS NODE AND IT IS NOT ABOUT GROWTH AT ALL.
    Raising erdafitinib exposure matters because the atlas already holds the paediatric outcome record for
    that drug: FIVE OF FIVE CASES PERMANENTLY DISCONTINUED, THREE REQUIRING SURGERY. A CYP2C9 and CYP3A4
    inhibitor sitting on 59 per cent of its clearance is a mechanism for turning a tolerated dose into an
    intolerable one. I HAVE NOT QUANTIFIED THE INHIBITION - resveratrol CYP inhibition constants at
    achievable free concentrations were not retrieved, and in vitro CYP inhibition by polyphenols often
    fails to translate in vivo precisely because free concentrations are low. THE PD CONFLICT IS SMALLER
    THAN IT LOOKS: the paper argues from Wilsman that under 10 per cent of growth comes from proliferation
    against 60 per cent from hypertrophy, and resveratrol raises hypertrophy while lowering proliferation.
    But in a stack whose amplification arm IS the FGFR inhibitor, resveratrol partially spends what that
    arm buys.'
- parameter: 'STACK INTERACTION 2 - GROWTH HORMONE. ANTAGONISED IN HUMANS, AND THE HUMAN DATA BEAT THE
    RABBIT DATA'
  value: 'karimian2013 in RABBIT: serum IGF-I unchanged - 203 +/- 23 on RES versus 191 +/- 11 control at 7
    weeks, and 122 +/- 7 versus 140 +/- 8 at 10 weeks, neither significant. brown2010 in HUMANS: 40 healthy
    volunteers on 0.5, 1.0, 2.5 or 5.0 g daily for 29 days showed a DECREASE IN CIRCULATING IGF-I AND
    IGFBP-3 IN ALL VOLUNTEERS, p less than 0.04 FOR BOTH, MOST MARKED AT 2.5 g'
  unit: ng/mL; p-values
  conditions: karimian2013 Table 1; brown2010 abstract read 2026-08-09 (PMC2982884), repeat-dose human
    study with pre- and post-dosing ELISA.
  species: human
  source_ref: brown2010
  uncertainty: 'THE TWO SPECIES DISAGREE AND THE HUMAN ONE GOVERNS A HUMAN DECISION. Growth hormone acts on
    the plate substantially through IGF-I, and SD-002 records GH as the largest single contributor in the
    only combination trial with a height endpoint. A co-administered compound that lowers circulating
    IGF-I in every volunteer tested is working against that arm. WHAT IS NOT KNOWN IS THE MAGNITUDE - the
    abstract gives significance but not per cent change, so whether this is a 5 per cent or a 30 per cent
    reduction is unrecorded and it decides whether the conflict is a nuisance or disqualifying. Note also
    the non-monotonic dose-response, larger at 2.5 g than at 5 g, which is a third instance of this
    compound reversing behaviour with concentration.'
- parameter: 'STACK INTERACTION 3 - ANASTROZOLE. NO SYSTEMIC OESTROGEN EFFECT, BUT THE UTERUS TEST IS
    WEAKER THAN IT LOOKS'
  value: 'Uterus weight was 0.6 +/- 0.1 g in controls, 0.5 +/- 0.1 g on resveratrol, and 18 +/- 2 g on E2
    (p less than 0.001) - unaffected by resveratrol AT ALL TIMEPOINTS AND REGARDLESS OF PRESENCE OR ABSENCE
    OF GONADS. That single measurement tests estrogenicity and aromatase inhibition at once, since an
    aromatase inhibitor would have LOWERED uterus weight in the ovary-intact animals and did not. BUT
    nilsson2003_raloxifene, same model and same laboratory, found RALOXIFENE LEFT UTERUS WEIGHT UNCHANGED
    WHILE ACTING AS A FULL OESTROGEN AGONIST AT THE GROWTH PLATE - hastening distal tibial fusion and
    cutting tibial growth velocity at p less than 0.001'
  unit: grams
  conditions: karimian2013 Table 1; nilsson2003_raloxifene abstract read 2026-08-09.
  species: rabbit
  source_ref: nilsson2003_raloxifene
  uncertainty: 'THE REASSURANCE IS REAL BUT IT IS WEAKER THAN THE FIRST READING SUGGESTS, AND THE PAPER
    THAT WEAKENS IT IS FROM THE SAME GROUP. Uterus weight is not a sufficient proxy for growth-plate
    oestrogen activity, because raloxifene passes that test and is nonetheless a full agonist at the plate.
    WHAT SAVES THE ANASTROZOLE COMBINATION IS THE DIRECTION OF THE PLATE OUTCOME ITSELF: resveratrol
    DELAYED fusion where an oestrogen agonist HASTENS it, so whatever it is doing at the plate it is not
    acting as an oestrogen. THE RESIDUAL RISK IS REDUNDANCY RATHER THAN HARM: karimian2013 explicitly
    states they cannot exclude that the phenotype is due to ERalpha ANTAGONISM. If it is, resveratrol and
    anastrozole occupy the SAME CONTROL POINT - both reducing oestrogen signalling - and stacking them
    would be sub-additive, which is the arrangement this atlas rule forbids.'
- parameter: 'STACK INTERACTION 4 - VOSORITIDE. DIRECTION UNRESOLVED, PLUS POSSIBLE SAME-TERM OVERLAP'
  value: 'The CNP direction from prickett2023 remains unassigned. SEPARATELY, resveratrol and a CNP
    analogue may act on the SAME TERM: resveratrol raised hypertrophic chondrocytes per column from 3.3 to
