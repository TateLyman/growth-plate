id: resveratrol_delays_fusion_the_untouched_compound
name: RESVERATROL - the compound this atlas never touched, on the highest-ranked arm, with a final-length
  endpoint from the laboratory that killed tamoxifen
aliases:
- resveratrol growth plate
- delays growth plate fusion
- untouched compound duration arm
- GPER1 is closed
- trans-resveratrol bone growth
type: intervention
layer: L12
stub: false
summary: 'THE INSTRUCTION WAS TO FIND A COMPOUND ON AN AXIS WE HAVE NOT TOUCHED. THIS IS ONE, AND IT IS ON
  THE HIGHEST-RANKED ARM. RESVERATROL APPEARS IN ZERO NODES AND ZERO BIBLIOGRAPHY ENTRIES ACROSS 690 NODES.
  It was never searched.
  WHAT karimian2013 FOUND, AND WHO FOUND IT. Pre-pubertal ovary-intact rabbits on oral trans-resveratrol
  200 mg/kg/day until fusion: INCREASED TIBIAL AND VERTEBRAL GROWTH AND IMPROVED FINAL LENGTH over sixteen
  weeks. In pubertal OVARIECTOMISED rabbits it DELAYED FUSION AT THREE SEPARATE PHYSES - distal tibia,
  distal femur, proximal tibia - with increased femur length and vertebral growth. THE ENDPOINTS ARE
  FINAL LENGTH AND FUSION TIMING, which is exactly what the duration arm needs and exactly what almost
  nothing in this atlas has. AND THE PROVENANCE IS THE STRONGEST POSSIBLE: Karimian, Chagin, Ohlsson and
  Savendahl - the same laboratory whose chagin2007 and karimian2008 killed tamoxifen for this project.
  The negative control and this positive come from the same hands.
  THE MECHANISM IS VASCULAR AND IT IS COHERENT. Histomorphometry showed SUPPRESSED CHONDROCYTE EXPRESSION
  OF VEGF AND LAMININ, and the authors propose impaired growth plate vascularisation. That is mechanistically
  the right shape: epiphyseal fusion REQUIRES vascular invasion of the plate, so an agent that suppresses
  VEGF should delay fusion by preventing the invasion rather than by altering the hormonal clock. It is a
  different control point from aromatase inhibition, which lowers the oestrogen signal that drives the
  clock. IF BOTH ARE REAL THEY ARE STACKABLE ACROSS CONTROL POINTS, WHICH IS THE ATLAS DESIGN RULE.
  NOW EVERY REASON TO DOUBT IT, AND THERE ARE FIVE.
  ONE - SD-006 APPLIES TO HALF THE HISTOLOGY AND MUST BE APPLIED. The paper reports a wider plate, an
  ENLARGED RESTING ZONE and an INCREASED HYPERTROPHIC ZONE HEIGHT. This atlas has a standing decision that
  zone thickness is not evidence of growth - a zone thickens when clearance slows. Those figures are
  mechanism, not endpoint. WHAT SURVIVES SD-006 IS THE FINAL LENGTH AND THE FUSION TIMING, which are
  independent measurements and are the reason this node exists.
  TWO - THE DOSE IS ENORMOUS. 200 mg/kg/day in rabbit. Body-surface-area scaling to human is roughly a
  factor of three, giving of order 65 mg/kg/day, which for a 70 kg adult is around 4.5 GRAMS PER DAY.
  That is far above the 150 to 500 mg supplement range and at the top of what human trials have given,
  where gram-scale doses produce gastrointestinal toxicity. THE EFFECTIVE HUMAN DOSE MAY NOT BE
  TOLERABLE, AND THIS IS THE SINGLE BIGGEST PROBLEM WITH THE FINDING.
  THREE - THE IN VITRO RESULT IS BIPHASIC AND THE WINDOW IS NARROW. Cultured fetal rat metatarsals grew
  faster at 0.3 microM and were INHIBITED at 10 and 50 microM. A compound that reverses sign over roughly
  a thirtyfold concentration range is a compound where getting the exposure wrong does the opposite of
  what you want - and resveratrol has notoriously poor and variable oral bioavailability.
  FOUR - THE CHEMOTYPE IS A KNOWN FREQUENT HITTER. Resveratrol is a canonical pan-assay interference
  compound with an enormous and poorly reproducible literature. A single positive, however well conducted,
  carries less prior weight in this chemotype than it would in another.
  FIVE - THE OVX MODEL IS OESTROGEN-DEFICIENT, so the fusion-delay arm is a delay on top of an already
  disrupted clock. The ovary-intact arm did show increased growth and final length, which is the more
  relevant condition, but the fusion-delay result specifically is in the OVX animals.
  AND THE HUMAN DATA EXIST, WITH A CNP INTERACTION WHOSE DIRECTION IS GENUINELY AMBIGUOUS. prickett2023 is
  a 125-subject randomised crossover in postmenopausal women: plasma NTproCNP DECLINED after resveratrol
  (p = 0.011), alkaline phosphatase rose (p = 0.008), and NTproCNP was inversely associated with lumbar
  spine BMD after resveratrol only. THE OBVIOUS READING - resveratrol suppresses CNP and therefore
  antagonises the arm this atlas spent fifteen rounds on - IS NOT SAFE. prickett2021, same author,
  established that NTproCNP FALLS WHEN CNP PATHWAY OUTPUT RISES, because raising pathway activity
  suppresses production by feedback. A fall in the production marker is consistent with less ligand OR
  more signalling, and this study has no receptor-side readout to discriminate. THE INTERACTION IS REAL
  AND UNRESOLVED, and it must be resolved before resveratrol and a CNP agent are ever put in the same
  stack.
  SEPARATELY, GPER1 IS CLOSED AND IT CLOSED FAST. The atlas had eliminated receptor SUBTYPE on kang2020,
  but that was ERalpha versus ERbeta - GPER1 is a third, membrane oestrogen receptor and was never
  covered. iravani2019 tested the selective agonist G1 directly on the endpoint that matters: NO EFFECT on
  mouse metatarsal growth at any concentration ex vivo, and NO EFFECT on tibia or femur growth in
  ovariectomised mice in vivo, in the same experiment where oestradiol suppressed growth as expected.
  THAT IS A CLEAN NEGATIVE ON THE THERAPEUTIC QUESTION. chou2021 and chou2025 report the opposite
  knockout direction and a proliferation phenotype, and the two groups DIRECTLY CONTRADICT on whether
  ablating GPER1 lengthens or shortens bone - but chou2025 measures zone thicknesses and PTHrP/Ihh rather
  than length, and even at face value its profile is a TRADE, raising proliferation while SUPPRESSING
  hypertrophy. Length was measured once, by iravani2019, and it did not move.'
quantitative:
- parameter: 'RESVERATROL DELAYS FUSION AT THREE PHYSES AND IMPROVES FINAL LENGTH IN RABBIT'
  value: 'Ovary-intact pre-pubertal New Zealand white rabbits, oral trans-resveratrol 200 mg/kg/day for 16
    weeks until fusion: INCREASED tibial and vertebral bone growth and IMPROVED FINAL LENGTH. Pubertal
    OVARIECTOMISED rabbits, 7 or 10 weeks: DELAYED FUSION of the DISTAL TIBIA, DISTAL FEMUR and PROXIMAL
    TIBIA epiphyses, with increased femur length and vertebral growth. Histomorphometry of the OVX distal
    femur: wider plate, enlarged resting zone, increased number and size of hypertrophic chondrocytes,
    increased hypertrophic zone height, and SUPPRESSED VEGF AND LAMININ expression. Cultured fetal rat
    metatarsals: growth STIMULATED at 0.3 microM, INHIBITED at 10 and 50 microM'
  unit: mg/kg/day; micromolar; qualitative length and fusion outcomes
  conditions: karimian2013, abstract read 2026-08-09 (PMC3695926, open access). Longitudinal X-ray plus
    endpoint digital caliper for length; histomorphometry at endpoint.
  species: rabbit
  source_ref: karimian2013
  uncertainty: 'SD-006 APPLIES AND IS APPLIED: the enlarged resting zone and increased hypertrophic zone
    height are NOT evidence of more growth and are recorded as mechanism only - a zone thickens when
    clearance slows. The final-length and fusion-timing endpoints are independent of that and are what
    the node rests on. THE DOSE IS THE BIGGEST PROBLEM: 200 mg/kg/day in rabbit scales by body surface
    area to roughly 65 mg/kg/day in human, about 4.5 g/day at 70 kg, which is far above supplement doses
    and at the level where human trials report gastrointestinal toxicity. THE BIPHASIC IN VITRO RESULT
    means exposure errors reverse the sign. NO n IS RECORDED HERE - the abstract does not give group sizes
    and the full text has not been read. The fusion-delay result is specifically in OVARIECTOMISED
    animals, an oestrogen-deficient model; the ovary-intact arm showed growth and final length but the
    abstract does not state whether fusion timing was altered there.'
- parameter: 'THE HUMAN RESVERATROL-CNP INTERACTION, AND WHY ITS DIRECTION IS UNRESOLVED'
  value: 'prickett2023, RESHAW randomised crossover, 125 postmenopausal women with mild osteopenia,
    resveratrol versus placebo over 2 years. Within-individual crossover: plasma NTproCNP DECLINED after
    resveratrol versus placebo (p = 0.011); alkaline phosphatase INCREASED (p = 0.008); CTX and osteocalcin
    unchanged. After resveratrol only, NTproCNP inversely associated with lumbar spine BMD (r = -0.31,
    p = 0.025) and osteocalcin positively associated (r = 0.32, p = 0.022)'
  unit: p-values and correlation coefficients on plasma NTproCNP
  conditions: prickett2023, abstract read 2026-08-09 (PMC10184013, open access). Stored plasma from a
    completed RCT; NTproCNP as the CNP production marker.
  species: human
  source_ref: prickett2023
  uncertainty: 'THE DIRECTION IS AMBIGUOUS AND THE OBVIOUS READING IS UNSAFE. Read naively this says
    resveratrol suppresses CNP and therefore fights the axis this atlas spent fifteen rounds on. But
    prickett2021, the same author, established that NTproCNP FALLS WHEN PATHWAY OUTPUT RISES - the marker
    is under negative feedback, and it fell in children whose growth was accelerating on vosoritide. So a
    decline is consistent with LESS LIGAND or with MORE SIGNALLING, and this study carries no receptor-side
    or cGMP readout to tell them apart. FURTHER LIMITS: postmenopausal women with osteopenia are not a
    growing skeleton and have no growth plates at all, so nothing here speaks to the plate directly; and
    NTproCNP is the bio-inactive fragment, not bioactive CNP.'
- parameter: 'GPER1 CLOSED - THE AGONIST DOES NOT MOVE BONE LENGTH, AND THE TWO GROUPS CONTRADICT ON THE
    KNOCKOUT'
  value: 'iravani2019: the selective GPER1 agonist G1 applied locally to mouse metatarsal bones for 14 days
    ex vivo had NO EFFECT on growth at ANY concentration; systemic G1 in ovariectomised C57BL/6 mice had NO
    EFFECT on tibia or femur growth, in the same experiment where beta-estradiol suppressed growth as
    expected; and the authors state ABLATION of GPER1 INCREASED bone length. AGAINST THAT, chou2021 reports
    chondrocyte-specific GPER-1 knockout DECREASED crown-rump length and tibia and femur length with a
    reduced proliferative zone, and chou2025 reports G1 raising proliferative zone thickness and PTHrP/Ihh
    while DECREASING hypertrophic zone thickness and type X collagen'
  unit: qualitative - direction of effect on bone length
  conditions: iravani2019, chou2021 and chou2025, all abstracts read 2026-08-09; all three open access.
  species: mouse
  source_ref: iravani2019
  atlas_derived: true
  uncertainty: 'THE CONFLICT IS REAL AND THIS NODE DOES NOT RESOLVE IT - global versus chondrocyte-specific
    deletion is the obvious reconciliation, since a global knockout permits systemic compensation, but
    neither group tested the other model. WHAT DECIDES THE THERAPEUTIC QUESTION IS NARROWER THAN THE
    BIOLOGY: only iravani2019 measured BONE LENGTH under the AGONIST, which is the intervention a drug
    would make, and it found nothing ex vivo or in vivo. chou2025 measures zone thicknesses and a
    signalling ratio, to which SD-006 applies in full, and reports no length endpoint. AND EVEN AT FACE
    VALUE chou2025 describes a TRADE - proliferation up, hypertrophy down - which is not obviously a net
    gain in the atlas own decomposition.'
localization:
- 'the fusion-delay mechanism proposed is at the vascular invasion front of the growth plate, via VEGF and
  laminin suppression - distinct from the hormonal clock that aromatase inhibition acts on'
human_evidence: indirect
human_evidence_note: 'The growth and fusion data are rabbit. Human resveratrol data exist (prickett2023, a
  125-subject RCT) but in postmenopausal women with no growth plates, and the readout is a CNP production
  marker rather than any skeletal growth endpoint.'
species_basis:
- rabbit
- rat
- human
- mouse
translation_risk: high
translation_risk_reason: 'A single rabbit study at a dose that scales to roughly 4.5 g/day in humans, in a
  chemotype notorious for irreproducibility, with a biphasic concentration response that reverses sign.'
confidence: D
claim_grades:
- claim: Resveratrol delays growth plate fusion and improves final length in a mammal.
  grade: D
  basis: 'karimian2013 reports it at three separate physes with a final-length endpoint, from the
    laboratory whose negative results this atlas already trusts on this exact arm, with a coherent
    vascular mechanism (VEGF and laminin suppression). Graded D and not higher because it is a SINGLE
    study, in rabbit, with no group sizes in the abstract, the fusion-delay arm is ovariectomised, and
    resveratrol is a chemotype with a well-known reproducibility problem.'
- claim: The histology shows resveratrol increases growth.
  grade: X
  basis: 'NO - SD-006. The enlarged resting zone and increased hypertrophic zone height are zone
    thicknesses, and a zone thickens when clearance slows. They are mechanism, not endpoint. The final
    length and fusion timing are separate measurements and are what carries the claim.'
- claim: The effective dose is reachable in a human.
  grade: D
  basis: 'DOUBTFUL. 200 mg/kg/day in rabbit scales by body surface area to roughly 65 mg/kg/day in human -
    about 4.5 g/day at 70 kg - against a 150 to 500 mg supplement range, and gram-scale human dosing
    produces gastrointestinal toxicity. Resveratrol also has poor and variable oral bioavailability, and
    the in vitro response is biphasic with inhibition at 10 to 50 microM, so overshoot reverses the sign.
    This is the single biggest obstacle and it is unresolved.'
- claim: Resveratrol suppresses CNP signalling and therefore conflicts with the CNP arm.
  grade: X
  basis: 'NOT ESTABLISHED, AND THE OBVIOUS READING IS UNSAFE. prickett2023 shows plasma NTproCNP falls
    after resveratrol in humans. But prickett2021, same author, established that NTproCNP falls when
    pathway output RISES, because production is under negative feedback - it fell in children whose growth
    was accelerating on vosoritide. Without a receptor-side or cGMP readout the direction cannot be
    assigned, and this must be resolved before the two are combined.'
- claim: GPER1 is a viable target for modulating bone growth.
  grade: X
  basis: 'NO. iravani2019 tested the selective agonist G1 on the endpoint that matters and found NO effect
    on mouse metatarsal growth at any concentration ex vivo and no effect on tibia or femur in vivo, in an
    experiment where oestradiol behaved as expected. chou2021 and chou2025 report a contradictory knockout
    direction and a proliferation phenotype, but measure zone thicknesses rather than length, and their
    profile is a trade - proliferation up, hypertrophy down.'
key_refs:
- ref_id: karimian2013
  year: 2013
  type: primary
  role: the finding - delayed fusion at three physes and improved final length in rabbit, with VEGF and
    laminin suppression as the proposed mechanism
- ref_id: prickett2023
  year: 2023
  type: primary
  role: human resveratrol exposure and the unresolved CNP interaction
- ref_id: iravani2019
  year: 2019
  type: primary
  role: the clean negative that closes GPER1 - the agonist does not move bone length
- ref_id: chou2025
  year: 2025
  type: primary
  role: the contradicting GPER1 phenotype, and why it is a trade rather than a gain even if accepted
- ref_id: chagin2007
  year: 2007
  type: primary
  role: the same laboratory's negative on tamoxifen, which is why their positive here carries weight
