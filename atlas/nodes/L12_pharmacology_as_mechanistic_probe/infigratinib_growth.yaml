      achondroplasia aged 3-17 y, 75 infigratinib / 39 placebo, prespecified imputation
    species: human
    source_ref: savarirayan2026infig
    uncertainty: 95% CI 1.31-2.17, p<0.001
  - parameter: LS mean difference in height z score vs placebo, week 52
    value: '0.32'
    unit: z-score
    conditions: same trial, key secondary endpoint
    species: human
    source_ref: savarirayan2026infig
    uncertainty: 96% CI 0.23-0.41, p<0.001
  - parameter: daily oral dose in the phase 3 trial
    value: '0.25'
    unit: mg/kg/day
    conditions: once daily oral, children aged 3-17 y
    species: human
    source_ref: savarirayan2026infig
    uncertainty: single dose level
  - parameter: infigratinib concentration achieved within growth plate cartilage
    value: not measured
    unit: not applicable
    conditions: no tissue measurement published for infigratinib in growth plate in any species
    species: not_applicable
    source_ref: savarirayan2026infig
    uncertainty: unmeasured - see gap g_l12b_002
    value_unverified: true
localization:
  - "human growth plate: presumed site of action; intraplate drug concentration unmeasured"
human_evidence: direct
human_evidence_note: >-
  Completed multicentre double-blind placebo-controlled phase 3 trial in 114 children with
  achondroplasia with a prespecified annualised height velocity endpoint.
species_basis: [human, mouse, in_vitro_human_cell]
translation_risk: low
translation_risk_reason: >-
  The efficacy claim is human and randomised. Translation risk attaches instead to the
  extension claims - hypochondroplasia and osteogenesis imperfecta - which rest on mouse
  and in vitro data and are contradicted in the hypochondroplasia case.
confidence: A
claim_grades:
  - claim: Oral infigratinib 0.25 mg/kg/day raises annualised height velocity by 1.74 cm/yr vs placebo over 52 weeks in achondroplasia.
    grade: A
    basis: Phase 3 double-blind placebo-controlled RCT, n=114.
  - claim: Infigratinib is an effective strategy for hypochondroplasia.
    grade: D
    basis: Directly contested - Demuynck 2025 reports potent inhibition and mouse efficacy, Ursachi 2026 reports weak inhibition of the N540K mutant. Unresolved; see gap g_l12b_004.
  - claim: The growth effect reflects reduced FGFR3 kinase output specifically in growth plate chondrocytes.
    grade: C
    basis: Mechanistic attribution rests on mouse growth plate histology and phospho-ERK1/2 reduction, not on human plate tissue.
