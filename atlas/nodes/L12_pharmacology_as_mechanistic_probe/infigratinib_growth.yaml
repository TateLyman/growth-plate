translation_risk: low
translation_risk_reason: The efficacy claim is human and randomised. Translation risk attaches instead
  to the extension claims - hypochondroplasia and osteogenesis imperfecta - which rest on mouse and in
  vitro data and are contradicted in the hypochondroplasia case.
confidence: C
claim_grades:
- claim: Infigratinib is 89-fold less potent against FGFR3 K650M (IC50 44.4 nM) than against K650E (IC50
    0.5 nM), despite K650M carrying ~3x the constitutive kinase activity.
  grade: C
  basis: In-vitro kinase/cell potency against KINASE-DOMAIN alleles. Replicated in vitro; no human data
    at these alleles.
- claim: Inhibitor potency therefore does not track constitutive kinase activity across the FGFR3 kinase-domain
    allelic series, so "reduce kinase output" is not a sufficient design rule for those alleles.
  grade: C
  basis: Follows from the potency data above; established only for kinase-domain alleles.
- claim: That same non-monotonicity governs the CLINICAL target allele in achondroplasia, G380R.
  grade: E
  basis: UNTESTED INFERENCE. G380R is a TRANSMEMBRANE-domain activating variant with a different activation
    mechanism (altered receptor dimerisation/downregulation), not a kinase-domain change. No published
    IC50 against G380R-activated FGFR3 was located. See g_mr002_allele.
- claim: Infigratinib increases growth velocity in children with achondroplasia.
  grade: B
  basis: Clinical trial evidence in the G380R population, independent of the in-vitro allele question.
