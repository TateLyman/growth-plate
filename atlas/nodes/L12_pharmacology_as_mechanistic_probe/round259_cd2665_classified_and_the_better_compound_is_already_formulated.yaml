translation_risk: high
translation_risk_reason: >-
  The classification is from transfected reporter cells with Gal4 fusions; the skeletal efficacy is ectopic
  BMP-induced osteogenesis rather than physeal elongation; and the pharmacological class of the recommended
  compound is itself uncharacterised.
confidence: B
confidence_reason: >-
  The CD2665 classification is a direct measurement from the group that established the class distinction,
  and it is graded B on its own terms below. The recommendation to use 7C instead is C - it rests on
  selectivity and formulation advantages plus one mechanistically apt culture result, with no length
  endpoint anywhere.
claim_grades:
- claim: CD2665 is an inverse agonist at RARgamma.
  grade: X
  basis: >-
    NO. le2019a shows CD2665 and AGN870 are UNABLE to dissociate SMRT from RARgamma - they preserve the
    co-repressor-bound state - and nothing shows them enhancing its recruitment. Round 258 could not settle
    this and the reason was a broken search, not an absent literature. CORR-267.
- claim: CD2665 is RARgamma/beta-selective, as it is universally described.
  grade: X
  basis: >-
    NO. le2019a shows it also antagonises RARalpha, and does so with the OPPOSITE co-regulator behaviour -
    dissociating SMRT and, with an RXR agonist present, mediating transactivation through RXR-RARalpha while
    blocking RXR-RARgamma. Any tissue with rexinoid tone can convert it into an RARalpha activator.
- claim: >-
    A compound must be a formal inverse agonist to hold RARgamma in its growth-supporting repressed state.
  grade: X
  basis: >-
    TOO STRICT, AND THIS WAS ROUND 258'S ERROR. In a zone measured as retinoid-free the receptor is already
    co-repressor-bound and repression is already maximal; a compound cannot enhance what is saturated.
    Preserving SMRT occupancy while blocking agonist-driven release is functionally sufficient.
- claim: >-
    There is endogenous RARgamma ligand tone in the postnatal mouse growth plate.
  grade: E
  basis: >-
    INFERENCE FROM THE COMBINATION. If CD2665 does not enhance repression at RARgamma (le2019a) yet delayed
    maturation and expanded the plate as a monotherapy (koyama2021), something must have been relieving that
    repression for it to block. This qualifies williams2009's retinoid-free measurement rather than
    overturning it, and it has not been measured directly.
- claim: >-
    7C is the compound this proposition should be tested with.
  grade: C
  basis: >-
    RARgamma-SELECTIVE, systemically active, already formulated in PLA nanoparticles for skeletal use with
    two independent in vivo runs (tateiwa2022, tateiwa2024), and it raises sulfated proteoglycan,
    chondrogenic markers and SOX9 reporter activity in chondrogenic cells and MSCs - which is the output
    williams2009 predicted for enhanced RARgamma repression, including its guess that Sox proteins mediate
    it. Not higher, because every skeletal endpoint published for 7C is ectopic BMP-induced bone formation
    and its own pharmacological class is uncharacterised.
