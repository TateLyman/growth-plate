id: round259_cd2665_classified_and_the_better_compound_is_already_formulated
name: >-
  ROUND 259 - CD2665 CLASSIFIED, and the answer is subtype-split. At RARgamma it CANNOT DISSOCIATE SMRT -
  it preserves the co-repressor-bound state - while at RARalpha it strips SMRT and can COOPERATE WITH A
  REXINOID TO ACTIVATE. And the compound that should be used instead already exists, is RARgamma-selective,
  raises SOX9 and proteoglycan in chondrogenic cells, and is already in nanoparticles from the same
  laboratory
aliases:
- round 259
- CD2665 classified
- 7C
- SMRT dissociation
- le2019a
type: intervention
layer: L12
stub: false
summary: >-
  THE QUESTION WAS SETTLED BY A PAPER THAT ROUND 258 FAILED TO FIND BECAUSE ITS SEARCH WAS BROKEN. le2019a,
  from Germain and Bourguet - the same group that defined BMS204,493 and BMS195,614 as the inverse-agonist
  and neutral-antagonist pair - re-evaluated CD2665 biochemically, crystallographically and in cells,
  explicitly to correct the record on compounds whose class had been assumed. The answer is not the binary
  round 258 was looking for.

  ONE - THE DECISIVE MEASUREMENT. Two-hybrid experiments on co-repressor release: BOTH CD2665 AND AGN870
  WERE UNABLE TO DISSOCIATE SMRT FROM RARgamma, while the agonist TTNPB gave major release and LE135 partial
  release. So at RARgamma, CD2665 leaves the co-repressor bound. It does not relieve basal repression, and
  nothing in the paper shows it ENHANCING co-repressor recruitment either. IT IS NOT AN INVERSE AGONIST AT
  RARgamma. It is a co-repressor-PRESERVING antagonist - it holds the receptor in the state it is already
  in and blocks an agonist from releasing it.
  AND FOR THE PURPOSE THIS ATLAS HAS, THAT DISTINCTION MATTERS LESS THAN ROUND 258 ASSUMED. In a zone
  williams2009 measured as retinoid-free, RARgamma is already co-repressor-bound and repression is already
  maximal. A compound cannot enhance what is saturated. What it can do is prevent release - and preserving
  SMRT occupancy while blocking agonist is functionally the growth-supporting state. THE INVERSE-AGONIST
  REQUIREMENT ROUND 258 IMPOSED WAS TOO STRICT.

  TWO - AND THE SAME MEASUREMENT PRODUCES THE TRILEMMA'S ANSWER. Round 258 posed it: if the zone is truly
  retinoid-free, a compound that merely preserves basal repression should do NOTHING given alone, yet CD2665
  alone delayed maturation and expanded the plate (koyama2021). Since le2019a now shows CD2665 does not
  enhance repression at RARgamma, the koyama2021 monotherapy effect can only mean THAT SOMETHING WAS
  RELIEVING RARgamma REPRESSION IN THE POSTNATAL MOUSE PLATE FOR IT TO BLOCK. There is endogenous RARgamma
  ligand tone. That qualifies williams2009's retinoid-free finding - which was a measurement on specific
  zones in a particular preparation - rather than overturning it, and it makes the axis MORE druggable, not
  less: a blockable tone is a tone that exists.

  THREE - AND THE FINDING THAT SHOULD STOP ANYONE USING CD2665 FOR THIS. IT IS NOT RARgamma/beta-SELECTIVE.
  le2019a shows it is ALSO an RARalpha antagonist, and at RARalpha it behaves OPPOSITELY: CD2665 alone
  DISSOCIATED SMRT without generating a surface able to bind coactivator stably - "essentially generating a
  naked heterodimer" - and IN THE PRESENCE OF AN RXR AGONIST IT MEDIATED TRANSACTIVATION THROUGH RXR-RARalpha
  WHILE BLOCKING RXR-RARgamma. So the same molecule strips co-repressor from one subtype and preserves it on
  another, and can be turned into an ACTIVATOR of RARalpha signalling by any rexinoid tone present in the
  tissue. The authors' closing point is that accurate ligand characterisation is needed "to avoid data
  misinterpretations", and they note that the bulky groups conferring the antagonistic nature of CD2665 and
  BMS493 are structurally very different.

  FOUR - THE COMPOUND THAT SHOULD BE USED INSTEAD EXISTS, IS SELECTIVE, AND IS ALREADY FORMULATED - BY THE
  SAME LABORATORY THAT DID THE GROWTH PLATE WORK. tateiwa2022: 7C is a potent SELECTIVE RARgamma antagonist.
  SYSTEMIC 7C stimulated BMP-induced ectopic bone formation. Loaded into poly(lactic acid) nanoparticles and
  applied locally with rhBMP-2, it increased bone volume and bone shell thickness DOSE-DEPENDENTLY.
  tateiwa2024 repeated the nanoparticle result in a RAT SPINAL FUSION model, so the formulation has two
  independent in vivo skeletal runs.
  AND THE MECHANISTIC RESULT IS THE ONE williams2009 PREDICTED. 7C STIMULATED SULFATED PROTEOGLYCAN
  PRODUCTION, CHONDROGENIC MARKER GENE EXPRESSION, AND SOX9 REPORTER ACTIVITY IN BOTH CHONDROGENIC CELLS AND
  MSCs. williams2009 said aggrecan rises with RARgamma over-expression under retinoid-free conditions,
  further with the co-repressor Zac1, and that the mechanism "may involve Sox proteins". tateiwa2022
  measured a Sox9 reporter going up under a selective RARgamma antagonist, in an independent laboratory
  line, without reference to the growth plate. That is the same axis, the same output, arrived at from
  bone regeneration rather than from longitudinal growth.
  THE AUTHOR OVERLAP IS NOT A COINCIDENCE AND IS WORTH STATING: Iwamoto, Otsuru, Alferiev and Chorny appear
  on tateiwa2022, tateiwa2024, matsuoka2025 and matsuoka2025a. ONE GROUP HOLDS THE RARgamma-SELECTIVE
  ANTAGONIST, THE NANOPARTICLE CHEMISTRY, AND THE GROWTH PLATE MODEL, AND HAS NEVER PUT THE THREE TOGETHER
  WITH A LONGITUDINAL LENGTH ENDPOINT. Every published use of 7C is aimed at BMP-induced bone FORMATION or
  at protecting an injured plate; none asks whether it makes a normal bone longer.

  FIVE - WHAT THIS DOES TO THE EXPERIMENT. The four-arm design of round 258 stands but its compounds change.
  The test article should be 7C, not CD2665 and not BMS204,493 - 7C is RARgamma-selective, systemically
  active, nanoparticle-formulated for this exact tissue, and has two in vivo skeletal safety-and-efficacy
  runs behind it. CD2665 should be retained as an INFORMATIVE CONTROL rather than discarded, because its
  RARalpha behaviour is now characterised and it is the compound koyama2021 actually used, so it is the only
  way to connect a new result to the existing growth plate literature. The neutral-antagonist arm remains
  mandatory. What has changed is that the class question that motivated round 258 is answered and the
  compound question has a better answer than any of the three candidates it named.
quantitative:
- parameter: >-
    CO-REPRESSOR RELEASE BY SUBTYPE - THE MEASUREMENT THAT CLASSIFIES CD2665
  value: >-
    at RARgamma, CD2665 and AGN870 were UNABLE to dissociate SMRT while TTNPB gave major release and LE135
    partial release; at RARalpha, CD2665 alone DISSOCIATED SMRT without generating a stable coactivator
    surface
  unit: co-repressor dissociation, mammalian two-hybrid
  conditions: >-
    le2019a. Biochemical, crystallographic and cellular analysis of RXR-RAR heterodimers. Antagonism assayed
    against the full RAR agonist TTNPB at 3 nM in cells co-transfected with (17m)5x-betaGlob-Luc and
    Gal-RAR constructs; co-regulator interaction by two-hybrid; SMRT and NCoR binding assessed separately,
    with the CD2665 effect on RARalpha more pronounced for SMRT than NCoR. In the presence of an RXR
    agonist, CD2665 mediated transactivation through RXR-RARalpha heterodimers while blocking RXR-RARgamma.
    Overexpression of the coactivator RAC3 partially rescued transcriptional activity in the presence of
    CD2665, indicating the coactivator surface was not fully arrested.
  species: in_vitro_human_cell
  source_ref: le2019a
  uncertainty: >-
    "UNABLE TO DISSOCIATE SMRT" IS NOT THE SAME AS "ENHANCES SMRT BINDING". These data show CD2665 is not an
    inverse agonist at RARgamma; they do not show it is a formally neutral antagonist either, because the
    experiment reported is release rather than a basal-repression dose-response of the kind klein1996
    specified. Reporter and two-hybrid assays in transfected cells with Gal4 fusions are not the growth
    plate, basal co-repressor occupancy is promoter- and cell-context-dependent, and the paper's own thesis
    is that these compounds behave differently depending on heterodimer partner and rexinoid tone.
- parameter: >-
    THE RARgamma-SELECTIVE ANTAGONIST 7C, ITS SKELETAL EFFECTS AND ITS CHONDROGENIC OUTPUT
  value: >-
    systemic 7C stimulated BMP-induced ectopic bone formation; 7C-loaded poly(lactic acid) nanoparticles
    with rhBMP-2 increased total bone volume and bone shell thickness DOSE-DEPENDENTLY; 7C raised sulfated
    proteoglycan production, chondrogenic marker gene expression and SOX9 REPORTER ACTIVITY in chondrogenic
    cells and in MSCs
  unit: bone volume, shell thickness, proteoglycan, Sox9 reporter activity
  conditions: >-
    tateiwa2022. Collagen sponge discs absorbing rhBMP-2 implanted into the dorsal fascia of young adult
    mice to induce ectopic bone, with 7C given systemically or as 7C-loaded PLA nanoparticles locally.
    tateiwa2024 repeated the nanoparticle arm in a rat spinal fusion model.
  species: mouse
  source_ref: tateiwa2022
  uncertainty: >-
    EVERY ENDPOINT IN BOTH PAPERS IS BMP-INDUCED BONE FORMATION OR SPINAL FUSION - ECTOPIC, INDUCED
    OSTEOGENESIS, NOT LONGITUDINAL GROWTH OF A NORMAL PHYSIS. This is the same application bias round 250
    identified for hedgehog agonists and round 252 for ambrosi2025: the compound is developed by
    bone-regeneration groups whose question is never bone LENGTH. 7C's own pharmacological class - inverse
    agonist or co-repressor-preserving antagonist - is not established anywhere this atlas can reach, and
    the Sox9 and proteoglycan results are cell-culture reporters. No selectivity ratio, no IC50 and no
    structure for 7C is held here.
localization:
- 'RARgamma: where CD2665 fails to dissociate SMRT'
- 'RARalpha: where CD2665 strips SMRT and can be turned into an activator by a rexinoid'
- 'mouse ectopic BMP-induced bone and rat spinal fusion: where 7C nanoparticles have been run'
- 'normal growth plate: where no RARgamma-selective antagonist has been given with a length endpoint'
human_evidence: absent
human_evidence_note: >-
  le2019a is human cell reporter and two-hybrid work, which is molecular pharmacology rather than human
  physiology. No human has received CD2665 or 7C.
species_basis:
- in_vitro_human_cell
- mouse
