contradicts: >-
  CORRECTS round258_the_compound_class_is_settled_and_the_direction_is_proven_in_vivo ON TWO POINTS.
  FIRST, ITS SEARCH WAS BROKEN. That node states a Europe PMC full-text search pairing CD2665 with inverse
  agonist, neutral antagonist or corepressor "returns ZERO records" and concludes the compound is
  unclassifiable. The FULL_TEXT: field syntax is not supported by that endpoint and silently returns zero
  for every query, including controls. The corrected query returns 7 records and the first of them,
  le2019a, classifies CD2665 directly. CORR-267.
  SECOND, ITS REQUIREMENT WAS TOO STRICT. Round 258 held that only a formal inverse agonist would serve. In
  a retinoid-free zone the receptor is already co-repressor-bound, so repression cannot be enhanced;
  preserving SMRT occupancy while blocking agonist release is sufficient, and that is what CD2665 does at
  RARgamma. The compound is still the wrong choice, but for a different and better-evidenced reason - it is
  not subtype-selective, and at RARalpha it strips co-repressor and can be turned into an activator by any
  rexinoid tone.
