id: round235_penetration_bounded_fgfr1_reopened_and_the_two_arms_share_a_zone
name: >-
  ROUND 235 - cartilage penetration bounded at a ratio of order one from the pharmacodynamics and the
  original ask shown to be mis-specified; FGFR1's sign reopened because four rounds scored it as pure cost;
  the dose separation found sitting in the bibliography; and both stack arms expand the SAME zone
type: hypothesis
layer: L12
aliases:
- cartilage penetration bounded
- the FGFR1 benefit column
- the dose is the lever not the molecule
- both arms expand the proliferative zone
- round 235
stub: false
summary: |
  ONE - CARTILAGE PENETRATION, ANSWERED BY INFERENCE ON FOUR GROUNDS, AND THE LAST ONE SHOWS THE QUESTION
  WAS MIS-POSED.

  PHYSICOCHEMISTRY. Erdafitinib MW 446.5, XLogP 3.2, TPSA 77.3; dabogratinib 559.5, 3.6, 113; infigratinib
  560.5, 4.7, 95.1. Both TKIs are ordinary Lipinski-compliant small molecules of near-identical
  lipophilicity, neither remarkable in either direction. THE DECISIVE ROW IS VOSORITIDE - MW 4103, XLogP
  -20.6, TPSA 1820 - a 39-amino-acid peptide nine times the mass and sixteen times the polar surface area
  that is an APPROVED DRUG RAISING GROWTH VELOCITY. The size-and-polarity bar for physeal access sits far
  above anything either TKI must clear.

  THE FREE DRUG HYPOTHESIS. Cartilage interstitium sterically and electrostatically excludes albumin and,
  more so, the 44 kDa alpha-1-acid glycoprotein carrying 99.7 per cent of erdafitinib, so at steady state
  UNBOUND concentration should equilibrate across compartments. The label's PK supports real extravascular
  distribution - APPARENT VOLUME OF DISTRIBUTION 29 L, about ten times plasma volume, in a 99.7 per cent
  bound drug. THE ONE LIABILITY IS ASYMMETRIC AND IT IS ERDAFITINIB'S: the label states it IS A SUBSTRATE
  AND INHIBITOR OF P-GLYCOPROTEIN, which matters because FGFR3's kinase domain is intracellular.
  DABOGRATINIB'S TRANSPORTER STATUS IS UNKNOWN TO THIS ATLAS.

  FUNCTIONAL PROOF, WHICH BOTH HAVE. Erdafitinib produced 19.6 cm/year in a human; TYRA-300 raised nasoanal
  and tail length in WILD-TYPE C57BL/6J mice. Neither has a penetration problem that prevents it working.

  AND THE QUANTITATIVE BOUND, WHICH IS NEW. Erdafitinib at 3 mg is 1.72 times its cellular FGFR3 IC50 in
  free plasma, and round 234 established that response is ALREADY SATURATED there. Let R be the ratio of
  cartilage free to plasma free concentration; the receptor then sees 1.72R times IC50, giving 63 per cent
  occupancy at R = 1, 46 at R = 0.5, 34 at R = 0.3 and 15 AT R = 0.1. A SATURATED GROWTH RESPONSE CANNOT BE
  PRODUCED AT FIFTEEN PER CENT OCCUPANCY, SO R IS OF ORDER UNITY. That is the first quantitative statement
  about growth-plate drug exposure this atlas has, and it is a bound from pharmacodynamics rather than a
  measurement.

  THE ASK WAS MIS-SPECIFIED, AND THE FIELD'S OWN PRECEDENT SAYS SO. The Voxzogo EPAR reports 124-iodine
  vosoritide biodistribution in rats as PREDOMINANTLY STOMACH, with liver and kidney, VIRTUALLY NONE IN
  BRAIN, and cartilage and bone nowhere named as sites of accumulation - YET THE SAME DOSSIER RECORDS
  RAISED cGMP IN THE DISTAL FEMUR, and the drug is approved on growth velocity. A DRUG CAN SHOW NO
  CARTILAGE ACCUMULATION AND STILL ENGAGE THE PHYSIS. Tissue concentration is the wrong endpoint; the
  pharmacodynamic readout in the plate is the right one - and round 233 established there is no FGFR3
  pharmacodynamic marker in clinical use anywhere.

  TWO - FGFR1's SIGN, WHICH FOUR ROUNDS SCORED AS ZERO WITHOUT ASKING. Rounds 231 to 234 treated FGFR1
  coverage as pure cost. The benefit column was never opened and the atlas already held four things for it.
  ITS OWN RE-ANALYSIS OF GSE288028 puts FGFR1 in 23.2 to 43.3 PER CENT OF HUMAN GROWTH PLATE CELLS IN FOUR
  OF FOUR DONORS, which is POSTNATAL human physis and CONTRADICTS delezoide1998's fetal map of FGFR1 as
  perichondrial and non-chondrocytic - and I quoted the fetal map's implication without noting the
  disagreement. jacob2006 shows Fgfr1 deletion DELAYS HYPERTROPHIC CHONDROCYTE MATURATION, which would make
  FGFR1 blockade a HYPERTROPHIC-compartment action, A DIFFERENT HUNZIKER TERM from FGFR3's, and by round
  217's own criterion pan-FGFR coverage would then be TWO TERMS against FGFR3-selective coverage's one.
  ChEMBL, held here, has ERDAFITINIB AT 1.20 nmol/L ON FGFR1 AGAINST 3.00 ON FGFR3 - IT IS FGFR1-PREFERRING,
  engaging at every dose more of the receptor I scored as costless than of the one I credited for growth.
  And fgf19cart2025 has FGFR4 signalling impairing chondrocyte maturation, so FGFR4 inhibition should be
  PRO-growth - a second benefit term scored as zero.

  THE VERDICT DOES NOT FLIP AND MUST NOT BE FLIPPED. jacob2006 is a germline lineage deletion and CORR-046
  forbids converting it into centimetres of partial postnatal inhibition, exactly as CORR-240 refused the
  same move in the other direction. WHAT SURVIVES INTACT is that the largest human growth response on
  record came from DEBIO1347, WHICH SPARES FGFR4, so FGFR4 coverage is empirically dispensable. NOTHING
  EQUIVALENT EXONERATES DROPPING FGFR1, because no FGFR1-sparing agent has ever been given to a growing
  human. SO THE FGFR3-SELECTIVITY RECOMMENDATION NOW CARRIES AN EXPLICIT UNPRICED RISK - if the hypertrophic
  effect is real postnatally, a selective agent gives up a second Hunziker term to buy the phosphate saving.

  THREE - THE DOSE SEPARATION WAS ALREADY IN THE BIBLIOGRAPHY. Round 233 called the PROPEL dose-cohort
  breakdown the single largest possible change to this arm and asked for it. propel3_2026 was already held
  as a recorded finding: RANDOMISED PHASE 3, n = 74 AGAINST 39, ANNUALISED HEIGHT VELOCITY +1.74 cm/YEAR
  (95 per cent CI 1.31 to 2.17, P < 0.0001), NO ACCELERATED PROGRESSION OF BONE AGE, and NO EVIDENCE OF
  FGFR1 OR FGFR2 INHIBITION AT 0.25 mg/kg/DAY. AN FGFR1-COVERING MOLECULE GREW CHILDREN AT A DOSE THAT DID
  NOT CLINICALLY ENGAGE FGFR1. If that holds, THE LEVER IS THE DOSE AND NOT THE MOLECULE. Three caveats
  bound it - the FGFR1 claim rests on absence of OCULAR events rather than on serum phosphate, which is the
  marker rounds 231 to 233 established; it is achondroplasia, so RESTORATION not ELEVATION (CORR-203); and
  NOBODY HAS TESTED BELOW 1.72 TIMES IC50 IN A NORMAL PLATE, so the bottom of round 234's flat curve is
  unmapped. That last is now the highest-value open question on this arm.

  FOUR - THE STACK, AND BOTH ARMS EXPAND THE SAME ZONE. The Voxzogo EPAR's histomorphometry gives a
  dose-dependent rise in the ZONE OF MULTIPLICATION from 64.7 to 85.7 micrometres, 32 per cent, with NO OR
  ONLY SMALL CHANGES in reserve and hypertrophic zones. kot2026 has an FGFR inhibitor lengthening the plate
  in both sexes SPECIFICALLY IN THE PROLIFERATIVE ZONE. And the EPAR's own figure legend says vosoritide
  INHIBITS FGFR3 DOWNSTREAM SIGNALLING AT THE LEVEL OF RAF1. SAME NODE, SAME ZONE - and round 217's
  criterion says same-term agents do not multiply. Round 234 sharpens it: with FGFR3 saturated at 1.72x,
  CNP's RAF1-directed contribution is added to a node already maximally suppressed from that direction.

  THREE THINGS RESCUE THE CNP ARM PARTIALLY AND MUST BE STATED. CNP inhibits RAF1 REGARDLESS OF UPSTREAM
  SOURCE, so it still suppresses tone from FGFR1, IGF1R and others that FGFR3 blockade leaves. NPR2 GAIN OF
  FUNCTION MAKES HUMANS TALL - an ELEVATION phenotype above normal stature that the FGFR3 arm's human
  evidence entirely lacks. And both zone datasets are MOUSE, one in a dysplasia model with a disordered
  baseline.

  AND THE REST OF THE STACK UNDER SATURATION. GROWTH HORMONE - the only human FGFR-plus-GH datum is
  erdaseries2025 patient 1, on GH at a stable dose for seven years before erdafitinib, who then grew 19.6
  cm/year; GH cannot have caused a spurt that began with the drug, but the combination was tolerated at the
  highest velocity recorded, and it is one patient. ANASTROZOLE IS PROMOTED FROM SUPPLEMENTARY TO
  LOAD-BEARING - under saturation the only lever is DURATION, the two things that end exposure are
  discontinuation and FUSION, and anastrozole is the only agent in the stack acting on the second. It also
  bears on kot2026's unfollowed mouse finding of ELEVATED SERUM TESTOSTERONE in treated males. AND THE
  COMPOUNDING MECHANICAL HAZARD IS REAL - the stack now contains three agents that each widen or weaken the
  physis, the FGFR arm and the CNP arm through the same proliferative-zone expansion and growth hormone as
  an established SCFE risk factor in its own right. NOBODY HAS GIVEN THESE TOGETHER AND THE FAILURE MODE
  THEY SHARE IS MECHANICAL.
quantitative:
- parameter: the cartilage-to-plasma free concentration ratio for erdafitinib, bounded from pharmacodynamics
  value: >-
    erdafitinib at 3 mg gives free steady-state 1.72 times its Ba/F3 cellular FGFR3 IC50 and the growth
    response is already SATURATED there (19.6 cm/year against 19.1 at 4.01 times). With R the
    cartilage-to-plasma free ratio, the receptor sees 1.72R times IC50 and mass-action occupancy is 63.2 per
    cent at R = 1, 46.2 at R = 0.5, 34.0 at R = 0.3, 14.7 AT R = 0.1 and 4.9 at R = 0.03. A SATURATED
    RESPONSE IS NOT PRODUCIBLE AT 15 PER CENT OCCUPANCY, SO R IS OF ORDER UNITY
  unit: dimensionless ratio of unbound concentrations, and per cent receptor occupancy
  conditions: computed in atlas/tools/round235_penetration_fgfr1_sign_and_the_stack.py from round 213's
    free-coverage table and round 228's unspliced velocities
  species: human
  source_ref: balversa_label_2025
  uncertainty: >-
    A BOUND FROM PHARMACODYNAMICS, NOT A MEASUREMENT, and it inherits every assumption in the
    free-concentration table including erdafitinib's 0.3 per cent unbound fraction and a Ba/F3
    transfected-cell IC50 standing in for a chondrocyte. It also assumes simple mass-action occupancy with
    Hill 1 and that the growth response is monotone in occupancy. IT SAYS NOTHING ABOUT DABOGRATINIB, whose
    equivalent bound cannot be computed because no human with a normal FGFR3 has been given it and measured
  value_unverified: true
- parameter: physicochemistry of the four agents, and the vosoritide benchmark
  value: >-
    erdafitinib MW 446.5, XLogP 3.2, TPSA 77.3, HBD 1, HBA 7. Dabogratinib MW 559.5, XLogP 3.6, TPSA 113,
    HBD 1, HBA 8. Infigratinib MW 560.5, XLogP 4.7, TPSA 95.1, HBD 2, HBA 8. VOSORITIDE MW 4103, XLogP
    -20.6, TPSA 1820, HBD 61, HBA 64 - and vosoritide is an approved drug that raises growth velocity.
    Erdafitinib apparent volume of distribution 29 L at 99.7 per cent protein binding, and it is a SUBSTRATE
    AND INHIBITOR OF P-GLYCOPROTEIN
  unit: g/mol, logP, square angstroms, litres
  conditions: PubChem computed properties; PK and transporter status from the BALVERSA label section 12.3
  species: not_applicable
  source_ref: balversa_label_2025
  uncertainty: >-
    XLogP AND TPSA ARE COMPUTED DESCRIPTORS, NOT MEASUREMENTS, and neither predicts cartilage partition
    directly - they establish only that both TKIs are unremarkable small molecules. The vosoritide
    comparison is an argument about the PERMISSIVENESS of the physeal barrier, not about equivalence of
    mechanism or route. Dabogratinib's protein binding and transporter status are both unknown here
- parameter: FGFR1 in the human growth plate - two datasets that disagree, and the potency that was missed
  value: >-
    delezoide1998, human EMBRYO-FETAL in situ hybridisation - FGFR3 mainly in mature growth plate
    chondrocytes, FGFR1 and FGFR2 RESTRICTED TO PERICHONDRIUM AND PERIOSTEUM. Against that, this atlas's
    own re-analysis of GSE288028 - FGFR1 DETECTED IN 23.2 TO 43.3 PER CENT OF HUMAN GROWTH PLATE CELLS IN
    FOUR OF FOUR DONORS, which is POSTNATAL. jacob2006 - Fgfr1 deletion in the osteo-chondrogenic lineage
    DELAYS HYPERTROPHIC CHONDROCYTE MATURATION. ChEMBL - ERDAFITINIB FGFR1 1.20 nmol/L AGAINST FGFR3 3.00,
    so it is FGFR1-PREFERRING
  unit: per cent of cells, and nmol/L
  conditions: one fetal human ISH study, one postnatal human single-cell re-analysis, one mouse conditional
    deletion, and a kinase panel
  species: human
  source_ref: delezoide1998
  uncertainty: >-
    THE TWO HUMAN EXPRESSION DATASETS DISAGREE AND ONE OF THEM IS WRONG FOR THE TISSUE THAT MATTERS - fetal
    ISH against postnatal single-cell, different methods, different developmental stages, and CORR-114's
    platform caution applies to the transcript-detection side. jacob2006 is GERMLINE AND LINEAGE-WIDE, which
    CORR-046 forbids converting into partial postnatal inhibition. The ChEMBL potencies are a different
    assay from the Ba/F3 cellular values used in round 234 and the two should not be mixed within one
    calculation
- parameter: both stack arms expand the proliferative zone and neither moves the hypertrophic zone
  value: >-
    VOSORITIDE, achondroplasia mouse growth plate histomorphometry - dose-dependent increase in the ZONE OF
    MULTIPLICATION from 64.7 micrometres on vehicle to 85.7 at high dose, a rise of 32 per cent, with NO OR
    ONLY SMALL CHANGES in the zone of reserve cartilage and the zone of hypertrophy. AN FGFR INHIBITOR,
    kot2026 - growth plate lengthened in BOTH SEXES and SPECIFICALLY IN THE PROLIFERATIVE ZONE, with reduced
    phospho-ERK1/2 and SOX9 in lower hypertrophic chondrocytes. The Voxzogo dossier states the shared
    mechanism itself - vosoritide INHIBITS FGFR3 DOWNSTREAM SIGNALLING AT THE LEVEL OF RAF1
  unit: micrometres of zone height, and which zone moved
  conditions: two mouse growth plates from two regulatory or peer-reviewed dossiers
  species: mouse
  source_ref: ema_voxzogo_epar_2021
  uncertainty: >-
    BOTH ARE MOUSE AND ONE IS A DYSPLASIA MODEL where the baseline architecture is disordered, so a zone
    that is abnormally thin has more room to move. CORR-189, CORR-190 and CORR-197 all bear here - A ZONE
    HEIGHT IS NOT A TERM OF THE HUNZIKER IDENTITY, because it is cells per column times cell height PLUS
    matrix, and no agent may be assigned a term from a zone height. The convergence is suggestive of
    same-term action and does not establish it
localization:
- 'the chondrocyte cytosol, which the drug must enter and from which P-glycoprotein would pump it'
- 'the proliferative zone, which both arms of this stack expand and neither arm expands alone'
human_evidence: indirect
human_evidence_note: >-
  The penetration bound and the potency and expression data are human; the zone-resolved architecture and
  the FGFR1 functional deletion are mouse and are labelled as such throughout.
species_basis:
- human
- mouse
translation_risk: moderate
translation_risk_reason: >-
  The two load-bearing new claims rest on mouse zone histomorphometry and a mouse lineage deletion. The
  penetration bound is human but is derived rather than measured.
confidence: C
claim_grades:
- claim: cartilage penetration is a differentiator between erdafitinib and an FGFR3-selective agent
  grade: E
  basis: >-
    NOT SUPPORTED AND PROBABLY THE WRONG QUESTION. Both are unremarkable small molecules far below the
    size-polarity bar that vosoritide clears; both are functionally proven to act on a growth plate; and the
    pharmacodynamic bound puts erdafitinib's cartilage-to-plasma free ratio at order unity. THE ONE
    ASYMMETRY IS THAT ERDAFITINIB IS A P-GLYCOPROTEIN SUBSTRATE AND DABOGRATINIB'S STATUS IS UNKNOWN
- claim: measuring cartilage drug concentration would settle physeal target engagement
  grade: X
  basis: >-
    FALSE, AND THE FIELD'S OWN APPROVED DRUG DISPROVES IT. Vosoritide shows no cartilage or bone
    accumulation on 124-iodine biodistribution - predominantly stomach, liver and kidney - yet raises cGMP
    in the distal femur and is licensed on growth velocity. The pharmacodynamic readout is the endpoint,
    not the tissue concentration
- claim: FGFR1 coverage contributes nothing to height, so dropping it is free
  grade: E
  basis: >-
    ASSERTED BY ROUNDS 231 TO 234 WITHOUT OPENING THE BENEFIT COLUMN, and the atlas already held four items
    against it - postnatal human FGFR1 expression in 23 to 43 per cent of growth plate cells contradicting
    the fetal map, a mouse deletion delaying hypertrophic maturation, erdafitinib being FGFR1-PREFERRING at
    1.20 against 3.00 nmol/L, and FGFR4 inhibition predicted pro-growth. The sign is UNRESOLVED, not zero
- claim: FGFR1 inhibition adds height by acting on the hypertrophic compartment
  grade: E
  basis: >-
    EQUALLY UNSUPPORTED AND DELIBERATELY NOT ASSERTED - this is the receptor ledger rebuilt from the benefit
    side. jacob2006 is germline and lineage-wide; the human genetics of round 232 runs the other way; and
    CORR-046's first reason forbids the conversion in both directions
- claim: the lever on this arm is the molecule
  grade: D
  basis: >-
    WEAKENED THIS ROUND. propel3_2026 grew children by +1.74 cm/year in a randomised trial with an
    FGFR1-covering agent at a dose showing no clinical evidence of FGFR1 inhibition, which suggests the
    lever is the DOSE. Bounded by the FGFR1 claim resting on ocular events rather than phosphate, by
    achondroplasia being restoration rather than elevation, and by nobody having tested below 1.72 times
    IC50 in a normal plate
- claim: the CNP arm and the FGFR arm act on different terms and therefore multiply
  grade: E
  basis: >-
    AT RISK. Both expand the PROLIFERATIVE zone and neither moves the hypertrophic zone in the only two
    zone-resolved datasets, and vosoritide's stated mechanism is inhibition of FGFR3 signalling at RAF1 -
    the same node. Partially rescued by CNP suppressing RAF1 from non-FGFR3 sources and by NPR2 gain of
    function producing genuine tall stature in humans. Both zone datasets are mouse
