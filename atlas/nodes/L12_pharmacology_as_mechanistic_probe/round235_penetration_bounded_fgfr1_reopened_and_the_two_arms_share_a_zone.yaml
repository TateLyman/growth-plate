contradicts:
- >-
  ROUNDS 231 TO 234's treatment of FGFR1 coverage as pure cost with no benefit term. The atlas already held
  four items for the benefit column and none was consulted. Recorded as CORR-243.
- >-
  ROUND 233's ask list, which requested the PROPEL dose-cohort data while propel3_2026 sat in the
  bibliography with the randomised effect size, the bone-age statement and the FGFR1 statement in its
  recorded finding. Recorded as CORR-244.
- >-
  The framing of cartilage penetration as a tissue-concentration question. Vosoritide shows no cartilage
  accumulation on biodistribution and engages the physis anyway, so the endpoint is pharmacodynamic.
- >-
  The stack's assumption that the CNP arm and the FGFR arm multiply. Both expand the proliferative zone
  only, and vosoritide's stated mechanism is inhibition of FGFR3 signalling at RAF1 - the same node.
