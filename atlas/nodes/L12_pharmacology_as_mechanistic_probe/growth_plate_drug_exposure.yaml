id: growth_plate_drug_exposure
name: Drug exposure at the growth plate
aliases:
- plate pharmacokinetics
- cartilage drug penetration
- target tissue exposure
type: process
layer: L12
stub: false
summary: 'Not one of the twelve audited growth-promoting agents has a published growth plate tissue concentration
  in any species. Every dose-selection rationale in this field therefore rests on plasma exposure as a
  surrogate for exposure at an avascular, alymphatic, diffusion-limited tissue, and the validity of that
  surrogate has never been measured for any of them. This is not a limitation of technique. The drug-delivery
  literature measures growth-plate accumulation routinely: chondrocyte-membrane-coated nanoparticles bearing
  the collagen-II-binding peptide WYRGRL demonstrably delivered purmorphamine into growth plate cartilage
  in a hypochondroplasia mouse model, and a collagen-binding-domain CNP fusion was shown to localise to
  cartilage in fetal murine tibiae. Both papers open by naming the avascular and alymphatic character
  of the plate as the delivery problem they exist to solve. So the measurement is feasible, is being done,
  and is simply not being done for the approved therapeutics at clinical doses. That makes this an unasked
  question rather than a blocked one - a materially more damning position, because nothing but attention
  is missing. The same delivery literature independently names hypotension as the liability of systemic
  CNP distribution, which is direct support for the tolerability-cap hypothesis competing to explain the
  exposure-duration observation.'
quantitative:
- parameter: agents in layer L12 with a published growth plate tissue concentration measurement
  value: '0'
  unit: agents out of 12 audited
  conditions: audit of vosoritide, navepegritide, infigratinib, recifercept, meclizine, rhGH, lonapegsomatropin,
    mecasermin, teriparatide, methotrexate, glucocorticoids and bisphosphonates against Europe PMC, FDA
    labels and ClinicalTrials.gov, 2026-08-05
  species: multiple
  source_ref: matsuoka2025
  uncertainty: absence established by search - see gap g_l12b_002 search log
- parameter: vosoritide plasma half-life used as the exposure surrogate
  value: 21.0-27.9
  unit: minutes
  conditions: FDA label, 15 ug/kg/day, children with achondroplasia; no corresponding tissue value exists
  species: human
  source_ref: fda_voxzogo_label_2025
  uncertainty: SD 4.7-9.9 min
- parameter: navepegritide-released CNP plasma half-life used as the exposure surrogate
  value: '5.3'
  unit: days
  conditions: FDA label, 0.1 mg/kg/week; no corresponding tissue value exists
  species: human
  source_ref: fda_yuviwel_label_2026
  uncertainty: model-derived mean
localization:
- 'human growth plate: avascular, diffusion-fed from epiphyseal and metaphyseal vascular fronts; no measured
  drug concentration-versus-depth profile for any agent'
- 'human metaphysis: bisphosphonate deposition at the mineralising front is radiographically visible,
  the only routine human image of drug arrival at the plate'
human_evidence: absent
human_evidence_note: No human study reports a drug concentration measured within growth plate cartilage;
  all human exposure data in this layer are plasma.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: Rodent growth plates are thin enough that diffusion limitation may be negligible,
  so even a positive animal delivery result would not transfer to the much thicker human plate. Any measurement
  that matters has to be made in a large-animal or human plate.
confidence: B
claim_grades:
- claim: No approved or investigational growth-promoting agent has a published growth plate tissue concentration
    in any species.
  grade: B
  basis: Systematic audit of 12 agents plus three targeted follow-up searches; a null established by search,
    not assumed.
- claim: Measuring drug concentration in growth plate cartilage is technically feasible and is performed
    in the drug-delivery literature.
  grade: C
  basis: Two independent 2026 mouse studies demonstrate targeted delivery into growth plate / cartilage
    with localisation readouts.
- claim: Plasma exposure is therefore an unvalidated surrogate for exposure at the growth plate.
  grade: B
  basis: Follows from the two claims above; the surrogate is universally used and its validity is unmeasured.
