contradicts: >-
  This round corrects round 302 on two points and neither is cosmetic. FIRST, round 302's single stated gap -
  "no tankyrase inhibitor has a bone-length endpoint in any species" - was true of inhibitors and concealed
  that the GENETIC length endpoint existed in an operator-supplied dataset in this repository; the answer,
  when queried, is no lengthening and a nominally shorter tibia. SECOND, round 302 called basroparib's safety
  profile favourable on the strength of "no dose-limiting toxicities"; the full record includes grade 3
  pancreatitis with grade 4 lipase and amylase, grade 4 hypercalcaemia, and 10.6 kg of mean weight loss at the
  MTD. The hypothesis is NOT withdrawn - the direction is validated from the opposite side by Axin2-het at
  P=9e-05 and the bone worry is answered at the pathway's central node by Ctnnb1-het - but it drops from
  confidence B to C, and the newly surfaced abnormal VERTEBRAL morphology in Tnks-null is pointed at exactly
  the compartment this case depends on.
