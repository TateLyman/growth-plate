id: round250_systemic_sag_proven_and_unproven_and_the_gate_is_flux_not_safety
name: >-
  ROUND 250 - systemic SAG audited term by term, and the real gate is not safety. IT IS FLUX. The atlas
  already showed in round 201 that mTORC1-on and short-course hedgehog agonism produce THE SAME SHAPE - a
  bigger pool that does not discharge - and the one direct manipulation of division MODE changed recruitment
  NOT AT ALL, which is exactly what round 247's algebra predicted
type: hypothesis
layer: L12
aliases:
- systemic SAG audited
- the gate is flux
- pool without flux
- the agonist chemical space is osteogenic by selection
- round 250
stub: false
summary: |
  THE INSTRUCTION WAS THAT SYSTEMIC SAG SHOULD STAY ON THE TABLE IF RISK IS NOT INSANE, AND THAT THE REAL
  ISSUE IS PROVING EVERYTHING. AUDITED PROPERLY, THE BINDING CONSTRAINT TURNS OUT NOT TO BE RISK AT ALL.

  ONE - WHAT SYSTEMIC SAG HAS ACTUALLY PROVEN. Dose and schedule, from the Methods: SAG (Tocris 4366) 25
  MICROGRAMS PER GRAM BODY WEIGHT, INTRAPERITONEAL, ONCE DAILY, either P10-P16 or P31-P37.

  AFTER NICHE FORMATION IT WORKS ON THE POOL. In Pthrp-creER R26R-tdTomato mice traced P25-P38, DMSO n = 6
  versus SAG n = 5, 351 cells in 206 clones against 596 cells in 348 clones: SINGLE-CELL CLONES DOWN,
  DOUBLETS AND TRIPLETS UP, LARGE CLONES UP, Ki67 UP. In Pthrp-mCherry mice dosed P30-P36 the stem cell
  count rose 61 PER CENT by P38. Proliferation in the PROLIFERATIVE ZONE was unaffected at either age, and
  so was the DIRECTION of cell division.

  WHAT IT HAS NOT PROVEN, AND THE SECOND ITEM IS THE ONE THAT MATTERS. NO LENGTH - tibia 15.2 +/- 0.4 versus
  14.5 +/- 1.7, P = 0.29; femur 12.7 +/- 0.4 versus 14.8 +/- 4.7, P = 0.247, n = 7/5. The atlas has read
  that null as a TIMING ARTEFACT because length was measured two days after a seven-day exposure and an
  expanded pool cannot appear as length until it is spent, which the bead time-course shows takes months.
  THAT READING IS DEFENSIBLE AND IT IS STILL AN ASSUMPTION. AND NO SAFETY DATA - the paper reports no
  toxicology, no body-weight series, no organ assessment.

  AND THERE IS A DEMONSTRATED HARMFUL WINDOW THAT MUST NOT BE SOFTENED. The SAME systemic dose given P10-P16
  REDUCED clone size, REDUCED proliferation in the uppermost 50 microns, and REDUCED Tomato+ cells (n = 3/3).
  The authors' own explanation is that this "might be due to the NEGATIVE SYSTEMIC EFFECTS of the latter at
  an early age, though further investigation would be needed." SO SYSTEMIC SAG HAS A KNOWN AGE AT WHICH IT
  HURTS THE VERY POPULATION IT IS MEANT TO EXPAND, AND THE MECHANISM OF THAT HARM IS UNSTUDIED. For a case
  at bone age 16 the relevant window is the late one, which is the favourable one - but 'the harm is in a
  window we are not in' is an argument that requires the window boundary to be known in humans, and it is
  not.

  TWO - AND NOW THE PART THAT REORDERS THE PROBLEM. THE ATLAS ALREADY ESTABLISHED, IN ROUND 201, THAT THE
  POOL AND THE OUTPUT ARE DECOUPLED IN BOTH OF THE INTERVENTIONS THAT RAISE THE POOL.

  newton2019 ablated Tsc1 to drive constitutive mTORC1 in the resting zone: CD73 ZONE HEIGHT UP
  (P = 0.0025), CLONE SIZE UP (P = 0.0342), EdU-POSITIVE EPIPHYSEAL STEM CELLS 24.7 TO 62.4 (P = 0.014), AND
  PAR3 SHIFTED TOWARD SYMMETRIC DIVISION - with, in the paper's own words, NEITHER PROLIFERATION OF
  CHONDROPROGENITORS NOR THEIR RECRUITMENT INTO THE PROLIFERATIVE LAYER CHANGED DETECTABLY, and a DISORDERED
  RESTING ZONE EXPRESSING NO ColX AND NO Ihh.

  ROUND 201 PUT THAT BESIDE trompet2024's INTRA-ARTICULAR ARM - Pthrp-tdTomato+ cells 65.5 to 139.8 per
  square mm, entirely within the resting zone, with no change in proliferation - AND CALLED THEM THE SAME
  SHAPE: POOL WITHOUT FLUX. It named the missing term using rodgers2014, in which mTORC1 is necessary and
  sufficient for quiescent stem cells to leave G0 for G(ALERT) - a PRIMED state that is NOT yet division,
  requiring a second signal, with cMet also required.

  SO THE TWO LEVERS THAT RAISE N ARE BOTH ALERTING SIGNALS, AND ALERTING IS NOT DISCHARGE.

  THREE - THIS IS ALSO AN UNEXPECTED CONFIRMATION OF ROUND 247'S ALGEBRA, FROM THE ONE EXPERIMENT THAT
  DIRECTLY MEASURED THE VARIABLE. Round 247 derived that committed output is exactly one cell per stem
  division FOR EVERY VALUE of the self-renewal fraction, because the r terms cancel - so shifting the
  division mode should change dispersion and not output. newton2019 SHIFTED PAR3 TOWARD SYMMETRIC DIVISION,
  MEASURED IT DIRECTLY, AND FOUND RECRUITMENT INTO THE PROLIFERATIVE LAYER UNCHANGED. That is the prediction,
  tested by an experiment that predates it, on the exact parameter.

  IT ALSO EXPLAINS WHY THE Tsc1 PHENOTYPE IS DISORDER RATHER THAN LENGTH. A pool enlarged by shifting r
  toward symmetric renewal, with no change in the rate at which cells leave, has nowhere to go. The
  disordered resting zone expressing no ColX and no Ihh is what a compartment that has been told to renew
  and not told to discharge looks like.

  FOUR - THE COMPOUND MAP, AND IT HAS A SYSTEMATIC BIAS RATHER THAN FOUR SEPARATE DISAPPOINTMENTS.

  - SAG. Reference agonist, ciliary, the only Smoothened agonist with a growth plate pool result and the
    only one with a bone-length endpoint. Systemic rodent dosing exists outside the skeletal field -
    nguyen2021 gave it systemically to neonatal rats for stroke neuroprotection.
  - PURMORPHAMINE. The payload in ye2026's growth-plate-targeting nanoparticle.
  - GSA-10. A genuinely distinct chemotype - a quinolinecarboxamide acting at a NOVEL Smo site that DOES NOT
    recognise the bodipy-cyclopamine site, blocked by MRT-83, SANT-1, LDE225 and M25 at nanomolar and by
    GDC-0449 at micromolar but NOT by cyclopamine, and NOTABLY NOT TARGETED TO THE PRIMARY CILIUM.
  - THE (1H)-QUINOLONE SERIES. Same chemistry, explicitly built as OSTEOGENIC compounds.
  - OXYSTEROLS AND Oxy133. Withdrawn in round 249 for osteogenic selection.

  TWO THINGS DISQUALIFY THE NEW CHEMOTYPE AND THE SECOND IS MECHANISTIC. GSA-10 was characterised
  specifically as ACTING AT SMO TO PROMOTE DIFFERENTIATION OF MULTIPOTENT MESENCHYMAL PROGENITORS INTO
  OSTEOBLASTS - the same osteogenic selection that killed the oxysterols, and the same fate orikasa2024
  observed when hedgehog was activated in PTHrP+ resting chondrocytes, whose descendants converted to
  trabecular osteoblasts with transient hyperplasia and no length gain. AND IT IS NOT CILIUM-TARGETED, WHILE
  CHONDROCYTE HEDGEHOG SIGNALLING IS CILIUM-DEPENDENT - ye2026's whole rescue ran through restored
  ciliogenesis. A non-ciliary Smo agonist may not reproduce the chondrocyte effect at all.

  THE PATTERN IS THE FINDING. EVERY DELIVERABLE SMOOTHENED-AGONIST CHEMOTYPE WAS BUILT BY BONE OR
  REGENERATIVE-MEDICINE GROUPS SELECTING FOR OSTEOGENESIS. That is not four independent failures; it is one
  bias in who wrote the chemistry, and it points exactly the wrong way for a resting-zone intervention in
  which osteogenic conversion is the named failure mode.

  FIVE - WHERE THE SEARCH SHOULD GO NEXT, WHICH IS NOT WHERE I WAS TAKING IT. I have been treating the
  problem as 'find a deliverable Smoothened agonist'. THE ROUND 201 RESULT SAYS THAT IS THE WRONG QUESTION,
  BECAUSE BOTH AVAILABLE POOL LEVERS PRODUCE POOL WITHOUT FLUX AND THE ONE INTERVENTION THAT PRODUCED LENGTH
  DID SO OVER MONTHS WHILE MOVING THREE TERMS AT ONCE.

  THE QUESTION IS WHAT SUPPLIES THE SECOND SIGNAL. rodgers2014 names cMet alongside mTORC1 for G(Alert) in
  muscle. Nobody has asked what the growth plate's equivalent is, or whether the bead worked simply because
  SUSTAINED exposure lets the alerted pool be drawn down by the ordinary flux the plate already has.
  DURATION MAY BE THE SECOND SIGNAL, and that is a testable and cheap distinction: the same total SAG
  exposure delivered as three injections versus as a slow-release depot, read out as bone length rather than
  as cell counts.

  THAT IS ALSO THE CHEAPEST WAY TO RESOLVE THE SYSTEMIC QUESTION THE INSTRUCTION ASKED ABOUT. Systemic SAG
  has already produced a 61 per cent pool rise; what it has never had is a length readout at a time when the
  pool could have been spent. THE MISSING EXPERIMENT IS NOT A NEW MOLECULE. IT IS THE EXISTING MOLECULE,
  SYSTEMICALLY, READ OUT AT THREE TO SIX MONTHS INSTEAD OF TWO DAYS.
quantitative:
- parameter: >-
    systemic SAG dose and schedule, and what it does to the stem compartment after niche formation
  value: >-
    '25 micrograms per gram body weight, intraperitoneal, once daily, P31-P37 (or P10-P16 for the early
    arm). After the niche: single-cell clones DOWN, doublets and triplets UP, large clones UP, Ki67 UP
    (DMSO n = 6 versus SAG n = 5; 351 cells in 206 clones versus 596 cells in 348 clones); Pthrp-mCherry+
    cells +61 per cent by P38. Proliferative-zone proliferation and division DIRECTION unaffected at both
    ages'
  unit: dose, and clone-size distribution and cell counts
  conditions: mouse, Pthrp-creER R26R-tdTomato and Pthrp-mCherry lines
  species: mouse
  source_ref: trompet2024
  uncertainty: >-
    no toxicology, no body-weight series and no organ assessment are reported anywhere in the paper. And 25
    micrograms per gram is a large daily systemic exposure with no dose-ranging
- parameter: >-
    the same systemic dose given BEFORE niche formation HARMS the population it is meant to expand, and the
    authors attribute it to systemic effects
  value: 'P10-P16 dosing REDUCED clone size, REDUCED proliferation in the uppermost 50 microns, and REDUCED
    Tomato+ cells within that region, n = 3/3 mice'
  unit: clone size and cell counts, SAG versus DMSO
  conditions: mouse, systemic i.p. SAG at 25 micrograms per gram daily
  species: mouse
  source_ref: trompet2024
  uncertainty: >-
    n = 3 per group. The authors write the effect "might be due to the negative systemic effects of the
    latter at an early age, though further investigation would be needed" - so the mechanism of the harm is
    explicitly unstudied, and the window boundary is unknown in any species other than mouse
- parameter: >-
    shifting the division MODE toward symmetric renewal enlarges the pool and changes recruitment NOT AT
    ALL - the direct test of round 247's algebra, by an experiment that predates it
  value: >-
    'Tsc1 ablation: CD73 zone height UP (P = 0.0025), clone size UP (P = 0.0342), EdU+ epiphyseal stem cells
    24.7 to 62.4 (P = 0.014), PAR3 shifted toward SYMMETRIC division - and neither proliferation of
    chondroprogenitors nor their RECRUITMENT into the proliferative layer changed detectably, with a
    disordered resting zone expressing NO ColX and NO Ihh'
  unit: zone height, clone size, EdU-positive cells, and PAR3 orientation
  conditions: conditional Tsc1 ablation in Col2a1-expressing chondrocytes, mouse, after SOC formation
  species: mouse
  source_ref: newton2019
  uncertainty: >-
    Col2a1-Cre is whole-cartilage and constitutive mTORC1 activation is a lesion rather than a dose, so this
    is not a model of a drug. What it does establish is that the r parameter can be moved, measured, and
    still leave output unchanged
- parameter: >-
    GSA-10 is a second, structurally distinct Smoothened agonist chemotype - and it carries the same
    osteogenic selection plus a mechanistic problem of its own
  value: >-
    'quinolinecarboxamide acting at a NOVEL Smo site; does NOT recognise the bodipy-cyclopamine site;
    blocked by MRT-83, SANT-1, LDE225 and M25 at nanomolar and GDC-0449 at micromolar but NOT by
    cyclopamine; NOT targeted to the primary cilium; characterised as promoting differentiation of
    multipotent mesenchymal progenitors into OSTEOBLASTS'
  unit: pharmacological characterisation
  conditions: cell-based Smo assays and mesenchymal progenitor differentiation
  species: in_vitro_animal_cell
  source_ref: gorojankina2013
  uncertainty: >-
    no growth plate, no chondrocyte and no length endpoint. The non-ciliary action is a specific problem
    because chondrocyte hedgehog signalling is cilium-dependent, which is the axis ye2026's rescue ran
    through
localization:
- 'mouse resting zone: where both the systemic SAG pool effect and the Tsc1 pool effect are confined, and
  where neither produced a change in recruitment into the proliferative layer'
human_evidence: absent
human_evidence_note: >-
  No human hedgehog agonist exposure of any kind. The only human anchor on this axis remains robinson2017a,
  growth arrest in three children on the ANTAGONIST vismodegib.
species_basis:
- mouse
- in_vitro_animal_cell
translation_risk: high
translation_risk_reason: >-
  Every result is mouse, the favourable window is defined by a mouse developmental landmark whose human
  equivalent is unmapped, the harmful window is real and its mechanism unstudied, and no systemic
  Smoothened-agonist exposure in any human exists.
confidence: C
confidence_reason: >-
  The systemic pool effect and the Tsc1 result are each single well-controlled studies with directly
  measured parameters, which is C. The claim that pool and flux are decoupled rests on two experiments read
  together plus a mechanistic frame borrowed from muscle, which is why the conclusion is stated as a
  constraint on interpretation rather than as an established property of the growth plate.
