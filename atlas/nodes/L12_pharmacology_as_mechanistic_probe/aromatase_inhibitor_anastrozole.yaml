id: aromatase_inhibitor_anastrozole
name: Anastrozole
aliases: [Arimidex, third-generation aromatase inhibitor]
type: intervention
layer: L12
stub: false
summary: |
  Anastrozole is a non-steroidal aromatase inhibitor used off-label in boys and in
  congenital adrenal hyperplasia to reduce oestrogen-driven skeletal maturation. Compared
  head to head with letrozole over 3 years in 79 pubertal boys with idiopathic short
  stature it produced smaller deviations in testosterone, oestradiol, IGF-1, growth
  velocity and bone age advance - that is, a weaker biochemical effect - yet there was no
  difference between the drugs in change in predicted adult height, and the combined
  3-year gain was only +1.3 cm. The dissociation is the point: a threefold difference in
  the intensity of oestrogen suppression bought no additional predicted height, which
  argues that oestrogen suppression is not the rate-limiting variable for height gain in
  this population. In two settings anastrozole does have attained-height data. In
  propensity-matched ISS boys with bone age >=13 y, anastrozole plus rhGH gave the highest
  target-height-adjusted adult height SDS of three regimens (0.81 +/- 0.34 versus 0.60 for
  letrozole+rhGH and 0.48 for GnRHa+rhGH). And in 21-hydroxylase-deficiency congenital
  adrenal hyperplasia, where androgen excess drives premature fusion, anastrozole improved
  height outcomes in growing children.
quantitative:
  - parameter: adult height SDS adjusted for target height, anastrozole plus rhGH
    value: '0.81'
    unit: SDS
    conditions: >-
      propensity-score-matched cohort, 32 boys, ISS with bone age >=13 y, followed to adult
      height; highest of three matched regimens, p<0.01 versus letrozole+rhGH and GnRHa+rhGH
    species: human
    source_ref: cui2025
    uncertainty: SD 0.34
  - parameter: gain in predicted adult height over 3 years, anastrozole arm
    value: '+1.3'
    unit: cm
    conditions: combined estimate across anastrozole (n=35) and letrozole (n=30) arms; no between-group difference in change in predicted adult height
    species: human
    source_ref: zegarra2024
    uncertainty: p=0.043 for the combined estimate
  - parameter: dose used in the randomised trial
    value: '1.0'
    unit: mg/day
    conditions: oral, pubertal boys >=10 y, up to 3 years
    species: human
    source_ref: zegarra2024
    uncertainty: single dose level
localization:
  - "human growth plate: acts by lowering oestrogen available for the fusion programme; no plate-level measurement in treated children"
human_evidence: direct
human_evidence_note: >-
  Randomised head-to-head trial against letrozole with predicted adult height as primary
  outcome, plus attained-height cohorts in ISS and in congenital adrenal hyperplasia.
species_basis: [human]
translation_risk: low
translation_risk_reason: >-
  All evidence is human interventional or matched-cohort. The chief limitation is that the
  randomised evidence uses predicted rather than attained adult height.
confidence: A
claim_grades:
  - claim: Anastrozole suppresses oestradiol and slows bone age advance less than letrozole at conventional doses.
    grade: A
    basis: Randomised head-to-head trial with annual hormone and bone age data, n=79.
  - claim: The weaker oestrogen suppression yields no less predicted-adult-height gain.
    grade: B
    basis: Same trial reports no between-group difference in change in predicted adult height; a null within a small trial, so not a strong equivalence claim.
  - claim: Anastrozole plus rhGH improves attained adult height in ISS boys with advanced bone age.
    grade: C
    basis: Single-centre propensity-matched cohort, 32 per arm, not randomised.
  - claim: Anastrozole improves height outcomes in 21-hydroxylase-deficiency CAH.
    grade: B
    basis: Dedicated clinical study in growing children with CAH; single report.
