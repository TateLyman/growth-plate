id: the_yield_candidate_intermittent_pth1r_agonism
name: THE YIELD CANDIDATE - intermittent PTH1R agonism, abaloparatide over teriparatide, and the Jansen
  objection dissolves into the reason the dosing schedule IS the drug
aliases:
- the best yield candidate
- intermittent PTH for amplification
- abaloparatide growth plate
- charge and discharge in one agent
- round 184
type: intervention
layer: L12
stub: false
summary: 'THE PROGRAMME ASKED FOR THE BEST AVAILABLE CANDIDATE TO RAISE YIELD. IT IS INTERMITTENT PTH1R
  AGONISM, AND ABALOPARATIDE IS THE BETTER OF THE TWO APPROVED MOLECULES. Four things put it ahead of
  everything else this atlas has examined, and one thing is missing that must be stated before any of them.

  WHAT IS MISSING, FIRST. THE TERM ATTRIBUTION IS UNTESTED. ogawa2002 reports growth plate thickness -
  a zone height, the exact quantity CORR-189 established one round ago cannot be trusted - plus
  "chondrocyte number", which is not specified as per column or total, plus longitudinal growth rate.
  Only the last is a flux. Nobody has measured terminal hypertrophic cell height or resting-zone cycle
  time under a PTH1R agonist, so IT IS NOT ESTABLISHED THAT THIS RAISES AMPLIFICATION RATHER THAN POOL
  CONSUMPTION. If it turns out to buy rate by spending the reserve faster it is a second growth hormone,
  and in a case at bone age 16 it would then stack in COST with the GH already aboard rather than in
  benefit. That is the specific way this candidate could fail and it is the thing the decisive experiment
  tests.

  NOW THE FOUR REASONS IT IS STILL THE BEST CANDIDATE.

  ONE - IT IS NOT AN ANALOGY, IT IS THE SAME MOLECULE THE PLATE USES. Round 175 established that
  amplification IS residence time in the proliferative compartment before hypertrophic commitment, and
  that the circuit setting it is PTHrP-Ihh: PTHrP acts on PTH1R in late proliferative and prehypertrophic
  cells to keep them cycling and DELAY the switch to hypertrophy, and the geometry of that loop sets the
  length of the proliferative column. Column length is amplification. Abaloparatide is a PTHrP(1-34)
  analogue. Every other candidate in this atlas is an adjacent pathway; this one is the endogenous ligand
  of the term itself. Note also WHERE the receptor sits - PTH1R is on late proliferative and
  prehypertrophic cells, at the commitment boundary, NOT on the resting pool, which is an argument that it
  should hit amplification rather than pool consumption. That is an inference from receptor localisation
  and is graded E, not evidence.

  TWO - IT IS THE ONLY AGENT THIS PROGRAMME HAS FOUND THAT RAISED THE GROWTH RATE OF A NORMAL ANIMAL.
  ogawa2002: thirty 6-week-old and thirty 15-week-old male Sprague-Dawley rats, five groups of six,
  hPTH(1-34) 80 micrograms/kg/day five days a week for three weeks. In YOUNG NORMALLY LOADED rats -
  not a dysplasia model, not a deficiency rescue, an ordinary growing animal with an untreated
  normally-loaded control group - growth plate thickness, chondrocyte number AND LONGITUDINAL GROWTH RATE
  were all increased in the proximal tibia. THAT IS ENHANCEMENT ABOVE A NORMAL BASELINE. Set it against
  what everything else did: horike2026 rescued Fgfr3-Ach mice with 666-15 and changed NOTHING in wild-type
  controls; trompet2024 is the ledger''s only pool intervention with a length endpoint at +3.63 per cent
  femur but adds progenitors rather than raising yield; every route-1 lever was unmeasured for length or
  traded flux for pool. xie2012 adds the dysplasia arm for the same drug class - intermittent PTH(1-34)
  rescued thanatophoric dysplasia type II lethality and brought achondroplastic mouse humeri and tibiae to
  lengths comparable with wild-type - but that is a rescue and is not the reason this candidate is ranked
  first. The wild-type arm is.

  THREE - THE JANSEN OBJECTION DISSOLVES, AND IT DISSOLVES INFORMATIVELY. Round 175 raised Jansen
  metaphyseal chondrodysplasia as the standing human warning: constitutive PTH1R activation and the
  patients are SHORT, so delayed commitment is not monotonically good. reyes2023 built the humanized
  H223R-PTH1R mouse - the mutant allele under the endogenous Pth1r promoter, so in all the relevant tissues
  - and shows WHY they are short. The growth plate has MARKEDLY EXPANDED zones of type II collagen positive
  proliferating and prehypertrophic chondrocytes - the delay works, exactly as intended - with ABUNDANT
  APOPTOTIC CELLS IN THE PLATE CENTRE and a PROGRESSIVE REDUCTION of type X collagen positive hypertrophic
  chondrocytes and primary spongiosa. THE AMPLIFIED CELLS NEVER CASH OUT. Jansen is not evidence that
  delaying commitment shortens bone; it is evidence that delaying it PERMANENTLY blocks the discharge and
  the accumulated cells die instead of hypertrophying. That is structurally the same failure this atlas has
  now catalogued three times - horike2026''s expanded resting zone with short bones, newton2019''s Tsc1 pool
  without flux, and now Jansen''s amplification without discharge.

  FOUR - WHICH IS WHY THE DOSING SCHEDULE IS THE DRUG, AND WHY THIS IS THE CHARGE-AND-DISCHARGE PROTOCOL
  THE ATLAS HAS BEEN LOOKING FOR SINCE ROUND 181. Continuous versus intermittent is the oldest known fact
  about PTH in bone, and liu2012 shows it holds in chondrocytes: CONTINUOUS PTH promoted chondrocyte
  proliferation and SUPPRESSED differentiation with COL10A1 down, while INTERMITTENT PTH enhanced
  differentiation with RUNX2, ALP and COL10A1 up. Those are the charge and the discharge. Round 181
  assembled a charge-and-discharge protocol out of two results in newton2019 - charge with mTORC1, discharge
  with Hedgehog inhibition - and had to record that nobody ever ran it to a length endpoint and that the
  discharge agent fuses the plate two doses later. PULSATILE PTH1R AGONISM DOES BOTH HALVES BY SCHEDULE, IN
  ONE APPROVED MOLECULE, AND HAS ALREADY BEEN RUN TO A LENGTH ENDPOINT IN A NORMAL ANIMAL.

  WHY ABALOPARATIDE RATHER THAN TERIPARATIDE. If the failure mode is sustained receptor occupancy - which
  is what Jansen is - then the right tool is the agonist with the shorter signal. zhai2022 resolved
  cryo-EM structures of both ligands bound to PTH1R-Gs and describes teriparatide as the LONG-ACTING and
  abaloparatide as the SHORT-ACTING peptide with respect to downstream signalling duration, tracing the
  difference to receptor ECD motion and the peptide C-terminal portion. Abaloparatide is also the PTHrP
  analogue rather than the PTH one, and it is dosed four times higher, which narrows the dose gap below.
  QUALIFIER CARRIED RATHER THAN DROPPED: sato2021 compared the two head to head in cell-based assays and
  found NO significant difference in receptor internalisation, beta-arrestin recruitment, calcium or early
  cAMP - so the distinction is in signalling DURATION, not in which pathways are engaged, and the argument
  rests entirely on duration being the variable that matters here.

  THE DOSE GAP, WHICH IS THE MAIN QUANTITATIVE OBJECTION. ogawa2002 used 80 micrograms/kg/day in rat. By
  the FDA body-surface-area convention that is a human equivalent of 12.9 micrograms/kg/day, about 774
  micrograms a day for a 60 kg subject - roughly 10x the approved abaloparatide dose and 39x the approved
  teriparatide dose. Four things soften it and one thing does not. ogawa2002 ran a SINGLE dose so the
  minimum effective dose is unknown and unlooked-for; BSA scaling is a first-in-human safety convention
  rather than a pharmacodynamic equivalence; abaloparatide starts four times higher; and the osteoporosis
  doses were titrated to a BONE endpoint in adults with closed plates, because nobody has ever titrated a
  PTH1R agonist to a growth plate endpoint in anybody. WHAT DOES NOT SOFTEN IT: the existing human
  paediatric exposure is REPLACEMENT dosing in hypoparathyroidism, 13 to 26 fold below this human
  equivalent, and tantivit2026 reporting growth "within normal ranges" across 94 children in 18 studies is
  a SAFETY observation at a dose never intended to touch a growth plate. It must not be cited as evidence
  the drug does not work.

  THE OTHER LIMITATION, AND IT IS THE ONE THAT WORRIES ME MOST. ogawa2002''s effects were present in
  6-week-old rats and ABSENT IN 15-WEEK-OLD ONES. The subject is at bone age 16. An age gate in the one
  wild-type positive result, falling on the wrong side, is a more serious problem than the dose gap,
  because no dose escalation fixes it. What is not known is whether the 15-week null is a closed-window
  result or a dose-and-duration result in a slower plate, and the paper cannot distinguish those.

  WHAT WOULD SETTLE IT. Give an intermittent PTH1R agonist to a wild-type growing animal and measure the
  five quantities hunziker1994 measured, in the same animals. Compute amplification. Three outcomes
  discriminate and each sends the programme somewhere different, which is what makes it worth doing.'
