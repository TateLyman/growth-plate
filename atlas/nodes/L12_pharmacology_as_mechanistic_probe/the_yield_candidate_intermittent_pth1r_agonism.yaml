contradicts:
- 'REVERSES THE ROUND-175 READING OF JANSEN. amplification_is_transit_time raised Jansen metaphyseal
  chondrodysplasia as the human warning that delayed hypertrophic commitment is not monotonically good and
  that any amplification agent must be titrated against it. reyes2023 shows the Jansen plate delays
  commitment SUCCESSFULLY - the proliferative and prehypertrophic zones are markedly expanded - and is short
  because those cells apoptose instead of becoming hypertrophic. The lesson is about continuous versus
  pulsatile exposure, not about the direction of the lever.'
- 'REFINES this atlas''s teriparatide node, which records zero paediatric trials with a linear growth
  endpoint citing tantivit2026. That review does report growth as an outcome domain and describes it as
  within normal ranges. The accurate statement is that no QUANTITATIVE growth-velocity or height-SDS
  endpoint exists, and that the exposure which does exist is at replacement rather than anabolic dose.'
