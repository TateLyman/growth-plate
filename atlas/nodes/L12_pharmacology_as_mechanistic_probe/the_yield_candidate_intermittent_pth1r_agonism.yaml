localization:
- 'PTH1R on late proliferative and prehypertrophic chondrocytes - the commitment boundary, not the resting
  pool, which is the localisation argument that this should be an amplification lever'
- 'the PTHrP-Ihh loop, whose geometry sets proliferative column length'
human_evidence: indirect
human_evidence_note: 'Two indirect human anchors and no direct one. Jansen metaphyseal chondrodysplasia is
  the human constitutive-activation experiment and it is short-limbed, now explained by reyes2023 as
  amplification without discharge. tantivit2026 gives 94 children exposed to teriparatide at replacement
  dose for hypoparathyroidism with growth reported as within normal ranges. No human has ever received a
  PTH1R agonist at an anabolic dose with a growth-velocity endpoint, and the labelled contraindication in
  open epiphyses is why.'
species_basis:
- rat
- mouse
- human
translation_risk: high
translation_risk_reason: 'The one wild-type positive is a three-week rat study at a single dose with an age
  gate that falls on the wrong side for this subject. The schedule-dependence evidence is from condylar
  rather than growth plate cartilage. The ligand-selection argument rests on signalling duration measured in
  cell systems and structures, with a head-to-head paper finding no difference in early pathway engagement.
  What transfers best is the mechanistic identity - PTHrP-PTH1R is the endogenous commitment-delay signal in
  the human growth plate too, and Jansen proves the receptor governs human plate maturation.'
confidence: D
claim_grades:
- claim: Intermittent PTH1R agonism raises longitudinal growth rate in a normal growing animal.
  grade: C
  basis: 'ogawa2002, one experiment, n=6 per group, five groups including an untreated normally-loaded
    control. Growth plate thickness, chondrocyte number and longitudinal growth rate all increased in
    6-week-old normally loaded rats. C rather than B because it is a single study at a single dose with no
    replication found, and because two of its three readouts are the kind CORR-189 distrusts - but the
    growth rate itself is a flux and is the endpoint that matters.'
- claim: Intermittent PTH1R agonism raises AMPLIFICATION - yield per progenitor consumed.
  grade: E
  basis: 'THE CLAIM THIS CANDIDATE IS BEING PROPOSED FOR, AND IT IS NOT ESTABLISHED. Nobody has measured
    terminal hypertrophic cell height or resting-zone cycle time under a PTH1R agonist, so the growth-rate
    gain cannot be partitioned between amplification, pool consumption and h_term. The mechanistic and
    localisation arguments are strong - PTH1R sits at the commitment boundary and PTHrP is the endogenous
    delay signal - but they are arguments. Round 183 is the cautionary case: GH looked like an amplification
    agent to two separate nodes until the flux quantities were computed and it turned out to be 0.77.'
- claim: The Jansen phenotype is evidence against PTH1R agonism as a growth strategy.
  grade: X
  basis: 'IT IS EVIDENCE ABOUT CONSTITUTIVE SIGNALLING, NOT ABOUT THE DRUG CLASS. reyes2023 shows the
    humanized H223R-PTH1R growth plate has a MARKEDLY EXPANDED proliferating and prehypertrophic zone - the
    commitment delay works - with abundant apoptosis and progressive loss of type X hypertrophic cells. The
    cells accumulate and then die rather than cashing out. That is an argument for pulsatile dosing and
    against continuous exposure, which is the opposite of what round 175 drew from it.'
- claim: Abaloparatide is preferable to teriparatide for this purpose.
  grade: E
  basis: 'A REASONED PREFERENCE, NOT A MEASUREMENT. It rests on three things: abaloparatide is a PTHrP
    analogue and PTHrP is the plate''s own ligand; zhai2022 characterises it as the SHORT-acting agonist
    where teriparatide is long-acting, which matters if sustained occupancy is the Jansen failure mode; and
    it is dosed four times higher, narrowing the dose gap. Against it, sato2021 found no difference between
    the two in early pathway engagement, so the whole argument turns on signalling duration being the
    operative variable at the growth plate. Neither molecule has ever been given to a growth plate.'
- claim: Pulsatile PTH1R agonism is a single-agent charge-and-discharge protocol.
  grade: E
  basis: 'AN ATTRACTIVE FRAMING ASSEMBLED FROM TWO LITERATURES AND NOT TESTED AS SUCH. liu2012 shows
    continuous PTH suppresses chondrocyte differentiation (COL10A1 down) while intermittent enhances it
    (RUNX2, ALP, COL10A1 up) - charge and discharge - but in CONDYLAR cartilage. Round 181 wanted a
    charge-and-discharge protocol and had only newton2019''s two-agent version with an unmeasured length
    endpoint and a plate-fusing discharge agent. This is the one-agent version, it is approved, and it has a
    length endpoint - but nobody has ever varied PTH schedule against a growth plate length endpoint.'
- claim: The existing paediatric human data show PTH1R agonism does not affect growth.
  grade: X
  basis: 'MISREADING OF A SAFETY OBSERVATION. tantivit2026''s 94 children received teriparatide as
    REPLACEMENT therapy for hypoparathyroidism, 13 to 26 fold below the human equivalent of the dose that
    lengthened a rat. Growth "within normal ranges" at a replacement dose is not a null for an anabolic
    dose, and there is no growth-velocity or height-SDS endpoint anywhere in that literature.'
key_refs:
- ref_id: ogawa2002
  year: 2002
  type: primary
  role: THE WILD-TYPE POSITIVE - the only agent in this programme that raised the growth rate of a normal,
    normally-loaded, growing animal, and the source of both the dose and the age gate
- ref_id: reyes2023
  year: 2023
  type: primary
  role: dissolves the Jansen objection - the humanized H223R-PTH1R plate expands the proliferative zone and
    then loses its hypertrophic cells to apoptosis
- ref_id: liu2012
  year: 2012
  type: primary
  role: the schedule dependence in chondrocytes - continuous suppresses differentiation, intermittent
    enhances it
- ref_id: xie2012
  year: 2012
  type: primary
  role: the dysplasia arm - intermittent PTH(1-34) rescues ACH and TDII mouse bone length, with FGFR3
    downregulation that touches the erdafitinib arm of the stack
- ref_id: zhai2022
  year: 2022
  type: primary
  role: the structural basis for preferring abaloparatide - short-acting against teriparatide's long-acting
    signalling duration at PTH1R
- ref_id: sato2021
  year: 2021
  type: primary
  role: THE QUALIFIER kept rather than dropped - no difference between the two ligands in early pathway
    engagement, so the preference rests on duration alone
- ref_id: tantivit2026
  year: 2026
  type: systematic_review
  role: the human safety anchor - 94 children on replacement-dose teriparatide with growth within normal
    ranges, which is not an efficacy null
- ref_id: hunziker1994
  year: 1994
  type: primary
  role: the method that would settle the term attribution, and the round-183 warning that a plausible
    amplification agent can turn out to be a pool-spending one
- ref_id: newton2019
  year: 2019
  type: primary
  role: the definition being targeted - amplification as residence time before hypertrophic commitment - and
    the two-agent charge-and-discharge protocol this candidate would replace
