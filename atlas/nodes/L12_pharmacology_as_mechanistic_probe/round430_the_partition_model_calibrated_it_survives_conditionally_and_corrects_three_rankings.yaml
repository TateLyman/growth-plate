edges:
  - to: round428_the_transport_finding_refiled_as_the_exposure_term_and_the_multiplier_priced_honestly
    type: corrects
    note: >
      R428 priced the delivery multiplier from the SIZE curve alone and concluded sulfate at
      96 Da sits at the ceiling with a multiplier of about 1.0. Sulfate is a dianion and the
      calibrated partition is 0.189, a 5.3-fold penalty. R428's broader conclusion - that the
      multiplier is near unity for erdafitinib and anastrozole and only bites on the peptide
      arm - survives, because those two are neutral and the size term does govern them.
  - to: round371_the_smo_agonist_choice_and_the_cartilage_wall_that_does_not_exist_at_this_size
    type: corrects
    note: >
      R371 computed 1e4-1e6x enrichment for CPC+14 at z=+14 from r^z and read it as a
      concentration ratio. Beyond |z| = 2 that formula describes electrostatic adsorption, not
      free-solution partition, and vedadghavami2022's own description of a bound depot is the
      measured form of it. R371's Donnan arithmetic for the monovalent SMO agonists is
      unaffected and sits inside the validated envelope.
  - to: growth_plate_drug_exposure
    type: extends
    note: >
      The exposure term's core claim is untouched: no growth-promoting agent has a published
      growth-plate tissue concentration in any species, and tracers are not drugs. What this
      round adds is that the model used in place of that measurement now has a validated
      envelope and a known failure mode outside it.

