localization:
- 'PTHrP and Ihh protein - EARLY HYPERTROPHIC chondrocytes of the human growth plate, falling with
  Tanner stage; the resting zone was excluded from the measurement and remains unmeasured'
- 'the endpoint - whole femur by calipers or quantitative CT in rat; height percentile and annualised
  height velocity in human'
human_evidence: direct
human_evidence_note: 'A three-year randomised controlled trial with linear growth as a pre-specified
  outcome, and a ten-year cohort with annualised height velocity Z scores. Both null. Both in
  hypoparathyroid children receiving replacement rather than pharmacological dosing, which is the
  ceiling the calcium constraint imposes anyway.'
species_basis:
- rat
