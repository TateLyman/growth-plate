id: round195_the_complete_package_and_the_sex_split
name: ROUND 195 - the complete NDA 21-318 package plus the randomised paediatric trial; every femoral
  length gain is female and rides on body weight, every male arm is null, and the human comparison is
  a randomised null
type: hypothesis
layer: L12
aliases:
- the complete pharmr
- the sex split
- winer2010 randomised null
