- human
- multiple
translation_risk: moderate
translation_risk_reason: 'For once the human data are the strongest data. The rat package translates
  badly for the usual reason - the rat plate never closes - but the human randomised comparison and the
  ten-year velocity cohort sit directly on the endpoint of interest. Their limitation is dose, not
  species: hypoparathyroid replacement is about 0.75 micrograms per kilogram per day, and the calcium
  ceiling prevents going much above it in a eucalcaemic subject.'
confidence: B
claim_grades:
- claim: intermittent PTH1R agonism does not increase bone length in intact male rats
  grade: C
  basis: three independent arms - 18 days at 4 weeks of age, 140 days, and one year from 18 to 20 weeks
    - spanning 8 to 100 micrograms per kilogram per day, all null, all from GLP studies tabulated in a
    regulatory review
- claim: every femoral length increase in the package is female and co-occurs with a body-weight increase
  grade: C
  basis: enumeration of the complete four-part review; the 26-week study contains the within-study sex
    contrast at matched doses
- claim: intermittent PTH(1-34) does not change linear growth in children over three years relative to
    calcitriol
  grade: A
  basis: randomised parallel controlled trial with linear growth pre-specified, extended to ten years of
    height velocity Z scores in the same cohort; underpowered for small effects
- claim: the vahle2002 femoral length increase is not dose-dependent in males
  grade: B
  basis: the regulator's own reading of the sponsor's tables, which contradicts the published paper's
    wording
- claim: mouse resting-zone cycle time is at least 57 days
  grade: C
  basis: per-replicate label-dilution source data with an exponential fit, R squared 0.942, interpreted
    as a lower bound because efflux is not separable from division
- claim: no PTH1R agonist has been given to a growing animal of a fusing species with a length endpoint
  grade: A
  basis: enumeration of the complete NDA 21-318 and NDA 208743 pharmacology reviews
