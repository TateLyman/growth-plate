contradicts:
- 'NARROWS THE ROUND-194 READING. Round 194 read the interim positives as a clean answer to the age-gate
  question and the terminal null as the drug giving back a real length gain. Both interim arms are
  FEMALE F344 rats, because the second carcinogenicity study used females only, so they sit inside the
  confounded class rather than outside it. The age gate is still retired - the two windows agree - but
  the interim positives cannot be read as a plate effect in a male.'
- 'CONTRADICTS vahle2002 ON DOSE-DEPENDENCE. The paper reports the femoral length increase as
  dose-dependent. The FDA reviewer, reading the sponsor''s tables, writes that all effects were
  dose-dependent except the effect on femur length in males, which was maximal at the low dose.'
- 'ANSWERS THE ROUND-194 RABBIT REQUEST NEGATIVELY. Both rabbit studies were requested on the ground
  that rabbits fuse. Both used mature or 9-month-old animals and neither measured bone length.'
- 'FLAGS A TEN-FOLD CONFLICT WITH hunziker1994 ON T_stem without overturning round 183. The mouse
  label-dilution lower bound of 57 days cannot be reconciled with 6 days in intact rats. Round 183''s
  ratios are internal to one paper and cancel any common scale error; its absolute amplification figure
  of 23 to 32 cells per progenitor does not and is now unverified.'
