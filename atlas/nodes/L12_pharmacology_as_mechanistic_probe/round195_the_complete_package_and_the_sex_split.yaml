stub: false
summary: 'THE COMPLETE REVIEW CHANGES THE PICTURE, AND NOT IN THE DIRECTION ROUND 194 WAS POINTING.

  Round 194 had one slice of the FDA pharmacology review - the second rat carcinogenicity study - and
  read it as a rate effect that the animal gives back. The full four-part review contains eleven
  further arms, and when they are laid side by side a pattern appears that no single study shows.
  EVERY FEMORAL LENGTH INCREASE ANYWHERE IN THE PACKAGE IS IN A FEMALE ANIMAL AND TRAVELS WITH A LARGE
  CONCURRENT BODY-WEIGHT INCREASE. EVERY ARM IN AN INTACT MALE IS NULL.

  THE 26-WEEK RAT TOXICITY STUDY IS THE CLEANEST CASE BECAUSE IT RAN BOTH SEXES AT THE SAME DOSES.
  Femur length in females rose 1.02x, 1.03x and 1.04x at low, mid and high dose, all significant. The
  review then says, in the same paragraph, "Change not seen in males." In those same females body
  weight rose 7, 10 and 10 per cent, body weight GAIN rose 1.4, 1.7 and 1.8-fold, and efficiency of
  food utilisation rose 1.4, 1.6 and 1.7-fold. In the males of the same study body weight FELL 3.8 per
  cent, weight gain fell 5.2 per cent and food efficiency fell to 0.7x. The reviewer records the
  sponsor''s own explanation: that in females PTH enhances IGF-1 expression, "which may lead to
  increased femur length". That is a systemic body-size mechanism, not a growth plate mechanism, and
  nothing in the package tests it.

  THE OTHER MALE ARMS AGREE. Nonclinical Pharmacology Report CG3-04, four-week-old Sprague-Dawley
  males, 18 days at 16 and 80 micrograms per kilogram - femur length the same in all groups. Study
  R00796/R04296, intact male Fischer 344 rats dosed from 18-20 weeks of age for a FULL YEAR at 8 and
  40 micrograms per kilogram, twenty to thirty animals per group - "LY333334 did not alter linear bone
  growth in males". Doses spanning 8 to 100 micrograms per kilogram per day, durations spanning
  eighteen days to a year, and not one male length effect.

  AND THE FIRST CARCINOGENICITY STUDY - THE ONE PUBLISHED AS vahle2002 - IS WORSE ON INSPECTION THAN
  IT READS IN THE PAPER. The FDA''s own summary of the same data: "Dose-dependent increase in length,
  lateral-medial width and wet weight in all dose groups, up to 6 per cent, 33 per cent, 60 per cent
  in HD, INDICATING EFFECT OF LY MAINLY ON PERIOSTEAL EXPANSION. All effects were dose-dependent...
  EXCEPT FOR THE EFFECT ON FEMUR LENGTH IN MALES WHICH WAS MAXIMAL AT THE LOW DOSE." The published
  paper says the length increase was dose-dependent. The regulator, reading the same tables, says it
  was not, in males. A length effect that peaks at 5 micrograms per kilogram and does not grow with a
  fifteen-fold dose increase is not a pharmacological dose-response.

  THE HUMAN COMPARISON EXISTS AND IT IS RANDOMISED, AND IT IS NULL. winer2010 - twelve children aged 5
  to 14, eight of them male, randomised for THREE YEARS to twice-daily subcutaneous PTH(1-34) or to
  twice-daily calcitriol with calcium. Both arms are eucalcaemic; only one delivers PTH1R pulses.
  Height percentile 47 plus or minus 13 on PTH against 53 plus or minus 15 on calcitriol, P equals
  0.76, "did not differ across time or between treatment groups", and the authors'' conclusion is that
  there were "no differences in bone mineral accrual, linear growth, or weight gain between the two
  treatment arms". winer2018 extends the same cohort to TEN YEARS with mean height velocity Z normal
  throughout, all but three patients reaching adult height on drug, and the CaR patients attaining
  mid-parental height with two exceeding it by 4 and 6 cm. No truncation. No acceleration.

  POWER IS THE HONEST CAVEAT AND IT CUTS BOTH WAYS. Six per arm with a standard deviation of 14
  percentile points detects only a 25-point difference at 80 per cent power, so the BETWEEN-ARM
  comparison excludes only a large benefit. The tighter statement is the within-subject one: a height
  percentile that does not drift over three years, and a height velocity Z that sits at reference for
  ten, is not what a drug that accelerates growth produces.

  THE RABBIT AND MONKEY QUESTIONS ARE CLOSED BY ENUMERATION, NEGATIVELY. Round 194 asked for the
  rabbit studies because rabbits fuse. Both exist and both are useless for this: CG3-06 used mature
  ovary-intact New Zealand whites and CG3-13 used 9-month-old ones, and NEITHER MEASURED BONE LENGTH -
  the endpoints are cortical histomorphometry, BMD, cross-sectional area and biomechanics, and the
  review states there were "no sustained effects on X-area or BMD in whole femur, femoral midshaft or
  whole tibia". The monkey study selected "skeletally mature adults with no open growth plates". The
  words "closure" and "senescence" do not appear in the review at all. And the physis was SECTIONED
  longitudinally in every animal of both carcinogenicity studies and no physeal finding is reported
  anywhere.

  ONE PIECE OF GENUINELY NEW MECHANISM ARRIVED WITH THE HALLETT SOURCE DATA. Figure 4c Source Data 1
  gives the label-dilution curve per biological replicate. The transcription reproduces the workbook''s
  own means exactly. The curve is biphasic: weeks 0 to 5 decay at 0.546 per week, R squared 0.993 -
  the bulk proliferative population - and weeks 5 to 12 decay at 0.1225 per week, R squared 0.942 -
  the slow-cycling tail. Since cells leave the label-retaining gate by dividing OR by leaving the
  resting zone, the observed rate is an upper bound on the division rate, so T_stem in mouse is AT
  LEAST 57 DAYS. The round-194 EdU sweep gave 10 to 59 days; the two independent readouts of the same
  mice converge on the slow end.

  THAT CREATES A TEN-FOLD CONFLICT WITH hunziker1994''S RAT T_stem OF 6 DAYS IN INTACT ANIMALS, AND
  ROUND 183 SURVIVES IT. Round 183''s result is a set of ratios between four conditions measured by one
  method in one paper. A scale error in T_stem common to all four cancels in every ratio, so GH giving
  5.00x pool consumption, 1.36x terminal cell height and 0.77x amplification stands. What does not
  stand is the ABSOLUTE amplification figure of 23 to 32 cells per progenitor, which scales inversely
  with T_stem and is now marked unverified.

  kindblom2002, READ IN FULL, ADDS THE HUMAN LIGAND GRADIENT AND ONE IMPORTANT LIMITATION. Ihh and
  PTHrP immunolocalise mainly to EARLY HYPERTROPHIC chondrocytes in human growth plate biopsies, which
  is the protein-level version of what chu2026 shows for the receptor at transcript level. Expression
  falls significantly with advancing Tanner stage - correlation coefficients of 0.816 for Ihh and 0.911
  for PTHrP. A case at bone age 16 sits at the bottom of that gradient. Whether that means more
  headroom for an exogenous agonist or a shrinking target population is not decidable from this paper,
  because THE RESTING ZONE WAS EXPLICITLY EXCLUDED FROM THE QUANTIFICATION and the receptor was never
  measured across pubertal stages by anybody.'
