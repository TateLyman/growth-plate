stub: false
summary: 'Tadalafil is a long-acting PDE5 inhibitor. In this atlas it is the compound that tests the most
  attractive and least supported idea in growth pharmacology: that raising cGMP downstream of NPR2 is
  sufficient to lengthen bone.

  THE DIRECTLY RELEVANT RESULT IS NEGATIVE. In one-month-old rats, three weeks of tadalafil at 10 mg/kg/day
  raised growth-plate tissue cGMP by 52% and produced NO change in long bone length, cortical or trabecular
  bone properties, or growth plate histology - despite the same drug raising peak CNP-stimulated intracellular
  cGMP by 37% in vitro (wang2018). Bulk cGMP is not the rate-limiting variable. That negative stands against
  the positive mouse result obtained with PDE3 inhibition.

  THE TARGET MAY NOT BE THERE. P8-01 found PDE5A undetectable across all 8 HG-U133 Plus 2.0 probe sets
  in both donors of the only zone-resolved human growth-plate transcriptome. P8-02 then found PDE5A at
  the 91st percentile in one independent human series and absent in two others - a four-platform disagreement
  recorded as a contradiction rather than averaged. Which cGMP-hydrolysing activity the human physis actually
  carries is unresolved (g_l3core_006), and the isoforms consistently detected are PDE3B and PDE2A, not
  PDE5A.

  THE HIDDEN PHARMACOLOGY IS PDE11. Tadalafil is the one marketed PDE5 inhibitor with meaningful PDE11A
  cross-reactivity, which is why its off-target profile differs from sildenafil''s. P8-02 corroborates
  PDE11A as absent from human growth plate across all four datasets, so in this tissue the cross-reactivity
  is probably inert - but that is an argument from a bounded transcript negative, not a measurement.

  CHRONIC PAEDIATRIC EXPOSURE ALREADY EXISTS AND HAS NEVER BEEN READ OUT. Children with pulmonary arterial
  hypertension take PDE5 inhibitors for years, at doses far above the 5 mg once-daily urological dose,
  with routine growth monitoring. No height-velocity analysis of that cohort has been reported. It is
  the cheapest available human test of the whole cGMP hypothesis and nobody has run it.'
