translation_risk_reason: The only functional readout is rat and it is negative; the human target PDE5A
  has a four-platform detection disagreement; and the human physis consistently expresses PDE3B and PDE2A
  instead. Transferring a cGMP-raising rationale to human growth would be inference on top of a negative.
