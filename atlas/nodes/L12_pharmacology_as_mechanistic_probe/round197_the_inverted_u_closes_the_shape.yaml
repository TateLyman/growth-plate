translation_risk: moderate
translation_risk_reason: 'The inverted-U shape is established across mouse and human genetics
  independently, so the shape itself transfers. What does not transfer automatically is WHERE a late
  pubertal human sits on it, and that is the whole remaining question.'
confidence: B
claim_grades:
- claim: bone length is an inverted U in PTHrP-PTH1R signalling tone with wild type at or near the maximum
  grade: B
  basis: both extremes established independently in mouse and in human genetics, with a consistent set
    of agonist nulls in the middle across three species including a randomised human trial
- claim: PTHrP overexpression in cartilage shortens limbs
  grade: C
  basis: single transgenic mouse study, but concordant with the human constitutive-activation phenotype
- claim: losing PTHrP signalling costs pool and amplification while raising terminal cell height
  grade: C
  basis: single study, but the only one in the line to report cells per column and terminal cell height
    separately, using Hunziker's stereological method
- claim: the in vitro proliferative effect of PTH on growth cartilage cells is not PTH1R-mediated
  grade: C
  basis: a midregion fragment that cannot activate PTH1R reproduced the effect of PTH(1-34) on DNA
    synthesis, cell counts and colony formation in the same cultures
- claim: caloric intake alone moves a growing rat's vertebral body height by 5 to 6 per cent
  grade: C
  basis: single study with an isocaloric pair-fed design, n=5 per group, both sexes concordant
- claim: the systemic IGF-1 explanation for female-specific femoral lengthening is false
  grade: C
  basis: direct measurement in the one study that produced the effect and measured the mediator - IGF-I
    fell
- claim: no molecular dataset of the human growth plate reaches beyond Tanner 4, and none can be
    obtained by the route that produced all existing samples
  grade: A
  basis: enumeration of chu2026, avijgan2026 and kindblom2002, all from percutaneous epiphysiodesis at
    one centre, an operation performed only while growth remains to be stopped
