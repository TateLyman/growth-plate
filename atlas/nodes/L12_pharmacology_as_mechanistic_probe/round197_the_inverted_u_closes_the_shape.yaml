id: round197_the_inverted_u_closes_the_shape
name: ROUND 197 - the gain-of-function arms arrive, the axis is an inverted U with wild type at the top,
  and every remaining hope reduces to one unmeasured human curve
type: hypothesis
layer: L12
aliases:
- the inverted U
- weir1996 gain of function
- correa2010 cells per column
- round 197
stub: false
summary: 'THE PILE OF RESULTS RESOLVES INTO ONE SHAPE, AND THE SHAPE DECIDES THE CASE.

  Until this round the line was a heap: catastrophic phenotypes at the genetic extremes, a rescue in
  uraemia, a rescue in achondroplasia, and a wall of nulls under exogenous agonism in healthy animals.
  The two missing arms were the GAIN-of-function experiments. They exist, and both are short.

  weir1996 - Col2-driven PTHrP OVEREXPRESSION in mouse chondrocytes produces "short-limbed dwarfism and
  a delay in endochondral ossification", so marked the animals are born with a cartilaginous
  endochondral skeleton, and by seven weeks the bones are "foreshortened and misshapen but
  histologically near-normal". That is the mouse gain-of-function. The human gain-of-function is Jansen
  metaphyseal chondrodysplasia, already in this atlas, and it is severe short stature.

  SO BOTH ENDS OF THE AXIS SHORTEN BONE. Zero signalling shortens it - Blomstrand, PTHrP null,
  chondrocyte PTH1R knockout, Zfp521 conditional knockout, human PTHLH haploinsufficiency. Maximal
  signalling shortens it - Jansen, Col2-PTHrP. The curve has a maximum, and every result in between
  says WILD TYPE SITS AT OR NEAR THAT MAXIMUM.

  WHAT FOLLOWS IS THE ENTIRE ANSWER TO THE PROGRAMME''S QUESTION. An agonist can only add length from
  BELOW the optimum, and that is precisely the set of states in which agonism has ever worked - uraemic
  growth failure and FGFR3-suppressed achondroplasia. It is also precisely the set in which agonism does
  nothing: wild-type mouse pups, young male rats, adult male rats, rats followed to terminal, and
  randomised human children. Adding agonist to a healthy plate moves along the flat top of the curve or
  over it.

  correa2010 SUPPLIES THE MISSING FLUX MEASUREMENT, AND IT IS THE ONLY ONE IN THE WHOLE LINE. Deleting
  Zfp521 - the transcriptional effector through which PTHrP delays hypertrophy, acting by antagonising
  Runx2 via HDAC4 - reproduces the PTHrP-null and chondrocyte-PTH1R-null phenotypes. In two-week-old
  mouse proximal tibia, with Hunziker''s own stereological method: growth plate thickness down 30 per
  cent across all zones; THE RESTING ZONE COLLAPSES FROM FIVE OR MORE CELL LAYERS TO ONE OR TWO; the
  number of cell columns AND THE NUMBER OF CELLS PER COLUMN both fall; the hypertrophic zone thins with
  FEWER chondrocytes EACH OF INCREASED CELL HEIGHT; extracellular matrix falls by half. Nothing else
  anywhere in this line reports cells per column and terminal cell height separately. Read against the
  Hunziker identity, losing PTHrP signalling costs pool AND amplification while RAISING terminal cell
  height - the mirror image of what a yield agent would do, which is what makes the wild-type null so
  informative: the system is already spending its PTHrP tone on exactly the terms the programme wants,
  and there is no headroom.

  THE LONE HEALTHY-ANIMAL POSITIVE WAS TRACED AND IT IS FEMALE AGAIN. schmitt2000''s introduction cites
  a claim that 50 micrograms per kilogram per day increased femoral length gain in young healthy rats.
  The source is toromanoff1998: forty-eight intact TEN-WEEK-OLD FEMALE rats, PTH(1-34) 50 micrograms per
  kilogram daily for 5, 10 or 15 days. At 15 days "the length of the femora, bone mass, mineral content,
  BMD, and the width of the femoral neck were increased". That is a real positive in a healthy animal
  and it is the only one. It is also the FIFTH consecutive positive that is female-only, against six
  male-only nulls. AND IT KILLS THE MECHANISM THE FDA REVIEWER RECORDED: the sponsor''s explanation for
  the female-specific femoral lengthening was that PTH raises IGF-1 in females. toromanoff1998 measured
  it. Systemic IGF-I DECREASED throughout the study.

  THE IN VITRO FOUNDATION TURNS OUT NOT TO BE A PTH1R EFFECT. schmitt2000 grounds the whole idea on its
  group''s finding that PTH stimulates growth plate chondrocyte proliferation "in a biphasic manner",
  citing klaus1994. That paper''s own abstract does not use the word biphasic - and more importantly, the
  effect was produced EQUALLY BY hPTH(28-48), a midregion fragment that does not activate PTH1R, as by
  bPTH(1-34). DNA synthesis, cell counts and colony formation all responded to both, calcium-dependently,
  and the VDR upregulation was PKC-dependent and cAMP-INDEPENDENT. If a non-PTH1R-activating fragment
  reproduces the proliferative effect, that effect is not evidence for PTH1R agonism doing anything to a
  growth plate.

  AND wezeman2003 PUTS A FLOOR UNDER HOW SERIOUSLY ANY OF THE POSITIVES CAN BE TAKEN. It measured L4
  vertebral body height in growing Sprague-Dawley rats, endplate to endplate, with an isocaloric
  PAIR-FED control arm. Pair-fed males 7.69 plus or minus 0.06 mm against ad libitum 8.22 plus or minus
  0.28; females 6.83 plus or minus 0.21 against 7.19 plus or minus 0.56. CALORIC INTAKE ALONE MOVES
  VERTEBRAL BODY HEIGHT BY FIVE TO SIX PER CENT. Every healthy-animal length positive in this entire
  line is between two and six per cent, and only two studies in the line controlled intake at all. The
  effect sizes being chased are the size of the feeding artefact.

  wezeman2003 ALSO REMOVES THE EXCUSE FOR THE VERTEBRAL GAP. The measurement is a dissection and a
  caliper, with coefficients of variation between 0.8 and 7 per cent on a 7 to 8 mm bone. The reason no
  vertebral body height exists under any PTH1R agonist is not that it is hard.

  WHERE THIS LEAVES THE LINE. Against it: both genetic extremes short, the wild-type nulls across three
  species, a randomised human null, the flux measurement showing the endogenous system already spends
  its tone on pool and amplification, the in vitro basis being PTH1R-independent, and every positive
  being female and inside the nutrition artefact. For it: exactly one thing. kindblom2002 shows both
  ligands of this loop FALL significantly with Tanner stage in human growth plate biopsies - correlation
  coefficients of 0.816 for Ihh and 0.911 for PTHrP. If endogenous tone at Tanner four to five has
  dropped BELOW the optimum, then a subject at bone age 16 is in the rescuable region and every null
  above was measured in the wrong animal at the wrong point on its own curve. That is the only route by
  which this line is still alive, and the counterweight is equally simple: falling ligand tone is also
  what a plate shutting down looks like, and the pre-hypertrophic population that carries the receptor
  shrinks with the plate. The two readings predict opposite signs and one immunostaining series
  separates them.'
