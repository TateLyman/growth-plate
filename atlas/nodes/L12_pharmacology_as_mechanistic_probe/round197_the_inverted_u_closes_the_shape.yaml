contradicts:
- 'FALSIFIES THE SPONSOR MECHANISM RECORDED IN THE FDA REVIEW. The review states the sponsor''s
  explanation that in females PTH enhances IGF-1 expression, which may lead to increased femur length.
  toromanoff1998 produced the female femoral length effect and measured IGF-I in the same animals: it
  significantly DECREASED throughout.'
- 'UNDERCUTS THE IN VITRO BASIS CITED BY schmitt2000. The "biphasic stimulation of growth plate
  chondrocyte proliferation by PTH" traces to klaus1994, whose abstract does not use the word biphasic
  and in which the midregion fragment hPTH(28-48), which does not activate PTH1R, was as effective as
  PTH(1-34).'
- 'REFRAMES ROUND 194''S RECEPTOR-LOCALISATION ARGUMENT. Round 194 concluded from chu2026 and hallett2021
  that PTH1R sits off the pool, so agonism could not spend it. correa2010 shows that removing PTHrP
  signalling COLLAPSES the resting zone from five-plus layers to one or two. The tone reaches the pool
  even if the receptor is not concentrated on it, most likely through throughput. The localisation
  argument survives as a statement about where the receptor is, not as a statement about what the
  signalling does to the pool.'
