localization:
- 'Zfp521 - pre-hypertrophic chondrocytes, co-expressed with PTHR1 from E17.5, the intracellular point
  at which PTHrP delays hypertrophy by antagonising Runx2 through HDAC4'
- 'the endpoint that has never been measured under an agonist - vertebral body height, superior to
  inferior endplate, which wezeman2003 shows is a dissection and a caliper'
human_evidence: indirect
human_evidence_note: 'The human contributions are the two genetic extremes - Jansen at maximal tone and
  PTHLH haploinsufficiency at low tone, both short - and kindblom2002''s ligand-versus-Tanner-stage
  curve. The interventional human position is unchanged: a three-year randomised null.'
