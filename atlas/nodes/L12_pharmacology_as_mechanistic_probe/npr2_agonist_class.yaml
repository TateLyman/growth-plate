id: npr2_agonist_class
name: NPR2 agonist drug class
aliases: [NPR-B agonists, CNP analogue class]
type: intervention
layer: L12
stub: false
summary: |
  All approved growth-promoting drugs for achondroplasia are NPR2 (NPR-B) agonists:
  vosoritide, a NEP-resistant CNP analogue, and navepegritide, a prodrug releasing
  unmodified CNP. Both act by raising intracellular cGMP and signalling through protein
  kinase G to inhibit the RAF-1 step of the FGFR3-driven MAPK cascade, as stated in both
  FDA labels. The class is therefore a downstream antagonist of FGFR3 output, not a
  correction of the receptor. Two structural facts limit it. First, NPR2 protein is
  distributed relatively uniformly across growth plate zones whereas PKG-I/II is
  hypertrophic-biased (L3), so receptor occupancy and pathway output need not be
  co-located and efficacy may be gated downstream of the receptor the drug binds.
  Second, FGFR3-to-NPR2 crosstalk is post-translational only, so an FGFR3 gain-of-function
  allele does not reduce NPR2 transcript and the receptor is present to be agonised in
  achondroplasia - which explains why the class works at all. The pooled placebo-controlled
  effect across four RCTs (n=326) is 1.36 cm/yr (95% CI 1.05-1.68), and the class ceiling
  has not moved with a 300-fold change in exposure duration.
quantitative:
  - parameter: pooled placebo-controlled effect of the class on annualised growth velocity
    value: '1.36'
    unit: cm/yr
    conditions: meta-analysis of 4 RCTs, n=326, children <18 y with genetically confirmed achondroplasia
    species: human
    source_ref: cnpmeta2026
    uncertainty: 95% CI 1.05-1.68
  - parameter: relative risk of injection site reaction, class vs placebo
    value: '1.65'
    unit: relative risk
    conditions: same meta-analysis; urticaria RR 4.04, swelling RR 3.57; overall and serious AE rates comparable to placebo
    species: human
    source_ref: cnpmeta2026
    uncertainty: point estimates as reported
  - parameter: dose of vosoritide at which urinary cGMP response is near saturation
    value: '15'
    unit: ug/kg/day
    conditions: exposure-response analysis in children aged 5-14 y at screening; CXM (endochondral ossification marker) also maximal at this dose
    species: human
    source_ref: fda_voxzogo_label_2025
    uncertainty: label statement, no CI
localization:
  - "human growth plate: NPR2 expressed across zones; class engagement measured only as urinary or plasma cGMP, never in plate tissue"
human_evidence: direct
human_evidence_note: >-
  Two agents in the class have completed placebo-controlled RCTs in children with
  achondroplasia and hold accelerated approvals based on annualised growth velocity.
species_basis: [human, mouse]
translation_risk: low
translation_risk_reason: >-
  Class efficacy is established in humans. The mechanistic reading - that PKG-mediated
  RAF-1 inhibition in chondrocytes is what produces the growth - is taken from animal and
  in vitro work and is asserted in the labels rather than demonstrated in treated humans.
confidence: A
claim_grades:
  - claim: NPR2 agonism raises annualised growth velocity in achondroplasia by roughly 1.4 cm/yr versus placebo.
    grade: A
    basis: Meta-analysis of four RCTs, n=326, low overall risk of bias.
  - claim: The effect is mediated by cGMP/PKG inhibition of RAF-1 within growth plate chondrocytes.
    grade: C
    basis: Stated in FDA labels on the basis of animal and biochemical work; the only human engagement biomarker is systemic cGMP.
  - claim: Class efficacy is gated by a step downstream of NPR2 rather than by receptor occupancy.
    grade: E
    basis: Inference from the zonal mismatch between uniform NPR2 and hypertrophic-biased PKG-I/II (L3 contradiction C-L3-03) plus the exposure-independence of the clinical effect.
key_refs:
  - ref_id: cnpmeta2026
    pmid: '42306228'
    first_author: Kamrul-Hasan ABM
    year: 2026
    type: meta_analysis
    one_line_finding: Class effect 1.36 cm/yr (95% CI 1.05-1.68); injection site reaction RR 1.65, urticaria RR 4.04.
  - ref_id: fda_voxzogo_label_2025
    year: 2025
    type: regulatory
    one_line_finding: States the RAF-1 step as the mechanism and reports cGMP saturation at 15 ug/kg/day.
  - ref_id: fda_yuviwel_label_2026
    year: 2026
    type: regulatory
    one_line_finding: States identical NPR-B/cGMP/PKG mechanism for released CNP.
  - ref_id: dauber2026
    pmid: '41967490'
    first_author: Dauber A
    year: 2026
    type: primary
    one_line_finding: Basket trial extending NPR2 agonism beyond FGFR3 disease to RASopathies, ACAN and NPR2 deficiency.
open_questions: [g_l12b_003, g_l12b_002, g_l12pharm_002]
