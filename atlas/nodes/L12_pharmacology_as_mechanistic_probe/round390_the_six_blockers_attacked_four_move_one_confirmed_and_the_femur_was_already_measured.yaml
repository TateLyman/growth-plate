id: round390_the_six_blockers_attacked_four_move_one_confirmed_and_the_femur_was_already_measured
name: "R390: the six systemic blockers attacked one by one - four move, one is confirmed by re-query, and the systemic length experiment turns out to have been measured and used as a normaliser"
aliases:
  - systemic SAG blockers resolved
  - aqueous smoothened agonist formulation
  - adult gut hedgehog agonist
  - PTCH1 agonist nanobody
  - SAG teratogenicity
type: intervention
layer: L12
stub: false
summary: >-
  R388 and R389 closed with six unfixed items. This round attacks each. Four move
  materially, one is confirmed rather than overturned, and one produces a new
  modality the atlas had never held.

  BLOCKER 2 - "no aqueous SAG formulation exists at any concentration" - IS FALSE
  AS WRITTEN. lee2016colitis dosed the Smoothened agonist SAG21k systemically at
  0.5 mg/kg intraperitoneally every 12 hours in adult mice, and the stated vehicle
  is PBS. An aqueous in vivo vehicle for a Smoothened agonist exists and has been
  used. The true statement is narrower and survives: no aqueous formulation has
  been demonstrated at the concentration a human systemic dose would need, which
  R388 computed as 30 mg/mL or better.

  BLOCKER 5 - the adult gut - IS SUBSTANTIALLY ANSWERED, AND IT RUNS THE
  FAVOURABLE WAY ON BOTH INFLAMMATION AND CANCER. The same paper is an adult
  systemic Smoothened-agonist experiment with colon endpoints. Hedgehog inhibition
  by three independent means intensified colitis; genetic augmentation and systemic
  small-molecule activation ameliorated it. In the azoxymethane-DSS
  colitis-associated cancer model, Ptch1 heterozygotes had reduced tumour volume
  and number, vismodegib gave significantly greater tumour burden, and SAG21k gave
  decreased tumour burden. Ptch1 heterozygotes also had less severe colitis and
  survival of 91 versus 55 percent. The mechanism is stromal: Hedgehog does not act
  on the colonic epithelium but induces IL-10 in Gli1-positive stromal cells with
  increased Foxp3 regulatory T cells, and IL-10 is required for the protection. No
  muscularis or smooth-muscle finding was reported. The dose is forty-fold below
  li2021's and the course was six doses, so this does not exclude a high-dose
  mesenchymal effect - but the direction of every colorectal endpoint measured is
  protective.

  BLOCKER 4 - no systemic length endpoint in a normal animal - TURNS OUT TO BE
  CORR-340 AGAIN, AND THE MEASUREMENT ALREADY EXISTS. rundle2023 gave SAG21k by
  systemic intraperitoneal injection at 5 mg/kg/day for three weeks in a murine
  femoral segmental defect model, and analysed the CONTRALATERAL UNFRACTURED FEMUR
  by microcomputed tomography with the analysis NORMALISED TO THE LENGTH OF THE
  FEMUR. The bone was measured in animals given three weeks of systemic Smoothened
  agonist and the length was reported only as a denominator. It is a data request,
  not an experiment. The same paper supplies a published dose range this atlas did
  not have - SAG is stated to be effective at activating SHH signalling in mice at
  5 to 20 mg/kg/day, which brackets both regimens R388 scaled - and reports SAG21k
  to be several-fold more active than SAG, which is why 5 mg/kg was chosen.

  BLOCKER 6 - the rebound - IS HALF MEASURED, IN THE PREDICTED DIRECTION.
  lee2016colitis measured Gli1, Ptch1, HHIP and Ihh in colon under systemic SAG21k
  in vivo. PTCH1 and HHIP behave as Hedgehog target genes there, present at
  baseline, suppressed during colitis and restored by the agonist. So the first
  half of R389's rebound prediction - that a systemic Smoothened agonist induces
  its own brakes - now has direct in vivo support in a mammal. What is still
  missing is the post-withdrawal time course and the growth-plate tissue. Values
  are figure-only.

  BLOCKER 3 - no Smoothened agonist ever given to a human - IS CONFIRMED, NOT
  OVERTURNED. clinicaltrials.gov was re-queried three ways (hedgehog agonist,
  smoothened agonist, sonic hedgehog protein) and every registered hedgehog entry
  is an antagonist or an antagonist combination. The claim stands.

  BUT THE SEARCH RETURNED A MODALITY THIS FILE HAD NEVER HELD, AND
  ARCHITECTURALLY IT IS BETTER THAN A SMOOTHENED AGONIST. zhang2020nanobody
  describes a conformation-specific NANOBODY AGAINST PATCHED1 that potently
  activates the pathway in vitro and in vivo by trapping PTCH1 in one stage of its
  transport cycle, with a cryo-EM structure, and which requires no lipid
  modification. The architectural point: PTCH1 is itself a Gli target, so a
  PTCH1-directed agonist is TITRATED BY THE FEEDBACK IT PROVOKES, whereas a
  Smoothened agonist acts below that node and is not. That is exactly R375's
  argument for HHIP over SAG applied to a different brake - and unlike an anti-HHIP
  binder, this agent exists. It has no bone endpoint, no human exposure and an
  untested cartilage delivery problem, so it is a programme and not a candidate.

  BLOCKER 1 - no GMP material - is not solved, but the dose that sets its size is
  no longer fixed. SAG21k is several-fold more potent than SAG and has systemic in
  vivo precedent at 0.5 and 5 mg/kg. If the growth plate responds in that range the
  human dose falls far below R388's ~1 g per pulse, and the gram-scale synthesis
  argument changes shape. Nobody has run a dose-response on a growth plate.

  TWO THINGS FOUND WHILE LOOKING, BOTH OF WHICH CHANGE THE PROTOCOL. First,
  mao2026sag is a TERATOGENICITY result and R388 filed it as a dose ceiling. A
  single 25 mg/kg intraperitoneal dose in pregnant mice produced cleft lip and
  palate, cranial bone abnormalities and haematomas, with a critical window at
  E9.5-E10.5. Vismodegib and sonidegib carry male-patient contraception
  requirements for embryo-fetal toxicity and potential seminal transfer; a potent
  Smoothened AGONIST that is a demonstrated teratogen inherits that precaution in
  full, and this file had never said so. The ceiling reading is separately weaker
  than R388 used it, because the reduced proliferation was measured in an embryo
  undergoing craniofacial morphogenesis while trompet2024 gave the same 25 mg/kg
  daily to normal juvenile mice and got a 61 percent pool increase with Ki67 up.

  Second, steiner2026smo gives the structural mechanism by which an activated
  Smoothened binds and physically blocks the PKA catalytic subunit. R307 and R309
  give three independent lines that raising cAMP, PKA and CREB is the harmful
  direction in this case and that erdafitinib contributes by lowering CREB. So the
  hedgehog arm pushes that node the same way rather than opposing it. Grade E for
  any skeletal claim, and it is not the term SAG is being used for.

  Finally, kong2025dhh adds a third independent axis on which the human harm
  attaches to hedgehog SUPPRESSION: small-molecule agonism protects pancreatic beta
  cells and airway epithelium in mice, and higher diabetes incidence is reported in
  patients treated with hedgehog INHIBITORS. With the colorectal direction
  (westendorp2021, lee2016colitis) and the FAERS squamous-cell-carcinoma signal
  (zheng2025faers), three separate organ systems now point the same way.
