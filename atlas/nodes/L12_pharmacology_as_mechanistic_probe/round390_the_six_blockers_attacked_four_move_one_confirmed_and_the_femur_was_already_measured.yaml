localization: >-
  systemic - colon stroma, pancreatic islet, airway, embryo during organogenesis,
  and the growth plate the protocol is aimed at
human_evidence: indirect
human_evidence_note: >-
  Blocker 3 is confirmed - no Smoothened agonist has been given to a human by any
  route, re-verified by three separate clinicaltrials.gov queries. The human
  evidence remains indirect and all of it concerns the LOSS direction: the FAERS
  squamous-cell-carcinoma signal on the marketed antagonists, the higher diabetes
  incidence reported in patients on hedgehog inhibitors, and the human GLI1-altered
  gastric mesenchymal tumour class from R389.
species_basis:
  - mouse
  - human
translation_risk: high
translation_risk_reason: >-
  Every regimen here is mouse. The adult-gut result is at a dose forty-fold below
  the one that produced the muscularis finding and over six doses rather than three
  weeks, so it constrains rather than excludes the liability. The femur measurement
  that exists sits in an injured animal on a surgical model. The nanobody has no
  skeletal endpoint at all. And the central gap is unchanged: no systemic
  Smoothened agonist has produced a bone-length endpoint in a normal animal, and
  none has been given to any animal at a skeletal stage equivalent to bone age 16.
confidence: C
claim_grades:
  - claim: An aqueous in vivo vehicle for a Smoothened agonist exists and has been used systemically
    grade: A
    basis: stated vehicle in lee2016colitis - PBS, SAG21k, intraperitoneal, adult mice
  - claim: >-
      A systemic small-molecule Smoothened agonist reduces colitis severity and
      colitis-associated colon tumour burden in adult mice, while the antagonist
      increases both

    grade: B
    basis: >-
      lee2016colitis, pharmacological in both directions plus a concordant genetic
      arm; challenged system, so CORR-203 governs the efficacy reading
  - claim: >-
      Systemic SAG21k has been given for three weeks to mice in which femur length
      was measured
    grade: A
    basis: >-
      rundle2023 methods - contralateral unfractured femur, microCT normalised to
      femur length. The datum exists; its value is unreported
  - claim: >-
      A systemic Smoothened agonist induces PTCH1 and HHIP in vivo, which is the
      first half of the predicted rebound
    grade: C
    basis: lee2016colitis Fig S3A, figure-only values, colon rather than cartilage
  - claim: No Smoothened agonist has ever been given to a human by any route
    grade: A
    basis: >-
      clinicaltrials.gov re-queried three ways in R390; every registered hedgehog
      entry is an antagonist. Confirms rather than overturns R375
  - claim: >-
      A PTCH1-directed agonist retains the pathway's own negative feedback in a way
      a Smoothened agonist does not
    grade: E
    basis: >-
      an architectural inference from PTCH1 being a Gli target combined with
      zhang2020nanobody's mechanism. Never tested, and no bone endpoint exists for
      the nanobody
  - claim: SAG is a potent teratogen and a male on it requires contraception counselling
    grade: C
    basis: >-
      mao2026sag demonstrates teratogenicity in mouse at a single 25 mg/kg dose; the
      contraception requirement is by analogy with the labelled requirements for
      vismodegib and sonidegib, not from data on an agonist in humans
