id: round342_the_stc2_handle_is_a_solved_interface_and_the_marketed_chromatin_shelf_points_the_wrong_way
name: 'Round 342 - the STC2 handle exists and is a solved 3.1 Angstrom interface, not an undefined secreted
  protein; and the marketed epigenetic pharmacopoeia is audited and points the wrong way for height'
aliases:
- is there an anti-STC2 agent
- PAPP-A STC2 interface as a drug target
- STC2 exosite occlusion
- why decitabine-scale thinking keeps returning contraindications
- menin-MLL inhibitors are a contraindication
type: hypothesis
layer: L12
stub: false
summary: 'TWO THINGS. FIRST, R341 ASSERTED THAT NO ANTI-STC2 AGENT EXISTS WITHOUT QUERYING IT, WHICH IS
  THE FAILURE MODE CORR-312, CORR-333 AND CORR-335 ALL EXIST TO STOP. Queried properly - and searching
  the FOLD rather than the drug name, per CORR-312 - the answer is more useful than a yes or a no. SECOND,
  the "think at decitabine scale" brief was run to its conclusion by auditing the entire marketed epigenetic
  shelf against the human height table, and the result explains why that brief keeps returning contraindications
  instead of candidates.

  ONE - THERE IS NO ANTI-STC2 THERAPEUTIC, AND THE HANDLE IS BETTER THAN AN ANTIBODY EPITOPE. gohr2022
  solved the PAPP-A.STC2 complex by single-particle cryo-EM: a 500 kDa 2:2 assembly, 3.1 Angstrom for STC2
  and the N-terminal ~1000 residues of PAPP-A. THE INHIBITORY MECHANISM IS NOT ACTIVE-SITE BLOCKADE. The
  catalytic cleft of the metzincin domain remains ACCESSIBLE in the inhibited complex and still hydrolyses
  a synthetic IGFBP-4-derived peptide. STC2 inhibits by OCCLUDING THE SUBSTRATE EXOSITE - interactions
  between STC2 and a module at the VERY C-TERMINAL END of PAPP-A prevent binding of the physiological substrate
  IGFBP-4 - and the complex is locked by A SPECIFIC INTERSUBUNIT DISULFIDE BOND that prevents dissociation.
  The authors close the abstract by nominating this themselves: the mechanism "may support the development
  of specific pharmaceutical agents, by which IGF signaling can be indirectly modulated."

  WHY THAT IS THE USEFUL ANSWER. R314 argued that secreted targets want antibodies and that the problem
  with HHIP and CHAD is that nobody has MADE the function-blocking binder. For STC2 the problem is smaller
  and better specified than that: the target is not "a secreted protein somewhere" but A DEFINED PROTEIN-PROTEIN
  INTERFACE WITH A PUBLISHED STRUCTURE AND A COVALENT TETHER. Three distinct entry points follow and none
  requires neutralising STC2 systemically - block the C-terminal exosite contact, prevent formation of
  the intersubunit disulfide, or bind STC2 at the PAPP-A-contacting surface. This is the CHAD/LRRWLEAK
  shape of CORR-335 - an interface known to residue level - rather than the HHIP shape, where the pocket
  was a homology prediction with no ligand. ✗ IT REMAINS TRUE THAT NO SUCH AGENT EXISTS IN ANY SPECIES,
  and PAPP-A-directed antibodies in development run the OPPOSITE way (atherosclerosis, oncology, and thyroid
  eye disease).

  TWO - AND THE TARGET GOT STRONGER FROM TWO INDEPENDENT DIRECTIONS WHILE THE SEARCH WAS RUNNING. stc2igf2024,
  394 adults with plasma proteins by ELISA and multivariable regression, found STC2 INVERSELY RELATED TO
  TOTAL IGF-1 in humans - protein-level confirmation of the direction the burden effect predicts. ⭐ And
  in the same analysis PAPP-A WAS NOT RELATED TO TOTAL OR FREE IGF-1, which is exactly what R341''s local-versus-circulating
  split predicts if PAPP-A acts pericellularly in tissue rather than setting the circulating pool. Separately
  stc2a2025hypoxia deleted Stc2a in zebrafish and got INCREASED DEVELOPMENTAL SPEED AND GROWTH RATE WITH
  ENLARGED ADULT ORGAN AND BODY SIZE, then REVERSED the phenotype both by inhibiting pappalysin activity
  and by blocking IGF signalling - which converts the chain STC2 -> pappalysin -> IGF -> somatic growth
  from inference into a rescue experiment. ⭐ It also reports that Stc2a is induced by HYPOXIA in a HIF2-dependent
  manner. THE GROWTH PLATE IS A PROFOUNDLY HYPOXIC TISSUE, so this predicts the brake is tonically ON in
  the compartment of interest - a mechanistic reason to expect local relevance that the atlas did not have.
  ✗ The same paper records the trade the gene exists to make: stc2a-null fish grew faster under hypoxia
  and SURVIVED LESS.

  THREE - THE CHROMATIN SHELF AUDIT, AND IT IS THE ANSWER TO WHY "THINK LIKE DECITABINE" KEEPS FAILING.
  Twenty-one chromatin genes with marketed or clinical agents were run against kosmicki2026''s burden table
  and against growth-plate expression. ONLY FOUR REACH THE 207 AT ALL, and the direction is systematically
  hostile to the available pharmacology: TET1 +7.95 cm (P=4.8e-28) - the only large effect, direction is
  INHIBIT, and NO CLINICAL INHIBITOR EXISTS; KMT2B -0.35 (15,945 carriers) and ASH1L -0.41 (11,997, and
  abundant at 170.9 CPM) - both WRITERS whose loss SHORTENS, so the wanted direction is MORE and no activators
  exist; KAT2B +0.17, too small to use. EVERY GENE THAT HAS A MARKETED DRUG IS ABSENT FROM THE 207 - DNMT1,
  DNMT3A, EZH2, EED, KMT2A, DOT1L, KDM1A, HDAC4, BRD2, CREBBP, EP300, SMARCA4 - and every one of them this
  atlas has assessed on mechanism is already contraindicated: DNMT inhibitors (R276), EZH2 inhibitors (R281
  dead, R311 directionally harmful), pinometostat (R311), HDAC inhibitors including givinostat (R298).
  ⭐ THE GENERALISATION: THE MARKETED EPIGENETIC PHARMACOPOEIA IS AN INHIBITOR SHELF BUILT FOR ONCOLOGY,
  AND FOR HEIGHT THE USABLE DIRECTION IS ALMOST ALWAYS THE OTHER ONE. It is R298''s druggability base rate
  restated for chromatin, and it is why an instruction to think at decitabine scale returns contraindications
  rather than candidates - not because the scale is wrong, but because the shelf at that scale is pointed
  the wrong way.

  FOUR - ONE NEW CONTRAINDICATION FALLS OUT OF THAT AUDIT AND IT IS RECENT. MENIN-MLL INHIBITORS - REVUMENIB,
  APPROVED NOVEMBER 2024, and ZIFTOMENIB - block the menin-KMT2A interaction and therefore KMT2A-dependent
  H3K4 methylation. R333 established that MORE H3K4me3 IS TALLER (LOXL2, the eraser, +0.68 cm; the writers
  KMT2B -0.35 and ASH1L -0.41). A menin-MLL inhibitor therefore lowers a mark whose loss shortens. Grade
  E, mechanistic, no bone endpoint in any species - a watch-item on the same list as HDAC inhibitors and
  DNMT inhibitors, added because these are newly approved and were not in this file.'
quantitative:
- parameter: 'the STC2-PAPP-A inhibitory mechanism - substrate exosite occlusion plus a covalent tether,
    with the active site left open'
  value: 500 kDa 2:2 PAPP-A.STC2 complex, 3.1 Angstrom for STC2 and the N-terminal approximately 1000 residues
    of PAPP-A; the catalytic cleft remains accessible and still hydrolyses a synthetic IGFBP-4-derived peptide
    while being devoid of activity toward intact IGFBP-4
  unit: kilodaltons, stoichiometry and Angstrom resolution
  conditions: gohr2022, single-particle cryo-electron microscopy. Two structural elements carry the inhibition
    - a specific intersubunit disulfide bond between STC2 and PAPP-A that prevents dissociation, and contacts
    between STC2 and a module at the very C-terminal end of the PAPP-A subunit that prevent binding of the
    substrate IGFBP-4.
  species: human
  source_ref: gohr2022
  uncertainty: 'THIS ANSWERS THE TRACTABILITY QUESTION AND NOT THE EFFICACY QUESTION. What it establishes
    is that the target is a defined interface with a published structure rather than an undefined secreted
    protein, which is a materially smaller problem than the one HHIP has - and the authors nominate it for
    drug development themselves. WHAT IT DOES NOT ESTABLISH is that disrupting the interface is achievable
    (a 500 kDa flexible multidomain ensemble with numerous interdomain contacts is a hard protein-protein
    interaction target), that a covalent intersubunit disulfide can be prevented pharmacologically without
    non-specific reduction, or that doing any of it changes bone length. NO AGENT DIRECTED AT THIS INTERFACE
    EXISTS IN ANY SPECIES.'
- parameter: 'human protein-level confirmation of direction, and an independent check on the local-versus-circulating
    split'
  value: STC2 inversely related to total IGF-1; PAPP-A2 inversely related to total IGF-1 and to the IGF-1:IGFBP-3
    molar ratio (-4.3 ng/mL per 0.5 ng/mL higher PAPP-A2, 95 per cent CI -7.0 to -1.6); PAPP-A NOT related
    to total or free IGF-1
  unit: direction of association and difference in concentration
  conditions: stc2igf2024. 394 adults aged 20-69 from the German National Cohort Berlin North pretest, plasma
    PAPP-A, PAPP-A2, STC2, total and free IGF-1 and IGFBP-1/2/3/5 measured by ELISA, multivariable linear
    regression adjusted for age, sex, BMI and pretest phase.
  species: human
  source_ref: stc2igf2024
  uncertainty: 'CROSS-SECTIONAL, IN ADULTS, AND ASSOCIATIVE - it cannot establish causation and the population
    is the wrong age for this case. Its value is twofold and modest. It confirms in human protein that higher
    STC2 goes with lower IGF-1, which is the direction the burden effect predicts. And the PAPP-A null result
    is a genuine independent check on R341 - if PAPP-A set the circulating pool, it should have shown an
    association, and it did not, which is consistent with PAPP-A acting pericellularly on matrix-bound IGFBP-4.
    Neither point is decisive alone.'
- parameter: 'the chain proven by rescue, and the hypoxia induction that predicts local relevance'
  value: genetic deletion of Stc2a increased developmental speed and growth rate and produced enlarged adult
    organ and body size; the phenotypes were reversed both by inhibiting pappalysin metalloproteinase activity
    and by blocking IGF signalling; hypoxic induction of stc2a is attenuated in Hif2-deficient fish
  unit: qualitative, with reversal as the causal test
  conditions: stc2a2025hypoxia. Zebrafish, stc2a-null against wild type, with hypoxia challenge. Under hypoxia
    the nulls grew faster than wild type but showed a reduced survival rate.
  species: zebrafish
  source_ref: stc2a2025hypoxia
  uncertainty: 'THE RESCUE IS WHAT MAKES THIS WORTH MORE THAN THE OTHER STC2 ANIMAL DATA - reversing the
    phenotype by two independent downstream blockades converts the pathway from inference into a demonstrated
    chain. ZEBRAFISH IS THE LIMIT. Fish grow indeterminately and have no epiphyseal growth plate of the
    mammalian kind, so "enlarged adult body size" is not a bone-length endpoint and does not transfer directly.
    THE HYPOXIA POINT IS AN INFERENCE, NOT A MEASUREMENT: HIF2-dependent induction in fish plus the known
    hypoxia of mammalian growth-plate cartilage predicts that STC2 is tonically induced there, but nobody
    has measured STC2 protein or its regulation by zone in any mammalian growth plate.'
- parameter: 'the marketed chromatin shelf against the human height table - four genes in, and the direction
    is wrong for the drugs that exist'
  value: 'IN THE 207 - TET1 +7.95 cm (P=4.8e-28, direction INHIBIT, no clinical inhibitor); KMT2B -0.35
    (P=4.3e-10, 15,945 carriers, writer, direction RAISE, no activator); ASH1L -0.41 (P=3.5e-10, 11,997
    carriers, 170.9 CPM, writer, direction RAISE, no activator); KAT2B +0.17 (P=7.5e-04). NOT IN THE 207
    AT ANY VARIANT CLASS - DNMT1, DNMT3A, EZH2, EED, KMT2A, KMT2D, DOT1L, KDM1A, KDM5A, KDM5B, HDAC4, SETD2,
    NSD1, BRD2, CREBBP, EP300, SMARCA4.'
  unit: centimetres per allele and median CPM
  conditions: kosmicki2026 Supplementary Table 6 joined to GSE288028, 21 chromatin genes selected because
    each carries a marketed or clinical-stage agent or is a writer/eraser this atlas has previously assessed.
  species: human
  source_ref: kosmicki2026
  uncertainty: 'ABSENCE FROM THE 207 IS NOT PROOF OF NO EFFECT - it is a significance-thresholded set and
    CORR-310 warns explicitly against importing another group''s cutoff as a filter. Several of these genes
    are also highly constrained, so pLoF carriers are rare and power is low by construction rather than
    because the effect is zero. WHAT THE AUDIT DOES SUPPORT is the weaker and more useful claim: among chromatin
    genes, the ones with human height anchors are NOT the ones with drugs, and where both exist the direction
    is opposed. That is a statement about the shelf, not about the biology, and it is the same shape as
    R298''s base rate.'
localization:
- 'postnatal human growth plate: the STC2/PAPP-A/IGFBP4/IGF2/IGF1R module present with IGFALS absent (R341);
  chromatin machinery broadly present but without matching genetic anchors'
- 'PAPP-A C-terminal module: the physical site at which STC2 occludes substrate access - the interface a
  disruptor would target'
human_evidence: direct
human_evidence_note: The structure is of human proteins, the burden effects and the plasma associations are
  human, and the chromatin audit is run on human genetics. The causal chain is zebrafish and the local-relevance
  argument is inference.
species_basis:
- human
- zebrafish
translation_risk: moderate
translation_risk_reason: The target, its direction and its structure are human; the causal demonstration
  is in a species with no mammalian growth plate, and no agent exists to translate.
confidence: C
claim_grades:
- claim: No anti-STC2 or STC2-PAPP-A-directed therapeutic exists in any species.
  grade: B
  basis: Queried rather than asserted this time, by compound class and by fold. The STC2 literature is overwhelmingly
    oncology-biomarker; PAPP-A-directed antibodies exist but are being developed in the opposite direction
    for atherosclerosis, oncology and thyroid eye disease. Research-grade anti-STC2 antibodies exist but
    none is characterised as function-blocking against the PAPP-A interaction.
- claim: The STC2 target is a defined interface rather than an undefined secreted protein, and that is a
    materially smaller problem.
  grade: B
  basis: 'gohr2022 gives a 3.1 Angstrom cryo-EM structure of the complex and identifies both load-bearing
    elements - a specific intersubunit disulfide and contacts between STC2 and a C-terminal module of PAPP-A
    that occlude the IGFBP-4 exosite while leaving the catalytic cleft accessible. The authors nominate
    the mechanism for pharmaceutical development in the abstract. This is CORR-312 vindicated: the material
    was in the STRUCTURAL literature under interface and mechanism, not under inhibitor.'
- claim: Disrupting the STC2-PAPP-A interface would lengthen bone.
  grade: E
  basis: 'UNTESTED IN ANY SPECIES. The direction is supported by human burden (+1.37 cm, P=4.51e-34, 3,927
    carriers), human plasma protein (STC2 inversely related to total IGF-1), and a zebrafish rescue experiment
    - but no bone-length endpoint exists for STC2 loss in any mammal, the 500 kDa flexible complex is a
    hard protein-protein target, and CORR-300 warns that flooding a system is not the same as shifting a
    setpoint. The cheapest test remains R341''s: caliper the Stc2-null mouse that is already bred.'
- claim: The marketed epigenetic pharmacopoeia contains a usable height lever.
  grade: X
  basis: 'AUDITED AND NO. Of 21 chromatin genes with marketed or clinical agents, only four reach kosmicki2026''s
    207 and none of those four has a matching drug in the wanted direction - TET1 needs inhibition and has
    no clinical inhibitor, KMT2B and ASH1L need raising and have no activators, KAT2B is too small. Every
    gene that does have a marketed drug is absent from the 207, and each that this atlas has assessed on
    mechanism is already contraindicated (DNMT inhibitors R276, EZH2 R281/R311, pinometostat R311, HDAC
    inhibitors R298). The shelf is full and pointed the wrong way.'
- claim: Menin-MLL inhibitors are a contraindication.
  grade: E
  basis: 'MECHANISTIC AND NEW TO THIS FILE. Revumenib (approved November 2024) and ziftomenib block the menin-KMT2A
    interaction and therefore KMT2A-dependent H3K4 methylation, while R333 established that MORE H3K4me3
    is TALLER - the eraser LOXL2 at +0.68 cm against writers KMT2B -0.35 and ASH1L -0.41. No bone endpoint
    in any species, so grade E and a watch-item rather than an established harm, recorded because the class
    is newly approved and absent from this atlas.'
key_refs:
- ref_id: gohr2022
  year: 2022
  type: primary
  one_line_finding: Cryo-EM of the 2:2 PAPP-A.STC2 complex at 3.1 Angstrom - inhibition is substrate exosite
    occlusion at PAPP-A's C-terminal module plus an intersubunit disulfide, with the catalytic cleft left
    accessible; the authors nominate the interface for drug development.
- ref_id: stc2igf2024
  year: 2024
  type: primary
  one_line_finding: In 394 adults STC2 was inversely related to total IGF-1 while PAPP-A was not related
    to total or free IGF-1 - human protein-level support for both the direction and the local-versus-circulating
    split.
- ref_id: stc2a2025hypoxia
  year: 2025
  type: primary
  one_line_finding: Zebrafish Stc2a deletion increased growth rate and adult body and organ size, reversed
    by blocking pappalysin or IGF signalling; Stc2a is HIF2-induced under hypoxia.
- ref_id: kosmicki2026
  year: 2026
  type: primary
  one_line_finding: Supplies the chromatin audit - only TET1, KMT2B, ASH1L and KAT2B reach the 207, and
    none of the genes carrying marketed epigenetic drugs appears at all.
