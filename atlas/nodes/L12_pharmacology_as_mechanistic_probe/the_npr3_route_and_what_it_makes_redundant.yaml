id: the_npr3_route_and_what_it_makes_redundant
name: THE CNP AXIS HAS THREE CONTROL POINTS, NOT ONE - what an NPR3 blocker makes redundant, what it does
  not, and the molecule the whole axis has been converging on
aliases:
- is phosphatase inhibition still needed
- do I still need vosoritide with an NPR3 antagonist
- what is redundant on the CNP axis
- osteocrin as a drug
- the niche compound
type: hypothesis
layer: L12
stub: false
summary: 'TWO NECESSITY QUESTIONS WERE ASKED AND BOTH ARE ANSWERABLE FROM EXPERIMENTS THAT ALREADY EXIST -
  one of which refutes the answer this atlas was about to give.
  THE AXIS HAS THREE CONTROL POINTS AND THE ATLAS OWN RULE IS TO STACK ACROSS THEM, NEVER WITHIN ONE.
  (1) LIGAND SUPPLY - how much CNP reaches NPR2. Levers: a CNP analogue adds exogenous ligand; NPR3
  blockade spares it from internalisation AND raises circulating supply; neprilysin inhibition spares it
  from enzymatic degradation. (2) RECEPTOR RESPONSIVENESS - the phosphorylation state of the seven
  juxtamembrane residues on NPR2. Lever: PPP-family phosphatase inhibition. (3) DOWNSTREAM cGMP - and this
  one is DEAD on direct evidence, twice: sacubitril raises CNP availability but is not additive with CNP,
  and tadalafil raised cGMP 37 to 52 per cent with NO gain in bone length. cGMP is not the limiting step.
  QUESTION ONE - IS PHOSPHATASE INHIBITION STILL NEEDED WITH AN NPR3 BLOCKER? YES, AND THE GUARANTEE IS
  MECHANISTIC RATHER THAN EMPIRICAL. robinson2017 shows FGF inactivates NPR2 by DEPHOSPHORYLATION and that
  the inhibition is NOT SURMOUNTABLE BY LIGAND - the same IC50 at sub-saturating and at saturating CNP.
  So no quantity of ligand, from ANY source - injected analogue, spared clearance, blocked protease -
  repairs a dephosphorylated receptor. The phosphatase arm is orthogonal to the ENTIRE ligand arm by
  mechanism. An NPR3 blocker cannot substitute for it and does not reduce its value.
  BUT THE REDUNDANCY QUESTION FOR THE PHOSPHATASE ARM WAS NEVER ABOUT THE LIGAND - IT IS ABOUT THE FGFR
  INHIBITOR, AND THAT IS WHERE THE REAL RISK SITS. LB-100 stated mechanism is counteracting FGF-INDUCED
  dephosphorylation. If erdafitinib or infigratinib has already removed the FGF signal at the receptor,
  much of the substrate is gone and the two agents collapse onto ONE control point - the thing this atlas
  rule forbids (CORR-083). THE DECIDING NUMBER IS ALREADY MEASURED AND IT RESCUES A RESIDUAL: cantharidin
  alone raised the CNP response 1.42-FOLD WITH NO FGF PRESENT, p = 0.0018, computed by this atlas from
  shuhaibar2017 Figure 6C source data. A substantial part of the restraint on NPR2 is TONIC and
  FGF-INDEPENDENT, so it survives an FGFR inhibitor. THE PHOSPHATASE ARM IS THEREFORE WORTH ABOUT 1.42-FOLD
  IN A STACK THAT ALREADY CONTAINS AN FGFR INHIBITOR, AND MORE IN ONE THAT DOES NOT - and the pairing has
  never been run.
  AND THE SAME TONIC FINDING IS THE ARM WORST LIABILITY, WHICH MUST NOT BE SEPARATED FROM ITS BENEFIT.
  CORR-125: if the brake is tonic, a systemic phosphatase inhibitor lifts a STANDING brake wherever NPR2
  and the phosphatase coexist - including vasculature - which is the failure mode that killed the NPR2
  allosteric modulator. The branch is STRONGER on efficacy and WEAKER on selectivity than it looked.
  QUESTION TWO - IS A CNP ANALOGUE STILL NEEDED WITH AN NPR3 BLOCKER? YES, AND THIS REVERSES THE ANSWER
  THIS NODE WAS GOING TO GIVE. The inference from hakata2024 was that a clearance blocker and an exogenous
  ligand occupy one control point and should be redundant - sacubitril produces 2 to 3 per cent overgrowth,
  is abolished in cartilage-specific NPR-B knockout, and is EXPLICITLY NOT ADDITIVE WITH CNP. THE DIRECT
  EXPERIMENT FOR THE NPR3 ARM SAYS THE OPPOSITE. kanai2017: CNP-transgenic x OSTN-transgenic double mice
  had HIGHER circulating CNP and ADDITIONAL increases in BONE LENGTH over elevated CNP alone, and the
  authors conclude OSTN administration is an ADJUVANT FOR CNP THERAPY.
  THE TWO CLEARANCE ARMS ARE NOT INTERCHANGEABLE, AND THE REASON MATTERS FOR DOSING. Neprilysin DEGRADES
  CNP enzymatically and locally; NPR-C INTERNALISES it, and blocking NPR-C RAISES THE CIRCULATING POOL.
  That distinction is decisive because this atlas has established the human growth plate MAKES NO CNP OF
  ITS OWN and is a starved consumer importing it from plasma. Raising the circulating pool feeds the
  importer; blocking a local protease does not.
  QUESTION THREE - THE NICHE MOLECULE, AND THE AXIS HAS BEEN CONVERGING ON IT FROM TWO DIRECTIONS WITHOUT
  ANYONE JOINING THEM. FROM BIOLOGY: OSTEOCRIN (OSTN, musclin) is a NATURAL NPR-C LIGAND WITH NO
  NATRIURETIC ACTIVITY - it occupies the clearance receptor WITHOUT agonising NPR1 or NPR2, which is
  exactly the selectivity the compound specification demands and which no CNP analogue can have. Raised
  circulating OSTN gives DOSE-DEPENDENT SKELETAL OVERGROWTH in mice, abolished in CNP-null or NPR-C-null
  backgrounds. Human mature OSTN is a 50-residue, about 5.6 kDa peptide. FROM CHEMISTRY: nishizawa2017
  MINIMISED THAT EXACT PHARMACOPHORE - compound 23 is an 11-MER built by hybridising MUSCLIN with an ANP
  fragment, hardened with D-amino acids and N-methylation, NPR3-selective, serum-stable, and raising plasma
  cGMP in live mice.
  SO THE COMPOUND IS NOT HYPOTHETICAL, IT IS UNJOINED. OSTN supplies proven skeletal biology at 5.6 kDa
  with the right selectivity; compound 23 supplies the same pharmacophore at roughly 1.3 to 1.5 kDa with
  drug-like stability. On the farnum2006 partition curve that size difference is most of the argument -
  about 60 per cent partition at 3 kDa against about 10 per cent at 10 kDa. NOBODY HAS GIVEN A MINIMISED
  NPR3 BLOCKER TO A GROWING ANIMAL AND MEASURED A BONE. That is one experiment, it is small, and it is the
  gate on the best-specified compound in this atlas.'
quantitative:
- parameter: 'WHY PHOSPHATASE INHIBITION CANNOT BE REPLACED BY ANY AMOUNT OF LIGAND'
  value: 'FGF rapidly, potently and reversibly inactivates NPR2/GC-B by DEPHOSPHORYLATION, and the
    inhibition is NOT SURMOUNTABLE BY LIGAND - the same IC50 at sub-saturating (100 nM) and saturating
    (1 microM) CNP. A 7-glutamate phosphomimetic receptor is completely FGF-RESISTANT'
  unit: qualitative - surmountability
  conditions: 'robinson2017, RCS rat chondrosarcoma cells and crude membranes. FULL TEXT READ AT SOURCE
    2026-08-09 (round 146) and the claim is confirmed verbatim: "FGF2 inhibited CNP dependent GC-B activity
    at sub-saturating (100 nM) and saturating (1 microM) CNP concentrations with a similar IC50 of
    approximately 5 ng/ml FGF2" (Fig 2A). Kinetics t1/2 about 7 min, maximal by 15 min at both CNP
    concentrations, sustained at least 1 h, rapidly reversible. FGFR3 mRNA in this line is 8-fold above
    FGFR1, itself 100-fold above FGFR2 and 50-fold above FGFR4, so the effect is FGFR3-dominant.'
  species: rat
  source_ref: robinson2017
  uncertainty: 'THIS IS THE LOAD-BEARING MECHANISTIC CLAIM FOR KEEPING THE PHOSPHATASE ARM AND IT NOW
    SURVIVES A SOURCE READ, which upgrades it from the abstract-level status it held when this node was
    written. If the inhibition WERE surmountable, raising ligand by any route would substitute for
    phosphatase inhibition and the arm would collapse into the ligand arm; it is not, so the arm stands
    orthogonal. WHAT STILL LIMITS IT: RCS cells are a TRANSFORMED CHONDROSARCOMA LINE, not a growth plate,
    and the readout is guanylyl cyclase activity in crude membranes rather than bone length. The
    non-surmountability is demonstrated against FGF2 concentration, not against a CNP dose-response run to
    saturation at fixed FGF - which is the stricter version of the experiment and has not been done.'
- parameter: 'THE PART OF THE PHOSPHATASE BRAKE THAT SURVIVES AN FGFR INHIBITOR - AND THE SAME NUMBER IS
    THE ARM SELECTIVITY PROBLEM'
  value: '100 micromolar cantharidin alone raised the CNP response 1.42-FOLD WITH NO FGF PRESENT,
    p = 0.0018. For contrast, in the FGF-suppressed system 10 micromolar LB-100 drives the response to
    138 per cent of the no-FGF control'
  unit: fold change in CNP-stimulated response
  conditions: computed by this atlas at round 130 from shuhaibar2017 Figure 6C raw per-animal source data,
    intact mouse tibia ex vivo; the 138 per cent figure is shuhaibar2021 Figure 1F.
  species: mouse
  source_ref: shuhaibar2017
  atlas_derived: true
  uncertainty: 'THIS ONE NUMBER CUTS BOTH WAYS AND MUST ALWAYS BE QUOTED WITH BOTH EDGES. FAVOURABLE: the
    restraint on NPR2 is partly TONIC rather than FGF-driven, so a phosphatase inhibitor retains about
    1.42-fold even in a stack where an FGFR inhibitor has already removed the FGF signal - which is the
    only thing standing between the phosphatase arm and full redundancy with the FGFR arm (CORR-083).
    UNFAVOURABLE, AND EQUALLY IMPORTANT: a tonic brake is a brake everywhere. CORR-125 downgraded this
    branch escape-from-the-trap claim from C to D on exactly this datum, because a systemic phosphatase
    inhibitor lifts a standing brake wherever NPR2 and the phosphatase coexist, including vasculature -
    the failure mode that killed the allosteric modulator. ONE ex vivo experiment, mouse, cantharidin
    rather than a clinical agent, at 100 micromolar.'
- parameter: 'THE CLEARANCE-BLOCKER PLUS LIGAND PAIRING HAS BEEN RUN AND IT IS ADDITIVE - WHICH REVERSES
    THE PREDICTION FROM THE NEPRILYSIN ARM'
  value: 'CNP-transgenic x OSTN-transgenic DOUBLE-transgenic mice had HIGHER circulating CNP and ADDITIONAL
    increases in BONE LENGTH compared with elevated CNP alone. OSTN transgenics alone show DOSE-DEPENDENT
    skeletal overgrowth, DIMINISHED in either CNP-depleted or NPR-C-depleted backgrounds. AGAINST THIS,
    the neprilysin arm: sacubitril gives 2-3 per cent naso-anal overgrowth, abolished in
    cartilage-specific NPR-B knockout, and is EXPLICITLY NOT ADDITIVE WITH CNP'
  unit: qualitative additivity; per cent overgrowth
  conditions: kanai2017 (J Clin Invest, abstract read at round 145) for the NPR-C arm; hakata2024 for the
    neprilysin arm. Both mouse; kanai2017 is GENETIC OVEREXPRESSION, not administered drug.
  species: mouse
  source_ref: kanai2017
  uncertainty: 'THIS ATLAS WAS ABOUT TO PREDICT NON-ADDITIVITY FROM hakata2024 AND WOULD HAVE BEEN WRONG.
    The two clearance arms are not interchangeable: NEPRILYSIN degrades CNP enzymatically and locally,
    whereas NPR-C INTERNALISES it and blocking NPR-C RAISES THE CIRCULATING POOL. That distinction is
    load-bearing because the human plate makes no CNP of its own and imports it from plasma - so raising
    the circulating pool feeds the importer while sparing a local protease does not. LIMITS THAT MATTER
    BEFORE THIS IS USED TO JUSTIFY A TWO-DRUG REGIMEN: both arms of kanai2017 are LIFELONG GENETIC
    OVEREXPRESSION from conception, not two drugs given to an adolescent; additivity of two transgenes is
    not additivity of two doses; and no wild-type-background dose-response exists for either. AND THE
    hakata2024 AGE GATE IS UNADDRESSED AND POINTS THE WRONG WAY FOR THIS CASE - sacubitril worked at 3-4
    weeks and was 99 per cent of control at 4-5 weeks, so clearance blockade may be age-gated, and nobody
    has tested whether the NPR-C arm shares that gate.'
- parameter: 'THE MOLECULE THE AXIS CONVERGES ON, FROM BOTH ENDS, WITH THE JOIN NEVER MADE'
  value: 'BIOLOGY END - OSTEOCRIN/musclin: a NATURAL NPR-C ligand WITH NO NATRIURETIC ACTIVITY; human
    mature peptide is 50 residues, about 5.6 kDa (UniProt P61366, residues 83-132); raised circulating
    levels give dose-dependent skeletal overgrowth. CHEMISTRY END - nishizawa2017 compound 23: an 11-MER,
    roughly 1.3 to 1.5 kDa, built by HYBRIDISING MUSCLIN with an ANP fragment and hardened with D-amino
    acids and N-methylation; NPR3-selective over NPR1, serum-stable, raises plasma cGMP in live mice.
    PARTITION CONTEXT - farnum2006: about 100 per cent of vascular concentration enters cartilage at
    332 Da, about 60 per cent at 3 kDa, about 10 per cent at 10 kDa, undetectable at 40 kDa'
  unit: residues, kDa, per cent partition
  conditions: uniprot_ostn_p61366 for the human peptide; kanai2017 for the transgenic phenotype;
    nishizawa2017 for the minimised analogue; farnum2006 for the partition curve.
  species: multiple
  source_ref: nishizawa2017
  atlas_derived: true
  uncertainty: 'THE CONVERGENCE IS THE FINDING AND THE JOIN IS THE MISSING EXPERIMENT. OSTN supplies proven
    skeletal biology with exactly the selectivity property the compound specification demands - a
    clearance-receptor ligand that is NOT a natriuretic agonist, which is something no CNP analogue can
    be. Compound 23 supplies the same pharmacophore at roughly a quarter of the mass with deliberate
    protease hardening. NOBODY HAS GIVEN A MINIMISED NPR3 BLOCKER TO A GROWING ANIMAL AND MEASURED A BONE.
    WHAT IS NOT ESTABLISHED, AND IT IS A LOT. Compound 23 selectivity over NPR2/NPR-B is UNREPORTED - only
    NPR1 is stated - and NPR-B is the receptor carrying the vascular liability, so the single measurement
    that would confirm the molecule escapes the trap is the one not made. Its exact mass, potency and any
    tox are unread behind a paywall. OSTN itself has never been ADMINISTERED - the phenotype is transgenic
    overexpression from conception. The partition figures are from a different tracer series and are being
    applied to peptides by size alone, which ignores charge, and this atlas separately argues the ideal
    molecule is CATIONIC - a property neither candidate has been characterised for.'
- parameter: 'THE COMPOUND THE SPECIFICATION ASKED FOR, NAMED AND MASSED - AND THE ONE NUMBER STILL MISSING'
  value: 'M372049: C43H58N12O9, MOLECULAR WEIGHT 887.0 Da (PubChem CID 59787819) - a MODIFIED PENTAPEPTIDE
    NPR-C antagonist from AstraZeneca, called by porter2020 the BEST-IN-CLASS NPR-C antagonist, with a
    published synthesis needing no specialised apparatus and NO commercial supply. NISHIZAWA COMPOUND 23:
    binding IC50 hNPR3 0.079 nM against hNPR1 >1000 nM - >12,600-fold selective and 6.5-fold more potent at
    NPR3 than C-ANP(4-23); serum residual 107 per cent at 2 h and 92 per cent at 4 h; blood levels 10.1 nM
    at 300 and 40.5 nM at 1000 nmol/kg/day by osmotic pump, about 500-fold over its own IC50. MASS LADDER
    against the farnum2006 partition curve (about 100 per cent at 332 Da, 60 per cent at 3 kDa, 10 per cent
    at 10 kDa): M372049 887 Da, compound 23 about 1.36 kDa, mature human osteocrin 5.6 kDa, vosoritide
    about 4.1 kDa'
  unit: Da; nM; per cent
  conditions: pubchem_m372049 (PUG REST API, 2026-08-09) for mass and formula; nishizawa2017 Tables 1-3
    read in full at round 146; porter2020 for the best-in-class statement and the synthesis; farnum2006 for
    the partition curve. Compound 23 mass is COMPUTED BY THIS ATLAS from the published sequence, not read.
  species: not_applicable
  source_ref: pubchem_m372049
  atlas_derived: true
  uncertainty: 'THE MISSING NUMBER IS THE SAME ONE FOR BOTH MOLECULES AND IT IS NOW A PROPERTY OF THE
    LITERATURE RATHER THAN OF OUR ACCESS. nishizawa2017 Tables 1 and 3 carry columns for hNPR1 and hNPR3
    ONLY - NPR2/NPR-B WAS NEVER ASSAYED - and no NPR-B figure was located for M372049 either. NPR-B is the
    receptor whose vascular activation sets the ceiling on this entire axis, so for both candidates the one
    measurement that would show the molecule escapes the liability does not exist.
    AND THE PUBLISHED USE OF M372049 CUTS AGAINST IT. Every application located - villar2007, smith2022 -
    deploys M372049 to BLOCK CNP-MEDIATED VASORELAXATION, that is, to demonstrate the vascular action this
    atlas wants to avoid. It is a proven vascular-active NPR-C blocker with NO skeletal endpoint in any
    species. Neither candidate is CATIONIC - M372049 carries one Arg against one Asp, roughly neutral -
    so neither gets the Donnan enhancement this atlas argues for in polyanionic matrix, though neither
    takes the penalty an anion would.'
localization:
- 'growth plate: all three control points act here, but NPR3 blockade also acts systemically by raising
  the circulating CNP pool that the plate imports'
- 'vasculature: the liability compartment for both the phosphatase arm (tonic brake lifted everywhere) and
  any natriuretic agonist; OSTN is specifically NOT a natriuretic agonist'
human_evidence: indirect
human_evidence_note: 'The human evidence on this route is genetic and not interventional - biallelic NPR3
  loss gives +3 to +4 SDS with normal blood pressure. Every combination and redundancy result in this node
  is rodent, and two of the three are genetic overexpression rather than pharmacology.'
species_basis:
- mouse
- rat
- human
translation_risk: high
translation_risk_reason: 'The two decisive combination experiments are lifelong transgenic overexpression
  in mice, and the non-surmountability result carrying the phosphatase arm is a transformed rat cell line
  read at abstract level.'
confidence: C
claim_grades:
- claim: Phosphatase inhibition cannot be replaced by any ligand-side intervention, including NPR3 blockade.
  grade: C
  basis: 'Rests on robinson2017 non-surmountability - the same IC50 at sub-saturating and saturating CNP -
    which is mechanistically decisive if true but is held at ABSTRACT LEVEL in a transformed rat cell line.
    Graded C rather than B for that reason; reading the full text is the cheapest available upgrade.'
- claim: Phosphatase inhibition is partly redundant with an FGFR inhibitor, retaining about 1.42-fold.
  grade: D
  basis: 'The redundancy risk is real and stated at CORR-083 - LB-100 counteracts FGF-INDUCED
    dephosphorylation and an FGFR inhibitor removes that signal at source. The surviving tonic component is
    a single atlas-computed number from one ex vivo mouse experiment with cantharidin at 100 micromolar.
    The pairing itself has never been run in any species.'
- claim: A CNP analogue remains additive with an NPR3 blocker.
  grade: C
  basis: 'The direct experiment exists - kanai2017 CNP x OSTN double transgenics gain bone length over CNP
    alone - and it beats the contrary inference from the neprilysin arm because the two clearance
    mechanisms differ in whether they raise the CIRCULATING pool. Not higher because both arms are lifelong
    genetic overexpression in mice, and additivity of two transgenes is not additivity of two doses.'
- claim: Osteocrin-derived NPR3 blockade is the compound this axis specifies.
  grade: C
  basis: 'OSTN has the one selectivity property no CNP analogue can have - a clearance-receptor ligand with
    NO natriuretic activity - plus dose-dependent skeletal overgrowth abolished in CNP-null and NPR-C-null
    backgrounds, and a minimised drug-like analogue of the same pharmacophore already exists. Held at C
    because no minimised NPR3 blocker has ever been given to a growing animal, compound 23 NPR-B
    selectivity is unreported, and OSTN itself has never been administered.'
- claim: A clearance blocker is redundant with an exogenous ligand because both occupy the ligand control
    point.
  grade: X
  basis: 'This node was about to assert it from hakata2024 and it is wrong for the NPR-C arm. kanai2017
    shows additivity on bone length. Recorded as a refuted inference so the reasoning that failed stays
    legible: control-point identity was assigned by function (clearance) when the operative variable was
    whether the intervention raises the CIRCULATING pool that a non-producing tissue imports.'
