contradicts:
- 'CORRECTS THE ROUND-142 AND ROUND-144 READING OF the_named_compounds_for_this_case, which treated the
  h_term arm as a single slot to be filled by one molecule. It is three control points. An NPR3 blocker
  and a CNP analogue are additive (kanai2017) and a phosphatase inhibitor is orthogonal to both
  (robinson2017), so the arm can carry up to three agents - while the DOWNSTREAM cGMP point stays dead.'
