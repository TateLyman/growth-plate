  strongly supported and the subject is already far below the observed closure threshold; the bound is
  smith2008s residual 0.7 bone-age years per calendar year under complete receptor absence.'
- 'zirilli2009 DIRECTLY CONTRADICTS nilsson2003_raloxifene on whether a SERM behaves as an oestrogen agonist
  at the growth plate. Human n=1 against rabbit; recorded rather than resolved.'
