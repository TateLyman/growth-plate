id: round355_the_stack_audited_against_the_closure_question_and_the_residual_is_the_pool
name: 'Round 355 - the stack audited against "can closure be prevented": the human closure threshold is
  55-92 pmol/L oestradiol and the subject sits at 3.3-6, an order of magnitude below it, so the hormonal
  accelerator is now well covered - and what remains is the oestrogen-INDEPENDENT clock, the resting-zone
  pool, which is the one term nothing in the stack moves'
aliases:
- can closure be prevented
- the oestradiol closure threshold
- aromatase deficiency natural experiment
- the residual clock is the pool
- stack decomposition against closure
type: hypothesis
layer: L12
stub: false
summary: 'With vepdegestrant 100 mg added, the operator asked where the stack actually goes next, and put a
  thesis on the table: that preventing closure entirely is close to possible. The thesis deserves a
  quantitative answer, because the natural experiment for it exists in humans and this atlas already holds it.

  ONE - CLOSURE DECOMPOSES INTO THREE PROGRAMS AND THE STACK COVERS ONLY ONE. (A) THE HORMONAL ACCELERATOR -
  oestrogen driving skeletal maturation and fusion. (B) THE INTRINSIC CLOCK - replication-dependent
  exhaustion of the resting zone, the growth-plate senescence program, which is oestrogen-INDEPENDENT.
  (C) THE TERMINAL EVENT - vascular invasion and replacement of the plate by bone. The current stack contains
  three RATE arms (vosoritide on CNP, erdafitinib on FGFR3, growth hormone) and now TWO arms on program A
  (anastrozole at the ligand, vepdegestrant at the receptor). IT CONTAINS NOTHING ON PROGRAM B AND NOTHING ON
  PROGRAM C.

  TWO - AND PROGRAM A IS NOW PROBABLY BELOW THRESHOLD, WHICH IS THE STRONGEST SUPPORT THE THESIS HAS.
  lanfranco2008 followed a 26-year-old man with congenital aromatase deficiency for five years on transdermal
  oestradiol. At baseline he had eunuchoid proportions, UNFUSED EPIPHYSES, a bone age of 15.5 by TW2 at a
  chronological age of 26.8, height 193.0 cm and arm span 212 cm - and he was STILL gaining height and arm
  span at 24 months. His poor compliance created a natural dose-response: oestradiol of 60.6 pmol/L
  (16.5 pg/mL) was INEFFECTIVE to complete bone maturation, and maturation completed ONLY WHEN SERUM
  OESTRADIOL ROSE ABOVE 73 pmol/L (20 pg/mL), taking more than 20 months. rochira2015 places the field
  threshold at 15 to 25 pg/mL, approximately 55 to 92 pmol/L, which brackets that observation.
  THE SUBJECT IS AT 3.3 TO 6 pmol/L. That is roughly ten to twenty-five fold BELOW the concentration at which
  closure was observed to proceed in a human male.

  THREE - AND THE NATURAL EXPERIMENT SHOWS WHAT THAT BUYS. Men who cannot make oestrogen keep growing into
  their twenties and thirties with open plates: cases in this literature are 24, 25, 26 and 37 years old with
  unfused epiphyses, delayed bone age and continued linear growth. That is not a marginal delay - it is the
  single largest period effect described anywhere in human skeletal biology, and it is achieved by removing
  exactly the thing this stack now removes twice over.

  FOUR - BUT THE THESIS DOES NOT SURVIVE INTACT, AND THE COUNTER IS ALREADY IN THIS FILE. smith2008: in a man
  with an inactivating ERalpha mutation - no receptor at all, from conception - BONE AGE STILL ADVANCED FROM
  15 TO 17.5 YEARS OVER 3.5 YEARS, about 0.7 bone-age years per calendar year. THE CLOCK SLOWS; IT DOES NOT
  STOP. Complete genetic ablation of the pathway leaves a residual maturation rate of roughly seventy per
  cent. So "prevent closure entirely" is not what even the complete lesion achieves - what it achieves is a
  very large delay, and the residual is something else.

  FIVE - THAT RESIDUAL IS PROGRAM B, AND IT IS THE ONE TERM THIS STACK DOES NOT TOUCH. Growth-plate
  senescence is replication-dependent rather than time-dependent: proliferative capacity declines as a
  function of divisions already undergone, which is why growth-inhibiting conditions conserve it and are
  followed by catch-up growth. It is not p16/SASP senescence - R266 closed senolytics for exactly that
  reason, there is nothing to clear. It is the exhaustion of the resting zone, which is the N term of the
  height identity. NOTHING IN THE STACK MOVES N. And every target this atlas has found for it has no
  molecule: HHIP (+9.92 cm human, 95% trunk, no agent in any species), ECRG4 (null mouse body length +0.950
  at P=4.45e-07, zero chemical matter), CLEC3A (+1.52 cm at P=1.2e-43, zero chemical matter), STC2 (+1.37 cm
  at P=4.5e-34, no antibody exists), SPIN4 (loss is the gain, would need a degrader).

  SIX - SO THE FRONTIER HAS MOVED, AND THIS IS THE ANSWER TO WHERE WE GO NEXT. For most of this project the
  open question was "find an agent for the PERIOD". That question is now substantially answered - the ligand
  arm is saturated, the receptor arm is being addressed, and the subject already sits an order of magnitude
  below the observed closure threshold. THE REMAINING QUESTION IS ENTIRELY DIFFERENT: it is whether the
  resting-zone pool can be preserved or expanded, and it is the question every no-molecule target in this
  file sits on. The next round should be a pool round, not a period round.

  SEVEN - AND ONE TENSION INSIDE THE STACK THAT NOBODY HAS STATED, WHICH THEN RESOLVES FAVOURABLY. If
  senescence is replication-dependent, then arms that RAISE proliferation should SPEND the pool faster - and
  three of the stack arms do exactly that. The empirical check runs the other way: vosoritide is
  specifically noted not to advance bone age, and infigratinib showed no bone-age acceleration in the
  randomised PROPEL 3 trial at +1.74 cm/yr. Two agents that raise height velocity without moving the skeletal
  clock is evidence that the rate arms are buying velocity without spending period. That is the favourable
  configuration and it should be stated rather than assumed.

  EIGHT - A PRACTICAL CONSEQUENCE THAT FALLS STRAIGHT OUT OF THE THRESHOLD, AND IT IS FIRST-ORDER. If closure
  proceeds above roughly 55 to 73 pmol/L and stalls below it, then ANYTHING THAT LETS OESTRADIOL RISE BACK
  ACROSS THAT BAND CLOSES THE WINDOW - and in the aromatase-deficiency cases it did so within six to twelve
  months of adequate oestradiol. Missing anastrozole doses is therefore not a minor adherence issue; it is
  the single fastest way to lose the remaining window. The same logic makes any exogenous oestrogen exposure,
  and any interruption of the aromatase inhibitor, a first-order risk rather than a background one.

  NINE - AND A HUMAN RESULT THAT BEARS DIRECTLY ON RECEPTOR-LEVEL MANIPULATION, NEW TO THIS ATLAS.
  zirilli2009 gave a 25-year-old aromatase-deficient man with bone age 15.3 and unfused epiphyses RALOXIFENE
  60 mg/day for 12 months and observed NO CHANGE IN BONE AGE, then transdermal oestradiol for 12 months and
  observed COMPLETE EPIPHYSEAL CLOSURE. A SERM at a bone-active dose did not advance the skeletal clock over
  a year in a plate that was fully capable of closing. That DIRECTLY CONTRADICTS nilsson2003_raloxifene, in
  which raloxifene acted as a full oestrogen agonist at the rabbit growth plate and hastened fusion. n=1
  against an animal model - but for a human decision the human case governs, and it removes one of the
  standing worries about receptor-level agents behaving as agonists at the plate.'
quantitative:
- parameter: 'THE HUMAN OESTRADIOL THRESHOLD FOR EPIPHYSEAL CLOSURE, AND WHERE THE SUBJECT SITS RELATIVE TO IT'
  value: 'lanfranco2008: man with congenital aromatase deficiency, age 26.8, height 193.0 cm, arm span 212 cm,
    BONE AGE 15.5 (TW2) with UNFUSED EPIPHYSES; still gaining height (193.6 cm) and arm span (213 cm) at 24
    and 60 months. Poor compliance with transdermal oestradiol created a natural dose-response: serum
    oestradiol 60.6 pmol/L (16.5 pg/mL) was INEFFECTIVE to complete bone maturation; maturation completed ONLY
    when oestradiol exceeded 73 pmol/L (20 pg/mL), and took MORE THAN 20 MONTHS. rochira2015 places the field
    threshold for oestrogen-driven epiphyseal closure and growth arrest at 15 to 25 pg/mL, approximately 55 to
    92 pmol/L. OPERATOR-STATED SUBJECT VALUE: 3.3 to 6 pmol/L on anastrozole 1 mg - approximately 10 to 25
    fold below the observed closure threshold, and at or below albin2013s half-maximal growth-acceleration
    concentration of 6.5 pmol/L'
  unit: pmol/L; pg/mL
  conditions: lanfranco2008 full text read 2026-08-07 (PDF supplied, recorded in its note field); rochira2015
    review read 2026-08-13; subject value operator-stated 2026-08-13 with assay unspecified.
  species: human
  source_ref: lanfranco2008
  uncertainty: 'THE THRESHOLD IS n=1 AND THE CONFIGURATION IS NOT THE SUBJECTS. lanfranco2008s patient was
    oestrogen-deficient FROM CONCEPTION, so his plates had never received pubertal oestrogen exposure and had
    a bone age of 15.5 at chronological age 26.8; the concentration required to INITIATE maturation in such a
    plate need not equal the concentration required to SUSTAIN an already-advanced maturation programme in a
    subject at bone age 16 whose plates have been exposed for years. rochira2015 is a REVIEW and its 15-25
    pg/mL band is partly about bone-mass maintenance in adulthood rather than closure specifically. And the
    subjects own value is operator-reported at a concentration below routine immunoassay sensitivity, so its
    assay provenance matters. What is robust is the direction and the order of magnitude, not a precise
    threshold.'
- parameter: 'WHAT COMPLETE PATHWAY ABLATION ACTUALLY ACHIEVES - THE RESIDUAL CLOCK'
  value: 'smith2008: a man with an inactivating ERalpha mutation - receptor absent from conception - had bone
    age advance from 15 to 17.5 years over 3.5 years, approximately 0.7 bone-age years per calendar year.
    Aromatase-deficient men in the published case literature present at 24, 25, 26 and 37 years of age with
    unfused epiphyses, delayed bone age and continued linear growth. Against this, the entire aromatase
    inhibitor arm in normal children is worth approximately 1.3 cm over 3 years (R274)'
  unit: bone-age years per calendar year; years of age at presentation
  conditions: smith2008 and the aromatase deficiency case literature as held and reviewed 2026-08-13.
  species: human
  source_ref: smith2008
  uncertainty: 'THE 0.7 FIGURE IS FROM A SINGLE PATIENT AND IS THE MOST IMPORTANT NUMBER IN THIS ROUND,
    because it is what bounds the thesis. It says complete receptor absence slows but does not stop skeletal
    maturation, which places a ceiling on any oestrogen-directed strategy. It is n=1, in a man with a
    congenital lesion, and the residual rate in a subject whose receptor is being partially degraded from
    bone age 16 could be higher or lower. What it establishes qualitatively - that an oestrogen-independent
    maturation programme exists and continues - is not seriously in doubt, because the same conclusion
    follows from the replication-dependent senescence literature.'
- parameter: 'THE STACK MAPPED ONTO THE THREE CLOSURE PROGRAMS - N IS UNCOVERED'
  value: 'RATE ARMS: vosoritide (CNP/cGMP, leg-directed per R318), erdafitinib (FGFR3/ERK/CREB, 73% trunk),
    growth hormone (priced at approximately zero attained height after mid-puberty). PROGRAM A, the hormonal
    accelerator: anastrozole 1 mg at the LIGAND and vepdegestrant 100 mg at the RECEPTOR. PROGRAM B, the
    intrinsic replication-dependent clock: NOTHING. PROGRAM C, vascular invasion and replacement: NOTHING.
    Every atlas target for program B lacks a molecule - HHIP (+9.92 cm, no agent in any species), ECRG4
    (mouse body length +0.950 at P=4.45e-07, no human ChEMBL target), CLEC3A (+1.52 cm at P=1.2e-43, no
    chemical matter), STC2 (+1.37 cm at P=4.5e-34, no antibody exists), SPIN4 (would require a degrader)'
  unit: qualitative mapping
  conditions: assembled 2026-08-13 from the atlas's own arm-by-arm records.
  species: human
  source_ref: kosmicki2026
  atlas_derived: true
  uncertainty: 'THE DECOMPOSITION INTO THREE PROGRAMS IS A FRAMING, NOT A MEASURED PARTITION, and the three
    are not independent - oestrogen accelerates the intrinsic clock, and the intrinsic clock terminates in the
    vascular event. Assigning the residual 0.7 bone-age years per calendar year specifically to
    replication-dependent senescence is an inference from the senescence literature rather than a measurement
    in that patient. What is not an inference is that the stack contains no agent aimed at the resting-zone
    pool, and that every candidate the atlas has identified for it lacks chemical matter.'
- parameter: 'A SERM DID NOT ADVANCE THE SKELETAL CLOCK IN A HUMAN WITH UNFUSED EPIPHYSES'
  value: 'zirilli2009: 25-year-old man with congenital aromatase deficiency, bone age 15.3, unfused epiphyses,
    impaired BMD. RALOXIFENE 60 mg/day orally for 12 months: NO CHANGE IN BONE AGE. Transdermal oestradiol
    25 microg twice weekly for the subsequent 12 months: COMPLETE EPIPHYSEAL CLOSURE. Iliac crest biopsy taken
    before and after raloxifene only'
  unit: bone age change; epiphyseal status
  conditions: zirilli2009, abstract read 2026-08-13.
  species: human
  source_ref: zirilli2009
  uncertainty: 'n=1, AND IT DIRECTLY CONTRADICTS AN ANIMAL RESULT THIS ATLAS ALREADY HOLDS.
    nilsson2003_raloxifene found raloxifene acting as a FULL OESTROGEN AGONIST at the rabbit growth plate,
    hastening distal tibial fusion and cutting growth velocity at P<0.001. The human case and the rabbit
    experiment cannot both describe the same pharmacology at the plate. For a human decision the human case
    governs, but a single patient followed for 12 months with bone age as the endpoint is weak evidence, and
    the sequence was not randomised - raloxifene came first, so any carry-over favours the oestradiol arm.'
localization:
- 'not a localisation result - this is a stack-level audit of which closure programs are covered'
human_evidence: direct
human_evidence_note: 'The closure threshold, the natural experiment of continued growth into adulthood, the
  residual bone-age advance under complete receptor absence, and the raloxifene comparison are all human. The
  replication-dependent senescence model underlying program B is largely rodent.'
species_basis:
- human
translation_risk: low
translation_risk_reason: 'The load-bearing observations are human case data in the exact physiological
  configuration being manipulated; the weakness is small numbers, not species.'
confidence: B
claim_grades:
- claim: The subject sits an order of magnitude below the oestradiol concentration at which epiphyseal closure was observed to proceed in a human male.
  grade: C
  basis: 'lanfranco2008 gives 73 pmol/L as the concentration above which bone maturation completed, and 60.6
    pmol/L as ineffective; rochira2015 places the field threshold at 55-92 pmol/L; the operator states 3.3-6
    pmol/L. Graded C rather than B because the threshold is n=1 in a congenitally oestrogen-deficient man
    whose plate had never been exposed, and because the subject value is operator-reported with unknown assay
    at a concentration below routine immunoassay sensitivity.'
- claim: Removing oestrogen action can prevent epiphyseal closure entirely.
  grade: X
  basis: 'NO, AND THIS IS THE HONEST BOUND ON THE THESIS. smith2008 shows bone age advancing 15 to 17.5 years
    over 3.5 years with the receptor entirely absent from conception - roughly 0.7 bone-age years per calendar
    year. Complete ablation slows the clock substantially; it does not stop it. What is achievable is a very
    large delay, which is what the aromatase-deficiency cases at 24 to 37 years of age with open plates
    represent.'
- claim: The residual, oestrogen-independent clock is replication-dependent resting-zone exhaustion, and nothing in the stack touches it.
  grade: C
  basis: 'The second half is a fact about the stack and is certain - there is no arm aimed at N. The first
    half is an inference from the growth-plate senescence literature, which establishes that proliferative
    capacity declines with divisions undergone rather than with time, and that growth-inhibiting conditions
    conserve it. That literature is largely rodent, and the residual maturation in smith2008 was not
    mechanistically attributed.'
- claim: The rate arms are spending the pool to buy velocity.
  grade: X
  basis: 'NOT SUPPORTED, AND THE CHECK RUNS THE OTHER WAY. If senescence is replication-dependent the worry is
    reasonable, but vosoritide is specifically noted not to advance bone age and infigratinib showed no
    bone-age acceleration in randomised phase 3 at +1.74 cm/yr. Two agents raising velocity without moving the
    skeletal clock is evidence against the concern for those arms.'
