human_evidence: absent
human_evidence_note: >-
  No Smoothened agonist has been given to a human by any route, re-confirmed in R390
  by three clinicaltrials.gov queries. Every parameter in this protocol is scaled or
  derived from mouse, which is precisely why the first pulse is designed as an
  escalation with a two-hour observation on the first dose.
species_basis:
  - mouse
translation_risk: high
translation_risk_reason: >-
  Body-surface-area allometry is a convention for first-in-human starting doses, not
  a law, and there is no pharmacokinetic data for SAG in any species to check it
  against. Both mouse regimens are early-postnatal while the subject is at bone age
  16, and no hedgehog agonist has been given to any animal at an equivalently late
  skeletal stage. The formulation the protocol specifies has not been demonstrated
  to exist. And the interaction with the existing stack is unknown because SAG's
  metabolic route is unpublished.
confidence: C
claim_grades:
  - claim: The target dose is 1.622 mg/kg per administration by BSA allometry from li2021
    grade: C
    basis: >-
      standard allometric scaling from a single mouse regimen, cross-checked to
      within 1.26-fold by an independent regimen. Conventional, but not
      pharmacokinetics
  - claim: >-
      A first-pulse escalation is mandatory given zero human exposure, and costs less
      drug than a flat schedule
    grade: A
    basis: >-
      the absence of human exposure is established (R390); the drug arithmetic is
      arithmetic. This is a design principle, not an empirical claim
  - claim: >-
      The tapered exit is preferable to an abrupt stop
    grade: E
    basis: >-
      rests on R389's composed rebound prediction, which has never been measured in
      any species. Free to do, and the empirical counterweight is trompet2024's local
      pulse, whose gain kept widening after the signal was gone
  - claim: >-
      The blackout-list agents are direct pharmacological opponents during a pulse
      rather than background contraindications
    grade: C
    basis: >-
      each item has a primary showing it opposes hedgehog signalling, but none has
      been tested against a Smoothened agonist in a co-administration experiment in
      any species
  - claim: The interaction between SAG and erdafitinib is unknown
    grade: A
    basis: >-
      SAG's metabolic route is not published in any species. This is an absence, and
      it is recorded as a hole rather than as reassurance
