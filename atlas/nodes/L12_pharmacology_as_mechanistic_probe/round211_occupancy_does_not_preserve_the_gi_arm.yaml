contradicts:
- 'ROUND 209, DIRECTLY. Round 209''s stated main contribution was the molecule-class distinction and its
  claim that an occupying natural ligand is a candidate to ACTIVATE the Gi arm rather than block it. That
  claim is false for osteocrin. It is retained here as CORR-204.'
- 'ROUND 209''s reading of scott2024, which took unchanged plasma cAMP under osteocrin as suggestive of
  preserved Gi signalling. It is the opposite - it is the signature of a Gi-silent ligand.'
- 'The implicit equivalence in rounds 202 and 209 between weber2025''s Npr3-NULL phenotype and what an
  osteocrin dose would produce. A null removes clearance AND Gi; osteocrin blocks clearance, silences Gi and
  RAISES the ligand. The three NPR3-axis height observations agree only in having Gi off.'
