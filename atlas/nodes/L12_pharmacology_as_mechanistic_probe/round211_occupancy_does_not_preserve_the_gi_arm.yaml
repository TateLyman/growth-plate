id: round211_occupancy_does_not_preserve_the_gi_arm
name: ROUND 211 - occupancy does NOT preserve the Gi arm, osteocrin is functionally an NPR-C antagonist,
  and the compound specification inverts because every NPR3-axis height gain on record has the Gi arm OFF
type: hypothesis
layer: L12
aliases:
- the NPR-C molecule class settled
- occupancy is not agonism
- osteocrin is an antagonist
- round 211
stub: false
summary: 'ROUND 209 RANKED NPR3 BLOCKADE BY LIGAND OCCUPANCY AS THE STRONGEST ADDITION TO THE STACK AND
  LEFT ONE BLOCKER. NPR-C is bifunctional - a clearance sink in cartilage, which growth wants silenced,
  and a Gi-coupled receptor through which CNP protects the aorta (aubdool2025), which safety wants active.
  Round 209''s main contribution was a proposed way through: an ANTAGONIST silences both arms, but an
  OCCUPYING NATURAL LIGAND might block clearance while ENGAGING Gi. That claim was graded E, the central
  untested proposition of the round, and the discriminating experiment was written as a one-week aortic-cell
  cAMP assay comparing occupancy against antagonism.

  THE EXPERIMENT HAD ALREADY BEEN DONE, IN A PAPER THIS ATLAS ADDED ON 2026-08-08 AND NEVER OPENED.
  smith2022 ran forskolin-stimulated cAMP in HeLa cells expressing functional human NPR-C, with pharmacological
  controls, and ran organ baths in rat aorta and mouse small mesenteric artery including NPR-C-knockout
  tissue. It used OSTEOCRIN ITSELF, at 100 nM, as one of its two antagonist tool compounds.

  THE RESULT REFUTES ROUND 209. The NPR-C-selective peptide cANF(4-23) at 100 nM clearly LOWERS
  forskolin-stimulated cAMP - it engages Gi. That fall is reversed by M372049 at 10 uM AND BY OSTEOCRIN AT
  100 nM. And osteocrin ALONE does not affect basal forskolin-induced cAMP at all. In the vessel
  preparations, cANF(4-23)-induced vasorelaxation of rat aorta and small mesenteric artery is BLOCKED by
  M372049 AND BY OSTEOCRIN. On the Gi readout and on the vascular readout, OSTEOCRIN IS IN THE SAME
  FUNCTIONAL CLASS AS THE ANTAGONIST IT WAS SUPPOSED TO DIFFER FROM. It occupies the receptor silently and
  stops anything else engaging it.

  THE CLASS DISTINCTION ROUND 209 DREW IS REAL. OSTEOCRIN IS ON THE WRONG SIDE OF IT. The two classes are
  SILENT OCCUPIERS - osteocrin, M372049, nishizawa2017 compound 23, smith2022 compound 41 - against
  OCCUPYING AGONISTS - cANF(4-23), and smith2022 compounds 1 and 17, which are orally-relevant
  bis-aminotriazines with EC50 near 1 micromolar and in vivo pharmacokinetics, shown by fluorescence
  polarisation displacement to bind AT THE SAME SITE AS THE PEPTIDE AGONISTS. UNTIL THIS ROUND THE ATLAS
  DID NOT KNOW THE SECOND CLASS EXISTED.

  BUT THE LIABILITY DOES NOT FOLLOW FROM THE REFUTATION, AND THIS IS WHERE THE ROUND TURNS. The feared
  route was: block NPR-C, lose CNP''s aortoprotection. A GENETIC NULL LOSES THE RECEPTOR. AN OCCUPIER
  RAISES THE LIGAND. Those are different objects, and three independent in vivo models say the
  ligand-raising arm delivers cardiovascular BENEFIT without any Gi involvement. szaroszyk2022 -
  skeletal-muscle Ostn knockout exaggerates and Ostn overexpression ATTENUATES cardiac dysfunction and
  myocardial fibrosis under pressure overload, with the stated mechanism being musclin raising CNP
  ABUNDANCE and acting through PKA and PKG; OSTN is also reduced in skeletal muscle of human heart failure
  patients. harris2023 - Ostn disruption ABOLISHES exercise-induced cardioprotection, with blunted cGMP and
  reduced nuclear PKGI. saw2025 - exogenous musclin POTENTIATES natriuretic peptide signalling in skeletal
  muscle. scott2024 - the sheep infusion, where plasma cAMP was unchanged, now reads not as suggestive
  evidence of Gi engagement but as exactly what a Gi-silent occupier should do.

  THE INVERSION IS THE REAL FINDING, AND IT ARGUES AGAINST THE MOLECULE ROUND 209 ASKED FOR. Gi engagement
  LOWERS cAMP. In chondrocytes cAMP is the PTHrP/PTH1R/Gs arm that holds cells proliferative and delays
  hypertrophy, and the human natural experiment for lowering it is already in this atlas - PDE3A
  gain-of-function, hypertension with brachydactyly type E, gives SHORTENED METACARPALS AND SHORT STATURE
  attributed to accelerated chondrocyte maturation. AND EVERY OBSERVATION OF NPR3-AXIS HEIGHT GAIN ON
  RECORD HAS THE Gi ARM OFF: weber2025''s Npr3-null mice (receptor absent), lauffer2022 and boudin2018''s
  biallelic human patients (receptor absent), and kanai2017''s OSTN transgenics (receptor occupied by what
  is now known to be a silent ligand). THERE IS ZERO SKELETAL DATA WITH THE Gi ARM ON. Gi-OFF may be a
  REQUIREMENT of the height effect rather than a liability to engineer away, in which case the round-209
  specification is backwards for the second time and osteocrin is the right molecule for the opposite
  reason to the one given.

  THE REAGENT THAT SEPARATES THE ARMS EXISTS. devotta2023 built HNPR3-deltaC, human NPR3 truncated by the
  34 C-terminal residues carrying the Gi activator sequence. In Xenopus it RESCUES the clearance-dependent
  programme and FAILS to rescue the Gi-dependent one, confirmed independently by rescuing the latter with
  the adenylyl cyclase inhibitor SQ22536. A receptor that clears but cannot signal, knocked into a mouse,
  answers both halves at once.

  TWO THINGS THE ROUND ADDS AGAINST THE CANDIDATE. First, schn2026 gives the first continuous human serum
  musclin reference values and the median rises only 1.31-fold from birth to 18 years while height velocity
  falls by roughly an order of magnitude - ENDOGENOUS MUSCLIN DOES NOT TRACK GROWTH RATE, there is no
  physiological surge to restore, and any dosing is ELEVATION above a normal baseline, which CORR-203 makes
  the harder claim. Second, jin2023 shows musclin also binds TRANSFERRIN RECEPTOR 1 and antagonises
  Tfr1-mediated cAMP/PKA thermogenesis in beige fat - a second receptor the atlas did not have, and again a
  cAMP-lowering direction.

  WHAT THIS DOES TO THE STACK. Osteocrin stays the top-ranked addition and is now BETTER sourced, not
  worse. What changed is the reason, and the consequence is that THE ANTAGONISTS MOVE UP RATHER THAN DOWN -
  M372049 and nishizawa2017 compound 23 are in the same functional class as osteocrin on the Gi readout, so
  the round-209 reason for preferring the peptide has evaporated, and on every other axis a 12,600-fold
  selective serum-stable small molecule beats a 50-residue peptide. The NPR-C AGONISTS become a separate
  arm - right for the aorta, predicted wrong for the plate, and never tested on bone in any species.

  THE PROCESS FAILURE IS RECORDED AS CORR-205. smith2022 sat in this bibliography with cited_by zero for
  two days while round 209 built a hypothesis it had already refuted.'
quantitative:
- parameter: osteocrin against cANF(4-23) on the NPR-C Gi arm, human receptor
  value: cANF(4-23) 100 nM causes a clear decrease in forskolin-stimulated cAMP; that decrease is reversed
    by M372049 10 uM and by OSTEOCRIN 100 nM; M372049 and osteocrin alone do NOT affect basal
    forskolin-induced cAMP. Small-molecule agonists 1, 17, 26 and 41 at 100 uM inhibit cAMP formation by
    37.67, 31.43, 20.65 and 9.16 per cent respectively, each reversed by M372049 and by osteocrin
  unit: per cent inhibition of forskolin-stimulated cAMP, and reversal
  conditions: smith2022, HeLa cells expressing functional human NPR-C, forskolin 10 uM, IBMX 1 mM, 10 min
    preincubation with agonist
  species: human
  source_ref: smith2022
  uncertainty: 'THE DIRECT REFUTATION OF ROUND 209. Osteocrin is silent on cAMP and blocks the agonists,
    which is the antagonist profile. LIMITS - a single osteocrin concentration (100 nM) in a single cell
    line that is not a chondrocyte and not an aortic cell, cAMP as the only readout, and osteocrin is used
    here as a tool compound rather than being the subject of the study'
- parameter: osteocrin blocks NPR-C-mediated vasorelaxation
  value: cANF(4-23)-induced vasodilatation is completely inhibited by M372049 or by osteocrin in BOTH rat
    aorta and small mesenteric artery; small-molecule agonist 1 is partially blocked and shows a 6.4-fold
    reduction in potency in NPR-C-knockout tissue
  unit: qualitative blockade, and fold potency loss in receptor-null tissue
  conditions: smith2022, organ bath, rat aorta and mouse small mesenteric artery, wild-type against NPR-C
    knockout
  species: rat
  source_ref: smith2022
  uncertainty: 'A FUNCTIONAL VASCULAR STATEMENT, not just a cell assay - osteocrin removes an NPR-C-mediated
    vasorelaxant response in the aorta itself. AGAINST OVERREADING - this is acute pharmacology on
    vasomotor tone, not the chronic structural aortic-root endpoint that aubdool2025 and boudin2018 define,
    and compounds 17 and 41 retained activity in NPR-C-null tissue so the series carries off-target
    vasorelaxation'
- parameter: in vivo cardiovascular direction of osteocrin, three independent models
  value: skeletal-muscle Ostn knockout EXAGGERATES and Ostn overexpression ATTENUATES cardiac dysfunction
    and myocardial fibrosis under pressure overload, with musclin stated to raise CNP abundance and act via
    PKA and PKG; Ostn disruption ABOLISHES exercise-induced cardioprotection with blunted cGMP and reduced
    nuclear PKGI and CREB; exogenous musclin in HFpEF mice potentiates natriuretic peptide signalling in
    skeletal muscle with increased PKG1 activity
  unit: qualitative direction across three models
  conditions: szaroszyk2022 pressure overload; harris2023 exercise then ex vivo ischaemia-reperfusion;
    saw2025 SAUNA HFpEF model with human HFpEF muscle
  species: mouse
  source_ref: szaroszyk2022
  uncertainty: 'THREE INDEPENDENT IN VIVO MODELS ALL FIND OSTEOCRIN CARDIOPROTECTIVE, ROUTED THROUGH LIGAND
    ABUNDANCE AND cGMP/PKG RATHER THAN THROUGH Gi - which is why silencing the Gi arm need not carry the
    feared liability. NONE OF THEM MEASURED AN AORTA. All three endpoints are myocardial or skeletal
    muscle; aubdool2025''s lesion is a dilated ascending aorta and no osteocrin study has imaged one'
- parameter: human serum musclin across childhood
  value: LMS median rises from 3.762 ng/ml at age 0 to 4.267 at 8, 4.527 at 12, 4.792 at 16 and 4.924 at 18
    years - a 1.31-fold rise across the whole of growth; significantly associated with age but NOT with
    sex; women on oestrogen-containing oral contraceptives have significantly lower concentrations
  unit: ng/ml, LMS 50th percentile
  conditions: schn2026, 399 children aged 0.1-18 years (HARP) and 502 adults aged 18-70 (HARA), ELISA in
    duplicate
  species: human
  source_ref: schn2026
  uncertainty: 'THE FIRST HUMAN CONCENTRATION ANCHOR FOR THIS CANDIDATE, and it is unfavourable to the
    physiological framing. The endogenous ligand rises monotonically and shallowly while height velocity
    falls by about an order of magnitude, so musclin does not behave as a growth-rate signal and there is
    no surge to restore. ELISA against an unstated epitope, one cohort, no growth measurements reported
    alongside, and no growth plate or synovial concentrations'
- parameter: a receptor-level separation-of-function reagent for the two NPR3 arms
  value: HNPR3-deltaC, human NPR3 lacking the 34 C-terminal amino acids that carry the Gi activator
    sequence, RESCUES the clearance-dependent programme (neural crest) in Npr3-depleted embryos and FAILS
    to rescue the Gi-dependent one (cranial placode); the latter is independently restored by the adenylyl
    cyclase inhibitor SQ22536
  unit: rescue or failure to rescue, two programmes
  conditions: devotta2023, Xenopus laevis, morpholino knockdown with mRNA rescue
  species: xenopus
  source_ref: devotta2023
  uncertainty: 'THE REAGENT THAT WOULD SETTLE BOTH HALVES IN ONE MOUSE - a receptor that clears but cannot
    signal. THE CONTEXT IS EMBRYONIC ECTODERM IN A FROG, not cartilage and not vasculature, and the
    construct has never been put into a mammal'
- parameter: osteocrin has a second receptor
  value: musclin binds transferrin receptor 1 and ANTAGONISES Tfr1-mediated cAMP/PKA-dependent thermogenic
    induction in beige adipocytes; muscle overexpression attenuates beige fat thermogenesis and exacerbates
    diet-induced obesity, muscle-specific ablation or a neutralising antibody does the reverse
  unit: qualitative direction
  conditions: jin2023, male mice, transgenic and AAV overexpression against muscle-specific ablation
  species: mouse
  source_ref: jin2023
  uncertainty: 'A SECOND RECEPTOR THE ATLAS DID NOT HAVE, and again a cAMP/PKA-LOWERING direction, so any
    chronic osteocrin dosing carries a metabolic off-target. MALE MICE ONLY - CORR-191 applies to the
    phenotype, though the endpoint is metabolic rather than length, so the length clause does not bite'
localization:
- 'human NPR-C expressed in HeLa cells, where the Gi arm is read as forskolin-stimulated cAMP'
- 'rat aorta and mouse small mesenteric artery, where the Gi arm is read as vasorelaxation'
- 'the growth plate chondrocyte, where cAMP is the PTHrP/PTH1R/Gs arm and where NPR-C Gi coupling has NEVER
  been demonstrated - the largest hole this round opens'
- 'beige adipose tissue, via transferrin receptor 1, a second osteocrin receptor'
human_evidence: indirect
human_evidence_note: 'The class assignment is made on the HUMAN receptor in a human cell line, which is the
  strongest part. Everything downstream is animal - the vessels are rat and mouse, the cardioprotection is
  mouse, the separation-of-function construct is frog. The human contributions are the receptor identity,
  the biallelic NPR3 height series carried over from round 209, and the first paediatric serum musclin
  reference range. No NPR-C-directed compound has been given to a human for growth.'
species_basis:
- human
- rat
- mouse
- xenopus
translation_risk: high
translation_risk_reason: 'The refutation is solid but narrow - one concentration of osteocrin, one cell
  line, one readout. The inversion that follows from it - that Gi-OFF may be required for the height effect
  - is an inference from the co-occurrence of Gi-OFF with every height observation plus a cAMP argument
  borrowed from PTH1R biology, and NPR-C Gi coupling has never been shown in a chondrocyte at all.'
confidence: C
claim_grades:
- claim: osteocrin does not engage the NPR-C Gi arm and blocks agonists that do
  grade: C
  basis: one direct functional experiment on the human receptor with the appropriate pharmacological
    controls, corroborated in two vessel preparations including NPR-C-null tissue. Single osteocrin
    concentration, single cell line, and osteocrin was a tool compound rather than the subject
- claim: an occupying NPR-C ligand preserves the Gi arm that an antagonist would block
  grade: X
  basis: FALSE as stated for osteocrin. Round 209 graded this E as its central proposition; smith2022
    refutes it directly. The GENERAL form survives - cANF(4-23) is an occupying ligand that does engage Gi
    - but osteocrin is not that molecule
- claim: occupying NPR-C agonists exist that would block the sink and engage Gi
  grade: B
  basis: cANF(4-23) is decades-old pharmacology and smith2022 adds small molecules binding the same site by
    fluorescence-polarisation displacement, with EC50 near 1 uM and in vivo PK. Off-target vasorelaxation
    persists in NPR-C-null tissue for part of the series
- claim: osteocrin is cardioprotective in vivo despite silencing the Gi arm
  grade: C
  basis: three independent mouse models with consistent direction and a matching human expression
    observation in heart failure, all routed through ligand abundance and cGMP/PKG. NONE measured an aorta
- claim: NPR-C Gi engagement would shorten bone by lowering chondrocyte cAMP
  grade: E
  basis: INFERENCE, and flagged as such. It rests on PTH1R/Gs/cAMP holding chondrocytes proliferative, on
    the PDE3A gain-of-function human phenotype as the natural experiment for lowering that cAMP, and on the
    observation that every NPR3-axis height gain on record has Gi off. NPR-C Gi coupling has never been
    demonstrated in a chondrocyte
- claim: endogenous serum musclin tracks growth velocity in humans
  grade: X
  basis: FALSE. The LMS median rises 1.31-fold from birth to 18 years while height velocity falls by
    roughly an order of magnitude
- claim: any NPR-C-directed compound has been given for growth in any species
  grade: X
  basis: FALSE, unchanged from round 209. None
key_refs:
- ref_id: smith2022
  year: 2022
  type: primary
  role: THE PAPER THAT SETTLES THE ROUND AND THE PAPER THIS ATLAS HELD UNREAD. Human NPR-C cAMP assay plus
    rat aorta and mouse mesenteric organ baths, using osteocrin at 100 nM as an antagonist tool compound
    alongside M372049, and identifying a class of small-molecule NPR-C agonists binding the peptide-agonist
    site
- ref_id: devotta2023
  year: 2023
  type: primary
  role: THE SEPARATION-OF-FUNCTION REAGENT. HNPR3-deltaC, human NPR3 without the Gi activator sequence,
    rescues the clearance-dependent programme and not the Gi-dependent one
- ref_id: szaroszyk2022
  year: 2022
  type: primary
  role: OSTEOCRIN IS CARDIOPROTECTIVE BY RAISING CNP ABUNDANCE, not by signalling - muscle Ostn knockout
    worsens and overexpression attenuates pressure-overload cardiac dysfunction and fibrosis
- ref_id: harris2023
  year: 2023
  type: primary
  role: Ostn disruption abolishes exercise-induced cardioprotection with blunted cGMP and reduced nuclear
    PKGI, a second independent in vivo model in the same direction
- ref_id: saw2025
  year: 2025
  type: primary
  role: exogenous musclin potentiates natriuretic peptide signalling in skeletal muscle in HFpEF mice, the
    third independent model, with a matching human muscle observation
- ref_id: schn2026
  year: 2026
  type: primary
  role: THE HUMAN CONCENTRATION ANCHOR - first continuous LMS reference percentiles for serum musclin in
    399 children and 502 adults, showing the endogenous ligand does not track growth velocity
- ref_id: jin2023
  year: 2023
  type: primary
  role: THE SECOND RECEPTOR - musclin binds Tfr1 and antagonises Tfr1-mediated cAMP/PKA thermogenesis in
    beige fat, so osteocrin is not an NPR3-only ligand
- ref_id: aubdool2025
  year: 2025
  type: primary
  role: THE LIABILITY THIS ROUND WAS TRYING TO CLEAR - NPR-C is the receptor through which CNP protects the
    aorta, and global nulls have a dilated ascending aorta at baseline
- ref_id: weber2025
  year: 2025
  type: primary
  role: the h_term and vertebral evidence, and one of the three Gi-OFF height observations
- ref_id: kanai2017
  year: 2017
  type: primary
  role: the additivity evidence, and now known to be a Gi-OFF observation because the occupying ligand is
    silent
- ref_id: scott2024
  year: 2024
  type: primary
  role: REINTERPRETED. Unchanged plasma cAMP under osteocrin infusion in sheep read in round 209 as
    suggestive of preserved Gi signalling; it is what a Gi-silent occupier should produce
- ref_id: maass2015
  year: 2015
  type: primary_abstract_only
  role: the human natural experiment for lowered chondrocyte cAMP - PDE3A gain-of-function gives
    brachydactyly and short stature
