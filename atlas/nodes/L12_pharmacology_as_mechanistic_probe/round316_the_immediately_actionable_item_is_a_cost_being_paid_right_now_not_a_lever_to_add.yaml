claim_grades:
- claim: The subject's thyroid status is a live, unmeasured height variable on this stack.
  grade: B
  species: human
  source_ref: behan2011
  basis: rhGH suppresses thyroid function with a fall in thyroxine as the commonest finding, driven mainly by increased
    peripheral T4-to-T3 conversion and separately by unmasking of central hypothyroidism, which occurred biochemically
    in 36-47% of apparently euthyroid hypopituitary adults on GH replacement. In children, a GREATER fT4 fall after
    starting rhGH is associated with a WORSE growth response, and the stated clinical implication is that persistent
    fT4 decrease can significantly reduce height velocity and should prompt consideration of levothyroxine. The
    subject is on GH and no TSH, free T4 or free T3 appears anywhere in this atlas. CLAUDE.md carried this as an
    explicitly open, unsourced question since round 282.
- claim: Raising thyroid hormone above the normal range would add height.
  grade: X
  species: human
  source_ref: delvecchio2015
  basis: 'NO, and the ceiling has to be stated with the recommendation or it becomes failure mode #1. The growth
    endpoint SATURATES at adequate replacement - in 215 patients over 20 years neither age at diagnosis nor starting
    dose predicted final height. And T3 both induces hypertrophy AND advances skeletal maturation, so supraphysiological
    dosing spends the period. The target is mid-normal. This is a cost to stop paying, not a lever to push, and
    it is the fifth band in this file to behave that way.'
- claim: The immediately actionable set requires anything that does not already exist.
  grade: X
  species: human
  source_ref: plluaas2026
  basis: NO - and that is the point of the round. One ordinary blood draw covers TSH/free T4/free T3, fasting insulin
    and glucose for HOMA-IR (which decides metformin, the only period-directed agent in round 297's audit), CRP
    and IL-6 (inflammatory tone, never once recorded), IGF-1, and the vitamin D, calcium, phosphate and PTH baseline
    the aromatase-inhibitor bone cost must be read against. BoneXpert run on an EXISTING left-hand film returns
    Greulich-Pyle, Tanner-Whitehouse-3 and the Bone Health Index at zero extra radiation or cost, and the spread
    between methods is worth 2.2 cm of predicted adult height. The subtraction audit - NSAIDs, alpha-ketoglutarate,
    megadose vitamin C, alcohol, and re-running the contraindication screen against the actual medication list -
    costs nothing at all.
