stub: false
summary: "ZERO - THE QUESTION REFRAMED. Fifteen rounds have asked what to ADD. Every answer has been a\ntarget with\
  \ no molecule or a molecule with no evidence. The question nobody asked is what is being\nSUBTRACTED right now,\
  \ and whether anything correctable is already costing height. That question has answers,\nthey are cheap, and\
  \ several are available this week.\n\nONE - ⭐ THE LEAD ITEM: rhGH LOWERS FREE T4, AND THE SIZE OF THE FALL PREDICTS\
  \ A WORSE GROWTH RESPONSE.\nCLAUDE.md carried this as an explicitly OPEN and UNSOURCED question - \"does GH itself\
  \ lower free T4 here?\" -\nattached to CORR-293. It is not open. The paediatric endocrine literature is consistent:\n\
  · **rhGH suppresses thyroid function, the commonest observation being a FALL IN THYROXINE.** The main\n  mechanism\
  \ is increased peripheral T4-to-T3 conversion; separately, rhGH **UNMASKS CENTRAL HYPOTHYROIDISM**.\n· In adult\
  \ hypopituitary patients GH replacement unmasked central hypothyroidism biochemically in\n  **36-47% of apparently\
  \ euthyroid patients**.\n· ⭐ **THE DECISIVE LINE FOR THIS CASE: children with a GREATER fT4 DECREASE after starting\
  \ rhGH RESPONDED\n  WORSE to that therapy** - the fT4 fall is associated with a lower growth response - and the\
  \ stated clinical\n  implication is that a persistent rhGH-induced fT4 decrease can significantly reduce height\
  \ velocity, in\n  which case **levothyroxine supplementation should be considered.**\n=> **THIS SUBJECT IS ON\
  \ GROWTH HORMONE AND HIS TSH, FREE T4 AND FREE T3 APPEAR NOWHERE IN THIS ATLAS.**\n\nTWO - WHY THE ATLAS ALREADY\
  \ SAYS THIS IS A HEIGHT ENDPOINT AND NOT A LAB CURIOSITY.\n· `thyroid_hormone_t3` is grade A that **T3 INDUCES\
  \ HYPERTROPHY** - and hypertrophic volume is roughly 80% of\n  longitudinal growth, the largest term in the identity.\n\
  · `delvecchio2015`, 215 patients over 20 years: **adequate levothyroxine restores final height to normal and\n\
  \  EXCEEDS target height**, and neither age at diagnosis nor starting dose predicted final height - the growth\n\
  \  endpoint SATURATES once replacement is adequate.\n· `cammisa2024`: acquired hypothyroidism arrests growth,\
  \ catch-up is often incomplete, many never reach\n  genetic height, and **PUBERTAL-ONSET IS THE WORST** - which\
  \ is this subject's stage.\n· T4 is a prohormone requiring 5'-deiodination by DIO1/DIO2, and **DIO2 and DIO3 are\
  \ expressed locally in\n  skeletal tissue**, so serum T4 and the T3 the plate actually sees can dissociate - an\
  \ argument for\n  measuring, not for assuming.\n\nTHREE - ⛔ AND THE CEILING IS EXPLICIT, WHICH IS WHY THIS IS\
  \ A COST TO STOP PAYING AND NOT A LEVER TO PUSH.\nThe gain **saturates at adequate replacement** (delvecchio2015).\
  \ Pushing free T4 ABOVE the reference range\ndoes not buy more height and runs the wrong way: T3 induces hypertrophy\
  \ AND **advances skeletal maturation**,\nso supraphysiological dosing spends the period - failure mode #1, the\
  \ same trade rejected for PRC2, for GH\nafter mid-puberty, and for fermented oyster extract. **The target is mid-normal,\
  \ not high.** This is the fifth\nband in this file behaving like all the others.\n✓ It is also the CORRECT half\
  \ of CORR-293. That correction warned against deliberately LOWERING thyroid tone\nto slow bone age; the inversion\
  \ it recorded - that a free T4 below range on this stack is a cost to correct -\nis the actionable half, and it\
  \ has sat unactioned since round 282.\n\nFOUR - ⭐ ONE BLOOD DRAW CLOSES FIVE OPEN QUESTIONS IN THIS FILE. None\
  \ of these is a project.\n| assay | what it decides | where it is open |\n|---|---|---|\n| **TSH, free T4, free\
  \ T3** | whether GH is costing height via thyroid suppression, correctable with a cheap generic | this round;\
  \ CORR-293 open since R282 |\n| **fasting insulin, glucose, HOMA-IR** | whether metformin is a live PERIOD lever\
  \ or a contraindication that lowers IGF-1 bioavailability against the GH arm | `g_l12_is_this_subject_insulin_resistant_and_does_that_open_a_period_lever`,\
  \ open since R297 |\n| **CRP, IL-6** | inflammatory tone, never once recorded; IL-6 blockade gives catch-up growth\
  \ in inflammatory arthritis | R297, \"never examined\" |\n| **IGF-1** (repeat) | the only serial number the stack\
  \ has; baseline 198 | R269 - it does not predict growth potential, but it tracks the GH arm |\n| **25-OH vitamin\
  \ D, Ca, PO4, PTH** | the baseline the aromatase-inhibitor bone cost has to be read against | R278 |\n**Everything\
  \ above is standard, ordinary, and orderable at one visit.**\n\nFIVE - ⭐ TWO ZERO-RADIATION, ZERO-COST MEASUREMENTS\
  \ THAT USE FILMS HE LIKELY ALREADY HAS.\n· **RUN BoneXpert ON THE EXISTING LEFT-HAND FILM.** A SETTLED row since\
  \ R282: one film returns Greulich-Pyle\n  **and** Tanner-Whitehouse-3 **and** the Bone Health Index at **zero\
  \ extra radiation, visits or cost**. In\n  `plluaas2026` the three maturity methods spanned 0.5 years = **2.2\
  \ cm of predicted adult height**. If bone\n  age is being read by eye, the single most decision-relevant number\
  \ in this whole case has an unquantified\n  error bar on it.\n· **BASELINE LATERAL THORACOLUMBAR FILM + DXA.**\
  \ R278: the aromatase inhibitor's bone cost is an **EFFICACY**\n  term, not a safety footnote - lumbar BMD Z fell\
  \ in BOTH arms (-1.33 to -1.54 anastrozole; -1.37 to -1.94\n  letrozole) with anterior vertebral wedging in 2\
  \ boys on films beyond 4 years. **The residual at this bone\n  age is trunk-dominant, so vertebral wedging subtracts\
  \ directly from the goal.** Baseline it now, repeat\n  past 2 years.\n\nSIX - THE SUBTRACTION AUDIT: things that\
  \ may be costing height and cost nothing to stop.\n· ⚠ **NSAIDs.** PTGS1 is the plate's cyclooxygenase (14/20\
  \ in donor 2, HZ 805) while PTGS2 is 0/10 in BOTH\n  donors, feeding Gs-coupled PTGER4. A non-selective NSAID\
  \ lowers PGE2 to EP4 to Gs to cAMP - **the direction\n  that shortens every member of the iPPSD family**. Grade\
  \ E, no length endpoint, watch-item not established\n  harm - but it is a common OTC class and stopping is free.\n\
  · ⛔ **ALPHA-KETOGLUTARATE.** A common longevity supplement and a **named contraindication in this file**:\n  it\
  \ is the TET co-substrate, and TET1 loss is **+8.32 cm in 1.45M people**, so feeding TET runs the\n  height-LOSING\
  \ direction. If it is in the supplement stack, it comes out.\n· ⛔ **MEGADOSE VITAMIN C**, by the atlas's own AKG\
  \ argument (R302): ascorbate is the other cofactor of the\n  same dioxygenase family and the 5hmC literature uses\
  \ it precisely to RAISE TET output. Grade E, mechanism\n  only. **HARD CAVEAT: this is about MEGADOSING, never\
  \ about adequacy - ascorbate is required for collagen\n  prolyl/lysyl hydroxylation and scurvy is a skeletal disease.**\n\
  · ⚠ **ALCOHOL / ACETALDEHYDE.** R311: **Aldh2 knockout ACCELERATES chondrocyte maturation (+1.111 at\n  -log10p\
  \ 6.60, 241 CPM)**, and disulfiram - an approved ALDH2 inhibitor - is a direct contraindication.\n  Acetaldehyde\
  \ loads the same enzyme. Grade E, costs nothing, and was never mentioned here.\n· ⛔ **RE-RUN THE CONTRAINDICATION\
  \ SCREEN AGAINST HIS ACTUAL MEDICATION LIST.** R300 said to and it was never\n  done. The list has grown: rapalogs\
  \ and calcineurin inhibitors (MTOR -3.65 cm; FKBP1A +4.605 in the\n  maturation screen), tazemetostat, DOT1L inhibitors,\
  \ silmitasertib, disulfiram, teprotumumab, regorafenib,\n  HDAC inhibitors including **givinostat**, and DNMT\
  \ inhibitors.\n\nSEVEN - WHAT THIS ROUND IS AND IS NOT. It is not an addition to the stack and it does not pretend\
  \ to be one.\nIts claim is narrower and better supported than anything in rounds 311 to 315: **there is a plausible,\n\
  correctable, currently-unmeasured height cost sitting inside the arm this subject is already taking, plus a\n\
  set of free measurements and free subtractions that have been named in this file for up to thirty rounds and\n\
  never actioned.** The expected value is not large - adequate replacement restores normal, it does not exceed\n\
  it - but it is available now, it is cheap, it is reversible, and unlike everything else in the last five\nrounds\
  \ it requires no molecule that does not exist.\n⚠ **Levothyroxine is prescription and requires titration and monitoring\
  \ - this is a conversation with the\ntreating endocrinologist, not a self-directed change, and over-replacement\
  \ actively spends the period.**"
human_evidence: direct
human_evidence_note: Unusually for this file, the central evidence is human and clinical. rhGH lowering free T4
  and unmasking central hypothyroidism is documented in children on rhGH and in adult hypopituitary cohorts (36-47%
  unmasked); the association between a larger fT4 fall and a worse growth response is reported in GH-deficient children.
  delvecchio2015 is 215 patients over 20 years with final height. cammisa2024 is human acquired hypothyroidism with
  pubertal onset worst. The subject's own thyroid, insulin and inflammatory status are UNMEASURED, which is the
  point of the round.
species_basis: human
translation_risk: low
translation_risk_reason: 'LOW, and this is the only item in the last six rounds that earns that. The evidence is
  human, clinical and in the relevant treatment context - children receiving rhGH. The intervention is an approved
  generic with decades of paediatric use and a measurable biomarker to titrate against. The main risk is not translation
  but OVER-correction: T3 advances skeletal maturation, so pushing free T4 above the reference range spends the
  period rather than extending it, and the growth endpoint saturates at adequate replacement.'
confidence: B
confidence_reason: Graded B. That rhGH lowers free T4 and can unmask central hypothyroidism is well established.
  That the magnitude of the fT4 fall tracks a worse growth response is reported and is the load-bearing claim, and
  it is graded B rather than A because it is an association within treated cohorts rather than a randomised comparison
  of levothyroxine added to rhGH. That adequate replacement restores and exceeds target height is A (215 patients,
  20 years). What is entirely unknown is this subject's actual thyroid status - the round's recommendation is to
  MEASURE, which carries no inferential risk at all.
limitations: The subject's thyroid status is unmeasured, so this round asserts a plausible cost and not a demonstrated
  one - he may be perfectly euthyroid, in which case the item closes for free. The fT4-fall-versus-growth-response
  association is observational within GH-treated cohorts and is confounded by GH dose, adherence and underlying
  diagnosis; no randomised trial has added levothyroxine to rhGH in euthyroid-but-falling-fT4 children with adult
  height as the endpoint. delvecchio2015 is CONGENITAL hypothyroidism, a different population from a possible GH-induced
  fall at bone age 16, and CORR-203 applies - restoration in a deficient system is a claim about the deficit. Most
  of the subtraction audit is grade E mechanism with no length endpoint in any species. Nothing here has been measured
  in this subject and the whole round is contingent on assays that have not been run.
