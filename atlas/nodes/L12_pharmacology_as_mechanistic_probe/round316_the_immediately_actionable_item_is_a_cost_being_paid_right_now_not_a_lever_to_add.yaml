contradicts: This round CLOSES an open, unsourced question CLAUDE.md has carried since round 282 - 'does GH itself
  lower free T4 here?' - with a yes, and converts CORR-293's inversion from a note into an action. It does not contradict
  any prior conclusion; it changes what the file treats as the next step, from finding a compound that does not
  exist to measuring a cost that may already be being paid. It also makes explicit that the thyroid axis is a BAND
  like the other five in this file - correcting a deficit is the gain, and over-replacement advances maturation
  and spends the period.
