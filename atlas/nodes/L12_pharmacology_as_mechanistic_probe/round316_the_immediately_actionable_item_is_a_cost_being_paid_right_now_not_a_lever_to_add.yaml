id: round316_the_immediately_actionable_item_is_a_cost_being_paid_right_now_not_a_lever_to_add
name: ROUND 316 - the immediately actionable item is not a compound to add but a HEIGHT COST probably being paid
  right now. rhGH LOWERS free T4, the size of that fall predicts a WORSE growth response, and this subject is on
  GH with his thyroid status unrecorded anywhere in this atlas. One blood draw decides it and four other open questions
  at the same time
