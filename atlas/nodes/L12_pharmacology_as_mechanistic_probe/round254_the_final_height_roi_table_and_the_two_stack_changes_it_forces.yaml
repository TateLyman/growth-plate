contradicts: >-
  CORRECTS the_stack_in_a_normal_human, which lists growth hormone alongside FGFR3 inhibition as the
  AMPLIFICATION arm. Round 183's flux decomposition of hunziker1994 put GH at 0.77 of control on
  amplification and 97 per cent of its log effect on pool consumption rate, and the zone-height evidence the
  attribution was built on is the kind hunziker himself says is unreliable for growth rate. ALSO SUPERSEDES
  the +1.3 cm predicted-height figure carried in aromatase_inhibitor_letrozole and
