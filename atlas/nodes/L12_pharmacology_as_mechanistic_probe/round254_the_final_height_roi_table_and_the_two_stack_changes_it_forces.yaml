id: round254_the_final_height_roi_table_and_the_two_stack_changes_it_forces
name: >-
  ROUND 254 - every lever converted into centimetres of ATTAINED adult height, and the table forces two
  changes to the stack. GROWTH HORMONE BUYS NO FINAL HEIGHT AFTER MID-PUBERTY - two independent human
  studies, one prospective with n=127 - and the mechanism this atlas already held says why. ANASTROZOLE
  SHOULD BE LETROZOLE - the more potent inhibitor beats it five-fold on attained height while the two look
  identical on every surrogate
aliases:
- round 254
- the ROI table
- what actually buys final height
- GH after mid-puberty is zero
- letrozole over anastrozole
type: hypothesis
layer: L12
stub: false
summary: >-
  THE INSTRUCTION WAS TO STOP OPTIMISING VELOCITY AND FIND WHATEVER GIVES THE BIGGEST FINAL HEIGHT. This
  atlas has the identity, has the terms, and has never once written the levers down in centimetres of
  ATTAINED adult height side by side. Doing that changes the stack.

  THE IDENTITY, RESTATED FOR A SUBJECT WHO IS LATE. Round 247 gives HEIGHT = integral of lambda x N x A x
  h_term dt. For someone at bone age 16 the integral is nearly spent, so the quantity that decides the
  answer is not the rate but the REMAINING RESERVE TIMES THE YIELD ON IT:

      remaining height  =  N_remaining  x  A  x  h_term

  where A is amplification - terminal cells delivered per progenitor consumed - and h_term is terminal
  hypertrophic cell height. The atlas measured the split three times in three species from four contrast
  types with no shared data and got the same answer each time: EIGHTY-EIGHT TO NINETY-ONE PER CENT OF THE
  YIELD IS AMPLIFICATION AND ABOUT TEN PER CENT IS CELL HEIGHT (kember1976 human, lui2018 mouse,
  nilsson2014 rabbit). An agent that raises the RATE without raising A or h_term does not add final height.
  It converts reserve into velocity at par.

  ONE - THE FIRST STACK CHANGE, AND IT IS THE LARGEST SINGLE FINDING OF THIS ROUND. GROWTH HORMONE BUYS NO
  FINAL HEIGHT AFTER MID-PUBERTY, AND THAT IS NOW HUMAN OUTCOME DATA RATHER THAN INFERENCE.
  vliegenthart2026, prospective, multicentre, 2017-2024, 127 adolescents with childhood idiopathic isolated
  GH deficiency who retested GH-SUFFICIENT at mid-puberty; 44 continued rhGH and 83 stopped, followed to
  near adult height with 99 per cent completion. NEAR ADULT HEIGHT SDS MINUS TARGET HEIGHT SDS WAS -0.17
  CONTINUING AND -0.18 STOPPING, P = 0.96. Total pubertal growth in males 27.5 cm continuing against 25.9
  stopping, P = 0.25. cantasorsdemir2026 reaches the same place from the other direction and contains its
  own positive control: in 72 children with ISS or partial GH deficiency, GH from before puberty raised
  PREDICTED adult height by 8 cm in boys, P < 0.01 - and then the difference between ATTAINED near adult
  height and the prediction made AT PUBERTY ONSET was MINUS 0.62 cm, P = 0.75. GH'S ENTIRE FINAL-HEIGHT
  BENEFIT IS DELIVERED BEFORE PUBERTY AND NONE OF IT IS RECOVERABLE AFTERWARDS.

  AND THE MECHANISM THIS ATLAS ALREADY HELD SAYS EXACTLY WHY, WHICH IS WHAT MAKES THE TWO NULLS
  INTERPRETABLE RATHER THAN JUST DISCOURAGING. hunziker1994 is the only experiment reporting growth rate,
  terminal cell height, resting cycle time and resting cells per column in the SAME animals, and round 183
  decomposed it exactly: GH raised growth 5.26-fold as x5.00 POOL CONSUMPTION RATE, x1.36 terminal cell
  height, and x0.77 AMPLIFICATION - below one. The pool term is 97 per cent of the log effect. chu2025
  then showed the same thing in the cell: GH shifts growth-plate stem cell divisions toward the COMMITTED
  side and depletes the slow-cycling pool, cell-autonomously through GHR. A drug whose action is 97 per
  cent pool consumption cannot add height to someone whose pool is the binding constraint. It spends the
  reserve faster and returns slightly less per cell.

  THE HONEST DISSENT, RECORDED NOT BURIED. nearfinal2026 found GH co-therapy significantly associated with
  greater height gain among AI-treated boys (P = 0.022), and yackobovitchga2025's GH-plus-AI arm gained
  more over baseline prediction than its GH-only comparator. Neither is a test of adding GH to an
  AI-treated GH-sufficient adolescent: nearfinal2026's cohort is 31 per cent GH-deficient, where GH is
  replacement, and yackobovitchga2025's contrast measures the AI increment on GH, not the GH increment on
  AI. The limit on hunziker1994 travels too - it is rescue from hypophysectomy, not enhancement above
  normal. What is NOT limited is vliegenthart2026, whose subjects were GH-SUFFICIENT on retesting, which
  is the closest published analogue to giving GH to someone who does not need it.

  TWO - THE SECOND STACK CHANGE. ANASTROZOLE SHOULD BE LETROZOLE, AND THE ATLAS PREDICTED THIS BEFORE THE
  DATA CONFIRMING IT WAS READ PROPERLY. duration_lever_is_a_switch_not_a_slope argued that fusion is a
  THRESHOLD rather than a slope - the lead common CYP19A1 variant moves height 0.054 SD per allele while
  complete loss of the same gene moves it about 4 SD, a seventy-fold gap between graded and complete
  perturbation - and predicted that the more potent aromatase inhibitor would beat the less potent one ON
  REAL HEIGHT WHILE BOTH LOOKED SIMILAR ON SURROGATES. Both halves are now confirmed in print.
  ON THE SURROGATE: zegarra2024, a three-year open-label randomised trial in 79 pubertal boys, found
  letrozole produced higher testosterone, lower oestradiol, slower growth velocity and slower bone-age
  advance than anastrozole - a clearly stronger biochemical and skeletal-maturation effect - and NO
  DIFFERENCE BETWEEN THE DRUGS in change of PREDICTED adult height, with a combined three-year gain of only
  +1.3 cm.
  ON REAL HEIGHT: nearfinal2026, 72 males with advanced or rapidly advancing bone age treated to near-final
  height, median 25 months. LETROZOLE MEDIAN GAIN 4.2 cm (IQR 0.6 to 13) AGAINST ANASTROZOLE 0.8 cm (IQR
  -2.6 to 3.5), P = 0.013, with letrozole reaching a near-final height closer to mid-parental height, P =
  0.031. A FIVE-FOLD DIFFERENCE ON THE ENDPOINT THAT MATTERS, INVISIBLE ON THE ENDPOINT THE RANDOMISED
  TRIAL USED.
  THE COMPOUND NODES OF THIS ATLAS STILL SAY THE OPPOSITE AND THEY ARE STALE. aromatase_inhibitor_letrozole
  and aromatase_inhibitor_anastrozole both rest on cui2025's propensity-matched target-height-adjusted SDS,
  where anastrozole plus rhGH scored 0.81 against letrozole plus rhGH at 0.60, and the letrozole node reads
  it as a cautionary result. cui2025 is a between-group SDS comparison in matched cohorts; nearfinal2026 is
  a WITHIN-PATIENT gain against each patient's own baseline prediction, which is the contrast that isolates
  what the drug added. Both are observational and they disagree. CORR-263 records the disagreement and
  moves the atlas to letrozole on the within-patient endpoint, without pretending cui2025 has been
  refuted.

  THREE - AND THE SIZE OF THE AROMATASE ARM WAS BEING UNDERSTATED, BECAUSE THE ATLAS WAS CARRYING A
  PREDICTED-HEIGHT NUMBER FOR AN ATTAINED-HEIGHT QUESTION. The +1.3 cm figure quoted throughout is
  zegarra2024's three-year change in PREDICTED adult height. yackobovitchga2025 measured what was actually
  reached: 27 midpubertal boys with fast puberty on an AI against matched untreated controls reached 166.6
  +/- 3.1 cm against 163.4 +/- 1.3, P = 0.003, and the difference between attained adult height and BASELINE
  predicted adult height was +3.8 +/- 3.5 cm on treatment against -0.3 +/- 5.0 in controls, P = 0.001. The
  aromatase arm is worth about THREE TO FOUR CENTIMETRES OF ATTAINED HEIGHT in midpubertal boys, not 1.3.
  Bayley-Pinneau prediction is calibrated on children whose bone age and height advance together; an
  aromatase inhibitor is an intervention whose entire purpose is to break that coupling, so a
  predicted-height endpoint is measuring the surrogate the drug was designed to distort.

  FOUR - THE TABLE. Every lever this atlas holds, converted to centimetres of ATTAINED adult height for a
  male at bone age 16, with the conversion assumption stated and the reason it might be wrong. Rows are
  ordered by best estimate. THE NUMBERS ARE NOT ADDITIVE and nothing here has been measured in a subject at
  bone age 16.
  ONE - AROMATASE INHIBITION, LETROZOLE. About +4 cm (nearfinal2026 median within-patient gain 4.2 cm;
  yackobovitchga2025 +3.8 cm for the class). WHY IT MIGHT BE LESS HERE: both cohorts started in MIDpuberty,
  and nearfinal2026 found earlier pubertal stage at start (P = 0.012) and longer treatment (P = 0.005) each
  predicted greater gain. Bone age 16 is later than either cohort's mean.
  TWO - THE CNP ARM, VOSORITIDE OR NAVEPEGRITIDE. Not separately quantified for final height, but it is the
  only agent in the stack with a PROVEN BONE-AGE-SPARING effect - dauber2026 raised velocity 4.0 SD in
  non-FGFR3 children with the bone-age-to-chronological-age ratio unmoved - and it partitions onto h_term,
  the second yield term, rather than onto pool consumption. Velocity that does not cost bone age is the
  only kind that converts.
  THREE - FGFR3 INHIBITION, ERDAFITINIB. The amplification arm proper; kot2026 puts an FGFR inhibitor's
  effect specifically in the PROLIFERATIVE zone, which is the compartment whose size IS amplification.
  Unquantified for final height in a normal human.
  FOUR - INTERMITTENT PTH1R AGONISM. About +0.5 to +1 cm if the rat relative effect transfers (ogawa2002,
  +10 to +13 per cent longitudinal growth rate in NORMAL rats at two ages), and the human safety anchor is
  real - winer2018 gave 14 children twice- or thrice-daily PTH(1-34) for up to ten years with NORMAL mean
  height velocity throughout and no premature fusion. Term attribution untested: nobody has measured
  terminal cell height or resting-zone cycle time under a PTH1R agonist, so it is not established that this
  raises A rather than consuming pool. If it consumes pool it is a second growth hormone.
  FIVE - GROWTH HORMONE. ZERO, and possibly negative on reserve. Two human studies above; x0.77
  amplification and x5.00 pool consumption in the one decomposition; pool depletion cell-autonomous through
  GHR in chu2025. It also advances bone age, which is the currency every other lever is trying to conserve.
  SIX - LOCAL HEDGEHOG AGONISM. trompet2024's intra-articular SAG bead gave rat femur +3.63 per cent at six
  months and the effect GREW rather than washing out, which scaled naively onto a human femur is of the
  order of a centimetre - but it is an intra-articular bead into a secondary ossification centre, systemic
  SAG did nothing to bone length, and the bead moved pool, h_term and growth rate together.
  SEVEN - PERIOSTEAL RELEASE. About +1 cm in children (kitta2024, round 253), with an ROC age cutoff of 9.6
  YEARS. Almost certainly zero at bone age 16.
  EIGHT - THE OESTROGEN-NULL DURATION CEILING. About 1 cm per year into the third decade (maffei2004 1.44,
  imre2025 0.83) - the largest number in the file - but it requires COMPLETE lifelong absence of oestrogen
  signal, and duration_lever_is_a_switch_not_a_slope establishes that pharmacological suppression sits on
  the flat part of the curve. This row is a benchmark, not a lever.

  FIVE - WHAT THE TABLE SAYS TO DO, STATED PLAINLY. Move the aromatase arm from anastrozole to letrozole
  and run it as long as tolerable, because it is the only row with attained-height evidence and the drug
  choice within the row is worth more than the row's own average. Keep the CNP arm, because bone-age-sparing
  velocity is the only velocity that survives the identity. Keep FGFR3 inhibition, because it is the only
  agent aimed at amplification. Treat growth hormone as a velocity agent with a reserve cost and no
  demonstrated final-height return at this stage, and stop counting it as an amplification agent - the
  stack node still lists it as one, on a zone-height attribution that round 183 overturned with flux
  quantities.

  AND WHAT THE TABLE SAYS ABOUT THE WHOLE PROGRAMME. Every row with human attained-height evidence is worth
  three to four centimetres or less. Every row that would be worth more - amplification raised directly,
  the oestrogen-null decade - is either unmeasured or unreachable. THE HONEST POSITION IS THAT THE
  BEST-EVIDENCED ROUTE TO MAXIMUM FINAL HEIGHT AT BONE AGE 16 IS ABOUT FOUR TO SIX CENTIMETRES, and that
  the theoretical prize sits entirely in the amplification term, where nothing is proven and one candidate -
  intermittent PTH1R agonism - has a decade of human paediatric safety data and no term attribution.
quantitative:
- parameter: >-
    CONTINUING GROWTH HORMONE FROM MID-PUBERTY TO NEAR ADULT HEIGHT, IN ADOLESCENTS WHO NO LONGER NEED IT
  value: >-
    near adult height SDS minus target height SDS -0.17 (0.60) continuing against -0.18 (0.62) stopping;
    total pubertal growth in males 27.5 cm (7.0) against 25.9 cm (6.2)
  unit: SDS, and centimetres of total pubertal growth
  conditions: >-
    vliegenthart2026, SEENEZ. Prospective multicentre patient-preference study 2017-2024, 127 adolescents
    (95 male, 75 per cent) with childhood idiopathic isolated GH deficiency (GH peak 1.7-10 ug/L) who
    RETESTED GH-SUFFICIENT (peak > 6.7 ug/L) at mid-puberty; 44 continued rhGH, 83 discontinued; 99 per
    cent completed to near adult height. P = 0.96 on the primary endpoint, P = 0.35 on NAH-SDS, P = 0.25 on
    total pubertal growth in males, and predicted versus attained height gain did not differ.
  species: human
  source_ref: vliegenthart2026
  uncertainty: >-
    PATIENT-PREFERENCE ALLOCATION, NOT RANDOMISED - families chose, so the groups could differ on
    motivation and on unmeasured severity, though the direction of that bias is not obvious. These are
    adolescents with a history of GH deficiency who normalised, not constitutionally normal adolescents, so
    it is the closest available analogue rather than the exact question. It is nonetheless prospective, 127
    strong, 99 per cent complete, with three concordant nulls and confidence intervals that exclude any
    large benefit.
- parameter: >-
    THE SAME NULL FROM THE OTHER DIRECTION, WITH ITS OWN PRE-PUBERTAL POSITIVE CONTROL IN THE SAME PATIENTS
  value: >-
    predicted adult height gain from GH start to puberty onset +8 cm in boys; attained near adult height
    minus predicted adult height AT PUBERTY ONSET -0.62 cm in boys and +1.82 cm in girls
  unit: centimetres
  conditions: >-
    cantasorsdemir2026. Multicentre retrospective chart review, 72 patients with idiopathic short stature or
    partial GH deficiency; GH started before or at puberty onset and continued until height velocity fell
    below 2.5 cm/year; mean duration 4.6 years in boys and 3.5 in girls; about 60 per cent started before
    puberty. P < 0.01 for the pre-pubertal gain, P = 0.75 for the boys' pubertal delta, P = 0.07 for girls.
    Higher bone-age-to-chronological-age ratio at start, higher BMI SDS, higher mid-parental height and
    longer pubertal GH duration each predicted greater pubertal gain; higher height SDS and higher IGF-1 SDS
    at start predicted less.
  species: human
  source_ref: cantasorsdemir2026
  uncertainty: >-
    RETROSPECTIVE, SINGLE-ARM, AND THE ENDPOINT IS A PREDICTION-BASED DELTA - it compares attained height to
    a Bayley-Pinneau-type prediction made at puberty onset, so it inherits that method's error, and the
    method is exactly the one round 254 argues is distorted by bone-age-modifying drugs (though no AI was
    given here). The internal contrast is what makes it useful: the SAME prediction method registered a
    clear +8 cm before puberty and nothing after it, in the same cohort.
- parameter: >-
    LETROZOLE AGAINST ANASTROZOLE ON ATTAINED NEAR-FINAL HEIGHT, AND ON THE SURROGATE THAT MISSED IT
  value: >-
    within-patient gain over initial predicted height - letrozole median 4.2 cm (IQR 0.6 to 13) against
    anastrozole 0.8 cm (IQR -2.6 to 3.5); against no difference between the same two drugs in three-year
    change of PREDICTED adult height in a randomised trial
  unit: centimetres of near-final height minus initial predicted height
  conditions: >-
    nearfinal2026, retrospective chart review of 72 males with advanced or rapidly advancing bone age and
    compromised predicted adult height - 59 anastrozole, 11 letrozole, 2 switched - median treatment 25
    months (IQR 18-32); overall median gain 1.2 cm; letrozole versus anastrozole P = 0.013 and letrozole
    closer to mid-parental height P = 0.031. Longer treatment P = 0.005, earlier pubertal stage at start
    P = 0.012 and concurrent GH P = 0.022 each predicted greater gain. THE SURROGATE ARM is zegarra2024, a
    three-year open-label randomised trial in 79 pubertal boys (letrozole 2.5 mg, anastrozole 1.0 mg): a
    clearly stronger biochemical and bone-age effect from letrozole and NO between-drug difference in change
    of predicted adult height, combined gain +1.3 cm.
  species: human
  source_ref: nearfinal2026
  uncertainty: >-
    ELEVEN LETROZOLE PATIENTS AGAINST FIFTY-NINE ON ANASTROZOLE, RETROSPECTIVE, NOT RANDOMISED, AND THE IQR
    ON THE LETROZOLE GAIN RUNS FROM 0.6 TO 13 cm - a very wide spread on a small group, so the median is
    unstable. Drug choice was not random and letrozole may have been reserved for more severe or more
    motivated cases. cui2025 DISSENTS in the opposite direction on a different endpoint: propensity-matched
    target-height-adjusted adult height SDS of 0.81 +/- 0.34 for anastrozole plus rhGH against 0.60 +/- 0.28
    for letrozole plus rhGH, P < 0.01. Both are observational and they disagree; the within-patient gain is
    preferred here because it isolates what the drug added to each individual, but that is a reasoned
    preference and not a resolution.
- parameter: >-
    WHAT THE AROMATASE ARM IS WORTH ON ATTAINED RATHER THAN PREDICTED HEIGHT
  value: >-
    attained adult height 166.6 +/- 3.1 cm on AI against 163.4 +/- 1.3 in matched controls; attained minus
    BASELINE predicted adult height +3.8 +/- 3.5 cm on AI against -0.3 +/- 5.0 in controls
  unit: centimetres
  conditions: >-
    yackobovitchga2025. Retrospective, tertiary paediatric endocrine centre. 27 midpubertal boys with fast
    puberty treated with an aromatase inhibitor for a median 2.8 years against matched untreated controls,
    P = 0.003 and P = 0.001 respectively; separately 16 ISS boys on GH plus AI for a median 2.0 years
    against GH only, attained minus baseline predicted +7.5 +/- 5.2 against +4.3 +/- 3.6, P = 0.050. Bone
    age SDS fell during treatment in both AI arms (P = 0.009 and P = 0.029).
  species: human
  source_ref: yackobovitchga2025
  uncertainty: >-
    RETROSPECTIVE WITH MATCHED RATHER THAN RANDOMISED CONTROLS, small groups, and the headline contrast is
    against a BASELINE PREDICTION, which is a surrogate on the other side of the comparison. The
    control-group delta of -0.3 +/- 5.0 cm is the useful internal calibration - untreated boys landed on
    their prediction on average, so the +3.8 in the treated arm is not simply prediction error. The GH-plus-AI
    arm measures the AI increment ON TOP OF GH and says nothing about the GH increment on top of AI.
- parameter: >-
    THE MECHANISTIC REASON THE GH NULLS ARE NOT SURPRISING - THE SOMATOTROPIC DECOMPOSITION, RESTATED
  value: >-
    GH raised longitudinal growth 5.26-fold as x5.00 pool consumption rate, x1.36 terminal hypertrophic cell
    height and x0.77 AMPLIFICATION; the pool term is 97 per cent of the log effect
  unit: fold change, decomposed by the exact identity GR = A x D x h_term
  conditions: >-
    Round 183's decomposition of hunziker1994 (atlas/tools/hunziker1994_amplification.py). Hypophysectomised
    35-day-old male Wistar rats, proximal tibia, 8-day osmotic minipump, four groups of six (saline, IGF-I,
    GH, normal). Growth rate 31/92/163/284 um/day; terminal hypertrophic cell height 19.5/27.3/26.5/29.8 um;
    resting cell cycle time 50/15/8/6 days; resting cells per column 2.5/2/2/2.5. IGF-I behaves the same way
    (90 per cent pool term) as does the normal-versus-hypophysectomised contrast (96 per cent). The sign on
    amplification does not turn over anywhere in the sensitivity range.
  species: rat
  source_ref: hunziker1994
  uncertainty: >-
    RESCUE FROM HYPOPHYSECTOMY, NOT ENHANCEMENT ABOVE NORMAL - no arm of this experiment pushes a normal
    animal, and the normal group is the GH-replete comparator rather than a treated one. Several inputs are
    stated to one significant figure. What makes it usable here is that its prediction - GH converts reserve
    into rate at slightly worse than par - is what vliegenthart2026 and cantasorsdemir2026 independently
    measured as a null on final height in humans, and what chu2025 measured as cell-autonomous pool
    depletion through GHR.
localization:
- 'human growth plate at mid-to-late puberty: where every attained-height number in this table was measured'
- 'rat proximal tibia: where the somatotropic decomposition was done'
human_evidence: direct
human_evidence_note: >-
  Four of the five quantitative rows are human attained-height or near-adult-height cohorts, two of them
  multicentre and one prospective with n = 127. The decomposition row is rat and is used as mechanism, not
  as an effect size.
species_basis:
- human
- rat
translation_risk: high
translation_risk_reason: >-
  Every human cohort here starts in MIDpuberty with bone ages typically well below 16, and nearfinal2026
  found that starting earlier and treating longer both predicted greater gain. Applying these effect sizes
  to a subject at bone age 16 extrapolates past the edge of every dataset, and in the direction that shrinks
  them.
confidence: B
confidence_reason: >-
  The GH-after-mid-puberty null is B: two independent human cohorts in different countries with different
  designs, one prospective and 99 per cent complete, agreeing with each other and with a mechanism measured
  in two independent animal experiments. The letrozole-over-anastrozole row is C at best - eleven patients,
  retrospective, with a published dissent - and is graded separately below. The table as a whole is a
  synthesis and inherits the weakest row it is used for.
claim_grades:
- claim: >-
    Continuing growth hormone from mid-puberty onward adds no measurable final height in adolescents who are
    not GH-deficient.
  grade: B
  basis: >-
    vliegenthart2026, prospective, n = 127, 99 per cent complete, P = 0.96 on the primary endpoint, in
    adolescents who retested GH-SUFFICIENT; and cantasorsdemir2026, n = 72, where the same prediction method
    registered +8 cm before puberty and -0.62 cm after it in the same patients. Not A because neither is
    randomised to GH.
- claim: >-
    Growth hormone is an amplification agent.
  grade: X
  basis: >-
    NO. The attribution was made from ZONE HEIGHTS, which hunziker states in the same paper are not a
    reliable indicator of bone growth rate. Decomposed with flux quantities, GH lowers amplification to 0.77
    of the hypophysectomised control and does 97 per cent of its work through pool consumption rate. The
    stack node the_stack_in_a_normal_human still carries the superseded attribution and is corrected by
    CORR-263.
- claim: >-
    Letrozole produces more attained final height than anastrozole in males with advanced bone age.
  grade: C
  basis: >-
    nearfinal2026, median within-patient gain 4.2 against 0.8 cm, P = 0.013, but on eleven letrozole
    patients, retrospective, with a wide IQR and a published dissent in cui2025 on a different endpoint.
    Held at C and adopted because it is the only comparison on attained height with a within-patient
    contrast, and because it is the prediction the switch model made in advance.
- claim: >-
    The aromatase arm is worth about 1.3 cm.
  grade: X
  basis: >-
    That is zegarra2024's three-year change in PREDICTED adult height, and prediction methods are calibrated
    on children whose bone age and height advance together - the exact coupling an aromatase inhibitor
    exists to break. On attained height, yackobovitchga2025 gives +3.2 cm against matched controls and +3.8
    cm against baseline prediction, with untreated controls landing on their own prediction at -0.3 cm.
- claim: >-
    The best-evidenced total available gain at bone age 16 is about four to six centimetres.
  grade: E
  basis: >-
    ARITHMETIC ON NON-ADDITIVE ROWS, MEASURED IN YOUNGER SUBJECTS. It is offered as an order of magnitude to
    stop the programme over-crediting itself, not as a prediction. The one thing it rests on that is solid
    is that no row with human attained-height evidence exceeds four centimetres.
