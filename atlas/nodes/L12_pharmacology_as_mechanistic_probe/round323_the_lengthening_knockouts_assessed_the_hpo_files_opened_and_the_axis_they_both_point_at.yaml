id: round323_the_lengthening_knockouts_assessed_the_hpo_files_opened_and_the_axis_they_both_point_at
name: >-
  ROUND 323 - round 304 ended with an instruction to the next round ("None assessed. Start the next round
  here, from data") and rounds 305-322 all went somewhere else. The 69 lengthening knockouts are now
  assessed, the HPO files are opened for the first time, and BOTH independent screens land on the SAME
  axis - perichondrial TGF-beta. Plus two measured negatives that stop the next round repeating this work,
  and one paywalled number that decides the whole thing
aliases:
- round 323
- the lengthening knockouts assessed
- HPO opened
- the ascertainment asymmetry measured
- the axial ATAC sheets are not readable
- baffi2004 is the decisive control
- the perichondrium is vascularised
type: hypothesis
layer: L12
stub: false
summary: >-
  ZERO - WHY THIS ROUND EXISTS. Round 304 found 69 knockouts that LENGTHEN a mouse inside a 12,068-row IMPC
  file and closed with the words "Several are drugged - deucravacitinib (TYK2), PI3Kgamma and LTA4H clinical
  compounds, REV-ERB ligands (NR1D1), ENPP1 enzyme therapy. None assessed. Start the next round here, from
  data." Eighteen rounds later nobody had. Separately, the HPO gene-to-phenotype files were supplied on
  2026-08-13, registered in CLAUDE.md with the words "replaces per-syndrome manual curation", and never
  opened. Both are CORR-316/CORR-328 again - run the local data before the literature.


  ONE - THE 69 LENGTHENING KNOCKOUTS, ASSESSED. Four joins, each of which can kill a row: is the mouse
  result CLEAN (a hit reported for one sex with a null combined-sex row is a different claim); is the target
  IN THE TISSUE (GSE288028, 14 postnatal human growth plates, CORR-327); is there an OBTAINABLE AGENT
  pushing the right way (Open Targets, direction-classified); and does it pass Step 0.
  42 of 69 are expressed in the postnatal human growth plate at >=5 CPM in >=10/14 samples. 20 have a
  SEX-AGNOSTIC lengthening row at P<1e-4 with NO opposing shortening row. 22 do not - they are
  sex-specific-only (Tyk2, Jarid2, Pdgfc, Slc7a2, Rft1, Tmem237, Limk2, Ecrg4, Mob1a and 13 more) or
  self-contradictory (Nr1d1: body length +1.479 in females but TIBIA -2.084 at P=7.3e-05; Drg2: body length
  -0.412 at P=2.9e-09; Hdgfl3: tibia -1.577). 27 are not in the human growth plate at all, including Mstn,
  Pik3cg, Klk5 and Marco - so four of round 304's five named drugged candidates die on the free query.
  ⛔ **OF THE 20 SURVIVORS, EXACTLY ONE HAS AN APPROVED INHIBITOR AND IT IS ALREADY CLOSED** - Pde3b, shut
  in round 310 on a PheWAS showing the lipid signal is ~40 orders of magnitude beyond the height signal and
  a 4-fold chondrocyte DEPLETION. One more has a clinical-stage inhibitor: LTA4H (acebilustat, oral), body
  length +0.619 P=1.9e-05, 29.3 CPM in 45% of human growth plate cells - and its own second row runs -0.787.
  The rest have nothing.
  ⚠ ENPP1 is the most abundant target in the whole list - **395.2 CPM in 88.5% of human growth plate
  cells**, tibia +1.709 at P=3.1e-08, and Open Targets calls it High-Quality Ligand / Small Molecule Binder
  / Structure with Ligand. It is also the row where the published biology runs the OTHER WAY: Enpp1-deficient
  mice have thinner growth plates and a 75% reduction in EdU-positive chondrocytes, and human biallelic
  ENPP1 loss is ARHR2 - hypophosphataemic rickets with short stature. One IMPC row at one centre against a
  literature and a human disease is not a lead.
  ✓ NCOR2 is the only DOSE-DEPENDENT allelic series in the list - heterozygote tibia +1.104 (P=1.5e-06,
  combined sex), homozygote +1.495, a second heterozygote row +0.596 - at 61.8 CPM. No selective agent
  exists.


  TWO - THE HPO FILES, OPENED, AND CORR-295 TURNED INTO A NUMBER. Genes annotated to SHORT stature: 1483.
  To TALL stature: 180. **RATIO 8.2 : 1** - and 74 of the 180 are annotated BOTH ways, so only 106 carry a
  direction at all. That is the ascertainment asymmetry CORR-295 asserted, measured for the first time, and
  it is the reason a disease ontology is a bad place to hunt height-INCREASING levers. The right response to
  a known bias is to measure it, not to avoid the resource.
  79 of the 106 directional tall-stature genes are expressed in the postnatal human growth plate.


  THREE - ⭐⭐⭐ AND THE UNBIASED QUERY RETURNS THE AXIS THE ATLAS ALREADY CALLED ITS BEST MECHANISM. The
  tall-only, growth-plate-expressed list, ranked by abundance, is led by the TGF-beta module:
  **TGFBR2 191.9 CPM in 87.9% of cells · TGFB1 157.9 · TGFBR1 77.9 · TGFB2 63.4 · SMAD3 61.2**, with LOX
  70.7, PLOD1 39.6, COL6A1 437.4, DSE, FKBP14 and THSD4 alongside. Nothing in the query knew about
  sedes2022, about FBN1, or about round 288. This is now the FOURTH independent route to the same axis:
  (i) kosmicki2026's 1.45M exomes - TGFB3 pLoF +7.68 cm P=4.0e-17, FBN1 +8.82, LTBP2 +2.36, three genes one
  direction; (ii) sedes2022 - Prx1-Cre Fbn1 loss gives ~7% LONGER limb bones, normal at birth, accruing
  1-3 months, mechanism reduced LTBP-3/4 and pSmad2 in the OUTER PERICHONDRIUM, causally closed by TGF-beta1
  add-back; (iii) GSE9160 - TGFBR2 12,902 in the proliferative zone, TGFBR3 10,214, TGFBR1 present in both
  donors, so CORR-327's receiver test PASSES where the RAAS, PDE5A, sGC, NPPC/MME and SOST all failed;
  (iv) this, from human clinical phenotypes with no knowledge of the other three.
  ⛔ **AND THE DIRECTION OF (iv) IS CONTESTED, WHICH MUST BE SAID BEFORE IT IS USED - CORR-331.** Loeys-Dietz
  TGFBR1/TGFBR2/SMAD3 alleles are predominantly MISSENSE that reduce kinase activity, yet the affected aorta
  shows INCREASED TGF-beta signalling, and the field calls this a paradox and states the mechanism is
  unresolved. So the HPO receptor rows CANNOT be read as "less signalling is taller". What is NOT contested
  is the pLoF arm - TGFB3, FBN1 and LTBP2 protein-truncating burden, which is unambiguous haploinsufficiency.


  FOUR - ⭐⭐ THE STRUCTURAL POINT THAT IS WORTH THE ROUND, AND NOBODY IN THIS FILE HAD NOTICED IT.
  **EVERY DELIVERY OBJECTION IN THIS ATLAS IS ABOUT REACHING AVASCULAR CARTILAGE.** Round 315 spent a round
  on charge-engineered carriers because the growth plate has no blood supply and no lymphatics and sits
  inside bone beneath the epiphysis; its honest closing blocker was that no charge-engineered protein has
  ever reached a GROWTH PLATE in any species. **sedes2022's whole result is that this axis does NOT act in
  the plate.** Deleting Fbn1 from CHONDROCYTES produces no overgrowth; the control is EXTRINSIC, in the
  outer perichondrium - a vascularised fibrous sheath continuous with the periosteum. A systemically dosed
  small molecule or protein reaches it the way it reaches any connective tissue.
  **The atlas's hardest structural obstacle and its best-mechanism axis do not overlap.** That is not an
  argument that the axis works; it is the removal of the objection that has governed rounds 314 and 315.


  FIVE - ⛔ BUT baffi2004 IS IN THIS BIBLIOGRAPHY AND IT IS THE DECISIVE COMPARTMENT CONTROL, AND IT RUNS
  AGAINST THIS SUBJECT. Three conditional deletions, read together for the first time:
  · **Col2a-Cre (CHONDROCYTE) Tgfbr2 loss - LONG BONE LENGTH UNALTERED at E17.5, and SEVERE AXIAL DEFECTS**:
    altered vertebral size and spacing, failed neural arch closure, abnormal transverse processes, costal
    joints and zygapophyses, and intervertebral discs MISSING OR INCOMPLETE (baffi2004).
  · **Prx1-Cre (LIMB MESENCHYME) Tgfbr2 loss - short limbs, phalangeal joint fusion, DEAD AT BIRTH**, with
    the defect appearing at E15.5 (seo2007).
  · **Prx1-Cre Fbn1 loss - +7% LONGER limb bones, NORMAL AT BIRTH, accruing over 1-3 months** (sedes2022).
  · **Acan-CreERT2;Tgfbr2, tamoxifen at TWO WEEKS - the POSTNATAL, INDUCIBLE version, and it AGREES with
    baffi2004** (alkhatib2018, found after the first draft of this node was committed): collagen
    disorganisation, proteoglycan loss and OSTEOPHYTES in intervertebral and sternocostal joints, apparent
    from 3 months and progressive to 12; proteoglycan loss in the NUCLEUS PULPOSUS. Long bone growth plates
    were not examined.
  Same tissue, same era, opposite results - but they are not the same experiment. Tgfbr2-null is EMBRYONIC
  PATTERNING in an animal that dies at birth; Fbn1-null is POSTNATAL ACCRUAL. CORR-299's open-plate test
  separates them, so seo2007 is a weaker objection to a drug given at bone age 16 than it looks.
  ⛔ **baffi2004 is NOT weakened the same way, and it points at the wrong compartment for this case.**
  Chondrocyte TGF-beta signalling turns out to be DISPENSABLE for long-bone length and REQUIRED for the
  axial skeleton and the intervertebral discs - and this subject's residual is TRUNK-dominant (R274, R318),
  with the disc itself named as a modifiable component in R319. **Blocking TGF-beta is the one manipulation
  in this file shown to damage vertebrae and discs specifically while leaving long bones alone.**
  ⛔⛔ **AND THE EMBRYONIC ESCAPE IS GONE. alkhatib2018 IS POSTNATAL, INDUCIBLE, CARTILAGE-RESTRICTED, AND
  IT REPRODUCES THE AXIAL COST.** Deleting Tgfbr2 from Acan-expressing cells at TWO WEEKS OF AGE - the
  CORR-299 open-plate test, run - damages exactly the compartment this subject needs. **And the damage is
  PROTEOGLYCAN LOSS IN THE NUCLEUS PULPOSUS**, which is the fixed-charge-density mechanism R319 identified as
  the trunk's second, fusion-independent height component. The axis attacks R319's lever by R319's own
  mechanism.
  ⭐ **AND THE THIRD INSTANCE OF CORR-340 IS IN THE SAME PAPER, WITH A DIRECTION.** alkhatib2018 states that
  the conditional knockouts **"were smaller in size compared to CTL mice"** and gives **NO NUMBER**. That is
  the ONLY postnatal directional body-size observation that exists for this axis, it is qualitative, n=3 per
  group, and **it runs AGAINST the axis.** Three papers now: chen2015 (losartan, wild-type, zones measured,
  no femur), greene2021 (1D11, wild-type littermates, mass measured, no length), alkhatib2018 (postnatal
  inducible cartilage Tgfbr2 loss, smaller animals noticed, never measured).
  ⭐ **AND THE NUMBER THAT DECIDES IT IS PAYWALLED.** baffi2004's abstract ends: mice surviving postnatally
  "showed alterations in the length of specific bones" - **DIRECTION NOT STATED**. That single sentence is
  the only postnatal length readout that exists for chondrocyte-restricted TGF-beta loss in any species.
  Requested from the operator this round.


  SIX - ⛔ A MEASURED NEGATIVE THAT SAVES THE NEXT ROUND: THE AXIAL ATAC SHEETS ARE NOT READABLE.
  GSE252289 (richard2025, Cell) was supplied on 2026-08-13 as "89 ATAC-seq" and used for nothing. Its
  workbook has 34 sheets and **two of them are labelled LUMBAR and THORACIC** - human VERTEBRAL chondrocyte
  open chromatin, 60,161 and 61,220 peaks. That looked like the trunk question answered in human tissue.
  The build was determined rather than assumed (six landmark TSSs: GRCh37 6/6, GRCh38 2/6). Twelve controls
  were written down BEFORE looking - limb-identity genes must come out appendicular, sclerotome genes axial,
  housekeeping and the pan-chondrocyte programme neither.
  **THE CONTRAST FAILS ITS OWN CONTROLS, 9 of 19.** The discovery list is one contiguous 4 Mb block of
  chr6 - HLA-A, HLA-E, HLA-F, HLA-DPA1, HLA-DPB1, TAPBP, BAG6, PRRC2A - plus B2M on chr15, which was one of
  the preregistered MUST-BE-NEITHER housekeeping controls and came out 98th percentile. chr6:29-33 Mb
  carries 223,681 bp of peak in LUMBAR and 220,492 in THORACIC against 0 to 4,511 bp in each of the eight
  E67 appendicular sheets, while every chromosome's share of total peak base-pairs matches across all
  sheets to within a few tenths of a percent - so it is not depth and not a dropout. It is an
  ANTIGEN-PRESENTATION signature, and fetal vertebral bodies are a HAEMATOPOIETIC organ. The reciprocal
  confirms it: ACAN and COL9A1 come out strongly APPENDICULAR at the 0.1st and 0.3rd percentile, i.e. the
  cartilage fraction of the axial samples is DILUTED. **These sheets compare tissue composition, not
  chondrocyte regulation. Recorded so nobody runs it again.**
  ✓ What survives: 4 of 6 limb-identity controls behave strongly (TBX5 0.0 percentile, HOXD13 1.5, PITX1
  3.1, HOXA13 5.5), so the appendicular half of the panel is real; and HHIP's promoter IS accessible in
  human lumbar vertebral chondrocytes, which is a presence call and needs no contrast.


  SIX-AND-A-HALF - ⛔⛔ AND THE COMPARTMENT COORDINATE TURNS OUT TO BE ALLELE-SPECIFIC, WHICH UNDERCUTS MY
  OWN ROUND 318. To place the TGF-beta module on round 318's trunk-versus-limb axis I ran the same three
  absolute traits from the same ~546k cohort - but selected each gene's lead variant from the STANDING
  HEIGHT summary statistics rather than from the sitting-height-RATIO scan. The answers move enormously.
  **HHIP: 95% trunk in round 318, 48.0% here. TET1: 96% trunk in round 318, 55.2% here. FBN1: 5% trunk in
  round 318, 53.3% here.** Round 318's variants were chosen because they maximally shift the RATIO, so
  conditioning on a large ratio effect guarantees compartment-extreme values - **selection on the outcome.**
  Neither number is wrong; they are facts about DIFFERENT ALLELES at the same locus. But "HHIP is 95% trunk"
  must be restated as "the allele that leads the sitting-height-ratio signal at HHIP sends 95% of its effect
  to the trunk", and the trunk-selection criterion round 318 proposed for ADDITIONS is much weaker than it
  looked.
  ✓ What the unselected version says about this axis, and it agrees with R289 rather than with R318:
  **the module is LIMB-leaning almost throughout - LTBP2 8.2% trunk, LTBP3 17.1%, TGFBR1 18.8%, FBN2 28.6%,
  SMAD3 34.8%, PLOD1 34.8%, LTBP4 35.0%, SMAD2 35.5%, TGFBR2 36.1% - with only the LIGAND TGFB3 at 54.7%
  and FBN1 at 53.3% near balance.** R289 deprioritised this axis because Marfan habitus is disproportionate,
  long-limbed and trunk-sparing. On unselected lead variants that is what the human numbers say too.


  SEVEN - WHAT THIS ROUND DOES NOT DO. It produces NO addition to the stack. The lengthening-knockout
  screen's only drugged survivors are a closed target and a thin one; the HPO screen's leading axis has
  clinical-stage agents (galunisertib and vactosertib, oral ALK5 inhibitors; fresolimumab, a pan-TGF-beta
  neutralising antibody) and three unresolved blockers - no bone-LENGTH endpoint for any TGF-beta-lowering
  agent in any normal animal, an interior optimum with no titration guide, and baffi2004's axial cost.
  ⭐ AND THE SAME OMISSION HAS NOW HAPPENED TWICE ON THIS AXIS. chen2015 gave losartan to WILD-TYPE mice,
  measured growth-plate zones, saw the post-proliferative zone expand, and never measured femur length
  (R288). **greene2021 gave the pan-TGF-beta neutralising antibody 1D11 to WILD-TYPE littermates at 0.5,
  1, 5 and 10 mg/kg intraperitoneally from 8-11 weeks of age, and measured trabecular bone volume and
  strength - not one longitudinal dimension.** Two independent labs, two different TGF-beta-lowering agents,
  wild-type animals in hand both times, and the caliper was never picked up.
human_evidence: indirect
human_evidence_note: >-
  The HPO screen, the ascertainment ratio, the growth-plate expression join and the contested Loeys-Dietz
  direction are human. The 69 lengthening knockouts are mouse (IMPC). The three conditional deletions are
  mouse. The ATAC diagnostic is human but FETAL (E54-E74) and its verdict is that it cannot be read.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The screen's primary evidence is germline mouse knockouts with n of 5-10 per sex at single phenotyping
  centres, in IMPC's own normalised units which are neither centimetres nor percent. The HPO annotations
  are curated statements about syndromes, mostly germline and often biallelic or de novo, with no effect
  size and no allele. Neither nominates a dose, a duration or an age.
confidence: C
confidence_reason: >-
  C. The two screens were run correctly and their negatives are solid - the sex-specific/opposing-row
  filter, the expression filter and the ATAC control panel are all preregistered and all fired. The
  convergence of two independent unbiased screens on the perichondrial TGF-beta axis is real but it is a
  convergence of NOMINATIONS, not of length endpoints; the axis still has no bone-length measurement under
  any agent in any normal animal, and baffi2004's postnatal direction - the one number that would settle
  the compartment question - has not been read.
limitations:
- IMPC effect sizes rank; they do not predict a gain in centimetres.
- A germline knockout is not a drug given in an open plate at bone age 16 (CORR-299).
- The HPO tall-stature set is 8.2-fold smaller than the short-stature set, which is the bias being measured,
  not a bias that has been removed.
- Loeys-Dietz receptor alleles show paradoxically INCREASED tissue TGF-beta signalling, so the HPO receptor
  rows carry no mechanistic direction.
- The GSE252289 axial sheets are fetal and compositionally confounded; no axial-versus-appendicular
  regulatory claim is made from them.
- Open Targets mechanism strings are keyword-classified; a keyword match is triage, not a drug label.
