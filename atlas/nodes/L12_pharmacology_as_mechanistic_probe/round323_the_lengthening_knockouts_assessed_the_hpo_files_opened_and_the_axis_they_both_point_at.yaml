claim_grades:
- claim: The 69 IMPC lengthening knockouts contain no obtainable addition to this stack.
  grade: B
  basis: Four joins applied to all 69. 27 are absent from the human growth plate; 22 of the 42 expressed
    ones fail on sex-specificity or an opposing row; of the 20 survivors one has an approved matching
    inhibitor and it is PDE3B, closed in round 310, and one has a clinical inhibitor with a self-conflicting
    IMPC record. B rather than A because Open Targets drug coverage is incomplete for preclinical chemistry
    - ENPP1 inhibitors exist in oncology and are not in its drug list - so "no agent" here means "no agent
    Open Targets knows about".
- claim: The short-to-tall annotation ratio in HPO is 8.2 to 1.
  grade: A
  basis: Direct count of the supplied phenotype_to_genes file over four HPO terms. It is a property of the
    file and reproducible from it.
- claim: An unbiased human-phenotype query independently nominates the perichondrial TGF-beta axis.
  grade: B
  basis: TGFBR2, TGFB1, TGFBR1, TGFB2 and SMAD3 are the five most abundant tall-stature-only genes in the
    postnatal human growth plate, and the query used no prior from this atlas. B not A because HPO
    annotation is syndrome-level with no effect size, and because the Loeys-Dietz signalling direction is a
    named unresolved paradox.
- claim: Round 315's delivery wall does not apply to the perichondrial TGF-beta axis.
  grade: B
  basis: sedes2022 establishes that deleting Fbn1 from chondrocytes produces no overgrowth and that the
    controlling tissue is the outer perichondrium, which is vascularised connective tissue rather than
    avascular cartilage. The inference from "vascularised" to "a systemic agent reaches it at an effective
    concentration" is not measured for any specific agent, which is why this is B and not A.
- claim: Chondrocyte TGF-beta signalling is dispensable for long bone length and required for the axial
    skeleton.
  grade: C
  basis: 'TWO papers, two Cre drivers, two eras, same answer. baffi2004 - Col2a-Cre, embryonic: long bone
    length unaltered at E17.5, severe vertebral and intervertebral disc defects. alkhatib2018 -
    Acan-CreERT2 with tamoxifen at TWO WEEKS, so postnatal and inducible: collagen disorganisation,
    proteoglycan loss and osteophytes in intervertebral and sternocostal joints from 3 months, nucleus
    pulposus proteoglycan loss at 12 months, long bones not examined. C and not B because both are n=3 per
    group or unstated, neither measured a longitudinal dimension, and alkhatib2018 is an ageing/degeneration
    readout rather than a growth one.'
- claim: The embryonic timing of seo2007 and baffi2004 lets a drug given in an open plate escape the axial
    objection.
  grade: X
  basis: 'NO. alkhatib2018 ran the open-plate test - tamoxifen at two weeks, after the axial skeleton has
    formed - and the axial phenotype appears anyway, progressively, from 3 months. What the embryonic/
    postnatal distinction still rescues is seo2007''s LIMB-SHORTENING result, which remains a patterning
    phenotype in an animal that dies at birth.'
- claim: The GSE252289 LUMBAR and THORACIC sheets can be used as an axial chondrocyte reference.
  grade: X
  basis: 'NO. The contrast fails 10 of 19 preregistered controls, the top discoveries are one MHC block plus
    B2M - itself a failed housekeeping control - and the cartilage genes ACAN and COL9A1 come out
    appendicular at the 0.1st and 0.3rd percentile. The sheets compare tissue composition. Two corrections
    (MHC excluded, pseudocount fixed) did not rescue them.'
- claim: 'Round 318''s compartment table gives each GENE a compartment.'
  grade: X
  basis: 'NO - it gives each ALLELE one, and its alleles were selected for a large sitting-height-RATIO
    effect, which is selection on the outcome. Recomputed on each gene''s own standing-height lead variant
    in the same cohort, HHIP moves from 95% trunk to 48.0%, TET1 from 96% to 55.2%, and FBN1 from 5% to
    53.3%. What survives round 318 is the CNP-is-limb result, which used NPR3 and NPPC - among the strongest
    ratio loci in the genome, where the selected and unselected variants are close to the same thing - and
    the base-rate check that the sign is informative in that dataset.'
- claim: This round produces an addition to the stack.
  grade: X
  basis: It does not. Both screens produce nominations without length endpoints, and the one axis both point
    at has three unresolved blockers - no bone-length endpoint for any TGF-beta-lowering agent in any normal
    animal, an interior optimum with no titration guide, and baffi2004's axial cost in a trunk-dominant case.
