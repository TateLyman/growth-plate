id: final_verdict_which_npr2_compounds_to_add
name: FINAL VERDICT - the phosphatase arm comes OUT as a compound, the allosteric arm goes in as a PROBE
  and not a therapy, and nothing on this axis is ready to administer
aliases:
- which compounds to add
- final answer NPR2 compounds
- remove the phosphatase arm
- is compound 1 the best in the screen
- PP2A PP4 selectivity has never been measured
type: intervention
layer: L12
stub: false
summary: 'THE INSTRUCTION WAS TO CLOSE BOTH ARMS TO THE MAXIMUM AND CONFIRM WHICH MOLECULES GO IN. BOTH
  ARE NOW CLOSED AS FAR AS PUBLIC DATA ALLOWS, AND THE ANSWER IS LARGELY NEGATIVE. THAT IS THE ANSWER,
  NOT A FAILURE TO FIND ONE.
  THREAD B COMES OUT AS A COMPOUND ARM. FOUR INDEPENDENT BLOCKERS, ANY ONE OF WHICH WOULD STOP IT.
  (1) THE ENZYME IS UNIDENTIFIED AND HAS RESISTED DIRECT ATTACK - egbert2024 phosphoproteomics plus
  egbert2025 combinatorial knock-in mice, both negative, and potter2024 still calls these phosphatases
  POTENTIAL. SD-008 bars planning on identification.
  (2) THERE IS NO COMPOUND. Fostriecin has exactly the right enzyme profile and exactly the wrong charge;
  the neutral phosphate-masked prodrug that would fix it HAS NEVER BEEN MADE for this or any related
  molecule; the parent cannot be bought in usable form and the nine-step route needs an engineered enzyme.
  (3) AND THE FINDING THAT SETTLES IT - THERE IS NO CHEMICAL BIOLOGY TO BUILD ON. This atlas enumerated
  all 39 human serine/threonine phosphatase targets in ChEMBL and pulled every IC50, Ki and Kd: 1,801
  molecules carry a value somewhere in the family, but ONLY 16 HAVE A NUMBER AT THE PP2A CATALYTIC
  SUBUNIT, ONLY ONE HAS A NUMBER AT PP4 - fostriecin itself - AND ZERO MOLECULES HAVE BOTH MEASURED.
  PP2A-versus-PP4 selectivity has never been determined for any compound in the public domain. That is
  not a gap in a dataset; it is the absence of a dataset. Since theobald2013 puts fostriecin cellular
  phenotype on PP4 rather than PP2A, the one question that would decide the arm cannot be asked with
  existing reagents, and CORR-175 already withdrew the claim that it costs one plate.
  (4) AND THE PRIZE IS SMALL WHERE THE STACK ALREADY HAS AN FGFR INHIBITOR. The FGF-driven component is
  already being taken by that arm; what remains is the TONIC component, measured at 1.42-fold, bought with
  a systemic pan-PPP agent whose human dose-limiting toxicity was hepatic.
  SO: KEEP CONTROL POINT B AS A MECHANISM AND AN ANNOTATION - the genetic proof is still the strongest on
  the axis and wagner2021 still shows 4.3 to 8.8 per cent femur on a wild-type FGFR3 background. REMOVE IT
  AS A COMPOUND ARM. There is nothing to add.
  THREAD A - COMPOUND 1 IS CONFIRMED AS THE BEST MOLECULE IN THE SCREEN, BY INDEPENDENT RE-ANALYSIS, AND
  IT IS STILL NOT A THERAPY. This atlas re-ranked all 253 GC-B-selective actives on three axes the
  original paper did not publish. FIRST, SCAFFOLD SUPPORT: the 253 compounds contain 208 DISTINCT MURCKO
  SCAFFOLDS - almost every hit is a singleton, which is the signature of single-point HTS noise rather
  than pharmacology. SECOND, STRUCTURAL ALERTS: 101 of 253, FORTY PER CENT, are flagged by PAINS or BRENK.
  THIRD, RANK: seven compounds score HIGHER than compound 1 - up to 125.6 per cent against its 96.7 - AND
  EVERY ONE OF THE TOP NINE IS A SCAFFOLD SINGLETON with Tanimoto 0.06 to 0.20 to the lead. One of them is
  DIAZINON, an organophosphate pesticide, at 74.4 per cent, which is a fair summary of what the singleton
  tail contains.
  COMPOUND 1 IS THE HIGHEST-ACTIVITY COMPOUND IN THE ENTIRE SELECTIVE SET THAT HAS REAL SAR SUPPORT. Its
  scaffold - the 5-arylfuran-2-thioamide with a saturated amine - carries FOUR members, and the sister
  morpholine scaffold three more, so seven chemically coherent analogues are all active together. The best
  compound that is BOTH clean of structural alerts AND scaffold-supported reaches only 65.1 per cent. The
  authors chose correctly and this atlas reproduced their choice from the raw data without using their
  reasoning.
  BUT THE SAME ANALYSIS SURFACES A LIABILITY THE PAPER DOES NOT DISCUSS AND THIS ATLAS HAD NOT RECORDED.
  COMPOUND 1 IS ITSELF BRENK-FLAGGED, FOR THE THIOAMIDE - and ma2024 shows the thioamide is REQUIRED:
  replacing it with an amide caused COMPLETE LOSS OF ACTIVITY. So the structural alert is not an
  incidental feature that medicinal chemistry can remove, it IS the pharmacophore. Thioamides are a
  recognised metabolic-activation liability, and this would be a chronic-dosing indication. The alert is
  unavoidable in this chemotype, and it is present in MCUF-42 too.
  AND THE MECHANISM WE ACTUALLY WANT STILL HAS NO MOLECULE. The efficacy-raiser at the intracellular site
  is the one that escapes the phosphorylation gate and can exceed the ligand ceiling - and CORR-174
  established that no member of the andresen2023 series engages wild-type GC-B at all. The only other
  small molecule known to bind the intracellular portion of GC-B is Go6976, which robinson2011 shows is a
  COMPETITIVE INHIBITOR at the CATALYTIC GTP site, explicitly NOT an activator. Wrong site, wrong
  direction. There is no chemical starting point for an intracellular GC-B activator.
  SO WHICH COMPOUNDS TO ADD - THE DIRECT ANSWER, IN THREE PARTS.
  TO THE THERAPEUTIC STACK: NOTHING FROM EITHER THREAD. Compound 1 is a research-grade screening compound
  with no in vivo data of any kind, no PK, no toxicology, an unavoidable structural alert, and a nearest
  characterised sibling (MCUF-42) whose oral bioavailability is 0.26 PER CENT. Thread B has no compound at
  all. Neither is a candidate to administer to anyone.
  TO THE RESEARCH PROGRAMME: TWO COMPOUNDS, BOTH PURCHASABLE. CID 647514 (compound 1, CAS 332862-27-8,
  fourteen vendors) as the potency benchmark, and CID 3588620 (the N-methylpiperazine, seven vendors) as
  the charge probe. Those two settle whether control point C is real for this indication, and they are the
  only actionable items either thread produced.
  AND CONTROL POINT A REMAINS THE ONLY ARM ON THIS AXIS WITH AN ACTUAL DRUG - which Thread D then showed
  is inaccessible for this case at any price, because every route gates on genetically confirmed
  achondroplasia and an open plate. THE HONEST SUMMARY OF THE WHOLE CNP AXIS FOR THIS SUBJECT: one arm has
  a drug that cannot be obtained, one has a probe that is not a drug, and one has neither.'
quantitative:
- parameter: 'PP2A-VERSUS-PP4 SELECTIVITY HAS NEVER BEEN MEASURED FOR ANY COMPOUND'
  value: 'Across 39 human serine/threonine phosphatase targets in ChEMBL, 1,801 molecules carry at least
    one IC50, Ki or Kd. AT THE PP2A CATALYTIC SUBUNIT: 16 molecules. AT THE PP4 CATALYTIC SUBUNIT: ONE
    molecule, fostriecin, IC50 3.0 nM. WITH BOTH MEASURED: ZERO. Only two compounds carry both PP2A and
    PP5 - calyculin A at 12-fold PP2A-over-PP5 but with PP1 at 0.14 nM, and cantharidin at 2.5-fold'
  unit: compound counts; fold selectivity
  conditions: COMPUTED BY THIS ATLAS 2026-08-09 by enumerating every human phosphatase target in the
    ChEMBL API and retrieving all IC50/Ki/Kd activities, taking the most potent value per compound per
    target.
  species: not_applicable
  source_ref: chembl_ppp_matrix
  atlas_derived: true
  uncertainty: 'CHEMBL IS NOT THE WHOLE LITERATURE and a curated database under-represents assays reported
    only in figures or supplementary tables - swingle2009 own panel, which this atlas read directly, is
    itself only partly curated. So the true count of PP2A/PP4 pairs is not provably zero, it is zero IN
    THE LARGEST CURATED BIOACTIVITY RESOURCE, which is the right proxy for whether a field has assay
    infrastructure. THE CONCLUSION THAT SURVIVES EITHER WAY is comparative: PP2A has 16 catalytic-subunit
    data points and PP4 has one, so there is no counter-screen series to borrow and no probe to
    benchmark against. NOTE ALSO that fostriecin PP2A numbers sit on the HOLOENZYME/regulatory-subunit
    target rather than the catalytic one, which is part of why the pairing is absent.'
- parameter: 'COMPOUND 1 IS THE BEST MOLECULE IN THE SCREEN ONCE SCAFFOLD SUPPORT AND STRUCTURAL ALERTS
    ARE APPLIED'
  value: 'The 253 GC-B-selective actives contain 208 DISTINCT MURCKO SCAFFOLDS - overwhelmingly singletons.
    101 of 253 (40 per cent) are flagged by PAINS A/B/C or BRENK. Seven compounds score above compound 1
    (up to 125.6 per cent versus its 96.67), and ALL NINE of the top nine are scaffold singletons with
    Tanimoto 0.06 to 0.20 to the lead; one is DIAZINON, an organophosphate pesticide, at 74.4 per cent.
    COMPOUND 1 IS THE HIGHEST-SCORING COMPOUND WITH SCAFFOLD SUPPORT: its 5-arylfuran-2-thioamide amine
    scaffold has 4 members and the sister morpholine scaffold 3 more. The best compound that is both
    alert-free AND scaffold-supported reaches only 65.1 per cent'
  unit: per cent HTS activity at 10 microM; scaffold counts
  conditions: COMPUTED BY THIS ATLAS 2026-08-09. HTS values from PubChem AID 1920062 for all 253 compounds;
    Murcko scaffolds and PAINS A/B/C plus BRENK filters via RDKit FilterCatalog.
  species: not_applicable
  source_ref: pubchem_gcb_hts
  atlas_derived: true
  uncertainty: 'A SINGLE-POINT 10 MICROMOLAR SCREEN IS A HYPOTHESIS AND SCAFFOLD-SINGLETON STATUS IS A
    HEURISTIC, NOT A VERDICT - a genuine chemotype can be a singleton if the library contains only one
    member, and 40 per cent PAINS/BRENK flagging is typical for a legacy MLSMR-era collection rather than
    evidence of a bad screen. PAINS filters are also known to over-flag. WHAT THE ANALYSIS DOES ESTABLISH
    is comparative and robust: no alternative chemotype in this set combines high activity with SAR
    support, so there is no better starting point hiding in the data, and the paper hit-to-lead choice was
    correct. IT DOES NOT ESTABLISH that compound 1 is potent, selective or safe in any absolute sense.'
- parameter: 'THE COMPOUND 1 STRUCTURAL ALERT IS THE PHARMACOPHORE AND CANNOT BE DESIGNED OUT'
  value: 'Compound 1 is itself BRENK-flagged, for the THIOCARBONYL group. ma2024 reports that REPLACEMENT
    OF THE THIOAMIDE WITH AN AMIDE RESULTED IN COMPLETE LOSS OF ACTIVITY, demonstrating the thioamide is
    critical (compound 2 in their numbering). The alert is therefore not removable within this chemotype,
    and it is retained in MCUF-42'
  unit: qualitative - structural alert versus SAR requirement
  conditions: BRENK filter via RDKit FilterCatalog, run by this atlas 2026-08-09; the amide-substitution
    result from ma2024 full text.
  species: not_applicable
  source_ref: ma2024
  atlas_derived: true
  uncertainty: 'A BRENK ALERT IS A FLAG FOR MEDICINAL-CHEMISTRY ATTENTION, NOT A DEMONSTRATED TOXICITY,
    and thioamide-containing drugs have reached the clinic. But the combination here is unfavourable for
    a chronic paediatric-adjacent indication: thioamides are a recognised metabolic-activation liability,
    the SAR makes the group non-negotiable, and NOBODY HAS RUN A TOXICOLOGY STUDY ON ANY MEMBER OF THIS
    SERIES. The atlas records this as an unresolved liability rather than a disqualification, and it is
    one more reason the recommendation is probe rather than therapy.'
- parameter: 'NO SMALL-MOLECULE ACTIVATOR OF THE INTRACELLULAR FACE OF GC-B EXISTS'
  value: 'robinson2011: the staurosporine analogue Go6976 is a COMPETITIVE INHIBITOR of GC-A and GC-B - it
    raises the Michaelis constant and lowers the Hill coefficient WITHOUT reducing maximal velocity, Ki
    about 1 microM in 1 mM ATP, and it acts by reducing GTP binding at the CATALYTIC site. Inhibition of
    GC-B is minimal without ATP and 1 mM ATP raises it 4-fold. The paper states explicitly that NEITHER
    STAUROSPORINE NOR Go6976 ACTIVATED GC-A OR GC-B, contradicting an earlier report'
  unit: micromolar Ki
  conditions: robinson2011, abstract read 2026-08-09 (PMC3190780).
  species: not_applicable
  source_ref: robinson2011
  uncertainty: 'THIS CLOSES A ROUTE RATHER THAN OPENING ONE. It shows kinase-inhibitor-like chemistry does
    engage the intracellular portion of these receptors, which is mildly encouraging for druggability in
    principle, but at the CATALYTIC site and as an INHIBITOR - the wrong site and the wrong sign. Combined
    with CORR-174, the position is that the intracellular allosteric site has a mapped residue
    (Thr640/Ile624), a validated point-mutant positive control, and NO COMPOUND.'
- parameter: 'PROMISCUITY CHECKED AND CLEARED - COMPOUND 1 IS A WELL-BEHAVED SCREENING COMPOUND, NOT A
    FREQUENT HITTER'
  value: 'PubChem cross-assay hit rates, active assays over assays tested: COMPOUND 1 (CID 647514) 11 of
    783 = 1.4 PER CENT. Charge probe (CID 3588620) 6 of 574 = 1.0 per cent. Morpholine analogue
    (CID 786411) 12 of 785 = 1.5 per cent. The two regioisomers (CID 647949, CID 2291818) 21 of 805 and 21
    of 790 = 2.6 and 2.7 per cent. MCUF-42 (CID 176516521) has never been screened - it appears in no
    bioassay at all'
  unit: per cent of assays in which the compound scores active
  conditions: COMPUTED BY THIS ATLAS 2026-08-09 from PubChem PUG REST, comparing aids_type=active against
    aids_type=all for each CID.
  species: not_applicable
  source_ref: pubchem_gcb_hts
  atlas_derived: true
  uncertainty: 'THIS CHECK WAS OPENED AS AN ALARM AND CLOSED AS A REASSURANCE, AND THE ALARM WAS AN ERROR
    OF DENOMINATOR. Compound 1 is active in eleven mechanistically unrelated assays - serotonin receptor,
    tau filament binding, cytochrome P450, PHOSPHO1, a two-pore potassium channel, G9a, JMJD2A, malarial
    plastid, MDR1 - which reads as a frequent-hitter profile until the denominator is applied. It has been
    TESTED IN 783 ASSAYS. A 1.4 per cent hit rate is normal-to-low; a genuine frequent hitter runs well
    above 5 per cent. THE WHOLE SERIES IS CLEAN ON THIS AXIS. LIMITS: PubChem active/inactive calls are
    depositor-defined and inconsistent across assays, cross-assay hit rate says nothing about whether the
    GC-B activity is real, and it does not offset the BRENK thioamide alert, which is a metabolic-liability
    flag rather than an interference flag. What it does remove is the specific worry that this chemotype
    scores in the GC-B screen because it scores in everything.'
localization:
- 'all of this concerns NPR2/GC-B in growth-plate chondrocytes, with the vascular compartment as the
  liability'
human_evidence: absent
human_evidence_note: 'No compound discussed in this node has ever been given to a human or an animal. The
  human evidence on this axis is for the TARGET (jeong2026 NPR2 activity score against standing height)
  and for control point A (vosoritide trials), not for anything recommended here.'
species_basis:
- not_applicable
translation_risk: high
translation_risk_reason: 'The recommendation is explicitly not a therapeutic one. Nothing here has in vivo
  data, PK, or toxicology.'
confidence: C
claim_grades:
- claim: PP2A-versus-PP4 selectivity has never been measured for any compound in the public domain.
  grade: B
  basis: 'Exhaustive enumeration of all 39 human serine/threonine phosphatase targets in ChEMBL: 16
    compounds have a PP2A catalytic value, exactly one has a PP4 catalytic value, and zero have both.
    Graded B rather than A because ChEMBL curation is incomplete and a pairing could exist in an
    uncurated figure; the comparative conclusion - no counter-screen series and no probe - is robust to
    that.'
- claim: The phosphatase arm should be removed as a compound arm.
  grade: C
  basis: 'Four independent blockers: the enzyme is unidentified and has resisted direct attack (SD-008);
    no compound exists and none can be cheaply made; PP2A-versus-PP4 selectivity has never been measured
    for anything, so the decisive question cannot be asked with existing reagents; and the incremental
    prize in a stack already containing an FGFR inhibitor is bounded at 1.42-fold against systemic pan-PPP
    liability with hepatic dose-limiting toxicity. Graded C because it is a judgement integrating four
    lines rather than a single measurement, and because the underlying MECHANISM retains the strongest
    genetic proof on the axis.'
- claim: Compound 1 is the best molecule in the GC-B screen.
  grade: B
  basis: 'Independent re-analysis of all 253 GC-B-selective actives: 208 distinct scaffolds, 40 per cent
    PAINS/BRENK-flagged, every one of the top nine by activity a scaffold singleton, and compound 1 the
    highest-scoring compound with genuine SAR support (a 4-member scaffold plus a 3-member sister
    scaffold). Best alert-free scaffold-supported alternative reaches 65.1 per cent against its 96.67.
    Reproduces the authors choice without using their reasoning.'
- claim: Compound 1 should be added to the therapeutic stack.
  grade: X
  basis: 'NO. It is a research-grade screening compound with NO in vivo data of any kind, no PK, no
    toxicology, a BRENK thioamide alert that the SAR makes unremovable, and a nearest characterised
    sibling with 0.26 per cent oral bioavailability. Being the best compound in a screen is not being a
    drug, and the distance between them is the entire preclinical package.'
- claim: Compound 1 is a promiscuous frequent hitter whose GC-B activity is likely an artifact.
  grade: X
  basis: 'NO - CHECKED AND CLEARED. It is active in 11 mechanistically unrelated assays, which looks
    alarming until the denominator is applied: it has been tested in 783. A 1.4 per cent cross-assay hit
    rate is normal-to-low, and the whole series behaves the same way (1.0 to 2.7 per cent). This does not
    make the GC-B activity real, but it removes the specific hypothesis that the chemotype scores here
    because it scores everywhere.'
- claim: Compound 1 and CID 3588620 should be added as research probes.
  grade: C
  basis: 'They are the only actionable items either thread produced: both purchasable (14 and 7 vendors),
    one with a published dose-response and the higher Emax, the other the charge probe that would settle
    whether the Donnan argument applies to this series. Graded C because their value is contingent on
    experiments the project cannot currently run.'
- claim: There is a chemical starting point for an intracellular GC-B activator.
  grade: X
  basis: 'NO. The andresen2023 series does not engage wild-type GC-B (CORR-174), and the only other small
    molecule known to bind the intracellular portion of GC-B is Go6976, which robinson2011 shows is a
    competitive INHIBITOR at the CATALYTIC site and explicitly not an activator. The site has a mapped
    residue and a validated point-mutant control and no compound.'
