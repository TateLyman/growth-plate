translation_risk: high
translation_risk_reason: 'The target validation is human genetics plus a limb-restricted mouse conditional;
  the delivery precedents are a mouse ASO in a mutant model and a rat exosome in a disease model with no
  quantified length endpoint; and no HHIP-directed oligonucleotide has been dosed in any species. What has
  improved is that the delivery objection - which this file treated as physics - is answered by two published
  in vivo demonstrations rather than by argument.'
confidence: C
claim_grades:
- claim: finerenone and spironolactone cannot lower HHIP at the growth plate
  grade: B
  basis: no primary links HHIP to the mineralocorticoid axis at all, and the receptor is contaminant-leaning
    at 0.05 with aldosterone synthase absent from the tissue
- claim: rosiglitazone, liraglutide and canagliflozin cannot lower HHIP at the growth plate
  grade: C
  basis: each drug's own receptor is at or below the ratios that killed losartan and sacubitril; CORR-351
    means a low ratio is a hypothesis about origin rather than proof of absence, but three of the four are
    also below 1 CPM outright
- claim: a SMO agonist increases HHIP internalisation and degradation
  grade: C
  basis: kwong2014, developmental systems, cell-autonomous; not shown in cartilage
- claim: an oligonucleotide can reach growth-plate cartilage in vivo
  grade: C
  basis: posey2017 demonstrates it for a PS-ASO in mouse; yuan2024 demonstrates it for exosome-packaged siRNA
    in rat with biodistribution imaging; neither reports a bone-length endpoint
- claim: the Donnan exclusion argument does not apply to a phosphorothioate ASO
  grade: D
  basis: a mechanistic reconciliation between an equilibrium partition calculation and an observed in vivo
    result, not a measurement of ASO concentration in growth-plate cartilage
- claim: circulating HHIP does not set growth-plate HHIP
  grade: D
  basis: rests on local expression plus griffiths2021's requirement for glycosaminoglycan binding and
    clustering; nobody has measured whether serum HHIP exchanges with the cartilage pool
