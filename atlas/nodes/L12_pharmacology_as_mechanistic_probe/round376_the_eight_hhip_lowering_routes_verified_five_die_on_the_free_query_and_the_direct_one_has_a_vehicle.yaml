layer: L12
stub: false
summary: 'Eight proposed routes to lowering HHIP, each checked against a primary and against the free local
  query before any of them was believed. The result is one clean kill list, one correction to this atlas,
  and one genuinely new construct.

  ⛔ ONE - FIVE OF THE EIGHT ARE INDIRECT AND ALL FIVE FAIL CORR-327 IN THE GROWTH PLATE. Run against R344''s
  purity-corrected human growth plate (12 samples, 5 purest versus 5 most blood-contaminated by COL2A1),
  with the calibrators carried in the same panel - COL2A1 8.92 and ACAN 4.65 for cartilage, PTPRC 0.00 and
  HBB 0.00 for contamination, and the three ratios that already killed drugs here (AGTR1 0.03 losartan, MME
  0.17 sacubitril, SOST 0.35 romosozumab):
  · FINERENONE and SPIRONOLACTONE - NR3C2 ratio 0.05, and CYP11B2 is 0 of 12. The mineralocorticoid receptor
    is contaminant-leaning at the level that killed losartan AND the plate makes no aldosterone at all. The
    mineralocorticoid arm joins the RAAS arm as absent from this tissue.
  · ROSIGLITAZONE and the TZDs - PPARG ratio 0.02, the most contaminant-leaning gene in the whole panel
    apart from the blood calibrators. PPARD at 27.4 CPM is the plate''s PPAR and is not what a TZD engages.
  · LIRAGLUTIDE and GLP-1 receptor agonists - GLP1R 0.3 CPM, ratio 0.66. Effectively absent.
  · CANAGLIFLOZIN - SLC5A2 0.3 CPM, independently reproducing R313''s kill on a second dataset.

  ⛔⛔ TWO - AND THE FINERENONE CLAIM HAS NO PRIMARY AT ALL, WHICH IS WORSE THAN FAILING THE RECEIVER TEST.
  Europe PMC returns ZERO records for HHIP with aldosterone, mineralocorticoid, finerenone or spironolactone
  in title or abstract. Free-text searching returns five co-mentions, and every one is a REVIEW of diabetic
  kidney disease in which the two words appear in different sections. There is no experiment showing
  aldosterone induces HHIP transcription or that an MR antagonist blocks it. What the renal literature
  actually contains is the OPPOSITE geometry - HHIP as the UPSTREAM driver: zhao2025b and the 2023 SGLT2
  paper put Hhip UPSTREAM of Sglt2 in proximal tubule, and canagliflozin acts DOWNSTREAM of Hhip without
  lowering it.

  ⚠ THREE - THE TZD AND GLP-1 CLAIMS ARE REAL BUT THIN, AND NEITHER IS ABOUT THE GROWTH PLATE. The entire
  primary basis for "TZDs lower HHIP" is one line of an RNA-seq table in immortalised human MEIBOMIAN GLAND
  epithelial cells (kim2019ppar) - HHIP downregulated by rosiglitazone, in a paper about meibocyte
  differentiation. No TZD has ever been shown to lower circulating HHIP; that query returns zero. The GLP-1
  claim is better sourced - xu2023hhip, 452 women, 49 on liraglutide for 6 weeks, circulating HHIP fell -
  but it is CIRCULATING HHIP.

  ⛔ FOUR - AND CIRCULATING HHIP IS THE WRONG POOL, FOR A REASON THIS ATLAS ALREADY HELD. The growth plate
  MAKES its own HHIP - 68.8 CPM, 4.65-fold cartilage-enriched - and griffiths2021 showed HHIP''s inhibitory
  potency REQUIRES glycosaminoglycan binding, with heparin driving oligomers from 50 kDa to 6 MDa and the
  GAG-dead mutant being a significantly weaker inhibitor. A protein that clusters on LOCAL heparan sulfate to
  work is not a hormone whose activity is set by a serum concentration. ⛔ And the serum literature cannot
  even agree on a sign: xu2023hhip and lei2024hhip find circulating HHIP RAISED in obesity and metabolic
  syndrome, chou2021hhip finds it LOWERED in overweight and obese subjects. Three cohorts, two directions.
  ⛔ Both drugs also fail on stack grounds independent of all this: metformin is a POOL cost through
  AMPK-mTORC1 (R366), and a GLP-1 agonist in a lean adolescent buys weight loss, which suppresses growth.

  ✓ FIVE - THE SMO-AGONIST CLAIM IS VERIFIED, AND IT MAKES R375 WORSE RATHER THAN BETTER. kwong2014 (Nat
  Commun): Hhip inhibits non-cell-autonomously, but ACTIVATION OF SMOOTHENED DRASTICALLY INCREASES Hhip
  INTERNALISATION AND DEGRADATION cell-autonomously, and Hhip cannot cell-autonomously inhibit the
  consequences of Smo activation. So a SMO agonist does lower HHIP protein. ⛔ BUT R375 established that the
  reason HHIP blockade is the true maximum is that it leaves PTCH1 - itself a GLI target and therefore the
  pathway''s own negative feedback - INTACT, while an agonist acts below it. If SAG additionally destroys
  Hhip, it removes a second brake as well as bypassing the first. THE AGONIST IS EVEN LESS SELF-LIMITING
  THAN R375 ASSUMED, WHICH STRENGTHENS THE PULSE REQUIREMENT.

  ⭐⭐ SIX - THE CORRECTION TO THIS FILE, AND IT IS THE MOST USEFUL THING IN THE ROUND. I was about to kill
  the siRNA route on this atlas''s own Donnan physics: cartilage fixed charge density is -0.19 to -0.35 M, a
  21-mer duplex carries about 40 negative charges, and enrichment goes as r to the power z, so a polyanion
  should be excluded by roughly ten to seventeen ORDERS OF MAGNITUDE - the exact inverse of why the cationic
  CPC+14 carrier works. THE EXPERIMENT HAS BEEN DONE AND IT WORKS ANYWAY. posey2017 (Mol Ther, Ionis
  chemistry on the author list) states the obstacle in its own abstract - cartilage is relatively avascular
  and considered inaccessible - then reports SUCCESSFUL DELIVERY OF ANTISENSE OLIGONUCLEOTIDES TO CARTILAGE
  in vivo with reduced target mRNA, reduced chondrocyte death and PARTIAL RESTORATION OF PROLIFERATION in
  the growth plate. The reconciliation is mechanistic and matters for what to build: an equilibrium
  partition coefficient describes FREE DIFFUSION, and a phosphorothioate gapmer is protein-bound and enters
  cells by ENDOCYTOSIS. → THE DONNAN ARGUMENT DOES NOT APPLY TO A PS-ASO, AND THE MODALITY FOR HHIP IS AN
  ASO RATHER THAN A NAKED siRNA.

  ⭐⭐⭐ SEVEN - AND THE VEHICLE FOR THE siRNA VERSION EXISTS, WAS BUILT FOR EXACTLY THIS INDICATION, AND THIS
  ATLAS HAD NEVER MENTIONED IT. yuan2024 (Adv Sci): exosomes from CHONDROCYTES engineered to display the
  collagen-II-targeting peptide WYRGRL fused to the N-terminus of LAMP2b, loaded with siRNA plus growth
  hormone, given by TAIL VEIN at 300 micrograms every 3 days, with bioluminescence showing significantly
  enhanced cartilage targeting versus control exosomes and fluorescence increased in cartilage while
  DECREASED IN LIVER AND OTHER ORGANS. ⭐ It reaches WYRGRL independently of ye2026, which used the same
  peptide on a chondrocyte-membrane PLGA nanoparticle to carry a small molecule to growth-plate cartilage
  from a tail vein. TWO GROUPS, TWO PARTICLE CHEMISTRIES, ONE TARGETING PEPTIDE, BOTH REACHING THE GROWTH
  PLATE SYSTEMICALLY - and one of them carrying a nucleic acid.
  ⭐ THE RNAi MACHINERY IS PRESENT TO RECEIVE IT: AGO2, DICER1 and TARBP2 all detected in all 12 human
  samples. ⛔ ASGR1 and ASGR2 are near-absent, so the standard systemic siRNA format - a GalNAc conjugate -
  is aimed at a receptor this tissue does not have and is the wrong conjugate.

  ⭐ EIGHT - SO THE CONSTRUCT IS SPECIFIC AND EVERY COMPONENT EXISTS SEPARATELY. AN HHIP-DIRECTED
  PHOSPHOROTHIOATE GAPMER, OR AN HHIP siRNA IN A WYRGRL-DISPLAYING CHONDROCYTE EXOSOME, DOSED SYSTEMICALLY,
  WITH A CALIPER ON THE FEMUR AND VERTEBRAE. It is the closest pharmacological analogue that exists of
  haraguchi2025''s limb-restricted Hhip1 conditional knockout - the one perturbation in this atlas shown to
  hold a normal growth plate open to 53 weeks with the zones ORDERED and sustained Gli1 upregulation - and
  it inherits R375''s central advantage: removing a SECRETED antagonist leaves the PTCH1 feedback intact, so
  it is the one hedgehog intervention that does not have to be pulsed.

  ⛔ NINE - WHAT IS MISSING, STATED PLAINLY. No HHIP-directed oligonucleotide of any kind has been dosed in
  vivo in any species - the published HHIP knockdowns are in vitro siRNA/shRNA in cancer and COPD cells.
  No anti-HHIP function-blocking antibody exists (the only anti-hedgehog antibody in the literature, 5E1,
  binds SHH, not HHIP). HHIP has no human ChEMBL target record at all (R334). yuan2024 reports its stature
  result qualitatively with no length number. posey2017 is a rescue in a mutant, so CORR-203 applies to its
  efficacy though not to its delivery. And the systemic direction carries HHIP''s two-sidedness - it is a
  tumour suppressor silenced across several cancers and the top COPD/lung-function locus.'
