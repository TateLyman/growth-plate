contradicts:
- claim: 'R315 established that cartilage delivery is governed by size and charge, and R371 computed Donnan
    partitioning from the atlas''s own fixed-charge-density numbers. Applied to a 21-mer siRNA duplex at
    about 40 negative charges, that predicts exclusion by ten to seventeen orders of magnitude.'
  resolution: 'The calculation is correct about EQUILIBRIUM PARTITION OF A FREELY DIFFUSING SOLUTE and wrong
    as a prediction about oligonucleotide therapeutics, because a phosphorothioate gapmer is highly
    protein-bound and enters cells by endocytosis rather than partitioning. posey2017 demonstrates the
    delivery in vivo and yuan2024 does it again with a packaged siRNA. THE DONNAN FRAMEWORK STAYS FOR FREE
    SOLUTES AND MUST NOT BE APPLIED TO PS-ASOs OR TO PARTICLE-PACKAGED PAYLOADS.'
- claim: R375 ranked SMO agonism as the obtainable second-best partly because it bypasses HHIP.
  resolution: 'kwong2014 shows it also DEGRADES Hhip. That does not promote SMO agonism - it makes the
    agonist less self-limiting still, because R375''s whole argument for why HHIP blockade is safer at
    sustained exposure is that PTCH1 feedback survives it. An agonist that removes both the upstream
    antagonist and the feedback node has no endogenous restraint at all, which is the strongest argument yet
    for pulsing it.'
