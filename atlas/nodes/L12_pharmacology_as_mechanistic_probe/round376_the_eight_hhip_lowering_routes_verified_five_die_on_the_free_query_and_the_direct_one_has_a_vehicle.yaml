id: round376_the_eight_hhip_lowering_routes_verified_five_die_on_the_free_query_and_the_direct_one_has_a_vehicle
name: Round 376 - THE EIGHT HHIP-LOWERING ROUTES, VERIFIED ONE BY ONE. Five die on the free local query
  because the drug's own receptor is not in the growth plate, one has no primary at all, one is real and
  makes R375's pulse requirement worse - and the direct route turns out to have a vehicle that already
  carries siRNA to growth-plate cartilage from a tail vein, plus an oligonucleotide precedent that refutes
  this file's own delivery physics
