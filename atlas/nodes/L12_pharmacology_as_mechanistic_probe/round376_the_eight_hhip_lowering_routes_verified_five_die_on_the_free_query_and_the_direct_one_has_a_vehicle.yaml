human_evidence: absent
human_evidence_note: 'No HHIP-lowering agent of any kind has been given to a human for a skeletal purpose.
  The only human data touching HHIP pharmacologically are circulating-biomarker studies - xu2023hhip (452
  women, metformin and liraglutide lowered serum HHIP), chou2021hhip and lei2024hhip - and those three
  cohorts disagree on the direction of the association and none has a skeletal endpoint. The human genetics
  are the strong part and are unchanged: HHIP pLoF +9.92 cm and the gain-of-function missense -3.96 cm.'
