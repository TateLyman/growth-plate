id: round234_the_fgfr3_axis_is_saturated_so_there_is_no_potency_advantage_to_weigh
name: >-
  ROUND 234 - the challenge tested: erdafitinib is NOT more potent at FGFR3 on any measured axis, the
  FGFR3-selective agent beat it head to head in vivo at P = 0.0244 and 54.5 against 35.3 per cent in humans,
  and the human growth response is FLAT across the coverage range so no potency advantage could be spent
type: hypothesis
layer: L12
aliases:
- the potency weighing
- there is no FGFR3 advantage to weigh
- the FGFR3 axis is saturated
- 96 against 91 per cent TGI
- round 234
stub: false
summary: |
  THE CHALLENGE WAS THAT ERDAFITINIB IS SIGNIFICANTLY MORE POTENT AT FGFR3 THAN THE FGFR3-SELECTIVE AGENT,
  SO THAT ROUNDS 230 TO 233's RECOMMENDATION TRADES GROWTH FOR SAFETY. IT IS A GOOD CHALLENGE, IT IS
  TESTABLE, AND IT FAILS ON THREE INDEPENDENT AXES - AFTER WHICH A FOURTH ARGUMENT MAKES THE WHOLE
  COMPARISON MOOT.

  AXIS A, IN VITRO. The Ba/F3 cellular FGFR3 IC50s are 1.35 nmol/L for erdafitinib and 1.75 for
  dabogratinib - A 1.30-FOLD DIFFERENCE, inside the run-to-run variation of a cellular proliferation assay.
  The manufacturer's own peer-reviewed paper states that dabogratinib has SIMILAR IN VITRO POTENCY IN
  FGFR3-DRIVEN CELL LINES AS PAN-FGFR INHIBITORS, with selectivity of 19-fold over FGFR2, 63-FOLD OVER
  FGFR1 and 55-fold over FGFR4.

  AXIS B, IN VIVO, HEAD TO HEAD, SAME EXPERIMENT, WITH A P VALUE. In the UM-UC-14 xenograft driven by an
  FGFR3 S249C activating mutation, tumour growth inhibition at 21 days was 96 PER CENT FOR DABOGRATINIB 18
  mg/kg ONCE DAILY AGAINST 91 PER CENT FOR ERDAFITINIB 12.5 mg/kg TWICE DAILY, P = 0.0244 IN THE SELECTIVE
  AGENT'S FAVOUR. Dabogratinib's own dose-response in the same figure runs 46, 80 and 96 per cent at 6, 12
  and 18 mg/kg once daily.

  AXIS C, IN HUMANS, AND THIS ONE NEEDS NO PHARMACOKINETIC ASSUMPTION AT ALL - WHICH MATTERS BECAUSE THE
  ENTIRE FREE-CONCENTRATION COMPARISON RESTS ON A FRACTION UNBOUND FOR DABOGRATINIB THAT ROUND 213 INFERRED
  FROM A FIGURE AXIS AND NOBODY HAS MEASURED. Both drugs have been given to people with FGFR3-altered
  metastatic urothelial carcinoma, a disease driven by the receptor in question, and response rate is a
  direct clinical readout of FGFR3 engagement. DABOGRATINIB - SIX CONFIRMED PARTIAL RESPONSES IN ELEVEN
  EVALUABLE PATIENTS, 54.5 PER CENT, at 90 mg or above, with a very low frequency of grade 3 treatment-
  related events. ERDAFITINIB - ORR 35.3 PER CENT, median PFS 5.6 months, with serious adverse events in 41
  per cent, dose interruption in 68, reduction in 53 and PERMANENT DISCONTINUATION IN 21.

  SO ON EVERY MEASURED AXIS THE FGFR3-SELECTIVE AGENT IS AT LEAST AS GOOD AT FGFR3 AND BETTER TOLERATED.
  THERE IS NO FGFR3 ADVANTAGE TO WEIGH AGAINST THE FGFR1 COST.

  AND NOW THE PART THAT WOULD SETTLE IT EVEN IF THERE WERE ONE. Round 228 unspliced the two quantified
  children. Expressed on the free-coverage axis, erdafitinib at 3 mg is 1.72 times its own FGFR3 cellular
  IC50, at 5 mg 2.86 and at 7 mg 4.01. THE CHILD ON 5-THEN-3 mg GREW 19.6 cm/YEAR AND THE CHILD ON 7-THEN-5
  mg GREW 19.1. A 1.50-FOLD RISE ON THE MIDPOINTS, ACROSS A 1.72 TO 4.01 SPAN OF THE AXIS, BOUGHT MINUS 2.6
  PER CENT OF VELOCITY. THE HUMAN FGFR3 GROWTH RESPONSE IS SATURATED AT OR BELOW ABOUT TWICE THE CELLULAR
  IC50 - the bottom of every clinical dose range in play. Additional FGFR3 potency, in any molecule, buys
  no additional height; the FGFR1 cost rises with dose. THE AXIS THE CHALLENGE IS FOUGHT ON IS FLAT.

  THAT ALSO CORRECTS THIS ATLAS. Round 213's growth-versus-coverage curve - 1.72 times gave about 10 cm/year
  and 4.01 times gave 19.06 - ASSIGNED 3 mg TO A CHILD WHOSE DOSE IS STATED NOWHERE, confirmed again this
  round by re-reading erdaseries2025 in full, which gives a dose for patient 1 only. Round 228 killed the
  rising curve in milligrams and never pushed the correction up to the coverage axis. Recorded as CORR-242.

  THE CEILING COMPARISON, FOR COMPLETENESS. Erdafitinib's LABEL MAXIMUM of 9 mg is 5.16 times IC50 and is
  gated by a serum phosphate reading; the three quantified children took 3, 5 and 7 mg. Dabogratinib at 90
  mg is 4.33 times, doses through 100 mg once daily are cleared, and the explored range runs to 120 mg,
  which extrapolates to 5.77 times - ABOVE ERDAFITINIB'S CEILING, WITH NO PHOSPHATE GATE TO STOP IT.

  AND THE SUPPLIED BMI FIGURE INDEPENDENTLY CROSS-CHECKS THE NUMBER THE WHOLE FLAT CURVE RESTS ON.
  erdaseries2025's Supplementary Figure 1 states the BMI decrease was MAINLY CAUSED BY INCREASE OF BODY
  HEIGHT, and patient 1's BMI runs from about 24.5 at treatment start near age 14.0 to a nadir near 21.3 at
  about 14.4, recovering to about 25 by 15.5 after the halt. At constant weight that is a height ratio of
  1.0725, or plus 7.25 per cent - which for a boy of 140 to 155 cm implies 10.2 TO 11.2 cm, against the
  FDA's reported 9.8 cm OVER 6 MONTHS, with the excess absorbed by the weight gain the caption concedes is
  not zero. TWO INDEPENDENT SOURCES AGREE, WHICH MATTERS BECAUSE ROUND 228's FLAT DOSE-RESPONSE RESTS ON
  THAT 9.8 cm.

  AND THE SUPPLIED CO-MEDICATION TABLE ADDS TWO CONFOUNDERS NOBODY HAD. Patient 1 was on GROWTH HORMONE
  STARTED SEVEN YEARS BEFORE ERDAFITINIB, plus hydrocortisone 10 mg and levothyroxine 75 microgram daily -
  panhypopituitarism on full replacement, which is a cleaner background than it looks because all three
  were stable long before the drug. PATIENT 2 WAS ON PHOSPHATE 500 mg DAILY, DISCONTINUED AFTER
  ERDAFITINIB INITIATION, with colecalciferol 72,000 IU - so she had a pre-existing mineral disorder being
  treated with phosphate supplementation, her pre-treatment phosphate of 1.75 mmol/L was supplement-
  supported, and her post-withdrawal 1.12 reflects the loss of BOTH the drug and the supplement. Any future
  use of patient 2's phosphate series must carry that.
quantitative:
- parameter: erdafitinib against dabogratinib on FGFR3, three measured axes
  value: >-
    IN VITRO - Ba/F3 cellular FGFR3 IC50 1.35 nmol/L erdafitinib against 1.75 dabogratinib, a 1.30-fold
    difference, with the manufacturer stating SIMILAR IN VITRO POTENCY IN FGFR3-DRIVEN CELL LINES AS
    PAN-FGFR INHIBITORS and selectivity 19-fold over FGFR2, 63-fold over FGFR1, 55-fold over FGFR4. IN VIVO
    - UM-UC-14 FGFR3-S249C xenograft, 21 days, tumour growth inhibition 96 PER CENT for dabogratinib 18
    mg/kg once daily against 91 PER CENT for erdafitinib 12.5 mg/kg twice daily, P = 0.0244; dabogratinib's
    internal dose-response 46, 80, 96 per cent at 6, 12, 18 mg/kg once daily. IN HUMANS - dabogratinib 6
    confirmed partial responses in 11 evaluable FGFR3-altered urothelial patients at 90 mg or above (54.5
    per cent) with very low grade 3 rates, against erdafitinib ORR 35.3 per cent, PFS 5.6 months, serious
    AEs 41 per cent, interruption 68, reduction 53, permanent discontinuation 21
  unit: nmol/L, per cent tumour growth inhibition, per cent objective response
  conditions: one preclinical paper containing the head-to-head; the clinical figures are cross-trial
  species: human
  source_ref: dabogratinib2026
  uncertainty: >-
    A TUMOUR IS NOT A GROWTH PLATE - every axis here is an FGFR3-driven ONCOLOGY readout, and cartilage
    penetration is unmeasured for both drugs in every species, so a molecule could win all three and still
    reach the physis less well. The clinical comparison is CROSS-TRIAL - 6 responses in 11 phase I patients
    against a phase III population with different prior lines, and phase I response rates are routinely
    flattered. The tumours carry ACTIVATING FGFR3 MUTATIONS and this case is wild type, though round 208
    already records TYRA-300 raising length in WILD-TYPE C57BL/6J mice, which is the right control
- parameter: the human FGFR3 growth response is flat across the clinical coverage range
  value: >-
    free steady-state average as a multiple of erdafitinib's own Ba/F3 FGFR3 cellular IC50 - 3 mg = 1.72x,
    5 mg = 2.86x, 7 mg = 4.01x, 8 mg = 4.58x, 9 mg = 5.16x. The child on 5-then-3 mg (1.72 to 2.86x) grew
    19.6 cm/year; the child on 7-then-5 mg (2.86 to 4.01x) grew 19.1 cm/year. A 1.50-FOLD RISE ON THE
    MIDPOINTS ACROSS A 1.72-TO-4.01 SPAN OF THE AXIS GAVE MINUS 2.6 PER CENT OF VELOCITY. Dabogratinib at
    90 mg is 4.33x and the explored range to 120 mg extrapolates to 5.77x, above erdafitinib's 9 mg ceiling
  unit: multiples of the drug's own FGFR3 cellular IC50 against cm/year
  conditions: computed in atlas/tools/round234_the_potency_weighing.py from round 213's coverage table and
    round 228's unspliced velocities
  species: human
  source_ref: nadeaunguyen2026
  uncertainty: >-
    TWO CHILDREN, one of whom was also on growth hormone, and both had dose reductions mid-course so
    neither has a clean exposure. THE COVERAGE AXIS ITSELF INHERITS A DERIVED FRACTION UNBOUND FOR
    DABOGRATINIB THAT ROUND 213 INFERRED FROM A FIGURE AXIS AND NOBODY HAS MEASURED - which is precisely
    why the clinical response-rate comparison, which needs no such assumption, carries more weight here
  value_unverified: true
- parameter: the BMI figure cross-checks the FDA's height gain for erdaseries2025 patient 1
  value: >-
    Supplementary Figure 1 states the BMI decrease was MAINLY CAUSED BY INCREASE OF BODY HEIGHT. Patient 1
    runs from BMI about 24.5 at treatment start near age 14.0 to a nadir near 21.3 at about age 14.4,
    recovering to about 25 by 15.5 after the halt. At constant weight, BMI 24.5 to 21.3 is a height ratio of
    1.0725, or plus 7.25 per cent - implying 10.2 cm from a starting height of 140 cm, 10.9 cm from 150 and
    11.2 cm from 155, against the FDA's reported 9.8 cm over 6 months
  unit: BMI units read from a printed chart, converted to cm
  conditions: figure values read to about plus or minus 0.3 BMI units; starting height is not reported anywhere
  species: human
  source_ref: erdaseries2025
  uncertainty: >-
    A CONSISTENCY CHECK AND NOT A MEASUREMENT. The BMI values are read off a chart, the starting height is
    unknown so the implied gain is given as a range over plausible heights, and the caption says MAINLY
    rather than ENTIRELY, so some of the BMI fall is weight. What it establishes is that the FDA's 9.8 cm is
    not a transcription error - which matters because round 228's flat dose-response rests on it
  value_unverified: true
- parameter: two confounders from the supplied co-medication table
  value: >-
    PATIENT 1 - Norditropin (growth hormone) 1 mg/day STARTED SEVEN YEARS BEFORE ERDAFITINIB INITIATION,
    hydrocortisone 10 mg/day, levothyroxine 75 microgram/day, esomeprazole 40 mg/day. PATIENT 2 -
    PHOSPHATE 500 mg/day DISCONTINUED AFTER ERDAFITINIB INITIATION, colecalciferol 72,000 IU, levothyroxine
    37.5 microgram/day, levetiracetam 1000 mg/day, trimethoprim-sulfamethoxazole three times weekly
  unit: agent and daily dose
  conditions: erdaseries2025 supplementary table 1, supplied this round
  species: human
  source_ref: erdaseries2025
  uncertainty: >-
    Patient 1's growth hormone confound is WEAKER than it looks because the dose was stable for seven years
    before erdafitinib, so it cannot explain a spurt that began with the drug - but it is not zero, since
    GH and FGFR inhibition could interact. PATIENT 2's PHOSPHATE SUPPLEMENTATION IS A REAL AND PREVIOUSLY
    UNRECORDED CONFOUND - she had a pre-existing mineral disorder, her pre-treatment phosphate was
    supplement-supported, and her low post-withdrawal value reflects losing both the drug and the supplement
localization:
- 'the FGFR3 kinase, where the axis is already saturated at the lowest clinical dose'
- 'the kidney, where the only cost that scales with dose is paid'
human_evidence: direct
human_evidence_note: >-
  Two clinical response datasets in FGFR3-driven human disease, two quantified children on the coverage
  axis, and one supplementary figure. The head-to-head potency comparison is mouse and is labelled.
species_basis:
- human
- mouse
translation_risk: moderate
translation_risk_reason: >-
  The potency comparisons are FGFR3-driven ONCOLOGY readouts and the target is a growth plate. Cartilage
  penetration is unmeasured for both agents in every species, which is the one route by which the
  conclusion could be wrong in a way none of the three axes would detect.
confidence: B
claim_grades:
- claim: erdafitinib is significantly more potent at FGFR3 than the FGFR3-selective agent
  grade: X
  basis: >-
    NOT SUPPORTED ON ANY MEASURED AXIS. In vitro the difference is 1.30-fold with the manufacturer calling
    the potencies similar; in vivo head to head the selective agent won at P = 0.0244; in humans with
    FGFR3-driven disease the selective agent shows 54.5 per cent against 35.3
- claim: the human FGFR3 growth response rises with FGFR3 coverage across the clinical range
  grade: X
  basis: >-
    FALSE ON THE ONLY TWO PROPERLY ANCHORED CHILDREN - 1.72 to 2.86x gave 19.6 cm/year and 2.86 to 4.01x
    gave 19.1. Round 213's rising curve assigned 3 mg to a child whose dose is stated nowhere (CORR-242)
- claim: additional FGFR3 potency is worth trading FGFR1 selectivity for
  grade: X
  basis: >-
    NO, ON TWO INDEPENDENT GROUNDS. There is no potency advantage to trade for, and the axis it would be
    spent on is saturated at the bottom of every clinical dose range in play, while the FGFR1 cost rises
    with dose and is what interrupts and ends treatment
- claim: an FGFR3-selective agent reaches the growth plate as well as a pan-FGFR agent
  grade: E
  basis: >-
    UNKNOWN AND NOT ADDRESSED BY ANY OF THIS. Cartilage penetration is unmeasured for both drugs in every
    species. This is the one route by which the conclusion could still be wrong, and no axis tested here
    would detect it
- claim: the FDA's 9.8 cm over 6 months for erdaseries2025 patient 1 is reliable
  grade: B
  basis: >-
    INDEPENDENTLY CROSS-CHECKED. The supplementary BMI chart implies 10.2 to 11.2 cm at constant weight over
    the same interval for plausible starting heights, with the excess absorbed by the weight gain the
    caption concedes. Round 228's flat dose-response rests on this number
