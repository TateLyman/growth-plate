id: erdafitinib_versus_the_alternatives_decision
name: The FGFR axis is defensible and the spine fear was overstated — but erdafitinib specifically cannot be dosed into the window
type: hypothesis
layer: L12
stub: false
summary: 'THIS NODE EXISTS BECAUSE THE ARGUMENT HAS BEEN MOVING IN ONE DIRECTION FOR FIVE ROUNDS AND THAT
  IS ITSELF INFORMATION. Across rounds 32 to 38 this atlas corrected itself FOUR TIMES in erdafitinib''s
  favour: the potency comparison (CORR-038, it is more potent at every FGFR), the FGFR4 dismissal
  (CORR-040, FGFR4 restrains cartilage so blocking it should help), the FGFR4 target localisation
  (CORR-042, FGFR4 is chondrocyte-EXCLUSIVE, 35- to 80-fold enriched), and the FGFR1 direction
  (jacob2006, deletion DELAYS hypertrophic maturation, which is an h_term action). Every one of those
  corrections was legitimate on its own facts. BUT ALL FOUR ARE MECHANISM, AND THE OUTCOME EVIDENCE HAS
  NOT MOVED AT ALL. That asymmetry is the finding. ON MECHANISM erdafitinib now has the richest story of
  any agent here - three plausible pro-growth targets. ON EVIDENCE it has ONE child who grew 19.06 cm/year
  and FIVE postmarketing cases in which the drug was PERMANENTLY DISCONTINUED and THREE required surgery,
  with NO FINAL HEIGHT ANYWHERE. Against that, infigratinib has a randomised placebo-controlled phase 3
  (n=74 against 39, +1.74 cm/year, no accelerated bone age, no FGFR1 or FGFR2 signal) and TYRA-300 is the
  only agent shown to lengthen bone in a WILD-TYPE animal. AND THE ONE STRUCTURAL ADVANTAGE THIS ATLAS
  CLAIMED FOR ERDAFITINIB IS WRONG. Round 36 proposed titrating erdafitinib to just below the
  hyperphosphatemia threshold, using phosphate as a real-time readout of the FGFR1 boundary. The
  selectivity ordering makes that self-defeating: FGFR1 IC50 is 1.20 nM, BELOW FGFR3 at 3.00 and FGFR4 at
  5.70, so phosphate rises FIRST and a dose below the phosphate threshold is a dose below the FGFR3 and
  FGFR4 IC50s. Hyperphosphatemia is not a guardrail, it is the ENTRY TICKET. TWO CHECKS RUN ON
  2026-08-07 THEN SETTLED THE REST, AND ONE REFUTED THIS NODE''S OWN STRONGEST OBJECTION. FIRST, THE
  SPINE ARGUMENT IS WRONG AT THERAPEUTIC DOSES: a randomised placebo-controlled trial measuring spinal
  radiographs directly (canopyspine2026, n = 75) found vosoritide IMPROVED spinal canal width (+1.433 mm
  at L4, P = .002) and HALVED pathological thoracolumbar kyphosis (33.3 against 59.3 per cent, P = .037),
  and TYRA-300 increased vertebral length and improved disc shape. Spinal deformity is a function of HOW
  HARD the plate is driven, not of WHICH AXIS drives it, so the axis-based safety argument against FGFR
  inhibition is WITHDRAWN. SECOND, NO AGENT ON EITHER AXIS HAS A FINAL ADULT HEIGHT IN ANYONE - confirmed
  from a 2026 systematic review stating the vosoritide cohorts are still being followed to final height.
  And on the only velocity numbers available the CNP arm is the SMALLER effect: pooled CNP analogs
  +1.36 cm/year against infigratinib''s +1.74. THE HONEST VERDICT, NARROWED: the FGFR axis is not the
  wrong axis and may be the better one, and the spine fear was overstated. What the evidence does not
  support is ERDAFITINIB SPECIFICALLY, because its FGFR1-first selectivity ordering means it cannot be
  dosed into the therapeutic window without leading with the receptor that carries the liability - which
  is exactly the problem a selective or low-dose FGFR3-preferential agent does not have. AND THE FGFR1
  QUESTION IS NOW SETTLED BY THE EXPERIMENT THIS ATLAS SAID DID NOT EXIST: karolak2015 deleted Fgfr1
  specifically in chondrocytes and got REDUCED STATURE AND REDUCED TIBIAL LENGTH, despite an ENLARGED
  hypertrophic zone. Local FGFR1 blockade SHORTENS bones, so erdafitinib''s most potently engaged
  receptor is an anti-growth one and its net effect is the FGFR3 benefit minus an FGFR1 cost. That
  converts the argument for a selective agent from a dosing inconvenience into a mechanism.'
quantitative:
- parameter: THE LEDGER WAS WEIGHTED WRONG — FGFR3 IS NOT ONE OF THREE BRAKES, IT IS THE BRAKE
  value: 'ADULT HUMAN STATURE EFFECT OF A SINGLE GERMLINE LESION. FGFR3 GAIN (achondroplasia): mean adult
    height about 131 cm in men and 124 cm in women, roughly 45-50 cm below population mean. FGFR3 PARTIAL
    LOSS (CATSHL): 195.6 cm in men, about +20 cm and +2.8 SD. So FGFR3 spans ROUGHLY 65 CM OF ADULT HUMAN
    HEIGHT between its two directions. FGFR1 chondrocyte deletion: mouse only, "reduced tibial length",
    no magnitude given. FGFR4 germline null: mouse only, failed autophagy and decreased Col2, NO BONE
    LENGTH REPORTED AT ALL. NEITHER FGFR1 NOR FGFR4 HAS ANY REPORTED HUMAN STATURE PHENOTYPE'
  unit: cm of adult human height
  conditions: assembled from cnpmeta2026 (achondroplasia natural history), toydemir2006 (CATSHL),
    karolak2015 and cinque2015
  species: human
  source_ref: toydemir2006
  atlas_derived: true
  uncertainty: 'THIS IS THE ARGUMENT THAT SHOULD HAVE COME FIRST AND ITS ABSENCE IS WHY THE PREVIOUS ROWS
    REACHED THE WRONG CONCLUSION (CORR-046). Those rows treated three receptor directions as ADDITIVE AND
    EQUALLY WEIGHTED while holding a magnitude for NONE of them. FGFR3 carries a 65 cm span of adult human
    height; FGFR1 and FGFR4 carry no measured human stature phenotype at all. A pan-FGFR inhibitor''s net
    effect is therefore DOMINATED BY FGFR3 RELIEF, which is precisely what erdafitinib produced -
    19.06 cm/year in a child, with "accelerated growth" added to the US label off a five-case series.
    AND THE DEEPER ERROR WAS EPISTEMIC: a ledger assembled from mouse GERMLINE and DEVELOPMENTAL deletions
    was used to overrule a DIRECT HUMAN MEASUREMENT of the net effect. karolak2015 uses Col2a1-Cre from
    embryonic cartilage and cinque2015 is germline - both ask whether a receptor is required to BUILD a
    growth plate, not what partial inhibition does to an already-built adolescent one. When a mechanistic
    ledger and a measurement disagree, THE LEDGER IS WHAT IS WRONG OR INCOMPLETE. WHAT THIS DOES NOT
    OVERTURN: the IC50 ordering is arithmetic and stands (CORR-043), and five of five paediatric
    erdafitinib cases were permanently discontinued with three requiring surgery. The case for a selective
    agent survives - but it is now a SAFETY AND MARGIN argument, not a claim that erdafitinib''s net
    mechanism is unfavourable.'
- parameter: THE ACCESSIBILITY ARGUMENT IS CORRECT, AND IT BUYS ACCESS TO THE ONE DOSE WE KNOW IS HARMFUL
  value: 'AVAILABILITY: erdafitinib is APPROVED with an established dose (8 mg daily, up-titrated against
    serum phosphate) and is the ONLY FGFR inhibitor with a demonstrated large human growth effect -
    19.06 cm/year. Dabogratinib (TYRA-300) is the first FGFR3 ISOFORM-SELECTIVE inhibitor and is in
    FIRST-IN-HUMAN phase I/II (SURF301, NCT05544552) - in humans, but obtainable only in a trial.
    Infigratinib is dosed for achondroplasia at 0.25 mg/kg/day. THE HOLE: the 19.06 cm/year was produced at
    FULL ONCOLOGY DOSING IN A CHILD, and that exposure caused kyphoscoliosis with SPINAL CORD COMPRESSION
    requiring surgery. THERE IS NO DATA ON ERDAFITINIB AT A LOWER DOSE FOR GROWTH, IN ANY SPECIES'
  unit: qualitative - availability against demonstrated dose
  conditions: dabogratinib2026 for the TYRA-300 clinical stage; erdachild2024 and nadeaunguyen2026 for the
    erdafitinib exposure and outcomes; propel3_2026 for infigratinib dosing
  species: human
  source_ref: dabogratinib2026
  uncertainty: 'THE ARGUMENT THAT ERDAFITINIB WINS ON OBTAINABILITY IS SOUND AND THIS ATLAS ACCEPTS IT -
    it is approved, its dose is established, and it is the only agent in the class with a demonstrated
    large human growth effect. WHERE THE ARGUMENT BREAKS IS THE CLAIM THAT IT DOES NOT NEED RECKLESS
    DOSING. The only dose at which erdafitinib has ever been shown to grow a child is the full oncology
    dose, and at that dose it produced permanent-injury-grade harm in the same patient. Accessibility
    therefore buys access to precisely the exposure that is known to be dangerous, and says nothing about
    any exposure that might be safe. AND THE DOSE-REDUCTION STRATEGY IS THE ONE THIS MOLECULE IS WORST
    SUITED TO. Because FGFR1 (1.20 nM) engages before FGFR3 (3.00 nM), lowering the erdafitinib dose does
    not deliver a smaller share of the benefit - it delivers a LARGER share of the cost, since FGFR1
    blockade shortens bones (karolak2015). Infigratinib is the opposite case: at 0.25 mg/kg it
    demonstrably produces growth with NO clinical evidence of FGFR1 or FGFR2 inhibition, so its low-dose
    behaviour is favourable AND measured. THAT IS THE THING ERDAFITINIB LACKS AND THE THING THAT WOULD
    DECIDE IT. AND THE PRICE ARGUMENT INVERTS: the expensive intervention is not the unobtainable
    selective agent, it is the cord decompression, the spinal fusion and the permanent neurological risk
    that the accessible one produced in three of five children.'
- parameter: AND WHAT IS UNIQUE TO ERDAFITINIB IS PROBABLY EXPOSURE, NOT SELECTIVITY
  value: 'infigratinib in achondroplasia is dosed at 0.25 mg/kg/day - for a 20 kg child about 5 mg -
    against an oncology dose of 125 mg daily; erdafitinib in the paediatric cases was used at ONCOLOGY
    dosing, titrated upward against serum phosphate. The observed velocities are +1.74 cm/year for
    infigratinib in a randomised phase 3 and 19.06 cm/year in the erdafitinib case, an ELEVENFOLD
    difference across the same axis'
  unit: mg/kg/day and cm/year
  conditions: propel3_2026 dosing against erdachild2024 and nadeaunguyen2026; the oncology dose comparison
    is approximate and mixes flat and weight-based dosing across different ages
  species: human
  source_ref: erdachild2024
  atlas_derived: true
  uncertainty: 'THE MOST LIKELY ANSWER TO "WHAT IS UNIQUE ABOUT ERDAFITINIB" IS THAT IT IS THE ONLY FGFR
    INHIBITOR EVER PUSHED TO FULL ONCOLOGY-LEVEL OCCUPANCY IN A GROWING CHILD. The selective agents are
    dosed for safety in a disease population, roughly an order of magnitude below their own oncology
    exposures, so the elevenfold velocity gap may be almost entirely DOSE rather than molecule. IF THAT IS
    RIGHT, THE 19 CM/YEAR IS EVIDENCE ABOUT THE DOSE-RESPONSE OF FGFR3 BLOCKADE RATHER THAN ABOUT
    ERDAFITINIB, and the important implication runs the other way from the drug choice: the selective
    agents have never been tested anywhere near the exposure that produced dramatic growth, so their
    +1.74 cm/year is a floor set by regulatory caution, NOT a ceiling set by biology. A SECOND CANDIDATE
    THIS ATLAS COULD NOT VERIFY: erdafitinib has a long terminal half-life giving continuous rather than
    intermittent FGFR3 coverage, and if FGFR3 restraint recovers between doses then continuous blockade
    could differ qualitatively rather than only quantitatively. THE HALF-LIFE FIGURE COULD NOT BE
    CONFIRMED FROM ANY SOURCE THIS ATLAS RETRIEVED and is recorded as unverified rather than asserted.
    The dose comparison itself is rough - flat oncology dosing against weight-based paediatric dosing
    across different ages and different molecules - and n = 1 for the 19.06 figure.'
- parameter: FGFR4 IS SETTLED TOO — AND IT IS ALSO ANTI-GROWTH TO INHIBIT, SO THE RECEPTOR LEDGER CLOSES
  value: 'AUTOPHAGY IS NECESSARY FOR BONE GROWTH - Atg7 deletion in limb mesenchyme (Prx1-Cre) or cartilage
    (Col2a1-Cre) reduces femoral and tibial length from P9 - and postnatal chondrocyte autophagy is induced
    by FGF18 THROUGH FGFR4 and JNK. Fgf18+/- and Fgfr4-/- MICE FAIL TO INDUCE AUTOPHAGY during postnatal
    development and show DECREASED Col2 in the growth plate; BOTH PHENOTYPES ARE RESCUED IN VIVO BY
    PHARMACOLOGICAL ACTIVATION OF AUTOPHAGY. RNAi of Fgfr3 or Fgfr4, but NOT Fgfr1 or Fgfr2, blocks
    FGF18-induced autophagy. FULL LEDGER: FGFR3 inhibition PRO-growth; FGFR1 inhibition ANTI-growth
    (karolak2015); FGFR4 inhibition ANTI-growth (cinque2015). Erdafitinib IC50: FGFR1 1.20, FGFR3 3.00,
    FGFR4 5.70 nM'
  unit: qualitative direction per receptor; IC50 nM
  conditions: cinque2015, Nature, mouse genetics with pharmacological autophagy rescue
  species: mouse
  source_ref: cinque2015
  uncertainty: 'THIS WAS REQUESTED AS THE PAPER THAT MIGHT REOPEN THE ERDAFITINIB CASE AND IT CLOSES IT.
    If FGFR4 inhibition were pro-growth the case reopens; instead FGFR4 is REQUIRED for the autophagy that
    is REQUIRED for bone growth, so blocking it is a second cost. THE RECEPTOR LEDGER NOW READS ONE
    PRO-GROWTH TARGET AND TWO ANTI-GROWTH TARGETS, and erdafitinib engages one anti-growth receptor MORE
    potently than the pro-growth one (FGFR1 at 1.20 against FGFR3 at 3.00) and the other comparably (FGFR4
    at 5.70). A narrowly FGFR3-selective agent takes the benefit and pays neither cost. AND IT RESOLVES THE
    APPARENT CONTRADICTION WITH fgf19cart2025, WHICH IS THE MOST INTERESTING PART. FGF19 through FGFR4
    RESTRAINS growth via Wnt antagonists; FGF18 through FGFR4 PROMOTES growth via autophagy. Same receptor,
    opposite signs, DIFFERENT LIGANDS - and this atlas has already measured which ligand operates in human
    cartilage. FGF19 needs beta-klotho, which is absent from human growth plate chondrocytes, and FGF19
    itself is undetectable there; FGF18 needs no klotho and IS detected. SO THE OPERATIVE FGFR4 SIGNAL IN
    HUMAN GROWTH PLATE IS THE GROWTH-PROMOTING ONE, which makes FGFR4 blockade anti-growth in humans
    specifically. LIMITS: Fgfr4-/- is germline and the reported growth-plate phenotype is decreased Col2
    and failed autophagy rather than a measured bone length, so the length consequence of FGFR4 loss alone
    is inferred from the autophagy requirement rather than measured directly; mouse throughout.'
- parameter: THE FGFR1 QUESTION IS SETTLED AND IT GOES AGAINST PAN-FGFR AGENTS
  value: 'CHONDROCYTE-SPECIFIC Fgfr1 deletion (Fgfr1-Col2cKO, Col2a1-driven) gives REDUCED STATURE by
    postnatal day 4, reduced body weight by P9, and REDUCED TIBIAL LENGTH at P18 against wild-type
    littermates - DESPITE THE INCREASED SIZE OF THEIR HYPERTROPHIC ZONE. Nf1 co-ablation reverses the
    hypertrophic zone phenotype, placing FGFR1 upstream of Ras-ERK1/2 in maturing chondrocytes'
  unit: qualitative direction on stature and tibial length
  conditions: karolak2015, Col2a1-Cre conditional Fgfr1 deletion, mouse, n = 4 per group
  species: mouse
  source_ref: karolak2015
  uncertainty: 'THIS IS THE EXPERIMENT THIS ATLAS SAID DID NOT EXIST - a CHONDROCYTE-RESTRICTED Fgfr1
    deletion with a LENGTH ENDPOINT - and it answers the question in the direction that counts against
    erdafitinib. LOCAL FGFR1 INHIBITION IN CARTILAGE SHORTENS BONES. So erdafitinib''s most potently
    engaged receptor (1.20 nM, below FGFR3 at 3.00) is one whose blockade is ANTI-growth at the plate,
    which means its net effect is the FGFR3 benefit MINUS an FGFR1 cost, while a selective FGFR3 agent
    takes the benefit without paying it. That is now a mechanistic argument grounded in a genetic
    experiment rather than in the phosphate side effect. IT ALSO CORRECTS THIS ATLAS TWICE OVER. jacob2006
    reported that Fgfr1 deletion DELAYS HYPERTROPHIC MATURATION and this atlas read that as an h_term
    action and therefore pro-growth; karolak2015 confirms the enlarged hypertrophic zone AND reports the
    bone is SHORTER. AN ENLARGED HYPERTROPHIC ZONE IS NOT MORE GROWTH. The reconciliation is that zone
    height rises when clearance slows and cells accumulate, whereas elongation rate is cells PRODUCED per
    unit time times terminal cell height - so a zone can thicken while growth falls. That is the
    time-boxed-hypertrophy caveat this atlas recorded as a footnote, now demonstrated. LIMITS: mouse,
    n = 4 per group, Col2a1-Cre deletes from early cartilage rather than postnatally, and germline-scale
    deletion is not the same as partial pharmacological inhibition in an adolescent plate.'
- parameter: MECHANISM AGAINST EVIDENCE — THE TWO COLUMNS HAVE DIVERGED
  value: 'ERDAFITINIB MECHANISM: FGFR3 IC50 3.00 nM (most potent clinical agent); FGFR4 5.70 nM and FGFR4
    is chondrocyte-exclusive in human growth plate (35-80x enriched); FGFR1 1.20 nM and Fgfr1 deletion
    delays hypertrophic maturation. ERDAFITINIB EVIDENCE: n = 1 child, 19.06 cm/year over 9 months, no
    baseline bone age, no final height; FIVE postmarketing cases, ALL permanently discontinued, THREE
    requiring surgery, median onset 137 days. INFIGRATINIB EVIDENCE: randomised placebo-controlled phase
    3, n = 74 against 39, +1.74 cm/year (95% CI 1.31-2.17, P < 0.0001), no accelerated bone age, no
    FGFR1/FGFR2 signal. TYRA-300: lengthens bone in WILD-TYPE mice. LIFETIME COMPARISON: partial FGFR3
    loss gives about +2.8 SD adult height against +4.9 to +5.2 SD for CNP-axis gain'
  unit: mixed - IC50 nM, cm/year, SD, case counts
  conditions: assembled across erdachild2024, nadeaunguyen2026, propel3_2026, tyra300_2025, toydemir2006,
    hannema2013, moffatt2025 and this atlas's ChEMBL and GSE288028 re-analyses
  species: human
  source_ref: nadeaunguyen2026
  uncertainty: 'THE ASYMMETRY IS THE POINT AND IT SHOULD NOT BE READ AS A TIE. Mechanistic plausibility is
    the cheapest thing in pharmacology and the least predictive; this atlas has already recorded one drug
    class - growth hormone - whose mechanism is impeccable and whose final-height dose-response saturates.
    Erdafitinib''s three targets are three hypotheses, two of which (FGFR4 direction in cartilage, FGFR1
    direction on bone length) have NO measured sign, and one of which (FGFR1 via jacob2006) rests on an
    ABSTRACT with a lineage-wide deletion and NO LENGTH ENDPOINT. THE FIVE POSTMARKETING CASES ARE NOT
    FIVE PEOPLE WHO GREW - they are five people harmed enough to stop the drug, and three cut open.
    THE ONE COMPARISON THAT MEASURES THE THING WE ACTUALLY WANT - adult height after lifelong maximal
    pathway perturbation - FAVOURS THE CNP AXIS BY ABOUT TWO STANDARD DEVIATIONS, and the CNP figures are
    floors because both individuals were surgically stopped. The counter that CATSHL is only PARTIAL
    FGFR3 loss is real and is why this is not a settled negative.'
- parameter: THE LYSOSOMAL-TRAPPING ARGUMENT, ENGAGED PROPERLY — AND IT STRENGTHENS THE CASE AGAINST
  value: 'the argument: growth plate cartilage is AVASCULAR AND ALYMPHATIC and drug delivery to it is
    severely limited (ye2026), so a weak base that is trapped in lysosomes and released slowly could
    reach and hold intracellular concentrations far above plasma - which would mean the plasma-derived
    IC50 ordering does not describe what happens in cartilage'
  unit: qualitative, pharmacokinetic argument
  conditions: raised by the user; assessed against this atlas's receptor ledger and the avascularity
    finding. No erdafitinib-specific lysosomal trapping paper was located in three Europe PMC searches
  species: not_applicable
  source_ref: ye2026
  atlas_derived: true
  uncertainty: 'THIS ATLAS PREVIOUSLY DISMISSED THIS AS "a PK property that does not change which term of
    the yield moves," WHICH WAS NOT AN ENGAGEMENT WITH THE ARGUMENT. Taken seriously it is the strongest
    available objection to the IC50-ordering case, because that case assumes tissue concentration tracks
    plasma concentration, and in an avascular tissue that assumption is genuinely weak. Lysosomal trapping
    of weak-base kinase inhibitors is a real and documented class phenomenon. THREE THINGS COUNT AGAINST
    IT AND THE SECOND IS DECISIVE. (a) Lysosomal sequestration is classically studied as a RESISTANCE
    mechanism - it moves drug AWAY from cytosolic and membrane targets - and FGFR kinase domains face the
    cytosol, so drug locked in the lysosomal lumen is not at the target. (b) AND THIS IS THE ONE THAT
    SETTLES IT: accumulation is TISSUE selectivity, not RECEPTOR selectivity. All four FGFRs sit in the
    same chondrocyte and see the same intracellular concentration, so concentrating erdafitinib in
    cartilage raises engagement of FGFR1 and FGFR4 exactly as much as FGFR3 - and this atlas has now
    established that FGFR1 blockade SHORTENS bones (karolak2015) and FGFR4 blockade blocks the autophagy
    bone growth requires (cinque2015). CONCENTRATING A DRUG WITH ONE PRO-GROWTH AND TWO ANTI-GROWTH
    TARGETS INTO CARTILAGE CONCENTRATES THE HARM ALONGSIDE THE BENEFIT. The ordering is preserved under
    any uniform scaling. (c) It remains unverified for erdafitinib specifically (CORR-031 class - recorded
    as unestablished rather than denied). THE ARGUMENT IS THEREFORE REAL, WAS WRONGLY WAVED AWAY, AND ON
    inspection CUTS THE OTHER WAY. It would be a strong argument for a drug whose cartilage targets were
    all pro-growth - which is precisely what a narrowly FGFR3-selective agent is.'
- parameter: AND THE PHOSPHATE-TITRATION ADVANTAGE THIS ATLAS CLAIMED IS SELF-DEFEATING
  value: 'erdafitinib IC50 ordering is FGFR1 1.20 < FGFR3 3.00 < FGFR4 5.70 nM. Receptors engage in
    ascending IC50 order as dose rises, and hyperphosphatemia is the FGFR1 readout, so phosphate rises
    BEFORE FGFR3 and long before FGFR4. A dose held just below the phosphate threshold is a dose below
    the FGFR3 IC50'
  unit: nM
  conditions: ChEMBL curated median IC50 values; reasoning by this atlas
  species: in_vitro_human_cell
  source_ref: propel3_2026
  atlas_derived: true
  uncertainty: 'ROUND 36 PROPOSED PHOSPHATE-GUIDED DOSING AS THE ONE THING ERDAFITINIB UNIQUELY OFFERS.
    IT DOES NOT WORK. Because FGFR1 is the most potently inhibited receptor, its toxicity marker is the
    FIRST thing to appear, not the last - so hyperphosphatemia is not a ceiling you titrate up to, it is
    a floor you must pass through to reach any FGFR3 or FGFR4 effect at all. THE CLINICAL PRACTICE
    CONFIRMS THIS READING: erdafitinib is dosed UP against a serum phosphate target of roughly 5.5-7.0
    mg/dL in oncology precisely because effective FGFR3 engagement lies beyond it. LIMITS OF THE
    ARGUMENT: these are biochemical IC50 values in cell-free or cell-line assays and do not account for
    tissue distribution, and erdafitinib is highly protein-bound so free-drug concentrations differ from
    total - the ORDERING is likely preserved but the absolute margins are not reliable. And PROPEL3
    shows that at 0.25 mg/kg infigratinib produced a real growth effect with no clinical FGFR1 signal,
    which proves the two CAN be separated in practice for at least one molecule with a wider margin.'
- parameter: THE SPINE OBJECTION IS REFUTED FOR THERAPEUTIC DOSING — VOSORITIDE IMPROVES THE SPINE
  value: 'CANOPY ACH-2I, RANDOMISED DOUBLE-BLIND PLACEBO-CONTROLLED, 75 children aged 0 to under 5, spinal
    radiographs at baseline and 1 year. L4 sagittal spinal canal width LSM difference +1.433 mm (95% CI
    0.547-2.320, P = .002); interpedicular distance +0.509 mm (-0.034 to 1.052, P = .066). Thoracolumbar
    kyphosis REDUCED: 33.3 per cent of vosoritide-treated children had a pathological TLK angle of 20
    degrees or more against 59.3 per cent on placebo, P = .037. Separately TYRA-300 increased lumbar
    vertebral length and improved intervertebral disc shape in two mouse models'
  unit: mm and per cent of children with pathological kyphosis
  conditions: canopyspine2026, phase 2 RCT in achondroplasia; tyra300_2025, mouse
  species: human
  source_ref: canopyspine2026
  uncertainty: 'THIS REFUTES THE STRONGEST OBJECTION THIS NODE RAISED, AND IT SHOULD BE SAID PLAINLY. The
    previous row argued that the growth and the spinal deformity might be the same physical event, so that
    no dose could separate them. A randomised placebo-controlled trial measuring the spine directly finds
    the OPPOSITE: vosoritide improved canal dimensions and HALVED the rate of pathological kyphosis, and
    the FGFR3-selective agent improved vertebral length and disc shape. AT THERAPEUTIC DOSES THE GROWTH
    DRUGS IMPROVE THE SPINE RATHER THAN DEFORMING IT. THE RECONCILIATION WITH THE ERDAFITINIB CASE IS
    DOSE, NOT MECHANISM. Erdafitinib at an ONCOLOGY dose produced kyphoscoliosis with cord compression;
    the genetic extremes on BOTH axes - CATSHL, NPR2 activating, NPR3 loss - all carry scoliosis. So
    spinal deformity is a function of HOW HARD the plate is driven, not of which axis drives it, and the
    axis-based safety argument against FGFR inhibition is withdrawn. THE CAVEAT THAT KEEPS THIS HONEST:
    achondroplasia has a pathologically NARROW canal and a high baseline kyphosis rate, so vosoritide is
    correcting a deficit, and this says nothing about what either drug does to a NORMAL spine driven
    above normal. Children aged 0 to under 5, one year.'
- parameter: AND FINAL ADULT HEIGHT DOES NOT EXIST FOR ANY AGENT ON EITHER AXIS — CONFIRMED, NOT ASSUMED
  value: 'a 2026 systematic review and meta-analysis of CNP analogs - 11 studies, N = 542, 4 RCTs (n = 326)
    at low risk of bias - states that long-term studies are needed to define the effect on ADULT HEIGHT,
    and that children in vosoritide studies WILL BE FOLLOWED UNTIL THEY ACHIEVE FINAL ADULT HEIGHT. Its
    pooled effect: AGV +1.36 cm/year (95% CI 1.05-1.68, P < .00001) and standing height +1.24 cm (0.47-2.01,
    P = .002). Against this, infigratinib PROPEL3 gives +1.74 cm/year (1.31-2.17)'
  unit: cm/year
  conditions: cnpmeta2026, meta-analysis of randomised and real-world CNP analog studies in achondroplasia;
    propel3_2026 for the comparator
  species: human
  source_ref: cnpmeta2026
  uncertainty: 'THE ABSENCE IS NOW CONFIRMED FROM A SYSTEMATIC REVIEW RATHER THAN INFERRED FROM THIS
    ATLAS FAILING TO FIND IT, which is a materially stronger statement. NO AGENT ON EITHER AXIS HAS A
    FINAL ADULT HEIGHT IN ANYONE, and the follow-up is explicitly still running. Every comparison in this
    node and every therapeutic claim in this atlas therefore rests on VELOCITY, which this project has
    repeatedly shown does not predict final height - the KIGS growth hormone dose-response is the standing
    counterexample. AND THE VELOCITY COMPARISON DOES NOT FAVOUR THE CNP AXIS: pooled CNP analogs give
    +1.36 cm/year against infigratinib''s +1.74. Those are separate trials in the same disease and not a
    head-to-head, the confidence intervals overlap, and a meta-analytic pooled estimate is not comparable
    to a single trial - but the atlas should stop implying the CNP arm is the larger effect, because on
    the only numbers available it is the smaller one.'
- parameter: WHAT WOULD ACTUALLY DECIDE IT — THREE MEASUREMENTS, NONE OF WHICH EXIST
  value: '(1) FINAL ADULT HEIGHT on any FGFR inhibitor, in anyone. (2) The SIGN of local FGFR1 and FGFR4
    inhibition on bone LENGTH, from chondrocyte-restricted deletions - jacob2006 is lineage-wide and
    reports no length; no Fgfr4 skeletal phenotype exists in any species. (3) Whether the growth plate
    WIDENING that accompanies the growth is the mechanism or the toxicity - erdaseries2025 observes the
    widening, williams2001 shows a thicker plate is a mechanically weaker one, and erdachild2024 reports
    the cord compression'
  unit: qualitative - the three missing measurements
  conditions: the state of the literature as searched on 2026-08-07
  species: human
  source_ref: erdaseries2025
  uncertainty: 'ITEM 3 IS THE ONE THAT COULD END THE PROGRAMME RATHER THAN REFINE IT. The proposed h_term
    benefit of FGFR1 inhibition is DELAYED HYPERTROPHIC MATURATION. A plate whose hypertrophic cells
    mature more slowly is a THICKER plate. erdaseries2025 observed exactly that widening under
    erdafitinib. williams2001 measured that ultimate tensile stress falls linearly with plate thickness.
    So on the current evidence THE MECHANISM AND THE TOXICITY MAY BE THE SAME PHYSICAL EVENT, in which
    case no dose separates them and no delivery vehicle helps, because the harm is at the target site.
    That is a structurally different objection from a side effect and it has never been tested. It is
    also the strongest available argument for the CNP arm, whose slipped epiphyses occur at a far lower
    rate.'
- parameter: THE SLIPPED-EPIPHYSIS RATE FINALLY HAS A DENOMINATOR ON BOTH AXES
  value: 'FGFR-TKI ARM (farouk2023, MSKCC retrospective, patients under 18 with recurrent or refractory
    FGFR-altered gliomas, n = 7): SLIPPED CAPITAL FEMORAL EPIPHYSIS IN THREE OF SEVEN, reported together
    with increased linear growth velocity, and called by the authors a MAJOR ON-TARGET adverse event.
    CNP ARM (dauber2026, phase 2 basket trial, N = 30 ENROLLED): SCFE IN THREE OF THIRTY, at treatment
    days 493, 1078 and 1633. Crude per-patient incidence 43 per cent against 10 per cent, a ratio of
    about 4.3. TIME TO ONSET SEPARATES THEM FURTHER IN THE SAME DIRECTION: median 137 days, range 84-274,
    across the five FAERS erdafitinib cases (nadeaunguyen2026), against 493 to 1633 days under
    vosoritide.'
  unit: SCFE cases per treated patient, and days on treatment to onset
  conditions: two non-randomised human cohorts in different diseases, pooled by nobody but this atlas;
    the FGFR time-to-onset figure comes from a THIRD series (FAERS) rather than from farouk2023's seven
    patients, so the incidence and the latency are spliced from different populations
  species: human
  source_ref: farouk2023
  uncertainty: 'UNTIL THIS ROUND EVERY FGFR-TKI SKELETAL RECORD IN THIS ATLAS WAS A NUMERATOR WITHOUT A
    DENOMINATOR - brizini2024 one case, erdachild2024 one case, nadeaunguyen2026 five spontaneous reports
    with no population behind them. You cannot compare a case series to a trial, and the node had been
    doing exactly that while asserting the CNP arm slips at "a far lower rate". It does, in absolute
    terms, and now there is a number for it. THE CAVEATS ARE SEVERE AND SOME ARE FATAL TO PRECISION.
    n = 7 against N = 30. The glioma cohort is heavily pretreated and many such children receive
    corticosteroids and cranial or craniospinal irradiation, both independent SCFE risk factors, and
    neither series adjusts for obesity, which is the dominant risk factor in the general paediatric
    population. The vosoritide cohort is not clean either: FOUR OF THE FIVE subjects who discontinued had
    AGGRECAN DEFICIENCY, a skeletal dysplasia with its own joint and physeal liability, and two of the
    three who slipped had ALREADY had guided-growth surgery for severe genu valgum before slipping.
    A spontaneous-reporting series (FAERS) and a single centre that went looking are subject to opposite
    detection biases. THIS IS AN ORDER-OF-MAGNITUDE COMPARISON AND SHOULD NEVER BE QUOTED AS A RATE.'
- parameter: NORMALISED PER CENTIMETRE OF EXTRA GROWTH, THE TWO AXES COST ROUGHLY THE SAME SLIP RISK — WHICH IS THE ARGUMENT THAT THE RISK TRACKS THE GROWTH AND NOT THE DRUG
  value: 'ATLAS COMPUTATION, NOT A REPORTED RESULT. Vosoritide increment (dauber2026): 4.53 to 8.09
    cm/year, +3.56 cm/year. The three subjects slipped at days 493, 1078 and 1633, so the EXTRA growth
    accumulated before slipping was about 4.8, 10.5 and 15.9 cm. Erdafitinib increment (erdachild2024):
    19.06 cm/year annualised, with NO REPORTED BASELINE VELOCITY, so the increment is BOUNDED rather
    than measured - even at an implausibly high pre-treatment 5 cm/year the increment is 14 cm/year, and
    at the low velocities erdaseries2025 describes for these severely growth-impaired children it
    approaches 17; take 14-17 cm/year. At the FAERS median onset of 137 days (0.375 year) that is about
    5.3 to 6.4 cm of EXTRA growth accumulated before slipping. SO THE SLIPS ON BOTH AXES OCCUR AFTER A
    BROADLY SIMILAR AMOUNT OF ACCUMULATED EXTRA GROWTH, of order 5 to 16 cm, and the FOUR-FOLD difference
    in per-patient incidence is largely explained by the FOUR- TO FIVE-FOLD difference in the rate at
    which that growth is delivered.'
  unit: centimetres of drug-attributable growth accumulated before slip
  conditions: computed by this atlas from dauber2026 (velocity increment and per-subject slip days),
    erdachild2024 (annualised velocity, baseline bounded not measured) and nadeaunguyen2026 (median time
    to onset); the erdafitinib latency and the erdafitinib velocity come from DIFFERENT patients
  species: human
  source_ref: dauber2026
  uncertainty: 'THIS IS THE MOST DECISION-RELEVANT NUMBER IN THE NODE AND IT IS ALSO THE MOST FRAGILE, SO
    IT IS WRITTEN OUT IN FULL RATHER THAN ASSERTED. It rests on one bounded quantity (the erdafitinib
    baseline velocity, which nobody measured) and one splice (velocity from erdachild2024, latency from
    nadeaunguyen2026 - different children). It assumes drug-attributable growth accumulates linearly and
    that time on drug is a proxy for it, which fails if the effect wanes. n is 3 and 3. IT CANNOT BEAR A
    RATIO; it can bear a DIRECTION, which is that the per-centimetre costs are of the same order rather
    than orders apart. IF IT SURVIVES BETTER DATA IT REFRAMES THE WHOLE COMPARISON. "Erdafitinib or
    vosoritide" would then be partly the wrong question, because the variable that predicts the harm is
    HOW HARD THE PLATE IS DRIVEN, not which receptor is used to drive it - the same conclusion round 43
    reached independently for spinal deformity from canopyspine2026, arrived at here from a different
    endpoint and a different dataset. THE COROLLARY IS PRACTICAL: the choice between the axes should then
    be made on everything OTHER than the slip - off-target burden, dose headroom, route, cost, and
    reversibility - and on those grounds the two drugs differ enormously. THE OBVIOUS TEST IS CHEAP.
    erdaseries2025 already observed DISTINCT WIDENING OF THE GROWTH PLATE under erdafitinib and
    williams2001 measured that ultimate tensile stress falls linearly with plate thickness, so PHYSEAL
    THICKNESS ON IMAGING is the candidate common mediator and the candidate titration endpoint. It is
    measurable in children already being treated on both axes, retrospectively, from scans that in many
    cases already exist. See g_l12_physeal_thickness_as_titration_endpoint.'
- parameter: WHAT THE FDA ANIMAL RECORD ACTUALLY SAYS — CORRECTING ROUND 44
  value: 'THE REVIEWER STATES TWICE THAT "no stand-alone toxicology studies were conducted in juvenile
    animals" (fda_balversa_review_2019, sections on Pediatrics and Assessment of Effects on Growth, and
    on Pediatrics). The label heading "Juvenile Animal Toxicity Data" is populated ENTIRELY from the
    ordinary 4- and 13-week repeat-dose studies. THE CARTILAGE LESION SITES ARE AIRWAY, NOT PHYSIS: the
    reviewer''s own rat site list is "chondroid dysplasia (larynx, trachea)", the lesion table adds tail
    intervertebral disc, and the only femoral entry is DECREASED BONE MARROW CELLULARITY. The label
    phrase "multiple bones (vertebrae, sternebrae, ribs)" belongs to the EMBRYO-FETAL study - ossification
    delay in fetuses - not to the postnatal repeat-dose studies. NO GROWTH-PLATE LESION IS REPORTED
    ANYWHERE IN THE RECOVERABLE TEXT. THE DOSE-LIMITING TOXICITY IS THE PHOSPHATE AXIS: deaths at the top
    rat dose were attributed to MINERALIZATION OF HEART, AORTA AND LUNGS, with hyperphosphatemia and
    disturbance of FGF23, 1,25-dihydroxyvitamin D3, PTH and calcium plus raised ALP, CTx, NTx and urinary
    deoxypyridinoline in BOTH species. EXPOSURE: rat top-dose AUC 1910 and dog 1300 ng.h/mL against a
    HUMAN CLINICAL AUC OF 29268; rat deaths occurred at 0.003 times human clinical AUC.'
  unit: ng.h/mL for AUC; lesion sites otherwise
  conditions: NDA 212018 Multi-disciplinary Review (2019) and the 2025 BALVERSA label; two pages of the
    rat histopathology table have no text layer and could contain sites this atlas cannot read, so
    "no growth-plate lesion reported" is a statement about the RECOVERABLE text
  species: multiple
  source_ref: fda_balversa_review_2019
  uncertainty: 'ROUND 44 SAID THE JUVENILE EXPERIMENT "WAS SUBSTANTIALLY ALREADY RUN". IT WAS NOT, AND
    THE ERROR CHANGES THE ANSWER (CORR-047). What exists is adult-pattern general toxicology in growing
    animals, read through a label heading that compresses it. The distinction is not pedantic: this atlas
    let "bone toxicity at an exposure less than the human exposure" stand in for GROWTH-PLATE DAMAGE, and
    the reviewer localises the cartilage lesion to LARYNX AND TRACHEA - hyaline airway cartilage, which is
    not the tissue in question and is not under load. THE NET EFFECT IS TO WEAKEN THE ANIMAL HALF OF THE
    CASE AGAINST ERDAFITINIB AND TO LEAVE THE HUMAN HALF UNTOUCHED, and the human half was always the
    stronger half: three of seven children slipped (farouk2023), five of five FAERS cases were
    permanently discontinued and three needed surgery (nadeaunguyen2026). THE ONE PLACE THIS CUTS AGAINST
    ERDAFITINIB IS THE DOSE-LIMITING TOXICITY: ectopic mineralization driven by the FGF23-phosphate axis
    is an FGFR1 effect, which is precisely the burden a narrowly FGFR3-selective agent does not carry.
    It does NOT reopen the phosphate-titration proposal - CORR-043 stands, the IC50 ordering is
    arithmetic and puts FGFR1 first.'
localization:
- growth plate, all zones; and kidney for the FGF23 phosphate axis
human_evidence: direct
human_evidence_note: Both sides have direct human evidence and it is of very different quality - a
  randomised placebo-controlled phase 3 for infigratinib against a single case report and a five-case
  pharmacovigilance series for erdafitinib. No agent in this class has a final adult height in anyone.
species_basis:
- human
- mouse
- in_vitro_human_cell
translation_risk: high
translation_risk_reason: The mechanistic case rests on two receptors whose direction of effect on bone
  length has never been measured, one supporting result that is abstract-only with the wrong genetic
  specificity, and a species divergence in beta-klotho that may invalidate a supporting mechanism.
confidence: C
confidence_note: 'C. The quantities are real and sourced - IC50 values from a curated database,
  expression from a re-analysis of human tissue, trial results from a phase 3, case counts from an FDA
  pharmacovigilance review. What is graded C rather than higher is the CONCLUSION, which is a judgement
  about where the weight of evidence sits and not a measurement. It is not B because the central
  comparison is between evidence types that cannot be pooled - n=1 against n=113 - and because two of the
  three mechanistic legs have no measured sign. It is not D because every input is a primary quantitative
  result and the reasoning from IC50 ordering to phosphate-as-entry-ticket is arithmetic rather than
  argument.'
