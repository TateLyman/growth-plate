id: round457_the_inverse_drug_search_returns_charge_without_discharge_and_a_one_sided_record
name: 'R457 - the inverse drug search: NO approved or investigational agent outside the FGFR3, CNP and GH axes lengthens
  bone in a normal growing animal, the sGC-stimulator class thickens the hypertrophic zone in normal rats WITH BONE
  LENGTH MEASURED AND NULL, and a full-text query of the US label corpus returns ZERO labels reporting an increased
  bone length'
