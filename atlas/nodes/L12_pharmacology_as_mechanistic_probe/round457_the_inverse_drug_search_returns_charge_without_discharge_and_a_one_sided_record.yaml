human_evidence_note: 'The human contributions are negative or restorative: two randomised azithromycin trials null
  on linear growth, an ADHD RCT in which no intervention raised height velocity, and cyproheptadine raising height
  velocity only in profound GH insensitivity and not in a double-blind RCT in near-normal children.'
translation_risk: moderate
translation_risk_reason: The regulatory findings are animal toxicology read from primary reviews. The structural
  conclusion about the record is not species-limited.
summary: 'R437 argued that this file''s search has been shaped by the filter ''query X AND bone length'', which
  can only find agents whose developers already wanted what we want. R457 ran the inverse: start from what HAPPENED
  to animals and people, not from a hypothesis. Four results.


  ONE - THE STRUCTURAL NEGATIVE IS NOW COMPLETE, AND IT FINISHES CORR-350. A full-text query of the openFDA label
  corpus for increased femur length, increased bone length, increased long bone length, longer femur and increased
  tibia length RETURNS ZERO LABELS for every phrasing. Of 294 labels that mention femur length in section 13, ALL
  are the same proton-pump-inhibitor sentence reporting a DECREASE that tracks a 14 per cent body-weight fall. The
  only labels carrying growth-acceleration language at all are somatropin, tesamorelin and erdafitinib. CORR-350
  established that juvenile toxicity reviews contain serial limb lengths invisible to PubMed; R449 added that the
  distribution is one-sided; this closes it - A JUVENILE TOXICITY PACKAGE IS AN ADVERSE-FINDINGS DOCUMENT AND BEING
  TALLER IS NOT AN ADVERSE FINDING. Do not spend another round expecting a positive from Drugs@FDA or the EPARs.


  TWO - AND THE ONE CLASS THAT VISIBLY CHANGES THE PLATE IN NORMAL ANIMALS IS CHARGE WITHOUT DISCHARGE, WITH THE
  CALIPER ALREADY USED. Soluble guanylate cyclase stimulators - riociguat and vericiguat, both approved, plus two
  unapproved compounds, across two independent laboratories - produce distinct THICKENING OF THE HYPERTROPHIC ZONE
  of the femoral and tibial physis in normal growing rats, with hyperostosis and metaphyseal remodelling, fully
  reversible. AND THE RIOCIGUAT REGULATORY REVIEW STATES THERE WERE NO CLEAR EFFECTS ON BONE LENGTH. An academic
  neonatal-rat study run specifically to address the regulatory bone concern also measured long bone growth and
  was null. That is failure mode number one with the length endpoint present - and it is the eighth or ninth instance
  in this file.

  ⚠ It also sits in tension with R298, which killed the sGC shelf on the ground that GUCY1A1/GUCY1B1 are absent
  from the human growth plate while the cGMP EFFECTOR kinases PRKG1 and PRKG2 are present. These compounds demonstrably
  reach and change a rodent plate. Recorded as unresolved: either the rat plate carries sGC the human plate does
  not, or the effect is indirect - and either way the LENGTH endpoint is null, so it changes no decision.


  THREE - AND ONE APPROVED DRUG PRODUCED AN ACCELERATED-OSSIFICATION FINDING IN A 39-WEEK JUVENILE DOG STUDY WITH
  NO BONE MEASURED. Selexipag, an oral prostacyclin IP receptor agonist and therefore a cAMP-raiser: by 39 weeks,
  two of three low-dose and ALL intermediate- and high-dose males had increased ossification of the femoral shaft,
  with delayed sexual maturation in both sexes and physes still open. The review''s statement of no treatment-related
  effects on growth refers to BODY SIZE. CORR-340 in its purest form - the animals were dosed for nine months and
  the missing measurement is a pair of calipers. ⚠ High-dose female body weight fell 20 per cent, so any re-measurement
  must be read against weight per campion2022.


  FOUR - THE OESTROGEN MECHANISM HAS A MAGNITUDE IN NORMAL ANIMALS AT POPULATION SCALE, AND IT SUPPORTS THE AROMATASE
  ARM FROM VETERINARY DATA. 306 large-breed bitches, prospective: those neutered before puberty gained about 2.0
  cm MORE height between 6 and 17 months than those neutered after, P less than 0.001. Independently, 783 feline
  pelvic radiographs show significantly delayed physeal closure in neutered versus entire male cats at the greater
  trochanter, distal femur and tibial tuberosity. And the cost arrives from the same literature: delayed physeal
  closure plus high body weight plus neutering gives a large excess of slipped capital femoral epiphysis in Maine
  Coon cats - the same failure mode reported for erdafitinib, growth hormone and vosoritide in children, reached
  independently by veterinary orthopaedics. ALL SECONDHAND AND value_unverified.

  ⛔ AND THE TEXTBOOK CLAIM IN THE OTHER DIRECTION FAILS: in an 80-steer serial-harvest trial the standard trenbolone-plus-oestradiol
  implant did NOT increase hip height or any frame measure, and body length tended to be greater in the NON-implanted
  controls.


  FIVE - WHAT DID NOT SURVIVE, RECORDED SO IT IS NOT RE-PROPOSED. Cyproheptadine raised height velocity strikingly
  in growth-hormone insensitivity WITHOUT a BMI change, but a double-blind RCT in mildly undernourished near-normal
  children found NO height-velocity difference while BMI rose - so it is a deficiency agent. Two randomised azithromycin
  trials measured linear growth and both were null. An RCT of stimulant drug holidays versus caloric supplementation
  raised weight velocity and NONE raised height velocity. And PDE4 inhibition, JAK inhibition, MC4R agonism and
  GnRH agonism have NO bone-length, growth-plate or physeal endpoint anywhere in their regulatory packages - which
  is unmeasured, not negative.'
