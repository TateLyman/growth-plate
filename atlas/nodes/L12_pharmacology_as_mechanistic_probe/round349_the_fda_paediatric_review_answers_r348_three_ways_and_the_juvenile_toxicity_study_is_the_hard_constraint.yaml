contradicts:
- 'PARTLY ANSWERS AND PARTLY UNDERCUTS R348. It converts R348''s human gap from an unrun experiment into a
  data request - the serial heights exist in the sponsor database - while adding a regulator''s statement that
  no growth impact was observed, which runs against the hypothesis, and a juvenile toxicity ceiling that
  bounds the dose in any growing organism.'
- 'THIRD INSTANCE OF CORR-340 IN TWO ROUNDS, and the first in a human trial: brent2018 and the rat comparison
  both processed tibia, femur and vertebra without a caliper; here height was measured in ~390 children and
  never analysed.'
