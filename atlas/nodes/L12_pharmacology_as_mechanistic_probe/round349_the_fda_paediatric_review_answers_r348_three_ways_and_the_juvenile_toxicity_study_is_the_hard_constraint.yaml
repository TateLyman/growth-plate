id: round349_the_fda_paediatric_review_answers_r348_three_ways_and_the_juvenile_toxicity_study_is_the_hard_constraint
name: 'Round 349 - the FDA paediatric Pradaxa review answers R348 in three ways: the human height measurement
  EXISTS in ~390 anticoagulated children and was never analysed, the regulator''s stated reason for not
  analysing it is a mechanistic claim this atlas now contradicts, and the juvenile toxicity studies set a hard
  ceiling - bleeding-related mortality at the lowest dose tested, NOAEL undeterminable, margin of safety below 1'
aliases:
- Pradaxa paediatric FDA review
- trial 1160.106
- trial 1160.108
- dabigatran juvenile toxicity NOAEL
- the height data exist and were never analysed
type: intervention
layer: L12
stub: false
summary: 'R348 ended with a named human gap: dabigatran and rivaroxaban have been paediatrically approved
  since 2021 and no cohort of anticoagulated children has ever been reported with height velocity as an
  outcome. The operator supplied the FDA clinical review for the paediatric approval. It answers the question
  three times over, and the answers do not all run the same way.

  ONE - THE MEASUREMENT EXISTS, IN ROUGHLY 390 TREATED CHILDREN, AND IT WAS NEVER ANALYSED. Trial 1160.106:
  multi-centre, open-label, randomised, active-controlled, 328 enrolled and 267 randomised, 266 treated (176
  Pradaxa, 90 standard of care), from BIRTH to under 18 years, median Pradaxa exposure 81 days; HEIGHT
  ASSESSMENT was part of the visit schedule at screening, visit 8 and early end of treatment. Trial 1160.108:
  single-arm extension for long-term use up to 12 months, 231 enrolled and 214 treated; HEIGHT ASSESSMENT at
  screening, VISIT 8 (6 MONTHS), VISIT 11 (12 MONTHS) and early end of treatment. So serial heights over six
  and twelve months on a direct thrombin inhibitor exist in a sponsor database. Section 8.8.3 of the review
  is titled Pediatrics and Assessment of Effects on Growth and states that the effect on growth was NOT
  SPECIFICALLY EVALUATED in the submitted trials. THE DATA WERE COLLECTED AND THE ANALYSIS WAS NOT DONE.
  That is CORR-340 in a human trial, and the THIRD instance in two rounds after brent2018 and the
  dabigatran-versus-warfarin rat study, both of which processed tibia, femur and vertebra without a caliper.

  TWO - THE REGULATOR''S STATED REASON FOR NOT LOOKING IS A MECHANISTIC CLAIM, AND THIS ATLAS NOW HAS THE
  MECHANISM. Section 8.8.3 gives as its justification that there is no known biological mechanism supporting
  any concern about an impact of Pradaxa on growth in children. R348 supplies one: ECRG4 is 694.6 CPM at
  16.35x cartilage enrichment in the postnatal human growth plate, thrombin cleavage is required for ECRG4
  biological activity while furin cleavage is not (lee2015ecrg4), and the Ecrg4-null mouse has body length
  +0.950 at P=4.45e-07 with normal weight and increased bone density. THIS IS NOT A SAFETY SIGNAL - the
  predicted direction is the opposite, more growth rather than less. What it means is narrower and still
  worth recording: the stated basis for declining to analyse the height data is a negative claim about
  mechanism, and that claim is now falsifiable against a dataset that already exists.

  THREE - AND THE SAME SECTION CONTAINS A NEGATIVE FOR THE HYPOTHESIS, WHICH IS RECORDED PLAINLY BECAUSE IT
  IS INCONVENIENT. The reviewer also states that there was no observed impact of Pradaxa on growth in the
  submitted trials, and concludes that routine post-market surveillance will suffice. If a direct thrombin
  inhibitor were meaningfully changing growth, twelve months of serial heights across two trials might have
  produced a signal that someone noticed. That is weak - it is an unstructured safety impression with no
  numbers, no height-velocity or height-SDS analysis, a maximum of twelve months, an uncontrolled extension
  arm, and a population of acutely ill children with venous thromboembolism - but it is evidence and it runs
  against R348.

  FOUR - THE HARD CONSTRAINT, AND IT IS THE REAL CEILING ON THIS AXIS. Two nonclinical JUVENILE TOXICITY
  studies were submitted. In BOTH the preliminary and the definitive study, BLEEDING-RELATED MORTALITY was
  observed, described as an extension of dabigatran''s pharmacodynamic effect rather than organ toxicity. In
  the definitive study the bleeding-related mortality occurred AT THE LOWEST DOSE TESTED, 15 mg/kg/day, so A
  NOAEL COULD NOT BE DETERMINED. Applying a conservative tenfold uncertainty factor to that LOAEL produced a
  MARGIN OF SAFETY BELOW 1 for both applications, which is why the reviewers had to qualify an impurity by an
  alternative route using human adverse-event data instead. R348 predicted that bleeding, not bone, would be
  the binding constraint. This is that prediction with a number attached: IN A GROWING ANIMAL THERE IS NO
  DEMONSTRATED DOSE OF DABIGATRAN FREE OF BLEEDING MORTALITY.

  FIVE - WHAT TO GET NEXT, AND IT IS A SPECIFIC DOCUMENT. The juvenile toxicity studies are exactly the
  animals R348 asked for - dabigatran given to a growing organism - and juvenile toxicity protocols routinely
  record body weight and frequently include skeletal or bone development assessments. Those data are NOT in
  this clinical review; they are in the Pharmacology/Toxicology review for the same applications, conducted
  by Victor Long with team leader Xuan Chi and archived 26 January 2021. If a growing-animal length or
  skeletal endpoint under a direct thrombin inhibitor exists anywhere, it is in that document.

  SIX - ONE FREE WITHIN-CLASS CONTRAST FROM THE SAME REVIEW. Its comparison table of paediatric
  anticoagulants lists OSTEOPOROSIS RISK WITH LONG-TERM THERAPY against unfractionated heparin and low
  molecular weight heparin, and warfarin''s own entry carries the compounding and monitoring burden. Nothing
  equivalent is listed against dabigatran. That is a regulatory-document restatement of R348''s point that
  the skeletal liability of anticoagulation belongs to particular agents and does not generalise to direct
  thrombin inhibition.'
quantitative:
- parameter: 'THE HUMAN HEIGHT MEASUREMENT EXISTS IN TWO PAEDIATRIC TRIALS AND WAS NEVER ANALYSED'
  value: 'Trial 1160.106 (NCT02197416 sibling; multi-centre, open-label, randomised 2:1, active-controlled):
    328 enrolled, 267 randomised, 266 treated - 176 Pradaxa and 90 standard of care - patients from BIRTH
    (gestational age >=37 weeks) to <18 years with image-proven VTE, enrolled in three age strata (12 to <18,
    2 to <12, birth to <2), 62 sites in 26 countries; median Pradaxa exposure 81 days (IQR 36-87, range
    1-106). Visits approximately every 3 weeks; FULL PHYSICAL EXAMINATIONS AND HEIGHT ASSESSMENT at screening
    (visit 1), visit 8 and early end of treatment. Trial 1160.108 (phase 2b/3, open-label, SINGLE-ARM
    extension, up to a maximum of 12 months): 231 enrolled (13 screen failures, 4 withdrawn before treatment)
    = 214 treated; visits every 3-8 weeks; FULL PHYSICAL EXAMINATIONS AND HEIGHT ASSESSMENT at screening
    (visit 1), VISIT 8 (6 MONTHS), VISIT 11 (12 MONTHS) and early end of treatment. Section 8.8.3, Pediatrics
    and Assessment of Effects on Growth, states that the effect of Pradaxa on growth was NOT SPECIFICALLY
    EVALUATED in the submitted trials, that there is no known biological mechanism supporting concern, and
    that no impact on growth was observed'
  unit: patient counts; days; visit schedule
  conditions: fda_pradaxa_paediatric_2021, full 21-page clinical review read 2026-08-13 (operator-supplied).
  species: human
  source_ref: fda_pradaxa_paediatric_2021
  uncertainty: 'THE REVIEW GIVES NO HEIGHT NUMBERS AT ALL - no baseline heights, no height SDS, no velocity,
    no comparison between arms. It records that height was assessed and that growth was not specifically
    evaluated. So this establishes that the DATA EXIST in the sponsor database, not what they show. The
    reviewer''s statement that no impact on growth was observed is an unstructured safety impression from an
    analysis that by his own account was not performed, over at most twelve months, in acutely ill children,
    with the long-term arm uncontrolled. It is weak evidence of absence and it runs against the R348
    hypothesis; it is not a refutation, and it is also not support.'
- parameter: 'THE JUVENILE TOXICITY CEILING - BLEEDING MORTALITY AT THE LOWEST DOSE AND A MARGIN OF SAFETY BELOW 1'
  value: 'Two nonclinical juvenile toxicity studies were submitted under NDA 022512 (dabigatran etexilate
    mesylate capsules). In BOTH the preliminary and the definitive juvenile toxicity study, BLEEDING-RELATED
    MORTALITY was observed, characterised as an extension of the pharmacodynamic effect of dabigatran rather
    than as organ toxicity. In the definitive study the bleeding-related mortality occurred AT THE LOWEST DOSE
    TESTED, 15 mg/kg/day, and therefore A NOAEL COULD NOT BE DETERMINED. Applying a conservative tenfold
    uncertainty factor to that LOAEL and performing a margin-of-safety calculation produced a NUMBER BELOW 1
    for both NDA 022512 and NDA 214358, which is why the reviewers qualified the impurity by an alternative
    route - a contingency table on human phase 3 adverse events testing whether younger patients were more
    bleeding-sensitive than adolescents, which found no statistically significant difference by Fisher exact
    test'
  unit: mg/kg/day; margin of safety
  conditions: fda_pradaxa_paediatric_2021 section 4.3, Nonclinical Pharmacology/Toxicology executive summary,
    read 2026-08-13. The primary nonclinical review (Victor Long; TL Xuan Chi) was archived 2021-01-26 and is
    a SEPARATE document not supplied here.
  species: not_applicable
  source_ref: fda_pradaxa_paediatric_2021
  uncertainty: 'THE SPECIES AND STUDY DESIGN ARE NOT STATED IN THE CLINICAL REVIEW - only that they were
    juvenile toxicity studies, almost certainly rat, and the executive summary gives neither the dose range
    above 15 mg/kg/day nor any body-weight, growth or skeletal findings. Those would be in the pharm/tox
    review. WHAT THIS DOES ESTABLISH IS THE SHAPE OF THE CONSTRAINT AND IT IS SEVERE: in a growing animal
    there is no demonstrated dabigatran dose free of bleeding mortality, and the regulator could not construct
    a safety margin from the juvenile data at all. It bounds R348''s proposed experiment - dosing a growing
    mouse and calipering the femur is not a benign protocol - and it identifies bleeding, not bone, as the
    binding constraint, which is what R348 predicted without a number.'
localization:
- 'not a localisation result - this is a regulatory and trial-design finding about where the human height data
  sit and what the juvenile animal exposure limit is'
human_evidence: direct
human_evidence_note: 'Approximately 390 children from birth to under 18 years were treated with a direct
  thrombin inhibitor across two trials, with height assessed at fixed visits including 6 and 12 months in the
  long-term arm. The regulator states growth was not specifically evaluated and that no impact was observed.
  No height numbers of any kind appear in the review.'
species_basis:
- human
translation_risk: high
translation_risk_reason: 'The only human growth statement is an unanalysed safety impression with no numbers,
  and the only growing-animal exposure data show bleeding mortality at the lowest dose tested with no
  determinable NOAEL.'
confidence: B
claim_grades:
- claim: Serial height data on children taking a direct thrombin inhibitor exist and were never analysed as an endpoint.
  grade: A
  basis: 'The review states the visit schedule explicitly - height assessment at screening, visit 8 (6 months)
    and visit 11 (12 months) in trial 1160.108, and at screening, visit 8 and eEOT in trial 1160.106 - across
    266 and 214 treated patients respectively, and section 8.8.3 states in terms that the effect on growth was
    not specifically evaluated. Both halves are direct quotations of a regulatory document read in full.'
- claim: The trials show that dabigatran does not affect growth in children.
  grade: E
  basis: 'NOT ESTABLISHED. The reviewer asserts no observed impact on growth, but by his own account the
    assessment was not performed; no numbers, no height SDS and no velocity analysis appear anywhere; the
    maximum exposure is twelve months; the long-term arm is single-arm; and the population is acutely ill
    children with VTE, many of whom have serious underlying disease. It is an impression, and it is recorded
    here as running against R348 rather than as a null result.'
- claim: There is no demonstrated dabigatran dose in a growing animal that is free of bleeding mortality.
  grade: A
  basis: 'Stated directly in the nonclinical executive summary: bleeding-related mortality in both the
    preliminary and the definitive juvenile toxicity study, occurring at the lowest dose of 15 mg/kg/day in
    the definitive study, so no NOAEL could be determined, with a tenfold uncertainty factor giving a margin
    of safety below 1 for both applications.'
- claim: The FDA's stated reason for not evaluating growth is a mechanistic claim this atlas contradicts.
  grade: B
  basis: 'The review gives as justification that there is no known biological mechanism supporting concern
    about an impact on growth. R348 supplies a mechanism - thrombin-dependent release of the active ECRG4
    fragment, ECRG4 at 694.6 CPM and 16.35x enrichment in the human growth plate, and Ecrg4-null body length
    +0.950 at P=4.45e-07. Graded B not A because the cartilage cleavage step is unmeasured, and because the
    predicted direction is increased rather than decreased growth, so it is not a safety concern in the sense
    the reviewer meant.'
