claim_grades:
- claim: The sulfate arm is systemic-renal and not local to cartilage, as round 295 concluded.
  grade: X
  species: human
  source_ref: gse288028
  basis: NO - round 295 tested SLC13A1 and SLC26A1, which are the KIDNEY transporters that set plasma sulfate, and
    concluded that the pathway they do not serve is absent from cartilage. The transporter that takes sulfate INTO
    cartilage is SLC26A2, the diastrophic dysplasia gene, and it is detected in 12 of 14 postnatal human growth-plate
    samples at 118.1 CPM in up to 82.2% of cells. Behind it the whole machinery is present and abundant - PAPSS2
    at 529.6 CPM in up to 94.2% of cells, CHST11 350.8, CHST3 111.6, ACAN 1,826 - while SLC13A1 and SLC26A1 are
    0/14, exactly as round 295 found. The receiver test passes.
- claim: A sulfate donor is an obtainable compound that passes every filter this atlas applies.
  grade: C
  species: human
  source_ref: scherer2025
  basis: 'It passes the filters. STEP 0: matrix sulfation is moved by nothing in the stack - not CNP/cGMP, not FGFR3/ERK/CREB,
    not GH/IGF-1, not oestrogen. RECEIVER: the whole pathway is present and abundant in human growth plate. TERM:
    sulfation sets fixed charge density, which sets osmotic swelling, and hypertrophic volume is roughly 80% of
    longitudinal growth - the term round 296 said had no upward-pointing agent. COMPARTMENT: fixed charge density
    also holds water in the intervertebral disc, and tise2025''s probands present with scoliosis as well as short
    stature. HUMAN GENETICS: graded effects on plasma sulfate and height in heterozygotes, plus short stature in
    biallelic loss and in PAPSS2, CHST3 and SLC26A2 disease. AGENT: N-acetylcysteine, oral, generic, with decades
    of paediatric use. GRADE C and not higher because no sulfate donor has a bone-length endpoint in any species
    and the human pharmacodynamic demonstration is restoration in a deficient patient by the intravenous route.'
- claim: Raising sulfate above normal will add height in this subject.
  grade: D
  species: human
  source_ref: vandekamp2023
  basis: NOT ESTABLISHED, and this is the honest ceiling. The N-acetylcysteine demonstration was intravenous, in
    a patient with complete renal sulfate wasting - restoration in a deficit, CORR-203. Whether oral NAC raises
    plasma sulfate in a replete adolescent is unmeasured, and chondrocytes have a second sulfate source in cysteine
    catabolism, so supply may already be saturated. What argues against pure restoration is scherer2025's GRADED
    effect in heterozygotes, which places the dose-response inside the ordinary range rather than only at the pathological
    floor. No sulfate donor has ever been given to a normal growing animal with a caliper on the bone - that experiment
    is the cheapest unrun test in this file and it would settle the question.
