id: round320_the_sulfate_arm_was_killed_on_the_wrong_transporters_and_the_compound_is_n_acetylcysteine
name: ROUND 320 - A COMPOUND. The sulfate arm was dismissed in round 295 because SLC13A1 and SLC26A1 are absent
  from the human growth plate - but those are the RENAL transporters. The CARTILAGE one is SLC26A2, and it is present
  at 118 CPM in up to 82% of cells with the entire sulfation machinery behind it. The receiver test passes, Step
  0 passes, the human dose-response is graded across the population, and the agent - N-acetylcysteine - has a demonstrated
  human effect on the exact biomarker
aliases:
- round 320
- the compound
