- sulfate donor
- SLC26A2 is the cartilage transporter
- R295 tested the wrong genes
- h_term has an upward agent
type: hypothesis
layer: L12
stub: false
summary: "ZERO - CREDIT FIRST. Round 296 ran the compound sweep on the volume axis and concluded: \"the most\nattractive\
  \ untested route is a SULFATE DONOR - scherer2025's per-variant plasma sulfate effect is r=0.70 with\nstanding\
  \ height across 466,907 people, raising a substrate is the move when the transporter can't be drugged,\nand nobody\
  \ has put a caliper on a femur under one.\" It named methylsulfonylmethane, sodium sulfate and\n**N-acetylcysteine**\
  \ as the agents. **That call was right and this round did not originate it.** What this\nround does is remove\
  \ the objection that has kept it down since round 295, and add the piece round 296 was\nmissing - a human demonstration\
  \ that the agent moves the biomarker.\n\nONE - ⛔ THE OBJECTION THAT KILLED IT WAS BASED ON THE WRONG GENES. Round\
  \ 295 wrote: \"**SLC13A1 0/10,\nSLC26A1 0-1/15** -> scherer2025's sulfate arm is **SYSTEMIC RENAL, not local**.\"\
  \ Both of those are the\n**KIDNEY** transporters that set PLASMA sulfate. **The transporter that takes sulfate\
  \ INTO cartilage is\nSLC26A2** - the diastrophic dysplasia gene - and it was never tested.\nQueried now against\
  \ GSE288028, 14 postnatal human growth-plate samples, 79,934 cells:\n| gene | role | detected | median CPM | %\
  \ of cells (max) |\n|---|---|---|---|---|\n| **SLC26A2** | **the CARTILAGE sulfate transporter** | **12/14** |\
  \ **118.1** | **82.2%** |\n| **PAPSS2** | makes PAPS; loss = brachyolmia, short stature | **12/14** | **529.6**\
  \ | **94.2%** |\n| CHST11 | chondroitin 4-O-sulfotransferase | 12/14 | 350.8 | 89.7% |\n| CSGALNACT1 | chondroitin\
  \ chain initiation | 12/14 | 135.3 | 75.4% |\n| **CHST3** | chondroitin 6-O-sulfotransferase; loss = short stature\
  \ | 12/14 | 111.6 | 76.5% |\n| PAPSS1 | makes PAPS | 12/14 | 78.6 | 74.1% |\n| CHSY1 | chondroitin synthase |\
  \ 12/14 | 64.7 | 55.6% |\n| UST, SLC35B2, SLC35B3, NDST1 | 2-O-sulfation, PAPS into Golgi, HS sulfation | present\
  \ | 15-29 | - |\n| **ACAN** | the substrate | 12/14 | **1,826** | 99.5% |\n| SLC13A1 | RENAL - what round 295\
  \ tested | **0/14** | 0.0 | 0.1% |\n| SLC26A1 | RENAL - what round 295 tested | **0/14** | 0.3 | 0.7% |\n=> **THE\
  \ RECEIVER TEST (CORR-327) PASSES COMPLETELY.** Transporter, activation, Golgi import, the\nsulfotransferases\
  \ and the substrate are all present and abundant. Round 295 found exactly the right answer\nabout the two genes\
  \ it tested and drew a conclusion about a pathway those genes do not serve.\n\nTWO - ⭐ THE HUMAN GENETICS ARE\
  \ A GRADED DOSE-RESPONSE, NOT ONLY A DISEASE.\n· `scherer2025` (already in this bibliography): allelic series\
  \ in the transcellular sulfate reabsorption\n  transporters SLC13A1 and SLC26A1 show **GRADED EFFECTS ON PLASMA\
  \ SULFATE *AND* HUMAN HEIGHT**, and pinpoint\n  alleles associated with increased odds of diverse musculoskeletal\
  \ traits in the population. **This is the\n  key line, because it is a dose-response in HETEROZYGOTES across the\
  \ ordinary range** - not a restoration\n  story at a pathological floor.\n· `tise2025` (already here): biallelic\
  \ SLC13A1 loss-of-function in multiple probands - **all presented with\n  concern for SHORT STATURE, with scoliosis\
  \ and/or skeletal dysplasia**, reduced plasma sulfate, and\n  complete loss of transport confirmed by 35S-sulfate\
  \ uptake assays.\n· `vandekamp2023` (**NOT previously in this atlas**): homozygous SLC13A1 p.Arg12Ter - profound\
  \ hyposulfatemia\n  from complete loss of renal sulfate reabsorption, with spondylo-epi-metaphyseal dysplasia.\n\
  · And the sulfation genes themselves shorten on loss in humans: **PAPSS2 -> brachyolmia**, **CHST3 ->\n  spondyloepiphyseal\
  \ dysplasia with joint dislocations**, **SLC26A2 -> diastrophic dysplasia,\n  atelosteogenesis II, recessive multiple\
  \ epiphyseal dysplasia.** Every step of the pathway has a human\n  short-stature phenotype attached to it.\n\n\
  THREE - ⭐⭐ THE AGENT, AND IT HAS A HUMAN PHARMACODYNAMIC DEMONSTRATION ON THE EXACT BIOMARKER.\n`vandekamp2023`,\
  \ in the patient above: **\"Intravenous N-acetylcysteine administration temporarily restored\nplasma sulfate levels.\"\
  ** NAC is metabolised through cysteine to sulfate, so it is a sulfate donor with a\nmeasured human effect on plasma\
  \ sulfate - which is the variable `scherer2025` shows is graded with height.\n**N-ACETYLCYSTEINE: oral, generic,\
  \ inexpensive, decades of paediatric use as a mucolytic and as the standard\nantidote in paracetamol overdose,\
  \ with one of the best-characterised safety records of any small molecule.**\nAlternative donors in the same class:\
  \ sodium sulfate and magnesium sulfate (direct sulfate),\nmethylsulfonylmethane (a sulfone, and the least well\
  \ characterised as a plasma-sulfate raiser).\n\nFOUR - ⭐ WHY IT FITS THIS CASE SPECIFICALLY, ON FOUR SEPARATE\
  \ CRITERIA THIS FILE HAS BUILT.\n· **STEP 0 PASSES CLEANLY.** Matrix sulfation is moved by NOTHING in the stack\
  \ - not CNP/cGMP (vosoritide),\n  not FGFR3/ERK/CREB (erdafitinib), not GH/IGF-1, not oestrogen (anastrozole).\
  \ This is the substitution test\n  that eliminated sacubitril, LUM-201, meclozine, PDE3 and cobimetinib, and sulfate\
  \ passes it.\n· **IT ACTS ON h_term, THE LARGEST TERM.** Sulfation sets the fixed charge density of aggrecan\n\
  \  glycosaminoglycans; fixed charge density sets osmotic swelling; and hypertrophic chondrocyte volume\n  increase\
  \ is roughly **80% of longitudinal growth**. Round 296 concluded that the volume axis had **no\n  upward-pointing\
  \ agent** because every marketed tool on the machinery is an inhibitor. A substrate donor\n  points UP.\n· **THE\
  \ COMPARTMENT IS RIGHT, BY THE ATLAS'S OWN NEW COORDINATE.** Round 318 showed the trunk is where this\n  subject's\
  \ remaining centimetres are. Fixed charge density is what holds water in the **intervertebral\n  disc** as well\
  \ as in the growth plate (round 319), so a sulfate donor plausibly serves **both** components\n  of sitting height.\
  \ `tise2025`'s probands present with **scoliosis** as well as short stature - an axial\n  phenotype.\n· **IT IS\
  \ OBTAINABLE TODAY** without a trial, an expanded-access programme, a construction project or an\n  antibody that\
  \ nobody has made - which is what every other candidate in rounds 311 to 319 required.\n\nFIVE - ✗ WHAT IS NOT\
  \ ESTABLISHED, STATED BEFORE ANYONE ACTS ON IT.\n· ⛔ **CORR-203 IS THE MAIN OBJECTION AND IT IS SERIOUS.** The\
  \ NAC demonstration was in a patient with\n  PROFOUND hyposulfatemia from complete transporter loss. **Restoration\
  \ in a deficient system is a claim\n  about the deficit.** Whether oral NAC raises plasma sulfate in a REPLETE\
  \ adolescent, and whether that adds\n  height, is unmeasured.\n  ✓ The partial answer, and the reason this is\
  \ not simply a restoration story: `scherer2025`'s effects are\n  **GRADED in heterozygotes**, which says plasma\
  \ sulfate tracks height across the sub-clinical range rather\n  than only at the floor.\n· ⛔ **NO SULFATE DONOR\
  \ HAS A BONE-LENGTH ENDPOINT IN ANY SPECIES.** Round 296 said this and it is still\n  true; round 302's rule makes\
  \ it a GAP rather than a disqualification, but it is the gap.\n· ✗ Whether plasma sulfate is rate-limiting for\
  \ cartilage sulfation in a normally-fed adolescent is unknown -\n  chondrocytes also derive sulfate from cysteine\
  \ catabolism, so supply may already be saturated.\n· ⚠ NAC is also a broad antioxidant and a glutathione precursor,\
  \ so any effect need not be sulfate-mediated,\n  and the antioxidant action is a separate and unassessed variable\
  \ in a growing skeleton.\n· ⚠ Dose, route and duration are undefined for this purpose. The human demonstration\
  \ was INTRAVENOUS. Oral\n  NAC has low and variable bioavailability, which is a real obstacle to reproducing the\
  \ plasma-sulfate effect.\n  **Gap: `g_l5_does_an_oral_sulfate_donor_raise_plasma_sulfate_and_bone_length_in_a_normal_growing_animal`.**\n\
  \nSIX - THE STATE OF THE ANSWER. This is the first candidate in ten rounds that has all of: a target class\npresent\
  \ and abundant in the target tissue, a graded human dose-response on the trait itself, a named agent\nwith a demonstrated\
  \ human effect on the mediating biomarker, a clean Step 0, action on the largest term in\nthe height identity,\
  \ plausible reach into the compartment that still has centimetres, and immediate\nobtainability. It is NOT proven\
  \ to add height, and the honest grade is C. **But it is a compound, and the\nexperiment that would settle it -\
  \ a sulfate donor in a normal growing animal with a caliper on the bone - is\nthe cheapest unrun experiment in\
  \ this entire file.**"
human_evidence: direct
human_evidence_note: 'The genetics are human and graded: scherer2025''s allelic series in SLC13A1 and SLC26A1 gives
  graded effects on plasma sulfate AND height across the population, and tise2025 reports biallelic loss-of-function
  probands all presenting with short stature, scoliosis and/or skeletal dysplasia with confirmed loss of 35S-sulfate
  transport. The pharmacodynamic demonstration is human - intravenous N-acetylcysteine restored plasma sulfate in
  a homozygous SLC13A1-null patient. The expression data are human, 14 postnatal growth-plate samples. What is NOT
  human, or anything else, is any demonstration that raising sulfate above normal changes bone length.'
species_basis: human
translation_risk: moderate
translation_risk_reason: 'MODERATE. Every element except the final step is human: the transporter is present in
  human growth plate, the dose-response is human and graded, the disease genetics are human, and the agent''s effect
  on the biomarker was shown in a human. The risk is concentrated in one place - whether supply is rate-limiting
  in a REPLETE person. Chondrocytes obtain sulfate both from plasma via SLC26A2 and from cysteine catabolism, so
  the system may already be saturated, in which case a donor does nothing. That is a solvable empirical question,
  not a species gap.'
confidence: C
confidence_reason: Graded C, and the components differ. The receiver-test result is A - SLC26A2 at 118 CPM in up
  to 82% of cells with PAPSS2, CHST3, CHST11 and ACAN all abundant, against SLC13A1 and SLC26A1 at 0/14, is unambiguous
  and it overturns round 295's dismissal. The human genetics are A. The claim that a sulfate DONOR adds height in
  a replete adolescent is C at best - it rests on a graded population dose-response plus a restoration-only pharmacodynamic
  demonstration, with no length endpoint in any species and an unresolved question about whether oral dosing reproduces
  the intravenous biomarker effect.
limitations: No sulfate donor has ever been given to a normal growing animal with a bone-length endpoint - round
  296 identified this gap and it is unchanged. The N-acetylcysteine demonstration was INTRAVENOUS and in a patient
  with complete renal sulfate wasting, so both the route and the population differ from the intended use, and oral
  NAC has low and variable bioavailability. CORR-203 applies with full force. NAC is a broad antioxidant and glutathione
  precursor, so attribution to sulfate would require measuring plasma sulfate rather than assuming it. Whether plasma
  sulfate is rate-limiting for cartilage proteoglycan sulfation in a normally-fed adolescent is unmeasured, and
  chondrocytes have a second sulfate source in cysteine catabolism. Dose, duration and target plasma sulfate level
  are all undefined. The expression data are whole-tissue with no zonal resolution in this pass.
