id: round204_the_vosoritide_decomposition_and_the_writeoff_audit
name: ROUND 204 - vosoritide decomposed in a primate buys its growth with FEWER cells per column and an
  unproven cell-size term, leaving the residual on pool consumption; and the write-off audit finds one
  compound killed on a single-site endpoint
type: hypothesis
layer: L12
aliases:
- vosoritide term assignment
- wendt2015 Table 3
- write-off site audit
- round 204
stub: false
summary: 'TWO THINGS HAPPENED IN THIS ROUND AND BOTH ARE CORRECTIONS TO THE TWO ROUNDS BEFORE IT.

  FIRST, THE VOSORITIDE TERM ASSIGNMENT EXISTS AFTER ALL, AND IT IS IN A PRIMATE. Round 203 concluded,
  after obtaining and searching two full texts, that no cell-level measurement existed under any CNP-axis
  agent. That was wrong. wendt2015 - held in this bibliography as a ref_id with NO FINDING AND NO NOTE,
  and supplied by the user - carries in cynomolgus monkeys at six months, IN THE SAME ANIMALS, four of
  the five quantities the Hunziker decomposition needs. Table 3, n = 4 per group, ANOVA with Tukey
  against vehicle, high dose 8.25 nmol/kg/day - longitudinal growth rate 26 to 40 micrometres per day
  (1.54x, P less than 0.05), growth plate thickness 555 to 682 (P less than 0.05), proliferating zone
  thickness 125 to 196 (P less than 0.001), hypertrophic zone thickness 72 to 128 (P less than 0.05),
  PROLIFERATING CELLS PER COLUMN 13 TO 11 (0.85x, NOT SIGNIFICANT), and hypertrophic cell size 232 to 286
  (1.23x, NOT SIGNIFICANT).

  THE ROW THAT DECIDES THE TERM GOES THE WRONG WAY, AND IT GOES THE WRONG WAY AT BOTH DOSES. Cells per
  column FALLS. Vosoritide does not buy length by adding divisions to a column - which in isolation is
  good news, because divisions are the exhaustible term - but it forces the 54 per cent growth gain into
  the two remaining terms. The cell-size row is reported as "hypertrophic cell volume" WITH THE UNIT
  MICROMETRES SQUARED, so it is a PROJECTED AREA and CORR-190 forbids reading it as a length; cooper2013
  independently shows why the distinction is not pedantic, since jerboa hypertrophic cells are 2.9 times
  the VOLUME of mouse but only 1.58 times the HEIGHT. Taking the square root as an isotropy assumption
  gives at most 1.11x on height. Closing the identity leaves a RESIDUAL OF ABOUT 1.6x, and in growth rate
  = amplification x pool consumption x terminal cell height that residual sits on POOL CONSUMPTION.

  SO THE PRIMATE DATA READS: VOSORITIDE SPENDS THE RESERVE FASTER. That is the unfavourable assignment
  and it puts vosoritide in the growth-hormone category rather than in the free-axis category the stack
  has been assuming. IT IS A DIRECTION AND NOT A VERDICT - n = 4, the authors write that the study was
  not powered for significance, BOTH decomposition terms are non-significant, the cell measure is an
  area, the cells-per-column count is a standing count in the proliferative zone rather than the
  amplification term proper, and pool consumption is inferred as a residual rather than measured, so it
  absorbs every error in the other terms.

  SECOND, THE WRITE-OFF AUDIT THE USER ASKED FOR. CORR-195 imposed the rule that no agent may be scored
  against one site. Applied BACKWARDS it asks whether any compound was retired on an endpoint that could
  not have seen the sites now known to be open. All 1436 references were scanned; 22 carry a negative
  length statement; 8 are measured through a single skeletal region; all 8 were resolved by hand.

  ONE GENUINE HIT. wang2018, tadalafil, whose title is "Analysis of short-term treatment with the
  phosphodiesterase type 5 inhibitor tadalafil on LONG BONE DEVELOPMENT in young rats". The ledger uses
  it as one of two legs under the verdict that stacking inside the cGMP node is dead. The other leg,
  hakata2024, measured NASO-ANAL LENGTH, which is axial and therefore sound. THE VERDICT IS NOT REVERSED
  - hakata2024 carries it and has the better design - but it is downgraded from two independent negative
  experiments to one whole-body negative plus one single-site negative.

  AND THE AUDIT FOUND SOMETHING MORE USEFUL THAN WHAT IT WAS LOOKING FOR. bush2010 was sitting in the
  null bucket while being a POSITIVE mechanism result - NKCC1 inhibition cut rat metatarsal elongation
  about 35 per cent with hypertrophic zone height falling 204 to 151 micrometres and CELL NUMBER
  UNCHANGED at 193 against 192, p = 0.937. That is an ISOLATED h_term EFFECT with the confounding term
  held constant, which is exactly the decomposition rounds 202 and 203 said did not exist. Together with
  abubakar2022 on NHE1 and AE2 it makes ion transport a named, isolated control point on the free axis.

  WHICH FORCES THE THIRD CORRECTION. Round 202 called weber2025 the FIRST intervention in this atlas to
  raise terminal cell height. It is not. trompet2024 measured terminal hypertrophic chondrocyte size in
  BOTH arms - null under systemic SAG, and elevated under the intra-articular bead, where the authors
  attribute the augmented growth plate height "probably due to an elevation in the height of the terminal
  hypertrophic chondrocytes". THE h_term AXIS NOW HAS FOUR AGENTS WITH A CELL-LEVEL SIGNAL - hedgehog
  agonism by local bead, NPR3 loss, resveratrol, and ion transport in the downward direction - and a
  route split worth noting, because systemic SAG moved nothing and the local bead did.'
quantitative:
- parameter: vosoritide decomposition in cynomolgus monkey at 6 months
  value: 'longitudinal growth rate 26 to 40 micrometres/day (1.54x, P less than 0.05); growth plate
    thickness 555 to 682 micrometres (1.23x, P less than 0.05); proliferating zone thickness 125 to 196
    (1.57x, P less than 0.001); hypertrophic zone thickness 72 to 128 (1.78x, P less than 0.05);
    PROLIFERATING CELLS PER COLUMN 13 to 11 (0.85x, N.S.); hypertrophic cell area 232 to 286 micrometres
    squared (1.23x, N.S.)'
  unit: as listed per row
  conditions: wendt2015 Table 3, BMN 111 at 8.25 nmol/kg/day against vehicle, n = 4 per group, 6 months,
    ANOVA with Tukey post hoc; a middle dose of 2.25 nmol/kg/day was non-significant on every parameter
  species: non_human_primate
  source_ref: wendt2015
  uncertainty: 'AUTHOR-STATED, read from a 500 dpi render of Table 3. The authors write that the study
    was NOT POWERED FOR SIGNIFICANCE. Both decomposition terms - cells per column and cell area - are
    non-significant; only growth rate and the zone thicknesses clear P less than 0.05'
- parameter: implied pool consumption residual under vosoritide
  value: growth rate 1.54x divided by cells-per-column 0.85x and an implied cell-height 1.11x leaves a
    residual of about 1.64x, which in the Hunziker identity sits on pool consumption
  unit: fold change, derived
  conditions: derived from wendt2015 Table 3 by the identity growth rate = amplification x pool
    consumption x terminal cell height
  species: non_human_primate
  source_ref: wendt2015
  uncertainty: 'DERIVED, AND EVERY WEAKNESS COMPOUNDS INTO IT. The 1.11x cell height comes from taking
    the square root of a projected AREA under an isotropy assumption that cooper2013 shows is false for
    hypertrophic cells. Cells per column is a standing count in the proliferative zone, not the
    amplification term of the identity, and a standing count can fall while flux rises. No resting-zone
    cycle time was measured, so pool consumption is a RESIDUAL and absorbs every error in the other
    terms. THE DIRECTION IS THE CLAIM; THE 1.6 IS NOT'
- parameter: NKCC1 inhibition as an isolated terminal-cell-height effect
  value: bumetanide reduced P7 rat metatarsal elongation by about 35 per cent over 24 hours with
    hypertrophic zone height falling from 204 to 151 micrometres while cell NUMBER was unchanged at 193
    against 192, p = 0.937
  unit: micrometres of hypertrophic zone height, and cells
  conditions: bush2010, P7 rat metatarsal organ culture, 24 hours
  species: rat
  source_ref: bush2010
  uncertainty: 'THE CLEANEST ISOLATED h_term RESULT IN THE FILE AND IT WAS SITTING IN THE NULL BUCKET.
    Cell number is explicitly held constant, so the zone change is a cell-size change and CORR-189 and
    CORR-197 are both satisfied. IT IS A DOWNWARD MANIPULATION in a 24-hour organ culture of a single
    bone, so it identifies a control point without showing the axis can be pushed upward'
- parameter: coverage of the write-off site audit
  value: 1436 references scanned; 22 carry a negative or null length statement; 8 measured through a
    single skeletal region; 1 genuine single-site write-off identified (wang2018, tadalafil)
  unit: counts
  conditions: automated scan of one_line_finding fields for a negative statement co-occurring with a
    length term, classified by the skeletal region named, then resolved by hand
  species: human
  source_ref: wang2018
  uncertainty: 'THE SCAN READS RECORDED FINDINGS, NOT PAPERS, so a paper that measured vertebrae without
    the atlas recording it would be misclassified. The hand resolution covers the 8 flagged entries only.
    This bounds the problem rather than eliminating it'
- parameter: terminal hypertrophic chondrocyte size under hedgehog agonism, by route
  value: systemic SAG - size of terminally hypertrophic chondrocytes NOT significantly changed;
    intra-articular SAG bead - growth plate height augmented, attributed by the authors to an elevation
    in the height of the terminal hypertrophic chondrocytes
  unit: qualitative, author-stated, with supplementary figure support
  conditions: trompet2024, mouse, systemic daily P30-P36 against intra-articular bead in the distal
    femoral secondary ossification centre
  species: mouse
  source_ref: trompet2024
  uncertainty: 'THE AUTHORS HEDGE WITH "PROBABLY" ON THE BEAD ARM, so this is their inference from the
    supplementary panels rather than a headline measurement. THE ROUTE SPLIT IS THE INTERESTING PART -
    systemic moved nothing and local moved it - and it is confounded with dose and duration, which the
    paper does not separate'
