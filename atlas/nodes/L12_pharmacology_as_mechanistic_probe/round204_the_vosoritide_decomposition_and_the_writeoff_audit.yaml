- 'the terminal hypertrophic cell, measured as an area in the only primate study and as an axial height
  nowhere on this pathway'
- 'the resting zone, which carries the residual and was not measured'
human_evidence: absent
human_evidence_note: 'The decomposition is cynomolgus monkey, which is the closest this pathway gets to
  human at the cellular level and is still not human. The audit is over human and animal records alike
  but is a bookkeeping exercise, not evidence. No human cellular measurement exists under any CNP-axis
  agent and none is in prospect.'
species_basis:
- non_human_primate
- rat
- mouse
translation_risk: high
translation_risk_reason: 'A four-animal primate arm with two non-significant decomposition terms, read
  through an identity that requires a fifth quantity nobody measured. The direction is worth acting on
  as a hypothesis and not as a finding.'
confidence: C
claim_grades:
- claim: vosoritide does not raise the number of proliferating cells per column
  grade: C
  basis: primate, both doses lower than vehicle, but non-significant at n = 4 in a study its authors
    describe as not powered for significance
- claim: vosoritide raises terminal hypertrophic cell height
  grade: E
  basis: NOT ESTABLISHED. The only measurement is a projected area in micrometres squared, non-significant,
    and CORR-190 forbids reading a projected area as a length
- claim: vosoritide buys its growth mainly by raising pool consumption
  grade: E
  basis: A RESIDUAL, not a measurement. It is what is left after two non-significant terms are divided
    out of one significant one, and no resting-zone cycle time exists to check it against
- claim: NKCC1 inhibition changes hypertrophic zone height through cell size with cell number unchanged
  grade: B
  basis: cell number explicitly measured and unchanged at p = 0.937, so the decomposition is closed for
    this manipulation; single bone, organ culture, 24 hours, downward direction only
- claim: no compound in this atlas was written off for want of spine data
  grade: B
  basis: enumeration over 1436 references with 8 single-site negatives resolved by hand; the scan reads
    recorded findings rather than papers, so it bounds rather than eliminates the possibility
- claim: the cGMP-stacking verdict rests on two independent negative experiments
  grade: X
  basis: DOWNGRADED. One leg (hakata2024) is whole-body and sound; the other (wang2018) is long-bone-only
    by its own title. The verdict stands on the first leg alone
