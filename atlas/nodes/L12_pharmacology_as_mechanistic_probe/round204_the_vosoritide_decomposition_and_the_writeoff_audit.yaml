contradicts:
- 'WITHDRAWS ROUND 203''S CLAIM THAT NO CELL-LEVEL MEASUREMENT EXISTS ON THE CNP AXIS. wendt2015 carries
  cells per column and a hypertrophic cell size in a primate. The narrow version survives - the size is a
  projected area and not an axial height - but the search that produced the claim looked at two candidate
  papers and stopped. Logged as CORR-198.'
- 'WITHDRAWS ROUND 202''S CLAIM THAT weber2025 WAS THE FIRST INTERVENTION TO RAISE TERMINAL CELL HEIGHT.
  trompet2024 measured it in both arms and the atlas''s own note on that paper already said so. The
  h_term axis has at least four agents with a cell-level signal. Logged as CORR-198.'
- 'DOWNGRADES THE cGMP-STACKING VERDICT WITHOUT REVERSING IT. It was carried as two independent negative
  experiments; one of the two is long-bone-only. hakata2024 alone still carries it. Logged as CORR-199.'
- 'CUTS AGAINST THE FAVOURABLE READING OF VOSORITIDE THAT ROUND 203 LEFT STANDING. Round 203 established
  that the human CNP dose-response is near-linear with no ceiling and that the segments grow
  proportionately, both of which argue for dosing the axis hard. This round''s decomposition argues the
  growth is bought out of the reserve. Those are not contradictory - a linear human dose-response says
  nothing about which term carries it - but together they mean the CNP axis may be linear in the currency
  the atlas does not want to spend.'
