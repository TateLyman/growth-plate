contradicts:
- 'ROUND 220''s central claim that the two approved CNP ligand drugs are pharmacologically interchangeable
  and that the choice between them is a schedule. The head-to-head exists in cynomolgus monkey and separates
  them 1.7- to 3-fold, and the schedule IS the pharmacology - demonstrated in a same-molecule same-dose
  bolus-versus-infusion experiment. Recorded as CORR-221.'
- 'ROUND 220''s reading of the clinical data as a wash. APPROACH''s interval spans 1.84-fold end to end and
  cannot exclude the measured separation; the trials do not DISTINGUISH the drugs, which is not the same as
  the drugs being EQUIVALENT.'
- 'The atlas claim in cnp_analog_pk_challenge that the efficacy ceiling is set downstream of NPR2 rather than
  by drug delivery. The direct test - same molecule, same daily dose, bolus against continuous infusion -
  comes out against it, and the claim is regraded from D to E.'
- 'ROUND 219''s assumed 1.5- to 3-fold FGF19 compensatory rise. The measured peak is 3.48-fold and the
  remaining concentration gap is about 260-fold rather than 300 to 600. The conclusion survives on a margin
  half the size I claimed for it.'
