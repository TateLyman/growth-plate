id: round221_the_primate_head_to_head_exists_and_it_separates_the_two_cnp_drugs
name: ROUND 221 - the primate head-to-head that round 220 said did not exist, and it separates the two CNP
  ligand drugs by 1.7- to 3-fold with the largest gap in the TAIL; the schedule is the pharmacology and it
  was measured in a same-molecule same-dose experiment; and the FGF19, klotho-beta and COL9A1 fold changes
  are now read off the figure instead of assumed
type: hypothesis
layer: L12
aliases:
- the CNP head-to-head
- continuity is the pharmacology
- the measured FGF19 rise
- COL9A1 rises under FGFR3 inhibition
- round 221
stub: false
summary: 'THREE SUPPLIED DOCUMENTS, AND THE FIRST ONE REFUTES THE ROUND I COMMITTED HOURS EARLIER.

  ROUND 220 CONCLUDED THAT THE TWO APPROVED CNP LIGAND DRUGS ARE PHARMACOLOGICALLY INTERCHANGEABLE, THAT
  THE CHOICE BETWEEN THEM IS A SCHEDULE, AND - IN TERMS - THAT I LOOKED FOR A PHARMACOLOGICAL REASON TO
  PREFER ONE AND DID NOT FIND ONE. I looked by comparing the two peptides'' N-terminal extensions and
  inferring equivalence from architecture. THE HEAD-TO-HEAD EXISTS, IT IS IN CYNOMOLGUS MONKEY, AND IT
  SEPARATES THEM.

  breinholt2019, 26-week juvenile cynomolgus, n = 4 per group, TransCon CNP at 100 ug CNP/kg/WEEK against a
  daily CNP-39 molecule the authors state has THE SAME AMINO ACID SEQUENCE AS VOSORITIDE at 20 ug
  CNP/kg/DAY. Body length +5 against +3 per cent. TAIL LENGTH +9 AGAINST +3. Tibia +6 against +3. Ulna +3
  against no meaningful change. Proximal tibial physis - proliferative zone width +37 against +16 per cent,
  hypertrophic zone +38 against +39, epiphyseal plate thickness +16 per cent SIGNIFICANT against +7 NOT
  SIGNIFICANT. And no treatment-related change in growth plate closure at any site, so neither arm spent
  bone age.

  AND THE DOSING RUNS AGAINST THE WINNER. The daily arm received 140 ug CNP/kg/week against TransCon''s
  100. THE WEEKLY PRODRUG WON ON 71 PER CENT OF THE WEEKLY PEPTIDE DOSE.

  THE TAIL ROW IS THE ONE THIS CASE SHOULD READ FIRST. Tail is pure caudal vertebrae, a clean axial growth
  plate readout, and the separation there is THREEFOLD - the largest of any endpoint in the study. Round
  220 chose between these drugs on adherence. THE ACTUAL DIFFERENCE IS A SITE PROFILE, AND IT FAVOURS THE
  WEEKLY DRUG WHERE THIS CASE HAS THE MOST TO GAIN.

  AND THE MOUSE ARM OF THE SAME PAPER IS THE CLEANEST SCHEDULE EXPERIMENT THAT CAN BE DONE. Three-week-old
  male FVB mice, n = 9, CNP-38 at 203 ug/kg/day for five weeks, given either as a DAILY SUBCUTANEOUS BOLUS
  or as CONTINUOUS SUBCUTANEOUS INFUSION by osmotic pump. SAME MOLECULE, SAME DAILY DOSE, ONLY THE SCHEDULE
  DIFFERS. The bolus produced significant appendicular and axial growth; CONTINUOUS INFUSION PRODUCED
  SIGNIFICANTLY MORE, tested directly against the bolus arm. THAT IS THE EXPERIMENT ROUND 220''s CEILING
  ARGUMENT PREDICTED WOULD BE NULL.

  SO WHY DID THE CLINICAL DATA LOOK LIKE A WASH. BECAUSE IT CANNOT SEE A DIFFERENCE THIS SIZE. APPROACH
  gives navepegritide 1.49 cm/year with a 95 per cent interval of 1.05 to 1.93 - the interval spans
  1.84-fold end to end - against vosoritide''s roughly 1.57 from a different trial in a different cohort
  with a different baseline, neither reporting adult height. A 1.7- to 3-fold separation is entirely
  compatible with those two numbers. ROUND 220 COMMITTED A NULL-IS-NOT-EQUIVALENCE ERROR: the trials do not
  DISTINGUISH the drugs, which is not the same as the drugs being EQUIVALENT, and where the trials are
  silent the controlled preclinical comparison is the better evidence rather than the worse. Recorded as
  CORR-221.

  THE PK EXPLAINS THE MECHANISM AND ALSO REMOVES A SAFETY TIE. CNP-39 half-life in cynomolgus is 20 minutes
  with exposure detectable only to 2 hours post dose; CNP-38 released from TransCon has an apparent
  half-life of 90 hours with exposure for at least 7 days, at a Cmax roughly 100-FOLD LOWER. And at
  equivalent doses the daily CNP-39 molecule and unconjugated CNP-38 REDUCED BLOOD PRESSURE AND/OR RAISED
  HEART RATE, while TransCon CNP did so at no exposure tested including above the expected clinical
  therapeutic range. The hypotension ceiling that limits this axis is a Cmax phenomenon, and only one of
  the two molecules is built to avoid it.

  WHAT THIS DOES NOT CHANGE. The term assignment is STILL UNDECOMPOSED FOR NAVEPEGRITIDE. breinholt2019
  reports zone WIDTHS and a qualitative note of increased cellularity; CORR-197 says a zone width is cells
  per column times cell height PLUS MATRIX, and the paper decomposes none of it. wendt2015 remains the only
  cell-level decomposition of any CNP agent, it is vosoritide, and it found cells per column FALLING with
  the residual on pool consumption. SO THE DRUG THAT WINS ON GROWTH IS THE ONE WHOSE TERM ASSIGNMENT IS
  UNKNOWN, and the gap this atlas opened yesterday is narrowed rather than closed.

  SECOND DOCUMENT - THE SURF301 POSTER, WHICH MEANS THE FGF19 AND KLOTHO-BETA RISES ARE NOW READ OFF THE
  FIGURE RATHER THAN ASSUMED. Rendered at 200 dpi against the printed axis, medians good to about 0.15 log2
  units. FGF19 C1D15 log2 fold change runs +0.15, +0.95, +1.80 and +1.40 at 40, 60, 90 and 120 mg - so 1.11,
  1.93, 3.48 and 2.64-fold, strongly dose-dependent and PEAKING HIGHER THAN THE 1.5- TO 3-FOLD BAND ROUND
  219 ASSUMED. KLB runs -0.30, +0.45, +0.85 and +0.85 - so 0.81, 1.37, 1.80 and 1.80-fold, WHICH MEANS THE
  CO-RECEPTOR FALLS AT 40 mg BEFORE RISING and the sponsor''s phrase FGF19 AND KLB INCREASED flattens a
  biphasic curve.

  ROUND 219''s CONCLUSION SURVIVES ON A SMALLER MARGIN AND A REAL NUMBER. At the largest measured rise the
  human FGF19 concentration reaches about 770 pg/mL against the 200,000 pg/mL that shortened a metatarsal
  WITH 200 ng/mL of added beta-klotho. The gap falls from the 300- to 600-fold I estimated to about
  260-FOLD. Still not close, and now measured.

  THIRD - AND ONE HUMAN OBSERVATION ARGUES AGAINST MY OWN HYPOTHESIS. Round 219 floated at grade E that
  FGFR3 INHIBITION MIGHT BE SELF-LIMITING, because Fgfr3 RNAi blocks FGF18-induced autophagy and that
  autophagy is what type II collagen secretion needs. COL9A1 - the sponsor''s own cartilage-relevant marker
  - RISES under the drug, C2D1 log2 fold change +0.25, +0.15, +0.90 and +1.05 by ascending dose, crossing
  the 1.5-fold line at the top two. A plasma collagen signal can rise from synthesis OR from turnover, so
  this is not decisive, but the self-limiting hypothesis now has a human observation against it and none
  for it.

  AND THE AUTHORS'' OWN COMMENTARY CUTS BOTH WAYS, WHICH IS WHY THIS STAYS OPEN. cinque2016_editorial states
  that FGF18 acts MAINLY THROUGH FGFR4 AND TO A LESSER EXTENT THROUGH FGFR3 - so the FGFR3 contribution is
  real in the authors'' own reading rather than an in-vitro artefact, which supports the worry. But it also
  points to wang2015_ach_autophagy, which reports DEFECTIVE AUTOPHAGY IN THE GROWTH PLATES OF AN
  ACHONDROPLASIA MOUSE - FGFR3 OVERACTIVITY SUPPRESSING AUTOPHAGY. If activation suppresses it, inhibition
  plausibly relieves it, which is the opposite sign and is consistent with the COL9A1 rise. Three
  observations, two directions, unresolved.

  AND THE EDITORIAL PARTLY ANSWERS THE AUTOPHAGY CANDIDATE WITHOUT THE EXTENDED DATA. It describes the
  Tat-beclin-1 result three times and every description is RESTORATION language - restored ECM matrix
  defects in Fgf18+/- and Fgfr4-/- mice, rescued autophagy in the growth plates of Fgf18+/- mice. NO
  WILD-TYPE ELEVATION IS CLAIMED ANYWHERE, in the paper or in the authors'' own summary of it. That is not
  proof of absence, but authors summarising their own work state the strongest true version, and the
  strongest version they state is restoration. THE CANDIDATE STAYS UNRANKED AND THE PRIOR MOVES AGAINST
  ELEVATION.

  ONE NUMBER FROM THE POSTER FOR THE OTHER THREAD, RECORDED NARROWLY. The sponsor states that SURF301
  demonstrated exposures ABOVE THE FGFR3 IC90 that are below the IC50 for FGFR1, 2 and 4. Against round
  214''s IC90/IC50 spacing of about 2.8 that is C/IC50 above 2.8, against erdafitinib 8 mg at 0.469. It is a
  sponsor claim on a conference poster using protein-binding-adjusted target lines, it bears only on FGFR3
  coverage, and it is NOT a licence to reopen the receptor ledger that CORR-046 retracted and CORR-217
  caught on its fourth approach.'
quantitative:
- parameter: the primate head-to-head between the two CNP ligand drugs
  value: '26-week juvenile cynomolgus monkey, n = 4 per group, TransCon CNP 100 ug CNP/kg/week against daily
    CNP-39 (same amino acid sequence as vosoritide) 20 ug CNP/kg/day, both against vehicle. Relative increase
    over vehicle - body length +5 against +3 per cent, TAIL +9 against +3, tibia +6 against +3, ulna +3
    against no meaningful change. Proximal tibial physis - proliferative zone width +37 against +16 per cent
    (both P<=0.05), hypertrophic zone width +38 against +39 (both P<=0.05), epiphyseal plate thickness +16
    (P<=0.05) against +7 (not significant). No treatment-related change in growth plate closure at femur,
    tibia or radius/ulna. TransCon CNP at 40 ug CNP/kg/week produced NO significant histomorphometry change'
  unit: per cent increase over vehicle
  conditions: breinholt2019, sponsor study; the daily arm received 140 ug CNP/kg/week against TransCon's 100
  species: non_human_primate
  source_ref: breinholt2019
  uncertainty: 'n = 4 PER GROUP AND IT IS THE SPONSOR OF THE WINNING MOLECULE, which is the two things to
    hold against it. The dose asymmetry runs AGAINST the winner rather than for it, which is the strongest
    internal control the design has. Zone widths are NOT decomposed - CORR-197 makes a zone width cells per
    column times cell height plus matrix, and the paper reports only a qualitative note of increased
    cellularity - so this establishes a GROWTH difference and not a TERM difference'
- parameter: the same-molecule same-dose schedule experiment
  value: three-week-old male FVB mice, n = 9, CNP-38 at 203 ug/kg/day for five weeks as a daily subcutaneous
    bolus against continuous subcutaneous infusion by osmotic Alzet pump. The bolus elicited significant
    growth in the appendicular and axial skeleton; CONTINUOUS INFUSION AT THE SAME DAILY DOSE PRODUCED
    SIGNIFICANTLY GREATER RESPONSES ON SEVERAL GROWTH PARAMETERS, tested against the bolus arm directly
  unit: bone length by X-ray, per cent change from control
  conditions: breinholt2019 Table 5; same molecule, same total daily dose, only the delivery schedule differs
  species: mouse
  source_ref: breinholt2019
  uncertainty: 'THIS IS THE DIRECT TEST OF THE ATLAS''s CEILING CLAIM AND IT COMES OUT AGAINST IT. The limits
    are that it is mouse, five weeks, n = 9, an osmotic pump rather than a prodrug, and the per-parameter
    magnitudes are in a table this extraction did not resolve numerically. The DESIGN is what makes it
    load-bearing - nothing differs between arms except continuity'
- parameter: pharmacokinetic and haemodynamic separation between the two molecules
  value: CNP-39 half-life in cynomolgus monkey about 20 minutes with exposure detectable only to 2 hours post
    dose against a lower limit of quantification of 37 pmol/L; CNP-38 released from TransCon CNP has an
    apparent half-life of 90 hours with exposure for at least 7 days post dose. Cmax for CNP-39 at 20 ug/kg is
    approximately 100-FOLD HIGHER than the peak CNP from 100 ug/kg as TransCon CNP. At equivalent doses,
    single injections of unconjugated CNP-38 or of daily CNP-39 REDUCED BLOOD PRESSURE AND/OR INCREASED HEART
    RATE; TransCon CNP showed no adverse cardiovascular effect at exposures exceeding the expected clinical
    therapeutic exposure
  unit: hours, fold, and blood pressure/heart rate direction
  conditions: breinholt2019, cynomolgus monkey
  species: non_human_primate
  source_ref: breinholt2019
  uncertainty: 'The 90-hour figure is RELEASE-RATE-LIMITED FLIP-FLOP KINETICS from the carrier and is not a
    property of the peptide, which round 220 stated correctly and then used to argue equivalence - the error
    was the inference, not the kinetics. The haemodynamic comparison is the sponsor''s own and no independent
    replication exists'
- parameter: FGF19, beta-klotho and COL9A1 fold changes under FGFR3 inhibition, read from the figure
  value: 'FGF19 C1D15 log2 fold change medians +0.15, +0.95, +1.80, +1.40 at 40, 60, 90 and 120 mg = 1.11,
    1.93, 3.48 and 2.64-fold. KLB -0.30, +0.45, +0.85, +0.85 = 0.81, 1.37, 1.80 and 1.80-fold, so KLB FALLS
    AT 40 mg BEFORE RISING. COL9A1 C2D1 log2 fold change +0.25, +0.15, +0.90, +1.05 by ascending dose = 1.19,
    1.11, 1.87 and 2.07-fold, RISING and crossing the 1.5-fold line at the top two doses. Olink on 60-120 mg
    QD participants, paired t-test, cut-off P<0.01 and absolute fold change 1.5'
  unit: log2 fold change against baseline, and linear fold
  conditions: SURF301 poster (Loriot et al.), rendered at 200 dpi and read against the printed axis; archived
    at atlas/data/round221_supplied/
  species: human
  source_ref: surf301_pb060_2024
  uncertainty: 'THESE ARE MEDIANS READ OFF A RENDERED BOX PLOT, GOOD TO ABOUT 0.15 LOG2 UNITS, AND ARE NOT
    SPONSOR-STATED VALUES. The rule comes from round 213, where text-layer extraction of a figure nearly put
    a misread potency into the atlas: reading a figure means rendering it AND stating the precision. Adults
    with cancer, one exploratory panel, a different molecule from the one this stack uses'
  value_unverified: true
- parameter: the remaining FGF19 concentration gap, recomputed on the measured rise
  value: human median fasting FGF19 221 pg/mL times the largest measured rise of 3.48-fold gives about 770
    pg/mL, against the 200,000 pg/mL that shortened a cultured metatarsal with 200 ng/mL of added
    beta-klotho - a remaining gap of about 260-FOLD, down from the 300- to 600-fold round 219 estimated under
    an assumed rise
  unit: fold shortfall
  conditions: computed in atlas/tools/round221_the_headtohead_and_the_measured_fold_changes.py
  species: multiple
  source_ref: fgf19cart2025
  uncertainty: The margin narrowed by roughly half when the assumption was replaced by a measurement, which
    is a reminder that assumed ranges chosen while arguing a case tend to favour the case. 260-fold is still
    not close, and the minimum effective FGF19 concentration remains unmeasured because fgf19cart2025 reports
    no dose-response
  value_unverified: true
localization:
- 'the caudal vertebrae, where the two ligand drugs separate threefold and where this case has axial reserve'
- 'the proximal tibial physis, where the proliferative zone separates 2.3-fold and the hypertrophic zone does
  not separate at all'
- 'the vasculature, where the Cmax of a short-lived analogue lowers blood pressure and a sustained low peak
  does not'
human_evidence: indirect
human_evidence_note: 'The drug comparison is primate and mouse; the human trials cannot resolve a difference
  of this size. The FGF19, KLB and COL9A1 fold changes are human but in adults with cancer under a different
  molecule.'
species_basis:
- non_human_primate
- mouse
- human
translation_risk: moderate
translation_risk_reason: 'The separation between the two drugs is measured in animals at n = 4 and n = 9 by
  the sponsor of the winning molecule, and the human trials are underpowered to confirm or refute it.'
confidence: B
claim_grades:
- claim: the two approved CNP ligand drugs are pharmacologically interchangeable
  grade: X
  basis: 'FALSE, AND THE HEAD-TO-HEAD EXISTS. 26-week cynomolgus, n = 4/group - tail +9 against +3 per cent,
    tibia +6 against +3, body +5 against +3, proliferative zone width +37 against +16, epiphyseal plate
    thickness significant against not significant - with the WEEKLY arm winning on 71 per cent of the weekly
    peptide dose. Round 220 inferred equivalence from peptide architecture instead of searching for the
    comparison'
- claim: continuous CNP exposure produces more bone growth than intermittent exposure at the same total dose
  grade: C
  basis: 'DIRECTLY TESTED IN THE CLEANEST AVAILABLE DESIGN - same molecule, same daily dose, bolus against
    osmotic-pump infusion in growing mice, n = 9, five weeks - and continuous won on several growth
    parameters. Mouse only, one experiment, one laboratory, and it is the sponsor of the sustained-release
    product'
- claim: the CNP-axis efficacy ceiling sits downstream of NPR2 so continuity of exposure buys nothing
  grade: E
  basis: 'REGRADED DOWN FROM D. The claim was inferred from two clinical point estimates that cannot resolve
    a difference of the measured size, and the direct preclinical test of it comes out the other way. It is
    not refuted in humans - it is unsupported by the evidence that was used to support it'
- claim: navepegritide should be preferred to vosoritide
  grade: C
  basis: 'UPGRADED FROM D AND THE REASON HAS CHANGED. It is no longer an adherence argument. A primate
    head-to-head separates the drugs 1.7- to 3-fold with the largest gap in the TAIL, a same-molecule
    schedule experiment supports the mechanism, and only the sustained-release molecule avoids the Cmax-driven
    blood pressure fall. Sponsor-run, n = 4, and the term assignment is still unknown for the winner'
- claim: the growth difference between the two drugs is a difference in how the growth is bought
  grade: E
  basis: 'UNKNOWN AND THIS IS THE GAP THAT MATTERS. breinholt2019 reports zone WIDTHS plus a qualitative note
    of increased cellularity; CORR-197 makes a zone width cells per column times cell height plus matrix.
    wendt2015 remains the only decomposition of any CNP agent and it is vosoritide. The drug that wins on
    growth is the one whose term assignment has never been measured'
- claim: FGFR3 inhibition is self-limiting through loss of FGF18-driven autophagy and collagen secretion
  grade: E
  basis: 'UNCHANGED AT E, WITH EVIDENCE NOW ON BOTH SIDES. Against - COL9A1 RISES dose-dependently under the
    drug in humans, to 2.07-fold, and wang2015_ach_autophagy reports FGFR3 OVERACTIVITY suppressing growth
    plate autophagy, implying inhibition relieves it. For - cinque2016_editorial states the authors'' own view
    that FGF18 acts mainly through FGFR4 AND TO A LESSER EXTENT THROUGH FGFR3, so the FGFR3 contribution is
    not an in-vitro artefact. A plasma collagen signal cannot distinguish synthesis from turnover'
- claim: Tat-beclin-1 elevates bone length above a normal baseline
  grade: E
  basis: NO WILD-TYPE ELEVATION IS CLAIMED ANYWHERE by the authors, in the paper or in their own commentary
    on it, where the rescue is described three times and every description is RESTORATION language. That is
    not proof of absence and the extended-data panels are still unread, but the prior moves against
    elevation and the candidate stays unranked
key_refs:
- ref_id: breinholt2019
  year: 2019
  type: primary
  role: THE HEAD-TO-HEAD ROUND 220 SAID DID NOT EXIST - 26-week cynomolgus, TransCon CNP against a
    vosoritide-sequence daily molecule, plus the same-molecule same-dose bolus-versus-infusion mouse arm
- ref_id: surf301_pb060_2024
  year: 2024
  type: conference_abstract
  role: THE FIGURE, RENDERED - FGF19 to 3.48-fold, KLB falling at 40 mg before rising to 1.80, COL9A1 rising
    to 2.07-fold, and the sponsor's statement of exposure above the FGFR3 IC90 and below the FGFR1/2/4 IC50
- ref_id: cinque2016_editorial
  year: 2016
  type: review
  role: the authors' own summary of cinque2015 - FGF18 acts mainly through FGFR4 and TO A LESSER EXTENT
    THROUGH FGFR3, and every description of the Tat-beclin-1 result is restoration rather than elevation
- ref_id: wang2015_ach_autophagy
  year: 2015
  type: primary
  role: the opposite-sign observation - defective autophagy in an achondroplasia mouse growth plate, so FGFR3
    overactivity suppresses the arm that FGFR3 inhibition was feared to remove
- ref_id: wendt2015
  year: 2015
  type: primary
  role: still the only cell-level decomposition of any CNP agent, and it is the drug that LOSES the
    head-to-head - which is why the term question is narrowed rather than closed
- ref_id: savarirayan2026
  year: 2026
  type: primary
  role: the clinical estimate whose confidence interval spans 1.84-fold end to end, which is why the trials
    cannot distinguish the two drugs
- ref_id: fgf19cart2025
  year: 2025
  type: primary
  role: the 200,000 pg/mL that shortened a metatarsal, against which the measured 770 pg/mL human peak leaves
    a 260-fold gap
