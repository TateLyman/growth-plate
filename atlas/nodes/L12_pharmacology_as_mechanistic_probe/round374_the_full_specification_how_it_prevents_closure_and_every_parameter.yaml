contradicts:
- SHARPENS THE AXIAL OBJECTION R373 RAISED AGAINST ITSELF. chen2022ihh shows the vertebral plates are
  hedgehog-maintained, so the mechanism reaches the trunk even though the depot does not - which makes the
  compartment mismatch a real cost of choosing the local route rather than an incidental limitation.
- CONFIRMS THE COMPOUND CHOICE MADE IN R373 FOR A SECOND REASON. The burst-release argument selected SAG over
  the steroids; the pulse-interval derivation adds that any maintained exposure is actively harmful, which
  further disfavours a compound whose systemic use would be continuous.
- DOES NOT MAKE THE PROTOCOL EXECUTABLE. The interval is derived rather than measured, the intraosseous
  behaviour of a setting fibrin depot is unknown, and the surgical parameters are outside this atlas.
