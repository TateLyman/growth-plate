id: round374_the_full_specification_how_it_prevents_closure_and_every_parameter
name: Round 374 - THE FULL SPECIFICATION. How SMO agonism prevents closure stated as a complete causal chain,
  every dosing parameter derived with its basis, the pulse interval reasoned from first principles because
  nobody has measured it, and the axial problem answered - hedgehog maintains the VERTEBRAL plates too, which
  a knee depot cannot reach
aliases:
- the full specification
- how do we inject how frequently
- how does this prevent closure
- pulse interval SMO agonist
- does hedgehog maintain the vertebral growth plates
type: hypothesis
layer: L12
stub: false
summary: 'The operator asked for complete specifications and for the closure mechanism stated in full. Both
  are below. Two things changed while assembling them.

  ⭐⭐⭐⭐ ONE - HOW IT PREVENTS CLOSURE, AS A COMPLETE CHAIN. Each link is held in this atlas with a primary.
  · CLOSURE IS POOL EXHAUSTION, NOT A CLOCK. weise2001, ovariectomised rabbits - seven growth-plate
    parameters decline SPONTANEOUSLY and oestrogen ACCELERATED ALL SEVEN AND INITIATED NONE; fusion occurred
    when proliferation APPROACHED ZERO, as an ABRUPT event.
  · THE CLOCK IS COUNTED IN DIVISIONS, NOT TIME. marino2008 and the local catch-up literature - growth-plate
    senescence is DIVISION-dependent, which is also why R266 closed senolytics and why R365 closed VEGF
    blockade (proliferation continues under blockade while output stops, so the pool is spent for nothing).
  · THE POOL IS MAINTAINED BY HEDGEHOG, AND THE REQUIREMENT IS CONTINUOUS. newton2019 - Shh from the
    secondary ossification centre diffuses DOWN and Ihh from the hypertrophic zone diffuses UP, giving
    maximal hedgehog signalling SPECIFICALLY IN THE RESTING ZONE; and SIX ADMINISTRATIONS OF VISMODEGIB AT
    P31-P34 REDUCED RESTING-ZONE CLONAL SIZE AND FUSED THE GROWTH PLATE, with CD73 retained, so hedgehog
    maintains the stem-cell CYCLE rather than their identity.
  · ⭐ AND THE SAME IS TRUE OF THE SPINE - NEW THIS ROUND. chen2022ihh, systemic vismodegib in ADULT mice,
    Gli1 confirmed suppressed in the discs: VERTEBRAL GROWTH PLATES NARROWED OR FUSED, with endplate
    sclerosis and vertebral bone loss, TIME-DEPENDENTLY over 2 to 8 weeks.
  · ADDING HEDGEHOG POST-SOC ENLARGES THE POOL AND NOTHING ELSE. trompet2024 - resting-zone PTHrP-positive
    cells 65.5 to 139.8 per mm2 (P=0.017) ALL INSIDE THE RESTING ZONE, with NO change in proliferation in the
    top 50 microns or the proliferative zone and NO change in terminal hypertrophic cell size. In H = N x A x
    h_term that is N ALONE.
  → SO THE MECHANISM IS NOT STOPPING A CLOCK. IT IS ADDING TO THE BUDGET THE CLOCK COUNTS DOWN. That is
  precisely why trompet2024 three-week input produced a gain STILL WIDENING AT SIX MONTHS: a rate effect
  decays when the signal stops, a pool effect keeps paying out. ⛔ AND THE HONEST LIMIT: IT DOES NOT MAKE THE
  PLATE IMMORTAL. It moves the budget, not the mechanism, and no experiment in any species has shown a plate
  held open indefinitely by an agonist.

  ⛔⛔ TWO - AND THE AXIAL PROBLEM IS NOW SHARP RATHER THAN VAGUE. R373 noted that the depot addresses the
  knee while the residual at bone age 16 is trunk-dominant. chen2022ihh makes that worse and better at once:
  the VERTEBRAL plates are hedgehog-maintained too, so the mechanism DOES apply to the trunk - but there are
  many small vertebral plates and no depot can reach them. TRUNK COVERAGE REQUIRES A SYSTEMIC ROUTE, and
  he2024sag is the paper showing that a local depot specifically AVOIDS the systemic exposure that would
  provide it. THE TWO GOALS ARE IN DIRECT TENSION AND THE PROTOCOL BELOW CANNOT SATISFY BOTH.'
quantitative:
- parameter: THE COMPOUND AND FORMULATION SPECIFICATION
  value: 'COMPOUND - SAG, CAS 364590-63-6, as the DIHYDROCHLORIDE salt (e.g. Tocris 6390) rather than the free
    base, because the free base is cLogP 6.79 and the salt is the water-soluble form; 98 per cent or greater
    HPLC purity with certificate of analysis.
    WHY SAG AND NOT AN APPROVED STEROID - the vehicle release profile decides it. Clobetasol propionate has
    the best Gli potency of any agonist (0.2 nM) but only a 3.3 to 7.3-fold window over the glucocorticoid
    receptor, and fibrin release is TRIPHASIC WITH AN INITIAL BURST at 0-2 hours. A burst overshooting three
    to sevenfold places a steroid into growth-suppressing GR territory AT THE PLATE. SAG has no
    counter-target and is burst-tolerant.
    VEHICLE - fibrin sealant (fibrinogen plus thrombin; Tisseel or Evicel), FDA-approved as a haemostat and,
    for Tisseel, indicated in patients over one month of age; dual-barrel syringe, clots in 10 to 30 seconds
    so the depot stays where it is placed.
    LOADING - 1000 micromolar SAG in the gel, which is the top of the he2024sag in vivo range (they used 30,
    100 and 1000 micromolar). At 1 to 2 mL of gel that is 0.49 to 0.98 mg of SAG per depot.
    PREPARATION - SAG dissolved in the fibrinogen component before mixing, per he2024sag, which loaded
    3.48 mM into a 300 microlitre gel (0.51 mg) and characterised binding to fibrinogen at approximately two
    sites by hydrophobic forces and hydrogen bonds.'
  unit: micromolar loading; mg per depot
  conditions: Assembled 2026-08-13 from he2024sag formulation, R372 window calculation and the approved
    labelling of fibrin sealant.
  species: not_applicable
  source_ref: he2024sag
  uncertainty: 'THE SALT FORM IS AN INFERENCE, NOT A TESTED CHOICE - he2024sag used SAG21k, a different
    molecule of the same chemotype, and no one has loaded SAG itself or its dihydrochloride into fibrin. The
    binding constants and release profile therefore may not transfer, and the dihydrochloride greater
    hydrophilicity would if anything RELEASE FASTER than the more lipophilic SAG21k they characterised.
    98 per cent purity permits 2 per cent uncharacterised material with no endotoxin or sterility
    specification, which is the operator accepted risk and remains a real one for an implanted depot.'
- parameter: THE SITE AND THE INJECTION PROCEDURE
  value: 'SITES - the DISTAL FEMORAL secondary ossification centre first, which is the exact placement in
    trompet2024, and the PROXIMAL TIBIAL secondary ossification centre as the second, the two together being
    the fastest-growing plates in the body. The target is the epiphyseal bone immediately ABOVE the growth
    plate, not the plate itself and not the joint space: the resting zone is the epiphyseal-most layer of the
    plate and sits directly against the secondary ossification centre, which is why that compartment is the
    physiological source of the maintaining Shh.
    APPROACH - percutaneous, image-guided, intraosseous. NOT an open operation and NOT an intra-articular
    injection. trompet2024 deliberately moved AWAY from the intra-articular route on the grounds that it can
    traumatise joints and that hedgehog activation may harm articular cartilage.
    PROCEDURAL PRECEDENTS for reaching this compartment with a needle: intraosseous vascular access is a
    routine paediatric emergency procedure; retrograde epiphyseal drilling for osteochondritis dissecans is
    standard adolescent orthopaedic practice; and an immature-pig study delivered a 5 mL INTRAOSSEOUS
    injection into a growing femoral head with monthly radiographic follow-up.
    VOLUME - 1 to 2 mL per site, which is within the range those precedents use and matches the loading
    calculation above.'
  unit: millilitres per site
  conditions: Site and effect from trompet2024; procedural precedents from established practice and an
    immature large-animal study.
  species: multiple
  source_ref: trompet2024
  uncertainty: 'NO DRUG DEPOT HAS EVER BEEN PLACED IN A HUMAN SECONDARY OSSIFICATION CENTRE FOR ANY PURPOSE.
    The precedents establish that the compartment can be reached with a needle; they do NOT establish that a
    setting fibrin depot placed inside epiphyseal bone distributes as intended, that it does not raise
    intraosseous pressure, or that it is safe. A depot that sets in 10-30 seconds could in principle occlude
    the very vasculature that would otherwise distribute the drug. Needle gauge, exact entry point, and
    whether a drill or a bone-access needle is required are surgical decisions this atlas is not competent to
    specify and belong to the operator.'
- parameter: THE FREQUENCY AND THE COURSE - DERIVED, BECAUSE NOBODY HAS MEASURED IT
  value: 'PULSE DURATION is set by the depot and is roughly 2 to 4 weeks. Basis: the trompet2024 agarose bead
    Gli1-LacZ signal was PRESENT AT ONE WEEK AND GONE BY THREE WEEKS, and he2024sag fibrin released only
    14.2 per cent of payload by 200 hours, i.e. most of the drug is still in the gel at day 8, giving a
    reservoir on the same order.
    INTERVAL is derived at NOT LESS THAN 3 TO 6 MONTHS, from three constraints that all point the same way:
    (i) trompet2024 single three-week input produced an effect that was STILL WIDENING AT SIX MONTHS, so
    redosing earlier means redosing into an effect that has not finished; (ii) orikasa2024 showed PERMANENT
    cell-autonomous activation expands the clone and then CONVERTS IT TO TRABECULAR BONE with femur length
    transiently REDUCED and then equivalent - i.e. sustained activation is not merely less good, it is
    actively harmful; (iii) trompet2024 own sequencing found the SAG-treated stem cells DOWNREGULATE the
    hedgehog pathway as internal compensation, so an interval must be long enough for that compensation to
    reverse.
    COURSE - at bone age 16 with plates radiographically open, the window is of order one to three years,
    giving at most TWO TO SIX DEPOTS PER SITE over the whole course at that interval. Start with ONE site,
    ONE depot, and do not proceed to a second until the six-month readout exists.'
  unit: weeks of exposure; months between pulses; number of depots
  conditions: Derived by this atlas 2026-08-13 from the trompet2024 bead lifetime and effect trajectory,
    orikasa2024 sustained-activation result, and the he2024sag release profile.
  species: not_applicable
  source_ref: trompet2024
  atlas_derived: true
  uncertainty: 'THE INTERVAL IS THE WEAKEST NUMBER IN THE WHOLE PROTOCOL AND IT IS AN INFERENCE, NOT A
    MEASUREMENT. NOBODY HAS EVER GIVEN A SECOND DOSE OF A HEDGEHOG AGONIST TO A GROWTH PLATE IN ANY SPECIES,
    so whether pulses stack, saturate, or exhaust the pool is entirely unknown. The three constraints
    constrain it from BELOW - do not redose sooner - and nothing constrains it from above except the closing
    window. The 3-to-6-month figure is chosen because it is the shortest interval consistent with all three,
    not because it has been tested. Gap g_l7_368a.'
- parameter: WHAT TO MEASURE, AND THE STOP CRITERIA
  value: 'PRIMARY - delta bone age over delta chronological age by BoneXpert on serial standardised left-hand
    films, which R355 and R360 both name as outranking every compound question and which has still not been
    done. Baseline before the first depot.
    GROWTH - standing AND sitting height at a FIXED TIME OF DAY, because the diurnal swing is up to about
    2 cm standing and 0.3 to 0.8 per cent of sitting height against a 1.8 mm measurement standard error, so
    an unstandardised measurement time can hide or fabricate a centimetre of apparent annual growth.
    SITE-SPECIFIC - knee radiographs read for growth-plate width and for the physeal architecture, since the
    predicted local effect is on plate height and resting-zone cellularity and the systemic effect is on
    nothing.
    SAFETY - the treated joint for articular cartilage change (trompet2024 saw NO osteoarthritis at six
    months, which is reassuring and is a rat); skin surveillance, because hedgehog activation is the
    mechanistic inverse of the basal-cell-carcinoma drugs; and, if any systemic route is ever used, that
    surveillance becomes mandatory rather than prudent.
    STOP CRITERIA - stop if plate width increases WITHOUT a corresponding height gain, because that is the
    charge-without-discharge signature this file has recorded eight times; stop if delta bone age over delta
    chronological age ACCELERATES, since that would mean the period is being spent rather than extended; and
    stop if any articular or skin lesion appears.'
  unit: qualitative - monitoring specification
  conditions: Assembled from the atlas standing monitoring requirements (R282 BoneXpert, R319 diurnal
    variation, R355 and R360 the deciding ratio) plus the specific failure modes of this intervention.
  species: not_applicable
  source_ref: trompet2024
  atlas_derived: true
  uncertainty: 'THE STOP CRITERIA ARE DERIVED FROM FAILURE MODES OBSERVED IN OTHER INTERVENTIONS, NOT FROM
    THIS ONE. No one knows what a failing SMO-agonist depot looks like radiographically. The
    plate-widens-without-height signature is borrowed from the VEGF and RANKL closures and may not be the way
    this fails. And the interval between films needed to resolve a real change in delta bone age over delta
    chronological age is months, so the monitoring is slower than the decision to redose.'
- parameter: THE AXIAL PROBLEM, STATED AS A TENSION THE PROTOCOL CANNOT RESOLVE
  value: 'chen2022ihh: systemic vismodegib in ADULT mice reduced Gli1 in intervertebral discs and produced
    VERTEBRAL GROWTH PLATES THAT WERE NARROWED OR FUSED, along with cartilaginous endplate sclerosis,
    degenerate nucleus pulposus, annular fissures and reduced vertebral bone mass, time-dependently over 2 to
    8 weeks of dosing. So the axial plates are hedgehog-maintained on the same logic as the limb plates.
    THE CONSEQUENCE: the mechanism applies to the trunk, the residual height at bone age 16 is
    trunk-dominant, and NO LOCAL DEPOT CAN REACH THE VERTEBRAL PLATES because there are many of them and each
    is small. Trunk coverage therefore requires a SYSTEMIC route - and he2024sag central safety result is
    precisely that a local depot AVOIDS the systemic pathway activation that a systemic route would deliver,
    with Gli1 unchanged in major organs at 7 days against robust activation in multiple Hh-responsive organs
    after intraperitoneal dosing.'
  unit: qualitative - compartment coverage
  conditions: chen2022ihh for the axial dependence; he2024sag for the local-versus-systemic exposure
    comparison; R274 and R318 for the trunk-dominant residual.
  species: mouse
  source_ref: chen2022ihh
  uncertainty: 'chen2022ihh IS A LOSS-OF-FUNCTION EXPERIMENT AND DOES NOT SHOW THAT ADDING HEDGEHOG HELPS THE
    SPINE - it shows that removing it harms the spine, which is the newton2019 asymmetry repeated in a new
    compartment. Whether a systemic agonist would enlarge vertebral resting zones the way a local one
    enlarges a femoral resting zone has never been tested in any species. The tension is therefore real but
    the systemic arm is LESS evidenced than the local arm, not more, and it carries the whole
    basal-cell-carcinoma and medulloblastoma hazard that the local route was chosen to avoid.'
localization:
- the resting zone of the distal femoral and proximal tibial growth plates, reached from the adjacent
  secondary ossification centre which is the physiological source of the maintaining Shh
- the vertebral growth plates, which chen2022ihh shows are hedgehog-maintained and which no local depot can
  reach
human_evidence: absent
human_evidence_note: 'No Smoothened agonist has been given to a human by any route, there are zero registry
  trials, and no drug depot has been placed in a human secondary ossification centre. The fibrin vehicle is
  approved including in patients over one month, but only as a haemostat and only unloaded. Every parameter
  in this specification is scaled, derived or transferred from rodent data.'
species_basis:
- mouse
- rat
- pig
translation_risk: high
translation_risk_reason: 'A protocol assembled from components validated separately in three species and
  never combined, using a research-grade compound with no human exposure, in a compartment no one has dosed,
  at an interval nobody has measured. The single largest scientific unknown is the redosing interval and the
  single largest practical unknown is how a setting fibrin depot behaves inside epiphyseal bone.'
confidence: D
claim_grades:
- claim: SMO agonism at the resting zone acts on the mechanism that actually closes the plate.
  grade: C
  basis: 'THE CHAIN IS COMPLETE AND EACH LINK HAS A PRIMARY. Closure is pool exhaustion with fusion occurring
    as proliferation approaches zero (weise2001); the clock is counted in divisions rather than time
    (marino2008); hedgehog to the resting zone is continuously REQUIRED, since six doses of vismodegib fused
    a normal juvenile plate (newton2019) and systemic vismodegib fused vertebral plates in adults
    (chen2022ihh); and adding hedgehog post-SOC raises resting-zone cell number with proliferation and
    terminal cell size unchanged, i.e. N alone (trompet2024). Grade C because every link is rodent and the
    chain has never been run end-to-end in one experiment.'
- claim: It prevents closure by stopping the clock.
  grade: X
  basis: 'NO, AND THE DISTINCTION MATTERS FOR WHAT TO EXPECT. The clock counts divisions of a finite pool.
    Hedgehog agonism ADDS TO THE POOL, so it extends the number of divisions available before proliferation
    reaches zero. That is why a three-week input produced a gain still widening at six months. It moves the
    budget, not the mechanism, and no experiment in any species has shown a plate held open indefinitely.'
- claim: The pulse interval is 3 to 6 months.
  grade: E
  basis: 'DERIVED, NOT MEASURED, AND IT IS THE WEAKEST NUMBER IN THE PROTOCOL. Three constraints bound it
    from below - the effect was still widening at six months, sustained activation converts the pool to bone
    (orikasa2024), and the treated stem cells compensate by downregulating the pathway. NOBODY HAS EVER GIVEN
    A SECOND DOSE OF A HEDGEHOG AGONIST TO A GROWTH PLATE IN ANY SPECIES, so whether pulses stack, saturate
    or exhaust is unknown.'
- claim: The trunk can be covered by this protocol.
  grade: X
  basis: 'NO. chen2022ihh shows the vertebral plates ARE hedgehog-maintained, so the mechanism applies - but
    there are many small vertebral plates and no depot can reach them. Trunk coverage requires a systemic
    route, and the entire safety case for the local depot is that it AVOIDS systemic pathway activation. The
    two goals are in direct tension and this protocol cannot satisfy both.'
- claim: The dose is 0.5 to 1 mg SAG per depot in 1 to 2 mL of fibrin.
  grade: D
  basis: 'From the he2024sag in vivo concentration range of 100 to 1000 micromolar, cross-checked against
    their own 0.51 mg in vivo gel, the R372 geometry figure of 26 micrograms to hold a whole human epiphysis
    at 100 times EC50, and the 7 microgram rat bead that produced the length gain. Order of magnitude only;
    epiphyseal clearance has never been measured and no upper toxicity bound exists for local hedgehog
    activation in bone.'
- claim: This specification is ready to execute.
  grade: X
  basis: 'NO. Three things are unresolved and only one is scientific. The interval is derived rather than
    measured; the behaviour of a setting fibrin depot inside epiphyseal bone is unknown and could occlude the
    vasculature meant to distribute the drug; and the needle gauge, entry point and whether bone access
    requires a drill are surgical decisions outside this atlas competence. The compound purity question the
    operator has accepted is separate from these.'
key_refs:
- ref_id: newton2019
  year: 2019
  type: primary
  role: the load-bearing link - Shh from the SOC and Ihh from the hypertrophic zone give maximal hedgehog in
    the resting zone, and six doses of vismodegib fused a normal juvenile plate
- ref_id: trompet2024
  year: 2024
  type: primary
  role: the site, the effect, the pulse duration and the pool-only signature - resting-zone cells 65.5 to
    139.8 per mm2 with proliferation and terminal cell size unchanged, from a bead whose signal was gone by
    three weeks
- ref_id: chen2022ihh
  year: 2022
  type: primary
  role: the axial half - systemic SMO inhibition narrowed or fused VERTEBRAL growth plates in adult mice,
    which extends the mechanism to the trunk and creates the tension a local depot cannot resolve
- ref_id: he2024sag
  year: 2024
  type: primary
  role: the vehicle, its loading and release, and the demonstration that a local depot avoids the systemic
    pathway activation a systemic route would deliver
- ref_id: orikasa2024
  year: 2024
  type: primary
  role: why the schedule must be pulsed - permanent activation expands the clone then converts it to
    trabecular bone with no final length gain
- ref_id: weise2001
  year: 2001
  type: primary
  role: closure is pool exhaustion - seven parameters decline spontaneously, oestrogen accelerates all seven
    and initiates none, and fusion occurs abruptly as proliferation approaches zero
- ref_id: marino2008
  year: 2008
  type: primary
  role: the clock is counted in divisions rather than time, which is why enlarging the pool extends the
    period
open_questions:
