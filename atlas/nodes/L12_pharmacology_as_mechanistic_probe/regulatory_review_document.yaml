confidence: A
claim_grades:
  - claim: Label pharmacokinetics for the agents in this layer are retrievable without authentication via the openFDA drug label API.
    grade: A
    basis: Eight labels retrieved directly in this sweep with structured sections including clinical pharmacology and pediatric use.
  - claim: Regulatory documents contain quantitative pharmacology absent from the primary literature.
    grade: A
    basis: The vosoritide and navepegritide half-lives and the vosoritide cGMP saturation dose appear in labelling and not in the pivotal trial reports.
  - claim: No agent's regulatory dossier contains growth plate tissue distribution data.
    grade: C
    basis: True of the labelling retrieved, but the full pharmacology/toxicology review PDFs were not read, so a sponsor tissue distribution study could exist unread.
