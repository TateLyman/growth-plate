localization:
  - "in vitro human iPSC-derived cartilage: degraded cartilage phenotype corrected by statin"
  - "human growth plate: no in vivo human data of any kind"
human_evidence: indirect
human_evidence_note: >-
  The human evidence is patient-derived iPSC chondrogenic cultures, not treated patients;
  no human in vivo growth data exist.
species_basis: [ipsc_derived, mouse]
translation_risk: high
translation_risk_reason: >-
  An iPSC chondrogenic pellet has no vasculature, no zonal architecture, no mechanical
  loading and no systemic endocrine input, so it cannot report on the diffusion-limited
  delivery problem that defeats other agents. The supporting in vivo data are murine.
confidence: D
claim_grades:
  - claim: Statin treatment corrects the degraded-cartilage phenotype of TD1 and achondroplasia patient iPSC chondrogenic cultures.
    grade: D
    basis: Single high-profile study, not independently replicated in the twelve years since.
  - claim: Statins increase bone growth in achondroplasia model mice.
    grade: D
    basis: Same single study; no independent replication located.
  - claim: Statins would increase linear growth in children with achondroplasia.
    grade: X
    basis: Repeated in reviews as a candidate therapy but traceable to no human in vivo data at all.
