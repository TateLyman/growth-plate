contradicts:
- 'WITHDRAWS A QUANTITATIVE CLAIM MADE IN ROUND 121 AND CARRIED IN vosoritide_is_cleared_by_npr3. That node
  records free CNP-38 binding NPR-C at least 38-fold more tightly than NPR-B, from FDA Table 50 SPR. Three
  independent radioligand sources, including a direct saturation measurement in brown1992 at 0.41 nM,
  place CNP-NPR-C affinity 577-fold weaker than the SPR value. The SPR number is treated here as an
  avidity artefact on an immobilised homodimeric receptor, reported at an assay floor.'
