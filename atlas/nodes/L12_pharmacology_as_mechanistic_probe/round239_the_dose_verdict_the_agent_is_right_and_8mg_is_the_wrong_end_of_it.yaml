id: round239_the_dose_verdict_the_agent_is_right_and_8mg_is_the_wrong_end_of_it
name: >-
  ROUND 239 - THE DOSE VERDICT. Erdafitinib is the right agent and the FGFR arm is the only settled lever,
  but 8 mg sits ABOVE every exposure any child has ever been observed in, buys zero marginal growth on the
  only two anchored points, and spends the one variable that still pays - duration
type: hypothesis
layer: L12
aliases:
- the dose verdict
- 8 mg is the wrong end
- lowest saturating dose
- settled on velocity not on adult height
- round 239
stub: false
summary: |
  THE PROPOSAL IS THAT THE FGFR ARM IS THE ONLY SETTLED LEVER FOR NOW, THAT ERDAFITINIB IS THE AGENT, AND
  THAT 8 mg IS FINE. THE FIRST TWO ARE RIGHT. THE THIRD IS THE ONE THING IN THIS PROGRAMME THE EVIDENCE
  MOST DIRECTLY CONTRADICTS.

  WHERE THE PROPOSAL IS CORRECT AND SHOULD BE ADOPTED.

  ERDAFITINIB IS THE AGENT, BY AVAILABILITY (CORR-245) - Debio1347's development is halted, dabogratinib is
  investigational only, infigratinib is not approved for this, and every marketed FGFR inhibitor is
  pan-FGFR. THE FGFR1 COST IS UNAVOIDABLE RATHER THAN CHOSEN.

  IT IS MATURATION-CHEAP, AND ROUND 236 WAS TOO PESSIMISTIC ABOUT THIS (CORR-249). No measurable advance in
  skeletal maturation over five months in a boy growing at 19.6 cm/year, and propel3_2026's randomised NO
  ACCELERATED PROGRESSION OF BONE AGE in achondroplasia - two independent human observations, different
  populations, different agents of the same class, pointing the same way.

  AND THE GROWTH EFFECT IS THE LARGEST AND BEST-DOCUMENTED IN THE FIELD. Three quantified children at 19.6,
  19.1 and about 10 cm/year, a 7-of-7 cohort gaining a mean +1.20 height SD, and one patient at +2.43 SD
  over forty months. Nothing else in this stack has that.

  WHERE IT IS WRONG, AND THE NUMBER IS THE PROBLEM.

  8 mg IS 4.58 TIMES THE CELLULAR FGFR3 IC50 IN FREE PLASMA. THE ENTIRE OBSERVED HUMAN EXPERIENCE IN
  NORMAL-FGFR3 CHILDREN RUNS FROM 1.72 TO 4.01 - that is 3 mg to 7 mg, and every one of those children had
  a dose REDUCTION partway. NO CHILD WITH A NORMAL FGFR3 HAS EVER RECEIVED 8 mg AND BEEN MEASURED. 8 mg is
  not the top of the evidence, it is past the end of it.

  AND ACROSS THE RANGE THAT HAS BEEN OBSERVED, MORE DOSE BOUGHT NOTHING. The child on 5-then-3 mg grew 19.6
  cm/year. The child on 7-then-5 mg grew 19.1. A rise across a 1.72-to-4.01 span of the coverage axis
  returned MINUS 2.6 PER CENT of velocity. THE RESPONSE IS SATURATED AT THE BOTTOM OF THE CLINICAL RANGE,
  and 8 mg is 2.7 times the exposure at which the maximum observed velocity was already achieved.

  MEANWHILE EVERY COST SCALES WITH DOSE AND ALL OF IT IS FGFR1. Hyperphosphataemia about 75 per cent, the
  commonest cause of dose interruption at 24 per cent; the label's own escalation from 8 to 9 mg is
  TRIGGERED BY A SERUM PHOSPHATE BELOW 5.5 mg/dL, which means the dosing rule at exactly this point is
  titrating toward the toxicity arm rather than the growth one (round 233). Slipped epiphyses ran 3 of 7 in
  farouk2023 and 1 of 11 in RAGNAR. Central serous retinopathy is dose-limiting and is FGFR1/2.

  SO 8 mg BUYS NO DEMONSTRATED GROWTH AND SPENDS THE ONLY VARIABLE THAT STILL PAYS. Rounds 228, 229 and 234
  converge on DURATION as the sole remaining lever, and CORR-246 established that interruption is not
  inherent - the FDA series' universal discontinuation happened because accelerated growth was classified
  as the adverse event, which does not transfer here. What genuinely ends exposure is mechanical failure,
  ocular toxicity and phosphate at or above 10 mg/dL for over two weeks - ALL THREE DOSE-DEPENDENT, TWO OF
  THEM FGFR1.

  THE ARITHMETIC THAT SETTLES IT. Six months at 19.6 cm/year is about 9.8 cm. farouk2023 subject 3 ran
  FORTY MONTHS and moved from the 83rd centile to above the 99.9th, +2.43 height SD. THE DIFFERENCE BETWEEN
  SIX MONTHS AND FORTY MONTHS OF TOLERATED EXPOSURE DWARFS ANYTHING THE DOSE AXIS CAN OFFER, because the
  dose axis offers zero. ANY MILLIGRAM THAT SHORTENS THE COURSE IS A MILLIGRAM THAT COSTS HEIGHT.

  THE HONEST CASE FOR MORE DOSE, STATED BECAUSE IT IS NOT NOTHING. The saturation finding rests on TWO
  CHILDREN, one of whom was also on growth hormone, and both of whom had mid-course reductions - so neither
  has a clean exposure. If saturation is wrong, underdosing costs height directly and irreversibly. And
  round 235's cartilage bound puts the cartilage-to-plasma free ratio at ORDER UNITY rather than exactly
  one, so a ratio below one would argue for headroom. THE ASYMMETRY IS REAL - underdosing and overdosing
  both cost height, by different routes. WHAT DECIDES IT is that the dose-response is measured and flat
  while the toxicity-response is measured and steep.

  AND THE FRAME NEEDS ONE CORRECTION THAT MATTERS MORE THAN THE DOSE. THE FGFR ARM IS SETTLED ON VELOCITY,
  NOT ON ADULT HEIGHT. Every human datum in this file is centimetres per year or height SD over months.
  NOBODY HAS EVER TAKEN AN FGFR INHIBITOR TO FINAL HEIGHT. Round 198's objective function is RESERVE TIMES
  TERMINAL CELL HEIGHT, and a bone age does not read reserve (CORR-249) - a plate can be run hard, spend
  its clonal capacity and fuse abruptly without looking older in the interim. The only longitudinal hint is
  ambiguous: subject 3's annualised 0.73 SD/year over forty months against 1.02 to 2.45 SD/year in the
  five-month children, which is consistent with deceleration as reserve depletes and equally consistent
  with his being older and nearer fusion.
quantitative:
- parameter: 8 mg against the observed human evidence, on the free FGFR3 coverage axis
  value: >-
    free steady-state average as a multiple of erdafitinib's own Ba/F3 cellular FGFR3 IC50 - 3 mg = 1.72x,
    5 mg = 2.86x, 7 mg = 4.01x, 8 mg = 4.58x, 9 mg = 5.16x. THE ENTIRE OBSERVED EXPERIENCE IN NORMAL-FGFR3
    CHILDREN SPANS 1.72 TO 4.01 - the child on 5-then-3 mg grew 19.6 cm/year and the child on 7-then-5 mg
    grew 19.1, a difference of MINUS 2.6 PER CENT across that span. 8 mg IS 2.7 TIMES THE EXPOSURE AT WHICH
    THE MAXIMUM OBSERVED VELOCITY WAS ALREADY ACHIEVED, and no child with a normal FGFR3 has received it
  unit: multiples of cellular IC50, mg, and cm/year
  conditions: round 213's free-coverage table against round 228's unspliced velocities
  species: human
  source_ref: nadeaunguyen2026
  uncertainty: >-
    TWO CHILDREN, one on growth hormone throughout (CORR-248), both with mid-course dose reductions, so
    neither has a clean exposure and the flat curve is thin. If saturation is wrong, underdosing costs
    height irreversibly. The coverage axis also inherits erdafitinib's 0.3 per cent unbound fraction and a
    Ba/F3 transfected-cell IC50 standing in for a chondrocyte
  value_unverified: true
- parameter: what the dose axis costs, all of it FGFR1 and all of it dose-dependent
  value: >-
    hyperphosphataemia about 75 per cent and the commonest cause of dose interruption at 24 per cent; the
    label escalates 8 to 9 mg when serum phosphate is BELOW 5.5 mg/dL, so the dosing rule at this exact
    point titrates toward the toxicity arm; permanent discontinuation at phosphate 10 mg/dL or above for
    over two weeks; slipped capital femoral epiphysis 3 of 7 in farouk2023 and 1 of 11 in RAGNAR's
    paediatric cohort; central serous retinopathy dose-limiting and FGFR1/2-mediated
  unit: per cent incidence and threshold
  conditions: BALVERSA label plus the two paediatric cohorts with denominators
  species: human
  source_ref: balversa_label_2025
  uncertainty: >-
    The incidences are ADULT ONCOLOGY figures and the slip rates come from small paediatric series without
    proper denominators in the pharmacovigilance arm. What is not in doubt is the DIRECTION - every one of
    these scales with exposure, and the growth does not
- parameter: duration against dose, in centimetres
  value: >-
    six months at 19.6 cm/year is about 9.8 cm, which is roughly the FDA series' median time to event.
    farouk2023 subject 3 ran FORTY CONTINUOUS MONTHS and moved from the 83rd height centile to above the
    99.9th, +2.43 SD, an excess of 16.7 cm over his own centile track. THE MARGINAL GROWTH FROM 3 mg TO 7 mg
    IS MINUS 2.6 PER CENT
  unit: months of exposure against centimetres
  conditions: farouk2023 Table 1 with the CDC 2000 reference; nadeaunguyen2026 for onset intervals
  species: human
  source_ref: farouk2023
  uncertainty: >-
    Subject 3 was on DEBIO1347 rather than erdafitinib (CORR-235), so a forty-month erdafitinib course in a
    child is unobserved, and his annualised rate of 0.73 SD/year was LOWER than the five-month children's,
    which may be deceleration or may be age
localization:
- 'the kidney, which is what the label titrates on and which is not the growth target'
- 'the calendar, which is where the remaining height actually is'
human_evidence: direct
human_evidence_note: >-
  Two quantified children on the coverage axis, one 7-patient cohort, one 40-month exposure, and a
  regulatory label with dosing rules and denominators. All human.
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  Human children on the drug class at human doses. The limits are sample size and the absence of any
  adult-height endpoint, not species.
confidence: B
claim_grades:
- claim: erdafitinib is the right agent and the FGFR arm is the only settled lever for now
  grade: B
  basis: >-
    AGREED. It is the only obtainable agent (CORR-245), it has the largest and best-documented human growth
    effect in the field, and it now looks maturation-cheap on two independent human observations (CORR-249)
- claim: 8 mg is a reasonable dose on the present evidence
  grade: X
  basis: >-
    NO. 8 mg is 4.58 times the cellular IC50; the entire observed human experience in normal-FGFR3 children
    spans 1.72 to 4.01, and across that span more dose returned MINUS 2.6 per cent of velocity. No child
    with a normal FGFR3 has received 8 mg and been measured, every cost scales with dose, and the label's
    escalation at exactly this point is triggered by a phosphate reading rather than anything to do with growth
- claim: the correct posture is the lowest dose that still saturates
  grade: C
  basis: >-
    FOLLOWS FROM A FLAT MEASURED DOSE-RESPONSE AND A STEEP MEASURED TOXICITY-RESPONSE, with duration as the
    only lever left. Held at C because the flat curve rests on two confounded children and the bottom of
    the plateau has never been mapped below 1.72 times IC50
- claim: the FGFR arm is settled
  grade: E
  basis: >-
    SETTLED ON VELOCITY, NOT ON ADULT HEIGHT. Every human datum is cm/year or height SD over months, and
    NOBODY HAS EVER TAKEN AN FGFR INHIBITOR TO FINAL HEIGHT. Round 198's objective is reserve times terminal
    cell height, and no bone age reads reserve
- claim: the FGFR arm should be closed and not revisited
  grade: X
  basis: >-
    EXPLICITLY REJECTED, and the user said so first. Named reopeners - any adult-height outcome in a treated
    child; the physeal-width-against-length-gain ratio from the unpublished MSKCC serial tibial films; a
    blinded staged reading of the four published hand films; any eugonadal child with two bone ages; and the
    bottom of the dose-response below 1.72 times IC50
