contradicts:
- >-
  The proposal that 8 mg is a reasonable dose. It sits above the entire observed human range, buys minus 2.6
  per cent of velocity across the span that has been observed, and spends duration - the only lever rounds
  228, 229 and 234 left standing.
- >-
  Any reading of this round as closing the FGFR arm. It is settled on VELOCITY and unsettled on ADULT
  HEIGHT, which is the quantity the programme exists to maximise.
