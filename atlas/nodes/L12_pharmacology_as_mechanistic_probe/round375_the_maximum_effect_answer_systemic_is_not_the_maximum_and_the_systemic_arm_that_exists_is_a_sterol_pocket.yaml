contradicts:
- claim: R374 and R373 treated the systemic route as the option to escalate to if a bigger effect were needed, on
    the grounds that R368 had withdrawn the "the route must be local" line.
  resolution: 'R368''s withdrawal STANDS - the systemic arm was a cell-count arm and was never given a powered length
    test, so its null is a gap in power. What R375 adds is different and it bounds the escalation: mao2026sag shows
    the SAME dose suppresses proliferation, so there is no headroom to escalate INTO. Systemic remains untested
    on length and is now also capped.'
- claim: R369 recorded that the corticosteroid class splits on hedgehog direction, with four FDA-approved topical
    steroids acting as SMO agonists in a Gli reporter.
  resolution: The split survives and gains a mechanism, but the balance moves against the corticosteroid route.
    lu2025cortisol shows the ENDOGENOUS glucocorticoid is a competitive CRD ANTAGONIST, and heine2011sag's whole
    premise is that glucocorticoids INHIBIT Shh-Smo signalling. So the halogenated topical agonists are the exception
    within a class whose default direction is inhibitory, and any systemic exposure to them would compete at the
    same pocket cortisol occupies. Treat R369's window table as a ranking of an unusable route, not as a candidate.
