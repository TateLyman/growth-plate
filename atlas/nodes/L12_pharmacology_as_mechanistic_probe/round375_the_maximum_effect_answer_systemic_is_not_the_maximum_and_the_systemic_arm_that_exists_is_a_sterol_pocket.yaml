stub: false
summary: 'The operator asked for the MAXIMUM effect, said to take the systemic route if systemic is bigger, asked
  for pulse number and duration, and asked for everything that could go wrong to be found and fixed. All four are
  answered below and the first answer is NO - systemic is not bigger, and the reason is a measurement rather than
  a caution.

  ⛔⛔ ONE - SYSTEMIC IS NOT THE MAXIMUM, AND THE CEILING IS AT EXACTLY THE DOSE THAT MOVES THE POOL. The only systemic
  schedule ever run on a growth plate is trompet2024, SAG 25 micrograms per gram i.p. once daily P31-P37, and on
  LENGTH IT WAS NULL - tibia P=0.29, femur P=0.247. mao2026sag then gives the mechanism for why pushing that dose
  does not help: a single i.p. SAG injection AT THE SAME 25 mg/kg produced its developmental defects through REDUCED
  PROLIFERATION and delayed G0/G1 progression, with NO change in apoptosis. In a growth plate that is the wrong
  direction. → THE SYSTEMIC ROUTE HAS AN ANTI-PROLIFERATIVE CEILING AT THE POOL-MOVING DOSE, so raising the dose
  does not raise the effect. Against that, ONE 7 MICROGRAM LOCAL BEAD gave femur +2.75 / +2.64 / +3.63 percent at
  1 / 2 / 6 months, 6/6, 9/9 and 8/8 animals, with the gain STILL WIDENING at six months. LOCAL HAS BOTH THE DEMONSTRATED
  LENGTH EFFECT AND THE HIGHER CEILING.

  ⭐⭐ TWO - AND THE AGE SIGN FLIP IS INSIDE trompet2024 ITSELF, WHICH THIS FILE HAD NEVER EXTRACTED. THE SAME DOSE,
  THE SAME ROUTE AND THE SAME DRUG GIVE OPPOSITE RESULTS THREE WEEKS APART. Treatment on P10-P16 REDUCED overall
  clone size, especially clones containing more than four cells, with singlets, doublets and triplets unchanged.
  Treatment on P30-P36 had the OPPOSITE effect - it REDUCED the number of single labelled cells and INCREASED doublets
  and triplets, i.e. the stem cells divided. → THIRD INDEPENDENT INSTANCE OF THE SECONDARY-OSSIFICATION-CENTRE RULE,
  after cheng2025 stating it in both directions and after orikasa2024 inducing at P6 versus trompet2024 dosing at
  P28-P32. A subject at bone age 16 is as far post-SOC as it is possible to be, which is the favourable side on
  all three lines. ⭐ It also rescues something from the systemic arm: at the RIGHT age systemic SAG moved the clone
  distribution in the RIGHT direction - it simply did not move a bone over a seven-day pulse read at P37.

  ⭐⭐⭐⭐ THREE - THE FINDING OF THE ROUND. SUSTAINED Gli1 IS BENEFICIAL WHEN IT COMES FROM REMOVING A SECRETED ANTAGONIST
  AND HARMFUL WHEN IT IS CELL-AUTONOMOUS, AND THAT IS NOW FOUR CELL TYPES TO ONE. · SECRETED-ANTAGONIST REMOVAL
  - haraguchi2025 states PROGRESSIVE growth-plate expansion and long-bone OVERGROWTH TOGETHER WITH SUSTAINED UPREGULATION
  OF Gli1. Sustained, and it keeps working to 53 weeks. · CELL-AUTONOMOUS, PTHrP-positive stem cells - orikasa2024,
  permanent Ptch1 deletion: expansion, then reversal at P56-P70, no difference by P96, descendants become trabecular
  osteoblasts, femur transiently SHORTER and finally null. · CELL-AUTONOMOUS, Dlx5-positive endosteal osteoblast
  precursors - dlx5hh2026, Ptch1 deletion shifted their fate toward MARROW ADIPOCYTES with cortical and trabecular
  thinning and SPONTANEOUS FRACTURES. · CELL-AUTONOMOUS, in the maturation screen - R311, Ptch1 KO +6.004 and Sufu
  KO +3.628 = matures EARLY. ⭐ AND THERE IS A MECHANISTIC REASON, NOT JUST A PATTERN: PTCH1 IS ITSELF A GLI TARGET,
  SO IT IS THE PATHWAYS OWN NEGATIVE FEEDBACK. Removing HHIP leaves that feedback intact and the system re-equilibrates
  at a higher setpoint. Deleting Ptch1 - or occupying Smoothened directly with an agonist - acts DOWNSTREAM of it
  and therefore CANNOT SELF-LIMIT. → CORR-300 reached a fifth time, now with the reason. ⛔ THE CONSEQUENCE FOR THE
  MAXIMUM: THE TRUE MAXIMUM IS HHIP BLOCKADE, NOT SMO AGONISM - and R294 already established that no HHIP-directed
  agent exists in any species. SMO AGONISM IS THE OBTAINABLE SECOND-BEST, AND BECAUSE IT SITS BELOW THE FEEDBACK
  NODE IT MUST BE PULSED. A pulse is not a compromise for safety; it is what substitutes for the feedback the molecule
  bypasses.

  ⭐⭐⭐ FOUR - THE SYSTEMIC ARM THAT ACTUALLY EXISTS IS NOT A DRUG. IT IS THE STEROL OCCUPANCY OF THE SMOOTHENED CYSTEINE-RICH
  DOMAIN, AND THE ATLAS HAS NEVER NAMED THE POCKET AS A LAYER. Six ligands of one site, every one systemic and every
  one modifiable: · CHOLESTEROL - the endogenous agonist; yu2026smo puts it at the CRD FIRST, before the transmembrane
  site. · CORTISOL - lu2025cortisol: COMPETES WITH CHOLESTEROL AT THE CRD AND INHIBITS, and the claim is mutation-verified
  by a CRISPR SMO L116A knock-in that is no longer inhibited by cortisol. · VITAMIN D3 - bijlsma2006: binds SMO
  with high affinity, cyclopamine-sensitive, phenocopies the SMO null. · 7-DHC-DERIVED B-RING OXYSTEROLS - sever2016:
  INHIBIT SMO, and DEPLETING 7-DHC ENHANCED HEDGEHOG ACTIVATION BY AN AGONIST, i.e. the potentiating direction was
  done. · SIDE-CHAIN OXYSTEROLS - 20(S)-hydroxycholesterol, a natural SMO AGONIST at the same extracellular domain.
  · ITRACONAZOLE AND POSACONAZOLE - kim2010itra, chen2016posa: prevent ciliary accumulation of SMO at ordinary antifungal
  exposure. ⭐ THIS IS R287s LAYER MOVE APPLIED TO A RECEPTOR POCKET INSTEAD OF THE EXTRACELLULAR SPACE, AND IT IS
  THE ONLY SYSTEMIC HEDGEHOG LEVER THAT NEEDS NO UNOBTAINABLE DRUG - AND THE ONLY ONE THAT REACHES THE TRUNK, which
  a knee depot cannot. It is made entirely of subtractions, which is why it was invisible to every compound sweep.

  ⛔⛔ FIVE - THE NEW CONTRAINDICATION CLASS, AND SEVERAL MEMBERS ARE PRESCRIBED TO ADOLESCENTS. Raising 7-dehydrocholesterol
  raises an endogenous SMO inhibitor (sever2016), and R362 shows hedgehog input to the resting zone is REQUIRED
  to prevent fusion. wages2018 screened an FDA-approved library in a neural cell line: OVER 20 PERCENT OF THE COLLECTION
  IMPACTS CHOLESTEROL BIOSYNTHESIS AND 75 COMPOUNDS ALTER 7-DHC. tallman2025 names them in human dermal fibroblasts
  - primarily DHCR7 inhibitors CARIPRAZINE, NEBIVOLOL, ROTIGOTINE; combined DHCR7 BUSPIRONE, LURASIDONE and HYDROXYZINE;
  EBP inhibitor FLUOXETINE; AMIODARONE; multi-enzyme VILAZODONE and ZIPRASIDONE - and korade2013 adds ARIPIPRAZOLE
  and TRAZODONE in people with two working DHCR7 copies. HYDROXYZINE IS A COMMON ANTIHISTAMINE AND FLUOXETINE, ARIPIPRAZOLE,
  TRAZODONE AND BUSPIRONE ARE ROUTINELY PRESCRIBED TO ADOLESCENTS. ⚠ Grade E for a skeletal claim - no bone, no
  growth plate and no height endpoint exists for any of them - but it is free to ask and free to substitute. ✓ HUMAN
  GENETIC ANCHOR THAT THE AXIS REACHES STATURE: Smith-Lemli-Opitz syndrome, DHCR7 loss, phenocopies deficient hedgehog
  signalling and includes short stature.

  ⛔ SIX - AND THE WORRY I RAISED AND THEN CLOSED WITH HUMAN HEIGHT DATA, RECORDED BECAUSE IT IS THE HONEST HALF.
  If cholesterol is SMOs endogenous agonist then lowering cholesterol should attenuate hedgehog and cost height,
  which would make statins a contraindication. IT DOES NOT. humphries2018, UK Paediatric Familial Hypercholesterolaemia
  Register, 300 children, LDL reduced 31 percent: AGE-ADJUSTED ANNUAL HEIGHT INCREASE 4.45 cm ON STATIN VERSUS 4.60
  cm OFF, P = 0.73. The propranolol move (R337) applied to cholesterol lowering. A real mechanistic worry, checked
  against a human height endpoint, null.

  ⭐⭐ SEVEN - THE DELIVERY STEP IS NOT NOVEL AND THE ATLAS HAD NEVER NAMED THE HUMAN PROCEDURE. abusalem2026: INTRAOSSEOUS
  INJECTION INTO THE SUBCHONDRAL BONE OF THE HUMAN KNEE is an established image-guided procedure - 24 studies, 1,109
  patients, 5 randomised controlled trials, mean follow-up 38 months, favourable safety for platelet-rich plasma
  and mesenchymal stem cells. And sarrami2025 bounds the physeal injury from the opposite extreme: an 8.2 mm tunnel
  DRILLED STRAIGHT THROUGH an open physis in 14-year-old males gave physeal bars in 2 of 48 (4.2 percent), all tibial,
  none femoral, WITH NO LEG-LENGTH DISCREPANCY AT 12 MONTHS. → A FINE NEEDLE PLACED IN EPIPHYSEAL CANCELLOUS BONE
  THAT NEVER CROSSES THE PHYSIS SITS FAR BELOW A BOUND THAT IS ALREADY SMALL. Only the payload is new.

  ⛔ EIGHT - THE FAILURE MODE NOTHING IN THIS FILE HAD RAISED, AND IT IS SPECIFIC TO PUTTING THIS DRUG IN BONE. lee2016sagcalv:
  SAG at 0.5-1.0 mM in a PLGA/hydroxyapatite scaffold in a bone defect gave a SIGNIFICANT DOSE-DEPENDENT INCREASE
  IN BONE FORMATION ON EVERY PARAMETER AND AN INCREASE IN BLOOD VESSEL NUMBER AND DENSITY - the authors call SAG
  pro-osteogenic and pro-vasculogenic in bone. R365 established that VASCULAR INVASION IS THE TERMINAL EVENT OF
  PHYSEAL CLOSURE. → AN INTRAOSSEOUS SMO-AGONIST DEPOT COULD ACCELERATE THE FRONT THAT CLOSES THE PLATE. ✓ Bounded,
  and not fatal: the trompet2024 bead held ~9.5 mM in its own volume, an order of magnitude ABOVE the calvarial
  scaffold, and produced a LONGER bone with no osteoarthritis at six months; and the calvarial model is an INJURY
  in INTRAMEMBRANOUS bone, so CORR-203 applies. FIX: place the depot in mid-epiphyseal cancellous bone rather than
  at the chondro-osseous junction, PULSE rather than sustain, and read out plate width and the metaphyseal vascular
  front, not only length.

  ⛔ NINE - THE ARTICULAR COST, PRICED. lin2009hh: hedgehog is ACTIVATED in human osteoarthritic cartilage, higher
  hedgehog in chondrocytes causes MORE SEVERE osteoarthritis across several mouse lines via RUNX2 and ADAMTS5, and
  blockade attenuates it in mice and in human explants. FIX: the route is INTRAOSSEOUS, not intra-articular - and
  trompet2024 looked, reporting no signs of osteoarthritis six months after the SOC bead. The joint is the compartment
  to keep the drug OUT of, which is an argument for the SOC route over the easier intra-articular one.

  ⭐ TEN - AND THE PULSE LENGTH HAS A TOLERABILITY PRECEDENT IN A DEVELOPING MAMMAL AT EXACTLY THE PROPOSED DURATION.
  heine2011sag: transient ONE-WEEK systemic SAG treatment of neonatal animals was well tolerated and DID NOT PROMOTE
  TUMOUR FORMATION, despite the known association of hedgehog with neoplasia. It is the same schedule trompet2024
  used. ⚠ Cerebellum, neonatal, no skeletal endpoint.

  ⭐ ELEVEN - THE MAXIMISED PROTOCOL, EVERY PARAMETER WITH ITS BASIS. See the quantitative block. The short form:
  FOUR EPIPHYSES (distal femur and proximal tibia, bilaterally), TWO DEPOTS EACH, because a 19-33 mm diffusion reach
  over a three-week depot lifetime against a 35-40 mm half-width means one central depot reaches most of an epiphysis
  and two cover it. PULSE LENGTH THREE WEEKS, set by the beads own measured lifetime - Gli1 reporter present at
  one week, GONE BY THREE WEEKS. INTERVAL AT LEAST THREE MONTHS AND PREFERABLY SIX, reasoned rather than measured.
  TWO TO FOUR PULSES PER SITE PER YEAR AT MOST.

  ⛔⛔ TWELVE - WHAT IS STILL NOT FIXED, STATED SO THE NEXT ROUND CANNOT CALL IT NEW. · NO GMP SAG EXISTS AND NO SMOOTHENED
  AGONIST HAS EVER BEEN GIVEN TO A HUMAN. Re-queried this round: clinicaltrials.gov returns ZERO Smoothened-agonist
  studies; the only hedgehog entries are ANTAGONISTS. · THE PULSE INTERVAL HAS NEVER BEEN MEASURED IN ANY SPECIES.
  It is derived below, not observed. · EPIPHYSEAL CLEARANCE OF ANY SMO AGONIST HAS NEVER BEEN MEASURED, so the depot
  payload rests on a fill calculation that is a LOWER BOUND, not a dose. · THE TRUNK IS STILL NOT COVERED BY THE
  DEPOT. The only systemic arm available is the sterol-occupancy one, which is a set of subtractions and has no
  length endpoint anywhere.

  🧭 THIRTEEN - THE RANKING, WHICH IS THE ACTUAL ANSWER TO "MAXIMUM EFFECT": 1. HHIP FUNCTION-BLOCKING BINDER - the
  true maximum. Human pLoF +9.92 cm; haraguchi2025 holds a normal plate open to 53 weeks with the zones ORDERED;
  and because it sits ABOVE Ptch1 it retains the feedback that makes sustained activation safe. NO AGENT IN ANY
  SPECIES. 2. LOCAL PULSED SMO-AGONIST DEPOT IN THE SECONDARY OSSIFICATION CENTRE - the obtainable second-best.
  The only length endpoint on this axis, the human delivery procedure already exists, and the chemistry is purchasable.
  Blocked on GMP material alone. 3. SYSTEMIC STEROL-OCCUPANCY MANAGEMENT OF THE SMO CRD - free, available today,
  and the only arm that reaches the trunk. No length endpoint anywhere. 4. SYSTEMIC SMO AGONIST - NOT the maximum.
  Null on length at the only dose ever tested and anti-proliferative at that same dose.'
