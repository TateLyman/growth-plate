id: round375_the_maximum_effect_answer_systemic_is_not_the_maximum_and_the_systemic_arm_that_exists_is_a_sterol_pocket
name: Round 375 - THE MAXIMUM-EFFECT ANSWER. Systemic is NOT the bigger effect and the reason is measured; sustained
  Gli1 is safe only when it comes from removing a SECRETED antagonist, which makes HHIP the true maximum and SMO
  agonism the obtainable second-best; and the systemic arm that actually exists is not a drug at all - it is the
  sterol occupancy of the Smoothened cysteine-rich domain, which is entirely free, reaches the trunk, and this atlas
  had never named it
