human_evidence: absent
human_evidence_note: 'No Smoothened agonist has been administered to a human by any route and a re-query of clinicaltrials.gov
  this round returned ZERO Smoothened-agonist studies - the only hedgehog entries are antagonists. What IS human
  here is peripheral to the agonist: the intraosseous knee injection procedure (abusalem2026, 1,109 patients), the
  physeal-injury bound (sarrami2025), the statin height null (humphries2018), the osteoarthritis direction (lin2009hh,
  human osteoarthritic samples and human explants), and the Smith-Lemli-Opitz phenocopy of deficient hedgehog signalling.'
