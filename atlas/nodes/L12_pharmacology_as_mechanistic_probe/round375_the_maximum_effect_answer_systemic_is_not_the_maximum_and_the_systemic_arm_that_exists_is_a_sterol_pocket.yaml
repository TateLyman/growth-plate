- compartment: secondary ossification centre
  claim: the physiological source of the Shh that reaches the resting zone, and therefore the correct depot site;
    also the compartment a human subchondral intraosseous injection already targets
  source: newton2019
- compartment: endosteal bone marrow
  claim: contains Dlx5-positive osteoblast precursors whose cell-autonomous hedgehog activation shifts them to adipocytes
    with bone thinning and spontaneous fractures - the resident population an intraosseous depot exposes
  source: dlx5hh2026
- compartment: articular cartilage
  claim: the compartment to keep the drug OUT of - higher hedgehog in chondrocytes causes more severe osteoarthritis
