translation_risk: high
translation_risk_reason: The core length result is a single rat experiment with a surgically placed bead; the pulse
  interval is derived rather than observed; epiphyseal clearance has never been measured for any SMO agonist; and
  no Smoothened agonist has ever been given to a human. What has improved since R373 is that three specific failure
  modes now have named primaries and named fixes rather than being unexamined.
confidence: D
claim_grades:
- claim: systemic SMO agonism is not the maximum-effect route
  grade: C
  basis: a measured null on length at the only systemic schedule ever run on a growth plate, plus an independent
    demonstration that the same dose suppresses proliferation
- claim: SAG has opposite effects on resting-zone clones before and after SOC formation
  grade: C
  basis: stated in trompet2024 for two dosing windows in the same paper, same dose and route
- claim: sustained Gli1 elevation is beneficial only when achieved by removing a secreted antagonist
  grade: C
  basis: four cell-autonomous activations with bad outcomes against one secreted-antagonist removal with a good
    one, plus the mechanistic reason that Ptch1 is itself a Gli target
- claim: the SMO cysteine-rich domain is a systemic, modifiable sterol-competition hub
  grade: C
  basis: cholesterol, cortisol, vitamin D3, B-ring oxysterols and side-chain oxysterols all act at the same extracellular
    domain, each with its own primary; the cortisol arm is mutation-verified
- claim: DHCR7-inhibiting medications attenuate hedgehog at the growth plate
  grade: E
  basis: chains sever2016's 7-DHC-to-SMO inhibition onto fibroblast and neural-cell sterol profiles; no bone, growth
    plate or height endpoint exists for any of these drugs in any species
- claim: an intraosseous SMO-agonist depot risks accelerating the vascular front
  grade: D
  basis: lee2016sagcalv is an injury model in intramembranous bone and the trompet2024 bead was at higher local
    concentration and lengthened bone; recorded as a failure mode with a fix, not a refutation
- claim: statins do not cost height in children
  grade: C
  basis: 300 children, registry not randomised, one year, no adult-height endpoint
- claim: the pulse interval should be at least three months
  grade: E
  basis: derived from two timing observations in two different experiments; never measured in any species
