id: round460_cxxc5_was_rejected_on_an_inference_while_a_tibial_length_endpoint_existed
name: R460 - CXXC5 IS THE OESTROGEN-INDUCED EFFECTOR OF GROWTH-PLATE SENESCENCE, R301 REJECTED IT ON AN INFERENCE WHILE
  A 2019 PAPER HELD A TIBIAL-LENGTH ENDPOINT IN NORMAL MICE AT THE RIGHT AGE - and the compound that produced it has
  an active multi-indication programme and a completed phase 1
