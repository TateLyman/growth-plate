human_evidence: indirect
human_evidence_note: 'The length endpoint is mouse. What is human: CXXC5 is detected in 15 of 15 probe-donor cells in
  BOTH GSE9160 donors, the most complete detection in R301 alongside COL2A1, peaking in the proliferative zone at 5,748;
  oestradiol induces CXXC5 in the human chondrocyte line C28/I2 with beta-catenin falling at 24 h; and a compound series
  against the same target has completed a 52-subject phase 1 in healthy men, though the identity of that compound as
  a KY-series molecule is an inference. There is NO human height genetics for CXXC5 - it is not among kosmicki2026 207.'
translation_risk: high
translation_risk_reason: Mice do not fuse their growth plates, so delayed growth-plate senescence in a mouse is a slowed
  decline and not a postponed fusion - the one distinction this atlas relies on when reading rabbit versus rodent. The
  compound is a DUAL agent whose GSK3-beta potency equals its CXXC5-DVL potency, so it does not cleanly test the target
  and it carries the lithium direction this file contraindicates on R281 and R356 grounds. Every tibial-length magnitude
  is figure-only. And the human route in development is TRANSDERMAL for skin, not systemic.
summary: "R301 answered a standing operator question about CXXC5 by localising it emphatically in the human growth plate\
  \ and then rejecting it, verbatim: CXXC5 is a negative feedback regulator of canonical Wnt, so inhibiting it RAISES\
  \ Wnt, R281's band puts the optimum BELOW wild type, therefore wrong half - and, in R301's own words, CXXC5 is not\
  \ in kosmicki2026's 207 SO THERE IS NO HUMAN HEIGHT NUMBER TO OVERRULE THE INFERENCE. There was no human height number.\
  \ There was something better and it had existed since 2019: a paper with a TIBIAL LENGTH ENDPOINT IN NORMAL MICE, in\
  \ both the genetic and the pharmacological direction, dosed in the late-pubertal window. CORR-309 and CORR-320's shape\
  \ - a target disposed of on an argument when a primary carrying the endpoint was already published.\n\nONE - WHAT choi2019cxxc5\
  \ ACTUALLY DID, FULL TEXT READ. CXXC5 rises progressively in resting, proliferative and hypertrophic chondrocytes as\
  \ the rodent plate senesces, with Wnt/beta-catenin output falling. GENETIC: Cxxc5-/- mice show delayed growth-plate\
  \ senescence AND tibial elongation, with more resting, proliferative and hypertrophic chondrocytes per column and higher\
  \ beta-catenin and RUNX2. PHARMACOLOGICAL: 2,280 compounds screened against the CXXC5-DVL interaction, optimised to\
  \ KY19382, dosed 0.1 mg/kg intraperitoneally daily - two weeks from SEVEN WEEKS OF AGE, which the authors call late\
  \ puberty, raised total plate height and cells per column; two weeks from three weeks raised plate height and BrdU;\
  \ and TEN WEEKS FROM THREE TO THIRTEEN WEEKS, n=7-15, SIGNIFICANTLY INCREASED TIBIAL LENGTH AT P<0.0005. No histological\
  \ abnormality in articular cartilage or liver, no weight difference across the ten weeks, and no significant activation\
  \ of nineteen other pathway reporters.\n\nTWO - AND THE PAPER PUTS A NAMED EFFECTOR BETWEEN OESTROGEN AND SENESCENCE,\
  \ WHICH THIS ATLAS HAS NEVER HAD. 17-beta-estradiol INDUCES CXXC5 in human C28/I2 chondrocytes, maximal at 24 hours,\
  \ with beta-catenin falling at 24 hours; and in vivo E2-induced structural senescence of the tibial plate is seen in\
  \ Cxxc5+/+ mice and is HARDLY OBSERVED IN Cxxc5-/- mice, with no significant change in BrdU or beta-catenin in the\
  \ knockouts. That is genetic epistasis, not correlation. weise2001 established that oestrogen ACCELERATES ALL SEVEN\
  \ senescence parameters and initiates none; nilsson2014 established that it IRREVERSIBLY depletes the resting pool.\
  \ Neither named the molecule doing it. CXXC5 is the first candidate effector, and it sits DOWNSTREAM of the signal\
  \ this file's entire period strategy suppresses.\n\nTHREE - THE STRUCTURAL FINDING, AND IT IS BIGGER THAN THE COMPOUND:\
  \ R281'S CANONICAL-WNT BAND MAY BE A DEPTH ARTEFACT RATHER THAN A DOSE BAND. Four sampled points, and they do not lie\
  \ on one monotone curve: chen2008 Col2a1-ICAT, a STRONG CHONDROCYTE-RESTRICTED reduction, gives progressively runted\
  \ animals; lui2023 SPIN4, a MILD reduction acting through a resting-zone secreted programme, gives a longer bone; PORCN\
  \ inhibitors, TOTAL LIGAND BLOCKADE, invert the zone decomposition and exhaust the plate; and Cxxc5-/- plus KY19382,\
  \ RAISING Wnt by removing an INTRACELLULAR brake, gives a longer tibia. R356 had already found the axis is DEPTH-DEPENDENT\
  \ - extracellular reduction lengthens, intracellular tankyrase inhibition failed from four independent directions,\
  \ total ligand blockade exhausts. Read at depth rather than at dose the four points are consistent: AT THE INTRACELLULAR\
  \ DEPTH THE LOWERING DIRECTION (TANKYRASE) FAILED AND THE RAISING DIRECTION (CXXC5-DVL) HAS A LENGTH ENDPOINT, while\
  \ at the EXTRACELLULAR depth the lowering direction is the one that works. Same pathway, two depths, opposite favourable\
  \ directions. That is a reformulation of R281 and it is testable rather than rhetorical.\n\nFOUR - OBTAINABILITY, UNDER\
  \ R401'S THREE-WAY SPLIT, AND IT IS FURTHER ALONG THAN ANYTHING ELSE THIS FILE HAS FOUND ON THE PERIOD AXIS. Chemical\
  \ matter: real - a synthesised, optimised indirubin with published IC50s and a published transdermal micellar formulation.\
  \ Clinical maturity: the series has an ACTIVE MULTI-INDICATION PROGRAMME - hair regrowth and follicle neogenesis, cutaneous\
  \ and diabetic wound healing, obesity and insulin resistance, NASH and liver regeneration, Alzheimer's - and a COMPLETED\
  \ PHASE 1 (NCT05833906, CK Regeon Inc, 52 healthy male subjects, transdermal, 5 g and 10 g versus placebo, completed\
  \ January 2024). ⚠ THE IDENTITY OF CKR-051 AS A KY-SERIES CXXC5-DVL COMPOUND IS AN INFERENCE from sponsor, indication\
  \ and route and is NOT stated in the registry record. There is no oral formulation, no results posted and no skeletal\
  \ endpoint anywhere in the human programme.\n\nFIVE - WHAT IS WRONG WITH IT, STATED BEFORE ANY PROMOTION.\n  - THE\
  \ COMPOUND DOES NOT CLEANLY TEST THE TARGET. IC50 1.9e-8 M on CXXC5-DVL and 1e-8 M on GSK3-beta; the authors describe\
  \ dual function and state that beta-catenin induction is likely dependent on BOTH. It is at least as potent a GSK3-beta\
  \ inhibitor as a CXXC5 disruptor, and GSK3-beta inhibition is the LITHIUM direction, which R356 contraindicated. So\
  \ the Wnt-band objection is not dissolved - it is displaced onto whether ten weeks at 0.1 mg/kg sits inside or outside\
  \ the band.\n  - THE SPECIES CANNOT SHOW WHAT IS WANTED. Rodent plates do not fuse. 'Delayed senescence' here is a\
  \ slowed decline. The rabbit, which does fuse, has never been given this compound.\n  - EVERY MAGNITUDE IS FIGURE-ONLY.\
  \ There is no millimetre or per-cent tibial figure anywhere in the text - CORR-318 applies and the figures must be\
  \ opened before a size is quoted.\n  - INDIRUBINS ARE A BROADLY KINASE-ACTIVE CHEMOTYPE (the parent scaffold is a CDK\
  \ and GSK3 series). The nineteen-reporter panel is reassuring and is not a kinome scan.\n  - NO HUMAN HEIGHT GENETICS.\
  \ CXXC5 is absent from kosmicki2026's 207, so the direction has no population-scale anchor in either sign.\n  - STEP\
  \ 0 IS CLEAN, WHICH IS THE ONE THING IN ITS FAVOUR: nothing in this stack moves canonical Wnt.\n\nSIX - WHAT WOULD\
  \ SETTLE IT, AND IT IS THE karimian2013 DESIGN. Give KY19382, or the PTD-DBMP peptide which is the target-selective\
  \ tool without the GSK3-beta arm, to a RABBIT through the pubertal window, score fusion at three physes blind, and\
  \ put a caliper on the bone at maturity. The peptide arm is the one that separates the target from the kinase, and\
  \ nobody has run either."
quantitative:
- parameter: tibial length in normal mice under daily KY19382 from 3 to 13 weeks of age
  value: significantly increased versus vehicle, P<0.0005
  unit: 0.1 mg/kg intraperitoneally daily for 10 weeks, n=7-15, radiographic measurement
  species: mouse
  source_ref: choi2019cxxc5
  value_unverified: true
  note: THE MAGNITUDE IS FIGURE-ONLY (Fig 5J) - mean plus or minus SEM with no mm or per-cent value anywhere in the text.
    CORR-318 applies. The P value and the design are text-verified.
- parameter: KY19382 potency on its two targets
  value: CXXC5-DVL interaction IC50 1.9 x 10^-8 M; GSK3-beta activity IC50 1 x 10^-8 M
  unit: molar, in vitro
  species: not_applicable
  source_ref: choi2019cxxc5
  note: THE COMPOUND IS AT LEAST AS POTENT ON GSK3-BETA AS ON THE NOMINAL TARGET, and the authors say so - beta-catenin
    induction is attributed to both. GSK3-beta inhibition is the lithium direction contraindicated in R356, so the agent
    does not cleanly test CXXC5
- parameter: effect of daily KY19382 begun in LATE PUBERTY
  value: total growth plate height significantly increased, with more proliferative and hypertrophic chondrocytes per
    column
  unit: 0.1 mg/kg intraperitoneally daily for 2 weeks from 7 weeks of age, n=7, COL2A1 immunostaining
  species: mouse
  source_ref: choi2019cxxc5
  note: the age window matters - this is the arm closest to a subject at BA16, and it is a plate-architecture endpoint
    rather than a length endpoint
- parameter: oestradiol induction of CXXC5 in human chondrocytes
  value: CXXC5 induced time-dependently to a maximum at 24 h, with beta-catenin reduced at 24 h
  unit: 100 nM 17-beta-estradiol, C28/I2 human chondrocyte line
  species: in_vitro_human_cell
  source_ref: choi2019cxxc5
  note: and in vivo E2-induced structural senescence was seen in Cxxc5+/+ and HARDLY OBSERVED in Cxxc5-/- - genetic epistasis
    placing CXXC5 downstream of oestrogen. The first named effector between oestrogen and growth-plate senescence in
    this atlas
- parameter: human clinical maturity of the CXXC5-DVL chemotype
  value: 'one completed phase 1: 52 healthy male subjects, transdermal, 5 g and 10 g versus placebo, 2023-04-25 to 2024-01-08'
  unit: NCT05833906, sponsor CK Regeon Inc, indication skin regeneration including diabetic foot ulcers
  species: human
  source_ref: ckr051phase1
  value_unverified: true
  note: THE IDENTITY OF CKR-051 AS A KY-SERIES COMPOUND IS AN INFERENCE from sponsor, indication and route and is not
    stated in the registry record. No results posted, no oral formulation, no skeletal endpoint
