id: round229_the_cohort_with_a_denominator_seven_of_seven_grew_and_the_dissociation_was_reporting_silence
name: >-
  ROUND 229 - the FGFR-TKI growth cohort with a denominator was inside a reference this atlas has held since
  round 45 and filed as unreadable; seven of seven children gained height centile, the dissociation rounds 227
  and 228 built on was reporting silence plus a double count, and the lever is MONTHS rather than MILLIGRAMS
type: hypothesis
layer: L12
aliases:
- the cohort with a denominator
- seven of seven grew
- subject 3
- forty months to the 99.9th centile
- months not milligrams
- round 229
stub: false
summary: |
  THE DATASET ROUNDS 216 TO 228 WERE TRYING TO BUILD OUT OF CASE REPORTS WAS ALREADY IN THE BIBLIOGRAPHY.
  farouk2023 has been cited by this atlas since round 45, typed primary_abstract_only, with a note recording
  why: PMC10957205 is an author manuscript and Europe PMC reports isOpenAccess N. THAT IS TRUE OF EUROPE PMC
  AND FALSE OF THE ARTICLE. NCBI eutils efetch db=pmc returns the entire manuscript, Table 1 included, and
  Table 1 carries HEIGHT PERCENTILE AND Z-SCORE AT START AND AT END OF TREATMENT FOR ALL SEVEN PATIENTS WITH
  DURATION. It is a single-centre retrospective of every patient under 18 treated with an FGFR TKI for a
  recurrent or refractory FGFR-altered glioma - Debio1347 and erdafitinib, which the authors note EQUALLY
  INHIBIT WILD TYPE AND MUTANT FGFR.

  SEVEN OF SEVEN GAINED HEIGHT CENTILE. Mean +1.20 SD. Not one fell, and the only one who barely moved was an
  18-year-old woman whose growth was already finished. The authors state in words what the table shows in
  numbers: every patient had a significant increase in linear growth velocity, and physeal widening
  associated with rapid growth acceleration was observed in all of them.

  THE TABLE HAS ONE SIGN TYPO AND IT IS PROVABLE RATHER THAN ASSUMED. Every printed percentile was checked
  against its printed Z-score; thirteen of fourteen cells agree to within one percentile point. Subject 7
  reads "18/0.9", and the 18th centile is Z -0.92, not +0.90 - which is the 82nd. Taken literally the cell
  claims an 18-year-old woman gained 1.93 height SD in two months. Read correctly she gained +0.11 SD, which
  is nothing, which is what a closed physis does. THE CORRECTED VALUE IS FORCED BY THE PAPER'S OWN PERCENTILE
  AND WAS NOT SUPPLIED BY THIS ATLAS.

  SUBJECT 3 IS THE CLOSEST HUMAN ANALOGUE TO THIS CASE THAT EXISTS ANYWHERE. A 14-year-old male with an
  FGFR3-TACC3 fusion, treated for FORTY MONTHS, to age 17.3. Height Z +0.97 to +3.40 - the 83rd centile to
  above the 99.9th. Through the CDC 2000 stature-for-age reference that is 171.2 to 199.2 cm, a gain of 28.0
  cm against 182.5 cm had he tracked his starting centile: AN EXCESS OF 16.7 cm. Taking only the paper's own
  ">99th centile" and discarding the printed Z entirely, the excess is still 9.4 cm.

  FOUR THINGS MAKE HIM THE POINT OF THE ROUND. He is an ADOLESCENT MALE, not an infant and not a child with
  achondroplasia. He had by far the LONGEST EXPOSURE ever reported and the LARGEST GAIN - and round 228
  established that the dose-response is FLAT from 3 to 7 mg, so THE LEVER IN THIS DRUG IS MONTHS, NOT
  MILLIGRAMS. He SLIPPED A CAPITAL FEMORAL EPIPHYSIS AT AGE 17, which means the proximal femoral physis was
  open, active and mechanically loaded at seventeen under this drug. And he was THE ONE WHO WAS NOT OBESE -
  the paper says two of the three SCFE patients were obese and the third was a tall thin adolescent, and at
  Z +3.4 that is unambiguously him. ROUNDS 227 AND 228 DISCOUNTED THE SLIPS AS CONFOUNDED BY OBESITY; that
  confound does not touch the one patient who matters most here.

  AND THE DISSOCIATION THAT ROUNDS 227 AND 228 WERE BUILT ON IS GONE, BY TWO SEPARATE ROUTES.

  FIRST, A DOUBLE COUNT. nadeaunguyen2026 states all five of its cases came from the literature, and its
  reference list carries exactly four clinical sources - brizini2024, farouk2023, erdachild2024 and
  erdaseries2025. FDA case 1 IS brizini2024: an optic pathway glioma, SCFE at twelve weeks which is 84 days
  exactly, hypothalamic obesity, pinning. Round 228's edge e01494 counted "cases 1 and 2, with brizini2024,
  that is three children". It is two.

  SECOND, AND THIS DESTROYS THE CLAIM RATHER THAN SHRINKING IT. FDA case 2 IS farouk2023 SUBJECT 6 - the only
  one of that paper's three SCFE patients inside the FDA's stated 10-to-15 age range, the others being 9 and
  17 at diagnosis. SUBJECT 6 WENT FROM THE 30th CENTILE TO THE 69th IN FIVE MONTHS, +1.02 SD, one of the
  fastest growers in the cohort. The FDA series does not mention it because it reported him under an
  orthopaedic adverse-event term. So of the two children rounds 227 and 228 counted as having failed
  mechanically without growing, ONE IS DOCUMENTED IN THE PRIMARY SOURCE AS GROWING FAST, and the other is a
  case report about a hip that never measured serial height at all. REPORTING SILENCE WAS READ AS BIOLOGICAL
  ABSENCE. In the one cohort that measured everybody, acceleration is 7/7 and includes 3/3 of the slips.

  SO THE ROUND-227 QUESTION IS ANSWERED AND THE ANSWER IS PRESERVED RESERVE. A plate cannot deliver 1 to 2.4
  standard deviations of measured stature while it has stopped proliferating. AND THE TWO READINGS WERE NEVER
  ALTERNATIVES: farouk2023 names rapid-growth-associated physeal widening as the mechanical predisposition
  itself, which makes the weakness a CONSEQUENCE of the proliferation rather than a substitute for it. Round
  227's title - the plate is weak, not spared - is HALF RIGHT. It is weak, and it is also not spared, because
  it is growing hard. WHAT SURVIVES UNTOUCHED is the bone-age argument, because measured stature gain says
  the reserve is being USED and says nothing about whether it is being SPENT faster than it is converted.

  AND ONE THING SEPARATES THAT MIGHT COST NOTHING. farouk2023 reports HYPERPHOSPHATAEMIA IN ALL SEVEN and
  proposes it as an independent contributor to the slips. Hyperphosphataemic familial tumoral calcinosis is
  that phosphate state from birth - FGF23, GALNT3 or KL loss - with NO inhibition of FGFR3 in cartilage,
  because FGF23 signals through FGFR1-Klotho in the kidney. HFTC patients get SLIPPED CAPITAL FEMORAL
  EPIPHYSIS, independently reported twice, plus hyperostosis, pathological fracture and osteosclerosis. THEY
  DO NOT GET A STATURE PHENOTYPE. The phosphate arm therefore reproduces the mechanical failure and none of
  the height, which means AGGRESSIVE PHOSPHATE CONTROL SHOULD SUBTRACT FROM THE FAILURE MODE WITHOUT
  SUBTRACTING FROM THE HEIGHT - using binders and dietary restriction already named in the erdafitinib label.
  That is an inference across two conditions and is graded as one, but it is one-way: there is no route by
  which lowering a raised serum phosphate makes a growth plate proliferate less.

  THE CONFOUND THAT CUTS THE OTHER WAY, AND IT CUTS IN OUR FAVOUR. These are heavily pretreated children with
  recurrent gliomas; corticosteroids and cranial or craniospinal irradiation are common in that population
  and both SUPPRESS growth. Whatever fraction of them carried that exposure, the 7/7 acceleration was
  achieved against a headwind, not with a tailwind.
quantitative:
- parameter: height Z-score change on an FGFR tyrosine kinase inhibitor, all seven patients of farouk2023
  value: >-
    subject 1, 26 months F, 9 months of treatment, Z +0.17 to +1.53 (+1.36). Subject 2, 8y F, 9 months, +0.59
    to +2.10 (+1.51), SCFE with avascular necrosis and non-traumatic fractures. SUBJECT 3, 14y M, FORTY
    months, +0.97 to +3.40 (+2.43), SCFE with osteochondritis dissecans and bilateral coxa valga. Subject 4,
    13 months M, 12 months, -1.65 to -0.05 (+1.60). Subject 5, 8y M, 5 months, -1.32 to -0.96 (+0.36).
    Subject 6, 12y M, 5 months, -0.53 to +0.49 (+1.02), SCFE with non-traumatic fractures. Subject 7, 18y F,
    2 months, -1.03 to -0.92 (+0.11). SEVEN OF SEVEN GAINED. MEAN +1.20 SD
  unit: height standard deviation score, change from start to end of treatment
  conditions: >-
    farouk2023 Table 1, read from the full author manuscript via NCBI eutils; single centre (MSKCC),
    retrospective, children under 18 with recurrent or refractory FGFR-altered gliomas on Debio1347 or
    erdafitinib. Recomputed in atlas/tools/round229_the_cohort_with_a_denominator.py
  species: human
  source_ref: farouk2023
  uncertainty: >-
    n = 7, SINGLE CENTRE, RETROSPECTIVE, UNCONTROLLED, and the population is heavily pretreated children with
    recurrent gliomas in whom corticosteroids and cranial irradiation are common - both of which SUPPRESS
    growth, so that particular confound runs against the finding rather than with it. Two endpoints per
    patient and no serial trajectory. Subject 7's end Z is a CORRECTED CELL: the table prints +0.90 against
    an 18th percentile, and 13 of the other 14 cells agree with their percentiles to within one point
- parameter: subject 3 in centimetres, and the sensitivity of that conversion
  value: >-
    a 14-year-old male treated for 40 months to age 17.3: 171.2 cm to 199.2 cm, a gain of 28.0 cm, against
    182.5 cm had he tracked his starting centile - AN EXCESS OF 16.7 cm. Sensitivity on the end Z-score,
    which sits beyond the CDC table's printed P97 and is therefore a tail extrapolation: at the paper's own
    ">99th centile" floor of Z 2.33 the excess is 9.4 cm; at Z 3.00 it is 14.0 cm; at Z 3.40 as printed, 16.7
    cm; at Z 3.80, 19.3 cm
  unit: centimetres of stature, and centimetres in excess of the starting centile track
  conditions: >-
    computed from farouk2023 Table 1 through the CDC 2000 stature-for-age LMS parameters (cdc2000_statage,
    archived at atlas/data/round229/cdc2000_statage_lms.csv); no standard deviation is assumed anywhere
  species: human
  source_ref: farouk2023
  uncertainty: >-
    A DERIVED QUANTITY AND FLAGGED AS ONE. Three assumptions, none resolvable from the paper: that the
    authors computed centiles against the CDC US reference, standard at a US centre but not stated; that
    centile tracking is the right counterfactual, which inflates the excess for a boy already destined to
    cross centiles; and the tail extrapolation above P97. THE CONCLUSION SURVIVES ALL THREE - even at the
    conservative floor the excess exceeds 9 cm - but the point estimate should not be quoted without the band
  value_unverified: true
- parameter: which published patient is which FDA postmarketing case, and the resulting overlap
  value: >-
    nadeaunguyen2026 states all five cases were derived from the literature and cites exactly four clinical
    sources. FDA case 1 = brizini2024 (optic pathway glioma, SCFE at 12 weeks = 84 days, hypothalamic
    obesity, pinning). FDA case 2 = farouk2023 subject 6 (the only one of its three SCFE patients inside the
    FDA's stated 10-15 age range; the others were 9 and 17). FDA case 3 = erdachild2024. FDA cases 4 and 5 =
    erdaseries2025 patients 1 and 2. FIVE CASES, FOUR PAPERS. Round 228 counted brizini2024 as a third child
    alongside FDA cases 1 and 2 when it IS case 1, and FDA case 2 gained +1.02 height SD in five months
  unit: case-to-publication mapping
  conditions: from nadeaunguyen2026's own reference list and case descriptors against the four primary papers
  species: human
  source_ref: nadeaunguyen2026
  uncertainty: >-
    THE MAPPING IS INFERRED FROM DESCRIPTORS AND NOT STATED BY THE FDA, which does not name which case came
    from which paper. Cases 1, 3, 4 and 5 match on multiple independent descriptors each (day counts,
    tumour, sex, age, growth figures) and are secure. CASE 2 IS THE WEAKEST LINK - it rests on the age range
    excluding farouk2023's other two SCFE patients and on 137 days being consistent with a five-month
    treatment duration. If case 2 were instead a fourth unpublished child, the double count would still
    stand and only the "he grew +1.02 SD" leg would fall
- parameter: the phosphate arm reproduces the mechanical failure and none of the height
  value: >-
    hyperphosphataemia in 7/7 patients on FGFR TKI, proposed by the authors as an independent contributor to
    the slips. In hyperphosphataemic familial tumoral calcinosis - lifelong loss of FGF23 signalling, no
    FGFR3 inhibition in cartilage - SLIPPED CAPITAL FEMORAL EPIPHYSIS is reported independently twice, in a
    9-year-old girl with a GALNT3 mutation and in a 13-year-old boy with an FGF23 mutation who also had
    GENERALISED OSTEOSCLEROSIS with elevated calcium, phosphate and PTH, both managed with phosphate binders
    and dietary restriction. NO STATURE OR GROWTH PHENOTYPE APPEARS in either case or in ito2021's
    enumeration of the condition's clinical features
  unit: presence or absence of phenotype in the isolated phosphate arm
  conditions: farouk2023 plus two HFTC case reports and one clinical overview of congenital FGF23 deficiency
  species: human
  source_ref: reddy2026
  uncertainty: >-
    THE HEIGHT LEG IS AN ARGUMENT FROM SILENCE and is graded as one - HFTC case reports are written by
    orthopaedic and nephrology teams who would not routinely report height SDS, and no HFTC cohort with
    stature has been located. The separation is also incomplete: erdafitinib inhibits FGFR1 in bone
    directly, which HFTC does not, so this isolates the PHOSPHATE arm and not the receptor-in-bone arm. TWO
    CASE REPORTS ARE TWO CASE REPORTS
localization:
- 'the proximal femoral physis, still open and slipping at seventeen in the patient most like this case'
- 'the bibliography, where the cohort had been sitting since round 45 marked unreadable'
human_evidence: direct
human_evidence_note: >-
  Seven treated children with measured serial height, two untreated humans with the isolated phosphate
  lesion, and a regulatory case series mapped back onto its own sources. All human.
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  Human children on the exact drug class at off-label paediatric doses. The limits are sample size, single
  centre and retrospective design, not species translation.
confidence: B
claim_grades:
- claim: children with normal FGFR3 gain height centile on an FGFR tyrosine kinase inhibitor
  grade: C
  basis: >-
    SEVEN OF SEVEN, mean +1.20 SD, with measured start and end values - but n = 7, single centre,
    retrospective and uncontrolled. It is the only denominator that exists on this axis and it is one
    cohort. Consistent in direction with all four independent case reports
- claim: the physeal failure under an FGFR inhibitor occurs in children whose height is standing still
  grade: X
  basis: >-
    FALSE, AND IT WAS ROUNDS 227 AND 228's CENTRAL PREMISE. All three SCFE patients in the only cohort that
    measured height were among its growers, and FDA case 2 - counted by round 228 as a non-grower - gained
    +1.02 SD in five months. The apparent dissociation came from case reports about hips that never
    measured serial height
- claim: rounds 227 and 228 counted three children in whom the physis failed without the height moving
  grade: X
  basis: >-
    FALSE ON THE ARITHMETIC BEFORE THE BIOLOGY. brizini2024 IS FDA case 1, so the same child was counted
    twice. Two, not three - and then neither of the two survives the point above
- claim: the physeal widening under an FGFR inhibitor represents preserved reserve rather than arrested
    remodelling
  grade: B
  basis: >-
    A plate cannot yield 1 to 2.4 standard deviations of measured stature while it has stopped
    proliferating, and the widening and the acceleration are reported in the same patients. What is still
    unmeasured is PROPORTIONALITY - physeal width against length gain in the same child - so the reading is
    strong rather than closed
- claim: the growth response scales with duration of exposure rather than with dose
  grade: D
  basis: >-
    THE TWO HALVES ARE EACH THIN AND THEY POINT THE SAME WAY. Round 228 found the human dose-response flat
    across 3 to 7 mg on two children; round 229 finds the largest gain in the longest exposure, 40 months,
    which is over four times the next longest. But subject 3's ANNUALISED rate is the LOWEST in the cohort,
    which is equally consistent with a decelerating response, and duration is confounded with age and with
    tolerating the drug at all
- claim: aggressive phosphate control reduces the mechanical failure without reducing the height gain
  grade: E
  basis: >-
    AN INFERENCE ACROSS TWO CONDITIONS, resting on SCFE appearing twice in the isolated phosphate state and
    on stature never being reported in it - an argument from silence on the leg that matters. The direction
    is one-way and the intervention is already in the label, which is why it is worth stating at grade E
    rather than not stating
- claim: an author manuscript that Europe PMC reports as not open access cannot be read
  grade: X
  basis: >-
    FALSE, and it cost this programme a dataset for many rounds. NCBI eutils efetch db=pmc returned the
    complete farouk2023 manuscript including Table 1. `primary_abstract_only` describes a retrieval attempt,
    not a paper
