contradicts:
- >-
  ROUND 227's reading that the physis fails mechanically while the height stands still, and its conclusion
  that this favours arrested remodelling over preserved reserve. All three slips in the only cohort that
  measured height were growers. Recorded as CORR-233.
- >-
  ROUND 228's edge e01494, which counted brizini2024 as a third child alongside FDA cases 1 and 2 when
  brizini2024 IS case 1, and which described FDA case 2 as a non-grower when he gained +1.02 height SD in
  five months. Recorded as CORR-233.
- >-
  ROUNDS 216 TO 218's premise that the way up is more erdafitinib. Round 228 showed the dose-response flat
  from 3 to 7 mg; this round finds the largest gain on record attached to the longest exposure. The lever is
  duration.
- >-
  The bibliography's own note on farouk2023, which recorded the full text as unavailable because Europe PMC
  reports isOpenAccess N. NCBI eutils returns it in full. Recorded as CORR-234.
