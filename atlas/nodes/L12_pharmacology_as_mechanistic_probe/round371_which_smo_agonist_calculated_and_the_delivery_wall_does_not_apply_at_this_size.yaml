contradicts:
- CANCELS THE CARTILAGE-DELIVERY CRITERION FOR SMALL MOLECULES, and by extension narrows R315 and R353. The
  delivery wall is real for proteins and was correctly applied to them; applying it to a 450-550 Da small
  molecule is a category error, and R357 rejection of elacestrant on cLogP grounds should be re-read in that
  light.
- WITHDRAWS THE PREMISE OF ITS OWN SCREEN. I built a cationic-and-low-logP window, then found the window does
  not bind at this molecular size. The screen is retained because it establishes that SMO chemotypes tolerate
  polar solubilising tails, which is useful if a designed agonist is ever wanted.
- DOES NOT SELECT A COMPOUND. It removes chemistry as the discriminator and leaves the choice resting
  entirely on the glucocorticoid liability versus the absence of human exposure.
