contradicts:
- 'NARROWS cartilage_targeted_delivery AND the stack node WITHOUT CONTRADICTING THEIR DATA. Those nodes
  present cartilage-targeted carriers as the class that attacks the exposure term, which remains true for
  ARTICULAR cartilage and for the endpoints those studies used. This node adds that the growth plate is a
  different compartment reached by a different route, and that mass added for retention is subtracted from
  partition - so the transfer of that class to a physis is an open question rather than an established
  route. The WYRGRL purmorphamine study did restore body length in a hypochondroplasia mouse, which is a
  length endpoint and is the strongest counter to this node reasoning; it is also the study whose every
  growth-plate number is a membrane-dye fluorescence rather than a drug concentration.'
last_verified: '2026-08-08'
