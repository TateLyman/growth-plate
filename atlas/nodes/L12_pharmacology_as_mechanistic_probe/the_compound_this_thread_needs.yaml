id: the_compound_this_thread_needs
name: THE COMPOUND SPECIFICATION - every constraint thread 3 imposes, solved together, and the answer is
  not a CNP analogue
aliases:
- what compound do we actually need
- the exact molecule
- does the compound exist
- NPR3 antagonist for height
- compound spec
type: intervention
layer: L12
stub: false
summary: 'THIS NODE DERIVES A MOLECULE FROM CONSTRAINTS RATHER THAN PICKING ONE FROM A LIST. The objective
  is to maximise time-integrated NPR2 activation AT THE GROWTH PLATE, subject to systemic free-CNP Cmax
  staying under the cardiovascular margin that thread 3 showed is the real cap, in a subject at bone age
  16, without spending bone age. Five constraints follow from quantities this atlas already holds, and
  taken together they exclude every compound currently on the axis.
  CONSTRAINT 1 - SIZE, AND IT IS THE ONE THAT KILLS THE OBVIOUS ANSWER. farnum2006 puts partition into the
  plate at roughly 100 per cent of vascular concentration at 332 Da, about 60 per cent at 3 kDa, about 10
  per cent at 10 kDa and undetectable at 40 kDa. THE CARTILAGE-TARGETING LITERATURE MOVES IN THE WRONG
  DIRECTION ON THIS AXIS: every targeting moiety adds mass. hirai2026 fuses a collagen-binding domain to
  CNP; the WYRGRL construct in cartilage_targeted_delivery is a PLGA nanoparticle with a membrane coat.
  Both buy retention by adding exactly the mass that the partition curve punishes. AND THERE IS A SECOND,
  SHARPER PROBLEM WITH THAT LITERATURE: IT IS BUILT FOR ARTICULAR CARTILAGE, WHICH IS A DIFFERENT
  COMPARTMENT. hirai2026 localised CBD-CNP to ARTICULAR cartilage in FETAL murine tibiae, and its in vivo
  routes were intra-articular injection and collagen powder packed at a fracture site. Articular cartilage
  is bathed by synovial fluid and reachable from a joint surface; THE GROWTH PLATE IS INTRAOSSEOUS,
  separated from the joint cavity by the epiphysis, and is reached only by diffusion from epiphyseal and
  metaphyseal vessels. A targeting strategy validated on articular cartilage does not transfer to a physis
  by default, and nothing in this atlas shows that it does.
  CONSTRAINT 2 - LOCAL PROTEOLYSIS. the_plate_consumes_cnp_it_does_not_make_it measured MME (neprilysin)
  in human growth plate at a maximum of 1062 against NPR2 at 1262. The tissue transcribes the protease
  that destroys the drug at a level comparable to the receptor. Vosoritide is NEP-resistant by design;
  navepegritide releases UNMODIFIED CNP-38, which is a NEP substrate. That is a real design asymmetry
  between the two approved agents at the level of the target tissue, and it has not been tested.
  CONSTRAINT 3 - LOCAL CLEARANCE, PLUS A FEEDBACK THAT PUNISHES LIGAND SUPPLY SPECIFICALLY. NPR3 in the
  same samples reaches 979. Averaging probe sets, the CLEARANCE-TO-SIGNALLING transcript ratio
  (NPR3+MME)/NPR2 is of ORDER UNITY in every compartment of both donors - 0.26 to 1.83. The plate invests
  about as much in destroying CNP as in receiving it. And npr3_clearance_receptor holds that NPR3 is a
  CNP-INDUCIBLE gene in mouse growth plate (Agoston 2007), so supplying ligand UPREGULATES ITS OWN
  CLEARANCE RECEPTOR locally. A second feedback runs systemically: kanakatti2026 found exogenous vosoritide
  SUPPRESSES endogenous NT-proCNP. Since the plate makes none of its own, that suppression removes part of
  the circulating supply the plate depends on. TWO INDEPENDENT NEGATIVE FEEDBACKS OPPOSE A LIGAND-SUPPLY
  STRATEGY, AND A CLEARANCE BLOCKER BREAKS THE LOOP INSTEAD OF FIGHTING IT.
  CONSTRAINT 4 - SYSTEMIC SILENCE AT THE LIABILITY. The cap is vascular NPR2. Any molecule that IS a
  natriuretic ligand raises signalling there in proportion to plasma concentration - which is why the
  ACcomplisH dose stopped at the cynomolgus cardiovascular NOAEL. A molecule that adds no ligand cannot
  hit that liability by the primary mechanism.
  CONSTRAINT 5 - IT MUST WORK AT BONE AGE 16, AND NOTHING HERE ESTABLISHES THAT FOR ANY CANDIDATE. This
  atlas has found age gates at precisely this junction repeatedly - serrat2013 for temperature, hakata2024
  for neprilysin inhibition (effective at 3-4 weeks in mice, 99 per cent gone by 4-5 weeks). The constraint
  is stated so that no candidate below is read as having satisfied it.
  THE MOLECULE THE CONSTRAINTS SPECIFY. Not a CNP analogue. A SUB-KILODALTON, NPR3-SELECTIVE ANTAGONIST
  that partitions freely into growth-plate cartilage and blocks LOCAL clearance of the CNP that arrives
  there, without agonising vascular NPR2. Ideally cationic, because cartilage matrix is densely
  polyanionic and that would add retention without adding mass - the one way to get selectivity and
  partition at the same time. It satisfies constraint 1 by being small, 3 and 4 by adding no ligand, and
  it is the only design found that turns constraint 3 from an obstacle into the mechanism of action. THE
  HUMAN PROOF OF CONCEPT IS ALREADY HELD: biallelic NPR3 loss of function causes tall stature with
  skeletal overgrowth.
  DOES IT EXIST? PARTLY, AND THE MISSING PART IS SPECIFIC. NPR3 IS DEMONSTRABLY DRUGGABLE BY SMALL
  MOLECULES: smith2022 published a bis-aminotriazine series against NPR-C with surface-plasmon-resonance
  SAR, a lead at about 1 micromolar and stated promising in vivo pharmacokinetics - but those compounds
  are AGONISTS, developed for vascular relaxation, which is the wrong direction. AN IN VIVO NPR3 INHIBITOR
  EXISTS: dabaghie2024 used a compound called NPR3i in rodent kidney disease models with reno-protective
  effects; the abstract does not identify it and this atlas has not established its structure, class or
  whether it is a small molecule. WHAT DOES NOT EXIST ANYWHERE FOUND: any NPR3 antagonist tested against a
  BONE LENGTH OR HEIGHT ENDPOINT, in any species. The atlas already ranked NPR3 blockade the highest-value
  unhit target and already recorded that the available agents - osteocrin, C-ANF(4-23), AP-811, SC-46542 -
  are research reagents with no product. This node adds the chemistry: the receptor has a published
  small-molecule SAR series and a published biophysical screening route, so the campaign starts from
  chemical matter rather than from nothing.
  ROUND 144 - THREE OF THE FOUR STATEMENTS IN THE PARAGRAPH ABOVE ARE NOW WRONG, AND THE ROUTE IS IN
  BETTER SHAPE THAN THIS NODE HAS BEEN RECORDING. See CORR-150 and CORR-151.
  (1) "NO NPR3 ANTAGONIST TESTED AGAINST A BONE LENGTH ENDPOINT IN ANY SPECIES" IS FALSE, AND THE
  REFUTING PAPER WAS ALREADY IN THIS BIBLIOGRAPHY. watanabetakano2021 (held since 2026-08-08) shows
  periosteal OSTEOCRIN acting as an NPR3 DECOY - binding NPR3, preventing NPR3-mediated clearance of CNP,
  enhancing CNP-dependent chondrocyte proliferation and maturation, and LENGTHENING LONG BONES in mouse.
  That is NPR3 blockade with a bone-length endpoint. It also closes the mechanical arm onto this one:
  physiological LOADING induces Ostn in periosteal osteoblasts by suppressing FoxO1, so load lengthens
  bone THROUGH THIS EXACT NODE.
  (2) THE PUBLISHED CHEMISTRY IS NOT ONLY AGONIST. nishizawa2017 built a POTENT, NPR3-SELECTIVE,
  PROTEASE-STABILISED 11-MER BLOCKER - compound 23, an ANP(5-15) analogue hybridised with musclin and
  hardened with D-amino acids and N-methylation - which is stable in mouse serum, raises intracellular
  cGMP in adipocytes, and RAISES PLASMA cGMP IN LIVE MICE on continuous administration. veale2000 ran an
  alanine-scan and truncation campaign on ANP(4-23) and AP-811 that IMPROVED PHYSICAL PROPERTIES WHILE
  RETAINING AFFINITY. The antagonist chemotype has been optimised before; this node recorded it as
  unoptimised research reagents.
  (3) AND THE CARDIOVASCULAR CEILING - THE CONSTRAINT THAT KILLED EVERY PRIOR CANDIDATE ON THIS AXIS -
  DOES NOT APPEAR IN HUMANS WHO LACK NPR3. This is the round most important finding and it was sitting in
  an abstract-only reference. Reading lauffer2022 in full: three biallelic NPR3 loss-of-function males,
  heights +3.03, +3.9 and +3.93 SDS, blood pressures 99/62, 95/54 and 111/69 mmHg, normal haematocrit,
  creatinine and GFR, and the authors state explicitly NO volume contraction, NO hypotension and NO
  excessive diuresis or natriuresis. THE MOUSE NULL IS HYPOTENSIVE WITH VOLUME CONTRACTION AND EXCESSIVE
  DIURESIS. So the liability that caps this entire axis is a SPECIES DISSOCIATION, and the human direction
  is the favourable one.
  WHY THAT MATTERS MORE THAN IT LOOKS: IT ROUTES AROUND THE TRANSPORT-ASYMMETRY FAILURE. Round 122 closed
  the ligand branch because evading clearance raises SYSTEMIC exposure and the escape required the plate to
  be diffusion-limited, which the Thiele modelling says is the minority case. THE NPR3 ANTAGONIST DOES NOT
  NEED THAT ARGUMENT. Its human proof of concept is a SYSTEMIC, LIFELONG clearance knockout that produced
  +3 to +4 SDS of height with normal blood pressure - no local-versus-systemic asymmetry is invoked
  anywhere in it. The transport modelling constrains the dual-resistant ANALOGUE, not the CLEARANCE
  BLOCKER, and this node had been letting one verdict cover both.
  THE MOLECULE IS NOW NAMED, BECAUSE THE BINDING DATA ARRIVED - ROUND 121. fda_yuviwel_review_2026 Table 50
  settles what the EPAR only asserted, and it does so in two internally consistent halves that must not be
  crossed. IN THE EC50 HALF: vosoritide is 5.9 to 11.4-fold NPR-B-favouring and native CNP-22 is 7.2 plus
  or minus 8.1-fold NPR-B-favouring - THE RANGES OVERLAP ENTIRELY. Vosoritide bought NEP resistance and
  cannot be shown to have gained anything at the clearance receptor; wendt2015 could not have detected a
  change because its potency system expressed NPR-B but not NPR-C. IN THE SPR HALF: free CNP-38, the
  species navepegritide releases, binds NPR-C AT LEAST 38-FOLD MORE TIGHTLY THAN NPR-B (27.3 pM against at
  or below 0.711 pM), and the TransCon carrier costs about 2,634-fold at NPR-B against about 1,702-fold at
  NPR-C, so the carrier is a general inactivator rather than a selectivity device and the released peptide
  faces preferential capture by clearance.
  SO NEITHER APPROVED AGENT ADDRESSES THE RECEPTOR ARM, AND THE 2009 PATENT DESIGN WAS NEVER REDUCED TO
  PRACTICE IN EITHER. THE MOLECULE IS THEREFORE A CNP ANALOGUE CARRYING BOTH RESISTANCES AT ONCE - the
  N- and C-terminal modifications that give vosoritide its neutral-endopeptidase resistance, PLUS the
  ring-glycine substitutions of biomarin_cnp_variants_us8198242 (G8T, G8S, G8V, G8N and the others listed)
  intended to strip NPR-C affinity while retaining NPR-B. Nobody has combined them. That is a far smaller
  step than opening a new target, and it is the same sponsor own chemistry.
  AND THERE IS FINALLY AN ARGUMENT THAT ESCAPES THE TRAP, THOUGH IT IS INFERENCE. Every previous candidate
  died because raising systemic exposure is what the cardiovascular margin forbids, and evading clearance
  raises systemic exposure too. The escape is a physical asymmetry between the two compartments. The
  vasculature is WELL MIXED - its ligand concentration is set by plasma, so removing a local sink there
  changes little. The growth plate is DIFFUSION-LIMITED AND AVASCULAR - concentration inside it is set by
  the balance of diffusion in against destruction within, so reducing the local sink raises local
  concentration more than proportionally. If that holds, an NPR-C-evading analogue gains at the plate
  MORE than at the liability, which is the therapeutic-index improvement that a simple dose increase
  cannot buy. THIS IS A PREDICTION FROM TRANSPORT PHYSICS, NOT A MEASUREMENT, and it is the single
  assumption on which the whole route now rests. MODELLED IN ROUND 122 AND IT DOES NOT HOLD WELL - see
  the_transport_asymmetry_probably_fails. Over 48 parameter combinations the plate is well-mixed with NO
  asymmetry in 40 per cent of the space and diffusion-limited in only 21 per cent, and below a Thiele
  modulus of 1 a tenfold cut in local consumption buys under 1.5-fold at the plate centre. The escape is
  therefore the MINORITY CASE, and the ligand branch is provisionally closed pending one depth-profile
  measurement.'
quantitative:
- parameter: 'THE CLEARANCE-TO-SIGNALLING TRANSCRIPT RATIO IN HUMAN GROWTH PLATE, WHICH IS THE NUMBER THAT
    SELECTS A CLEARANCE BLOCKER OVER A LIGAND'
  value: '(NPR3 + MME) / NPR2 = 0.26 to 1.83 across five compartments and two donors - order unity
    everywhere'
  unit: ratio of MAS5 signal, probe sets averaged per gene
  conditions: 'GSE9160, computed from query/cnp_source_bulk.json. Per compartment, donor1 female 11y10m /
    donor2 male 13y3m: reserve 1.83/0.62, proliferative 0.26/0.99, prehypertrophic 0.31/1.21,
    hypertrophic 1.05/0.88, perichondrium 1.69/0.57. Component maxima: NPR2 1262, NPR3 979, MME 1062.'
  species: human
  source_ref: gse9160
  uncertainty: 'THE ZONAL PATTERN DOES NOT REPLICATE AND IS NOT CLAIMED. donor1 shows a low ratio in the
    proliferative and prehypertrophic zones and high ratios in reserve and perichondrium; donor2 is nearly
    flat. Only the ORDER-OF-MAGNITUDE statement survives both donors - clearance machinery transcript is
    comparable to receptor transcript throughout, rather than negligible. MME differs about tenfold
    between the two donors (donor1 about 70, donor2 about 500-870), unexplained and possibly sex, age or
    technical. n=2, transcript not protein, and transcript ratios across DIFFERENT genes are not
    stoichiometry - a receptor and a protease with different turnover and different protein-per-transcript
    cannot be compared quantitatively this way. The ratio is an ORDER-OF-MAGNITUDE ARGUMENT ONLY and any
    stronger use of it is a misuse.'
- parameter: 'NPR3 IS SMALL-MOLECULE DRUGGABLE WITH IN VIVO PHARMACOKINETICS - BUT THE PUBLISHED SERIES
    RUNS IN THE WRONG DIRECTION'
  value: 'bis-aminotriazine lead, EC50 about 1 micromolar at NPR-C, described as having promising in vivo
    pharmacokinetic properties - and it is an AGONIST'
  unit: EC50, micromolar
  conditions: 'smith2022, Journal of Medicinal Chemistry. Novel small molecules designed and synthesised
    with structure-activity relationships evaluated by a surface plasmon resonance binding assay;
    biological activity confirmed in organ bath assays measuring vascular relaxation and inhibition of
    cAMP production, linked to NPR-C activity. The stated therapeutic framing is cardiovascular disease
    via NPR-C agonism, not clearance blockade.'
  species: in_vitro_animal_cell
  source_ref: smith2022
  uncertainty: 'READ AT ABSTRACT LEVEL ONLY. The species and tissue of the organ-bath work were not
    established here and the species tag is provisional. MOST IMPORTANTLY THE DIRECTION IS WRONG: an
    agonist of NPR-C is not an antagonist of clearance, and this node does not assume that a series
    optimised for agonism can be flipped - that is a medicinal-chemistry proposition, not a finding.
    What the paper establishes for present purposes is narrower and still useful: the receptor binds
    drug-like small molecules, an SPR assay and an SAR series exist, and at least one such compound had
    workable in vivo PK.'
- parameter: 'AN NPR3 INHIBITOR HAS BEEN USED IN VIVO, WITH NO SKELETAL ENDPOINT AND NO PUBLISHED IDENTITY
    IN WHAT WAS READ'
  value: 'NPR3i - reno-protective in nephrotoxic-serum glomerular injury; no effect alone on renal
    function in the ZSF1 diabetic rat, but potentiated losartan on albuminuria'
  unit: qualitative
  conditions: 'dabaghie2024, Scientific Reports. Podocyte-specific NPR3 knockout mice showed no renal
    abnormality when healthy and responded similarly to nephrotoxic serum; the pharmacological inhibitor
    produced decreased glomerulosclerosis and reduced podocyte loss in the same model.'
  species: multiple
  source_ref: dabaghie2024
  uncertainty: 'THE COMPOUND IS NOT IDENTIFIED IN THE ABSTRACT AND THIS ATLAS HAS NOT ESTABLISHED ITS
    STRUCTURE, MOLECULAR WEIGHT, CLASS OR SELECTIVITY - it may be a peptide such as a C-ANF analogue
    rather than a small molecule, which would fail constraint 1 entirely. NOTHING about a bone or growth
    endpoint appears; the models are renal. This row is recorded to establish that in vivo NPR3 inhibition
    is achievable at all, not to nominate this compound. NOTE ALSO A CAUTION IN THE SAME PAPER: the
    podocyte-specific knockout was phenotypically unremarkable while the inhibitor had effects, which
    could indicate off-target activity, a non-podocyte site of action, or both.'
localization:
- 'the specification is set by growth-plate cartilage - intraosseous, avascular, alymphatic, polyanionic,
  reached only by diffusion from epiphyseal and metaphyseal vessels - and explicitly NOT by articular
  cartilage, which is the compartment the existing targeting literature was built for'
human_evidence: direct
human_evidence_note: 'The constraints are set by human measurements - the human partition curve is mouse
  (farnum2006) but the clearance and receptor transcript levels are human growth plate, the dose ceiling
  is a human trial protocol, and the proof of concept for the mechanism is a human loss-of-function
  phenotype. The candidate compounds are animal and in vitro only.'
species_basis:
- human
- mouse
- in_vitro_animal_cell
translation_risk: high
translation_risk_reason: 'The specification is derived from human tissue measurements and a human genetic
  phenotype, which is the strong part. The weak part is that NO compound satisfying it has been tested
  against any skeletal endpoint in any species, so the entire proposal rests on an inference from a
  germline loss-of-function phenotype to a pharmacological one - the same inference this atlas has watched
  fail on age-gating grounds more than once.'
confidence: D
claim_grades:
- claim: The constraints jointly exclude a collagen-binding-domain CNP fusion and a targeted nanoparticle
    as routes to the growth plate.
  grade: C
  basis: 'Two independent grounds. SIZE - farnum2006 puts partition near 10 per cent at 10 kDa and
    undetectable at 40 kDa, and both constructs add mass to reach retention. COMPARTMENT - hirai2026
    localised to ARTICULAR cartilage in fetal tibiae and was administered intra-articularly or via
    collagen powder at a fracture site, and the growth plate is intraosseous and not continuous with the
    joint cavity. Graded C rather than B because neither construct has been TESTED at a physis and failed;
    the exclusion is predicted from the partition curve and the anatomy, not observed.'
- claim: A ligand-supply strategy is opposed by two negative feedbacks that a clearance blocker avoids.
  grade: C
  basis: 'Local - NPR3 is CNP-inducible in mouse growth plate (Agoston 2007 via npr3_clearance_receptor),
    so supplying ligand upregulates its own clearance receptor. Systemic - kanakatti2026 shows exogenous
    vosoritide suppresses endogenous NT-proCNP in children. Both are real measurements; the inference that
    they materially limit a clinical ligand strategy is not, since navepegritide still produced a
    monotonic dose-response across a sixteen-fold dose range in the face of both.'
- claim: The compound this thread needs is a sub-kilodalton NPR3-selective antagonist.
  grade: D
  basis: 'It is the only design found that satisfies the size, feedback and systemic-silence constraints
    simultaneously, and it has a human loss-of-function proof of concept. But it is a derivation, not a
    result: no such compound has been tested for bone length in any species, NPR3 blockade is
    systemically active and could raise circulating natriuretic peptides enough to reproduce the very
    hypotension liability it was designed to avoid, and the redundancy question with an FGFR inhibitor -
    the same one that undercut vosoritide in this stack - is untouched.'
- claim: Vosoritide's engineering improved its NPR-C selectivity relative to native CNP.
  grade: X
  basis: 'NO. fda_yuviwel_review_2026 Table 50 puts vosoritide at 5.9 to 11.4-fold NPR-B-favouring by
    EC50 and native CNP-22 at 7.2 plus or minus 8.1-fold by the same measure - completely overlapping. The
    claim supported is the null: vosoritide cannot be shown to differ from native peptide at the clearance
    receptor. wendt2015 could not have detected such a difference, since its NIH3T3 potency system
    expressed NPR-B but neither NPR-A nor NPR-C, and it reports no NPR-C constant.'
- claim: The TransCon carrier gives navepegritide selectivity against the clearance receptor.
  grade: X
  basis: 'NO - IT IS A GENERAL INACTIVATOR, WHICH IS THE POINT OF A PRODRUG. Against free CNP-38 the
    carrier costs about 2,634-fold at NPR-B and about 1,702-fold at NPR-C, so it suppresses NPR-B slightly
    MORE, and the carrier-bound NPR-C to NPR-B ratio of about 59-fold is marginally worse than the free
    peptide 38-fold. The active released species, free CNP-38, binds NPR-C at least 38-fold more tightly
    than NPR-B.'
- claim: The indicated next molecule is a CNP analogue with BOTH neutral-endopeptidase resistance and
    NPR-C evasion.
  grade: D
  basis: 'Both halves exist separately and have never been combined - vosoritide supplies the first and
    biomarin_cnp_variants_us8198242 claims the second with named ring-glycine substitutions. The binding
    data now show neither approved agent addresses the receptor arm. It remains D because no such molecule
    has been built or tested against any endpoint, no comparative NPR-B versus NPR-C data for the patented
    substitutions is public, and the therapeutic-index rationale rests on an unmeasured transport
    asymmetry between a well-mixed and a diffusion-limited compartment.'
- claim: The dual-resistant CNP analogue gains enough from the transport asymmetry to justify building it.
  grade: X
  basis: 'ANSWERED AT ROUND 129 AND THE ANSWER IS NO. With the effective transport velocity taken from
    equilibration timescales rather than a co-fit - williams2007 saturation and serrat2009 vascular
    matching both give 0.3 to 0.5 micrometres per second - the Damkohler number runs 0.08 to 1.54 and
    HALVING THE LOCAL SINK RAISES DELIVERED CONCENTRATION BY ONLY 1.04 TO 2.16-FOLD, centrally about 1.2.
    That is not a therapeutic-index transformation, and it comes bundled with the proportional rise in
    SYSTEMIC exposure that the cardiovascular margin forbids. serrat2009 independently shows the plate
    reaching vascular concentration for a small solute with a UNIFORM zonal distribution, and shows the
    hypertrophic zone as the LEAST depleted plate zone when supply is throttled - the opposite of a
    consumption-limited target zone. The 6 to 30-fold gain claimed at round 125 was an artefact of a
    diffusivity seven-fold too low.'
- claim: The required compound already exists.
  grade: X
  basis: 'NO. NPR3 is druggable by small molecules with in vivo PK (smith2022) but the published series
    are AGONISTS; an in vivo NPR3 inhibitor exists (dabaghie2024) but is unidentified in what was read,
    may be a peptide, and was used only in renal models. NO NPR3 ANTAGONIST HAS BEEN TESTED AGAINST A BONE
    LENGTH OR HEIGHT ENDPOINT IN ANY SPECIES. The chemistry exists; the compound does not.'
- claim: An NPR3-evading CNP analogue is an unexplored idea.
  grade: X
  basis: 'NO - IT IS A PATENTED DESIGN AND HAS BEEN SINCE 2009. biomarin_cnp_variants_us8198242 (priority
    2009-05-20) explicitly discloses CNP variants intended to have reduced affinity for NPR-C while
    retaining NPR-B binding, by substituting ring-region glycines - G1, G5, G8, G15, G19, G21, with G8T,
    G8S, G8V and G8N among the listed options - on the stated rationale that reducing conformational
    flexibility increases NPR-B over NPR-C specificity. So the sponsor of vosoritide had this exact idea
    before vosoritide was approved. WHAT THE PATENT DOES NOT CONTAIN, in the text read, is any
    COMPARATIVE NPR-B VERSUS NPR-C BINDING DATA - the language is "potentially reduced affinity", which is
    an intention rather than a measurement - and vosoritide is not identified as one of the claimed
    variants. The idea is public, the data is not, and no molecule with the property isolated has been
    tested against a length endpoint.'
- claim: Whether vosoritide is itself cleared by NPR3 is known.
  grade: X
  basis: 'NOT ESTABLISHED ANYWHERE IN THIS ATLAS, and it is a sharp and cheap question. Vosoritide is
    engineered for NEP resistance; whether it also evades the CLEARANCE RECEPTOR is a different property.
    If it binds NPR3, a substantial fraction of delivered drug is removed by a receptor the human plate
    expresses at a level comparable to NPR2, and an NPR3-evading variant becomes an obvious and much
    smaller engineering step than a new target.'
