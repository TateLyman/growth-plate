id: round340_the_hippo_axis_run_to_the_end_the_second_strongest_locus_in_the_genome_has_a_downside_arm_and_no_upside_arm
name: 'Round 340 - the Hippo/YAP-TEAD axis run to the end. R317 deferred it as "worth exactly one follow-up";
  this is the follow-up. The pathway is present, active, correctly directed by two independent genetic
  routes - and it has a downside arm with no upside arm.'
aliases:
- Hippo YAP TAZ TEAD height
- verteporfin growth plate
- VT3989 IK-930 bone length
- organ size control and stature
- CCN2 CTGF growth plate
type: hypothesis
layer: L12
stub: false
summary: 'THE BRIEF WAS TO GO AFTER HUGE, HIGH-RISK BIOLOGICAL CONCEPTS. Hippo/YAP-TAZ is the organ-size
  control pathway - the largest single concept available - and this atlas had almost no coverage of it
  (Hippo 3 nodes, YAP1 3, TEAD1 2, VERTEPORFIN ZERO). R317 found TEAD1 at P=3.11e-119 in the sitting-height-ratio
  GWAS, the second strongest locus in the genome for that trait with TEAD1 the only protein-coding gene
  in the window, noted that TEAD palmitate-pocket inhibitors are in phase 1 - "the opposite of the HHIP/CHAD
  problem" - and wrote that it was "worth exactly one follow-up". Rounds 318 to 339 all went elsewhere.
  THIS IS THAT FOLLOW-UP, RUN TO THE END. THE ANSWER IS NO, AND IT IS A WELL-EVIDENCED NO.

  ONE - THE RECEIVER TEST PASSES MORE EMPHATICALLY THAN ANY AXIS IN THIS FILE, AND THE PATHWAY IS NOT MERELY
  PRESENT BUT DEMONSTRABLY RUNNING. In GSE288028 (14 postnatal human growth plates, 79,934 cells) the entire
  cassette is 12/14: YAP1 77.1 CPM in 65.2 per cent of cells, WWTR1/TAZ 256.8 in 88.5 per cent, TEAD1 103.6
  in 69.0 per cent, plus TEAD4, LATS1, LATS2, STK3, STK4, SAV1, MOB1A, MOB1B, NF2, AMOTL1, AMOTL2, FRMD6,
  TAOK1 and TAOK3. AND THE OUTPUT GENES ARE AMONG THE MOST ABUNDANT TRANSCRIPTS IN THE TISSUE: CCN2/CTGF
  1,249.2 CPM in 99.9 PER CENT OF CELLS and CCN1/CYR61 324.8 CPM in 92.8 per cent, against COL2A1 at 9,201
  and ACAN at 1,826. That is not a presence call, it is evidence of transcriptional output - and vanyai2020
  independently names Ctgf and Cyr61 as THE physiological YAP target genes in cartilage, which is a blind
  confirmation of the expression read.

  TWO - THE DIRECTION IS CONSISTENT ACROSS TWO INDEPENDENT GENETIC ROUTES, AND IT SURVIVES THE BASE-RATE
  CHECK. Human: LATS2 - the kinase that phosphorylates and inactivates YAP/TAZ - is the ONLY Hippo gene
  in kosmicki2026''s 207, at -0.86 cm (P=1.6e-11). Losing the brake means more YAP/TAZ, and it SHORTENS.
  Mouse IMPC, with CORR-329''s 63.6 per cent negative base rate applied: three further NEGATIVE regulators
  of YAP all shorten on loss - Amotl2 homozygote body length -1.976 (P=8.8e-11), Frmd6 heterozygote tibia
  -2.032 (P=3.7e-03) deepening to -3.334 in the homozygote, and Taok1 heterozygote tibia -1.244 (P=3.9e-03).
  The Frmd6 het-to-hom deepening is a dose-response. And the one row in the RARE, informative direction
  is the EFFECTOR: Wwtr1/TAZ heterozygote tibia +1.753 - losing the output runs the other way. Every arrow
  points the same way: MORE YAP/TAZ IS SHORTER, LESS IS LONGER.

  THREE - AND THE MECHANISM IS BEAUTIFUL AND POSTNATAL. goto2018 made TAMOXIFEN-INDUCIBLE, CHONDROCYTE-SPECIFIC
  Mob1a/b-deficient mice - which is exactly CORR-299''s test class, a postnatally-induced tissue-restricted
  perturbation - and hyperactivating ENDOGENOUS YAP1/TAZ impaired chondrocyte proliferation and maturation
  and produced CHONDRODYSPLASIA, through a MOB1-dependent YAP1/TAZ-TEAD complex acting as a TRANSCRIPTIONAL
  REPRESSOR OF SOX9, the master chondrogenic regulator. deng2016yap adds that Yap1 inhibits skeletal development,
  POSTNATAL GROWTH and bone repair. yang2017yap adds that YAP1 does it partly by ACTIVATING Wnt/beta-catenin,
  which converges on R281''s canonical-Wnt band from a second, independent direction. At this point the
  case looked as strong as anything in this file: pathway present, output genes near the top of the panel,
  direction concordant in human and mouse, a postnatal inducible mechanism onto SOX9, convergence with
  an existing atlas axis, and phase-1 oral TEAD inhibitors plus an APPROVED drug (verteporfin) to hit it.

  FOUR - ⛔ AND vanyai2020 CLOSES IT, WITH THE BEST GENETICS ON THE AXIS. Cartilage-specific Yap/Taz DOUBLE
  knockout "DOES NOT PREVENT chondrocyte proliferation, differentiation OR SKELETAL GROWTH" - it produces
  skeletal deformities including cleft palate. Removing the effector from cartilage gives NORMAL LENGTH.
  And in the other direction, cartilage-specific constitutively-nuclear nls-YAP5SA or Lats1/2 knockout
  "DO NOT INCREASE CARTILAGE GROWTH" but cause catastrophic malformations resembling chondrodysplasia or
  achondrogenesis. The authors also state the prior proposal - that YAP inhibits skeletal size by repressing
  chondrocyte proliferation and differentiation - and REFUTE it in vivo, which is a direct contradiction
  of deng2016yap by a later, cleaner, cartilage-specific design. Their conclusion is that YAP/TAZ is DISPENSABLE
  for chondrocyte proliferation in vivo and functions in cartilage MORPHOGENESIS via the extracellular
  matrix.

  FIVE - SO THE SHAPE IS WORSE THAN A BAND, AND THIS IS THE GENERALISABLE RESULT. This file has five axes
  that shorten in BOTH directions (hedgehog, oestrogen receptors, DNA methylation, canonical Wnt, cAMP),
  and for those the question is always "where is the peak". THE HIPPO AXIS IS NOT THAT. Too much YAP/TAZ
  is chondrodysplasia; too little is NORMAL LENGTH with morphogenetic defects. There is a downside arm
  and NO UPSIDE ARM - the pathway is a guardrail, not a throttle. Every genetic signal that made it look
  promising (LATS2 -0.86, Amotl2 -1.98, Frmd6 -2.03/-3.33, Taok1 -1.24) is describing the DEFICIT direction,
  which is CORR-203 applied to a whole pathway rather than to a single experiment: all of it is a claim
  about what breaks, none of it is a claim about what can be gained. THE Wwtr1 +1.753 HINT DOES NOT SURVIVE
  EITHER - it is P=0.081, non-significant, and vanyai2020''s cartilage-specific Yap/Taz double knockout
  is the better-powered, better-designed test of the identical question and it is null on growth.

  SIX - WHAT THIS COSTS AND WHAT IT BUYS. It closes the single largest untouched concept in the file, it
  disposes of verteporfin (approved), VT3989, IK-930 and IAG933 before any of them was proposed, and it
  corrects R317''s standing "worth exactly one follow-up" to "followed up, and closed". It also leaves
  one genuinely new observation that is NOT a lever: CCN2/CTGF at 1,249 CPM in 99.9 per cent of cells is
  one of the most abundant transcripts in the human growth plate and this atlas has essentially no CCN2
  coverage - recorded as a gap, with the direction unknown and the Hippo route to it now closed.'
