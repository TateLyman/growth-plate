  unit: median CPM and maximum per cent of cells, 14 postnatal human growth plates
  conditions: GSE288028, 79,934 cells, operator-supplied. Scale references from the same table - COL2A1
    9,200.7 CPM in 100 per cent of cells, ACAN 1,826.4 in 99.5 per cent, GNAS 564.8 in 97.0 per cent.
  species: human
  source_ref: vanyai2020
  uncertainty: 'THE STRONGEST RECEIVER-TEST RESULT IN THIS FILE, AND IT IS WHY THE AXIS DESERVED A FULL
    ROUND RATHER THAN A DISMISSAL. The pathway is not merely present - the two canonical YAP/TAZ output
    genes are among the most abundant transcripts in the tissue, which is transcriptional evidence that
    the pathway is ACTIVE, not just expressed. The independent confirmation matters: vanyai2020 names Ctgf
    and Cyr61 as the physiological YAP targets in cartilage without reference to this dataset. WHAT EXPRESSION
    DOES NOT DO IS GIVE A DIRECTION OR A LEVER, and this round is the demonstration - the most emphatic
    presence call in the atlas sits on an axis with no upside arm. Expression is computed here from the
    supplied table; source_ref is the paper that independently names the same output genes.'
- parameter: 'the direction, concordant across human burden and mouse length, read against CORR-329''s base
    rate'
  value: 'HUMAN - LATS2 (inactivates YAP/TAZ) pLoF+deleterious missense -0.86 cm, P=1.6e-11, the only Hippo
    gene in the 207. MOUSE - Amotl2 homozygote body length -1.976 (P=8.8e-11); Frmd6 heterozygote tibia
    -2.032 (P=3.7e-03) and homozygote -3.334 (P=1.8e-02); Taok1 heterozygote tibia -1.244 (P=3.9e-03).
    All four are NEGATIVE regulators of YAP and all shorten on loss. The effector runs the other way: Wwtr1/TAZ
    heterozygote tibia +1.753 (P=0.081).'
  unit: centimetres per allele (human) and IMPC effect size (mouse)
  conditions: kosmicki2026 Supplementary Table 6 as held at atlas/data/round300/s6_burden_effects.json;
    IMPC length endpoints as held at atlas/data/round303/impc_length_endpoints_all.json, 12,068 rows. Base
    rate computed in the same run - 7,423 of 11,674 rows negative, 63.6 per cent.
  species: human
  source_ref: goto2018
  uncertainty: 'THE DIRECTION IS CONSISTENT AND IT IS ALSO NOT SUFFICIENT, WHICH IS THE LESSON OF THE ROUND.
    CORR-329 applies hard: 63.6 per cent of all IMPC rows are negative, so four negative rows in a pathway
    carry much less information than they appear to, and only the Wwtr1 +1.753 sits in the rare informative
    direction - where it is NON-SIGNIFICANT at P=0.081. One inconsistency is recorded rather than smoothed:
    Mob1a heterozygote FEMALE body length is +0.522 at P=1.1e-06, which runs against, though MOB1A and MOB1B
    are redundant paralogues and goto2018 needed the DOUBLE deletion to see a phenotype (CORR-341 - read
    the allele string). TEAD1''s own five IMPC rows are near-zero and inconsistent in sign (-0.393, -0.005,
    +0.691, +0.110, -0.002), most likely TEAD1-4 redundancy.'
- parameter: 'THE CLOSING RESULT - removing the effector from cartilage gives NORMAL bone length, and forcing
    it gives malformation'
  value: cartilage-specific Yap/Taz double knockout does not prevent chondrocyte proliferation, differentiation
    or skeletal growth; cartilage-specific nls-YAP5SA or Lats1/2 knockout do NOT increase cartilage growth
    but cause malformations resembling chondrodysplasia or achondrogenesis
  unit: qualitative, in vivo, cartilage-specific
  conditions: vanyai2020. In vitro in the same paper the canonical direction holds - Yap/Taz double knockout
    impairs murine chondrocyte proliferation and nls-YAP5SA accelerates it - so the in-vitro and in-vivo
    answers differ and the authors say so.
  species: mouse
  source_ref: vanyai2020
  uncertainty: 'THIS IS THE ROUND''S DECIDING EVIDENCE AND IT IS QUALITATIVE - the abstract gives no length
    percentages, so the "normal skeletal growth" claim is the authors'' characterisation rather than an
    extracted number, and the full text was not retrieved. GRADE C ON THAT BASIS. What makes it decisive
    anyway is the DESIGN and the direction of the surprise: it is cartilage-specific, in vivo, run in BOTH
    directions in the same paper, and it explicitly states and then refutes the prior proposal (deng2016yap)
    that YAP restrains skeletal size. A null that contradicts the author''s own prior expectation, in the
    better-controlled compartment, is the kind of null that closes an axis. It also does not contradict
    goto2018 - both agree that TOO MUCH YAP/TAZ is chondrodysplasia; they differ only on whether removing
    it buys anything, and vanyai2020 is the one that tested that.'
localization:
- 'postnatal human growth plate chondrocyte: the whole Hippo cassette 12/14, with CCN2 and CCN1 among the
  most abundant transcripts in the tissue'
- 'cartilage in vivo: where the effector turns out to be dispensable for length and to control morphogenesis
  via the extracellular matrix instead'
human_evidence: indirect
human_evidence_note: The human contribution is a burden effect on one brake gene (LATS2 -0.86 cm, P=1.6e-11),
  the sitting-height-ratio association at TEAD1 (P=3.11e-119, from R317), and the expression of the whole
  cassette in 14 postnatal human growth plates. Every functional result is mouse, and no Hippo-directed
  agent has a bone-length endpoint in any species.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: The closing evidence is mouse cartilage-specific genetics and is qualitative in
  the abstract. The human data establish that the pathway is present, active and correctly signed, but
  say nothing about whether the upside arm exists - which is exactly the question the mouse answers negatively.
confidence: C
claim_grades:
- claim: The Hippo/YAP-TAZ-TEAD pathway is present and transcriptionally active in the postnatal human growth
    plate.
  grade: B
  basis: The entire cassette is detected in 12 of 14 samples, and the two canonical output genes CCN2/CTGF
    (1,249 CPM, 99.9 per cent of cells) and CCN1/CYR61 (325 CPM, 92.8 per cent) are among the most abundant
    transcripts in the panel - transcriptional output, not merely presence. Independently corroborated by
    vanyai2020 naming Ctgf and Cyr61 as the physiological YAP targets in cartilage.
- claim: More YAP/TAZ output shortens bone.
  grade: B
  basis: 'Concordant across two independent genetic routes and one postnatal inducible mechanism. Human
    LATS2 -0.86 cm at P=1.6e-11; mouse Amotl2 -1.976 at P=8.8e-11, Frmd6 -2.032 het deepening to -3.334
    hom, Taok1 -1.244 - four negative regulators of YAP, all shortening on loss. goto2018 supplies the mechanism
    in a tamoxifen-inducible chondrocyte-specific model: YAP1/TAZ-TEAD represses SOX9. vanyai2020 agrees
    from the gain side - forcing nuclear YAP or deleting Lats1/2 in cartilage causes chondrodysplasia-like
    malformation.'
- claim: Therefore inhibiting YAP/TAZ-TEAD would lengthen bone.
  grade: X
  basis: 'REFUTED, AND BY THE BEST-DESIGNED EXPERIMENT ON THE AXIS. vanyai2020''s cartilage-specific Yap/Taz
    DOUBLE knockout does not prevent chondrocyte proliferation, differentiation or skeletal growth - removing
    the effector gives NORMAL length plus deformities, not extra length. The inference from the shortening
    genetics was the CORR-203 error applied to a whole pathway: four brake genes whose loss shortens describe
    the deficit direction and say nothing about a gain. The one row in the rare informative direction, Wwtr1
    tibia +1.753, is non-significant at P=0.081 and is directly superseded by the cartilage-specific double
    knockout of the same effector.'
- claim: The Hippo axis is a band with a peak that could be found by dosing.
  grade: X
  basis: 'NO - AND THE DISTINCTION IS THE GENERALISABLE PRODUCT OF THIS ROUND. This file holds five both-directions-shorten
    axes (hedgehog, oestrogen receptors, DNA methylation, canonical Wnt, cAMP) where the live question is
    where the peak sits. Hippo is not one of them: too much YAP/TAZ is chondrodysplasia, too little is NORMAL
    length with morphogenetic defects. A downside arm and no upside arm - a guardrail, not a throttle. No
    dose finds a peak that does not exist.'
- claim: Verteporfin, VT3989, IK-930 or IAG933 are candidates for this case.
  grade: X
  basis: 'DISPOSED OF BEFORE PROPOSAL. All are YAP/TAZ-TEAD inhibitors and therefore act in the direction
    vanyai2020 shows produces normal rather than increased length in cartilage. Recorded explicitly because
    verteporfin is APPROVED (Visudyne, photodynamic therapy) and had ZERO mentions anywhere in this atlas
    before this round, and because R317 flagged the phase-1 TEAD palmitate-pocket inhibitors as "the opposite
    of the HHIP/CHAD problem" - chemical matter without a target. It is the reverse: a target without an
    upside.'
key_refs:
- ref_id: vanyai2020
  year: 2020
  type: primary
  one_line_finding: Cartilage-specific Yap/Taz double knockout does not prevent skeletal growth and forcing
    nuclear YAP or deleting Lats1/2 does not increase cartilage growth but causes chondrodysplasia-like
    malformation - a downside arm with no upside arm.
- ref_id: goto2018
  year: 2018
  type: primary
  one_line_finding: Tamoxifen-inducible chondrocyte-specific Mob1a/b deletion hyperactivates endogenous
    YAP1/TAZ and causes chondrodysplasia through YAP1/TAZ-TEAD-dependent repression of SOX9.
- ref_id: deng2016yap
  year: 2016
  type: primary
  one_line_finding: Yap1 inhibits skeletal development, postnatal growth and bone repair, promoting early
    proliferation via Sox6 but inhibiting maturation via Runx2 and Col10a1 - the claim vanyai2020 refutes
    in vivo.
- ref_id: yang2017yap
  year: 2017
  type: primary
  one_line_finding: YAP1 overexpression inhibits chondrogenic and hypertrophic differentiation in ATDC5
    cells partly by activating Wnt/beta-catenin, linking this axis to R281's canonical-Wnt band.
