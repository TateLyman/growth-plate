    species: human
    source_ref: fda_forteo_label_2025
    uncertainty: categorical label statement
localization:
  - "human growth plate: PTH1R is expressed in prehypertrophic chondrocytes; teriparatide has never been administered to a growing human plate with a growth readout"
human_evidence: absent
human_evidence_note: >-
  There is no human evidence on teriparatide and linear growth; the only paediatric
  exposures are for calcium disorders and report calcium, not height, outcomes.
species_basis: [human, mouse]
translation_risk: high
translation_risk_reason: >-
  Everything known about PTH1R agonism and the growth plate comes from mouse genetics and
  from the human Jansen metaphyseal chondrodysplasia phenotype (constitutive PTH1R
  activation), not from a pharmacological human exposure. The regulatory barrier means
  this gap cannot be closed by an ordinary trial.
confidence: D
claim_grades:
  - claim: Teriparatide is contraindicated in growing children because of osteosarcoma risk with open epiphyses.
    grade: A
    basis: Explicit FDA label statement and warnings section.
  - claim: PTH1R agonism would delay hypertrophic differentiation and lengthen the human growth plate.
    grade: E
    basis: Inference from PTHrP-PTH1R mouse biology and from Jansen metaphyseal chondrodysplasia; never tested pharmacologically in a human.
