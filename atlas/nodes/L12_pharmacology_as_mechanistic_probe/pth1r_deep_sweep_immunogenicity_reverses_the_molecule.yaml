localization:
- 'PTH1R enriched in the PREHYPERTROPHIC and HYPERTROPHIC zones per liao2026 - post-commitment, which
  weakens the amplification rationale'
- 'PTH1R in OSTEOBLASTS, where its loss causes premature fusion - an indirect route to the plate'
human_evidence: direct
human_evidence_note: 'Now direct rather than indirect. winer2025 reports linear growth under PTH(1-34) in
  hypoparathyroid children of mean age 13.7 years, with height-for-age Z rising in the calcium-sensing-
  receptor group. Both drug labels supply human pharmacokinetics, calcium kinetics and immunogenicity in
  hundreds of patients. What is still absent is any human given a PTH1R agonist at an ANABOLIC dose with
  a growth-velocity endpoint.'
species_basis:
- human
- mouse
- rat
translation_risk: high
translation_risk_reason: 'Unchanged in kind. The human data is replacement dosing in a disease
  population; the growth experiments are rodent; the molecule with the growth data differs from the one
  with the best exposure. What improved this round is that the human immunogenicity and calcium kinetics
  are directly measured in hundreds of patients and are decisive for the molecule choice regardless of
  how the growth question resolves.'
confidence: C
claim_grades:
- claim: Abaloparatide is the right molecule for this use.
  grade: X
  basis: 'REVERSED BY THE IMMUNOGENICITY DATA, WHICH ROUNDS 184 AND 187 DID NOT READ. 26 per cent
    neutralising antibodies at 18 months against teriparatide''s 3 per cent non-neutralising, plus a
    2.4 per cent cross-reactivity to PTHrP of which three of seven were NEUTRALISING to the endogenous
    ligand the growth plate runs on, plus antibody persistence out to three years after stopping. The
    PTHrP homology that was the mechanistic argument FOR abaloparatide is what creates the risk.'
- claim: The approved human dose is about ten-fold below the effective animal exposure.
  grade: D
  basis: 'OVERSTATED. That figure rests entirely on ogawa2002''s 80 micrograms/kg/day rat dose. liao2026
    dosed growing mice with abaloparatide at 5 micrograms/kg/day and saw skeletal change; scaled, that is
    24 micrograms/day in a 60 kg human, and the approved 80 micrograms/day is 3.3-fold ABOVE it. The two
    anchors differ by 32-fold and neither has a dose-response for a growth endpoint behind it.'
- claim: No human has ever been given a PTH1R agonist with linear growth as an endpoint.
  grade: X
  basis: 'FALSE, AND THIS ATLAS ASSERTED IT IN ROUNDS 184 AND 186. winer2025 reports height-for-age Z
    trajectories under PTH(1-34) in hypoparathyroid children of mean baseline age 13.7 years, with HAZ
    increasing in the calcium-sensing-receptor group at P less than 0.0001 for the age-by-group
    interaction. Replacement dosing and a disease population, so not a clean anabolic test - but the
    endpoint exists and the direction is positive in the cleaner arm.'
- claim: PTH1R agonism acts on the amplification term because the receptor sits at the commitment
    boundary.
  grade: E
  basis: 'WEAKENED. Round 184 made this the localisation argument. liao2026 places PTH1R enrichment in
    the HYPERTROPHIC zone with colocalisation in prehypertrophic and hypertrophic chondrocytes -
    post-commitment. And qiu2015 shows a substantial part of the growth plate effect is INDIRECT, through
    osteoblast PTH1R controlling endochondral angiogenesis. Neither refutes an amplification effect;
    both remove the reason to expect one a priori.'
- claim: PTH1R agonism might delay growth plate fusion.
  grade: E
  basis: 'A NEW AND UNCOUNTED POSSIBLE BONUS, AND ONLY AN INFERENCE. qiu2015 shows osteoblast PTH1R
    deletion causes PREMATURE growth plate fusion with shortened long bones. Loss of function closes the
    plate early. Nobody has shown that agonism delays closure, and it would need measuring, but if true
    it adds a duration term to a candidate that has been argued purely on yield.'
- claim: Osteosarcoma is the reason not to do this.
  grade: D
  basis: 'THE PRACTICAL BARRIER IS WEAKER THAN THE LABEL IMPLIES. abdulelah2023 finds no increased risk
    across trials and post-marketing surveillance out to fifteen years, with the label warning tracing to
    rat carcinogenicity. That said, no surveillance population had OPEN EPIPHYSES, which is the specific
    subgroup both labels single out and the specific subgroup at issue here, so the human data does not
    cover the case.'
