contradicts:
- 'REVERSES THE MOLECULE CHOICE MADE IN ROUND 184 AND KEPT IN ROUND 187. Both named abaloparatide over
  teriparatide. The TYMLOS label reports 26 per cent neutralising antibodies at 18 months and
  cross-neutralisation of endogenous PTHrP in about 1 per cent of those tested, against teriparatide''s
  3 per cent non-neutralising. Neither round read section 12.6.'
- 'CORRECTS THE CLAIM, MADE IN ROUNDS 184 AND 186, THAT NO HUMAN HAS RECEIVED A PTH1R AGONIST WITH A
  GROWTH ENDPOINT. winer2025 reports height-for-age Z trajectories in hypoparathyroid children of mean
  age 13.7 years, positive in the calcium-sensing-receptor arm.'
- 'CORRECTS THE EXPOSURE GAP FROM ROUNDS 184 AND 187. The ten-fold-short figure came only from
  ogawa2002''s rat dose. Against liao2026''s abaloparatide dosing in growing mice the approved human dose
  is 3.3-fold ABOVE the mouse equivalent. The anchors differ by 32-fold.'
- 'WEAKENS THE ROUND-184 LOCALISATION ARGUMENT. PTH1R is enriched in the prehypertrophic and hypertrophic
  zones per liao2026, not on late proliferative cells at the commitment boundary, and qiu2015 shows part
  of the effect is indirect via osteoblast PTH1R and endochondral angiogenesis.'
