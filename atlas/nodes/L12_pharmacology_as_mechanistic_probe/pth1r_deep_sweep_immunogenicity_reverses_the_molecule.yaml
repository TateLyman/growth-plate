id: pth1r_deep_sweep_immunogenicity_reverses_the_molecule
name: PTH1R DEEP SWEEP - immunogenicity reverses the molecule choice to teriparatide, human growth data
  turns out to exist, and the exposure gap was overstated
aliases:
- the full PTH1R ledger
- abaloparatide neutralising antibodies
- anti-PTHrP antibodies
- round 188
type: hypothesis
layer: L12
stub: false
summary: 'A SYSTEMATIC SWEEP OF EVERY QUESTION THAT COULD MOVE THE PTH1R VERDICT. Five findings push it
  up, six push it down, and ONE OF THEM REVERSES THE MOLECULE CHOICE THAT ROUNDS 184 AND 187 BOTH GOT
  WRONG.

  THE FINDING THAT CHANGES THE ANSWER - IMMUNOGENICITY, AND IT IS ABALOPARATIDE-SPECIFIC. The TYMLOS
  label, section 12.6, which this atlas had not read: of patients on abaloparatide for eighteen months,
  41 PER CENT developed anti-drug antibodies and 26 PER CENT DEVELOPED NEUTRALISING ANTIBODIES. Of
  those tested for cross-reactivity, 2.4 per cent (7 of 297) developed antibodies cross-reacting with
  PTHrP, AND THREE OF THOSE SEVEN HAD NEUTRALISING ANTIBODIES AGAINST ENDOGENOUS PTHrP. Antibodies
  persisted long after stopping - 127 patients still positive at one year, 55 at two years, 6 at three.
  The FORTEO label, section 6.2, for comparison: 3 per cent, first detected after twelve months,
  diminishing after withdrawal, no effect on calcium or bone mineral density, no neutralising fraction
  reported.

  AND THE SECOND HALF OF THAT IS A MECHANISM BY WHICH THIS DRUG COULD SHORTEN HIM. Endogenous PTHrP is
  the ligand the growth plate runs on. Neutralising it reproduces the PTHLH loss-of-function direction,
  and in humans PTHLH nonsense variants cause brachydactyly type E WITH SHORT STATURE. THE PROPERTY
  THAT MADE ABALOPARATIDE MECHANISTICALLY ATTRACTIVE - BEING A PTHrP ANALOGUE RATHER THAN A PTH ONE -
  IS EXACTLY WHAT LETS ANTI-DRUG ANTIBODIES CROSS-REACT WITH THE PLATE''S OWN SIGNAL.

  WHY THIS MATTERS MORE HERE THAN IN OSTEOPOROSIS, WHERE THE LABEL CALLS IT CLINICALLY INSIGNIFICANT.
  Three differences all cut the same way. THE WINDOW IS NON-REPEATABLE - plates close, so a one-in-four
  chance of losing drug activity partway through the only opportunity is not the same risk as losing
  bone density you can chase later. THE ENDPOINT IS MORE SENSITIVE than bone mineral density. And THE
  TAIL IS INVERTED RATHER THAN MERELY NULL - neutralising endogenous PTHrP does not fail to help, it
  reproduces a human short-stature genotype, during the growth window, and persists for years.

  SO THE MOLECULE FLIPS TO TERIPARATIDE. It is also the molecule in the only wild-type growth
  experiment, which round 186 established and round 187 set aside on exposure grounds. Those exposure
  grounds have now weakened too - see below.

  WHAT ELSE PUSHES IT UP. FIRST, HUMAN LINEAR-GROWTH DATA EXISTS AND THIS ATLAS SAID IT DID NOT.
  winer2025 in JCEM pooled children with hypoparathyroidism on PTH(1-34), mean baseline age 13.7 plus
  or minus 5.5 years - adolescents, the right age band. Height-for-age Z INCREASED in the
  calcium-sensing-receptor group with an age-by-group interaction at P below 0.0001, while the APS-1
  group stayed below zero. It is replacement dosing in hypoparathyroidism so correcting calcium is a
  confound and APS-1 carries independent growth suppression, but it is human, adolescent, and positive
  in the cleaner arm. SECOND, ABALOPARATIDE-SPECIFIC CHONDROCYTE DATA NOW EXISTS - yang2019 shows it
  stimulates chondrogenesis and SUPPRESSES hypertrophic differentiation in mouse limb-bud mesenchyme.
  THIRD, AND THIS IS A DURATION BONUS NOBODY HAS COUNTED - qiu2015 deleted PTH1R in OSTEOBLASTS and got
  postnatal growth retardation, fewer hypertrophic chondrocytes, impaired endochondral angiogenesis and
  PREMATURE GROWTH PLATE FUSION with shortened long bones. Loss of function closes the plate early, so
  agonism plausibly delays closure. FOURTH, THE OSTEOSARCOMA BARRIER IS WEAKER THAN THE LABEL IMPLIES -
  abdulelah2023 finds no increased risk across trials and post-marketing surveillance out to FIFTEEN
  YEARS. FIFTH, BOTH LABELS CONFIRM THE DOSE IS A GENUINE PULSE IN HUMANS: teriparatide serum calcium
  peaks at four to six hours and RETURNS TO BASELINE BY SIXTEEN TO TWENTY-FOUR HOURS, which is the
  direct measurement round 185 lacked.

  AND THE EXPOSURE GAP WAS OVERSTATED. Rounds 184 and 187 said the approved dose is about ten-fold
  below the human equivalent of the rat dose. That figure came ENTIRELY from ogawa2002''s unusually
  high 80 micrograms per kilogram per day. liao2026 gave ABALOPARATIDE at 5 micrograms per kilogram per
  day to growing mice and got measurable skeletal change; by body-surface-area scaling that is 0.41
  micrograms per kilogram per day human-equivalent, about 24 micrograms a day at 60 kg. THE APPROVED
  ABALOPARATIDE DOSE IS 3.3-FOLD ABOVE THAT MOUSE ANCHOR, NOT BELOW IT. The two animal anchors disagree
  by thirty-two fold and nobody has run a dose-response for a growth endpoint in either species, so the
  gap is a distance to an arbitrary point rather than to a threshold.

  WHAT ELSE PUSHES IT DOWN. A THIRD INDEPENDENT MODEL SAYS MORE PTH1R SIGNALLING IN CHONDROCYTES MEANS
  SHORTER LIMBS. liao2026 in PNAS: losing Nf2 in Col2a1-positive chondrocytes decouples PTH1R from
  beta-arrestin2 internalisation and amplifies cAMP-CREB-pSOX9(S181)-VEGF-A signalling, producing
  SHORT-LIMBED DWARFISM with reduced growth plate, proliferative, hypertrophic AND resting zone lengths
  and reduced EdU incorporation. The authors say it mimics PTH1R gain-of-function and Jansen. It is
  genetic and sustained rather than pulsatile, but Jansen, the humanized H223R mouse and now Nf2 all
  agree on direction.

  AND THE LOCALISATION ARGUMENT FOR AMPLIFICATION WEAKENS. liao2026 states PTH1R has spatial enrichment
  in the HYPERTROPHIC zone, with Nf2-PTH1R colocalisation in PREhypertrophic and hypertrophic
  chondrocytes. Round 184 argued the receptor sits at the commitment boundary on late-proliferative
  cells, and used that as the reason to expect an amplification effect rather than a pool effect. If
  the receptor is mostly POST-commitment, the drug acts on cells that have already left the
  proliferative compartment.

  AND THE EXPERIMENT THIS PROGRAMME NEEDS HAS ALREADY BEEN RUN WITH THE KEY ENDPOINT MISSING. liao2026
  gave abaloparatide 5 micrograms per kilogram per day for thirty days to ONE-MONTH-OLD MICE - growing
  animals, wild-type controls included - and reported only trabecular and cortical microarchitecture.
  BONE LENGTH WAS NOT REPORTED. Those animals, or that histology, would answer the wild-type
  abaloparatide question directly.

  THE REVISED RECOMMENDATION. TERIPARATIDE 20 MICROGRAMS SUBCUTANEOUS DAILY, FIVE DAYS ON AND TWO OFF,
  EVENING, at a consistent time before lying down. Everything structural from round 187 survives - the
  schedule matches ogawa2002 exactly, the evening timing lays the five-to-six-hour window over the
  period when at least ninety per cent of elongation happens, and the washout hedges the round-185
  clock model. Only the molecule changes, and it changes to the one that was tested. If abaloparatide
  is used instead for its four-fold higher labelled exposure, anti-drug antibody testing at six and
  twelve months is the minimum, and the anti-PTHrP cross-reactivity risk cannot be monitored away
  because it is not a routinely available assay and the antibodies persist for years.

  AND THE CENTRAL QUESTION IS STILL OPEN. Whether the cell-production gain is amplification or faster
  pool consumption remains unmeasured in any species under any PTH1R agonist. Round 183 is the standing
  precedent: growth hormone raised cell production 3.87-fold and 97 per cent of it was faster pool
  spending, with amplification falling to 0.77. If a PTH1R agonist does the same it stacks in COST with
  the GH already in the stack rather than in benefit.'
