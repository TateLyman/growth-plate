id: pth1r_verdict_the_schedule_does_not_survive_the_species_jump
name: PTH1R VERDICT - the candidate is not cleared and not dead; daily dosing is twenty times too
  frequent for a human chondrocyte and the only defensible regimen is one nobody has tried
aliases:
- PTH1R verdict
- the intermittency benchmark
- is abaloparatide dead
- round 185
type: hypothesis
layer: L12
stub: false
summary: 'ASKED TO CLEAR OR TOSS THE PTH1R CANDIDATE, AND THE HONEST ANSWER IS NEITHER - BUT THE VERSION
  PROPOSED IN ROUND 184 IS PROBABLY WRONG, AND WRONG IN THE DIRECTION OF HARM. Round 184 named
  intermittent PTH1R agonism, abaloparatide over teriparatide, as the best yield candidate. This round
  tried to break it. Four things emerged, three of them bad for the candidate and one of them a
  quantitative argument that had not been made anywhere.

  FIRST, THE EVIDENCE BASE IS THINNER THAN IT LOOKED AND HAS NOT MOVED IN TWENTY-FOUR YEARS. ogawa2002
  is the entire wild-type case. It has THIRTEEN citations since 2002. Not one of them replicates the
  wild-type longitudinal growth finding - they are fracture healing, tooth movement, viral PTH delivery,
  achondroplasia rescue, and reviews. A positive growth-rate result in normal animals that nobody has
  reproduced or pursued in twenty-four years is weak evidence, and this atlas built a candidate on its
  ABSTRACT. The full text has not been read; it is not open access.

  SECOND, ONE OF ITS THREE READOUTS HAS BEEN CONTRADICTED. silvestrini2007 treated rats with PTH and
  reports that Cartilage Growth Plate Width "was not affected by PTH". ogawa2002 reports growth plate
  thickness increased. Different ages, doses and durations, so this is not a clean refutation - but it
  is the only other rat study to measure the same structure under PTH and it found nothing.

  THIRD, THE HUMAN DOSE-RESPONSE EXISTS, IT IS LARGE, AND IT POINTS THE WRONG WAY. imaizumi2026, 622
  paediatric dialysis patients aged 1 to 20 in the Japanese nationwide registry: each DOUBLING of
  intact PTH was associated with a fall in height velocity SDS of 0.26 (95 per cent CI -0.49 to -0.02)
  and an odds ratio of 1.16 (1.00 to 1.34) for height growth failure, with a restricted cubic spline
  showing height velocity declining monotonically as PTH rose. THE CAVEATS ARE HEAVY AND THEY MATTER -
  this is chronic ENDOGENOUS secondary hyperparathyroidism in uraemic children, confounded by
  CKD-mineral bone disorder, acidosis and nutrition, and intact PTH is a severity marker for all of
  them. It is not a test of intermittent exogenous dosing. But it IS the largest human dataset
  relating PTH exposure to height velocity that exists, and it belongs on the CONTINUOUS side of the
  ledger where it agrees with everything else there.

  FOURTH, AND THIS IS THE ARGUMENT THAT ACTUALLY DECIDES THE ROUND. THE SIGN OF THIS DRUG CLASS
  INVERTS WITH SCHEDULE, AND "INTERMITTENT" IS NOT A PROPERTY OF A SYRINGE - IT IS A RATIO BETWEEN THE
  DOSING INTERVAL AND THE CLOCK OF THE CELL. This atlas already holds both clocks from primaries it has
  read in full: the rat proliferative chondrocyte cycle is 1.4 days (hunziker1994) and the human one is
  about 20 days (kember1976 via the round-177 human anchor). Converting every real regimen into DOSES
  PER CHONDROCYTE CELL CYCLE:

  ogawa2002 rat, five days a week - ONE PULSE PER CELL CYCLE. The cell saw the drug once and then went
  a full cycle without it. Teriparatide or abaloparatide DAILY - TWENTY pulses per cell cycle, twenty
  times more often than the rat. Twice-weekly - 5.7. Weekly - 2.9. Every three weeks - 1.0, which
  matches the rat exactly.

  SO THE HUMAN EQUIVALENT OF THE RAT SCHEDULE IS ROUGHLY ONE INJECTION EVERY THREE WEEKS, AND THE
  LICENSED REGIMEN IS DAILY. Across the entire plausible range of the human cycle time, 10 to 30 days,
  daily dosing is 10 to 30 fold too frequent, so the conclusion does not depend on the exact value.
  Even taking the slowest rat plate wilsman1996 ever measured, daily is still 8 to 9 fold too frequent.

  WHY THAT IS NOT A PEDANTIC POINT. For a drug whose sign inverts with schedule, being twenty times
  too frequent is not a dose error, it is a move toward the harmful arm. Every continuous exposure on
  record produces the same phenotype - Jansen, reyes2023''s humanized H223R plate, liu2012''s continuous
  arm, the PTHrP-overexpression and constitutively-active-receptor transgenics, and now imaizumi2026 in
  children. Daily dosing in a human is far closer to that arm, measured against the target cell''s own
  clock, than daily dosing in a rat is.

  THE OBVIOUS RESCUE FAILS. Vosoritide is also a roughly 4 kDa peptide with a very short half-life,
  also dosed daily, and it works in humans - which kills the PHARMACOKINETIC objection completely and
  should be conceded. It does not touch this one, because CNP is schedule-INSENSITIVE: yasoda2004''s
  chondrocyte-targeted CNP overexpression is permanent transgenic exposure and it rescues
  achondroplasia. A drug that works continuously and intermittently can be dosed daily anywhere. A drug
  that inverts cannot.

  WHAT KEEPS IT ALIVE, AND IT IS NOT NOTHING. The mechanism is still the only exact match to the term -
  PTHrP acting on PTH1R at the commitment boundary IS the delay signal, and amplification IS commitment
  delay. The human loss-of-function direction supports it: PTHLH nonsense variants cause brachydactyly
  type E WITH SHORT STATURE, so less PTHrP means a shorter human. The Jansen reinterpretation from round
  184 stands - reyes2023 shows the delay works and the plate is short because the accumulated cells
  apoptose rather than hypertrophy. And the regimen the benchmark asks for is not exotic: WEEKLY
  TERIPARATIDE 56.5 MICROGRAMS IS AN APPROVED PRODUCT in Japan and now in China, and twice-weekly
  regimens are in clinical use. Weekly lands at 2.9 pulses per human cell cycle against the rat''s 1.0 -
  still too frequent by a factor of about three, but within a factor of a few rather than an order of
  magnitude, and it is the closest thing that exists.

  THE VERDICT, STATED PLAINLY. ROUND 184''S SPECIFIC RECOMMENDATION - DAILY ABALOPARATIDE - IS
  WITHDRAWN. It was the right molecule on the wrong schedule, and the schedule is the part of this drug
  that carries the sign. What survives is a narrower and weaker claim: PTH1R agonism remains the only
  mechanistically exact amplification lever with an approved molecule, its one supporting experiment is
  a single unreplicated rat study read only in abstract, its human dose-response evidence is negative
  but confounded and on the wrong arm, and IF it is ever tried the interval must be weeks rather than
  days. That is a candidate worth one decisive experiment, not a candidate worth taking.

  AND THE ONE THING THAT WOULD COLLAPSE THE WHOLE BENCHMARK, STATED SO IT CANNOT BE HIDDEN. The
  argument assumes the operative clock for intermittency is the CHONDROCYTE COMMITMENT CLOCK, which
  scales with the cell cycle. If instead it is PTH1R DESENSITISATION AND RESENSITISATION - receptor
  intrinsic, minutes to hours, almost certainly similar across species - then the duty cycle is
  species-invariant, daily dosing is genuinely intermittent in a human too, and this entire round is
  wrong. The evidence leans toward the commitment clock, because the phenotype defining the harmful arm
  is a differentiation-timing failure rather than a receptor failing to resensitise. But a focused
  search returns two papers on PTH1R desensitisation kinetics and neither is in cartilage. NOBODY HAS
  MEASURED IT IN A CHONDROCYTE OF EITHER SPECIES.'
quantitative:
- parameter: citations to the entire wild-type case for this candidate, 2002 to 2026
  value: '13'
  unit: citations
  conditions: Europe PMC citation list for ogawa2002; none replicates the wild-type longitudinal growth
    finding - the citing papers are fracture healing, tooth movement, AAV-delivered PTH, achondroplasia
    rescue, in vitro growth plate models and reviews
  species: not_applicable
  source_ref: ogawa2002
  uncertainty: 'TWENTY-FOUR YEARS OF SILENCE ON A POSITIVE GROWTH RESULT IN NORMAL ANIMALS. Absence of
    replication is not refutation, but a finding this useful going unpursued for that long is evidence
    about how much weight the field placed on it. THE FULL TEXT HAS STILL NOT BEEN READ - it is not open
    access and the candidate was built on the abstract'
- parameter: growth plate width in rats treated with PTH alone
  value: not affected
  unit: direction
  conditions: rat femur and tibia metaphyses; corticosterone reduced cartilage growth plate width and
    corticosterone plus PTH reduced it, with recovery on withdrawal, while PTH alone did not change it
  species: rat
  source_ref: silvestrini2007
  uncertainty: 'THE ONLY OTHER RAT STUDY TO MEASURE THE SAME STRUCTURE UNDER PTH AND IT FOUND NOTHING.
    Not a clean refutation - different age, dose and duration, and growth plate width was a secondary
    readout in a bone-remodelling study - but it is a non-replication of one of ogawa2002 three readouts'
- parameter: human height velocity against PTH exposure
  value: -0.26 per doubling of intact PTH
  unit: height velocity SDS
  conditions: 622 patients aged 1-20 initiating dialysis, Japanese nationwide registry 2009-2020, median
    intact PTH 183 pg/mL, median height SDS -1.9; odds ratio 1.16 (1.00-1.34) for height growth failure;
    restricted cubic spline showed height velocity falling as PTH rose
  species: human
  source_ref: imaizumi2026
  uncertainty: '95 per cent CI -0.49 to -0.02. HEAVILY CONFOUNDED - chronic endogenous secondary
    hyperparathyroidism in uraemic children, with CKD-mineral bone disorder, acidosis and nutrition all
    tracking intact PTH, which is a severity marker for the lot. It is NOT a test of intermittent
    exogenous dosing. It is the largest human PTH-versus-height dataset in existence and it sits on the
    CONTINUOUS side of the ledger, where it agrees with every other entry'
- parameter: THE BENCHMARK - doses per proliferative chondrocyte cell cycle
  value: rat 1.0, human daily 20.0, twice-weekly 5.7, weekly 2.9, three-weekly 1.0
  unit: pulses per cell cycle
  conditions: rat proliferative cycle 1.4 days (hunziker1994, normal rats) and human about 20 days
    (kember1976 via the round-177 anchor); ogawa2002 dosed five days a week; human regimens are the
    licensed teriparatide and abaloparatide schedules plus the approved weekly and twice-weekly ones
  species: not_applicable
  source_ref: kember1976
  uncertainty: 'THE RAT RECEIVED ONE PULSE PER CELL CYCLE AND DAILY HUMAN DOSING DELIVERS TWENTY. The
    metric is chosen to be robust - it needs only dosing frequency and cycle time, not half-life, Cmax
    or tissue concentration, none of which has ever been measured at a growth plate for any agent.
    Sensitivity: across a human cycle of 10 to 30 days daily is 10 to 30 fold too frequent, and even at
    the slowest rat plate wilsman1996 measured it is still 8 to 9 fold too frequent'
- parameter: dosing interval that reproduces the rat schedule in a human
  value: '20'
  unit: days between injections
  conditions: solving for one pulse per human proliferative chondrocyte cycle; the licensed regimen for
    both teriparatide and abaloparatide is daily
  species: human
  source_ref: kember1976
  uncertainty: 'THE ACTIONABLE OUTPUT AND IT IS A REGIMEN NOBODY HAS TRIED. Range 10 to 30 days over the
    plausible cycle range. The closest existing product is WEEKLY teriparatide 56.5 micrograms, approved
    in Japan and studied to phase III in China, which lands at 2.9 pulses per cycle - about three times
    too frequent rather than twenty'
- parameter: human loss-of-function direction for the ligand
  value: short stature
  unit: direction
  conditions: heterozygous PTHLH nonsense variant in a mother-son pair with brachydactyly type E and
    short stature; PTHLH variants are an established autosomal dominant cause variably associated with
    short stature
  species: human
  source_ref: huang2026
  uncertainty: 'THE ONE HUMAN GENETIC LINE THAT FAVOURS THE CANDIDATE. Less PTHrP makes a shorter human,
    so the ligand is growth-positive in the physiological range. It says nothing about whether MORE than
    normal helps, which is the actual question, and brachydactyly type E involves a broader skeletal
    phenotype than stature alone'
localization:
- 'the commitment boundary - PTH1R on late proliferative and prehypertrophic cells, where the delay
  signal acts and where the schedule question is decided'
human_evidence: indirect
human_evidence_note: 'Three indirect human lines, two against and one for. AGAINST - imaizumi2026, 622
  paediatric dialysis patients with height velocity falling as intact PTH rises, confounded and on the
  continuous arm; and Jansen metaphyseal chondrodysplasia, constitutive activation with short stature.
  FOR - PTHLH nonsense variants causing brachydactyly type E with short stature, so the ligand is
  growth-positive in the physiological range. No human has ever received a PTH1R agonist at an anabolic
  dose with a growth endpoint, at any schedule.'
species_basis:
- rat
- mouse
- human
translation_risk: high
translation_risk_reason: 'The specific translation failure is now named and quantified rather than
  generic. The wild-type positive is one unreplicated three-week rat study at one dose with an age gate
  falling on the wrong side, and its dosing schedule delivers one pulse per rat chondrocyte cycle while
  the licensed human schedule delivers twenty per human cycle. For a drug whose sign inverts with
  schedule, that is not a translation risk in the usual sense - it is a reason to expect the human
  result to differ in DIRECTION and not merely in size.'
confidence: D
claim_grades:
- claim: Daily abaloparatide or teriparatide is a usable yield intervention.
  grade: X
  basis: 'WITHDRAWN, AND THIS CORRECTS ROUND 184 ONE ROUND AFTER IT WAS WRITTEN. The licensed daily
    schedule delivers 20 pulses per human proliferative chondrocyte cycle against the 1.0 that the only
    supporting experiment delivered to a rat. For a drug class whose sign inverts between intermittent
    and continuous, being 20-fold too frequent is a move toward the arm where every recorded exposure -
    Jansen, reyes2023, liu2012 continuous, the transgenics, imaizumi2026 - shortens bone. Right
    molecule, wrong schedule, and the schedule is what carries the sign.'
- claim: PTH1R agonism is dead as a yield lever.
  grade: E
  basis: 'NOT ESTABLISHED, AND THE USER''S INSTINCT IS CLOSER TO RIGHT THAN ROUND 184 WAS BUT STILL
    STRONGER THAN THE EVIDENCE. What is dead is the daily regimen. The mechanism remains the only exact
    match to the amplification term; PTHLH loss of function shortens humans, so the ligand is
    growth-positive in the physiological range; the Jansen reinterpretation stands; and an approved
    weekly product exists that lands within a factor of three of the rat schedule rather than twenty. A
    lever whose only trial used a schedule 20-fold off cannot be called refuted by that trial.'
- claim: The intermittency benchmark is decisive.
  grade: D
  basis: 'IT IS THE STRONGEST ARGUMENT IN THIS ROUND AND IT RESTS ON ONE UNTESTED ASSUMPTION. The
    benchmark assumes the clock setting intermittency is the CHONDROCYTE COMMITMENT CLOCK, which scales
    with the cell cycle and is 14-fold slower in human. If it is instead PTH1R desensitisation and
    resensitisation - receptor-intrinsic, minutes to hours, near species-invariant - then the duty cycle
    transfers unchanged, daily dosing is genuinely intermittent in a human, and the whole argument
    collapses. The phenotype defining the harmful arm is a differentiation-timing failure rather than a
    resensitisation failure, which leans toward the commitment clock, but a focused search returns two
    papers on PTH1R desensitisation kinetics and neither is in cartilage.'
- claim: ogawa2002 is strong enough to build a recommendation on.
  grade: X
  basis: 'NO, AND THIS ATLAS DID IT ANYWAY ONE ROUND AGO. Thirteen citations in twenty-four years, no
    replication of the wild-type finding, a single dose with no dose-response, an age gate with the
    effect absent in the older cohort, one of its three readouts unreplicated by silvestrini2007, and it
    was read only in ABSTRACT because the full text is paywalled. Round 184 named it "the only agent in
    this programme that raised the growth rate of a normal animal", which is true and is also the
    reason it was over-weighted.'
- claim: The paediatric dialysis cohort refutes PTH1R agonism.
  grade: X
  basis: 'IT DOES NOT, AND USING IT THAT WAY WOULD REPEAT THE MISTAKE THIS ROUND IS CORRECTING.
    imaizumi2026 measures chronic ENDOGENOUS secondary hyperparathyroidism in uraemic children, where
    intact PTH is a severity marker for CKD-mineral bone disorder, acidosis and malnutrition, all of
    which independently suppress growth. It is evidence about the continuous arm, where it agrees with
    Jansen and the transgenics. It says nothing directly about a pulse every three weeks.'
- claim: Vosoritide's daily success shows short daily peptide pulses can drive a human plate, so the
    schedule objection fails.
  grade: X
  basis: 'IT DEFEATS THE PHARMACOKINETIC OBJECTION AND NOT THIS ONE, AND THE DISTINCTION IS THE POINT.
    CNP is schedule-INSENSITIVE - yasoda2004''s chondrocyte-targeted overexpression is permanent
    exposure and rescues achondroplasia, so continuous CNP works too. PTH1R agonism inverts. A regimen
    that is safe for a schedule-insensitive drug carries no information about a schedule-inverting one.'
