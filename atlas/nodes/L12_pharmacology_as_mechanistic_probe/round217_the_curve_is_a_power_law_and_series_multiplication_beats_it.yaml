id: round217_the_curve_is_a_power_law_and_series_multiplication_beats_it
name: ROUND 217 - the FGFR3 growth curve is a power law with an exponent near 2.4 to 3.3, dose escalation
  inside the label buys 20 per cent, the protein-binding lever is arithmetically dead, and the only way to
  beat the curve at a fixed 8 mg is multiplication at nodes in series
type: hypothesis
layer: L12
aliases:
- the curve fitted
- how to beat the curve at 8 mg
- series multiplication
- round 217
stub: false
summary: 'THE DOSE IS FIXED AT ERDAFITINIB 8 mg AND SAFETY IS SET ASIDE, WHICH MAKES THE QUESTION PURELY
  QUANTITATIVE. What is growth gain as a function of FGFR3 pathway inhibition, and what raises inhibition
  without raising the dose?

  FIRST, TRANSLATE EXPOSURE INTO INHIBITION. For a competitive inhibitor the residual signal is 1/(1 +
  C/IC50). On the developers'' own cellular IC50 values from round 216, the whole clinically attainable
  range is astonishingly compressed - 15.0 per cent inhibition at erdafitinib 3 mg, 29.1 at 7 mg, 31.9 AT
  THE 8 mg THIS ROUND FIXES, 34.5 at the 9 mg label maximum, 22.6 at dabogratinib 60 mg and 40.8 at 90 mg.
  NOBODY HAS EVER HALVED FGFR3 SIGNALLING IN A GROWING HUMAN.

  SECOND, FIT THE CURVE, AND IT FITS TWICE INDEPENDENTLY. On the human side, 15.0 per cent inhibition gave
  about 10 cm/year and 29.1 per cent gave 19.06 - so a 1.94-fold rise in inhibition travelled with a
  4.87-fold rise in GAIN above a typical paediatric 7.66 cm/year, a POWER-LAW EXPONENT OF 2.38. On the
  mouse side, from the deposited individual-animal data, 12 to 14 mg/kg gave +3.86 to +6.45 per cent in
  tibia and +5.00 to +8.23 in femur - EXPONENTS OF 3.33 AND 3.23, and that fit needs no baseline choice at
  all. TWO SPECIES, TWO UNRELATED READOUTS, BOTH STRONGLY SUPRA-LINEAR.

  THE HONEST LIMIT ON THE HUMAN FIT IS THE BASELINE. The exponent runs 1.39 at a 4 cm/year baseline to 3.48
  at 9, which is the largest single uncertainty in the round. WHAT SURVIVES EVERY CHOICE IS THAT IT IS
  ALWAYS WELL ABOVE 1. The curve is supra-linear regardless, and every conclusion below scales with the
  exponent and should be read as a range.

  WHY A BRAKE-RELEASE CURVE SHOULD BE CONVEX, AND IT FOLLOWS FROM THE ATLAS''s OWN DECOMPOSITION. Length is
  CELLS RECRUITED FROM THE RESERVE times DIVISIONS EACH times TERMINAL CELL HEIGHT, and FGFR3 inhibition
  raises all three - horike2026 puts excess FGFR3 on resting-zone TURNOVER through an ERK-INDEPENDENT CREB
  limb, tyra300_2025 reports increased proliferation AND differentiation, and weber2025''s exchange rate
  makes the hypertrophic term worth 40 to 50 micrometres against 8 to 9 for a division. THREE
  MULTIPLICATIVE TERMS EACH RISING A FEW PER CENT COMPOUND INTO A CONVEX OUTPUT - a 6.45 per cent tibia gain
  is about 2.1 per cent per term if the three are equal.

  THIRD, THE LEVER THAT LOOKS BIGGEST IS ARITHMETICALLY DEAD, AND IT NEEDS RECORDING SO IT IS NOT PROPOSED
  AGAIN. Erdafitinib is 99.7 per cent bound to alpha-1-acid glycoprotein, which varies several-fold between
  individuals, so displacing it looks like a way to multiply free drug at a fixed 8 mg. IT IS NOT. For a
  LOW-EXTRACTION drug the unbound steady-state concentration is Dose divided by intrinsic clearance and
  dosing interval, and is INDEPENDENT OF PROTEIN BINDING - raising the free fraction raises total clearance
  in exact proportion. Erdafitinib''s CL/F of 0.362 L/h against a hepatic blood flow near 90 L/h makes it as
  low-extraction as drugs get. AND zhu2026 PROVES IT WITHOUT MEANING TO - in moderate hepatic impairment the
  free fraction ROSE, apparent clearance rose with it, and the geometric mean ratios for FREE Cmax and FREE
  AUC against controls were 104.8 and 87.5 per cent. Unchanged unbound exposure. The one natural experiment
  that perturbs binding shows free concentration does not move. Recorded as CORR-212.

  FOURTH, DOSE ESCALATION INSIDE THE LABEL IS NOT A LEVER EITHER. Using the fitted exponent, 8 to 9 mg buys
  about 20 PER CENT more gain. That is the entire label headroom. Even dabogratinib at 90 mg, which costs a
  liver signal, is only about 1.8-fold.

  FIFTH, AND THIS IS THE ANSWER. RESIDUAL SIGNAL MULTIPLIES ACROSS INDEPENDENT NODES IN ONE CASCADE WHILE
  THE GROWTH RESPONSE IS A POWER OF TOTAL INHIBITION, AND THAT ASYMMETRY IS THE WHOLE OPPORTUNITY. 8 mg
  erdafitinib leaves a residual of 0.681. A second agent removing 26.5 per cent of the pathway on its own
  takes the combined inhibition to 50.0 per cent, which on the fitted curve is 2.91 TIMES THE GROWTH GAIN
  and is equivalent to an erdafitinib dose of about 17 mg - roughly twice the label maximum. A second agent
  at 40 per cent takes it to 4.35-fold, equivalent to 25 mg. ONE MODEST PARTNER TRIPLES THE OUTPUT WITHOUT
  TOUCHING THE DOSE.

  AND THE SERIES NODES ALL EXIST AND ARE ALREADY IN THIS ATLAS, IN ORDER ALONG THE CASCADE. LIGAND - a
  soluble FGFR3 decoy works extracellularly and is the one biologic geometry avascular cartilage does not
  exclude. LIGAND, COMPENSATORY - surf301_pb060_2024 found FGF19 AND KLOTHO-BETA ROSE on treatment as a
  potential compensatory response to FGFR3 inhibition, with no rise in FGF21; THE SYSTEM PUSHES BACK BY
  RAISING THE LIGAND, WHICH IS EXACTLY WHAT FLATTENS THE CURVE, and blocking that loop would steepen it.
  RECEPTOR ABUNDANCE - statins, whose proposed mechanism is enhanced DEGRADATION of FGFR3 protein rather
  than kinase inhibition, so strictly in series with an ATP-competitive inhibitor. KINASE - erdafitinib 8
  mg, the fixed anchor. DOWNSTREAM MAPK - meclizine, which has full human paediatric pharmacokinetics and
  whose +0.11 cm/year alone is exactly what a small series contribution looks like when given as
  monotherapy. THE ERK-INDEPENDENT CREB LIMB - horike2026''s 666-15, which restored bone length in the
  achondroplasia mouse but was NULL IN WILD-TYPE, so it corrects pathology rather than elevating a normal
  plate. AND ONE THAT IS NOT IN SERIES AT ALL - CNP arm two, the cAMP/PKA effect on hypertrophic zone
  elongation that hirota2022 showed is blocked by H89, which does not multiply with erdafitinib but ADDS ON
  A DIFFERENT TERM, which is better.

  WHAT IS MISSING IS ONE NUMBER PER AGENT AND NOBODY HAS EVER MEASURED THEM ON ONE AXIS. To use the
  multiplication table we need, for each candidate, the FRACTION OF FGFR3 PATHWAY OUTPUT IT REMOVES IN A
  CHONDROCYTE AT AN ACHIEVABLE HUMAN CONCENTRATION - measurable as phospho-ERK or phospho-FGFR suppression
  in one assay for all of them. EVERY AGENT ON THE LIST HAS BEEN STUDIED ALONE, AS MONOTHERAPY, AGAINST A
  GROWTH ENDPOINT, WHICH IS THE LEAST INFORMATIVE WAY TO TEST SOMETHING WHOSE VALUE IS MULTIPLICATIVE.

  AND THE ASSUMPTION THAT COULD SINK IT IS INDEPENDENCE. Series multiplication assumes the nodes do not
  share a rate-limiting step and that the cascade has no strong feedback. THE FGF19 AND KLOTHO-BETA RISE IS
  DIRECT EVIDENCE OF FEEDBACK, so the true combined effect will be less than the product. How much less is
  unmeasured, and it is the first thing the discriminating experiment should read out.'
quantitative:
- parameter: the clinically attainable range of FGFR3 pathway inhibition
  value: erdafitinib 3 mg gives 15.0 per cent inhibition, 7 mg 29.1, 8 mg 31.9, 9 mg label maximum 34.5;
    dabogratinib 45 mg 15.8, 60 mg 22.6, 90 mg 40.8, 120 mg 61.2. Computed as 1 minus 1/(1 + C/IC50) from
    free steady-state concentration over each drug's own cellular IC50
  unit: per cent of FGFR3 pathway output removed
  conditions: round 216's free coverage values on the developers' own Ba/F3 IC50s, competitive inhibition
    with a Hill coefficient of 1
  species: human
  source_ref: perera2017
  uncertainty: 'THE RANGE IS COMPRESSED AND NOBODY HAS HALVED FGFR3 SIGNALLING IN A GROWING HUMAN. Hill
    coefficient of 1 is an assumption - a steeper Hill slope would compress the range further and a
    shallower one would widen it. A 4-day proliferation IC50 also overstates the concentration needed for
    pathway inhibition, so these percentages are probably an underestimate of true pathway engagement by an
    unknown factor'
  value_unverified: true
- parameter: the fitted power-law exponent of the growth curve, human
  value: 15.0 per cent inhibition gave about 10 cm/year and 29.1 per cent gave 19.06 cm/year, so a 1.94-fold
    rise in inhibition travelled with a 4.87-fold rise in gain above a typical paediatric 7.66 cm/year -
    AN EXPONENT OF 2.38. Baseline sensitivity - 1.39 at a 4 cm/year baseline, 1.78 at 6, 2.38 at 7.66, 2.94
    at 8.5 and 3.48 at 9
  unit: exponent of gain against fractional inhibition
  conditions: erdaseries2025 patient 1 at 3 mg and erdachild2024 at 7 mg, against the typical paediatric
    velocity quoted in tyra_corporate_deck_2026
  species: human
  source_ref: erdachild2024
  uncertainty: 'TWO PATIENTS, AND THE EXPONENT IS STRONGLY BASELINE-SENSITIVE - that is the biggest single
    uncertainty in the round. The two children differ in age, growth hormone status, gonadal status and
    available catch-up, neither paper reports velocity by dose period, and one had severe pre-treatment
    impairment so part of the 10 cm/year is catch-up rather than drug. WHAT SURVIVES EVERY BASELINE CHOICE
    IS THAT THE EXPONENT IS WELL ABOVE 1'
  value_unverified: true
- parameter: the fitted power-law exponent, mouse, independently and with no baseline choice
  value: tibia went from +3.86 per cent at 12 mg/kg to +6.45 at 14, an exponent of 3.33; femur from +5.00 to
    +8.23, an exponent of 3.23
  unit: exponent of per cent length gain against dose
  conditions: jci.insight.189307.sdval.xlsx sheets 1C and 1D, wild-type C57BL/6J, this atlas's re-analysis
  species: mouse
  source_ref: tyra300_2025
  uncertainty: 'THE STRONGER OF THE TWO FITS because per cent gain against vehicle needs no baseline
    assumption. It uses dose as an exposure proxy across a narrow 1.17-fold range, so the exponent is
    leveraged by a small span, and the 14-against-12 increment was p = 0.055 and 0.084. Two bones agreeing
    at 3.2 to 3.3 is the reassurance'
  value_unverified: true
- parameter: protein-binding displacement cannot raise unbound exposure
  value: for a low-extraction drug the unbound steady-state concentration equals dose divided by intrinsic
    clearance and dosing interval and is INDEPENDENT of protein binding. Erdafitinib's CL/F of 0.362 L/h
    against a hepatic blood flow near 90 L/h gives an extraction ratio well under 1 per cent. And in
    moderate hepatic impairment the free fraction rose while apparent clearance rose with it, giving
    geometric mean ratios against controls of 104.8 per cent for FREE Cmax and 87.5 per cent for FREE AUC
  unit: geometric mean ratio of free exposure, per cent
  conditions: zhu2026, phase 1 single 6 mg dose, 8 participants per hepatic function group
  species: human
  source_ref: zhu2026
  uncertainty: 'A CLEAN ARITHMETIC NEGATIVE WITH AN EMPIRICAL CONFIRMATION THE AUTHORS DID NOT INTEND. It
    kills the whole family of ideas built on erdafitinib being 99.7 per cent bound. THE ONE CAVEAT - hepatic
    impairment changes more than binding, so the confirmation is confounded, but the theory does not depend
    on it'
- parameter: what one additional series-node agent is worth at a fixed 8 mg
  value: 8 mg erdafitinib leaves a residual of 0.681, that is 31.9 per cent inhibition. A second agent
    removing 10 per cent on its own takes combined inhibition to 38.7 per cent and the gain to 1.59-fold;
    20 per cent takes it to 45.5 and 2.33-fold; 26.5 per cent takes it to 50.0 and 2.91-FOLD, equivalent to
    an erdafitinib dose of about 17 mg; 40 per cent takes it to 59.2 and 4.35-fold, equivalent to about 25
    mg
  unit: fold growth gain against 8 mg alone, and the equivalent single-agent dose
  conditions: residual signal multiplied across independent series nodes, growth gain raised to the fitted
    exponent of 2.38
  species: not_applicable
  source_ref: erdachild2024
  uncertainty: 'THE CENTRAL RESULT OF THE ROUND AND IT IS A FRAMEWORK, NOT A MEASUREMENT. It scales with the
    fitted exponent, which ranges 1.4 to 3.5. IT ASSUMES INDEPENDENCE between nodes - no shared
    rate-limiting step and no strong feedback - AND THE FGF19 AND KLOTHO-BETA RISE IS DIRECT EVIDENCE OF
    FEEDBACK, so the true combined effect will be less than the product by an unmeasured amount. And no
    per-agent inhibition fraction has ever been measured for any candidate on this list'
  value_unverified: true
- parameter: the compensatory loop that flattens the curve
  value: FGF19 and klotho-beta both ROSE on treatment as a potential compensatory mechanism to FGFR3
    inhibition, with NO compensatory rise in FGF21 which is the FGFR1 ligand - consistent with selectivity
    against FGFR1. COL9A1 also moved, and the poster links collagen secretion to FGFR3 activity
  unit: log2 fold change from baseline at cycle 1 day 15, threshold 1.5-fold absolute and P below 0.01
  conditions: surf301_pb060_2024, Olink platform, paired against baseline in the 60 to 120 mg once-daily
    participants
  species: human
  source_ref: surf301_pb060_2024
  uncertainty: 'THE ONLY DIRECT HUMAN EVIDENCE THAT THE SYSTEM PUSHES BACK AGAINST FGFR3 INHIBITION BY
    RAISING ITS OWN LIGAND, which is a mechanism that flattens the dose-response and therefore a target
    whose blockade would steepen it. A conference poster, an exploratory proteomic panel with a
    1.5-fold threshold, in adults with cancer rather than a growing skeleton, and FGF19 binds FGFR4 as well
    as FGFR3 so the rise is not necessarily acting at the growth-relevant receptor'
localization:
- 'the whole FGFR3 cascade read as a series of nodes - ligand, receptor abundance, kinase, MAPK, and the
  ERK-independent CREB limb'
- 'the hypertrophic zone, where CNP arm two acts through cAMP and PKA and where nothing about FGFR3
  blockade reaches'
- 'the plasma compartment, where the protein-binding lever looks available and arithmetically is not'
human_evidence: indirect
human_evidence_note: 'The two curve-fitting points are human but are two children with heavy confounding.
  The inhibition arithmetic is derived from human PK and cellular potency. The compensatory FGF19 rise is
  human. Everything about the combination framework is untested in any species.'
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: 'The curve is fitted from two human points with a baseline-sensitive exponent, and
  the multiplication framework has never had a single per-agent input measured. It is a way of deciding
  which experiment to run, not a prediction of a result.'
confidence: C
claim_grades:
- claim: the FGFR3 growth response is supra-linear in fractional pathway inhibition
  grade: C
  basis: fitted independently from two human points with an exponent of 2.38 and from two mouse bones with
    exponents of 3.33 and 3.23, the latter needing no baseline assumption. Two patients on the human side
    and a narrow dose span on the mouse side
- claim: the exponent is 2.4
  grade: E
  basis: BASELINE-SENSITIVE FROM 1.39 TO 3.48. Only the direction survives; the value does not
- claim: lowering alpha-1-acid glycoprotein raises free erdafitinib exposure
  grade: X
  basis: FALSE. For a low-extraction drug unbound steady-state concentration is independent of protein
    binding, and zhu2026 confirms it empirically - free Cmax and free AUC ratios of 104.8 and 87.5 per cent
    despite a risen free fraction
- claim: dose escalation from 8 to 9 mg is worth optimising
  grade: X
  basis: FALSE on the fitted curve. It buys about 20 per cent more gain, which is the entire label headroom
- claim: one additional series-node agent at 26.5 per cent inhibition triples the growth gain from 8 mg
  grade: E
  basis: A FRAMEWORK RESULT, NOT A MEASUREMENT. It follows from multiplying residual signal and raising to
    the fitted exponent, and no per-agent inhibition fraction has ever been measured
- claim: the series nodes act independently
  grade: E
  basis: ASSUMED AND PROBABLY FALSE IN PART. The FGF19 and klotho-beta rise is direct human evidence of
    compensatory feedback, so the combined effect will be less than the product
- claim: any FGFR3-pathway combination has been tested for growth in a pathway-intact animal
  grade: X
  basis: FALSE. Every agent on the list has been tested alone against a growth endpoint. The 2x2 in
    wild-type has never been run in any species
