  year: 2014
  type: primary
  role: the receptor-abundance node - enhanced degradation of FGFR3 protein rather than kinase inhibition,
    strictly in series with an ATP-competitive inhibitor
- ref_id: matsushita2025
  year: 2025
  type: primary
  role: the downstream MAPK node with full human paediatric pharmacokinetics, whose +0.11 cm/year alone is
    what a small series contribution looks like as monotherapy
- ref_id: hirota2022
  year: 2022
  type: primary
  role: CNP arm two - predominant PKA activation in hypertrophic chondrocytes with H89 blocking the length
    effect, the one candidate that ADDS on a different term rather than multiplying
