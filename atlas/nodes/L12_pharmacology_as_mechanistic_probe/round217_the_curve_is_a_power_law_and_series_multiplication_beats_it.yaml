contradicts:
- 'The implicit assumption running through rounds 212 to 216 that the way up the curve is more exposure of
  one agent. On the fitted curve the entire erdafitinib label headroom is worth 20 per cent, while one
  additional series-node partner at 26.5 per cent inhibition is worth 191 per cent.'
- 'Any proposal to raise free erdafitinib by displacing it from alpha-1-acid glycoprotein. Arithmetically
  unavailable for a low-extraction drug and empirically refuted by zhu2026. Recorded as CORR-212.'
