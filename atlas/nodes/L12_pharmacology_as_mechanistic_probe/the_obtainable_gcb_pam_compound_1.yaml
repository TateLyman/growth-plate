contradicts:
- 'CORRECTS round 156 (CORR-173). That round proposed making MCUF-42 cationic and, on a substructure
  charge rule, read compound 1 as already cationic. Compound 1 is almost certainly neutral - the cyanoethyl
  and the thioamide both suppress the amine. The cationic candidate is the N-methylpiperazine CID 3588620,
  and the R2 position cannot carry the base because the SAR requires an electron-withdrawing group there.'
- 'REFINES npr2_positive_allosteric_modulation, which treated MCUF-42 as the compound of record. MCUF-42
  is unobtainable; the obtainable member of the series is the published primary hit, with a higher Emax.'
