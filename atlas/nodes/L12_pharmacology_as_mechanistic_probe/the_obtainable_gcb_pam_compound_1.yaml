localization:
- 'GC-B in the growth plate is the target; GC-B in vasculature is the liability, and a potentiator raises
  gain at both unless the molecule itself concentrates in cartilage'
human_evidence: indirect
human_evidence_note: 'The compound evidence is HEK293 overexpression and human cardiac fibroblasts. The
  human anchor for the TARGET is jeong2026 - NPR2 activity score against standing height, R squared 0.438
  at P = 5.8e-10 - and the human natural experiment is npr2_gain_of_function_tall. Nothing in this node has
  been tested in a chondrocyte, a growth plate, or an animal.'
species_basis:
- in_vitro_human_cell
- not_applicable
translation_risk: high
translation_risk_reason: 'A single-point screening value and one published cell dose-response, in the wrong
  cell type, for an indication nobody has tested. The tissue-selectivity objection is unresolved and the
  cationic fix is unmeasured.'
confidence: D
claim_grades:
- claim: MCUF-42 cannot be purchased and compound 1 can.
  grade: A
  basis: 'PubChem CID 176516521 lists exactly one source, IUPHAR/BPS, and no chemical vendor - consistent
    with ma2024 stating MCUF-42 was not represented in the commercial space. CID 647514 carries CAS
    332862-27-8 and 14 chemical vendors with direct catalogue identifiers. This is a registry fact checked
    directly against the registries.'
- claim: CID 647514 is compound 1 of ma2024.
  grade: B
  basis: 'Structurally it is MCUF-42 with piperazine for piperidine; ma2024 calls compound 1 the
    piperazine-containing primary hit and describes MCUF-42 as its piperidine analogue; compound 1 is
    described as commercially sourced and MCUF-42 as not; and CID 647514 is the top-scoring member of the
    series in the very screen the paper reports, at 96.67 per cent. Not A because the paper gives no CID or
    CAS and two same-scaffold regiochemical variants (CID 647949, CID 2291818) are also actives.'
- claim: Compound 1 is a better starting point than MCUF-42 for this project.
  grade: C
  basis: 'Equipotent (EC50 0.74 against 0.80 microM), HIGHER Emax (112 against 86 per cent, which is the
    axis that matters because a potency-shifter cannot exceed the ligand ceiling at a consumer tissue), and
    obtainable where MCUF-42 is not. Against it: MCUF-42 is the compound with SPR binding data, PK and
    cardiac-fibroblast pharmacology, and the piperazine was dropped for stated metabolic and toxicity
    concerns that are generic but not baseless.'
- claim: Compound 1 is cationic and gains the Donnan enhancement.
  grade: X
  basis: 'NO - WITHDRAWN AT CORR-173. Its free piperazine nitrogen bears a 2-cyanoethyl group and sits
    across the ring from a thioamide; both strongly lower the amine pKa, so it should be largely neutral at
    pH 7.4 and partition like MCUF-42 near 0.97. The round-156 substructure charge rule that flagged it as
    plus one ignores inductive effects. No pKa has been measured.'
- claim: CID 3588620, the N-methylpiperazine analogue, is the cationic candidate worth testing.
  grade: D
  basis: 'It is the same scaffold without the cyanoethyl, so only the thioamide deactivation applies and
    the amine could sit near physiological pH; it is a GC-B-selective screening active at 50.37 per cent at
    10 microM; and it is purchasable from seven vendors. Graded D because 50 per cent at a single 10
    micromolar point is a hypothesis rather than a potency, no dose-response exists, and its pKa is
    reasoned rather than measured.'
- claim: A basic centre can simply be installed at the R2 position of this scaffold.
  grade: X
  basis: 'NO. ma2024 reports R2 equals H - the free piperazine NH, the most basic option - as INACTIVE
    (compound 11), along with aryl and benzyl. The position requires a specifically located small
    electron-withdrawing hydrogen-bonding group: nitrile and CO2Et work, methyl ether fails. A basic centre
    must go elsewhere on the scaffold. The one opening is that N-methyl was never reported as tested and is
    an independent screening active.'
- claim: A cationic analogue would be concentrated in growth-plate cartilage.
  grade: D
  basis: 'The mechanism is real and exploited - hakim2025 confirms cationic carriers penetrate cartilage
    by Donnan partitioning against aggrecan fixed charge, and the atlas computes 1.8 to 2.7-fold for a
    monocation. But hakim2025 also finds hydrophobicity causes competitive binding and impairs deep
    penetration, and this chemotype is lipophilic at XLogP about 3.8. Uptake and PENETRATION are different
    quantities, and the supporting work is plus-14 peptides in articular cartilage, not a small molecule in
    growth plate.'
