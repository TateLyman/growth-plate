id: the_obtainable_gcb_pam_compound_1
name: THE COMPOUND, SOURCED - MCUF-42 cannot be bought and compound 1 can, it is equipotent with a higher
  ceiling, and the cardiac programme deliberately deleted the basic nitrogen this project wants
aliases:
- compound 1 GC-B PAM
- CID 647514
- CAS 332862-27-8
- where to buy a GC-B PAM
- cationic GC-B PAM
- MCUF-42 is not purchasable
type: intervention
layer: L12
stub: false
summary: 'ROUND 156 NAMED MCUF-42 AS THE GC-B PAM THAT EXISTS AND PROPOSED MAKING IT CATIONIC. ROUND 157
  WENT TO THE SCREENING DATA AND THE ANSWER IS BETTER AND MORE AWKWARD THAN THAT.
  FIRST, MCUF-42 CANNOT BE BOUGHT. PubChem CID 176516521 has exactly ONE source - the IUPHAR Guide to
  Pharmacology - and NO chemical vendor. That is not an oversight, it is by construction: ma2024 states
  that MCUF-42 was NOT REPRESENTED IN THE COMMERCIAL SPACE, because it was designed away from the
  screening hit. To hold MCUF-42 you must synthesise it.
  SECOND, THE PUBLISHED PRIMARY HIT CAN BE BOUGHT, AND THIS ATLAS IDENTIFIED IT FROM THE RAW DATA. Both
  the GC-B screen (AID 1920062) and the GC-A screen (AID 1671463) ran THE SAME 370,293-COMPOUND LIBRARY,
  so a selectivity set is directly computable: 399 GC-B actives, 519 GC-A primary plus 196 GC-A
  confirmatory actives, leaving 253 COMPOUNDS ACTIVE AT GC-B AND NOT AT GC-A. Fingerprinting all 253
  against MCUF-42, the single closest is CID 647514 at Tanimoto 0.709 - and it is MCUF-42 with ONE ATOM
  CHANGED, a piperazine where MCUF-42 has a piperidine. That is compound 1, the published primary hit:
  ma2024 says in terms that the PIPERIDINE ANALOG 24 RETAINED THE POTENCY OF THE PIPERAZINE-CONTAINING
  PRIMARY HIT 1. Its screening value is the highest of any candidate here, 96.67 PER CENT ACTIVITY AT
  10 MICROMOLAR, and its published dose-response is EC50 0.74 MICROMOLAR WITH Emax 112 PER CENT, against
  0.80 and 86 for MCUF-42, with no activity at GC-A up to 67 micromolar.
  SO ON THIS PROJECT CRITERIA COMPOUND 1 BEATS MCUF-42 ON THREE COUNTS. It is equipotent. Its Emax is
  HIGHER - 112 against 86 per cent - and Emax is the axis that matters here, because a pure potency-shifter
  cannot exceed what CNP alone achieves and the plate is a ligand consumer. And it is PURCHASABLE: CAS
  332862-27-8, batch MLS-0020283, listed by FOURTEEN chemical vendors.
  THIRD, AND THIS IS THE FINDING THAT MATTERS MOST: THE CARDIAC PROGRAMME DELIBERATELY DELETED THE BASIC
  NITROGEN, AND SAID SO. ma2024 explains the move from compound 1 to MCUF-42 in one sentence - ALKYL OR
  ACYL PIPERAZINES CAN HAVE METABOLIC AND POTENTIAL TOXIC LIABILITIES. That is a generic chronic-dosing
  medicinal-chemistry preference for a cardiology indication, not a measured liability of compound 1. FOR
  THIS PROJECT THE BASIC NITROGEN IS THE FEATURE, because a cation is CONCENTRATED by the polyanionic
  plate rather than merely admitted. The optimisation ran away from the property this indication wants.
  BUT NOW THE CORRECTION, AND IT COSTS THE HEADLINE (CORR-173). Compound 1 is NOT usefully cationic. Its
  free piperazine nitrogen carries a 2-CYANOETHYL group and sits across the ring from a thioamide, and both
  are strongly electron-withdrawing. A beta-cyanoethyl substituent drops an aliphatic amine pKa by roughly
  two to three units and an acyl group on the opposite ring nitrogen drops it further; the PubChem
  anchor for the parent is piperazine pKa1 9.73 and pKa2 5.33. NO pKa WAS MEASURED OR FOUND FOR ANY OF
  THESE COMPOUNDS, so this is reasoning and not a number - but the direction is not in doubt, and
  compound 1 is most likely LARGELY NEUTRAL at pH 7.4 and therefore partitions like MCUF-42, near 0.97,
  with no Donnan bonus. The round-156 charge screen that flagged it as plus one used a substructure rule
  that ignores inductive effects, and that rule was wrong here.
  FOURTH, THERE IS A GENUINELY CATIONIC CANDIDATE IN THE SAME SERIES AND IT IS ALSO PURCHASABLE. CID
  3588620 is the N-METHYLPIPERAZINE analogue - same 5-(2,5-dichlorophenyl)furan thioamide, same core,
  Tanimoto 0.593 - with NO cyanoethyl, so only the thioamide deactivation applies and its amine should sit
  near physiological pH rather than far below it. It is a GC-B-selective active at 50.37 PER CENT at
  10 micromolar and is listed by seven vendors. If it is even half protonated at 7.4 it picks up a
  meaningful fraction of the 1.8 to 2.7-fold Donnan enhancement a full monocation would get.
  FIFTH, THE SAR SAYS THE OBVIOUS MOVE IS FORBIDDEN, WHICH IS WORTH KNOWING BEFORE ANYONE TRIES IT. The
  most basic possible variant is the free piperazine NH, R2 equals H - and ma2024 reports that compound
  11, R2 equals H, IS INACTIVE, as are aryl and benzyl at that position. The paper concludes that this
  position REQUIRES a specifically located small electron-withdrawing hydrogen-bonding group: nitrile
  works, CO2Et works, 2-pyridinyl works moderately, methyl ether fails. SO THE ONE POSITION THAT WOULD
  MOST EASILY CARRY A STRONG BASE IS THE POSITION THE SAR SAYS MUST CARRY AN ELECTRON-WITHDRAWING GROUP.
  The escape is that N-methyl was never reported as tested and IS an independent screening active, so
  small alkyl is tolerated where H is not - and a basic centre may therefore have to be installed
  elsewhere on the scaffold, not at R2.
  SIXTH, THE CATIONIC PREMISE IS VALIDATED AS A FIELD AND CARRIES A WARNING THAT APPLIES TO THIS EXACT
  CHEMOTYPE. hakim2025 is the cartilage charge-delivery literature the atlas had not read: cationic
  carriers penetrate cartilage precisely because net positive charge drives DONNAN PARTITIONING against
  aggrecan fixed charge, which is the mechanism computed here. But its conclusion is that EVENLY
  DISTRIBUTED CATIONIC RESIDUES AND MINIMAL HYDROPHOBICITY give the best deep penetration, because
  hydrophobic residues promote competitive binding in synovial fluid and tight GAG binding slows
  diffusion. THIS CHEMOTYPE IS LIPOPHILIC - XLogP around 3.8, a dichlorophenyl at one end - which is the
  combination hakim2025 warns about. A cationic analogue may therefore be taken up avidly and PENETRATE
  POORLY, concentrating at the surface rather than distributing. The caveat is that hakim2025 studies
  plus-14 arginine-rich PEPTIDES in ARTICULAR cartilage and this is a 355-dalton small molecule in growth
  plate, so the warning transfers as a design consideration and not as a prediction.
  WHAT TO ACTUALLY DO, AND WHAT IT COSTS. Buy both. CID 647514 (compound 1) is the potency benchmark with
  a published dose-response and the higher Emax; CID 3588620 is the charge probe. Both are catalogue
  screening compounds in milligram quantities. NO PRICE IS RECORDED HERE - every vendor page returned 403,
  404 or JavaScript-rendered pricing - so this atlas has verified AVAILABILITY AND CATALOGUE HANDLES BUT
  NOT COST, and the handles are listed in the quantitative block so a quote takes one email.'
quantitative:
- parameter: 'THE GC-B-SELECTIVE SET COMPUTED FROM THE RAW SCREENING DATA'
  value: 'AID 1920062 (GC-B primary) and AID 1671463 (GC-A primary) ran THE SAME 370,293-compound library.
    GC-B actives 399; GC-A primary actives 519; GC-A confirmatory (AID 1671466) actives 196; overlap of
    GC-B with GC-A primary 146. GC-B ACTIVE AND NOT GC-A ACTIVE = 253 COMPOUNDS. Substructure and
    Morgan-fingerprint analysis of all 253 against MCUF-42 gives a single clear nearest neighbour at
    Tanimoto 0.709 (CID 647514), then 0.604 (CID 786411, morpholine), 0.593 (CID 3588620,
    N-methylpiperazine), 0.500 (CID 647949), 0.492 (CID 2291818)'
  unit: compound counts; Tanimoto similarity
  conditions: COMPUTED BY THIS ATLAS 2026-08-09 from PubChem PUG REST active-CID lists and RDKit Morgan
    fingerprints (radius 2, 2048 bits) against the MCUF-42 SMILES from CID 176516521.
  species: not_applicable
  source_ref: pubchem_gcb_hts
  atlas_derived: true
  uncertainty: 'THIS IS NOT THE PAPER OWN TRIAGE AND THE TWO SETS WILL NOT MATCH. ma2024 reports 86
    GC-B-selective compounds using a 28 per cent activity threshold on both receptors plus a 10 per cent
    difference requirement; this 253-compound set uses PubChem ACTIVE/INACTIVE calls across primary and
    confirmatory GC-A assays, which is a different and more permissive rule. A PRIMARY SCREEN AT A SINGLE
    10 MICROMOLAR POINT IS A HYPOTHESIS, NOT A POTENCY - most of the 253 will not confirm, and only the
    handful with published dose-response data should be treated as real. Absence from the GC-A active list
    is also weaker than a measured counter-screen.'
- parameter: 'COMPOUND 1 IDENTIFIED, AND IT BEATS MCUF-42 ON EMAX AND ON AVAILABILITY'
  value: 'CID 647514, CAS 332862-27-8, C18H17Cl2N3OS, MW 394.3, SMILES
    C1CN(CCN1CCC#N)C(=S)C2=CC=C(O2)C3=C(C=CC(=C3)Cl)Cl - identical to MCUF-42 except a PIPERAZINE in place
    of the piperidine. Screening value 96.67 per cent activity at 10 microM, the highest of the series
    (against 72.74, 61.33, 50.37, 43.42, 35.67, 35.32 for the other close analogues). Published
    dose-response: EC50 0.74 microM, Emax 112 PER CENT, pEC50 minus 6.6 plus or minus 0.3, n = 3, with NO
    activity in HEK293 GC-A cells with ANP UP TO 67 MICROMOLAR and no activity at GC-B without CNP. MCUF-42
    for comparison: EC50 0.80 microM, Emax 86 per cent. AVAILABILITY: MCUF-42 (CID 176516521) has ONE
    PubChem source, IUPHAR/BPS, and ZERO chemical vendors; CID 647514 has FOURTEEN'
  unit: micromolar; per cent of saturating CNP response
  conditions: Structure and screening value from PubChem (AID 1920062, batch MLS-0020283.P031); potency
    and selectivity from ma2024 full text, which describes them for compound 1. Compound identity assigned
    by this atlas from the structural relationship plus the ma2024 statement that the piperidine analogue
    24 retained the potency of the piperazine-containing primary hit 1.
  species: in_vitro_human_cell
  source_ref: ma2024
  atlas_derived: true
  uncertainty: 'THE IDENTIFICATION IS AN INFERENCE, NOT A STATED CID. ma2024 never gives a CID or CAS for
    compound 1; the assignment rests on the structure being MCUF-42 with piperazine for piperidine, on the
    paper calling compound 1 the piperazine-containing primary hit, on compound 1 being described as
    commercially available while MCUF-42 was not, and on this being the top-scoring member of the series in
    the very screen the paper reports. That is strong but it is circumstantial, and the R1 substitution
    pattern of compound 1 is not independently confirmed - CID 647949 and CID 2291818 are the same scaffold
    with different chlorine placement and either could in principle be the hit. ANYONE ORDERING SHOULD
    ORDER THE SET, NOT THE GUESS. And Emax 112 per cent versus 86 is a comparison across two figures in one
    paper measured in the same system but not presented as a head-to-head ranking.'
- parameter: 'THE CHARGE CALL CORRECTED - COMPOUND 1 IS PROBABLY NEUTRAL, AND THE CATIONIC CANDIDATE IS
    THE N-METHYLPIPERAZINE'
  value: 'Of the 253 GC-B-selective actives, a substructure charge rule assigns 229 neutral, 15 at plus
    one, 1 at plus two and 8 at minus one. THAT RULE IS WRONG FOR COMPOUND 1: its free piperazine nitrogen
    bears a 2-CYANOETHYL group and sits across the ring from a thioamide, both strongly electron
    withdrawing, so its pKa should fall well below 7.4 and it should be largely NEUTRAL - partition about
    0.97, no Donnan gain. CID 3588620 is the same scaffold as an N-METHYLPIPERAZINE with NO cyanoethyl,
    MW 355.3, screening value 50.37 per cent at 10 microM, seven vendors - only the thioamide deactivation
    applies, so it is the candidate that could actually be protonated. Reference anchor from PubChem:
    piperazine pKa1 9.73, pKa2 5.33'
  unit: compound counts; pKa
  conditions: Charge assignment COMPUTED BY THIS ATLAS 2026-08-09 with RDKit SMARTS for basic and acidic
    centres, then corrected by hand for inductive effects. The piperazine pKa values are the PubChem
    experimental record for CID 4837.
  species: not_applicable
  source_ref: pubchem_gcb_hts
  atlas_derived: true
  uncertainty: 'NO pKa WAS MEASURED OR RETRIEVED FOR ANY COMPOUND IN THIS SERIES - PubChem holds no
    dissociation-constant record for 1-acetylpiperazine, 3-aminopropionitrile or any analogue searched, so
    the atlas has an experimental anchor for the PARENT RING ONLY. Everything said about compound 1 being
    neutral and CID 3588620 being partly protonated is DIRECTIONAL REASONING FROM SUBSTITUENT EFFECTS, not
    a computed or measured pKa, and it should be graded as such. This is exactly the number that decides
    whether the cationic argument applies to this series, it costs one potentiometric titration or one
    commercial pKa prediction, and it has not been done.'
- parameter: 'CATIONIC UPTAKE INTO CARTILAGE IS A REAL EXPLOITED MECHANISM - AND HYDROPHOBICITY IS THE
    WARNING THAT APPLIES TO THIS CHEMOTYPE'
  value: 'hakim2025: cationic peptide carriers penetrate cartilage because net positive charge drives
    DONNAN PARTITIONING against the fixed charge density of aggrecan glycosaminoglycans. In arginine-rich
    carriers of net charge plus 14, greater clustering of cationic or hydrophobic residues raises
    intracartilage diffusivity by weakening GAG binding, but hydrophobic residues promote COMPETITIVE
    BINDING IN SYNOVIAL FLUID; the design conclusion is EVENLY DISTRIBUTED CATIONIC RESIDUES AND MINIMAL
    HYDROPHOBICITY for deep, long-term penetration'
  unit: qualitative - design principles for charge-based cartilage delivery
  conditions: hakim2025, abstract read 2026-08-09. Experimental transport plus molecular modelling in
    healthy and degenerated ARTICULAR cartilage at differing fixed charge densities.
  species: not_applicable
  source_ref: hakim2025
  uncertainty: 'THIS BOTH SUPPORTS AND COMPLICATES THE ROUND-156 ARGUMENT AND THE COMPLICATION IS SPECIFIC.
    Support: Donnan-driven cationic uptake is not a speculative calculation, it is the operating principle
    of an entire cartilage-delivery field. Complication: THE MCUF-42 CHEMOTYPE IS LIPOPHILIC - XLogP about
    3.8, dichlorophenyl - and hakim2025 identifies hydrophobicity as the property that causes competitive
    binding and impairs distribution, so a cationic lipophilic analogue could be avidly bound at the
    surface and penetrate poorly. THE TRANSFER IS LOOSE: plus-14 arginine peptides in articular cartilage
    are not a 355-dalton small molecule in growth plate, the fixed charge densities differ, and the
    synovial-fluid competition term has no growth-plate analogue. Treat it as a design constraint to test,
    not as a prediction about this compound.'
