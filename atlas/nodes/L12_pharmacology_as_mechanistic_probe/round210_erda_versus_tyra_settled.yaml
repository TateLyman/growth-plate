contradicts:
- 'INVERTS THE IMPRESSION ROUND 208 LEFT. That round said the atlas had been carrying the FGFR arm under
  the wrong molecule, implying erdafitinib was simply inferior. The human data says erdafitinib produces
  the LARGEST growth effect recorded anywhere in this file - about ten times the phase-3 infigratinib
  result. The case for a selective molecule is not that erdafitinib is weak; it is that erdafitinib is
  strong and cannot be sustained, and the thing that stops it is plausibly the receptor a selective
  molecule spares.'
- 'RECLASSIFIES THE FGFR SKELETAL TOXICITY AS A YIELD TERM. The atlas has filed epiphysiolysis, SCFE and
  kyphoscoliosis under safety, and the user has deferred safety. Under the round-198 objective function
  they are yield terms - a curved spine is shorter, a fusion ends spinal growth, and five of five
  discontinuations at a median of 137 days truncate the treatment window. The deformity is the reason the
  19 cm per year is not banked.'
- 'CHALLENGES THE ASSUMPTION THAT THE ACHONDROPLASIA DOSE IS THE RELEVANT DOSE. Infigratinib phase 3 uses
  0.25 mg/kg/day chosen for tolerability in a disease population. Erdafitinib at oncology exposure gives
  an order of magnitude more growth. Whether an FGFR3-selective compound at high exposure reproduces the
  erdafitinib effect without the erdafitinib failure has never been tested, and the atlas has been
  implicitly assuming the low-dose achondroplasia result is the ceiling of the class.'
