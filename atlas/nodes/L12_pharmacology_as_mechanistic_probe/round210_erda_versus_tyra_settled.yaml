id: round210_erda_versus_tyra_settled
name: ROUND 210 - erdafitinib produces the largest human growth effect in this atlas by a factor of ten
  and is self-limiting on YIELD grounds, FGFR1 inhibition both shortens bone and weakens the
  perichondrial ring, and the decisive unknown is dose rather than molecule
type: hypothesis
layer: L12
aliases:
- erda vs tyra
- FGFR selectivity settled
- the perichondrial ring hypothesis
- 19 cm per year
- round 210
stub: false
summary: 'THE COMPARISON WAS ALMOST ENTIRELY ASSEMBLABLE FROM HOLDINGS THIS ATLAS ALREADY HAD AND HAD
  NEVER PUT IN ONE PLACE. Only the selectivity numbers had to be fetched.

  THE SELECTIVITY. dabogratinib2026 gives the figures directly from Ba/F3 isoform-driven lines -
  dabogratinib, which is TYRA-300, is 63-FOLD SELECTIVE FOR FGFR3 OVER FGFR1, 19-fold over FGFR2 and
  55-fold over FGFR4. Erdafitinib, futibatinib, pemigatinib and infigratinib all retain LOW IC50 values
  in FGFR1-, FGFR2- and FGFR4-driven lines, which is to say NO MEANINGFUL FGFR3 SELECTIVITY AT ALL. And
  the selectivity costs nothing on target - head to head in the UM-UC-14 xenograft, dabogratinib at 18
  mg/kg once daily gave slightly MORE tumour regression than erdafitinib at 12.5 mg/kg twice daily.

  WHY THAT IS A YIELD ARGUMENT AND NOT A SAFETY ARGUMENT. The user has deferred risk, so the case has to
  be made in centimetres, and it can be. TWO FACTS FROM THIS ATLAS MAKE FGFR1 INHIBITION ACTIVELY
  COUNTERPRODUCTIVE. First, delezoide1998 - in human embryo-fetal long bone FGFR3 sits mainly in mature
  GROWTH PLATE CHONDROCYTES while FGFR1 AND FGFR2 ARE RESTRICTED TO PERICHONDRIUM AND PERIOSTEUM. Second,
  karolak2015 - chondrocyte-specific Fgfr1 deletion gives REDUCED STATURE by P4 and REDUCED TIBIAL LENGTH
  at P18 DESPITE AN INCREASED HYPERTROPHIC ZONE, which is the zone-up length-down dissociation this atlas
  has been chasing since CORR-189.

  PUT TOGETHER THEY GIVE A MECHANISTIC ACCOUNT THAT IS NEW HERE. A pan-FGFR inhibitor does two things at
  once - it accelerates the plate through FGFR3, and it inhibits the fibrous ring that mechanically
  constrains that plate through FGFR1 and FGFR2. THAT IS PRECISELY THE RECIPE FOR A PHYSIS THAT GROWS
  FAST AND THEN FAILS MECHANICALLY, which is what the clinical record shows - epiphysiolysis, slipped
  capital femoral epiphysis, kyphoscoliosis. And the FGFR1 arm is subtracting from the FGFR3 arm on
  length at the same time.

  THE HUMAN EVIDENCE IS WHERE THE SURPRISE IS, AND IT INVERTS WHAT I IMPLIED IN ROUND 208. erdachild2024
  - a PRE-PUBESCENT boy on erdafitinib grew 14.3 CENTIMETRES IN NINE MONTHS, an annualised 19.06 CM PER
  YEAR, with pre-pubertal GH, IGF-I, IGFBP-3 and testosterone so it is not puberty. erdaseries2025 - a
  retrospective paediatric series showing growth acceleration INDEPENDENT of sex steroids and of IGF1,
  with a distinct WIDENING OF THE GROWTH PLATE. THAT IS THE LARGEST GROWTH EFFECT ANYWHERE IN THIS ATLAS,
  ROUGHLY TEN TIMES THE PHASE-3 INFIGRATINIB RESULT AND TWELVE TIMES VOSORITIDE''S, AND IT IS HUMAN.

  IT IS ALSO SELF-LIMITING, AND THE LIMIT IS A YIELD LIMIT. The same child developed severe
  kyphoscoliosis, spinal cord compression and cervical myelopathy that FORCED DISCONTINUATION.
  nadeaunguyen2026 - the FDA postmarketing review found five paediatric cases, median time to onset 137
  DAYS, ERDAFITINIB PERMANENTLY DISCONTINUED IN ALL FIVE AND THREE REQUIRING SURGICAL CORRECTION. A
  kyphoscoliotic spine is shorter than a straight one, a spinal fusion ends spinal growth outright, and a
  drug that must be stopped at 137 days cannot deliver adult height. The deformity is not a side issue
  filed under safety - IT IS THE REASON THE GROWTH IS NOT BANKED.

  SO THE VERDICT. FGFR3-SELECTIVITY IS A YIELD FEATURE. Sparing FGFR1 63-fold removes the receptor whose
  inhibition both shortens bone directly and weakens the perichondrial ring, while leaving intact the
  FGFR3 arm that produced 19 cm per year. TYRA-300 is consistent with that - round 208 established it
  elevates WILD-TYPE mice by 8.2 per cent at the femur with NO body-weight difference, grows lumbar
  vertebrae, improves the foramen magnum, and leaves the growth plate MORE ORGANISED where the pan-FGFR
  clinical picture is disorganised failure.

  WHAT WOULD FALSIFY IT, STATED PLAINLY. If the growth acceleration is itself FGFR1- or
  perichondrium-mediated rather than FGFR3-mediated, then an FGFR3-selective molecule is safer AND weaker
  and the trade is bad. Two facts argue against that and neither is decisive - TYRA-300 grows wild-type
  mice, and the erdafitinib child''s CRANIAL VAULT, which is membranous bone with no growth plate, WAS
  SPARED, localising the effect to endochondral tissue.

  AND THE DECISIVE UNKNOWN IS NOT THE MOLECULE, IT IS THE DOSE. Infigratinib gives +1.74 cm per year at
  0.25 mg/kg/day, a small fraction of its oncology exposure, chosen for tolerability. Erdafitinib gives
  19 cm per year at full oncology dosing. THE TEN-FOLD DIFFERENCE IN EFFECT TRACKS THE DOSE AT LEAST AS
  WELL AS IT TRACKS THE MOLECULE, AND NOBODY HAS EVER DOSED AN FGFR3-SELECTIVE COMPOUND AT AN
  ONCOLOGY-SCALE EXPOSURE IN A GROWING SKELETON. That single experiment decides this arm.'
quantitative:
- parameter: FGFR isoform selectivity of dabogratinib (TYRA-300)
  value: 63-fold for FGFR3 over FGFR1, 19-fold over FGFR2, 55-fold over FGFR4; erdafitinib, futibatinib,
    pemigatinib and infigratinib all retain low IC50 values in FGFR1-, FGFR2- and FGFR4-driven lines
  unit: fold selectivity in Ba/F3 isoform-driven cell lines
  conditions: dabogratinib2026, author-stated; on-target potency preserved - dabogratinib 18 mg/kg once
    daily gave slightly more tumour regression than erdafitinib 12.5 mg/kg twice daily in the UM-UC-14
    xenograft
  species: in_vitro_human_cell
  source_ref: dabogratinib2026
  uncertainty: 'Ba/F3 ENGINEERED LINES, not chondrocytes, and fold-selectivity in a cell line is not
    fold-separation at a clinical exposure. 63-fold is real but finite - at a high enough dose FGFR1 is
    still engaged, which matters because the whole dose question below turns on going high'
- parameter: human growth acceleration on erdafitinib
  value: 14.3 cm in 9 months, an annualised 19.06 cm per year, in a pre-pubescent boy with pre-pubertal
    GH, IGF-I, IGFBP-3 and testosterone; bone age 14.0 at chronological age 16.2
  unit: centimetres per year
  conditions: erdachild2024, single case, erdafitinib for FGFR1-mutated glioma
  species: human
  source_ref: erdachild2024
  uncertainty: 'THE LARGEST GROWTH EFFECT IN THIS ATLAS BY ABOUT TENFOLD AND IT IS A SINGLE CASE. No
    baseline bone age was recorded. erdaseries2025 shows the same phenomenon in a series but in children
    who were heavily pretreated with SEVERE growth impairment before therapy, so an unknown share is
    CATCH-UP GROWTH rather than supraphysiological growth. The cranial vault was spared, which localises
    the effect to endochondral bone'
- parameter: the yield limit on erdafitinib
  value: five paediatric cases of skeletal growth toxicity, median age 13, median time to onset 137 days;
    erdafitinib permanently discontinued in ALL FIVE and THREE required surgical correction; the index
    case developed kyphoscoliosis, spinal cord compression and cervical myelopathy forcing
    discontinuation
  unit: cases, days to onset, proportion discontinued
  conditions: nadeaunguyen2026 FDA postmarketing review of FAERS, PubMed and Embase to 2 December 2024,
    plus erdachild2024
  species: human
  source_ref: nadeaunguyen2026
  uncertainty: 'RECORDED HERE AS A YIELD TERM RATHER THAN A SAFETY TERM, which is the user''s framing - a
    kyphoscoliotic spine is shorter, a spinal fusion ends spinal growth, and a drug stopped at 137 days
    cannot deliver adult height. FAERS is a spontaneous-reporting system with no denominator, so the
    incidence is unknown'
- parameter: the effect of removing FGFR1 from chondrocytes
  value: reduced stature by P4, reduced body weight by P9 and reduced tibial length at P18 against
    wild-type littermates, DESPITE an increased size of the hypertrophic zone
  unit: qualitative direction with timing
  conditions: karolak2015, chondrocyte-specific Fgfr1 deletion (Fgfr1-Col2cKO); Nf1 co-ablation reverses
    the hypertrophic zone phenotype, placing FGFR1 upstream of Ras-ERK1/2 in maturing chondrocytes
  species: mouse
  source_ref: karolak2015
  uncertainty: 'THE ZONE-UP LENGTH-DOWN DISSOCIATION AGAIN, and it says the FGFR1 component of a pan-FGFR
    inhibitor subtracts from the FGFR3 component on length. A developmental deletion is not acute
    pharmacological inhibition and the two need not behave alike'
- parameter: receptor localisation in human fetal long bone
  value: FGFR3 expressed mainly in mature growth plate chondrocytes; FGFR1 and FGFR2 restricted to
    PERICHONDRIUM AND PERIOSTEUM
  unit: qualitative localisation
  conditions: delezoide1998, human embryo-fetal long bones
  species: human
  source_ref: delezoide1998
  uncertainty: 'THE KEYSTONE OF THE PERICHONDRIAL-RING ACCOUNT AND IT IS EMBRYO-FETAL rather than
    adolescent tissue. Whether the same compartmentalisation holds at bone age 16 is untested, and the
    round-197 sampling ceiling makes it hard to test'
- parameter: dose separation between the growth effects
  value: infigratinib +1.74 cm per year at 0.25 mg/kg/day in phase 3; erdafitinib 19.06 cm per year
    annualised at oncology dosing
  unit: centimetres per year against dose
  conditions: savarirayan2026infig phase 3 randomised n=114 against erdachild2024 single case
  species: human
  source_ref: savarirayan2026infig
  uncertainty: 'THE TENFOLD DIFFERENCE TRACKS DOSE AT LEAST AS WELL AS IT TRACKS MOLECULE, and the two
    are completely confounded - different compounds, different selectivity, different indications,
    different baseline growth impairment, a randomised trial against a single case. It is a hypothesis
    generator and nothing stronger'
localization:
- 'the growth plate chondrocyte, where FGFR3 sits and where the growth effect is generated'
- 'the perichondrium and periosteum, where FGFR1 and FGFR2 sit and where the mechanical failure
  plausibly originates'
human_evidence: direct
human_evidence_note: 'Unusually for this file the strongest evidence is human - a 19.06 cm per year
  annualised growth acceleration in a child, a retrospective series reproducing it, an FDA postmarketing
  review quantifying the discontinuations, and a human fetal receptor localisation. The selectivity
  numbers and the TYRA-300 growth data are in vitro and mouse respectively.'
species_basis:
- human
- mouse
- in_vitro_human_cell
translation_risk: moderate
translation_risk_reason: 'The growth effect and its limit are both human and both in the target age
  range. What does not transfer is the comparison itself - TYRA-300 has no human growth data at all, so
  preferring it over erdafitinib is an inference from selectivity and mouse data against a human
  observation.'
confidence: C
claim_grades:
- claim: TYRA-300 is meaningfully FGFR3-selective and erdafitinib is not
  grade: A
  basis: author-stated fold values from isoform-driven Ba/F3 lines, with on-target potency preserved in a
    head-to-head xenograft
- claim: erdafitinib produces very large linear growth acceleration in children
  grade: C
  basis: one detailed case at 19.06 cm/year annualised plus a retrospective series and an FDA
    postmarketing review noting accelerated linear growth; no controlled data, and catch-up growth is an
    unquantified confound in the series
- claim: the growth acceleration is endochondral and not a general skeletal effect
  grade: D
  basis: the cranial vault, membranous bone with no growth plate, was spared in the index case; a single
    observation in a single patient
- claim: FGFR1 inhibition subtracts from length while FGFR1/2 inhibition weakens the perichondrial ring
  grade: D
  basis: assembled from a mouse conditional deletion and a human fetal expression map; the mechanism is
    coherent and has never been tested as such
- claim: FGFR3-selectivity would preserve the growth while removing the structural failure
  grade: E
  basis: THE CENTRAL INFERENCE OF THIS ROUND AND IT IS UNTESTED. No FGFR3-selective compound has been
    given to a growing human, and SURF301 is an adult oncology study
- claim: the difference between the erdafitinib and infigratinib growth effects is a molecule difference
  grade: X
  basis: NOT ESTABLISHED AND PROBABLY WRONG AS STATED. The doses differ by more than the molecules do -
    infigratinib was dosed at 0.25 mg/kg/day for tolerability against full oncology exposure for
    erdafitinib
