id: round226_where_the_bone_ages_are_and_why_nobody_has_them
name: ROUND 226 - the exhaustive sweep; no FGFR-inhibitor paediatric trial has ever registered a bone-age
  endpoint, but one protocol mandates baseline and serial physeal radiographs in twenty children at our exact
  dose and requires central submission under a heading that reads BONE AGE - and it has never been published
type: hypothesis
layer: L12
aliases:
- where the bone ages are
- APEC1621B has the films
- no FGFR trial registered a bone age endpoint
- the data exists and is unpublished
- round 226
stub: false
summary: 'THE INSTRUCTION WAS TO LOOK EVERYWHERE. THE SWEEP IS DONE AND IT RETURNS A DEFINITE ANSWER OF AN
  UNUSUAL KIND - THE DATA EXISTS, IT IS PROTOCOL-MANDATED, IT HAS A BASELINE, IT IS AT OUR DOSE, AND NOBODY
  HAS EVER PUBLISHED IT.

  FIRST THE NEGATIVE, WHICH IS ITSELF A FINDING. Every paediatric trial of an FGFR inhibitor with a growth
  population was queried directly against the ClinicalTrials.gov registry - PROPEL2 (NCT04265651, ages 3-11),
  the PROPEL extension (NCT05145010, ages 3-18), the PROPEL natural history study (NCT04035811, ages 2.5-17),
  PROPEL3 (NCT06164951, ages 3-17) and Pediatric MATCH arm B (NCT03210714, ages 1-21). NOT ONE OF THE FIVE
  REGISTERS A BONE-AGE OR SKELETAL-MATURATION OUTCOME MEASURE OF ANY KIND - not primary, not secondary, not
  exploratory. THE ENTIRE FGFR-INHIBITOR PAEDIATRIC DEVELOPMENT PROGRAMME HAS NEVER PRESPECIFIED THE ENDPOINT
  THAT DECIDES WHETHER THESE DRUGS BUY HEIGHT OR BORROW IT. That is why round 225 found the atlas''s only
  FGFR bone-age claim resting on a sentence in a conference slide deck: there is no endpoint behind it
  because no endpoint was ever registered.

  THEN THE POSITIVE, AND IT IS BETTER THAN EXPECTED. The Pediatric MATCH erdafitinib subprotocol APEC1621B
  mandates, in section 8.2 GROWTH PLATE TOXICITY, a plain AP radiograph of a single PROXIMAL TIBIAL GROWTH
  PLATE IN ALL PATIENTS PRIOR TO THE FIRST DOSE - a true baseline - and, in patients whose plate is open,
  repeat radiographs OF THE SAME PLATE prior to cycles 2 and 5 and every six months thereafter, with knee MRI
  and three-cycle radiographs for anyone showing plate thickening. Section 8.3 RADIOLOGY STUDIES is headed
  BONE AGE / KNEE MRI and requires that ALL TIBIAL RADIOGRAPHS AND KNEE MRIs BE SUBMITTED FOR REVIEW.

  AND THE COHORT IS THE RIGHT ONE. TWENTY EVALUABLE PATIENTS, MEDIAN AGE 15 YEARS, enrolled June 2018 to July
  2022, at ERDAFITINIB 4.7 mg/m2/day CAPPED AT 8 mg. A 15-year-old at about 1.6 square metres receives
  roughly 7.5 mg, and the cap is 8 mg - WHICH IS THE DOSE THIS PROGRAMME FIXED ON IN ROUND 217. Twenty
  adolescents, at our dose, with baseline and serial physeal films centrally collected.

  IT HAS NEVER BEEN PUBLISHED. A Europe PMC sweep returns no full paper for APEC1621B; the only report is an
  ASCO 2023 abstract, JCO 41(16_suppl):10007, which is paywalled to this atlas at 403. What IS public is the
  ClinicalTrials.gov results posting, which gives the adverse-event table and nothing about growth -
  SCOLIOSIS AS A SERIOUS ADVERSE EVENT IN 1 OF 20 and again as a non-serious event in 1 of 20, bone pain in
  1 of 20 serious, and HYPERPHOSPHATAEMIA IN 14 OF 20. Two partial responses in twenty. So the trial that
  holds the growth plate films reported its tumour endpoint and left the skeleton in the database.

  A FOURTH CHILD SURFACED IN THE SWEEP AND ADDS THE SAME OBSERVATION FROM A THIRD SITE. brizini2024 - a
  13-year-old boy with an optic pathway and hypothalamic low-grade astrocytoma carrying an FGFR1 kinase
  domain internal tandem duplication, on ERDAFITINIB AT EXACTLY THE PEDIATRIC MATCH DOSE OF 4.7 mg/m2/day for
  twelve weeks, who developed a slipped capital femoral epiphysis with WIDENING OF THE PROXIMAL FEMORAL
  GROWTH PLATE. NO BONE AGE WAS OBTAINED. And the detail that matters most for this atlas: HIS HEIGHT STAYED
  BETWEEN THE 25TH AND 50TH PERCENTILE WITH NO INCREASED GROWTH VELOCITY NOTED, against rapid weight gain to
  the 97th percentile and a BMI above the 99th. SO PHYSEAL WIDENING OCCURRED WITHOUT GROWTH ACCELERATION.

  THAT IS THE MOST IMPORTANT SINGLE OBSERVATION IN THIS ROUND AND IT CUTS AGAINST THE OPTIMISTIC READING.
  Round 224 set out two interpretations of the widening seen in these children - PRESERVED RESERVE, where the
  plate accumulates because more cells are being made, against ARRESTED REMODELLING, where it accumulates
  because the chondro-osseous junction has stopped clearing it. A child whose physis WIDENED while his height
  DID NOT MOVE is what the second reading predicts and the first does not. One case, confounded by extreme
  obesity and by hypothalamic disease, but it is the first dissociation of physeal width from length in a
  human and it points the wrong way.

  THE COMPLETE HUMAN RECORD ON ERDAFITINIB AND THE GROWING SKELETON IS NOW FOUR CHILDREN AND ONE UNPUBLISHED
  COHORT. Wong''s boy - 15 years 4 months, Tanner 2-3, normal growth-axis hormones, 7 then 5 mg, 19.06
  cm/year, bone age 14.0 at 16.2 with NO BASELINE, kyphoscoliosis forcing discontinuation. Raimann''s patient
  1 - 13.8 years, hypogonadotropic, 5 then 3 mg, dramatic spurt, physeal widening without apparent bone
  maturation. Raimann''s patient 2 - 10.9 years, prepubertal, DOSE NOT STATED, 10 cm/year. Brizini''s boy -
  13 years, 4.7 mg/m2, physeal widening, NO growth acceleration, slipped epiphysis. AND APEC1621B - twenty
  adolescents at the same dose with baseline and serial films, unpublished. FOUR CASES, FOUR DIFFERENT DOSES
  OR UNSTATED, THREE DIFFERENT PUBERTAL STATES, ONE BONE AGE BETWEEN THEM AND NO BASELINE FOR IT.

  WHAT THIS DOES TO THE STACK''S EVIDENCE BASE, STATED PLAINLY. The FGFR arm''s entire human growth signal
  rests on two children who grew and two who did not, none of whom had a bone age taken on treatment, and the
  one cohort that took the films by protocol has not reported them. ROUND 225 SHOWED THE RANDOMISED
  BONE-AGE EVIDENCE ON THIS AXIS BELONGS TO VOSORITIDE - a different molecule reaching the axis from the
  other end - AT 1.02 AGAINST 1.14 YEARS PER YEAR. That remains the best number available, and transferring
  it to an FGFR inhibitor is an assumption, not a measurement.'
quantitative:
- parameter: no FGFR-inhibitor paediatric trial has registered a bone-age endpoint
  value: 'five trials queried directly against the ClinicalTrials.gov registry - NCT04265651 PROPEL2 (ages
    3-11, completed, no results posted), NCT05145010 extension (ages 3-18), NCT04035811 natural history (ages
    2.5-17), NCT06164951 PROPEL3 (ages 3-17, completed, no results posted) and NCT03210714 Pediatric MATCH
    arm B (ages 1-21, results posted). NONE registers a bone-age, skeletal-maturation, Greulich, epiphyseal,
    growth-plate, physeal or radiographic outcome measure as primary, secondary or exploratory'
  unit: count of registered bone-age endpoints
  conditions: queried 2026-08-10 against the ClinicalTrials.gov v2 API, matching outcome measure titles
    against bone age, skeletal maturation, maturation, Greulich, epiphysis, growth plate, physeal,
    radiograph and bone survey
  species: human
  source_ref: apec1621b_protocol
  uncertainty: 'AN OUTCOME MEASURE IS NOT THE SAME AS A DATA ELEMENT - APEC1621B registers no bone-age
    OUTCOME while its protocol mandates the films, so a registry sweep understates what was collected. What
    the sweep establishes is that no trial committed in advance to ANALYSING bone age, which is why no number
    has ever been reported'
- parameter: the protocol-mandated physeal imaging in APEC1621B
  value: 'section 8.2 GROWTH PLATE TOXICITY - a plain AP radiograph of a single proximal tibial growth plate
    in ALL patients PRIOR TO THE FIRST DOSE; if the plate is open, repeat radiographs of the SAME plate prior
    to cycles 2 and 5 and every 6 months thereafter; knee MRI plus radiographs at least every 3 cycles for
    anyone with plate thickening. Section 8.3 RADIOLOGY STUDIES, headed BONE AGE / KNEE MRI, requires that
    ALL tibial radiographs and knee MRIs be submitted for review. Dose 4.7 mg/m2/day capped at 8 mg; 20
    evaluable patients, MEDIAN AGE 15 YEARS, enrolled June 2018 to July 2022'
  unit: imaging schedule and cohort size
  conditions: APEC1621B protocol version 28 October 2022, downloaded and read by this atlas
  species: human
  source_ref: apec1621b_protocol
  uncertainty: 'MANDATED IS NOT THE SAME AS OBTAINED - compliance in a relapsed paediatric oncology
    population is unlikely to be complete, and the protocol exempts patients whose tibial plate is already
    closed at baseline, which at a median age of 15 could exclude a substantial fraction. The films were
    collected for TOXICITY SURVEILLANCE rather than for growth, so whether a formal bone age was ever READ
    from them is unknown - the section heading says BONE AGE and the required film is a TIBIA, and a bone age
    is conventionally read from a hand and wrist'
- parameter: physeal widening WITHOUT growth acceleration in a fourth child
  value: 13-year-old male, optic pathway and hypothalamic low-grade astrocytoma with FGFR1 kinase domain
    internal tandem duplication, erdafitinib 4.7 mg/m2/day for 12 weeks - slipped capital femoral epiphysis
    of the right hip with WIDENING OF THE PROXIMAL FEMORAL GROWTH PLATE, while HEIGHT REMAINED BETWEEN THE
    25TH AND 50TH PERCENTILE WITH NO INCREASED GROWTH VELOCITY NOTED, against weight rising to the 97th
    percentile and BMI above the 99th. No bone age was obtained
  unit: percentile position and qualitative physeal width
  conditions: brizini2024, Front Oncol 2024;14:1399356
  species: human
  source_ref: brizini2024
  uncertainty: 'ONE CASE, TWELVE WEEKS, AND HEAVILY CONFOUNDED - central hypothalamic obesity with BMI above
    the 99th percentile is itself the classic risk factor for a slipped epiphysis, and drug-induced
    hyperphosphataemia is the authors'' second attributed cause. Twelve weeks may also be too short for a
    velocity change to register on a percentile chart. WHAT SURVIVES IS THE DISSOCIATION - the physis widened
    and the height did not move - which is the first time those two have come apart in a human'
localization:
- 'the proximal tibial physis, imaged by protocol with a baseline in twenty adolescents and never reported'
- 'the proximal femoral physis, which widened and then slipped in a child whose height did not move'
human_evidence: direct
human_evidence_note: 'Four children across three reports, one twenty-patient cohort whose imaging is
  unpublished, and a registry sweep of five trials. All human.'
species_basis:
- human
translation_risk: low
translation_risk_reason: 'These are human observations in the relevant age range and, for APEC1621B and
  brizini2024, at the dose this programme has fixed on.'
confidence: B
claim_grades:
- claim: any FGFR-inhibitor paediatric trial has prespecified a bone-age endpoint
  grade: X
  basis: FALSE ACROSS THE WHOLE PROGRAMME. Five trials queried directly against the registry - two PROPEL
    interventional studies, the PROPEL natural history study, PROPEL3 and Pediatric MATCH arm B - and none
    registers a bone-age, skeletal-maturation, growth-plate or physeal outcome measure of any kind
- claim: baseline and serial physeal imaging exists for a cohort of children on erdafitinib at our dose
  grade: A
  basis: PROTOCOL-MANDATED IN APEC1621B - a proximal tibial radiograph in all patients before the first dose,
    repeated prior to cycles 2 and 5 and every 6 months in those with open plates, with central submission
    required under a section headed BONE AGE / KNEE MRI. Twenty evaluable patients, median age 15, at 4.7
    mg/m2/day capped at 8 mg
- claim: that imaging has been published
  grade: X
  basis: FALSE. A Europe PMC sweep returns no full paper for APEC1621B. The only report is an ASCO 2023
    abstract and the ClinicalTrials.gov results posting, which gives adverse events - scoliosis 1 of 20
    serious, hyperphosphataemia 14 of 20 - and nothing about growth or the growth plate
- claim: physeal widening under an FGFR inhibitor always accompanies growth acceleration
  grade: X
  basis: 'FALSE IN AT LEAST ONE CHILD. brizini2024 reports widening of the proximal femoral growth plate with
    height held between the 25th and 50th percentile and NO increased growth velocity. That is the
    dissociation round 224 said would distinguish preserved reserve from arrested remodelling, and it points
    at the second. One heavily confounded case over twelve weeks'
- claim: the FGFR arm's human growth evidence rests on more than four children
  grade: X
  basis: FALSE. Four children across three reports - two who grew dramatically, one whose velocity is not
    quantified, one who did not grow at all - with one bone age between them and no baseline for it. The
    twenty-patient cohort that took the films by protocol has never reported them
