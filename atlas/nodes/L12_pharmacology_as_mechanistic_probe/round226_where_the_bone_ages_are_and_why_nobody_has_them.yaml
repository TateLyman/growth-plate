contradicts:
- 'Any reading of the erdafitinib case reports in which physeal widening indicates growth. brizini2024
  reports widening of the proximal femoral growth plate in a child whose height did not move, which is the
  dissociation that distinguishes preserved reserve from arrested remodelling and points at the latter.'
- 'The implicit assumption, running through rounds 217 to 225, that the absence of a published bone age
  means the measurement was never made. It was made, by protocol, with a baseline, in twenty adolescents at
  this programme''s own dose - and left unreported.'
