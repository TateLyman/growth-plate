id: round262_the_synergy_audit_and_the_pth1r_correction
name: ROUND 262 - PTH1R was closed and I said it was open. And the synergy question assembled - three collisions
  in the current stack, one of them between the two agents this programme most wants to run together, and the partner
  the atlas already chose is cilostazol on grounds I nearly re-derived from scratch
aliases:
- round 262
- the synergy audit
- the PTH1R correction
- collision matrix
- stack across control points
type: hypothesis
layer: L12
stub: false
summary: 'THE OPERATOR SAID PTH1R WAS ALREADY CLOSED AND ENDED UP DOING NOTHING. HE IS RIGHT AND ROUND 261''S CLOSING
  SENTENCE WAS WRONG. Recorded as CORR-269 before anything else in this round.

  ONE - WHAT WAS ACTUALLY ESTABLISHED ABOUT PTH1R, WHICH IS MORE THAN "UNRESOLVED TERM ATTRIBUTION". THE FINAL-LENGTH
  LEDGER IS DECISIVE AND IT IS NULL. Femoral length by QCT in the FDA NDA 21-318 rat package: INTERIM at six months
  of treatment, POSITIVE and dose-dependent in both age windows - plus 1.5 per cent at 5 micrograms and 3.4 per
  cent at 30 in the 2-8 month window, plus 1.5 and 2.9 per cent in the 6-12 month window. TERMINAL at 26 months
  of age, NULL IN EVERY ARM, including the two dosed continuously to the end. The two terminal positives in the
  literature (vahle2002 caliper plus 5-6 per cent, jolette2006 BMA plus 3-5 per cent) both use methods that cannot
  separate longitudinal from radial growth, and vahle2002 measured femoral WIDTH up 32-33 per cent in the same animals.
  CORR-189 applies to jolette2006 by name. THE ONE READING THAT SURVIVES BOTH TABLES: the drug accelerates femoral
  elongation and THE ANIMAL GIVES IT BACK - controls caught up from 32.8 to 34.2 to 35.0 mm while treated animals
  reached the same asymptote earlier. PTH1R AGONISM IS A RATE AGENT, NOT A YIELD AGENT, in the only species where
  final bone length has been measured. AND THREE MORE THINGS CLOSED IT FURTHER. The schedule argument: the rat proliferative
  chondrocyte cycle is 1.4 days and the human about 20, so ogawa2002''s five-days-a-week rat regimen is ONE PULSE
  PER CELL CYCLE while daily teriparatide in a human is TWENTY - the sign of this class inverts with schedule and
  daily dosing is twenty times too frequent. The evidence base: ogawa2002 is the entire wild-type case, has thirteen
  citations in twenty-four years, none replicating the growth finding, and silvestrini2007 found growth plate width
  unaffected under PTH. The human dose-response: imaizumi2026, 622 paediatric dialysis patients, each doubling of
  intact PTH associated with a fall in height velocity SDS of 0.26 - heavily confounded by uraemia, and pointing
  the wrong way. AND THE MOLECULE FLIPPED: the TYMLOS label reports 26 per cent NEUTRALISING antibodies on abaloparatide
  with 2.4 per cent cross-reacting with PTHrP, three of them neutralising endogenous PTHrP - which reproduces the
  PTHLH loss-of-function direction that causes brachydactyly type E WITH SHORT STATURE, during a non-repeatable
  window. WHAT IS GENUINELY LEFT, AND IT IS NARROW. The rat gives the acceleration back because the rat plate never
  closes and the control catches up over fourteen further months. A human plate FUSES. If fusion timing is set by
  hormonal milieu, accelerated growth is banked; if it is set by exhaustion of a fixed reserve, accelerating consumption
  fuses earlier and banks nothing. The rat data cannot distinguish these. That - plus a roughly three-weekly teriparatide
  schedule that nobody has ever tried - is the entire residue, and the node carrying it is graded D.

  TWO - THE SYNERGY QUESTION, AND THE ATLAS ANSWERED IT AT ROUND 80. Asked what pairs with the velocity agents,
  I began re-deriving the PDE3 argument from kawabe2025 and found the atlas already holds vosoritide_versus_cilostazol_decision,
  which settles it on full texts of both PDE papers. Recording that because it is the CORR-254 failure shape for
  the third time in this session. THE PDE ISOFORM IS THE VARIABLE AND BULK cGMP IS NOT, WHICH RESCUES THE ARM FROM
  THIS ATLAS''S OWN RULE. the_stack_in_a_normal_human states "YOU CANNOT STACK WITHIN THE cGMP NODE", on hakata2024''s
  non-additive sacubitril and wang2018''s tadalafil null. But wang2018 tested a PDE5 inhibitor, and kawabe2025 PREDICTED
  that null from mouse genetics before testing anything: Pde5a-null mice are SMALL, Pde9a-null normal, Pde3b-null
  show ENLARGEMENT OF THE TIBIA. Opposite knockout phenotypes, opposite predictions, both confirmed. The rule survives
  as stated for LIGAND-side and PDE5 manipulation and does not extend to PDE3B. THE CILOSTAZOL RESULT IS A WILD-TYPE
  LENGTH RESULT, WHICH IS THE RAREST KIND IN THIS FILE. Juvenile C57BL/6 from weaning, 10 mg/kg/day intraperitoneally
  for four weeks: naso-anal length 93.6 +/- 0.3 mm vehicle against 95.3 +/- 0.5 treated, P<0.05 - 1.7 mm, 1.82 per
  cent, in a NORMAL animal rather than a rescue. Mechanism dissected pharmacologically and genetically: PKG to BK
  potassium channel to hyperpolarisation to TRPM7 calcium entry to CaMKII, blocked by KT5823, paxilline and FTY720
  respectively, with Trpm7 conditional knockouts for the genetic test. Allometrically, 10 mg/kg/day in mouse is
  about 57 mg/day in a 70 kg human against the 200 mg/day already taken long-term for claudication.

  THREE - THE COLLISION MATRIX, WHICH IS WHAT THE QUESTION ACTUALLY ASKED FOR. The atlas''s design rule is STACK
  ACROSS CONTROL POINTS, NEVER WITHIN ONE. Applying it to the current stack finds three collisions. COLLISION ONE,
  AND IT IS BETWEEN THE TWO AGENTS THIS PROGRAMME MOST WANTS TO RUN TOGETHER. Both approved CNP-analogue labels
  put their mechanism at the RAF-1 step of the FGFR3-MAPK cascade - which is where erdafitinib already acts. VOSORITIDE
  AND ERDAFITINIB ARE THE SAME CONTROL POINT. Cilostazol''s chain runs through a potassium channel and a calcium
  channel to matrix synthesis, orthogonal to MAPK, which is why the round-80 verdict makes cilostazol the better
  PARTNER and vosoritide the better MONOTHERAPY. COLLISION TWO IS PHARMACOKINETIC AND IT IS THE HARD STRIKE AGAINST
  THE PARTNER. The FDA review states erdafitinib is in vitro a time-dependent INHIBITOR AND INDUCER of CYP3A4; cilostazol
  is a CYP3A4 and CYP2C19 substrate. One drug pushes the same enzyme both ways on different time courses and the
  net effect on cilostazol exposure is unpredictable. Vosoritide, a 39-residue peptide cleared by peptidases, has
  no such interaction. SO THE TWO COLLISIONS TRADE OFF AGAINST EACH OTHER and neither pairing is clean. COLLISION
  THREE IS ON THE DURATION ARM AND IT IS ALREADY SETTLED. Duration agents are not one class. Aromatase inhibitor
  plus growth hormone WORKS - near-final height SDS -1.0 on the combination against -1.4 on either alone, absolute
  change +22.5 cm against +20.6 for GH and +18.2 for the AI. GnRH ANALOGUE plus growth hormone DOES NOT - minus
  1.8 against minus 1.9 SDS in 91 randomised children - because a GnRH analogue removes the pubertal spurt along
  with the fusion signal and the two cancel. THAT IS THE EXACT FAILURE MODE THE QUESTION WAS ABOUT: a duration agent
  that drags the velocity arm down nets zero.

  FOUR - WHAT IS OPEN ON SYNERGY, AFTER SEARCHING. A Europe PMC query for cilostazol or PDE3 inhibitor together
  with a CNP analogue in bone or growth plate returns 45 records and NOT ONE IS A COMBINATION EXPERIMENT - they
  are reviews, the kawabe2025 primary itself, and unrelated cGMP literature. THE CILOSTAZOL PLUS CNP-ANALOGUE COMBINATION
  HAS NEVER BEEN RUN. Mechanistically it should add rather than collide - vosoritide raises cGMP production at NPR2,
  cilostazol blocks its degradation at PDE3B, and the downstream branch kawabe2025 dissects (BK channel, TRPM7,
  CaMKII, matrix synthesis) is not the RAF-1 branch the CNP labels claim. But two routes to more cGMP have already
  failed to convert in this atlas, and the reason they failed - isoform, not bulk - is exactly the kind of argument
  that predicts additivity and could be wrong. It is the cheapest untested combination in the file: two agents,
  one of them approved and oral, with a wild-type length endpoint available in juvenile mice. AND PDE3 IS DUAL-SPECIFICITY,
  WHICH IS THE UNEXAMINED CONSEQUENCE. pde3a records that cGMP competitively inhibits cAMP hydrolysis at PDE3, making
  it a direct cross-inhibition point between the NPR2-cGMP and PTH1R-cAMP arms. If cilostazol blocks PDE3B, it should
  raise cAMP as well as cGMP in the same cells - so the compound the atlas chose as the CNP-arm partner is ALSO
  a PTH1R-arm amplifier, and the residual three-weekly PTH1R schedule and the cilostazol arm are not independent.
  Nobody has measured cAMP in a growth plate under a PDE3 inhibitor.'
quantitative:
- parameter: FEMORAL LENGTH UNDER A PTH1R AGONIST - INTERIM POSITIVE, TERMINAL NULL
  value: 'interim QCT at 6 months: +1.5 per cent at 5 ug/kg/d and +3.4 per cent at 30 in the 2-8 month window, +1.5
    and +2.9 per cent in the 6-12 month window. TERMINAL QCT at 26 months: 0.0 per cent in every arm'
  unit: per cent difference in femoral length versus control
  conditions: FDA NDA 21-318 rat carcinogenicity and toxicology package, teriparatide, QCT, n = 8-10 per arm, dosed
    from 2 or 6 months of age. Control femur 32.8 mm at 8 months, 34.2 at 12, 35.0 at 26. Terminal arms include
    animals dosed continuously to study end. Caliper (vahle2002, +5/+6 per cent) and BMA-inferred (jolette2006,
    +5/+3 per cent) terminal positives use methods that cannot separate longitudinal from radial growth; vahle2002
    reports femoral WIDTH +32-33 per cent in the same animals.
  species: rat
  source_ref: fda_forteo_pharmreview_2002
  uncertainty: THE TERMINAL NULL IS THE LOAD-BEARING NUMBER AND IT IS A REGULATORY TABLE RATHER THAN A PUBLISHED
    EXPERIMENT. The interim-positive/terminal-null pattern is consistent with acceleration onto an unchanged asymptote,
    but the rat plate NEVER CLOSES, so a species whose plate fuses on schedule could in principle bank what the
    rat gives back. That distinction cannot be made from this dataset and is the entire residue of the line.
- parameter: CILOSTAZOL IN WILD-TYPE JUVENILE MICE - A LENGTH RESULT IN A NORMAL ANIMAL
  value: naso-anal length 93.6 +/- 0.3 mm vehicle against 95.3 +/- 0.5 mm treated, a gain of 1.7 mm or 1.82 per
    cent
  unit: mm of naso-anal length
  conditions: kawabe2025. Juvenile C57BL/6 mice from weaning, cilostazol 10 mg/kg/day intraperitoneally for 4 weeks,
    P<0.05. Tibial growth plate length and alcian-blue ECM area rose; cell density fell slightly. Mechanism dissected
    pharmacologically and genetically - PKG to BK potassium channel to hyperpolarisation to TRPM7 calcium entry
    to CaMKII, blocked by KT5823, paxilline and FTY720 respectively, with Trpm7 conditional knockouts. Allometric
    scaling puts 10 mg/kg/day in mouse at about 57 mg/day in a 70 kg human against 200 mg/day taken long-term for
    intermittent claudication.
  species: mouse
  source_ref: kawabe2025
  uncertainty: NASO-ANAL LENGTH IS NOT A LONG BONE MEASUREMENT and includes the axial skeleton and soft tissue;
    tibial growth plate LENGTH is a zone height, which CORR-189 says is not a growth rate. A 1.82 per cent body
    length gain is small and the tibial length itself is not the headline number. What makes it the rarest kind
    of result here is that it is a WILD-TYPE animal rather than a rescue of a deficient model.
- parameter: THE DURATION-ARM COLLISION, ALREADY SETTLED - AI PLUS GH ADDS, GnRHa PLUS GH CANCELS
  value: 'aromatase inhibitor plus GH: near-final height SDS -1.0 against -1.4 on either alone (P = 0.06), absolute
    change +22.5 cm against +20.6 for GH and +18.2 for AI (P = 0.01). GnRH analogue plus GH: -1.8 against -1.9 SDS
    in 91 randomised children'
  unit: height SDS and centimetres at near-final height
  conditions: Trials collated in duration_velocity_combination. The AI-plus-GH result is in 71 pubertal boys with
    idiopathic short stature, with a second independent matched cohort reaching true adult height at 173.1 against
    169.8 cm but only with at least two years of exposure.
  species: human
  source_ref: mauras2016
  uncertainty: The AI-plus-GH primary endpoint is P = 0.06, i.e. not conventionally significant, and the absolute-change
    comparison that is significant uses different baselines. The GnRHa null is the cleaner design. What the pair
    establishes is the PRINCIPLE the question asked about - a duration agent that suppresses the pubertal spurt
    nets zero, and one that does not can add.
localization:
- 'rat femur: where PTH1R agonism accelerates and then gives it back'
- 'mouse growth plate: where PDE3B inhibition acts through BK, TRPM7 and CaMKII'
- 'human near-final height: where AI plus GH adds and GnRHa plus GH does not'
human_evidence: direct
human_evidence_note: The duration-arm collision is human near-final-height trial data. The PTH1R final-length result
  is rat regulatory data and the cilostazol result is mouse.
species_basis:
- rat
- mouse
- human
translation_risk: high
translation_risk_reason: The two agents under audit have length endpoints only in rodents, and the rodent whose
  plate never closes is the one that returned the PTH1R null. Only the duration-arm collision has human endpoints.
confidence: B
confidence_reason: Each component is drawn from a node already graded in this atlas and is restated rather than
  newly derived. The assembly into a collision matrix is new; the facts are not.
claim_grades:
- claim: The PTH1R line is open with an unresolved term attribution.
  grade: X
  basis: WRONG, AND ROUND 261 SAID IT. The term attribution WAS resolved - interim positive with terminal null in
    the only species where final femoral length was measured makes it a RATE agent, not a yield agent. On top of
    that the schedule is twenty times too frequent at daily dosing, the wild-type evidence base is one unreplicated
    2002 abstract with a contradicting companion, the largest human PTH-and-height dataset points the wrong way,
    and abaloparatide carries 26 per cent neutralising antibodies with anti-PTHrP cross-reactivity. CORR-269.
- claim: Bulk cGMP is not the limiting step, therefore PDE inhibition cannot add to a CNP analogue.
  grade: X
  basis: THE ISOFORM IS THE VARIABLE. Pde5a-null mice are small, Pde9a-null normal, Pde3b-null show tibial enlargement;
    kawabe2025 predicted wang2018's tadalafil null from those genetics before testing, and both predictions were
    confirmed. The no-stacking-within-cGMP rule holds for ligand-side and PDE5 manipulation and does not extend
    to PDE3B.
- claim: Vosoritide and erdafitinib stack across control points.
  grade: X
  basis: NO. Both approved CNP-analogue labels place their mechanism at the RAF-1 step of the FGFR3-MAPK cascade,
    which is where erdafitinib already acts. That is stacking WITHIN one control point, against this atlas's own
    design rule. Cilostazol's PKG-BK-TRPM7-CaMKII chain is orthogonal to MAPK, which is why round 80 made it the
    better partner.
- claim: Cilostazol and a CNP analogue would add rather than collide.
  grade: E
  basis: 'NEVER TESTED - a Europe PMC search returns 45 records and not one is a combination experiment. The mechanistic
    case is that vosoritide raises cGMP production at NPR2 while cilostazol blocks its degradation at PDE3B, on
    a downstream branch that is not RAF-1. Against it: two routes to more cGMP have already failed to convert in
    this atlas.'
- claim: Cilostazol is a pure CNP-arm agent, independent of the PTH1R arm.
  grade: D
  basis: PROBABLY NOT, AND NOBODY HAS LOOKED. PDE3 is dual-specificity - cGMP competitively inhibits cAMP hydrolysis
    - so blocking PDE3B should raise cAMP as well as cGMP in the same cells, making cilostazol a PTH1R-arm amplifier
    too. No study measures cAMP in a growth plate under a PDE3 inhibitor.
