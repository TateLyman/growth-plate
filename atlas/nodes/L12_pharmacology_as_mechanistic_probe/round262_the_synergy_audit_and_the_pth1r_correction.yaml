contradicts: 'CORRECTS THE CLOSING SENTENCE OF round261_the_monotherapy_has_a_length_endpoint_and_it_is_null, which
  described intermittent PTH1R agonism as "the one with an unresolved term attribution" and proposed it as the next
  target. The term attribution was resolved against the candidate: interim positive with terminal null in the rat
  femoral ledger makes it a rate agent, and pth1r_verdict adds the schedule argument, the unreplicated evidence
  base, the wrong-direction human dose-response and the abaloparatide immunogenicity reversal. CORR-269. ALSO QUALIFIES
  the_stack_in_a_normal_human''s rule that one cannot stack within the cGMP node - true for ligand-side and PDE5
  manipulation, not established for PDE3B, where the knockout phenotypes run the other way.'
