id: round329_the_within_arm_audit_and_the_ledger_failure_that_is_the_actual_reason_this_project_feels_stuck
name: >-
  ROUND 329 - the within-arm upgrade audit, and the discovery that most of it was already done in rounds
  141 and 142 while CLAUDE.md kept the pre-141 claim. The U:L segment ratio does NOT discriminate the CNP
  arm from the FGFR3 arm - both are -0.02 and neither is significant - and the ledger has used that contrast
  as a load-bearing compartment fact in three places. GnRHa is answered and closed. Navepegritide is
  approved and obtainable; infigratinib is not
aliases:
- round 329
- the within-arm audit
- why this project feels stuck
- the ULS ratio does not discriminate the arms
- GnRHa is closed
type: hypothesis
layer: L12
stub: false
summary: >-
  STEP 0 TAUGHT THIS FILE TO DISCARD SUBSTITUTIONS AS "NOT BIOLOGY", AND IT THEN NEVER ASKED, FOR ANY OF THE
  FOUR ARMS THE SUBJECT IS ALREADY ON, WHETHER HE IS ON THE BEST AGENT IN THAT CLASS. That question is not
  biology and it is centimetres. This round asked it. Most of the answer turned out to be already in the
  bibliography, extracted at rounds 141 and 142, and NOT in CLAUDE.md - which is the actual mechanism behind
  the operator's complaint that the project keeps going nowhere.

  ONE - WHAT THE AUDIT FOUND, ARM BY ARM.
  OESTROGEN / PERIOD ARM - ALREADY OPTIMAL, AND THE ALTERNATIVE IS NOW CLOSED. `cui2025` propensity-matched
  three groups of 32 boys with idiopathic short stature and BONE AGE 13 OR MORE, followed to ADULT HEIGHT:
  adult height SDS adjusted for target height was 0.81 on anastrozole plus rhGH, 0.60 on letrozole plus
  rhGH, and 0.48 on GnRH analogue plus rhGH, with anastrozole significantly the best at P less than .01.
  `zhang2025bmc` adds that letrozole plus rhGH beat GnRHa plus rhGH on height gain at one and two years with
  a shorter treatment duration, though final adult height was similar and BMD fell in both, more on
  letrozole. SO GnRHa IS THE WORST OF THE THREE IN EXACTLY THIS SUBJECT'S POPULATION, and anastrozole at 1
  mg is confirmed as the right agent by a second independent route after `zegarra2024`. GnRHa was never
  mentioned in CLAUDE.md at all, so this question was live for every future context and is now closed.
  CNP ARM - AN APPROVED, OBTAINABLE ALTERNATIVE EXISTS. Navepegritide (YUVIWEL) holds a US accelerated
  approval, once weekly, for children aged 2 and over with achondroplasia AND OPEN EPIPHYSES; its label and
  FDA review are already refs here. APPROACH gave a least-squares mean treatment difference of 1.49 cm/year
  (95% CI 1.05 to 1.93) against placebo; the CNP class meta-analysis of 4 RCTs gives 1.36 cm/year (1.05 to
  1.68). THOSE ARE NOT A HEAD-TO-HEAD AND THE INTERVALS OVERLAP ALMOST COMPLETELY. What is real is the
  dosing burden - once weekly against once daily over years - and continuous exposure across the interval,
  which this file has no basis to disfavour because R271 already killed the pulsatility hypothesis on the GH
  arm. Treat this as a substitution decided on adherence, not on a demonstrated height advantage.
  FGFR3 ARM - THE BETTER DRUG EXISTS, IS PUBLISHED, AND CANNOT BE HAD. Infigratinib's PROPEL 3 is a phase 3,
  double-blind, placebo-controlled trial in 114 children AGED 3 TO 17, oral 0.25 mg/kg once daily:
  annualised height velocity difference 1.74 cm/year (95% CI 1.31 to 2.17, P less than .001), height
  z-score +0.32, no serious adverse event or discontinuation judged related to drug. THAT IS THE LARGEST
  RANDOMISED HEIGHT-VELOCITY EFFECT ANYWHERE IN THIS FILE. The subject is instead on erdafitinib, a
  pan-FGFR1-4 oncology drug whose human growth evidence here is a case report PLUS a multi-patient
  retrospective compassionate-use series with sex-steroid- and IGF1-independent acceleration. But infigratinib is
  not obtainable: NDA submission is planned for Q3 2026 with US launch projected early-to-mid 2027, there is
  NO expanded-access programme, and the open-label extension NCT05145010 - which does admit up to 50
  infigratinib-naive participants aged 3 to 18 - requires achondroplasia, which this subject does not have.
  It therefore joins dabogratinib in the atlas's "wants it, cannot have it" category, but with a dated
  route: once launched under an achondroplasia label, off-label prescription becomes possible in the same
  way erdafitinib is used off-label now.

  TWO - THE LOAD-BEARING CORRECTION, AND IT TOUCHES THE FILE'S "MOST DECISION-RELEVANT COMPARTMENT FACT".
  CLAUDE.md asserts in THREE separate places that the CNP arm is LEG-preferential because navepegritide
  LOWERS the upper-to-lower segment ratio, and contrasts it with an FGFR3 arm that reaches the spine. THE
  TRIAL DATA NOW IN THIS BIBLIOGRAPHY DO NOT SUPPORT THAT CONTRAST. The CNP meta-analysis reports the ULS
  ratio at -0.02 (95% CI -0.04 to +0.01), P = .17, I-squared 0, WITH VOSORITIDE AND NAVEPEGRITIDE SEPARATELY
  BOTH AT -0.02. The infigratinib phase 3 reports the ULS ratio at -0.02 (96% CI -0.06 to 0.01), not
  significant. `reincke2025` observed no significant change in the ratio. THREE INDEPENDENT 2026 SOURCES,
  TWO DIFFERENT PATHWAYS, THE SAME POINT ESTIMATE AND NONE OF THEM SIGNIFICANT: at 52 weeks the U:L ratio
  does not distinguish the CNP arm from the FGFR3 arm, so it cannot be used to rank them by compartment.
  WHAT SURVIVES IS THE DIRECT AXIAL EVIDENCE, WHICH IS A DIFFERENT MEASUREMENT AND IS UNTOUCHED: vosoritide
  L1-L4 null in the EMA report, the axial null in monkeys, the rat axial dose that causes scoliosis and
  kyphosis, dabogratinib lengthening L4-L6, and R318's GWAS separation of NPR3 and NPPC from FGFR3 on the
  three absolute traits. Those are measurements OF THE SPINE and of lifelong allelic effects on adult
  proportion; a 52-week ULS ratio in children is a different and much weaker instrument. The claim must be
  restated on the evidence that carries it.

  THREE - THE CNP ARM IS NOT SPENT IN ADOLESCENCE, READ AT SOURCE, WITH THE CAVEAT THAT MATTERS.
  `reincke2025`, 34 real-world children banded by age at initiation: the OLDEST band, 10 to under 16 years,
  had the HIGHEST annualised-growth-velocity z-score at 2.30 +/- 1.23 (P = .0005) and also the highest mean
  ABSOLUTE velocity at 6.98 +/- 1.44 cm/year, against 5.77 +/- 1.24 in the 5-to-10 band and 6.27 +/- 1.68 in
  the 2-to-5 band. The class meta-analysis agrees on the direction, with an AGV gain of 1.63 cm/year at age
  5 and over against 0.91 under 5, subgroup difference P = .01.
  BUT THE OLDEST BAND IS n = 5, AND THE COHORT'S MEAN BONE AGE TO CHRONOLOGICAL AGE RATIO IS 0.86 - A
  DELAYED bone age, which is the opposite of this subject. A z-score against an ACH-specific reference whose
  own velocity collapses with age also has a shrinking denominator, so part of the rise across bands is
  arithmetic. The honest statement is that nothing here shows the CNP arm losing its effect in adolescence,
  which is what the question was; it is not evidence that the effect grows.
  ONE FREE COROLLARY FOR R327: the subgroup with PREVIOUS LIMB-LENGTHENING SURGERY had the highest z-score
  gain of any subgroup, 2.67 +/- 1.38 (P = .0304, n = 4) - a second, independent hint after `allegri2025`
  that the pharmacological and surgical accounts do not interfere.

  FOUR - AND THE FINDING THAT MATTERS MOST, WHICH IS ABOUT THIS FILE AND NOT ABOUT BIOLOGY. Almost
  everything in section one and two was ALREADY EXTRACTED, at rounds 141 and 142, into `cnpmeta2026`,
  `savarirayan2026infig`, `cui2025` and `reincke2025` - including CORR-145, which had already caught the
  same units error I re-derived this round. NONE OF THE CONCLUSIONS REACHED CLAUDE.md. GnRHa is absent from
  it entirely. The superseded U:L claim is still in it three times. So the next context reasons from the
  pre-141 premise, re-derives what is already known, and the project appears to make no progress while the
  bibliography quietly accumulates the answers. THAT IS THE MECHANISM. It is the third instance in two
  rounds, after CORR-345 and CORR-333, and it is not a research problem.
quantitative:
- parameter: >-
    THE OESTROGEN ARM IS OPTIMAL AND GnRHa IS THE WORST OF THE THREE - adult height, propensity-matched, in
    boys with BONE AGE 13 OR MORE
  value: >-
    adult height SDS adjusted for target height - anastrozole plus rhGH 0.81 +/- 0.34, letrozole plus rhGH
    0.60 +/- 0.28, GnRH analogue plus rhGH 0.48 +/- 0.17; anastrozole significantly greater than both
    comparators at P less than .01
  unit: SDS of adult height adjusted for target height
  conditions: >-
    cui2025, single centre, boys with idiopathic short stature and bone age at least 13 years, allocated by
    treatment received and matched by propensity score, 32 per group, followed every 3 months to adult
    height.
  species: human
  source_ref: cui2025
  uncertainty: >-
    RETROSPECTIVE AND ALLOCATED BY TREATMENT RECEIVED, not randomised - propensity matching cannot remove
    indication bias, and a single centre. The population is idiopathic short stature, so the absolute
    numbers do not transfer to a subject on a four-agent stack. WHAT TRANSFERS IS THE RANKING, and it is
    consistent with zegarra2024 (anastrozole equals letrozole on height, letrozole costs IGF-1) and with the
    mechanism that a GnRH analogue removes the pubertal growth spurt along with the fusion signal, which is
    the reason NCT00355030 was null on attained adult height.
- parameter: >-
    THE UPPER-TO-LOWER SEGMENT RATIO DOES NOT DISCRIMINATE THE TWO ARMS - same point estimate, neither
    significant, across two pathways
  value: >-
    CNP class meta-analysis, 4 RCTs - ULS ratio mean difference -0.02 (95% CI -0.04 to +0.01), P = .17,
    I-squared 0, with vosoritide and navepegritide SEPARATELY both -0.02; infigratinib phase 3 - ULS ratio
    -0.02 (96% CI -0.06 to 0.01), not significant; reincke2025 real-world - no significant change in
    sitting height to height ratio
  unit: upper-to-lower body segment ratio, change at 52 weeks
  conditions: >-
    cnpmeta2026 (11 studies N = 542, 4 RCTs n = 326 meta-analysed, low risk of bias); savarirayan2026infig
    (PROPEL 3, n = 114, 96 per cent intervals as printed, multiplicity-adjusted); reincke2025 (n = 34
    real-world, 12 months).
  species: human
  source_ref: cnpmeta2026
  uncertainty: >-
    THIS IS A NULL ON A SHORT-TERM SURROGATE AND IT DOES NOT PROVE THE TWO ARMS ARE COMPARTMENT-EQUIVALENT.
    Fifty-two weeks of proportion change in growing children is a weak instrument, all three sources are in
    ACHONDROPLASIA where baseline proportions are abnormal, and a ratio can stay flat while both segments
    move. WHAT IT DOES ESTABLISH is the narrow claim needed here - that the U:L ratio measured in these
    trials CANNOT be cited to rank the CNP arm against the FGFR3 arm by compartment, because it returns the
    same non-significant -0.02 for both. The direct axial measurements (vosoritide L1-L4 null, monkey axial
    null, dabogratinib L4-L6) and R318's GWAS separation are untouched and are the evidence the compartment
    claim must rest on.
- parameter: >-
    THE CNP ARM DOES NOT LOSE ITS EFFECT IN ADOLESCENCE - highest z-score AND highest absolute velocity in
    the oldest band, read at source
  value: >-
    annualised growth velocity z-score against age-, sex- and DISEASE-specific reference values - 2.30 +/-
    1.23 (P = .0005) at 10 to under 16 years (n = 5), 2.14 +/- 1.32 (P less than .0001) at 5 to under 10 (n
    = 20), 1.77 +/- 1.36 (P = .0434) at 2 to under 5 (n = 6), whole cohort 2.13 +/- 1.26. MEAN ABSOLUTE
    velocity 6.98 +/- 1.44 cm/year in the oldest band, 5.77 +/- 1.24 at 5 to 10, 6.27 +/- 1.68 at 2 to 5.
    Previous limb-lengthening subgroup z-score 2.67 +/- 1.38 (P = .0304, n = 4), the highest of any subgroup
  unit: z-score of annualised growth velocity; cm/year
  conditions: >-
    reincke2025, retrospective real-world inception cohort of 34 children with achondroplasia on vosoritide
    for at least 12 months at one specialist centre, banded by age at treatment initiation. Full text read
    at source.
  species: human
  source_ref: reincke2025
  uncertainty: >-
    THE OLDEST BAND IS FIVE PATIENTS, and the cohort's mean bone age to chronological age ratio is 0.86 - a
    DELAYED bone age, the opposite of this subject at BA16, so the band label overstates the skeletal
    maturity of these children. The z-score is taken against an ACH-specific reference whose own velocity
    falls steeply with age, so a shrinking denominator inflates the rise across bands; CORR-145 already
    flagged that the three figures are z-scores and not cm/year after cnpmeta2026 tabulated them without
    units. Retrospective, single centre, no control arm. THE CLAIM SUPPORTED IS THE NEGATIVE ONE - nothing
    here shows the arm failing in adolescence - and not that the effect grows with age.
- parameter: >-
    THE LARGEST RANDOMISED HEIGHT-VELOCITY EFFECT IN THIS FILE, AND IT IS NOT OBTAINABLE
  value: >-
    annualised height velocity difference against placebo 1.74 cm/year (95% CI 1.31 to 2.17, P less than
    .001) at 52 weeks; height z-score +0.32 (96% CI 0.23 to 0.41); serious adverse events 4/74 (5 per cent)
    against 1/39 (3 per cent), none judged related to drug or placebo. Regulatory state - NDA planned Q3
    2026, US launch projected early-to-mid 2027, NO expanded-access programme; extension NCT05145010 admits
    up to 50 infigratinib-naive participants aged 3 to 18 but requires achondroplasia
  unit: cm/year; SDS
  conditions: >-
    savarirayan2026infig, PROPEL 3, NCT06164951 - phase 3, multicentre, double-blind, placebo-controlled,
    114 children with achondroplasia aged 3 to 17 randomised 2:1 to oral infigratinib 0.25 mg/kg once daily
    or placebo for 52 weeks.
  species: human
  source_ref: savarirayan2026infig
  uncertainty: >-
    ACHONDROPLASIA, SO CORR-203 GOVERNS THE MAGNITUDE - this is restoration in an FGFR3 gain-of-function
    system and the subject is FGFR3 wild-type, exactly as for vosoritide and navepegritide. The comparison
    that survives is WITHIN the FGFR3 arm, where it is a placebo-controlled trial of 114 against
    uncontrolled observational data, and on selectivity, where infigratinib is FGFR1-3 and erdafitinib is pan-FGFR1-4. AND THE
    COST IS MEASURED ON THE SAME MOLECULE - kot2026's three-point bending showed REDUCED bone strength in
    treated wild-type MALES under infigratinib, so switching does not escape CORR-343; it is the same
    liability with better evidence behind the benefit. The sponsor's topline release states +2.1 cm/year and
    claims the first significant improvement in body proportionality, neither of which matches the published
    paper (1.74 cm/year; ULS ratio not significant) - the published figures are the citable ones.
localization:
- 'not a localisation result: this round is an audit of agents and of the ledger'
human_evidence: direct
human_evidence_note: >-
  Every number here is human and from randomised or propensity-matched clinical data, except the regulatory
  state, which is from sponsor and regulator communications.
species_basis:
- human
translation_risk: moderate
translation_risk_reason: >-
  All the trial data are in achondroplasia, an FGFR3 gain-of-function population, and the subject is FGFR3
  wild-type - CORR-203 applies to every absolute magnitude. The within-arm rankings and the ULS null are
  less exposed to that objection than the effect sizes are.
confidence: B
confidence_reason: >-
  The ULS correction and the GnRHa closure are graded B - each rests on multiple independent human sources
  already held here, and the ULS point estimates are identical across two pathways. The adolescence claim is
  weaker and is stated as a negative. The regulatory statements are dated facts that will go stale.
claim_grades:
- claim: >-
    The upper-to-lower segment ratio shows the CNP arm is leg-preferential and the FGFR3 arm is not.
  grade: X
  basis: >-
    NOT ON THE TRIAL DATA. The CNP meta-analysis gives ULS -0.02 (95% CI -0.04 to +0.01), P = .17, I-squared
    0, with vosoritide and navepegritide separately BOTH at -0.02; the infigratinib phase 3 gives -0.02 (96%
    CI -0.06 to 0.01), also not significant; reincke2025 found no change. Same estimate, both arms, neither
    significant. CLAUDE.md states the contrast in three places and must be restricted to the direct axial
    measurements and R318's genetics, which are untouched.
- claim: >-
    Adding or switching to a GnRH analogue is worth considering for this subject.
  grade: X
  basis: >-
    NO. In boys with bone age 13 or more followed to adult height, GnRHa plus rhGH gave 0.48 SDS against
    0.81 for anastrozole plus rhGH (P less than .01), the worst of the three arms; and NCT00355030, the only
    randomised trial with attained adult height as its primary, was null for GnRHa plus GH. The mechanism is
    known - a GnRH analogue removes the pubertal spurt along with the fusion signal and the two cancel.
- claim: >-
    Navepegritide is a demonstrated height upgrade over vosoritide.
  grade: D
  basis: >-
    NOT DEMONSTRATED. APPROACH gives 1.49 cm/year (95% CI 1.05 to 1.93) and the CNP class meta-analysis
    1.36 (1.05 to 1.68); those are separate trials with almost completely overlapping intervals and there is
    no head-to-head. What is real and decidable is once-weekly against once-daily dosing over years, and
    continuous exposure across the interval, which R271 gives this file no basis to disfavour. It is
    approved, launched, and its label criterion - achondroplasia with OPEN EPIPHYSES - matches his physeal
    status but not his diagnosis.
- claim: >-
    Infigratinib is a better agent than erdafitinib for the FGFR3 arm.
  grade: C
  basis: >-
    ON EVIDENCE QUALITY AND SELECTIVITY, YES - a 114-patient placebo-controlled phase 3 with 1.74 cm/year
    against uncontrolled observational data (a case report and a multi-patient series), and FGFR1-3 against
    pan-FGFR1-4. NOT ON A WILD-TYPE LENGTH CLAIM, because
    neither has one; both trials are restoration in FGFR3 gain-of-function and the subject is wild-type. AND
    NOT ON SAFETY IN THIS SUBJECT - kot2026's reduced wild-type male bone strength was measured on
    infigratinib itself. Moot for now regardless: no expanded access, and the extension requires
    achondroplasia.
- claim: >-
    This round discovered the within-arm comparison.
  grade: X
  basis: >-
    IT DID NOT - rounds 141 and 142 extracted cnpmeta2026, savarirayan2026infig, cui2025 and reincke2025,
    and CORR-145 had already caught the same units error re-derived here. The conclusions never reached
    CLAUDE.md, so the next context reasons from the pre-141 premise. Failure mode 3 in the file's own list,
    and the reason the project appears static while the bibliography accumulates answers.
