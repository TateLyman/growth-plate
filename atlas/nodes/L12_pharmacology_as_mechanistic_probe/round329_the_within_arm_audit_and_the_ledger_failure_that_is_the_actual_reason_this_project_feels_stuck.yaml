contradicts: >-
  Corrects CLAUDE.md rather than a node. The ledger states in three places that the CNP arm is
  LEG-preferential because navepegritide lowers the upper-to-lower segment ratio, and contrasts it with an
  FGFR3 arm that reaches the spine; the trial data held in this bibliography give the SAME non-significant
  -0.02 for both arms, so the ratio cannot carry that contrast. The direct axial measurements and R318's
  GWAS separation are untouched and are what the claim must rest on. It also adds the GnRHa closure, which
  was absent from CLAUDE.md entirely despite cui2025 sitting in the bibliography with the numbers.
