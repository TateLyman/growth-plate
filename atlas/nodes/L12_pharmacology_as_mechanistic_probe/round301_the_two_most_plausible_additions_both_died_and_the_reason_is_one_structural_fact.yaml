id: round301_the_two_most_plausible_additions_both_died_and_the_reason_is_one_structural_fact
name: >-
  ROUND 301 - the deep pass on what to actually ADD to this stack. Sacubitril is ELIMINATED by the four-arm
  design in the very paper that promoted it. Losartan is DEPRIORITISED, not eliminated - my first draft said
  eliminated and CORR-326 retracts it. Both fail for one underlying reason, now three-for-three: THE HUMAN
  GROWTH PLATE CARRIES THE RECEIVER AND NOT THE DRUGGED UPSTREAM NODE. What survives is LOXL2, and CXXC5 -
  the operator's standing question - gets the strongest expression result in the round
aliases:
- round 301
- what should we actually add to the stack
- sacubitril is not additive with vosoritide
- losartan is deprioritised because the axis grows limbs
- the receiver-not-the-handle rule
- CXXC5 is 15/15 in the human growth plate
- the polyamine pathway is in the plate
type: hypothesis
layer: L12
stub: false
summary: >-
  ZERO - THE QUESTION AND THE FILTER. What can be ADDED to vosoritide + erdafitinib + GH + anastrozole?
  CORR-297 supplies the filter and it is unforgiving: name the term of the height identity the candidate
  moves, then ask which arm ALREADY in the stack moves that term. If the answer is "the one already there",
  it is a substitution question priced against cost and adherence, not biology. That rule is what demoted
  LUM-201 after it sat at the top of the LIVE list for five rounds. Applied here, an addition must move
  something outside CNP/cGMP (vosoritide), FGFR3/ERK/CREB (erdafitinib), GH/IGF-1 (growth hormone) and
  oestrogen/the period (anastrozole). Two candidates were obtainable, approved and on-axis for a term the
  stack does not move. ONE IS ELIMINATED OUTRIGHT AND THE OTHER IS DEPRIORITISED FOR THIS CASE.

  ONE - SACUBITRIL IS ELIMINATED, AND THE PAPER THAT KILLS IT IS THE ONE THAT PROMOTED IT. hakata2024 is
  the reason sacubitril was on the LIVE list: dose-dependent skeletal overgrowth in WILD-TYPE mice, 102-103%
  of vehicle naso-anal length, abolished by cartilage-specific NPR-B knockout (P=0.392) - a clean genetic
  epistasis test. But the SAME paper ran a four-arm design - vehicle, sacubitril, CNP, both - and
  SACUBITRIL AND CNP WERE NOT ADDITIVE. They saturate the same step. This subject is on vosoritide, a CNP
  analogue. So sacubitril is not an addition to this stack; it is a weaker substitute for an arm already in
  it, delivering roughly half what exogenous CNP delivers (2% versus 4%). That is CORR-297 exactly, and the
  non-additivity was sitting in the atlas's own quantitative block the whole time.
  ✗ AND THERE ARE TWO MORE INDEPENDENT KILLS. The effect has a HARD AGE WINDOW - it worked at 3-4 weeks in
  mice and was 99% of vehicle at 4-5 weeks, P=0.717 - because it can only protect a peptide the tissue is
  still making. This subject is at bone age 16. AND NEW HERE: MME, neprilysin itself, the drug's target, is
  0/10 probe-donor cells in the clean donor of the only human zone-resolved growth plate (8/10 in donor 2,
  discordant, and donor 2's dissection failed).

  TWO - LOSARTAN IS DEPRIORITISED FOR THIS CASE, AND MY FIRST DRAFT OF THIS SECTION OVERSTATED IT. CORR-326.
  I drafted this round with losartan "eliminated on three independent lines", one of them morales2026's
  failure to improve growth in Adamtsl2 mutant mice. THEN I GREPPED THE GRAPH - third time this session - AND
  ROUND 289 HAD ALREADY DONE THIS BETTER, WITH TWO FACTS THAT BLUNT MY KILL.
  ✗ morales2026's GROWTH CURVES ARE BODY WEIGHT. No bone or body LENGTH was measured, at a dose of 153
  mg/kg/day that is far above the estimated maximum. So "did not improve growth" is a WEIGHT statement and I
  read it as a length statement - failure mode 3 in the file's own list. What DOES survive from that paper is
  the mechanistic half, and it is still strong: losartan failed to modulate TGF-beta signalling or ECM
  incorporation at all, and geleophysic patient fibroblasts showed REDUCED rather than elevated basal
  TGF-beta1 secretion, which challenges the excess-TGF-beta model this module was built on.
  ✗ AND HUMAN ARB TARGET ENGAGEMENT IS NOT REFUTED. Round 289 read the AIMS appendix: log TGF-beta at one
  year, placebo 5.40 versus irbesartan 5.29, difference -0.10 (95% CI -0.25 to 0.05), p=0.18 - about a TEN
  PER CENT REDUCTION with the interval reaching twenty-two per cent, in 89 people. UNDERPOWERED, NOT NULL,
  POINT ESTIMATE IN THE DRUG'S FAVOUR. An ARB may well lower TGF-beta in humans.
  ✓ WHAT THIS ROUND ADDS THAT IS GENUINELY NEW IS THE TISSUE. In GSE9160 the entire renin-angiotensin system
  is absent from the human growth plate: AGTR1 0/10 in the clean donor, AGTR2 0/15, REN 0/5, ACE 1/10 - and
  absent from the PERICHONDRIUM too, the one compartment where this axis lives. Only AGT is detected. That is
  a mechanistic reason to expect no LOCAL effect, and it is consistent with, rather than duplicative of, the
  Pediatric Heart Network null (608 children, height velocity 0.822 cm/yr on losartan versus 0.935 on
  atenolol, point estimate favouring the comparator, not placebo-controlled).
  ⛔ AND ROUND 289'S ARGUMENT IS THE ONE THAT ACTUALLY DECIDES IT FOR THIS CASE, INDEPENDENT OF ALL THE ABOVE:
  THE AXIS GROWS LIMBS. Marfan habitus is DISPROPORTIONATE - long limbs relative to trunk. The residual at
  bone age 14.5+ is TRUNK-dominant (R274). So this axis is aimed at the spent compartment, which is the same
  objection CLAUDE.md already makes against the CNP arm. Even a working handle would be pointed the wrong way
  for this subject.
  ⚠ THE AXIS IS NOT DEAD AS BIOLOGY. Round 300's human genetics stand - FBN1 +8.82 cm, TGFB3 +7.68 cm, LTBP2
  +2.36 cm, plus sedes2022's causal TGF-beta1 add-back. The correct summary is narrower than my draft: the
  target survives, the angiotensin handle is unsupported locally, and the compartment is wrong for this case.
  ⚠ ONE LIVE, ANSWERABLE QUESTION REMAINS AND IT IS ROUND 289'S, NOT MINE: AIMS randomised 93 children under
  18, placebo-controlled, five years, with weight tracked throughout. Whether height rode along with the
  weight is a single question to a single trials unit.

  THREE - AND THE HANDLE THAT WOULD WORK IS VISIBLE IN THE SAME DATA. While the entire RAAS is absent, the
  TGF-beta RECEIVER is abundant: TGFBR2 is detected at 12,902 in the proliferative zone, TGFBR3 at 10,214,
  TGFBR1 (ALK5) at 1,341 proliferative and 2,226 prehypertrophic, all in both donors. THE HUMAN GROWTH PLATE
  IS STRONGLY TGF-BETA RESPONSIVE AND CARRIES NONE OF THE ANGIOTENSIN MACHINERY. If this axis is to be
  lowered pharmacologically it must be hit at the ligand or at ALK5, not through angiotensin. Clinical-stage
  ALK5 inhibitors exist (galunisertib, vactosertib) and none is approved, none has a bone-length endpoint,
  and systemic TGF-beta receptor blockade carries known cardiac valve toxicity.

  FOUR - THE RULE THAT EXPLAINS BOTH DEATHS, NOW THREE-FOR-THREE. Round 298 found the human growth plate has
  the cGMP EFFECTORS (PRKG1 rising 1441 to 4228 into hypertrophy, PRKG2 in both donors) and NOT the soluble
  guanylate cyclase or NOS - so the whole approved nitrate shelf cannot reach it. This round finds the plate
  has the TGF-beta RECEPTORS in abundance and NOT the angiotensin receptors - so the approved ARB shelf
  cannot reach it. And it has NPR-B but not neprilysin in the clean donor.
  THE HUMAN GROWTH PLATE CARRIES THE RECEIVER AND NOT THE DRUGGED UPSTREAM NODE. That is a generalisable
  law for this atlas and it explains why accessible-drug hunting keeps failing where round 298's base rate
  said it would. The pharmacopoeia's handles are GPCRs and soluble enzymes, which live in the systemic
  circulation; the plate's own machinery is receptors, effectors, matrix and channels. TRIAGE EVERY FUTURE
  ACCESSIBLE-DRUG PROPOSAL BY ASKING WHETHER THE DRUG'S ACTUAL TARGET - not its pathway - IS IN THE TISSUE.
  The query is free and local and takes minutes.

  FIVE - WHAT SURVIVES, AND IT IS THE ONLY CANDIDATE LEFT STANDING. LOXL2 and the lysyl oxidase/hydroxylase
  pathway. It is the one target that is simultaneously (a) human-validated with a direction - LOXL2 +1.40 cm
  P=2.2e-09, PLOD2 +1.34 cm, PLOD1 +1.03 cm, three genes in one enzymatic pathway all lengthening on loss;
  (b) MASSIVELY present in the human growth plate - LOXL2 at 34,135 in the proliferative zone and PLOD2 at
  41,533, against COL2A1's 92,848, which puts them among the highest-expressed genes in the entire panel;
  (c) attached to a real oral clinical compound - PXS-5505 / lenumlostat, a first-in-class selective pan-lysyl
  oxidase inhibitor with a completed phase I/IIa in myelofibrosis; and (d) CLEAN ON STEP 0 - matrix
  cross-linking is moved by nothing in this stack, and it bears on h_term, the largest term in the height
  identity and the one round 296 concluded had no upward-pointing agent because every marketed tool on the
  volume machinery is an inhibitor of swelling.
  ✗ IT IS NOT A RECOMMENDATION AND THE OBJECTIONS ARE SERIOUS. Mouse Loxl2 deletion TRIGGERS temporomandibular
  osteoarthritis while overexpression protects; biallelic PLOD2 loss is Bruck syndrome; beta-aminopropionitrile,
  the classic lysyl oxidase inhibitor, causes osteolathyrism with exostoses and epiphyseal separation; and NO
  LOX OR PLOD INHIBITOR HAS A BONE-LENGTH ENDPOINT IN ANY SPECIES. The compound is not approved. What it has
  that nothing else this round has is a decisive, cheap, unrun experiment.

  SIX - THE OPERATOR'S STANDING QUESTION ANSWERED - CXXC5, AND IT IS THE STRONGEST EXPRESSION RESULT HERE.
  CXXC5 was flagged several rounds ago and had ZERO atlas coverage. In GSE9160 it is detected in 15/15
  probe-donor cells in BOTH donors - the only gene in this entire round detected in every single cell of the
  panel, alongside COL2A1 - peaking in the proliferative zone at 5,748 with 2,571 resting and 2,073
  perichondrium. It is unambiguously present in the human growth plate.
  ✗ BUT THE DIRECTION IS WRONG AND THAT IS THE ANSWER TO THE QUESTION AS ASKED. CXXC5 is a negative feedback
  regulator of canonical Wnt, so CXXC5 INHIBITION RAISES Wnt output. Round 281 established that the
  lengthening direction on this axis is mild chronic REDUCTION of canonical Wnt output - SPIN4 loss gives a
  longer bone and a bigger resting pool - and that the band has an interior optimum BELOW wild type. Raising
  Wnt is the wrong half. CXXC5 is not in kosmicki2026's 207, so there is no human height number to overrule
  the inference. Recorded as present-but-wrong-direction, which is a real answer and not a null result.

  SEVEN - A NEW PATHWAY, FULLY PRESENT, DIRECTION UNRESOLVED - POLYAMINES. AMD1 pLoF is +7.18 cm (P=1.7e-07,
  26 hets) and had zero atlas coverage; SMOX is -2.73 cm. Read together those agree - less spermine is
  taller - and THE ENTIRE BIOSYNTHETIC PATHWAY IS IN THE HUMAN GROWTH PLATE AND HYPERTROPHY-ENRICHED: ODC1
  4/5 in the clean donor rising to 5,606 hypertrophic, SRM 5/5 peaking at 4,449 prehypertrophic, AMD1 5/10,
  SMS 3/5, SMOX 5/15. An APPROVED ORAL DRUG with paediatric dosing exists - eflornithine/DFMO, licensed 2023
  for high-risk neuroblastoma in children - and it depletes polyamines.
  ✗ DO NOT PROMOTE IT YET, AND CORR-325 IS WHY. The chondrocyte literature runs the other way: polyamines are
  reported to STIMULATE the differentiated chondrocyte phenotype, and DFMO is used to TREAT Bachmann-Bupp
  syndrome, an ODC1 gain-of-function disorder - so the direction of ODC1 dosage on skeletal growth is not
  established. AMD1's 26 carriers are modest power. No polyamine agent has a bone-length endpoint in any
  species. This is the round's best new hypothesis and its sign is genuinely open.
human_evidence: direct
human_evidence_note: >-
  The eliminations rest on human data wherever human data exist. The localisation of AGTR1/AGTR2/REN/ACE/MME
  as absent and TGFBR1/2/3, CXXC5 and the polyamine enzymes as present is human primary data from GSE9160,
  the only zone-resolved transcriptome of a human growth plate, read against each array's preregistered
  detection threshold with zonal order from the clean donor only. The losartan randomised null is human, 608
  children. The effect sizes are human, from 1.45M exomes. What is NOT human: the sacubitril non-additivity
  and age window are mouse, and no compound named here has been given to a person for height.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  Absence on this platform is WEAK evidence of absence - it missed NPPC, vosoritide's own ligand, by one to
  two orders of magnitude while detecting NPR2 and NPR3, and AGTR1 is a low-abundance GPCR of exactly the
  class that platform misses. The losartan elimination therefore does not rest on the expression result
  alone; it rests on that plus a measured target-engagement failure plus a randomised human null, and it is
  the convergence of three independent lines that carries it, not any one. MME is discordant between donors.
  Conversely a detection is strong evidence of presence, so the surviving positives - TGFBR2, CXXC5, LOXL2,
  PLOD2, the polyamine enzymes - are the firmer half of this round.
confidence: B
confidence_reason: >-
  The sacubitril elimination is graded high because the non-additivity is a direct four-arm experiment in the
  promoting paper itself and needs no inference. The losartan elimination is graded high because three
  independent lines converge. The receiver-not-the-handle rule is an induction over three axes and is graded
  as a working rule, not a law. The LOXL2 survival and the polyamine hypothesis are explicitly unresolved and
  graded accordingly.
claim_grades:
- claim: >-
    Sacubitril is a viable addition to a vosoritide-containing stack.
  grade: X
  basis: >-
    NO, AND THE PROMOTING PAPER CONTAINS THE REFUTATION. hakata2024's four-arm design - vehicle, sacubitril,
    CNP, both - found sacubitril and CNP NOT ADDITIVE, because they saturate the same step; sacubitril
    delivers about half what exogenous CNP delivers (2% versus 4% of naso-anal length). Adding it to
    vosoritide is CORR-297's substitution trap, the same error that kept LUM-201 at the top of the LIVE list
    for five rounds. Two further independent kills: a hard age window (102-103% of vehicle at 3-4 weeks, 99%
    and P=0.717 at 4-5 weeks) in a subject at bone age 16, and MME, the drug's own target, at 0/10
    probe-donor cells in the clean donor of the human growth plate.
  species: mouse
  source_ref: hakata2024
- claim: >-
    Losartan is eliminated as a growth agent by morales2026's failure to improve growth.
  grade: X
  basis: >-
    NO - CORR-326, A CORRECTION OF THIS ROUND'S OWN DRAFT. morales2026's growth curves are BODY WEIGHT; no
    bone or body LENGTH was measured, at 153 mg/kg/day, far above the estimated maximum dose. I read a weight
    statement as a length statement, which is failure mode 3 in this file's own list. Round 289 had already
    recorded this and I found it only by grepping the graph before committing - the third time in one session
    that CORR-313's rule caught an overclaim. What survives from morales2026 is mechanistic and still strong:
    losartan failed to modulate TGF-beta signalling or ECM incorporation, and geleophysic patient fibroblasts
    showed REDUCED rather than elevated basal TGF-beta1. Human ARB target engagement is separately NOT
    refuted - AIMS gives log TGF-beta placebo 5.40 versus irbesartan 5.29, difference -0.10 (95% CI -0.25 to
    0.05), p=0.18 in 89 people, which is underpowered with the point estimate favouring the drug.
  species: mouse
  source_ref: morales2026
- claim: >-
    The angiotensin handle on the perichondrial TGF-beta axis is a plausible addition FOR THIS CASE.
  grade: X
  basis: >-
    NO, FOR A REASON THAT SURVIVES ALL THE ABOVE AND IS ROUND 289'S, NOT THIS ROUND'S: THE AXIS GROWS LIMBS.
    Marfan habitus is DISPROPORTIONATE, long-limbed relative to trunk, and the residual at bone age 14.5+ is
    trunk-dominant (R274) - so the axis is aimed at the spent compartment, exactly the objection CLAUDE.md
    already makes against the CNP arm. Independently and newly here, the local pharmacology has no basis: the
    entire renin-angiotensin system is absent from the human growth plate AND from the perichondrium (AGTR1
    0/10 clean donor, AGTR2 0/15, REN 0/5, ACE 1/10; only AGT detected). And the one randomised human
    read-out, the Pediatric Heart Network trial in 608 children, was null on prespecified height outcomes
    with the point estimate favouring the comparator. THE AXIS AS BIOLOGY IS UNTOUCHED - FBN1 +8.82 cm,
    TGFB3 +7.68 cm, LTBP2 +2.36 cm and sedes2022's causal add-back all stand. The target survives; the
    handle is unsupported locally; the compartment is wrong for this subject.
  species: human
- claim: >-
    The human growth plate carries the pathway's EFFECTOR and not the node the available drugs act on.
  grade: B
  basis: >-
    THREE AXES, THREE TIMES, INDEPENDENTLY ARRIVED AT. cGMP (round 298): PRKG1 present and rising 1441 to
    4228 into hypertrophy, PRKG2 in both donors, while GUCY1A2 is 0/30, GUCY1A1/B1 are not on the platform
    and NOS1/2/3 are effectively absent - the entire approved nitrate shelf cannot reach it. TGF-beta (here):
    TGFBR2 at 12,902 proliferative, TGFBR3 at 10,214, TGFBR1 present in both donors, while AGTR1 is 0/10,
    AGTR2 0/15 and REN 0/5 - the approved ARB shelf cannot reach it. CNP (here): NPR2 present, MME 0/10 in
    the clean donor. The pharmacopoeia is built on GPCRs and soluble enzymes; growth-plate control is
    receptors, effectors, matrix and channels. This is the mechanism behind round 298's druggability base
    rate rather than a restatement of it, and it yields a free triage step - check whether the drug's ACTUAL
    TARGET, not its pathway, is in the tissue, before proposing anything.
  species: human
  source_ref: gse9160
- claim: >-
    LOXL2 / pan-lysyl-oxidase inhibition is the most plausible remaining addition to this stack.
  grade: D
  basis: >-
    IT IS THE ONLY CANDIDATE LEFT, AND IT IS NOT YET A RECOMMENDATION. For: three genes in one pathway all
    lengthening on loss (LOXL2 +1.40 cm P=2.2e-09, PLOD2 +1.34, PLOD1 +1.03); LOXL2 and PLOD2 among the
    highest-expressed genes in the entire human growth-plate panel at 34,135 and 41,533 in the proliferative
    zone against COL2A1's 92,848; a first-in-class oral selective pan-lysyl oxidase inhibitor, PXS-5505 /
    lenumlostat, with a completed phase I/IIa in myelofibrosis; and a clean pass on CORR-297's Step 0, since
    matrix cross-linking is moved by no arm in this stack and bears on h_term, the largest term in the
    identity. Against: mouse Loxl2 deletion triggers temporomandibular osteoarthritis while overexpression
    protects cartilage; biallelic PLOD2 loss is Bruck syndrome; beta-aminopropionitrile causes osteolathyrism
    with exostoses and epiphyseal separation; the compound is not approved; and NO LOX OR PLOD INHIBITOR HAS
    A BONE-LENGTH ENDPOINT IN ANY SPECIES.
  species: human
- claim: >-
    CXXC5 inhibition is a lever for this case.
  grade: X
  basis: >-
    THE OPERATOR'S QUESTION, ANSWERED IN BOTH HALVES. CXXC5 IS PRESENT - and it is the strongest expression
    result in this round, detected in 15/15 probe-donor cells in BOTH donors, the only gene here matching
    COL2A1 for completeness, peaking in the proliferative zone at 5,748. It had zero prior atlas coverage.
    BUT THE DIRECTION IS WRONG. CXXC5 is a negative feedback regulator of canonical Wnt, so inhibiting it
    RAISES Wnt output, and round 281 established that the lengthening direction on this axis is mild chronic
    REDUCTION - SPIN4 loss gives a longer bone and a larger resting pool, and the band's interior optimum sits
    BELOW wild type. CXXC5 is absent from kosmicki2026's 207, so no human height number overrules the
    inference. Present, real, wrong half.
  species: human
  source_ref: gse9160
- claim: >-
    Polyamine depletion lengthens bone and eflornithine is therefore a candidate.
  grade: E
  basis: >-
    OPEN, AND THE SIGN IS GENUINELY UNRESOLVED - RECORDED AS THE ROUND'S BEST NEW HYPOTHESIS RATHER THAN A
    PROPOSAL. For: AMD1 pLoF +7.18 cm (P=1.7e-07, 26 hets) and SMOX -2.73 cm agree that less spermine is
    taller; the entire biosynthetic pathway is in the human growth plate and hypertrophy-enriched (ODC1 4/5
    clean donor rising to 5,606 hypertrophic, SRM 5/5 peaking 4,449 prehypertrophic, AMD1 5/10, SMS 3/5); and
    eflornithine/DFMO is an APPROVED ORAL DRUG with established paediatric dosing from high-risk
    neuroblastoma. Against, and this is CORR-325's rule applied before proposing rather than after: the
    chondrocyte literature reports polyamines STIMULATING the differentiated chondrocyte phenotype, and DFMO
    is used to TREAT Bachmann-Bupp syndrome, an ODC1 GAIN-of-function disorder, so ODC1 dosage on skeletal
    growth points the other way. 26 carriers is modest power. No polyamine agent has a bone-length endpoint
    in any species.
  species: human
