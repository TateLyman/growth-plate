contradicts: >-
  This round withdraws one of the atlas's own standing positions and NARROWS another. WITHDRAWN: sacubitril's
  place on the LIVE COMPOUNDS list in CLAUDE.md - hakata2024's own four-arm design shows non-additivity with
  CNP, making it a weaker substitute for the vosoritide arm rather than an addition, and CORR-297 governs.
  NARROWED, NOT WITHDRAWN: CLAUDE.md's claim that a caliper on a losartan-treated wild-type femur is "the
  cheapest experiment in the file". It remains genuinely unrun and genuinely cheap, and this round does NOT
  predict it null - my first draft said so and CORR-326 retracts that, because morales2026 measured weight
  rather than length and AIMS shows an ARB may lower human TGF-beta after all. What has changed is priority
  for THIS case: the local pharmacology has no basis (the whole renin-angiotensin system is absent from human
  growth plate and perichondrium) and, decisively, round 289's compartment argument - the axis grows LIMBS
  while this subject's residual is trunk-dominant. The perichondrial TGF-beta axis as biology is NOT
  contradicted; round 300's three human genes stand.
