id: the_tool_compound_is_a_prodrug_and_it_kills_juvenile_mice
name: THE TOOL COMPOUND IS A PRODRUG AND IT KILLS JUVENILE MICE - the receptor-phosphorylation branch
  survives as biology and fails as pharmacology, and here is every remaining question answered
aliases:
- what the escholarship pdf was
- LB-100 in vivo toxicology
- LB-100 is a prodrug of endothall
- is the phosphorylation branch closed
- fenton2023 dissertation
type: hypothesis
layer: L12
stub: false
summary: 'WHAT THE SUPPLIED DOCUMENT ACTUALLY IS. eScholarship qt5m79866n is a 202-page UC Davis doctoral
  dissertation in Pharmacology and Toxicology by Timothy Fenton, 2023, on preclinical models of
  NEURODEVELOPMENTAL DISORDERS. It is not a bone paper and it never mentions the growth plate. Chapter 2
  gave LB-100 to juvenile mice in an Angelman syndrome model - and that chapter is, as far as this atlas
  can establish, THE ONLY IN VIVO CHRONIC JUVENILE MAMMALIAN DOSING RECORD FOR THIS COMPOUND ANYWHERE.
  That is exactly the measurement round 133 said stood between this branch and a usable chronic exposure.
  THE ANSWER IS BAD AND IT IS SPECIFIC. A SINGLE dose of 3 mg/kg intraperitoneal was LETHAL TO ALL MICE of
  both genotypes, and dosing above 1 mg/kg was stopped on that finding. At 1 mg/kg every other day from
  postnatal day 14 to 30, FIVE OF TWELVE ANIMALS DIED before behaviour testing, one wild-type after two
  doses, and BODY WEIGHT WAS SIGNIFICANTLY REDUCED OVER THE DOSING PERIOD IN BOTH GENOTYPES. At 0.3 mg/kg,
  which everything survived, wild-type mice were SEDATED - horizontal, vertical and total activity all
  reduced against vehicle. So across the three doses tested in a growing mammal the compound is lethal,
  lethal-and-growth-suppressing, or sedating. There is no clean window.
  AND THE DOSE CONVERSION LANDS ON TOP OF THE HUMAN TRIAL. On the standard body-surface-area factor for
  mouse, 1 mg/kg is 3 mg per square metre. The human dose-limiting toxicity in chung2017 was at 3.1 mg per
  square metre and the recommended phase 2 dose is 2.33. The dose that killed 42 per cent of juvenile mice
  IS the human dose-limiting dose. The lethal single dose, 9 mg per square metre, is about 2.9 times it.
  Two independent species, two indications, one number.
  THEN THE MECHANISM OF THE TOOL ITSELF TURNED OUT TO BE WRONG IN THIS ATLAS. rollema2025 shows LB-100 IS
  A PRODRUG. It hydrolyses to ENDOTHALL, which is the actual phosphatase inhibitor at IC50 95 nanomolar,
  while LB-100 itself is weak - apparent IC50 12.2 micromolar, and even that is attributable to endothall
  formed in the assay. Half-life in cell culture medium at 37 degrees is 3.2 to 4.9 hours. shuhaibar2021
  cultured bones in LB-100 for SIX DAYS at 37 degrees. THE AGENT THAT PRODUCED THE BONE-GROWTH RESULT WAS
  THEREFORE ENDOTHALL, NOT LB-100 - see CORR-127. This does not weaken the biology, it renames the
  compound, and it changes what the atlas should be looking for.
  THE HUMAN GENETIC CLUE shuhaibar2021 POINTS AT DOES NOT SUPPORT THIS BRANCH. Their discussion invokes
  increased height in children with PP2A regulatory subunit mutations. That is loveday2015, and reading it
  rather than the citation to it: five children, de novo missense in the PP2A-B56 substrate-specificity
  loop, MEDIAN HEAD CIRCUMFERENCE PLUS 3.6 STANDARD DEVIATIONS and heights of plus 2.3, minus 1.4, plus
  2.0, plus 1.6 and plus 3.0 - head-dominant overgrowth, one child SHORT, ALL FIVE with intellectual
  disability, ascertained through an overgrowth study that requires tall stature or a large head for
  entry, and mechanistically attributed by its own authors to PI3K/AKT. Contrast the pattern this branch
  predicts, which is shuhaibar2017 7E: long bones and body length up about 8 per cent with CRANIAL WIDTH
  UNCHANGED. The human PP2A genetics phenocopies the wrong half.
  ONE GAP CLOSED IN THE RIGHT DIRECTION, AND IT WAS SITTING INSIDE A PAPER THIS ATLAS HAD ALREADY READ.
  The node asked whether CNP drives dephosphorylation of its own receptor. YES. potter1998 named
  dephosphorylation as the desensitisation mechanism for NPR-B under CNP, and shuhaibar2021 Figure 2 shows
  BMN-111 - vosoritide - itself reducing NPR2 phosphorylation in primary chondrocytes independently of
  FGF. The clinical CNP analogue partially switches off its own receptor. That is a real argument for
  pairing receptor-phosphorylation support with a sustained-release ligand, and it is undercut by the fact
  that shuhaibar2021 got ADDITIVITY rather than synergy from exactly that pairing.
  WHERE THIS LEAVES THE BRANCH. The biology is unchanged and still the strongest thing on the CNP axis:
  7E lengthens wild-type bone 4.3 to 8.8 per cent with the cranium spared, two human activating NPR2
  regions exist, and FGF inhibition of the receptor is NOT surmountable by more ligand. The pharmacology
  is now worse than it looked, on four counts - no in vivo bone-length experiment with any phosphatase
  inhibitor exists in any species, the only in vivo juvenile dosing record is lethal at the human
  dose-limiting dose, the active agent is a herbicide-class dicarboxylic acid rather than the branded
  compound, and the one human genetic anchor points at AKT and at the skull. THE BRANCH IS NOT DEAD - IT
  IS A TARGET WITHOUT A DELIVERABLE MOLECULE, which is a different failure from the ligand arm, where the
  molecules exist and the mechanism ran out.'
quantitative:
- parameter: 'IN VIVO LETHALITY OF LB-100 IN JUVENILE MICE - THE MEASUREMENT ROUND 133 ASKED FOR'
  value: '3 mg/kg single dose lethal to all animals of both genotypes; at 1 mg/kg every other day, 5 of 12
    died before behaviour testing and one wild-type died after 2 doses; 0.3 mg/kg survived by all'
  unit: mg/kg intraperitoneal, and deaths per group
  conditions: 'fenton2023 Chapter 2, Figure 15B and the accompanying text. B6.129S7-Ube3a-tm1Alb/J
    maternal-deletion mice and wild-type littermates, both sexes, LB-100 supplied by Lixte Biotechnology
    and dissolved in monosodium glutamate, injected intraperitoneally EVERY OTHER DAY from postnatal day
    14 to postnatal day 30 - nine doses over seventeen days. Group sizes in Figure 15A: wild-type vehicle
    10, wild-type 0.3 mg/kg 14, wild-type 1 mg/kg 11, mutant vehicle 10, mutant 0.3 mg/kg 12, mutant 1
    mg/kg 12. Dosing above 1 mg/kg was ceased after the 3 mg/kg deaths, on the advice of the chemist who
    synthesised the compound.'
  species: mouse
  source_ref: fenton2023
  uncertainty: 'THIS IS A T5 SOURCE - AN UNPUBLISHED DISSERTATION CHAPTER, AND THE ATLAS CHECKED: the
    paxilline/LB-100 chapter has NOT appeared as a peer-reviewed paper, only the lovastatin chapter has
    (Fenton 2025). So the single most decisive negative datum on this branch rests on one thesis, n
    around 12 per group, in a disease model on a mixed background, with no necropsy and no stated cause of
    death. IT IS ALSO NOT A BONE STUDY - nobody measured a femur. It is nevertheless the ONLY in vivo
    chronic juvenile dosing record this atlas can find for the compound, and a 42 per cent kill rate is
    not a subtle finding that needs replication to be taken seriously.'
- parameter: 'THE MOUSE TOXIC DOSE CONVERTED TO BODY SURFACE AREA LANDS ON THE HUMAN DOSE-LIMITING DOSE'
  value: 'mouse 0.3 / 1 / 3 mg/kg equals 0.9 / 3 / 9 mg per square metre; human dose-limiting toxicity 3.1
    and recommended phase 2 dose 2.33 mg per square metre'
  unit: mg per square metre
  conditions: 'DERIVED, not measured. Mouse km factor 3, the standard interspecies body-surface-area
    conversion, applied to the fenton2023 doses and compared against the chung2017 phase 1 doses already
    in this atlas. The single lethal mouse dose is about 2.9 times the human dose-limiting dose; the mouse
    dose that killed 5 of 12 equals it; the only mouse dose everything survived is about 0.39 times the
    human recommended phase 2 dose.'
  species: not_applicable
  source_ref: fenton2023
  uncertainty: 'FOUR REASONS THIS COMPARISON IS SOFTER THAN IT LOOKS, AND ONE REASON IT IS HARDER. Softer:
    intraperitoneal in mouse against intravenous in human; juvenile against adult; km scaling is an
    allometric convention for equivalent exposure, not a measurement; and the SCHEDULES DIFFER SHARPLY -
    nine mouse doses in seventeen days against three human doses in twenty-one, so the mouse cumulative
    intensity is roughly threefold higher and the 1 mg/kg deaths may be cumulative rather than acute.
    HARDER: the 3 mg/kg death was after a SINGLE dose, where no cumulative argument applies, and it sits
    under threefold above a dose humans already fail to tolerate.'
- parameter: 'LB-100 IS A PRODRUG - THE ACTIVE PHOSPHATASE INHIBITOR IS ENDOTHALL'
  value: 'endothall PP2A IC50 95 nanomolar; LB-100 apparent IC50 12.2 micromolar from a room-temperature
    DMSO stock and 0.59 micromolar from a stock heated to 65 degrees, the twenty-fold shift tracking
    endothall content; hydrolysis half-life 3.2 hours in cell culture medium at pH 6.8 and 4.9 hours at pH
    7.4, both at 37 degrees'
  unit: IC50 in nanomolar and micromolar, half-life in hours
  conditions: 'rollema2025, abstract read in full. LB-100 is an amide, stable at pH at or above 10.5, that
    hydrolyses to endothall and N-methylpiperazine. The authors conclude that the inhibition measured in
    LB-100 assays is mainly due to endothall and that LB-100 is a prodrug acting through it. Endothall was
    already known to be present in patient plasma after intravenous LB-100 (feng2023 built a validated
    LC-MS/MS assay for both analytes).'
  species: not_applicable
  source_ref: rollema2025
  uncertainty: 'THE CONSEQUENCE FOR THIS ATLAS IS CORR-127 AND IT IS NOT COSMETIC. shuhaibar2021 incubated
    E16.5 femurs in LB-100 at 37 degrees FOR SIX DAYS - roughly thirty hydrolysis half-lives - so the
    species present for almost the whole experiment was endothall. Two further consequences. (1) The
    tenfold gap between the 1 micromolar LB-100 that did nothing and the 5 to 10 micromolar that worked is
    a gap in PRODRUG loading, not in inhibitor potency, and the actual active concentration is unknown.
    (2) darcy2019, which this atlas cites for LB-100 being a catalytic inhibitor of PPP2CA and PPP5C,
    is in tension with rollema2025 calling LB-100 itself weak - unresolved, and both are in the atlas.'
- parameter: 'THE EX VIVO CONCENTRATION THIS BRANCH NEEDS, AND WHAT HUMAN PLASMA MIGHT CARRY'
  value: '1 micromolar LB-100 had NO effect on the FGF block; 5 and 10 micromolar worked, with 5
    micromolar LB-100 equivalent to 10 micromolar cantharidin; bone elongation used 10 micromolar. The
    human plasma assay for LB-100 and endothall is validated over 2.5 to 500 ng/mL, which for endothall at
    186.16 g/mol is 13 nanomolar to 2.7 micromolar'
  unit: micromolar, and ng/mL
  conditions: 'shuhaibar2021 Figure 1F for the concentration-response in living newborn tibia with the
    cGi500 FRET sensor, and Figure 3C for the 10 micromolar elongation experiment; feng2023 for the
    validated human plasma calibration range.'
  species: mouse
  source_ref: shuhaibar2021
  uncertainty: 'THE COMPARISON IS AN INFERENCE AND IS GRADED AS ONE. A bioanalytical calibration range is
    chosen to bracket expected patient concentrations, it is NOT a measurement of them - feng2023 patient
    values sit behind a paywall and are logged for access. What can be said: the range brackets the
    endothall IC50 of 95 nanomolar, which is 17.7 ng/mL, so a clinically achievable plasma endothall
    concentration at or above the IC50 is PLAUSIBLE. What cannot be said is that it happens, or that
    cartilage sees it, or that inhibiting PPP enzymes everywhere at that level is survivable chronically -
    and fenton2023 is direct evidence on that last point that it is not.'
- parameter: 'THE HUMAN PP2A GENETICS - HEAD-DOMINANT OVERGROWTH WITH INTELLECTUAL DISABILITY, WHICH IS
    THE WRONG PATTERN FOR THIS BRANCH'
  value: 'five children with de novo missense in PPP2R5B, PPP2R5C or PPP2R5D: heights plus 2.3, minus 1.4,
    plus 2.0, plus 1.6 and plus 3.0 standard deviations against head circumferences plus 3.6, plus 3.8,
    plus 3.8, plus 3.3 and plus 0.3; median head circumference plus 3.6 SD; intellectual disability in all
    five'
  unit: standard deviations
  conditions: 'loveday2015, read in full. Trio exome sequencing of 111 overgrowth probands plus a
    152-proband singleton series; four de novo mutations in three related genes, enrichment p equals 1.43
    times ten to the minus ten; all mutations cluster in a nine-residue stretch of intra-repeat loop 2,
    the substrate-specificity loop, p equals 1.6 times ten to the minus five. The 2019 corrigendum was
    checked and corrects only a misspelled name in the supplement - no data change.'
  species: human
  source_ref: loveday2015
  uncertainty: 'THIS IS THE CITATION shuhaibar2021 REACHES FOR AND IT DOES NOT CARRY THE WEIGHT. Four
    problems. (1) ASCERTAINMENT - the authors state that increased height AND/OR head circumference is an
    entry criterion for the study, so the direction of the growth effect is partly built in. (2) THE
    PATTERN IS WRONG - head circumference dominates, one child is SHORT at minus 1.4 SD, and the branch
    this atlas is testing predicts the opposite dissociation, long bones up with the cranium untouched.
    (3) MECHANISM - the authors attribute the phenotype to loss of PP2A-B56 restraint on AKT, not to NPR2,
    and place it in the PI3K/AKT overgrowth family alongside PTEN and PIK3CA. (4) These are
    substrate-specificity-loop missense variants, so they predict LOSS of activity toward PARTICULAR
    substrates, and which substrates is unknown. IT DOES SUPPORT ONE THING: reduced PP2A-B56 substrate
    dephosphorylation in a human is compatible with growth, and with intellectual disability.'
- parameter: 'HOMOLOGOUS DESENSITISATION - THE GAP THIS NODE FLAGGED IS CLOSED, AND THE CLINICAL LIGAND
    DOES IT'
  value: 'CNP causes time-dependent dephosphorylation and desensitisation of NPR-B, with roughly half the
    receptor population completely dephosphorylated; and BMN-111 alone reduced NPR2 phosphorylation in
    primary chondrocytes independently of FGF'
  unit: qualitative, with a fraction
  conditions: 'potter1998 in NIH3T3 fibroblasts overexpressing NPR-B - tryptic phosphopeptide mapping
    after CNP exposure, with receptor degradation excluded by immunoblot and by manganese/Triton-activated
    cyclase activity; in vitro dephosphorylation of those membranes by PURIFIED PP2A correlated with loss
    of CNP-dependent but not manganese-dependent activity. shuhaibar2021 Figure 2, lanes 1 versus 5,
    Phos-tag gels of HA-tagged NPR2 in primary newborn rib chondrocytes.'
  species: mouse
  source_ref: potter1998
  uncertainty: 'THE DIRECTION CUTS BOTH WAYS AND THE EXPERIMENT THAT WOULD SETTLE IT HAS ALREADY BEEN RUN
    AND CAME OUT FLAT. If a sustained CNP analogue partly inactivates its own receptor, then adding a
    phosphatase inhibitor should be SYNERGISTIC with continuous ligand - and shuhaibar2021, six days of
    continuous BMN-111 plus LB-100, got ADDITIVITY (CORR-083). Either the desensitisation is too small to
    matter over six days, or the culture is not the right test. NOTE ALSO that potter1998 is an
    overexpressing fibroblast line, not cartilage, and that the shuhaibar2021 observation is one lane
    comparison the authors mention in passing rather than quantify as a main result.'
- parameter: 'NO IN VIVO BONE-LENGTH EXPERIMENT WITH ANY PHOSPHATASE INHIBITOR EXISTS IN ANY SPECIES'
  value: 'zero'
  unit: studies
  conditions: 'Europe PMC searched for LB-100 or LB100 crossed with bone, growth plate, femur or tibia,
    and separately for phosphatase inhibitor crossed with bone growth in vivo in mice; and endothall
    crossed with bone, cartilage or chondrocyte. The only skeletal hits are shuhaibar2021 and its 2020
    conference version, both EX VIVO - newborn tibia imaging, primary chondrocytes, and E16.5 femur and
    skull-base organ culture - plus wagner2021, which is a germline genotype and not a drug.'
  species: not_applicable
  source_ref: shuhaibar2021
  uncertainty: 'A SEARCH-BASED ABSENCE, so it is bounded by the search. But the absence is coherent with
    fenton2023: the reason nobody has an in vivo bone-length result may simply be that the compound is not
    tolerable for long enough in a growing animal to produce one. THE EXPERIMENT THAT WOULD DECIDE IT is
    cheap and has never been run - wild-type juvenile mice, LB-100 or endothall at 0.3 mg/kg or below, to
    skeletal maturity, femur length as the endpoint, with body weight as the toxicity control. 0.3 mg/kg
    is the only dose fenton2023 shows survivable, and it is also the dose that sedated wild-type mice.'
- parameter: 'WHAT THE AUTHORS OF THE TOOL PAPER SAY ABOUT USING IT IN CHILDREN'
  value: 'because LB-100 inhibits multiple PPP-family phosphatases and its safety for long-term use in
    children is unknown, the results are described as only a proof of principle'
  unit: qualitative
  conditions: 'shuhaibar2021 discussion, paraphrased. In the same passage they call for identification of
    the specific phosphatases that dephosphorylate NPR2 in chondrocytes and for development of more
    specific inhibitors, and they name the PPP2 regulatory-subunit height association as the clue to
    follow.'
  species: not_applicable
  source_ref: shuhaibar2021
  uncertainty: 'RECORDED BECAUSE IT MATCHES WHAT THIS ATLAS INDEPENDENTLY CONCLUDED, and because the atlas
    should not claim to have discovered a limitation the authors state themselves. The one thing this
    atlas now has that they did not is fenton2023 - published two years later, in a different field, and
    it converts unknown long-term paediatric safety into a specific lethal dose in juvenile animals.'
localization:
- 'the toxicity is systemic and unlocalised - PPP-family phosphatases are ubiquitous, the human
  dose-limiting toxicity is renal, the mouse signal is death and weight loss, and the wanted effect is in
  cartilage, which is the same shape of problem that killed the ligand arm'
human_evidence: indirect
human_evidence_note: 'The human material here is loveday2015 - five children, ascertained through an
  overgrowth study, head-dominant, with intellectual disability, and attributed by its authors to AKT -
  plus the chung2017 dose levels the mouse toxicology converts onto. Neither is a human test of NPR2
  phosphorylation. No human has ever had NPR2 phosphorylation state measured, in any tissue.'
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: 'The efficacy evidence is ex vivo mouse organ culture at a concentration whose
  active species was misidentified; the toxicity evidence is in vivo juvenile mouse and lands on the human
  dose-limiting dose. Efficacy and toxicity are therefore established in different systems, and the one
  in vivo system that could compare them - a growing animal dosed to skeletal maturity - has never been
  run.'
confidence: D
claim_grades:
- claim: The receptor-phosphorylation branch is a validated growth target with no deliverable molecule.
  grade: D
  basis: 'Rests on one T5 dissertation for the in vivo toxicology, one abstract for the prodrug chemistry,
    and a search-based absence for the missing experiment. Each is individually weak; they agree, which is
    why this is D rather than E, and none is a replicated human result, which is why it is not higher.'
- claim: LB-100 is a prodrug and the agent that produced the bone-growth result was endothall.
  grade: D
  basis: 'One paper (rollema2025), abstract only, and the inference to shuhaibar2021 is mine - the
    hydrolysis half-life of 3.2 to 4.9 hours at 37 degrees against a six-day culture is arithmetic, but no
    one has measured endothall in a bone culture. In tension with darcy2019.'
- claim: CNP dephosphorylates and desensitises its own receptor.
  grade: C
  basis: 'potter1998 in an overexpressing fibroblast line, corroborated in primary chondrocytes by a
    single lane comparison in shuhaibar2021 Figure 2 that the authors mention rather than quantify. Two
    systems, same direction, neither in human tissue.'
- claim: The human PP2A regulatory-subunit overgrowth genetics supports this branch.
  grade: X
  basis: 'Graded X because it is repeated as a supporting clue - shuhaibar2021 discussion cites it that
    way - and the primary data do not support it. loveday2015 is head-dominant, includes a child at minus
    1.4 SD height, is ascertainment-biased by design, and is attributed by its own authors to PI3K/AKT.'
