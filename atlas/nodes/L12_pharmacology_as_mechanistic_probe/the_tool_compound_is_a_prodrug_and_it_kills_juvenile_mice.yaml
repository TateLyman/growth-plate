id: the_tool_compound_is_a_prodrug_and_it_kills_juvenile_mice
name: THE TOOL COMPOUND IS A PRODRUG AND IT KILLS JUVENILE MICE - the receptor-phosphorylation branch
  survives as biology and fails as pharmacology, and here is every remaining question answered
aliases:
- what the escholarship pdf was
- LB-100 in vivo toxicology
- LB-100 is a prodrug of endothall
- is the phosphorylation branch closed
- fenton2023 dissertation
type: hypothesis
layer: L12
stub: false
summary: 'WHAT THE SUPPLIED DOCUMENT ACTUALLY IS. eScholarship qt5m79866n is a 202-page UC Davis doctoral
  dissertation in Pharmacology and Toxicology by Timothy Fenton, 2023, on preclinical models of
  NEURODEVELOPMENTAL DISORDERS. It is not a bone paper and it never mentions the growth plate. Chapter 2
  gave LB-100 to juvenile mice in an Angelman syndrome model - and that chapter is, as far as this atlas
  can establish, THE ONLY IN VIVO CHRONIC JUVENILE MAMMALIAN DOSING RECORD FOR THIS COMPOUND ANYWHERE.
  That is exactly the measurement round 133 said stood between this branch and a usable chronic exposure.
  THE ANSWER IS BAD AND IT IS SPECIFIC. A SINGLE dose of 3 mg/kg intraperitoneal was LETHAL TO ALL MICE of
  both genotypes, and dosing above 1 mg/kg was stopped on that finding. At 1 mg/kg every other day from
  postnatal day 14 to 30, FIVE OF TWELVE ANIMALS DIED before behaviour testing, one wild-type after two
  doses, and BODY WEIGHT WAS SIGNIFICANTLY REDUCED OVER THE DOSING PERIOD IN BOTH GENOTYPES. At 0.3 mg/kg,
  which everything survived, wild-type mice were SEDATED - horizontal, vertical and total activity all
  reduced against vehicle. So across the three doses tested in a growing mammal the compound is lethal,
  lethal-and-growth-suppressing, or sedating. There is no clean window.
  AND THE DOSE CONVERSION LANDS ON TOP OF THE HUMAN TRIAL. On the standard body-surface-area factor for
  mouse, 1 mg/kg is 3 mg per square metre. The human dose-limiting toxicity in chung2017 was at 3.1 mg per
  square metre and the recommended phase 2 dose is 2.33. The dose that killed 42 per cent of juvenile mice
  IS the human dose-limiting dose. The lethal single dose, 9 mg per square metre, is about 2.9 times it.
  Two independent species, two indications, one number.
  THEN THE MECHANISM OF THE TOOL ITSELF TURNED OUT TO BE WRONG IN THIS ATLAS. rollema2025 shows LB-100 IS
  A PRODRUG. It hydrolyses to ENDOTHALL, which is the actual phosphatase inhibitor at IC50 95 nanomolar,
  while LB-100 itself is weak - apparent IC50 12.2 micromolar, and even that is attributable to endothall
  formed in the assay. Half-life in cell culture medium at 37 degrees is 3.2 to 4.9 hours. shuhaibar2021
  cultured bones in LB-100 for SIX DAYS at 37 degrees. THE AGENT THAT PRODUCED THE BONE-GROWTH RESULT WAS
  THEREFORE ENDOTHALL, NOT LB-100 - see CORR-127. This does not weaken the biology, it renames the
  compound, and it changes what the atlas should be looking for.
  THE HUMAN GENETIC CLUE shuhaibar2021 POINTS AT DOES NOT SUPPORT THIS BRANCH. Their discussion invokes
  increased height in children with PP2A regulatory subunit mutations. That is loveday2015, and reading it
  rather than the citation to it: five children, de novo missense in the PP2A-B56 substrate-specificity
  loop, MEDIAN HEAD CIRCUMFERENCE PLUS 3.6 STANDARD DEVIATIONS and heights of plus 2.3, minus 1.4, plus
  2.0, plus 1.6 and plus 3.0 - head-dominant overgrowth, one child SHORT, ALL FIVE with intellectual
  disability, ascertained through an overgrowth study that requires tall stature or a large head for
  entry, and mechanistically attributed by its own authors to PI3K/AKT. Contrast the pattern this branch
  predicts, which is shuhaibar2017 7E: long bones and body length up about 8 per cent with CRANIAL WIDTH
  UNCHANGED. The human PP2A genetics phenocopies the wrong half.
  ONE GAP CLOSED IN THE RIGHT DIRECTION, AND IT WAS SITTING INSIDE A PAPER THIS ATLAS HAD ALREADY READ.
  The node asked whether CNP drives dephosphorylation of its own receptor. YES. potter1998 named
  dephosphorylation as the desensitisation mechanism for NPR-B under CNP, and shuhaibar2021 Figure 2 shows
  BMN-111 - vosoritide - itself reducing NPR2 phosphorylation in primary chondrocytes independently of
  FGF. The clinical CNP analogue partially switches off its own receptor. That is a real argument for
  pairing receptor-phosphorylation support with a sustained-release ligand, and it is undercut by the fact
  that shuhaibar2021 got ADDITIVITY rather than synergy from exactly that pairing.
  AND THEN THE TWO PAYWALLED PAPERS ARRIVED AND THE EXPOSURE QUESTION CLOSED - NEGATIVE. chung2017 Table
  3 measures plasma ENDOTHALL at the human maximum tolerated dose: 11.5 and 34.3 ng/mL in one patient on
  days 1 and 3, 14.8 in a second, below the 5 ng/mL limit in a third. At 186.16 g/mol that is 62 to 184
  NANOMOLAR - straddling the 95 nanomolar PP2A IC50, so about half-maximal target inhibition at the
  most a human can tolerate. Now compare what the bone needed: 10 micromolar LB-100, which on complete
  hydrolysis is up to 10 micromolar endothall, FIFTY-FOUR TO A HUNDRED AND SIXTY TIMES the human numbers -
  and the concentration that DID NOTHING to the FGF block, 1 micromolar, is STILL 5 TO 16 TIMES ABOVE
  ANYTHING MEASURED IN A DOSED HUMAN. feng2023 corroborates at a lower dose and adds that endothall is
  still rising at the last sample and is detectable pre-dose on day 3, so the true peak is higher than
  these numbers and accumulates - which narrows the gap but does not remotely close it.
  AND THE CEILING LOOKS LIKE A CLASS EFFECT - VERIFIED AGAINST THE SECOND COMPOUND RATHER THAN TAKEN ON
  TRUST. chung2017 calls the renal dose-limiting toxicity IDENTICAL to that of fostriecin, a structurally
  unrelated PP2A inhibitor, and rat and dog show renal tubular damage at the LOWEST doses tested. Reading
  the fostriecin phase 1 itself (le2004) rather than the citing sentence: creatinine elevation IS
  dose-limiting there too, so the class effect is real - but the two are not identical, because
  fostriecin also limits on bilirubin, transaminases, lethargy and HYPOTENSION. That last one is the exact
  failure mode this branch hoped to escape by working on the receptor instead of the ligand.
  AND THEN THE ONE FINDING THAT CUTS THE OTHER WAY, WHICH IS THE MOST USEFUL THING IN THE ROUND.
  martiniova2011 gave the same compound - the paper states LB1 and LB-100 are the same - by CONTINUOUS
  intraperitoneal osmotic-pump infusion at 1.5 mg/kg/day for 14 days in adult mice, with NO apparent
  toxicity and no weight loss. That is THREE TIMES the daily dose of the bolus regimen that killed 42 per
  cent of juvenile mice. Cumulative exposure therefore cannot be what kills - PEAK CONCENTRATION IS. And
  the bone effect needed SUSTAINED exposure over six days, not peaks. So the honest reading is not that
  the pharmacology is impossible but that BOLUS DOSING IS THE WRONG FORMAT, and nobody has tested a
  continuous format in a juvenile animal with a bone endpoint.
  WHERE THIS LEAVES THE BRANCH. The biology is unchanged and still the strongest thing on the CNP axis:
  7E lengthens wild-type bone 4.3 to 8.8 per cent with the cranium spared, two human activating NPR2
  regions exist, and FGF inhibition of the receptor is NOT surmountable by more ligand. The pharmacology
  is now worse than it looked, on six counts - no in vivo bone-length experiment with any phosphatase
  inhibitor exists in any species, the only in vivo juvenile dosing record is lethal at the human
  dose-limiting dose, the active agent is a herbicide-class dicarboxylic acid rather than the branded
  compound, the one human genetic anchor points at AKT and at the skull, THE ACHIEVABLE HUMAN EXPOSURE IS
  ONE TO TWO ORDERS OF MAGNITUDE BELOW THE CONCENTRATION THAT MOVES A BONE, and the dose-limiting toxicity
  appears to be a class effect of PP2A inhibition rather than of this molecule. THE BRANCH IS NOT DEAD -
  IT IS A TARGET WITHOUT A DELIVERABLE MOLECULE, and after this round it is a target whose only known
  chemotype is separated from usefulness by a factor of fifty on concentration and by a lethal dose in
  growing animals. That is a different failure from the ligand arm, where the molecules exist and the
  mechanism ran out.
  AND ONE MORE THING THE ROUND TURNED UP, WHICH CHANGES WHAT COMPOUND WE SHOULD BE TALKING ABOUT. Because
  endothall is a REGISTERED HERBICIDE it already has a full chronic mammalian toxicology package
  (epa_endothall_red_2005): chronic reference dose 0.007 mg/kg/day, chronic LOAEL 2 mg/kg/day, NOT LIKELY
  TO BE CARCINOGENIC, no mutagenicity, no neurotoxicity, no developmental toxicity, no bioaccumulation.
  The chronic ceiling is set by PROLIFERATIVE GASTRIC LESIONS FROM ORAL DOSING and by portal-of-entry
  irritation - a local effect that a parenteral or sustained-release route bypasses entirely. Meanwhile
  feng2023 shows circulating endothall running about tenfold below circulating LB-100 on a molar basis, so
  the prodrug is an inefficient delivery vehicle for its own active species. THE UNEXPLORED COMPOUND IS
  THEREFORE ENDOTHALL ITSELF, GIVEN CONTINUOUSLY AND NOT ORALLY - and nobody has ever done that, for bone
  or for anything else. THE ONE ENDPOINT IN THAT DOSSIER THAT TOUCHES GROWTH POINTS THE WRONG WAY:
  decreased pup body weight at 60 mg/kg/day, NOAEL 9.41, with no bone measurement anywhere.
  THE THREE THINGS THAT WOULD REOPEN IT, IN ORDER OF HOW CHEAP THEY ARE. (1) CONTINUOUS DELIVERY IN A
  JUVENILE ANIMAL WITH A BONE ENDPOINT - martiniova2011 shows the format is tolerable at three times the
  lethal bolus daily dose in adults, and it has never been tried in a growing animal or scored on a
  femur. This is one minipump study. (2) MEASURE ENDOTHALL IN CARTILAGE - the entire fifty-fold argument
  compares human PLASMA against culture MEDIUM, and chung2017 own data suggest tissue engagement outlasts
  plasma. (3) A SUBUNIT-SELECTIVE OR CARTILAGE-RESTRICTED INHIBITOR that separates the NPR2 substrate
  from the renal one - which is g_l2d_004, still unanswered, and now with a stronger reason to answer it.
  AND THE COMPOUND TO PUT IN THE PUMP IS PROBABLY ENDOTHALL, NOT LB-100.'
quantitative:
- parameter: 'IN VIVO LETHALITY OF LB-100 IN JUVENILE MICE - THE MEASUREMENT ROUND 133 ASKED FOR'
  value: '3 mg/kg single dose lethal to all animals of both genotypes; at 1 mg/kg every other day, 5 of 12
    died before behaviour testing and one wild-type died after 2 doses; 0.3 mg/kg survived by all'
  unit: mg/kg intraperitoneal, and deaths per group
  conditions: 'fenton2023 Chapter 2, Figure 15B and the accompanying text. B6.129S7-Ube3a-tm1Alb/J
    maternal-deletion mice and wild-type littermates, both sexes, LB-100 supplied by Lixte Biotechnology
    and dissolved in monosodium glutamate, injected intraperitoneally EVERY OTHER DAY from postnatal day
    14 to postnatal day 30 - nine doses over seventeen days. Group sizes in Figure 15A: wild-type vehicle
    10, wild-type 0.3 mg/kg 14, wild-type 1 mg/kg 11, mutant vehicle 10, mutant 0.3 mg/kg 12, mutant 1
    mg/kg 12. Dosing above 1 mg/kg was ceased after the 3 mg/kg deaths, on the advice of the chemist who
    synthesised the compound.'
  species: mouse
  source_ref: fenton2023
  uncertainty: 'THIS IS A T5 SOURCE - AN UNPUBLISHED DISSERTATION CHAPTER, AND THE ATLAS CHECKED: the
    paxilline/LB-100 chapter has NOT appeared as a peer-reviewed paper, only the lovastatin chapter has
    (Fenton 2025). So the single most decisive negative datum on this branch rests on one thesis, n
    around 12 per group, in a disease model on a mixed background, with no necropsy and no stated cause of
    death. IT IS ALSO NOT A BONE STUDY - nobody measured a femur. It is nevertheless the ONLY in vivo
    chronic juvenile dosing record this atlas can find for the compound, and a 42 per cent kill rate is
    not a subtle finding that needs replication to be taken seriously.'
- parameter: 'THE MOUSE TOXIC DOSE CONVERTED TO BODY SURFACE AREA LANDS ON THE HUMAN DOSE-LIMITING DOSE'
  value: 'mouse 0.3 / 1 / 3 mg/kg equals 0.9 / 3 / 9 mg per square metre; human dose-limiting toxicity 3.1
    and recommended phase 2 dose 2.33 mg per square metre'
  unit: mg per square metre
  conditions: 'DERIVED, not measured. Mouse km factor 3, the standard interspecies body-surface-area
    conversion, applied to the fenton2023 doses and compared against the chung2017 phase 1 doses already
    in this atlas. The single lethal mouse dose is about 2.9 times the human dose-limiting dose; the mouse
    dose that killed 5 of 12 equals it; the only mouse dose everything survived is about 0.39 times the
    human recommended phase 2 dose.'
  species: not_applicable
  source_ref: fenton2023
  uncertainty: 'FOUR REASONS THIS COMPARISON IS SOFTER THAN IT LOOKS, AND ONE REASON IT IS HARDER. Softer:
    intraperitoneal in mouse against intravenous in human; juvenile against adult; km scaling is an
    allometric convention for equivalent exposure, not a measurement; and the SCHEDULES DIFFER SHARPLY -
    nine mouse doses in seventeen days against three human doses in twenty-one, so the mouse cumulative
    intensity is roughly threefold higher and the 1 mg/kg deaths may be cumulative rather than acute.
    HARDER: the 3 mg/kg death was after a SINGLE dose, where no cumulative argument applies, and it sits
    under threefold above a dose humans already fail to tolerate.'
- parameter: 'LB-100 IS A PRODRUG - THE ACTIVE PHOSPHATASE INHIBITOR IS ENDOTHALL'
  value: 'endothall PP2A IC50 95 nanomolar; LB-100 apparent IC50 12.2 micromolar from a room-temperature
    DMSO stock and 0.59 micromolar from a stock heated to 65 degrees, the twenty-fold shift tracking
    endothall content; hydrolysis half-life 3.2 hours in cell culture medium at pH 6.8 and 4.9 hours at pH
    7.4, both at 37 degrees'
  unit: IC50 in nanomolar and micromolar, half-life in hours
  conditions: 'rollema2025, abstract read in full. LB-100 is an amide, stable at pH at or above 10.5, that
    hydrolyses to endothall and N-methylpiperazine. The authors conclude that the inhibition measured in
    LB-100 assays is mainly due to endothall and that LB-100 is a prodrug acting through it. Endothall was
    already known to be present in patient plasma after intravenous LB-100 (feng2023 built a validated
    LC-MS/MS assay for both analytes).'
  species: not_applicable
  source_ref: rollema2025
  uncertainty: 'THE CONSEQUENCE FOR THIS ATLAS IS CORR-127 AND IT IS NOT COSMETIC. shuhaibar2021 incubated
    E16.5 femurs in LB-100 at 37 degrees FOR SIX DAYS - roughly thirty hydrolysis half-lives - so the
    species present for almost the whole experiment was endothall. Two further consequences. (1) The
    tenfold gap between the 1 micromolar LB-100 that did nothing and the 5 to 10 micromolar that worked is
    a gap in PRODRUG loading, not in inhibitor potency, and the actual active concentration is unknown.
    (2) darcy2019, which this atlas cites for LB-100 being a catalytic inhibitor of PPP2CA and PPP5C,
    is in tension with rollema2025 calling LB-100 itself weak - unresolved, and both are in the atlas.'
- parameter: 'MEASURED HUMAN PLASMA ENDOTHALL AT THE MAXIMUM TOLERATED DOSE - THE NUMBER THIS BRANCH
    TURNED ON, NOW READ RATHER THAN INFERRED'
  value: 'endothall Cmax 11.5 and 34.3 ng/mL (day 1 and day 3, one patient) and 14.8 ng/mL (day 1, a
    second patient), Tmax 4 hours in every case, AUC 22, 143 and 28 ng.h/mL; a third patient was below the
    5 ng/mL limit of quantification throughout. At 186.16 g/mol that is 62, 184 and 80 NANOMOLAR'
  unit: ng/mL and nanomolar
  conditions: 'chung2017 Table 3, read from the full paper. Dose 2.33 mg per square metre, the MTD,
    given as a 2-hour infusion; sampling before and over 4 hours after the end of infusion. LB-100 itself
    had a half-life of 0.95 to 1.58 hours with low clearance and low volume of distribution. Corroborated
    at a lower dose by feng2023 Figure 4 - one patient at 1.25 mg per square metre by 15-minute infusion,
    endothall reaching about 8.5 ng/mL on day 1 and about 13 ng/mL on day 3, read off the plotted profile.'
  species: human
  source_ref: chung2017
  uncertainty: 'TWO QUALIFIERS, BOTH IN THE SAME DIRECTION, AND THEY MATTER. (1) IN EVERY PATIENT IN BOTH
    TRIALS THE ENDOTHALL MAXIMUM WAS AT THE LAST SAMPLING POINT - so these are LOWER BOUNDS on Cmax, not
    peaks; both papers say the elimination half-life could not be determined and feng2023 recommends
    extending the sampling window. (2) ENDOTHALL ACCUMULATES - feng2023 detected it pre-dose on day 3, and
    chung2017 day 3 is threefold day 1 in the same patient. The true steady-state peak on a daily schedule
    is therefore unmeasured and higher than any number here. Also: total, not free, concentration, with
    protein binding unreported; n = 3 and n = 1.'
- parameter: 'THE GAP BETWEEN WHAT WORKS ON BONE AND WHAT A HUMAN CARRIES - ONE TO TWO ORDERS OF MAGNITUDE'
  value: '1 micromolar LB-100 had NO effect on the FGF block, 5 and 10 micromolar did, and the elongation
    experiment used 10 micromolar. Complete hydrolysis of a 10 micromolar LB-100 load yields up to 10
    micromolar endothall, which is 1862 ng/mL - about 54 times the highest endothall concentration ever
    measured in a dosed human and about 162 times the day-1 value. EVEN THE DOSE THAT FAILED, 1
    micromolar, is 186 ng/mL, still 5 to 16 times above measured human plasma'
  unit: fold difference
  conditions: 'DERIVED. shuhaibar2021 Figure 1F concentration-response in living newborn tibia and Figure
    3C for the six-day E16.5 femur elongation, both with LB-100 added to the medium at 37 degrees;
    rollema2025 for hydrolysis to endothall with a 3.2 to 4.9 hour half-life at 37 degrees, so a six-day
    culture is roughly thirty half-lives and the load converts essentially completely; endothall molar
    mass 186.16 from C8H10O5; chung2017 Table 3 for the human concentrations. LB-100 molar mass 268.3 is
    confirmed independently by the feng2023 mass-spectrometry parent ion at m/z 269.2 for the protonated
    molecule. On the LB-100 side the same gap appears - the feng2023 patient peaked near 190 ng/mL, which
    is about 0.71 micromolar, against 5 to 10 micromolar applied ex vivo.'
  species: not_applicable
  source_ref: shuhaibar2021
  uncertainty: 'THREE THINGS COULD NARROW THIS GAP AND NONE OF THEM CLOSES IT ON PRESENT EVIDENCE. (1)
    TISSUE IS NOT PLASMA - chung2017 argues explicitly that maximum PP2A inhibition in xenografts occurs 2
    to 4 hours after a single injection and full recovery takes at least 24 hours despite a 1 to 2 hour
    plasma half-life, implying the drug persists at the target longer and at higher concentration than in
    blood. That is a real argument and it is why this row is a comparison of plasma against medium, not of
    cartilage against cartilage - nobody has ever measured endothall in cartilage. (2) The six-day culture
    medium-refresh schedule is not stated in shuhaibar2021, which cites an earlier protocol, so cumulative
    exposure ex vivo could be higher still - that widens the gap rather than narrowing it. (3) True human
    Cmax is unmeasured and accumulates. AGAINST ALL THREE: the exposure that FAILED ex vivo is already
    above the human measurement, and the human schedule is three days in twenty-one against six days
    continuous.'
- parameter: 'THE RENAL DOSE-LIMITING TOXICITY IS A CLASS EFFECT OF PP2A INHIBITION, NOT A PROPERTY OF
    THIS MOLECULE'
  value: 'LB-100 dose-limiting toxicity is reversible rises in serum creatinine, described as IDENTICAL to
    that encountered in the phase 1 trials of fostriecin, a structurally unrelated PP2A inhibitor; and in
    rat and dog the LOWEST doses tested, about 4.5 and 6.0 mg per square metre intravenously for 5 days,
    already produced microscopic haematuria and renal tubular histological changes'
  unit: mg per square metre, and qualitative
  conditions: 'chung2017 discussion and its citation of the fostriecin phase 1 and of de Jong and
    colleagues, who attributed the fostriecin creatinine rise to reversible haemodynamic changes in the
    kidney compatible with renal tubular damage. Dose levels tested in humans were 0.25, 0.50, 0.83, 1.25,
    1.75, 2.33 and 3.1 mg per square metre; 2 of 4 patients at 3.1 had grade 3 rises in calculated
    creatinine clearance in cycle 1.'
  species: human
  source_ref: chung2017
  uncertainty: 'THIS IS THE MOST STRATEGICALLY IMPORTANT LINE IN THE WHOLE ROUND AND IT IS AN INFERENCE
    FROM TWO COMPOUNDS. If renal tubular toxicity tracks PP2A inhibition itself rather than LB-100
    chemistry, then finding a better PPP inhibitor does not lift the ceiling - the ceiling moves with the
    pharmacology. Two compounds is thin evidence for a class effect, and fostriecin and LB-100 do share a
    target so the shared toxicity is unsurprising either way. WHAT WOULD DECIDE IT: a subunit-selective or
    substrate-selective inhibitor with the same target engagement and a different renal profile. None
    exists (g_l2d_004). NOTE ALSO the animal renal changes appear at 4.5 to 6.0 mg per square metre, which
    is between the human MTD of 2.33 and the mouse single lethal dose of 9.'
- parameter: 'THE TOXICITY IS PEAK-DRIVEN, NOT DOSE-DRIVEN - A HIGHER DAILY DOSE GIVEN CONTINUOUSLY WAS
    TOLERATED WHILE A LOWER ONE GIVEN AS A BOLUS KILLED'
  value: 'LB1, stated in the paper to be the same compound as LB-100, given by CONTINUOUS intraperitoneal
    osmotic-pump infusion at 1.5 mg/kg/day for 14 days - no apparent drug toxicity and no significant
    weight loss on any arm. Against fenton2023: 1 mg/kg as an intraperitoneal BOLUS every other day, an
    average of 0.5 mg/kg/day, killed 5 of 12 juvenile mice and cut body weight'
  unit: mg/kg per day, continuous versus bolus
  conditions: 'martiniova2011, Alzet model 1002 minipump implanted intraperitoneally, 100 microlitres of
    LB1 at 0.03 mg/day, mean flow 0.25 microlitres/hour over 14 days, in adult athymic nude mice bearing
    hepatic pheochromocytoma metastases. Animals weighed weekly and monitored daily. The paper states
    explicitly that LB1 is also designated LB-100 and was provided by Lixte.'
  species: mouse
  source_ref: martiniova2011
  uncertainty: 'THIS IS THE MOST CONSTRUCTIVE FINDING OF THE ROUND AND IT NEEDS ITS CONFOUNDS STATED. The
    two studies differ in FOUR ways at once - route pattern (continuous versus bolus), age (adult versus
    postnatal day 14 to 30), strain and immune status (athymic nude tumour-bearing versus immunocompetent
    Ube3a littermates), and endpoint rigour (observation and weekly weights versus a survival curve). Any
    of the four could explain the difference. BUT THE DOSE ARITHMETIC POINTS AT THE FIRST ONE: the
    tolerated continuous regimen delivers THREE TIMES the daily dose of the lethal bolus regimen, so the
    difference cannot be cumulative exposure and is most simply explained by peak concentration. IF THAT
    IS RIGHT IT IS DIRECTIONAL FOR THIS BRANCH, because the bone effect needed SUSTAINED exposure over
    six days, not peaks - which is exactly what an infusion delivers and a bolus does not. WHAT IT DOES
    NOT SHOW: that continuous infusion reaches the 1 to 10 micromolar range, or that a juvenile animal
    tolerates it, or that anything happens to a bone. No necropsy or renal histology is reported.'
- parameter: 'THE ACTIVE SPECIES HAS A FULL CHRONIC MAMMALIAN TOXICOLOGY PACKAGE ALREADY, BECAUSE IT IS A
    REGISTERED HERBICIDE - AND IT IS FAR MORE BENIGN CHRONICALLY THAN THE PRODRUG IS ACUTELY'
  value: 'chronic reference dose 0.007 mg/kg/day; chronic dietary LOAEL 2 mg/kg/day in males and 2.3 in
    females for PROLIFERATIVE LESIONS OF THE GASTRIC EPITHELIUM, with no NOAEL established for that
    endpoint (estimated 0.7 mg/kg by a threefold extrapolation); offspring NOAEL 9.41 mg/kg/day against a
    LOAEL of 60 mg/kg/day for DECREASED PUP BODY WEIGHT in both sexes on day 0 of the F1 and F2
    generations. Classified NOT LIKELY TO BE CARCINOGENIC TO HUMANS, no mutagenic potential, not a
    neurotoxicant, does not induce developmental toxicity, does not bioaccumulate'
  unit: mg/kg/day
  conditions: 'epa_endothall_red_2005, EPA 738-R-05-008, September 2005, Table 2 of the human health risk
    assessment. All the systemic endpoints derive from ONE study, the two-generation oral rat reproduction
    study MRID 43152101. Endothall is Toxicity Category I by the oral and ocular routes and a skin
    sensitiser; in the 21-day dermal study severe LOCAL effects and inhibited body weight gain appeared at
    the lowest dose tested, 30 mg/kg/day, and EPA declined to set a dermal systemic endpoint on the
    grounds that the compound is so toxic at the portals of entry as to be self-limiting. Data gaps: the
    28-day inhalation and the rabbit developmental studies.'
  species: rat
  source_ref: epa_endothall_red_2005
  uncertainty: 'THE SHAPE OF THIS DOSSIER MATTERS AS MUCH AS THE NUMBERS. The chronic ceiling is set by a
    LOCAL GASTRIC lesion from ORAL dosing and by portal-of-entry irritation, not by a systemic organ
    toxicity - which is exactly the kind of ceiling a parenteral or sustained-release route bypasses. And
    the systemic reassurances are unusually broad for a compound this atlas had been treating as an
    unknown: no carcinogenicity, no mutagenicity, no neurotoxicity, no developmental toxicity, no
    bioaccumulation, all on a chemical with decades of registered use. AGAINST THAT: (1) THE ONLY
    GROWTH-RELATED ENDPOINT IN THE ENTIRE DOSSIER POINTS THE WRONG WAY - decreased pup body weight at 60
    mg/kg/day, with no bone or length measurement anywhere; nothing here hints at a growth-promoting
    effect at any dose. (2) Everything systemic rests on a single study. (3) A regulatory summary is not a
    primary report - the underlying MRIDs are unpublished industry studies this atlas has not read, and
    the row is T2 accordingly. (4) None of it speaks to the route or the concentration this branch needs.'
- parameter: 'THE PRODRUG DELIVERS ONLY A SMALL FRACTION OF ITSELF AS THE ACTIVE SPECIES'
  value: 'at 1.25 mg/m2, plasma LB-100 peaks near 190 ng/mL, which is about 0.71 micromolar, while
    endothall peaks at about 8.5 to 13 ng/mL, which is 46 to 70 nanomolar - roughly a tenfold lower molar
    concentration, and the two peaks occur at different times'
  unit: molar ratio at peak
  conditions: 'feng2023 Figure 4, read off the plotted profile - LB-100 by 15-minute infusion on days 1
    and 3, endothall rising slowly and still rising at the last sample. LB-100 molar mass 268.3 from the
    feng2023 mass-spectrometry parent ion at m/z 269.2; endothall 186.16 from C8H10O5.'
  species: human
  source_ref: feng2023
  uncertainty: 'A PEAK RATIO IS NOT A CONVERSION FRACTION and this row must not be read as one - endothall
    peaks four hours after LB-100 does and has not finished rising, so the fractional conversion is
    UNMEASURED. What the row supports is weaker and still useful: most of a dose of LB-100 is not
    circulating as endothall at any moment. THE IMPLICATION, GRADED E AND FLAGGED AS INFERENCE, is that
    dosing the prodrug is an inefficient way to deliver the active species, and that DOSING ENDOTHALL
    DIRECTLY - by a route that avoids the gastric endpoint that sets its chronic ceiling - is the obvious
    unexplored option. Nobody has done it, for bone or for anything else.'
- parameter: 'THE SECOND PP2A INHIBITOR IN HUMANS - THE RENAL TOXICITY REPLICATES, AND HYPOTENSION IS A
    DOSE-LIMITING TOXICITY'
  value: 'fostriecin phase 1, 46 patients over 2 to 47 mg/m2 daily for 5 days: dose-limiting toxicities
    were elevation of creatinine, bilirubin and hepatic transaminases, plus nausea, anorexia, lethargy
