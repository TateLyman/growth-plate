id: round267_dynasore_is_mtorc1_again_and_the_cnp_second_arm_survives
name: >-
  ROUND 267 - both full texts read. DYNASORE IS NOT A NEW NODE - it blocks lysosomal v-ATPase, blocks
  autophagy and activates mTORC1, grows bone WHILE REDUCING PROLIFERATION, and the authors state the gain
  is likely transient. Sixth instance of the pattern, from newton2018's own laboratory. And hirota2022
  SURVIVES - H89 blocks CNP's growth effect specifically in the hypertrophic zone - but it also REFUTES the
  PDE3 bridge I speculated
aliases:
- round 267
- dynasore is mTORC1
- the CNP second arm confirmed
- PDE3 is not the bridge
type: hypothesis
layer: L12
stub: false
summary: >-
  TWO FULL TEXTS SUPPLIED, BOTH TOP ASKS, AND THEY MOVE IN OPPOSITE DIRECTIONS. The new node collapses into
  an old one; the arm holding vosoritide in the stack survives verification and takes one of my own
  speculations with it.

  ONE - DYNASORE IS NOT A DYNAMIN RESULT AND IT IS NOT A NEW NODE. Round 266 filed it as the first genuinely
  new control point of the session, on the strength of an abstract. The full text says otherwise in its own
  words: dynasore "may alter other processes in a DYNAMIN-INDEPENDENT manner, including cholesterol
  homeostasis, lipid raft integrity, LYSOSOMAL INHIBITION and actin remodeling". The mechanism the paper
  actually lands on is lysosomal: 40 micromolar dynasore BLOCKED AUTOPHAGY (SQSTM1 accumulation) and
  ACTIVATED mTORC1 (phospho-RPS6) in epiphyseal cartilage, and the paper's POSITIVE CONTROL throughout is
  BAFILOMYCIN, a v-ATPase inhibitor that does the same thing. The authors state dynasore blocks lysosomal
  v-ATPase too. SO THE CONTROL POINT IS AUTOPHAGY AND mTORC1, WHICH THIS ATLAS ALREADY HOLDS, and the
  trafficking framing that made it look orthogonal to the collision matrix does not survive its own methods
  section.
  AND THE GROWTH IS THE WRONG KIND, MEASURED. "Histological analysis demonstrated that low dose dynasore
  augmented epiphyseal cartilage expansion and matrix accumulation, WHILE REDUCING CHONDROCYTE
  PROLIFERATION." EdU incorporation was MARKEDLY REDUCED at the growth-promoting dose. Bone got longer
  while fewer cells divided - which is matrix, not cell production. The authors distinguish their own
  compound from their control on exactly this point: bafilomycin promotes elongation by promoting
  HYPERTROPHY, while dynasore "stimulates longitudinal growth WITHOUT promoting hypertrophy... caused by an
  accumulation of ECM in the extracellular space".
  AND THEY SAY IT IS TRANSIENT, THEMSELVES, IN THE DISCUSSION: "this increase in length is LIKELY
  TRANSIENT, as a sustained reduction in proliferation rate and ECM accumulation would be unlikely to
  support continued bone elongation over longer timeframes."
  THE AUTHOR LIST CLOSES IT. NEWTON IS AN AUTHOR - the same laboratory as newton2018 and newton2019. So
  this is the SAME GROUP reaching mTORC1 activation by a different route and getting the SAME SIGNATURE:
  a transient ex vivo elongation in a metatarsal, without a proliferation gain, that the authors do not
  expect to persist. THAT IS THE SIXTH INSTANCE of the pattern round 264 catalogued, and it is the second
  one to run through mTORC1.
  IT ALSO RETRO-CONFIRMS ROUND 253. That round asked what newton2018's one-off 79 micrometre burst actually
  was and listed three possibilities: matrix swelling, a transient synthetic burst, or a real self-limiting
  rate change. Here the same laboratory, with a different mTORC1-activating perturbation, reports
  elongation driven by ECM ACCUMULATION IN THE EXTRACELLULAR SPACE with reduced proliferation and an
  explicit expectation of transience. The matrix answer is now the supported one.

  TWO - HIROTA2022 SURVIVES VERIFICATION, AND THE NECESSITY TEST IS ZONE-SPECIFIC RATHER THAN GLOBAL, WHICH
  MAKES IT STRONGER. Rounds 263 and 265 leaned on this paper as one of three legs holding vosoritide in the
  stack, and round 266 flagged that I had not read it. Read in full: FRET biosensors for cGMP and PKA in
  ATDC5 cells show CNP activates the cAMP/PKA pathway and that PKA activation is ENHANCED as the cells
  differentiate. Live imaging of the fetal growth plate in PKAchu FRET-reporter mice shows CNP
  PREDOMINANTLY ACTIVATES PKA IN HYPERTROPHIC CHONDROCYTES. And the necessity test: "CNP increased the
  length of the growth plate, but coadministration of a PKA inhibitor, H89, inhibited the growth-promoting
  effect of CNP ONLY IN THE HYPERTROPHIC ZONE." In the non-hypertrophic zone H89's attenuation of PKA did
  NOT reach statistical significance; IN THE HYPERTROPHIC ZONE IT DID.
  THE AUTHORS' OWN HEDGE IS RECORDED: CNP promotes growth plate elongation "AT LEAST PARTIALLY through PKA
  activation". Partial, not total. But the zone specificity is the useful part - it is precisely the
  compartment erdafitinib does not act in, and it is h_term, the term round 264 counted as among the worst
  covered.
  ONE STRUCTURAL ODDITY WORTH FLAGGING. CNP and its receptor GC-B "are predominantly expressed in
  PROLIFERATIVE and PREHYPERTROPHIC chondrocytes", yet the PKA effect lands PREDOMINANTLY IN HYPERTROPHIC
  ones. Receptor and effect are in different compartments, which the paper does not resolve.

  THREE - AND IT REFUTES A SPECULATION OF MINE, WHICH IS THE MOST USEFUL THING IN IT. Round 262 proposed
  that because PDE3 is dual-specificity - cGMP competitively inhibiting cAMP hydrolysis - a PDE3 inhibitor
  such as cilostazol should raise cAMP as well as cGMP, making the CNP-arm partner also a PTH1R-arm
  amplifier. I graded it D and wrote that nobody had looked. SOMEBODY HAD. hirota2022 tested it directly:
  "PDE 3 inhibitor cilostamide DID NOT APPARENTLY CHANGE the CNP-induced cGMP elevation and PKA activation",
  and they conclude "PTHrP/PTH1R signaling and PDE 3 inhibition were NOT INVOLVED in the mechanism of
  CNP-induced PKA activation during chondrogenic differentiation."
  SO THE cGMP-TO-cAMP BRIDGE IN CHONDROCYTES IS NOT PDE3, EVEN THOUGH IT IS PDE3 IN HEART AND GUT - the
  paper cites both of those literatures and then shows the cartilage cell does not use that route. The
  mechanism in chondrocytes is left unidentified; the paper's other experiments point at calcium
  (BAPTA-sensitive) and adenylate cyclase regulation rather than phosphodiesterase.
  WHAT THAT CHANGES. Cilostazol is more likely to be a PURE cGMP-arm agent in cartilage than round 262
  allowed, which makes it MORE redundant with vosoritide rather than less, and removes the one argument
  that made it look like a two-arm agent. Round 263's conclusion - cilostazol and vosoritide are the same
  node - is strengthened, and for an additional reason.
quantitative:
- parameter: >-
    DYNASORE - GROWTH WITH REDUCED PROLIFERATION, BY ECM ACCUMULATION, AND THE AUTHORS EXPECT IT TO BE
    TRANSIENT
  value: >-
    40 micromolar increased longitudinal growth and epiphyseal cartilage length with augmented matrix
    accumulation WHILE REDUCING chondrocyte proliferation (markedly reduced EdU incorporation); 220
    micromolar impaired growth and abolished proliferation. Doses tested: 40, 80, 160, 220 micromolar
  unit: bone length and EdU incorporation, ex vivo
  conditions: >-
    marchanalvarez2026, BMC Biology 24:169, read in full. Metatarsals from three-day-old mice, cultured 6
    days in DMEM/F-12 with beta-glycerophosphate, ascorbate and 0.2 per cent BSA; n = 5 bones per condition
    (3 for bafilomycin, hypertrophic cell height and relative ECM/area); N = 4 animals, 12 bones for the
    bafilomycin comparison. Bafilomycin, a v-ATPase inhibitor, was the POSITIVE CONTROL. 40 micromolar
    dynasore blocked autophagy (SQSTM1 accumulation), activated mTORC1 (phospho-RPS6) and preserved
    collagen X. The authors state dynasore also blocks lysosomal v-ATPase and acts dynamin-independently on
    cholesterol homeostasis, lipid rafts and actin.
  species: mouse
  source_ref: marchanalvarez2026
  uncertainty: >-
    THE AUTHORS' OWN DISCUSSION IS THE STRONGEST CAVEAT AND IT IS QUOTED RATHER THAN PARAPHRASED: "this
    increase in length is LIKELY TRANSIENT, as a sustained reduction in proliferation rate and ECM
    accumulation would be unlikely to support continued bone elongation over longer timeframes." Ex vivo
    metatarsal, n = 5 bones, six days. NO PERCENTAGE EFFECT SIZE IS GIVEN FOR THE 40 MICROMOLAR ARM
    ANYWHERE IN THE TEXT - it is reported as significant against vehicle by figure. And the compound is
    pharmacologically dirty by the authors' own account, so the term assignment is autophagy/mTORC1 rather
    than dynamin.
- parameter: >-
    THE H89 NECESSITY TEST, ZONE-RESOLVED - CNP'S GROWTH EFFECT IS PKA-DEPENDENT SPECIFICALLY IN THE
    HYPERTROPHIC ZONE
  value: >-
    H89 inhibited the growth-promoting effect of CNP ONLY IN THE HYPERTROPHIC ZONE; attenuation of
    CNP-induced PKA activation by H89 reached statistical significance in the HZ and did NOT in the non-HZ
  unit: growth plate zone length and FRET-reported PKA activity
  conditions: >-
    hirota2022, Endocrinology 163, read in full. FRET-based cGMP and PKA biosensors in ATDC5 cells; live
    imaging of the fetal growth plate in PKAchu transgenic mice expressing a PKA FRET biosensor; radial
    explants treated with vehicle or CNP 100 nM followed by vehicle, H89 20 nM, or PTHrP 100 nM, incubated
    3 days. CNP-induced PKA activation increased with chondrogenic differentiation. CNP and GC-B are
    predominantly expressed in proliferative and prehypertrophic chondrocytes while the PKA effect is
    predominantly hypertrophic.
  species: mouse
  source_ref: hirota2022
  uncertainty: >-
    THE AUTHORS HEDGE AND IT IS RECORDED - CNP promotes elongation "AT LEAST PARTIALLY through PKA
    activation", so this is a partial-necessity result, not an abolition. H89 at 20 nM is a low
    concentration for a PKA inhibitor and off-target effects at higher doses are a known problem with this
    compound. Fetal growth plate and an immortalised chondrogenic line; radial explants for the length
    endpoint. AND AN UNRESOLVED ODDITY: receptor expression is proliferative/prehypertrophic while the
    effect is hypertrophic, which the paper does not explain.
- parameter: >-
    PDE3 IS NOT THE cGMP-TO-cAMP BRIDGE IN CHONDROCYTES, ALTHOUGH IT IS IN HEART AND GUT
  value: >-
    the PDE3 inhibitor cilostamide did not apparently change CNP-induced cGMP elevation or PKA activation;
    the authors conclude PTHrP/PTH1R signalling and PDE3 inhibition were NOT involved in CNP-induced PKA
    activation during chondrogenic differentiation
  unit: FRET-reported cGMP and PKA activity
  conditions: >-
    hirota2022, same system. The paper cites the cardiac and gastric literatures in which CNP-induced cGMP
    DOES inhibit PDE3 and raise cAMP, and then shows the chondrocyte does not use that route. Its other
    experiments implicate calcium (BAPTA-sensitive) and adenylate cyclase regulation instead.
  species: mouse
  source_ref: hirota2022
  uncertainty: >-
    A NEGATIVE FROM ONE INHIBITOR IN ONE CELL LINE AT ONE DIFFERENTIATION SERIES. Cilostamide not changing
    CNP-induced PKA does not prove PDE3 is absent or inactive in chondrocytes - it shows PDE3 does not
    mediate THIS effect. But it is a direct test of exactly the proposition round 262 advanced and graded D
    while asserting nobody had looked, and it goes against it.
localization:
- 'ex vivo mouse metatarsal epiphyseal cartilage: where dynasore raised matrix and lowered proliferation'
