contradicts: >-
  WITHDRAWS THE CENTRAL CLAIM OF round266_the_senolytic_arm_is_empty_for_a_reason_and_dynamin_is_a_new_node.
  That node filed dynamin as the only genuinely new control point of the session and argued it was
  orthogonal to the collision matrix because trafficking is not signalling. The full text shows the
  compound is dynamin-independent in the relevant respects and that the mechanism is lysosomal v-ATPase,
  autophagy blockade and mTORC1 - a node this atlas already holds - with growth occurring by matrix
  accumulation while proliferation falls, and with the authors expecting transience. The senolytic closure
  in that node is unaffected. ALSO REFUTES round262's grade-D speculation that cilostazol amplifies the
  PTH1R/cAMP arm through dual-specificity PDE3: hirota2022 tested it with cilostamide and found PDE3 not
  involved in chondrocytes.
