- 'proliferative and prehypertrophic chondrocytes: where CNP and GC-B are actually expressed'
human_evidence: absent
human_evidence_note: No human data in either paper.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: >-
  One ex vivo metatarsal with an author-stated expectation of transience, and one fetal growth plate plus
  chondrogenic cell line with a partial-necessity pharmacological test.
confidence: B
confidence_reason: >-
  Both are full texts read directly, and the load-bearing statements are quoted from the papers rather than
  inferred. The dynasore deflation is B because the authors themselves supply the mechanism and the
  transience caveat; the hirota confirmation is B because the necessity test is zone-resolved with
  statistics on the discriminating comparison.
claim_grades:
- claim: Dynamin is a new control point for longitudinal bone growth.
  grade: X
  basis: >-
    NO, AND ROUND 266 SAID SO ON AN ABSTRACT. The full text states dynasore acts dynamin-INDEPENDENTLY on
    cholesterol homeostasis, lipid rafts, lysosomal inhibition and actin; the mechanism the paper lands on
    is lysosomal v-ATPase blockade, autophagy inhibition and mTORC1 activation, with bafilomycin as the
    positive control. The control point is autophagy/mTORC1, which this atlas already holds.
- claim: >-
    Low-dose dynasore produces a sustainable increase in longitudinal bone growth.
  grade: X
  basis: >-
    The authors state the opposite in their own discussion - the increase is "likely transient", because a
    sustained reduction in proliferation and ECM accumulation would not support continued elongation. EdU
    incorporation was markedly reduced at the growth-promoting dose.
- claim: >-
    The mTORC1 ex vivo growth signature is matrix accumulation rather than cell production.
  grade: C
  basis: >-
    marchanalvarez2026 reports elongation with augmented matrix accumulation and REDUCED proliferation, and
    distinguishes its compound from bafilomycin as growing bone "without promoting hypertrophy... caused by
    an accumulation of ECM in the extracellular space". From the same laboratory as newton2018, whose 79
    micrometre one-off burst round 253 could not mechanistically assign. Two perturbations, one laboratory,
    same signature - which is convergence, not replication.
- claim: >-
    CNP's growth-promoting effect requires PKA specifically in the hypertrophic zone.
  grade: B
  basis: >-
    hirota2022 - H89 inhibited CNP's growth-promoting effect ONLY in the hypertrophic zone, and the
    attenuation of CNP-induced PKA reached significance in the HZ but not the non-HZ. The authors hedge to
    "at least partially", so this is partial necessity.
- claim: >-
    Cilostazol amplifies the PTH1R/cAMP arm as well as the cGMP arm, because PDE3 is dual-specificity.
  grade: X
  basis: >-
    ROUND 262 ADVANCED THIS AT GRADE D AND SAID NOBODY HAD LOOKED. hirota2022 looked - cilostamide did not
    change CNP-induced cGMP or PKA, and the authors conclude PDE3 inhibition is not involved in CNP-induced
    PKA activation in chondrocytes, despite PDE3 being the bridge in heart and gut. Cilostazol is therefore
    more likely a pure cGMP-arm agent in cartilage, which makes it MORE redundant with vosoritide, not less.
