contradicts:
- 'OVERTURNS THE ROUND-193 HEADLINE. That round recorded vahle2002''s dose-dependent 5 to 6 per cent
  femoral elongation as the dose-response the programme had been hunting. The QCT table in the FDA review
  of the sibling study reads 35 mm in every arm at the same terminal age, and a 5 per cent difference on
  35 mm is 1.75 mm and would have been visible. The caliper result is most likely reading periarticular
  and periosteal new bone as length in animals whose femoral width rose by a third.'
- 'CORRECTS AN ERROR MADE EARLIER IN THIS SAME ROUND. jolette2006 was first recorded here as an
  independent replication of vahle2002 on a second molecule. Its femoral elongation is inferred from bone
  mineral AREA, not measured, and BMA cannot separate length from width. Withdrawn as a length
  measurement.'
- 'RETIRES THE ROUND-185 AGE GATE. The 6-to-12-month treatment window produced plus 1.5 and plus 2.9 per
  cent against plus 1.5 and plus 3.4 per cent in the 2-to-8-month window. The ogawa2002 15-week null is
  not a closed window at the level of bone length.'
- 'REVERSES THE ROUND-184 TERM ASSIGNMENT. The candidate was proposed as an amplification agent on the
  reasoning that PTHrP signalling delays hypertrophic commitment and commitment delay is amplification.
  Receptor localisation supports the site of action but the terminal table shows the total is conserved,
  so the retiming buys rate and not yield - the same verdict round 183 reached for growth hormone,
  reached here by a different route.'
