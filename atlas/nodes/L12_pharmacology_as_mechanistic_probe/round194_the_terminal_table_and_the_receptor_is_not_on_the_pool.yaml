id: round194_the_terminal_table_and_the_receptor_is_not_on_the_pool
name: ROUND 194 - the FDA review tabulates femoral length per age window and finds it identical in every
  arm at terminal sacrifice, and the receptor is on the pre-hypertrophic cell rather than on the pool
type: hypothesis
layer: L12
aliases:
- the terminal table
- fda nda 21-318 femur length
- pth1r is a rate agent
- round 194
stub: false
summary: 'THE USER SUPPLIED THE FDA PHARMACOLOGY REVIEW FOR NDA 21-318 AND IT CONTAINS BOTH THE STRONGEST
  POSITIVE THIS LINE HAS PRODUCED AND THE RESULT THAT CLOSES IT.

  THE POSITIVE, FIRST, BECAUSE IT RETIRES THE OLDEST OBJECTION IN THE FILE. The review tabulates
  quantitative-CT femur length per group for the second Lilly carcinogenicity study in female Fischer
  344 rats, at two interim sacrifices, and the numbers are these. Treated from 2 to 8 months of age and
  killed at 8 months, femur length was 32.8 mm in vehicle, 33.3 mm at 5 micrograms per kilogram per day
  and 33.9 mm at 30, both starred against control - plus 1.5 and plus 3.4 per cent. Treated from 6 to 12
  months of age and killed at 12 months, 34.2 mm in vehicle, 34.7 mm at 5 and 35.2 mm at 30 - plus 1.5
  and plus 2.9 per cent, n equals eight per group. THE TWO AGE WINDOWS AGREE TO WITHIN HALF A PERCENTAGE
  POINT AT BOTH DOSES. Round 185 called the age gate the most serious limitation on this candidate and
  round 186 already softened it; this retires it. Whatever a PTH1R agonist does to femoral elongation, it
  does not need the rapid-growth phase to do it. For scale, untreated controls gained 1.4 mm between 8
  and 12 months, and six months of 30 micrograms per kilogram in the older window added 1.0 mm on top -
  seventy per cent of what unaided growth delivered over the preceding four months.

  AND NOW THE TERMINAL TABLE. The same review, next page, headed Data for terminal sacrifice, all
  animals, end of study at 26 months of age. Eight arms - vehicle, 30 micrograms per kilogram from 2 to
  26 months, 5 and 30 from 6 to 12, 5 and 30 from 2 to 8, 5 and 30 from 6 to 26. Femur length reads 35,
  35, 35, 35, 35, 35, 35, 35. Not one asterisk. Every other row in that table is starred somewhere -
  midshaft BMD runs 973 against 1417, vertebral BMC 2.09 against 3.91 - so the reviewer was flagging
  significance normally and femoral length simply had none to flag. INCLUDING IN THE TWO ARMS DOSED
  CONTINUOUSLY FROM 2 MONTHS AND FROM 6 MONTHS ALL THE WAY TO TERMINATION.

  THAT IS THE ANSWER TO THE QUESTION THIS PROGRAMME HAS BEEN ASKING SINCE ROUND 184. Controls went 32.8
  at 8 months, 34.2 at 12 months, 35.0 at 26 months. Treated animals arrived at the same asymptote
  earlier and then stopped. THE DRUG ACCELERATED FEMORAL ELONGATION AND THE ANIMAL GAVE IT BACK. It is a
  rate effect on an unchanged total, which is the rate-yield trade-off fitted from hunziker1994 in round
  183, and it puts intermittent PTH1R agonism in the same class as growth hormone rather than opposite
  to it.

  THIS ALSO SETTLES THE VAHLE 2002 CONFLICT, AND NOT IN VAHLE 2002''S FAVOUR. That paper reported
  dose-dependent femoral elongation of 5 per cent in males and 6 per cent in females BY CALIPERS, in
  animals whose femoral WIDTH rose 33 and 32 per cent. Five per cent of 35 mm is 1.75 mm, which would
  have printed as 37 in the QCT table and did not. A caliper laid across a femur carrying 33 per cent
  more periosteal bone and focal proliferative lesions measures periarticular new bone as length; a QCT
  length does not. THE TWO POSITIVES AT TERMINAL BOTH USE METHODS THAT CANNOT SEPARATE ELONGATION FROM
  APPOSITION, AND THE ONE METHOD THAT CAN SAYS ZERO.

  AND JOLETTE 2006 IS WORSE THAN THAT, WHICH IS A CORRECTION TO EARLIER IN THIS SAME ROUND. Reading the
  supplied primary bundle I first recorded jolette2006 as an independent replication of vahle2002 on a
  second molecule - rhPTH(1-84), 150 micrograms per kilogram per day, two years, same strain, different
  sponsor, roughly 5 per cent in males and 3 in females. The sentence actually reads that the increase in
  femoral BONE MINERAL AREA was consistent with a significant elongation of femoral length. BMA IS
  LENGTH TIMES WIDTH. That is CORR-189 committed in the source: a projected area cannot be assigned to
  the length term, and in an animal whose diaphyseal bone mass rose by a third the width term is doing
  the work. jolette2006 is not a length measurement and cannot be counted as a replication of one.

  A THIRD DATASET, PREVIOUSLY UNPUBLISHED, POINTS THE SAME WAY. The review reproduces Lilly Nonclinical
  Pharmacology Report CG3-04 from the September 1995 IND review: male Sprague-Dawley rats at about four
  weeks and 70 grams - the fastest-growing window available - dosed 18 days at 0, 16 or 80 micrograms per
  kilogram per day. Body weight gain rose 20 per cent, tibial bone parameters rose 10 to 50 per cent, and
  "femur length was the same in all groups".

  THE OTHER HALF OF THE ROUND IS WHY, AND IT COMES FROM THE RECEPTOR''S ADDRESS. hallett2021, supplied as
  the third PDF, sorted mouse growth-plate chondrocytes into label-retaining and non-label-retaining
  fractions and sequenced them. Pthlh - the ligand - is enriched 2.6-fold in the SLOW-CYCLING fraction.
  Pth1r - the receptor - is enriched 3.0-fold in the NON-label-retaining fraction, alongside Ihh at
  54-fold. chu2026, the adolescent HUMAN growth plate, independently lists PTH1R with ALPL as a
  pre-hypertrophic zone marker, in a dataset whose root population expresses skeletal stem cell markers
  BUT NOT PTHrP. Mouse and human agree. THE DRUG''S RECEPTOR IS NOT ON THE POOL. It is on the cell that
  has already left it.

  THAT IS CONSISTENT WITH BOTH HALVES OF THE RESULT AND IT IS THE MECHANISM. An agent acting at the
  proliferative-to-prehypertrophic boundary can retime hypertrophic commitment - which moves growth rate
  now - without changing how many divisions a progenitor''s clone performs in total. More growth now,
  less later, same total. Which is exactly what the terminal table shows.

  WHAT THIS DOES NOT SETTLE, AND IT IS THE ONLY THING KEEPING THE LINE OPEN. The rat gives it back
  because the rat plate never closes and the control catches up over fourteen further months. A human at
  bone age 16 has a plate that FUSES. If fusion is scheduled by time or by hormonal milieu, an
  accelerated six months is banked and the illustrative arithmetic is 1.4 to 1.6 cm of femur. If fusion
  is triggered by exhaustion of a fixed proliferative reserve, then accelerating consumption fuses the
  plate earlier and banks nothing - and in that case the drug is actively harmful stacked behind GH,
  which round 183 showed is already spending the pool at five times the normal rate. NOTHING IN ANY RAT
  STUDY CAN DISTINGUISH THESE, BECAUSE THE RAT NEVER FUSES.

  FINALLY, WHAT THE REGULATORY PACKAGE DOES NOT CONTAIN, BY ENUMERATION OF THE TWO REVIEWS IN FULL. NDA
  208743, the abaloparatide pharmacology and toxicology review, contains ZERO bone-length endpoints and
  ZERO juvenile animal studies across 46 sheets; the growth plate appears once, in background prose. The
  NDA 21-318 cynomolgus study selected "skeletally mature adults with no open growth plates" at 9 to 11
  years by design. No PTH1R agonist has ever been given to a growing non-rodent in a regulatory study,
  deliberately. And the Division recommended limiting cumulative treatment with abaloparatide and other
  parathyroid hormone analogues to two years.'
