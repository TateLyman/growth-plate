localization:
- 'PTH1R - pre-hypertrophic zone in human (chu2026) and enriched in the non-slow-cycling fraction in
  mouse (hallett2021); NOT on the root progenitor population'
- 'the endpoint that matters - whole femur by quantitative CT, which unlike calipers and unlike DXA
  projected area does not count periosteal or periarticular new bone as length'
human_evidence: indirect
human_evidence_note: 'The human contribution this round is receptor localisation only - chu2026 places
  PTH1R in the pre-hypertrophic zone of the adolescent human growth plate. There is still no human who
  has received a PTH1R agonist with a growth endpoint outside hypoparathyroid replacement dosing. The
  length results are entirely rat.'
species_basis:
- rat
- mouse
- human
translation_risk: high
translation_risk_reason: 'The decisive rat result depends on a feature the human does not have. The rat
  gives the length back because its plate never closes and its controls catch up over fourteen further
  months; a human plate fuses. Whether an accelerated six months is banked or simply brings fusion
  forward cannot be tested in an animal that never fuses, so the central negative does not transfer
  cleanly and neither does the interim positive.'
confidence: B
claim_grades:
- claim: intermittent PTH1R agonism increases femoral length at interim timepoints in both rapidly
    growing and slower-growing rats, dose-dependently
  grade: C
  basis: single study, two independent age arms and two dose levels within it, n=8 per group, quantitative
    CT, tabulated in a regulatory review of a GLP study
- claim: intermittent PTH1R agonism does not change final femoral length in the rat
  grade: C
  basis: single study, eight arms including two continuously dosed to termination, all identical, n=8 per
    group; underpowered below about 1.5 per cent and reported at 1 mm resolution
- claim: the caliper and BMA-derived positives at terminal cannot be counted as length measurements
  grade: B
  basis: methodological, not empirical - a caliper across a bone with 33 per cent more width, and a
    projected area that is length times width by construction, neither separates the terms; CORR-189
- claim: PTH1R is a pre-hypertrophic rather than a resting-zone receptor
  grade: B
  basis: agreeing mouse sorted-population RNA-seq and human single-cell data from independent groups
- claim: no PTH1R agonist has been given to a growing non-rodent in a regulatory study
  grade: A
  basis: enumeration of the complete NDA 21-318 and NDA 208743 pharmacology reviews
