contradicts:
- 'SUBSTANTIALLY WEAKENS THIS ATLAS''S OWN ROUND-185 BENCHMARK.
  pth1r_verdict_the_schedule_does_not_survive_the_species_jump made the pulses-per-chondrocyte-cycle
  argument the thing that decided the round and withdrew daily dosing on it. The TYMLOS label reports a
  one-hour half-life and pre-dose serum calcium at baseline, which is direct human evidence that a daily
  dose resolves within 24 hours, and daily PTH1R agonism is anabolic rather than catabolic in humans -
  the opposite of what the species-scaling model predicts. The benchmark is not refuted, because the
  commitment clock could still be operative and nobody has measured chondrocyte PTH1R resensitisation,
  but it is now the weaker of the two models and it argues for hedging rather than for abandoning daily
  dosing.'
- 'PARTIALLY RESTORES ROUND 184''S MOLECULE CHOICE ON DIFFERENT GROUNDS. Round 186 noted that ogawa2002
  used teriparatide and that the abaloparatide preference pointed away from the only supporting
  experiment. That remains true - the label puts abaloparatide at 41 per cent homology to hPTH(1-34) -
  but for a daily schedule at maximum achievable exposure abaloparatide is still the better choice,
  because its 80 mcg dose is four times teriparatide''s 20 mcg and the exposure gap is the binding
  constraint.'
