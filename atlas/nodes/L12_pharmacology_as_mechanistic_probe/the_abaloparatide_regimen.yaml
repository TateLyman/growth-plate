localization:
- 'PTH1R on late proliferative and prehypertrophic chondrocytes - the commitment boundary'
human_evidence: indirect
human_evidence_note: 'The dose, route, pharmacokinetics and toxicity are all labelled human data from
  an 18-month trial of 824 treated patients. Everything connecting them to a growth plate is
  extrapolated: no human has received a PTH1R agonist at an anabolic dose with a growth endpoint, and
  the label directs avoidance in open epiphyses, which is why.'
species_basis:
- human
- rat
- ovine
translation_risk: high
translation_risk_reason: 'The regimen is assembled from human pharmacokinetics and toxicity, a rat
  growth experiment using a different molecule, and a sheep loading study. What is solid is the dose
  and the pharmacokinetics. What is extrapolated is that the rat growth effect transfers, that
  abaloparatide substitutes for teriparatide, and that timing the pulse to the nocturnal growth window
  matters.'
confidence: D
claim_grades:
- claim: Daily PTH1R dosing in a human is effectively continuous because human chondrocytes are slow.
  grade: E
  basis: 'THIS ATLAS''S ROUND-185 ARGUMENT AND IT IS NOW THE WEAKER OF THE TWO MODELS. Against it: a
    one-hour half-life makes the duty cycle a property of the drug; the label reports pre-dose serum
    calcium at baseline while four-hour calcium is raised, so the effect demonstrably resolves within a
    day in a human; and daily PTH1R agonism is anabolic rather than catabolic in humans, which is what
    the species-scaling model predicts it should not be. Held at E rather than X because nobody has
    measured PTH1R resensitisation in a chondrocyte of either species and the commitment clock could
    still be the operative one.'
- claim: 80 mcg five days a week is the best available regimen.
  grade: D
  basis: 'REASONED FROM LABELLED HUMAN PHARMACOLOGY AND ONE RAT EXPERIMENT, NOT TESTED. 80 mcg is the
    approved dose and the top of the tested range, so it is the per-pulse ceiling with human data.
    Five-on-two-off exactly reproduces ogawa2002''s exposure pattern and preserves a weekly washout that
    hedges the model uncertainty. D because every link between the labelled pharmacology and a growth
    plate is extrapolation.'
- claim: Escalating above 80 mcg would close the exposure gap.
  grade: E
  basis: 'ARITHMETICALLY YES AND IT IS THE WRONG MOVE WITHOUT DATA. The gap to the BSA-scaled rat
    exposure is about ten-fold and cannot be closed at the approved per-pulse dose. But hypercalcaemia
    is the dose-limiting toxicity and it scales directly with per-pulse size, there is no human
    pharmacokinetic or safety data above 80 mcg for this molecule, and the rat dose was a single
    arbitrary point never titrated against a growth plate. If escalation is attempted it needs
    albumin-corrected calcium at four hours, which is the label''s own detection method.'
- claim: Evening dosing is better than morning dosing.
  grade: E
  basis: 'AN INFERENCE THAT COSTS NOTHING AND HAS NEVER BEEN TESTED. noonan2004 puts at least 90 per
    cent of tibial elongation in recumbency; the drug''s window is five to six hours; a bedtime dose
    covers the early nocturnal period. It also satisfies the label instruction to dose where the patient
    can lie down. Sheep data, a half-life, and an assumption that overlap matters.'
- claim: This regimen can be assumed additive with the rest of the stack.
  grade: X
  basis: 'NO, AND ONE PAIRING COULD BE ACTIVELY HARMFUL. xie2012 attributes PTH''s achondroplasia rescue
    partly to DOWNREGULATED FGFR3, so this and erdafitinib may share a node. And if abaloparatide raises
    cell production the way GH does - by spending the resting pool faster, amplification 0.77 in round
    183 - then in a case at bone age 16 the two stack in cost rather than benefit. Only the vosoritide
    pairing is supported by the term decomposition, since that is an h_term agent and this is proposed
    as a flux agent.'
