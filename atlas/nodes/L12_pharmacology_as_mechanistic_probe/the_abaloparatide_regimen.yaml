id: the_abaloparatide_regimen
name: THE ABALOPARATIDE REGIMEN - 80 mcg, five days on and two off, evening - and the round-185
  intermittency benchmark is substantially weakened by the label's own pharmacokinetics
aliases:
- abaloparatide dose
- the regimen
- 5 on 2 off
- round 187
type: intervention
layer: L12
stub: false
summary: 'ASKED FOR AN OPTIMAL BUT REASONABLE ABALOPARATIDE DOSE. THE ANSWER IS 80 MICROGRAMS
  SUBCUTANEOUS ONCE DAILY, FIVE CONSECUTIVE DAYS A WEEK, TWO DAYS OFF, GIVEN IN THE EVENING AT A
  CONSISTENT TIME IMMEDIATELY BEFORE LYING DOWN. Getting there required correcting this atlas again,
  because the round-185 benchmark that drove the last two rounds does not survive contact with the
  drug label.

  THE CORRECTION FIRST. Round 185 argued that intermittency is a ratio between the dosing interval and
  the chondrocyte''s own clock, that a human chondrocyte cycles about fourteen times slower than a
  rat''s, and that daily dosing is therefore twenty-fold too frequent and drifting toward the arm where
  this drug class shortens bone. THREE FACTS ARGUE AGAINST IT, TWO OF THEM FROM THE TYMLOS LABEL.
  First, the half-life is ABOUT ONE HOUR, so an 80 microgram dose is down to roughly three per cent of
  peak by five half-lives and the exposure window is five to six hours in every twenty-four - a duty
  cycle of about a fifth, and a property of the DRUG rather than of the species. Second, and this is
  the direct evidence, the label reports that PRE-DOSE SERUM CALCIUM WAS SIMILAR TO BASELINE while the
  four-hour post-dose value crossed the hypercalcaemia threshold in three per cent of patients. The
  pharmacodynamic effect of a daily dose FULLY RESOLVES WITHIN TWENTY-FOUR HOURS in a human. Daily
  dosing is pulsatile by the only in-vivo readout anyone has. Third, and hardest to argue with, DAILY
  PTH1R AGONISM IS ANABOLIC IN HUMANS. If slow human target cells made daily dosing effectively
  continuous, daily teriparatide should behave like an infusion and be catabolic. It is the approved
  anabolic regimen with fracture-reduction data - same drug, same schedule, same species, in the
  adjacent tissue where the intermittent-versus-continuous inversion was first described.

  SO THE INVARIANT TO MATCH IS EXPOSURE WINDOWS PER WEEK, NOT PULSES PER CELL CYCLE. That needs no
  half-life assumption for the rat and no cell-cycle estimate for either species. ogawa2002 dosed FIVE
  DAYS A WEEK. Five windows against five. FIVE-ON, TWO-OFF IS AN EXACT MATCH TO THE ONLY EXPERIMENT
  THAT EVER RAISED THE GROWTH RATE OF A NORMAL ANIMAL, and it is also the only schedule that preserves
  a genuine forty-eight-hour washout every week, which is the cheap hedge in case round 185 was right
  after all. The residual uncertainty is not gone and the gap stays open.

  WHY 80 MICROGRAMS AND NOT MORE. It is simultaneously the approved dose and the TOP of the phase-2
  range, which tested 20, 40 and 80. There is no human pharmacokinetic or safety data above it. For a
  60 kg subject it is 1.33 micrograms per kilogram, close to the per-kilogram exposure of the trial
  population, so the fixed dose needs no weight adjustment. AND THE DOSE-LIMITING TOXICITY SCALES
  DIRECTLY WITH PER-PULSE SIZE: hypercalcaemia at four hours, three per cent against 0.1 per cent on
  placebo, two patients discontinuing. Escalating is the one change that attacks the DLT head-on with
  nothing to guide it.

  THE EXPOSURE GAP, STATED NOT BURIED. Five-on-two-off delivers 400 micrograms a week, 6.67 per
  kilogram, against a body-surface-area-scaled rat equivalent of 64.5 - about TEN-FOLD SHORT. Going to
  seven days a week buys forty per cent more and closes it only to 6.9-fold, at the cost of two
  exposure windows the rat never had. THAT TRADE IS NOT WORTH TAKING, because the downside of getting
  the schedule wrong is that this drug class INVERTS SIGN, while the downside of forty per cent less
  exposure is a proportionally smaller effect. Asymmetric downside, so match the experiment. And the
  ten-fold figure is the distance to an ARBITRARY POINT rather than to a threshold - ogawa2002 ran a
  single dose chosen for maximal bone effect, never titrated against a growth plate, so the minimum
  effective dose is unknown and unlooked-for.

  EVENING DOSING IS FREE AND NOBODY HAS TRIED IT. Two independent reasons converge. noonan2004,
  already in this atlas, implanted microtransducers in lambs and found AT LEAST NINETY PER CENT of
  tibial elongation occurs during RECUMBENCY and almost none during standing or locomotion; with a
  one-hour half-life the drug''s window is five to six hours, so a bedtime dose lays the exposure
  directly over the early nocturnal growth period instead of over the part of the day when the plate
  barely elongates. And the label instructs administering where the patient can sit or lie down
  because of orthostatic hypotension in the hours after injection, which bedtime satisfies by
  construction. GRADE E - an inference from a lamb loading study and a half-life, not a tested
  hypothesis. PTH resets the cartilage circadian clock, so if it is done the timing must be consistent
  rather than drifting.

  THE MONITORING THAT ACTUALLY CHANGES THE DOSE, AS OPPOSED TO THE MONITORING ON THE LABEL.
  Albumin-corrected serum calcium at FOUR HOURS post-dose is the label''s own detection window and the
  DLT. But the mechanistically important one is PRE-DOSE calcium: the label''s finding that it stays at
  baseline is the evidence each dose is a pulse, so if pre-dose calcium starts drifting upward the
  exposure is no longer clearing between doses and the regimen has moved toward the continuous arm -
  which is a reason to lengthen the interval, not merely a safety flag. AND BONE AGE EVERY SIX MONTHS,
  which is not on the label and is specific to this use: the objective is final height, nobody has ever
  measured whether PTH1R agonism accelerates skeletal maturation, and if it advances bone age faster
  than it adds height it is self-defeating. That is the duration term eating the yield term, and this
  programme has been caught by that trade before.

  INTERACTIONS INSIDE THE STACK. ERDAFITINIB IS THE ONE TO WATCH: xie2012 attributes intermittent
  PTH(1-34)''s rescue of achondroplastic mice partly to DOWNREGULATED FGFR3, so a PTH1R agonist and an
  FGFR inhibitor may act through a shared node and CANNOT BE ASSUMED ADDITIVE. GROWTH HORMONE is the
  one that could make this actively harmful: round 183 showed GH buys rate almost entirely by spending
  the resting pool faster, amplification 0.77, and if abaloparatide does the same the two stack in COST
  rather than benefit. VOSORITIDE is the clean pairing - independent axis, and the term decomposition
  puts it on h_term while this is proposed as a flux agent.

  WHAT THIS REGIMEN IS NOT. It is not validated and no part of it has been tested in a human growth
  plate. The molecule is not the one that produced the only wild-type result: the label states
  abaloparatide is 76 per cent homologous to hPTHrP(1-34) and only 41 PER CENT to hPTH(1-34), and
  hPTH(1-34) is what ogawa2002 used, so more than half the sequence differs from the tested molecule.
  Whether the growth-rate gain is amplification or faster pool consumption remains unmeasured, and that
  is precisely the question that turned growth hormone from an apparent yield agent into a pool-spending
  one. And the label states that use is to be AVOIDED in patients with open epiphyses on osteosarcoma
  grounds, which is the reason no human growth data exists for any PTH1R agonist and why this is a
  reasoned extrapolation rather than a prescription.'
