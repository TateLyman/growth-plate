id: round214_lysosomal_trapping_survives_round213_and_the_liver_ceiling_is_routable
name: ROUND 214 - erdafitinib IS lysosomotropic and dabogratinib is not, but at steady state the lysosome
  is a capacitor rather than a resistor, so round 213's comparison survives while the measurement it
  proposed does not, and the cartilage-access asymmetry it assumed away is real
type: hypothesis
layer: L12
aliases:
- lysosomal trapping
- is the free-plasma comparison safe
- the liver workaround
- round 214
stub: false
summary: 'AN OBJECTION WAS PUT TO ROUND 213 THAT THE ATLAS HAD NOT CONSIDERED, AND IT IS A GOOD ONE.
  Erdafitinib is a lipophilic base with documented lysosomal accumulation, so its effective tissue exposure
  may exceed what free plasma predicts, and matching free plasma may not match target engagement. Two
  premises need separating because one is wrong and the other is right for a different reason than given.

  THE LIPOPHILICITY PREMISE DOES NOT HOLD. The objection put erdafitinib well above dabogratinib. PubChem
  currently gives erdafitinib XLogP 3.2 and dabogratinib 3.6 - dabogratinib is the HIGHER of the two on that
  calculator. ChEMBL''s ALogP puts erdafitinib at 4.18, close to the 4.3 quoted, but dabogratinib is not in
  ChEMBL so the pair cannot be compared under one algorithm. This axis does not separate them.

  THE BASICITY PREMISE SEPARATES THEM COMPLETELY, AND IT IS THE AXIS THAT ACTUALLY DRIVES LYSOSOMOTROPISM.
  Erdafitinib carries a SECONDARY ALIPHATIC AMINE - the N-isopropyl of an isopropylamino-ethyl arm - which
  puts it near pKa 9 to 10 and therefore essentially fully monocationic at pH 7.4 and stranded at pH 4.7.
  Dabogratinib''s only sp3 nitrogens sit in a 2,6-diazaspiro[3.3]heptane in which one nitrogen is CAPPED
  WITH A METHANESULFONYL GROUP, which is not basic at all, and the other is tied to a dichloropyridine
  whose chlorines suppress what little basicity remains. Its single hydrogen-bond donor is an indazole NH,
  which is weakly ACIDIC. DABOGRATINIB IS NEUTRAL AT PHYSIOLOGICAL pH AND CANNOT ION-TRAP. So the
  objection''s conclusion is correct and the reason offered for it is not. TPSA points the same way and is
  the second real difference - 77.3 against 113, and above roughly 90 square angstroms passive permeability
  falls off, which matters for a tissue reached only by diffusion.

  THE OBSERVATION IS PRIMARY, NOT INFERRED. perera2017, the erdafitinib discovery paper, states in its own
  abstract that JNJ-42756493 shows rapid uptake into the lysosomal compartment of cells in culture, which
  is associated with prolonged inhibition of FGFR signalling, possibly due to sustained release of the
  inhibitor. The hedge is theirs.

  BUT AN INDEPENDENT GROUP DISSECTED THE SAME PHYSICS IN ANOTHER FGFR INHIBITOR AND READ IT THE OPPOSITE
  WAY. englinger2018 showed PD173074 accumulates selectively in lysosomes, is still compartmentalised there
  120 HOURS after a one-hour exposure, and - the decisive number - that chloroquine co-incubation gave
  14.29-fold against 2.78-fold suppression of phospho-ERK at 1 micromolar, a 5.1-FOLD BETTER HIT ON THE
  TARGET, and rescued AKT inhibition entirely at both concentrations tested. RAISING LYSOSOMAL pH MADE AN
  FGFR INHIBITOR SUBSTANTIALLY MORE POTENT. So the literature holds both readings: perera2017 calls it a
  depot, englinger2018 calls it a sink.

  THE ARITHMETIC RECONCILES THEM AND DECIDES THE ROUND. Ion trapping saturates at the pH gradient itself -
  316-fold once the pKa clears the lysosomal pH - and at a 3 per cent lysosomal volume fraction that puts
  about 91 per cent of soluble intracellular erdafitinib inside lysosomes. BUT AT STEADY STATE THE LYSOSOME
  IS A CAPACITOR, NOT A RESISTOR. The neutral species crosses membranes freely, so at equilibrium the
  neutral concentration is identical in plasma water, cytosol and lysosomal lumen, and CYTOSOLIC TOTAL
  CONCENTRATION IS FIXED BY THE EXTRACELLULAR FREE CONCENTRATION AND CYTOSOLIC pH ALONE. The lysosome fills
  from the same neutral pool; it does not drain the cytosol. Both primary observations are non-steady-state
  - perera2017''s prolonged inhibition is a washout tail and englinger2018''s potency gain is a one-hour
  co-incubation.

  CONSEQUENCE ONE, AND IT DEFENDS ROUND 213. On continuous once-daily dosing with a 59-hour half-life
  erdafitinib is permanently at steady state, the depot is already full and never releases into a falling
  gradient. THE FREE-PLASMA COMPARISON STANDS - 4.01 times FGFR3 IC50 for the child who grew 19.06 cm/year,
  4.33 times for dabogratinib at 90 mg.

  CONSEQUENCE TWO, AND IT BREAKS SOMETHING ROUND 213 WROTE. Round 213 opened a gap asking for the GROWTH
  PLATE CONCENTRATION of each drug by LC-MS on microdissected cartilage. THAT MEASUREMENT WOULD BE
  MISLEADING. Erdafitinib would read roughly an order of magnitude higher in cartilage than dabogratinib
  purely from lysosomal load, with NO difference in target engagement, because that drug is on the wrong
  side of an organelle membrane from a cytosolic kinase domain. The gap has to specify a free or cytosolic
  measurement, or pair concentration with a phospho-ERK readout by zone. Recorded as CORR-208.

  WHERE THE OBJECTION IS RIGHT AND ROUND 213 WAS WRONG TO ASSUME PARITY. THE CARTILAGE MATRIX IS NOT A
  NEUTRAL COMPARTMENT. Growth plate cartilage carries a high fixed negative charge from glycosaminoglycan
  sulfates and carboxylates, and a monovalent cation partitions into it by Donnan equilibrium - 1.39-fold
  at a fixed charge density of 0.10 molar, 1.62 at 0.15 and 2.14 at 0.25. ERDAFITINIB GETS THAT AND
  DABOGRATINIB GETS NOTHING. Modest, real, and assumed away by round 213.

  AND THERE IS A SECOND ASYMMETRY NOBODY HAS RAISED, RUNNING THE OTHER WAY. CARTILAGE IS AVASCULAR. Drug
  arrives by diffusion over hours from the perichondrial and metaphyseal margins, which is precisely the
  NON-steady-state regime in which englinger2018''s sink argument bites. Chondrocytes near the margin would
  load their lysosomes first and buffer drug out of the interstitial fluid before it reaches cells at
  depth. THE TWO EFFECTS HAVE OPPOSITE SIGNS IN CARTILAGE SPECIFICALLY and the net is unmeasured in any
  species.

  AND ONE PLACE THE DEPOT IS UNAMBIGUOUSLY AN ADVANTAGE, WHICH IS THE REGIMEN THE CHILD ACTUALLY RECEIVED.
  The index child ran 7 mg WITH FREQUENT INTERRUPTIONS. Interruption is exactly the falling-gradient
  condition in which a lysosomal depot releases, and englinger2018 found compartmentalisation persisting
  120 hours after a one-hour exposure. ERDAFITINIB''S REAL COVERAGE ON AN INTERRUPTED SCHEDULE WAS BETTER
  THAN THE STEADY-STATE CALCULATION IMPLIES AND DABOGRATINIB WOULD NOT HAVE THAT PROPERTY. Round 213 missed
  this and it is a genuine point for erdafitinib - on an intermittent schedule, not a continuous one.

  ON THE LIVER, THE ANSWER IS TO ROUTE AROUND IT AND THE ORDER MATTERS. FIRST, FIND OUT WHETHER IT IS
  EXPOSURE-DEPENDENT - SURF301 holds individual steady-state AUC in 34 patients and ALT in all 41, and
  plotting one against the other costs nothing and decides everything downstream. SECOND, THE BID ARMS ARE
  THE MOST VALUABLE UNREPORTED DATASET IN THE PROGRAMME - 40, 50 and 60 mg twice daily were run and only
  the once-daily arms were reported; if the injury is Cmax-driven then BID at matched AUC lowers Cmax, and
  BID is what a growth plate wants anyway because a physis integrates continuously. THIRD, TEST WHETHER IT
  IS THE TFEB MECHANISM, because qiu2026 showed osimertinib hepatotoxicity runs through TFEB
  dephosphorylation, nuclear translocation, excessive autophagy-lysosome activation and vacuolation death,
  AND IDENTIFIED S-ADENOSYL-L-METHIONINE AS A HEPATOPROTECTANT THAT BLOCKS TFEB ACTIVATION. That prediction
  cuts against itself in a useful way - dabogratinib is NOT lysosomotropic, so if its transaminitis is
  still TFEB-driven then TFEB activation is not a lysosomotropism phenomenon and the antidote generalises.
  FOURTH, CARTILAGE-TARGETED DELIVERY IS THE ONLY OPTION THAT REMOVES THE CEILING RATHER THAN RAISING IT,
  because a liver ceiling is a ratio problem and binds only while cartilage and hepatocyte see the same
  plasma.

  TWO ROUTES THAT LOOK ATTRACTIVE AND ARE NOT. The lysosome-alkaliniser trick would in principle give
  erdafitinib englinger2018''s 5.1-fold at no extra dose, but it is a one-hour non-steady-state result, it
  would raise cytosolic erdafitinib in nail bed and oral mucosa where the dose is actually lost, and it
  does nothing for a non-lysosomotropic molecule. And the biologics route has no liver problem and a worse
  one - yang2024''s tetravalent bispecific FGFR3 antibody cannot enter avascular cartilage, THOUGH A
  SOLUBLE LIGAND TRAP IS GEOMETRICALLY DIFFERENT because it removes FGF from the extracellular space and
  never has to reach a chondrocyte surface at depth.

  AND THERE IS A FOURTH MOLECULE WITH THE ONLY JUVENILE THERAPEUTIC INDEX ANYONE HAS MEASURED. ozaki2020
  evaluated ASP5878 specifically for achondroplasia and reported it in AUC terms - bone elongation in male
  achondroplasia model mice at 300 microgram/kg giving an AUC of 275 ng.h/mL in juvenile mice, against
  minimal adverse effect, very slight corneal epithelial atrophy, at an AUC of 459 ng.h/mL in juvenile
  rats. A 1.67-FOLD WINDOW, THE ONLY ONE ON RECORD IN A GROWING ANIMAL, and it was LESS effective at bone
  elongation than a CNP analogue.'
quantitative:
- parameter: which physicochemical axis separates the two molecules
  value: erdafitinib MW 446.5, XLogP 3.2 (PubChem) / ALogP 4.18 (ChEMBL), TPSA 77.3, HBD 1, and a SECONDARY
    ALIPHATIC AMINE giving a monocation at pH 7.4. Dabogratinib MW 559.5, XLogP 3.6 (PubChem), TPSA 113,
    HBD 1, and NO basic centre - its diazaspiro nitrogen is methanesulfonylated and its remaining nitrogens
    are aromatic on a dichloropyridine. LIPOPHILICITY DOES NOT SEPARATE THEM AND ON PUBCHEM DABOGRATINIB IS
    THE HIGHER; BASICITY SEPARATES THEM COMPLETELY
  unit: daltons, log units, square angstroms, and ionisation state
  conditions: PubChem CID 67462786 and 170647464 computed descriptors; ChEMBL CHEMBL3545376; ionisation
    assigned from the canonical SMILES by functional group
  species: not_applicable
  source_ref: perera2017
  uncertainty: 'THE IONISATION ASSIGNMENT IS FROM STRUCTURE, NOT FROM A MEASURED pKa FOR EITHER COMPOUND -
    no experimental pKa for erdafitinib or dabogratinib was reachable here. The assignment is nonetheless
    robust, because a methanesulfonylated nitrogen is not basic by any account and a secondary alkylamine
    is, and the conclusion does not depend on where in the 9-to-10 range erdafitinib''s pKa falls. XLogP is
    a calculated descriptor and different calculators disagree by more than a log unit, which is itself the
    point'
  value_unverified: true
- parameter: erdafitinib lysosomal uptake, stated by its developers
  value: JNJ-42756493 shows rapid uptake into the lysosomal compartment of cells in culture, which is
    associated with prolonged inhibition of FGFR signalling, possibly due to sustained release of the
    inhibitor
  unit: qualitative, from the discovery paper abstract
  conditions: perera2017, cells in culture
  species: in_vitro_human_cell
  source_ref: perera2017
  uncertainty: 'PRIMARY AND FROM THE DEVELOPERS, so the phenomenon is not in dispute. The MECHANISM is - the
    word possibly is theirs, sustained release is their hypothesis, and the abstract gives no accumulation
    ratio, no cell type and no concentration. The full text is behind a Molecular Cancer Therapeutics
    paywall'
- parameter: what lysosomal accumulation does to an FGFR inhibitor's target engagement
  value: PD173074 accumulates selectively in lysosomes, remains compartmentalised there 120 HOURS after a
    one-hour exposure, and modelling from two parameter sets predicts 10.1-fold and 9.6-fold accumulation
    over cytoplasm. CHLOROQUINE CO-INCUBATION FOR ONE HOUR GAVE 14.29-FOLD AGAINST 2.78-FOLD SUPPRESSION OF
    PHOSPHO-ERK at 1 micromolar - 5.1-fold better - and rescued AKT inhibition entirely, 2.94 against 0.76
    at 1 micromolar and 3.45 against 1.03 at 10
  unit: fold accumulation and fold pathway suppression
  conditions: englinger2018, NCI-H1703 and NCI-H520 human lung cancer lines, intrinsic compound
    fluorescence with LysoTracker colocalisation, bafilomycin A1 and chloroquine as alkalinisers
  species: in_vitro_human_cell
  source_ref: englinger2018
  uncertainty: 'THE MOST DECISION-RELEVANT NUMBER IN THE ROUND AND IT IS A ONE-HOUR CO-INCUBATION - a
    kinetic condition, not steady state. It is also a different molecule, a preclinical tool compound with
    pKa 10.12 and logP 5.16 at pH 7.4, more lipophilic than erdafitinib, in cancer cell lines rather than
    chondrocytes. What it establishes is that the phenomenon can be a sink; it does not establish that it
    is one under chronic dosing'
- parameter: ion-trapping arithmetic and why it does not change steady-state target engagement
  value: the lysosome-to-cytosol total-concentration ratio saturates at 10 to the power of the pH gradient,
    316-fold for pH 4.7 against 7.2, for any pKa above about 8; at lysosomal volume fractions of 1, 3 and 5
    per cent that puts 76, 91 and 94 per cent of soluble intracellular drug inside lysosomes. BUT AT STEADY
    STATE THE NEUTRAL SPECIES EQUILIBRATES ACROSS ALL COMPARTMENTS, so cytosolic total concentration is
    fixed by extracellular free concentration and cytosolic pH alone and is INDEPENDENT of lysosomal load
  unit: fold ratio and per cent of intracellular drug
  conditions: Henderson-Hasselbalch two-compartment ion trapping, computed in
    atlas/tools/lysosomal_trapping_and_the_liver_ceiling.py
  species: not_applicable
  source_ref: englinger2018
  uncertainty: 'THIS IS THE ARGUMENT THAT DEFENDS ROUND 213 AND IT IS DERIVATION, NOT MEASUREMENT. It
    assumes passive permeation of the neutral species with no active transport, true equilibrium, and no
    lysosomal exocytosis. LYSOSOMAL EXOCYTOSIS IS A REAL STEADY-STATE DRAIN - trapped drug exported when
    lysosomes fuse with the plasma membrane - and TFEB-driven lysosomal biogenesis expands the compartment
    under chronic dosing, so the capacitor grows. Neither is quantified for erdafitinib'
  value_unverified: true
- parameter: Donnan partition of a monovalent cation into charged cartilage matrix
  value: at fixed charge densities of 0.05, 0.10, 0.15, 0.20 and 0.25 molar against 0.15 molar external
    salt, a monovalent cation partitions into the matrix water at 1.18, 1.39, 1.62, 1.87 and 2.14-fold.
    Erdafitinib is monocationic and gets this; dabogratinib is neutral and gets none of it
  unit: fold partition into matrix water
  conditions: standard Donnan equilibrium for a monovalent salt against a fixed charge density, computed in
    the same tool
  species: not_applicable
  source_ref: englinger2018
  uncertainty: 'THE OBJECTION''S STRONGEST FORM, AND ROUND 213 ASSUMED IT AWAY. It is an idealised
    calculation with no fixed charge density measured for human growth plate cartilage in this atlas, no
    account of direct glycosaminoglycan binding - which can be much larger than the Donnan term and which
    can RETARD depth penetration rather than help it - and no account of the drug being 99.7 per cent
    plasma-protein bound before it ever reaches the matrix'
  value_unverified: true
- parameter: the only juvenile-animal therapeutic index measured for any FGFR inhibitor
  value: ASP5878 elongated bone in achondroplasia model MALE mice at 300 microgram/kg, an AUC of 275
    ng.h/mL in juvenile mice; the AUC at which minimal adverse effect was observed - very slight atrophy of
    the corneal epithelium - was 459 ng.h/mL in juvenile rats. A 1.67-FOLD WINDOW. It was LESS effective at
    bone elongation than a CNP analogue
  unit: ng.h/mL and fold window
  conditions: ozaki2020, achondroplasia model mice and juvenile rats, plus a patient-specific iPSC model
  species: multiple
  source_ref: ozaki2020
  uncertainty: 'THE ONLY EXPOSURE-BASED THERAPEUTIC WINDOW FOR THIS CLASS IN A GROWING ANIMAL and it is
    narrow. Efficacy and toxicity AUCs come from DIFFERENT SPECIES - mice for efficacy, rats for the
    adverse effect - so the 1.67-fold ratio crosses a species boundary and is softer than it looks. Male
    mice only, so CORR-191 applies to the length result'
localization:
- 'the chondrocyte lysosome, where a basic drug is stranded on the wrong side of a membrane from a cytosolic
  kinase domain'
- 'the cartilage matrix, which carries fixed negative charge and pulls cations in while excluding large
  solutes entirely'
- 'the perichondrial and metaphyseal margins, the only routes into an avascular tissue and therefore where
  a diffusion gradient and any buffering sink would be set'
- 'the hepatocyte, where TFEB translocation and lysosome biogenesis is one named mechanism of tyrosine
  kinase inhibitor injury with one named antidote'
human_evidence: indirect
human_evidence_note: 'The lysosomal accumulation is human cells in culture for both compounds studied, and
  the physicochemistry is human-irrelevant in the sense that it is molecular. What is entirely absent is
  any human, or indeed any in vivo, measurement of either drug in cartilage, of chondrocyte lysosomal
  volume fraction, or of growth plate fixed charge density in a child.'
species_basis:
- human
- in_vitro_human_cell
- mouse
translation_risk: high
translation_risk_reason: 'The steady-state argument that defends round 213 is physical chemistry, not
  measurement, and it neglects lysosomal exocytosis and TFEB-driven expansion of the compartment. The
  cartilage arguments on both sides are idealised calculations against an unmeasured tissue.'
confidence: C
claim_grades:
- claim: erdafitinib is lysosomotropic and dabogratinib is not
  grade: B
  basis: erdafitinib's lysosomal uptake is stated by its developers in the discovery paper; the ionisation
    difference is unambiguous from structure - a secondary alkylamine against a methanesulfonylated
    nitrogen. No measured pKa for either compound was reachable
- claim: erdafitinib is substantially more lipophilic than dabogratinib
  grade: X
  basis: FALSE on the one calculator that has both. PubChem gives XLogP 3.2 against 3.6, with dabogratinib
    HIGHER. The objection's logP premise does not survive; its basicity premise does
- claim: lysosomal trapping invalidates round 213's free-plasma comparison under continuous dosing
  grade: E
  basis: ARGUED AGAINST. At steady state the neutral species equilibrates, so cytosolic concentration is
    set by extracellular free concentration and cytosolic pH regardless of lysosomal load. Both primary
    observations - the washout tail and the chloroquine potency gain - are non-steady-state
- claim: a total growth-plate concentration measurement would validate the round-213 comparison
  grade: X
  basis: FALSE, and it was round 213's own proposed experiment. A lysosomotropic drug reads high on total
    tissue concentration with no matching target engagement. CORR-208
- claim: erdafitinib reaches the cartilage matrix better than dabogratinib
  grade: E
  basis: DIRECTIONALLY SUPPORTED, UNQUANTIFIED. Donnan partition of 1.4 to 2.1-fold for a monocation, plus
    a TPSA of 77 against 113. Against it, glycosaminoglycan binding can retard depth penetration, and no
    fixed charge density for human growth plate is in this atlas
- claim: the lysosomal depot gives erdafitinib an advantage on an INTERRUPTED schedule
  grade: C
  basis: englinger2018 found compartmentalisation persisting 120 hours after a one-hour exposure, and the
    index child ran with frequent interruptions. Different molecule, cancer cells, and no cartilage data
- claim: dabogratinib's transaminitis can be routed around
  grade: E
  basis: FOUR ROUTES IDENTIFIED, NONE TESTED. Two need no new work at all - the exposure-response in
    SURF301's own PK set, and the unreported BID arms
key_refs:
- ref_id: perera2017
  year: 2017
  type: primary_abstract_only
  role: THE PRIMARY OBSERVATION - the developers state rapid lysosomal uptake associated with prolonged
    FGFR inhibition, possibly by sustained release. Full text paywalled
- ref_id: englinger2018
  year: 2018
  type: primary
  role: THE OPPOSITE READING OF THE SAME PHYSICS, WITH NUMBERS - selective lysosomal accumulation,
    persistence at 120 hours post-washout, and a 5.1-fold gain in phospho-ERK suppression when chloroquine
    empties the compartment
- ref_id: qiu2026
  year: 2026
  type: primary
  role: THE LIVER MECHANISM WITH A NAMED ANTIDOTE - osimertinib dephosphorylates TFEB, driving lysosome
    biogenesis and vacuolation death in hepatocytes, and S-adenosyl-L-methionine mitigates it by blocking
    TFEB activation
- ref_id: ozaki2020
  year: 2020
  type: primary
  role: THE ONLY JUVENILE THERAPEUTIC INDEX FOR THE CLASS - ASP5878, efficacy at AUC 275 ng.h/mL against
    minimal corneal toxicity at 459, a 1.67-fold window, and less effective than a CNP analogue
- ref_id: yang2024
  year: 2024
  type: primary
  role: the biologic route - a tetravalent bispecific antibody selectively inhibiting diverse FGFR3
    variants, with no liver metabolism and no way into avascular cartilage
- ref_id: surf301_ena2024
  year: 2024
  type: conference_abstract
  role: the dataset that would answer the liver question today - individual steady-state AUC in 34 patients
    against ALT in 41, and three unreported twice-daily dose arms
- ref_id: ye2026
  year: 2026
  type: primary
  role: the only delivery platform in this atlas that has moved a growth-plate agent systemically into
    cartilage and raised body length - the route that removes a liver ceiling rather than raising it
- ref_id: horike2026
  year: 2026
  type: primary
  role: carried forward, and it is why receptor-level inhibition is worth this trouble at all - the
    FGFR3-to-CREB limb that disrupts resting-zone turnover is ERK-INDEPENDENT, so it is blocked by an FGFR
    inhibitor and missed by every downstream agent
