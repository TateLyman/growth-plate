  which specified LC-MS on microdissected cartilage. For a lysosomotropic drug that measurement reports an
  organelle load, not target engagement, and would make erdafitinib look an order of magnitude better than
  dabogratinib with no difference at the kinase. Recorded as CORR-208.'
- 'ROUND 213''s assumption that the two molecules access cartilage comparably. Erdafitinib is monocationic
  and gains 1.4 to 2.1-fold by Donnan partition into a matrix that dabogratinib, being neutral, enters
  without that help; and its TPSA is 77 against 113.'
- 'The framing in the objection that lipophilicity is what distinguishes them. On PubChem''s XLogP
