open_questions:
- g_l12_does_a_pde3_inhibitor_lengthen_bone_in_a_normal_animal
- g_l2_how_wide_is_the_canonical_wnt_band_and_where_is_its_peak
contradicts: >-
  Two corrections, one of them to my own previous round. FIRST, round 303's grade-B claim that Axin2-het
  shortening validates the lower-Wnt-is-longer direction is withdrawn to D, because 63.7% of all knockouts
  shorten and significant hits run 6.4-to-1 negative, so the sign carries little information; the same
  correction dissolves round 303's invalidating Tnks tibia result, leaving IMPC length data uninformative
  about tankyrase in both directions. SECOND, CLAUDE.md's SETTLED row "Cilostazol is the same node as
  vosoritide; PDE3 is not the cartilage bridge (hirota2022)" is internally inconsistent: the second clause is
  correct and it REFUTES the first, because a PDE3 that is absent from CNP's chain is an independent handle
  on cAMP rather than a redundant one. The settled row should be rewritten, not deleted - hirota2022's
  finding stands, only the inference drawn from it was backwards.
