id: round296_the_compound_sweep_on_the_volume_axis_run_not_asserted
name: >-
  ROUND 296 - "not actionable" was asserted in round 295 without a compound search, which is failure mode
  four. Search run. Six compound classes on the volume axis return NO mammalian bone-length endpoint. The
  PIEZO1 lead I promoted yesterday is refuted by a node this atlas has held since 6 August - its agonist
  causes cartilage degeneration and its blockade is the therapeutic direction. And the one genuine compound
  found is a human randomised trial that buys 0.84 cm and pays for it in bone age
aliases:
- round 296
- the volume-axis compound sweep
- PIEZO1 demoted, agonist runs the wrong way
- fermented oyster extract RCT
- not actionable, now confirmed
type: hypothesis
layer: L12
stub: false
summary: >-
  ZERO - WHY THIS ROUND EXISTS. Round 295 closed with "not dead, not actionable" and did not run a compound
  search to support the second half. That is failure mode four - asserting what the literature contains -
  and the operator caught it. This round runs the search.

  ONE - THE SWEEP, AND IT IS MOSTLY EMPTY. Six classes queried on Europe PMC for any mammalian BONE LENGTH
  endpoint: organic osmolyte supplementation (taurine, betaine, sorbitol, myo-inositol); sulfate donors
  (methylsulfonylmethane, sodium sulfate, N-acetylcysteine); the polyol pathway (aldose reductase, AKR1B1 -
  the enzyme that generates sorbitol, whose INHIBITORS are marketed); systemic osmolality manipulation
  (vasopressin, desmopressin, induced hyponatremia); NFAT5/TonEBP activation; and PIEZO1 agonism.
  TAURINE returns 459 records and every growth result is aquaculture - shrimp, fish - with no mammalian
  bone-length endpoint. SULFATE DONORS return nothing skeletal with a length endpoint, which matters
  because scherer2025's plasma-sulfate-to-height correlation of r = 0.70 across 466,907 people is the
  atlas's best human anchor on this axis and the obvious "not directly X" move is to raise the substrate
  rather than drug the transporter. NOBODY HAS DONE IT WITH A LENGTH ENDPOINT. The polyol pathway has no
  growth-plate work in either direction. Osmolality manipulation has nothing on bone.
  THE EMPTINESS IS THE RESULT, and it is now measured rather than assumed.

  TWO - AND THE LEAD I PROMOTED YESTERDAY IS REFUTED BY A NODE THIS ATLAS HAS HELD SINCE 6 AUGUST.
  Round 295 called PIEZO1 "the strongest new lead on this axis" on the strength of an Open Targets score of
  0.935 and a hypertrophy-enriched expression profile I measured in GSE9160. I did not open
  `piezo1_channel.yaml`. It says:
  · Col2a1-Cre Piezo1 inactivation leaves LINEAR SKELETAL GROWTH ONLY MILDLY AFFECTED - the node's own
    conclusion is that the channel is required for the bone the plate PRODUCES, not for the plate's OUTPUT.
  · Col10a1-Cre deletion, restricted to hypertrophic chondrocytes, gives osteopenia and increased osteoclast
    number in the primary spongiosa via RANKL repression and OPG induction, with hypertrophic APOPTOSIS and
    TRANSDIFFERENTIATION UNALTERED (tschaffonmller2026). The loss-of-function test in exactly the right cell
    type does not touch the volume phenotype and reports no length effect.
  · The activation direction is the DAMAGING one. Under compression PIEZO1 drives GPX4 loss and ferroptosis,
    and deletion or pharmacological BLOCKADE SLOWED scoliosis progression. chen2025 - also already held -
    shows YODA1, THE PIEZO1 AGONIST, INDUCES CARTILAGE DEGENERATION, with COL2A1 down and RUNX2 up, an
    effect reversed by cilia disruption or siIFT88 because PIEZO1's action REQUIRES the primary cilium.
  THE THERAPEUTIC DIRECTION ON PIEZO1 IS INHIBITION. That is the opposite of what a swelling lever needs,
  and it is CORR-306's pattern again - read the sign before reaching for the pharmacology.
  WHAT SURVIVES FROM ROUND 295 IS ONE LINE, AND IT IS THE LINE THE NODE ITSELF FLAGGED AS MISSING: "no study
  has localised PIEZO1 in human growth plate tissue". Now one has - all five compartments of both donors,
  8986 resting rising to 24442 hypertrophic in the clean donor. A real addition that does not make PIEZO1 a
  lead. See CORR-321.
  ⚠ AND A CONNECTION WORTH KEEPING: PIEZO1 acts THROUGH the primary cilium, which is the same organelle
  round 294 found an FGFR inhibitor shortens in normal animals. Two independent levers on this axis both
  route through the cilium, and the stack's lead agent may be shortening it.

  THREE - THE ONE GENUINE COMPOUND, AND IT IS A HUMAN RANDOMISED TRIAL. nagahawatta2026, absent from this
  atlas: FERMENTED OYSTER EXTRACT, 500 mg/day against matched placebo for 24 weeks, 80 children aged 6-9
  with idiopathic short stature below the 25th percentile, randomised and double-blind. HEIGHT GAIN 3.22 +/-
  0.71 cm against 2.38 +/- 0.74 cm, P < 0.001 - ABOUT 0.84 CM OF DIFFERENCE OVER 24 WEEKS. Growth rate,
  height-SDS and serum IGF-1 all rose; GH and IGFBP-3 did not differ, so it is not acting on the somatotroph.
  Two mild rashes, one drop-out, no serious adverse events.
  ✗ AND THE TRADE IS EXPLICIT AND IT IS THE DISQUALIFYING ONE. BONE AGE ALSO INCREASED SIGNIFICANTLY in the
  treated group, together with urinary deoxypyridinoline. An agent that buys height velocity while advancing
  bone age is spending the remaining window rather than widening it, which is failure mode one, and it is
  the exact trade this atlas rejected for the PRC2 class in round 281 and for GH after mid-puberty in rounds
  254 and 269. The population is 6-9 year olds with years of plate left; this subject is bone age 16. There
  is no attained-adult-height endpoint.
  ✓ RECORDED ANYWAY, because it is a real randomised placebo-controlled linear-growth result and the atlas
  had nothing on it, and because the IGF-1 rise without a GH rise is an unusual signature worth knowing.

  FOUR - SO THE VERDICT, NOW EARNED RATHER THAN ASSERTED. The volume axis is the largest term in the height
  identity - about 80 per cent of elongation - it is experimentally isolable, and it has human
  common-variant support at scores above canonical height genes. AND THERE IS NO AGENT POINTING UPWARD IN
  ANY SPECIES. Every marketed tool on the machinery is an inhibitor because the clinical demand was always
  to reduce swelling. The one channel with an agonist has an agonist that degrades cartilage. The one
  substrate route with a human genetic anchor - plasma sulfate at r = 0.70 - has never been given a length
  endpoint. NOT ACTIONABLE IS NOW CONFIRMED, and the two cheapest ways to change that are named in the gaps:
  measure intracellular small-solute content by zone, and give a sulfate donor to a growing animal with a
  caliper on the femur.
human_evidence: direct
human_evidence_note: >-
  One human randomised placebo-controlled trial with a linear-growth primary endpoint (nagahawatta2026, n =
  80, 24 weeks) - positive on height but with a significant bone-age advance and in a 6-9 year old ISS
  population rather than a late one. Otherwise the human content of this round is the absence of trials:
  no sulfate donor, no organic osmolyte and no osmolality manipulation has been given to a human with a
  growth endpoint. The PIEZO1 material is mouse and cell culture.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The single human positive is in the wrong age group, buys 0.84 cm over 24 weeks, advances bone age, and has
  no attained-adult-height endpoint. Everything else in the round is either a negative search result or mouse
  data pointing away from the direction we want.
confidence: B
confidence_reason: >-
  The searches were run and their emptiness is reproducible; the PIEZO1 refutation rests on two papers and a
  node the atlas already held; the oyster trial is a randomised double-blind placebo-controlled design read
  from its abstract. Held at B rather than A because the sweep is Europe PMC only and a negative search is
  always weaker than a negative experiment - CORR-267 and CORR-284 both came from over-trusting an empty
  query.
claim_grades:
- claim: >-
    No organic osmolyte, sulfate donor, polyol-pathway agent or osmolality manipulation has ever been given
    with a mammalian bone-length endpoint.
  grade: B
  basis: >-
    Six query classes run on Europe PMC. Taurine returns 459 records whose growth endpoints are all
    aquaculture. Sulfate donors, aldose reductase agents, vasopressin/osmolality and NFAT5 activation return
    nothing skeletal with a length endpoint. Stated as a search result, not a law - CORR-267 and CORR-284 are
    the precedents for over-trusting an empty query, and the sulfate arm in particular deserves a targeted
    re-run because scherer2025's r = 0.70 makes it the most attractive untested substrate route.
- claim: >-
    PIEZO1 is a lead on the volume axis.
  grade: X
  basis: >-
    WITHDRAWN ONE DAY AFTER I WROTE IT - CORR-321, and the refutation was in this atlas since 6 August.
    piezo1_channel.yaml: Col2a1-Cre inactivation leaves linear skeletal growth "only mildly affected", the
    channel being required for the bone the plate produces rather than for the plate's output.
    tschaffonmller2026: Col10a1-Cre deletion in hypertrophic chondrocytes alters neither hypertrophic
    apoptosis nor transdifferentiation and reports no length effect. chen2025: Yoda1, the agonist, INDUCES
    cartilage degeneration. Under compression PIEZO1 drives ferroptosis and its BLOCKADE slows scoliosis. The
    therapeutic direction is inhibition.
- claim: >-
    PIEZO1 is expressed in the human growth plate and rises into the hypertrophic zone.
  grade: B
  basis: >-
    SURVIVES ROUND 295 INTACT and is the one thing that round genuinely added, because piezo1_channel.yaml
    itself recorded that "no study has localised PIEZO1 in human growth plate tissue". GSE9160, probe
    202771_at, detected in all five compartments of both donors; clean donor 8986 resting, 7893
    proliferative, 20594 prehypertrophic, 24442 hypertrophic against thresholds of 646-827. Expression is not
    function and it does not rescue the direction.
- claim: >-
    Fermented oyster extract increases linear growth in children.
  grade: B
  basis: >-
    nagahawatta2026 - randomised, double-blind, placebo-controlled, 80 children aged 6-9 with idiopathic
    short stature, 500 mg/day for 24 weeks. Height gain 3.22 +/- 0.71 against 2.38 +/- 0.74 cm, P < 0.001,
    with growth rate, height-SDS and serum IGF-1 all significantly higher and GH and IGFBP-3 unchanged.
    Single trial, single centre, 24 weeks, abstract-level read.
- claim: >-
    Fermented oyster extract is usable in this case.
  grade: X
  basis: >-
    NO, ON THE TRADE RATHER THAN THE EFFECT. BONE AGE INCREASED SIGNIFICANTLY in the treated group alongside
    urinary deoxypyridinoline. Buying 0.84 cm of height velocity while advancing skeletal maturation spends
    the remaining window instead of widening it - failure mode one, and the same trade this atlas rejected
    for the PRC2 class (round 281) and for GH after mid-puberty (rounds 254 and 269). The population is 6-9
    year olds with years of plate left; this subject is bone age 16, and no attained-adult-height endpoint
    exists for this agent.
- claim: >-
    The volume axis is not actionable today.
  grade: B
  basis: >-
    NOW EARNED RATHER THAN ASSERTED, which is the point of this round. The axis is the largest term in the
    height identity and has no agent pointing upward in any species. Every marketed tool on the machinery is
    an inhibitor; the one channel with an agonist has an agonist that degrades cartilage; and the substrate
    route with the best human anchor has never been given a length endpoint. The two cheapest routes out are
    named in gaps g_l5_what_is_the_intracellular_small_solute_content_of_a_hypertrophic_chondrocyte and the
    untested sulfate-donor experiment.
key_refs:
- ref_id: chen2025
  pmid: '41194970'
  year: 2025
  type: primary
  one_line_finding: >-
    Yoda1, the PIEZO1 agonist, INDUCES cartilage degeneration in growth-plate chondrocytes, reversibly by
    cilia disruption - the direct test of the agonist direction on the atlas's top-ranked height gene, and it
    is negative
- ref_id: tschaffonmller2026
  pmid: '42157948'
  year: 2026
  type: primary
  one_line_finding: >-
    Piezo1 deletion restricted to hypertrophic chondrocytes leaves hypertrophic apoptosis and
    transdifferentiation unaltered and reports no length effect - the loss-of-function test in the right cell
    type does not touch the volume phenotype
- ref_id: nagahawatta2026
  pmid: '42064572'
  year: 2026
  type: primary
  one_line_finding: >-
    Randomised placebo-controlled trial, 80 children, +0.84 cm over 24 weeks against placebo with IGF-1 up
    and GH unchanged - and bone age significantly advanced, which is the disqualifying trade for a late case
- ref_id: scherer2025
  year: 2025
  type: primary
  one_line_finding: >-
    Per-variant plasma sulfate effect correlates r = 0.70 with per-variant standing-height effect across
    466,907 people - the best human anchor on this axis and the substrate route nobody has tested with a
    length endpoint
contradicts: >-
  OVERTURNS ROUND 295'S PROMOTION OF PIEZO1, one day later, on evidence the atlas held before round 295 was
  written. The expression finding survives; the lead does not. See CORR-321.
  It does NOT overturn round 295's other conclusions - the reconciliation of cooper2013 with bush2008, the
  myo-inositol regrade from X to D, and the useful negatives on WNK2 and the sulfate transporters all stand.
  It converts round 295's asserted "not actionable" into a searched one.
