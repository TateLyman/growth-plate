contradicts:
- 'APPLIES R339 rather than contradicting it. R339 made the proposal conditional on a single measurement and
  the measurement now exists; this round applies the rule R339 wrote and adds the GH-specific mechanistic
  argument R339 did not have.'
- 'DOES NOT overturn R274 or R337. Those closed deeper LIGAND suppression, and this proposal accepts that
  closure completely - it is the reason the receptor is the remaining step.'
