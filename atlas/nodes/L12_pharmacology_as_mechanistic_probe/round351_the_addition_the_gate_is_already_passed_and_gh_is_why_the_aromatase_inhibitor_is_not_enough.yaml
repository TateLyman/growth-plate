id: round351_the_addition_the_gate_is_already_passed_and_gh_is_why_the_aromatase_inhibitor_is_not_enough
name: 'Round 351 - THE ADDITION. The subject''s own oestradiol of 3.3-6 pmol/L already passes the gate R339
  set for vepdegestrant, and the reason an aromatase inhibitor cannot finish the job in HIM specifically is
  that IGF-1 activates ERalpha without ligand - so the GH arm is feeding the receptor the AI is trying to
  silence'
aliases:
- vepdegestrant addition
- the E2 gate is passed
- IGF-1 activates ERalpha without ligand
- why the AI is not enough on GH
- the receptor arm is the open step
type: intervention
layer: L12
stub: false
summary: 'This atlas has spent many rounds looking for a compound and killing them. R339 already wrote the
  decision rule for the one obtainable agent aimed at the PERIOD, made it conditional on a single number, and
  then nobody applied the number when it arrived. THE OPERATOR STATED HIS OESTRADIOL IS 3.3-6 pmol/L. THAT
  PASSES THE GATE, IN THE DIRECTION R339 SAID WOULD MAKE THE ADDITION SENSIBLE.

  ONE - THE GATE, VERBATIM FROM R339, AND WHERE HE FALLS. albin2013 measured half-maximal growth acceleration
  in BOYS at an oestradiol of 6.5 pmol/L (95% CI 3.2-13). R339s rule: if E2 remains well above that on
  anastrozole, the growth-PROMOTING ascending limb of the biphasic oestrogen curve is still in use and
  ablating the receptor costs it - the sims2012 trade. If E2 is already at or below it, that limb is largely
  spent, there is little velocity left to lose, and the degrader adds blockade of the LIGAND-INDEPENDENT
  closure drive that no aromatase inhibitor can reach. AT 3.3-6 pmol/L HE IS AT OR BELOW THE POINT ESTIMATE
  AND INSIDE THE LOWER HALF OF THE CONFIDENCE INTERVAL. The ascending-limb cost has ALREADY BEEN PAID, by
  anastrozole. What remains unpaid is the closure drive.

  TWO - AND THE NEW ARGUMENT, WHICH IS SPECIFIC TO THIS SUBJECT AND WHICH THIS FILE HAS NEVER MADE: HE IS ON
  GROWTH HORMONE, AND IGF-1 ACTIVATES ERalpha WITHOUT LIGAND. Phosphorylation of ERalpha at Ser118 by Erk1/2
  MAPK and at Ser167 by AKT and p90RSK stimulates receptor activity in a ligand-independent manner
  (yamnik2010 for the Ser167 pathways). grissom2016 shows it IN VIVO IN THE RELEVANT CONFIGURATION -
  ovariectomised rats, i.e. an oestrogen-deplete animal, in which IGF-1 activates ERalpha and drives
  ERalpha-mediated transcription. THE SUBJECT IS AN OESTROGEN-DEPLETE ANIMAL WITH A DELIBERATELY ELEVATED
  GROWTH-FACTOR AXIS. So he is precisely the patient in whom suppressing the LIGAND leaves the most residual
  receptor activity, because his own GH arm supplies a ligand-independent input to the same receptor. That is
  a mechanistic reason - not a restatement of the ceiling - for why R274s finding that deeper ligand
  suppression buys nothing is what it is, and why the receptor is the step that is actually open.

  THREE - THE HONEST TENSION IN THAT ARGUMENT, STATED IMMEDIATELY. brjesson2012s ERalphaAF-1(0) mice have the
  AF-1 domain DELETED, are hyperactive, and CLOSED their plates while every wild-type stayed open - so
  closure does not REQUIRE AF-1, and Ser118/Ser167 are AF-1 sites. The IGF-1 argument is therefore an argument
  about residual receptor ACTIVITY that an AI cannot silence, NOT a demonstration that these phosphosites are
  the fusion signal. Both statements can be true: the closure drive is ligand-independent and AF-1-independent
  (which is why only removing the PROTEIN works), and growth-factor signalling additionally activates the
  receptor the AI is trying to quiet. Neither has ever been measured in a growth plate.

  FOUR - THE AGENT AND WHY IT IS THE ONLY ONE. The atlas own receptor-level oestrogen sweep closed every
  antioestrogen class on mechanism, writing that growth-plate closure runs on ERalpha functions that do not
  require ligand and that what would be needed is for the whole receptor protein to be gone, both activation
  functions and the membrane pool with it - and then said no drug does that. A PROTAC does exactly that.
  VEPDEGESTRANT (ARV-471, Veppanu) was FDA-approved on 1 May 2026, the first PROTAC ever approved, ORAL,
  200 mg once daily with food. R339 established that this is the one node in the whole file where the oncology
  dose is the right dose for a reason: everywhere else the atlas wants PARTIAL suppression of a band with an
  interior optimum, but here the target phenotype IS the protein absent - the ERalpha-null human - and
  oncology also wants maximal degradation, so the two indications coincide.

  FIVE - THE ORDERING THAT MAKES THE CASE, four perturbations of one receptor ranked by how much PROTEIN is
  removed, every row with a length or plate-status endpoint. Whole protein gone (ERalpha-/-): tibia +8.3%,
  growth plate height +18%, growth continues into old age. Protein gone in cartilage only: normal through
  puberty then grew PAST 4 months when controls stopped, giving INCREASED FEMUR LENGTH at 1 year, with the
  authors concluding plate ERalpha is dispensable early and essential for REDUCING longitudinal growth in
  ELDERLY mice - which inverts the compartment objection for a subject at BA16. One domain gone, receptor
  present and hyperactive (AF-1(0)): growth CEASED, tibia -4.9%, plates closed in ALL. Ligand-binding blocked,
  protein present (fulvestrant): NO effect in wild-type mice in three separate experiments each with its own
  working positive control. Remove the protein and the plate stays open; block a domain or the ligand and you
  get closure or nothing.

  SIX - STEP 0. Anastrozole removes LIGAND. R274 showed removing more ligand buys nothing, and R337 closed the
  loophole by showing letrozole suppresses every fraction deeper including the tissue estrone-sulfate
  reservoir and still delivers no extra height. Read together with brjesson2012 those say the ligand arm is
  SATURATED and the residual closure drive is ligand-independent. THE RECEPTOR IS THE ONE STEP NOTHING IN THIS
  STACK TOUCHES. Not CNP/cGMP, not FGFR3/ERK/CREB, not GH/IGF-1.

  SEVEN - THE REST OF THE STACK. GH is FAVOURABLE rather than neutral: oestrogen suppresses hepatic IGF-1, so
  removing ERalpha should RAISE IGF-1 at a fixed GH dose - the opposite of the metformin and letrozole
  problems. Erdafitinib is measured and clean: at steady state it moved midazolam, the index CYP3A4 probe, by
  GMRs of 86.3, 88.5 and 82.1 per cent with 1-OH-midazolam unchanged, and the authors conclude no clinically
  meaningful effect - so erdafitinib should not move vepdegestrant exposure, although all three ratios sit
  BELOW 100 so any real effect runs toward slightly lower exposure. Anastrozole is not redundant - ligand
  versus receptor - and has no described interaction, though none has been tested with a PROTAC. THE UNTESTED
  DIRECTION IS THE REVERSE: vepdegestrant on erdafitinib, which also runs through polymorphic CYP2C9.

  EIGHT - WHAT WOULD KILL IT, AND THE FIRST IS A HUMAN PAEDIATRIC TRIAL. sims2012 gave fulvestrant to 30
  growing girls for 12 months: bone-age advancement fell from 1.99 to 1.06 (p=0.0007) and PREDICTED ADULT
  HEIGHT DID NOT MOVE, 163.0 to 163.5 cm, because velocity fell with the clock. The defence - that fulvestrant
  is an AF-2 blocker and a poor in-vivo degrader, so the mechanism PREDICTS that null - is untested and
  convenient, and if a PROTAC reproduces that shape the class is closed for good. smith2008 bounds the upside:
  bone age still advanced from 15 to 17.5 years over 3.5 years with the receptor entirely absent, about 0.7
  bone-age years per calendar year, so complete ablation SLOWS the clock and never stops it - with one to two
  bone-age years left that buys of the order of half a calendar year. And zhang2023_era_chondrocyte is the
  cell-biological counter this atlas already held: ERalpha has a LIGAND-INDEPENDENT PROTECTIVE function in
  human chondrocytes, where overexpression reduced DNA damage and senescence, so removing the protein removes
  functions that blocking the ligand does not touch. Against that stands brjesson2010, where cartilage-specific
  protein removal EXTENDED growth in vivo.

  NINE - THE COST TO MEASURE, BECAUSE IT IS AN EFFICACY TERM AND NOT A SAFETY FOOTNOTE. ERalpha-null humans
  reach spine BMD Z of -3.85 falling to -5.6, unresponsive to oestradiol AND to tamoxifen. Under R278 a
  vertebral cost SUBTRACTS FROM THE GOAL, because the residual at this bone age is trunk-dominant. The one
  thing that makes it tolerable is that degradation is REVERSIBLE on stopping - ERalpha is resynthesised -
  which is what makes early detection worth anything and is not true of the genetic phenotype.

  TEN - AND THE MONITORING MUST TRACK BOTH TERMS OR THE FAILURE MODE READS AS SUCCESS. The sims2012 signature
  is delta-BA over delta-CA falling WITH velocity falling proportionally, netting zero; bone-age deceleration
  alone would look like a win. So: standing AND sitting height at a FIXED TIME OF DAY, because R319 showed the
  diurnal swing exceeds a year of expected gain; BoneXpert on the hand film rather than a by-eye read, because
  the three maturity methods spanned 0.5 years equal to 2.2 cm of predicted adult height; IGF-1; ultrasensitive
  oestradiol; and the vertebral cost by lateral thoracolumbar film plus DXA.

  ELEVEN - WHAT ACTUALLY BLOCKS IT IS REGULATORY, NOT BIOLOGICAL. Vepdegestrant is approved for ADULTS with
  ESR1-mutated advanced or metastatic breast cancer. There is no paediatric indication, no paediatric
  pharmacokinetics for this or any PROTAC, and no PROTAC has ever been given to a growing human. That is the
  honest status: an obtainable molecule with a coherent mechanism, a passed gate, a measured interaction
  profile and a monitoring plan - and zero precedent in the population.'
quantitative:
- parameter: 'THE GATE R339 SET, AND THE SUBJECT FALLS ON THE FAVOURABLE SIDE OF IT'
  value: 'albin2013: half-maximal growth acceleration in BOYS occurs at serum oestradiol 6.5 pmol/L, 95% CI
    3.2-13. carusonicolett1985: in 5 boys on double-blind crossover intravenous oestradiol, height velocity
    rose significantly ONLY at the LOWEST dose of 4 micrograms/day (E2 about 10 pg/mL), 0.45 to 1.38 mm per
    3 weeks, P<0.05, while 20 and 90 micrograms/day did less. ross2011: ultra-low-dose oestrogen ALONE gave an
    adult height WORSE than placebo (-3.39 vs -2.81 SDS) but the same exposure ADDED TO GH gained +0.32 SDS,
    about 2.1 cm - the growth contribution is GH-DEPENDENT. OPERATOR-STATED SUBJECT VALUE: oestradiol
    3.3-6 pmol/L on anastrozole 1 mg, which is at or below the albin2013 point estimate and in the lower half
    of its confidence interval'
  unit: pmol/L; SDS; mm per 3 weeks
  conditions: albin2013, carusonicolett1985 and ross2011 as already held in the atlas node
    estrogen_biphasic_dose_effect; subject oestradiol value stated by the operator 2026-08-13, assay method not
    specified.
  species: human
  source_ref: albin2013
  uncertainty: 'THE SUBJECT VALUE IS OPERATOR-REPORTED AND ITS ASSAY IS UNKNOWN, WHICH MATTERS MORE HERE THAN
    USUAL. 6.5 pmol/L is approximately 1.8 pg/mL, BELOW the functional sensitivity of routine immunoassays, so
    a value in this range is only trustworthy if it came from LC-MS/MS or an extraction assay; a routine
    immunoassay reporting a low number carries no information at this concentration. The gate is therefore
    passed on a number whose provenance should be confirmed. Note also that albin2013s confidence interval
    runs to 13 pmol/L, so a subject at 6 is not unambiguously past half-maximal.'
- parameter: 'IGF-1 ACTIVATES ERalpha WITHOUT LIGAND - WHY AN AROMATASE INHIBITOR CANNOT FINISH THE JOB IN A SUBJECT ON GH'
  value: 'Phosphorylation of ERalpha at specific AF-1 residues stimulates receptor activity in a
    LIGAND-INDEPENDENT manner: Ser118 is phosphorylated by Erk1/2 MAPK, and Ser167 by AKT and p90RSK, with the
    mTOR/S6K1 and MAPK/RSK pathways coordinately regulating Ser167 (yamnik2010). grissom2016 demonstrates the
    consequence IN VIVO in the configuration that matches this subject: in OVARIECTOMISED rats - an
    oestrogen-deplete animal - IGF-1 activates ERalpha and regulates ERalpha-mediated transcription, through
    mechanisms the authors attribute to modification of receptor phosphorylation sites'
  unit: qualitative - pathway to residue mapping
  conditions: yamnik2010 (in vitro breast cancer cells) and grissom2016 (ovariectomised rat hippocampus), both
    abstracts read 2026-08-13.
  species: rat
  source_ref: grissom2016
  atlas_derived: true
  uncertainty: 'THE APPLICATION TO THE GROWTH PLATE IS MINE AND IS GRADE E. Neither paper touches cartilage,
    bone or growth; grissom2016 is hippocampus and yamnik2010 is breast cancer cells. AND THERE IS A DIRECT
    TENSION WITH THE ATLASs OWN BEST EVIDENCE: brjesson2012s ERalphaAF-1(0) mice lack the domain containing
    Ser118 and Ser167, are hyperactive, and CLOSE their plates - so AF-1 is not required for closure and these
    phosphosites cannot be assumed to be the fusion signal. What survives is narrower and still useful: in a
    subject with suppressed ligand and a deliberately elevated growth-factor axis, the receptor retains an
    activating input that an aromatase inhibitor does not reach. Nobody has measured ERalpha phosphorylation,
    or ERalpha protein, in growth-plate chondrocytes under any of these conditions.'
- parameter: 'THE PROTEIN-REMOVED ORDERING - FOUR PERTURBATIONS OF ONE RECEPTOR WITH LENGTH OR PLATE-STATUS ENDPOINTS'
  value: 'ERalpha-/- whole protein absent: tibia +8.3% (P<0.01), growth plate height +18% (P<0.05), growth
    continues in old age. CARTILAGE-SPECIFIC ERalpha-/-: normal through puberty, then continued to grow after
    4 months when controls stopped, giving INCREASED FEMUR LENGTH at 1 year; authors conclude plate ERalpha is
    unimportant early and IS essential for reduction of longitudinal growth in ELDERLY mice. ERalphaAF-1(0),
    one domain deleted, receptor PRESENT and hyperactive: growth CEASED, tibia -4.9%, growth plates CLOSED in
    ALL animals while open in ALL wild-types. FULVESTRANT, AF-2 blockade, protein present: NO effect in
    wild-type in three separate experiments (sibonga1998, turner2000, movrareskrtic2014), each with its own
    positive control'
  unit: per cent change in tibia or femur; plate open or closed
  conditions: as held in the atlas node the_receptor_level_oestrogen_sweep; brjesson2012, brjesson2010 and
    movrareskrtic2014 read previously.
  species: mouse
  source_ref: brjesson2012
  uncertainty: 'ALL MOUSE, AND RODENT PLATES DO NOT FUSE AS HUMAN PLATES DO - this is the largest translation
    gap in the proposal. brjesson2010 is old FEMALE mice. The ordering is an ordering across four different
    genetic models from different laboratories, not a dose-response within one system, and no degrader was
    used in any of them: the inference that a PROTAC lands at the top of this ordering rather than in the
    middle with fulvestrant is exactly what has never been tested. The atlass own specified experiment - give
    an ERalpha PROTAC to a normal growing animal and measure ERalpha PROTEIN in growth-plate chondrocytes,
    plate height and bone length, with fulvestrant as the internal comparator - remains unrun.'
- parameter: 'THE COUNTER-EVIDENCE, INCLUDING A HUMAN PAEDIATRIC TRIAL AND A CHONDROCYTE-LEVEL COST'
  value: 'sims2012: fulvestrant in 30 growing girls over 12 months - bone-age advancement fell from 1.99 to
    1.06 (p=0.0007) while PREDICTED ADULT HEIGHT DID NOT MOVE, 163.0 to 163.5 cm, because height velocity fell
    with the clock. smith2008: in a human with an inactivating ERalpha mutation, bone age STILL ADVANCED from
    15 to 17.5 years over 3.5 years with the receptor entirely absent, about 0.7 bone-age years per calendar
    year. feigerlova2025: spine BMD Z-score -3.9 falling to -5.6, unresponsive to oestradiol AND tamoxifen.
    zhang2023_era_chondrocyte: in human chondrocytes, OA cells showed DNA damage and senescence with reduced
    ERalpha, and OVEREXPRESSING ERalpha REDUCED DNA damage and senescence - a ligand-independent PROTECTIVE
    function of the protein this proposal removes'
  unit: bone-age years per calendar year; cm; BMD Z-score
  conditions: all previously held in the atlas; zhang2023_era_chondrocyte is human articular chondrocytes in
    vitro, not growth plate.
  species: human
  source_ref: sims2012
  uncertainty: 'sims2012 IS THE WARNING SHOT AND ITS DEFENCE IS CONVENIENT. The claim that fulvestrant failed
    BECAUSE it is an AF-2 blocker and a poor in-vivo degrader predicts the null it produced, which is exactly
    the kind of unfalsifiable-sounding defence this file distrusts - and it is not testable without giving a
    PROTAC to a growing human. smith2008 bounds the entire upside at roughly half a calendar year of extra
    window given one to two bone-age years remaining, which is the same order as the aromatase inhibitors
    1.3 cm over 3 years, and is why sims2012 could net zero. zhang2023_era_chondrocyte is articular, in vitro,
    and in an OA/DNA-damage model, and it is directly opposed by brjesson2010 in vivo - but it is the atlass
    own registered argument against protein removal and is repeated here rather than quietly dropped.'
localization:
- 'the perturbation acts on ERalpha protein wherever it is expressed; brjesson2010s cartilage-specific
  deletion locates the growth-relevant compartment in the plate itself and, critically, LATE rather than early
  - dispensable through puberty, essential for terminating growth in old animals'
human_evidence: indirect
human_evidence_note: 'The direction is anchored by human genetics - ERalpha-inactivating mutation and
  aromatase deficiency give continued growth and unfused plates - and the subject-specific gate is a human
  dose-response (albin2013, carusonicolett1985, ross2011). The agent has extensive adult human safety and
  dosing data but ZERO skeletal, chondrocyte or growth data in any species, and no PROTAC has been given to a
  growing human. The one human paediatric trial on this axis, sims2012, used a different mechanism and was
  null on predicted adult height.'
species_basis:
- human
- mouse
- rat
translation_risk: high
translation_risk_reason: 'The protein-removed ordering is entirely mouse and rodent plates do not fuse as
  human plates do; the agent has no growth data in any species; the upside is bounded by smith2008 at roughly
  half a calendar year; and the one human trial on the axis netted zero on predicted adult height.'
confidence: C
claim_grades:
- claim: The subject's stated oestradiol places him at or below the half-maximal growth-promoting concentration.
  grade: C
  basis: 'albin2013 puts half-maximal growth acceleration in boys at 6.5 pmol/L (95% CI 3.2-13) and the
    operator states 3.3-6 pmol/L. Graded C not B because the value is operator-reported with an unspecified
    assay, 6.5 pmol/L is below the functional sensitivity of routine immunoassays, and the confidence interval
    extends to 13.'
- claim: The receptor arm is a step nothing in this stack touches, and the ligand arm is saturated.
  grade: B
  basis: 'R274 showed anastrozole equals letrozole on height and R337 showed letrozole suppresses every
    oestrogen fraction deeper, including the tissue estrone-sulfate reservoir, without buying height - so
    deeper LIGAND suppression is spent. brjesson2012 and movrareskrtic2014 show closure runs on
    ligand-independent receptor function. The step is open.'
- claim: Being on growth hormone makes an aromatase inhibitor less sufficient, because IGF-1 activates ERalpha without ligand.
  grade: E
  basis: 'MECHANISTIC INFERENCE. yamnik2010 and grissom2016 establish that growth-factor signalling activates
    ERalpha without ligand, and grissom2016 does so in vivo in an oestrogen-deplete animal - the matching
    configuration. But neither touches cartilage or growth, and brjesson2012s AF-1(0) mice show closure does
    not require the domain containing these phosphosites. Recorded as an argument about residual receptor
    activity, not as a demonstrated fusion mechanism.'
- claim: Vepdegestrant should be added to this stack.
  grade: D
  basis: 'It is obtainable, oral, once daily, at a dose whose oncology rationale coincides with this one; it
    removes the whole protein, which is what the atlas own sweep specified and said no drug does; Step 0 is
    clean; the erdafitinib interaction is measured and unremarkable; the GH interaction is favourable; and the
    gate R339 set is passed. Against: sims2012 netted zero on predicted adult height with a different
    mechanism, smith2008 bounds the upside near half a calendar year, the vertebral cost is an efficacy term,
    there is a registered ligand-independent protective function of ERalpha in chondrocytes, and no PROTAC has
    ever been given to a growing human. Grade D is a reasoned proposal with a monitoring plan - not a
    recommendation, and it needs a clinician who will own it.'
