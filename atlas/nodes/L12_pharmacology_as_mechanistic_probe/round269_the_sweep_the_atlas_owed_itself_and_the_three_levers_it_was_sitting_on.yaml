id: round269_the_sweep_the_atlas_owed_itself_and_the_three_levers_it_was_sitting_on
name: >-
  ROUND 269 - CORR-272 run rather than recommended. Of 1427 references with abstracts, 596 report a
  longitudinal LENGTH endpoint and 231 have never had a single number extracted into this graph. The top of
  that list splits three things the stack treats as single - GH's local ceiling is SOCS2, serum IGF-1 does
  not predict growth potential, and oestrogen at the plate is TWO receptors pulling in opposite directions
aliases:
- round 269
- the length endpoint sweep
- SOCS2 is why GH stops working
- oestrogen is two receptors
- cartilage-targeted IGF-1
type: dataset
layer: L12
stub: false
summary: >-
  CORR-272 ENDED WITH A RULE - when the question is about length, search the REFERENCES the graph cites,
  not the graph's own prose, because this atlas routinely records one finding from a paper and drops the
  rest. xiu2022 sat here for months as a signalling edge while its femur measurements went unread. A rule
  that is not run is not a rule, so it was run.

  ONE - THE COUNT, AND IT IS WORSE THAN THE xiu2022 CASE SUGGESTED.
  atlas/tools/round269_length_endpoints_the_atlas_is_sitting_on.py takes all 1539 bibliography entries,
  fetches the 1427 with PMIDs from PubMed, and asks two questions of each: does the abstract report a
  BONE, LIMB or BODY LENGTH endpoint - deliberately excluding zone heights, plate widths and areas, which
  CORR-189 says are not growth measures - and has any node in this graph ever recorded a quantitative
  finding from it. 596 REFERENCES REPORT A LENGTH ENDPOINT. 231 OF THEM HAVE NEVER HAD A NUMBER EXTRACTED.
  Eighty-three of the 231 report a GAIN rather than an impairment. AND THE SHARPEST DETAIL IS THAT ALL
  THREE PAPERS THIS ROUND TURNS ON WERE ALREADY IN THE BIBLIOGRAPHY, under ref_ids this session had never
  seen - samvelyan2022, tailor2024, chou2025. THE ATLAS HAS BEEN COLLECTING THESE PAPERS AND NOT READING
  THEM. That is a different and more embarrassing failure than not finding them.

  TWO - WHY GROWTH HORMONE STOPS WORKING, AND IT IS NOT A MYSTERY, IT IS A NAMED PROTEIN. Round 254
  measured the empirical fact - GH after mid-puberty contributes about zero to attained height - and this
  atlas has never held the mechanism. dobie2015 has it. WILD-TYPE METATARSALS DO NOT LENGTHEN IN RESPONSE
  TO GH AT ALL over twelve days in culture, and in the same bones GH raises Socs2 messenger RNA
  SEVENTEEN-FOLD by day seven, with Socs1 and Socs3 unchanged. In Socs2-null metatarsals GH DOES enhance
  linear growth, from day seven to day twelve. GH INDUCES ITS OWN INHIBITOR AT THE GROWTH PLATE, and the
  induction is specific to SOCS2 among the three family members tested. The local GH response is a
  self-limiting loop by construction.
  AND THE PRICE OF REMOVING THE BRAKE IS MEASURED, IN A SECOND PAPER ALSO ALREADY HELD HERE. samvelyan2022
  reports that Socs2-null mice have a TWELVE-FOLD HIGHER DENSITY OF GROWTH PLATE BRIDGES than wild type -
  14.4 versus 1.2 in sham-operated animals - and concludes that enhanced GH signalling through SOCS2
  deletion ACCELERATES GROWTH PLATE FUSION. SO THE SOCS2 BRAKE BUYS DURATION AND SPENDS RATE, AND REMOVING
  IT DOES THE REVERSE. That is the same trade the whole GH literature shows at the whole-organism level,
  and here it is at one protein.

  THREE - AND THE LOCAL GH EFFECT DOES NOT RUN THROUGH IGF-1, WHICH MATTERS FOR THIS CASE SPECIFICALLY. In
  Socs2-null metatarsals that were growing faster under GH, IGF-1 transcript and protein were NOT raised,
  conditioned-medium IGF-1 was unchanged, and growth-plate Igf1 messenger RNA was not elevated in juvenile
  Socs2-null mice. What GH did raise was IGFBP-3, and Igf2. The growth was abolished when the IGF RECEPTOR
  was inhibited - so it is IGF1R-dependent and IGF-1-INDEPENDENT, running through IGF-2.
  AND THE SERUM NUMBER IS A POOR PREDICTOR, WITH A FOUR-GENOTYPE DEMONSTRATION. dobie2015's introduction
  reports the Yakar comparison: acid-labile-subunit nulls with 60 per cent less serum IGF-1 were 8 PER CENT
  SHORTER; IGFBP-3 nulls with 40 per cent less were 5 PER CENT LONGER; liver-IGF-1-deficient mice with 80
  per cent less were OF EQUAL LENGTH; and triply deficient animals with 2.5 PER CENT OF WILD-TYPE
  CIRCULATING IGF-1 were only 6 per cent shorter. SERUM IGF-1 DID NOT PREDICT LINEAR GROWTH POTENTIAL
  ACROSS ANY OF THEM. This does not make an IGF-1 of 198 irrelevant; it makes it a poor single readout of
  the thing that matters, which is IGF signalling AT THE PLATE.

  FOUR - AND THERE IS A MOLECULE FOR THAT, AND IT IS FURTHER ALONG THAN ANYTHING ELSE THIS ATLAS HAS FOUND
  ON THE IGF ARM. lui2019 and tailor2024 describe CV1574-1, a fusion of IGF-1 with a single-chain human
  antibody fragment against MATRILIN-3, a growth plate cartilage matrix protein. It has now been run in TWO
  independent models - the GH-deficient lit mouse, and wild-type mice made GH-resistant with PEGVISOMANT.
  In the second, once-daily injection for five days PARTIALLY RESTORED the pegvisomant-induced fall in
  growth plate height WITHOUT increasing kidney cell proliferation. It showed SIGNIFICANTLY REDUCED
  HYPOGLYCAEMIA compared with IGF-1 itself, which is the dose-limiting toxicity of recombinant IGF-1 in
  man. And the mechanism of the targeting is not merely biodistribution: CV1574-1 caused a PROLONGED
  increase in AKT signalling relative to IGF-1, and the prolongation was MATRILIN-3 DEPENDENT. Alternate-day
  dosing sufficed where IGF-1 alone did not.
  THE LIMIT IS THE ENDPOINT AND IT IS THE ONE THIS FILE KEEPS GETTING CAUGHT BY. BOTH PAPERS MEASURE GROWTH
  PLATE HEIGHT. NEITHER MEASURES BONE LENGTH. CORR-189 covers this by name, and round 268 has just finished
  demonstrating what happens when a plate gets taller and the bone does not.

  FIVE - OESTROGEN AT THE GROWTH PLATE IS TWO RECEPTORS PULLING OPPOSITE WAYS, AND BOTH HAVE
  CARTILAGE-SPECIFIC KNOCKOUTS WITH LENGTH ENDPOINTS. This is the finding with the most direct bearing on
  the stack.
  ERALPHA IS THE BRAKE, AND IT IS LOCAL. borjesson2010 made a cartilage-specific ERalpha knockout. Skeletal
  growth during early sexual maturation was NORMAL - so no pubertal spurt was lost. High-dose oestradiol
  reduced growth plate height in controls and DID NOT in the cartilage-specific nulls. And the adult
  cartilage-specific nulls CONTINUED TO GROW AFTER FOUR MONTHS WHILE CONTROLS STOPPED, giving INCREASED
  FEMUR LENGTH AT ONE YEAR. Critically, TOTAL ERalpha inactivation DID disturb longitudinal growth - and
  did so through the GH/IGF-1 axis. The brake is in the cartilage; the benefit is systemic.
  GPER-1 IS THE ACCELERATOR, AND IT IS ALSO LOCAL. chou2021 made a chondrocyte-specific GPER-1 knockout:
  DECREASED body crown-rump length, DECREASED tibia and femur length at eight weeks, fewer proliferating
  chondrocytes, thinner proliferative zone. chou2025 adds pharmacology in both directions - the GPER-1
  agonist G1 raised proliferative zone thickness and chondrocyte proliferation and RAISED THE PTHrP/Ihh
  RATIO at four and eight weeks, while the antagonist G15 and the knockout lowered all of them.
  SO A SYSTEMIC AROMATASE INHIBITOR REMOVES THE LIGAND FOR BOTH RECEPTORS AT ONCE. It takes the brake off
  ERalpha, takes the accelerator off GPER-1, and removes oestrogen's systemic amplification of the GH/IGF-1
  axis. THAT IS A MECHANISTIC EXPLANATION FOR WHY THE MEASURED ATTAINED-HEIGHT YIELD OF THIS CLASS IS SMALL
  - round 254 put anastrozole at 0.8 cm and letrozole at 4.2 cm - DESPITE LARGE BONE-AGE DELAYS. The class
  is fighting itself. The lever this atlas has never held is ERalpha antagonism at the plate that SPARES
  GPER-1, and both a GPER-1 agonist (G1) and a GPER-1 antagonist (G15) exist as tool compounds.
quantitative:
- parameter: >-
    THE SWEEP - LENGTH ENDPOINTS IN THE BIBLIOGRAPHY THAT THIS GRAPH HAS NEVER MINED
  value: >-
    1539 references, 1427 with PMIDs, 1420 abstracts retrieved; 596 report a longitudinal bone, limb or
    body LENGTH endpoint; 231 of those have NEVER had a quantitative finding recorded in any node; 83 of
    the 231 report a GAIN rather than an impairment
  unit: number of references
  conditions: >-
    atlas/tools/round269_length_endpoints_the_atlas_is_sitting_on.py. A reference counts as "mined" only if
    it appears as a source_ref in some node's quantitative block - appearing in key_refs or in an edge does
    NOT count, because that is exactly the xiu2022 state in which a paper is cited for a mechanism and its
    measurements are never extracted. Zone heights, plate thickness and areas are excluded from the length
    regex per CORR-189. Full ranked output archived at atlas/data/round269/length_endpoints_sweep.tsv.
  species: not_applicable
  source_ref: chu2025
  uncertainty: >-
    THIS IS A POINTER LIST, NOT A FINDING, AND AN ABSTRACT-LEVEL REGEX AT THAT. It will over-count, because
    a review mentioning "linear growth" matches and carries no data of its own; and it will under-count,
    because a paper whose abstract omits its length endpoint is invisible. Every hit must be read in full
    before anything is graded - which is the whole point of CORR-270. The "never mined" test is also
    conservative in one direction and generous in another: it will flag a paper whose one relevant number
    lives in an edge rather than a node.
- parameter: >-
    GROWTH HORMONE INDUCES ITS OWN INHIBITOR AT THE GROWTH PLATE, AND WITHOUT IT THE PLATE DOES NOT RESPOND
    TO GH AT ALL
  value: >-
    wild-type E17 metatarsals did NOT increase in length in response to GH over 12 days, while showing a
    SEVENTEEN-FOLD increase in Socs2 mRNA at day 7 (P < 0.01) with Socs1 and Socs3 unchanged; Socs2-null
    metatarsals DID increase in length under GH from day 7 to day 12 (P < 0.05). In postnatal day 3
    metatarsals the same pattern held with a 4-fold Socs2 induction
  unit: metatarsal length in organ culture, and fold change in transcript
  conditions: >-
    dobie2015, read in full from PMC4949688. Embryonic day 17 and postnatal day 3 mouse metatarsal organ
    culture, GH or IGF-1 at 100 ng/ml over 12 days. IGF-1 induced growth was unaffected by SOCS2 status, so
    SOCS2 acts on the GH limb specifically.
  species: mouse
  source_ref: dobie2015
  uncertainty: >-
    EX VIVO METATARSAL, THE PREPARATION THIS FILE HAS BEEN BURNED BY TWICE - caetanosilva2021 puts such
    cultures at about half the in vivo rate and newton2018's advantage did not survive into the animal.
    Embryonic and neonatal tissue, not juvenile, so the stage is wrong for this case by a wide margin. What
    transfers is the LOOP, not the magnitude: GH raises SOCS2 and SOCS2 gates the GH response.
- parameter: >-
    REMOVING THE SOCS2 BRAKE ACCELERATES GROWTH PLATE FUSION - RATE BOUGHT WITH DURATION
  value: >-
    growth plate bridge DENSITY 14.4 (SD 0.7) in Socs2-null sham versus 1.2 (SD 0.5) in wild-type sham, and
    13.0 (SD 0.5) versus 2.2 (SD 0.9) after surgery - about a twelve-fold increase; the authors conclude
    SOCS2 deletion ACCELERATES GROWTH PLATE FUSION
  unit: growth plate bridge density and number, by micro-CT
  conditions: >-
    samvelyan2022, Bone Joint Res 11:162, read in full. Socs2-null versus wild-type mice, destabilisation
    of the medial meniscus versus sham, histology and micro-CT. Socs2-null mice are the established
    accelerated-growth model.
  species: mouse
  source_ref: samvelyan2022
  uncertainty: >-
    AN INTERNAL INCONSISTENCY IN THE SOURCE IS RECORDED RATHER THAN RESOLVED IN THE CONVENIENT DIRECTION.
    The abstract states an increase in both NUMBER and DENSITY of bridges, but the numbers it gives for
    bridge NUMBER are LOWER in the knockout - 187 versus 495 in sham - while density is higher. Only the
    density figures support the stated direction. The fusion conclusion is also drawn in a paper whose
    primary question is osteoarthritis vulnerability, not growth, and no bone length is reported here.
- parameter: >-
    SERUM IGF-1 DOES NOT PREDICT LINEAR GROWTH POTENTIAL - FOUR GENOTYPES, TWO OF THEM IN THE WRONG
    DIRECTION
  value: >-
    acid-labile-subunit null, 60 per cent lower serum IGF-1, 8 per cent SHORTER; IGFBP-3 null, 40 per cent
    lower, 5 per cent LONGER; liver-IGF-1-deficient, 80 per cent lower, EQUAL length; triply deficient with
    2.5 per cent of wild-type circulating IGF-1, only 6 per cent shorter
  unit: body length, per cent versus wild type
  conditions: >-
    Reported in the introduction of dobie2015, attributed to Yakar and colleagues 2009.
  species: mouse
  source_ref: dobie2015
  uncertainty: >-
    THIS IS A SECONDARY CITATION AND IS GRADED AS ONE. The Yakar primary has NOT been read and is not yet
    identified by PMID in this bibliography - it is on the ask list. Numbers quoted from another paper's
    introduction are exactly the failure mode CORR-268 and CORR-270 were written about, and they are
    recorded here as a POINTER, not as a measurement, until the primary is in hand.
- parameter: >-
    CARTILAGE-TARGETED IGF-1 - TWO MODELS, HYPOGLYCAEMIA SOLVED, AND A PROXY ENDPOINT
  value: >-
    CV1574-1, an anti-matrilin-3 single-chain antibody fragment fused to IGF-1. Once-daily injection for 5
    days PARTIALLY RESTORED the pegvisomant-induced decrease in GROWTH PLATE HEIGHT without increasing
    kidney cell proliferation, with SIGNIFICANTLY REDUCED hypoglycaemic effect versus IGF-1 itself, and a
    PROLONGED increase in AKT signalling that was matrilin-3 dependent
  unit: growth plate height, kidney cell proliferation, blood glucose, AKT phosphorylation
  conditions: >-
    tailor2024, read in full from PMC11756323 - wild-type C57BL/6 mice made GH-resistant with pegvisomant.
    Builds on lui2019, which used the GH-deficient lit mouse and found alternate-day injections sufficient
    where IGF-1 alone was not.
  species: mouse
  source_ref: tailor2024
  uncertainty: >-
    THE ENDPOINT IN BOTH PAPERS IS GROWTH PLATE HEIGHT AND NEITHER MEASURES BONE LENGTH. CORR-189 covers
    this by name and round 268 has just finished cataloguing the seventh case in which a taller plate did
    not become a longer bone. Five days of dosing in an induced-resistance model is short. lui2019 itself
    is not open access and only its abstract is held.
- parameter: >-
    THE OESTROGEN BRAKE IS LOCAL AND SEPARABLE FROM THE OESTROGEN BENEFIT - TWO CARTILAGE-SPECIFIC
    KNOCKOUTS POINTING OPPOSITE WAYS
  value: >-
    ERalpha, cartilage-specific null - growth NORMAL through early sexual maturation, PROTECTED from
    high-dose oestradiol's reduction of growth plate height, and CONTINUED TO GROW AFTER 4 MONTHS while
    controls stopped, giving INCREASED FEMUR LENGTH at 1 year; total ERalpha null DID disturb growth, via
    the GH/IGF-1 axis. GPER-1, chondrocyte-specific null - DECREASED crown-rump length, DECREASED tibia and
    femur length at 8 weeks, fewer proliferating chondrocytes; the agonist G1 raised proliferative zone
    thickness and the PTHrP/Ihh ratio, the antagonist G15 lowered them
  unit: femur and tibia length, crown-rump length, growth plate and zone height, PTHrP/Ihh ratio
  conditions: >-
    borjesson2010 for ERalpha - cartilage-specific inactivation, adult and one-year timepoints, with a
    high-dose oestradiol challenge. chou2021 for GPER-1 - Col2a1-Cre chondrocyte-specific knockout, tibia
    and femur length at 8 weeks, GPER-1 highly expressed at 4 and 8 weeks and declining through 12 to 16
    weeks. chou2025 adds G1 and G15 pharmacology and the PTHrP/Ihh mechanism.
  species: mouse
  source_ref: chou2021
  uncertainty: >-
    borjesson2010 IS NOT OPEN ACCESS AND ONLY ITS ABSTRACT IS HELD - the magnitude of the one-year femur
    difference, the group sizes and the sex distribution are unknown to this atlas and are on the ask list.
    The two knockouts are from different laboratories with different Cre drivers and different ages at
    readout, so "opposite directions" is an inference across studies rather than a within-experiment
    contrast; nobody has deleted both. And a mouse plate does not fuse, which is the standing limit on
    every duration claim transferred from this species.
localization:
- 'growth plate chondrocyte: where SOCS2 is induced by GH seventeen-fold and gates the GH response'
- 'cartilage ERalpha: the local brake - deleting it in cartilage alone lengthens the femur by one year'
- 'chondrocyte GPER-1: the local accelerator - deleting it in chondrocytes alone shortens tibia and femur'
- 'matrilin-3 in the cartilage matrix: the address CV1574-1 binds, and the reason its AKT signal is
  prolonged'
human_evidence: absent
human_evidence_note: >-
  Every finding in this round is mouse. The human relevance is indirect - the SOCS2 loop offers a mechanism
  for the human observation that GH after mid-puberty adds nothing to attained height, and the two-receptor
  oestrogen picture offers one for the small attained-height yield of aromatase inhibitors in man.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: >-
  Ex vivo metatarsal culture for the SOCS2 loop, conditional knockouts for the oestrogen receptors in a
  species whose growth plate does not fuse, and a proxy endpoint for the targeted-IGF-1 molecule.
confidence: B
confidence_reason: >-
  The sweep itself is computed and reproducible from a committed tool and its output is archived. The three
  biological lines are each carried by full texts read directly, with the sole exceptions named in their
  own uncertainty fields - borjesson2010 and lui2019 are abstract-only and the Yakar comparison is a
  secondary citation. Held at B rather than A because the load-bearing endpoints are mouse and two of the
  five quantitative rows rest on documents this atlas does not yet hold in full.
claim_grades:
- claim: >-
    This atlas has read the length endpoints in the papers it cites.
  grade: X
  basis: >-
    NO. 231 of 1427 references carry a bone, limb or body length endpoint in their abstract and have never
    had a single number extracted into any node. Eighty-three of those report a gain. All three papers this
    round turns on were ALREADY IN THE BIBLIOGRAPHY under ref_ids this session had not seen.
- claim: >-
    Growth hormone's effect on the growth plate is self-limiting through SOCS2.
  grade: C
  basis: >-
    dobie2015 - wild-type metatarsals do not lengthen under GH at all while inducing Socs2 seventeen-fold,
    and Socs2-null metatarsals do lengthen. One laboratory, ex vivo, embryonic and neonatal tissue. Graded
    C because the preparation is the one this file has twice been burned by and the stage is far from the
    subject's. The loop is what transfers, not the magnitude.
- claim: >-
    Removing the SOCS2 brake would add final height.
  grade: X
  basis: >-
    THE OPPOSITE IS MEASURED. samvelyan2022 reports about a twelve-fold higher growth plate bridge density
    in Socs2-null mice and concludes SOCS2 deletion ACCELERATES GROWTH PLATE FUSION. Faster growth against
    earlier closure is the same trade round 254 measured for GH at the whole-organism level, and no bone
    length is reported in that paper to settle the net.
- claim: >-
    The local growth-plate response to GH requires a rise in IGF-1.
  grade: X
  basis: >-
    NO. In Socs2-null metatarsals growing faster under GH, IGF-1 transcript and protein were not raised,
    conditioned-medium IGF-1 was unchanged, and growth-plate Igf1 mRNA was not elevated in juvenile
    Socs2-null mice. IGFBP-3 and Igf2 rose instead, and the growth was abolished by IGF receptor
    inhibition - IGF1R-dependent and IGF-1-independent.
- claim: >-
    Serum IGF-1 predicts linear growth potential.
  grade: D
  basis: >-
    FOUR GENOTYPES SAY NO, TWO OF THEM IN THE WRONG DIRECTION - IGFBP-3 nulls with 40 per cent less serum
    IGF-1 were 5 per cent LONGER, liver-IGF-1-deficient mice with 80 per cent less were of EQUAL length.
    GRADED D AND NOT LOWER BECAUSE THIS IS A SECONDARY CITATION from dobie2015's introduction and the Yakar
    primary has not been read. It qualifies the case fact of an IGF-1 of 198 - the serum number is a poor
    single readout of IGF signalling at the plate - but it does not settle it.
- claim: >-
    Cartilage-targeted IGF-1 increases bone length.
  grade: E
  basis: >-
    NOT MEASURED BY EITHER PAPER. lui2019 and tailor2024 both report GROWTH PLATE HEIGHT. The molecule is
    real, works in two independent models, is matrilin-3 dependent, prolongs AKT signalling relative to
    IGF-1 and substantially reduces its hypoglycaemia - but the step from a taller plate to a longer bone
    is precisely the step round 268 has just catalogued seven failures of.
- claim: >-
    Oestrogen's action on the growth plate is a single axis that an aromatase inhibitor can simply remove.
  grade: X
  basis: >-
    NO - THREE RECEPTORS, AT LEAST TWO OF THEM LOCAL AND OPPOSED. Cartilage-specific ERalpha deletion
    protects the plate from oestradiol and gives INCREASED femur length at one year; chondrocyte-specific
    GPER-1 deletion gives DECREASED tibia, femur and body length; and total ERalpha deletion disturbs
    growth through the systemic GH/IGF-1 axis. A systemic aromatase inhibitor removes the ligand for all
    three at once, which is a mechanistic account of why the class delays bone age substantially and adds
    little attained height.
- claim: >-
    ERalpha antagonism at the plate that spares GPER-1 is a lever this atlas has evaluated.
  grade: E
  basis: >-
    IT IS NOT - IT IS NEW HERE, AND IT IS AN INFERENCE ACROSS TWO KNOCKOUTS FROM DIFFERENT LABORATORIES
    WITH DIFFERENT CRE DRIVERS AND DIFFERENT READOUT AGES. Nobody has deleted both receptors, nobody has
    given an ERalpha-selective antagonist to a normal growing animal with a length endpoint, and the
    tool compounds that exist (G1, G15) act on GPER-1 rather than on ERalpha. Recorded as the round's
    open proposal, not as a recommendation.
key_refs:
- ref_id: dobie2015
  pmid: '25833299'
  year: 2015
  type: primary
  one_line_finding: >-
    READ IN FULL - wild-type metatarsals do not lengthen under GH at all while inducing Socs2
    seventeen-fold, Socs2-null metatarsals do, and the growth is IGF-1-independent but IGF1R-dependent,
    running through IGF-2 and IGFBP-3
- ref_id: samvelyan2022
  pmid: '35272487'
  year: 2022
  type: primary
  one_line_finding: >-
    The price of removing the brake - Socs2-null mice show about a twelve-fold higher growth plate bridge
    density and the authors conclude SOCS2 deletion accelerates growth plate fusion
- ref_id: tailor2024
  pmid: '39850478'
  year: 2024
  type: primary
  one_line_finding: >-
    READ IN FULL - CV1574-1, an anti-matrilin-3 scFv fused to IGF-1, partially restores growth plate height
    in pegvisomant-induced GH resistance with markedly less hypoglycaemia than IGF-1 and a prolonged,
    matrilin-3-dependent AKT signal; the endpoint is plate height, not bone length
- ref_id: chou2021
  pmid: '34490260'
  year: 2021
  type: primary
  one_line_finding: >-
    Chondrocyte-specific GPER-1 deletion SHORTENS tibia, femur and crown-rump length with fewer
    proliferating chondrocytes - the local oestrogen receptor that pushes growth, opposite in sign to
    cartilage ERalpha
- ref_id: chou2025
  pmid: '40588242'
  year: 2025
  type: primary
  one_line_finding: >-
    Pharmacology in both directions on the same receptor - the GPER-1 agonist G1 raises proliferative zone
    thickness and the PTHrP/Ihh ratio, the antagonist G15 and the knockout lower them
- ref_id: brjesson2010
  pmid: '20564247'
  year: 2010
  type: primary_abstract_only
  one_line_finding: >-
    Cartilage-specific ERalpha inactivation leaves early sexual maturation growth normal, blocks
    high-dose oestradiol's reduction of plate height, and lets adults KEEP GROWING past four months for
    INCREASED FEMUR LENGTH at one year - while TOTAL ERalpha loss disturbs growth via the GH/IGF-1 axis
- ref_id: lui2019
  pmid: '30765323'
  year: 2019
  type: primary_abstract_only
  one_line_finding: >-
    The first cartilage-targeted IGF-1 paper - fusion proteins retained cartilage binding and IGF-1
    activity and raised growth plate height in the GH-deficient lit mouse with alternate-day dosing
contradicts: >-
  Does not overturn a prior node. It EXECUTES the rule CORR-272 ended with, and the execution is itself the
  finding: 231 references in this bibliography carry a length endpoint from which no number has ever been
  taken, and the three papers this round turns on were already collected here under ref_ids the session had
  not seen. It supplies the missing MECHANISM for round 254's empirical finding that growth hormone after
  mid-puberty adds nothing to attained height - GH induces SOCS2 seventeen-fold at the plate and SOCS2
  gates the response - and it splits the duration term's oestrogen axis into a local brake (ERalpha) and a
  local accelerator (GPER-1) that a systemic aromatase inhibitor cannot separate, which is a mechanistic
  account of that class's small attained-height yield.
builds_on: round268_hedgehog_is_bounded_on_both_sides_and_the_withdrawal_lever_is_refuted_in_three_species
