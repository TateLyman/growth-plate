contradicts: >-
  RAISES A CONFLICT WITH round241_the_root_cell_brake_is_a_self_secreted_antagonist_screen AND
  round243_the_root_state_is_tgf_beta_off_and_four_systems_evolved_four_ways_to_hold_it_there, which place
  the human root cell in a BMP-Smad1/5-LOW state, and with the ambrosi2025 arm of round252, whose
  independently derived combination includes the BMP inhibitor DMH1. tateiwa2022 shows RARgamma antagonists
  RAISING pSmad1 and Id1-luc reporter activity while RARgamma agonists suppress them. The retinoid arm and
  the root-cell arm therefore make opposite predictions about BMP-Smad1/5 in the target cell. NOT RESOLVED
  HERE. Three reconciliations are available - different compartments, an artefact of the ectopic BMP-2
  model, or genuine incompatibility - and only the normal-growing-animal experiment with resting-zone counts
  and length discriminates between them.
