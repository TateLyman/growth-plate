id: round260_the_7c_dossier_and_the_bmp_smad_conflict
name: >-
  ROUND 260 - the 7C dossier, and the conflict it creates with this atlas's own root cell. 7C raises SOX9
  WITHOUT BMP-2, has a genetic specificity control, and is called an inverse agonist by its own authors -
  but it also RAISES BMP-Smad1, and the root cell is defined by holding BMP-Smad1/5 DOWN
aliases:
- round 260
- 7C dossier
- WO 2005/066115
- the BMP-Smad conflict
type: intervention
layer: L12
stub: false
summary: >-
  tateiwa2022 PULLED IN FULL. The compound is better than round 259 could show, AND it creates a conflict
  with the root-cell programme that this atlas has to carry rather than resolve.

  ONE - THE DOSSIER. IDENTITY AND SOURCING. 7C is described in PATENT WO 2005/066115 A2 and was SYNTHESISED
  TO ORDER by Atomax Chemicals, Shenzhen. It has NO CAS number in this paper, unlike its matched agonist
  NRX204647 (CAS 1351452-80-6). Structures for both are in Supplementary Figure S1, which states they have
  similar size, organophilicity and structure. IT IS NOT A CATALOGUE REAGENT - obtaining it means custom
  synthesis from a patent, and that is a real practical obstacle rather than a detail.
  DOSES ACTUALLY USED. In vitro 50 nM (against NRX204647 at 100 nM), in ATDC5 cells and MSCs in chondrogenic
  medium. In vivo LOCAL: 7C-loaded polylactide nanoparticles at 0.3, 1.0 and 5.0 micrograms per collagen
  sponge pellet with 1.5 micrograms rhBMP-2, implanted in mouse dorsal fascia, dose-dependent on bone
  volume, n = 17 to 25 per group. PLA is FDA-approved as a carrier and the NPs give extended release. THE
  SYSTEMIC DOSE IS NOT IN THIS PAPER - it is in uchibe2017, which is not open access.
  THE SPECIFICITY CONTROL IS GENETIC AND IT IS THE BEST FEATURE. "NEITHER SELECTIVE RARgamma AGONIST NOR
  ANTAGONIST EXHIBIT THEIR EFFECTS IN RARgamma NULL MICE." The pharmacology is RARgamma-dependent in vivo,
  which is the control CD2665 conspicuously lacks - le2019a showed CD2665 also hits RARalpha with opposite
  co-regulator behaviour.
  AND 7C DOES NOT FLIP TO AGONISM. The paper states plainly that 7C "does not show agonistic activity even
  when applied at high concentrations, while other RARgamma antagonists may show agonist activity at high
  doses" - which is the specific failure mode of the adamantyl-arotinoid family CD2665 belongs to.
  ON CLASS, THE HONEST POSITION: the paper's own KEYWORD LIST includes "RARgamma inverse agonist". That is
  the authors' designation, not a measurement, and no basal-repression or co-repressor-recruitment assay for
  7C appears anywhere this atlas can reach. The class remains formally unestablished, and after round 259
  that matters less than it did - in a zone where repression is already saturated, preserving it is enough.

  TWO - THE RESULT THAT MATTERS MOST, AND IT IS A MONOTHERAPY RESULT. "SOX9 EXPRESSION WAS UPREGULATED BY
  7C, EVEN IN THE ABSENCE OF BMP-2." 7C raises the master chondrogenic transcription factor with no
  exogenous driver present. That is the closest thing in this literature to a constitutive-axis effect: a
  selective RARgamma antagonist, given alone, moving the output williams2009 predicted for RARgamma
  repression - and williams2009 guessed the mechanism "may involve Sox proteins" without ever measuring
  Sox9 under an antagonist. Two laboratories, no cross-citation, prediction and measurement.
  7C also raised sulfated proteoglycan production and chondrogenic marker gene expression in ATDC5 cells and
  MSCs. Proteoglycan is aggrecan, which is precisely the quantity that COLLAPSED in williams2009's
  RARgamma-deficient growth plates.

  THREE - AND NOW THE CONFLICT, WHICH IS THE REASON THIS ROUND EXISTS AND WHICH ARGUES AGAINST THE ARM.
  tateiwa2022 also reports that RARgamma ANTAGONISTS - both 7C AND CD2665 - MODERATELY STIMULATED BMP/SMAD
  SIGNALLING on an Id1-luc reporter and ENHANCED PHOSPHORYLATION OF SMAD1 by immunoblot, while RARgamma
  AGONISTS (NRX204647, CD1530) SUPPRESSED it.
  THIS ATLAS'S ROOT CELL IS DEFINED BY THE OPPOSITE STATE. Rounds 241 and 243 established that the human
  root cell holds BMP-Smad1/5 DOWN, with BMP genes enriched in GP2 and GP5 rather than GP1, and that growth
  hormone LOWERS resting-zone p-Smad1/5. ambrosi2025's independently-derived combination was a Smoothened
  agonist plus DMH1, a BMP INHIBITOR. And orikasa2024 established that hedgehog-driven OSTEOGENIC CONVERSION
  of resting-zone cells is the specific failure mode this programme has to avoid.
  SO THE RETINOID ARM AND THE ROOT-CELL ARM MAKE OPPOSITE PREDICTIONS ABOUT BMP-Smad1/5, AND THE COMPOUND
  THAT LOOKS BEST ON ONE IS PUSHING THE WRONG WAY ON THE OTHER. 7C's entire published skeletal application -
  potentiating BMP-2-induced ectopic bone, enhancing spinal fusion - is ACCELERATED OSTEOGENIC CONVERSION,
  which is the thing the root-cell programme exists to prevent.
  THE RECONCILIATIONS ARE AVAILABLE AND NONE IS ESTABLISHED. (a) The root cell and the transit-amplifying
  compartment are different cells and a compound can raise Sox9 and amplification in one while raising
  BMP-Smad in the other. (b) Everything in an ectopic BMP-2 pellet is being driven osteogenically anyway, so
  the pSmad1 result may be a property of that model rather than of the compound. (c) The two arms may
  genuinely be incompatible and the retinoid arm buys amplification at the cost of pool. THE EXPERIMENT
  THAT DISCRIMINATES IS THE ONE ALREADY SPECIFIED - 7C in a normal growing animal with resting-zone cell
  counts AND length - because option (c) shows up as pool depletion and options (a) and (b) do not.

  FOUR - WHAT IS STILL MISSING, STATED SO IT CAN BE ASKED FOR. The systemic dose and route (uchibe2017, not
  open access). 7C's structure and any selectivity ratio, IC50 or Ki against RARalpha and RARbeta
  (Supplementary Figure S1 of tateiwa2022, and the patent WO 2005/066115 A2). Any basal-repression or
  SMRT/NCoR recruitment assay for 7C, which would settle its class the way le2019a settled CD2665's. And
  whether 7C or any RARgamma antagonist has ever been given to a normal growing animal with a bone LENGTH
  endpoint - which as of this round is still no.
quantitative:
- parameter: >-
    7C - IDENTITY, SOURCING AND THE DOSES ACTUALLY USED
  value: >-
    patent WO 2005/066115 A2, custom-synthesised by Atomax Chemicals, no CAS number; in vitro 50 nM; in vivo
    local 0.3, 1.0 and 5.0 micrograms of 7C-loaded PLA nanoparticle per pellet alongside 1.5 micrograms
    rhBMP-2, dose-dependent on bone volume
  unit: nanomolar in vitro, micrograms per pellet in vivo
  conditions: >-
    tateiwa2022, full text. Matched agonist NRX204647 (CAS 1351452-80-6) at 100 nM in vitro and 1.0 or 5.0
    micrograms per pellet in vivo. Collagen sponge discs absorbing rhBMP-2 implanted into mouse dorsal
    fascia; six groups, n = 7 to 25. ATDC5 cells and MSCs in chondrogenic medium with rhBMP-2 20 ng/mL for
    5-6 days. Polylactide nanoparticles chosen because PLA is an FDA-approved carrier giving extended
    release; NRX204647-loaded PLA-NPs previously inhibited chondrosarcoma growth with minimal local tissue
    damage.
  species: mouse
  source_ref: tateiwa2022
  uncertainty: >-
    THE SYSTEMIC DOSE AND ROUTE ARE NOT IN THIS PAPER - they are in uchibe2017, which is not open access,
    and every systemic claim about 7C in this atlas currently rests on a single citing sentence. 7C HAS NO
    CAS NUMBER AND IS NOT A CATALOGUE REAGENT; it was synthesised to order from a patent, so availability is
    a genuine obstacle. No selectivity ratio, IC50 or Ki against RARalpha or RARbeta is given in the text -
    the structures are in Supplementary Figure S1, which this atlas has not retrieved.
- parameter: >-
    THE GENETIC SPECIFICITY CONTROL, AND THE ABSENCE OF AGONIST FLIP
  value: >-
    neither the selective RARgamma agonist nor the antagonist exhibits effects in RARgamma-null mice; and 7C
    shows no agonistic activity even at high concentrations
  unit: qualitative genetic control
  conditions: >-
    tateiwa2022, reporting the RARgamma-null control and contrasting 7C with other RARgamma antagonists
    which "may show agonist activity at high doses".
  species: mouse
  source_ref: tateiwa2022
  uncertainty: >-
    BOTH STATEMENTS ARE MADE IN THE DISCUSSION AND THE RARgamma-NULL EXPERIMENT IS NOT PRESENTED AS A FIGURE
    IN THIS PAPER - it is a summary of prior work, presumably uchibe2017, which this atlas has not read. The
    no-agonism claim carries no concentration range or assay in the text. Both are the right controls and
    neither is verified here.
- parameter: >-
    THE MONOTHERAPY RESULT - SOX9 RAISED WITHOUT ANY EXOGENOUS DRIVER
  value: >-
    Sox9 expression upregulated by 7C in the presence AND in the absence of BMP-2; sulfated proteoglycan
    production and chondrogenic marker genes also raised
  unit: qualitative direction, qRT-PCR and Alcian blue
  conditions: >-
    tateiwa2022. ATDC5 cells and MSCs, chondrogenic medium, 7C at 50 nM for 5-6 days, n = 3 to 4 per group,
    Alcian blue at pH 1.0 for sulfated proteoglycan, qRT-PCR normalised to GAPDH.
  species: mouse
  source_ref: tateiwa2022
  uncertainty: >-
    CELL LINE AND PRIMARY MSCs IN CHONDROGENIC MEDIUM, NOT A GROWTH PLATE, and serum-containing culture is
    not retinoid-free, so "in the absence of BMP-2" is not the same as "in the absence of ligand". n = 3-4.
    Sox9 mRNA is not chondrocyte output and no length, matrix accumulation over time, or cell-size endpoint
    is reported. It is nonetheless the only monotherapy result in this literature that moves the exact
    quantity williams2009 predicted.
- parameter: >-
    THE CONFLICT - RARgamma ANTAGONISM RAISES BMP-SMAD1, AND THE ROOT CELL IS DEFINED BY HOLDING IT DOWN
  value: >-
    RARgamma antagonists 7C and CD2665 moderately stimulated Id1-luc reporter activity and ENHANCED
    phospho-Smad1; RARgamma agonists NRX204647 and CD1530 SUPPRESSED it
  unit: direction of BMP-Smad signalling
  conditions: >-
    tateiwa2022, Id1-luc reporter in ATDC5 cells with and without 10 ng/mL rhBMP-2, and anti-pSmad1
    immunoblot, with increasing concentrations of both antagonists and both agonists.
  species: mouse
  source_ref: tateiwa2022
  uncertainty: >-
    THIS IS THE STRONGEST ARGUMENT AGAINST THE RETINOID ARM IN THIS ATLAS AND IT COMES FROM THE PAPER THAT
    OTHERWISE SUPPORTS IT. Rounds 241 and 243 put the human root cell in a BMP-Smad1/5-LOW state, ambrosi2025
    independently derived a BMP INHIBITOR (DMH1) as half of its combination, and orikasa2024 made
    hedgehog-driven osteogenic conversion of resting-zone cells the named failure mode. A compound whose
    published skeletal use is POTENTIATING BMP-INDUCED OSSIFICATION is pushing that dial the wrong way.
    Three reconciliations are available - different compartments, an artefact of the ectopic BMP model, or a
    genuine incompatibility - and NONE IS ESTABLISHED. Only the normal-growing-animal experiment with
    resting-zone counts discriminates them.
localization:
- 'mouse ectopic BMP-2 pellet in dorsal fascia: where 7C-NP was dosed'
- 'ATDC5 cells and MSCs: where Sox9, proteoglycan and pSmad1 were measured'
- 'normal growth plate: where 7C has never been given'
human_evidence: absent
human_evidence_note: No human has received 7C. There is no human material in this node.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: >-
  Mouse ectopic osteogenesis and a chondrogenic cell line, with a compound that is not a catalogue reagent,
  whose systemic dose is in a paywalled paper, whose pharmacological class is asserted by keyword rather
  than assayed, and which moves BMP-Smad1 in the direction this atlas's root-cell work says is wrong.
confidence: C
confidence_reason: >-
  The dossier facts are directly extracted from a full text and are solid. The compound's suitability is C
  at best because the Sox9 monotherapy result and the pSmad1 result point in opposite directions for this
  programme's purposes, and the discriminating experiment has not been run.
claim_grades:
- claim: 7C is RARgamma-selective and its skeletal effects are RARgamma-dependent.
  grade: B
  basis: >-
    tateiwa2022 states that neither the selective agonist nor the antagonist has effects in RARgamma-null
    mice, and that 7C shows no agonism at high concentration unlike other RARgamma antagonists. Graded B not
    A because the null-mouse experiment is cited in discussion rather than shown, and the underlying data
    are in uchibe2017 which has not been read.
- claim: 7C is an inverse agonist at RARgamma.
  grade: D
  basis: >-
    The authors list "RARgamma inverse agonist" among the paper's KEYWORDS. That is a designation, not a
    measurement. No basal-repression, SMRT or NCoR recruitment assay for 7C exists anywhere this atlas has
    reached - which is exactly the assay le2019a used to classify CD2665.
- claim: >-
    A selective RARgamma antagonist raises SOX9 without an exogenous driver.
  grade: C
  basis: >-
    tateiwa2022 - Sox9 upregulated by 7C with AND without BMP-2 in ATDC5 cells and MSCs, n = 3-4. Cell
    culture in serum-containing chondrogenic medium, so not ligand-free; mRNA only; no length or matrix
    accumulation endpoint. It is the prediction williams2009 made, measured by a group that never cites it.
- claim: >-
    7C is safe to add to this programme's stack on the strength of its bone-regeneration record.
  grade: X
  basis: >-
    NO, AND THE DIRECTION OF THE OBJECTION IS SPECIFIC. Every published skeletal use of 7C is POTENTIATION
    OF BMP-INDUCED OSSIFICATION, and it raises pSmad1 and Id1-luc. This atlas's root cell holds BMP-Smad1/5
    DOWN (rounds 241, 243), ambrosi2025 independently derived a BMP INHIBITOR as half its combination, and
    orikasa2024 named osteogenic conversion of resting-zone cells as the failure mode. The compound may buy
    amplification while spending the pool, which is the growth hormone failure mode in a new molecule.
