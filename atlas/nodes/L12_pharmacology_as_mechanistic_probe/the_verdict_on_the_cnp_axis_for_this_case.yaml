id: the_verdict_on_the_cnp_axis_for_this_case
name: THE VERDICT - the CNP axis grows the SPINE and works BETTER in older children, so the axis is IN;
  the phosphatase route is the only way past its ceiling and is worth about a centimetre, so it stays HELD
aliases:
- does the CNP axis act on the spine
- is the CNP axis age-dependent
- verdict on the phosphatase arm
- add or remove the phosphatase route
- what is the phosphatase arm actually worth
type: hypothesis
layer: L12
stub: false
summary: 'THE QUESTION HAD BEEN ASKED AT THE WRONG LEVEL FOR FOUR ROUNDS. Rounds 134 to 140 tested whether
  phosphatase inhibition WORKS. For a case at bone age 16 with spinal reserve, two prior questions decide
  everything and neither had been asked: does this axis grow the SPINE, and does it still work at a late
  age. Both are answerable from human trial data and from a file already on disk, and both come back
  FAVOURABLE - which changes the verdict on the axis and sharpens the verdict on the phosphatase route to
  a number.
  ONE. THE AXIS GROWS THE SPINE, AND THE EVIDENCE IS NOW THREE-DEEP. In the mouse, the 7E genotype
  lengthens the TAIL - pure caudal vertebrae, a clean vertebral-growth-plate readout - by 8.5 to 9.7 per
  cent, against 8.4 per cent for femur and 8.8 for tibia and only 2.5 for cranial width. Computed here
  from the shuhaibar2017 raw per-animal file, which the atlas has held since round 133 without reading
  the tail sheet. In humans, a meta-analysis of four placebo-controlled trials in 326 children finds the
  upper-to-lower segment ratio essentially unmoved at 52 weeks - mean difference minus 0.02, 95 per cent
  interval minus 0.04 to plus 0.01, I-squared ZERO. And a real-world cohort at 24 months found SITTING
  HEIGHT rising significantly, plus 0.79 standard deviations, and by MORE than arm span at plus 0.32.
  BUT THE PROPORTIONALITY CLAIM WAS OVERSTATED WHEN THIS NODE WAS FIRST WRITTEN, AND IT HAS BEEN PULLED
  BACK. Reading that cohort AT SOURCE rather than through the review shows its ULS ratio DOES move - minus
  0.10, p at most 0.01, leg-favouring, the same direction as the non-significant pooled estimate. The
  defensible statement is a SMALL LEG-FAVOURING DRIFT that longer exposure makes visible, not strict
  proportionality. What this case needs survives the correction intact: the trunk grows, measurably, in
  humans. The atlas long-standing line that NO AGENT SELECTS A SITE is correct but was being read as
  though the CNP axis were limb-only. It is not - it reaches the axial skeleton, and reaching the axial
  skeleton is what a spinal reserve needs.
  TWO. THE AXIS WORKS BETTER IN OLDER CHILDREN, NOT WORSE. The same meta-analysis subgroups by age and
  finds the growth-velocity gain LARGER above five years - 1.63 cm/year, interval 1.34 to 1.92 - than
  below five - 0.91, interval 0.41 to 1.41 - with a subgroup difference at p = 0.01. A real-world cohort
  stratified further and got the biggest gain in the 10-to-16 band. This is the opposite of the decay
  this atlas has assumed for late bone ages since the thread began. It does NOT extend to bone age 16 -
  the trials stop below 18 chronological years in a skeletally delayed population - but the direction of
  the age gradient is now measured, and it runs the right way.
  THREE. AND THE PHOSPHATASE ROUTE IS THE ONLY THING THAT GETS PAST THE LIGAND CEILING, WHICH IS THE
  ENTIRE CASE FOR IT. robinson2017 showed FGF inhibition of the receptor is NOT surmountable by more
  ligand - same IC50 at sub-saturating and saturating CNP. shuhaibar2021 Figure 1F shows 10 micromolar
  LB-100 driving the FGF-suppressed response to 138 PER CENT OF THE NO-FGF CONTROL, above anything ligand
  alone reaches. And in a NORMAL tibia with no FGF at all, cantharidin alone raised the CNP response
  1.42-fold. Phosphorylation state sets a ceiling the ligand cannot lift. That is orthogonality, and it
  is the only reason to carry a second agent at the same node.
  SO WHAT IS IT WORTH. Scaling the measured achondroplasia effect to a normal FGFR3 background by the
  ratio the 7E genotype gives in the two backgrounds - 4.3 to 8.8 per cent in wild type against 12.6 in
  G380R - the ligand arm is worth about 0.5 to 1.1 cm/year, and the phosphatase increment on top of it
  about 0.2 to 0.5 cm/year. Over a two-to-four-year residual spinal window that is ROUGHLY 1 TO 4.6 CM
  FROM THE LIGAND AND 0.4 TO 1.9 CM FROM THE PHOSPHATASE ARM.
  THE VERDICT, STATED SO IT CAN BE ACTED ON. THE LIGAND ARM OF THE CNP AXIS IS IN - it is the only agent
  in this atlas with randomised human evidence that it grows the axial skeleton proportionately and works
  better late. THE PHOSPHATASE ROUTE STAYS HELD, and its price is now explicit: it is worth on the order
  of one centimetre, it is the only route past the ligand ceiling, and buying it costs a compound with a
  2.6 to 3.2-fold exposure margin, no in vivo bone data in any species, and human genetics that points
  the wrong way on the two genes that can be read. A centimetre is not nothing at bone age 16. It is also
  not enough to accept an unbounded risk for, which is why the ONE minipump experiment remains the gate.'
quantitative:
- parameter: 'THE 7E GENOTYPE GROWS CAUDAL VERTEBRAE AS HARD AS LONG BONES - THE SITE QUESTION, ANSWERED
    FROM A FILE THE ATLAS ALREADY HELD'
  value: 'TAIL length gain in Npr2 7E/7E against wild type: +4.81 per cent at 3 weeks, +6.85 at 6, +9.65
    at 9, +9.32 at 12 and +8.49 at 15 weeks. Against femur +13.91 at 8 weeks and +8.44 at 16, tibia
    +10.15 and +8.80, body length +10.00 and +7.97, cranial width MINUS 2.36 and +2.54'
  unit: per cent difference from wild type
  conditions: 'Computed at round 141 from shuhaibar2017 eLife 31343 Figure 1 source data 1, sheet
    "Figure 1B", raw per-animal values. Group sizes 12 to 19 wild type against 9 to 17 mutant. The mouse
    tail is caudal vertebrae with intervening growth plates and no long bone, so it isolates the
    vertebral compartment in a way no other endpoint in this literature does.'
  species: mouse
  source_ref: shuhaibar2017
  uncertainty: 'THE AXIAL ADVANTAGE IS ALSO MORE DURABLE THAN THE APPENDICULAR ONE, which matters more
    than the headline. Femur peaks at +13.91 per cent at 8 weeks and falls to +8.44 by 16, losing 39 per
    cent of its advantage; the tail peaks at +9.65 at 9 weeks and holds +8.49 at 15, losing 12 per cent.
    CAVEATS: caudal vertebrae are not thoracolumbar vertebrae, they are unloaded and they continue growing
    later; the comparison is cross-sectional across ages; and this is a germline genotype, not a drug
    started late. WHAT IT NEVERTHELESS ESTABLISHES is that NPR2 activation is not a long-bone-only lever,
    which is what the atlas had implicitly assumed.'
- parameter: 'THE AXIS REACHES THE TRUNK IN HUMANS - BUT WHETHER IT IS STRICTLY PROPORTIONATE DEPENDS ON
    WHICH RATIO IS MEASURED, AND THE SOURCE READS DISAGREE'
  value: 'RANDOMISED, POOLED: upper-to-lower segment ratio, four placebo-controlled RCTs in 326 children,
    mean difference MINUS 0.02, 95 per cent interval minus 0.04 to plus 0.01, p = 0.17, I-squared ZERO -
    vosoritide and navepegritide separately both minus 0.02. Against significant gains on every length
    endpoint in the same analysis: growth velocity +1.36 cm/year (1.05 to 1.68, I-squared 30), height
    Z-score +0.28 (0.20 to 0.37, I-squared 0), standing height +1.24 cm (0.47 to 2.01, I-squared 72).
    UNCONTROLLED, LONGER: at 24 months the Rua cohort gains SITTING HEIGHT +0.79 SD against ARM SPAN +0.32
    SD, both p at most 0.01 - the trunk gaining MORE than the arm - while in the SAME cohort the
    upper-to-lower segment ratio DOES move, MINUS 0.10, p at most 0.01, and the sitting-height-to-height
    ratio does NOT move at all'
  unit: ratio units, cm/year, cm, standard deviations
  conditions: 'The pooled figures are from a 2026 systematic review and meta-analysis of CNP analogues in
    achondroplasia, 11 studies and 542 children, of which four RCTs at low risk of bias and 326 children
    were meta-analysed at 52 weeks; every pooled number here was verified against the open-access full
    text at round 141, not taken from the abstract. The 24-month figures are from rua2025, a Portuguese
    single-centre retrospective cohort of 27 children (15 completing 24 months), READ AT SOURCE at round
    141 rather than from the review that tabulates it. A separate 2026 randomised phase 2 report finds
    vosoritide increasing lumbar interpedicular distance and spinal canal width in children under five,
    L4 canal width +1.43 mm (0.55 to 2.32), p = 0.002, and REDUCING pathological thoracolumbar kyphosis -
    33.3 per cent of treated against 59.3 per cent of placebo children at 20 degrees or more, p = 0.037.'
  species: human
  source_ref: cnpmeta2026
  uncertainty: 'THIS ROW WAS WEAKENED BY READING THE COHORT AT SOURCE, AND THE WEAKER VERSION IS THE ONE
    TO CARRY. The review headline - no short-term effect on ULS ratio - is TRUE OF THE POOLED RCTs AT 52
    WEEKS AND NOT TRUE OF THE 24-MONTH COHORT, which shows a significant leg-favouring shift of minus
    0.10. Both point the same DIRECTION, negative; the pooled estimate simply does not reach significance
    at one year. The honest reading is a SMALL LEG-FAVOURING DRIFT that longer exposure makes visible, not
    strict proportionality. Worse, rua2025 is internally inconsistent: the ULS ratio moves while the
    sitting-height-to-height ratio does not, and those two measure nearly the same thing - in a single
    uncontrolled series of 27 with no placebo arm, so neither should be leaned on. reincke2025, read at
    source, reports NO change in ULS ratio, siding with the pooled estimate.
    WHAT SURVIVES ALL OF IT, and it is what this case actually needs: SITTING HEIGHT RISES SIGNIFICANTLY,
    +0.79 SD at 24 months, and by MORE than arm span. That is direct human evidence the axis grows the
    TRUNK. It is not evidence that it grows the trunk PREFERENTIALLY, and this node no longer claims that.
    Three limits stand. The trials are in ACHONDROPLASIA, where baseline disproportion is extreme and the
    spine is relatively spared, so proportionality there need not transfer to a normal skeleton. The
    24-month comparison is one uncontrolled cohort of 27. And the spinal canal measures come from the
    NEUROCENTRAL SYNCHONDROSIS, which closes around five to eight years and is IRRELEVANT at bone age 16 -
    that paper shows the axis reaches spinal cartilage, not that it grows vertebral bodies late.'
- parameter: 'THE AGE GRADIENT RUNS THE RIGHT WAY - THE EFFECT IS LARGER IN OLDER CHILDREN'
  value: 'growth-velocity gain over placebo, by age subgroup: 1.63 cm/year (95 per cent interval 1.34 to
    1.92, I-squared 0) in children aged 5 years and above, against 0.91 cm/year (0.41 to 1.41, I-squared
    0) in children under 5. Test for subgroup difference p = 0.01. A real-world cohort stratified further
    and reported AGV Z-SCORES - NOT cm/year - of 1.77 at 2 to under 5 years, 2.14 at 5 to under 10, and
    2.30 at 10 to under 16, against an achondroplasia-specific reference'
  unit: cm/year for the pooled subgroups; dimensionless Z-score for the three bands
  conditions: 'Same 2026 meta-analysis, subgroup analysis of the pooled RCTs, verified word for word
    against the open-access full text at round 141. The three-band figures are from reincke2025, a German
    retrospective cohort of 34 children with 12 or more months of treatment, READ AT SOURCE at round 141 -
    the review tabulates them without units and this atlas had carried them as cm/year gains until the
    source read (CORR-145).'
  species: human
  source_ref: cnpmeta2026
  uncertainty: 'THIS IS THE SINGLE MOST IMPORTANT NUMBER IN THE NODE FOR THIS CASE AND IT HAS TO BE READ
    CAREFULLY. It is a subgroup analysis, so it is hypothesis-generating even at p = 0.01. Achondroplasia
    children are skeletally DELAYED, so a chronologically older child in these trials is not skeletally
    equivalent to a normal child of the same age - which cuts both ways, because it means the trials may
    already be sampling late plates. THE REAL-WORLD CORROBORATION IS MUCH WEAKER THAN IT LOOKED: those
    three bands are Z-scores against an achondroplasia-specific reference whose own velocity FALLS with
    age, so a rising Z across bands is partly a shrinking denominator, and the cohort is uncontrolled.
    THE POOLED SUBGROUP RESULT IS NOT SUBJECT TO THAT ARTEFACT and is what carries the row - it is an
    ABSOLUTE difference in cm/year against a concurrent PLACEBO arm, so the fact that older children start
    from a lower baseline velocity and still show a LARGER absolute gain is the opposite of a
    regression-to-the-mean artefact. AND NOTHING HERE REACHES
    BONE AGE 16: the RCTs stop below 18 chronological years, the review states plainly that evidence in
    skeletally mature individuals is virtually absent, and this atlas has separately established that the
    oldest child in the pivotal trial was 11. WHAT CHANGES IS THE PRIOR, not the evidence at the target
    age - the axis does not visibly fade with age up to the limit of the data.'
- parameter: 'THE PHOSPHATASE ROUTE IS ORTHOGONAL TO THE LIGAND ROUTE - THE ONLY REASON TO CARRY BOTH'
  value: 'FGF inhibition of NPR2 is NOT surmountable by ligand - same IC50 at 100 nanomolar and 1
    micromolar CNP. 10 micromolar LB-100 drives the FGF-suppressed cGMP response to 138 PER CENT of the
    no-FGF control. And in a normal tibia with no FGF present, cantharidin ALONE raises the CNP response
    1.42-fold, p = 0.0018'
  unit: per cent and fold
  conditions: 'robinson2017 for the non-surmountability; shuhaibar2021 Figure 1F for the overshoot, read
    from the supplied panel; shuhaibar2017 Figure 6C source data for the tonic-restraint fold-change,
    computed by this atlas from raw per-animal values at round 130.'
  species: mouse
  source_ref: robinson2017
  uncertainty: 'THE 1.42-FOLD TONIC NUMBER IS THE ONE TO USE FOR A NORMAL PLATE, not the 138 per cent,
    because the latter is measured in an FGF-suppressed system that a person with intact FGFR3 is not in.
    Both are ex vivo, mouse, single experiments. AND THE SAME ORTHOGONALITY ARGUMENT WAS ALREADY
    UNDERCUT ONCE: shuhaibar2021 ran the combination for six days and got ADDITIVITY, not synergy, which
    is what you would expect if both agents feed one node with a shared ceiling. The honest reading is
    that the phosphatase raises the ceiling the ligand then works against, and that the size of the raise
    is the 1.42-fold.'
- parameter: 'WHAT THE TWO ARMS ARE WORTH FOR THIS CASE, PROJECTED'
  value: 'ligand arm about 0.46 to 1.14 cm/year in a normal FGFR3 background, and the phosphatase
    increment about 0.18 to 0.48 cm/year on top. Over a two-to-four-year residual spinal window: LIGAND
    0.9 to 4.6 cm, PHOSPHATASE INCREMENT 0.4 to 1.9 cm'
  unit: cm/year and cm
  conditions: 'DERIVED at round 141. Measured achondroplasia effect of 1.36 to 1.63 cm/year scaled to a
    normal background by the ratio the 7E genotype produces in the two backgrounds - wagner2021 gives 4.3
    to 8.8 per cent femur gain in wild-type FGFR3 against 12.6 per cent in G380R, a ratio of 0.34 to 0.70.
    [CORRECTED CORR-153, 2026-08-09, read at source: the WILD-TYPE FEMUR figures are 4.3 per cent (male)
    and 5.0 per cent (female); the 8.8 was a TIBIA number imported from a different computation. Ratios
    must be taken within sex - male 4.3/12.6 = 0.34, female 5.0/7.9 = 0.63 - so the scaling ratio is
    0.34 to 0.63. This trims the top of the projected range and does not change its order.]
    The phosphatase increment applies the 1.42-fold tonic-restraint factor to that. The window comes from
    costa2021 - the thoracolumbar ring apophysis sits four to six years behind the hand at bone age 16.'
  species: not_applicable
  source_ref: wagner2021
  uncertainty: 'THIS IS A CHAIN OF FOUR UNCERTAIN MULTIPLICATIONS AND THE OUTPUT IS AN ORDER OF MAGNITUDE,
    NOT A PREDICTION. Every step can be attacked: the achondroplasia-to-normal scaling assumes the
    genotype ratio transfers to a drug; the tonic-restraint factor is one ex vivo mouse experiment; the
    residual window is inferred from a ring-apophysis staging study, not measured in this subject; and
    NONE of it is corrected for the finding, from this atlas own recomputation, that the 7E advantage
    SHRINKS between 8 and 16 weeks - which if it transfers would reduce the final-height figure below the
    velocity figure. WHAT SURVIVES ALL OF THAT IS THE ORDER: the ligand arm is worth centimetres and the
    phosphatase arm is worth about a centimetre. That is the number the risk has to be weighed against.'
localization:
- 'the whole point of this node is localisation - the reserve at bone age 16 is spinal, and the question
  was whether this axis reaches it. Mouse caudal vertebrae and human segment ratios both say yes'
human_evidence: direct
human_evidence_note: 'The site and age findings are from randomised human trials meta-analysed across 326
  children. The orthogonality argument and the projection are mouse.'
species_basis:
- human
- mouse
translation_risk: moderate
translation_risk_reason: 'The human evidence is all in achondroplasia, where FGFR3 is constitutively
  active and the headroom is larger than in a normal plate. Every number transferred to a normal skeleton
  is scaled by a mouse genotype ratio.'
confidence: C
claim_grades:
- claim: The CNP/NPR2 axis grows the axial skeleton, not the limbs only.
  grade: B
  basis: 'Mouse caudal vertebrae at +8.5 to 9.7 per cent against femur +8.4, computed from raw
    per-animal data; and human SITTING HEIGHT rising +0.79 SD at 24 months, significantly and by more than
    arm span. Two species, two independent measurement types, same answer. Not A because the human datum
    is one uncontrolled cohort of 27 and the whole human literature is in achondroplasia.'
- claim: The axis grows the axial and appendicular skeleton at closely similar rates - strict
    proportionality.
  grade: D
  basis: 'DOWNGRADED FROM B AT ROUND 141 AFTER READING THE COHORT AT SOURCE (CORR-146). The pooled RCT
    estimate is an ABSENCE - ULS mean difference minus 0.02, p = 0.17 - and absences do not establish
    equivalence at 52 weeks. Against it, rua2025 at 24 months shows a SIGNIFICANT leg-favouring shift of
    minus 0.10, in the same direction as the non-significant pooled estimate, while reincke2025 reports no
    change. The sources conflict, and rua2025 conflicts with itself - its ULS ratio moves while its
    sitting-height-to-height ratio does not. Conflicting evidence, so grade D.'
- claim: The response does not decline with age up to the limit of the trial data.
  grade: C
  basis: 'A subgroup analysis at p = 0.01 in a meta-analysis of placebo-controlled trials, verified at
    source - an absolute cm/year difference against a concurrent placebo arm, which is why it is not a
    regression artefact. Subgroup analyses are hypothesis-generating, the population is skeletally
    delayed, and nothing reaches bone age 16. The three-band real-world stratification that appeared to
    corroborate it is Z-scores against a reference velocity that itself falls with age (CORR-145), so it
    adds much less than it seemed to and the grade rests on the pooled subgroup alone.'
- claim: Phosphatase inhibition raises a ceiling that ligand cannot reach.
  grade: C
  basis: 'Non-surmountability in rat chondrosarcoma cells, a 138 per cent overshoot in mouse tibia, and a
    1.42-fold tonic effect in a normal tibia. Three ex vivo experiments pointing one way, and one
    combination experiment that produced additivity rather than synergy.'
- claim: The phosphatase arm is worth about a centimetre of adult height in this case.
  grade: E
  basis: 'Four chained multiplications across species, backgrounds and endpoints. Recorded as an order of
    magnitude to price the decision, and explicitly not as a prediction.'
