contradicts:
- 'ALLELE MISMATCH: published FGFR3-inhibitor potency data are on kinase-domain alleles (K650E, K650M,
  N540K). The clinical achondroplasia target is the transmembrane G380R. Whether potency rank order transfers
  across activation mechanism is untested - see g_mr002_allele.'
