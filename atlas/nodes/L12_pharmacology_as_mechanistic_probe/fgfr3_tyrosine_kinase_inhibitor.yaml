localization:
- 'human growth plate: no measurement of intraplate TKI concentration for any member of the class'
human_evidence: direct
human_evidence_note: One class member, infigratinib, has a completed placebo-controlled phase 3 trial
  in children with achondroplasia; the kinase potency data are biochemical.
species_basis:
- human
- mouse
- in_vitro_human_cell
translation_risk: moderate
translation_risk_reason: Human efficacy exists for one agent, but the class rationale, the allele-selectivity
  data and the skeletal safety signals are biochemical and murine. Chronic pan-FGFR inhibition in a growing
  child has no long-term human safety dataset in a non-malignant indication, and the closest human analogue
  - paediatric TKI exposure in CML - reduces final height.
confidence: B
claim_grades:
- claim: Infigratinib inhibits FGFR3 K650M ~89-fold less potently than K650E in a radiometric kinase assay.
  grade: D
  basis: Single biochemical panel, ATP concentration not stated for these values; not independently replicated.
- claim: FGFR3 phenotype severity is not monotonic in constitutive kinase activity.
  grade: B
  basis: K650M has ~3x the activity of the lethal K650E yet is survivable (Tavormina 1999); replicated
    by the graded Lys650 allelic series.
- claim: Reducing FGFR3 kinase output increases growth velocity in achondroplasia.
  grade: A
  basis: Phase 3 RCT of infigratinib, n=114, +1.74 cm/yr vs placebo.
