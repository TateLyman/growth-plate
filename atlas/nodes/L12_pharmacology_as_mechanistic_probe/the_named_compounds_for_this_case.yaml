contradicts:
- 'REFINES the_stack_in_a_normal_human ON THE AMPLIFICATION ARM. That node names an FGFR3-SELECTIVE inhibitor
  and points at TYRA-300 as the preferred molecule. That remains right on mechanism and is now shown to be
  unavailable in practice - BEACH301 is capped at age 10 and the only human data for the molecule are
  oncology case reports. For a subject who can actually be dosed, the amplification arm resolves to
  infigratinib, which that node treats as the fallback rather than the answer.'
