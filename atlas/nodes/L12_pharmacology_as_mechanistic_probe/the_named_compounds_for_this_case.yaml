id: the_named_compounds_for_this_case
name: THE NAMED COMPOUNDS - what to actually give at bone age 16 with spinal reserve, which molecule in each
  arm and why that one rather than its class-mate
aliases:
- what compound
- which drug should I take
- the actual prescription
- named agents for this case
- what to give at bone age 16
- the maximal stack
type: intervention
layer: L12
stub: false
summary: 'EVERY PRIOR SYNTHESIS IN THIS ATLAS NAMED ARMS, NOT MOLECULES. the_stack_in_a_normal_human names
  four arms and one excluded class; the_arms_reordered_for_late_bone_age ranks seven terms for a late bone
  age. Neither says WHICH COMPOUND, and the choice inside each arm turns out to be decidable on evidence
  this atlas already holds. This node makes those choices and states what each one is worth.
  THE CONTROLLING FACT IS THAT AT BONE AGE 16 THE BINDING CONSTRAINT IS TIME, NOT RATE. Every rate agent
  delivers centimetres per year multiplied by years remaining, and at this bone age the second factor is
  small and shrinking. Only one arm lengthens the multiplier itself. That is why the ranking inverts here
  and why the keystone compound is the one with the SMALLEST monotherapy effect in the whole stack.
  ARM 1, DURATION - ANASTROZOLE 1 MG DAILY, ORAL, AND IT IS THE KEYSTONE PRECISELY BECAUSE IT IS WORTHLESS
  ALONE. In NCT01248416, 76 adolescent boys with idiopathic short stature, change in predicted adult height
  was +0.5 cm for the aromatase inhibitor alone, +4.9 for growth hormone alone and +7.4 for BOTH. Read as
  monotherapy an aromatase inhibitor is nothing. Read as a multiplier it is worth about +2.5 cm ON TOP OF
  the best single agent. ANASTROZOLE RATHER THAN LETROZOLE, and the reason is an attained-adult-height
  comparison at the right bone age: cui2025 propensity-matched boys with bone age 13 or above and followed
  them to adult height - anastrozole plus GH gave a target-height-adjusted adult height of 0.81 SDS against
  0.60 for letrozole plus GH and 0.48 for a GnRH analogue plus GH. Letrozole suppresses oestrogen HARDER
  (zegarra2024: lower oestradiol, slower bone-age advance) AND DELIVERS LESS HEIGHT. That dissociation is
  the single most useful dosing fact in this arm - maximal oestrogen suppression is not the objective, and
  the agent that overshoots loses.
  ARM 2, AMPLIFICATION - INFIGRATINIB 0.25 MG/KG ONCE DAILY, ORAL. Now a peer-reviewed phase 3 in the New
  England Journal (savarirayan2026infig, n = 114, ages 3 to 17): +1.74 cm/year against placebo, height
  Z-score +0.32, and CRITICALLY the upper-to-lower segment ratio -0.02 (96 per cent interval -0.06 to 0.01),
  so it does not distort proportion. No serious adverse event and no discontinuation was judged related to
  the drug. It is the largest single-agent velocity effect in this atlas that also spares bone age, it is
  ORAL, and its trial population reaches age 17 - the only agent in the stack whose evidence base touches
  this subject age at all.
  AND THE ERDAFITINIB COMPARISON HAS TO BE MADE ON THE RIGHT AXIS, WHICH IS DOSE, NOT RECEPTOR LEDGER.
  THE FIRST VERSION OF THIS NODE DEMOTED ERDAFITINIB USING karolak2015 - chondrocyte Fgfr1 deletion
  shortens bone, therefore erdafitinib pays an FGFR1 cost. THAT INFERENCE IS INADMISSIBLE AND CORR-046 HAD
  ALREADY RETRACTED IT: karolak2015 deletes from EMBRYONIC cartilage and asks whether FGFR1 is required to
  BUILD a plate, not what partial postnatal inhibition does to an adolescent one, and NEITHER FGFR1 NOR
  FGFR4 HAS ANY REPORTED HUMAN STATURE PHENOTYPE IN EITHER DIRECTION while FGFR3 spans about 65 cm. A
  pan-FGFR inhibitor net effect is dominated by FGFR3 relief. Withdrawn here as CORR-147.
  WHAT THE COMPARISON ACTUALLY LOOKS LIKE ONCE THE LEDGER IS REMOVED. Erdafitinib produced 19.06 cm/year
  in a child - and CORR-079 established that this was NOT full oncology dosing but 7 mg for 5 months with
  frequent interruptions for hyperphosphataemia, then 5 mg for 4 months. So roughly 5 to 7 mg with time off
  drug produced ELEVEN TIMES the velocity infigratinib produces at 0.25 mg/kg/day. THIS ATLAS OWN STANDING
  READING OF THAT GAP IS THAT IT IS DOSE, NOT MOLECULE: the selective agents are dosed roughly an order of
  magnitude below their own oncology exposures, so +1.74 cm/year IS A FLOOR SET BY REGULATORY CAUTION, NOT
  A CEILING SET BY BIOLOGY. Round 142 picked infigratinib and called it the best-evidenced rate agent while
  quietly accepting that floor dose as the achievable effect. That was the wrong reading of the atlas own
  position.
  SO THE AMPLIFICATION ARM SPLITS BY OBJECTIVE, AND IT SHOULD BE STATED THAT WAY RATHER THAN COLLAPSED.
  FOR MAXIMUM ATTAINABLE EFFECT, ERDAFITINIB IS THE ONLY FGFR AGENT WITH A DEMONSTRATED LARGE HUMAN GROWTH
  SIGNAL, it is approved with an established dose, and the exposure that produced that signal was BELOW
  label. Its cost is not a receptor ledger - it is the outcome record: five of five paediatric cases
  permanently discontinued, three requiring surgery, median onset 137 days, and spinal deformity
  progressing on serial MRI through the reduced-dose period, so 5 mg is a demonstrated ACTIVE dose and not
  a demonstrated safe one. FOR THE BEST-CHARACTERISED EFFECT PER UNIT OF UNCERTAINTY, INFIGRATINIB, with a
  randomised phase 3 and a clean 52-week safety table - accepting that its dose is a regulatory floor and
  its +1.74 cm/year is very likely not what the axis can do.
  AND THE COMPOUND THIS CASE ACTUALLY WANTS CANNOT BE HAD. TYRA-300, now named DABOGRATINIB, is FGFR3-
  ISOFORM-SELECTIVE, is the ONLY agent on either axis shown to lengthen bone in a WILD-TYPE animal, and is
  the only one reported to increase LUMBAR VERTEBRAL LENGTH and improve intervertebral disc shape - which is
  the exact compartment this case has reserve in. Its skeletal trial BEACH301 (NCT06842355) is phase 2 in
  achondroplasia AGED 3 TO 10. Its only human data (dabogratinib2026) are three case reports in adults with
  urothelial carcinoma. Mechanistically first choice, practically unavailable.
  ARM 3, h_term - VOSORITIDE 15 MICROGRAMS/KG DAILY RATHER THAN NAVEPEGRITIDE WEEKLY, AND THIS ATLAS HAS THE
  ARGUMENT BUT HAD NEVER MADE THE CALL. Navepegritide wins on convenience and on continuous exposure. TWO
  THINGS THIS ATLAS ALREADY HOLDS CANCEL THAT ADVANTAGE. First, thread 3 established that CONTINUOUS
  EXPOSURE IS NOT REQUIRED AT THE RECEPTOR, which removes the entire pharmacokinetic case for the weekly
  agent. Second, the human growth plate transcribes MME (neprilysin) at a maximum of 1062 against NPR2 at
  1262 - the tissue makes the protease that destroys the drug at a level comparable to the receptor -
  and VOSORITIDE IS NEP-RESISTANT BY DESIGN while NAVEPEGRITIDE RELEASES UNMODIFIED CNP-38, WHICH IS A NEP
  SUBSTRATE. At the target tissue specifically, that asymmetry favours vosoritide. It has never been tested
  and the call is therefore reversible, but it is the way the held evidence points.
  GROWTH HORMONE IS IN. THE FIRST VERSION OF THIS NODE PUT IT OUT AND THAT WAS NOT SUPPORTABLE - CORR-148.
  The exclusion rested on ONE mouse study (sawamura2025) and ONE untested inference (an ERK collision from
  chu2026). READING sawamura2025 PROPERLY REVERSES MOST OF IT, and this atlas had already recorded the
  reversal in the reference note without propagating it. THAT STUDY HAS A WILD-TYPE ARM, which is the
  background that matters here: IN WILD-TYPE MICE THE FGFR3-PATHWAY INHIBITOR LENGTHENED ONLY THE HUMERUS
  WHILE GH LENGTHENED FEMUR, TIBIA, HUMERUS AND ULNA. In a normal skeleton GH was the broad-acting agent
  and the FGFR3-pathway agent did almost nothing. THE NON-ADDITIVITY IS ALSO WEAKER THAN IT SOUNDS: body
  length was vehicle 17.01, meclozine 17.66, GH 17.89, combination 17.79, n = 8 per group - by this atlas
  own power arithmetic FULL additivity (about 18.54) would probably have been detected, but PARTIAL
  ADDITIVITY WOULD NOT. AND THE ERK-COLLISION PREDICTION WAS FALSIFIED IN THE SAME PAPER: the authors state
  explicitly that NEITHER an additive NOR an ATTENUATING effect was seen, while round 47 had predicted
  antagonism. MECLOZINE IS ALSO NOT AN FGFR INHIBITOR - it is a repositioned antihistamine acting
  downstream of the receptor - so this is not a test of GH against erdafitinib or infigratinib at all.
  AGAINST THAT THIN NEGATIVE STAND THREE POSITIVES, TWO OF THEM HUMAN. GH is ADDITIVE with a CNP analogue
  in people (mcdonnell2026, 8.69 against 5.95 cm/year, +2.74). GH directly grows HUMAN growth plate tissue
  in explant culture (chu2026). And GH is the LARGEST SINGLE CONTRIBUTOR in the only combination trial with
  a height endpoint - NCT01248416 gives +4.9 cm predicted adult height for GH alone against +0.5 for the
  aromatase inhibitor alone. EVERY ATTAINED-ADULT-HEIGHT NUMBER IN THIS ENTIRE ATLAS COMES FROM A REGIMEN
  CONTAINING GH. THE REAL COST OF GH IS BONE AGE, which is the one currency this case cannot spend - and
  that is precisely what the aromatase inhibitor is co-administered to offset, which is the design cui2025
  actually tested and the design that produced the best adult height. THE RESIDUAL OPEN QUESTION is
  narrower than the exclusion was: whether GH adds anything ON TOP OF a potent receptor-level FGFR3
  inhibitor. Nobody has run that, and sawamura2025 does not answer it.
  THE LARGEST UNKNOWN IN THE WHOLE PLAN, STATED SO IT IS NOT BURIED: AN FGFR3 INHIBITOR AND A CNP ANALOGUE
  HAVE NEVER BEEN GIVEN TOGETHER IN ANY SPECIES. Three targeted searches found nothing, and a further search
  at round 142 confirmed it. The zonal model predicts additivity - FGFR3 blockade brings proliferation, CNP
  brings hypertrophy - but both agents converge on ERK, and this atlas used exactly that collision argument
  to throw growth hormone out of the FGFR arm. If arms 2 and 3 are redundant on ERK, arm 3 buys nothing on
  top of arm 2 and the third drug is cost and risk with no yield.
  AND NOTHING HERE HAS AN ADULT HEIGHT. No CNP analogue and no FGFR3 inhibitor has reported attained final
  or near-adult height in anyone, on either axis. Every number above is a velocity or a prediction.'
quantitative:
- parameter: 'THE KEYSTONE IS THE WEAKEST MONOTHERAPY - THE AROMATASE INHIBITOR IS A MULTIPLIER, NOT AN AGENT'
  value: 'change in PREDICTED adult height, three randomised arms in adolescent boys with idiopathic short
    stature: aromatase inhibitor alone +0.5 cm, growth hormone alone +4.9 cm, BOTH +7.4 cm. Actual height
    change over the trial 14.0, 17.1 and 18.9 cm respectively, ANCOVA p < 0.006. Combination minus best
    single agent = +2.5 cm'
  unit: cm of predicted adult height
  conditions: NCT01248416, 76 adolescent boys with idiopathic short stature, three arms, 2 to 3 years.
    Registry record, not a peer-reviewed report.
  species: human
  source_ref: nct01248416
  uncertainty: 'THE ARITHMETIC OF WHY THIS IS THE KEYSTONE AND ALSO WHY IT MUST NOT BE TAKEN ALONE. Against
    SIMPLE ADDITIVITY the expected combination is 0.5 + 4.9 = 5.4 and the observed is 7.4, an excess of +2.0
    cm at p about 0.22 by this atlas own arithmetic - so the data are CONSISTENT WITH PLAIN ADDITION and do
    NOT establish synergy. n is about 25 per arm, which cannot resolve additivity from synergy. AND THE
    ENDPOINT IS PREDICTED ADULT HEIGHT, WHICH IS THE EXACT SURROGATE THAT HAS FAILED BEFORE ON THIS ARM:
    zegarra2024 saw a year-1 predicted-height gain in both aromatase arms that DID NOT PERSIST at years 2
    and 3, finishing at +1.3 cm combined. The GnRH-analogue version of the same experiment (NCT00355030,
    n = 91) is NULL on true adult height. So this row is the reason to include the arm and simultaneously
    the reason to distrust its size.'
- parameter: 'ANASTROZOLE BEATS LETROZOLE ON ATTAINED ADULT HEIGHT AT THE RIGHT BONE AGE, DESPITE SUPPRESSING
    OESTROGEN LESS'
  value: 'target-height-adjusted ADULT height, propensity-matched boys with idiopathic short stature and bone
    age 13 or above, followed to adult height: anastrozole + GH 0.81 SDS (SD 0.34), letrozole + GH 0.60 SDS
    (SD 0.28), GnRH analogue + GH 0.48 SDS (SD 0.17), p < 0.01. Against this, in a 3-year randomised
    head-to-head (n = 79) letrozole gave HIGHER testosterone, LOWER oestradiol, LOWER IGF-1 and SLOWER
    bone-age advance than anastrozole - a stronger biochemical effect - with NO between-drug difference in
    change in predicted adult height'
  unit: SDS of adult height; direction of biochemical effect
  conditions: cui2025, propensity-score-matched cohort, 32 boys per group, followed 3-monthly to adult
    height; against zegarra2024, 3-year open-label randomised trial, 79 pubertal boys, bone age 14 or below
  species: human
  source_ref: cui2025
  uncertainty: 'THIS IS THE ONLY ATTAINED-ADULT-HEIGHT COMPARISON IN THE WHOLE STACK AND IT IS THE CLOSEST
    POPULATION TO THIS CASE - boys at BONE AGE 13 OR ABOVE, followed to the endpoint that matters. THE
    DISSOCIATION IS THE ACTIONABLE PART: three-fold harder oestrogen suppression bought LESS adult height,
    so this arm should NOT be dosed to maximal suppression and the weaker agent is the right one. LIMITS
    AND THEY ARE SERIOUS. cui2025 is PROPENSITY-MATCHED, NOT RANDOMISED, so allocation was by clinician
    choice and confounding by indication is unexcluded; n = 32 per arm; and EVERY ARM CONTAINS GROWTH
    HORMONE, so this does not license an aromatase inhibitor without GH. The zegarra2024 null on
    between-drug predicted height is in a YOUNGER, less mature population (bone age 14 or below) and at a
    surrogate endpoint, so the two studies are not in direct conflict - but neither is cui2025 confirmed by
    a randomised comparison, and the atlas holds none.'
- parameter: 'INFIGRATINIB - THE BEST-EVIDENCED RATE AGENT, AND IT DOES NOT DISTORT PROPORTION'
  value: 'phase 3, 114 children with achondroplasia aged 3 to 17, oral infigratinib 0.25 mg/kg once daily
    against placebo for 52 weeks: annualised height velocity LS-mean difference +1.74 cm/year (95 per cent
    interval 1.31 to 2.17, P < 0.001); height Z-score +0.32 (96 per cent interval 0.23 to 0.41, P < 0.001);
    UPPER-TO-LOWER SEGMENT RATIO -0.02 (96 per cent interval -0.06 to 0.01). Serious adverse events 4/74 on
    drug against 1/39 on placebo, and NO serious adverse event and NO discontinuation judged related to
    study drug'
  unit: cm/year, Z-score, ratio units
  conditions: savarirayan2026infig, PROPEL3, NCT06164951, randomised double-blind placebo-controlled,
    published in the New England Journal of Medicine. ABSTRACT READ IN FULL at round 142; the journal is
    not open access and the full text has not been read in this session.
  species: human
  source_ref: savarirayan2026infig
  uncertainty: 'THE ULS FIGURE IS THE ONE WORTH NOTICING AND IT WAS NOT IN THIS ATLAS UNTIL ROUND 142.
    Infigratinib returns -0.02 on the upper-to-lower segment ratio - THE SAME POINT ESTIMATE the CNP-analogue
    meta-analysis returns for its own ULS ratio. Two pharmacologically unrelated axes, two randomised
    datasets, the same answer: neither distorts proportion at 52 weeks. That is reassurance for a
    spine-reserve case from an unexpected direction, and it also means proportionality CANNOT be used to
    choose between the axes. CAVEATS. This is ACHONDROPLASIA, where the baseline is disproportionate and
    the FGFR3 headroom is enormous, so +1.74 cm/year does NOT transfer to a normal FGFR3 background - the
    same scaling problem that cuts the CNP numbers cuts these. The bone-age-sparing and no-FGFR1-signal
    claims this atlas carries for infigratinib come from the ICCBH CONFERENCE PRESENTATION and are NOT in
    the NEJM abstract; they remain conference-grade until the full text is read. And absence of adverse
    events is being read as absence of target engagement, which it is not.'
- parameter: 'THE COMPOUND THIS CASE MOST WANTS IS THE ONE IT CANNOT GET'
  value: 'TYRA-300 (dabogratinib), FGFR3-ISOFORM-SELECTIVE: increased nasoanal, tibial and femoral length IN
    WILD-TYPE MICE as well as in two FGFR3-mutant models, raised BOTH proliferation and differentiation, and
    INCREASED LUMBAR VERTEBRAE LENGTH and improved intervertebral disc shape. Its only human evidence is
    THREE CASE REPORTS in adults with metastatic urothelial carcinoma. Its only skeletal trial, BEACH301
    (NCT06842355), is phase 2 in ACHONDROPLASIA AGED 3 TO 10 YEARS'
  unit: qualitative; trial eligibility in years
  conditions: tyra300_2025 for the mouse data; dabogratinib2026 for the first-in-human oncology cases;
    NCT06842355 eligibility read from the ClinicalTrials.gov API at round 142
  species: multiple
  source_ref: tyra300_2025
  uncertainty: 'THE WILD-TYPE ARM IS WHAT MAKES THIS COMPOUND DIFFERENT AND IT IS THE PROPERTY EVERY OTHER
    AGENT IN THE STACK LACKS. Every other efficacy number here - CNP analogues, infigratinib, erdafitinib -
    comes from a plate with a PATHOLOGICAL brake being released, which is why scaling to a normal skeleton
    needs a mouse genotype ratio and loses most of the effect. TYRA-300 grew a NORMAL mouse. It also grew
    the compartment this case has reserve in. NONE OF THAT IS A HUMAN GROWTH RESULT: there is no human
    skeletal endpoint for this molecule at any age, the mouse work is a single paper, and the age ceiling on
    its only skeletal trial is 10 years. Recorded so that if BEACH301 widens its eligibility, or an adult
    oncology supply route becomes relevant, this atlas already knows this is the molecule to want.'
- parameter: 'VOSORITIDE OVER NAVEPEGRITIDE - THE TISSUE-LEVEL ARGUMENT THE ATLAS HELD BUT NEVER APPLIED'
  value: 'human growth plate transcript levels: MME (neprilysin) maximum 1062 against NPR2 1262 - the target
    tissue transcribes the protease that degrades CNP at a level COMPARABLE TO THE RECEPTOR ITSELF.
    VOSORITIDE is engineered NEP-RESISTANT; NAVEPEGRITIDE releases UNMODIFIED CNP-38, which IS a NEP
    substrate. Head-to-head efficacy is indistinguishable at the whole-body level: vosoritide +1.57 cm/year,
    navepegritide +1.49 cm/year, pooled class +1.36'
  unit: transcript units; cm/year
  conditions: transcript levels from the_plate_consumes_cnp_it_does_not_make_it; velocity figures from
    savarirayan2020, nct05598320 and cnpmeta2026, all in achondroplasia
  species: human
  source_ref: savarirayan2020
  uncertainty: 'THIS IS A MECHANISTIC TIE-BREAK ON A CHOICE THAT IS OTHERWISE A COIN FLIP, AND IT IS AN
    INFERENCE, NOT A MEASUREMENT. The two agents are statistically indistinguishable on the only endpoint
    anyone has measured. THE CASE FOR VOSORITIDE RESTS ON TWO HELD FINDINGS COMBINING: thread 3 concluded
    that CONTINUOUS RECEPTOR EXPOSURE IS NOT REQUIRED, which removes navepegritide main advantage, and the
    plate transcribes its own CNP protease at receptor-comparable levels, which turns navepegritide native
    CNP-38 payload into a local liability. NEITHER STEP IS DIRECTLY TESTED. Transcript is not protein and
    not activity; no one has measured either drug INSIDE a growth plate in any species; and the weekly
    agent has real adherence advantages over a daily injection that are not modelled here at all. If a
    growth-plate concentration is ever measured for either agent this row should be revisited first.'
- parameter: 'THE PAIRING AT THE CENTRE OF THE PLAN HAS NEVER BEEN RUN IN ANY SPECIES'
  value: 'NO study has given an FGFR3 inhibitor and a CNP analogue to the same animal or person. The two
    FLANKING pairings are both done and they DISAGREE exactly as the zonal model predicts: GH plus CNP IS
    additive in humans (+2.74 cm/year, mcdonnell2026), GH plus FGFR3 inhibition is NOT additive on length in
    mice (sawamura2025)'
  unit: qualitative; cm/year for the flanking pairings
  conditions: three targeted Europe PMC searches on 2026-08-07 and a fourth at round 142, all returning no
    preclinical or clinical study administering both classes
  species: not_applicable
  source_ref: mcdonnell2026
  uncertainty: 'THE ZONAL MODEL PREDICTS ADDITIVITY AND THE ERK MODEL PREDICTS REDUNDANCY, AND THIS ATLAS
    HAS USED BOTH ARGUMENTS IN OTHER PLACES. Zonal: CNP partitions onto HYPERTROPHY (nakao2015, type X layer
    to 23.0 per cent of control on Npr2 deletion against 71.1 per cent for the non-hypertrophic layer),
    FGFR3 blockade raises PROLIFERATIVE-zone length (kot2026), so they occupy different compartments and
    should add. ERK: a CNP analogue works by inhibiting the RAF-1 step to LOWER ERK, and an FGFR3 inhibitor
    works by removing FGFR3-driven ERK - the same effector, which is PRECISELY the collision argument this
    atlas used to exclude growth hormone from the FGFR arm (chu2026). ONE THING TILTS TOWARD ADDITIVITY:
    horike2026 shows FGFR3 also signals through CREB INDEPENDENTLY of ERK, so the two agents do not fully
    overlap even on the branch they share. THE HONEST POSITION IS THAT THE THIRD DRUG IN THIS PLAN IS THE
    LEAST JUSTIFIED ONE, and that the experiment which would settle it is four arms in wild-type growing
    mice - see g_l12_fgfr_plus_cnp_combination, tractability 5.'
- parameter: 'AND THE ENDPOINT THAT WOULD JUSTIFY ANY OF THIS DOES NOT EXIST FOR ANY AGENT'
  value: 'attained final or near-adult height has NOT been reported for any CNP analogue, for any FGFR3
    inhibitor, or for any combination of them, in any population. A 2026 systematic review states the
    vosoritide cohorts are still being followed to final height'
  unit: count of programmes reporting the endpoint - zero
  conditions: final_adult_height_endpoint, corroborated by cnpmeta2026 which states adult height is not yet
    known and that children in vosoritide studies will be followed until they achieve final adult height
  species: human
  source_ref: cnpmeta2026
  uncertainty: 'THIS IS THE ROW THAT BOUNDS EVERY OTHER ROW IN THE NODE. Two of the three named compounds
    are supported ONLY by 52-week velocity, which this atlas has repeatedly shown is the surrogate most
    likely to evaporate - zegarra2024 is the in-house example, where a year-1 predicted-height gain vanished
    by year 3 on the very arm this node makes its keystone. THE ONE PLACE ADULT HEIGHT DOES EXIST IS
    cui2025, and it is non-randomised and contains GH in every arm. So the stack is anchored by its
    weakest-evidenced-but-only-endpoint-bearing arm and extended by two better-evidenced-but-surrogate-only
    arms, which is an uncomfortable structure and should be stated rather than smoothed over.'
localization:
- 'growth plate: arms 2 and 3 act at the plate; arm 1 acts systemically on the oestrogen signal that closes it'
- 'the reserve this plan is aimed at is SPINAL and secondarily knee - see costa2021, the thoracolumbar ring
  apophysis runs 4 to 6 years behind the hand at bone age 16'
human_evidence: direct
human_evidence_note: 'Every named compound has randomised human data on a velocity or predicted-height
  endpoint. Only the aromatase arm has ATTAINED adult height data, and that is non-randomised. The choice
  of vosoritide over navepegritide and the whole three-drug combination are inferences, not measurements.'
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: 'Every efficacy number for arms 2 and 3 is measured in ACHONDROPLASIA, where a
  pathological brake is being released, and must be scaled down by a mouse genotype ratio to reach a normal
  FGFR3 background. The subject is also older than every trial population cited.'
confidence: C
claim_grades:
- claim: At bone age 16 the duration arm multiplies the value of every rate agent, so it belongs in any
    stack even though its monotherapy effect is near zero.
  grade: C
  basis: 'Rests on NCT01248416 (+0.5 alone, +7.4 combined) and on cui2025 attained adult height, against
    zegarra2024 where the surrogate gain did not persist and NCT00355030 which is null on true adult height
    for the GnRH-analogue version. A registry record and a propensity-matched cohort, not a randomised
    adult-height trial.'
- claim: Anastrozole is the right aromatase inhibitor for this case rather than letrozole.
  grade: C
  basis: 'One propensity-matched cohort at the right bone age with the right endpoint (0.81 against 0.60
    SDS), supported mechanistically by zegarra2024 showing letrozole suppresses harder and gains nothing.
    Not randomised, n = 32 per arm, and every arm contained GH.'
- claim: Infigratinib is the best-CHARACTERISED amplification agent available to this subject and does not
    distort body proportion at 52 weeks.
  grade: B
  basis: 'A randomised double-blind placebo-controlled phase 3 in the NEJM, n = 114, with the ULS ratio as a
    prespecified key secondary at -0.02. Not A because the population is achondroplasia, the endpoint is
    52-week velocity rather than adult height, and only the abstract has been read. NOTE THE WORD CHANGE
    (CORR-147): best-characterised, NOT best-performing. Its +1.74 cm/year is measured at a dose an order
    of magnitude below the molecule own oncology exposure and is a regulatory floor, not a biological
    ceiling.'
- claim: Erdafitinib pays a net FGFR1 and FGFR4 cost that a selective agent avoids, so its net mechanism is
    unfavourable.
  grade: X
  basis: 'RETRACTED TWICE NOW - CORR-046 and again CORR-147. Built entirely from Col2a1-Cre and germline
    mouse knockouts asking whether a receptor is required to BUILD a growth plate. Neither FGFR1 nor FGFR4
    has any reported human stature phenotype in either direction; FGFR3 spans about 65 cm. The measured net
    effect of the pan-FGFR agent in a growing human was large and positive. The case for a selective agent
    is SAFETY AND MARGIN, not net mechanism.'
- claim: The eleven-fold velocity gap between erdafitinib and infigratinib is dose rather than molecule.
  grade: D
  basis: 'The atlas standing reading, and it is an inference across two preparations - n = 1 uncontrolled
    at 5 to 7 mg with interruptions against a randomised phase 3 at a weight-based paediatric dose, in
    different populations at different ages. It is well-motivated (the selective agents have never been
    dosed near their own oncology exposures) and it is not measured. No FGFR3 inhibitor has a
    dose-response curve for growth in any species.'
- claim: Vosoritide is preferable to navepegritide at the growth plate specifically.
  grade: E
  basis: 'An inference chaining two held findings - continuous receptor exposure is not required, and the
    plate transcribes neprilysin at receptor-comparable levels - neither of which was measured for this
    purpose. No head-to-head exists and the two agents are statistically indistinguishable on velocity.'
- claim: An FGFR3 inhibitor and a CNP analogue are additive.
  grade: E
  basis: 'NEVER TESTED IN ANY SPECIES. The zonal model predicts additivity and the shared-ERK model predicts
    redundancy, and this atlas has used each argument elsewhere. Recorded as the weakest link in the plan.'
- claim: Growth hormone belongs in a final-height-optimal stack for this case.
  grade: C
  basis: 'REVERSED FROM "EXCLUDED" AT CORR-148. Positive side, and two thirds of it is human: GH is additive
    with a CNP analogue in people (+2.74 cm/year, mcdonnell2026); GH grows HUMAN growth plate tissue
    directly in explant culture (chu2026); GH is the largest single contributor in the only combination
    trial with a height endpoint (+4.9 cm PAH alone against +0.5 for the aromatase inhibitor); and every
    attained-adult-height figure in this atlas comes from a GH-containing regimen. Negative side is one
    mouse study using a repositioned antihistamine rather than an FGFR inhibitor, whose WILD-TYPE arm shows
    GH outperforming that agent broadly, and which is underpowered to exclude PARTIAL additivity. Not
    graded higher because GH spends bone age, the KIGS dose-response saturates on final height, and the
    specific question - does GH add on top of a POTENT RECEPTOR-LEVEL FGFR3 inhibitor - has never been
    tested in any species.'
- claim: Growth hormone is redundant with, and partly antagonistic to, FGFR3-pathway inhibition.
  grade: D
  basis: 'CORR-148 / SD-002. THE ANTAGONISM HALF IS FALSIFIED - sawamura2025 states explicitly that neither
    an additive nor an ATTENUATING effect was observed, against a round-47 prediction of antagonism from
    the ERK collision.
    The redundancy half survives only as a possibility: one study, an achondroplasia model plus a
    wild-type arm, a downstream antihistamine rather than a receptor-level inhibitor, n = 8 per group, and
    power sufficient to exclude full but not partial additivity.'
