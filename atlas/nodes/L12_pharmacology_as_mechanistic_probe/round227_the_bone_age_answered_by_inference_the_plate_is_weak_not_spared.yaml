translation_risk: moderate
translation_risk_reason: 'The human events are in children with advanced cancer carrying several independent
  causes of fracture, and the inference to a mineralisation mechanism is not directly tested anywhere.'
confidence: B
claim_grades:
- claim: physeal widening under an FGFR inhibitor indicates preserved proliferative reserve
  grade: E
  basis: 'REGRADED DOWN AND NOW THE LESS LIKELY OF TWO READINGS. A plate converting reserve into length does
    not separate and the bone below it does not fracture. RAGNAR gives serious epiphysiolysis in 1 of 11 and
    serious tibia fracture in 2 of 11 children, the label states epiphysiolysis and bone fractures occurred,
    brizini2024 has widening with no growth, kot2026 has reduced bone strength in wild-type males, and the
    Voxzogo report has physis dislocation in healthy animals'
- claim: the growth plate and bone are mechanically weakened under FGFR3-axis suppression
  grade: C
  basis: FIVE INDEPENDENT LINES IN THREE SPECIES - a paediatric trial cohort with epiphysiolysis and multiple
    fractures, a regulatory label, a case report of slipped epiphysis with physeal widening, a wild-type
    mouse study with reduced stiffness, yield point and ultimate force, and a regulatory account of physis
    dislocation and femoral head necrosis in healthy rats. No study tests it directly and every human source
    is confounded by advanced disease
- claim: the apparent absence of bone-age advance under erdafitinib reflects impaired mineralisation rather
    than preserved reserve
  grade: E
  basis: 'THE ROUND''S CENTRAL INFERENCE AND IT IS AN INFERENCE. A bone age is a mineralisation reading; the
    same drug produces reversible metaphyseal sclerosis, epiphysiolysis, fractures and deranged phosphate and
    parathyroid handling. One mechanism explains all of it. NOT TESTED ANYWHERE, and the competing reading is
    not excluded'
- claim: accelerated linear growth appears in the BALVERSA label
  grade: A
  basis: TRUE IN THE CURRENT LABEL AND ABSENT FROM THE OCTOBER 2024 REVISION. This atlas carried the claim
    from a user remark recorded in CORR-046 and never verified it; it is correct, and it became correct
    during 2025
- claim: the APEC1621B growth plate films have been reported
  grade: X
  basis: FALSE, CONFIRMED FROM THE PRIMARY SOURCE. The ASCO abstract reports the tumour endpoint,
    hyperphosphataemia, nail changes, vision changes, one spinal cord compression and one intracranial
    haemorrhage, and contains not one word about the growth plate
