id: round227_the_bone_age_answered_by_inference_the_plate_is_weak_not_spared
name: ROUND 227 - the bone-age question answered by inference from a direction nobody tried; erdafitinib's
  paediatric cohort fractures at a rate that no preserved-reserve reading survives, bone age is a
  MINERALISATION reading, and the property that made the FGFR arm look ideal for a late bone age is most
  parsimoniously an artefact of the instrument
type: hypothesis
layer: L12
aliases:
- the plate is weak not spared
- bone age is a mineralisation reading
- RAGNAR paediatric cohort
- epiphysiolysis and tibia fractures
- round 227
stub: false
summary: 'THE BONE AGE COULD NOT BE FOUND DIRECTLY. IT CAN BE ANSWERED BY INFERENCE, AND THE ANSWER INVERTS
  THE READING THIS PROGRAMME HAS BEEN CARRYING SINCE ROUND 224.

  THE ASCO ABSTRACT SETTLES ONE THING BY OMISSION. APEC1621B''s only published output reports the tumour
  endpoint, hyperphosphataemia, nail changes, grade 1 vision changes, one grade 3 spinal cord compression and
  one grade 4 intracranial haemorrhage. IT CONTAINS NOT ONE WORD ABOUT THE GROWTH PLATE, in a trial whose
  protocol mandates a baseline and serial tibial physeal radiograph in every patient with central submission.
  The films were taken and were not reported. Round 226''s conclusion is confirmed from the primary source.

  THE LABEL SUPPLIED IS THE WRONG REVISION AND CHASING THAT PRODUCED THE ROUND. Revision s010 of October 2024
  has NO growth language at all - its paediatric section is animal toxicology only. THE CURRENT LABEL, on
  DailyMed at 17 November 2025, HAS IT: skeletal adverse reactions have occurred in paediatric patients; IN A
  STUDY INCLUDING PAEDIATRIC PATIENTS AGED 6 TO UNDER 18 WITH FGFR-POSITIVE ADVANCED SOLID TUMOURS,
  EPIPHYSIOLYSIS AND BONE FRACTURES OCCURRED; and in the postmarket setting and literature reports, cases of
  slipped capital femoral epiphysis and ACCELERATED LINEAR GROWTH have been reported. So this atlas''s
  long-standing claim that accelerated growth is labelled is TRUE, was UNVERIFIED when adopted from a user
  remark in CORR-046, and was added between October 2024 and November 2025 - not from a five-case series but
  from a named study plus postmarket reports.

  AND THAT SENTENCE NAMES A TRIAL THIS ATLAS HAD NEVER OPENED. RAGNAR, NCT04083976, has POSTED RESULTS with a
  cohort labelled PEDIATRIC COHORT, n = 11. In those eleven children, on erdafitinib: SERIOUS TIBIA FRACTURE
  IN 2 OF 11 AND SERIOUS EPIPHYSIOLYSIS IN 1 OF 11, with foot fracture, unspecified fracture, upper limb
  fracture, wrist fracture, scoliosis, bone pain and fracture pain each in 1 of 11, PAIN IN EXTREMITY IN 5 OF
  11, arthralgia in 3 and myalgia in 2. Mineral handling is deranged in the same eleven -
  HYPERPHOSPHATAEMIA 7 OF 11, HYPERPARATHYROIDISM 2 OF 11, hypercalcaemia 2 and hypocalcaemia 2. The adult
  and adolescent broad-panel cohort of 217 had one hip fracture, two tibia fractures, one epiphysiolysis and
  one scoliosis; the other two cohorts, 35 and 53, had none.

  A GROWTH PLATE THAT IS WIDENING BECAUSE IT IS MAKING MORE CELLS AND CONVERTING RESERVE INTO LENGTH DOES NOT
  SEPARATE, AND THE BONE BELOW IT DOES NOT FRACTURE. Round 224 set out two readings of the physeal widening
  seen in these children - PRESERVED RESERVE against ARRESTED REMODELLING, a plate accumulating matrix it
  cannot clear. FIVE INDEPENDENT LINES NOW POINT AT THE SECOND. RAGNAR''s epiphysiolysis and fractures. The
  label''s own wording. brizini2024, where the proximal femoral physis WIDENED and the height DID NOT MOVE
  before the epiphysis slipped. kot2026, where infigratinib REDUCED stiffness, yield point and ultimate force
  in wild-type males. And the Voxzogo CHMP report, where suppressing the same axis from the other end gave
  DISLOCATION OF PHYSIS, reduced mechanical stability and femoral head necrosis in HEALTHY animals.

  AND THAT IS WHAT ANSWERS THE BONE AGE, BECAUSE A BONE AGE IS A MINERALISATION READING. Greulich and Pyle
  score the appearance, size and fusion of MINERALISED epiphyseal ossification centres on a hand and wrist
  film. AN AGENT THAT IMPAIRS METAPHYSEAL AND EPIPHYSEAL MINERALISATION WOULD MAKE BONE AGE APPEAR NOT TO
  ADVANCE WHILE PRESERVING NO PROLIFERATIVE CAPACITY WHATEVER. raimann2024 supplies the confirming detail
  without meaning to - it reports PROFOUND METAPHYSEAL SCLEROSIS appearing at treatment onset and
  NORMALISATION OF BONE MINERALISATION AFTER THE TREATMENT HALT. A mineralisation abnormality that reverses
  when the drug stops is a drug effect ON MINERALISATION.

  SO THE INFERENCE, STATED AS THE HYPOTHESIS IT IS. THE APPARENT ABSENCE OF BONE-AGE ADVANCE UNDER
  ERDAFITINIB IS MOST PARSIMONIOUSLY EXPLAINED BY IMPAIRED MINERALISATION RATHER THAN BY PRESERVED
  PROLIFERATIVE RESERVE. It explains the widening, the fractures, the epiphysiolysis, the reversible
  sclerosis, the deranged phosphate and parathyroid handling, and the unadvanced bone age with ONE mechanism
  instead of two. THE PROPERTY THAT MADE THE FGFR ARM LOOK IDEAL FOR A CASE AT BONE AGE 16 - GROWTH WITHOUT
  SPENDING THE CLOCK - MAY BE AN ARTEFACT OF THE MEASURING INSTRUMENT.

  WHAT WOULD DISTINGUISH THEM IS CHEAP AND HAS NEVER BEEN DONE. If the reserve is preserved, the plate is
  proliferating and the deficit is in mineralisation, so a bone age read by a MINERALISATION-INDEPENDENT
  method - MRI physeal morphology, or simply physeal width against measured length gain over the same
  interval - would diverge from the Greulich-Pyle reading. If the reserve is being spent normally and only
  the mineral front lags, they converge. THE FILMS TO DO THIS EXIST IN APEC1621B AND HAVE NEVER BEEN READ.

  WHAT THIS DOES NOT DO, AND CORR-046 STILL BINDS. It does not overturn the fact that children grew - 19.06
  cm/year in one and 10 cm/year in another are measured heights, not inferences. THE QUESTION THIS ROUND
  CHANGES IS NOT WHETHER THE DRUG GROWS BONE BUT WHAT IT IS SPENDING TO DO IT, and the honest answer is that
  the currency may be matrix quality rather than divisions. A stack aimed at maximum ADULT height cannot tell
  those apart from a velocity, and neither can a bone age if the bone age is measuring the same thing that is
  broken.'
quantitative:
- parameter: skeletal adverse events in the erdafitinib PAEDIATRIC cohort
  value: 'RAGNAR NCT04083976, cohort EG003 labelled PEDIATRIC COHORT, n = 11. SERIOUS - tibia fracture 2/11,
    EPIPHYSIOLYSIS 1/11, musculoskeletal pain 1/11. NON-SERIOUS - foot fracture 1/11, fracture 1/11, upper
    limb fracture 1/11, wrist fracture 1/11, scoliosis 1/11, bone pain 1/11, fracture pain 1/11, PAIN IN
    EXTREMITY 5/11, arthralgia 3/11, myalgia 2/11. MINERAL HANDLING - hyperphosphataemia 7/11,
    hyperparathyroidism 2/11, hypercalcaemia 2/11, hypocalcaemia 2/11. Comparators - broad panel n = 217 with
    hip fracture 1, tibia fracture 2, epiphysiolysis 1, scoliosis 1; CCA expansion n = 35 and exploratory n =
    53 with none'
  unit: participants affected per participants at risk
  conditions: ClinicalTrials.gov posted results read via the v2 API on 2026-08-10; children with locally
    advanced or metastatic solid tumours harbouring FGFR alterations
  species: human
  source_ref: ragnar_results_2026
  uncertainty: 'ELEVEN CHILDREN AND NO CONTROL ARM. Overlap between events within the same child cannot be
    read from an adverse-event table, so the number of AFFECTED CHILDREN is between three and six rather
    than the sum. These are children with advanced cancer, frequently on or after radiotherapy and
    corticosteroids, both of which cause fractures independently, and several had CNS tumours with the
    immobility and nutritional compromise that follow. WHAT SURVIVES THE CONFOUNDING IS THE CONTRAST WITH THE
    ADULT COHORT - 2 tibia fractures in 11 children against 2 in 217 adults, and 1 epiphysiolysis in 11
    against 1 in 217'
- parameter: the current label wording, and the revision that lacks it
  value: 'BALVERSA prescribing information as published 17 November 2025, section 8.4 - SKELETAL ADVERSE
    REACTIONS HAVE OCCURRED IN PEDIATRIC PATIENTS TREATED WITH BALVERSA; in a study including paediatric
    patients aged 6 to under 18 years with FGFR-positive advanced solid tumours, EPIPHYSIOLYSIS AND BONE
    FRACTURES OCCURRED; in the postmarket setting and in literature reports, cases of SLIPPED CAPITAL FEMORAL
    EPIPHYSIS and ACCELERATED LINEAR GROWTH have been reported. REVISION s010 OF OCTOBER 2024 CONTAINS NONE
    OF THIS - its paediatric section is animal toxicology only. Juvenile animal data in both revisions -
    chondroid dysplasia/metaplasia in multiple bones in rats and dogs AT AN EXPOSURE LESS THAN THE HUMAN
    EXPOSURE at the maximum recommended human dose'
  unit: label text
  conditions: DailyMed setid 2a8aa5c0-6c92-4566-8c45-e8f4d1fc20ee against the supplied s010 PDF
  species: human
  source_ref: balversa_label_2025
  uncertainty: 'A LABEL RECORDS THAT EVENTS OCCURRED, NOT AT WHAT RATE OR IN HOW MANY. The rate comes from
    RAGNAR''s posted results, which is a separate document. This atlas carried the accelerated-growth claim
    from a USER REMARK recorded in CORR-046 and never verified it against a label; it turns out to be true
    and to have become true only in 2025'
- parameter: the mineralisation inference
  value: 'a Greulich-Pyle bone age scores the appearance, size and fusion of MINERALISED epiphyseal
    ossification centres, so impaired mineralisation would present as an unadvanced bone age without any
    preservation of proliferative capacity. raimann2024 reports PROFOUND METAPHYSEAL SCLEROSIS at treatment
    onset with NORMALISATION OF BONE MINERALISATION AFTER THE TREATMENT HALT; brizini2024 reports physeal
    widening with NO growth; RAGNAR reports epiphysiolysis and fractures; kot2026 reports reduced stiffness,
    yield point and ultimate force in wild-type males; the Voxzogo CHMP report describes physis dislocation
    and reduced mechanical stability in healthy animals'
  unit: converging qualitative lines
  conditions: assembled in round 227; no single study tests the inference
  species: multiple
  source_ref: erdaseries2025
  uncertainty: 'THIS IS AN INFERENCE FROM FIVE CONVERGING OBSERVATIONS AND NOT A MEASUREMENT, AND IT IS
    GRADED ACCORDINGLY. The confounders are real - advanced cancer, radiotherapy, corticosteroids,
    immobility, and in the FGFR class a phosphate-wasting-then-retaining biology that disturbs mineralisation
    independently of any effect on cartilage. The competing reading, that the plate genuinely proliferates
    and the fractures are a separate phosphate phenomenon, is not excluded'
  value_unverified: true
localization:
- 'the proximal tibial and femoral physis, which separated in one child and fractured in two'
- 'the metaphysis, where sclerosis appeared under drug and normalised after withdrawal'
- 'the mineralised epiphyseal ossification centre, which is the thing a bone age actually reads'
human_evidence: direct
human_evidence_note: 'Eleven children in a posted trial results table, the current US label, and three case
  reports. The mineralisation inference is assembled from these plus two animal sources.'
