contradicts:
- 'ROUND 224''s framing in which physeal widening without bone-age advance is the ideal profile for a case at
  bone age 16. A plate that widens, separates and fractures is not a plate that is being spared, and a bone
  age is a mineralisation reading that an agent impairing mineralisation would leave apparently unadvanced.'
- 'This atlas''s carriage of the accelerated-growth-in-the-label claim as verified. It came from a user
  remark recorded in CORR-046 and was propagated into nodes without checking a label. It is TRUE in the
  current label and ABSENT from the October 2024 revision, so it was unverifiable at the time it was adopted.
  Recorded as CORR-231.'
