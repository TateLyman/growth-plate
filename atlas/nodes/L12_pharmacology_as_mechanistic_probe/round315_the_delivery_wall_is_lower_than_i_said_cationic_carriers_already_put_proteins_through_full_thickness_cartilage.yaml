id: round315_the_delivery_wall_is_lower_than_i_said_cationic_carriers_already_put_proteins_through_full_thickness_cartilage
name: ROUND 315 - the objection I raised against my own biologic proposal is answered, and better than expected.
  Cationic peptide carriers already drive 7.6 and 17 kDa PROTEINS through FULL-THICKNESS cartilage into a depot
  with single-dose efficacy where the unmodified protein fails - and a nanobody sits inside that size range. What
  does NOT exist is any of it in a GROWTH PLATE, which is not an intra-articular tissue
