contradicts: 'This round OVERTURNS the blocking objection round 314 raised against its own proposal. ''The growth
  plate is avascular and alymphatic and a 150 kDa IgG faces that far worse than a 4.1 kDa peptide'' was framed around
  the wrong molecule: neutralising a secreted protein needs a binder, not an IgG, and a ~15 kDa single-domain antibody
  sits between two proteins already shown to cross full-thickness cartilage when charge-engineered. Round 314''s
  ranked ask therefore stands with its blocker downgraded. It simultaneously RELOCATES the wall to a narrower and
  more honest place - no charge-engineered protein has ever been delivered to a GROWTH PLATE, all the enabling work
  is articular cartilage reached by intra-articular injection, and no nanobody has been delivered to cartilage at
  all.'
