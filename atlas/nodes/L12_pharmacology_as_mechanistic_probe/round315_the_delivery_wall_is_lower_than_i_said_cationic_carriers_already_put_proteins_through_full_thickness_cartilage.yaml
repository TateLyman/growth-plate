claim_grades:
- claim: A protein biologic cannot be delivered into cartilage.
  grade: X
  species: bovine
  source_ref: vedadghavami2022
  basis: NO - this was round 314's own objection against its own proposal and it is substantially wrong. Conjugation
    to an arginine-rich hydrophilic cationic peptide carrier of net charge +14 drove IGF-1 (7.6 kDa) through the
    FULL THICKNESS of cartilage into a bound depot while unmodified IGF-1 cleared, and a single dose remained effective
    across 16 days where free IGF-1 was not. IL-1Ra (17 kDa) reproduces it via CPC+14 or avidin. In vivo, catIL-1RA
    gave a 25-fold synovial-fluid increase at one week over anakinra with preserved receptor binding, and worked
    in explants where anakinra failed at 4-fold the dose. Published design rules exist - evenly distributed cationic
    residues and minimal hydrophobicity for the deepest, longest penetration - so this is engineering rather than
    a single lucky molecule.
- claim: The objection round 314 raised was the right objection.
  grade: X
  species: human
  source_ref: vedadghavami2022
  basis: 'PARTLY NO. The objection was framed around a 150 kDa IgG, and that framing was the error: neutralising
    a SECRETED protein requires a binder, not a full antibody, and a single-domain antibody at roughly 15 kDa sits
    BETWEEN IGF-1 at 7.6 kDa and IL-1Ra at 17 kDa, both of which cross full-thickness cartilage when charge-engineered.
    The real wall is different and narrower: every one of those results is ARTICULAR cartilage reached by INTRA-ARTICULAR
    injection, and the growth plate is not an intra-articular tissue. Getting the modality right moved the problem
    rather than solving it.'
- claim: A charge-engineered protein has been delivered to a growth plate.
  grade: X
  species: mouse
  source_ref: ye2026
  basis: 'NO, in any species - this is the genuine gap. All cationic-carrier work is articular cartilage by intra-articular
    injection. The nearest result is ye2026, which carried purmorphamine - a SMALL MOLECULE, not a protein - to
    growth-plate cartilage from a tail vein using chondrocyte-membrane-coated PLGA bearing WYRGRL. What makes the
    extrapolation reasonable rather than wishful is that the physical mechanism is present in the target tissue:
    calf epiphyseal cartilage has a fixed charge density of -0.19 to -0.35 M against -0.28 M for the articular cartilage
    used in every delivery experiment above. That is grade E - a physical parameter, not a delivery measurement.'
- claim: A nanobody has been delivered to cartilage.
  grade: X
  species: human
  source_ref: vedadghavami2022
  basis: NO. Searched Europe PMC and web and found no single-domain antibody delivered to cartilage, chondrocytes
    or growth plate in any species; the atlas itself contains zero mentions of nanobody or affibody. The size-class
    argument therefore rests entirely on IGF-1 and IL-1Ra, which are proteins of similar mass but different shape,
    charge and stability. Recorded as a gap rather than glossed, because the whole construct proposed here depends
    on it.
