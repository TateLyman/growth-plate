id: duration_velocity_combination
name: Combining a duration agent with a velocity agent - it has been tried, and the two duration classes behave differently
type: intervention
layer: L12
stub: false
summary: 'This atlas asserted on 2026-08-06 that no trial had ever combined a duration-extending agent with a velocity
  agent and measured adult height, then - having found five such trials - asserted that the adult-height data either
  did not exist or had never been posted. BOTH WERE WRONG (CORR-016, CORR-017). Every one of the informative trials
  was published, and between them they answer the question. COMBINING AN AROMATASE INHIBITOR WITH GROWTH HORMONE WORKS,
  MODESTLY, AND THE SURROGATE CONVERTED. At near-final height in 71 pubertal boys with idiopathic short stature, height
  SDS was -1.0 on the combination against -1.4 on either agent alone (P=0.06), and absolute height change was +22.5
  cm against +20.6 for growth hormone and +18.2 for the aromatase inhibitor (P=0.01), where +13.0 cm was expected.
  A second, independent matched cohort reaching TRUE adult height agrees, at 173.1 against 169.8 cm, but only in those
  exposed for at least two years. COMBINING A GnRH ANALOGUE WITH GROWTH HORMONE DOES NOT, in the one randomised test
  with a true endpoint: -1.8 against -1.9 SDS in 91 children. Its own velocity data shows why - a GnRH analogue removes
  the pubertal spurt along with the fusion signal, and the two cancel. Duration agents are not one class. AND THE
  PRIZE IS BOUNDED. A 2026 retrospective of 72 males followed to near-final height finds that earlier pubertal stage
  at start (P=0.012), longer treatment (P=0.005) and concurrent growth hormone (P=0.022) each independently predict
  greater gain - confirming all three differences this atlas had hypothesised between the pharmacological and the
  genetic lever - while the overall median gain is +1.2 cm and the best subgroup, letrozole, reaches a median +4.2
  cm. Optimising every identified factor gets to single-digit centimetres. The 25 cm of the ESR1 and CYP19A1 nulls
  remains unapproached, and the one trial that started before puberty (in congenital adrenal hyperplasia) is NULL
  on adult height and its authors recommend against the regimen.'
quantitative:
- parameter: GnRH ANALOGUE plus growth hormone, ATTAINED ADULT HEIGHT
  value: -1.8 combination vs -1.9 growth hormone alone
  unit: adult height SDS
  conditions: NCT00355030, 91 pubertal children with idiopathic short stature randomised to somatropin 0.05 mg/kg/day
    plus 3-monthly leuprorelin 11.25 mg, or somatropin alone. PRIMARY endpoint, results posted
  species: human
  source_ref: nct00355030
  uncertainty: 'A NULL ON THE ENDPOINT THAT MATTERS, and it is the only trial in the set with a TRUE ATTAINED adult
    height as its primary. SD 0.53 and 0.77, so the 0.1 SDS difference is well inside noise. The secondary readouts
    show the mechanism working and cancelling: bone age is consistently lower in the combination arm (15.2 vs 17.0
    years at one visit), height velocity is lower during treatment and higher afterwards, and the percentage reaching
    a normal adult height SDS is 26.7 vs 25.6. One secondary favours the combination - adult height minus TARGET height
    -0.6 vs -1.2 - which the atlas records without weighting, because the primary is null and selecting a favourable
    secondary after seeing a null primary is the defect this atlas exists to avoid.'
- parameter: AROMATASE INHIBITOR plus growth hormone, PREDICTED adult height
  value: AI alone +0.5, GH alone +4.9, COMBINATION +7.4
  unit: cm, least-squares mean change in predicted adult height
  conditions: 'NCT01248416, 76 adolescent boys with idiopathic short stature, ages 12-18, three arms: anastrozole
    1 mg or letrozole 2.5 mg daily; somatropin 0.3 mg/kg/week; or both, for 2-3 years. Standard errors 1.0, 0.9 and
    0.9. Actual height change over the same period was 14.0, 17.1 and 18.9 cm, ANCOVA p<0.006'
  species: human
  source_ref: nct01248416
  uncertainty: 'UPDATED 2026-08-06 - THE NEAR-FINAL HEIGHT WAS PUBLISHED IN 2016 AND THIS ATLAS SAID IT MIGHT NOT
    EXIST (CORR-017). mauras2016, n=71 at age 17.4 years with about 97.6% of adult height achieved: height SDS AI
    -1.4, GH -1.4, AI/GH -1.0 (P=0.06); absolute height change +18.2, +20.6, +22.5 cm (P=0.01) against an expected
    +13.0 cm at -2.0 SDS. SO THE SURROGATE LARGELY CONVERTED: the +2.5 cm predicted-height advantage of the combination
    over growth hormone alone came back as about +1.9 cm of real height, and the SDS advantage is +0.4 at P=0.06.
    Bone health, safety labs and adverse events were similar across all three arms over 24-36 months. WHAT IS STILL
    MISSING is true final height rather than 97.6% of it, and bone density measured at final height rather than at
    three years.'
- parameter: bone density cost of the combination
  value: AI alone -1.061, GH alone -0.586, combination -0.605
  unit: change in height-adjusted bone density z-score
  conditions: NCT01248416, same three arms, 2-3 years
  species: human
  source_ref: nct01248416
  uncertainty: ANOVA p = 0.906 - NO DIFFERENCE BETWEEN ARMS WAS DETECTED, and with roughly 25 per arm this trial cannot
    resolve one. The point estimates are suggestive in a direction that matters - the aromatase inhibitor alone is
    the worst for bone and the combination looks like growth hormone alone - but a non-significant ordering is not
    evidence that growth hormone offsets the bone cost, and this atlas does not claim it does. What the row establishes
    is that THE BONE COST WAS MEASURED, which is the minimum any duration-extension programme must do, given that
    the genetic proof of concept for this lever carries a BMD Z of -3.85.
- parameter: EARLY-START aromatase inhibition, TRUE attained adult height
  value: NO DIFFERENCE. -0.34 vs -0.60 SDS, mean difference 0.26 (95% CI -0.29 to 0.82), P = 0.35
  unit: adult height SDS relative to the general population
  conditions: 'NCT00001521, 66 children with congenital adrenal hyperplasia enrolled from age 2, randomised to testolactone
    (aromatase inhibitor) plus flutamide plus reduced-dose hydrocortisone, or conventional treatment, followed to
    adult height. Years of bone age held unchanged: 3.86 vs 2.78'
  species: human
  source_ref: merke2025
  uncertainty: 'CORRECTED 2026-08-06 (CORR-017). This atlas first read the two point estimates off the registry and
    recorded ''a gain of about 0.26 SDS''. THE PUBLICATION GIVES THE INTERVAL AND THE AUTHORS'' CONCLUSION AND BOTH
    ARE NEGATIVE: 95% CI -0.29 to 0.82, P = 0.35, and ''does not result in taller adult stature than those treated
    with standard therapy, and is not recommended''. THIS IS THE DECISIVE RESULT IN THE NODE. It is the earliest-start
    aromatase-inhibitor trial with a TRUE adult height endpoint, predicted adult height improved more in the investigational
    arm at pubertal onset (P=0.049), and THE PREDICTED GAIN DID NOT CONVERT. One subgroup did benefit: girls continued
    on antiandrogen through puberty reached adult minus midparental height of -0.7 vs -5.6 cm (P=0.046). Three drugs
    changed at once and the indication is a steroid-excess disorder, so the aromatase inhibitor''s own contribution
    is still not isolable.'
- parameter: THE CONFOUND THAT MAKES THE AGE GRADIENT UNTESTABLE IN EXISTING TRIALS
  value: 'predicted-height gain by age at start: ages 2-13 +6.21 cm; ages 2-18 about +1.8 cm attained; ages 12-18
    +0.5 cm'
  unit: cm
  conditions: NCT00094328 testotoxicosis, ages 2-13, bicalutamide plus anastrozole, n=14, single arm, change in predicted
    adult height +6.21 cm (SD 3.93); NCT00001521 congenital adrenal hyperplasia from age 2; NCT01248416 idiopathic
    short stature ages 12-18
  species: human
  source_ref: nct00094328
  uncertainty: THE GRADIENT IS IN THE DIRECTION THE TIMING HYPOTHESIS PREDICTS AND IT PROVES NOTHING, BECAUSE AGE
    AT START IS PERFECTLY CONFOUNDED WITH INDICATION. Every trial that started an aromatase inhibitor in a young child
    did so because that child had a disorder of steroid EXCESS - testotoxicosis, congenital adrenal hyperplasia, McCune-Albright.
    In those children the drug corrects a pathological excess. In idiopathic short stature at 12-18 it blocks normal
    physiology. 'Works better when started early' and 'works only when there is pathological oestrogen to remove'
    predict the same gradient and cannot be separated in any existing trial. NOBODY HAS GIVEN AN AROMATASE INHIBITOR
    TO A YOUNG CHILD WITH NORMAL STEROIDOGENESIS, which is the single reason the pharmacological duration lever cannot
    currently be compared with the genetic one.
- parameter: DOES THE EFFECT DEPEND ON WHEN YOU START - measured, at near-final height
  value: earlier pubertal stage P=0.012; longer treatment P=0.005; concurrent growth hormone P=0.022. Overall median
    gain +1.2 cm
  unit: cm, near-final height minus initial predicted adult height
  conditions: 'retrospective chart review of 72 males with advanced or rapidly advancing bone age and compromised
    predicted adult height; 82% anastrozole, 15% letrozole; median treatment 25 months (IQR 18-32); growth hormone
    used in 66%. Diagnoses: GH deficiency 31%, early puberty and premature adrenarche 18%, idiopathic short stature
    15%, overweight/obesity 14%'
  species: human
  source_ref: nearfinal2026
  uncertainty: 'THIS IS THE DIRECT ANSWER TO THE QUESTION THIS ATLAS POSED, and it supports all three of the differences
    the atlas had hypothesised between the genetic and pharmacological duration levers - timing, duration of exposure,
    and combination with a velocity agent - each independently significant in the same cohort. AND IT BOUNDS THE PRIZE:
    the overall median gain is +1.2 cm with an interquartile range that crosses zero (-1.9 to 4.2). The letrozole
    subgroup reaches a median +4.2 cm (IQR 0.6-13) against anastrozole +0.8 cm, P=0.013. RETROSPECTIVE, no control
    arm, no randomisation, medians not means, and ''earlier pubertal stage'' still means WITHIN puberty - not one
    patient started prepubertally. Optimising every factor this study identifies gets to single-digit centimetres,
    not to the 25 cm of the genetic nulls.'
- parameter: THE SURROGATE RANKED TWO DRUGS BACKWARDS FROM THE REAL ENDPOINT
  value: 'at 1 year on PREDICTED height: anastrozole +4.2 vs letrozole +1.4 cm (P=0.03). At NEAR-FINAL height: letrozole
    +4.2 vs anastrozole +0.8 cm (P=0.013)'
  unit: cm
  conditions: neely2014, 39 boys, first-year predicted adult height; nearfinal2026, 72 males, near-final height
  species: human
  source_ref: nearfinal2026
  uncertainty: THE CLEANEST DEMONSTRATION IN THIS ATLAS OF WHY PREDICTED ADULT HEIGHT CANNOT BE TRUSTED IN THIS DRUG
    CLASS. The same two drugs, compared on a surrogate at one year and on near-final height years later, come out
    in OPPOSITE ORDERS, both times with P around 0.01-0.03. Different cohorts, different designs, both retrospective
    or preliminary - so this is not a paired comparison and does not prove the surrogate is invalid. It does mean
    that no ranking of agents in this class based on predicted adult height should be carried forward, which is what
    most of the literature reports.
- parameter: anastrozole plus growth hormone, TRUE adult height, by duration of exposure
  value: no difference overall (P=0.071); at least 2 years of anastrozole, 173.1 vs 169.8 cm (P=0.044)
  unit: cm adult height
  conditions: matched retrospective, 24 pubertal boys on growth hormone plus anastrozole against 24 on growth hormone
    alone, matched for chronological and bone age, pubertal stage, pre-treatment height, treatment duration and midparental
    height; bone age advance 1.37 vs 1.81 years, P=0.001
  species: human
  source_ref: tanriverdi2023
  uncertainty: A SECOND, INDEPENDENT TRUE-ADULT-HEIGHT RESULT AGREEING WITH mauras2016 AND WITH THE DURATION DEPENDENCE.
    The overall comparison is null and only the pre-specified-sounding subgroup of at least 2 years' exposure reaches
    significance, which is exactly the analysis most likely to be a false positive - 24 per group, retrospective,
    matched rather than randomised, and a subgroup defined on treatment received. The bone-age deceleration (P=0.001)
    is the more robust part and it is the mechanism, not the outcome.
localization:
- systemic
human_evidence: direct
human_evidence_note: 'Entirely human and entirely randomised or prospectively controlled, except the single-arm testotoxicosis
  study. The weakness is not the evidence type but the endpoint: only two of the five trials carry a TRUE attained
  adult height, and the one with the largest effect uses predicted adult height, a surrogate this drug class has previously
  failed to convert.'
species_basis:
- human
translation_risk: low
translation_risk_reason: Human trials throughout. The risk is surrogate-to-endpoint, not species-to-species.
confidence: B
confidence_note: B, and better supported than when the node was created, because every trial in it turned out to be
  published and two independent cohorts reach a true or near-final height endpoint with concordant results. Not A
  because the positive combination evidence is one open-label randomised trial at 97.6% of adult height plus one matched
  retrospective whose overall comparison is null, the timing evidence is a retrospective chart review without a control
  arm, and the only prepubertal-start randomised trial with a true adult-height endpoint is negative and its authors
  recommend against the regimen.
