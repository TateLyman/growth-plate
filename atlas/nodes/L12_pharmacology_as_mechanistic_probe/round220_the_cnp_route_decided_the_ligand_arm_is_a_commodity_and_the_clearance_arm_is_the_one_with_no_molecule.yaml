id: round220_the_cnp_route_decided_the_ligand_arm_is_a_commodity_and_the_clearance_arm_is_the_one_with_no_molecule
name: ROUND 220 - the CNP route decided; osteocrin was never a substitute for vosoritide and cannot be
  administered to anyone, the two approved ligand drugs are pharmacologically interchangeable and the
  choice between them is a schedule, and the arm that actually matters for THIS objective function is the
  clearance arm - which has the only measured terminal-cell-height elevation on the axis and no molecule
type: intervention
layer: L12
aliases:
- osteocrin or vosoritide
- the CNP route decision
- navepegritide versus vosoritide
- the clearance arm is the differentiated one
- round 220
stub: false
summary: 'THE QUESTION WAS OSTEOCRIN OR VOSORITIDE. THE FIRST THING TO SAY IS THAT THEY ARE NOT ALTERNATIVES,
  AND THIS ATLAS HAS NEVER CLAIMED THEY WERE. Vosoritide is an NPR2 AGONIST - it supplies ligand.
  Osteocrin is an NPR-C OCCUPIER - it stops ligand being destroyed. kanai2017, the single piece of evidence
  that put osteocrin at the top of the additions ranking in round 209, is a CNP x OSTN DOUBLE TRANSGENIC
  showing ADDITIONAL bone length OVER ELEVATED CNP ALONE. Its entire claim is additivity ON TOP OF a raised
  ligand, not replacement of it. Choosing between them is a category error, and the real questions are
  WHICH LIGAND DRUG and WHETHER THE CLEARANCE ARM IS ADDABLE.

  ANSWER ONE - OSTEOCRIN IS NOT ADMINISTRABLE AND THAT IS NOT A CLOSE CALL. No human has received it, for
  any indication, ever. There is no dose, no pharmacokinetics, no safety data, no route, no regulatory
  path and no source this programme has accepted. Round 211 additionally established that it is a Gi-SILENT
  OCCUPIER in the same functional class as the small-molecule antagonists it was preferred over, so the
  round-209 reason for choosing the peptide - that it would preserve the vascular Gi arm - is gone. ON
  EVERY REMAINING AXIS A 12,600-FOLD SELECTIVE SERUM-STABLE SMALL MOLECULE BEATS A 50-RESIDUE PEPTIDE.
  Osteocrin''s role in this atlas is as the PROOF THAT THE ARM IS ADDITIVE, not as the agent.

  ANSWER TWO - THE TWO APPROVED LIGAND DRUGS ARE PHARMACOLOGICALLY INTERCHANGEABLE AND THE CHOICE IS A
  SCHEDULE. Navepegritide was approved 27 February 2026, once weekly, for children aged two and over with
  achondroplasia and open epiphyses. In APPROACH, 84 treatment-naive children aged 2 to 11, the annualised
  growth velocity difference against placebo was 1.49 cm/year (95 per cent CI 1.05 to 1.93, P less than
  0.001), 5.89 against 4.41. Vosoritide''s randomised effect is about 1.57 cm/year. THAT IS A WASH, AND
  THE ATLAS ALREADY PREDICTED IT WOULD BE - cnp_analog_pk_challenge grades at D that the two reach a
  comparable ceiling despite roughly THREE HUNDREDFOLD different exposure duration, and at B that within
  vosoritide''s dose range exposure tracks urine cGMP but NOT growth. THE CEILING IS DOWNSTREAM OF NPR2.
  A drug that holds the receptor occupied for seven days instead of two hours does not beat a ceiling that
  is not made of occupancy.

  AND THE STRUCTURAL COMPARISON REMOVES THE ONE DISCRIMINATOR I EXPECTED TO FIND. Vosoritide is CNP-39 - a
  17-residue N-terminal extension from the proCNP sequence fused to CNP-22 - and that extension is what
  confers neprilysin resistance by sterically blocking cleavage inside the disulfide ring, taking the
  plasma half-life from about 2.6 minutes for CNP-22 to about 26 minutes. Navepegritide is a PEG carrier
  releasing UNMODIFIED CNP-38, which is CNP-22 with a 16-residue N-terminal extension - ARCHITECTURALLY THE
  SAME SOLUTION TO THE SAME PROBLEM. So the released peptides are likely comparably neprilysin-resistant,
  no head-to-head degradation data exists, and the 90-hour apparent half-life of released CNP-38 in monkey
  is FLIP-FLOP KINETICS FROM THE CARRIER rather than a property of the peptide. Once released, both face
  the same tissue clearance machinery. I looked for a pharmacological reason to prefer one and did not
  find one.

  SO THE LIGAND ARM IS A COMMODITY, AND THE HONEST BASIS FOR PICKING IS NARROW: once-weekly subcutaneous
  against daily subcutaneous over a residual window measured in years, with the age gradient running the
  right way for both (cnpmeta2026 - 1.63 cm/year above age five against 0.91 below, subgroup P = 0.01).
  ON ADHERENCE OVER A MULTI-YEAR WINDOW AT A LATE BONE AGE, WEEKLY WINS, AND THAT IS THE WHOLE ARGUMENT.
  It is not a mechanistic preference and should not be dressed as one.

  ANSWER THREE, AND THIS IS THE ROUND''S ACTUAL FINDING. THE CLEARANCE ARM IS THE DIFFERENTIATED ONE, AND
  IT IS DIFFERENTIATED ON EXACTLY THE AXIS ROUND 198 SAYS DECIDES ADULT HEIGHT. Round 198 fixed the
  objective function as RESERVE x TERMINAL CELL HEIGHT rather than rate x time. Read the two arms against
  it. THE LIGAND ARM, DECOMPOSED IN A PRIMATE: wendt2015, cynomolgus monkey, six months, n = 4 per group,
  high dose - growth rate 26 to 40 micrometres per day, and PROLIFERATING CELLS PER COLUMN FALLING 13 to
  11, with hypertrophic cell PROJECTED AREA up 1.23-fold which CORR-190 forbids reading as a length and
  which gives at most 1.11-fold on height. Closing the Hunziker identity leaves a residual near 1.6-fold
  SITTING ON POOL CONSUMPTION. VOSORITIDE SPENDS THE RESERVE. THE CLEARANCE ARM, MEASURED AT THE CELL:
  weber2025 - Npr3 loss raises MAXIMUM HYPERTROPHIC CHONDROCYTE HEIGHT IN THE AXIS OF ELONGATION by about
  20 per cent against wild-type littermates, and disproportionately elongates proximal and mid-tail
  VERTEBRAE. THAT IS THE FREE AXIS AND A DIFFERENT SITE PROFILE, AND IT IS THE ONLY CELL-LEVEL ELEVATION
  ANYWHERE ON THIS AXIS. Two arms of one pathway with OPPOSITE TERM ASSIGNMENTS is not what anyone would
  predict, and it is the strongest reason in this file to want both.

  AND THERE IS A SECOND, PURELY PHARMACOKINETIC REASON TO PAIR THEM THAT NEEDS NO GENETICS. The atlas
  grades at B that VOSORITIDE ITSELF IS CLEARED IN PART BY NPR3, on the regulator''s own 2021 statement.
  So an NPR3 blocker does not merely raise endogenous ligand alongside the analogue - IT RAISES THE
  ANALOGUE. That is a drug-drug interaction in the wanted direction and it is independent of kanai2017.

  THE HUMAN TISSUE NUMBERS, RE-READ TODAY ON THE RIGHT PLATFORM, SUPPORT THE ARCHITECTURE AND KILL ONE
  CANDIDATE. GSE9160, laser-microdissected zone-resolved human distal femoral growth plate, two normal
  children, five compartments each, against a fixed calibrator band (NPPC floor 4 to 20, PTHLH 7 to 309,
  GDF5 31 to 604): NPR2 up to 1262, NPR3 up to 979, and NPPC AT THE FLOOR IN TEN OF TEN SAMPLES. The plate
  carries the receptor and the clearance sink and MAKES NO LIGAND - it is a consumer, which is what makes
  a clearance blocker act on the local concentration rather than merely on the systemic one. AND THE
  NEPRILYSIN CANDIDATE IS CONFIRMED DEAD ON THE BETTER PLATFORM: ECE1 reaches 2495 and IDE 1847 against
  MME at 1062, so the two alternative peptidases out-transcribe the one sacubitril blocks. MME is also
  strongly DONOR-DEPENDENT - 18 to 160 across all five compartments of donor 1 against 200 to 1062 in
  donor 2 - so quoting its maximum, as this atlas has, overstated it. The droplet-based version of this
  conclusion was reached in every_drug_on_the_cnp_axis on a platform CORR-114 disqualifies; it is now
  reached on one that is admissible, which upgrades it rather than overturning it.

  THE DECISION, STATED SO IT CAN BE ACTED ON. THE LIGAND ARM IS IN AND THE MOLECULE IS NAVEPEGRITIDE, ON
  SCHEDULE ALONE. OSTEOCRIN IS OUT AS AN AGENT AND STAYS IN AS THE EVIDENCE THAT THE CLEARANCE ARM IS
  ADDITIVE. THE CLEARANCE ARM IS THE ONE WORTH WANTING AND HAS NO ADMINISTRABLE MOLECULE - nishizawa2017
  compound 23 and M372049 are characterised, selective and serum-stable, and NEITHER HAS EVER BEEN GIVEN
  TO ANY ANIMAL FOR GROWTH. THE PHOSPHATASE ARM REMAINS CLOSED on the five lines that closed it. NOTHING
  ON THIS AXIS SHOULD BE ADDED BEYOND THE LIGAND DRUG UNTIL THE CLEARANCE ARM HAS ONE ANIMAL BONE-LENGTH
  EXPERIMENT, WHICH NOBODY HAS RUN IN ANY SPECIES.

  WHAT THIS ROUND COULD NOT SETTLE, AND WHY IT IS NOT CLOSED. FIRST, THERE IS NO CELL-LEVEL DECOMPOSITION
  FOR NAVEPEGRITIDE IN ANY SPECIES. wendt2015 decomposed vosoritide and found it spending the reserve; if
  the same primate design has been run for TransCon CNP it is not public, and the two drugs are being
  treated as equivalent on a growth-velocity endpoint that CANNOT SEE the difference that matters. SECOND,
  no trial of either drug reaches bone age 16 - the age gradient runs the right way to age eleven and stops
  there. THIRD, OSTN HAS NO PROBE SET ON THE GPL570 ARRAY, so whether the human growth plate expresses
  osteocrin at all is unmeasured by the platform that answered every other question in this round.'
quantitative:
- parameter: the two approved CNP-axis ligand drugs, effect size and schedule
  value: 'navepegritide (approved 27 February 2026, once weekly subcutaneous, ages 2+ with achondroplasia
    and open epiphyses) - APPROACH phase 2b, n = 57 against 27, ages 2-11, 100 ug/kg/week for 52 weeks:
    annualised growth velocity 5.89 against 4.41 cm/year, least-squares mean difference 1.49 cm/year (95
    per cent CI 1.05 to 1.93, P less than 0.001). Also tibial-femoral angle -1.81 degrees, mechanical axis
    deviation -2.78 mm, fibula:tibia ratio -0.016; no treatment-related serious adverse events, no
    symptomatic hypotension, no fractures. Vosoritide''s randomised effect is about 1.57 cm/year'
  unit: cm/year difference against placebo
  conditions: savarirayan2026 / nct05598320; corrected 2 March 2026 for the number of female participants
    in Table 1 and the text
  species: human
  source_ref: savarirayan2026
  uncertainty: 'THE COMPARISON IS ACROSS TRIALS, NOT HEAD TO HEAD, in different cohorts with different
    baselines, and both are achondroplasia rather than a pathway-intact plate. The atlas''s own ceiling
    claim predicts the wash and is graded D. NEITHER TRIAL REPORTS ADULT HEIGHT, and a velocity difference
    at 52 weeks is the endpoint this atlas has repeatedly said does not predict final height'
- parameter: the structural reason the two ligand drugs are not pharmacologically distinguishable
  value: vosoritide is CNP-39 - a 17-residue N-terminal extension from the proCNP sequence fused to CNP-22,
    which sterically blocks neprilysin cleavage inside the disulfide ring and raises plasma half-life from
    about 2.6 minutes (CNP-22) to about 26 minutes. Navepegritide is a methoxy-PEG carrier releasing
    UNMODIFIED CNP-38, which is CNP-22 with a 16-residue N-terminal extension - the same architecture. The
    90-hour apparent half-life of released CNP-38 in cynomolgus monkey is release-rate-limited flip-flop
    kinetics from the carrier, not a property of the peptide
  unit: residues and plasma half-life
  conditions: product chemistry as published by each developer
  species: multiple
  source_ref: savarirayan2026
  uncertainty: 'THE INFERENCE THAT THE TWO RELEASED PEPTIDES ARE COMPARABLY NEPRILYSIN-RESISTANT IS
    ARCHITECTURAL, NOT MEASURED. No head-to-head degradation experiment exists. It is stated here to
    record that a discriminator was LOOKED FOR AND NOT FOUND, rather than as a finding - if a
    side-by-side neprilysin assay shows CNP-38 is materially more labile than CNP-39, the schedule
    argument reverses'
  value_unverified: true
- parameter: the two arms have OPPOSITE term assignments against the round-198 objective function
  value: 'LIGAND ARM (wendt2015, cynomolgus monkey, 6 months, n = 4/group, high dose 8.25 nmol/kg/day):
    longitudinal growth rate 26 to 40 um/day (1.54x, P<0.05), growth plate thickness 555 to 682, PROLIFERATING
    CELLS PER COLUMN 13 TO 11 (0.85x, not significant), hypertrophic cell projected AREA 232 to 286 (1.23x,
    not significant, at most 1.11x on height under an isotropy assumption) - leaving a residual near 1.6x
    on POOL CONSUMPTION. CLEARANCE ARM (weber2025): Npr3 loss raises MAXIMUM HYPERTROPHIC CHONDROCYTE HEIGHT
    IN THE AXIS OF ELONGATION by about 20 per cent against wild-type littermates, and disproportionately
    elongates proximal and mid-tail vertebrae'
  unit: fold change per term of the Hunziker identity
  conditions: primate versus mouse, pharmacology versus constitutive genetic loss - not a head-to-head
  species: multiple
  source_ref: wendt2015
  uncertainty: 'THIS IS THE ROUND''S LOAD-BEARING CONTRAST AND BOTH HALVES ARE WEAK INDIVIDUALLY. On the
    vosoritide side n = 4, the authors state the study was not powered for significance, BOTH decomposition
    terms are non-significant, the cell measure is an AREA, and pool consumption is a RESIDUAL that absorbs
    every error in the other terms. On the NPR3 side n = 3 to 4 in a constitutive null with a
    connective-tissue phenotype. THE CONTRAST IS A DIRECTION, NOT A MEASUREMENT, and no experiment has ever
    decomposed the two arms in one animal'
  value_unverified: true
- parameter: the human growth plate makes no CNP, carries the receptor and the sink, and out-transcribes
    neprilysin with two other peptidases
  value: 'GSE9160 zone-resolved human distal femoral growth plate, MAS5 linear, trimmed mean 100, two
    normal children x five compartments. NPPC 4 to 20 in ten of ten samples - the floor. NPR2 up to 1262,
    NPR3 up to 979, NPR1 up to 1677, PRKG2 up to 1058, PDE3A up to 844. Degradation routes: ECE1 up to
    2495 and IDE up to 1847 against MME up to 1062, and MME is strongly DONOR-DEPENDENT at 18-160 in donor
    1 against 200-1062 in donor 2. Calibrators fixed before extraction: PTHLH 7 to 309, GDF5 31 to 604,
    COL2A1 up to 104,438. OSTN HAS NO PROBE SET ON GPL570'
  unit: MAS5 linear signal
  conditions: computed in atlas/tools/gse9160_panel.py, output archived at atlas/data/gse9160/
  species: human
  source_ref: gse9160
  uncertainty: 'TWO DONORS, ONE PLATFORM, TRANSCRIPT NOT PROTEIN, AND NPR3''s THREE PROBE SETS DISAGREE
    SUBSTANTIALLY (979 / 461 / 39 at the same sample), so the NPR3 level is the least secure number here.
    What the platform is good for is DETECTION against a fixed floor, which is what CORR-114 established
    droplet data cannot do, and the NPPC floor result is unambiguous on that basis'
localization:
- 'the growth plate chondrocyte, which expresses NPR2 and NPR3 and no NPPC'
- 'the hypertrophic zone, where the clearance arm raises terminal cell height and the ligand arm has never
  been shown to'
- 'the tail and mid-spine vertebrae, where Npr3 loss elongates disproportionately and vosoritide does not'
human_evidence: direct
human_evidence_note: 'The ligand-drug comparison is human and randomised. The tissue expression is human
  and directly measured. The term decomposition that drives the round''s conclusion is primate and mouse,
  and no human has ever received a clearance-arm agent.'
