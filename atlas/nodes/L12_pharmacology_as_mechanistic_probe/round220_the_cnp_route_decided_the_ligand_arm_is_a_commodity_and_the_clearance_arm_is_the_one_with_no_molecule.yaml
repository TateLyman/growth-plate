contradicts:
- 'The framing of the question as osteocrin OR vosoritide. They act at different control points and the only
  evidence for osteocrin is additivity ON TOP OF raised ligand. The choice was never between them.'
- 'ROUND 209''s ranking of osteocrin as the strongest ADDITION, insofar as it implied an administrable agent.
  The arm is the strongest addition; the peptide is not the molecule, and round 211 already removed the
  reason it was preferred over the small molecules.'
- 'every_drug_on_the_cnp_axis, which reached the neprilysin write-off from droplet scRNA-seq detection rates
  on a platform CORR-114 disqualifies. The conclusion is correct and is now supported by zone-resolved data
  instead - ECE1 2495 and IDE 1847 against MME 1062 - so this is an upgrade of the basis, not a reversal.'
