translation_risk: moderate
translation_risk_reason: 'The decision to use a ligand drug rests on randomised human trials in the wrong
  genetic background; the decision about which ARM to want rests on a primate decomposition with n = 4 and
  a constitutive mouse null.'
confidence: B
claim_grades:
- claim: osteocrin and vosoritide are alternatives to be chosen between
  grade: X
  basis: FALSE AND ALWAYS WAS. One supplies ligand and the other stops ligand being cleared; kanai2017, the
    only evidence for osteocrin, is a double transgenic showing ADDITIONAL bone length OVER elevated CNP
    alone. The claim being tested was always additivity, never substitution
- claim: osteocrin is administrable
  grade: X
  basis: FALSE. No human has received it for any indication. No dose, no pharmacokinetics, no safety, no
    route, no source this programme has accepted. Round 211 also removed the reason it was preferred over
    the small molecules, since it is a Gi-silent occupier in the same functional class
- claim: navepegritide and vosoritide differ materially in efficacy
  grade: X
  basis: 'FALSE on the available evidence. 1.49 cm/year against about 1.57, across trials rather than head
    to head, and the atlas predicted the wash from its own ceiling claim - comparable ceiling despite
    ~300-fold different exposure duration, and exposure tracking urine cGMP but not growth'
- claim: navepegritide should be preferred to vosoritide
  grade: D
  basis: 'ON SCHEDULE ALONE - once weekly against daily over a multi-year residual window - and that is an
    adherence argument, not a mechanistic one. It should not be dressed as pharmacology. A structural
    comparison found no neprilysin-resistance discriminator, and no cell-level decomposition exists for
    navepegritide in any species'
- claim: the CNP ligand arm and the CNP clearance arm have opposite term assignments
  grade: D
  basis: ASSEMBLED ACROSS A PRIMATE PHARMACOLOGY STUDY AND A MOUSE GENETIC NULL, both underpowered, one
    reporting a projected area rather than a height and one reporting a residual rather than a measurement.
    The direction is the finding; the magnitudes are not. No experiment has decomposed both arms in one
    animal
- claim: an NPR3 blocker would raise vosoritide's own exposure as well as endogenous ligand
  grade: B
  basis: Vosoritide is cleared in part by receptor-mediated uptake via NPR-C/NPR3 on the regulator's own
    2021 statement, so the interaction follows directly and is independent of kanai2017's genetics. Not
    demonstrated pharmacologically for any pair
- claim: the human growth plate makes its own CNP
  grade: X
  basis: FALSE. NPPC sits at 4 to 20 in ten of ten zone-resolved samples against calibrators PTHLH at 7 to
    309 and GDF5 at 31 to 604 on the same arrays. The plate is a consumer, which is what gives a clearance
    blocker a local action a systemic ligand cannot copy
- claim: neprilysin inhibition is a viable pairing partner on this axis
  grade: X
  basis: CONFIRMED FALSE ON THE BETTER PLATFORM. ECE1 (up to 2495) and IDE (up to 1847) out-transcribe MME
    (up to 1062) in the zone-resolved human array, and MME is strongly donor-dependent. The previous version
    of this conclusion rested on droplet data that CORR-114 disqualifies; it now rests on data that is
    admissible
- claim: any NPR3-directed compound has been given for growth in any species
  grade: X
  basis: FALSE, unchanged since round 209. None. This is the single gate between the differentiated arm and
    the stack
