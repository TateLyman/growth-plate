id: round223_the_normal_background_problem_and_what_growth_hormone_costs_on_top_of_cnp
name: ROUND 223 - both arms of this stack have now been tested in a NORMAL background and both came out
  worse there than in the disease model; growth hormone adds 2.7 to 3.3 cm/year on top of a saturated CNP
  arm but spends 1.3 to 1.6 bone-age years per calendar year and buys legs rather than trunk; and the five
  open questions are answered, priced or dated
type: hypothesis
layer: L12
aliases:
- the normal background problem
- the transfer premise has never been tested
- COACH and what GH costs
- bone age ratio rising is still acceleration
- round 223
stub: false
summary: 'CHASING QUESTION 3 TURNED UP A SIXTH QUESTION NOBODY HAD ASKED, AND IT IS THE ONE THAT MATTERS.

  THIS STACK IS BUILT FROM AGENTS DEVELOPED FOR ACHONDROPLASIA AND AIMED AT A PATIENT WITH NORMAL FGFR3.
  THAT TRANSFER HAS NEVER BEEN TESTED IN THIS ATLAS. It has now been tested twice in the literature, by two
  drug classes acting on the same axis from opposite ends, and both came out worse in the normal background
  than in the disease model.

  ONE - THE FGFR ARM. kot2026, JBMR Plus 2026;10(3):ziag005. Infigratinib at 2 mg/kg/day subcutaneously from
  postnatal day 21 to day 49 - the pubertal growth window - given to Aga2/+ osteogenesis imperfecta mice AND
  TO WILD-TYPE LITTERMATES, n = 8 to 15 per group per sex. IN THE WILD-TYPE ANIMALS INFIGRATINIB HAD NO
  SIGNIFICANT EFFECT ON FEMUR LENGTH IN EITHER SEX and no significant difference in growth plate zone
  lengths, while REDUCING trabecular bone mineral density and microarchitecture and reducing stiffness,
  yield point and ultimate force in males. In the Aga2/+ animals it increased FEMALE femur length and
  increased growth plate length in both sexes, specifically the proliferative zone - and CORR-191 applies to
  that positive arm too, because a length result in one sex only is not a length result.

  TWO - THE CNP ARM, FROM A FILE THIS ATLAS HAS HELD SINCE ROUND 207 AND NEVER MINED. The Voxzogo CHMP
  assessment report states that PARTICULARLY IN HEALTHY ANIMALS vosoritide at high doses caused ALTERED
  SHAPE, DISLOCATION OF PHYSIS, DECREASED BONE MINERAL DENSITY, REDUCED MECHANICAL STABILITY, ALTERED
  GROWTH PLATE HISTOLOGY and IMPAIRMENT OF GAIT AND HIND LIMB USE - and that IN ANIMALS OF DISEASE,
  functional impairment of hind limbs was HARDLY OBSERVED. It states that vosoritide affected normal
  chondrocyte ordering in the growth plates of NORMAL animals, leading to functional impairment of adjacent
  joints, probably due to IRREGULAR OR ASYMMETRIC BONE GROWTH. In juvenile rats at 30 micrograms/kg and
  above - twice the 15 microgram/kg clinical dose - the findings were enlargement and persistence of
  physes, DEGENERATION AND NECROSIS IN THE FEMORAL HEAD AND NECK AND ACETABULUM, disorganised cartilage and
  bone growth in the tibia and tibiotarsal arthritis, called degenerative joint disease and attributed to
  EXAGGERATED GROWTH CAUSING MECHANICAL DYSFUNCTION.

  AND THE SPONSOR''S OWN EXPLANATION IS THE MECHANISM RATHER THAN AN EXCUSE. They argued that irregular
  bone growth follows from STRONG FGFR3 INHIBITION, achievable by vosoritide in healthy animals but not in
  achondroplasia because THERE THE BASAL FGFR3 ACTIVITY IS MUCH HIGHER, and that it is not intended to
  suppress FGFR3 below normal. The CHMP recorded that it understood the argument. THE ARGUMENT IS THAT A
  NORMAL BACKGROUND IS THE ONE THAT GETS PUSHED BELOW NORMAL, AND THAT IS OUR BACKGROUND.

  THIS IS A YIELD TERM AND NOT ONLY A SAFETY TERM, WHICH IS WHY IT SITS HERE. Round 203 established that a
  scoliotic curve converts axial length into deviation. A dislocated physis, asymmetric growth and a
  necrotic femoral head do the same to the appendicular skeleton, and the CHMP states it CANNOT BE EXCLUDED
  that vosoritide causes irregular bone growth INDEPENDENT OF GROWTH VELOCITY.

  WHAT THE CONVERGENCE DOES NOT DO IS OVERTURN THE HUMAN MEASUREMENT, AND CORR-046 IS EXPLICIT. The
  erdafitinib child grew 19.06 cm/year and accelerated growth entered the US label from a five-case series -
  humans, in the right background, outcome measured. A ledger assembled from rodents does not overrule a
  measurement; that is the error CORR-046 retracted and CORR-217 caught on its fourth approach. THE HONEST
  STATEMENT IS THAT THE TRANSFER PREMISE NOW HAS DIRECT EVIDENCE AGAINST IT IN TWO SPECIES AND TWO DRUG
  CLASSES AND ONE LARGE HUMAN OBSERVATION FOR IT, and the two have never been reconciled because NO GROWTH
  PLATE HAS EVER BEEN MEASURED IN A HUMAN WITH NORMAL FGFR3 UNDER EITHER DRUG. The dose caveat cuts both
  ways - kot2026 used one exposure for 28 days and a null at one exposure is not a null at all exposures,
  while the vosoritide findings appeared at twice the clinical dose, so the margin in a normal background is
  narrower than the achondroplasia numbers imply.

  THEN COACH, WHICH IS THIS STACK''S OWN COMBINATION RUN IN HUMANS. mcdonnell2026, Eur J Endocrinol
  2026;194(6):745-755 - 21 children with achondroplasia aged 2 to 11, navepegritide 100 micrograms/kg/week
  PLUS lonapegsomatropin at a mean 0.24 to 0.27 mg/kg/week for 52 weeks. Treatment-naive: annualised growth
  velocity 8.69 cm/year against 5.95 for weighted-matched navepegritide monotherapy, a difference of 2.74
  cm/year (95 per cent CI 2.11 to 3.38, P less than 0.0001). NAVEPEGRITIDE-EXPERIENCED, ALREADY AT STEADY
  STATE FOR OVER A YEAR: 8.42 against their own treated baseline of 5.14, AN INCREASE OF 3.28 cm/year WITHIN
  SUBJECT. That is the cleanest human demonstration in this atlas that the somatotropic arm is ADDITIVE ON
  TOP OF A SATURATED CNP ARM, and the size reorders the stack - navepegritide''s own effect over placebo is
  1.49 cm/year, so GROWTH HORMONE''S INCREMENT ON TOP OF IT IS ROUGHLY TWICE THE CNP INCREMENT OVER NOTHING.

  AND THEN THE COST, COMPUTED FROM THEIR OWN RATIOS. The bone-age to chronological-age ratio rose from 0.77
  to 0.86 in the naive cohort and from 0.92 to 0.99 in the experienced one. The paper reads that as NO
  ACCELERATION OF SKELETAL MATURATION BEYOND NORMAL, BECAUSE THE RATIO STAYED BELOW 1.0. THAT IS THE WRONG
  INFERENCE - A RATIO THAT RISES MEANS BONE AGE ADVANCED FASTER THAN TIME. Working their numbers: naive,
  chronological age 5.26 to 6.26 with bone age 4.05 to 5.38, so 1.33 bone-age years per calendar year;
  experienced, chronological age 8.32 to 9.32 with bone age 7.65 to 9.23, SO 1.57. THE COMBINATION SPENDS
  1.3 TO 1.6 BONE-AGE YEARS PER CALENDAR YEAR.

  THAT IS CATCH-UP FROM A DELAYED BASELINE IN A FIVE-YEAR-OLD WITH A DECADE OF RESERVE. IT IS NOT BENIGN AT
  BONE AGE 16. Round 198 made reserve the exhaustible currency, and a regimen converting one and a half
  years of it per calendar year is spending the thing this case has least of. AND IT UN-RETIRES A TEST -
  CORR-040 dropped height-gained-per-bone-age-year as non-discriminating because vosoritide and infigratinib
  both passed it. THE COMBINATION FAILS IT. A test that two agents pass and a third fails is discriminating;
  it was retired on the wrong reasoning.

  THE SECOND COST IS DIRECTIONAL AND POINTS THE WRONG WAY FOR THIS CASE. The upper-to-lower segment ratio
  FELL by 0.07 and 0.06 while arm span rose 9.4 and 7.9 cm - the gain is LEG-FAVOURING with the trunk
  lagging, the same drift the atlas already found for vosoritide alone at minus 0.10 in a real-world cohort.
  FOR A CASE WHOSE RESERVE IS SUBSTANTIALLY AXIAL, THE COMBINATION BUYS THE WRONG SEGMENT.

  THE OTHER FOUR QUESTIONS. Q1, whether Tat-beclin-1 lengthens a wild-type bone: ANSWERED - no such
  experiment exists anywhere, not in the patent and not in the literature, and the nearest genetic
  reciprocal, Beclin-1 heterozygous mice, was studied at seven months in females and reports NO BONE LENGTH
  AT ALL. Q2, BH3 mimetics and bone: THE VOID IS REAL AND IT CONVERGES with round 199''s grade-A finding
  that nobody has examined p16 senescence or senolytic clearance in a growth plate - navitoclax and ABT-737
  are simultaneously the canonical senolytics and the patent''s claimed BH3 mimetics, ONE MOLECULE CLASS
  REACHED BY TWO INDEPENDENT RATIONALES WITH ZERO EXPERIMENTS. Q3: the overactivity end is now three-deep,
  with wang2015''s title stating outright that FGFR3 INHIBITS AUTOPHAGY through decreasing the ATG12-ATG5
  conjugate, agreeing with the patent''s Example 2 and the human COL9A1 rise - but all three describe
  REMOVING A PATHOLOGICAL BLOCK and none describes reducing a normal signal. Q4: the FDA review package for
  NDA 219164 IS NOT POSTED - approval letter and label only, every review filename pattern returns 404 - and
  the EU EPAR DOES NOT EXIST YET because Ascendis submitted the MAA in October 2025 and CHMP review is
  ongoing. THAT EPAR IS THE DOCUMENT THAT WILL ANSWER IT, since the Voxzogo EPAR is exactly where the
  vosoritide zone measurements came from. PENDING, NOT UNOBTAINABLE. Q5: answered inferentially in both
  species and directly in neither - every axial readout taken favours sustained exposure, mouse SPINE +11.3
  against +25.0 per cent at the same daily dose and monkey TAIL +3 against +9, but NO PRIMATE SPINE
  MEASUREMENT EXISTS.'
quantitative:
- parameter: an FGFR inhibitor given to WILD-TYPE mice through the growth window
  value: infigratinib 2 mg/kg/day subcutaneously from postnatal day 21 to 49, n = 8 to 15 per group per sex.
    IN WILD-TYPE MICE - no significant effect on femur length in either sex, no significant difference in
    growth plate zone lengths, and REDUCED trabecular bone mineral density and microarchitecture with
    reduced stiffness, yield point and ultimate force in males. In Aga2/+ osteogenesis imperfecta mice -
    increased FEMALE femur length and increased growth plate length in both sexes, specifically the
    proliferative zone
  unit: bone length, zone length and mechanical properties
  conditions: kot2026, JBMR Plus 2026;10(3):ziag005, C57BL/6 background, 28-day treatment
  species: mouse
  source_ref: kot2026
  uncertainty: 'ONE EXPOSURE, 28 DAYS, ONE INHIBITOR - a null at 2 mg/kg/day is not a null at all
    exposures, and this atlas has separately established that selective FGFR agents have never been dosed
    near the exposure that produced 19 cm/year in a child. The disease-model positive is FEMALE ONLY, which
    CORR-191 says is not a length result. What the experiment does establish is that the wild-type arm was
    RUN, which is more than any other FGFR-inhibitor study in this atlas can say'
- parameter: vosoritide's growth plate and joint findings are worse in healthy animals than in disease models
  value: 'the CHMP records that PARTICULARLY IN HEALTHY ANIMALS vosoritide at high doses caused altered
    shape, DISLOCATION OF PHYSIS, decreased bone mineral density, reduced mechanical stability, altered
    growth plate histology and impairment of gait and hind limb use, while IN ANIMALS OF DISEASE functional
    impairment of hind limbs was HARDLY OBSERVED. In juvenile rats at 30 micrograms/kg and above - twice the
    15 microgram/kg clinical dose - enlargement and persistence of physes, DEGENERATION AND NECROSIS IN THE
    FEMORAL HEAD AND NECK AND ACETABULUM, disorganised cartilage and bone growth in the tibia and
    tibiotarsal arthritis, described as degenerative joint disease. At 300 micrograms/kg, five animals had
    limited use of hips from day 88 persisting through recovery, with bilateral abnormal femoral heads at
    necropsy in two'
  unit: qualitative regulatory findings with dose thresholds
  conditions: EMA/397108/2021, juvenile rat repeated-dose toxicology; file held by this atlas since round
    207 and this passage not extracted until now
  species: rat
  source_ref: ema_voxzogo_epar_2021
  uncertainty: 'REGULATORY PROSE SUMMARISING STUDY REPORTS THIS ATLAS HAS NOT SEEN, at doses two to twenty
    times clinical, in rats. The sponsor''s mechanistic explanation - that a normal background is the one
    that gets pushed below normal FGFR3 activity - is an argument they made to a regulator and the CHMP
    recorded understanding it, which is not the same as it being demonstrated'
- parameter: growth hormone added to a saturated CNP arm in humans
  value: 'COACH - navepegritide 100 micrograms/kg/week plus lonapegsomatropin at a mean 0.24 to 0.27
    mg/kg/week for 52 weeks in 21 children with achondroplasia aged 2 to 11. TREATMENT-NAIVE (n=12):
    annualised growth velocity 8.69 cm/year (95 per cent CI 8.23-9.15) against 5.95 (5.51-6.39) for
    weighted-matched navepegritide monotherapy, a difference of 2.74 cm/year (95 per cent CI 2.11-3.38,
    P<0.0001). NAVEPEGRITIDE-EXPERIENCED (n=9, on drug over a year): 8.42 against their own treated baseline
    of 5.14, an increase of 3.28 cm/year (P<0.0001). Achondroplasia-specific height z-score +1.02 and +0.86'
  unit: cm/year
  conditions: mcdonnell2026, phase 2, open-label, externally controlled with inverse probability of
    treatment weighting against the ApproaCH monotherapy arm
  species: human
  source_ref: mcdonnell2026
  uncertainty: 'OPEN-LABEL WITH AN EXTERNAL COMPARATOR, n = 12 AND 9, ONE YEAR, IN ACHONDROPLASIA. The
    within-subject experienced cohort is the stronger half because each child is their own control on a
    saturated CNP arm, but it has no concurrent control and a one-year velocity is the endpoint this atlas
    repeatedly says does not predict adult height'
- parameter: the bone-age cost of the combination, computed from the reported ratios
  value: bone-age to chronological-age ratio rose 0.77 to 0.86 (treatment-naive, mean chronological age 5.26
    to 6.26, so bone age 4.05 to 5.38) and 0.92 to 0.99 (experienced, chronological age 8.32 to 9.32, so
    bone age 7.65 to 9.23). THAT IS 1.33 AND 1.57 BONE-AGE YEARS PER CALENDAR YEAR. Separately the
    upper-to-lower segment ratio FELL by 0.07 and 0.06 while arm span rose 9.4 and 7.9 cm
  unit: bone-age years per chronological year, and segment ratio change
  conditions: computed in atlas/tools/round223_the_normal_background_problem.py from mcdonnell2026's
    reported ratios and mean ages
  species: human
  source_ref: mcdonnell2026
  uncertainty: 'DERIVED FROM MEAN RATIOS AND MEAN AGES RATHER THAN FROM INDIVIDUAL DATA, so it is an
    estimate of the cohort average and not a per-child figure, and the reported standard error on the
    experienced week-52 ratio is printed as 0.3 where 0.03 is almost certainly intended. THE DIRECTION IS
    NOT IN DOUBT - both ratios rose. The paper''s own reading, that a ratio below 1.0 means no acceleration,
    confuses the LEVEL with the RATE, and a delayed skeleton catching up is still a skeleton being spent'
  value_unverified: true
localization:
- 'the wild-type growth plate, where an FGFR inhibitor changed no zone and no length'
- 'the femoral head and acetabulum of the healthy juvenile rat, where the CNP arm produced necrosis'
- 'the trunk, which lags the legs under the growth hormone combination'
human_evidence: direct
human_evidence_note: 'COACH is human, randomised only against an external weighted comparator. The
  normal-background evidence is rat and mouse; no human with normal FGFR3 has had a growth plate measured
  under either drug class.'
species_basis:
- human
- mouse
- rat
translation_risk: high
translation_risk_reason: 'The central finding is that the disease-to-normal transfer this stack assumes has
  evidence against it in rodents and one large human observation for it, and nothing reconciles them.'
confidence: B
claim_grades:
- claim: agents developed for achondroplasia transfer to a patient with normal FGFR3
  grade: E
  basis: 'ASSUMED THROUGHOUT THIS ATLAS AND NEVER TESTED UNTIL NOW, AND THE FIRST TWO TESTS GO AGAINST IT.
    An FGFR inhibitor in wild-type mice changed no length and cost bone strength; the CNP arm''s growth
    plate and joint findings are worse in healthy animals than in disease models by the regulator''s own
    account. Against that stands the erdafitinib human series, which CORR-046 forbids overruling with a
    rodent ledger'
- claim: an FGFR inhibitor lengthens bone in an animal with normal FGFR3
  grade: D
  basis: NOT AT THE ONE EXPOSURE TESTED. kot2026 gave infigratinib 2 mg/kg/day through the pubertal window
    to wild-type littermates and found no significant effect on femur length in either sex and no zone
    change, with reduced trabecular quality and bone strength in males. One dose, 28 days, one inhibitor
- claim: the CNP arm's dose-limiting skeletal findings are worse in a normal background
  grade: C
  basis: STATED BY THE CHMP IN THREE PLACES - findings particularly in healthy animals, hardly observed in
    disease animals, and normal chondrocyte ordering disrupted in normal animals leading to joint
    impairment. Regulatory prose over study reports this atlas has not seen, in rats, at two to twenty times
    the clinical dose
- claim: growth hormone is additive on top of a saturated CNP arm in humans
  grade: B
  basis: 'THE STRONGEST ADDITIVITY EVIDENCE IN THIS ATLAS. Children already on navepegritide for over a year
    gained 3.28 cm/year within subject when lonapegsomatropin was added, and the weighted-matched naive
    comparison gives 2.74. Open-label, n = 9 and 12, one year, achondroplasia background'
- claim: the growth hormone combination advances bone age faster than chronological age
  grade: C
  basis: COMPUTED FROM THE PAPER'S OWN RATIOS - 1.33 and 1.57 bone-age years per calendar year. Derived from
    cohort means rather than individual data, and it is catch-up from a delayed baseline, which is benign in
    a young child and is not benign at bone age 16
- claim: a bone-age to chronological-age ratio below 1.0 means skeletal maturation is not accelerated
  grade: X
  basis: FALSE, AND IT IS THE PAPER'S OWN INFERENCE. The ratio is a LEVEL and its change is the RATE. Both
    cohorts' ratios ROSE, which means bone age advanced faster than time in both
- claim: height gained per bone-age year does not discriminate between growth agents
  grade: X
  basis: 'FALSE, AND CORR-040 RETIRED THE TEST ON THE WRONG REASONING. It was dropped because vosoritide and
    infigratinib both passed. The COACH combination FAILS it at 1.3 to 1.6 bone-age years per calendar year.
    A test two agents pass and a third fails is discriminating'
- claim: any growth plate has been measured in a human with normal FGFR3 under an FGFR inhibitor or a CNP
    agent
  grade: X
  basis: FALSE. None, under either drug class, in any published source located. The premise the entire stack
    rests on has never been checked in the background it is applied to
