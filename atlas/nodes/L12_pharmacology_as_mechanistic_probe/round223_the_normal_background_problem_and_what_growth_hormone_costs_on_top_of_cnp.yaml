  wild-type mice and the Voxzogo EPAR''s healthy-animal findings. Recorded as CORR-224.'
- 'CORR-040''s retirement of height-gained-per-bone-age-year as a non-discriminating test. It was retired
  because two agents passed it; the COACH combination fails it at 1.3 to 1.6 bone-age years per calendar
  year, so the test discriminates and the retirement was wrong. Recorded as CORR-225.'
- 'mcdonnell2026''s own reading that a bone-age to chronological-age ratio staying below 1.0 indicates no
  acceleration of skeletal maturation. Both ratios ROSE. A ratio is a level and its change is the rate.'
