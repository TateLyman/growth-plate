id: round275_the_two_arms_of_the_stack_select_different_compartments_and_only_one_selects_the_right_one
name: >-
  ROUND 275 - the two FGFR3-axis arms of the stack are NOT interchangeable and the difference is
  ANATOMICAL. CNP analogues demonstrably lengthen the LOWER segment preferentially - the trials say so in
  their own words - which is the compartment round 274 showed is spent by bone age 14.5. FGFR3 inhibition
  reaches the LUMBAR SPINE, and in WILD-TYPE mice gives the largest length gain in this entire file:
  nasoanal +7.3 per cent, femur +8.2 per cent, dose-dependently
aliases:
- round 275
- the CNP arm selects the wrong compartment
- FGFR3 inhibition works in wild type
- TYRA-300
- site selectivity exists after all
type: hypothesis
layer: L12
stub: false
summary: >-
  ROUND 274 CLOSED THE DENOMINATOR AND FOUND THE RESIDUAL AT BONE AGE 16 IS TRUNK-DOMINANT. The immediate
  question that raises is which arm of the stack reaches the trunk. Achondroplasia is RHIZOMELIC - limbs
  far worse than trunk, upper-to-lower segment ratio about 2.0 against a normal near 1.0 - so the naive
  prediction is that the whole FGFR3 axis is limb-weighted and the stack is aimed at the spent compartment.
  THE ANSWER SPLITS THE AXIS IN TWO, AND THE SPLIT IS THE MOST USEFUL RESULT OF THE SESSION.

  ONE - THE CNP ARM IS LEG-PREFERENTIAL, AND THE TRIALS STATE IT THEMSELVES. savarirayan2026's APPROACH
  trial of once-weekly navepegritide reports that treatment "decreased the upper to lower body segment
  ratio at week 52 (-0.04; 95 per cent CI -0.06 to -0.01) INDICATING LENGTHENED LOWER VS UPPER BODY
  SEGMENT". The 52-week meta-analysis found no ULS effect (MD -0.02, CI -0.04 to 0.01, P = 0.17), but the
  longer studies do: Rua 2025 reports ULS delta -0.10 (P <= 0.01) at 24 months, Savarirayan -0.09, and the
  six-year extension found a significant ULS improvement at three years against age-matched untreated
  controls (P = 0.0087). THE EFFECT IS REAL AND TAKES TWO TO THREE YEARS TO BECOME VISIBLE.
  AND THE SAME TRIAL SHOWS THE SELECTIVITY IS FINER THAN SEGMENTS. The fibula-to-tibia ratio was STABLE on
  navepegritide (+0.001) while it ROSE on placebo (+0.017), treatment difference -0.016 (CI -0.024 to
  -0.008). Two plates in the same limb, moved differently by the same drug.
  THAT MATTERS FOR ROUND 264's TERM 5, WHICH SAID NO AGENT IN EXISTENCE SELECTS A SITE. IT IS FALSE. CNP
  analogues select sites, measurably, and they select the LOWER SEGMENT - which round 274 showed is worth
  approximately zero by bone age 14.5 in boys, against a trunk still worth 6.5 to 9.0 cm.

  TWO - AND THE MAGNITUDE OF THE CNP ARM IS NOW META-ANALYSED, WHICH THIS FILE DID NOT HAVE. cnpmeta2026
  pooled four low-risk-of-bias RCTs (n = 326): annualised growth velocity +1.36 cm/year (CI 1.05-1.68) and
  standing height +1.24 cm (CI 0.47-2.01) versus placebo. The six-year extension gives an additional 5.75
  cm (CI 4.93-6.57) over three years against untreated. THAT IS THE EFFECT IN ACHONDROPLASIA, WHERE FGFR3
  IS PATHOLOGICALLY OVERACTIVE AND THE DEFICIT IS BEING RESCUED. A normal-FGFR3 subject should expect less,
  not more.

  THREE - THE FGFR3-INHIBITION ARM IS A DIFFERENT ANIMAL, AND tyra300_2025 IS THE MOST IMPORTANT SINGLE
  RESULT THIS SESSION HAS FOUND. TYRA-300 is an FGFR3-SELECTIVE tyrosine kinase inhibitor, designed
  explicitly to avoid the FGFR1, FGFR2 and FGFR4 toxicities that pan-FGFR agents carry. It was dosed orally
  once daily to WILD-TYPE C57BL/6J mice from four to eight weeks of age.
  NASOANAL LENGTH +7.3 PER CENT at 14 mg/kg. TIBIA +3.9 PER CENT at 12 mg/kg and +6.4 PER CENT at 14.
  FEMUR +5.0 PER CENT at 12 mg/kg and +8.2 PER CENT at 14. Dose-dependent, with significant effects also at
  8 and 10 mg/kg, and NO DIFFERENCE IN BODY WEIGHT between groups. The authors conclude that inhibition of
  WILD-TYPE FGFR3 signalling enhances growth velocity dose-dependently.
  THIS CLOSES THE QUESTION ROUND 265 LEFT OPEN IN ITS OWN WORDS - "whether pushing FGFR3 BELOW normal
  accelerates turnover beyond the physiological rate, which requires a wild-type animal, a length endpoint
  and resting-zone counts". Two of the three are now delivered and the answer is yes. Resting-zone counts
  were not done, so whether the gain is discharge or merely rate remains open.
  AND THE MAGNITUDE IS UNMATCHED IN THIS FILE. Every other wild-type length gain the atlas holds is
  smaller: trompet2024's intra-SOC hedgehog bead +3.63 per cent femur, borjesson2010's cartilage-ERalpha
  knockout +3.17 per cent at one year, serrat2015's unilateral heating +1.3 per cent femur, dynasore
  transient and author-declared so. +8.2 per cent femur in four weeks of oral dosing is a different order.

  FOUR - AND IT REACHES THE SPINE. TYRA-300 increased the length of the L4-L6 LUMBAR VERTEBRAE, measured by
  calipers, and improved intervertebral disc shape, with L5 vertebral body height quantified histologically
  - in both FGFR3-mutant models. It also improved foramen magnum size and shape. SO THE FGFR3 ARM ACTS ON
  THE AXIAL SKELETON WHILE THE CNP ARM PREFERENTIALLY ACTS ON THE LEGS.
  THAT IS A DISSOCIATION BETWEEN TWO AGENTS ON WHAT THIS ATLAS HAS TREATED AS ONE PATHWAY, AND IT HAS A
  MECHANISTIC CORRELATE ALREADY IN THE FILE. Round 263 and 265 established that vosoritide acts at RAF-1
  INSIDE the ERK arm while an FGFR3 kinase inhibitor sits UPSTREAM of both the ERK arm and the CREB arm
  that horike2026 identified as the discharge route. The upstream agent reaches compartments the downstream
  one does not, which is what an upstream position predicts.

  FIVE - AND HERE IS WHERE THIS ROUND OVERREACHED, RECORDED BY THE OPERATOR AND KEPT IN PLACE AS THE
  CORRECTION. THE RANKING BELOW WAS ALREADY SETTLED IN ROUNDS 263 AND 265 AND IS RESTATED HERE, NOT
  DISCOVERED. Nothing in this round changes what to do. The compartment argument is a PREFERENCE between two
  agents whose ordering was decided on topology and redundancy long before; neither agent spends bone age,
  so compartment tropism does not alter the decision. And FGFR3 SELECTIVITY BUYS TOLERABILITY, NOT EFFICACY,
  at the doses under discussion - TYRA-300 versus a pan-FGFR agent is a therapeutic-window argument and this
  round presented it as if it were a potency argument. THE ONLY GENUINELY NEW DATUM HERE IS THE WILD-TYPE
  DOSE-RESPONSE IN SECTION THREE. The ranking, restated for the record only: DISCHARGE, since only it reaches CREB (round 265); COMPARTMENT,
  since it reaches lumbar vertebrae while CNP analogues preferentially lengthen legs and legs are spent by
  bone age 14.5 (round 274); and EFFECT SIZE IN A NORMAL ANIMAL, +8.2 per cent femur against a CNP arm whose
  meta-analysed human effect is +1.24 cm of standing height over 52 weeks in the disease it was designed
  for. AND A COMPOUND NOTE THAT MATTERS: erdafitinib is PAN-FGFR1-4. TYRA-300 is FGFR3-SELECTIVE and was
  built specifically to widen that window. If an FGFR3-selective agent becomes accessible it is the
  mechanistically cleaner version of the arm this stack already relies on.

  SIX - THE BOUND ON PUSHING FGFR3 DOWN, WHICH THE SAME PAPER SUPPLIES. Fgfr3-null mice exhibit curved and
  elongated long bones, KYPHOSIS, SCOLIOSIS, crooked tails, vertebral abnormalities and HEARING LOSS. So
  the direction is right and the endpoint of the direction is deformity plus deafness. This is a
  dose-window argument, not a more-is-better argument, and the wild-type dose-response above is only four
  weeks long.
quantitative:
- parameter: >-
    FGFR3 INHIBITION IN WILD-TYPE MICE - THE LARGEST WILD-TYPE LENGTH GAIN IN THIS ATLAS, DOSE-DEPENDENT
  value: >-
    nasoanal length +7.3 per cent at 14 mg/kg; tibia +3.9 per cent at 12 mg/kg and +6.4 per cent at 14
    mg/kg; femur +5.0 per cent at 12 mg/kg and +8.2 per cent at 14 mg/kg; significant increases also at 8
    and 10 mg/kg; NO difference in body weight between groups
  unit: per cent versus vehicle
  conditions: >-
    tyra300_2025. TYRA-300, an FGFR3-SELECTIVE small-molecule tyrosine kinase inhibitor, dosed orally once
    daily to wild-type female C57BL/6J mice from 4 to 8 weeks of age, 4 weeks of treatment. Tail length
    also increased significantly and dose-dependently. The same compound was separately tested in
    Fgfr3-Y367C/+ (achondroplasia) and Fgfr3-N534K/+ (hypochondroplasia) models.
  species: mouse
  source_ref: tyra300_2025
  uncertainty: >-
    FOUR WEEKS OF TREATMENT IN A GROWING MOUSE, AND MICE DO NOT FUSE - so this is a growth-RATE result in
    the rapid-growth window and says nothing directly about attained height in a fusing species at bone age
    16. Resting-zone or progenitor counts were NOT performed, so round 265's actual question - whether
    sub-normal FGFR3 accelerates DISCHARGE rather than merely rate - is still open. Doses of 12 to 14 mg/kg
    are near the 18 mg/kg used in oncology models, so the growth window and the oncology window overlap.
    Female mice only in the wild-type arm. And Fgfr3-null mice show kyphosis, scoliosis, vertebral
    abnormalities and hearing loss, which bounds how far the axis can be pushed.
- parameter: >-
    CNP ANALOGUES PREFERENTIALLY LENGTHEN THE LOWER SEGMENT - THE TRIALS' OWN INTERPRETATION
  value: >-
    navepegritide decreased the upper-to-lower body segment ratio at week 52 by -0.04 (95 per cent CI -0.06
    to -0.01), which the authors state indicates "lengthened lower vs upper body segment"; at 24 months Rua
    reports ULS delta -0.10 (P <= 0.01) and Savarirayan -0.09; the six-year extension found a significant
    ULS improvement at 3 years versus age-matched untreated controls (P = 0.0087). Fibula-to-tibia ratio
    was STABLE on navepegritide (+0.001, CI -0.003 to 0.006) while RISING on placebo (+0.017, CI 0.011 to
    0.024), treatment difference -0.016 (CI -0.024 to -0.008)
  unit: upper-to-lower segment ratio, and fibula-to-tibia ratio
  conditions: >-
    savarirayan2026 (APPROACH, once-weekly navepegritide, 52 weeks) and cnpmeta2026 (systematic review of
    11 studies, N = 542, with 4 RCTs n = 326 meta-analysed). Baseline ULS ratio in these cohorts is 1.98 to
    2.01 against a normal near 1.0, confirming achondroplasia is limb-deficient.
  species: human
  source_ref: savarirayan2026
  uncertainty: >-
    THE BETWEEN-GROUP DIFFERENCE AT 52 WEEKS IS NOT SIGNIFICANT - navepegritide versus placebo was -0.02
    (CI -0.07 to 0.03), because placebo also drifted -0.02; the significant change is WITHIN the treated
    group. The pooled 52-week meta-analysis found no ULS effect at all. So the leg preference rests on the
    longer uncontrolled studies and the 3-year extension comparison, not on the randomised 52-week
    contrast. AND THE DEEPER AMBIGUITY IS RESCUE VERSUS TROPISM: in achondroplasia the legs are the
    DEFICIENT compartment, so normalising the ratio may reflect rescuing the deficit rather than an
    intrinsic preference for leg plates. Nobody has given a CNP analogue to a normally-proportioned subject
    and measured segments.
- parameter: >-
    THE META-ANALYSED SIZE OF THE CNP ARM, IN THE DISEASE IT WAS DESIGNED FOR
  value: >-
    annualised growth velocity +1.36 cm/year (95 per cent CI 1.05-1.68; P < 0.00001) and standing height
    +1.24 cm (95 per cent CI 0.47-2.01; P = 0.002) versus placebo; the 6-year open-label extension gives an
    additional 5.75 cm (95 per cent CI 4.93-6.57) over 3 years against untreated controls
  unit: cm and cm per year
  conditions: >-
    cnpmeta2026, 4 randomised placebo-controlled trials with low overall risk of bias, n = 326, children
    under 18 with genetically confirmed achondroplasia. Adverse events comparable to placebo except
    injection-site reactions (RR 1.65), urticaria (4.04) and swelling (3.57).
  species: human
  source_ref: cnpmeta2026
  uncertainty: >-
    ACHONDROPLASIA IS THE WRONG DENOMINATOR FOR THIS CASE. These children have pathologically overactive
    FGFR3 and the drug is rescuing that deficit; a subject with normal FGFR3 should expect LESS, not more.
    Heterogeneity on the standing-height estimate was high (I-squared 72 per cent). The 5.75 cm figure is
    from an OPEN-LABEL extension against non-randomised untreated controls. And these are growth-velocity
    and interim-height endpoints, not attained adult height, which round 254 established come apart.
localization:
- 'lower body segment / legs: where CNP analogues preferentially act, and the compartment round 274 showed
  is worth about zero by bone age 14.5 in boys'
- 'L4-L6 lumbar vertebrae: where FGFR3 inhibition acts and the CNP arm has not been shown to'
- 'fibula versus tibia: two plates in one limb moved differently by the same drug'
human_evidence: direct
human_evidence_note: >-
  The CNP segment and magnitude data are human randomised trial data. The FGFR3-inhibitor wild-type and
  vertebral data are mouse; TYRA-300 has not been given to a human for growth.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The decisive FGFR3 result is a four-week wild-type mouse experiment in a non-fusing species during the
  rapid-growth window; the human CNP data come from a disease in which the axis is pathologically
  overactive.
confidence: B
confidence_reason: >-
  The CNP segment claim rests on randomised trials that state the direction themselves plus a systematic
  review; the FGFR3 wild-type dose-response is a single paper but internally dose-dependent across four
  doses with a clean body-weight control. Graded B because the compartment comparison between the two arms
  is assembled ACROSS studies and species rather than measured in one experiment.
claim_grades:
- claim: >-
    No agent in existence selects a growth-plate site.
  grade: X
  basis: >-
    ROUND 264's TERM 5 SAID THIS AND IT IS FALSE. CNP analogues measurably shift the upper-to-lower segment
    ratio toward the lower segment, and savarirayan2026 additionally shows the fibula-to-tibia ratio held
    stable on drug while rising on placebo - two plates in the same limb moved differently by one agent.
    Site selectivity exists; the problem is that this agent's selectivity runs the wrong way for a subject
    at bone age 16.
- claim: >-
    Inhibiting FGFR3 below normal increases bone length in a normal animal.
  grade: C
  basis: >-
    tyra300_2025 - wild-type C57BL/6J mice, oral TYRA-300 once daily from 4 to 8 weeks: nasoanal +7.3 per
    cent, femur +8.2 per cent, tibia +6.4 per cent at 14 mg/kg, dose-dependent across four doses, with no
    body-weight difference. This is the question round 265 posed and could not answer. Held at C because it
    is one paper, four weeks, female mice, a non-fusing species, and no progenitor counts were done.
- claim: >-
    Vosoritide and an FGFR3 kinase inhibitor are interchangeable arms of one pathway.
  grade: X
  basis: >-
    THEY ACT ON DIFFERENT COMPARTMENTS. CNP analogues preferentially lengthen the LOWER segment by the
    trials' own statement; FGFR3 inhibition increases L4-L6 LUMBAR VERTEBRAL length and improves foramen
    magnum morphology. That is consistent with the pathway topology this atlas already holds - vosoritide
    acts at RAF-1 inside the ERK arm, an FGFR3 kinase inhibitor sits upstream of both ERK and the CREB
    discharge arm.
- claim: >-
    The CNP arm is well matched to the residual compartment at bone age 16.
  grade: X
  basis: >-
    IT IS NOT. Round 274 established that in boys the knee physes are worth 0.3 to 0.4 cm by bone age
    14.2-14.5 while the trunk still grows 6.5 to 9.0 cm. The CNP arm preferentially lengthens the lower
    segment. That is the compartment with the least left.
- claim: >-
    An FGFR3-selective inhibitor would be a better version of the stack's lead agent than erdafitinib.
  grade: E
  basis: >-
    ARGUED, NOT DEMONSTRATED. Erdafitinib is pan-FGFR1-4; TYRA-300 was designed to be FGFR3-selective
    specifically to avoid FGFR1, FGFR2 and FGFR4 toxicity, which is a therapeutic-window argument rather
    than a potency one. No head-to-head exists, TYRA-300 has never been given to a human for growth, and
    the wild-type doses used sit close to the oncology dose range.
- claim: >-
    More FGFR3 inhibition is monotonically better.
  grade: X
  basis: >-
    Fgfr3-null mice show curved and elongated long bones with KYPHOSIS, SCOLIOSIS, crooked tails, vertebral
    abnormalities and HEARING LOSS. The direction is right and its endpoint is deformity plus deafness, so
    this is a dose-window problem. The wild-type dose-response in tyra300_2025 spans only four weeks and
    four doses.
