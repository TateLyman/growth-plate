contradicts: >-
  REFUTES TERM 5 OF round264_where_to_attack_computed_not_recalled, which recorded that no agent in
  existence selects a growth-plate site and that systemic agents therefore route growth indiscriminately.
  CNP analogues select sites measurably - shifting the upper-to-lower segment ratio toward the lower
  segment, and holding the fibula-to-tibia ratio stable while placebo drifted - and the selectivity runs
  the WRONG WAY for a subject whose residual is trunk-dominant.
  It also SEPARATES two agents this atlas has treated as one pathway: the CNP arm is leg-preferential while
  FGFR3 inhibition increases lumbar vertebral length, which matches the topology rounds 263 and 265
  established. And it answers, in two of its three parts, the wild-type question
  round265_discharge_is_creb_and_erdafitinib_is_the_only_agent_that_reaches_it left explicitly open.
builds_on: round274_the_aromatase_choice_is_settled_by_an_rct_the_serm_route_is_dead_and_the_denominator_closed
