id: round297_thirty_obtainable_drugs_this_atlas_has_never_had_an_opinion_about
name: >-
  ROUND 297 - the inverse audit. Instead of sweeping the literature for compounds, sweep THIS FILE for
  accessible drugs it has never once mentioned. Across 821 nodes and 1,597 references, 30 obtainable agents
  return zero hits. That is a different and more tractable kind of gap than "no molecule exists", which is
  where HHIP and the whole volume axis ended up. Four of the thirty have a mechanism that touches a term of
  the height identity, and the best of them targets the PERIOD
aliases:
- round 297
- the accessible-drug coverage audit
- thirty drugs never checked
- metformin and the period term
- NSAIDs as a hidden cost
type: hypothesis
layer: L12
stub: false
summary: >-
  ZERO - WHY AN INVERSE AUDIT. CLAUDE.md's conventions record that a generic length-endpoint sweep no longer
  finds anything, because the atlas vocabulary is now large enough that almost every real drug name already
  appears somewhere. That is an argument against blind sweeps. It is NOT an argument against the inverse
  question, which nobody had asked: across 821 nodes and 1,597 references, WHICH OBTAINABLE AGENTS RETURN
  ZERO HITS? Inclusion rule, fixed before running: the agent must be approved somewhere, over-the-counter,
  or a nutritional supplement. Investigational compounds are excluded - the atlas already tracks those, and
  they are not the gap.
  THIRTY AGENTS RETURN ZERO. L-arginine, adalimumab, allopurinol, amiloride, anakinra, canakinumab,
  celecoxib, citrulline, colchicine, collagen peptide, creatine, dapagliflozin, empagliflozin, etanercept,
  glucosamine, hydrochlorothiazide, liraglutide, metformin, nifedipine, nitrate, pentoxifylline,
  propranolol, semaglutide, simvastatin, spironolactone, strontium, thiazide, vardenafil, verapamil,
  vitamin K. NINE MORE ARE THIN - acetazolamide, atorvastatin, cinaciguat, DHEA, everolimus, furosemide,
  riociguat, rosuvastatin, vericiguat.
  A ZERO IS A STATEMENT ABOUT THIS FILE, NOT ABOUT THE LITERATURE, and it is not evidence that anything
  works. Its value is that it separates "no molecule exists" - the HHIP and volume-axis outcome, which no
  amount of searching fixes - from "an obtainable molecule exists and nobody here ever formed an opinion."
  The tool is committed with its rationale written BEFORE the audit ran, so the ranking below is not
  post-hoc rationalisation of whatever happened to come back empty.

  ONE - METFORMIN IS THE STANDOUT, AND IT IS THE ONLY ONE OF THE THIRTY THAT TARGETS THE PERIOD.
  Every arm of this stack raises a RATE. The problem at bone age 16 is the PERIOD, and only the aromatase
  inhibitor currently serves it - at a ceiling of about 1.3 cm over three years. Metformin is the one
  obtainable, cheap, oral agent with a literature on DECELERATING BONE AGE.
  laerkholm2025, the LIFE-MET trial, is randomised, placebo-controlled, double-blind, four-arm and
  multicentre, with CHANGE IN BONE AGE FROM BASELINE TO 12 MONTHS AS THE PRIMARY OUTCOME - the only trial
  in this atlas with bone age as a primary endpoint under a cheap oral drug.
  ✗ AND IT IS A PROTOCOL. No results exist. 80 girls, overweight, early puberty, six months of treatment.
  ✗ AND THE MECHANISM MAY NOT TRANSFER. The rationale throughout this literature is correcting
  HYPERINSULINAEMIA - the metformin adult-height work is in overweight, low-birth-weight, precocious-pubarche
  and PCOS girls, where insulin resistance is accelerating maturation. IN A LEAN, INSULIN-SENSITIVE
  ADOLESCENT MALE THERE IS NO HYPERINSULINAEMIA TO CORRECT, and metformin would lower IGF-1 bioavailability
  against the GH arm for no bone-age benefit. That is a substitution-style cost, not an addition.
  ⭐ WHICH MAKES THIS AN ACTIONABLE MEASUREMENT RATHER THAN A PROPOSAL: THE SUBJECT'S INSULIN SENSITIVITY IS
  NOWHERE IN THIS ATLAS. Fasting insulin, fasting glucose and HOMA-IR have never been recorded. If he is
  insulin-resistant, metformin becomes a live PERIOD lever additive to the aromatase inhibitor. If he is
  lean and insulin-sensitive, it is contraindicated for the reason above. One blood draw decides it, and
  the atlas cannot currently say which way.
  ✗ Metformin's chondrocyte literature is entirely osteoarthritis - mitochondrial function, Nrf2, senescence.
  No growth-plate work and no bone-length endpoint in any species.

  TWO - AND ONE OF THE THIRTY IS PROBABLY A COST RATHER THAN A LEVER, WHICH IS WORTH AS MUCH.
  CELECOXIB and the NSAID class return zero hits across the entire file. The known direction of COX
  inhibition on bone is SUPPRESSIVE - impaired fracture union is the best-documented effect, and
  prostaglandin signalling participates in endochondral growth. An atlas built to maximise height that has
  never once considered whether a commonly-taken over-the-counter class is SUBTRACTING from it has a blind
  spot in the direction that costs nothing to check and cannot be recovered later. NOT ESTABLISHED HERE -
  no growth-plate length endpoint was retrieved - but it belongs on the contraindication watch list rather
  than the lever list, and it is the kind of question this audit exists to surface.

  THREE - THE cGMP SECOND ROUTE, WHICH IS A GENUINE TOPOLOGY GAP. The CNP arm of this stack works through
  NPR-B to cGMP. The atlas has PDE5 at nine nodes and tadalafil at fourteen, so cGMP DEGRADATION has been
  considered. But NO-donor and sGC routes to the SAME effector have not: L-arginine, citrulline and nitrates
  are all at zero, and riociguat, vericiguat and cinaciguat are all thin. Raising cGMP through soluble
  guanylate cyclase does not compete for NPR-B and is not the same node as vosoritide in the way PDE3 was
  shown to be. WHETHER THAT IS ADDITION OR SUBSTITUTION IS EXACTLY THE STEP-0 QUESTION and it has never been
  put. Two of the three routes are over-the-counter.

  FOUR - INFLAMMATORY TONE. anakinra, canakinumab, etanercept and adalimumab are at zero and tocilizumab is
  thin. Inflammatory cytokines are established suppressors of chondrocyte proliferation, and IL-6 blockade
  produces catch-up growth in inflammatory arthritis. The relevant question for a NON-inflammatory subject
  is whether subclinical tone imposes any restraint at all, which is unknown - but the class has never been
  examined here, and CRP and IL-6 have never been recorded for this subject either.

  FIVE - WHAT THIS ROUND DOES NOT CLAIM. None of the thirty has been shown to add height. No length endpoint
  was retrieved for any of them. The audit is a map of where this file has no opinion, and its output is a
  ranked list of questions plus two blood tests - insulin sensitivity and inflammatory markers - that would
  convert the top two entries from speculation into decisions.
human_evidence: indirect
human_evidence_note: >-
  The only trial identified is laerkholm2025, a registered randomised placebo-controlled protocol with bone
  age as primary outcome and NO RESULTS YET, in a population (overweight girls with early puberty) that does
  not match this subject. The supporting metformin adult-height literature is in insulin-resistant girls.
  Everything else in this round is an absence of coverage rather than a human finding.
species_basis:
- human
translation_risk: high
translation_risk_reason: >-
  The leading candidate has no results, a mismatched population, and a mechanism that may invert in a lean
  insulin-sensitive subject. The remainder are unexamined. This node's value is in what it asks, not in what
  it establishes, and it should not be read as a shortlist to act on.
confidence: C
confidence_reason: >-
  The audit itself is deterministic and reproducible - it is grep over the committed graph, and the tool is
  committed with a pre-registered rationale so the ranking cannot be back-fitted. What is uncertain is
  whether any of the thirty matters, and the honest answer is that only two have been examined even
  superficially. Graded C as a map, not as a finding.
claim_grades:
- claim: >-
    Thirty obtainable agents have zero coverage anywhere in this atlas.
  grade: A
  basis: >-
    Deterministic grep over 821 nodes and 1,597 references, committed as
    atlas/tools/round297_accessible_drug_coverage_audit.py and re-runnable. This is a fact about the file.
    It is NOT evidence about the literature or about efficacy, and the tool says so in its own output.
- claim: >-
    Metformin is the highest-value never-checked accessible agent, because it targets the PERIOD.
  grade: D
  basis: >-
    Every other arm of this stack raises a rate; at bone age 16 the binding constraint is the period, served
    only by the aromatase inhibitor at a ceiling of about 1.3 cm over three years. laerkholm2025 is the only
    randomised trial in this atlas with CHANGE IN BONE AGE as a primary outcome under a cheap oral drug.
    HELD AT D because it is a PROTOCOL with no results, the population is overweight girls with early
    puberty, and the mechanism is correction of hyperinsulinaemia - which does not exist to correct in a lean
    insulin-sensitive subject, where metformin would instead lower IGF-1 bioavailability against the GH arm.
- claim: >-
    Metformin should be added to this stack.
  grade: X
  basis: >-
    NOT ON PRESENT EVIDENCE, AND THE MISSING INPUT IS A BLOOD TEST RATHER THAN A PAPER. The subject's fasting
    insulin, fasting glucose and HOMA-IR appear nowhere in this atlas. Insulin-resistant makes it a live
    period lever additive to the aromatase inhibitor; lean and insulin-sensitive makes it a cost with no
    compensating bone-age benefit. The atlas cannot currently say which, and no results exist for the one
    trial that would inform the first case.
- claim: >-
    NSAIDs may be subtracting from height and this atlas has never considered it.
  grade: E
  basis: >-
    THE ABSENCE IS CERTAIN; THE EFFECT IS NOT. Celecoxib and the NSAID class return zero hits across the
    entire file. COX inhibition's documented skeletal direction is suppressive - impaired fracture union is
    the best-established effect - and prostaglandin signalling participates in endochondral growth. NO
    growth-plate length endpoint was retrieved in this round, so this is a watch-list item and a
    contraindication candidate, not a finding.
- claim: >-
    Raising cGMP through the NO/sGC route is a distinct lever from the CNP arm.
  grade: E
  basis: >-
    A TOPOLOGY QUESTION NEVER PUT. The atlas has examined cGMP DEGRADATION - PDE5 at nine nodes, tadalafil at
    fourteen - and established that PDE3 (cilostazol) is the same node as vosoritide. It has never examined
    cGMP SYNTHESIS by soluble guanylate cyclase: L-arginine, citrulline and nitrates are at zero, riociguat,
    vericiguat and cinaciguat are thin. sGC does not compete for NPR-B, so the substitution argument that
    killed cilostazol does not obviously transfer - but that is an argument, not a result, and no length
    endpoint exists for any of them.
key_refs:
- ref_id: laerkholm2025
  pmid: '41291865'
  year: 2025
  type: trial_registry
  one_line_finding: >-
    LIFE-MET - randomised, placebo-controlled, double-blind, four-arm, with CHANGE IN BONE AGE at 12 months
    as the primary outcome under metformin. The only trial in this atlas with bone age as a primary endpoint
    under a cheap oral drug, and it is a protocol with no results in a population that does not match
contradicts: >-
  Does not overturn a prior node. It qualifies a CONVENTION: CLAUDE.md records that generic compound sweeps
  no longer find anything, which is true of sweeps that start from the literature. The inverse sweep - start
  from the graph, find the obtainable agents it has never mentioned - had not been tried and returns thirty.
  It also reframes the last three rounds. HHIP and the volume axis both ended at "no molecule exists", which
  no further searching repairs. The thirty here are a different failure - molecules that exist and are
  obtainable, about which this file has simply never formed a view.
