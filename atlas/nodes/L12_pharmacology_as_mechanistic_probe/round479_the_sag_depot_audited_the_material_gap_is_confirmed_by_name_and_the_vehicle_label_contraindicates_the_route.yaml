id: round479_the_sag_depot_audited_the_material_gap_is_confirmed_by_name_and_the_vehicle_label_contraindicates_the_route
name: >-
  R479 - the SAG depot audited at the level of purchase orders: the formulation problem dissolves, the material
  gap is confirmed by name, and the TISSEEL LABEL EXPLICITLY CONTRAINDICATES INJECTION INTO HIGHLY VASCULARISED
  TISSUE
aliases:
  - SAG GMP grade
  - Tisseel intraosseous contraindication
  - fibrin depot vehicle audit
type: intervention
layer: L12
stub: false
confidence: B
last_verified: '2026-08-27'
species_basis: human, porcine, rabbit, mouse
human_evidence: direct
human_evidence_note: >-
  The vehicle label, the trial registries, the human subchondral injection series and the paediatric epiphyseal
  drilling series are all human. Nothing about SAG itself is.
translation_risk: high
translation_risk_reason: >-
  No Smoothened agonist has ever been given to a human by any route, and the one vehicle with a paediatric
  indication is labelled for topical use only.
summary: >-
  R373 NAMED ONE BLOCKER ON THE SAG PROGRAMME - THE ABSENCE OF PHARMACEUTICAL-GRADE MATERIAL - AND CALLED
  EVERYTHING ELSE APPROVED, ROUTINE OR COMPUTED. Audited against vendor documents, registries and the vehicle's own
  label, one of those three collapses, one is confirmed by name, and one turns out to be false.
  THE FORMULATION PROBLEM DISSOLVES. R388 made an aqueous SAG dihydrochloride at 30 mg/mL or better a named
  requirement and gap g_l12_388b, because a 60 kg systemic dose in the published DMSO vehicle is about 40 mL of
  DMSO subcutaneously. THE VENDOR STATES AQUEOUS SOLUBILITY TO 56.3 mg/mL, WHICH IS 100 mM, WITH NO EXCIPIENTS.
  R388's requirement is met by the salt itself, and the 50 mg/mL figure R392 asked a formulator for is at hand.
  THE MATERIAL GAP IS CONFIRMED, AND NOW BY NAME RATHER THAN BY ASSUMPTION. The vendor that sells SAG and SAG
  dihydrochloride runs a formal GMP and ancillary-material small-molecule range of seventeen compounds - CHIR
  99021, LDN 193189, SB 431542, XAV 939, Y-27632, A 83-01, DAPT, dexamethasone, forskolin, retinoic acid and the
  rest - AND SAG IS IN NEITHER LIST. The one product marketed as GMP-grade SAG carries a datasheet that defers
  every purity, endotoxin, bioburden, sterility and residual-solvent figure to a lot certificate and closes by
  saying the product has not been fully validated for medical applications and is for research use only. It is an
  ancillary material for cell-therapy manufacturing, not a drug substance.
  SCALE AND COST ARE NOT THE OBSTACLE, WHICH SHARPENS THE POINT. Catalogue SAG runs to 2 g at about 5,850 US
  dollars, with custom synthesis at a 1 g minimum and a two to four month lead time. R392's mid-anchor systemic
  pulse is 245 mg and a whole bilateral local pulse is 2.70 mg. THE LOCAL DEPOT IS TRIVIALLY WITHIN CATALOGUE
  SCALE. What cannot be bought is the qualification, not the compound.
  AND A PURCHASING TRAP THAT WOULD SURVIVE AN ORDER FORM. CLAUDE.md records that CAS 364590-63-6 is the free base
  and that the salt must be specified. Half right: PubChem attaches 364590-63-6 to the free base AND to the
  dihydrochloride MONOHYDRATE, and vendors use it for both. The anhydrous dihydrochloride at MW 562.98 is
  2702366-44-5; the free base at 490.06 is 912545-86-9; the monohydrochloride is 2095432-58-7; and at least one
  vendor sells the dihydrate at MW 599.0. SPECIFY BY MOLECULAR FORMULA AND MOLECULAR WEIGHT, NOT BY CAS.
  THE THING THAT IS FALSE IS THE VEHICLE, AND IT IS THE ONE PART OF THE PROTOCOL THIS FILE CALLED APPROVED.
  R373 to R387 specified TISSEEL because it is an FDA-approved material indicated in paediatric patients. Its
  label says FOR TOPICAL USE ONLY, and section 4 contraindicates injecting it directly into the circulatory system
  OR INTO HIGHLY VASCULARIZED TISSUE, on the stated grounds that intravascular application can cause intravascular
  coagulation and life-threatening thromboembolic events. EPIPHYSEAL CANCELLOUS BONE IS A HIGHLY VASCULARISED
  COMPARTMENT DRAINING INTO THE VENOUS CIRCULATION. An intraosseous fibrin depot is off-label by route and sits
  against an explicit label contraindication, and no round of this programme priced that.
  ALSO CORRECTED IN PASSING: the current Tisseel indication statement reads adult and paediatric patients WITHOUT
  the over-one-month qualifier this file has carried. That figure comes from section 8.4, where efficacy was
  supported by one study including 27 paediatric patients aged 1 month to 16 years. EVICEL is supported only above
  six months, so Tisseel does have the lower paediatric limit - just not for this route.
  WHAT THE VEHICLE DOES HAVE IS TWO PIECES OF DIRECT EVIDENCE NEAR THE TARGET, ONE OF THEM NEW. park2025metaphyseal
  is already held here as the control that made R442's occlusion finding interpretable, and it doubles as a vehicle
  control: a Tisseel-filled metaphyseal defect in a normal growing rabbit gave NO significant growth stimulation
  where bone wax did, so the fibrin itself is not a growth stimulus in that compartment. NEW THIS ROUND, abood2020
  put Tisseel into a standardised PHYSEAL gap in the porcine distal femur for FOURTEEN WEEKS: every empty gap
  formed a bone bridge and Tisseel alone gave a bridge in about one gap of five. A pilot at n=5 per arm, and the
  only large-animal precedent for this vehicle against a growth plate.
  THE ACCESS ROUTE IS ESTABLISHED IN ADULTS AND, FOR THE INSTRUMENT IF NOT THE DRUG, IN CHILDREN. Percutaneous
  subchondral knee injection in adults now covers 24 studies and 1,109 patients with a median complication rate of
  6.7 per cent, calcium phosphate leakage commonest, and named serious complications including a five-case series
  of talar osteonecrosis after calcium phosphate. In skeletally immature knees, percutaneous retrograde drilling
  obliquely THROUGH THE CONDYLAR EPIPHYSIS starting distal to the physis is established practice for juvenile
  osteochondritis dissecans, 31 patients at mean four years, with an MRI-guided series of ten reporting no
  procedural complications. NOBODY HAS DELIVERED A DRUG THROUGH THAT ROUTE IN A CHILD.
  AND THE REGISTRY NEGATIVE IS NOW EARNED TWICE OVER. clinicaltrials.gov and the EU Clinical Trials Register were
  queried directly for smoothened agonist, hedgehog agonist, SAG21k, purmorphamine, GSA-10, Hh-Ag1.5 and hedgehog
  pathway activator: EVERY hedgehog entry in both registries is an ANTAGONIST. The nearest thing to a clinical
  programme was Curis licensing its hedgehog protein and small-molecule agonists to Wyeth in January 2004 for
  stroke and cardiovascular disease; Wyeth terminated the collaboration effective 6 May 2008 with the work still
  preclinical. R441's shape again - the indication was dropped, not the biology refuted.
  ONE ROUTE IS FURTHER ALONG THAN SAG AND IT IS A PROTEIN. Recombinant human Sonic hedgehog is sold at GMP grade
  with purity above 95 per cent, ENDOTOXIN BELOW 0.01 EU PER MICROGRAM, under ISO 9001:2015 and ISO 13485:2016 and
  against USP chapter 1043 for ancillary materials - and it is licensed for preclinical or clinical EX VIVO use,
  not in vivo administration. So a qualified hedgehog activator is purchasable today; it is a roughly 19 kDa
  protein, which sits where farnum2006's size curve is around 10 per cent, and it is not licensed for the route
  that would be needed.
quantitative:
  - parameter: aqueous solubility of SAG dihydrochloride
    value: '56.3'
    unit: mg/mL, equal to 100 mM, vendor-stated, no excipients
    species: not_applicable
    source_ref: he2024sag
    note: >-
      R388 made an aqueous formulation at 30 mg/mL or better a named requirement and gap g_l12_388b. The salt meets
      it unaided, and R392's stretch target of 50 mg/mL is also met. Vendor specification, not an independent
      measurement.
  - parameter: SAG in the vendor's formal GMP and ancillary-material small-molecule range
    value: absent
    unit: not in either the 5-compound GMP list or the 12-compound ancillary-material list
    species: not_applicable
    source_ref: he2024sag
    note: >-
      The specification framework exists at the vendor that sells SAG - HPLC and chiral purity, identity, residual
      solvents, Karl Fischer, bioburden and endotoxin, ICH Q7, ISO 9001:2015, TSE/BSE certification. SAG is simply
      not enrolled in it. The one product marketed as GMP-grade SAG has a datasheet with no numeric specification
      of any kind and a research-use-only statement.
  - parameter: largest catalogue quantity of SAG
    value: 2 g ready to ship, custom synthesis at a 1 g minimum with a 2 to 4 month lead time
    unit: about 5,850 US dollars for 2 g of free base
    species: not_applicable
    source_ref: he2024sag
    note: >-
      Against R392's 245 mg per systemic pulse at the mid anchor and 2.70 mg for a whole bilateral local pulse.
      Scale and cost are not the obstacle; qualification is.
  - parameter: TISSEEL label contraindication bearing on an intraosseous depot
    value: do not inject into the circulatory system or into highly vascularized tissue
    unit: >-
      section 4, on the stated grounds of intravascular coagulation and life-threatening thromboembolic events;
      route is for topical use only
    species: human
    source_ref: tisseel_label
    note: >-
      Epiphyseal cancellous bone is highly vascularised and drains into the venous circulation. R373 to R387
      specified this vehicle for an intraosseous depot and never priced the contraindication.
  - parameter: Tisseel left against a porcine physis for fourteen weeks
    value: bone bridge in about 1 gap of 5, against a bridge in ALL empty gaps
    unit: standardised physeal gap, distal femur, 10 animals, paired design, MRI plus histology
    species: porcine
    source_ref: abood2020
    note: >-
      The only large-animal precedent for this vehicle in contact with a growth plate. Pilot, n=5 per arm.
  - parameter: registered human trials of any Smoothened or hedgehog pathway AGONIST
    value: '0'
    unit: clinicaltrials.gov and the EU Clinical Trials Register, queried directly
    species: human
    source_ref: zhang2020nanobody
    note: >-
      Every hedgehog entry in both registries is an antagonist - vismodegib, sonidegib, glasdegib, taladegib,
      patidegib, LEQ506, BMS-833923. SAG21k, purmorphamine, GSA-10 and Hh-Ag1.5 return zero each. WHO ICTRP and EU
      CTIS could not be queried directly, so the negative rests on two registries plus targeted searching.
  - parameter: recombinant human Sonic hedgehog at GMP grade
    value: purity above 95 per cent, endotoxin below 0.01 EU per microgram
    unit: ISO 9001:2015 and ISO 13485:2016, USP chapter 1043, for preclinical or clinical EX VIVO use
    species: not_applicable
    source_ref: zhang2020nanobody
    note: >-
      A qualified hedgehog activator IS purchasable, which SAG is not - but it is a protein of roughly 19 kDa and
      it is not licensed for in vivo administration.
