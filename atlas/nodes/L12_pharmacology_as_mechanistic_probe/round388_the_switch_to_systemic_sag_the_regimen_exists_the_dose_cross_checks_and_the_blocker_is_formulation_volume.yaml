localization: systemic - subcutaneous administration reaching every growth plate including the axial skeleton
human_evidence: absent
human_evidence_note: >-
  No Smoothened agonist has ever been given to a human by any route. A re-query of
  clinicaltrials.gov in R375 returned zero Smoothened-agonist studies; every registered
  hedgehog entry is an antagonist. Both regimens scaled here are mouse.
species_basis:
  - mouse
translation_risk: high
translation_risk_reason: >-
  Body-surface-area allometry is the standard first-in-human bridge but it is an
  approximation, and no pharmacokinetic data exist for SAG in any species at these
  exposures. li2021's effect sizes are restoration in a deficient model and CORR-203
  excludes them from any prediction of gain in a normal subject. The one systemic length
  arm in a normal animal is statistically uninformative. And the subject is at bone age
  16, far past the postnatal window in which either mouse regimen was run.
confidence: C
claim_grades:
  - claim: >-
      A published systemic SAG regimen exists with a stature endpoint, a formulation, a
      schedule and a toxicity screen - 20 mg/kg subcutaneous every other day
    grade: B
    basis: single primary paper read in full, mouse, deficient model
  - claim: >-
      Systemic SAG reached the axial skeleton, third lumbar vertebra plus 32.1 percent,
      which no local epiphyseal depot can do
    grade: B
    basis: >-
      measured in li2021; the compartment claim itself is a geometric fact about depot
      placement, not an experimental one
  - claim: >-
      Two independent mouse regimens scale to roughly one gram of drug substance per
      three-week human pulse
    grade: C
    basis: >-
      derived by this atlas from body-surface-area allometry; robust in the sense that
      two unrelated designs agree within 1.26-fold, but allometry is not pharmacokinetics
  - claim: >-
      The binding practical obstacle to the systemic route is formulation volume, and it
      is solved by an aqueous dihydrochloride formulation at 30 mg/mL or better
    grade: C
    basis: >-
      arithmetic on published concentrations plus the standard subcutaneous volume limit;
      no aqueous SAG formulation at that concentration has been demonstrated
  - claim: >-
      Systemic SAG in a NORMAL animal expands the resting-zone stem-cell pool
    grade: B
    basis: trompet2024, wild-type mice, pool plus 61 percent with divisions observed
  - claim: >-
      No systemic SAG regimen has produced a bone-length endpoint in a normal animal
    grade: A
    basis: >-
      trompet2024's systemic length arm is uninformative rather than null - 95 percent
      confidence interval minus 2.03 to plus 6.23 mm on a 12.7 mm bone. Under R302's rule
      this is a gap, not a disqualification
key_refs:
  - ref_id: li2021
    year: 2021
    type: primary
    role: >-
      the regimen - the only systemic SAG study carrying dose, route, schedule,
      formulation, a stature endpoint, a toxicity screen and a vertebral measurement
      together; full text read in R388 and its dosing arms extracted for the first time
  - ref_id: trompet2024
    year: 2024
    type: primary
    role: >-
      the independent cross-check and the normal-animal arm - 25 mg/kg intraperitoneal
      daily for seven days in wild-type mice raised the resting-zone pool 61 percent, and
      scaled by the same allometry it lands within 1.26-fold of li2021's total dose
  - ref_id: mao2026sag
    year: 2026
    type: primary
    role: >-
      the intensity ceiling - 25 mg/kg as a single intraperitoneal dose reduced
      proliferation and delayed G0/G1, which is why the lower-intensity every-other-day
      schedule is the one to copy
  - ref_id: heine2011sag
    year: 2011
    type: primary
    role: >-
      the tolerability precedent for a systemic pulse in a developing mammal - one week of
      systemic SAG in neonatal animals was well tolerated and did not promote tumour
      formation
  - ref_id: chen2002smo
    year: 2002
    type: primary
    role: the potency the dose is aimed at - Smoothened Kd 59 nM, Gli reporter EC50 about 3 nM
