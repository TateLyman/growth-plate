id: round341_four_concept_scale_layers_run_and_the_step_zero_kill_on_the_best_powered_secreted_target_was_wrong
name: 'Round 341 - four concept-scale layers run (CCN2, the imprinted growth network, m6A RNA methylation,
  local versus circulating IGF), and the Step-0 kill on the best-powered secreted target in the file turns
  out to rest on a conflation the atlas had already corrected'
aliases:
- CCN2 CTGF is not a lever
- the imprinted growth network and pubertal timing
- m6A RNA methylation in the human growth plate
- STC2 reopened
- IGFALS is absent and that separates the two IGF arms
type: hypothesis
layer: L12
stub: false
summary: 'THE BRIEF WAS TO WORK AT THE SCALE OF WHOLE REGULATORY LAYERS - genome-wide, DNA- and RNA-level
  - and to keep going until a compound appeared. Four layers were run. Three close or become gaps. The
  fourth is not a new layer at all: it is a correction to a kill this atlas already made, and it reopens
  the best-powered secreted target in the entire file.

  ONE - CCN2/CTGF CLOSES, AND FAST. R340 flagged it as the most abundant unexamined transcript in the human
  growth plate (1,249.2 CPM in 99.9 per cent of cells, above ACAN). Three free checks close it. It is NOT
  in kosmicki2026''s 207 - no human height genetics at any variant class. IMPC has NO Ccn2 length row of
  any kind, and the paralogues that do have rows are null (Ccn3 body -0.432 P=0.55; Ccn5 body -0.610 P=0.42,
  -0.813 P=0.10, tibia -0.511 P=0.94). And the published Ctgf-null phenotype is an EXPANDED hypertrophic
  zone with impaired angiogenesis - i.e. a DISCHARGE FAILURE, which is failure mode 1 and the same trap
  that made denosumab and aggrecanase inhibition contraindications. The clinical-stage anti-CCN2 antibody
  PAMREVLUMAB therefore points the wrong way. CCN2 is abundant because it is a matricellular coordinator
  of matrix and angiogenesis, not because it is a rate-limiter on length. Gap closed negative.

  TWO - THE IMPRINTED GROWTH NETWORK IS REAL, IS IN THE TABLE, AND IS A PREVENTION LEVER RATHER THAN A
  RESCUE LEVER. This is the genuine genome-scale answer to "why does growth stop": a network of imprinted
  genes, epigenetically encoded at methylation-controlled imprinting control regions, coordinately down-regulated
  during postnatal growth deceleration across multiple organs. The atlas had 0 nodes for "imprinted gene
  network". Run against the burden table it produces a striking and coherent block - THREE imprinted genes
  in the shortening list, ALL of them effectively ABSENT from the growth plate: DLK1 -6.79 cm (P=5.0e-09,
  37 carriers) at 0/14 and 0.0 CPM; RTL1 -2.46 (P=3.5e-09, 289) at 1/14; MKRN3 -2.01 (P=6.5e-14, 691) at
  4/14 and 0.3 CPM. DLK1 and MKRN3 loss-of-function both cause CENTRAL PRECOCIOUS PUBERTY in humans. So
  the mechanism is unambiguous and it is a PERIOD mechanism operating entirely through hypothalamic timing
  - a CORR-327 INVERSION, exactly like romosozumab in R327: absence from the plate is not a kill, because
  the lever does not act there. ⛔ AND IT IS SPENT FOR THIS SUBJECT. These genes set WHEN puberty starts.
  At bone age 16 puberty has started and cannot be un-started, and the pharmacological equivalent of delaying
  it - a GnRH analogue - was closed in R329 on adult-height data (cui2025: GnRHa+rhGH 0.48 SDS versus anastrozole+rhGH
  0.81, P<.01). Recorded in full because the block is real and someone will find it again.

  THREE - m6A RNA METHYLATION IS A GENUINE BLIND SPOT, THE MACHINERY IS ALL THERE, AND IT IS A GAP NOT
  A LEVER. Coverage before this round: METTL3 0 nodes 0 refs, METTL14 0/0, ALKBH5 0/0, YTHDF 0/0, WTAP
  0/0, "RNA methylation" 0/0, N6-methyladenosine 0/0, STM2457 0/0. THE ENTIRE APPARATUS IS IN THE POSTNATAL
  HUMAN GROWTH PLATE AT 12/14 - writers METTL3 13.6 CPM, METTL14 19.9, WTAP 127.0, VIRMA 35.0, ZC3H13 87.8,
  METTL16 29.2; erasers FTO 43.0, ALKBH5 52.8; readers YTHDC1 101.4, YTHDF3 68.6, YTHDF2 51.5, YTHDC2 41.4,
  YTHDF1 26.6, HNRNPA2B1 557.3, IGF2BP2 46.6. ✗ But only ONE member reaches the 207 - IGF2BP2 at -2.89
  cm (P=3.4e-31, 800 carriers) - and IMPC has essentially nothing (Ythdc2 homozygote body length -1.930
  at P=0.084, non-significant; nothing else). ✗ And the one strong skeletal primary is DEVELOPMENTAL: kimura2025
  deleted Mettl14 in LIMB PROGENITORS and disrupted cartilage ANLAGEN FORMATION IN LIMB BUDS through a
  GDF5-RUNX-collagen cascade - embryonic patterning, which CORR-299 separates from the open-plate question.
  Direction, insofar as it exists, is that LESS m6A is shorter, so the therapeutic direction would be to
  RAISE m6A, and no METTL3 activator exists. RECORDED AS A NEW LAYER WITH ITS LOCALISATION DONE, which
  is what a future round needs and did not have.

  FOUR - ⭐ AND THE ACTUAL RESULT. R328 FOUND STC2 AND THEN KILLED IT ON A STEP-0 ARGUMENT THAT CONFLATES
  TWO THINGS THIS ATLAS HAD ALREADY SEPARATED. STC2 is +1.37 cm at P=4.51e-34 across 3,927 carriers - among
  the best-powered rows in the whole burden table - it is SECRETED, and the therapeutic direction is to
  BLOCK it, which is the SOST/romosozumab architecture R314 identified as the one already solved. R328''s
  verdict was "DO NOT ADD IT - Step 0 lands on the GH/IGF-1 arm, which this file prices at approximately
  0 attained height after mid-puberty." ⛔ THAT IS THE WRONG COMPARTMENT, AND THE MEASUREMENT THAT SHOWS
  IT IS ALREADY IN THIS FILE. R326 established, on yakar2016, that liver-derived CIRCULATING IGF-1 drives
  mainly RADIAL bone growth while LOCAL IGF-1 drives LONGITUDINAL growth - and R326 used that same distinction
  to DISQUALIFY mecasermin for supplying the circulating half. Run the receiver test on the two halves
  separately and they separate anatomically in the postnatal human growth plate: THE ENTIRE LOCAL IGF-LIBERATION
  APPARATUS IS PRESENT - PAPPA 88.5 CPM in 53.0 per cent of cells (the protease), IGFBP4 34.5 (its substrate),
  IGF2 15.0 (the local ligand), IGF1R 80.4, and STC2 itself 18.1 CPM in up to 59.8 per cent of cells (the
  protease''s endogenous inhibitor) - WHILE IGFALS, THE ACID-LABILE SUBUNIT THAT CARRIES THE CIRCULATING
  TERNARY COMPLEX, IS 0/14 AT 0.0 CPM IN 0.1 PER CENT OF CELLS. The plate cannot see the GH-driven circulating
  pool at all. Blocking STC2 disinhibits PAPP-A, which cleaves IGFBP-4 PERICELLULARLY IN THE MATRIX and
  liberates LOCAL IGF. That is a different compartment from the arm growth hormone occupies, and Step 0
  therefore passes rather than fails.

  WHAT THIS DOES AND DOES NOT BUY. It reopens the target; it does not produce a molecule. NO ANTI-STC2
  THERAPEUTIC ANTIBODY EXISTS in any species, and PAPP-A-directed antibodies are being developed in the
  OPPOSITE direction for atherosclerosis and oncology. ✓ What it does supply is the cheapest validation
  in the file, and R328 already identified it without acting on it: THE Stc2-NULL MOUSE EXISTS AND IS ALREADY
  BRED - lionikas2023 has it at n=21 versus 15 with up to +10 per cent muscle mass, wang2025stc2a has the
  zebrafish null with enlarged adult body size, bai2025 has an A60P knock-in at +11 per cent weight - AND
  NOT ONE OF THEM PUT A CALIPER ON A FEMUR, TIBIA OR VERTEBRA. Body size, muscle and weight, three species,
  no bone length. Under R302''s rule that is a GAP and a cheap one: order the mouse, measure the bone.
  ✓ And one thing runs WITH us for once: unlike HHIP, which is a tumour suppressor, STC2''s entire oncology
  literature calls it a tumour PROMOTER, so blocking it is not a two-sided cancer bet.'
quantitative:
- parameter: 'the two IGF arms separate anatomically in the postnatal human growth plate - the local liberation
    apparatus is complete and the circulating carrier is absent'
  value: 'PRESENT: PAPPA 88.5 CPM 12/14 in 53.0 per cent of cells; IGFBP4 34.5 CPM 12/14; IGF2 15.0 CPM
    12/14; IGF1R 80.4 CPM 12/14; STC2 18.1 CPM 12/14 in up to 59.8 per cent of cells; IGFBP5 91.1; IGFBP3
    91.4. ABSENT: IGFALS 0/14, 0.0 CPM, 0.1 per cent of cells. Minor: PAPPA2 3.8 CPM 8/14 - 23-fold below
    PAPPA.'
  unit: median CPM, samples detected of 14, maximum per cent of cells
  conditions: GSE288028, 14 postnatal human growth plates, 79,934 cells. Burden effects from kosmicki2026
    Supplementary Table 6 - STC2 +1.37 cm P=4.51e-34 n=3,927; PAPPA -4.57 P=1.9e-19 n=194; PAPPA2 -2.10
    P=1.7e-13; IGF1R -5.23 P=4.0e-43; IGFALS -0.69 P=3.4e-17 n=7,418.
  species: human
  source_ref: kosmicki2026
  uncertainty: 'THE IGFALS ABSENCE IS THE LOAD-BEARING OBSERVATION AND IT IS A NON-DETECTION, WHICH THIS
    FILE TREATS CAREFULLY. It is strong here for the reason R308 established: NPPC is also absent in this
    same dataset in unmistakable cartilage that expresses its receptors, and two platforms 19 years apart
    agree, which retired "a non-detection is weak evidence of absence" as a general excuse. IGFALS is also
    a liver-restricted gene by every other source, so absence is expected rather than surprising. WHAT THE
    ANATOMY DOES NOT ESTABLISH IS THE FUNCTIONAL CLAIM. That local IGF liberation is rate-limiting for longitudinal
    growth, and that raising it in an adolescent produces length, is NOT shown by expression - it rests
    on yakar2016 (mouse) plus the direction of the human burden effects. The discriminating measurement
    this atlas has never had, and still does not, is free versus total IGF-1 by growth-plate zone in any
    species.'
- parameter: 'the imprinted block - three genes, one mechanism, all absent from the plate'
  value: 'DLK1 -6.79 cm (P=5.0e-09, 37 carriers), growth plate 0/14 at 0.0 CPM; RTL1 -2.46 cm (P=3.5e-09,
    289 carriers), 1/14 at 0.2 CPM; MKRN3 -2.01 cm (P=6.5e-14, 691 carriers), 4/14 at 0.3 CPM'
  unit: centimetres per allele, and detection in 14 postnatal human growth plates
  conditions: kosmicki2026 Supplementary Table 6 joined to GSE288028. DLK1 and RTL1 sit in the 14q32 imprinted
    locus; MKRN3 in the 15q11 locus. Loss-of-function of DLK1 and of MKRN3 are both established human causes
    of central precocious puberty.
  species: human
  source_ref: kosmicki2026
  uncertainty: 'THE PATTERN IS CLEAN AND THE INFERENCE FROM IT IS BOUNDED. Three imprinted genes shortening,
    all effectively absent from the target tissue, with two of them having a known pubertal-timing phenotype,
    is a coherent block and a genuine CORR-327 inversion - the absence is not a kill because the lever acts
    in the hypothalamus. BUT the height effect is inferred to run through pubertal timing rather than measured
    to; the carrier counts for DLK1 are small (37); and no imprinted-network intervention exists in any
    species. THE DECISIVE LIMIT FOR THIS CASE IS NOT EVIDENTIAL BUT TEMPORAL: these genes set the age at
    which puberty begins, and this subject is past it.'
- parameter: the m6A apparatus in the postnatal human growth plate, localised here for the first time
  value: 'HNRNPA2B1 557.3 CPM; WTAP 127.0; YTHDC1 101.4; ZC3H13 87.8; YTHDF3 68.6; ALKBH5 52.8; YTHDF2 51.5;
    IGF2BP2 46.6; FTO 43.0; YTHDC2 41.4; VIRMA 35.0; METTL16 29.2; YTHDF1 26.6; METTL14 19.9; RBM15 17.4;
    METTL3 13.6 - all 12/14 except METTL3 at 11/14. IGF2BP1 0/14 and IGF2BP3 6/14 are the exceptions.'
  unit: median CPM across 14 postnatal human growth plates
  conditions: GSE288028. Only IGF2BP2 appears in kosmicki2026's 207, at -2.89 cm (P=3.4e-31, 800 carriers).
    IMPC returns one near-significant row for the whole set - Ythdc2 homozygote body length -1.930 at P=0.084.
  species: human
  source_ref: kimura2025
  uncertainty: 'A LOCALISATION, NOT A LEAD, AND IT IS RECORDED AS SUCH. The whole layer is present and transcriptionally
    plausible, but the genetic anchor is a single reader gene and the mouse length data are effectively
    empty, which is the opposite of the pattern that made the cross-linking and HHIP axes worth pursuing.
    The strongest skeletal primary on the layer (kimura2025) is a LIMB-PROGENITOR deletion affecting cartilage
    anlagen formation in limb buds - developmental patterning, which CORR-299 separates from whether the
    layer is doing work in an open postnatal plate. Direction is inferred (less m6A is shorter, so raise
    it) and no METTL3 activator exists. The value of this row is that the next round starts with the localisation
    done rather than assuming it.'
localization:
- 'postnatal human growth plate: the complete local IGF-liberation module (PAPPA, IGFBP4, IGF2, IGF1R, STC2)
  and the complete m6A apparatus; IGFALS and CCN2-relevant genetics absent or unanchored'
- 'hypothalamus and pituitary: where the imprinted block (DLK1, RTL1, MKRN3) must act, since all three are
  absent from the plate'
human_evidence: direct
human_evidence_note: 'The burden effects, the growth-plate expression and the pubertal-timing phenotypes
  of DLK1 and MKRN3 are all human. The functional claim that local IGF liberation is rate-limiting for longitudinal
  growth rests on mouse (yakar2016), and no STC2-directed agent exists in any species.'
species_basis:
- human
- mouse
translation_risk: moderate
translation_risk_reason: The compartment separation is measured in human tissue and the burden effects are
  human, but the mechanism connecting local IGF liberation to longitudinal growth is mouse, and there is
  no agent to translate.
confidence: C
claim_grades:
- claim: CCN2/CTGF is a height lever.
  grade: X
  basis: 'CLOSED ON THREE FREE CHECKS. Not in kosmicki2026''s 207 at any variant class; no IMPC Ccn2 length
    row of any kind, with the paralogues null; and the Ctgf-null phenotype is an expanded hypertrophic zone
    with impaired angiogenesis, i.e. a discharge failure, which makes the clinical-stage anti-CCN2 antibody
    pamrevlumab wrong-directional. Abundance without a rate-limiting role - which is the point R340 flagged
    and this closes.'
- claim: The imprinted growth network is a usable lever at bone age 16.
  grade: X
  basis: 'The block is real - DLK1 -6.79, RTL1 -2.46, MKRN3 -2.01, all absent from the plate, with DLK1
    and MKRN3 loss causing central precocious puberty - and it is a genuine CORR-327 inversion. But it acts
    by setting WHEN puberty begins, which is spent for this subject, and the pharmacological equivalent
    (a GnRH analogue) was closed in R329 on adult-height data. Prevention lever, not a rescue lever.'
- claim: m6A RNA methylation is a lead.
  grade: E
  basis: 'A LOCALISATION AND A GAP. The entire apparatus is 12/14 in the postnatal human growth plate and
    the atlas had zero coverage of it, which is worth recording. Against promotion: only IGF2BP2 reaches
    the 207, IMPC is effectively empty, the strongest skeletal primary is a limb-progenitor developmental
    deletion rather than a postnatal one, and the implied direction (raise m6A) has no agent.'
- claim: R328's Step-0 kill on STC2 was correct.
  grade: X
  basis: 'WITHDRAWN. R328 rejected STC2 because "Step 0 lands on the GH/IGF-1 arm", but R326 had already
    established on yakar2016 that circulating IGF-1 drives mainly RADIAL growth while LOCAL IGF-1 drives
    LONGITUDINAL growth, and used that same distinction to disqualify mecasermin. The receiver test separates
    the two halves in human tissue: the entire local liberation module is present (PAPPA 88.5 CPM, IGFBP4
    34.5, IGF2 15.0, IGF1R 80.4, STC2 18.1 in up to 59.8 per cent of cells) while IGFALS - the carrier of
    the GH-driven circulating ternary complex - is 0/14 at 0.0 CPM. Blocking STC2 disinhibits PAPP-A acting
    PERICELLULARLY on IGFBP-4 in the matrix. That is not the arm growth hormone occupies.'
- claim: STC2 blockade should be added to the stack.
  grade: E
  basis: 'REOPENED, NOT PROMOTED, AND THE REASON IS MODALITY NOT BIOLOGY. The target is as well anchored
    as anything in this file - +1.37 cm at P=4.51e-34 across 3,927 carriers, secreted, present in up to
    59.8 per cent of growth-plate cells, direction is to BLOCK, architecture identical to SOST/romosozumab
    which R314 identified as already solved, and for once the oncology literature runs with us because STC2
    is a tumour promoter rather than a suppressor. NO ANTI-STC2 THERAPEUTIC ANTIBODY EXISTS IN ANY SPECIES.
    And the functional claim is still mouse-based: no experiment has shown that raising local IGF liberation
    lengthens bone in a normal animal.'
- claim: The cheapest validation on this axis has already been built and not used.
  grade: B
  basis: 'The Stc2-null mouse exists and is bred. lionikas2023 phenotyped it at n=21 versus 15 and reports
    up to +10 per cent muscle mass; wang2025stc2a reports enlarged adult body size in the zebrafish null;
    bai2025 reports +11 per cent weight in an A60P knock-in. Body size, muscle mass and weight in three
    species - and not one measured a femur, tibia or vertebra. Under R302 that is a gap, and it is a caliper
    on an animal that already exists rather than a new model.'
