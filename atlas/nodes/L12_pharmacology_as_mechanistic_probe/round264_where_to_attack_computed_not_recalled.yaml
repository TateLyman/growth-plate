id: round264_where_to_attack_computed_not_recalled
name: >-
  ROUND 264 - the attack map computed over all 788 nodes rather than recalled. N, the pool, has ONE
  intervention node against DURATION's twenty, and duration is the only term in the identity carrying
  grade-A agents. And the stack's lead agent class - every FGFR3 node including erdafitinib - cannot be
  assigned to a term from its own text
aliases:
- round 264
- where to attack
- the term coverage map
- N is empty
type: dataset
layer: L12
stub: false
summary: >-
  ASKED TO STOP LEANING ON RECALL AND FIND WHERE TO ATTACK, THE HONEST MOVE IS TO COMPUTE IT. Tool at
  atlas/tools/round264_where_to_attack.py walks all 788 node files, finds every node typed INTERVENTION,
  and assigns it to a term of the round-247 identity ONLY IF the node's own text names that term's
  vocabulary. Nothing is assigned from memory; anything unassignable is listed as such.

  ONE - THE COVERAGE TABLE, AND IT IS LOPSIDED BY AN ORDER OF MAGNITUDE.
  Intervention nodes touching each term, and how many carry a real LENGTH endpoint rather than a proxy:
  N, THE POOL - ONE node, one with length.
  LAMBDA, the stem division rate - THREE nodes.
  A, amplification - TEN nodes, seven with length.
  h_term, terminal cell height - EIGHT nodes, seven with length.
  dt, DURATION - TWENTY nodes, seventeen with length, AND IT IS THE ONLY TERM CARRYING GRADE-A AGENTS -
  anastrozole, letrozole and the GnRH analogue all sit at A.
  Counting every node in the graph that carries any bone or body length measurement rather than only
  interventions gives the same shape: N 15, lambda 18, h_term 47, A 66, DURATION 101.
  THE PROGRAMME HAS SPENT ITS EFFORT ON A, h_term AND dt, AND HAS ALMOST NOTHING ON N. That is the finding,
  and it is uncomfortable because round 247 established that N is the term that bounds final height once
  the integral is nearly spent - remaining height = N_remaining x A x h_term - and the subject is at bone
  age 16, which is precisely the regime where N is binding and rate is not.

  TWO - WHY THAT ASYMMETRY EXISTS, WHICH IS NOT AN ACCIDENT. Duration has twenty agents because duration is
  DRUGGABLE BY ENDOCRINOLOGY - oestrogen synthesis and signalling are systemically accessible with approved
  oral drugs and human trial endpoints. The pool is a cell-number problem inside an avascular tissue with no
  systemic handle, and every attempt on it in this file has failed the same way: horike2026 expanded the
  resting zone and got short bones, newton2019's Tsc1 gave pool without flux, reyes2023's Jansen gave
  amplification without discharge, trompet2024's systemic SAG moved the pool and not the length, and
  koyama2021's CD2665 expanded the plate and left the tibia unchanged. FIVE POOL-OR-ZONE EXPANSIONS, FIVE
  FAILURES TO CONVERT. The term with the fewest agents is also the term with the highest failure rate among
  the agents it has, and those two facts are the same fact: nobody has solved DISCHARGE.

  THREE - AND A BOOKKEEPING HOLE AT THE CENTRE OF THE STACK. THIRTY-TWO intervention nodes cannot be
  assigned to any term from their own text. The list includes erdafitinib, fgfr3_tyrosine_kinase_inhibitor,
  infigratinib_growth, soluble_fgfr3_decoy AND recombinant_human_gh. THE ATLAS HOLDS ITS LEAD AGENT CLASS
  AS AN INTERVENTION WITHOUT STATING WHICH TERM IT MOVES. That is why the redundancy question of round 263
  was answerable only by going to a Trpm7 knockout in a different literature: the atlas had no term
  assignment for erdafitinib to compare against. Stacking is a statement about terms, so an unassigned
  agent cannot be stacked rigorously - it can only be stacked by anecdote, which is what rounds 262 and 263
  were doing in opposite directions.

  FOUR - THE BURNED SURFACE, WHICH IS THE OTHER HALF OF KNOWING WHERE TO GO. 253 CLAIMS IN THIS GRAPH ARE
  GRADED X. That is a large number and it is the most valuable asset the file has, because an X is a wall
  someone already hit at full speed. Among them: growth hormone cannot be ranked on the bone-age-cost axis;
  the periosteum is not a mechanical tether; the human growth plate does not make sclerostin; osteocrin has
  never been given to a human; sympathetic tone does not affect human longitudinal growth; systemic
  retinoid exposure does not reduce adult height in humans; a drug acting on RARgamma does not thereby
  shorten bones. ANY NEW PROPOSAL SHOULD BE CHECKED AGAINST THAT LIST BEFORE IT IS RESEARCHED, and this
  session failed to do that three times.

  FIVE - SO WHERE TO ATTACK, STATED AS A RANKING RATHER THAN AN ENTHUSIASM.
  FIRST, DISCHARGE, NOT POOL. The five failures above are all charge without discharge. The atlas has a
  candidate discharge signal - hedgehog WITHDRAWAL, round 251 - and one agent that protects the plate
  through it, the RARgamma antagonist of koyama2021, which is exactly what round 261 demoted it to. THE
  CHARGE-AND-DISCHARGE PAIR IS THE ONLY CONFIGURATION IN THIS FILE THAT ADDRESSES N, and it has never been
  run to a length endpoint in any species. That is the attack.
  SECOND, THE PER-SITE DENOMINATOR, which the open-question ledger already names as one of the two things
  that would change the stack today. Nobody knows how many centimetres remain AT EACH SITE at bone age 16,
  so no agent can be converted into predicted centimetres and every site-specific result is weighted by
  guesswork. It is RETROSPECTIVE and essentially free - the images exist in paediatric orthopaedic cohorts
  and the studies reported the spine only.
  THIRD, ASSIGN THE THIRTY-TWO. Until erdafitinib and GH have term assignments, no stacking statement about
  them is rigorous.
  AND WHAT NOT TO ATTACK: duration is the best-covered term in the file, has the only grade-A agents, and
  round 254 measured its ceiling on attained height at three to four centimetres. It is not where the
  remaining upside is; it is where the remaining CERTAINTY is, which is a different thing and worth having
  for exactly that reason.
quantitative:
- parameter: >-
    INTERVENTION-NODE COVERAGE BY TERM OF THE HEIGHT IDENTITY, COMPUTED OVER 788 NODES
  value: >-
    N (pool) 1 node; lambda (stem rate) 3; h_term 8; A (amplification) 10; dt (DURATION) 20. Counting all
    nodes carrying any length measurement: N 15, lambda 18, h_term 47, A 66, duration 101
  unit: number of nodes
  conditions: >-
    atlas/tools/round264_where_to_attack.py. Walks every non-stub node file, selects those typed
    "intervention", and assigns a term only where the node's own text matches that term's vocabulary
    (resting-zone cell number, stem cycle time, cells per column, terminal cell height, fusion/closure
    respectively). A node is recorded as carrying a LENGTH endpoint only if it names a bone, limb or body
    length or height; zone heights, plate thickness and areas are recorded as proxy, per CORR-189. Duration
    is the only term whose agents include grade-A nodes (anastrozole, letrozole, GnRH analogue).
  species: not_applicable
  source_ref: chu2025
  uncertainty: >-
    KEYWORD ASSIGNMENT IS CRUDE AND UNDERCOUNTS. A node that moves a term without naming its vocabulary is
    missed, which is exactly why 32 intervention nodes came back unassigned rather than being forced into a
    bucket. The counts are therefore a LOWER BOUND per term and the comparison between terms is only as
    good as the symmetry of the vocabularies, which is not guaranteed - "fusion" is a commoner word than
    "cells per column" and duration may be flattered by that. What the table supports is the ORDER OF
    MAGNITUDE of the asymmetry, not the exact ratios.
- parameter: >-
    THE UNASSIGNED INTERVENTIONS, INCLUDING THE STACK'S LEAD AGENT CLASS
  value: >-
    32 intervention nodes cannot be assigned to a term from their own text, including erdafitinib,
    fgfr3_tyrosine_kinase_inhibitor, infigratinib_growth, soluble_fgfr3_decoy and recombinant_human_gh
  unit: number of nodes
  conditions: Same tool and same run.
  species: not_applicable
  source_ref: chu2025
  uncertainty: >-
    Some of these are genuinely multi-term or are procedures rather than pharmacology (epiphysiodesis,
    distraction osteogenesis, limb lengthening), where "unassigned" is correct rather than a defect. The
    defect is specifically the FGFR3 class and growth hormone, which are pharmacological, are in the
    proposed stack, and have no stated term.
- parameter: >-
    THE X-GRADED SURFACE - HOW MUCH OF THIS FILE IS ALREADY-REFUTED CLAIMS
  value: 253 claims graded X across the graph
  unit: number of claim_grades entries at grade X
  conditions: Same tool and same run, counting claim_grades entries whose grade is X.
  species: not_applicable
  source_ref: chu2025
  uncertainty: >-
    Some X grades are internal corrections of this atlas's own earlier statements rather than refutations
    of external propositions, so the number overstates how much external ground has been cleared. It is
    still the right list to check a new proposal against, and this session failed to check it three times.
localization:
- 'the height identity: N, lambda, A, h_term, dt'
human_evidence: absent
human_evidence_note: This is a structural audit of the graph, not a biological measurement.
species_basis:
- not_applicable
translation_risk: not_applicable
translation_risk_reason: No biological claim is made.
confidence: B
confidence_reason: >-
  The counts are computed and reproducible from a committed tool. They are graded B rather than A because
  keyword-based term assignment undercounts and the vocabularies are not symmetric across terms, so the
  exact ratios are softer than the order-of-magnitude asymmetry they demonstrate.
claim_grades:
- claim: The pool term N is the least-covered term in this atlas.
  grade: B
  basis: >-
    One intervention node against duration's twenty, and 15 length-endpoint nodes against duration's 101,
    computed over all 788 node files. Robust to the undercounting caveat because the gap is an order of
    magnitude.
- claim: The atlas has been attacking the terms that are easiest to drug rather than the term that binds.
  grade: C
  basis: >-
    Duration has twenty agents because oestrogen synthesis is systemically druggable with approved orals and
    human endpoints; the pool is a cell-number problem in an avascular tissue with no systemic handle. Round
    247 puts N as the binding term once the integral is nearly spent, which is the subject's regime. The
    inference that the asymmetry is driven by druggability rather than by importance is reasoning, not
    measurement.
- claim: >-
    Every pool-or-zone expansion in this file has failed to convert to length.
  grade: B
  basis: >-
    Five independent instances - horike2026 expanded resting zone with short bones, newton2019 Tsc1 pool
    without flux, reyes2023 Jansen amplification without discharge, trompet2024 systemic SAG pool without
    length, koyama2021 CD2665 plate expansion without tibial length. The common failure is discharge, not
    charge.
- claim: The stack's lead agent has a term assignment in this atlas.
  grade: X
  basis: >-
    NO. erdafitinib, fgfr3_tyrosine_kinase_inhibitor, infigratinib_growth and soluble_fgfr3_decoy are all
    typed as interventions and none states which term of the identity it moves - nor does
    recombinant_human_gh. That is why round 263's redundancy question had to be answered from a Trpm7
    knockout in an unrelated literature.
key_refs:
- ref_id: chu2025
  year: 2026
  type: primary
  one_line_finding: >-
    The population-asymmetry result from which round 247 derived the identity this audit is computed
    against - HEIGHT is the integral of lambda x N x A x h_term, and N is the term that binds once the
    integral is nearly spent
contradicts: >-
  Does not overturn a prior node. It reframes the programme's own effort allocation: the atlas has twenty
  intervention nodes on DURATION, the term whose measured ceiling on attained height round 254 put at three
  to four centimetres, and ONE on N, the term round 247 identified as binding at bone age 16. It also
  exposes that thirty-two intervention nodes - including the entire FGFR3 class and growth hormone - carry
  no term assignment, which makes every stacking statement about them informal.
