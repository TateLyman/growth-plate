  value: '1.2'
  unit: uM
  conditions: DSPE-PEG2k-WYRGRL against immobilised recombinant human COL2A1 (~12,600 RU), surface plasmon
    resonance, 0.31-20 uM analyte, 1:1 Langmuir fit
  species: not_applicable
  source_ref: ye2026
  uncertainty: 'reported as approximate; no CI given; a 1:1 Langmuir fit to a peptide-collagen interaction
    is a strong model assumption. This is the one measurement in the study made against a HUMAN protein.'
