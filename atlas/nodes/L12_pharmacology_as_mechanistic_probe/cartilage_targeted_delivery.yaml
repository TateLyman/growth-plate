localization:
- 'mouse distal femoral growth plate: DiR signal detected on hard-tissue cryosections (ye2026)'
- 'human growth plate: never tested; the authors state the tissue was unobtainable'
human_evidence: absent
human_evidence_note: No human tissue and no human subject. The single human-relevant measurement is the
  1.2 uM affinity of the targeting peptide for recombinant human collagen II, which says the ligand should
  bind human cartilage matrix and says nothing about whether a particle penetrates a human physis, which
  is thicker, slower and more heavily loaded than a mouse one.
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: 'Diffusion into avascular cartilage scales badly with thickness, and the human
  growth plate is far thicker than the mouse plate that was treated - the human inert zone alone is 700-1000
  um (thurston1985), which is more than the full height of a mouse plate. A carrier that penetrates a mouse
  physis in 24 h has not been shown to penetrate a human one at all, and the study contains no concentration
  measurement with which to model the scaling.'
