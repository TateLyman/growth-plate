id: cartilage_targeted_delivery
name: Cartilage-targeted nanoparticle delivery to the growth plate
aliases:
- CT-CM-NPs
- collagen-II-targeting nanoparticle
- chondrocyte membrane-coated nanoparticle
type: intervention
layer: L12
stub: false
summary: 'The growth plate is avascular and alymphatic, so every systemic agent reaches it by diffusion
  through a dense proteoglycan matrix. That is the exposure problem, and it is the reason the atlas records
  no measured drug concentration in growth-plate cartilage for any compound in any species (g_l12b_002).
  Cartilage-targeted carriers are the only class of intervention that attacks the exposure term itself
  rather than the target. The best-characterised construct is a PLGA core coated with primary chondrocyte
  plasma membrane and decorated with DSPE-PEG2k conjugated to WYRGRL, a collagen-II-binding peptide whose
  affinity for recombinant human COL2A1 is about 1.2 uM by surface plasmon resonance. Loaded with the
  Hedgehog agonist purmorphamine and given intravenously at 1 mg/kg every two days for five weeks, it
  restored body length in Fgfr3 V376D/+ hypochondroplasia mice to a value not significantly different
  from wild-type littermates. The two components do different jobs: the peptide drives enrichment around
  cartilage, the membrane coat drives retention inside it, and neither alone reproduces the combination.
  What the study does NOT provide is an exposure measurement. Every growth-plate number in it is normalised
  fluorescence radiant efficiency of DiR, a lipophilic carbocyanine membrane dye that reports where the
  particle label is and not how much drug arrived. There is no concentration in any absolute unit, no AUC,
  no half-life, and no free-versus-bound fraction. The authors state that they could not obtain human
  growth-plate cartilage to validate any of it.'
quantitative:
