  species: not_applicable
  source_ref: ye2026
  uncertainty: n=5; best of a ratio series, so an optimised rather than a typical value
- parameter: time to peak nanoparticle signal in the distal femoral region
  value: '24'
  unit: h
  conditions: single intravenous injection of 100 ug DiR-labelled nanoparticles, mouse, ex vivo IVIS of
