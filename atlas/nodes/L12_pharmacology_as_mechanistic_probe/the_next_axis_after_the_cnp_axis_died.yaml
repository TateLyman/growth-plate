id: the_next_axis_after_the_cnp_axis_died
name: THE NEXT AXIS - h_term is no longer closest to solved, and the only term bone age cannot take away
  is the one nobody in this atlas has ever searched for a compound
aliases:
- what is the next axis
- what do we do next
- untouched terms
- non-endochondral compound
- site arm
type: process
layer: L12
stub: false
summary: 'THE CNP AXIS IS FINISHED AND THE RANKING THAT SENT US THERE IS NOW WRONG IN ONE ENTRY. the_arms
  _reordered_for_late_bone_age ranked seven terms for a bone-age-16 subject and put h_term THIRD, calling
  it BEST-SERVED PHARMACOLOGICALLY AND CLOSEST TO SOLVED. That was true when written. Rounds 152 to 164
  took it apart: control point A has a drug that cannot be obtained for this case at any price, control
  point B is closed on five independent lines, and control point C has two purchasable probes and no
  therapy. H_TERM IS NOT CLOSEST TO SOLVED. IT IS THE MOST THOROUGHLY EXPLORED AND THE EMPTIEST.
  WHAT THE RANKING LEAVES, WITH THAT ENTRY CORRECTED. (1) CLOSURE TIMING - still the largest proven human
  effect in the whole atlas and still only PARTIALLY exploited; anastrozole is in the stack and the
  aromatase route removes LIGAND, while the 204 cm human proof (smith1994) is RECEPTOR disruption, a
  different control point on the same axis. (2) AMPLIFICATION - real numbers, dose-limited, FGFR inhibitor
  and GH already in. (3) H_TERM - now empty, see above. (4) SITE - identified and UNTOUCHED. (5) POOL
  EXPANSION - empty, and arm3_pool_ceiling establishes it is probably not the binding constraint here.
  (6) NON-ENDOCHONDRAL - real centimetres, and not growth. (7) DELIVERY - a gate, not an arm.
  THE STRUCTURAL ARGUMENT THAT PICKS THE NEXT AXIS, AND IT IS SPECIFIC TO THIS SUBJECT RATHER THAN GENERAL.
  POOL, AMPLIFICATION AND H_TERM ARE ALL RATE TERMS AND EVERY ONE OF THEM REQUIRES AN OPEN PLATE. That is
  not a side condition, it is the thing that closed thread D: every access route to the CNP drugs gates on
  genetically confirmed achondroplasia AND AN OPEN, ACTIVELY GROWING PLATE, and two sponsors with the
  deepest datasets in the field both refuse to enrol a closing plate. At bone age 16 plus, the rate terms
  are precisely the terms the subject condition is destroying. CLOSURE TIMING FIGHTS THAT DIRECTLY AND IS
  ALREADY IN THE STACK. SITE EXPLOITS WHATEVER RESERVE REMAINS, WHICH IS WHY THE CASE WAS FRAMED AROUND
  SPINE AND KNEE. AND NON-ENDOCHONDRAL IS THE ONLY TERM WHOSE AVAILABILITY BONE AGE DOES NOT TOUCH AT ALL,
  BECAUSE IT DOES NOT USE A GROWTH PLATE.
  SO THE NEXT AXIS IS NON-ENDOCHONDRAL, AND THE FIRST FINDING IS THAT NOBODY HERE HAS EVER LOOKED FOR A
  COMPOUND ON IT. The term appears in exactly four nodes and all four are INDEX nodes - every_axis_checked,
  the_arms_reordered, the ledger, and cranial_base_synchondrosis. The underlying biology has real coverage
  in L6 mechanobiology - diurnal_stature_variation, bed_rest_growth_human, gravity_posture_spinal_loading -
  and ZERO nodes in L12. THERE IS NO PHARMACOLOGY NODE FOR THIS TERM. It was ranked sixth, filed as not
  growth, and never searched. That is the gap.
  WHY IT IS WORTH SEARCHING RATHER THAN JUST NAMING. The magnitude anchor already exists inside this atlas:
  diurnal stature variation is a measurable within-day height change driven by intervertebral disc
  hydration, and bed rest and microgravity extend it. Those are centimetres, in adults, with closed plates.
  The atlas has never asked whether any of that is pharmacologically addressable, and the intervertebral
  disc has an active regenerative-medicine literature with actual compounds - proteoglycan and aggrecan
  synthesis, GDF5 and BMP family agents, and anti-degenerative approaches - none of which this atlas has
  touched. THE ACAN LINK IS ALREADY HERE AND UNEXPLOITED: aggrecan is the load-bearing proteoglycan of the
  disc AND the gene behind acan_related_short_stature, so one molecule sits on both sides of the
  endochondral/non-endochondral divide.
  THE HONEST PRICE OF THIS DIRECTION, STATED BEFORE ANY WORK IS DONE. NON-ENDOCHONDRAL HEIGHT IS NOT
  GROWTH. Some of it is postural and some is hydrational, and the diurnal component is by definition
  REVERSIBLE - a person who is taller in the morning is not taller. Before any compound is chased, the
  atlas has to establish WHAT FRACTION IS DURABLE, because a mechanism that buys 1.5 cm that disappears by
  evening is worth nothing and a mechanism that raises the set point is worth real height. That question
  is answerable from existing literature and is the correct first move.
  AND ONE THING TO RE-EXAMINE ON THE FIRST-RANKED ARM, BECAUSE IT IS LARGER THAN ANYTHING BELOW IT. THE
  AROMATASE ROUTE AND THE RECEPTOR ROUTE ARE DIFFERENT CONTROL POINTS. Anastrozole lowers oestrogen
  synthesis; smith1994 is a man with a DISRUPTIVE ESR1 MUTATION at 204 cm with unfused epiphyses at 28.
  This atlas already tested the obvious receptor-level compound and killed it - tamoxifen_at_the_growth_
  plate shows chagin2007 and karimian2008 finding dose-dependent growth retardation with NO CATCH-UP by
  APOPTOSIS IN RESTING-ZONE CHONDROCYTES, at concentrations that are the paediatric exposure. BUT THAT
  NODE ALSO RECORDS THAT THE EFFECT IS NOT SIMPLE ER ANTAGONISM - neither oestradiol nor IGF-I rescued it.
  If the resting-zone killing is a tamoxifen off-target rather than a class effect of receptor blockade,
  the class is not dead and the pure antagonists were never tested. That is a specific, checkable question
  and it sits on the highest-ranked arm.'
quantitative:
- parameter: 'THE NON-ENDOCHONDRAL TERM HAS ZERO PHARMACOLOGY COVERAGE IN THIS ATLAS'
  value: 'The term non-endochondral appears in exactly FOUR nodes and all four are indexes:
    every_axis_checked_against_the_stack, the_arms_reordered_for_late_bone_age,
    ledger_what_is_dead_what_is_settled_what_is_live, and cranial_base_synchondrosis. The underlying
    biology is covered in L6 mechanobiology - diurnal_stature_variation, bed_rest_growth_human,
    gravity_posture_spinal_loading - and in L8/L11 through acan_gene and acan_related_short_stature. THERE
    ARE ZERO L12 PHARMACOLOGY NODES FOR THE TERM. No compound has ever been sought'
  unit: node counts
  conditions: Enumerated across the 689-node atlas 2026-08-09 by this atlas.
  species: not_applicable
  source_ref: accomplish_protocol_v5
  atlas_derived: true
  uncertainty: 'A NODE COUNT IS BOOKKEEPING, NOT EVIDENCE, and absence of coverage is not evidence that
    coverage would be rewarding - the term was ranked sixth for reasons, and being unexplored is exactly
    what you would expect of a low-ranked term. The count also depends on the search strings used; related
    biology may sit under names not matched here. The source_ref is nominal, as it is for every structural
    row over the atlas own decomposition.'
- parameter: 'WHY THIS TERM SURVIVES A CONSTRAINT THAT KILLS THE OTHERS'
  value: 'Pool, amplification and h_term are RATE terms and each requires an open, actively growing plate.
    Thread D established that every access route to the CNP drugs gates on an OPEN PLATE and an
    achondroplasia diagnosis: NCT06732895 excludes AGV below 1.5 cm/year or radiological growth-plate
    closure, and NCT07441876 requires ACH with OPEN EPIPHYSES. The non-endochondral term uses no growth
    plate, so bone age does not reduce its availability'
  unit: qualitative - structural argument
  conditions: Enrolment criteria retrieved from ClinicalTrials.gov v2 API at round 158; the term
    decomposition is the atlas own.
  species: not_applicable
  source_ref: accomplish_protocol_v5
  atlas_derived: true
  uncertainty: 'THE ARGUMENT IS ABOUT AVAILABILITY, NOT ABOUT MAGNITUDE, AND THE TWO MUST NOT BE CONFLATED.
    That a term remains available at bone age 16 says nothing about how many centimetres it holds, and the
    atlas own ranking put it SIXTH of seven on effect size. A term can be both the only one left and the
    smallest one. AND THE DURABILITY QUESTION IS UNRESOLVED: the diurnal component of spinal height is
    reversible within a day by definition, so the fraction of the non-endochondral term that represents a
    durable set-point change rather than a transient hydration state is unknown and has to be established
    before any compound is worth chasing.'
localization:
- 'non-endochondral height is intervertebral disc height, spinal curvature and posture - axial, not
  appendicular, and not at a growth plate'
human_evidence: indirect
human_evidence_note: 'The magnitude anchors that exist - diurnal stature variation, bed rest, microgravity -
  are human and are already in L6. What is absent is any human pharmacological intervention on the term.'
species_basis:
- human
- not_applicable
translation_risk: high
translation_risk_reason: 'This node proposes a direction, not an intervention. Nothing has been searched
  yet and the durability of the term is unestablished.'
confidence: C
claim_grades:
- claim: h_term is no longer the arm closest to solved.
  grade: B
  basis: 'Rounds 152-164 closed all three of its control points for this case: the ligand arm has a drug
    that is inaccessible at any price because every route gates on achondroplasia plus an open plate; the
    phosphatase arm is closed on five independent lines; the allosteric arm has two purchasable probes and
    no therapeutic candidate. The earlier ranking predates all of it.'
- claim: Non-endochondral is the only term whose availability bone age does not reduce.
  grade: C
  basis: 'Structural. Pool, amplification and h_term are rate terms requiring an open plate; closure timing
    acts on the plate; site depends on which plates remain open. Non-endochondral height is disc and
    posture and uses no plate. Graded C because it is an argument over the atlas own decomposition rather
    than a measurement, and a different factorisation could cut differently.'
- claim: No compound has ever been sought for the non-endochondral term in this atlas.
  grade: A
  basis: 'Direct enumeration: four mentions, all in index nodes, zero L12 pharmacology nodes. This is a
    fact about the atlas, checkable by anyone reading it.'
- claim: The non-endochondral term is worth pursuing.
  grade: D
  basis: 'For it: it is untouched, it survives the constraint that killed the rate terms, human magnitude
    anchors already exist in L6, and the intervertebral disc has an active regenerative literature with
    real compounds that this atlas has never read. Against it: the atlas own ranking put it sixth of seven
    on effect size, and an unknown fraction of it is reversible hydration rather than durable height. The
    durability question must be settled first.'
- claim: Receptor-level oestrogen blockade is dead as a class.
  grade: D
  basis: 'NOT ESTABLISHED - only tamoxifen is dead. chagin2007 and karimian2008 show dose-dependent growth
    retardation with no catch-up via resting-zone apoptosis at paediatric exposures, which is decisive for
    tamoxifen. But the same node records that neither oestradiol nor IGF-I rescued the arrest, so the
    mechanism is NOT simple ER antagonism - which leaves open whether a pure antagonist or a SERD would
    share it. Untested, and it sits on the highest-ranked arm.'
