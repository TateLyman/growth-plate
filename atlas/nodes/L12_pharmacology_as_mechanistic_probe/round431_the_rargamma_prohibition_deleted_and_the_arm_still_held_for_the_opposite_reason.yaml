edges:
  - to: round347_the_purity_corrected_screen_run_genome_wide_finds_ecrg4_a_secreted_senescence_signal_whose_null_mouse_is_longer
    type: corrects
    note: >
      R347 issued a standing instruction not to propose an RAR antagonist, on the strength of a
      one-round reading that reasoned entirely about retinoid TONE and had not read R255 to R261. The
      instruction is deleted. What R347 got right and this round confirms on an independent split is
      that RARgamma is the plate's RAR and that the plate destroys retinoic acid rather than making
      it. What it could not place - a band with the peak above wild type - is placed here, and it does
      not resolve in the arm's favour.
  - to: round261_the_monotherapy_has_a_length_endpoint_and_it_is_null
    type: supports
    note: >
      R261 demoted the arm on koyama2021's null tibia length and this round agrees, adding the
      mechanism from human tissue: the plate already holds retinoic acid near zero, so a
      co-repressor-preserving antagonist is pushing toward a state the receptor already occupies.
      R261's demotion was invisible to CLAUDE.md, which is why the arm was proposed for reopening.
  - to: round260_the_7c_dossier_and_the_bmp_smad_conflict
    type: extends
    note: >
      R260 raised the BMP/SMAD conflict and could only infer whether it applied at the plate.
      uchibe2017's broadened pSmad1/5/8 in the RARgamma-null growth plate answers it directly and
      unfavourably, so the conflict is established rather than carried.

