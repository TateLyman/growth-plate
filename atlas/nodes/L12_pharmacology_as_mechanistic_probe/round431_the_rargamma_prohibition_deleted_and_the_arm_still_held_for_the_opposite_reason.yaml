id: round431_the_rargamma_prohibition_deleted_and_the_arm_still_held_for_the_opposite_reason
name: The RARgamma standing prohibition is deleted as unsourced - and the arm is still held, for the opposite reason, on a length endpoint the reopening had not read
aliases:
  - R431
  - CORR-357
  - the RARgamma audit
  - retinoid axis state
type: hypothesis
layer: L12
stub: false

summary: >
  R347 wrote a standing instruction - DO NOT PROPOSE AN RAR ANTAGONIST - in a single pass, without
  reading R255 to R260, six rounds that had worked the RARgamma arm to a named, formulated,
  genetically-controlled compound. That instruction has blocked the axis ever since, and it is
  CORR-352 in its most expensive form: tateiwa2022 appears in 2 node files and 0 times in CLAUDE.md,
  janesick2014 2 and 0, koyama2021 10 and 0, le2019a 3 and 0, CD2665 10 and 0. The prohibition is
  deleted here.

  BUT THE AUDIT THAT FOUND IT STOPPED AT R260, AND R261 IS THE ROUND THAT DECIDES THE ARM.
  round261_the_monotherapy_has_a_length_endpoint_and_it_is_null was written immediately after R260 and
  already demoted the arm on a length endpoint in a normal animal. So R347 closed an axis without
  reading the work, and the proposal to reopen it was assembled without reading the closure. Neither
  is a failure of argument - both are the same lossy ledger, running in opposite directions. The fix
  is neither to open nor to close but to put the whole arm, endpoint included, into CLAUDE.md.

  THE DECIDING RESULT IS THE FILE'S OWN. koyama2021 gave CD2665 at 1.5 mg/kg daily by gavage from P20
  to P31 with vehicle, LDE225 and combination arms, and measured body length, body weight and TIBIA
  LENGTH by caliper and whole-body radiography. The monotherapy arm is explicitly reported as
  essentially unaffected on every skeletal parameter, and the authors dropped the regimen from
  subsequent experiments for paucity of response. AND THE PLATE DID RESPOND - the same mice showed
  delayed chondrocyte maturation, increased growth-plate height and expansion of the Col II and Col X
  zones. The drug reached the plate, changed it, and did not lengthen the bone. Failure mode one with
  the length endpoint present.

  WHAT THIS ROUND ADDS IS THE MECHANISM FOR THAT NULL, DERIVED FROM HUMAN TISSUE RATHER THAN THE
  MOUSE. In the purity-corrected human growth plate the chondrocyte's entire retinoid investment is in
  CLEARANCE: CYP26A1 is 47.9-fold enriched, CRABP2 7.6, CRABP1 4.3, while the synthesising enzymes are
  contamination (ALDH1A2 ratio 0.02, ALDH1A1 0.31) and STRA6 is effectively absent. The plate already
  holds retinoic acid near zero, so RARgamma is already largely unliganded - and by R257's own
  ligand-less repressor logic it is therefore already in the repressive state. le2019a showed that
  CD2665 at RARgamma cannot dissociate SMRT; it PRESERVES the co-repressor-bound state. An agent that
  preserves a state the tissue is already in has almost nothing to add. That is a reason the arm fails
  which does not depend on the mouse, the dose or the choice of compound.

  THE SUBTYPE-SPLIT REFRAME WAS TESTED AND FAILS THREE WAYS. The proposal was that retinoic acid
  acting through RARalpha and RARbeta is permissive - carrying R347's CYP26B1 number - while RARgamma
  ligation terminates elongation, so the two are not in conflict. First, RARalpha and RARbeta are not
  in the chondrocyte: ratios 0.42 and 0.31 against RARgamma at 1.08, with RARgamma 3 to 4 times their
  abundance, so there is no plate alpha/beta arm to put the signal on. Second, the human genetics do
  not split by subtype because no subtype carries a height signal at all - RARA, RARB, RARG, RXRA,
  RXRB, RXRG, CYP26A1, RBP4, STRA6, CRABP1, CRABP2, NCOR1, NCOR2, SOX9, ALDH1A1 and ALDH1A2 are every
  one absent from the 207, and CYP26B1 is the only member of the whole retinoid panel that reaches it.
  Third, with a single receptor present the conflict sharpens rather than dissolving: CYP26B1 loss
  means less degradation, more retinoic acid and therefore MORE RARgamma ligation, and it is +0.808 cm
  TALLER at P=1.03e-11 across 3,502 carriers.

  AND THE BMP CONFLICT IS ALREADY RESOLVED AGAINST THE ARM BY A PAPER THE FILE HOLDS. The open
  question was whether 7C's BMP/SMAD stimulation occurs in the resting zone or only in the osteogenic
  compartments where tateiwa2022 measured it. uchibe2017 answers it genetically - broadened pSmad1/5/8
  expression in the RARgamma-null growth plate compared with wild type. Removing RARgamma raises
  BMP-Smad in the plate itself, so the conflict with R241/R243's BMP-Smad-low root cell, and with
  ambrosi2025's independently derived Smoothened agonist plus DMH1 (a BMP inhibitor), is real and is
  not a model artefact.

  VERDICT - HELD, NOT ADDED, AND THE REASON WRITTEN ONCE. The one normal-animal length test is null
  with the plate demonstrably engaged; the human tissue says the receptor is already in the state the
  drug pushes toward; the human genetics offer no support at any subtype and what they offer runs the
  wrong way; and the compound's BMP signature is confirmed in the plate and opposes the root-cell
  programme. The obtainability wall - 7C is patent WO 2005/066115 A2, synthesised to order, no CAS
  number - is real but is NOT the reason. What survives is R261's reframe: CD2665 largely rescued
  LDE225-induced shortening, making it a plate-protective adjunct against a drug that is closing the
  plate - and it has no place in this stack, because the drug it protects against is a Smoothened
  antagonist, which this file already contraindicates outright and whose opposite the SAG programme
  proposes.

quantitative:
  - parameter: RAR subtype abundance and cartilage enrichment in the purity-corrected human growth plate
    value: RARG 51.9 CPM ratio 1.08; RARA 12.9 ratio 0.42; RARB 15.3 ratio 0.31
    unit: CPM and pure/contaminated ratio
    species: human
    source_ref: koyama2021
    note: >
      Male-only split of GSE288028 (9 male samples, 4 purest vs 4 most blood-contaminated), calibrators
      COL2A1 7.30, ACAN 2.78, PTPRC 0.04. RARgamma is the plate's RAR - 3 to 4 times the abundance of
      the other two and the only one that is not contaminant-leaning. Reproduces R347's independent
      computation on a different split, so two computations agree.
  - parameter: Retinoid handling in the human growth plate - clearance versus synthesis
    value: CYP26A1 47.9x; CRABP2 7.6x; CRABP1 4.3x; ALDH1A2 0.02x; ALDH1A1 0.31x; STRA6 0.4 CPM
    unit: pure/contaminated enrichment ratio
    species: human
    source_ref: uchibe2017
    note: >
      The chondrocyte's entire retinoid investment is in clearance and sequestration, not synthesis.
      CYP26A1 at 47.9-fold is among the most cartilage-specific genes in the panel while the two
      synthesising aldehyde dehydrogenases are contamination. Corroborates uchibe2017's report that
      ablating Cyp26b1 - raising retinoid tone - markedly REDUCED growth-plate proliferation: the plate
      defends a low-retinoid set point and that defence is load-bearing.
  - parameter: Members of the retinoid panel reaching the 207-gene human height burden table
    value: 1 of 17 (CYP26B1 only)
    unit: genes
    species: human
    source_ref: le2019a
    note: >
      RARA, RARB, RARG, RXRA, RXRB, RXRG, CYP26A1, RBP4, STRA6, CRABP1, CRABP2, NCOR1, NCOR2, SOX9,
      ALDH1A1 and ALDH1A2 are all absent. The human genetics therefore cannot split by receptor
      subtype, which is what the reframe required. CYP26B1's best-powered row is pLoF plus
      deleterious missense at AAF under 0.5 per cent, +0.808 cm, P=1.03e-11, 3,502 carriers,
      constrained, OMIM non-height.
  - parameter: Tibia length under the RARgamma antagonist alone in normal mice
    value: essentially unaffected; regimen dropped for paucity of response
    unit: caliper and whole-body radiograph
    species: mouse
    source_ref: koyama2021
    note: >
      CD2665 1.5 mg/kg daily by gavage P20 to P31 against vehicle, with LDE225 and combination arms.
      Body length, body weight and tibia length all null. The same mice showed delayed chondrocyte
      maturation, increased overall growth-plate height and expanded Col II and Col X zones - so the
      drug reached the plate and changed it. Expansion without flux, with the length endpoint present.
  - parameter: BMP-Smad state of the RARgamma-null growth plate
    value: broadened pSmad1/5/8 expression versus wild type
    unit: immunostaining, qualitative
    species: mouse
    source_ref: uchibe2017
    note: >
      Answers whether the BMP/SMAD stimulation reported for 7C and CD2665 occurs in the plate or only
      in the osteogenic and MSC compartments where tateiwa2022 measured it. It occurs in the plate,
      genetically, so the conflict with the BMP-Smad-low root-cell programme is real. This is the
      arm's mechanistic kill and it was already in a paper the file holds.
  - parameter: Nodes carrying a length endpoint and a signed direction that CLAUDE.md never names
    value: 470 with an endpoint; 430 not named; 154 with zero of their refs named
    unit: nodes
    species: not_applicable
    source_ref: koyama2021
    note: >
      Output of atlas/tools/ledger_coverage_sweep.py. It reproduces this round's finding mechanically
      at rank 5 - round258 at 0 of 8 refs, missing janesick2014, williams2009, koyama2021 and
      matsuoka2025. FALSE-POSITIVE MODE, stated so the list is not misread: a well-covered CONCEPT
      with uncovered PRIMARY CITATIONS ranks high, and fgfr3_receptor tops the list at 0 of 10 refs
      while the ledger names FGFR3 on nearly every page. A triage queue, not a verdict.

localization: >
  RARgamma is the growth plate's retinoic acid receptor in human tissue; RARalpha and RARbeta are
  contaminant-leaning and are not chondrocyte genes. The retinoid-clearance apparatus (CYP26A1,
  CRABP1, CRABP2) is strongly cartilage-enriched while the synthetic apparatus is not present.

human_evidence: indirect
human_evidence_note: >
  The expression and burden analyses are human. The decisive length endpoint is mouse
  (koyama2021), the BMP-Smad growth-plate result is mouse (uchibe2017), and no RARgamma-selective
  antagonist has ever been given to a human. The two grade-A human retinoid results that exist -
  isotretinoin and palovarotene causing premature physeal closure - are in the agonist direction and
  bound the axis rather than supporting the antagonist.

species_basis:
  - human
  - mouse

confidence: B

translation_risk: high
translation_risk_reason: >
  The arm's only length test is an eleven-day mouse experiment with a compound (CD2665) that le2019a
  showed is not RARgamma-selective, and the better compound (7C) has never been given to a normal
  growing animal at all. The human contribution here is expression and population genetics, neither
  of which is a length endpoint.

