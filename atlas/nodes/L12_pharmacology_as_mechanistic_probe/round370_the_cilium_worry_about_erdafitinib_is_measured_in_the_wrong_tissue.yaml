contradicts:
- DE-ESCALATES R362 AND R363, which called this the most actionable consequence and the most urgent experiment
  in the file. The result they built on was measured in three tissues that do not grow bone, and the only
  cartilage measurement runs the opposite way.
- QUALIFIES R366's UPGRADE OF THE RAPALOG CONTRAINDICATION. martin2018 reports rapamycin rescuing cilium
  length and IFT20 trafficking in FGFR3-overactive chondrocytes, so mTOR inhibition is not uniformly harmful
  at the cilium even though Raptor ablation depletes resting-zone clones. Both results are real and neither is
  in a normal animal.
- DOES NOT CLOSE THE GATE. No FGFR inhibitor has been given to a normal growing animal with growth-plate
  cilium length, Gli output and bone length measured together, in any species.
