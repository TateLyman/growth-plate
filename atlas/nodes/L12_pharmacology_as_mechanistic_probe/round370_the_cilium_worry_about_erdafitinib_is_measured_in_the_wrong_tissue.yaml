id: round370_the_cilium_worry_about_erdafitinib_is_measured_in_the_wrong_tissue
name: Round 370 - the standing worry that an FGFR inhibitor shortens cilia and therefore costs this subject
  hedgehog is measured in BILIARY DUCT, KIDNEY AND LUNG, and the only measurement ever made in CARTILAGE runs
  the OPPOSITE way - PD173074 RESCUED cilium length and IFT20 trafficking in chondrocytes. The gate stays
  open, but it is no longer the most urgent experiment in the file
aliases:
- does erdafitinib cost us hedgehog
- FGFR inhibitor cilium length cartilage
- R294 gate reconsidered
- IFT20 trafficking chondrocyte
type: hypothesis
layer: L12
stub: false
summary: 'R362 called this the most actionable consequence in the file and R363 called R294 gate the most
  urgent experiment in it. The chain was: hedgehog to the resting zone is REQUIRED to prevent fusion; ALL
  hedgehog transduction happens inside the primary cilium; FGFR signalling sets cilium length; and in NORMAL
  mice systemic AZD4547 for 28 days gave SIGNIFICANTLY SHORTER CILIA at P<0.001 in all three tissues tested.
  The subject is a wild-type-FGFR3 male on a pan-FGFR inhibitor, continuously. This round checked the tissues.

  ⛔ ONE - THE WORRYING RESULT IS NOT IN CARTILAGE, AND THIS ATLAS OWN BIBLIOGRAPHY ENTRY ALREADY SAID SO IN
  ITS LAST LINE. kunovabosakova2018 measured cilium length under AZD4547 in BILIARY DUCT, KIDNEY PROXIMAL
  TUBULE AND LUNG BRONCHUS. Not growth plate, not cartilage, not chondrocytes. The sentence "cilia data are
  biliary/kidney/lung, NOT cartilage" has been sitting in the record since 2026-08-12 and three rounds built
  an urgent gate on top of the result without weighting it.

  ⭐⭐ TWO - AND THE ONLY CARTILAGE MEASUREMENT THAT EXISTS RUNS THE OTHER WAY. martin2018, in chondrocytes
  from HUMAN achondroplasia and thanatophoric dysplasia cartilage and from Fgfr3-Y367C/+ mice: constitutively
  active FGFR3 PERTURBED primary cilium length and disrupted sorting and trafficking of IFT20 to the cilium -
  and INHIBITING FGFR3 WITH THE FGFR INHIBITOR PD173074 RESCUED BOTH. So in the one tissue that matters, an
  FGFR inhibitor LENGTHENED cilia rather than shortening them. The authors conclude that FGFR3-related
  dwarfisms may be a novel class of skeletal disorders with defective ciliogenesis.

  ⚠ THREE - CORR-203 APPLIES IN FULL AND IS WHY THIS DE-ESCALATES RATHER THAN CLOSES. martin2018 is
  RESTORATION in a gain-of-function model. A rescue of a disrupted cilium in an FGFR3-overactive chondrocyte
  says nothing directly about what an FGFR inhibitor does to a cilium in a chondrocyte with normal FGFR3, and
  the subject is wild type. What it does establish is that the FGFR3-cilium relationship in CARTILAGE has been
  measured, that FGFR inhibition moves it, and that the direction in cartilage is the opposite of the
  direction in bile duct, kidney and lung. TWO TISSUES, TWO SIGNS, AND THE RELEVANT ONE IS FAVOURABLE.

  ⭐ FOUR - THE NET POSITION, STATED PLAINLY BECAUSE THREE ROUNDS OVERSTATED IT. The prediction that
  erdafitinib is attenuating the one signal shown to keep a growth plate open rests on (a) a biphasic
  relationship in which SUSTAINED FGF activation shortens cilia while TRANSIENT or PHYSIOLOGIC activation
  lengthens them, (b) an inhibitor result in three non-cartilage tissues, and (c) an opposite-signed inhibitor
  result in cartilage under a deficit. It is not established, it was never established, and the only
  tissue-appropriate evidence is reassuring. IT REMAINS UNMEASURED - nobody has given an FGFR inhibitor to a
  NORMAL growing animal and measured growth-plate cilium length, Gli1 and Ptch1, and bone length together -
  and that experiment is still worth running. It is no longer an alarm.

  ⚠ FIVE - AND A SECOND FINDING IN THE SAME PAPER THAT CUTS AGAINST R366. martin2018 reports that RAPAMYCIN
  also rescued cilium length and IFT20 trafficking. R366 upgraded the rapalog contraindication from a rate
  argument to a POOL argument on the strength of Raptor ablation enhancing resting-zone clone loss. Both can
  be true - mTOR inhibition may restore ciliary architecture in an FGFR3-overactive chondrocyte while
  depleting the stem-cell pool in a normal one - but the contraindication is now less one-sided than R366
  wrote it, and the rescue is again CORR-203.

  ⛔ SIX - EPICATECHIN WAS ALREADY HERE AND THE DUPLICATE CHECK CAUGHT IT BEFORE I WROTE IT. martin2022,
  Theobroma cacao (-)-epicatechin rescuing ciliogenesis and increasing bone elongation in Fgfr3-Y367C/+ mice,
  has been in this bibliography since 2026-08-12 with a FULLER one-line finding than the one I drafted. Its
  two standing objections are unchanged and both are disqualifying for an ADDITION: CORR-203, since it is a
  gain-of-function rescue; and STEP 0, since epicatechin acts by inhibiting FGFR3 downstream signalling, which
  is precisely the arm erdafitinib already occupies - a SUBSTITUTION under CORR-297, not an addition. The
  in vivo route was subcutaneous injection, not diet.'
quantitative:
- parameter: THE ONLY CARTILAGE MEASUREMENT OF AN FGFR INHIBITOR ON CILIUM LENGTH, AND IT IS A RESCUE
  value: 'In chondrocytes from human achondroplasia and thanatophoric dysplasia cartilage and from
    Fgfr3-Y367C/+ mouse cartilage, constitutively active FGFR3 perturbed primary cilium LENGTH and disrupted
    the SORTING AND TRAFFICKING OF IFT20 to the primary cilium. Inhibiting FGFR3 with the FGFR inhibitor
    PD173074 RESCUED BOTH cilium length and IFT20 trafficking. Inhibition of mTOR with RAPAMYCIN ALSO RESCUED
    both.'
  unit: qualitative with direction
  conditions: martin2018, abstract read 2026-08-13. Human ACH and TD chondrocytes plus Fgfr3-Y367C/+ mouse
    cartilage.
  species: multiple
  source_ref: martin2018
  uncertainty: 'CORR-203 IS THE WHOLE CAVEAT AND IT IS NOT A SMALL ONE. This is restoration of a disrupted
    cilium in an FGFR3-OVERACTIVE chondrocyte, so it is a claim about the deficit rather than about a normal
    cell. No cilium length was measured in a WILD-TYPE chondrocyte under an FGFR inhibitor in this paper or
    any other. No numeric cilium lengths are given in the abstract. What survives without depending on
    CORR-203 is the TISSUE point: the FGFR-cilium relationship has been measured in cartilage, an FGFR
    inhibitor moves it, and the direction there is opposite to the direction reported in bile duct, kidney and
    lung.'
- parameter: THE TISSUE MISMATCH IN THE STANDING WORRY
  value: 'kunovabosakova2018 measured cilium length in normal mice given systemic AZD4547 for 28 days and
    found significantly shorter cilia at P<0.001 in ALL THREE tissues examined - BILIARY DUCT, KIDNEY PROXIMAL
    TUBULE and LUNG BRONCHUS. No cartilage or growth-plate cilium measurement was made under the inhibitor.
    martin2018 measured cartilage and found FGFR inhibition RESCUED cilium length. So the unfavourable result
    is in three tissues that do not grow bone and the favourable result is in the tissue that does.'
  unit: qualitative - tissue attribution
  conditions: Cross-comparison performed by this atlas 2026-08-13 between the kunovabosakova2018 record, whose
    own final line already noted the tissue limitation, and martin2018.
  species: mouse
  source_ref: kunovabosakova2018
  atlas_derived: true
  uncertainty: 'A TISSUE MISMATCH WEAKENS AN INFERENCE; IT DOES NOT REVERSE ONE. Cilia are broadly similar
    organelles and a systemic drug effect seen in three independent epithelia is not obviously irrelevant to a
    fourth tissue. The favourable cartilage result is a deficit rescue. So the correct conclusion is that the
    worry is UNSUPPORTED IN THE RELEVANT TISSUE rather than refuted, and that the experiment remains unrun.'
localization:
- the chondrocyte primary cilium, where all hedgehog transduction occurs and where IFT20 trafficking was
  measured
human_evidence: indirect
human_evidence_note: 'martin2018 used chondrocytes from HUMAN achondroplasia and thanatophoric dysplasia
  cartilage, so the FGFR3-cilium-IFT20 defect is established in human tissue - but the inhibitor rescue is a
  gain-of-function correction and no human has had growth-plate cilium length measured on an FGFR inhibitor.
  The subject relevance is that he is WILD-TYPE FGFR3 on a pan-FGFR inhibitor, a configuration no study here
  reproduces.'
species_basis:
- human
- mouse
translation_risk: moderate
translation_risk_reason: 'This round DE-ESCALATES a worry rather than proposing an action, so the risk is of
  false reassurance. The reassuring evidence is a deficit rescue and the worrying evidence is in the wrong
  tissue; neither is the experiment. Nothing here should be read as showing an FGFR inhibitor is safe for the
  cilium in a normal growth plate.'
confidence: C
claim_grades:
- claim: An FGFR inhibitor shortens cilia in the growth plate and is therefore costing this subject hedgehog.
  grade: D
  basis: 'DOWNGRADED FROM THE ALARM THREE ROUNDS GAVE IT. The AZD4547 result was measured in BILIARY DUCT,
    KIDNEY PROXIMAL TUBULE and LUNG BRONCHUS - not cartilage - and this atlas own bibliography entry recorded
    that limitation from the day it was added. The only cartilage measurement, martin2018, finds an FGFR
    inhibitor RESCUING cilium length and IFT20 trafficking. Kept at D rather than X because that rescue is
    CORR-203 territory and the biphasic relationship kunovabosakova2018 describes is real.'
- claim: In cartilage, FGFR inhibition lengthens rather than shortens the primary cilium.
  grade: D
  basis: 'martin2018 shows PD173074 rescuing both cilium length and IFT20 trafficking in human ACH and TD
    chondrocytes and Fgfr3-Y367C/+ mouse cartilage. Grade D and no higher because it is a gain-of-function
    rescue, gives no numeric lengths in the abstract, and says nothing directly about a wild-type chondrocyte.'
- claim: The cilium gate is the most urgent experiment in this file.
  grade: X
  basis: 'WITHDRAWN. It was called that in R362 and R363 on the strength of a result measured in three
    non-cartilage tissues, while the tissue-appropriate evidence points the other way. The experiment - an
    FGFR inhibitor given to a NORMAL growing animal with growth-plate cilium length, Gli1, Ptch1 and bone
    length measured together - is still unrun and still worth running. It is not an emergency.'
- claim: Cocoa or epicatechin should be added.
  grade: X
  basis: 'NO, on two independent grounds already recorded in martin2022 own atlas entry: CORR-203, because the
    bone-elongation result is rescue of an FGFR3 gain-of-function dwarfism; and STEP 0 under CORR-297, because
    epicatechin acts by inhibiting FGFR3 downstream signalling, which is the arm erdafitinib already occupies.
    The in vivo route was subcutaneous injection rather than diet.'
