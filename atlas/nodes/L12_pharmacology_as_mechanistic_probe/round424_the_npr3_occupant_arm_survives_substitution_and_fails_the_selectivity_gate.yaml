  - parameter: the constraint asymmetry, full burden rows
    value: >-
      NPR3 constrained=0, pLoF+deleterious missense <0.5% +1.910 cm at P=1.42e-61 (3,727 carriers), all
      missense +0.942 at P=3.76e-55 (14,092); NPR2 constrained=1 and an OMIM height gene,
      pLoF+deleterious missense <0.1% -2.750 cm at P=5.88e-96 (2,835), deleterious missense <0.01% -2.820
    unit: cm per allele
    species: human
    source_ref: kosmicki2026
    value_unverified: true
    note: >-
      the downside per unit of NPR2 engagement exceeds the upside per unit of NPR3 engagement, in one
      dataset and one unit. That is why selectivity is the gate. CLAUDE.md quoted only pLoF +2.35 cm at 224
      carriers, understating the carrier base about 63-fold and omitting the constraint flags entirely
  - parameter: NPR3 versus NPR2 in the postnatal human growth plate, purity-corrected
    value: >-
      NPR3 2.62 CPM at purity ratio 1.42; NPR2 13.01 CPM at ratio 2.90; NPPC 0.09 at 0.18; MME 2.69 at
      0.17; calibrators ACAN 4.65, COL2A1 8.92, IHH 72.45, AGTR1 0.03
    unit: CPM and purity ratio
    species: human
    source_ref: kosmicki2026
    value_unverified: true
    note: >-
      NPR3 is present but NOT chondrocyte-enriched and is fivefold below the signalling receptor, which
      grades down the inference that the 59.2 percent trunk coordinate reports where a drug would act
  - parameter: selectivity of the two candidate occupants, and the receptor that is missing
    value: >-
      compound 23 hNPR3 IC50 0.079 nM versus hNPR1 >1000 nM (>12,600-fold), serum residual 107 percent at
      2 h; cANF(4-23) hNPR3 0.51 nM with 4.0 percent serum residual at 30 min. NPR2 SELECTIVITY IS NOT
      REPORTED FOR EITHER
    unit: nM
    species: in_vitro_human_cell
    source_ref: nishizawa2017
    value_unverified: true
    note: >-
      the reported selectivity is over NPR1, the ANP receptor. NPR2 is the CNP receptor and the one that
      matters, and the number does not exist
  - parameter: the aortic liability runs backwards for an occupant that signals
    value: >-
      cANF(4-23) 0.4 mg/kg/day by osmotic pump for 28 days significantly REDUCED ascending and abdominal
      aortic expansion in wild-type mice; the antagonist M372049 ABOLISHED CNP's protection in human aortic
      smooth muscle cells; NPR-C-null mice have elongated stature AND a dilated ascending aorta at baseline
    unit: qualitative
    species: multiple
    source_ref: aubdool2025
    value_unverified: true
    note: >-
      genetic loss gives both phenotypes, but the pharmacological agonist protects. This is the reason the
      spec is an occupant that signals rather than an antagonist
localization: >-
  NPR3 is present but not enriched in the postnatal human growth plate (2.62 CPM, ratio 1.42) and its
  zone assignment is probe-inconsistent within a donor in GSE9160; NPR2 is enriched and PZ/PHZ-peaked
human_evidence: direct
human_evidence_note: >-
  The burden effects, the constraint flags and the tissue expression are human. The compound
  pharmacology, the aortic result and the loading mechanism are mouse or recombinant.
species_basis:
  - human
  - mouse
translation_risk: high
translation_risk_reason: >-
  No pharmacological bone-length endpoint in any species, and the deciding selectivity number does not
  exist for either candidate.
confidence: C
claim_grades:
  - claim: NPR3 occupancy is the same step as sacubitril and is therefore a substitution
    grade: E
    basis: >-
      NOT ESTABLISHED EITHER WAY. hakata2024's non-additivity is about sacubitril, whose target is
      contaminant-leaning locally; nishizawa2017's additive result pairs an NPR3 blocker with an NPR1
      ligand and reads blood cGMP, which is a different pairing and a different endpoint
  - claim: Human NPR3 loss is tolerated and raises height while NPR2 loss is constrained and lowers it
    grade: A
    basis: >-
      35 rows each in the same burden table, NPR3 constrained=0 at +1.910 cm P=1.42e-61, NPR2
      constrained=1 at -2.750 cm P=5.88e-96
  - claim: Selectivity over NPR2 is the gate, and neither candidate has the number
    grade: A
    basis: >-
      both report selectivity over NPR1; NPR2 is not reported for either, and the NPR2 downside exceeds
      the NPR3 upside in the same units
  - claim: The 59.2 percent trunk coordinate reports where an NPR3 drug would act
    grade: D
    basis: >-
      graded down. NPR3 is not chondrocyte-enriched, so the coordinate is most likely systemic, and it
      disagrees with NPR2's 29.8 percent despite acting through it
  - claim: The arm has a pharmacological bone-length endpoint
    grade: X
    basis: >-
      NO. watanabetakano2021 is a LOADING model. No NPR-C ligand has a bone endpoint in any species, which
      is R151's leading objection and it has not moved
  - claim: Periosteal and muscular loading is an endogenous NPR3 intervention
    grade: C
    basis: >-
      watanabetakano2021's own mechanism - load raises periosteal osteoblast OSTN, which occupies NPR3 and
      spares local CNP. Mouse, and the atlas has never joined the two halves or drawn a serum osteocrin
