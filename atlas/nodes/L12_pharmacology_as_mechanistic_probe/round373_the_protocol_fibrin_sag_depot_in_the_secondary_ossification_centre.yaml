id: round373_the_protocol_fibrin_sag_depot_in_the_secondary_ossification_centre
name: Round 373 - THE PROTOCOL. Compound, vehicle, site, dose, schedule and monitoring, assembled from
  components that all exist - SAG in FDA-approved fibrin sealant, placed in the distal femoral secondary
  ossification centre at 0.5-1 mg per depot, once. The burst-release profile of the vehicle is what SELECTS
  the compound, and the one real blocker is that SAG is research-grade rather than GMP
aliases:
- the protocol
- how do we actually do this
- fibrin SAG depot secondary ossification centre
- SMO agonist delivery dose schedule
- what blocks it
type: hypothesis
layer: L12
stub: false
summary: 'R372 established that a dosable agonist exists and costed it. This round assembles the actual
  protocol from parts that all already exist, and identifies which single thing blocks it.

  ⭐⭐⭐ ONE - THE VEHICLE EXISTS, HAS A SMO AGONIST IN IT ALREADY, AND IS AN FDA-APPROVED MATERIAL.
  he2024sag loaded SAG21k into FIBRIN HYDROGEL - the fibrinogen/thrombin sealant sold as Tisseel and Evicel,
  approved by FDA as a haemostat and, in Tisseel case, INDICATED IN PAEDIATRIC PATIENTS OVER ONE MONTH OF AGE.
  It is supplied in a dual-barrel syringe and sets in 10-30 seconds, so it stays where it is placed. Loading
  3.48 mM in 300 uL; in vivo 30 uL at 30, 100 and 1000 uM; binding to fibrinogen at about two sites by
  hydrophobic forces and hydrogen bonds, Ka 3.85e3 /M at 26.6 C falling to 9.06e2 /M at 37 C. Release is
  TRIPHASIC over 200 hours and only 14.2 per cent of the payload has left the gel by day 8, so it is a
  LONG-LIVED RESERVOIR.
  ⭐ AND THE SAFETY RESULT THAT MAKES THE WHOLE APPROACH VIABLE: Gli1 in MAJOR ORGANS at 7 days showed NO
  significant systemic pathway activation after the local fibrin depot, against ROBUST activation in multiple
  Hh-responsive organs after systemic intraperitoneal dosing. A DIRECT HEAD-TO-HEAD. Since the principal
  hazard of hedgehog agonism is systemic - basal cell carcinoma and medulloblastoma - a vehicle that
  demonstrably confines activation to the treated site is not a convenience, it is the safety argument.

  ⭐⭐⭐ TWO - AND THE VEHICLE RELEASE PROFILE SELECTS THE COMPOUND, WHICH I DID NOT EXPECT. R372 ranked the
  approved steroids well: clobetasol propionate has the best Gli potency of any agonist (0.2 nM) and a
  3.3-7.3x window over the glucocorticoid receptor. BUT he2024sag release is triphasic WITH AN INITIAL BURST
  AT 0-2 HOURS. A burst that overshoots by more than three to sevenfold puts a steroid straight into GR
  territory AT THE GROWTH PLATE, and local glucocorticoid-receptor activation suppresses longitudinal growth.
  SAG HAS NO COUNTER-TARGET, SO BURST RELEASE IS HARMLESS FOR IT. → THE NARROW WINDOW THAT MADE CLOBETASOL
  ATTRACTIVE SYSTEMICALLY MAKES IT UNSUITABLE FOR THIS VEHICLE, AND THE COMPOUND IS SAG.

  ⭐⭐ THREE - THE DOSE, WHICH THREE INDEPENDENT ROUTES AGREE ON. Using he2024sag own in vivo concentration
  range of 100-1000 uM in the gel, and a depot of 1-2 mL: 0.05 to 0.98 mg SAG, i.e. ROUGHLY HALF A MILLIGRAM
  TO ONE MILLIGRAM PER DEPOT. For comparison he2024sag own in vivo gel held 0.51 mg; R372 geometry
  calculation said 26 micrograms holds a whole human epiphysis at 100 times the EC50; and the trompet2024 rat
  bead that produced the length gain held 7 micrograms. A half-milligram depot from which 14 per cent elutes
  in the first week is therefore a large reservoir against a nanomolar target - which is what is wanted,
  because the requirement is to SUSTAIN a concentration against clearance rather than to deliver a bolus.

  ⭐ FOUR - THE SITE AND THE ROUTE. The site is the DISTAL FEMORAL SECONDARY OSSIFICATION CENTRE, which is
  exactly where trompet2024 placed the bead that produced femur plus 3.63 per cent at six months with the
  effect still widening, and which its authors describe as stable, relatively large and EASILY ACCESSIBLE IN
  HUMANS. The route is a PERCUTANEOUS FLUOROSCOPICALLY GUIDED INTRAOSSEOUS PLACEMENT rather than an open
  operation: intraosseous access is a routine paediatric emergency procedure, retrograde epiphyseal drilling
  for osteochondritis dissecans is standard adolescent orthopaedics, and an immature large-animal study
  injected 5 mL intraosseously into a growing femoral head with radiographic follow-up. The proximal tibia is
  the natural second site, since together they are the fastest-growing plates in the body.

  ⭐ FIVE - THE SCHEDULE IS A SINGLE PULSE, AND THAT IS A CONCLUSION RATHER THAN A CONVENIENCE. orikasa2024
  showed that PERMANENT cell-autonomous hedgehog activation expands the clone and then converts it to
  trabecular bone with NO final length gain. trompet2024 bead signal was GONE BY THREE WEEKS and produced a
  gain still widening at six months. he2024sag own sequencing companion result and trompet2024 both show
  compensatory downregulation of the pathway under sustained agonist. → PLACE ONE DEPOT, LET IT ELUTE, AND
  REASSESS. Do not maintain.

  ⛔⛔ SIX - AND THE ONE THING THAT ACTUALLY BLOCKS IT, STATED PLAINLY: SAG IS RESEARCH-GRADE, NOT GMP. It is
  sold for laboratory research use only at 98 per cent or greater HPLC purity, which permits two per cent of
  uncharacterised material, with no impurity qualification, no endotoxin specification and no sterility
  assurance. THAT IS TOLERABLE IN A CELL CULTURE AND IS NOT TOLERABLE IMPLANTED INTO BONE. Every other
  component of this protocol is either approved (the fibrin sealant), routine (the placement), or computed
  from published data (the dose). THE GAP IS PHARMACEUTICAL-GRADE MATERIAL, AND IT IS A MANUFACTURING
  PROBLEM RATHER THAN A SCIENTIFIC ONE - custom GMP synthesis of a 490 Da small molecule with a published
  route is an ordinary contract-manufacturing job.'
quantitative:
- parameter: THE VEHICLE - FDA-APPROVED FIBRIN SEALANT ALREADY CARRIES A SMO AGONIST WITH NO SYSTEMIC
    ACTIVATION
  value: 'SAG21k loaded into fibrin hydrogel at 3.48 mM in 300 microlitres, i.e. 0.51 mg. In vivo 30
    microlitres applied to the injury site at 30, 100 and 1000 micromolar. Binding to fibrinogen at
    approximately two sites (n = 1.5-1.8) by hydrophobic forces and hydrogen bonds, association constant
    3.85e3 per M at 299.75 K falling to 9.06e2 per M at 310.15 K. Release TRIPHASIC over 200 hours - burst at
    0-2 h, slow diffusion 2-7 h releasing 3 micromolar or 8.1 per cent of total, then gel erosion 8-200 h
    reaching a cumulative 5 micromolar or 14.2 per cent of total; second-order kinetics with k = 2.389e-3 and
    1.350e-4 per micromolar per hour.
    SAFETY: Gli1 expression in major organs at 7 days showed NO significant systemic pathway activation after
    the local fibrin depot, against ROBUST Hh pathway activation in multiple Hh-responsive organs after
    systemic intraperitoneal dosing.
    MATERIAL STATUS: fibrin gel formulations are FDA-approved as haemostatic agents and commonly used
    off-label to reinforce nerve repairs; Tisseel is indicated in adult AND PAEDIATRIC patients over one month
    of age, supplied in a dual-barrel syringe, clotting in 10-30 seconds.'
  unit: millimolar and micromolar loading; per cent released; association constant
  conditions: he2024sag, full text read 2026-08-13 (PMC11774140). Mouse facial nerve injury model. Product
    status from the approved labelling.
  species: mouse
  source_ref: he2024sag
  uncertainty: 'THE MODEL IS A FACIAL NERVE AND THERE IS NO BONE, CARTILAGE OR GROWTH-PLATE WORK IN THIS PAPER
    AT ALL. Release kinetics were measured in vitro and fibrin is cleared in vivo by fibrinolysis, which is
    tissue-dependent and would differ inside bone - the 200-hour profile is therefore indicative, not
    predictive of an intraosseous depot. The compound is SAG21k rather than SAG, same chemotype but a
    different molecule with a different logP. And the absence of systemic Gli1 activation was assessed at a
    single timepoint, 7 days, at doses applied to a nerve rather than into a vascular bone compartment.'
- parameter: THE RELEASE PROFILE SELECTS THE COMPOUND - WHY NOT THE APPROVED STEROID
  value: 'Clobetasol propionate has the best Gli potency of any known SMO agonist at 0.2 nM but a window over
    the glucocorticoid receptor of only 3.3-fold (best GR 0.662 nM) to 7.3-fold (median GR 1.456 nM).
    he2024sag release from fibrin is triphasic WITH AN INITIAL BURST PHASE AT 0-2 HOURS. A burst overshooting
    by more than three to sevenfold therefore places a steroid above its GR potency at the growth plate, and
    local glucocorticoid receptor activation suppresses longitudinal growth. SAG has NO counter-target, so
    the same burst is pharmacologically inert for it.'
  unit: fold window against release-profile overshoot
  conditions: Composed by this atlas 2026-08-13 from the he2024sag release profile and the R372 window
    calculation.
  species: not_applicable
  source_ref: he2024sag
  atlas_derived: true
  uncertainty: 'THIS IS AN ARGUMENT, NOT A MEASUREMENT, AND IT ASSUMES THE BURST MAGNITUDE MATTERS AT THE
    TISSUE. The burst was characterised in vitro into a large sink; inside bone, local concentration during a
    burst depends on clearance and could be higher or lower than the in vitro profile implies. The window
    figures themselves compare a functional Gli EC50 with a GR binding constant across laboratories, which
    R372 already flagged as not apples-to-apples. What is robust is the DIRECTION - a compound with a
    counter-target three to sevenfold away is a poor match for a burst-release vehicle, and one with no
    counter-target is a good match.'
- parameter: THE DEPOT DOSE, WITH THREE INDEPENDENT CROSS-CHECKS
  value: 'At the he2024sag in vivo concentration range in a 1-2 mL depot: 100 micromolar gives 0.049-0.098
    mg; 300 micromolar gives 0.147-0.294 mg; 1000 micromolar gives 0.490-0.980 mg SAG.
    CROSS-CHECKS: he2024sag own in vivo gel held 0.51 mg. The R372 geometry calculation put 26 micrograms as
    the mass needed to hold a whole human distal femoral epiphysis at 100 times the EC50. The trompet2024 rat
    bead that produced femur plus 3.63 per cent held 7 micrograms. A 0.5 mg depot releasing 14 per cent in
    the first week delivers of order 70 micrograms in that week against a 3 nM target.'
  unit: milligrams per depot
  conditions: Computed 2026-08-13 from the he2024sag loading range and R372 geometry.
  species: not_applicable
  source_ref: he2024sag
  atlas_derived: true
  uncertainty: 'THE DOSE IS BOUNDED, NOT DETERMINED. It is bounded BELOW by the concentration needed to
    exceed the EC50 across the epiphysis against clearance, and ABOVE by nothing that has been measured -
    there is no toxicity ceiling for local hedgehog activation in bone in any species. Epiphyseal clearance
    has never been measured for any SMO agonist, so the release rate cannot be matched to it, and the
    in vitro release profile will not transfer unchanged to an intraosseous site. The three cross-checks agree
    on ORDER OF MAGNITUDE only.'
- parameter: THE SITE, THE ROUTE AND THE PROCEDURAL PRECEDENTS
  value: 'SITE - the distal femoral secondary ossification centre, the exact placement in trompet2024 that
    produced femur plus 2.75, 2.64 and 3.63 per cent at 1, 2 and 6 months with the effect widening, whole leg
    plus 1.06, 1.09 and 1.65 per cent, 6/6, 9/9 and 8/8 animals, and no osteoarthritis at six months. The
    authors describe the bony epiphysis as stable, relatively large and easily accessible in humans, and note
    that dissolvable slow-release beads which could extend treatment beyond their three weeks are already
    available.
    ROUTE - percutaneous fluoroscopically guided intraosseous placement. Precedents for accessing this
    compartment: intraosseous vascular access is a routine paediatric emergency procedure; retrograde
    epiphyseal drilling for osteochondritis dissecans is standard adolescent orthopaedic practice; and an
    immature pig study delivered a 5 mL intraosseous injection into a growing femoral head with monthly
    radiographic follow-up.'
  unit: qualitative - anatomical site and procedural precedent
  conditions: trompet2024 for the site and effect; procedural precedents from established practice and from
    an immature large-animal study.
  species: multiple
  source_ref: trompet2024
  uncertainty: 'NO ONE HAS EVER PLACED A DRUG DEPOT IN A HUMAN SECONDARY OSSIFICATION CENTRE FOR THIS OR ANY
    OTHER PURPOSE. The procedural precedents establish that the compartment can be reached with a needle;
    they do not establish that a depot placed there is safe or that it distributes as intended. The
    trompet2024 result is a rat with a far more active growth plate than a human at bone age 16, and its
    percentage gain applies to the growth that remains rather than to standing height.'
localization:
- the distal femoral and proximal tibial secondary ossification centres, immediately above the resting zone
  which is the target compartment
human_evidence: absent
human_evidence_note: 'Every element of this protocol except the fibrin sealant itself is without human
  experience. No Smoothened agonist has ever been given to a human by any route, there are zero registry
  trials, and no drug depot has ever been placed in a human secondary ossification centre. The fibrin vehicle
  is FDA-approved including in paediatric patients over one month, but only as a haemostat and only without a
  drug payload.'
species_basis:
- mouse
- rat
- pig
translation_risk: high
translation_risk_reason: 'A protocol assembled from components validated separately in three species and
  never combined, delivering a research-grade compound with no human exposure into a compartment no one has
  dosed. The single largest translation risk is that the rat length gain reflects a growth plate far more
  active than a human plate at bone age 16, so the percentage effect applies to a much smaller remaining
  growth base.'
confidence: D
claim_grades:
- claim: A delivery vehicle for a SMO agonist exists, is FDA-approved as a material, and confines pathway
    activation to the treated site.
  grade: C
  basis: 'he2024sag loaded SAG21k into fibrin hydrogel with characterised binding and sustained triphasic
    release, and showed NO significant systemic Gli1 activation in major organs at 7 days against robust
    activation after intraperitoneal dosing. Fibrin sealant is FDA-approved as a haemostat, Tisseel including
    in paediatric patients over one month. Grade C because the model is a facial nerve with no bone or
    cartilage work, release was characterised in vitro, and the systemic assessment was a single timepoint.'
- claim: The compound for this vehicle is SAG rather than an approved corticosteroid.
  grade: C
  basis: 'THE VEHICLE SELECTS IT. Fibrin release is triphasic with an initial burst, and clobetasol window
    over the glucocorticoid receptor is only 3.3-7.3x, so a burst overshoot places the steroid into
    growth-suppressing GR territory at the plate. SAG has no counter-target and is burst-tolerant. Grade C
    because this is a composed argument from an in vitro release profile and a cross-assay window figure, not
    a measurement in tissue.'
- claim: The dose is roughly 0.5 to 1 mg of SAG per depot.
  grade: D
  basis: 'From he2024sag own in vivo range of 100-1000 micromolar in a 1-2 mL depot, cross-checked against its
    own 0.51 mg in vivo gel, against R372 geometry figure of 26 micrograms to hold a whole human epiphysis at
    100x EC50, and against the 7 microgram rat bead that produced the length gain. Grade D - the three agree
    on order of magnitude only, epiphyseal clearance has never been measured, and there is no upper toxicity
    bound for local hedgehog activation in bone in any species.'
- claim: The schedule is a single pulse rather than maintained dosing.
  grade: C
  basis: 'orikasa2024 shows permanent cell-autonomous activation expands the clone and then converts it to
    trabecular bone with NO final length gain; trompet2024 bead signal was gone by three weeks and produced a
    gain still widening at six months; and both trompet2024 and the hedgehog literature record compensatory
    downregulation under sustained agonist. Pulse, then reassess.'
- claim: This protocol can be executed today.
  grade: X
  basis: 'NO, AND THE BLOCKER IS SINGULAR AND NAMED. SAG is sold for laboratory research use only at 98 per
    cent or greater purity, which permits two per cent uncharacterised material, with no impurity
    qualification, no endotoxin specification and no sterility assurance. That is acceptable in cell culture
    and unacceptable implanted into bone. Every other component is approved, routine, or computed. The gap is
    pharmaceutical-grade material - a contract-manufacturing problem for a 490 Da molecule with a published
    synthesis, not a scientific one.'
- claim: The expected gain is about 3.6 per cent of height.
  grade: X
  basis: 'NO - THAT MISREADS THE ENDPOINT. trompet2024 plus 3.63 per cent is femur length in a rat whose plate
    is far more active than a human plate at bone age 16, and any percentage gain is bounded by the growth
    that actually REMAINS at that plate. The mechanism is pool enlargement, so the honest expectation is a
    multiplier on residual knee growth plus whatever period extension a larger pool buys - not a percentage
    of current stature. And the residual at bone age 16 is trunk-dominant, while this depot addresses the
    knee.'
