contradicts:
- SELECTS AGAINST THE APPROVED COMPOUNDS FOR THIS ROUTE, reversing the direction R372 was heading. The
  narrow glucocorticoid window that made clobetasol attractive is incompatible with a burst-release vehicle,
  so the same fact that recommended it systemically disqualifies it locally.
- NARROWS THE BLOCKER FROM SEVERAL TO ONE. R372 listed no GMP, no human PK, no toxicology and a surgical
  requirement. The fibrin vehicle removes the systemic-exposure concern, the procedural precedents remove the
  surgical objection, and the dose is computed - leaving pharmaceutical-grade material as the single gate.
- DOES NOT ESTABLISH THAT IT WORKS. No component of this protocol has been tested in the configuration
  proposed, in any species, and the expected gain is bounded by residual knee growth rather than by the rat
  percentage.
