human_evidence: indirect
human_evidence_note: The resveratrol decision rests on rabbit (karimian2013) with a human pharmacokinetic
  bridge from the same paper. The methylation-clock synthesis is human at its two ends - sarkar2023 built
  the chondrocyte methylation clock on human chondrocytes at r=0.97, and the burden effects (UHRF1 -2.52
  cm, UHRF2 -3.10, TET1 +7.95) are human - but the growth-plate direction itself is rabbit (nilsson2005)
  and mouse (yanagihara2025). The two mechanical items are mouse with contralateral internal controls
  and no human data of any kind.
translation_risk: high
translation_risk_reason: Every length endpoint here is an animal length endpoint. karimian2013 is entirely
  female, one dose level, and significant in two of four bones measured. The warming and lateral-loading
  results are single-laboratory mouse and rat work. What is human is the pharmacokinetic range, the methylation
  clock and the burden effects - none of which is a length measurement.
summary: 'PART ONE - THE RESVERATROL QUESTION, ANSWERED. R431 held resveratrol and named one unresolved
  item: does it inherit R365''s kill of the anti-angiogenic class? IT DOES NOT, and the reason is precise
  rather than rhetorical.


  R365''s kill has exactly TWO premises. (1) Under VEGF blockade PROLIFERATION CONTINUES - gerber1999
  states proliferation, differentiation and maturation were apparently normal while only resorption was
  inhibited. (2) Growth-plate senescence is DIVISION-counted, not time-counted (marino2008). Together
  they give the composed kill: the pool drains at the normal rate while no bone is made, so blockade is
  a PURE LOSS, strictly worse than doing nothing for a pool-limited subject.


  RESVERATROL FAILS PREMISE ONE, AND IT IS MEASURED IN THE SAME PAPER THAT SUPPLIES THE LENGTH GAIN. karimian2013
  reports SIGNIFICANTLY REDUCED BrdU incorporation (p<0.05), proliferative chondrocytes per column 4.5
  +/- 0.6 versus 5.2 +/- 0.9, and proliferative zone height 125 +/- 14 versus 173 +/- 24. Under resveratrol
  the division counter slows with the output. That is the opposite of gerber1999''s configuration, and
  it is the single parameter on which R365''s kill turns.


  AND IT SATISFIES CORR-292''s DISCRIMINATOR, WHICH IS THE ATLAS''S OWN TEST FOR EXACTLY THIS AMBIGUITY.
  Resveratrol MORE THAN DOUBLES the resting-zone area (0.26 +/- 0.05 versus 0.11 +/- 0.02 mm2, p<0.01)
  and raises hypertrophic zone height (95 +/- 5 versus 71 +/- 5). An expanded resting zone is a POOL in
  lui2023 and a JAM in horike2026, and CORR-292 says only the LENGTH endpoint separates them. Here the
  length endpoint is POSITIVE - tibia 111.6 versus 109.5 mm in ovary-intact animals (+1.9%, p<0.05) and
  femur 102.4 versus 100.9 in ovariectomised (+1.5%, p<0.05). R365''s phenotype is a thickened plate with
  NO length gain. This is a thickened plate WITH one. By the file''s own rule that makes it a pool.


  THE ARITHMETIC IS INTERNALLY CONSISTENT, WHICH IS WHAT MAKES THE SMALL NUMBER CREDIBLE RATHER THAN NOISE.
  Proliferative cells per column fall 13 per cent; terminal hypertrophic cell size rises 18 per cent (12.4
  versus 10.5 microns). Fewer cells produced times bigger terminal cells predicts roughly +3 per cent
  on rate. The observed gain is +1.9 per cent. The decomposition and the endpoint agree without being
  fitted to each other.


  AND R431''s OWN REASON FOR HOLDING IT IS WEAKENED BY R360, WHICH R431 DID NOT APPLY. R431 held resveratrol
  because lowering proliferation is gafni2001''s configuration, which R366 prices as a loan repaid rather
  than height banked. But R360 established that once an aromatase inhibitor has turned the terminus from
  a DATE into a BUDGET - Regime 2 - total height from a fixed pool is set by AMPLIFICATION and TERMINAL
  CELL HEIGHT and NOT by throughput, because raising throughput only reaches the terminus sooner. Resveratrol
  LOWERS throughput, which under Regime 2 is close to free, and RAISES h_term, which is the one term that
  adds height without spending a division. That is close to the ideal Regime-2 profile and R431 scored
  it as a cost.


  WHAT IS HONESTLY WRONG WITH IT, UNCHANGED: every animal is FEMALE in both models, there is one dose
  level and no dose-response, and the gain is significant in two of the four bones measured (ovary-intact
  femur p=0.1; ovariectomised tibia no difference and no X-ray effect at any timepoint). The amplification
  term may also fall - fewer proliferative cells per column is a shorter residence before hypertrophic
  commitment, which is R423''s amplification running down. VERDICT: UPGRADED FROM HELD to the best-evidenced
  obtainable agent aimed at closure program (C), the terminal vascular event, which nothing in the stack
  touches. Not promoted to the stack.


  PART TWO - THE BIG SWING, AND THE ATLAS HAD ALREADY WORKED IT. Asked where else large height could come
  from including the dangerous and barely-related end, the honest first move is the grep, and it returns
  three nodes with ZERO ledger presence: epigenetic_age_reset_in_cartilage, the_counter_is_a_leak_not_an_odometer
  and replicative_senescence_chondrocyte. Yamanaka, OSKM, partial reprogramming and epigenetic clock all
  return 0 mentions in CLAUDE.md.


  THE TELOMERE SWING IS DEAD AND WAS KILLED BY A DIRECT TEST. nilsson2005: rabbit resting-zone chondrocytes
  harvested from YOUNG and OLD animals achieved THE SAME NUMBER OF POPULATION DOUBLINGS in culture. The
  in vivo limit is not a cell-autonomous replicative reserve that survives explantation, so it is not
  a Hayflick limit and TERT is not the target. This is a negative result that secondary literature routinely
  re-asserts as positive.


  THE REPROGRAMMING SWING IS REAL, HAS BEEN DONE IN CARTILAGE IN VIVO, AND RUNS BACKWARDS FOR THIS TISSUE.
  sarkar2023 built a DNA-methylation age predictor across human chondrocyte ontogeny at r=0.97, and a
  STAT3 agonist lowered predicted age in 5 of 6 aged donors. osk2026 delivered Oct4/Sox2/Klf4 by AAV into
  mouse cartilage in vivo, lowering predicted methylation age with DNMT3a down and TET2 up, WITH NO DEDIFFERENTIATION
  AND NO TUMOUR - a better safety result than expected. THEN THE POINT OF THE EXERCISE FAILS TWICE. First,
  osk2026 measured proliferation directly and Ki67-positive chondrocytes DID NOT DIFFER between OSK and
  mock, so the link the whole argument needs - epigenetic age to proliferative capacity - is the one link
  nobody has demonstrated. Second and decisively, THE TWO CARTILAGES AGE IN OPPOSITE METHYLATION DIRECTIONS:
  articular cartilage ages by HYPERmethylation and both rejuvenation agents are calibrated on that direction,
  while the growth-plate resting zone ages by LOSING methylation (nilsson2005) and removing maintenance
  methylation REPRODUCES the arrested phenotype (yanagihara2025). An articular-calibrated reprogramming
  agent applied to a growth plate would push it TOWARD its own senescent state. It is not impossible;
  it is backwards.


  AND THAT JOINS TO SOMETHING THE LEDGER ALREADY CARRIES SEPARATELY, WHICH IS THE REAL SYNTHESIS. FOUR
  INDEPENDENT LINES SAY THE GROWTH PLATE''S TERMINUS IS A MAINTENANCE-METHYLATION LEAK AND THAT MORE 5mC
  IS TALLER: nilsson2005 (the clock is progressive loss of methylation in the resting zone, specific to
  SLOW in vivo division - the proliferative zone divides far faster and does NOT tick); yanagihara2025
  (Dnmt1 loss shortens bone, by derepressing energy-metabolism genes); R343''s human burden effects (UHRF1,
  DNMT1''s essential targeting cofactor, -2.52 cm at P=7.1e-08; UHRF2 -3.10 at P=7.4e-17; TET1 +7.95);
  and R276''s closure of DNMT inhibitors. The therapeutic direction is to PLUG THE LEAK - raise maintenance
  methylation in the resting zone - and NO AGENT EXISTS IN THAT DIRECTION, which is R342''s finding that
  the marketed epigenetic pharmacopoeia is an oncology INHIBITOR shelf.


  ONE INFERENCE WORTH RECORDING BECAUSE IT INVERTS A STANDING ASSUMPTION, GRADE E: if the tick rate is
  set by SLOW resting-zone division rather than by division itself - which is Nilsson and Baron''s own
  proposal, complete maintenance methylation in the proliferative zone but not the resting zone - then
  keeping resting-zone cells cycling FASTER might tick LESS per division, which runs opposite to the pool-conservation
  logic the file has been using since R360. Never tested in any species.


  AND THE CEILING, STATED PLAINLY: a targeted query returns NO REPORT, IN ANY SPECIES, OF REOPENING OR
  REACTIVATING A FUSED PHYSIS. That is why distraction osteogenesis exists as the surgical workaround,
  and it is the honest boundary on every duration argument in this file.


  PART THREE - WHAT IS ACTUALLY OPEN, AND BOTH ITEMS ARE NON-DRUG AND FREE. The two largest unworked effects
  in the atlas are mechanical and thermal, both with contralateral internal controls, both in normal animals,
  and neither has ever been tried in a human.

  LATERAL JOINT LOADING (zhang2010knee): 0.5 N transverse oscillation across the mouse knee, 5-minute
  bouts, contralateral limb as control - FEMUR +2.3%, TIBIA +2.3 to +3.7%, all P<0.001, with proximal
  tibial growth-plate height +19.5% AND hypertrophic chondrocyte NUMBER and CELLULAR HEIGHT both up. Compare
  axial loading at 4-17 N for 10 minutes daily, which makes bones 2-4 per cent SHORTER. A human knee-loading
  device has been built THREE times (fitzwater2013, prabhala2016, korupolu2017), each paper closing by
  recommending a clinical study, and in nine years no trial exists. The effective band is 5-20 Hz, and
  voluntary human limb movement is 0.5-3 Hz - which is why a device is required and why no exercise prescription
  can substitute.

  LOCAL LIMB WARMING (serrat2015, replicated by racine2018): 40 degrees C to ONE SIDE, 40 minutes a day
  for 14 days, treated side +1.3% femur and +1.5% tibia with tibial elongation rate +12%, humerus and
  body mass unaffected, and roughly 1 per cent still present at 7 weeks.


  AND THE JOIN NOBODY HAS MADE, WHICH IS THE MOST ACTIONABLE THING IN THIS ROUND. serrat2014 measured
  what warming does to DELIVERY: raising hindlimb temperature from 22 to 34 degrees C - a range the authors
  call physiological for a normal human knee - raised entry of a 10 kDa tracer into the tibial growth
  plate by MORE THAN 150 PER CENT, against only 18 per cent at 40 kDa, by raising blood velocity 118 per
  cent and vessel diameter 31 per cent rather than by making vessels leakier. R428 concluded that the
  delivery multiplier is approximately 1.0 for the stack''s small molecules because they already partition
  at unity, and that it bites only in the kilodalton band - naming the CNP analogue, whose released CNP-38
  is about 4 kDa, as the one arm delivery actually helps. SO LOCAL KNEE WARMING IS SIMULTANEOUSLY A GROWTH
  LEVER WITH ITS OWN INTERNALLY-CONTROLLED LENGTH ENDPOINT AND THE DELIVERY MULTIPLIER FOR THE ONE ARM
  IN THE STACK THAT DELIVERY CAN HELP. Two nodes, held separately for rounds, and the conjunction is free,
  non-invasive and has zero human data.'
