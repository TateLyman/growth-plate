localization:
  - "human chondro-osseous junction: bisphosphonates concentrate in newly mineralised matrix, producing metaphyseal sclerotic bands timed to each dosing cycle"
human_evidence: indirect
human_evidence_note: >-
  Children receive bisphosphonates routinely and their skeletal effects are well
  documented, but no human study isolates the effect on linear growth.
species_basis: [human, mouse]
translation_risk: moderate
translation_risk_reason: >-
  The human evidence is about bone quality, not longitudinal growth; the growth-relevant
  combinatorial result is murine, and mice do not undergo epiphyseal fusion, so a claim
  about additive growth effects cannot be carried across without testing.
confidence: C
claim_grades:
  - claim: Bisphosphonates deposit at the mineralising front of the hypertrophic zone and produce metaphyseal bands in growing children.
    grade: A
    basis: Universally observed radiographic finding in treated children; a direct human image of drug localisation timed to the plate.
  - claim: Bisphosphonates alter linear growth in children with osteogenesis imperfecta.
    grade: D
    basis: No study isolates the effect from disease severity; growth trajectory cohorts are observational and unstratified by treatment.
  - claim: Resorption blockade and CNP-mediated chondrocyte stimulation act additively on bone growth.
    grade: D
    basis: Single pilot study in growing osteogenesis imperfecta mice; no human data.
