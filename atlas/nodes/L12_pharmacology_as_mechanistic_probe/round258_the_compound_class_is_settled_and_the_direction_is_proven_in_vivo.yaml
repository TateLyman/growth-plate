type: intervention
layer: L12
stub: false
summary: 'THE QUESTION WAS WHETHER CD2665 IS AN INVERSE AGONIST OR A SILENT ANTAGONIST AT RARgamma, BECAUSE ROUND
  257 ESTABLISHED THAT THE WHOLE PROPOSITION TURNS ON IT. IT CANNOT BE SETTLED FOR CD2665 AND IT DOES NOT NEED TO
  BE, BECAUSE BETTER-CHARACTERISED COMPOUNDS EXIST AND ONE OF THEM HAS ALREADY BEEN RUN IN THE DIRECTION WE WANT.

  ONE - THE CLASS DISTINCTION IS THIRTY YEARS OLD AND THE DISCRIMINATING ASSAY IS NAMED. klein1996 designed a series
  of C-1-substituted acetylenic retinoids that ALL antagonise RAR-mediated transactivation, and showed that the
  identity of the C-1 substituent splits them into INVERSE AGONISTS and NEUTRAL ANTAGONISTS. THE CRITICAL METHODOLOGICAL
  POINT, AND THE REASON THE LITERATURE IS FULL OF COMPOUNDS OF UNKNOWN CLASS: ANTAGONISM OF TRANSACTIVATION DOES
  NOT IDENTIFY THE CLASS. The discriminating assay is repression of BASAL receptor activity in the absence of agonist.
  The two classes separate functionally in cells - an inverse agonist, but not a neutral antagonist, repressed serum-induced
  MRP-8 in human keratinocytes.

  TWO - AND IN 2009 IT WAS RESOLVED STRUCTURALLY, WITH A NAMED PAIR. germain2009 defines BMS204,493 as THE INVERSE
  PAN-RAR AGONIST and BMS195,614 as a NEUTRAL RARalpha-SELECTIVE ANTAGONIST, and shows that the anchoring of helix
  H12 is fundamentally different between them, which is what produces their opposite effects on coactivator and
  corepressor recruitment. The authors offer the pair explicitly as the tool set for studying the CONSTITUTIVE,
  ligand-independent activity of RARs - which is exactly the activity williams2009 says matters in the growth plate.
  AND THAT MATTERS RETROSPECTIVELY, BECAUSE THE HUMAN-CELL ARM OF THIS PROGRAMME ALREADY USED THE RIGHT COMPOUND
  WITHOUT THE ATLAS KNOWING IT. riedl2020 reduced hypertrophic conversion of human MSC pellets - smaller cells,
  fewer hypertrophic cells, less collagen X - with BMS204,493. Round 255 recorded that as "an RAR inverse agonist";
  it is THE structurally characterised inverse pan-RAR agonist of germain2009.

  THREE - CD2665 CANNOT BE CLASSIFIED FROM THE LITERATURE. A Europe PMC full-text search pairing CD2665 with inverse
  agonist, neutral antagonist or corepressor returns ZERO records. It is described throughout as a selective RARbeta/gamma
  ANTAGONIST, which by klein1996''s own argument is a statement about transactivation and says nothing about basal
  repression. SO koyama2021''S COMPOUND IS OF UNKNOWN CLASS, AND THAT MATTERS FOR HOW ITS RESULT IS READ - see the
  trilemma in section FIVE.

  FOUR - THE DIRECTION IS SETTLED IN VIVO, BY A FIVE-ARM RECIPROCAL EXPERIMENT THAT ALSO NAMES AN RARgamma-SELECTIVE
  INVERSE AGONIST. janesick2014 is the paper this programme needed and did not know existed. RARgamma2 is the major
  RAR isoform in the caudal axial progenitor domain, and it is engaged at ALL stages of axial elongation rather
  than only as its terminator. IN THE ABSENCE OF RETINOIC ACID, RARgamma2 REPRESSES TRANSCRIPTION IN VIVO AND MAINTAINS
  THE POOL OF CAUDAL PROGENITOR CELLS AND PRESOMITIC MESODERM. In the presence of RA it flips to an activator and
  drives somite differentiation. THEN BOTH DIRECTIONS ARE TESTED, THREE WAYS EACH. ENHANCING REPRESSION - the RARgamma-SELECTIVE
  INVERSE AGONIST NRX205099, or overexpressed dominant-negative RARgamma - INCREASED posterior Hox gene expression
  and markers of presomitic mesoderm and the chordoneural hinge. REDUCING REPRESSION - a dominant-negative co-repressor
  (c-SMRT), a constitutively active receptor (VP16-RARgamma2), or the RARgamma-SELECTIVE AGONIST NRX204647 - diminished
  caudal gene expression and PREMATURELY TERMINATED EXTENSION OF THE BODY AXIS. THAT IS THE PROPOSITION OF ROUNDS
  255 TO 257, RUN IN AN ANIMAL, WITH AN ELONGATION ENDPOINT, IN BOTH DIRECTIONS, WITH A SELECTIVE INVERSE AGONIST
  AND ITS MATCHED SELECTIVE AGONIST. Unliganded RARgamma maintains a progenitor pool and permits elongation; giving
  it ligand, or dismantling its co-repressor, terminates elongation early.

  FIVE - AND IT RESOLVES THE OBJECTION ROUND 257 LEFT STANDING. Round 257 recorded yamaguchi1998 as the sharpest
  objection: a DOMINANT-NEGATIVE RAR in chondrogenic cells produced skeletal RETARDATION AND CERVICAL ABNORMALITIES,
  which looked like the wrong direction for a model in which enhancing repression helps. janesick2014 puts dominant-negative
  RARgamma in the SAME arm as the inverse agonist - both ENHANCE repression - and reports that this arm INCREASES
  POSTERIOR HOX GENE EXPRESSION. Increased posterior Hox expression is the classical cause of anterior-to-posterior
  homeotic transformation of the axial skeleton, which presents as CERVICAL ABNORMALITIES. yamaguchi1998''s phenotype
  is therefore the predicted signature of enhanced RAR repression acting on axial PATTERNING during development,
  not evidence that enhanced repression shortens a growth plate. THIS IS AN INFERENCE, NOT A DEMONSTRATION - nobody
  has shown that yamaguchi1998''s transgene raises posterior Hox genes - but it is specific, it is predicted in
  advance by an independent paper, and it explains the one feature of that phenotype (cervical abnormalities) that
  a simple growth defect does not. THE TRILEMMA ON koyama2021 IS ALSO NOW SHARP, AND IT IS INFORMATIVE WHICHEVER
  WAY IT FALLS. If the proliferative and pre-hypertrophic zones truly contain no retinoid (williams2009''s direct
  measurement), then a NEUTRAL antagonist has nothing to block and should do NOTHING when given alone. CD2665 given
  alone delayed maturation and expanded the plate. So EITHER CD2665 is an inverse agonist, OR there IS endogenous
  ligand in the postnatal mouse plate contradicting williams2009''s measurement, OR the CD2665-alone effect is off-target.
  Each of the three is worth knowing and the first two both support the axis.

  SIX - WHAT TO USE, AND THE PROBLEM WITH IT. NRX205099 is the only RARgamma-SELECTIVE inverse agonist in this literature
  and a PubMed search returns it in exactly ONE paper - janesick2014 - with no bone, no cartilage and no mammalian
  use. BMS204,493 (also written BMS493) is the structurally characterised pan-RAR inverse agonist with a matched
  neutral-antagonist control in BMS195,614, and it is the only one of the three with any cartilage exposure - riedl2020
  in human cells and yin2018 in osteoarthritis. AND yin2018 STATES THE DEVELOPABILITY PROBLEM PLAINLY: BMS493 is
  "unstable and rapidly degrades under physiological conditions", which is why they engineered a coiled-coil protein
  carrier for it. A pan-RAR compound is also the wrong selectivity if matsuoka2025''s finding holds that RARalpha
  and RARbeta agonism do nothing skeletally - though for an INVERSE agonist that argument does not transfer, because
  the relevant activity is constitutive rather than ligand-driven and the subtype control has never been run in
  that direction. THE DELIVERY ROUTE IS ALREADY DEMONSTRATED FOR THIS EXACT TISSUE AND THIS EXACT RECEPTOR. matsuoka2025
  put a selective RARgamma AGONIST into nanoparticles, implanted them beside the proximal tibial growth plate, and
  got involution, closure and shortening with single-plate spatial control. The same vehicle carrying the opposite
  pharmacology is the obvious construction, and it solves the instability problem that yin2018 identifies.

  SEVEN - THE DECISIVE EXPERIMENT, NOW FULLY SPECIFIED FOR THE FIRST TIME. Normal growing mouse or rat. Four arms:
  vehicle, RARgamma-selective inverse agonist (NRX205099, or BMS204,493 with the caveat of pan-selectivity and instability),
  the matched NEUTRAL antagonist as the class control (BMS195,614), and a selective agonist as the positive control
  in the known direction (NRX204647 or matsuoka2025''s compound). Endpoints: tibial length, calcein-measured longitudinal
  growth rate, terminal hypertrophic cell height, resting-zone cells per column and resting-zone cycle time - the
  hunziker1994 quantity set - so that A, D and h_term separate by GR = A x D x h_term. IF AMPLIFICATION RISES WITH
  POOL CONSUMPTION FLAT, this is the first true yield agent this atlas has found. IF POOL CONSUMPTION CARRIES IT,
  it is a second growth hormone and stacks in cost rather than benefit at bone age 16. The neutral-antagonist arm
  is what makes the result interpretable, because it is the only way to tell an inverse-agonist effect from a ligand-blocking
  one, and klein1996 established twenty-nine years ago that no other assay does it.

  EIGHT - AND THE HONEST LIMIT ON ALL OF IT. janesick2014 IS XENOPUS EMBRYONIC AXIAL ELONGATION. Caudal progenitor
  maintenance and presomitic mesoderm extension are NOT endochondral longitudinal bone growth, and no growth plate
  exists in that system. What transfers is the RECEPTOR LOGIC - unliganded RARgamma plus co-repressor maintains
  a progenitor pool and permits elongation - and the fact that it converges with williams2009 in mouse cartilage,
  riedl2020 in human cells, and the human expression data of rounds 256 and 257 is why it is worth this much space.
  It is convergence of mechanism across four systems, not replication of a result, and the length endpoint in a
  mammalian growth plate does not exist in any of them.'
quantitative:
- parameter: THE FIVE-ARM RECIPROCAL TEST OF REPRESSION DIRECTION, IN VIVO, WITH AN ELONGATION ENDPOINT
  value: ENHANCING repression (RARgamma-selective inverse agonist NRX205099, or dominant-negative RARgamma) - INCREASED
    posterior Hox genes and markers of presomitic mesoderm and chordoneural hinge. REDUCING repression (dominant-negative
    co-repressor c-SMRT, constitutively active VP16-RARgamma2, or RARgamma-selective agonist NRX204647) - diminished
    caudal gene expression and PREMATURE TERMINATION of body axis extension
  unit: direction of gene expression and of axial extension
  conditions: janesick2014, Xenopus embryos, microarray screen plus targeted perturbation. RARgamma2 identified
    as the major RAR isoform in the caudal axial progenitor domain and shown to be engaged at all stages of axial
    elongation rather than only as its terminator; in the absence of RA it represses transcription in vivo and maintains
    the caudal progenitor pool and presomitic mesoderm, and in the presence of RA it becomes an activator facilitating
    somite differentiation.
  species: xenopus
  source_ref: janesick2014
  uncertainty: XENOPUS EMBRYONIC AXIAL ELONGATION IS NOT ENDOCHONDRAL BONE GROWTH AND THERE IS NO GROWTH PLATE IN
    IT. The endpoints are gene expression domains and axis extension, not bone length. What makes it load-bearing
    for this programme is the RECIPROCAL DESIGN - three independent ways of enhancing repression and three of reducing
    it, with matched selective agonist and inverse agonist - which is a stronger causal architecture than anything
    in the mammalian retinoid-and-bone literature, applied to the wrong tissue.
- parameter: THE COMPOUND CLASSIFICATION AND THE ASSAY THAT DEFINES IT
  value: BMS204,493 - inverse pan-RAR agonist. BMS195,614 - neutral RARalpha-selective antagonist. NRX205099 - RARgamma-selective
    inverse agonist. NRX204647 - RARgamma-selective agonist. CD2665 - UNCLASSIFIED
  unit: pharmacological class
  conditions: 'germain2009 for BMS204,493 and BMS195,614, with the structural basis - helix H12 anchoring differs
    fundamentally between them, accounting for opposite coactivator and corepressor recruitment. janesick2014 for
    the NRX pair. klein1996 for the class distinction itself and for the discriminating assay: antagonism of transactivation
    does NOT identify the class, and only repression of BASAL activity in the absence of agonist does. CD2665 returns
    ZERO Europe PMC full-text records paired with "inverse agonist", "neutral antagonist" or "corepressor".'
  species: not_applicable
  source_ref: germain2009
  uncertainty: THE CD2665 NEGATIVE IS A SEARCH RESULT, NOT A MEASUREMENT - a full-text search returning nothing
    means the atlas cannot classify it, not that it has been shown to be neutral. Some of these compounds have been
    characterised in reporter systems in one or two cell types only, and inverse agonism is promoter- and cell-context-dependent
    because it depends on basal corepressor occupancy. NRX205099's selectivity rests on a single paper.
- parameter: THE DEVELOPABILITY PROBLEM WITH THE ONLY INVERSE AGONIST THAT HAS SEEN CARTILAGE
  value: BMS493 is "unstable and rapidly degrades under physiological conditions"
  unit: qualitative, as stated by investigators attempting to use it
  conditions: yin2018, who engineered a coiled-coil protein carrier to deliver BMS493 for osteoarthritis, on the
    grounds that high all-trans retinoic acid in synovial fluid contributes to OA and BMS493 is an effective inhibitor
    of that signalling but cannot survive unassisted.
  species: not_applicable
  source_ref: yin2018
  uncertainty: A stability statement in the introduction of a delivery paper, without a measured half-life in this
    atlas's hands. It is nonetheless the assessment of a group that chose to build a carrier rather than dose the
    free compound. matsuoka2025 has already demonstrated nanoparticle delivery of a selective RARgamma ligand to
    the growth plate with single-plate spatial control, so the vehicle problem is solved for this tissue in the
    opposite pharmacological direction.
localization:
- 'Xenopus caudal axial progenitor domain and presomitic mesoderm: where the reciprocal repression test was run'
- 'human MSC chondrogenic pellets: where the characterised inverse agonist BMS204,493 reduced hypertrophic conversion'
- 'mammalian growth plate: where no inverse agonist has ever been given'
human_evidence: absent
human_evidence_note: riedl2020's human MSC pellets are the only human material in this node and they are a tissue-engineering
  model, not a growth plate. No human has received an RAR inverse agonist for any indication.
species_basis:
- xenopus
- human
translation_risk: high
translation_risk_reason: The in vivo direction is established in Xenopus embryonic axial elongation, a process with
  no growth plate; the mammalian arm is a compound of unknown pharmacological class; and the best-characterised
  inverse agonist is pan-selective and chemically unstable.
confidence: C
confidence_reason: The compound classification is A-grade chemistry from two definitive papers, and is graded separately
  below. The direction result is a strong reciprocal in vivo design in the wrong tissue. The node as a whole is
  C because its value is a convergence of mechanism across four systems rather than any measurement of bone length,
  and because the compound actually used in the only growth-plate experiment cannot be classified.
claim_grades:
- claim: RAR ligands separate into inverse agonists and neutral antagonists, and antagonism of transactivation does
    not distinguish them.
  grade: A
  basis: klein1996 established it with a C-1-substituted acetylenic series in which all members antagonise transactivation
    and only some repress basal activity; germain2009 resolved the structural basis in the H12 anchoring of BMS204,493
    versus BMS195,614 and tied it to differential coactivator and corepressor recruitment.
- claim: CD2665, the compound in koyama2021, is an inverse agonist at RARgamma.
  grade: D
  basis: 'UNKNOWN. Europe PMC full-text search pairing CD2665 with inverse agonist, neutral antagonist or corepressor
    returns zero records; it is described only as a selective RARbeta/gamma antagonist, which klein1996 shows is
    uninformative about class. The indirect argument is the trilemma: in a zone measured to be retinoid-free, a
    neutral antagonist should do nothing alone, and CD2665 alone delayed maturation and expanded the plate.'
- claim: Enhancing unliganded RARgamma repression maintains a progenitor pool and permits axial elongation, while
    reducing it terminates elongation prematurely.
  grade: B
  basis: janesick2014, three independent ways of enhancing repression and three of reducing it, in vivo, with matched
    RARgamma-selective inverse agonist and agonist. Not A because it is one paper in one species and the tissue
    is Xenopus presomitic mesoderm, not a growth plate.
- claim: An RARgamma inverse agonist will lengthen a mammalian bone.
  grade: E
  basis: NEVER TESTED IN ANY MAMMAL. The four converging systems - Xenopus axial elongation, mouse cartilage RAR
    genetics, human MSC hypertrophy, human growth plate expression - contain no bone length endpoint under an inverse
    agonist. The experiment is specified in this node and is unrun.
- claim: yamaguchi1998's dominant-negative RAR phenotype is evidence against the ligand-less repressor model.
  grade: D
  basis: 'PROBABLY NOT, ON janesick2014. That paper places dominant-negative RARgamma in the same arm as the inverse
    agonist - both enhance repression - and shows that arm raising posterior Hox expression, which is the classical
    cause of the anterior-to-posterior homeotic transformations that present as cervical abnormalities, exactly
    yamaguchi1998''s reported phenotype. An inference, not a demonstration: nobody has measured Hox genes in yamaguchi1998''s
    transgenics.'
