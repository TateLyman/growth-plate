id: round258_the_compound_class_is_settled_and_the_direction_is_proven_in_vivo
name: ROUND 258 - the compound question is settled and CD2665 is not the answer. The class distinction was made
  in 1996 and structurally resolved in 2009; an RARgamma-SELECTIVE INVERSE AGONIST exists and has been run once,
  in Xenopus, in a five-arm reciprocal design in which ENHANCING unliganded RARgamma repression MAINTAINS A PROGENITOR
  POOL AND EXTENDS THE BODY AXIS while reducing it TERMINATES AXIAL ELONGATION PREMATURELY - and that also explains
  away the standing yamaguchi1998 objection
