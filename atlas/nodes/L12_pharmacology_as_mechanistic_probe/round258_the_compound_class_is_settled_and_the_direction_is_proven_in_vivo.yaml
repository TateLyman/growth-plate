contradicts: RESOLVES, PROBABLY, THE OBJECTION LEFT STANDING BY round257_the_receptor_is_a_ligandless_repressor_and_that_is_why_the_human_null_is_a_null.
  That node recorded yamaguchi1998's dominant-negative RAR phenotype - skeletal retardation with cervical abnormalities
  - as the sharpest objection to the ligand-less repressor model. janesick2014 places dominant-negative RARgamma
  in the SAME arm as the inverse agonist, both enhancing repression, and shows that arm raising posterior Hox gene
  expression - the classical cause of the homeotic transformations that present as cervical abnormalities. The phenotype
  is the predicted signature of enhanced repression acting on axial patterning, not evidence that enhanced repression
  shortens bones. Graded D because it is an inference and the Hox measurement was never made in those transgenics.
  ALSO CORRECTS the compound specification carried from round 255 through round 257 - CD2665 is unclassifiable from
  the literature and is not the compound this proposition should be tested with.
