contradicts:
- 'DEFLATES THE ROUND-190 POSITIVE READING OF winer2018. That round treated the CaR group attaining or
  exceeding midparental height as the best human evidence that PTH1R agonism helps growth. benson2025
  records short stature as an ADH2 rather than an ADH1 feature, so the comparator population reaches
  target without any drug. The negative inference - no truncation over a decade - survives and is
  upgraded from D to C, because a comparator that normally reaches target makes a shortfall detectable.'
- 'REMOVES OSTEOSARCOMA AS A BASIS FOR CHOOSING BETWEEN THE MOLECULES. Rounds 184 and 188 both discussed
  the osteosarcoma labelling without noting that jolette2017 ran the two drugs head to head and found
  them equivalent at similar human-exposure multiples.'
