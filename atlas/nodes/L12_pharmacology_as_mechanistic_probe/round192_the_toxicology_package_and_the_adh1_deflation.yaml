human_evidence: indirect
human_evidence_note: 'Human evidence this round is the ADH1 natural history and the empty trial registry.
  The winer2018 cohort remains the only human growth data under a PTH1R agonist, and this round reweights
  it: the positive inference is deflated by ADH1 not being a short-stature condition, while the negative
  inference against pool depletion survives and is strengthened.'
species_basis:
- rat
- human
translation_risk: high
translation_risk_reason: 'The toxicology package is rat and mature primate. Its most decision-relevant
  finding - that age at initiation matters and the no-effect regimen is the late one - is rat-specific
  and the rat osteosarcoma response is itself widely held not to translate. The primate data that does
  reassure covers only skeletally mature animals.'
confidence: C
claim_grades:
- claim: There is an oncological reason to prefer teriparatide over abaloparatide or vice versa.
  grade: X
  basis: 'NO. jolette2017 compared them head to head in the two-year Fischer 344 carcinogenicity design
    at doses representing similar human-exposure multiples and found similar osteosarcoma incidence,
    mortality, age at first occurrence and metastatic potential. The molecule choice rests on
    immunogenicity, where the two differ by an order of magnitude, and now on wang2023 potency, where
    they differ the other way.'
- claim: The winer2018 CaR group attaining midparental height is evidence that PTH promotes growth.
  grade: X
  basis: 'DEFLATED BY THE NATURAL HISTORY. benson2025 records short stature as an ADH2 feature in about
    42 per cent of cases and hypercalciuria as the ADH1 feature. Winer''s CaR group is ADH1. A population
    that reaches target anyway reaching target is not a drug effect. Round 190 leaned on this and should
    not have.'
- claim: A decade of PTH(1-34) through childhood did not truncate final height.
  grade: C
  basis: 'SURVIVES THE DEFLATION AND IS STRENGTHENED BY IT. Upgraded from D. The value of a comparator
    that normally reaches midparental height is that falling short becomes detectable: if the drug spent
    the plate, ADH1 children on it for up to a decade at up to 1.49 micrograms per kilogram per day
    should have finished BELOW a target they otherwise reach, and they did not. The confounds that
    weakened the positive inference do not weaken the negative one.'
- claim: The regulatory toxicology package contains the bone-length dose-response.
  grade: X
  basis: 'IT DOES NOT, AND THIS IS THE FIFTH INSTANCE. vahle2002 ran two years of quantitative computed
    tomography and histomorphometry on rats dosed from two months of age at three dose levels - the best
    dose-response design in the entire literature for this purpose - and reported bone mass, architecture,
    marrow space and tumours. Not length.'
- claim: Someone is running a trial that would answer this.
  grade: X
  basis: 'NO. ClinicalTrials.gov returns one paediatric hit for teriparatide with a growth term and it is
    a hypophosphatasia natural-history registry with no PTH1R intervention; abaloparatide in children
    returns zero. No registered trial anywhere has a growth endpoint under a PTH1R agonist.'
