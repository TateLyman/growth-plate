id: round192_the_toxicology_package_and_the_adh1_deflation
name: ROUND 192 - the regulatory toxicology package answers three questions, ADH1 natural history
  deflates the human positive, and no paediatric growth trial has ever been registered
type: hypothesis
layer: L12
aliases:
- the toxicology package
- ADH1 deflation
- round 192
stub: false
summary: 'A SOURCE THIS ATLAS HAD NEVER OPENED - THE PUBLISHED REGULATORY CARCINOGENICITY PACKAGE - PLUS
  A NATURAL-HISTORY FACT THAT WEAKENS THE BEST HUMAN POSITIVE. Three questions answered, one deflation,
  and one more instance of the missing endpoint.

  WHY THE TOXICOLOGY PACKAGE MATTERS HERE. These are the only multi-dose, multi-duration studies of
  PTH1R agonists in animals dosed FROM GROWTH ONWARD. vahle2002 gave Fischer 344 rats daily PTH(1-34)
  for TWO YEARS at 0, 5, 30 and 75 micrograms per kilogram, 60 per sex per group, with quantitative
  computed tomography and histomorphometry. vahle2004 then crossed dose (0, 5, 30) with duration (6,
  20, 24 months) AND WITH AGE AT INITIATION - two months or six months. jolette2017 ran abaloparatide
  at 0, 10, 25 and 50 micrograms per kilogram against hPTH(1-34) at 30 as a positive control for up to
  two years. vahle2008 followed cynomolgus macaques for 18 months of teriparatide plus three years off.

  FIRST ANSWER - THE TWO MOLECULES ARE A WASH ON OSTEOSARCOMA. jolette2017 compared abaloparatide at 25
  and hPTH(1-34) at 30 micrograms per kilogram, doses it describes as REPRESENTING SIMILAR EXPOSURE
  MULTIPLES TO THE HUMAN THERAPEUTIC DOSES, and found SIMILAR osteosarcoma-associated mortality, tumour
  incidence, age at first occurrence and metastatic potential. There is no oncological reason to prefer
  one molecule over the other. The round-188 reversal to teriparatide rested on immunogenicity and it
  still does; this simply removes a second axis someone might have reached for.

  SECOND ANSWER, AND IT IS THE ONE THAT BEARS ON THIS CASE - AGE AT INITIATION WAS EXPLICITLY VARIED AND
  THE NO-EFFECT REGIMEN IS THE ONE THAT STARTS LATE. vahle2004 reports that NO NEOPLASMS WERE FOUND WHEN
  THE 5 MICROGRAM PER KILOGRAM TREATMENT WAS INITIATED AT SIX MONTHS OF AGE and continued for six or
  twenty months, up to 70 per cent of lifespan, while still producing substantial increases in bone
  mass. The design crossed age at initiation at two months against six, and the no-effect combination is
  specified as the six-month one. The subject here is skeletally IMMATURE, which is the arm the only
  study to vary this put on the wrong side. Stated once, factually, because the user has set risk aside
  for candidate selection - but this is an age-specific quantified signal rather than a generic label
  warning, and it should be visible when the complete stack is assessed.

  THIRD ANSWER - PRIMATES DO NOT SHOW IT, BUT NO PRIMATE HAS BEEN DOSED WHILE GROWING. vahle2008 gave
  skeletally MATURE ovariectomised cynomolgus monkeys teriparatide at 5 micrograms per kilogram per day
  for 18 months and observed them for three further years - four and a half years total - with plain
  films, necropsy inspection and histology of multiple skeletal sites. NO bone proliferative lesions and
  NO osteosarcoma. Vertebral bone mineral density rose 29 per cent and strength 52 per cent. That is why
  the human surveillance is clean and it is genuinely reassuring. IT IS ALSO SKELETALLY MATURE ANIMALS
  ONLY. No primate study has ever dosed a growing skeleton.

  AND A FIFTH INSTANCE OF THE MISSING ENDPOINT. vahle2002 ran two years of quantitative computed
  tomography and histomorphometry on rats dosed from two months of age at three doses - animals carried
  through their entire growth period with imaging at every dose level - and reports bone mass,
  architecture, marrow space and tumour incidence. NOT BONE LENGTH. Round 191 documented four instances;
  this is the fifth, and it is the one with the best dose-response design of all of them.

  NOW THE DEFLATION, AND IT COSTS US THE BEST HUMAN POSITIVE. Round 190 leaned on winer2018: the
  calcium-sensing-receptor group attained or exceeded midparental height while the APS-1 group fell 8 to
  12 centimetres short. benson2025 states the natural history plainly - ADH1 PATIENTS TYPICALLY MANIFEST
  HYPERCALCIURIA, WHILE ADH2 IS ASSOCIATED WITH SHORT STATURE IN APPROXIMATELY 42 PER CENT OF CASES.
  Short stature is a GNA11 feature, not a CASR feature. Winer''s CaR group is ADH1. SO A COHORT THAT DOES
  NOT CHARACTERISTICALLY HAVE SHORT STATURE REACHING MIDPARENTAL HEIGHT IS WHAT YOU WOULD EXPECT WITHOUT
  ANY DRUG EFFECT AT ALL.

  BUT THE TWO INFERENCES COME APART CLEANLY AND ONLY ONE DIES. THE POSITIVE INFERENCE - that PTH promoted
  growth - is now close to worthless, because the comparator population reaches target anyway. THE
  NEGATIVE INFERENCE SURVIVES INTACT AND IS ARGUABLY STRENGTHENED: precisely BECAUSE ADH1 children
  normally reach midparental height, a decade of PTH(1-34) at up to 1.49 micrograms per kilogram per day
  through the entire growth period should have pulled them BELOW target if the drug spent the plate. It
  did not. A clean expected-value comparator makes the absence of truncation MORE informative, not less.

  AND NOBODY IS RUNNING THE EXPERIMENT. A ClinicalTrials.gov v2 search for teriparatide with a height,
  growth or stature endpoint in children returns ONE study, and it is a natural-history registry of
  hypophosphatasia with no PTH1R intervention. Abaloparatide in children returns ZERO. There is no
  registered trial anywhere with a growth endpoint under a PTH1R agonist.'
