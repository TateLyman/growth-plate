human_evidence: absent
human_evidence_note: No member of the new class has been given to a human. ADAM12, PTEN, NPPB, OSTN and HES1 all return
  zero rows in the kosmicki2026 207-gene burden table, so none has a human effect size in this atlas main instrument
  - which under CORR-310 and CORR-358 is a fact about a heterozygous burden design, not evidence of no effect.
translation_risk: high
translation_risk_reason: Every strict member is a germline transgenic or a conditional knockout from conception, or an
  implanted osmotic pump in a rabbit. None is an obtainable agent, none passes CORR-299 open-plate testing, and the two
  largest carry stated costs - growth plate fusion by 6 months for Pten, kyphosis and crooked tails for BNP.
summary: 'R436 enumerated FOURTEEN items in this atlas with a positive LENGTH endpoint in a normal animal and used that
  count

  to argue the shelf is structurally empty. R437 then argued the search itself was shaped - every sweep here is of the
  form

  "query X AND bone length", which can only find agents whose developers already wanted what we want. R464 ran the inverse:

  query the ENDPOINT PHRASE first, in both PubMed titles/abstracts and Europe PMC FULL TEXT, and see what comes back

  regardless of what the paper was about. One session roughly doubled the class.


  ONE - THE COUNT IS WRONG, AND IT IS DEMONSTRABLE FROM THIS REPOSITORY''S OWN FILES. R436''s fourteen omits at least
  three

  members already in this bibliography: kanai2017, whose node states osteocrin-by-CNP double transgenics gain ADDITIONAL

  bone length; kake2009, titled chronically elevated plasma CNP stimulates skeletal growth in transgenic mice; and

  shuhaibar2017, cited in the ledger itself for a tail 8.5 to 9.7 per cent longer. An enumeration that misses three of
  its

  own bibliography''s members is not a census. Roughly forty endpoint-first queries then returned eleven new strict

  candidates and thirty-six unheld PMIDs from a repository with 2,053 references and about 460 rounds of prior searching,

  with no decay in yield.


  TWO - THE LARGEST NEW MEMBER REACHES THE VERTEBRAE, AND ITS GENE IS AT ABSOLUTE ZERO IN THIS ATLAS. kveiborg2006:

  transgenic mice expressing the SECRETED form of human ADAM12 in the circulation show a pronounced increase in the length

  of FEMUR, TIBIA AND VERTEBRAE, progressive and age-dependent, with a MAXIMUM OF PLUS 17 PER CENT IN THE FEMUR AT SIX

  MONTHS. Two internal controls are supplied by the paper itself: the effect is GENE-DOSE DEPENDENT across two lines,
  and

  a TRUNCATED form lacking the pro- and metalloprotease domains produces NO ALTERATION IN BONE LENGTH, so catalytic

  protease activity is required. Growth plate ORGANISATION was unaltered while mean plate width, BrdU incorporation and

  the collagen X hypertrophic zone width all rose, and in vitro ADAM12-S inhibits chondrocyte adhesion to fibronectin
  and

  collagen II. ADAM12 returned ZERO in nodes, gaps, CLAUDE.md and the bibliography before this round.


  Why it matters beyond its size: it is a SECRETED, CIRCULATING PROTEASE whose gain of function lengthens bone including

  the AXIAL compartment - R287''s extracellular layer and R314''s antibody-tractable class, aimed at the compartment
  R425,

  R436 and R455 say holds the residual centimetres. It is also a direct instance of R448''s argument that in animals
  matrix

  loosening is necessarily proteolytic, and of R454''s unmeasured matrix-per-cell term. Against it: the direction is
  to

  RAISE a protease, which is the shelf R342 found empty; ADAM12 returns no rows in kosmicki2026''s 207-gene burden table;

  it is a broad-substrate sheddase; and it is germline transgenic overexpression from conception, so CORR-299''s open-plate

  test is unrun. Per-bone means, SDs and n are not in the abstract and the full text is not open access.


  THREE - AND THE INTRAOSSEOUS EPIPHYSEAL DEPOT ROUTE HAS ALREADY BEEN DONE IN A NORMAL ANIMAL, WITH A TRACER ARM.

  abbaspour2008: healthy four-week-old Japanese white rabbits, IGF-I at 150 microgram/kg/day by osmotic pump through
  a

  cannula into the bone marrow cavity of the PROXIMAL TIBIAL EPIPHYSIS, with the CONTRALATERAL TIBIA receiving saline

  through identical apparatus. Two millimetres of tibial overgrowth at four weeks and a 15 per cent rise in growth-plate

  thickness, with proliferative and hypertrophic chondrocyte numbers both increased. The part this atlas needs most is
  the

  tracer arm: repeating the infusion with India ink showed most of it remained in the epiphyseal marrow cavity BUT A

  PORTION INFILTRATED THE GROWTH PLATE, REACHING THE DEEP LAYER OF PHYSEAL CHONDROCYTES AND THE PRIMARY SPONGIOSA. That
  is

  a direct distribution measurement for the exact route R373 to R387 specified for a SAG depot and R441 proposed for
  a

  local recombinant GH depot - a route this file has only ever argued from diffusion geometry.


  AND ITS PAIRED NEGATIVE IS THE CONTROL THAT MAKES IT INTERPRETABLE. yang1993pge2 gave local intraosseous PGE2 at 1,
  10

  and 100 pmol per day into the metaphysis of NORMAL rats for 14 days with the contralateral tibia as vehicle control:

  metaphyseal trabeculae rose 45 to 81 per cent dose-dependently and there was NO EFFECT ON TIBIAL LENGTH. The route
  can

  produce large trabecular effects with zero length, so it is not automatically productive - and the paper''s own title

  says increased bone growth, which is CORR-309''s shape with the null in the same abstract.


  FOUR - AND A NATRIURETIC LIGAND ARM THIS FILE HAS NEVER WORKED HAS A LENGTH ENDPOINT IN NORMAL-BACKGROUND MICE.

  suda1998: BNP transgenics show marked skeletal overgrowth with FEMUR LENGTH INCREASED and BODY LENGTH RISING IN

  PROPORTION TO PLASMA BNP ACROSS THREE INDEPENDENT LINES - a transgene dose-response - with growth-plate cartilage height

  increased in VERTEBRAE as well as long bones, and embryonic tibial organ culture showing BNP raises cartilaginous

  primordium height DIRECTLY. BNP signals through GC-A/NPR1, not NPR-B. This atlas''s entire natriuretic effort is

  CNP-to-NPR2 plus NPR3 clearance; brain natriuretic returns zero in nodes, gaps and ledger and every existing BNP mention

  here is a cardiac biomarker. Against it: severe kyphosis and crooked tails, so a deformity phenotype rather than clean

  elongation; germline overexpression; NPPB returns no rows in the 207; and Step 0 is genuinely contested, because raising

  GC-A output may reach the same cGMP pool R311 showed the CNP arm already saturates.


  FIVE - THE COLLATERAL CORRECTIONS. The NSAID watch-item loses its only direct experimental support: park2016retracted,

  the paper reporting NSAID inhibition of the growth plate, IS RETRACTED - while li1989flurbiprofen raised proximal tibial

  LONGITUDINAL GROWTH RATE and growth plate thickness by 30 to 40 per cent in NORMAL 28-day-old rats with an inverted-U

  across five doses. That is a proxy and not attained length, and R463 shows plate thickness is a blind readout, so it
  does

  not become a lever - but R297 and R306''s NSAID concern is now grade E in BOTH directions with its one supporting

  experiment withdrawn. And garces1988 complicates R463: 50 normal rats denervated at one month, contralateral control,

  calipers to 0.05 mm - metatarsals 3 to 5 per cent SHORTER, femora less than 1 per cent longer transiently, and NO

  DIFFERENCE IN TIBIAL LENGTH, against killion2017''s significantly shorter tibiae in mice denervated at P8. Different

  species and different age at transection; g_l7_449d is answered ambiguously, not cleanly.


  SIX - WHERE THE CLASS GENUINELY IS EMPTY, CHECKED RATHER THAN ASSUMED. The phrase increased vertebral length returns

  ZERO in PubMed; vertebral length or vertebral body height with increased in mice or rats returns FOUR; and increased

  vertebral height returns 31 Europe PMC hits of which ALL are spine surgery, vertebroplasty or osteogenesis imperfecta,

  not one a growth intervention. ADAM12-S, Pten and BNP are the only interventions found with any axial length claim
  and

  none reports a vertebral number. R425, R436 and R455 stand. And the openFDA label corpus reproduces R449 section six

  independently: femur length appears in 1,521 labels while increased femur length, increased bone length, increased
  tibia

  or tibial length, longer femurs and increased linear growth return ZERO each.'
quantitative:
- parameter: ADAM12-S transgenic bone length, normal background
  value: pronounced increase in FEMUR, TIBIA AND VERTEBRAE; maximum +17 per cent femur at 6 months; gene-dose dependent;
    protease-dead truncation shows NO alteration
  unit: per cent, transgenic vs non-transgenic littermates
  species: mouse
  source_ref: kveiborg2006
  note: THE LARGEST POSITIVE LENGTH ENDPOINT IN A NORMAL-BACKGROUND ANIMAL IN THIS ATLAS, AND THE ONLY ONE THAT NAMES
    VERTEBRAE. Growth plate ORGANISATION unaltered; plate width, BrdU and collagen X zone width all up. Per-bone means,
    SDs and n not in the abstract
- parameter: local epiphyseal IGF-I infusion, tibial length, contralateral saline control
  value: 90.3 +/- 1.3 vs 88.2 +/- 1.4 mm at 4 weeks (about +2.4 per cent); 74.9 +/- 1.7 vs 73.9 +/- 1.6 at 2 weeks; growth-plate
    thickness +15 per cent
  unit: mm; 150 microgram/kg/day osmotic pump into proximal tibial epiphyseal marrow; n=14 p<0.004 at 4 wk, n=5 p<0.01
    at 2 wk
  species: rabbit
  source_ref: abbaspour2008
  value_unverified: true
  note: 'The mm values are agent-extracted from the full text; the ABSTRACT states 2 mm overgrowth and 15 per cent plate
    thickening, which is verified. CRITICAL: the India-ink tracer arm shows a portion INFILTRATED THE GROWTH PLATE reaching
    deep physeal chondrocytes and primary spongiosa - the first distribution measurement for the intraosseous epiphyseal
    route'
- parameter: local intraosseous PGE2, tibial length - THE ROUTE NEGATIVE CONTROL
  value: NO effect on tibial length while metaphyseal trabeculae rose 45 to 81 per cent dose-dependently
  unit: 1, 10 and 100 pmol/day into left tibial metaphysis for 14 days, contralateral vehicle control
  species: rat
  source_ref: yang1993pge2
  note: THE INTRAOSSEOUS ROUTE IS NOT AUTOMATICALLY PRODUCTIVE. Large trabecular effect, zero length - and the paper
    title says increased bone growth, CORR-309 with the null in the same abstract
- parameter: BNP transgenic skeletal overgrowth
  value: femur length increased P<0.01 n=12; BODY LENGTH INCREASED IN PROPORTION TO PLASMA BNP ACROSS THREE INDEPENDENT
    LINES; growth-plate cartilage height increased in VERTEBRAE and long bones
  unit: transgenic vs non-transgenic; plasma BNP 12.2 +/- 1.2 vs less than 0.06 pmol/ml
  species: mouse
  source_ref: suda1998
  value_unverified: true
  note: 'A TRANSGENE DOSE-RESPONSE. BNP signals through GC-A/NPR1, NOT NPR-B - a receptor arm this atlas has never worked,
    and R421 puts NPR1 at 54.0 per cent trunk, near the median rather than limb-leaning like NPPC 30.9 and NPR2 29.8.
    Cost: kyphosis and crooked tails. Length in mm is figure-only'
- parameter: flurbiprofen, longitudinal growth RATE in normal growing rats
  value: proximal tibial longitudinal growth rate, growth plate thickness and periosteal bone formation rate ALL UP 30
    to 40 per cent at 0.1 and 0.5 mg/kg/day; 2.5 less effective (inverted-U); osteoclast number down 62 to 70 per cent
  unit: 0 to 2.5 mg/kg/day subcutaneously for 21 days, normal 28-day-old male Sprague-Dawley rats
  species: rat
  source_ref: li1989flurbiprofen
  note: AN NSAID RAISING LONGITUDINAL GROWTH IN A NORMAL ANIMAL. PROXY ONLY - growth rate and plate thickness, no attained
    length, and R463 shows plate thickness is a blind readout
- parameter: sciatic denervation in normal rats, contralateral control - CONTRADICTS killion2017 on the tibia
  value: metatarsals 3 to 5 per cent SHORTER from week 1 with no further increase; femora less than 1 per cent LONGER
    at weeks 2 and 8 only; NO DIFFERENCE in tibial length
  unit: 50 rats, right sciatic nerve cut at 1 month, calipers to 0.05 mm, to 12 weeks
  species: rat
  source_ref: garces1988
  note: killion2017 found significantly SHORTER tibiae in mice denervated at P8. Different species and different age
    at transection - g_l7_449d is answered AMBIGUOUSLY, not cleanly
- parameter: low-dose developmental xenoestrogens and adult femur length
  value: low-dose ethinyl oestradiol, diethylstilbestrol or bisphenol A INCREASED ADULT FEMUR LENGTH; the HIGHEST EE2
    dose did NOT - non-monotonic; tensile strength fell
  unit: maternal osmotic pump GD11 to PND12, read in adults, normal C57BL/6
  species: mouse
  source_ref: pelch2012
  note: A developmental oestrogenic exposure LENGTHENED the adult femur - the opposite sign to the mature-plate oestrogen
    literature, and non-monotonic
- parameter: chondroitin sulfate in 1152 normal broilers - counterweight to the minipig patent
  value: body weight, BMC, BMD, ash, absolute bone weight and diaphyseal perimeter ALL unaffected, P>0.10
  unit: 1152 Cobb males to 47 days
  species: chicken
  source_ref: munoz2025cs
  note: The largest normal-animal chondroitin dataset available and it is mostly null, against the R449/R451 minipig
    patent claim of +12.6 per cent WILD-TYPE height. Different species, endpoint and dose - a counterweight, not a refutation
