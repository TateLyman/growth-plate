id: round464_the_positive_length_endpoint_class_is_not_near_empty_it_was_a_vocabulary_limit
name: R464 - the positive-length-endpoint class is NOT near-empty. Endpoint-first querying roughly doubled it in one
  session and returned ADAM12-S at +17 per cent femur reaching the VERTEBRAE, the intraosseous epiphyseal depot route
  already validated with a tracer arm in a normal animal, and a GC-A/NPR1 ligand arm this file has never worked
aliases:
- R464
- inverse endpoint-first sweep
- ADAM12-S +17 per cent femur
- local epiphyseal IGF-I India ink tracer
- BNP transgenic skeletal overgrowth
- GC-A ligand arm
- the NSAID inhibition paper is retracted
- local intraosseous PGE2 is the route negative control
