id: round205_the_supplied_bundle_settles_four_questions
name: ROUND 205 - the h_term gain is TRANSIENT, vosoritide does not advance bone age but does not grow
  primate vertebrae either, the dose ceiling is disordered overgrowth below the human exposure, and
  resveratrol is the only compound in this file that hits four terms at multiple sites
type: hypothesis
layer: L12
aliases:
- the supplied bundle
- transient h_term
- vosoritide bone age
- L1-L4 null
- resveratrol four-term
- round 205
stub: false
summary: 'FOUR THINGS THE USER SUPPLIED SETTLED FOUR QUESTIONS, AND THREE OF THE FOUR ANSWERS ARE
  UNFAVOURABLE TO POSITIONS THIS ATLAS HELD LAST ROUND.

  ONE. THE h_term GAIN UNDER HEDGEHOG AGONISM IS REAL AND IT IS TRANSIENT. Round 204 asked for
  trompet2024 Supplementary Figures 5F and 6B because the paper hedges - the augmented growth plate
  height was "PROBABLY due to an elevation in the height of the terminal hypertrophic chondrocytes". The
  deposited source workbook gives the per-animal values, paired contralateral limbs of the same rats, and
  the hedge resolves into a TIME COURSE. Femur 1.00x at one week, 1.18x at one month (p = 0.025, all six
  animals the same direction), 0.93x at two months. Tibia 1.07x, then 1.25x (p = 0.0001, t = 12.77, all
  six the same direction), then 1.087x (p = 0.014). THE EFFECT PEAKS AT ONE MONTH AND IS LARGELY GONE BY
  TWO. trompet2024''s LENGTH gain persists to SIX months, so the sustained length is NOT carried by
  terminal cell height. And at two months in the femur the ZONE is up 1.05x while the CELLS are down
  0.93x - CORR-197 demonstrated in the same animals, the two moving in opposite directions.

  THAT ALSO PUTS A CEILING ON THE FREE AXIS. The largest terminal-cell-height ratio anywhere in this
  dataset is 1.25x. Against weber2025''s 1.20x under NPR3 loss and hunziker1994''s 1.36x under growth
  hormone, THE ENTIRE OBSERVED RANGE OF h_term ACROSS EVERY AGENT THIS ATLAS HOLDS IS ABOUT 1.0 TO 1.4x.
  Round 202 established that a per cent of h_term is worth about five per cent of division count and
  costs nothing; this round establishes that there are only about forty per cent of them available.

  TWO. VOSORITIDE DOES NOT ADVANCE BONE AGE, AND THIS IS RANDOMISED HUMAN DATA. FDA Study 111-301, 61
  vosoritide against 60 placebo: bone age advanced 1.02 (0.83) years over 52 weeks on drug against 1.14
  (0.82) on placebo - LESS, not more. At Week 104 in 33 subjects the change from baseline in the
  bone-age-minus-chronological-age difference was minus 0.05 (1.46) years. For a case at bone age 16
  under a fixed-reserve model this is the single most favourable fact recorded about any agent in the
  stack. THE CAVEAT IS IN THE SAME DOCUMENT: the dose-ranging Study 111-202/205 shows a small POSITIVE
  drift in that difference, largest in the 30 microgram per kilogram cohort, and the medical reviewer
  writes that it "raises concerns of accelerated bone maturation". THE BONE-AGE COST IS ABOUT ZERO AT THE
  LABEL DOSE AND POSSIBLY NON-ZERO ABOVE IT.

  THREE, AND IT CONTRADICTS HOW ROUND 203 FRAMED THE SITE QUESTION. In the 26-week juvenile non-human
  primate study, vosoritide lengthened the TIBIA by 6 to 7 per cent and the HUMERUS by 4 to 6 per cent
  with significance in high-dose males, moved the FEMUR only 2 to 4 per cent without significance, and -
  stated explicitly - "there were NO SIGNIFICANT EFFECTS ON THE LENGTH BETWEEN L1 AND L4 VERTEBRAE or in
  the dimensions of the foramen magnum or skull". Round 203 read cnpmeta2026''s unchanged upper-to-lower
  segment ratio as proportionate growth and called it the favourable answer for a case with several open
  sites. THE PRIMATE DATA SAYS THE AXIAL SKELETON DID NOT RESPOND. Those can be reconciled - the human
  trials are in achondroplasia where the vertebrae are themselves FGFR3-affected, and an L1-L4 length in
  a handful of monkeys is underpowered - but the reconciliation is a hypothesis and the atlas should stop
  quoting proportionality as established. A SEX SPLIT IS ALSO STATED, "in females, minimal increases in
  bone lengths were evident", with the high-dose female femur NEGATIVE at minus 1 to minus 3 per cent,
  which is exactly the CORR-191 situation.

  FOUR. THE DOSE CEILING IS SET BY DISORDERED OVERGROWTH IN NORMAL ANIMALS, AT OR BELOW THE HUMAN
  EXPOSURE. Round 203 found the human CNP dose-response near-linear with no efficacy ceiling and
  concluded the axis should be dosed hard. The regulatory package supplies the other half. The JUVENILE
  RAT NOAEL is 10 micrograms per kilogram, 0.08x the maximum recommended human dose by AUC, limited by
  hindlimb effects on ambulation and maze solving with histomorphometric alterations at growth plates and
  degenerative joint changes. The ADULT NHP 44-week NOAEL is 25 micrograms per kilogram, 0.2x MRHD by
  AUC. The adult rat 26-week finding is "increased bone growth plate thickness and/or GROWTH PLATE
  DYSPLASIA" affecting long bones AND VERTEBRAE. THE TOXICITY IS THE PHARMACOLOGY, and it is the
  machnicki2022 failure mode - faster elongation with disorganised plates. In a NON-achondroplasia
  subject there is no FGFR3 excess to absorb the drive, so the normal-animal NOAEL is the relevant
  number, not the achondroplasia label dose.

  AND ONE FAVOURABLE FIND THAT WAS ALREADY IN THE FILE, GRADED D, IN A NODE CALLED "THE UNTOUCHED
  COMPOUND". karimian2013 measured the FULL decomposition explicitly - growth plate height, proliferative
  AND hypertrophic chondrocytes PER COLUMN, resting zone area, zone heights, and THE SIZE OF THE TERMINAL
  HYPERTROPHIC CHONDROCYTES, separately. In ovariectomised rabbits resveratrol gave a growth plate 284
  plus or minus 19 against 133 plus or minus 40 micrometres (p less than 0.01), an enlarged RESTING ZONE
  (p less than 0.01), UNCHANGED proliferative cells per column and proliferative zone height, INCREASED
  hypertrophic cells per column, INCREASED hypertrophic zone height, and an INCREASED size of the
  terminal hypertrophic chondrocyte while oestradiol was no different from control. It DELAYED FUSION at
  the distal tibia, distal femur and proximal tibia; it raised TIBIAL AND VERTEBRAL growth and improved
  FINAL LENGTH in ovary-intact animals over sixteen weeks; and the named mechanism is SUPPRESSED
  CHONDROCYTE VEGF AND LAMININ, which connects it to the atlas''s own vascular thread because vascular
  invasion is what fusion is. POOL, AMPLIFICATION, h_term AND DURATION, AT MULTIPLE SITES, WITH A FINAL
  LENGTH ENDPOINT. No other compound in this file has that profile, and the reason it is untouched is
  human bioavailability, not biology.'
quantitative:
- parameter: terminal hypertrophic chondrocyte height under an intra-articular SAG bead, by timepoint
  value: 'FEMUR 29.48 to 29.47 micrometres at 1 week (1.00x, p = 0.99), 26.72 to 31.46 at 1 month (1.18x,
    p = 0.025, all 6 animals up), 21.87 to 20.29 at 2 months (0.93x, p = 0.22). TIBIA 28.41 to 30.52 at
    1 week (1.07x, p = 0.14), 25.99 to 32.38 at 1 month (1.25x, p = 0.0001, all 6 up), 20.12 to 21.87 at
    2 months (1.087x, p = 0.014)'
  unit: micrometres, DMSO against SAG
  conditions: trompet2024 Supplementary Figures 5F and 6B, author-deposited per-animal source data;
    SAG- or DMSO-soaked beads in the secondary ossification centre of Wistar-Kyoto rats, CONTRALATERAL
    LIMBS OF THE SAME ANIMAL, paired t-test; n = 6, 6 and 9 (femur) or 8 (tibia)
  species: rat
  source_ref: trompet2024
  uncertainty: 'AUTHOR-DEPOSITED PER-ANIMAL VALUES, not read from a figure, and the p-values here are
    recomputed from those values rather than quoted. THE TIME COURSE IS THE FINDING and it is robust -
    every animal moves the same way at one month in both bones. What it undermines is the paper''s own
    causal sentence, since the length gain persists to six months and this does not persist to two'
- parameter: bone age advance under vosoritide, randomised
  value: bone age change over 52 weeks 1.02 (0.83) years on vosoritide 15 micrograms/kg against 1.14
    (0.82) on placebo, n = 61 against 60; and at Week 104 in 33 subjects the change from baseline in
    (bone age minus chronological age) was minus 0.05 (1.46) years
  unit: years
  conditions: FDA Multi-Discipline Review NDA 214938, Study 111-301 Table 33 and Study 111-302
  species: human
  source_ref: fda_voxzogo_multidiscipline_review_2021
  uncertainty: 'THE SINGLE MOST FAVOURABLE FACT ABOUT ANY AGENT IN THE STACK FOR A LATE-BONE-AGE CASE,
    and it is randomised. THE SAME DOCUMENT CARRIES THE COUNTERWEIGHT - the dose-ranging Study 111-202/205
    shows a small positive drift in the bone-age minus chronological-age difference, largest at 30
    micrograms/kg, which the medical reviewer states raises concerns of accelerated bone maturation.
    Achondroplasia children, not a late-bone-age non-achondroplasia subject'
- parameter: site-resolved bone length under vosoritide in juvenile non-human primates
  value: 'week 25, high dose 300 micrograms/kg, males - TIBIA 102.90 to 110.16 mm (+7 per cent, p less
    than 0.05), HUMERUS 102.24 to 108.20 (+6 per cent, p less than 0.05), FEMUR 116.84 to 119.86 (+3 per
    cent, not significant). Explicitly stated - NO SIGNIFICANT EFFECTS on the length between L1 and L4
    vertebrae or on the dimensions of the foramen magnum or skull. In high-dose FEMALES the femur was
    NEGATIVE at minus 1 to minus 3 per cent'
  unit: millimetres and per cent change against control
  conditions: FDA review Table 55, 26-week juvenile NHP study, report BMN-111-11-035
  species: non_human_primate
  source_ref: fda_voxzogo_multidiscipline_review_2021
  uncertainty: 'THE AXIAL NULL IS THE IMPORTANT ROW AND IT IS A NULL IN A SMALL STUDY, so absence of
    effect is not proof of absence. It nonetheless CONTRADICTS the proportionate-growth reading round 203
    took from the human segment-ratio meta-analysis, and the two cannot both be quoted as established.
    The sex split triggers CORR-191'
- parameter: regional heterogeneity of the growth plate response within one plate
  value: tibial growth plate height in high-dose males - medial 1.17 to 1.20 mm (+3 per cent), lateral
    0.81 to 1.31 (+62 per cent, p less than 0.05), CENTRAL 0.17 to 0.87 (+412 per cent, p less than 0.05)
  unit: millimetres and per cent change
  conditions: same study and table
  species: non_human_primate
  source_ref: fda_voxzogo_multidiscipline_review_2021
  uncertainty: 'A FOURFOLD RANGE OF RESPONSE ACROSS ONE GROWTH PLATE. The central baseline is very small
