translation_risk: moderate
translation_risk_reason: 'The bone-age result transfers directly - it is the target population under the
  label dose. The primate site selectivity and the normal-animal NOAEL are the most transferable animal
  data in the file because the species is close and the animals were skeletally normal, which is the
  relevant comparison for a non-achondroplasia subject.'
confidence: B
claim_grades:
- claim: hedgehog agonism raises terminal hypertrophic cell height transiently, peaking at one month
  grade: B
  basis: author-deposited per-animal values, paired contralateral limbs, all animals moving the same way
    at one month in both bones, three timepoints; one study, one agent, rat
- claim: the observed range of terminal cell height across every agent in this atlas is about 1.0 to 1.4x
  grade: C
  basis: an enumeration across four agents in three species measured by different methods, not a
    measured ceiling; it bounds what has been seen, not what is possible
- claim: vosoritide does not accelerate bone age at the label dose
  grade: A
  basis: randomised, n = 61 against 60, bone age advancing less on drug than on placebo over 52 weeks,
    with a two-year extension at minus 0.05 years; qualified by a reviewer-flagged positive drift in the
    dose-ranging study at higher doses
- claim: vosoritide lengthens the appendicular skeleton but not the vertebrae in normal primates
  grade: C
  basis: one 26-week study with an explicit stated null on L1-L4 and on the skull, against significant
    tibial and humeral gains in high-dose males; small n, and a null is not proof of absence
- claim: a CNP-axis agent grows the body segments proportionately
  grade: D
  basis: DOWNGRADED THIS ROUND. The human meta-analytic segment ratio says proportionate; the primate
    site-resolved lengths say appendicular only. Both are quoted, neither is established
- claim: the dose-limiting toxicity of the CNP axis in normal animals is disordered overgrowth at or
    below the human clinical exposure
  grade: A
  basis: regulatory review with stated NOAELs and exposure multiples across four repeat-dose studies in
    two species
- claim: resveratrol moves pool, amplification, terminal cell height and duration together at multiple
    sites with a final length endpoint
  grade: C
  basis: one rabbit study with the full decomposition measured separately and a final-length endpoint;
    single study, single species, ovariectomised model, and the cell-term magnitudes are stated
    qualitatively in the text
