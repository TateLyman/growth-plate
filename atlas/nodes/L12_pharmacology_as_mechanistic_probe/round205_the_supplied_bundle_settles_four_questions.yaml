localization:
- 'the terminal hypertrophic cell, where the h_term gain appears at one month and is gone by two'
- 'the L1-L4 vertebrae and the skull, which did not respond to vosoritide in a primate'
- 'the central region of the tibial growth plate, which responded four times more than the medial'
human_evidence: direct
human_evidence_note: 'The bone-age result is randomised human (n = 61 against 60) and is the strongest
  human datum in this round. Everything else is rat, rabbit or non-human primate. The primate axial null
  and the rabbit four-term profile are the two results most likely to change the stack, and neither is
  human.'
