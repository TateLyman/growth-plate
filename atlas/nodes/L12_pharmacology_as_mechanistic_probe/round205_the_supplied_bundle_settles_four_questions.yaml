    of the TERMINAL HYPERTROPHIC CHONDROCYTE INCREASED, with oestradiol no different from control
  unit: micrometres, counts and areas
  conditions: karimian2013, pubertal ovariectomised New Zealand white rabbits, oral resveratrol 200
