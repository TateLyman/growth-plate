contradicts:
- 'UNDERMINES THE CAUSAL SENTENCE IN trompet2024 WITHOUT DISPUTING ITS DATA. The paper attributes its
  augmented growth plate height to raised terminal hypertrophic chondrocyte height. That is true at one
  month and false at two, while the length gain runs to six months. The sustained length is carried by
  something else, and the paper does not say what.'
- 'CONTRADICTS ROUND 203''S SITE FRAMING. Round 203 read the unchanged upper-to-lower segment ratio in
  four randomised trials as proportionate growth and called it favourable for a multi-site case. The
  primate study states no significant effect on L1-L4 vertebral length or on the skull. The two are
  reconcilable but not both established, and the claim is downgraded to D.'
- 'CONTRADICTS ROUND 203''S DOSING CONCLUSION IN PART. Round 203 found the human CNP dose-response
  near-linear with no efficacy ceiling and inferred the axis should be dosed hard. The regulatory package
  supplies a ceiling from the other direction - in SKELETALLY NORMAL animals the NOAEL is 0.08x to 0.2x
  the human exposure and the dose-limiting finding is growth plate dysplasia. Efficacy may be linear
  while the usable range is not.'
- 'RAISES rather than lowers karimian2013, which sits at grade D in a node titled "the untouched
  compound". On the evidence read in full this round it has the most complete term profile of any
  compound in the file. The barrier is human bioavailability, which is a delivery problem and not a
  biology problem, and the atlas has been treating it as though it were the latter.'
