localization:
  - "human diaphysis/metaphysis: regenerate bone forms in the distraction gap by intramembranous ossification, bypassing the growth plate"
human_evidence: direct
human_evidence_note: >-
  Meta-analysis of 14 studies and 1149 patients with achondroplasia reporting attained
  length gains, fixation times, complications and quality of life.
species_basis: [human]
translation_risk: not_applicable
translation_risk_reason: A human surgical intervention with human outcome data throughout.
confidence: A
claim_grades:
  - claim: Limb lengthening produces 7-9 cm of segmental gain per treated bone in achondroplasia.
    grade: A
    basis: Pooled meta-analysis of 1149 patients with narrow confidence intervals on the length outcomes.
  - claim: The complication rate is above 50%.
    grade: B
    basis: Pooled estimate 56.1% but with a 95% CI from 26.9 to 85.2, reflecting inconsistent complication definitions across studies.
  - claim: CNP analogues alter bone healing and callus consolidation during lengthening.
    grade: D
    basis: Based on animal fracture-healing data and reviewer synthesis; not demonstrated in treated patients undergoing lengthening.
