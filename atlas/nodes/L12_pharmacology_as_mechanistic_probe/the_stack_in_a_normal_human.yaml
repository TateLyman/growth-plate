- parameter: THE ACTUAL BLOCKER, NAMED — REMOVING EVERY BRAKE STILL STOPS YOU, AND A HUMAN PROVED IT
  value: 'herrmann2002. An oestrogen-deficient man, 170 cm at 14, CONTINUED TO GROW UNTIL AGE 24, and at
    presentation aged 27 and still untreated was 197 cm with an arm span of 204 cm, a bone age of 16, and
    a hand radiograph showing OPEN EPIPHYSES. GROWTH CEASED SPONTANEOUSLY AT 24 WHILE THE PLATES REMAINED
    ANATOMICALLY OPEN THREE YEARS LATER. Against him, the ESR1-null man whose receptor cannot be closed
    pharmacologically was 204 cm at 28 with incomplete closure and bone age advancing only 15 to 17.5 over
    3.5 years - at about 31 HIS plate had not run out.'
  unit: cm and years
  conditions: two men, different lesions - herrmann2002 aromatase deficiency with a spontaneous cessation
    history; the ESR1-null Smith propositus, right-censored and still growing
  species: human
  source_ref: herrmann2002
  uncertainty: 'THIS IS THE ANSWER TO WHAT STANDS BETWEEN ANY STACK AND A LARGE AMOUNT OF HEIGHT, AND IT IS
    NOT FUSION. Take a human, delete the oestrogen signal from birth, leave the plates anatomically open
    into the late twenties, and GROWTH STILL STOPS - at 24, at about 197 cm. THE PLATE EXHAUSTS ITSELF
    WHETHER OR NOT ANYTHING CLOSES IT. Every lever in this node is therefore rearranging a fixed budget.
    YIELD levers - FGFR3 blockade, CNP agonism - buy more centimetres per progenitor spent. DURATION
    levers - aromatase inhibition, the ESR1 lesion - stop the plate being closed. NEITHER ADDS A
    PROGENITOR, and the human ceiling of the duration lever taken to its natural extreme sits somewhere
    around 197 to 204 cm. THE CAVEATS ARE SEVERE AND THE NODE STATES THEM: the cessation age is a HISTORY
    STATEMENT in a case report and not a series of measurements, n = 1 for spontaneous cessation and n = 1
    for still-growing-at-31, and every other oestrogen-null man is right-censored because clinicians close
    them deliberately on diagnosis. So the ceiling is bracketed rather than measured. BUT THE DIRECTION IS
    NOT IN DOUBT AND IT SETS THE PRIORITY: arm 3 is not one of three options, IT IS THE ONLY ONE THAT
    MOVES THE CEILING RATHER THAN REDISTRIBUTING WITHIN IT. AND THE DEEPER SUPPRESSION RESULT AGREES FROM
    THE OTHER SIDE: letrozole gave lower oestradiol and slower bone age advance than anastrozole - exactly
    the intended profile - and produced NO predicted-height advantage, with the combined 3-year gain only
    +1.3 cm. More brake-removal did not buy more height, which is what a fixed budget predicts.'
- parameter: ARM 3 HAS THREE SEPARABLE CONTROL POINTS, NOT ONE — AND THE POOL IS BUILT POSTNATALLY RATHER THAN INHERITED
  value: 'newton2019, clonal genetic tracing with multicolour reporters: growth in the FETAL AND NEONATAL
