- parameter: NEWTON 2019 READ DIRECTLY — HEDGEHOG DOES NOT EXPAND THE POOL, mTORC1 DOES, AND NEITHER PAPER MEASURED A BONE
  value: 'HEDGEHOG. SAG (six doses P31-P34, analysed P35) INCREASED PROLIFERATION within the niche, and a
    single intra-articular injection accelerated it within 24 h - BUT DID NOT EXPAND THE CD73-POSITIVE
    DOMAIN (P = 0.3, n = 5 vehicle against n = 3 SAG), and NEITHER Shh stimulation NOR vismodegib NOR the
    GLI1 inhibitor GANT61 ALTERED THE NUMBER OF COLONY-FORMING UNITS of CD73+CD49e+ cells. Hedgehog
    changed the number of CELLS PER COLONY, not the number of colonies. Vismodegib reduced resting-zone
    clone size and CAUSED FUSION OF THE GROWTH PLATE while stem cells RETAINED CD73 - "the hedgehog
    pathway helps maintain the CYCLE of stem cells, but NOT their IDENTITY". mTORC1. Chondrocyte-specific
    Tsc1 ablation INCREASED THE HEIGHT OF THE CD73-POSITIVE ZONE (P = 0.0043), with PAR3 redistribution
    indicating a shift from asymmetric toward SYMMETRIC division - and NEITHER proliferation of
    chondroprogenitors NOR their recruitment into the proliferative layer changed detectably, while
    "clones in the resting zone grew gradually". Cilia above the columns were irregularly distributed,
    indicating loss of tissue polarisation. Separately, blocking SOC maturation with axitinib P18-P28
    REDUCED clone size - the niche is built by the SOC.'
