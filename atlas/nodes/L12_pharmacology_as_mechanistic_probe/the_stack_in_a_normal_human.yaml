  species: human
  source_ref: kim2025
  uncertainty: 'THE PATTERN IS THE FINDING AND IT IS NOT A COINCIDENCE. PTCH1, TSC1/TSC2, PTEN, DEPDC5 -
    every gene whose loss expands a skeletal progenitor compartment is a gene whose loss also causes
    cancer, because AN EXPANDABLE SELF-RENEWING PROGENITOR POOL IS WHAT A TUMOUR IS. The organism holds
    the pool in check with tumour suppressors, and arm 3 proposes to release exactly those brakes. That
    is why no pharmacological pool recruiter exists: not because nobody has looked, but because the
    obvious molecules are the ones oncology spends its effort BLOCKING - vismodegib against SMO,
    rapalogues against mTORC1. THIS IS THE ACTUAL BLOCKER BETWEEN ANY STACK AND A LARGE AMOUNT OF HEIGHT,
    AND IT IS DEEPER THAN A MISSING COMPOUND. IT IS NOT, HOWEVER, A DEAD END, AND THE SHAPE OF THE
    SOLUTION IS ALREADY VISIBLE IN trompet2024: TRANSIENT, LOCAL, SELF-LIMITING ACTIVATION. The Gli1-LacZ
    bead signal was gone by 3 WEEKS while the length divergence kept widening to 6 MONTHS, with no
    osteoarthritis - a pulse rather than a chronic state, delivered into one anatomical compartment.
    Chronic systemic activation of any of these nodes is not a candidate at any dose. THE CAVEATS ON THE
    HUMAN ARM ARE HEAVY: DEPDC5 is n = 1 of 37 and principally an epilepsy gene, PTEN overgrowth is
    GENERALISED somatic overgrowth with macrocephaly rather than a demonstrated growth-plate mechanism,
    and a syndromic cohort selects for pleiotropy. The tumour-suppressor pattern is robust; the height
    attribution to mTORC1 specifically is suggestive.'
localization:
- growth plate; the CNP arm acts on the hypertrophic zone and the FGFR3/GH arm on the proliferative zone
human_evidence: direct
human_evidence_note: The h_term arm has direct human evidence in a non-FGFR3 population (dauber2026) and
  the combination has direct human evidence in achondroplasia (mcdonnell2026). The zone separation that
  justifies combining is mouse. The within-cGMP non-additivity is mouse and rat. NO COMBINATION STUDY HAS
  REACHED FINAL HEIGHT in any population, which is the endpoint every claim here ultimately needs.
species_basis:
- human
- mouse
- rat
translation_risk: moderate
translation_risk_reason: The two human results are real and quantitative but are in disease populations
  over 12 months with velocity endpoints, and this atlas has established that velocity endpoints
  systematically fail to predict final height. The mechanistic sorting onto zones is mouse.
confidence: C
confidence_note: 'C. The individual results are solid and several are human, but this node is an
  ASSEMBLY and its central claim - that agents sort onto separable terms and should be stacked across
  them - is this atlas''s organising inference rather than anyone''s finding. It is not B because no
  study has measured final height on any combination, because the zone separation rests on two
  unrelated mouse models neither designed for the comparison, and because the within-cGMP non-additivity
  that carries the design rule is a pair of animal nulls one of which is abstract-only. It is not D
  because every input is a quantitative primary result and two of the load-bearing ones are human trials.'
