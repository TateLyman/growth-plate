id: the_stack_in_a_normal_human
name: What to give, in what order, and why stacking cGMP drugs fails — the assembled pharmacology
type: hypothesis
layer: L12
stub: false
summary: 'THIS IS A SYNTHESIS OF WHAT THIS ATLAS NOW HOLDS, ORGANISED BY WHICH TERM OF THE HEIGHT EQUATION
  EACH AGENT MOVES. Height is progenitors spent times micrometres obtained per progenitor, and the second
  factor is AMPLIFICATION (terminal cells per progenitor) times h_term (height per terminal cell). Agents
  sort cleanly onto those terms, and the sorting predicts which combinations work. THE h_term ARM IS THE
  CNP AXIS AND IT IS THE ONLY ONE WITH A PROVEN HUMAN BONE-AGE-SPARING EFFECT. nakao2015 shows the
  CNP/NPR2 axis partitions onto the HYPERTROPHIC zone - cartilage-specific Npr2 deletion takes the type X
  collagen layer to 23.0% of control while the non-hypertrophic layer falls only to 71.1%. dauber2026
  shows vosoritide raising velocity 4.0 SD in non-FGFR3 children with the bone-age-to-chronological-age
  ratio unmoved. THE AMPLIFICATION ARM IS FGFR3 INHIBITION AND GROWTH HORMONE, AND THE ZONE DATA SEPARATE
  IT FROM CNP: kot2026 reports infigratinib increasing femur length and PROLIFERATIVE-ZONE growth plate
  length. So the two drug classes act on different compartments, which is why they are candidates for
  combination rather than substitution. AND THE COMBINATION DATA EXIST: mcdonnell2026 (COACH, n=21) gave
  navepegritide plus lonapegsomatropin an LS-mean growth velocity of 8.69 cm/year against 5.95 for matched
  navepegritide monotherapy, a difference of 2.74 cm/year. NOW THE PART THAT MATTERS MOST FOR ANYONE
  DESIGNING A STACK, AND IT IS A NEGATIVE. YOU CANNOT STACK WITHIN THE cGMP NODE. hakata2024: the
  neprilysin inhibitor sacubitril produces 2-3% overgrowth in mice, abolished in cartilage-specific NPR-B
  knockout, and explicitly NOT ADDITIVE WITH CNP. wang2018: tadalafil raised peak CNP-stimulated cGMP by
  37% and tissue cGMP by 52% in rat epiphyseal chondrocytes AND DID NOT INCREASE LONG BONE LENGTH over
  three weeks. Two independent routes to more cGMP, two failures to convert it into bone. cGMP IS NOT THE
  LIMITING STEP once a CNP analogue is on board. THE DESIGN RULE THAT FOLLOWS: stack ACROSS terms, never
  within one. THE CEILING ON THE h_term ARM IS NOT EFFICACY, IT IS BLOOD PRESSURE. NPR2 is expressed in
  vasculature and hirai2026 names hypotension as the liability of systemic CNP distribution, which is why
  that group built a collagen-binding CNP that localises to cartilage. THAT IS THE CLEAREST UNMET
  COMPOUND NEED IN THIS ATLAS: a cartilage-restricted CNP would remove the dose ceiling on the one arm
  with proven bone-age-sparing effect.'
quantitative:
- parameter: ERDAFITINIB VERSUS VOSORITIDE, SETTLED ON HUMAN DATA — 19 CM/YEAR AGAINST 8, AND A SPINE
  value: 'ERDAFITINIB, one pre-pubescent boy on an oncology dose for FGFR1-mutated glioma: grew 14.3 cm in
    9 months, ANNUALISED 19.06 CM/YEAR, with serum GH, IGF-I, IGFBP-3 and testosterone all consistent with
    PRE-pubertal status, so the spurt was drug-driven and not pubertal. Height percentile rose from the
    16th-25th. Bone age 14.0 years at chronological age 16.2, more than 2 SD below the mean, and still
    delayed 15 months after stopping. THE CRANIAL VAULT, MEMBRANOUS BONE, WAS UNAFFECTED. Therapy was
    discontinued for severe kyphoscoliosis with SPINAL CORD COMPRESSION AND CERVICAL MYELOPATHY, plus hip
    flexor contractures; surgical correction was required. VOSORITIDE for comparison, 22 non-FGFR3
    children: 4.53 to 8.09 cm/year with the bone-age-to-chronological-age ratio unmoved'
  unit: cm/year, bone age years against chronological age
  conditions: erdachild2024, single case, erdafitinib at an oncology dose for 9 months; against dauber2026,
    phase 2 basket trial of vosoritide at a growth dose over 12 months
  species: human
  source_ref: erdachild2024
  uncertainty: 'THIS SETTLES THE COMPARISON ON EFFECT SIZE AND IT SETTLES IT IN ERDAFITINIB''S FAVOUR -
    19.06 cm/year is roughly 2.4 TIMES the on-treatment velocity vosoritide achieved and roughly DOUBLE
    peak pubertal velocity, in a child who was not in puberty. The bone age points the same way as
    vosoritide''s, only harder. SO THE INTUITION THAT FGFR INHIBITION IS THE MORE POWERFUL LEVER IS
    CORRECT AND THIS ATLAS SHOULD STOP HEDGING ON IT. WHAT IT DOES NOT SETTLE, AND THE GAPS ARE THE WHOLE
    DECISION. (a) N = 1, uncontrolled, on a cancer drug at a cancer dose, in a child with a glioma.
    (b) THERE WAS NO BASELINE BONE AGE - the paper says so explicitly - and a boy still pre-pubertal at
    15-16 with pre-pubertal endocrine values most likely had CONSTITUTIONAL DELAY, so the delayed bone age
    may be his baseline rather than a drug effect. That is the single weakest link in reading this as a
    yield signature. (c) NO FINAL HEIGHT: the drug was stopped at 9 months, so whether any of the 14.3 cm
    survives to adult height is unknown. (d) THE GROWTH WAS DISPROPORTIONATE, and that is mechanistically
    informative rather than incidental - the cranial vault was spared because it is membranous, so the
    drug acts only on endochondral bone and drives every endochondral plate at once, including the
    vertebral bodies, which is why the spine deformed. THE COST IS NOT A GENERIC TOXICITY, IT IS THE SAME
    GROWTH LANDING ON A STRUCTURE THAT CANNOT ABSORB IT, which is the identical failure class as the three
    slipped capital femoral epiphyses under vosoritide and is predicted by williams2001''s finding that a
    thicker growth plate is a mechanically weaker one. Cord compression is not a side effect to be traded
    against centimetres; it is a permanent neurological injury.'
- parameter: THE FGFR4 ARGUMENT WAS CHECKED IN HUMAN GROWTH PLATE AND IT LARGELY COLLAPSES
  value: 'GSE288028, four fresh human epiphysiodesis biopsies, per cent of cells with a detected
    transcript. BETA-KLOTHO (KLB), the obligate co-receptor for endocrine FGF signalling through FGFR4:
    0.77, 2.23, 0.20, 0.26 per cent - detected at the 1 per cent threshold in ONE donor of four. FGF19,
    the ligand: 0.00, 0.01, 0.00, 0.00 - ZERO of four. FGFR4 itself IS present: 4.97, 3.71, 24.78, 6.01,
    four of four. For scale, FGFR1 23.23-43.34 (4/4), FGFR3 9.71-91.35 (4/4), FGFR2 5.59-9.51 (4/4),
    COL2A1 52.48-100'
  unit: per cent of cells with detected transcript
  conditions: RE-ANALYSIS BY THIS ATLAS of the four directly-processed fresh human samples of GSE288028
    (Chagin/Savendahl); donors are adolescents undergoing epiphysiodesis to prevent idiopathic TALL
    stature, so the tissue is selected for growing too much
  species: human
  source_ref: fgf19cart2025
  value_unverified: true
  uncertainty: 'THIS WAS THE CHEAPEST CHECK THAT COULD KILL THE FGFR4 CASE AND IT LARGELY DOES, IN THE
    SPECIFIC FORM THE CASE WAS MADE. The mechanism imported from fgf19cart2025 is FGF19 acting through
    FGFR4 WITH BETA-KLOTHO. In human growth plate the ligand is absent and the obligate co-receptor is
    essentially absent, and FGF19 is an ENDOCRINE FGF made in the ileum - so the endocrine route is closed
    from both ends, since circulating FGF19 cannot signal without KLB in the target tissue. The
    therapeutic inference that FGFR4 inhibition adds growth loses its stated mechanism. WHAT SURVIVES, AND
    IT IS NOT NOTHING: FGFR4 is expressed in every donor and reaches 24.78 per cent in donor3, which is
    the most chondrocyte-pure and hypertrophic-rich sample (COL2A1 100 per cent, COL10A1 94.11), so FGFR4
    sits in hypertrophic chondrocytes and could signal through PARACRINE FGFs, which do not require KLB.
    FGF2 is present in all four donors. So FGFR4 may still do something in cartilage - but not the thing
    this atlas claimed, and no FGFR4 loss-of-function skeletal phenotype could be located to settle it.
    LIMITS OF THE CHECK ITSELF: transcript detection in droplet scRNA-seq is sparse and a 1 per cent
    threshold is arbitrary; low detection is weak evidence of absence and protein can exist below it; four
    donors, all selected for tall stature; and KLB at 2.23 per cent in donor2 is not zero.'
- parameter: THE RECRUITER MAY EXIST — A HEDGEHOG AGONIST DELIVERED INTO CARTILAGE LENGTHENED BONE
  value: 'CT-CM-NPs - nanoparticles coated with primary chondrocyte membranes and modified with the
    collagen-II-binding peptide WYRGRL - delivered the HEDGEHOG AGONIST PURMORPHAMINE to growth plate
    cartilage in a hypochondroplasia mouse model, upregulating Hedgehog signalling, restoring impaired
    ciliogenesis, improving chondrocyte phenotypes and INCREASING BONE AND BODY LENGTH. The authors state
    plainly that the AVASCULAR AND ALYMPHATIC nature of growth plate cartilage severely limits drug
    delivery and accumulation. In human growth plate this atlas measured GLI1 detected in 3.04-8.11 per
    cent of cells and PTCH1 in 11.12-83.53 per cent, both four of four donors, and PDGFRA in 12.46-41.31
    per cent, four of four'
  unit: qualitative plus per cent of cells with detected transcript
  conditions: ye2026, Fgfr3 hypochondroplasia mouse model, systemic administration; expression from
    this atlas's re-analysis of the four fresh human samples of GSE288028
  species: mouse
  source_ref: ye2026
  uncertainty: 'THIS IS THE CLOSEST THING TO THE RECRUITER THIS ATLAS SAID DID NOT EXIST, AND IT ALSO
    ANSWERS THE DELIVERY QUESTION, SO IT IS RECORDED DESPITE A DIRECT CONFLICT WITH SOMETHING THE ATLAS
    ALREADY HOLDS. The reservoir qu2025 identifies is GLI1-POSITIVE, GLI1 is the Hedgehog transcriptional
    effector, and purmorphamine is a Smoothened agonist - so pharmacological Hedgehog activation is a
    mechanistically direct candidate for recruiting it, and here it lengthened bone. The human expression
    check supports translation: GLI1, PTCH1 and PDGFRA are all detected in every donor, so the pathway and
    the reservoir markers are present in human growth plate rather than being a mouse construct.
    THE CONFLICT IS SERIOUS AND IS NOT RESOLVED. orikasa2024, which this atlas holds, deleted Ptch1 in
    PTHrP+ resting chondrocytes - constitutive Hedgehog activation in exactly the resting compartment -
    and got growth plate hyperplasia with NO SIGNIFICANT BONE LENGTH CHANGE, transient hyperplasia, and
    descendants converting to trabecular osteoblasts. Constitutive genetic Hedgehog activation in resting
    chondrocytes did not lengthen bone; transient pharmacological Hedgehog activation delivered to whole
    cartilage did. The differences that might reconcile them - transient against constitutive,
    whole-plate against PTHrP-restricted, hypochondroplasia model against wild type - are exactly the
    variables nobody has separated. FURTHER LIMITS: this is a DISEASE model where Hedgehog and
    ciliogenesis are impaired at baseline, so restoring a deficit is not the same as pushing a normal
    plate above normal; it is a materials paper whose endpoint is a delivery demonstration; and no resting
    zone cell counts were made, so whether the added length came from recruiting the reservoir or from
    something else is not established.'
- parameter: GATED ON CHONDROCYTES — FGFR1 IS REAL, FGFR4 IS CHONDROCYTE-EXCLUSIVE, AND KLB IS STILL ABSENT
  value: 'per cent of cells with detected transcript, CHONDROCYTE-GATED (COL2A1>0 AND ACAN>0) against
    NON-chondrocyte cells in the same sample, four donors. FGFR1 49.57/29.47/36.49/67.05 gated against
    32.52/21.14/29.55/36.27 ungated-remainder - HIGHER IN CHONDROCYTES IN EVERY DONOR. FGFR4
    11.52/12.68/24.90/25.00 gated against 0.29/0.71/0.00/0.34 non-chondrocyte - a 35- to 80-fold
    enrichment, essentially CHONDROCYTE-EXCLUSIVE. KLB 1.00/2.50/0.20/0.00 gated - still absent.
    Chondrocyte fraction of each sample: 41.6, 25.0, 99.5, 23.0 per cent'
  unit: per cent of cells with detected transcript, by gate
  conditions: RE-ANALYSIS BY THIS ATLAS of GSE288028 four fresh human samples, gating on COL2A1 and ACAN
    co-detection to exclude perichondrial, periosteal and haematopoietic cells that a needle biopsy
    inevitably contains
  species: human
  source_ref: wu2012
  value_unverified: true
  uncertainty: 'THIS GATE WAS RUN BECAUSE delezoide1998 REPORTS THE OPPOSITE - that in human embryo-fetal
    long bones FGFR1 and FGFR2 are RESTRICTED TO PERICHONDRIUM AND PERIOSTEUM, with only FGFR3 in growth
    plate chondrocytes. If that held in adolescent tissue, the FGFR1 abundance reported one round ago was
    contaminating non-cartilage cells and the finding was an artefact. IT IS NOT: FGFR1 is HIGHER inside
    the chondrocyte gate than outside it in all four donors. The reconciliation is developmental stage -
    delezoide1998 is embryo-fetal in situ hybridisation, this is adolescent tissue - and the atlas should
    carry both rather than choosing. AND THE GATE PRODUCED A RESULT I DID NOT EXPECT: FGFR4 is
    essentially CHONDROCYTE-EXCLUSIVE, 35- to 80-fold enriched inside the gate, which makes it a more
    specifically cartilage receptor than FGFR1 or FGFR3. That STRENGTHENS FGFR4 as a target while leaving
    the mechanism this atlas proposed for it dead, since KLB remains absent even among chondrocytes. So
    FGFR4 in human cartilage must signal through PARACRINE FGFs, which require no klotho. LIMITS: a
    COL2A1-and-ACAN gate is crude and will exclude resting-zone cells, which avijgan2026br established
    have the lowest mRNA content of any zone - so the gated fractions are biased toward proliferative and
    hypertrophic cells. Donor3 is 99.5 per cent chondrocyte and donor4 has only 88 gated cells.'
- parameter: AND THE ATLAS ALREADY HELD THE FGFR1 DIRECTION — DELETION DELAYS HYPERTROPHIC MATURATION
  value: Fgfr1 deletion in the osteo-chondrogenic lineage DELAYS HYPERTROPHIC CHONDROCYTE MATURATION and
    alters osteoblast differentiation. Separately, FGF21 with FGFR1 and beta-klotho is expressed in MOUSE
    growth plate chondrocytes, where FGF21 blocks growth hormone action and reduces GH binding directly at
    the plate
  unit: qualitative, direction
  conditions: jacob2006, conditional Fgfr1 deletion in the osteo-chondrogenic lineage, mouse - ABSTRACT
    ONLY in this atlas; wu2012, mouse growth plate chondrocytes
  species: mouse
  source_ref: jacob2006
  uncertainty: 'THE DIRECTION IS THE ONE THIS ATLAS PREDICTED FROM ZONE LOCATION AND IT WAS SITTING IN THE
    BIBLIOGRAPHY UNEXTRACTED. Last round proposed that if FGFR1 restrains terminal differentiation then
    blocking it would prolong or enlarge the terminal cell, moving FGFR1 from the liability column into
    the h_term column. jacob2006 reports exactly that deletion delays hypertrophic maturation. IF THAT
    TRANSLATES, FGFR1 INHIBITION IS PRO-h_term AND ERDAFITINIB IS THE MOST POTENT FGFR1 INHIBITOR
    AVAILABLE (1.20 nM), WHICH WOULD MAKE ITS SUPPOSED MAIN LIABILITY A THIRD THERAPEUTIC ACTION.
    THE CASE IS NOT MADE AND FOUR THINGS STAND AGAINST IT. (a) jacob2006 is ABSTRACT ONLY here, the
    deletion is in the whole osteo-chondrogenic lineage rather than chondrocyte-restricted, and NO BONE
    LENGTH OR TERMINAL CELL HEIGHT IS RECORDED - delayed maturation is not the same as a longer bone, and
    could equally produce a disorganised plate. (b) wu2012''s FGF21 mechanism REQUIRES beta-klotho, and
    this atlas has now measured KLB as essentially absent from human growth plate chondrocytes while
    wu2012 finds it present in mouse - so the FGF21 growth-inhibition route may be MOUSE-SPECIFIC and
    blocking it in humans may buy nothing. (c) FGF23 signalling through FGFR1 with ALPHA-klotho in kidney
    is what produces hyperphosphatemia, and that liability is on the SAME receptor as any benefit, so the
    two are inseparable pharmacologically and separable only by delivery. (d) The plate widening observed
    under erdafitinib (erdaseries2025) is what delayed hypertrophic maturation would look like, and it is
    also what precedes the mechanical failure.'
- parameter: AND THE SAME CHECK SAYS FGFR1 IS THE MOST ABUNDANT FGFR IN HUMAN GROWTH PLATE
  value: FGFR1 detected in 23.23-43.34 per cent of cells in all four donors, above FGFR3 in three of the
    four (9.71, 23.59, 26.63 against FGFR1's 23.23-43.34; donor3 is the exception at FGFR3 91.35)
  unit: per cent of cells with detected transcript
  conditions: same four fresh human samples of GSE288028
  species: human
  source_ref: fgf19cart2025
  value_unverified: true
  uncertainty: 'THIS COMPLICATES THE FGFR1 STORY IN A DIRECTION THE ATLAS HAD NOT CONSIDERED. FGFR1
    blockade has been treated here purely as a SYSTEMIC liability acting through FGF23 and phosphate. But
    FGFR1 is the most widely detected FGFR in the human growth plate itself, so inhibiting it is also a
    LOCAL action on the tissue being targeted, and this atlas holds no direction for that effect - it
    could be pro-growth, anti-growth or neutral. PROPEL3 reports no clinical evidence of FGFR1 inhibition
    at 0.25 mg/kg infigratinib, which bounds the systemic effect but says nothing about what would happen
    locally at a higher dose. THE HONEST POSITION IS THAT THE SIGN OF LOCAL FGFR1 INHIBITION IN THE GROWTH
    PLATE IS UNKNOWN, and that is a gap rather than a caveat, because every argument this atlas has made
    for or against a pan-FGFR agent has assumed it away.'
- parameter: THE FGFR RECEPTORS ARE NOT ONE TARGET — FGFR4 INHIBITION SHOULD ALSO BE PRO-GROWTH
  value: 'FGF19 signalling through FGFR4 with beta-klotho IMPAIRS chondrocyte maturation neonatally and
    DECREASES GROWTH PLATE THICKNESS in adolescent plates, by upregulating the beta-catenin antagonists
    SFRP1, WIF1 and DKK2 and thereby downregulating Wnt/beta-catenin. FGFR4 IC50: erdafitinib 5.70 nM
    against infigratinib 61.00 nM, a 10.7-fold difference'
  unit: direction of effect; IC50 in nM
  conditions: fgf19cart2025, ex vivo metatarsal organ culture for nascent cartilage and AAV-FGF19
    overexpression for adolescent growth plates; IC50 medians from ChEMBL curated activities
  species: mouse
  source_ref: fgf19cart2025
  uncertainty: 'THIS REVERSES THE ARGUMENT THIS NODE PREVIOUSLY MADE AGAINST ERDAFITINIB AND IT SHOULD BE
    SAID PLAINLY. This atlas called erdafitinib''s 10.7-fold greater FGFR4 potency a pure liability with no
    growth-plate benefit. IT IS THE OPPOSITE: FGFR4 signalling RESTRAINS cartilage growth, so inhibiting
    FGFR4 should ADD to growth, and erdafitinib is the only clinically available FGFR inhibitor that
    engages FGFR4 at achievable concentrations. ERDAFITINIB THEREFORE HAS TWO PRO-GROWTH TARGETS AND NOT
    ONE. AND THE CONVERGENCE IS SHARPER THAN THAT. The antagonists FGF19/FGFR4 induces - SFRP1, WIF1, DKK2 -
    are the SAME Wnt-antagonist axis that lui2018 found separating fast-senescing from slow-senescing
    bones, where the phalanx carries high Wif1 (+2.08/+3.12) and Dkk3 (+2.51/+1.66). So FGFR4 inhibition
    would push a plate along the axis that distinguishes an early-fusing bone from a late-fusing one.
    THE COUNTER-ARGUMENT IS REAL AND IS THE DOSING ORDER. Erdafitinib inhibits FGFR1 at 1.20 nM, FGFR3 at
    3.00 and FGFR4 at 5.70, so as the dose falls FGFR4 engagement is lost FIRST and FGFR1 engagement lost
    LAST. The selectivity ordering is exactly wrong for dosing down, and there is no dose at which
    erdafitinib gives FGFR3 plus FGFR4 without maximal FGFR1. LIMITS: fgf19cart2025 is mouse, uses AAV
    overexpression and organ culture rather than FGFR4 loss of function, and FGF19 has metabolic actions
    that could act on cartilage indirectly. No FGFR4 knockout growth-plate phenotype is held by this atlas.'
- parameter: AND FGFR1 ENGAGEMENT IS DOSE-SEPARABLE IN PRACTICE — THE PHOSPHATE READOUT IS A BOUNDARY MARKER
  value: 'PROPEL3, oral infigratinib 0.25 mg/kg/day in achondroplasia, n=74 against 39 placebo: annualised
    height velocity 4.28 to 5.75 cm/year against placebo 4.57 to 3.95; LS mean difference +1.74 cm/year
    (95% CI 1.31-2.17), P < 0.0001. NO ACCELERATED PROGRESSION OF BONE AGE and no negative change in bone
    mineral density. AND NO EVIDENCE OF FGFR1 OR FGFR2 INHIBITION - no corneal or retinal adverse events'
  unit: cm/year
  conditions: propel3_2026, randomised placebo-controlled phase 3, 52 weeks, children with achondroplasia
  species: human
  source_ref: propel3_2026
  uncertainty: 'TWO FINDINGS AND THE FIRST ONE BREAKS A TEST THIS ATLAS DESIGNED. Round 29 proposed that
    height gained WITHOUT bone-age advance would separate a yield lever from a velocity lever, and asked
    for exactly this trial to contrast against vosoritide. BOTH DRUGS PASS. Vosoritide moved velocity 4.0
    SD with the bone-age ratio unmoved; infigratinib gives +1.74 cm/year with no accelerated bone age. THE
    DISCRIMINATOR DOES NOT DISCRIMINATE, and the atlas should stop presenting it as decisive - it is a
    necessary condition that both candidates satisfy, not a test that separates them. SECOND, AND MORE
    USEFUL: FGFR1 AND FGFR2 ENGAGEMENT IS SEPARABLE BY DOSE. At 0.25 mg/kg infigratinib produced a real
    growth effect with no clinical sign of FGFR1 or FGFR2 inhibition, so the selectivity that matters is
    achieved by DOSE rather than by molecule. THAT IS THE OPENING FOR ERDAFITINIB the biochemistry seemed
    to close: its hyperphosphatemia is a direct, real-time, on-target readout of FGFR1 engagement, so it is
    the one FGFR inhibitor whose FGFR1 boundary can be titrated against a same-day biomarker. Dosing to
    just below the phosphate threshold is the specific untested proposal. THE CAVEAT REMAINS THE ORDERING -
    erdafitinib engages FGFR1 more potently than FGFR3, so a phosphate-guided dose may leave little FGFR3
    occupancy - and this is a conference presentation, not a peer-reviewed paper, in achondroplasia rather
    than normal physiology, with absence of adverse events standing in for absence of target engagement.'
- parameter: THE OPTIMAL STACK WITH SAFETY SET ASIDE — FOUR ARMS, AND GROWTH HORMONE IS DELIBERATELY EXCLUDED
  value: 'ARM 1, h_term: a CNP analogue at maximum tolerated exposure, navepegritide weekly in preference
    to daily vosoritide. ARM 2, amplification: an FGFR3-SELECTIVE inhibitor rather than a pan-FGFR one -
    TYRA-300 increased nasoanal, tibial and femoral length IN WILD-TYPE MICE, not only in FGFR3-mutant
    models, and raised both proliferation and differentiation. ARM 3, pool: recruitment of the external
    reservoir, since qu2025 shows Gli1+ progenitors expand into the resting zone and restore growth when
    the cartilage is damaged, sourced from Pdgfra+ cells OUTSIDE the cartilage. ARM 4, duration: aromatase
    inhibition to hold the pubertal clock, which is REQUIRED if arm 3 is run as charge-discharge cycling
    because the charge phase spends calendar against a deadline that does not pause. EXCLUDED: GROWTH
    HORMONE'
  unit: qualitative, agents by term
  conditions: assembled by this atlas from the terms of the height equation; no combination beyond CNP plus
    growth hormone has ever been co-administered in any species
  species: human
  source_ref: tyra300_2025
  value_unverified: true
  uncertainty: 'THIS IS A DESIGN, NOT A RESULT, AND NO TWO OF THESE ARMS HAVE EVER BEEN GIVEN TOGETHER
    EXCEPT CNP PLUS GROWTH HORMONE. THE EXCLUSION OF GROWTH HORMONE IS THE LEAST OBVIOUS PART AND IS THE
    ONE MOST LIKELY TO BE WRONG, so the reasoning is stated in full. GH is additive on VELOCITY -
    mcdonnell2026 got 8.69 against 5.95 cm/year adding lonapegsomatropin to navepegritide. But GH raises
    IGF-1, and oichi2023 shows IGF-1 restores resting-zone phospho-Akt and DRIVES POOLED PROGENITORS OUT
    OF THE POOL, decreasing their number; chu2025 independently shows GH depleting the slow-cycling pool
    while raising elongation rate. So GH spends the budget to buy rate, which is precisely the mechanism
    that makes the KIGS dose-response saturate on final height - a 43% higher dose bought first-year
    velocity and nothing at near-adult height. GH THEREFORE BELONGS IN A VELOCITY-OPTIMAL STACK AND NOT IN
    A FINAL-HEIGHT-OPTIMAL ONE, and it is actively antagonistic to arm 3. If final height is not the
    objective, put it back. THE FGFR3-SELECTIVE CHOICE IS BETTER SUPPORTED. Erdafitinib is the more potent
    molecule (FGFR3 3.0 nM against infigratinib 10.0) and produced 19.06 cm/year in a child, but it
    inhibits FGFR1 HARDER than FGFR3, and FGFR1 blockade raises phosphate through FGF23 - and this atlas
    holds that normal phosphate is REQUIRED for caspase-9-mediated apoptosis of terminal hypertrophic
    chondrocytes, the very cell arm 1 is trying to enlarge. A selective FGFR3 inhibitor removes that
    conflict, and TYRA-300 is the first with wild-type growth data. If a pan-FGFR agent is used anyway, a
    phosphate binder is a rational adjunct and is untested. ARM 3 IS THE WEAKEST AND THE MOST IMPORTANT:
    qu2025 recruits the reservoir with genetic cell-cycle arrest, which is not a therapy, and no
    pharmacological recruiter exists.'
- parameter: AND THE MECHANISM OF THE SHARED TOXICITY IS NOW OBSERVED DIRECTLY — THE PLATE WIDENS
  value: erdafitinib produced growth acceleration INDEPENDENT of sex steroids and of IGF1 levels in
    heavily pretreated paediatric CNS-tumour patients with severe pre-existing growth impairment,
    accompanied by A DISTINCT WIDENING OF THE GROWTH PLATE and enhanced metaphyseal mineralization shortly
    after starting therapy
  unit: qualitative, radiographic
  conditions: erdaseries2025, retrospective series of compassionate-use erdafitinib in paediatric CNS
    tumours
  species: human
  source_ref: erdaseries2025
  uncertainty: 'THE WIDENING IS THE MISSING LINK IN THE TOXICITY ARGUMENT AND IT IS NOW OBSERVED RATHER
    THAN INFERRED. williams2001 measured that ultimate tensile stress falls linearly with plate thickness
    (3.2 - 2.8 x thickness mm, R-squared 0.55, P < 0.0001); erdaseries2025 reports the plate visibly
    widening under an FGFR inhibitor; erdachild2024 reports the resulting kyphoscoliosis and cord
    compression. Three independent observations that close the loop from drug to mechanical failure.
    IT ALSO COMPLICATES THE MECHANISM STORY FROM erdachild2024, which posited IGF-I sustaining AKT as a
    contributor - here the acceleration was explicitly INDEPENDENT OF IGF1 LEVELS. Circulating IGF1 is not
    the same as local IGF-I signalling and the two papers are not strictly in conflict, but the atlas
    should not carry the IGF-I account as settled. LIMITS: retrospective, heavily pretreated
    neuro-oncology children whose severe baseline growth impairment makes catch-up an alternative
    explanation for part of the acceleration, and no bone ages reported here.'
- parameter: THE VERDICT — FGFR3 WINS ON VELOCITY, THE CNP AXIS WINS ON ADULT HEIGHT, AND THE MORBIDITY IS THE SAME
  value: 'LIFELONG FGFR3 PARTIAL LOSS (CATSHL, heterozygous p.R621H, 27 affected in one kindred): adult
    height in MALES mean 77 inches = 195.6 cm, about +2.8 SD, above the 97th centile in 5 of 5; FEMALES
    mean 70 inches = 177.8 cm, about +2.3 SD. LIFELONG CNP-AXIS GAIN: NPR2 activating 221 cm (+5.2 SD),
    NPR3 biallelic loss 211.1 cm (+4.9 SD) - AND BOTH WERE TRUNCATED BY EPIPHYSIODESIS, so those are
    floors. ACUTE VELOCITY runs the other way: erdafitinib 19.06 cm/year against vosoritide 8.09'
  unit: cm and SD at adult height; cm/year on treatment
  conditions: toydemir2006 against hannema2013 and moffatt2025; erdachild2024 against dauber2026. SD
    conversions are this atlas's, using adult means of about 176 cm (SD 7) for men and 163 cm (SD 6.5) for
    women, and are approximate
  species: human
  source_ref: toydemir2006
  value_unverified: true
  uncertainty: 'THIS IS THE CLEANEST UNBIASED COMPARISON AVAILABLE AND IT SPLITS THE DECISION RATHER THAN
    SETTLING IT ONE WAY. Pushed for a lifetime, the CNP axis delivers roughly TWO MORE STANDARD DEVIATIONS
    of adult height than partial FGFR3 loss, and the CNP figures are UNDERESTIMATES because both
    individuals were surgically stopped. Pushed acutely, FGFR inhibition delivers more than twice the
    velocity. THAT IS EXACTLY THE VELOCITY-VERSUS-YIELD DISTINCTION THIS ATLAS IS BUILT ON, now with
    matched human genetics at both extremes: the bigger velocity lever converts to less adult height.
    THE OBJECTION THAT MUST BE STATED, AND IT IS STRONG: CATSHL IS PARTIAL, HETEROZYGOUS LOSS. It bounds
    partial FGFR3 inhibition, NOT maximal - a complete human FGFR3 null is not on record and the
    Fgfr3-null mouse overgrows more. So this comparison does not exclude the possibility that harder FGFR3
    inhibition beats the CNP ceiling, and the erdafitinib case is direct evidence that harder inhibition
    is achievable. Also n = 5 men against n = 1 per CNP genotype, different kindreds, different
    ascertainment, and the SD conversions are this atlas''s arithmetic on assumed population parameters.
    AND THE MOST IMPORTANT THING THIS ROW ESTABLISHES IS NOT ABOUT HEIGHT AT ALL. SCOLIOSIS IS IN THE NAME
    OF THE FGFR3 SYNDROME, the NPR3 patient needed spinal fusion at 12 for a 39-degree Cobb angle, the
    NPR2 family had severe scoliosis with vertebral fractures, and the erdafitinib child developed
    kyphoscoliosis with cord compression. EVERY ROUTE TO EXTREME ENDOCHONDRAL GROWTH PRODUCES SPINAL
    DEFORMITY, on both axes, genetic and pharmacological alike. So spinal morbidity is NOT a
    differentiator between the two drugs and cannot be used to prefer one; it is the shared cost of the
    growth itself, and it is what williams2001 predicts when a plate is driven thicker.'
- parameter: AND THE MECHANISM SEPARATES THE TWO DRUGS AT THE SIGNALLING LEVEL
  value: in the patient's own fibroblasts, erdafitinib at 100 nM dramatically reduced both phospho-ERK1/2
    and phospho-AKT with no further reduction at 200 or 300 nM. IGF-I re-activated AKT (both T308 and S473)
    at every erdafitinib concentration and sustained it for 48 hours, but did NOT re-activate ERK1/2;
    neither did FGF2 or IGF-2
  unit: qualitative, phosphorylation state
  conditions: primary dermal fibroblasts from the patient, serum-starved, erdafitinib 100-300 nM with IGF-I,
    IGF-2 or FGF2; fibroblasts used as a surrogate because chondrocytes were unavailable
  species: human
  source_ref: erdachild2024
  uncertainty: 'THE SIGNALLING PICTURE EXPLAINS WHY FGFR INHIBITION IS THE BIGGER LEVER AND WHY IT IS THE
    LESS CONTROLLED ONE. Erdafitinib removes the ERK brake permanently - IGF-I cannot restore ERK - while
    IGF-I keeps the AKT survival arm running independently of FGFR. So the cell gets sustained
    pro-survival signalling with the differentiation brake off, which is a recipe for accumulation rather
    than for a regulated increase in output. A CNP analogue by contrast raises cGMP, which INHIBITS the
    same ERK branch, but does not touch AKT and does not remove the receptor. FIBROBLASTS ARE NOT
    CHONDROCYTES and the authors say so - they used them because chondrocytes were unavailable - so the
    entire mechanistic account is a surrogate, and the atlas should treat it as a hypothesis about the
    growth plate rather than a measurement in it.'
- parameter: THE TWO DRUG CLASSES ACT ON DIFFERENT ZONES — WHICH IS WHY THEY COMBINE
  value: 'CNP/NPR2 arm partitions onto HYPERTROPHY - cartilage-specific Npr2 deletion reduces the type X
    collagen-positive layer to 23.0% of control while the non-hypertrophic layer falls only to 71.1%,
    with femur 45.3% and tibia 54.6% of control length. FGFR3 arm acts on PROLIFERATION - infigratinib
    increased femur length and PROLIFERATIVE-ZONE growth plate length with reduced phospho-ERK1/2'
  unit: per cent of control layer thickness; zone identity
  conditions: nakao2015, cartilage-specific Npr2 knockout mouse at 10 weeks; kot2026, infigratinib in
    Aga2/+ osteogenesis imperfecta mice
  species: mouse
  source_ref: nakao2015
  uncertainty: 'THE ZONE SEPARATION IS THE MECHANISTIC BASIS FOR COMBINING RATHER THAN CHOOSING, and it is
    assembled from two different studies in two different mouse models, neither designed to make this
    comparison. The Npr2 partition is a LOSS-of-function readout being used to infer where GAIN would act,
    which is not guaranteed to be symmetric. kot2026 is an osteogenesis imperfecta model and reported
    REDUCED male trabecular bone alongside the length gain, so the FGFR3 arm is not clean. No study has
    given both agents to one animal and measured zone thicknesses.'
- parameter: AND THE COMBINATION IS ADDITIVE IN HUMANS
  value: LS-mean annualised growth velocity 8.69 cm/year on navepegritide plus lonapegsomatropin against
    5.95 cm/year for matched navepegritide monotherapy, a difference of 2.74 cm/year
  unit: cm/year
  conditions: mcdonnell2026, COACH phase 2, n = 21, children with achondroplasia
  species: human
  source_ref: mcdonnell2026
  uncertainty: 'A LARGE ADDITIVE EFFECT ON TOP OF AN ALREADY-ACTIVE CNP ANALOGUE, which is the strongest
    available support for the across-terms design rule. But n = 21, phase 2, achondroplasia rather than
    normal physiology, matched-cohort rather than randomised comparison, and growth hormone is an
    amplification agent whose own dose-response is known to SATURATE on final height - so an additive
    first-year velocity gain does not establish an additive FINAL HEIGHT gain, which is the only endpoint
    that matters and which no combination study has reached.'
- parameter: THE STACKING RULE WAS TOO CRUDE — YOU CAN STACK WITHIN THE PATHWAY, AT A DIFFERENT CONTROL POINT
  value: 'LB-100, a phosphatase inhibitor that opposes FGF-induced DEPHOSPHORYLATION OF NPR2, is ADDITIVE
    with BMN-111 (vosoritide) in cultured Fgfr3-Y367C/+ femurs. Growth ratio against untreated: LB-100
    alone 1.30; COMBINATION 2.06 - elongation 16 per cent greater than BMN-111 alone. Bone-and-cartilage
    area: LB-100 1.40, BMN-111 1.51, COMBINATION 1.93 - 27 per cent greater than BMN-111 alone. AND THE
    MEASUREMENT THAT MATTERS MOST TO THIS ATLAS: mean HYPERTROPHIC CELL AREA was 32 PER CENT GREATER with
    the combination than with BMN-111 alone, and similar to wild-type'
  unit: growth ratio against untreated; per cent over monotherapy
  conditions: shuhaibar2021, E16.5 Fgfr3-Y367C/+ mouse femurs cultured 6 days, LB-100 10 microM and
    BMN-111 0.1 microM, n = 5-10 bones per condition
  species: mouse
  source_ref: shuhaibar2021
  uncertainty: 'THIS FORCES A REFINEMENT OF THIS NODE''S OWN DESIGN RULE. The rule said stack ACROSS terms,
    never within one, on the strength of two failures - sacubitril not additive with CNP (hakata2024) and
    tadalafil raising cGMP 37-52 per cent without lengthening bone (wang2018). BOTH OF THOSE ADD cGMP.
    LB-100 does something different: it keeps NPR2 PHOSPHORYLATED so the receptor can still respond, which
    is a control point UPSTREAM of cGMP production rather than a second source of it. THE CORRECTED RULE IS
    THEREFORE NOT "never within a pathway" BUT "never at the same control point" - cGMP concentration is
    saturable once a CNP analogue is aboard, receptor RESPONSIVENESS is not. That is a materially different
    and more useful rule, and it opens a combination the previous rule would have forbidden. AND THE
    HYPERTROPHIC CELL AREA RESULT IS THE FIRST DIRECT SUPPORT THIS ATLAS HAS FOR ITS OWN h_term THESIS IN
    THE PRODUCTIVE DIRECTION - cell size up 32 per cent AND bone length up, together, in the same
    preparation. LIMITS: cultured embryonic femurs over six days, an achondroplasia model where NPR2 is
    pathologically dephosphorylated by excess FGFR3 so LB-100 is CORRECTING A DEFICIT rather than pushing a
    normal plate, LB-100 is a broad PP2A-family phosphatase inhibitor with an oncology safety profile of
    its own, and no whole-animal or length-to-maturity data.'
- parameter: BUT YOU CANNOT STACK WITHIN cGMP — TWO INDEPENDENT ROUTES BOTH FAIL
  value: 'NEPRILYSIN INHIBITION: sacubitril gives dose-dependent 2-3% naso-anal overgrowth in mice,
    abolished in cartilage-specific NPR-B knockout (P = 0.392), NOT ADDITIVE WITH CNP, and effective only
    in a narrow window at 3-4 weeks (99% of control at 4-5 weeks, P = 0.717). PDE5 INHIBITION: tadalafil
    raised peak CNP-stimulated cGMP by 37% and tissue cGMP by 52% in newborn rat epiphyseal chondrocytes
    and DID NOT INCREASE rat long bone length over three weeks'
  unit: per cent overgrowth; per cent cGMP increase
  conditions: hakata2024, mouse, sacubitril; wang2018, rat epiphyseal chondrocytes and long bone, tadalafil
  species: mouse
  source_ref: hakata2024
  uncertainty: 'THE MOST USEFUL NEGATIVE IN THIS NODE AND THE ONE MOST LIKELY TO BE IGNORED BY ANYONE
    ASSEMBLING A REGIMEN. Two mechanistically independent ways of raising the same second messenger -
    blocking its ligand''s degradation and blocking its own hydrolysis - and neither converts into bone
    length when a CNP analogue is already acting. The natural reading is that cGMP is not the limiting
    step downstream of an adequate CNP signal, so adding more upstream or downstream cGMP support is
    wasted. LIMITS: wang2018 is three weeks in rat and is ABSTRACT ONLY in this atlas, so the null may be
    a duration or power problem rather than a mechanism problem; hakata2024''s non-additivity is in mouse
    at one dose pairing; and neither tested a sub-maximal CNP dose, where a second agent might well add.
    Recorded as a strong prior against within-node stacking, not as a proof of futility.'
- parameter: THE REAL CEILING ON THE h_term ARM IS BLOOD PRESSURE, NOT EFFICACY
  value: hypotension is named as the liability of systemic CNP distribution, and is the stated rationale
    for building a collagen-binding-domain CNP fusion that localises to cartilage
  unit: qualitative
  conditions: hirai2026, collagen-binding CNP fusion localised to cartilage in fetal murine tibiae
  species: mouse
  source_ref: hirai2026
  uncertainty: 'THIS IS WHY THE ARM THAT WORKS CANNOT SIMPLY BE PUSHED HARDER. NPR2 is expressed in
    vasculature as well as cartilage, so systemic CNP lowers blood pressure, and dose is set by that
    rather than by the growth plate. A cartilage-restricted CNP therefore does not merely improve
    convenience - it removes the constraint that currently caps the only agent with a demonstrated
    bone-age-sparing effect. IT IS PRECLINICAL: fetal murine tibiae, localisation demonstrated rather
    than a growth endpoint at a supra-systemic dose, and no pharmacokinetics in a growing animal. THE
    ATLAS SHOULD NOT TREAT TARGETED DELIVERY AS SOLVED BECAUSE A FUSION PROTEIN BOUND TO CARTILAGE ONCE.'
- parameter: AND WHEN THE CNP AXIS IS BROKEN, GROWTH HORMONE LARGELY FAILS
  value: final height after 8.5 years of HIGH-DOSE growth hormone in two siblings with acromesomelic
    dysplasia Maroteaux type (biallelic NPR2 loss) was 130.5 cm (-6.57 SDS) and 134 cm (-4.58 SDS)
  unit: cm and SDS
  conditions: arya2020, two siblings, 8.5 years of high-dose GH
  species: human
  source_ref: arya2020
  uncertainty: 'A NEGATIVE HUMAN RESULT THAT LOCATES THE LEVERAGE. Eight and a half years of high-dose
    growth hormone against a broken CNP axis still finished more than four SDS below the mean, which says
    the amplification arm cannot substitute for the h_term arm when the latter is absent. It does NOT
    say the converse, and it does not say GH is useless in an intact axis - mcdonnell2026 shows it adds
    2.74 cm/year on top of a CNP analogue. Two siblings, abstract only in this atlas, and a severe
    biallelic phenotype is the hardest possible test of any growth agent.'
localization:
- growth plate; the CNP arm acts on the hypertrophic zone and the FGFR3/GH arm on the proliferative zone
human_evidence: direct
human_evidence_note: The h_term arm has direct human evidence in a non-FGFR3 population (dauber2026) and
  the combination has direct human evidence in achondroplasia (mcdonnell2026). The zone separation that
  justifies combining is mouse. The within-cGMP non-additivity is mouse and rat. NO COMBINATION STUDY HAS
  REACHED FINAL HEIGHT in any population, which is the endpoint every claim here ultimately needs.
species_basis:
- human
- mouse
- rat
translation_risk: moderate
translation_risk_reason: The two human results are real and quantitative but are in disease populations
  over 12 months with velocity endpoints, and this atlas has established that velocity endpoints
  systematically fail to predict final height. The mechanistic sorting onto zones is mouse.
confidence: C
confidence_note: 'C. The individual results are solid and several are human, but this node is an
  ASSEMBLY and its central claim - that agents sort onto separable terms and should be stacked across
  them - is this atlas''s organising inference rather than anyone''s finding. It is not B because no
  study has measured final height on any combination, because the zone separation rests on two
  unrelated mouse models neither designed for the comparison, and because the within-cGMP non-additivity
  that carries the design rule is a pair of animal nulls one of which is abstract-only. It is not D
  because every input is a quantitative primary result and two of the load-bearing ones are human trials.'
