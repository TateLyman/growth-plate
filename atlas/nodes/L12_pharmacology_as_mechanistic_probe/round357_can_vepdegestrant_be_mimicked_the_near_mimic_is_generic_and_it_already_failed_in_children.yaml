open_questions:
- g_l12_357a
contradicts:
- LOWERS THE PRIOR ON R351 AND R338, WHICH ARE THIS FILE'S OWN PROPOSALS. R338 argued the PROTAC is
  categorically different from every other antioestrogen because it removes the protein. That is true of
  SERMs and false of SERDs, which also degrade - so the difference is depth, not category, and the only
  human head-to-head shows no significant separation in the receptor genotype this subject has.
- CORRECTS the_receptor_level_oestrogen_sweep A SECOND TIME. R338 corrected its filing of the PROTAC as an
  AF-2 agent; the identical error covers the whole SERD class and was left standing.
- REMOVES THE DELIVERY DEFENCE. R353's cationic-Donnan argument implied fulvestrant might have failed for
  pharmacokinetic reasons that an oral cationic degrader would escape. movrareskrtic2014's AF-2-disabled arm
  shows the drug reaches the plate.
- DOES NOT KILL VEPDEGESTRANT. What survives is that degradation depth is a continuum, vepdegestrant sits
  measurably deeper than any SERD, tumour PFS is not a growth-plate endpoint, and the ERalpha-null human
  phenotype requires a depth no partial degrader has been shown to reach.
