contradicts: 'This round DOWNGRADES round 321''s compound. Oral sodium sulfate demonstrably raises serum sulfate
  25% acutely, but the same paper shows renal reabsorption is capacity limited specifically to hold plasma sulfate
  constant, so lowering the set point genetically and raising it with a dose are not symmetric and no chronic-dosing
  evidence exists. It simultaneously UPGRADES the paracetamol contraindication, because the genetics establish at
  P=2.16e-07 that being at the low end of the sulfate distribution costs TRUNK height, and a single ordinary paracetamol
  dose perturbs the pool by more than a nonsense allele does. And it CONVERGES with round 318 from an independent
  direction: sulfate is trunk-specific, which is the compartment that still holds centimetres at this bone age.'
