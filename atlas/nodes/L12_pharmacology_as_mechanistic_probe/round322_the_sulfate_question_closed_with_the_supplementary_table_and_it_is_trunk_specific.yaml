layer: L12
stub: false
summary: "ZERO - THE OPERATOR SUPPLIED THE TABLE I ASKED FOR, AND IT ANSWERS BOTH HALVES.\n`scherer2025`'s Supplementary\
  \ Table 16 gives per-variant UK Biobank associations for the sulfate transporter\nvariants across 22 anthropometric\
  \ phenotypes in ~466,900 people - including **standing height AND SITTING\nHEIGHT separately**. Supplementary\
  \ Tables 3/4/5/8/9/11 give the burden effect of SLC13A1 on plasma sulfate\nitself. Together they close the two\
  \ questions round 321 left open: how big is the effect, and which\ncompartment does it act on.\n\nONE - ⭐⭐⭐ THE\
  \ ANSWER TO THE COMPARTMENT QUESTION: SULFATE IS TRUNK-SPECIFIC.\n| SLC13A1 variant | hets | **SITTING height**\
  \ | standing height |\n|---|---|---|---|\n| **R12\\*** (nonsense) | 2,476 | **-0.0774 SD, P = 2.16e-07** | -0.0380\
  \ SD, P = 0.0064 |\n| **R272C** | 293 | **-0.1839 SD, P = 2.0e-05** | -0.1211 SD, P = 0.0027 |\n| W48\\* (nonsense)\
  \ | 929 | -0.0717 SD, P = 0.0033 | -0.0702 SD, P = 0.0021 |\n| SLC26A1 L348P | 3,117 | -0.0213, P = 0.11 | -0.0252,\
  \ P = 0.043 |\n**For the commonest variant the SITTING-height association is TWICE the standing-height effect\
  \ and FOUR\nORDERS OF MAGNITUDE more significant, at essentially identical sample size.** All three SLC13A1\n\
  loss-of-function variants lower sitting height, and the two nonsense alleles do so independently.\n⭐ **This converges\
  \ with round 318 from a completely different direction.** Round 318 used absolute traits at\n32 loci to show the\
  \ trunk is where this subject's remaining centimetres are and that HHIP and TET1 are the\ntrunk-directed targets.\
  \ Sulfate now joins them - and unlike HHIP it has an obtainable agent.\n\nTWO - ⭐ THE MAGNITUDE, CALCULATED TRANSPARENTLY\
  \ SO IT CAN BE ATTACKED.\n· **SLC13A1 burden on plasma sulfate: -0.7435 SD, P = 2.6e-18, N = 4,713** (HI_mis mask,\
  \ GCKD).\n· **SLC13A1 R12* on sitting height: -0.0774 SD** (UK Biobank, N = 466,840).\n· **=> the gradient is\
  \ 0.0774 / 0.7435 = 0.104 SD of SITTING HEIGHT per SD of plasma sulfate** (and 0.051 SD\n  of standing height\
  \ per SD of sulfate).\n· Morris and Levy's oral sodium sulfate moved serum sulfate 0.410 -> 0.513 mM, which against\
  \ their control\n  SD of 0.043 mM is **+2.4 SD**. Naively, 2.4 x 0.104 = **+0.25 SD of sitting height, about +0.9\
  \ cm.**\n⛔ **THAT NUMBER IS ALMOST CERTAINLY WRONG AND I AM NOT OFFERING IT AS AN ESTIMATE.** Four reasons, one\
  \ of\nwhich is decisive:\n· The burden cohort (n=4,713) and the height cohort (n=466,840) are DIFFERENT, so the\
  \ ratio is an\n  approximation and not a matched estimate.\n· The 0.043 mM SD is a within-study SD in EIGHT people,\
  \ not a population SD; a larger population SD shrinks\n  the SD-change and therefore the predicted gain.\n· The\
  \ gradient is measured going DOWN from normal. Nothing shows it continues upward.\n· ⛔ **AND THE DECISIVE ONE\
  \ - HOMEOSTASIS IS THE ENTIRE POINT.** Morris and Levy's own finding is that\n  **renal tubular reabsorption of\
  \ inorganic sulfate is CAPACITY LIMITED** (reabsorbed fraction falls as\n  filtered load rises, r = -0.54, P<0.005)\
  \ and that **this saturable reabsorption FACILITATES SULFATE\n  HOMEOSTASIS.** A genetic lesion in the reabsorber\
  \ lowers the set point permanently and lifelong. A\n  supplement raises the filtered load and the kidney dumps\
  \ the excess. **THE TWO ARE NOT SYMMETRIC, and the\n  asymmetry runs against the supplement.** The 25% rise they\
  \ measured was at 2 hours after a single dose -\n  it is an excursion, not a new set point.\n\nTHREE - ⛔ SO THE\
  \ COMPOUND IS DOWNGRADED, AND I AM SAYING SO PLAINLY.\nRound 321 promoted oral sodium sulfate on the strength\
  \ of a demonstrated 25% rise in healthy adults. That\ndemonstration stands, but the physiology in the same paper\
  \ says the rise is transient by design. **There is\nno evidence that chronic oral sulfate raises the chronic plasma\
  \ set point, and a homeostatic mechanism whose\nstated function is to hold sulfate constant is a strong prior\
  \ that it will not.** Round 321's grade of C for\n\"a sulfate donor adds height\" should be read as C-minus, and\
  \ the burden of proof sits on a chronic-dosing\nplasma-sulfate time course that nobody has run.\n\nFOUR - ⭐⭐ BUT\
  \ THE SAME DATA UPGRADE THE OTHER HALF, AND THAT HALF IS FREE.\nThe genetics do not show that MORE sulfate than\
  \ normal helps. They show, at P = 2.16e-07, that **being at the\nLOW end costs TRUNK height.** Everything that\
  \ depletes the pool is therefore supported as a cost to avoid by\nexactly the evidence that fails to support supplementation:\n\
  · ⛔ **PARACETAMOL: a single ordinary 1.5 g dose lowers serum inorganic sulfate 24% (0.410 -> 0.311 mM,\n  P<0.001).**\
  \ That is a larger acute perturbation, in the harmful direction, than the entire genetic effect\n  of carrying\
  \ a nonsense allele. `li2021_sulfation` independently argues low sulfate reserves are\n  consequential and that\
  \ serum inorganic sulfate should be treated as a biomarker.\n· ✓ Adequate sulfur amino acid intake - the DRI's\
  \ own position is that this is what meets sulfate\n  requirements, which is an argument against supplementing\
  \ ABOVE adequacy and an argument FOR not falling\n  below it.\n=> **THE ACTIONABLE CONCLUSION IS AN AVOIDANCE,\
  \ NOT AN ADDITION**, and it is supported by better evidence\nthan the addition was.\n\nFIVE - THE ONE MEASUREMENT\
  \ THAT WOULD CONVERT THIS BACK INTO A LEVER.\n**Serum inorganic sulfate is a real, measurable analyte** that is\
  \ simply not ordered in routine practice -\n`vandekamp2023` says the diagnosis of hyposulfatemia \"might be easily\
  \ missed\", and `li2021_sulfation` argues\nexplicitly for it as a biomarker. If this subject sits at the LOW end\
  \ of the normal range, the genetics\nsupport correcting it and the expected direction of benefit is trunk-weighted.\
  \ If he sits mid-range, the\nhomeostatic argument says there is nothing to gain and the compound should be dropped.\
  \ **One assay decides\nbetween a live lever and a dead one.** It is the same class of cheap, unordered measurement\
  \ as the\ninsulin/HOMA-IR question that has been open since round 297.\n\nSIX - WHAT REMAINS UNKNOWN AFTER THIS\
  \ ROUND, STATED SO NOBODY RE-DERIVES IT.\n· No chronic-dosing study of any oral sulfate donor with serial plasma\
  \ sulfate - the single experiment that\n  would settle whether the set point moves.\n· No sulfate donor has a\
  \ bone-length endpoint in any species. Unchanged since round 296.\n· No experiment raises plasma sulfate above\
  \ normal and measures cartilage proteoglycan sulfation.\n· MSM's effect on INORGANIC sulfate remains undemonstrated,\
  \ so the non-laxative alternative is still unproven\n  on the biomarker.\n· The trunk-specificity is a striking\
  \ result and it is a lead-variant association in adults; it does not by\n  itself establish that the vertebral\
  \ growth plate is the site of action rather than, say, vertebral body\n  proportions set earlier in development."
human_evidence: direct
human_evidence_note: Entirely human and very large. The height associations are UK Biobank, ~466,900 individuals,
  per-variant, with sitting and standing height measured separately. The plasma sulfate burden effect is the GCKD
  cohort, N=4,713, P=2.6e-18. The pharmacology is 8 healthy adults in a four-way crossover. The two cohorts differ,
  which is stated as a limitation of the scaling rather than hidden.
species_basis: human
translation_risk: low
translation_risk_reason: 'LOW for what the round establishes - that sulfate supply is causally upstream of human
  height and trunk-weighted - because that is measured directly in humans at very large scale. The translation risk
  sits entirely in the INTERVENTION, and the round''s main conclusion is that the intervention does not follow from
  the genetics: a capacity-limited homeostatic reabsorption mechanism means lowering a set point genetically and
  raising it acutely with a dose are not symmetric operations.'
confidence: A
confidence_reason: Graded A for the two findings the round actually makes. The trunk-specificity is A - P=2.16e-07
  for sitting height against 0.0064 for standing height on the same variant in the same ~466,900 people, reproduced
  in direction across three independent SLC13A1 loss-of-function alleles. The homeostatic argument against supra-normal
  supplementation is A, because it rests on the same paper's own measured finding that renal sulfate reabsorption
  is capacity limited and functions to stabilise plasma sulfate. The +0.9 cm extrapolation is explicitly NOT offered
  as an estimate and is graded E.
limitations: The scaling combines a burden effect from GCKD (n=4,713) with per-variant height effects from UK Biobank
  (n=466,840), which is an approximation and not a matched estimate. The plasma-sulfate SD used to convert the supplement
  effect is a within-study SD in 8 people. The genetic gradient is measured downward from normal and gives no information
  about the upward direction. Effect sizes are inverse-normalised SD units, and the conversion to centimetres assumes
  trait SDs that were not extracted from the source. Lead-variant associations in adults do not localise the site
  of action to the vertebral growth plate. No chronic-dosing plasma sulfate time course exists for any oral donor;
  no sulfate donor has a bone-length endpoint in any species; and no experiment raises plasma sulfate above normal
  and measures cartilage proteoglycan sulfation.
