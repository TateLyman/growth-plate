claim_grades:
- claim: Sulfate supply acts on human height, and it acts on the TRUNK.
  grade: A
  species: human
  source_ref: scherer2025
  basis: SLC13A1 R12*, a nonsense allele carried by 2,476 heterozygotes, lowers SITTING height by 0.0774 SD at P=2.16e-07
    while lowering standing height by 0.0380 SD at P=0.0064 in the same ~466,900 people - twice the effect and four
    orders of magnitude more significant on the trunk trait. R272C reproduces the pattern (-0.1839 sitting at P=2e-05
    versus -0.1211 standing at P=0.0027) and W48* lowers both. Three independent loss-of-function alleles in one
    transporter, all reducing trunk height. This converges independently with round 318's finding that the trunk
    is the compartment holding this subject's remaining centimetres.
- claim: Oral sodium sulfate will raise this subject's chronic plasma sulfate and therefore his height.
  grade: D
  species: human
  source_ref: morris1983
  basis: DOWNGRADED FROM ROUND 321, on the same paper that supplied the agent. Morris and Levy showed a 25% rise
    at 2 hours after a single 9 g dose in healthy adults - but they also showed that renal tubular reabsorption
    of inorganic sulfate is CAPACITY LIMITED (r=-0.54, P<0.005) and stated that this saturable reabsorption FACILITATES
    SULFATE HOMEOSTASIS. A genetic lesion in the reabsorber lowers the set point permanently; an oral dose raises
    the filtered load and is excreted. Those are not symmetric operations, and the asymmetry runs against the supplement.
    No chronic-dosing time course exists for any oral sulfate donor, so whether the set point moves at all is unmeasured.
    The naive extrapolation of about +0.9 cm is graded E and is not offered as an estimate.
- claim: Avoiding sulfate depletion is supported by the genetics.
  grade: B
  species: human
  source_ref: scherer2025
  basis: YES, and this is the half that survives. The genetics show at P=2.16e-07 that sitting at the LOW end of
    the sulfate distribution costs TRUNK height. A single ordinary 1.5 g dose of paracetamol lowers serum inorganic
    sulfate by 24% - a larger acute perturbation, in the harmful direction, than the whole genetic effect of carrying
    a nonsense allele - and li2021_sulfation independently argues that low sulfate reserves are consequential and
    that serum inorganic sulfate should be treated as a biomarker. GRADE B rather than A because the paracetamol
    data are acute and single-dose, and no study links chronic paracetamol use to height.
- claim: This question is now closed either way.
  grade: X
  species: human
  source_ref: scherer2025
  basis: NO - one cheap measurement still separates a live lever from a dead one. Serum inorganic sulfate is a real
    analyte that is simply not ordered routinely; vandekamp2023 notes hyposulfatemia 'might be easily missed' and
    li2021_sulfation argues for it as a biomarker. If this subject sits at the LOW end, the genetics support correcting
    it and the expected benefit is trunk-weighted. If he sits mid-range, the homeostatic argument says there is
    nothing to gain and the compound should be dropped. What IS closed is the magnitude question and the compartment
    question.
