id: round322_the_sulfate_question_closed_with_the_supplementary_table_and_it_is_trunk_specific
name: 'ROUND 322 - the sulfate question CLOSED with scherer2025''s own supplementary tables. Sulfate is causally
  upstream of human height and it is TRUNK-SPECIFIC - SLC13A1 loss hits SITTING height at P=2.2e-07 against standing
  height at 0.0064. The gradient is ~0.10 SD of sitting height per SD of plasma sulfate. But the same paper''s physiology
  defeats the supplement: capacity-limited renal reabsorption exists to hold sulfate CONSTANT, so lowering the set
  point genetically and raising it with a dose are NOT symmetric'
