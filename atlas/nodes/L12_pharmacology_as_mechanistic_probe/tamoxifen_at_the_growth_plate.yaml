id: tamoxifen_at_the_growth_plate
name: The SERM route was tested twenty years ago and tamoxifen KILLS resting-zone chondrocytes
type: process
layer: L12
stub: false
summary: 'Last round this atlas eliminated receptor subtype and dose as ways of separating oestrogen''s bone benefit
  from its plate-closing cost, and concluded that what remained was TISSUE selectivity - a compound antagonist at the
  growth plate and agonist in bone - naming tamoxifen''s existing paediatric use as the cheapest place to look. THE
  QUESTION HAD ALREADY BEEN ASKED, BY THE SAME KAROLINSKA GROUP WHOSE OTHER WORK THIS ATLAS ALREADY HOLDS, AND THE
  ANSWER IS NO. chagin2007 state the therapeutic premise in their own abstract - high-dose oestrogen limits extreme
  tall stature with severe side effects, and SERMs could potentially be used as an alternative - which is this atlas''s
  reasoning arrived at independently and nineteen years later. What they found is that tamoxifen causes DOSE-DEPENDENT
  GROWTH RETARDATION WITH NO CATCH-UP AFTER WASHOUT, by selectively inducing APOPTOSIS IN RESTING-ZONE AND HYPERTROPHIC
  CHONDROCYTES. karimian2008 confirmed it in vivo: young male rats on tamoxifen lost spinal and tibial LENGTH, trabecular
  BMD, cortical circumference, bone strength and serum IGF-I, with raised proliferation AND apoptosis in the plate,
  fewer hypertrophic chondrocytes, and REDUCED TERMINAL HYPERTROPHIC CELL SIZE. THE DRUG DOES NOT SPARE THE PLATE -
  IT DESTROYS THE COMPARTMENT THE ENTIRE PROGRAMME DEPENDS ON. And the human trial cannot see it. eugster2003 gave
  tamoxifen to 25 girls for 12 months and reported exactly the profile a duration drug should have - growth velocity
  SDS 1.22 to -0.59, rate of bone maturation 1.21 to 0.72, NO ADVERSE EVENTS - because it measured bleeding, velocity
  and bone age, and never measured final height or the growth plate. A drug that quietly kills resting-zone chondrocytes
  looks like a success at twelve months. THAT IS THE SHAPE OF THE WHOLE PROBLEM: the readouts that are cheap to collect
  are the ones blind to the cost.'
quantitative:
- parameter: PERMANENT GROWTH ARREST WITH NO CATCH-UP, BY APOPTOSIS IN THE RESTING ZONE
  value: dose-dependent growth retardation of cultured metatarsals; NO catch-up growth after tamoxifen was removed
    from the medium; increased apoptosis of chondrocytes within the RESTING and hypertrophic zones
  unit: qualitative with direction
  conditions: cultured fetal rat metatarsal bones; apoptosis by TUNEL and proliferation by BrdU; a human chondrocytic
    line, HCS-2/8, used for apoptosis by FACS and cell-death ELISA and for caspase activation
  species: rat
  source_ref: chagin2007
  uncertainty: 'THE NO-CATCH-UP RESULT IS THE ONE THAT MATTERS AND IT IS THE ONE THIS ATLAS''S MODEL PREDICTS. Killing
    resting-zone chondrocytes spends the pool irreversibly, and a spent pool does not recover - which is exactly what
    a washout experiment showing no catch-up demonstrates. ABSTRACT ONLY: the full text has not been read, so the
    dose-response, the magnitude of the apoptotic fraction and the concentrations relative to human therapeutic exposure
    are all unrecorded, and the last of those is the critical unknown - 40 mg/kg/day in karimian2008 is far above the
    20 mg/day fixed adult dose used in eugster2003, and no comparison of tissue exposure exists here. Cultured fetal
    metatarsals are also an embryonic, avascular preparation without a secondary ossification centre or a resting zone
    in the postnatal sense. THE CONCENTRATION CAVEAT THIS ATLAS WROTE FROM THE ABSTRACT WAS BACKWARDS AND IS WITHDRAWN
    (CORR-031): the authors state that children on 20-40 mg/day reach serum tamoxifen of roughly 1.0 microM, which
    is the concentration used here, and that ANIMAL doses give serum 1-10 nM, ten to a hundred times LESS than
    treated humans. The in vitro exposure is the paediatric one. FIVE DAYS of 1 microM arrested growth as completely
    as 26 days continuous, and neither 17-beta-estradiol at 1 microM nor IGF-I at 100 ng/ml rescued it, so this is
    not simple ER antagonism and not a growth-factor-reversible arrest.'
- parameter: AND IN VIVO — SHORTER BONES, WEAKER BONE, LOWER IGF-I, AND SMALLER TERMINAL CELLS
  value: decreased body weight, nose-anus distance, spinal and tibial bone LENGTHS, trabecular BMD, cortical periosteal
    circumference and bone strength; serum IGF-I 424 +/- 54 against 606 +/- 53 ng/ml in controls, p < 0.05; elevated
    chondrocyte proliferation AND apoptosis; fewer hypertrophic chondrocytes and reduced size of TERMINAL hypertrophic
    chondrocytes
  unit: ng/ml and qualitative
  conditions: four-week-old male Sprague-Dawley rats gavaged daily with vehicle, tamoxifen 40 mg/kg/d for 1 or 4 weeks,
    or estradiol 40 micrograms/kg/d for 4 weeks; n = 10 per group, half killed at 4 weeks and half after 14 weeks of
    recovery; DXA, pQCT and X-ray
  species: rat
  source_ref: karimian2008
  uncertainty: 'TWO DETAILS DESERVE SEPARATE WEIGHT. FIRST, REDUCED TERMINAL HYPERTROPHIC CELL SIZE - this atlas records
    terminal cell height as INVARIANT in human from birth to 13 years (byers2000), and as the parameter whose loss
    drives cessation in rat (roach2003). A drug that shrinks it is acting on the one variable the atlas treats as
    defended. SECOND, PROLIFERATION AND APOPTOSIS BOTH ROSE, which is the signature of a compartment being churned
    rather than quieted - cells are being driven to divide and then killed, which spends the pool twice over.
    FULL TEXT NOW READ AND THE MISSING NUMBER IS RECOVERED: after 14 weeks of recovery body weight caught up COMPLETELY
    and trabecular BMD and cortical BMC returned to control, but LENGTH DID NOT - femur 32.4 +/- 0.2 against 33.6 +/-
    0.3 mm (p < 0.05), nose-anus 25.7 +/- 0.1 against 26.7 +/- 0.2 cm (p < 0.05), tibia still shorter at p < 0.001,
    spinal length still shorter, and growth plate height still reduced in the 1-WEEK group. The selectivity runs the
    WRONG WAY: everything recoverable recovered and length did not. The authors call 40 mg/kg/d a clinically relevant
    dose, and chagin2007 shows animal dosing gives serum 10-100x BELOW treated humans, so this is an underestimate
    of the human exposure rather than an overestimate. ONE CONTRAST WITHIN THE SAME EXPERIMENT DESERVES ITS OWN WEIGHT:
    estradiol at 40 microg/kg/d also reduced growth plate height after recovery, consistent with accelerated senescence,
    but did NOT shorten the bones - so oestrogen and tamoxifen are not doing the same thing.'
- parameter: THE HUMAN TRIAL, WHICH LOOKS LIKE A SUCCESS AND CANNOT SEE ANY OF THIS
  value: growth velocity SDS 1.22 +/- 2.65 to -0.59 +/- 3.06 (P = 0.005); rate of bone maturation, change in bone age
    over change in chronological age, 1.21 +/- 0.78 to 0.72 +/- 0.36 (P = 0.02); vaginal bleeding 3.42 to 1.17 episodes
    per year; NO ADVERSE EVENTS
  unit: SDS and bone-age years per chronological year
  conditions: 28 girls aged 2.9-10.9 with classic or atypical McCune-Albright syndrome from 20 centres, 25 completing
    12 months of tamoxifen 20 mg daily; 6 months of pretreatment history as the comparator; evaluations were physical
    examination, bone age, pelvic ultrasound, hormone levels and safety
  species: human
  source_ref: eugster2003
  uncertainty: 'READ THIS ROW AGAINST THE TWO ABOVE IT AND IT BECOMES A LESSON ABOUT ENDPOINTS RATHER THAN A RESULT
    ABOUT TAMOXIFEN. A rate of bone maturation of 0.72 is a genuine slowing of the clock, in humans, on a marketed
    drug, with no adverse events - which is precisely the profile this atlas said the duration lever needed. AND THE
    TRIAL COULD NOT HAVE DETECTED THE RODENT FINDING IF IT WERE TRUE: 12 months, no final height, no predicted adult
    height, and no measurement of the growth plate at all. Permanent growth arrest by resting-zone apoptosis would
    appear only as a final-height deficit years later. THE DESIGN CONFOUND IS ALSO SEVERE - these girls have oestrogen
    EXCESS from autonomous ovarian function, so their pretreatment velocity SDS of +1.22 is pathological and falling
    to -0.59 is partly normalisation rather than suppression. A single-arm before-after comparison in a relapsing-remitting
    disease cannot separate treatment effect from regression to the mean, and the authors do not claim otherwise.
    NO FOLLOW-UP TRIAL EXISTS - a search of tamoxifen and McCune-Albright across 2007-2009 returns none (see CORR-030,
    where this atlas fabricated one).'
localization:
- growth plate resting and hypertrophic zones; cortical and trabecular bone
human_evidence: direct
human_evidence_note: The human arm is direct but shallow - 25 girls, 12 months, no final height and no plate
  measurement - and it is in a disease of oestrogen excess rather than in normal children. The mechanism, and every
  observation that would justify caution, is rat. No human study has measured what tamoxifen does to a growth plate.
species_basis:
- rat
- human
translation_risk: high
translation_risk_reason: The rat doses (40 mg/kg/day) cannot be mapped to the human fixed 20 mg/day without exposure
  data, cultured fetal metatarsals lack a postnatal resting zone, and the human indication is a disease of oestrogen
  excess. The direction of the risk is nonetheless the conservative one - the animal work says harm and the human
  work is blind to it.
confidence: C
confidence_note: C. The human trial is read in full and is a genuine multicentre prospective study; both rodent
  papers are ABSTRACT ONLY and are recorded as such, which caps this node. It is not B because the human trial is single-arm before-after
  in a relapsing disease of oestrogen excess with no final-height endpoint, because the in vivo catch-up is PARTIAL
  rather than absent and so differs from the in vitro result the authors themselves flag, and because no human study
  has ever measured a growth plate under this drug. It is
  not D because the two rodent studies are independent designs from the same group agreeing in direction, because the
  in vitro no-catch-up result is mechanistically specific rather than a general toxicity, and because the human data
  are real and quantitative even where they are blind.
