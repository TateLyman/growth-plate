type: hypothesis
layer: L12
stub: false
summary: >-
  ZERO - PTPN9 ENTERED THIS ATLAS IN ROUND 300 AS A NAME IN A LIST AND HAS NEVER BEEN TOUCHED SINCE. A grep
  of every node, gap and edge returns nothing. It arrived as "+3.56" in R300's roll-call of genes with zero
  prior coverage, and nobody asked what it does, whether it has chemistry, or what its mouse looks like.
  This round asks all three, in that order, before proposing anything.


  ONE - THE HUMAN NUMBER IS REAL AND WELL POWERED, AND THE SERIES AROUND IT IS NOT CLEAN.
  **pLoF +3.56 cm, P=4.16e-10, 153 carriers**, stable across allele-frequency bins (+3.00 at AAF<0.01% with
  123 carriers, +3.55 for singletons with 36). Not an OMIM gene; **zero HPO annotations**, so no syndrome
  baggage at all.
  ⛔ **But run the whole table the way round 324 ran NRK's and it does not behave.** DELETERIOUS MISSENSE -
  the class that should sit between pLoF and benign - is **NULL: +0.18 cm at P=0.30 (AAF<0.1%), +0.18 at
  P=0.85 for singletons**, while POSSIBLY-deleterious missense, a weaker predicted class, is **+0.87 at
  P=9.0e-08**. And pLoF+deleterious-missense at AAF<0.1% is only +0.48 (P=4.4e-03), LOWER than pLoF alone
  and lower than pLoF+possibly-deleterious-missense. **The ordering inverts in the middle of the series.**
  Compare NRK, where every step is monotone in both severity and rarity across 35 rows. PTPN9's signal
  rests on ~150 pLoF carriers and does not reproduce in the missense classes that should carry a diluted
  version of it.


  TWO - ⭐⭐⭐ THE CHEMISTRY IS REAL, AND IT IS THE BEST IN THIS FILE. `zhang2012meg2` (J Am Chem Soc 2012),
  compound 7:
  · **PTP-MEG2 Ki = 34 +/- 2 nM**
  · **>18-fold selective over PTP1B (Ki 630 nM) and TC-PTP (600 nM); NO inhibition at 10 microM against
    PTP-MEG1, SHP1, SHP2, LAR, CD45** and the rest of a mammalian PTP panel
  · **CELL PERMEABLE despite carrying a difluoromethylphosphonate** - raises insulin receptor Y1162/1163
    phosphorylation 50-100% at 50-100 nM in primary hepatocytes, 3T3-L1 adipocytes, HepG2 and C2C12
    myotubes, with Akt, GSK-3beta and Foxo1 phosphorylation up 1.5-4.5 fold
  · **IN VIVO: C57BL/6J diet-induced obese mice, 5 mg/kg intraperitoneally TWICE DAILY for 14 days** -
    insulin tolerance +14%, glucose tolerance +21%, hepatic gluconeogenesis -25%, insulin receptor
    phosphorylation up 2-3 fold in liver, skeletal muscle and adipose
  · **PK measured: Cmax 4.5 microM at 20 mg/kg ip, t1/2 1.8 h, 30% oral bioavailability**
  ChEMBL holds **97 measured activities across 95 distinct molecules** against human PTPN9 (CHEMBL6117),
  best IC50 75 nM, plus a separate PTPN9/STAT3 protein-protein-interaction target record. Pharos calls
  PTPN9 **Tchem**. Set that against this atlas's other leads: **NRK Tdark with 0 ligands; HHIP no agent in
  any species; CHAD only mimetics running the wrong way.**
  ⚠ **The honest chemical caveats.** The potent end of the ChEMBL set is peptidomimetic and heavy - the
  75 nM compound is MW 1086, the 270 nM is MW 835, the 900 nM is MW 680, all F2Pmp-based - and the
  drug-like end is micromolar. Compound 7 is an academic tool, not a commercial or clinical product; there
  is no supplier and no IND. And the class base rate is brutal: **PTPN1 has 803 ligands in Pharos and ZERO
  drugs**, as does every other PTPN. Thirty years of PTP medicinal chemistry has produced no approved
  active-site inhibitor.


  THREE - ⛔⛔ THE MOUSE NULL RUNS THE OTHER WAY, AND THIS IS R305'S RULE APPLIED BEFORE PROMOTION RATHER
  THAN AFTER. `wang2005meg2`: Meg2-/- embryos show haemorrhage, **neural tube defects including exencephaly
  and meningomyeloceles**, cerebral infarctions, **abnormal bone development**, and **>90% late embryonic
  lethality.** MGI's terms for Ptpn9<tm1Dny> (B6.129 congenic) include **DECREASED BODY SIZE,
  EMBRYONIC GROWTH RETARDATION and ABNORMAL LONG BONE DIAPHYSIS MORPHOLOGY.**
  ⚠ **And the reason matters as much as the direction.** MEG2's core job is **secretory vesicle genesis** -
  it dephosphorylates NSF - and the knockout lymphocytes show near-complete absence of mature secretory
  vesicles. So the null is a vesicle-biogenesis failure, which is a housekeeping catastrophe rather than a
  phosphatase set-point shift. That is a real defence of the human heterozygote number (CORR-325's interior
  optimum shape), and it is also exactly the kind of defence this atlas has learned to distrust.
  ⛔ **IMPC has never phenotyped Ptpn9** - zero rows in 2,236,257, the same blind spot as Nrk.


  FOUR - ⛔ AND STEP 0 LANDS ON AN ARM THAT IS ALREADY IN THE STACK AND ALREADY PRICED AT ZERO.
  PTPN9's substrates are the **INSULIN RECEPTOR**, **IGF1R at Y1165/1166** (`hu2025ptpn9`), **STAT3**
  (`su2012meg2`), **STAT5** and EGFR/ErbB2 (`yuan2010ptpn9`), and NSF. Compound 7's own demonstrated
  mechanism in vivo is **raising insulin receptor phosphorylation and Akt.**
  The GH limb of this stack is GHR -> JAK2 -> **STAT5B** -> IGF-1, and IGF-1 acts through **IGF1R**.
  CLAUDE.md prices **GH after mid-puberty at approximately ZERO attained height, with SOCS2 as the
  mechanism**, and separately records that **serum IGF-1 does not predict growth potential**. CORR-297: name
  the term, then ask which arm already moves it. **This one is occupied and spent.**
  ⚠ **THE FAIREST COUNTER-ARGUMENT, STATED PROPERLY BECAUSE IT IS NOT SILLY.** SOCS2 brakes at the
  GHR/JAK2 step. A phosphatase inhibitor acts on receptor autophosphorylation and on STAT5 itself, which is
  DOWNSTREAM of that brake - so it is arguably a post-brake amplification of a braked arm rather than a
  duplication of it, and that is a different claim from "give more GH" or "give more IGF-1". **Whether the
  plate's GH/IGF-1 limitation is receptor-proximal has never been measured**, so this is not a clean kill.
  But it is the same shape as LUM-201's pulsatility argument, which lost.


  FIVE - THE LOCAL DATA, RUN BEFORE THE LITERATURE (CORR-316/328).
  ✓ **CORR-327 passes, weakly.** PTPN9 is in the postnatal human growth plate at **25.3 CPM in 12/14
  samples, up to 24.0% of cells** - but it is the LEAST abundant phosphatase tested: PTPN14 148.9 (79.8% of
  cells), PTPN12 87.5, PTPN11 83.1, PTPN2 77.7, PTPN1 34.6. **Its substrates are far better represented:
  STAT3 181.5 CPM in 84.7% of cells, IGF1R 80.4, INSR 79.7, IRS1 34.9, STAT5B 37.0.**
  ✓ **The direction is coherent from the substrate side**: IGF1R, INSR, STAT3, STAT5B and PTPN11 loss are
  ALL annotated to human SHORT stature, so removing their phosphatase amplifies a growth-positive pathway.
  ⛔ **AND THE CRISPR MATURATION SCREEN GIVES AN INFORMATIVE NULL - unlike NRK's.** CORR-334 requires
  checking expression in the screened cells first: **Ptpn9 is transcribed at 36-45 CPM** there (against Nrk
  at 0.0-1.4, which is why NRK's null was unreadable). **Ptpn9 knockout does nothing: LFC -0.264 at D4 and
  -0.210 at D15, -log10p ~1.0**, far inside the paper's own thresholds. **PTPN9 is not a PERIOD lever** - it
  does not move chondrocyte maturation timing cell-autonomously. It could still be a rate or size lever;
  that assay cannot see either.
  ⚠ **Flat on the growth-capacity axis.** GSE114919 mouse: age +0.40 PZ / -0.33 HZ, site +0.63 PZ / -0.30
  HZ - inconsistent in sign between zones, so it tracks neither age nor plate output. Compare Hhip
  (+2.12/+2.86/+3.31, brake-like) and Nrk (capacity-like on all four).
  ⚠ `richard2025` puts PTPN9 in co-expression module CD2 (877 genes, with MAP4K4, NPR3 and SUFU); CD2's
  height-rank enrichment is P=0.0043 but scored "Worse Rank" like every module in that test, so it is not
  informative in either direction.


  SIX - ⭐ THE ONE GENUINELY NEW THING, AND IT CONNECTS TO ROUND 324. Compound 7's measured in vivo effect
  is **raising Akt phosphorylation 40-60% in liver, muscle and fat.** Round 324 established one round ago
  that AKT is the growth-POSITIVE direction for this tissue - PTEN, AKT1 and PIK3CA give human overgrowth;
  MTOR pLoF is -3.65 cm; rapamycin halves a rat's longitudinal growth rate. **So PTPN9 and NRK converge on
  AKT from two different upstream nodes, and PTPN9 is the one with a molecule that has already been shown
  to raise AKT in a living mammal.**
  **That makes compound 7 the only obtainable-in-principle agent in this atlas demonstrated to push the AKT
  axis in vivo** - and whether that lengthens a bone is unmeasured, in any species, at any dose.


  SEVEN - THE VERDICT, AND IT IS NOT THE ONE THE CHEMISTRY DESERVES. **Do not add PTPN9 to this stack.**
  Three problems, in descending order of severity: the mouse null is smaller with abnormal long bones; the
  human allelic series inverts in the middle; and Step 0 lands on the GH/IGF-1 arm that is already present
  and already priced at zero attained height. **What the round produces instead is the cheapest
  well-specified experiment on the AKT axis that this atlas has ever been able to name**, because for once
  the compound, the dose, the route, the schedule and the pharmacodynamic readout are all already published.
human_evidence: direct
human_evidence_note: >-
  The burden effect and the full allelic series are 1.45M human exomes; the expression is 14 postnatal human
  growth plates; the substrate phenotypes (IGF1R, INSR, STAT3, STAT5B, PTPN11 all short stature) are human
  clinical genetics. The knockout, the maturation screen, the growth-capacity axis and every pharmacology
  result are mouse or cell-based.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The one animal with the gene deleted is SMALLER with abnormal long bone diaphyses and dies before birth
  in 90% of cases, which is the opposite of the human heterozygote direction. No PTP-MEG2 inhibitor has ever
  been given with a skeletal endpoint of any kind, and the compound that exists is an academic tool with no
  supplier.
confidence: C
confidence_reason: >-
  C. The human burden number is grade A on its own and the chemistry is grade A - potency, selectivity,
  cell activity, in vivo activity and PK are all measured and published. What drops it to C is that three
  independent checks run against the target: a discordant and severe mouse null, a non-monotone allelic
  series, and a Step-0 collision with an arm already in the stack. Any one of those would be a caution;
  together they are a stop.
limitations:
- No PTP-MEG2 inhibitor has ever been given with a bone or length endpoint in any species.
- Compound 7 is an academic peptidomimetic with no commercial source, no IND and a 1.8 h half-life
  requiring twice-daily intraperitoneal dosing in the published protocol.
- The mouse null is homozygous and embryonic; no heterozygous Ptpn9 skeletal data exists.
- The human effect rests on ~150 pLoF carriers and does not reproduce in the deleterious-missense class.
- The CRISPR screen rules out a cell-autonomous maturation-timing effect only; it cannot see cell size or
  matrix output.
