id: round325_ptpn9_ptp_meg2_the_best_chemical_matter_in_the_atlas_attached_to_three_hard_biological_problems
name: >-
  ROUND 325 - PTPN9 / PTP-MEG2. THE OPERATOR IS RIGHT ABOUT THE COMPOUND: `zhang2012meg2`'s compound 7 is
  Ki 34 nM, >18-fold selective, CELL PERMEABLE, and works in mice at 5 mg/kg twice daily - the best chemical
  matter attached to any target in this atlas, by a wide margin. AND THE BIOLOGY HAS THREE HARD PROBLEMS:
  the mouse null is SMALLER, the human allelic series is NON-MONOTONE, and Step 0 lands on the GH/IGF-1 arm
  that is already in the stack and already priced at zero
aliases:
