claim_grades:
- claim: PTP-MEG2 has a potent, selective, cell-permeable, in-vivo-active inhibitor with published PK.
  grade: A
  basis: zhang2012meg2 - Ki 34 nM, >18-fold over PTP1B and TC-PTP, inactive at 10 microM against a panel of
    other PTPs, cellular activity at 50-100 nM in four cell types, efficacy in mice at 5 mg/kg ip twice
    daily for 14 days, Cmax 4.5 microM and t1/2 1.8 h measured. This is the best-characterised molecule
    attached to any target in this atlas.
- claim: PTPN9 loss increases adult human height.
  grade: B
  basis: pLoF +3.56 cm at P=4.16e-10 across 153 carriers, stable across allele-frequency bins, in a gene
    with no OMIM entry and no HPO annotation. B rather than A because the deleterious-missense class is null
    (+0.18, P=0.30) while a weaker predicted class is positive, so the series does not replicate internally.
- claim: The mouse supports the human direction.
  grade: X
  basis: 'NO, IT OPPOSES IT. Meg2-/- shows decreased body size, embryonic growth retardation and abnormal
    long bone diaphysis morphology, with >90% late embryonic lethality. R305''s cross-species rule exists
    for exactly this - DPP9 was human +2.50 cm against mouse tibia -4.062 and was killed on it.'
- claim: PTP-MEG2 inhibition is an ADDITION to this stack.
  grade: X
  basis: 'NO. Its substrates are the insulin receptor, IGF1R Y1165/1166, STAT3 and STAT5, and compound 7''s
    own in vivo mechanism is raising insulin receptor and Akt phosphorylation. The GH limb - GHR/JAK2/STAT5B
    to IGF-1, acting through IGF1R - is already in the stack and priced at approximately zero attained
    height after mid-puberty. CORR-297. The counter-argument that a phosphatase acts DOWNSTREAM of the SOCS2
    brake is real and untested, which is why this is recorded as a Step-0 failure rather than a biological
    one.'
- claim: PTPN9 is a period lever.
  grade: X
  basis: 'NO. In a genome-wide CRISPR screen where Ptpn9 IS transcribed (36-45 CPM, so the null is readable
    under CORR-334), knockout moves chondrocyte maturation timing by -0.264 and -0.210 log2 at -log10p ~1.0.
    Nothing.'
- claim: This round produces an agent to add.
  grade: X
  basis: It does not. It produces the best-specified unrun experiment in the file - compound, dose, route,
    schedule and pharmacodynamic readout all already published - and three reasons not to expect it to work.
