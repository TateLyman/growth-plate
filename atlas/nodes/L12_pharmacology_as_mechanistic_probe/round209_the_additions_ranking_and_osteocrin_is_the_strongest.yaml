contradicts:
- 'PARTLY REOPENS npr3_is_bifunctional_and_the_spec_was_backwards, WHICH THIS ATLAS WROTE. That node
  concluded NOT YET on the bifunctionality of NPR-C, and the reasoning stands. What it did not have is
  weber2025, which postdates it and adds the two things the stack most lacks - an elevation of terminal
  cell height above a normal baseline, and growth at the axial sites the NPR2-agonist arm misses. It also
  did not draw the distinction between ANTAGONISM, which silences both NPR-C functions, and LIGAND
  OCCUPANCY, which may block clearance while engaging the Gi arm. The verdict moves from not-yet to
  not-yet-and-here-is-the-experiment.'
- 'CORRECTS ROUND 208 ON A MATTER OF FACT. That round stated that no study in any species has given two
  growth-plate agents together and measured the outcome, and treated the additivity question as
  unanswerable. kanai2017 is a combination experiment with bone length as the endpoint and both
  single-gene controls. The round-208 search failed because it searched for TERMINAL CELL HEIGHT rather
  than for bone length; the narrow claim survives, the broad one does not.'
- 'RESETS THE PROGRAMME AFTER A DRIFT. Rounds 202 to 205 and 207 to 208 re-audited agents already in the
  stack rather than finding additions. The audit changed the ranking and was worth doing, but the
  addition question went unworked for ten rounds and this node is the correction.'
