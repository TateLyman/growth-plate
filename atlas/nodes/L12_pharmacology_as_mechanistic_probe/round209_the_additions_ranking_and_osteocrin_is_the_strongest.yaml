human_evidence: indirect
human_evidence_note: 'The human contribution is a monotonic allele-dose series for the TARGET with a
  normotensive safety read, not a trial of any compound. No NPR3 blocker has been given to a human for
  growth. The additivity, the terminal cell height and the site profile are all mouse; the haemodynamics
  are sheep.'
