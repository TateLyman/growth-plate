  value: zero alleles about zero SDS; one allele +0.71 and +1.46 SDS; two alleles +3.03, +3.9, +3.93 SDS
    with a proband at 205.1 cm at 14.7 years, and +2.7 to +4.76 SDS in a second series; blood pressure
    normal in every patient in both series
  unit: height standard deviation score
  conditions: lauffer2022 and boudin2018, biallelic and obligate-carrier NPR3 loss of function
  species: human
  source_ref: lauffer2022
  uncertainty: 'A MONOTONIC HUMAN DOSE-RESPONSE WITH A NORMOTENSIVE SAFETY READ, which is unusually strong
    for a candidate that has never been dosed. AGAINST IT - boudin2018 found progressive aortic root
    dilatation in two of four biallelic individuals, and these are lifelong germline nulls rather than
