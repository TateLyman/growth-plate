    higher circulating CNP and ADDITIONAL increases in bone length over elevated CNP alone
  unit: qualitative direction with a dose-dependence and a double-transgenic comparison
  conditions: kanai2017, transgenic mice
  species: mouse
  source_ref: kanai2017
  uncertainty: 'THE ONLY DEMONSTRATED ADDITIVITY ON BONE LENGTH FOR ANY PAIR OF AGENTS IN THIS FILE, and
    round 208 missed it because it searched for terminal cell height rather than bone length. TRANSGENIC
    OVEREXPRESSION IS NOT PHARMACOLOGY - lifelong genetic elevation of both partners does not establish
    that a dosed peptide added to a dosed CNP analogue behaves the same way, and no such experiment exists'
- parameter: terminal cell height and site profile under NPR3 loss
  value: maximum hypertrophic chondrocyte height in the axis of elongation approximately 20 per cent
    greater than wild-type littermates; disproportionate elongation of proximal and mid-tail vertebrae
  unit: per cent and site distribution
  conditions: weber2025, Npr3-null mice against wild-type siblings, tail vertebrae, Welch two-tailed,
