id: round209_the_additions_ranking_and_osteocrin_is_the_strongest
name: ROUND 209 - the additions ranking after ten rounds of auditing, and osteocrin is the strongest
  candidate because it is the only agent with a demonstrated ADDITIVE bone-length effect on top of a
  raised CNP axis, hits the free axis, and covers the sites vosoritide misses
type: hypothesis
layer: L12
aliases:
- the additions ranking
- osteocrin
- NPR3 occupancy versus antagonism
- round 209
stub: false
summary: 'THIS ROUND EXISTS BECAUSE THE PROGRAMME DRIFTED. Rounds 202 to 205 and 207 to 208 were almost
  entirely a re-audit of agents already in the stack. That work was worth doing - it established that
  vosoritide''s primate decomposition points at pool consumption rather than the free axis, that growth
  hormone has no demonstrated terminal-cell-height effect above a normal baseline, that the CNP axis is
  appendicular-biased across three species, and that the atlas has been carrying the FGFR arm under the
  wrong molecule. But the question was ADDITIONS, and in ten rounds one candidate was added. This round
  ranks the additions against everything now known.

  THE RANKING CRITERIA FALL OUT OF THE AUDIT RATHER THAN BEING IMPOSED. An addition is worth having if it
  (a) acts on a term the stack does not already saturate, (b) covers a SITE the existing agents miss,
  since CORR-195 forbids scoring against one site, (c) has evidence of ADDITIVITY rather than an assumed
  stack, and (d) does not spend the reserve, which round 198 made the exhaustible currency.

  THE STRONGEST CANDIDATE IS NPR3 BLOCKADE BY LIGAND OCCUPANCY, AND SPECIFICALLY OSTEOCRIN. It is the
  only agent in this entire file that satisfies all four, and most of the evidence was already here.

  ADDITIVITY IS DEMONSTRATED, NOT ASSUMED, AND I SAID LAST ROUND NO SUCH DATA EXISTED. kanai2017 is a
  double-transgenic experiment: mice with raised circulating osteocrin show dose-dependent skeletal
  overgrowth; the overgrowth is abolished in either CNP-depleted or NPR-C-depleted backgrounds, so both
  are indispensable; and CNP x OSTN DOUBLE TRANSGENICS SHOWED HIGHER CIRCULATING CNP AND ADDITIONAL
  INCREASES IN BONE LENGTH OVER ELEVATED CNP ALONE. The authors state the conclusion themselves - OSTN
  administration is an adjuvant for CNP therapy. ROUND 208 SEARCHED FOR COMBINATION EVIDENCE AND MISSED
  THIS, because it searched for terminal cell height rather than for bone length.

  IT HITS THE FREE AXIS, AND THAT IS NEW SINCE THE LAST TIME THIS ROUTE WAS ASSESSED. weber2025 - which
  postdates the atlas''s standing NPR3 verdict - shows Npr3 loss raises MAXIMUM HYPERTROPHIC CHONDROCYTE
  HEIGHT IN THE AXIS OF ELONGATION by about 20 per cent against wild-type littermates. Round 208
  established that only two agents in this file elevate terminal cell height above a NORMAL baseline, and
  this is one of them.

  IT COVERS THE SITES VOSORITIDE MISSES. The same paper shows Npr3 loss DISPROPORTIONATELY ELONGATES
  PROXIMAL AND MID-TAIL VERTEBRAE. Rounds 205 and 207 established that vosoritide produces no change in
  L1-L4 vertebral length, foramen magnum or skull in skeletally normal primates, and that L4-L6 is the
  only segment failing significance in thanatophoric mice. THE TWO CONTROL POINTS ON ONE AXIS HAVE
  DIFFERENT SITE PROFILES, which is not what anyone would predict and is the strongest argument for
  carrying both.

  THE HUMAN DOSE-RESPONSE IS A MONOTONIC ALLELE SERIES. Zero alleles about zero SDS, one allele +0.71 and
  +1.46, two alleles +3.03 to +4.76 SDS with a proband at 205.1 cm - and BLOOD PRESSURE NORMAL IN EVERY
  PATIENT ACROSS BOTH FAMILIES, with no volume contraction, no hypotension and no excessive natriuresis.

  AND THE COMPOUNDS EXIST AND ARE CHARACTERISED IN THIS FILE ALREADY. nishizawa2017 compound 23 - binding
  IC50 0.079 nanomolar at human NPR3 against more than 1000 nanomolar at NPR1, so better than 12,600-fold
  selective, and serum-stable at 92 per cent residual after four hours in neat mouse serum where the
  reference compound is 4 per cent at thirty minutes. M372049 - 887 daltons, a published synthesis
  requiring no specialised apparatus. Osteocrin itself - a natural 50-residue peptide, sequence known.

  NOW THE BLOCKER, BECAUSE THE ATLAS HAS ONE AND I HAD FORGOTTEN IT. The node
  npr3_is_bifunctional_and_the_spec_was_backwards concluded NOT YET, and the reason is real: NPR-C does
  two jobs with opposite signs. In cartilage it is a CLEARANCE SINK and blocking it raises local ligand -
  the growth mechanism, which wants NPR-C silenced. In the vasculature it is a Gi-COUPLED SIGNALLING
  RECEPTOR and aubdool2025 shows it is the receptor through which CNP protects the aorta - the safety
  mechanism, which wants NPR-C active. Global NPR-C-null mice have a dilated ascending aorta at baseline;
  boudin2018 found progressive aortic root dilatation in two of four human biallelic individuals.

  THE WAY THROUGH IS A MOLECULE-CLASS DISTINCTION THE ATLAS HAS NOT DRAWN, AND IT IS THE MAIN CONTRIBUTION
  OF THIS ROUND. An ANTAGONIST such as M372049 or compound 23 blocks the receptor and therefore silences
  BOTH functions - clearance and Gi signalling. AN OCCUPYING NATURAL LIGAND IS NOT THE SAME OBJECT.
  Osteocrin binds NPR-C and prevents natriuretic peptides binding it, which blocks clearance - but a
  ligand that occupies a Gi-coupled receptor is a candidate to ACTIVATE the Gi arm rather than block it.
  IF THAT HOLDS, OSTEOCRIN BLOCKS THE CARTILAGE SINK WHILE PRESERVING OR ENGAGING THE VASCULAR
  PROTECTION - which is precisely the compound specification that node said the atlas had backwards.

  THE FIRST LARGE-ANIMAL TEST IS CONSISTENT WITH THAT AND DOES NOT ESTABLISH IT. scott2024 infused
  ovine proOSTN into eight conscious normal sheep: plasma ANP, BNP and CNP all rose dose-dependently with
  cGMP, confirming clearance blockade in a large animal; arterial and central venous pressure fell
  progressively; and PLASMA cAMP, RENIN AND ALDOSTERONE WERE UNCHANGED, with NO natriuresis or diuresis
  despite raised urinary cGMP. Unchanged cAMP is the interesting line, because Gi coupling lowers cAMP -
  but plasma cAMP is a crude and systemic readout and is not aortic wall signalling. THE EXPERIMENT THAT
  SETTLES IT IS SMALL AND HAS NOT BEEN DONE.'
