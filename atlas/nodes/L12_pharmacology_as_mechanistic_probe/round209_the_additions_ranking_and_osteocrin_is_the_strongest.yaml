translation_risk: high
translation_risk_reason: 'The strongest evidence is transgenic overexpression rather than dosed
  pharmacology, and the compound class question - whether occupancy preserves the Gi arm that antagonism
  would block - is unresolved and is the whole basis for preferring osteocrin over the antagonists.'
confidence: C
claim_grades:
- claim: NPR3 occupancy adds bone length on top of an already-raised CNP axis
  grade: C
  basis: one double-transgenic experiment with the necessary single-gene controls in both directions;
    genetic overexpression rather than dosing, and no pharmacological replication
- claim: NPR3 loss raises terminal cell height above a normal baseline
  grade: C
  basis: one mouse study, n = 3 to 4, measured axially and separately from the zone, in a constitutive
    null with a connective-tissue phenotype
- claim: NPR3 loss and NPR2 agonism have different site profiles
  grade: D
  basis: assembled across studies - Npr3-null mouse tail vertebrae against vosoritide in normal primates
    and thanatophoric mice. No head-to-head, different species, different models
- claim: an occupying NPR-C ligand preserves the Gi arm that an antagonist would block
  grade: E
  basis: THE CENTRAL UNTESTED PROPOSITION OF THIS ROUND. Mechanistically motivated and consistent with
    unchanged plasma cAMP in sheep, but plasma cAMP is not aortic wall signalling and nobody has compared
    the two molecule classes on any vascular endpoint
- claim: characterised, selective, serum-stable NPR3 blockers exist
  grade: A
  basis: published binding constants, selectivity ratios, serum stability and a synthetic route
- claim: any NPR3 blocker has been given for growth
  grade: X
  basis: FALSE. None, in any species. Compound 23 was developed for cardiovascular indications and
    M372049 as a probe
