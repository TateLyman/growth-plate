localization:
- Smoothened in the primary cilium; no measurement of any of these compounds in cartilage or growth plate
  exists in any species
human_evidence: indirect
human_evidence_note: 'All four SMO agonists are FDA-approved drugs with extensive human safety data, but ONLY
  as corticosteroids - no human has ever taken one for a hedgehog indication, and no clinical trial of any
  Smoothened agonist exists (checked directly against the clinical trials registry this round: zero studies).
  The human evidence that bears on the growth plate runs the OTHER way - glucocorticoid receptor activation
  suppresses longitudinal growth, which is grade A. So human experience establishes the safety of the
  molecules and the hazard of the pharmacology they are normally used for, and says nothing about the SMO
  arm.'
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: 'Two activities of one molecule point in opposite directions for this objective, the
  relative potencies are unpublished in the sources read, and neither activity has been measured in cartilage.
  A systemic proposal would risk delivering the growth-suppressing arm at full strength and the
  growth-permitting arm not at all.'
confidence: C
claim_grades:
- claim: No FDA-approved Smoothened agonist exists.
  grade: X
  basis: 'WITHDRAWN - four do. wang2010smo identifies halcinonide, fluticasone, clobetasol and fluocinonide as
    Smo agonists that bind Smo, promote its internalisation, activate Gli and stimulate precursor
    proliferation synergistically with Shh; porcu2015 independently rediscovers halcinonide and clobetasol in
    a screen of 1,200 FDA-approved compounds. The operator was right that systemic Smoothened agonists exist
    and that there are many.'
- claim: The hedgehog effect of these compounds is too weak to reach, or is just a glucocorticoid effect.
  grade: X
  basis: 'BOTH REFUTED BY THE FULL TEXT, WHICH I RETRIEVED AFTER FIRST WRITING THIS NODE FROM THE ABSTRACT.
    Gli-luciferase EC50 is 0.2 nM for clobetasol, 0.3 nM for fluticasone and fluocinonide and 1.8 nM for
    halcinonide, with direct Bodipy-cyclopamine displacement at 57-78 nM for three of the four. And the
    response persisted in the presence of 5 microM MIFEPRISTONE while running OPPOSITE to dexamethasone, so
    the authors conclude it is INDEPENDENT of glucocorticoid nuclear receptor signalling. THE MINOXIDIL
    OBJECTION OF R335/R336 DOES NOT APPLY HERE - the concentration is reachable.'
- claim: One of these should be added systemically to raise hedgehog signalling at the growth plate.
  grade: X
  basis: 'STILL NO, BUT FOR ONE REASON RATHER THAN TWO. The quantitative objection is gone - sub-nanomolar Gli
    activation, GR-independent. What remains is that these molecules ALSO activate the glucocorticoid receptor,
    and GR activation suppresses longitudinal growth, which is grade A human knowledge. GR-independence of the
    hedgehog arm is not absence of GR engagement; both arms run, and the NET effect at a growth plate has
    never been measured in any species. That is now the whole of the objection, and it is an experiment rather
    than a barrier.'
- claim: The corticosteroid class splits on hedgehog direction molecule by molecule.
  grade: C
  basis: 'Agonists halcinonide, clobetasol, fluticasone, fluocinonide from two independent screens;
    antagonist budesonide, which binds the SMO CRD and blocks ciliary translocation; inhibitors
    dexamethasone, fludrocortisone and corticosterone acting at an allosteric site and additively with
    cyclopamine. The structural rationale - corticosteroids are sterols and SMO is cholesterol-activated - is
    stated by hedaya2018. Grade C because the compounds have never been compared head to head in one assay.'
- claim: If a corticosteroid is needed while the plate is open, the choice is not hedgehog-neutral.
  grade: D
  basis: 'Budesonide and fluticasone are the two commonest inhaled corticosteroids and run OPPOSITE ways at
    SMO; dexamethasone, the commonest systemic steroid, inhibits the pathway. Since a SMO antagonist fused a
    normal juvenile mouse plate in four days (newton2019), the direction matters in principle. Grade D because
    no corticosteroid has ever been tested on a growth plate for hedgehog output, and the substitution is
    recommended only because it is free.'
- claim: An approved SMO agonist is a more obtainable payload for the local SOC route than SAG.
  grade: D
  basis: 'The validated route is an agarose bead carrying 7 micrograms of SAG in the distal femoral secondary
    ossification centre, giving femur plus 3.63 per cent at six months and still widening. SAG has zero human
    exposure; clobetasol and halcinonide are approved, potent, small and lipophilic. ⭐ AND THE POTENCY MAKES
    THE LOCAL CASE MUCH STRONGER THAN WHEN THIS NODE WAS FIRST WRITTEN: at a Gli EC50 of 0.2 nM, a local depot
    needs vanishingly little drug compared with 7 micrograms of SAG, which is precisely the configuration that
    delivers SMO agonism while keeping systemic GR exposure subthreshold. Grade D and no higher because a
    locally released corticosteroid still activates GR AT THE SAME SITE, local GR activation at a plate is
    growth-suppressive, and no such experiment has been done in any species.'
- claim: gafni2001 delayed fusion through hedgehog.
  grade: X
  basis: 'NO. gafni2001 used DEXAMETHASONE and hedaya2018 shows dexamethasone INHIBITS hedgehog signalling.
    The fusion delay occurred despite hedgehog inhibition and is attributable to the division-counted
    senescence clock being spared by growth suppression. Recorded to prevent a false unification.'
