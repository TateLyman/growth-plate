id: round369_four_fda_approved_smoothened_agonists_exist_and_the_corticosteroid_class_splits_on_hedgehog_direction
name: Round 369 - FOUR FDA-APPROVED SMOOTHENED AGONISTS EXIST (halcinonide, fluticasone, clobetasol,
  fluocinonide) and the corticosteroid class SPLITS ON HEDGEHOG DIRECTION molecule by molecule, because
  corticosteroids are sterols and SMO is a cholesterol-activated receptor. They cannot be systemic growth
  agents, but they are an obtainable payload for the one route that works and they make the inhaled-steroid
  choice non-neutral
aliases:
- FDA-approved smoothened agonist
- clobetasol halcinonide fluticasone fluocinonide smoothened
- which corticosteroid is safe for an open growth plate
- budesonide versus fluticasone hedgehog
- dexamethasone inhibits hedgehog
type: hypothesis
layer: L12
stub: false
summary: 'R368 withdrew my claim that no obtainable systemic Smoothened agonist exists and established that
  the systemic route reaches the resting-zone pool. This round finds the compounds, and they are approved
  drugs.

  ⭐⭐⭐ ONE - FOUR FDA-APPROVED SMOOTHENED AGONISTS. wang2010smo, PNAS, 69 citations: a high-content screen
  in cells expressing Smo with a beta-arrestin2-GFP reporter identified HALCINONIDE, FLUTICASONE, CLOBETASOL
  and FLUOCINONIDE as Smo agonists that activate Hedgehog signalling. All four BIND Smo, PROMOTE Smo
  INTERNALISATION, ACTIVATE Gli, and STIMULATE THE PROLIFERATION OF PRIMARY NEURONAL PRECURSOR CELLS both
  alone and SYNERGISTICALLY with Sonic Hedgehog protein. The authors state the problem this solves in their
  own abstract - development of Hedgehog-related therapies had been impeded by a LACK of FDA-approved Smo
  agonists. INDEPENDENT CORROBORATION: porcu2015 screened the Prestwick library of 1,200 FDA-approved
  compounds and independently found HALCINONIDE and CLOBETASOL acting as Smo agonists; a 2024 in vivo study
  reports halcinonide activating SMO in a rat stroke model; a 2019 study reports clobetasol modulating adult
  neural stem cell growth via canonical Hedgehog activation. FOUR INDEPENDENT LINES, TWO SEPARATE SCREENS.

  ⭐⭐⭐ TWO - AND THE CLASS SPLITS ON DIRECTION, MOLECULE BY MOLECULE, WITH A STRUCTURAL REASON.
  · AGONISTS: halcinonide, clobetasol, fluticasone, fluocinonide (wang2010smo, porcu2015).
  · ANTAGONIST: BUDESONIDE - binds the SMO cysteine-rich domain and PREVENTS SMO TRANSLOCATION TO THE CILIUM,
    inhibiting canonical Smo signalling (recchia2024).
  · INHIBITORS: DEXAMETHASONE, FLUDROCORTISONE and corticosterone (hedaya2018), acting non-competitively with
    both cyclopamine and 20(S)-hydroxycholesterol, i.e. at an alternative or allosteric site, and ADDITIVE
    with cyclopamine.
  ⭐ THE UNIFYING REASON IS STRUCTURAL AND hedaya2018 STATES IT: the SMO crystal structure with cholesterol
  indicates cholesterol may be the natural activating ligand, and FLUORINATED CORTICOSTERONE DERIVATIVES ARE
  STRUCTURALLY SIMILAR TO CHOLESTEROL. Corticosteroids are sterols and SMO is a sterol-activated receptor, so
  THE WHOLE CLASS ENGAGES SMO AND THE DIRECTION IS A PROPERTY OF THE INDIVIDUAL MOLECULE.
  ⭐ AND porcu2015 SUPPLIES THE POINT THAT MAKES THIS MORE THAN A CURIOSITY: its hits are all
  glucocorticoid-receptor agonists yet they divide into THREE GROUPS by Hedgehog efficacy, so HEDGEHOG
  DIRECTION IS NOT DETERMINED BY GLUCOCORTICOID-RECEPTOR POTENCY. The two activities are separable in
  principle.

  ⭐⭐⭐⭐ THREE - AND THE POTENCY, WHICH I RETRIEVED FROM THE FULL TEXT AFTER FIRST DRAFTING THIS NODE FROM
  THE ABSTRACT, DEMOLISHES THE OBJECTION I HAD WRITTEN HERE. My first draft said no potency value was given
  and that this was the minoxidil configuration of R335/R336 - a real mechanism at an unreachable
  concentration. IT IS NOT. Gli-LUCIFERASE EC50: CLOBETASOL 0.2 nM, FLUTICASONE 0.3 nM, FLUOCINONIDE 0.3 nM,
  HALCINONIDE 1.8 nM. Direct Bodipy-cyclopamine displacement from Smo: 57, 58 and 78 nM for clobetasol,
  fluticasone and halcinonide. THESE ARE POTENT COMPOUNDS AT SMO, NOT MARGINAL ONES.
  ⭐ AND THE CONTROL THAT MATTERS MOST: the response was REPEATED IN THE PRESENCE OF 5 MICROMOLAR
  MIFEPRISTONE (RU-486) AND GAVE SIMILAR RESULTS, while the compounds ran OPPOSITE to dexamethasone despite
  all being able to activate GR. The authors conclude the proliferative response is INDEPENDENT OF
  GLUCOCORTICOID NUCLEAR RECEPTOR SIGNALLING. So the hedgehog arm is neither weak nor a glucocorticoid
  epiphenomenon.
  ⛔ WHAT SURVIVES AS THE OBJECTION, AND IT IS NOW ONE THING RATHER THAN TWO: these molecules STILL BIND AND
  ACTIVATE THE GLUCOCORTICOID RECEPTOR, and GR activation suppresses longitudinal growth, which is grade A
  human knowledge. GR-INDEPENDENCE OF THE HEDGEHOG ARM IS NOT ABSENCE OF GR ENGAGEMENT. Both arms run at
  once; only the NET effect at a growth plate decides it, and that has never been measured in any species.
  THE BARRIER HAS BECOME AN EXPERIMENT.

  ⭐⭐ FOUR - BUT THE ROUTE THIS ATLAS HAS VALIDATED IS LOCAL, AND THAT IS WHERE AN APPROVED AGONIST MATTERS.
  trompet2024 got femur plus 3.63 per cent at six months, still widening, from an agarose bead carrying SEVEN
  MICROGRAMS of SAG placed in the distal femoral secondary ossification centre, with the Gli1 signal gone by
  three weeks. SAG is a research reagent with no human exposure. CLOBETASOL AND HALCINONIDE ARE APPROVED,
  extremely potent, small and lipophilic, and clobetasol in particular exists in depot-friendly formulations.
  AN APPROVED SMO AGONIST IS A FAR MORE OBTAINABLE BEAD PAYLOAD THAN A RESEARCH REAGENT, and a local depot is
  precisely the configuration that minimises the systemic GR exposure that disqualifies the class - which is
  the argument trompet2024 makes for local delivery in general.
  ✗ THE TENSION, STATED: a corticosteroid released locally still activates GR locally, and local GR
  activation at a growth plate is itself growth-suppressive. Whether local SMO agonism outruns local GR
  suppression is unmeasured in any species and is the experiment.

  ⭐ FIVE - AND ONE FREE, IMMEDIATELY ACTIONABLE SUBSTITUTION, THE SAME SHAPE AS THE R366 ANTIFUNGAL RESULT.
  If a corticosteroid is needed while the plate is open, the choice is NOT hedgehog-neutral. BUDESONIDE AND
  FLUTICASONE ARE THE TWO COMMONEST INHALED CORTICOSTEROIDS AND THEY RUN OPPOSITE WAYS AT SMO - budesonide
  blocks ciliary translocation, fluticasone is an agonist. DEXAMETHASONE, the commonest systemic steroid,
  INHIBITS the pathway. Since hedgehog signalling to the resting zone is REQUIRED to prevent fusion
  (newton2019, where four days of a SMO antagonist fused a normal juvenile mouse plate), the hedgehog
  direction of a chronically used steroid is a real variable and it costs nothing to choose.

  ⛔ SIX - AND A FALSE UNIFICATION KILLED BEFORE IT WAS WRITTEN. The tempting move was to explain gafni2001,
  where a glucocorticoid DELAYED growth-plate senescence and fusion with 14 per cent of plates fused against
  88 per cent in controls, as a hedgehog effect. IT IS NOT. gafni2001 used DEXAMETHASONE, which hedaya2018
  shows INHIBITS hedgehog. The gafni2001 delay is the division-counted clock being spared by growth
  suppression, exactly as R365 composed argument requires, and it happened DESPITE hedgehog inhibition. The
  two results must stay separate.'
