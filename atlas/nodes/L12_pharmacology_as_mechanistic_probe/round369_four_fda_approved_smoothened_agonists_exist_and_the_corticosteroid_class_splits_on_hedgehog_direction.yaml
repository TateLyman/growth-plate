- parameter: THE CORTICOSTEROID CLASS SPLITS ON HEDGEHOG DIRECTION, WITH A SPECIFIC STRUCTURAL RATIONALE
  value: 'AGONISTS - halcinonide, clobetasol, fluticasone, fluocinonide (wang2010smo), with halcinonide and
    clobetasol independently rediscovered as Smo agonists in a screen of the 1,200-compound Prestwick library
    of FDA-approved drugs, where the glucocorticoid class was the most highly represented among hits and
    divided into THREE GROUPS by efficacy (porcu2015).
    ANTAGONIST - budesonide binds the SMO cysteine-rich domain and PREVENTS SMO TRANSLOCATION TO THE CILIUM,
    inhibiting canonical Smo signalling (recchia2024).
    INHIBITORS - dexamethasone, fludrocortisone and corticosterone inhibit the pathway in NIH3T3 Gli-reporter
    cells, NON-COMPETITIVELY with both BODIPY-cyclopamine (transmembrane site) and 20(S)-hydroxycholesterol
    (CRD site), indicating an alternative or allosteric site, and ADDITIVELY with cyclopamine (hedaya2018).
    THE STRUCTURAL RATIONALE, from hedaya2018: the SMO crystal structure with cholesterol indicates cholesterol
    may be the natural activating ligand, and fluorinated corticosterone derivatives are structurally similar
    to cholesterol.'
  unit: direction by molecule
  conditions: Three independent papers, read as abstracts 2026-08-13; assembled into a split by this atlas.
