    the difference matters. Sub-nanomolar Gli activation with RU-486 insensitivity means the SMO arm is
    reachable at ordinary exposures and is not a GR epiphenomenon - the quantitative barrier that killed
    minoxidil is gone. But GR-INDEPENDENCE OF THE HEDGEHOG EFFECT IS NOT ABSENCE OF GR ENGAGEMENT: these
