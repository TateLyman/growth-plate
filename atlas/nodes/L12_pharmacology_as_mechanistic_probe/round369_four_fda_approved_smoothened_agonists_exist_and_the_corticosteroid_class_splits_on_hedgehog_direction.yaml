contradicts:
- RETIRES THE PHRASE THERE IS NO FDA-APPROVED SMOOTHENED AGONIST, which this atlas carried from R361 and
  which I repeated in the previous turn. Four exist and were found in two independent screens of approved
  compounds.
- DOES NOT REHABILITATE CORTICOSTEROIDS AS GROWTH AGENTS. The glucocorticoid-receptor arm suppresses
  longitudinal growth and no potency comparison exists, so the systemic proposal is blocked on the same
  quantitative ground that killed minoxidil in R335 and R336.
- PREVENTS A FALSE UNIFICATION WITH gafni2001, whose fusion delay used dexamethasone, a hedgehog inhibitor,
  and is therefore a division-counted-clock result rather than a hedgehog result.
