- parameter: WHY THE gafni2001 FUSION DELAY IS NOT A HEDGEHOG RESULT
  value: 'gafni2001 produced the fusion-delay result this atlas carries - growth suppression in rabbits
    followed by catch-up with a less senescent growth plate, senescence delayed about three weeks, 14 per cent
