contradicts:
- 'OVERTURNS THE PREMISE OF THE GAP THIS ATLAS WROTE LAST ROUND. g_l12_can_resveratrol_or_a_bioavailable_
  analogue_reach_the_plate_in_humans states that human resveratrol pharmacology is dominated by first-pass
  glucuronidation giving very low free plasma concentrations, and treats that as the barrier. kunihiro2020
  shows the glucuronide is the transport form and bone generates the aglycone in situ. The gap is not
  closed - the tissue is bone rather than growth plate - but its central premise is inverted and the
  question changes from "can enough free drug reach the plate" to "does the plate carry the enzyme".'
- 'STRENGTHENS CORR-199 AND ADDS A SECOND DEFECT. The full text confirms wang2018 measured no axial
  endpoint of any kind. It also shows the tibial null travels with a 9 per cent body-weight-gain deficit
  at the same dose, which the atlas did not record and which makes the null confounded as well as
  single-site. The cGMP-stacking verdict continues to rest on hakata2024 alone.'
