id: round206_the_glucuronide_is_the_vehicle_and_tadalafil_is_confounded
name: ROUND 206 - the resveratrol delivery objection was wrong in both directions, the resting zone is
  the compartment most likely to deconjugate the glucuronide, and the tadalafil null is confounded by a
  nine per cent body-weight-gain deficit as well as being single-site
type: hypothesis
layer: L12
aliases:
- glucuronide is the vehicle
- GUSB deconjugation
- PLGA resveratrol nanoparticle
- tadalafil confound
- round 206
stub: false
summary: 'THE DELIVERY OBJECTION THAT CLOSED THE RESVERATROL LINE HAS TWO INDEPENDENT ANSWERS AND BOTH
  ARRIVED IN ONE BUNDLE.

  ROUND 205 OPENED g_l12_can_resveratrol_or_a_bioavailable_analogue_reach_the_plate_in_humans on the
  premise that extensive first-pass glucuronidation gives very low free plasma resveratrol, which is why
  the compound has repeatedly failed to reproduce animal effects in people. THAT PREMISE IS WRONG FOR
  BONE, AND IT IS WRONG IN A SPECIFIC AND MECHANISTIC WAY. kunihiro2020 shows curcumin circulates as an
  INACTIVE GLUCURONIDE that is deconjugated IN SITU by bone''s high beta-glucuronidase content to the
  active aglycone, with "the majority of glucuronide distributing to bone" deconjugated. THE GLUCURONIDE
  IS THE DELIVERY VEHICLE RATHER THAN THE DEAD END. And the authors state the extension this atlas needs
  explicitly - GUSB ALSO CATALYSED DECONJUGATION OF RESVERATROL AND QUERCETIN GLUCURONIDES BY BONE, with
  the aglycones required for bioactivity.

  TWO DETAILS MAKE IT BETTER THAN A BARE MECHANISM. Bone glucuronide SUBSTRATE was MORE THAN TWOFOLD
  HIGHER IN IMMATURE 4-TO-6-WEEK-OLD MICE - the growing animal accumulates more, which is the direction a
  growth programme wants. And in ovariectomised mice GUSB activity FELL 24 per cent while aglycone still
  rose with substrate, so SUBSTRATE DELIVERY RATHER THAN ENZYME CAPACITY IS RATE-LIMITING, which is a
  dosing statement.

  THE LIMIT IS SHARP AND IT IS THE NEXT QUESTION. The tissue is BONE, not growth plate cartilage, and
  bone GUSB is plausibly osteoclast-derived because GUSB is a lysosomal enzyme and osteoclasts are
  lysosome-rich. The growth plate is avascular cartilage with no osteoclasts. BUT avijgan2026 - already
  in this atlas from round 201 - reports by transmission electron microscopy that human RESTING ZONE
  chondrocytes contain MORE LYSOSOMES than proliferative zone chondrocytes. THE COMPARTMENT THAT HOLDS
  THE RESERVE IS THE COMPARTMENT MOST LIKELY TO CARRY THE DECONJUGATING ENZYME. Two independent
  measurements, in two literatures that do not cite each other, and nobody has put them together. It is a
  hypothesis and it is cheap to test.

  THE SECOND ANSWER IS LOCAL AND IT ALREADY EXISTS AS A BUILT OBJECT. wei2024 made resveratrol-loaded
  PLGA nanoparticles at 50.40 nanometres with a POSITIVE zeta potential of +12.57 millivolts,
  encapsulation efficiency 92.35 per cent and drug loading 15.1 per cent, and obtained QUANTIFIABLE
  RESVERATROL IN JOINT TISSUE FOR OVER 35 DAYS FROM A SINGLE INTRA-ARTICULAR INJECTION, measured by
  LC-MS/MS including in knee cartilage, with FITC-labelled particles internalised by chondrocytes and
  systemic redistribution into blood markedly decreased. THE CHARGE IS THE POINT. Growth plate matrix is
  densely negatively charged aggrecan, so a small CATIONIC carrier is the configuration that penetrates
  cartilage rather than sitting on it - the same principle as the cartilage-targeting nanoparticle work
  logged in round 199.

  WHAT wei2024 DOES NOT SHOW IS THE WHOLE REMAINING QUESTION. Intra-articular delivery reaches ARTICULAR
  cartilage and synovium. The growth plate sits BEHIND the secondary ossification centre. trompet2024 got
  its length effect by implanting beads INTO the SOC surgically, and its intra-articular injections moved
  the resting pool without moving proliferation. Whether an intra-articular nanoparticle reaches the
  growth plate is untested, and it is now a named gap rather than an assumption.

  SEPARATELY, THE TADALAFIL WRITE-OFF IS WEAKER THAN CORR-199 RECORDED. The full text confirms the
  single-site finding beyond doubt - the words vertebra, tail, naso-anal, crown-rump and body length
  appear ZERO times, and the only occurrences of "spine" and "axial" are in the reference list. The
  endpoint is tibia length by weekly in vivo microCT, n = 10 per group, plus femur, cortical and
  trabecular properties and growth plate histology. BUT THE FULL TEXT ADDS A CONFOUND THE ATLAS DID NOT
  HAVE: tadalafil at 10 mg/kg/day produced A 9 PER CENT REDUCTION IN BODY WEIGHT GAIN, P less than 0.01,
  alongside the 52 per cent rise in tissue cGMP. A LENGTH NULL TRAVELLING WITH A BODY-WEIGHT-GAIN DEFICIT
  OF THE SAME ORDER IS NOT A CLEAN NULL - it is the mirror image of the CORR-191 situation, and a
  skeletal effect could be masked by a systemic one. The cGMP-stacking verdict still stands on
  hakata2024, which used naso-anal length, but the tadalafil leg is now doubly qualified.'
quantitative:
- parameter: in situ deconjugation of polyphenol glucuronides by bone
  value: the majority of glucuronide distributing to bone was deconjugated to the active aglycone; bone
    curcumin-glucuronide substrate more than twofold higher in immature 4-to-6-week-old mice (p less than
    0.05) and in ovariectomised and metastasis-bearing females; in ovariectomised mice GUSB activity fell
    24 per cent (p less than 0.01) while aglycone still rose in proportion to substrate
  unit: qualitative proportion, fold change and per cent
  conditions: kunihiro2020, C57BL/6 mice ingesting curcumin 500 mg/kg; GUSB also catalysed deconjugation
    of RESVERATROL and quercetin glucuronides by bone, with aglycones required for bioactivity
  species: mouse
  source_ref: kunihiro2020
  uncertainty: 'THE TISSUE IS BONE, NOT GROWTH PLATE CARTILAGE. GUSB is lysosomal and bone GUSB is
    plausibly osteoclast-derived, while the growth plate is avascular and has no osteoclasts except at
    the chondro-osseous junction. The resveratrol result is stated by the authors as an extension rather
    than being the paper''s main dataset. The age effect is on SUBSTRATE, not on enzyme'
- parameter: intra-articular sustained release of resveratrol from a cationic nanoparticle
  value: particle size 50.40 nm, polydispersity index 0.217, zeta potential PLUS 12.57 mV, encapsulation
    efficiency 92.35 per cent, drug loading 15.1 per cent; quantifiable resveratrol in joint tissue for
    over 35 days after a SINGLE intra-articular injection, measured by LC-MS/MS including in knee
    cartilage; chondrocyte internalisation confirmed with FITC-labelled particles at 24 hours
  unit: nanometres, millivolts, per cent and days
  conditions: wei2024, rat osteoarthritis model, ARTICULAR cartilage; efficacy read by MRI T1rho and T2
    relaxation at 4, 8 and 12 weeks plus histology and gene expression
  species: rat
  source_ref: wei2024
  uncertainty: 'ARTICULAR CARTILAGE IN AN OSTEOARTHRITIS MODEL, NOT GROWTH PLATE. Intra-articular delivery
    reaches the joint space; the growth plate sits behind the secondary ossification centre and
    trompet2024 needed a surgically implanted SOC bead to get a length effect. The cationic 50 nm design
    is the transferable part; the route is not yet'
- parameter: what the tadalafil null actually measured
  value: tibia length by weekly in vivo microcomputed tomography, n = 10 per group over 3 weeks, plus
    femur, cortical and trabecular bone properties and growth plate histology. The words vertebra, tail,
    naso-anal, crown-rump and body length appear ZERO times in the full text; the only occurrences of
    spine and axial are in the reference list
  unit: enumeration over the full text
  conditions: wang2018, 1-month-old Sprague Dawley rats, tadalafil 2.5 or 10 mg/kg/day for 3 weeks
  species: rat
  source_ref: wang2018
  uncertainty: 'CONFIRMS CORR-199 BEYOND DOUBT - this is a single-site study and cannot speak to the axial
    skeleton. The tibial null itself is reasonably powered at n = 10'
- parameter: the body-weight confound inside the tadalafil null
  value: tadalafil 10 mg/kg/day produced a 9 per cent reduction in body weight gain (P less than 0.01)
    alongside a 52 per cent increase in tissue cGMP (P less than 0.01) and a 37 per cent higher peak
    intracellular cGMP
  unit: per cent
  conditions: wang2018, same animals
  species: rat
  source_ref: wang2018
  uncertainty: 'NEW TO THE ATLAS AND IT WEAKENS THE LEG FURTHER. A length null travelling with a
    body-weight-gain deficit of the same order is not a clean null - it is the mirror of the CORR-191
    situation, and a skeletal effect could be masked by a systemic one. Whether the weight effect is a
    tolerability artefact or on-target is not addressed by the paper'
localization:
- 'the resting zone, lysosome-rich by electron microscopy and therefore the compartment most likely to
  carry the deconjugating enzyme'
- 'the joint space, where a cationic 50 nm particle persists 35 days but may not reach behind the
  secondary ossification centre'
human_evidence: absent
human_evidence_note: 'Mouse, rat and rat respectively. The human relevance of kunihiro2020 is that it
  explains a human pharmacological failure - low free plasma polyphenol - as a misreading of where the
  active species is generated, but no human bone or cartilage measurement exists.'
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: 'Both delivery results are animal and neither is in growth plate. The GUSB
  mechanism is in bone and the nanoparticle is in articular cartilage; the growth plate is a third tissue
  that differs from both in vascularity, cell content and matrix charge density.'
confidence: C
claim_grades:
- claim: circulating polyphenol glucuronides are deconjugated in situ by bone to the active aglycone
  grade: B
  basis: direct measurement of substrate and aglycone in bone across developmental stages and two disease
    models, with the enzyme quantified; single group, mouse
- claim: the same deconjugation applies to resveratrol
  grade: C
  basis: author-stated as an extension of the curcumin work with bioactivity confirmation, not the
    paper's primary dataset
- claim: growth plate cartilage deconjugates polyphenol glucuronides
  grade: E
  basis: NOT MEASURED BY ANYONE. Inferred from bone GUSB plus avijgan2026's finding that resting-zone
    chondrocytes are lysosome-rich. A hypothesis with a cheap test, and it is labelled as one
- claim: a cationic 50 nm PLGA nanoparticle sustains resveratrol in joint tissue for 35 days
  grade: B
  basis: LC-MS/MS quantification in joint tissue and cartilage with a full characterisation of the
    particle; single study, rat, articular cartilage
- claim: an intra-articular nanoparticle reaches the growth plate
  grade: E
  basis: NOT SHOWN. wei2024 is articular; trompet2024 needed a surgically implanted bead in the secondary
    ossification centre to move length
- claim: tadalafil was written off on a single-site endpoint
  grade: A
  basis: full text enumerated - zero occurrences of any axial length term outside the reference list
- claim: the tadalafil length null is clean
  grade: X
  basis: FALSE. It travels with a 9 per cent reduction in body weight gain at the same dose, P less than
    0.01
