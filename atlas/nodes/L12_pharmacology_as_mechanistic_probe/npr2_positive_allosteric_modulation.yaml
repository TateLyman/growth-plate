id: npr2_positive_allosteric_modulation
name: NPR2 POSITIVE ALLOSTERIC MODULATION - raise the receptor's gain instead of delivering more ligand,
  with a human dose-response in standing height and a small molecule that already exists
aliases:
- GC-B PAM
- MCUF-42
- NPR2 allosteric modulator
- can you amplify the receptor instead of the ligand
- small molecule CNP potentiator
type: intervention
layer: L12
stub: false
summary: 'THREAD 3 SAYS THE CNP ARM IS CAPPED BY A SYSTEMIC EXPOSURE MARGIN WHILE ITS EFFECT DEPENDS ON A
  PLATE CONCENTRATION NOBODY MEASURES. THIS NODE IS THE ROUTE THAT SIDESTEPS THE CAP ENTIRELY - not more
  ligand, but more gain at the receptor already sitting in the tissue.
  THE HUMAN DOSE-RESPONSE IS IN RECEPTOR ACTIVITY, NOT LIGAND, AND IT IS NEAR-LINEAR. jeong2026 built a
  high-throughput GFP reporter assay for NPR2 function, cross-checked it against a commercial CatchPoint
  assay and published data, and assigned an ACTIVITY SCORE to 245 NPR2 missense variants - 47
  loss-of-function, 34 partial loss-of-function and 14 GAIN-of-function - across the receptor functional
  domains. Activity score tracks standing height near-linearly, R squared 0.438 at P = 5.8e-10, with
  effects ADDITIVE and apparent ACROSS POLYGENIC BACKGROUNDS. A phenome-wide association analysis found
  NPR2 activity significantly associated ONLY with height and height-associated traits. So in humans, the
  quantity that maps onto adult stature is the RECEPTOR GAIN, the mapping does not saturate within the
  observed variant range, and it appears not to drag other phenotypes with it.
  AND THE MOLECULE EXISTS. ma2024 screened the NIH Molecular Libraries Small Molecule Repository in a
  cell-based assay and evolved the hits into MCUF-42, reported as the first small-molecule POSITIVE
  ALLOSTERIC MODULATOR of guanylyl cyclase B, which is NPR2. It is reported to enhance the binding
  affinity between GC-B and CNP, to potentiate CNP-induced cGMP, and to enhance CNP inhibition of
  proliferation - all in HUMAN CARDIAC FIBROBLASTS, because the paper is about myocardial fibrosis.
  WHY THIS FITS THE DELIVERY PROBLEM BETTER THAN ANY PEPTIDE. The partition curve this atlas holds
  (farnum2006) is brutal about size - 332 Da reaches roughly 100 per cent of vascular concentration inside
  the growth plate, 3 kDa about 60 per cent, 10 kDa about 10, 40 kDa undetectable. Every agent on this
  axis so far is a peptide: vosoritide at 4,102 Da sits partway down that slope and navepegritide is a
  45 kDa conjugate releasing a 4 kDa peptide. A SMALL MOLECULE SITS AT THE TOP OF THE CURVE. The
  delivery deficit that thread 3 exists to describe largely dissolves for a compound of a few hundred
  daltons, without needing a targeting moiety, a nanoparticle or a collagen-binding domain.
  THE HUMAN PROOF THAT ALLOSTERIC AMPLIFICATION SPECIFICALLY PRODUCES HEIGHT IS ALREADY IN THIS ATLAS.
  npr2_gain_of_function_tall holds p.Arg655Cys in the kinase homology domain, which amplifies the CNP
  response rather than raising ligand, and produces tall stature. That is the mechanism of a PAM occurring
  as a human natural experiment, with the phenotype this project is trying to produce.
  NOW THE OBJECTION THAT COULD KILL IT, STATED AT FULL STRENGTH. A PAM AMPLIFIES WHEREVER LIGAND AND
  RECEPTOR MEET, AND NPR2 IS EXPRESSED IN VASCULATURE. The dose-limiting liability of this whole axis is
  vascular - hirai2026 names hypotension as the liability of systemic CNP distribution, the ACcomplisH
  protocol monitors orthostatic blood pressure at every visit, and the cardiovascular NOAEL in cynomolgus
  monkey sits exactly at the clinical dose. A systemic PAM would raise gain at vascular NPR2 as well as
  at plate NPR2, so it does NOT automatically decouple efficacy from the cardiovascular margin the way a
  cartilage-targeted ligand would. It buys tissue selectivity ONLY IF the ligand it amplifies is
  distributed unevenly - that is, only if the plate carries a higher local CNP concentration than the
  vasculature does.
  THE CRUX WAS MEASURED IN THE SAME ROUND AND THE ANSWER DEMOTES THIS NODE. Whether the plate PRODUCES
  its own CNP or merely CONSUMES what arrives decides whether a PAM is selective. It is now measured:
  the_plate_consumes_cnp_it_does_not_make_it reports NPPC at array floor across all five microdissected
  compartments of the human growth plate, perichondrium included, on a platform that detects PTHLH at
  308.6 and GDF5 at 603.8 while NPPC never exceeds 19.8. THE PLATE IS A CONSUMER. With no local
  production, plate ligand cannot exceed vascular ligand, so a systemic PAM raises signalling at the
  vascular liability at least as much as at the target and approximates a dose increase - the one thing
  the cardiovascular margin forbids. THE SELECTIVITY ARGUMENT FOR THIS ROUTE IS GONE.
  WHAT IS LEFT OF IT, HONESTLY. Two things, and neither is established here. FIRST, the human dose-response
  in receptor activity (jeong2026) is untouched by the measurement - NPR2 gain still maps onto stature
  near-linearly, so the TARGET is not in question, only the delivery logic that made a PAM attractive over
  a ligand. SECOND, a small molecule may accumulate in cartilage on its own physicochemistry, cartilage
  being densely polyanionic, which would restore selectivity by a completely different mechanism. That is
  a property of a specific compound, MCUF-42 has not been characterised for it, and it is the only route
  by which this node returns to the top of the list.'
quantitative:
- parameter: 'NPR2 RECEPTOR ACTIVITY MAPS NEAR-LINEARLY ONTO ADULT STANDING HEIGHT IN HUMANS'
  value: 'R squared 0.438, P = 5.8e-10, across 245 functionally scored missense variants'
  unit: correlation between assayed receptor activity score and standing height
  conditions: 'jeong2026. High-throughput GFP reporter assay for NPR2 activity, cross-referenced against a
    commercial CatchPoint assay and previously published measurements, integrated into a single activity
    score per variant. 245 missense variants categorised: 47 loss-of-function, 34 partial loss-of-function,
    14 gain-of-function, spanning the functional domains. The association is described as NEAR-LINEAR,
    with effects ADDITIVE and apparent ACROSS POLYGENIC BACKGROUNDS. Phenome-wide association analysis
    found NPR2 activity significantly associated only with height and height-associated traits.'
  species: human
  source_ref: jeong2026
  uncertainty: 'THREE LIMITS, AND THE THIRD IS THE ONE THAT MATTERS FOR THIS SUBJECT. (1) The R squared is
    computed across the WHOLE variant range, which is dominated by the 81 loss-of-function and partial
    loss-of-function variants against only 14 gain-of-function; the strength of the relationship ON THE
    GAIN SIDE - the side a drug would occupy - is not separately established by this figure and must not
    be read off it. (2) A phenome-wide null is bounded by the power of each phenotype tested; "associated
    only with height" is reassuring for a target but is not a safety finding, and it cannot speak to
    effects that are late, rare, or absent from the phenotype catalogue. (3) THESE ARE GERMLINE VARIANTS
    ACTING FROM CONCEPTION. A lifelong difference in receptor gain producing a height difference does NOT
    establish that raising receptor gain at bone age 16 produces anything, and this atlas has repeatedly
    found age gates exactly where this inference would have to hold - serrat2013 for temperature and
    hakata2024 for neprilysin inhibition, which worked at 3-4 weeks in mice and was 99 per cent gone at
    4-5 weeks.'
- parameter: 'A SMALL-MOLECULE NPR2 POSITIVE ALLOSTERIC MODULATOR EXISTS, AND ITS ENTIRE DATASET IS
    CARDIAC'
  value: 'MCUF-42 - reported to enhance GC-B/CNP binding affinity, potentiate CNP-induced cGMP and enhance
    CNP inhibition of proliferation, all in human cardiac fibroblasts'
  unit: qualitative - no chondrocyte, growth-plate or length endpoint of any kind
  conditions: 'ma2024, PNAS Nexus. Cell-based high-throughput screen of the NIH Molecular Libraries Small
    Molecule Repository followed by hit-to-lead structure-activity work. The paper frames GC-B as a target
    for MYOCARDIAL FIBROSIS and states that small molecules able to bind and potentiate the GC-B/cGMP
    pathway had not previously been discovered.'
  species: in_vitro_human_cell
  source_ref: ma2024
  uncertainty: 'THE GAP BETWEEN THIS COMPOUND AND THIS PROJECT IS ALMOST THE WHOLE DISTANCE. There is no
    chondrocyte experiment, no growth-plate experiment, no animal, and no length endpoint - the entire
    characterisation is in cardiac fibroblasts for an antifibrotic indication. Potency, selectivity,
    oral bioavailability, plasma protein binding and molecular weight were not extracted here and are not
    asserted. The claim that a small molecule partitions into the plate better than a peptide is an
    inference from farnum2006 applied to a compound whose mass this node has NOT verified - it is a
    property of the size class, and MCUF-42 has not been placed on that curve. Nothing here supports
    administering this compound to anyone.'
localization:
- 'NPR2 is expressed in the human growth plate across all three zones and all four donors of GSE288028 -
  2.5 to 8.7 per cent of cells sample-wide, CP10K 0.025 to 0.324 - and is also expressed in vasculature
  and cardiac fibroblasts, which is the whole difficulty: the receptor is present at both the target and
  the liability'
human_evidence: direct
human_evidence_note: 'The dose-response is human genetic with a human anthropometric endpoint, and the
  supporting natural experiment (npr2_gain_of_function_tall) is a human gain-of-function variant. The
  compound evidence is human cell culture only, in the wrong cell type.'
species_basis:
- human
- in_vitro_human_cell
translation_risk: high
translation_risk_reason: 'The genetics and the pharmacology are separated by everything that usually
  fails. Human genetics establishes that LIFELONG receptor gain sets adult height; the compound
  establishes that a molecule can raise receptor gain IN CARDIAC FIBROBLASTS. Nothing connects the two in
  cartilage, in an animal, at a length endpoint, or at a late bone age - which is the specific junction
  where this atlas has watched several axes fail.'
confidence: D
claim_grades:
- claim: In humans, assayed NPR2 receptor activity is associated with adult standing height near-linearly
    and additively across polygenic backgrounds.
  grade: A
  basis: jeong2026, 245 functionally scored variants against standing height, R squared 0.438 at
    P = 5.8e-10, in humans with a directly measured anthropometric endpoint.
- claim: A small-molecule positive allosteric modulator of NPR2 has been reported.
  grade: B
  basis: ma2024 reports MCUF-42 from a screen-and-optimise campaign with a stated mechanism of enhancing
    GC-B/CNP binding affinity. Graded B rather than A because this is a single report of a single tool
    compound with no independent replication located, and the atlas has not read the full text.
- claim: An NPR2 PAM would preferentially act on the growth plate rather than on vasculature.
  grade: X
  basis: 'THE MEASUREMENT CAME BACK AND IT GOES AGAINST THIS. A PAM amplifies where ligand meets receptor,
    so it is growth-plate-selective only if local CNP at the plate exceeds CNP at the vasculature, which
    requires the plate to be a local PRODUCER. the_plate_consumes_cnp_it_does_not_make_it measured NPPC
    across five microdissected compartments of the human growth plate INCLUDING PERICHONDRIUM, on a
    platform that detects PTHLH and GDF5, and found it at floor everywhere - maximum 19.8 against PTHLH
    308.6 and GDF5 603.8. With no local production, plate ligand cannot exceed vascular ligand, and a
    systemic PAM approximates a DOSE INCREASE - precisely what the cardiovascular margin in thread 3
    forbids. THE SELECTIVITY ARGUMENT IS DEAD. What survives is a different and untested one: that a
    small molecule might accumulate in cartilage on its own physicochemistry, cartilage being polyanionic.
    MCUF-42 has not been characterised for that and this node does not assert it.'
- claim: A small molecule would solve the delivery deficit that thread 3 describes.
  grade: D
  basis: 'farnum2006 puts 332 Da at roughly 100 per cent partition into the plate against about 60 per
    cent at 3 kDa and undetectable at 40 kDa, so the SIZE CLASS is right in a way no peptide on this axis
    is. But MCUF-42 has not been placed on that curve here, small molecules face efflux, protein binding
    and metabolism that dextran tracers do not, and no growth-plate concentration has ever been measured
    for ANY agent, which is the finding thread 3 rests on.'
- claim: This compound class should be pursued ahead of cartilage-targeted CNP.
  grade: D
  basis: 'It is cheaper, better-sized for the tissue, and supported by a human dose-response in the exact
    endpoint. Against it, cartilage-targeted CNP has actual cartilage data and this has none, and the
    tissue-selectivity argument for a PAM is unresolved in a way the targeting argument is not. The honest
    ranking is that they attack the same cap by different routes and the producer-consumer measurement
    discriminates between them.'
