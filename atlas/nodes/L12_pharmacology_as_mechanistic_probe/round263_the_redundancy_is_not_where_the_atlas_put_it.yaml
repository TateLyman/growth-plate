    The eleven-day monotherapy null that refutes the RATE hypothesis and cannot address the DURATION one
- ref_id: schmidt2026
  year: 2026
  type: primary
  one_line_finding: >-
    The acne-dose null in 379196 people, which stratified by cumulative dose and therefore does not overlap
    the oncology exposures
contradicts: >-
  REVERSES TWO CLAIMS IN round262_the_synergy_audit_and_the_pth1r_correction. Its Collision One - that
  vosoritide and erdafitinib are the same control point because both CNP labels cite RAF-1 - fails against
  miyazaki2022's Trpm7 epistasis, and vosoritide is not redundant with erdafitinib. Its closing proposal -
  that the untested cilostazol-plus-CNP-analogue combination is the cheapest thing to run - is withdrawn,
  because those two are the SAME node and are the most likely pairing in the file to collide. ALSO INVERTS
  vosoritide_versus_cilostazol_decision FOR THIS STACK SPECIFICALLY: cilostazol's advantages are
  monotherapy advantages and the CYP3A4 collision with erdafitinib falls entirely on it. AND PARTIALLY
  WITHDRAWS round261's verdict - the retinoid arm is refuted as a rate agent and was never tested as a
  duration agent, which is a different proposition that no rodent experiment can address.
