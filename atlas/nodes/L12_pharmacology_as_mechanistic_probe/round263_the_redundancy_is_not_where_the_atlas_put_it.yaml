id: round263_the_redundancy_is_not_where_the_atlas_put_it
name: >-
  ROUND 263 - the redundancy is REAL but it is in the wrong pair. A Trpm7 ablation abolishes CNP-driven
  bone growth, so vosoritide is NOT a RAF-1 agent and does NOT collide with erdafitinib - while cilostazol
  and vosoritide ARE the same pathway. And RAR was dropped as a RATE agent when the question that was never
  asked is whether it is a DURATION agent, which two human case reports say the axis can be
aliases:
- round 263
- the TRPM7 epistasis
- vosoritide is not redundant with erdafitinib
- cilostazol is redundant with vosoritide
- RAR as a duration agent
type: hypothesis
layer: L12
stub: false
summary: >-
  THREE QUESTIONS, AND TWO OF THE ANSWERS REVERSE POSITIONS THIS ATLAS HELD LAST ROUND.

  ONE - ARE VOSORITIDE AND ERDAFITINIB REDUNDANT? NO, AND THE PROOF IS A GENETIC EPISTASIS TEST THIS ATLAS
  ALREADY HELD BUT NEVER CONNECTED TO THE QUESTION. Round 262 asserted they are the same control point
  because both approved CNP-analogue labels place their mechanism at the RAF-1 step of the FGFR3-MAPK
  cascade. THAT IS A LABEL CLAIM AND THE GENETICS CONTRADICT IT AS A SUFFICIENT ACCOUNT. miyazaki2022
  defines the CNP pathway in growth plate chondrocytes as NPR2 to cGMP to PKG to BIG-CONDUCTANCE
  CALCIUM-DEPENDENT POTASSIUM (BK) CHANNEL to hyperpolarisation to TRPM7-MEDIATED CALCIUM ENTRY to CaMKII -
  and reports that in ex vivo organ culture, CNP-FACILITATED BONE GROWTH IS ABOLISHED BY
  CHONDROCYTE-SPECIFIC Trpm7 GENE ABLATION. TRPM7 IS NECESSARY FOR CNP TO GROW BONE. Erdafitinib does not
  touch TRPM7, BK channels, PKG or CaMKII. A RAF-1-only account of CNP cannot be the whole mechanism,
  because deleting a calcium channel downstream of PKG abolishes the growth effect while leaving RAF-1
  intact. THE TWO AGENTS ARE NOT REDUNDANT AND VOSORITIDE SHOULD NOT BE DROPPED ON REDUNDANCY GROUNDS.
  WHAT WOULD HAVE TO BE TRUE FOR THE OPPOSITE. The label claim is not false - PKG-II does phosphorylate
  RAF-1, and CNP probably does damp MAPK. Both can be real. The question is which arm CARRIES the growth
  effect, and the only genetic test available answers TRPM7. If someone showed that the Trpm7-null
  abolition works by removing a permissive requirement rather than the signal-carrying arm, the redundancy
  argument would revive. Nobody has run that.
  AND THE OPERATOR'S PREMISE - THAT ERDAFITINIB GROWS MORE - IS ORTHOGONAL TO THIS. Relative potency does
  not establish redundancy. Two agents on different nodes with different magnitudes both belong in a stack
  unless the smaller one is negligible or antagonistic, and neither is shown here.

  TWO - AND THE REDUNDANCY IS REAL, IT IS JUST IN THE OTHER PAIR. kawabe2025's cilostazol chain is PKG to
  BK channel to hyperpolarisation to TRPM7 calcium entry to CaMKII - THE IDENTICAL CHAIN miyazaki2022
  defines for CNP, from the same laboratory, using the same blockers and the same Trpm7 conditional
  knockouts. CILOSTAZOL AND VOSORITIDE ARE THE SAME NODE. Vosoritide raises cGMP by stimulating production
  at NPR2; cilostazol raises it by blocking degradation at PDE3B; both then run BK, TRPM7 and CaMKII. By
  this atlas's own rule - stack across control points, never within one - THEY SHOULD NOT BE COMBINED, and
  round 262's proposal that the untested cilostazol-plus-CNP combination is the cheapest thing to run is
  withdrawn as the single most likely pairing to collide.
  SO ROUND 80'S REASONING WAS RIGHT ABOUT MAPK AND WRONG ABOUT THE PARTNER. Cilostazol IS orthogonal to
  MAPK - but so is CNP, once TRPM7 rather than RAF-1 is taken as the carrying arm. The correct architecture
  is TWO nodes, not three: NODE A, FGFR3 to RAF-1 to MAPK, occupied by erdafitinib; NODE B, cGMP to PKG to
  BK to TRPM7 to CaMKII to matrix synthesis, occupied by EITHER vosoritide OR cilostazol.
  WHICH ONE FOR NODE B, GIVEN ERDAFITINIB IS FIXED ON NODE A. The CYP3A4 collision falls entirely on
  cilostazol - erdafitinib is in vitro a time-dependent inhibitor AND inducer of CYP3A4 and cilostazol is a
  CYP3A4 and CYP2C19 substrate, while vosoritide is a 39-residue peptide cleared by peptidases with no such
  interaction. Cilostazol's advantages - oral, 369 Da on the partition plateau where a 4 kDa peptide sits
  partway down the slope, a wild-type length result, a favourable dose margin - are real and were correctly
  identified at round 80. But they are advantages over vosoritide as a MONOTHERAPY. IN A STACK WHOSE NODE-A
  AGENT IS ERDAFITINIB, THE UNPREDICTABLE-EXPOSURE PARTNER IS THE WRONG CHOICE, and the recommendation
  inverts from round 80.

  THREE - WHY RAR WAS DROPPED, AND THE QUESTION THAT WAS NEVER ASKED. Round 261 dropped it because
  koyama2021's CD2665 monotherapy expanded the growth plate and left body length, weight and TIBIA LENGTH
  unchanged, and the authors abandoned the arm. THAT EXPERIMENT RAN FROM P20 TO P31 - ELEVEN DAYS - AND IT
  TESTED RATE. IT COULD NOT TEST DURATION, AND DURATION IS THE THING THE OPERATOR IS ASKING ABOUT.
  THE TWO ARE DIFFERENT PROPOSITIONS AND THE ATLAS ALREADY KNOWS IT. An aromatase inhibitor does not raise
  height velocity - zegarra2024 shows letrozole SLOWING growth velocity while producing more attained
  height, because it defers fusion. A duration agent that leaves rate unchanged is not a failed agent; it
  is the expected profile of a duration agent. koyama2021's null on eleven days of rate is therefore
  entirely compatible with a duration effect and says nothing about it.
  AND THE SPECIES OBSTACLE IS WHY NOBODY HAS TESTED IT. Mice and rats do not fuse their growth plates -
  mouse_does_not_fuse and rat_growth_cessation_without_fusion are both nodes in this atlas. A duration
  agent CANNOT BE TESTED IN THE ANIMAL EVERY RETINOID EXPERIMENT USES. That is not an excuse for the arm;
  it is a structural reason the question has never been put, and it applies to nothing else in the stack
  because every other candidate is a rate agent testable in a rodent.
  THE HUMAN EVIDENCE THAT THE AXIS CONTROLS FUSION EXISTS, AND IT IS IN THE CLOSING DIRECTION AT HIGH DOSE.
  noyes2016 reports premature epiphyseal closure of the lower extremities CONTRIBUTING TO SHORT STATURE
  after cis-retinoic acid for medulloblastoma, and a second case reports genu varum from premature
  epiphyseal closure after isotretinoin for neuroblastoma. Oncology retinoid protocols dose far above acne
  protocols. THAT RECONCILES THE schmidt2026 NULL RATHER THAN CONTRADICTING IT: 379196 conscripts at acne
  dose showed +0.31 cm, and at oncology dose the same drug class closes plates and costs height. THE HUMAN
  RETINOID-FUSION DOSE-RESPONSE IS A THRESHOLD, FLAT ACROSS THE ACNE RANGE AND REAL ABOVE IT - which is the
  same shape duration_lever_is_a_switch_not_a_slope found for CYP19A1.
  SO THE ARM IS NOT DEAD, IT IS MISCLASSIFIED. As a RATE agent it is refuted (koyama2021). As a DURATION
  agent it is UNTESTED, the human axis is demonstrated in the closing direction, and the antagonist
  direction has never been given to any animal that fuses. Round 261's demotion stands on rate and is
  withdrawn as a verdict on duration.

  FOUR - THE INTERACTION MATRIX THE QUESTION ASKED FOR, WITH SIGNS WHERE THEY ARE KNOWN AND GAPS WHERE THEY
  ARE NOT. WITH ERDAFITINIB - no known mechanistic interaction with the retinoid axis; erdafitinib is
  hepatically cleared and CD2665/7C are not characterised for CYP, so the pharmacokinetics are UNKNOWN.
  WITH VOSORITIDE - no known interaction; different nodes entirely; UNTESTED. WITH CILOSTAZOL - both are
  small molecules with hepatic clearance and cilostazol is a CYP3A4/2C19 substrate; UNKNOWN and worth
  checking before anything else. WITH GROWTH HORMONE - THIS IS THE ONE WITH A MECHANISTIC CONFLICT ALREADY
  ON RECORD. uchibe2017 reports broadened pSmad1/5/8 in RARgamma-null growth plate, and chu2025 shows GH
  shifting stem divisions toward the committed side; both push the resting pool toward differentiation, so
  the combination is the most likely to compound a pool cost rather than cancel it. WITH AN AROMATASE
  INHIBITOR - both would be duration agents acting on different terminal signals, oestrogen-driven
  senescence acceleration versus retinoid-driven maturation; that is stacking ACROSS control points and is
  the pairing with the best a priori case AND ZERO DATA IN ANY SPECIES.
quantitative:
- parameter: >-
    THE EPISTASIS THAT SEPARATES CNP FROM THE MAPK NODE
  value: >-
    CNP-facilitated bone growth is ABOLISHED by chondrocyte-specific Trpm7 gene ablation; the defined
    pathway is NPR2 - cGMP - PKG - BK channel - TRPM7 - CaMKII
  unit: presence or absence of the CNP growth response
  conditions: >-
    miyazaki2022, ex vivo organ culture with chondrocyte-specific Trpm7 conditional knockout mice, supported
    by pharmacological dissection of each step. The same laboratory's kawabe2025 shows cilostazol acting
    through the identical chain with the same blockers (KT5823 for PKG, paxilline for BK, FTY720 for TRPM7)
    and the same Trpm7 conditional knockouts.
  species: mouse
  source_ref: miyazaki2022
  uncertainty: >-
    EX VIVO ORGAN CULTURE, NOT AN INTACT ANIMAL, and abolition by deleting a downstream channel establishes
    NECESSITY rather than that TRPM7 is the signal-carrying arm - a permissive requirement would give the
    same result. The RAF-1 claim on the drug labels is not thereby false; what fails is the assumption that
    RAF-1 is a SUFFICIENT account, which is what the redundancy argument needed. One laboratory holds both
    the CNP and the cilostazol halves of this pathway, so the architecture is not independently replicated.
- parameter: >-
    THE HUMAN RETINOID-FUSION AXIS AT ONCOLOGY DOSE, AGAINST THE NULL AT ACNE DOSE
  value: >-
    premature epiphyseal closure contributing to SHORT STATURE after cis-retinoic acid (medulloblastoma) and
    genu varum from premature epiphyseal closure after isotretinoin (neuroblastoma) - against +0.31 cm (95
    per cent CI 0.20 to 0.41) in 16739 male isotretinoin users at acne dose
  unit: epiphyseal closure and attained height
  conditions: >-
    noyes2016 and a second independent case report, both single patients on oncology retinoid protocols,
    against schmidt2026's nationwide Danish conscription cohort of 379196 at standard acne dosing with
    stratification by cumulative dose.
  species: human
  source_ref: noyes2016
  uncertainty: >-
    TWO CASE REPORTS AGAINST A REGISTRY OF 379196 - the weakest possible design against the strongest, and
    case reports of children treated for brain and neural-crest tumours carry radiotherapy, chemotherapy and
    disease as competing explanations for premature physeal closure. What makes them worth recording is that
    schmidt2026 STRATIFIED BY CUMULATIVE DOSE within the acne range and found nothing, so the two datasets
    do not overlap in exposure and a threshold above the acne range is consistent with both. This is an
    inference about dose-response shape from non-overlapping designs, not a measured curve.
localization:
- 'growth plate chondrocyte: NPR2-PKG-BK-TRPM7-CaMKII, where vosoritide and cilostazol both act'
- 'growth plate chondrocyte: FGFR3-RAF-1-MAPK, where erdafitinib acts'
- 'human lower-extremity physes: where oncology-dose retinoid closed plates early'
human_evidence: direct
human_evidence_note: >-
  The retinoid-fusion arm has human case evidence in the closing direction and a large human null at lower
  dose. The pathway architecture is entirely mouse.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: >-
  The architecture that reverses two stack decisions is mouse ex vivo from a single laboratory, and the
  duration hypothesis for the retinoid arm cannot be tested in any rodent because rodents do not fuse.
confidence: C
confidence_reason: >-
  The Trpm7 epistasis is a clean genetic result and is graded B on its own below; the stack conclusions
  drawn from it are C because they rest on one laboratory's pathway architecture and on an argument about
  which arm carries the effect. The retinoid-as-duration reframe is E - a reclassification of an untested
  hypothesis, not a finding.
claim_grades:
- claim: Vosoritide and erdafitinib occupy the same control point and are redundant.
  grade: X
  basis: >-
    NO, AND ROUND 262 SAID SO. miyazaki2022 abolishes CNP-facilitated bone growth by chondrocyte-specific
    Trpm7 deletion, so TRPM7 is necessary for CNP to grow bone and erdafitinib touches none of PKG, BK,
    TRPM7 or CaMKII. The RAF-1 label claim is not a sufficient account of CNP action. Vosoritide should not
    be dropped on redundancy grounds.
- claim: Cilostazol and vosoritide act on different control points and can be combined.
  grade: X
  basis: >-
    NO. kawabe2025's cilostazol chain and miyazaki2022's CNP chain are the same - PKG, BK channel, TRPM7,
    CaMKII - from the same laboratory with the same blockers and the same conditional knockouts. They differ
    only in whether cGMP is raised by production or by blocked degradation. Round 262's proposal to run
    that combination is withdrawn.
- claim: >-
    With erdafitinib fixed on the MAPK node, vosoritide is the better node-B partner than cilostazol.
  grade: C
  basis: >-
    The CYP3A4 collision falls entirely on cilostazol, which is a CYP3A4/2C19 substrate against an
    erdafitinib that is in vitro a time-dependent inhibitor AND inducer; vosoritide is peptidase-cleared.
    Cilostazol's partition, oral route and wild-type length result are genuine advantages as a monotherapy
    and do not survive the pairing. Inverts round 80 for this stack specifically.
- claim: The retinoid arm was refuted as a growth agent.
  grade: B
  basis: >-
    As a RATE agent, yes - koyama2021 measured tibia length over eleven days of CD2665 monotherapy and found
    nothing while the plate expanded.
- claim: The retinoid arm was refuted as a DURATION agent.
  grade: X
  basis: >-
    NEVER TESTED. Eleven days measures rate. A duration agent is expected to leave rate unchanged - letrozole
    SLOWS velocity and raises attained height. And the test cannot be run in mice or rats because they do
    not fuse, which is why the question has never been put. The human axis is demonstrated in the closing
    direction at oncology dose.
key_refs:
- ref_id: miyazaki2022
  pmid: '35287796'
  year: 2022
  type: primary
  one_line_finding: >-
    CNP-facilitated bone growth is abolished by chondrocyte-specific Trpm7 ablation; the pathway is
    NPR2-PKG-BK-TRPM7-CaMKII, not RAF-1 alone
- ref_id: kawabe2025
  year: 2025
