contradicts:
- >-
  ROUNDS 230 TO 235's recommendation to switch to an FGFR3-selective agent. Correct as pharmacology, but no
  such agent is obtainable and none of those rounds checked. Recorded as CORR-245.
- >-
  ROUNDS 228 TO 235's treatment of interruption as inevitable, which imported an oncology discontinuation
  rate whose stated cause was that accelerated growth had been reported as harm. Recorded as CORR-246.
- >-
  The proposition that the FGFR arm is the maturation-safe arm of this stack. It is the arm with NO bone-age
  measurement of any kind, while the CNP arm has a randomised one and growth hormone has a quantified cost
  of 1.37 years per calendar year.
