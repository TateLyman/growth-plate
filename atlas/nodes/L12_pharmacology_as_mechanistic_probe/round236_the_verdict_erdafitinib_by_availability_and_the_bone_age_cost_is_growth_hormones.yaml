id: round236_the_verdict_erdafitinib_by_availability_and_the_bone_age_cost_is_growth_hormones
name: >-
  ROUND 236 - THE VERDICT. Keep erdafitinib, but by AVAILABILITY and not by potency; the FGFR arm is the
  WEAKEST arm in the stack on bone age rather than the safest; vosoritide has the only randomised bone-age
  measurement there is; and the agent with a quantified maturation cost of 1.37 years per year is GROWTH HORMONE
type: hypothesis
layer: L12
aliases:
- the verdict
- erdafitinib by availability
- the bone age cost is growth hormone's
- the pause was an oncology artefact
- round 236
stub: false
summary: |
  A VERDICT WAS ASKED FOR ON WHETHER THE MOLECULE CHOICE MATTERS. IT DOES NOT, THE CONCLUSION IS KEEP
  ERDAFITINIB, AND ALMOST EVERY PREMISE OFFERED FOR THAT CONCLUSION IS WRONG. The right reason is one
  neither side had.

  THE REASON IS AVAILABILITY. Checked against the registry this round for the first time in six rounds of
  comparing molecules: DEBIO1347's DEVELOPMENT IS HALTED, two of its three trials TERMINATED - and it is
  the agent behind the largest human growth response ever recorded. DABOGRATINIB IS INVESTIGATIONAL ONLY
  across five trials, all adults with cancer or children aged 3 to 10 with achondroplasia. INFIGRATINIB IS
  NOT APPROVED FOR THIS. The obtainable FGFR inhibitors are erdafitinib, pemigatinib and futibatinib, AND
  EVERY ONE OF THEM IS PAN-FGFR. Rounds 230 to 235 were correct as pharmacology and inert as advice, which
  is recorded as CORR-245 and is a worse error than any sourcing failure in this session because those cost
  accuracy and this cost relevance.

  NOW THE PREMISES, AND THEY MOSTLY FAIL.

  "FGFR INHIBITION DOES NOT ACCELERATE BONE AGE" - NOT CONFIRMED, AND THE FGFR ARM IS THE WEAKEST ARM IN
  THIS STACK ON EXACTLY THIS QUESTION. Round 228 closed by exhaustion across five retrieval routes that NO
  ON-TREATMENT BONE AGE UNDER ANY FGFR INHIBITOR EXISTS, and round 231 confirmed it at three levels of the
  record. The single claim of no acceleration is propel3_2026, A CONFERENCE ABSTRACT, in ACHONDROPLASIA -
  and PROPEL 2's own schedule of assessments has NO BONE AGE LINE ITEM. Against it: erdachild2024's child
  read bone age 14.0 at chronological age 16.2 WITH NO BASELINE, so it is uninterpretable in both
  directions; and demuynck2024 has an FGFR3 inhibitor ENLARGING THE SECONDARY OSSIFICATION CENTRE and
  INCREASING TYPE X COLLAGEN AREA, both of which are maturation markers pointing the wrong way. THE
  PROPOSITION BEING ASSERTED AS SETTLED IS THE ONE THING THIS ATLAS SPENT FOUR ROUNDS PROVING NOBODY HAS
  EVER MEASURED.

  "VOSORITIDE IS A MAYBE" - EXACTLY BACKWARDS, AND THE TWO ARMS ARE INVERTED. Vosoritide holds the ONLY
  RANDOMISED REGULATOR-REVIEWED BONE-AGE MEASUREMENT IN THE STACK: Study 111-301, n = 61 against 60, bone
  age change over 52 weeks 1.02 (SD 0.83) years on drug against 1.14 (SD 0.82) on placebo - SLIGHTLY LESS
  THAN PLACEBO - and at week 104 in 33 subjects the change in bone age minus chronological age was -0.05
  (1.46) YEARS. That is the strongest maturation-cost evidence any arm of this stack has, and the FGFR arm
  has nothing remotely comparable.

  "GROWTH HORMONE CUTS BOTH WAYS" - CORRECT, AND IT IS THE MOST IMPORTANT THING SAID, BECAUSE THE ATLAS CAN
  QUANTIFY IT AND THE NUMBER IS BAD. mauras2008, randomised, GH-deficient adolescent males on GH with
  anastrozole or placebo: BONE AGE ADVANCED +2.7 YEARS AT TWO YEARS AND +4.1 YEARS AT THREE YEARS ON GH
  ALONE. THAT IS 1.37 YEARS OF BONE AGE PER CALENDAR YEAR - GROWTH HORMONE DOES NOT MERELY ADVANCE
  MATURATION, IT ADVANCES IT FASTER THAN REAL TIME. Anastrozole cut it to +1.8 and +2.5 years, about 0.83
  per year, with predicted adult height +6.7 cm against +1 cm at 36 months; and tanriverdi2023 in TRUE
  adult height found no overall difference but 173.1 against 169.8 cm (P = 0.044) when anastrozole ran two
  years or more. SO THE ARM WITH A MEASURED MATURATION COST IS NOT THE FGFR ARM. IT IS GROWTH HORMONE, and
  the aromatase inhibitor is what pays for it.

  "FGFR1 BLUNTS THE HAMMER TO FGFR3" - A CATEGORY ERROR. Occupancy at FGFR1 does not subtract from
  occupancy at FGFR3; they are separate receptors bound by the same molecule at their own affinities. The
  real FGFR1 question, from round 235, is whether its inhibition is a COST (phosphate, slips) or a BENEFIT
  (a hypertrophic-compartment action and therefore a second Hunziker term) - and that is unresolved. It is
  not a question about dilution and there is no dilution.

  "THE ONLY ISSUES ARE SIDE EFFECTS" - the side effects ARE the mechanism, because duration is the only
  lever rounds 228, 229 and 234 left standing and what ends duration is discontinuation. BUT THIS IS WHERE
  THE CHALLENGE LANDS, AND IT LANDS HARD.

  THE PAUSE WAS AN ONCOLOGY ARTEFACT AND I IMPORTED IT WITHOUT EXAMINING IT. Every round since 228 has
  leaned on "all five FDA cases discontinued permanently and three required surgery". READ WHY THEY
  STOPPED: nadeaunguyen2026 is a pharmacovigilance evaluation OF SKELETAL GROWTH TOXICITY, and the drug was
  stopped BECAUSE ACCELERATED GROWTH WAS THE ADVERSE EVENT. In a setting where growth is the endpoint that
  reason does not transfer at all. WHAT WOULD GENUINELY FORCE A STOP is mechanical failure (3 of 7 in
  farouk2023, 1 of 11 in RAGNAR), CENTRAL SEROUS RETINOPATHY and other ocular toxicity, and serum phosphate
  at or above 10 mg/dL for more than two weeks which the label makes permanent. AND THE EXISTENCE PROOF IS
  ALREADY HELD - farouk2023 subject 3 RAN FORTY CONTINUOUS MONTHS, the largest response on record, stopping
  for none of these, his one skeletal event deemed unrelated and the drug continued. Recorded as CORR-246.

  THE VERDICT IN FOUR LINES. MOLECULE - erdafitinib, because nothing else is obtainable, and the FGFR1 cost
  is therefore unavoidable rather than chosen. PHOSPHATE - manage it from 5.5 mg/dL, which is the
  FGFR3-selective programme's own intervention threshold rather than erdafitinib's 7.0, because that arm
  carries the mechanical failure and none of the height. DOSE - the remaining decision is the LOWEST dose
  that still saturates, since the response is flat from 1.72 to 4.01 times the cellular IC50 while every
  cost scales with dose, and nobody has mapped below 1.72. AND THE ARM THAT DESERVES THE SCRUTINY IS NOT
  THIS ONE - it is growth hormone, the only agent in the stack with a randomised, quantified bone-age cost.

  ONE MORE THING THE ATLAS ALREADY HELD AND HAS NOT ACTED ON. nearfinal2026, 72 males with ADVANCED OR
  RAPIDLY ADVANCING BONE AGE treated to NEAR-FINAL HEIGHT - the closest published population to this case -
  found a median gain over initial predicted height of only +1.2 cm (IQR -1.9 to 4.2), with LETROZOLE +4.2
  cm AGAINST ANASTROZOLE +0.8 cm, P = 0.013, and longer treatment, earlier pubertal stage and concurrent GH
  each independently associated with more gain. Against that, cui2025 in ISS boys with bone age 13 or over
  gives adjusted adult height SDS 0.81 for anastrozole plus GH against 0.60 for letrozole plus GH - the
  opposite ordering in a different population on a different endpoint. THE AROMATASE CHOICE IN THIS STACK
  IS THEREFORE NOT SETTLED, and it sits on the arm that round 235 promoted to load-bearing.
quantitative:
- parameter: obtainability of every FGFR inhibitor considered, checked against the registry
  value: >-
    DEBIO1347 - development halted, NCT01948297 TERMINATED and NCT03834220 TERMINATED, no active
    programme, and it is the agent behind the largest human growth response on record. DABOGRATINIB /
    TYRA-300 - investigational only across five trials (NCT05544552, NCT06995677, NCT07265947, a
    healthy-volunteer study, and BEACH301 NCT06842355 in children aged 3 to 10 with achondroplasia).
    INFIGRATINIB - not approved for achondroplasia; PROPEL3 completed, extension enrolling by invitation.
    ERDAFITINIB, PEMIGATINIB, FUTIBATINIB - approved and marketed, and ALL THREE ARE PAN-FGFR
  unit: development or marketing status
  conditions: ClinicalTrials.gov registry query, 2026-08-11
  species: not_applicable
  source_ref: dabogratinib2026
  uncertainty: >-
    REGISTRY STATUS IS NOT THE SAME AS ACCESS. Expanded access, single-patient INDs and named-patient
    supply exist and are exactly how farouk2021's five children received Debio1347 - under SINGLE PATIENT
    USE PROTOCOLS from the manufacturer. So "investigational" bounds the ordinary route and does not close
    every route. What is established is that no FGFR3-selective agent can be prescribed
- parameter: bone age evidence by stack arm, ranked by strength
  value: >-
    VOSORITIDE - randomised Study 111-301, n = 61 against 60, bone age change over 52 weeks 1.02 (SD 0.83)
    years against placebo 1.14 (SD 0.82), and at week 104 in 33 subjects the change in bone age minus
    chronological age was -0.05 (1.46) years. GROWTH HORMONE - randomised, mauras2008, bone age advance
    +2.7 years at 2 years and +4.1 at 3 years on GH alone, which is 1.37 YEARS PER CALENDAR YEAR; +1.8 and
    +2.5 years with anastrozole added, about 0.83 per year. THE FGFR ARM - NO ON-TREATMENT BONE AGE EXISTS
    IN ANY PATIENT, and the only claim of non-acceleration is a conference abstract in achondroplasia
  unit: years of bone age change, and years of bone age per calendar year
  conditions: two randomised trials and one exhaustive negative search
  species: human
  source_ref: fda_voxzogo_multidiscipline_review_2021
  uncertainty: >-
    THE THREE ARMS ARE NOT MEASURED IN THE SAME POPULATION and cannot be ranked as if they were - vosoritide
    in achondroplasia, GH in GH-deficient adolescents, the FGFR arm nowhere. CORR-230 applies to the
    vosoritide comparison: an SD of 0.82 on a 52-week Greulich-Pyle change comfortably contains the 0.12
    gap, so "slightly less than placebo" means NO DETECTABLE DIFFERENCE rather than a protective effect
- parameter: what would actually stop erdafitinib if growth is the endpoint rather than the toxicity
  value: >-
    NOT the FDA series' 100 per cent discontinuation, because those stopped BECAUSE accelerated growth was
    the reported adverse event. The genuine stopping rules are MECHANICAL FAILURE - slipped capital femoral
    epiphysis in 3 of 7 in farouk2023 and 1 of 11 in RAGNAR's paediatric cohort; CENTRAL SEROUS RETINOPATHY
    and other ocular toxicity, dose-limiting and an FGFR1/2 effect; and SERUM PHOSPHATE at or above 10
    mg/dL for more than two weeks, which the label makes a PERMANENT discontinuation. Against these,
    farouk2023 subject 3 ran FORTY CONTINUOUS MONTHS and stopped for none of them
  unit: stopping rule and observed rate
  conditions: label stopping rules against the two paediatric cohorts with denominators
  species: human
  source_ref: balversa_label_2025
  uncertainty: >-
    ONE PATIENT RAN FORTY MONTHS AND HE IS ONE PATIENT - he was also on Debio1347 rather than erdafitinib
    (CORR-235), so the tolerability of a FORTY-MONTH ERDAFITINIB COURSE IN A CHILD IS UNOBSERVED. The
    SCFE rates come from small series with no denominators in the pharmacovigilance arm, and spontaneous
    reporting biases toward the dramatic
- parameter: the aromatase choice in a population matched to this case, and it conflicts
  value: >-
    nearfinal2026 - 72 males with ADVANCED or RAPIDLY ADVANCING bone age treated to NEAR-FINAL HEIGHT,
    median gain over initial predicted height +1.2 cm (IQR -1.9 to 4.2); LETROZOLE +4.2 cm (IQR 0.6 to 13)
    against ANASTROZOLE +0.8 cm (IQR -2.6 to 3.5), P = 0.013; longer treatment (P = 0.005), earlier
    pubertal stage at start (P = 0.012) and concurrent GH (P = 0.022) each independently associated with
    more gain. AGAINST THAT, cui2025 - propensity-matched ISS boys with bone age 13 or over, adult height
    SDS adjusted for target height 0.81 for anastrozole plus GH against 0.60 for letrozole plus GH
  unit: cm of near-final height gain, and adult height SDS adjusted for target
  conditions: two retrospective cohorts, different populations, different endpoints, opposite orderings
  species: human
  source_ref: nearfinal2026
  uncertainty: >-
    BOTH ARE RETROSPECTIVE AND THEY DISAGREE, and the endpoints are not the same quantity - near-final
    height minus INITIAL PREDICTED height is a different construct from adult height SDS adjusted for
    target height, and prediction error enters the first one twice. The nearfinal2026 population is the
    closer match to this case; the cui2025 design is the stronger one. THE ORDERING IS NOT ESTABLISHED
localization:
- 'the pharmacy, which is where the molecule comparison was actually decided'
- 'the growth plate, where growth hormone is spending bone age at 1.37 years per year'
human_evidence: direct
human_evidence_note: >-
  Two randomised trials with bone-age endpoints, two retrospective aromatase cohorts, two paediatric FGFR
  cohorts with denominators, and a registry query. All human or documentary.
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  Human throughout. The limits are cross-population comparison and retrospective design, not species.
confidence: B
claim_grades:
- claim: the FGFR3-selective agent is the better molecule for this stack
  grade: X
  basis: >-
    CORRECT AS PHARMACOLOGY AND INERT AS ADVICE - no FGFR3-selective agent is obtainable. Debio1347's
    development is halted, dabogratinib is investigational across five trials, and every marketed FGFR
    inhibitor is pan-FGFR. Recorded as CORR-245
- claim: FGFR inhibition does not accelerate bone age
  grade: E
  basis: >-
    NOT ESTABLISHED IN EITHER DIRECTION. No on-treatment bone age exists under any FGFR inhibitor in any
    patient; the sole non-acceleration claim is a conference abstract in achondroplasia; and the mouse data
    show enlarged secondary ossification centres and increased type X collagen area, which point the other
    way. THIS IS THE WEAKEST ARM IN THE STACK ON MATURATION, NOT THE SAFEST
- claim: vosoritide's effect on bone age is uncertain relative to the FGFR arm's
  grade: X
  basis: >-
    INVERTED. Vosoritide has the only randomised regulator-reviewed bone-age measurement in the stack - 52
    weeks 1.02 against 1.14 years, and week 104 bone age minus chronological age -0.05 (1.46) years in 33
    subjects. The FGFR arm has no measurement at all
- claim: growth hormone advances bone age faster than real time
  grade: A
  basis: >-
    RANDOMISED AND QUANTIFIED. mauras2008 - +2.7 years of bone age at two years and +4.1 at three years on
    GH alone, which is 1.37 years per calendar year, falling to about 0.83 with anastrozole added
- claim: FGFR1 inhibition blunts FGFR3 inhibition
  grade: X
  basis: >-
    A CATEGORY ERROR. Occupancy at one receptor does not subtract from occupancy at another; the molecule
    binds each at its own affinity. The real FGFR1 question is cost against benefit (round 235), not dilution
- claim: treatment interruption is inherent to using an FGFR inhibitor for growth
  grade: X
  basis: >-
    FALSE AND IMPORTED FROM ONCOLOGY. The FDA series' universal discontinuation happened BECAUSE
    accelerated growth was the reported adverse event. The genuine stopping rules are mechanical failure,
    ocular toxicity and phosphate at or above 10 mg/dL for over two weeks - and subject 3 ran forty
    continuous months against none of them. Recorded as CORR-246
