    a 200 g rat. And the derived volume of distribution, 0.20 to 0.35 L/kg, is INDEPENDENT of the assumed
    blood volume, which cancels'
  unit: milligrams dry, and ratio to expectation
  conditions: 'Computed at round 139 from the two tables in epa_dwcd_endothall_1992 with a total dose of
    407000 cpm. Reference wet organ masses for a 200 g rat with conventional dry fractions of 0.20 to
    0.28. Blood cancels because the fraction of absorbed drug residing in blood scales with blood volume
    in the same way the volume of distribution divides by it.'
  species: rat
  source_ref: epa_dwcd_endothall_1992
  uncertainty: 'SIX ORGANS AGREE WITH PHYSIOLOGY TO WITHIN 7 TO 29 PER CENT, WHICH IS AS GOOD AS THIS KIND
    OF CROSS-CHECK GETS on 1967 data read through a 1992 scan by optical character recognition. The
    systematic shortfall of about 15 per cent is what you would expect if the rats were slightly smaller
    than the assumed 200 g or the dry fractions slightly higher. THE CONSEQUENCE IS THAT THE
    ROUND-138 GET-LIST ITEM FOR A RAT BLOOD DRY-WEIGHT FRACTION IS RETIRED - it was the one assumption
    that did not cancel, and it is now bounded by the internal consistency of the source rather than by
