- parameter: 'THE ELEVEN MISSING ITEMS, ORDERED BY HOW MUCH EACH MOVES THE DESIGN'
  value: 'one blocking, three that set the dose, three that set the interpretation, four that set the
    logistics'
  unit: count
  conditions: 'BLOCKING - (1) ENDOTHALL PHARMACOKINETICS AFTER DOSING ENDOTHALL, any species. It does not
    exist in the open literature; every number in the atlas came from dosing a prodrug, so clearance and
    fractional conversion are confounded, and that product is the 7 to 22-fold by which human measurements
    undershoot the model. The likely home is the EPA metabolism and pharmacokinetics studies, guideline
