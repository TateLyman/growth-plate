localization:
- 'the unresolved quantity is spatial - everything here is plasma or medium, and the concentration that
  matters is interstitial fluid inside an avascular anionic gel, which no one has measured for this
  compound or any compound in this class'
human_evidence: indirect
human_evidence_note: 'The only human inputs are the chung2017 exposure measurements and the EPA human
  health reference dose. The design itself is a mouse experiment and its variance structure comes from
  mouse data.'
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: 'The experiment is designed to test a mouse-to-mouse question - does a
  pharmacological agent reproduce a fraction of a mouse genotype - and even a clean positive would leave
  the human exposure gap and the class-level renal toxicity untouched. Its value is as a go/no-go on the
  mechanism, not as a translational step.'
confidence: D
claim_grades:
- claim: Eight weeks is the right powered endpoint and about 20 animals per group is the right size.
  grade: B
  basis: 'Computed from the raw per-animal variance of the exact endpoint, strain and age, in the only
    dataset that has it. Graded B rather than A only because the treated-arm variance under pumped dosing
    will exceed a genotype cohort variance and that inflation factor is assumed, not measured.'
- claim: A divalent anion is electrostatically excluded from growth-plate matrix by a factor of 3 to 7.
  grade: E
  basis: 'Ideal Donnan arithmetic on a measured fixed charge density from a different species and a
    partly different tissue, with the compound charge state assumed rather than read from the
    dissociation-constant study. Directionally solid, numerically soft.'
- claim: The sedation seen at 0.3 mg/kg is the brain-penetrant parent, not endothall.
  grade: E
  basis: 'Endothall was below a 20 ng/g brain limit while the ester parents reached 43 to 60 ng/g in the
    same experiment, and the patent premise is that endothall needs an ester to get into brain. But the
    dosed compounds were not LB-100, n was 2, and nobody has measured brain LB-100 or brain endothall
    after LB-100 itself.'
- claim: The intact growth plate needs 3 to 13 times the isolated-enzyme IC50.
  grade: D
  basis: 'Rests on one paper three qualitative concentration points, converted through a hydrolysis
    half-life measured in a different medium by a different group. The bracket is wide because the data
    are three points, not a curve.'
