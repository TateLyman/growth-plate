id: round353_the_plate_question_answered_the_chondrocyte_has_the_degrader_machinery_and_the_molecule_is_cationic
name: 'Round 353 - THE PLATE QUESTION, ANSWERED BOTH WAYS. A PROTAC needs a two-part receiver test nobody had
  run: the chondrocyte carries cereblon, the CRL4 scaffold and the proteasome, and vepdegestrant is a 724 Da
  CATIONIC molecule, which is the physicochemical class that partitions INTO negatively charged cartilage -
  but ESR1 itself is contaminant-leaning, and the resolution is that the two objections cancel'
aliases:
- PROTAC receiver test
- cereblon in the growth plate
- vepdegestrant cationic Donnan partitioning
- ESR1 is contaminant-leaning
- free concentration versus IC50
type: intervention
layer: L12
stub: false
summary: 'The operator asked for the plate question to be settled. A PROTAC makes that question TWO questions,
  and this atlas had never asked either. A small-molecule inhibitor needs its target present. A DEGRADER needs
  the target AND the E3 ligase AND the proteasome, all in the same cell, and it needs to physically reach
  them. Both halves were computed.

  ONE - THE DEGRADER MACHINERY IS IN THE CHONDROCYTE, AND SEVERAL COMPONENTS ARE CARTILAGE-ENRICHED. In the
  purity-corrected postnatal human growth plate: CRBN 31.5 CPM detected in 12/12 samples, DDB1 105.1 (1.60x
  enriched), CUL4B 37.7 (1.50x), RBX1 126.7 (1.68x), NEDD8 130.1 (2.18x), NAE1 26.5 (1.03x). The proteasome is
  complete and partly enriched: PSMB5 98.3 (2.27x), PSMC1 67.9 (1.70x), PSMA1 90.5, PSMD1 55.8, with ubiquitin
  itself at UBC 1044.3 (1.54x) and UBB 468.6. CUL4A (0.40x) and UBE2G1 (0.27x) are contaminant-leaning, but
  CUL4B - the functionally redundant paralogue in CRL4 - is enriched. THE CHONDROCYTE CAN EXECUTE
  CEREBLON-MEDIATED DEGRADATION. Zero atlas coverage for every one of these genes before this round.

  TWO - AND THE MOLECULE IS ALMOST IDEALLY BUILT FOR CARTILAGE, WHICH IS THE OPPOSITE OF WHAT I EXPECTED.
  From the label: molecular formula C45H49N5O4, MOLECULAR WEIGHT 723.90 DALTONS. That is small for a
  heterobifunctional degrader. More important is the ionisation: the structure contains a PIPERIDINE and a
  PIPERAZINE, two basic centres that are substantially protonated at physiological pH, against one weakly
  acidic phenol and one glutarimide. THE MOLECULE CARRIES NET POSITIVE CHARGE AT pH 7.4. The label confirms
  basic character behaviourally - solubility is pH dependent, freely soluble at gastric pH and only slightly
  soluble at intestinal pH, which is the classic signature of a base.

  THREE - AND THAT IS EXACTLY THE CLASS THIS ATLAS ALREADY KNOWS PARTITIONS INTO CARTILAGE. R315 established
  the physics and then never applied it to a small molecule: cartilage carries a high negative fixed charge
  density - measured in this file at -0.19 to -0.35 M in calf EPIPHYSEAL cartilage against -0.28 M articular -
  and CATIONIC solutes partition INTO that matrix by Donnan equilibrium, which is the entire basis of the
  CPC+14 cationic carrier work that put IGF-1 and IL-1Ra through full-thickness cartilage. R315 concluded that
  a protein biologic would need a cationic carrier bolted on. VEPDEGESTRANT DOES NOT NEED ONE. IT IS ALREADY
  CATIONIC, AND IT IS A TENTH THE SIZE OF THE PROTEINS THAT CROSSED.

  FOUR - THE QUANTITATIVE MARGIN, AND IT SETS THE DOSE FLOOR. At 200 mg with food the label gives Cmax
  926 ng/mL and AUC 17,155 ng.h/mL. Converting at MW 723.9: Cmax is 1,279 nM total and average steady-state
  concentration is 987 nM total. Plasma protein binding exceeds 99%, so FREE concentrations are below 12.8 nM
  at peak and about 9.9 nM on average. Against vepdegestrants own measured potency - ERE-driven transcription
  IC50 3 nM, anti-proliferative IC50 2.3 nM - free plasma sits at roughly 3.3 to 4.3 times IC50 AROUND THE
  CLOCK at 200 mg, and 1.6 to 2.1 times at 100 mg, BEFORE any Donnan enrichment in cartilage. That is the
  quantitative justification for R352s 100 mg recommendation AND the reason 100 mg is the FLOOR rather than a
  starting point for further reduction.

  FIVE - AND NOW THE PROBLEM, WHICH I AM NOT GOING TO BURY. ESR1 ITSELF IS CONTAMINANT-LEANING. In the same
  purity-corrected data ESR1 is 20.1 CPM in pure cartilage against 131.2 in the blood- and immune-rich samples,
  a ratio of 0.16. ESR2 is 0.04. The entire ER transcriptional apparatus runs the same way - NCOA1 0.11,
  NCOA2 0.10, NCOA3 0.17, NCOR1 0.37 - and the canonical oestrogen target genes are close to absent: GREB1
  1.1 CPM, PGR 3.8, TFF1 0.1 in only 4 of 12 samples. On the plain CORR-327 receiver test a ratio of 0.16 sits
  in the range that killed losartan (AGTR1 0.03) and sacubitril (MME 0.17). THIS IS THE SINGLE WEAKEST POINT
  IN THE WHOLE PROPOSAL AND IT DESERVES TO BE STATED AS SUCH.

  SIX - WHY IT IS NOT A KILL, IN THREE STEPS, THE THIRD OF WHICH IS THE ELEGANT ONE. (a) A RATIO IS NOT AN
  ABSENCE: 20.1 CPM detected in 12 of 12 samples is a real presence, comparable to TET1 at 19.2 CPM which this
  file works with freely. The ratio says ESR1 is not CONCENTRATED in chondrocytes, not that it is missing from
  them. (b) THE FUNCTIONAL EXPERIMENT OVERRIDES THE TRANSCRIPT COUNT: brjesson2010 deleted ERalpha
  SPECIFICALLY FROM CARTILAGE and got a length phenotype - the mice grew past 4 months when controls stopped
  and had increased femur length at 1 year. You cannot obtain a phenotype by deleting a gene from a cell type
  in which it does no work. (c) AND IF THE OPERATIVE ERalpha IS NOT IN THE CHONDROCYTE AT ALL - if it sits in
  the perichondrium, the vasculature invading the plate, the marrow or the osteoblast lineage, which is what
  the 0.16 ratio most naturally suggests - THEN R315s AVASCULAR DELIVERY WALL DOES NOT APPLY, because every
  one of those compartments is perfused. THE TWO OBJECTIONS SOLVE EACH OTHER: if the target is in the
  avascular chondrocyte, the cationic 724 Da molecule partitions in; if it is in the perfused compartment,
  ordinary distribution reaches it. There is no configuration in which the target is present and the drug
  cannot get to it.

  SEVEN - WHAT ELSE TO ADD, AND WHAT NOT TO CHANGE. KEEP ANASTROZOLE. Degradation is 76 to 94 per cent, not
  100, so residual receptor remains and still benefits from having its ligand suppressed; the two act at
  different steps and the ligand arm is cheap. KEEP GROWTH HORMONE, and it becomes MORE favourable rather than
  less: removing ERalpha should raise IGF-1 at a fixed GH dose, and the ligand-independent ERalpha activation
  that R351 argued IGF-1 drives is precisely what a degrader neutralises - the hidden cost of the GH arm is
  removed by the new agent. ADD ORAL SODIUM SULFATE but NOT on the same day, because vepdegestrant is cleared
  primarily by SULT sulfation and sulfate feeds that pathways donor pool.

  EIGHT - AND ONE SUBTRACTION IS NOW DOUBLY MOTIVATED. PARACETAMOL drops serum inorganic sulfate 24 per cent
  per 1.5 g dose (R321). That costs the sulfate arm directly, AND by depleting the PAPS donor pool it could
  SLOW SULT-mediated clearance of vepdegestrant and raise its exposure - in a drug that prolongs QTc by 12 ms
  at the label dose. Separately, proton-pump inhibitors reduce vepdegestrant AUC to 84 per cent, so any acid
  reducer is a real exposure variable. Both are free to act on.'
quantitative:
- parameter: 'THE PROTAC RECEIVER TEST - CEREBLON, THE CRL4 SCAFFOLD AND THE PROTEASOME ARE ALL IN THE HUMAN GROWTH PLATE'
  value: 'Purity-corrected postnatal human growth plate, mean CPM in the 5 purest samples versus the 5 most
    blood-contaminated, with the pure/contaminated ratio, all detected 12/12. DEGRADER MACHINERY: CRBN 31.5
    (0.69), DDB1 105.1 (1.60), CUL4A 38.0 (0.40), CUL4B 37.7 (1.50), RBX1 126.7 (1.68), NEDD8 130.1 (2.18),
    NAE1 26.5 (1.03), UBA3 27.7 (0.66), UBE2D3 244.1 (0.66), UBE2G1 26.1 (0.27). PROTEASOME AND UBIQUITIN:
    PSMA1 90.5 (0.85), PSMB5 98.3 (2.27), PSMD1 55.8 (0.50), PSMC1 67.9 (1.70), UBB 468.6 (1.23), UBC 1044.3
    (1.54). Every one of these genes had ZERO prior mentions anywhere in this atlas'
  unit: CPM; pure/contaminated ratio
  conditions: computed 2026-08-13 from atlas/data/round344/gse288028_human12_cpm.npy, GSE288028, 12 human
    samples stratified on COL2A1.
  species: human
  source_ref: gse288028
  atlas_derived: true
  uncertainty: 'TRANSCRIPT PRESENCE IS NOT ENZYME ACTIVITY, and no one has demonstrated CRBN-mediated
    degradation of anything in a chondrocyte. CRBN itself is the least favourable member of the set at a ratio
    of 0.69 and only 31.5 CPM - present in every sample, but not cartilage-enriched. CUL4A and UBE2G1 are
    contaminant-leaning; the argument leans on CUL4B being the redundant paralogue, which is established
    biology but is an inference here. The proteasome is ubiquitous in all cells, so its presence is close to
    uninformative and is reported for completeness rather than as evidence. What this establishes is that
    there is no missing component - not that the machinery is efficient in this cell type.'
- parameter: 'THE MOLECULE IS 724 Da AND CATIONIC - THE CLASS THAT PARTITIONS INTO CARTILAGE'
  value: 'Vepdegestrant molecular formula C45H49N5O4, MOLECULAR WEIGHT 723.90 DALTONS (label, section 11).
    Structure contains a PIPERIDINE and a PIPERAZINE - two basic nitrogens substantially protonated at pH 7.4 -
    against one phenol and one glutarimide imide, both weakly acidic with pKa near or above 10. Net charge at
    physiological pH is positive. The label independently reports the behavioural signature of a base:
    solubility is pH dependent, FREELY SOLUBLE under gastric pH conditions and only SLIGHTLY SOLUBLE under
    intestinal pH. Against this, the atlas holds the cartilage physics: fixed charge density of -0.19 to
    -0.35 M in calf EPIPHYSEAL cartilage versus -0.28 M in articular cartilage, and cationic carriers
    (CPC+14, avidin) exploiting Donnan equilibrium to drive proteins of 7.6 to 17 kDa through full-thickness
    cartilage into a bound depot'
  unit: Daltons; molar fixed charge density
  conditions: fda_veppanu_label_2026 section 11 read 2026-08-13; cartilage fixed charge density and cationic
    carrier data as already held in the atlas from R315.
  species: not_applicable
  source_ref: fda_veppanu_label_2026
  uncertainty: 'THE IONISATION IS MY ASSIGNMENT FROM THE CHEMICAL NAME AND FORMULA, NOT A MEASURED pKa - the
    label gives neither pKa nor logD, and I have not retrieved them. Piperidine and piperazine are basic as a
    class and the pH-solubility profile corroborates it, but the actual net charge at pH 7.4 depends on
    substituent effects I have not calculated. MORE IMPORTANTLY, NO ONE HAS MEASURED THIS MOLECULE IN
    CARTILAGE IN ANY SPECIES. The Donnan argument is a physical prediction from charge and matrix properties,
    which is exactly the grade-E reasoning R315 used for its own construct, and rat whole-body autoradiography
    did not list bone or cartilage among the tissues of highest distribution. This lowers the delivery
    objection substantially; it does not close it.'
- parameter: 'FREE CONCENTRATION VERSUS MEASURED POTENCY - THE MARGIN THAT SETS THE DOSE FLOOR'
  value: 'At 200 mg once daily with food: Cmax 926 ng/mL and AUC 17,155 ng.h/mL. At MW 723.9 that is 1,279 nM
    total at peak and 987 nM total as the 24-hour average concentration. With plasma protein binding above
    99%, free concentrations are below 12.8 nM at peak and approximately 9.9 nM on average. Vepdegestrant
    potency from the nonclinical package: ERE-driven transcriptional inhibition IC50 3 nM, anti-proliferative
    IC50 2.3 nM. RATIOS OF FREE AVERAGE CONCENTRATION TO IC50: at 200 mg, 3.3-fold (ERE) and 4.3-fold
    (anti-proliferative); at 100 mg, assuming the labels dose-proportionality from 100 to 500 mg, 1.6-fold and
    2.1-fold'
  unit: nM; fold over IC50
  conditions: computed 2026-08-13 from fda_veppanu_label_2026 PK and fda_veppanu_mdr_2026 potency values.
  species: human
  source_ref: fda_veppanu_label_2026
  atlas_derived: true
  uncertainty: 'THE FREE FRACTION IS AN UPPER BOUND: the label states binding is >99%, so 1% is the maximum
    free fraction and the true figure may be lower, which would reduce every ratio proportionally. The IC50s
    are cell-based potency values in breast cancer lines for transcriptional inhibition and proliferation, NOT
    degradation potency in chondrocytes, and the relationship between an ERE IC50 and the degradation achieved
    in a growth plate is unestablished. No Donnan enrichment factor has been applied because none has been
    measured for this molecule. The calculation is offered as an order-of-magnitude check that supports 100 mg
    as a floor - not as a predicted tissue concentration.'
- parameter: 'THE WEAKEST POINT - ESR1 AND ITS WHOLE APPARATUS ARE CONTAMINANT-LEANING IN THE GROWTH PLATE'
  value: 'Purity-corrected, pure versus contaminated CPM with ratio: ESR1 20.1 vs 131.2 (0.16), ESR2 0.6 vs
    41.6 (0.04), GPER1 3.2 vs 4.6 (0.76). Coactivators and corepressor: NCOA1 35.3 vs 322.1 (0.11), NCOA2 30.0
    vs 305.8 (0.10), NCOA3 47.9 vs 288.7 (0.17), NCOR1 80.0 vs 220.1 (0.37). CANONICAL OESTROGEN TARGET GENES
    ARE NEAR-ABSENT: GREB1 1.1 CPM, PGR 3.8, TFF1 0.1 detected in only 4 of 12 samples. For calibration in the
    same dataset, the leukocyte marker PTPRC has a ratio of 0.03 and HBB 0.69, while COL2A1 is 9.67 and
    COL10A1 107.34'
  unit: CPM; pure/contaminated ratio
  conditions: computed 2026-08-13 from GSE288028 purity-corrected.
  species: human
  source_ref: gse288028
  atlas_derived: true
  uncertainty: 'THIS IS THE OBJECTION AND IT IS SERIOUS. A ratio of 0.16 with the entire coactivator apparatus
    at 0.10-0.17 and no detectable ER target-gene programme is what a contaminating cell type looks like, and
    on the plain CORR-327 test it sits alongside calls this file has treated as kills. THREE THINGS ARGUE
    AGAINST READING IT THAT WAY, and none of them is decisive. First, 20.1 CPM detected in 12/12 samples is a
    genuine presence, comparable to targets this file works with. Second, brjesson2010 obtained a length
    phenotype from a CARTILAGE-SPECIFIC deletion, which transcript abundance cannot overrule. Third, GREB1,
    PGR and TFF1 are breast and uterine ER targets and cartilage ERalpha may drive a different programme -
    which is a fair point and also exactly the kind of unfalsifiable defence this file distrusts. The
    measurement that would settle it is ERalpha PROTEIN by immunostaining in zone-resolved human growth
    plate, which the atlas has never done and which needs no new tissue.'
localization:
- 'the cereblon-CRL4 degradation machinery and the proteasome are present in the purity-corrected human growth
  plate, with DDB1, CUL4B, RBX1, NEDD8, PSMB5, PSMC1 and UBC cartilage-enriched'
- 'ESR1 is present at 20.1 CPM in 12/12 samples but is contaminant-leaning at a ratio of 0.16, so the
  operative ERalpha may sit in the perfused compartments around and within the plate rather than in the
  avascular chondrocyte - a configuration that would remove the delivery objection entirely'
human_evidence: direct
human_evidence_note: 'The expression data are human postnatal growth plate. The physicochemistry and PK are
  human regulatory data. What remains absent in humans is any measurement of this molecule, or any PROTAC, in
  cartilage - and any measurement of ERalpha PROTEIN in growth-plate chondrocytes under any degrader.'
species_basis:
- human
translation_risk: high
translation_risk_reason: 'The delivery argument is a physical prediction from charge and molecular weight
  rather than a measurement, and the target transcript is contaminant-leaning, so the two load-bearing facts
  are an inference and a weakness respectively.'
confidence: C
claim_grades:
- claim: The human growth plate contains the machinery a cereblon-based PROTAC requires.
  grade: B
  basis: 'CRBN detected in 12/12 samples at 31.5 CPM with DDB1 (1.60x), CUL4B (1.50x), RBX1 (1.68x) and NEDD8
    (2.18x) cartilage-enriched, and a complete proteasome including PSMB5 at 2.27x. Graded B not A because
    transcript presence is not demonstrated enzymatic competence, CRBN itself is not enriched, and no
    CRBN-mediated degradation has ever been shown in a chondrocyte.'
- claim: Vepdegestrant is physicochemically suited to penetrate cartilage.
  grade: C
  basis: 'MW 723.90 from the label, far below the size at which cartilage exclusion becomes limiting, with two
    basic centres giving net positive charge at physiological pH - corroborated by the labels pH-dependent
    solubility - which is the property the atlas already documents as driving Donnan partitioning INTO
    negatively charged cartilage at fixed charge densities of -0.19 to -0.35 M in epiphyseal tissue. Graded C
    because the ionisation is assigned from structure rather than a measured pKa and no one has measured this
    molecule in cartilage in any species.'
- claim: Free plasma concentration exceeds vepdegestrant's measured potency around the clock at 100 mg.
  grade: C
  basis: 'Free average concentration approximately 4.9 nM at 100 mg against an ERE IC50 of 3 nM and an
    anti-proliferative IC50 of 2.3 nM, before any cartilage enrichment. Graded C because the free fraction is
    an upper bound taken from >99% binding, and because cell-based transcriptional IC50s are not degradation
    potency in the target tissue.'
- claim: ESR1 is well represented in growth-plate chondrocytes.
  grade: X
  basis: 'NO. ESR1 is contaminant-leaning at a pure/contaminated ratio of 0.16, with the coactivator apparatus
    at 0.10-0.17 and canonical ER target genes near-absent. This is the weakest point in the proposal and it
    is recorded as such. What preserves the axis is brjesson2010s cartilage-specific deletion phenotype and
    the fact that a non-chondrocyte operative compartment would be perfused and therefore easier to reach, not
    a defence of the transcript number.'
