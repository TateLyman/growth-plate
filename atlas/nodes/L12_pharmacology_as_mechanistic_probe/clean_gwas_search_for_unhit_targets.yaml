id: clean_gwas_search_for_unhit_targets
name: What an unbiased human height GWAS ranking says about targets the stack does not hit - and it disagrees with how this atlas ranked the arms
aliases:
- the clean search
- NPR3 outranks FGFR3
- what to add next
type: hypothesis
layer: L12
stub: false
summary: 'THIS NODE WAS BUILT BY DELIBERATELY NOT CONSULTING THE ATLAS FRAMEWORK. The instruction was a
  clean search, so the method was: take the Open Targets association ranking for human body height
  (OBA_VT0001253, 10,856 associated targets) and for Tall stature (HP_0000098, 85 targets), read the top
  of each, and only then ask what the stack hits. THE RANKING DISAGREES WITH THIS ATLAS ON THE MOST
  IMPORTANT POINT. NPR3 scores 0.724 and FGFR3 scores 0.703. The CNP clearance receptor OUTRANKS the
  receptor the stack is built around, and NPR2 at 0.660 and PDE3B at 0.673 are also in the top 30 - so
  three of the top thirty human height genes sit on the CNP axis, which is the arm this atlas REMOVED
  from the stack in round 86. THE ADULT-HEIGHT GENETICS SAY THE SAME THING AND THE ATLAS ALREADY HELD
  THEM: lifelong CNP-axis gain reaches 221 cm for an NPR2 activating variant and 211.1 cm for biallelic
  NPR3 loss, BOTH TRUNCATED BY EPIPHYSIODESIS AND THEREFORE FLOORS, against 195.6 cm for CATSHL, which is
  lifelong FGFR3 loss of function. The CNP axis reaches 15 to 25 cm HIGHER in humans than the FGFR3 axis
  does. Round 86 ranked the arms on acute velocity (erdafitinib 19.06 cm/yr against vosoritide 8.09) and
  on a shared-node mechanism argument, and dropped the CNP arm. On the endpoint that actually matters -
  ADULT HEIGHT - the human genetics point the other way, and that tension is now explicit (CORR-092).
  THE FOUR TARGETS THE SEARCH SURFACES THAT THE STACK DOES NOT HIT. (1) NPR3, rank 4, human biallelic
  loss gives extreme tall stature in at least two independent reports. It is a CLEARANCE receptor, which
  is the easiest class of target to block, and unlike a CNP analogue it raises CNP LOCALLY where the plate
  already makes it, so it does not face the 4 kDa partition problem that puts vosoritide partway down the
  delivery curve. It is also Gi-coupled, so blocking it should raise cAMP as well as spare cGMP - two
  limbs rather than one. (2) PIEZO1, rank 8 at 0.710, and the search resolves its SIGN: the
  PIEZO1-primary cilium axis transduces COMPRESSIVE STRESS into growth plate degeneration and
  ossification, and simulated-microgravity unloading RESCUES PIEZO1-driven ossification. So the pro-growth
  direction here is INHIBITION, not the widely used Yoda1 agonism - which is what an unexamined reach for
  the famous tool compound would have got wrong. (3) STC2 at 0.683 with LCORL at 0.698, the IGF
  bioavailability layer, and the same two genes are the canonical body-size locus in cattle. (4) The
  ADAMTS-fibrillin cluster - ADAMTS17, ADAMTS10, ADAMTS6, ADAMTS3 all in the top 25, with FBN1 the single
  highest-ranked TALL STATURE gene at 0.502. AND THE BEST RESULT OF THE SEARCH IS FREE. watanabetakano2021
  identifies periosteal-osteoblast-derived OSTEOCRIN as the mechanotransducer of LOAD-INDUCED long bone
  growth: load acts on periosteal osteoblasts, they secrete osteocrin, osteocrin occupies NPR3 as a decoy,
  and local CNP is spared. That closes a loop this atlas had open in two places at once - it gives the
  mechanical arm a molecular mechanism, and it gives the highest-ranked unhit target an ENDOGENOUS,
  EXERCISE-INDUCED ligand. It also resolves the sign conflict on loading: load is PRO-growth through
  periosteal osteocrin and ANTI-growth through direct axial compression of chondrocytes via PIEZO1 and
  mTOR. The prescription that falls out is sharper than the round-86 version - not merely load the limbs
  and unload the spine, but seek MUSCULAR AND PERIOSTEAL loading while avoiding AXIAL COMPRESSION OF THE
  PLATE.'
quantitative:
- parameter: 'THE RANKING, UNCONSULTED - NPR3 outranks FGFR3 for human height'
  value: NPR3 0.724, FGFR3 0.703, PDE3B 0.673, NPR2 0.660
  unit: Open Targets overall association score for body height
  conditions: 'Open Targets Platform v4 GraphQL, disease OBA_VT0001253 body height, 10,856 associated
    targets, queried 2026-08-08. Top of the ranking: ZFAT 0.738, ADAMTS17 0.737, ACAN 0.737, NPR3 0.724,
    IGF1R 0.720, ADAMTS10 0.718, SERPINH1 0.713, PIEZO1 0.710, SCUBE3 0.705, FGFR3 0.703, SHOX 0.700,
    CRISPLD2 0.699, LCORL 0.698, DTL 0.695, IGF2BP2 0.695, GHRH 0.692, IHH 0.689, IRS1 0.685, STC2 0.683.'
  species: human
  source_ref: opentargets_height_2026
  uncertainty: 'AN OPEN TARGETS SCORE IS AN AGGREGATE OF EVIDENCE TYPES, NOT AN EFFECT SIZE, AND MUST NOT
    BE READ AS ONE. It mixes GWAS, literature text-mining, animal models and expression, so a
    well-studied gene scores higher partly for being well studied, and the gap between 0.724 and 0.703 is
    not a claim that NPR3 moves more centimetres than FGFR3. WHAT THE RANKING IS GOOD FOR is exactly what
    it was used for here - an ENUMERATION that does not inherit this atlas own priors, to check whether
    the framework had underweighted something. It had. The finding that survives is not the decimal
    ordering, it is that THREE of the top thirty human height genes lie on the CNP axis (NPR3, PDE3B,
    NPR2), which is the arm the stack dropped.'
- parameter: 'THE ADULT-HEIGHT COMPARISON THE ATLAS ALREADY HELD AND RANKED AGAINST'
  value: 'CNP axis 211-221 cm, both floors; FGFR3 loss 195.6 cm'
  unit: cm adult height
  conditions: NPR2 activating variant 221 cm (+5.2 SD) and biallelic NPR3 loss 211.1 cm (+4.9 SD), BOTH
    TRUNCATED BY EPIPHYSIODESIS so both are floors rather than ceilings; against CATSHL syndrome, lifelong
    FGFR3 loss of function, males mean 195.6 cm (+2.8 SD) and females 177.8 cm (+2.3 SD). Acute on-treatment
    velocity runs the other way - erdafitinib 19.06 cm/year against vosoritide 8.09 cm/year
  species: human
  source_ref: moffatt2025
  uncertainty: 'THE TWO METRICS DISAGREE AND THE ATLAS RANKED ON THE WRONG ONE (CORR-092). Acute velocity
    favours FGFR3 blockade by more than twofold; lifelong adult height favours the CNP axis by 15 to 25
    cm. ADULT HEIGHT IS THE ENDPOINT. THE CAVEATS ARE SERIOUS AND THEY CUT TOWARD CAUTION RATHER THAN
    AGAINST THE POINT. These are LIFELONG genetic states accumulating from birth, and a subject at bone
    age 16 cannot recover a trajectory - the comparison establishes the CEILING of each axis, not what
    either buys from a late start. The n is tiny on both sides and case reports are ascertained on
    extremes. The SD conversions are this atlas own arithmetic on assumed population parameters. AND BOTH
    CNP-AXIS CASES CARRY THE SPINE COST: the NPR3 patient needed spinal fusion at 12 for a 39-degree Cobb
    angle and the NPR2 family had severe scoliosis with vertebral fractures - which is the same cost the
    erdafitinib child paid, so it does not differentiate the axes.'
- parameter: 'THE FREE RESULT - load drives bone growth THROUGH NPR3, via an endogenous decoy'
  value: periosteal osteocrin is the mechanotransducer of load-induced long bone growth
  unit: qualitative
  conditions: watanabetakano2021 - mechanical loading after birth acts on periosteal osteoblasts, which
    secrete OSTEOCRIN (OSTN); OSTN enhances C-type natriuretic peptide signalling at the growth plate by
    occupying NPR3 as a decoy, sparing local CNP for NPR2. Osteocrin is also known as musclin and is an
    exercise-responsive myokine with published paediatric serum reference values
  species: mouse
  source_ref: watanabetakano2021
  uncertainty: 'THIS IS THE MOST ACTIONABLE THING IN THE NODE BECAUSE IT COSTS NOTHING AND IT RESOLVES A
    SIGN CONFLICT THE ATLAS WAS CARRYING. caetanosilva2021 has quasi-static axial load RESTRAINING
    elongation through mTOR, and chen2025 has compressive stress driving growth plate ossification through
    PIEZO1 - both anti-growth. watanabetakano2021 has load PROMOTING elongation through periosteal
    osteocrin. THE RECONCILIATION IS THE SITE OF THE LOAD: periosteal and muscular tension generates
    osteocrin, while axial compression of the plate itself engages PIEZO1 and mTOR. That sharpens the
    round-86 prescription from "load the limbs, unload the spine" to "seek muscular and periosteal loading,
    avoid axial compression of the plate". WHAT IT IS NOT: mouse, one paper, no human osteocrin-to-height
    measurement is held here, and the exercise-to-musclin link is established for metabolism rather than
    for stature. The dose, mode and timing of loading that would maximise osteocrin without compressing
    the physis are entirely unspecified.'
- parameter: 'PIEZO1 - rank 8, and the search settles which way to push it'
  value: compressive stress drives ossification through PIEZO1; unloading rescues it
  unit: qualitative, direction
  conditions: chen2025 - the PIEZO1-primary cilium axis mediates compressive-stress-induced growth plate
    DEGENERATION AND OSSIFICATION; a companion 2026 report finds that simulated-microgravity mechanical
    unloading RESCUES PIEZO1-overexpression-induced growth plate ossification. PIEZO1 scores 0.710 for
    human body height, above FGFR3
  species: mouse
  source_ref: chen2025
  uncertainty: 'THE VALUE OF THIS ROW IS THAT IT PREVENTS AN ERROR RATHER THAN ENABLING AN ACTION. PIEZO1
    has a famous and freely available agonist, Yoda1, and the naive move on seeing a top-ten height gene
    with a tool compound is to reach for it. THE DIRECTION IS THE OPPOSITE: PIEZO1 transduces compression
    into premature ossification, so the pro-growth move is INHIBITION. The available inhibitor, GsMTx4, is
    a spider-venom peptide with no oral route and poor specificity across mechanosensitive channels.
    PIEZO1 is also essential in erythrocytes, endothelium and lymphatics - human loss-of-function causes
    lymphatic dysplasia - so systemic blockade is not a benign proposition. This is a mechanism to
    respect, not a target to drug, and its practical expression is the loading prescription above.'
localization:
- 'growth plate: NPR3, NPR2, PIEZO1 and the osteocrin target all act here'
- 'periosteum: where load is transduced into osteocrin'
human_evidence: direct
human_evidence_note: The ranking is human GWAS-anchored and the NPR3 and NPR2 adult heights are human
  case reports. The osteocrin mechanotransduction loop and the PIEZO1 direction are mouse.
species_basis:
- human
- mouse
translation_risk: moderate
translation_risk_reason: The target identification is human; the mechanism connecting load to NPR3 and
  the PIEZO1 sign are mouse, and no human intervention exists for either.
confidence: C
claim_grades:
- claim: The CNP axis reaches higher in human adult height than the FGFR3 axis does.
  grade: C
  basis: Two lifelong human genetic states at 211 and 221 cm, both truncated by epiphysiodesis, against
    CATSHL at 195.6 cm. Tiny n, ascertained on extremes, and the SD conversions are this atlas's.
- claim: NPR3 blockade is the highest-value unhit target for this stack.
  grade: D
  basis: A ranking that mixes evidence types, plus human loss-of-function phenotypes, plus a delivery
    argument. No NPR3 antagonist with a bone endpoint exists, and the redundancy question with an FGFR
    inhibitor is the same unresolved one that removed vosoritide.
- claim: Mechanical loading raises bone growth through periosteal osteocrin acting at NPR3.
  grade: D
  basis: One mouse paper. No human osteocrin-to-stature measurement is held here.
