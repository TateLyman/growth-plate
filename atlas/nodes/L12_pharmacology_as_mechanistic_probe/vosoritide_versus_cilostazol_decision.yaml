id: vosoritide_versus_cilostazol_decision
name: Vosoritide versus cilostazol for the h_term arm, and which pairs with erdafitinib
aliases:
- cGMP arm decision
- CNP analogue or PDE inhibitor
type: intervention
layer: L12
stub: false
summary: 'REVISED ROUND 80 ON FULL TEXTS OF BOTH PDE PAPERS - the round-79 verdict was wrong and is
  reversed (CORR-073). The atlas used wang2018 to falsify raise-cGMP-and-grow and concluded cilostazol
  therefore fails. wang2018 tested TADALAFIL, a PDE5 inhibitor, and kawabe2025 PREDICTED that null from
  mouse genetics before ever testing PDE3: it cites Pde5a-null mice having SMALL body size and Pde9a-null
  mice normal body size, reasons explicitly that PDE5A and PDE9A inhibitors are unlikely to stimulate bone
  growth, and contrasts Pde3b-null mice, which show ENLARGEMENT OF THE TIBIA. Opposite knockout phenotypes,
  opposite predictions, and both predictions confirmed experimentally. The two papers do not conflict. What
  they say together is stronger than either alone: THE PDE ISOFORM IS THE VARIABLE AND BULK cGMP IS NOT.
  THE SIZES, MEASURED. wang2018: 1-month-old rats, tadalafil 10 mg/kg/day for 3 weeks at paediatric-PAH-
  comparable doses, tissue cGMP +52 per cent (p<0.01), body weight gain -9 per cent (p<0.01), and long bone
  length, cortical and trabecular properties and histology ALL UNALTERED - a clean sufficiency failure with
  confirmed in vivo target engagement. kawabe2025: juvenile C57BL/6 mice from weaning, cilostazol 10
  mg/kg/day intraperitoneally for 4 weeks, naso-anal length 93.6 +/- 0.3 mm in vehicle against 95.3 +/- 0.5
  mm treated, P<0.05 - a gain of 1.7 mm, 1.82 per cent of body length, IN A WILD-TYPE ANIMAL, which is the
  rarest kind of result in this atlas because nearly every other positive is a rescue of a deficient model.
  Tibial growth plate length and alcian-blue ECM area rose, cell density fell slightly. The mechanism is
  dissected both pharmacologically and genetically - PKG to BK potassium channel to hyperpolarisation to
  TRPM7 calcium entry to CaMKII, blocked by KT5823, paxilline and FTY720 respectively, with Trpm7
  conditional knockouts built for the genetic test. AND THE DOSE COMES OUT THE RIGHT WAY. Allometrically
  scaled, 10 mg/kg/day in mouse is about 57 mg/day in a 70 kg human, roughly a third of the 200 mg/day
  people already take long-term for intermittent claudication. WHERE THAT LEAVES THE CHOICE. Cilostazol now
  has the better mechanistic case, better delivery (369.5 Da sits on the plateau of the partition curve
  where vosoritide at about 4 kDa is partway down the slope), oral rather than daily subcutaneous dosing,
  a wild-type length result, and a favourable dose margin. Vosoritide has the only HUMAN efficacy data,
  and no cytochrome interaction. THE ONE HARD STRIKE AGAINST CILOSTAZOL IN THIS PARTICULAR STACK IS
  UNCHANGED AND IS PHARMACOKINETIC: the FDA review states erdafitinib is in vitro a time-dependent
  INHIBITOR AND INDUCER of CYP3A4, and cilostazol is a CYP3A4 and CYP2C19 substrate, so one drug pushes the
  same enzyme in both directions with different time courses and the net effect on cilostazol exposure is
  unpredictable. Vosoritide is a 39-residue peptide cleared by peptidases and has no such interaction.
  ON MECHANISM THE STACKING ARGUMENT ALSO FLIPS. Both approved CNP-analogue labels put their mechanism at
  the RAF-1 step of the FGFR3-MAPK cascade, which is where erdafitinib already acts; the cilostazol chain
  runs through a potassium channel and a calcium channel to matrix synthesis, orthogonal to MAPK. By the
  atlas own rule - stack across control points, not within one - cilostazol is the better PARTNER and
  vosoritide the better STANDALONE. Caveat on that: CNP-NPR2 signalling also drives PKG, so the two
  converge upstream and are one axis approached from production and from degradation. CURRENT POSITION AFTER READING dauber2026: vosoritide outside
  achondroplasia gives +3.56 cm/yr, 2.3 times its achondroplasia effect, with a 4.0 SD rise in velocity
  Z-score and - critically - NO significant advance in the bone-age to chronological-age ratio over 12
  months, so the gain is not borrowed from remaining growth time. That is a far larger and far cleaner
  effect than the atlas expected. It comes with 3 slipped capital femoral epiphyses in 30 children, all in
  the long-term extension and all preceded by a visible antecedent deformity, in a cohort of PREPUBERTAL
  3-11 year olds - which is a compounding hazard for a bone-age-16 subject who sits in the natural SCFE
  peak and would also be taking an agent that carries its own SCFE signal. And every one of those children
  had MAPK excess or an NPR2 defect, so the pathway-intact case remains untested and no trial of it exists
  (null established by search). VERDICT: vosoritide is the stronger agent on evidence by a wide margin and
  cilostazol remains the better MECHANISTIC partner for erdafitinib; the binding constraint on choosing
  between them is no longer efficacy but the shared SCFE hazard, and that is a monitoring question rather
  than a pharmacology one.'

quantitative:
- parameter: 'THE FALSIFYING RESULT. Chondrocyte cGMP raised by a PDE inhibitor, and the length outcome'
  value: cGMP +37 to +52 per cent, bone length unchanged
  unit: per cent, and mm over 3 weeks
  conditions: newborn rat epiphyseal chondrocytes and rat long bone in vivo; tadalafil; peak CNP-stimulated
    cGMP +37 per cent, tissue cGMP +52 per cent; PDE5 identified as the major cGMP-hydrolysing PDE in this
    tissue; no increase in long bone length over three weeks
  species: rat
  source_ref: wang2018
  uncertainty: 'THE MOST DECISION-RELEVANT ROW IN THE NODE AND THE ATLAS HELD IT UNREAD SINCE BEFORE ROUND
    67. Abstract-level only. A three-week window in rat may be too short, and absence of a length effect
    is a negative with unstated power. But the cGMP elevation was CONFIRMED, which makes this a test of
    sufficiency rather than a failed delivery: the second messenger went up substantially and the bone did
    not grow. Any argument that a PDE inhibitor is equivalent to a CNP analogue has to answer this.'
- parameter: dominant cGMP-hydrolysing phosphodiesterase in growth plate chondrocytes
  value: PDE5, not PDE3
  unit: qualitative
  conditions: newborn rat epiphyseal chondrocytes (wang2018); separately, ursachi2026 indexes growth plate
    chondrocytes of human, mouse and chicken as expressing PDE1B, 3B, 4B, 4D, 5A, 7A, 8A and 10A
  species: rat
  source_ref: wang2018
  uncertainty: 'Cilostazol inhibits PDE3. If PDE5 carries the cGMP hydrolysis, cilostazol is acting on a
    minor route for that second messenger - and PDE3 hydrolyses cAMP as well as cGMP, so its skeletal
    effect may be a cAMP effect. Species caveat: the PDE inventory is rat for the dominance claim and
    multi-species for the expression index.'
- parameter: the human PDE3 skeletal lesion, and its direction
  value: brachydactyly
  unit: qualitative
  conditions: gain-of-function PDE3A mutations cause autosomal dominant hypertension with brachydactyly;
    described as a cAMP-hydrolysis lesion
  species: human
  source_ref: maass2015
  uncertainty: 'A WARNING RATHER THAN A REFUTATION, and it needs care about direction. More PDE3A activity
    gives SHORT digits, which naively predicts that inhibiting PDE3 should lengthen - the direction
    cilostazol wants. What it establishes is that the human PDE3 skeletal phenotype runs through cAMP, so
    the cGMP rationale for cilostazol is not the mechanism the human genetics supports. Abstract only.'
- parameter: the one positive result for cilostazol, and what it actually proposes
  value: elongation of cultured bones and enlarged juvenile mice
  unit: qualitative
  conditions: cilostazol and milrinone raised cGMP in growth plate chondrocytes, activated cell-surface
    potassium channels probably by PKG-mediated phosphorylation, and the resulting hyperpolarisation
    facilitated TRPM7-mediated calcium influx for extracellular matrix synthesis
  species: mouse
  source_ref: kawabe2025
  uncertainty: 'A WILD-TYPE LENGTH RESULT, WHICH THIS ATLAS HAS FOUND ALMOST NOWHERE ELSE, AND IT IS
    ABSTRACT-ONLY. Its proposed mechanism is NOT bulk cGMP - it is a potassium-channel and calcium-influx
    route - so wang2018 does not refute it directly. That makes cilostazol a live but single-study
    hypothesis on a different axis, not a cheap oral substitute for a CNP analogue.'
- parameter: erdafitinib target coverage at the top of its label
  value: 6.3 against 3.0
  unit: nM unbound Cmax against FGFR3 enzymatic IC50
  conditions: FDA multidisciplinary review, 8 mg dose; phosphate is the dose-limiting on-target effect and
    the label titration endpoint
  species: human
  source_ref: fda_balversa_review_2019
  uncertainty: 'WHY THE COMBINATION IS NOT REDUNDANT. Roughly twofold over the half-maximal concentration
    at maximum dose is not pathway saturation. A second agent acting downstream in the same cascade adds
    inhibition that erdafitinib cannot be pushed hard enough to supply, and does so without adding free
    erdafitinib, which is what drives the phosphate toxicity.'
- parameter: 'the drug-drug interaction that separates the two candidates in THIS stack'
  value: erdafitinib is a CYP3A4 time-dependent inhibitor AND inducer; cilostazol is a CYP3A4 substrate
  unit: qualitative
  conditions: FDA review states erdafitinib is in vitro a P-gp substrate, a time-dependent inhibitor and
    inducer for CYP3A4, and a P-gp and OCT2 inhibitor; cilostazol is metabolised by CYP3A4 and CYP2C19
  species: human
  source_ref: fda_balversa_review_2019
  uncertainty: 'One drug both inhibiting and inducing the same enzyme, with opposite signs and different
    onset kinetics, makes the net effect on a CYP3A4 substrate unpredictable and time-varying. Vosoritide,
    a 39-residue peptide cleared by peptidases, has no such interaction. This is a concrete, sourced
    reason to prefer the peptide in a stack that already contains erdafitinib, independent of which agent
    is more potent.'
- parameter: vosoritide effect size where it is established
  value: '1.57'
  unit: cm/yr adjusted mean difference in annualised growth velocity versus placebo
  conditions: pivotal phase 3, 121 randomised participants, 15.0 ug/kg/day, achondroplasia
  species: human
  source_ref: fda_voxzogo_label_2025
  uncertainty: 'ACHONDROPLASIA IS THE WRONG POPULATION FOR THE INFERENCE WE WANT. Vosoritide there is
    partly CORRECTING a pathological FGFR3 excess; a subject with normal FGFR3 has no such excess to
    correct, so this number is an upper bound on what to expect and probably a loose one. dauber2026, the
    phase 2 basket trial in RASopathies, ACAN and NPR2 deficiency, is the only place the question has been
    asked outside achondroplasia and is the single most important paper for this decision.'
- parameter: 'REVERSAL. Cilostazol effect on body length in WILD-TYPE juvenile mice - the measured size'
  value: 93.6 versus 95.3
  unit: mm naso-anal length, vehicle versus cilostazol
  conditions: C57BL/6 juveniles injected daily intraperitoneally from weaning at 3 weeks with 10 mg/kg/day
    cilostazol in olive oil for 4 weeks; naso-anal length and body weight measured weekly; P<0.05 at the
    endpoint by two-way ANOVA with Sidak's test
  species: mouse
  source_ref: kawabe2025
  uncertainty: 'A gain of 1.7 mm, which is 1.82 per cent of body length. SMALL, SIGNIFICANT, AND IN A
    WILD-TYPE ANIMAL - the last of those is what makes it rare, because almost every positive length result
    in this atlas is a rescue of a deficient model. Fraction-scaled to a 175 cm human it would be about
    3.2 cm, and fraction-scaling across species is an assumption rather than a result. Four weeks in the
    fastest phase of murine growth; naso-anal length includes the spine.'
- parameter: 'the dose question, which comes out favourably'
  value: 57 against 200
  unit: mg/day for a 70 kg human - allometrically scaled effective dose against the routine clinical dose
  conditions: FDA human-equivalent-dose conversion with Km 3 for mouse and 37 for human applied to the
    10 mg/kg/day effective dose; standard cilostazol dosing for intermittent claudication is 100 mg twice
    daily
  species: multiple
  source_ref: kawabe2025
  uncertainty: 'The mouse-effective exposure scales to roughly a THIRD of the dose people already take
    long-term for claudication. That is the opposite of the usual situation, where an animal-effective dose
    scales above anything tolerable. Allometric HED conversion is a regulatory rule of thumb for starting
    doses, not a statement about equal efficacy.'
- parameter: 'THE GENETICS THAT PREDICT BOTH PDE RESULTS - why wang2018 does not refute cilostazol'
  value: PDE5 knockout small, PDE9 knockout normal, PDE3B knockout ENLARGED TIBIA
  unit: mouse knockout body-size phenotypes
  conditions: kawabe2025 cites International Mouse Phenotyping Consortium records - Pde5a-null mice have
    small body size (MGI:2651499), Pde9a-null normal body size, and Pde3b-null show enlargement of the tibia
    (MGI:1333863) - and reasons explicitly that inhibitors of PDE5A and PDE9A are unlikely to stimulate bone
    growth
  species: mouse
  source_ref: kawabe2025
  uncertainty: 'THIS IS THE ROW THAT REVERSES THE ROUND-79 VERDICT (CORR-073). The atlas used wang2018 to
    falsify raise-cGMP-and-grow and concluded that cilostazol therefore fails. But wang2018 tested PDE5, and
    kawabe2025 PREDICTED that null from mouse genetics before testing PDE3 - opposite knockout phenotypes,
    opposite predictions, and both predictions confirmed. The two papers do not conflict. Together they say
    the PDE ISOFORM is the variable and bulk cGMP is not, which is a stronger and more useful statement than
    either alone. Knockout body-size phenotypes from a consortium database are coarse and are not a
    substitute for the pharmacology.'
- parameter: 'the mechanism, dissected pharmacologically and genetically'
  value: PKG - BK channel - hyperpolarisation - TRPM7 calcium entry - CaMKII
  unit: signalling chain
  conditions: KT5823 (PKG inhibitor) and paxilline (BK channel blocker) attenuated the cilostazol-facilitated
    calcium fluctuations; the TRPM7 inhibitor FTY720 almost abolished them; Trpm7 conditional knockout mice
    (Trpm7 fl/fl, 11EnhCre) were generated for the genetic test; resting potential moved from -40.0 +/- 0.2
    to -41.2 mV; autophosphorylated CaMKII staining increased; cilostazol 3 uM and milrinone 10 uM in vitro
  species: mouse
  source_ref: kawabe2025
  uncertainty: 'THIS IS NOT THE RAF-1 ROUTE, AND THAT MATTERS FOR THE STACKING QUESTION. Both approved
    CNP-analogue labels put their mechanism at the RAF-1 step of the FGFR3-MAPK cascade, which is where
    erdafitinib already acts. The cilostazol chain runs PKG to a potassium channel to a calcium channel to
    CaMKII to matrix synthesis, which is orthogonal to MAPK. Caveat: CNP-NPR2 signalling also drives PKG, so
    the two agents converge upstream and are the same axis approached from production and from degradation.'
- parameter: 'cardiovascular tolerability at the effective dose'
  value: no influence on major cardiovascular or haematological parameters
  unit: qualitative
  conditions: 4-week treatment period in juvenile mice; the authors note cilostazol frequently causes
    hypotension and tachycardia clinically
  species: mouse
  source_ref: kawabe2025
  uncertainty: 'Mouse, four weeks, and the parameters monitored are in a supplementary figure not read here.
    It does not retire the human class signal - oral PDE3 inhibitors raised mortality in heart failure
    trials, which is why cilostazol carries a heart-failure contraindication.'
- parameter: 'wang2018 at full text - what the null actually was'
  value: cGMP +52 per cent, long bone length unchanged
  unit: per cent and qualitative
  conditions: 1-month-old Sprague Dawley rats, tadalafil 10 mg/kg/day for three weeks at doses comparable
    to those used in children with pulmonary arterial hypertension; tissue cGMP +52 per cent (p<0.01); body
    weight gain REDUCED 9 per cent (p<0.01); long bone length, cortical and trabecular bone properties and
    histological features all unaltered; in vitro CNP-stimulated peak cGMP +37 per cent (p<0.01) with the
    decline significantly attenuated
  species: rat
  source_ref: wang2018
  uncertainty: 'STRONGER THAN THE ABSTRACT SUGGESTED, and it stands: target engagement was confirmed in
    tissue in vivo, the drug demonstrably did something systemic (9 per cent less weight gain), and the bone
    did not lengthen. What it does NOT support is the round-79 generalisation to all PDE inhibitors.'
- parameter: 'THE DECIDING NUMBER. Vosoritide outside achondroplasia - annualised growth velocity'
  value: 4.53 to 8.09
  unit: cm/year, an increase of 3.56
  conditions: 'phase 2 basket trial, 30 prepubertal children aged 3-11 with a RASopathy (11), ACAN
    deficiency (12) or NPR2 deficiency (7), height <= -2.25 SD; SIX-MONTH OBSERVATION PERIOD followed by
    12-month treatment at 15 ug/kg/day subcutaneously, so each child is their own control; 4.53 +/- 1.61
    during observation against 8.09 +/- 1.58 during treatment, P<0.0001; adherence 99.3 per cent by vial
    count; 2 of the 30 withdrew at days 51 and 107 and were removed from efficacy'
  species: human
  source_ref: dauber2026
  uncertainty: 'THIS IS 2.3 TIMES THE ACHONDROPLASIA EFFECT (+1.57 cm/yr) AND THE ATLAS PREDICTED THE
    OPPOSITE (CORR-074). Round 79 called achondroplasia an upper bound on the reasoning that vosoritide
    there corrects a pathological FGFR3 excess. The number was wrong; the reasoning was not. All three
    groups here carry either MAPK excess or a defect in vosoritide own receptor - RASopathies activate
    Ras-MAPK, ACAN deficiency raises activated MAPK in growth plate cartilage per a chick model the authors
    cite, and NPR2 deficiency is partial loss of the target receptor so treatment is ligand supplementation.
    A subject with normal FGFR3, normal MAPK, normal NPR2 and normal aggrecan remains untested.'
- parameter: 'growth velocity Z-score and height gain'
  value: 4.0 SD and 0.65 SD
  unit: age- and sex-adjusted AGV Z-score increase; height SD gain, treatment versus observation
  conditions: 95 per cent CI 3.08-4.91 for AGV Z-score and 0.53-0.77 for height SD; both P<0.0001; the
    increase in AGV was seen in ALL genetic subgroups
  species: human
  source_ref: dauber2026
  uncertainty: A four-standard-deviation shift in growth velocity is a very large effect for any
    endocrine intervention. Regression to the mean is a live concern - children were selected for short
    stature and low velocity - but the within-subject observation-then-treatment design and the
    all-subgroup consistency both work against that reading.
- parameter: 'bone age advance during treatment - the property that decides whether the gain is borrowed'
  value: no significant change
  unit: bone age to chronological age ratio, Day 1 to Month 12
  conditions: same cohort, 12 months of treatment at 15 ug/kg/day
  species: human
  source_ref: dauber2026
  uncertainty: 'THE MOST FAVOURABLE SINGLE PROPERTY IN THE WHOLE STACK AND THE ATLAS HAD NOT RECORDED IT.
    Growth velocity rose by 4 SD without a matching advance in skeletal maturation, so the height is NOT
    being paid for out of remaining growth time - which is the failure mode of every androgen-driven or
    nutrition-driven acceleration. Twelve months is short for a bone-age readout and the comparison is
    within-subject, so this needs replication at 24-36 months before it is leaned on.'
- parameter: 'THE HAZARD THAT MATTERS MOST AT BONE AGE 16. Slipped capital femoral epiphysis on vosoritide'
  value: 3 of 30
  unit: subjects, all during the long-term extension
  conditions: 'no subject discontinued during the FIRST YEAR for a treatment-related event, and there were
    no significant echocardiographic changes or cardiovascular events. In the long-term extension 5 of 30
    discontinued for treatment-related musculoskeletal complications: two subjects (one Noonan, one ACAN)
    developed severe genu valgum requiring guided growth surgery, were continued after discussion with
    families and orthopaedic surgeons, and BOTH subsequently developed SCFE requiring surgery, stopping at
    Days 1078 and 1633; a third (ACAN) developed SCFE at Day 493 after previously developing coxa valga;
    two further ACAN subjects discontinued for significant genu valgum. FOUR OF THE FIVE HAD AGGRECAN
    DEFICIENCY.'
  species: human
  source_ref: dauber2026
  uncertainty: 'BACKGROUND SCFE INCIDENCE IS ON THE ORDER OF 10 PER 100000 PER YEAR AND THIS IS 3 IN 30.
    Two features make it worse rather than better for a bone-age-16 subject. First, SCFE incidence peaks in
    ADOLESCENCE, and these were prepubertal children aged 3-11 who developed it anyway - our case sits in
    the natural peak-risk window. Second, the atlas already carries an SCFE signal for erdafitinib, so a
    stack containing both agents compounds the same specific hazard at the same specific site. Mitigating:
    4 of 5 discontinuations were ACAN, an aggrecan matrix defect that a normal subject does not have, and
    every SCFE was PRECEDED by another deformity (genu valgum twice, coxa valga once), which means the
    complication was visible before it happened and is therefore monitorable.'
- parameter: 'vosoritide in a population with intact FGFR3, MAPK, NPR2 and ACAN'
  value: does not exist
  unit: trials
  conditions: 'Europe PMC, (vosoritide OR "C-type natriuretic peptide analog") AND ("idiopathic short
    stature" OR "slipped capital femoral" OR "genu valgum"), run 2026-08-07 - three hits, none of them a
    trial in an unaffected or pathway-intact population'
  species: human
  source_ref: dauber2026
  uncertainty: 'A NULL ESTABLISHED BY SEARCH, and it is the single largest remaining uncertainty for the
    h_term arm. Every human vosoritide result the atlas holds comes from a subject whose growth plate has a
    defect the drug corrects. Whether a CNP analogue raises growth in a plate with no such defect is
    untested in humans, and cannot be inferred from any of these trials.'
- parameter: 'THE FINDING THAT REFRAMES THE WHOLE STACK - the FGFR arm has a randomised phase 3, and it is
    not erdafitinib'
  value: 114 randomised, 2:1, 0.25 mg/kg/day, 52 weeks
  unit: trial design
  conditions: infigratinib, an oral FGFR1-3 tyrosine kinase inhibitor, in a multicentre double-blind
    placebo-controlled phase 3 in children with achondroplasia aged 3-17; primary endpoint change from
    baseline in annualised height velocity at week 52; key secondary endpoints height z-score and
    upper-to-lower segment ratio; published in the New England Journal of Medicine
  species: human
  source_ref: savarirayan2026infig
  uncertainty: 'THE ABSTRACT IS TRUNCATED AT THE RESULTS AND THE EFFECT SIZE IS NOT IN HAND. What IS in
    hand is the design, and it settles a question the atlas has carried since round 46: for arm 2 the
    evidence sits with INFIGRATINIB and not with erdafitinib, which has one paediatric case report. The
    atlas edge written several rounds ago already said the stack should not name erdafitinib for arm 2 on
    current evidence; a phase 3 in NEJM makes that unambiguous. Note the DOSE - 0.25 mg/kg/day is about 15
    mg for a 60 kg subject, against 125 mg/day for infigratinib in cholangiocarcinoma, so the growth
    indication was dose-found roughly EIGHTFOLD DOWN from oncology. Erdafitinib at 8 mg is the full
    oncology dose with no growth dose-finding of any kind.'
- parameter: 'cross-trial annualised growth velocity, the three approved-or-investigational agents'
  value: 1.7, 6.0, 5.4
  unit: cm/year improvement over baseline for vosoritide, infigratinib and navepegritide
  conditions: narrative review of trials in children aged 5 years and older with achondroplasia; the review
    states explicitly that direct comparisons across trials are limited
  species: human
  source_ref: zakheim2025
  uncertainty: 'T5 NARRATIVE REVIEW, CROSS-TRIAL, CHANGE-FROM-BASELINE, NOT PLACEBO-ADJUSTED - and the
    atlas standing rule is that reviews are an index, not a source. Recorded ONLY as a pointer, with the
    numbers explicitly NOT admitted as findings. The reason for caution is concrete: the vosoritide pivotal
    figure of 1.57 cm/yr is a PLACEBO-ADJUSTED difference while these are changes from baseline, so the
    metrics are not the same and the comparison as printed is not like-for-like. If the infigratinib figure
    survives against the primary NEJM sources it would make the FGFR arm several times larger than the CNP
    arm; that is a big enough claim that it must not be taken from a review. The two NEJM papers are the
    only admissible source and both are paywalled at the results.'
- parameter: 'infigratinib in hypochondroplasia - the milder FGFR3 lesion, closer to normal physiology'
  value: effective at low dose
  unit: qualitative
  conditions: step-wise evaluation - in silico modelling of infigratinib against hypochondroplasia-associated
    FGFR3 variants suggesting strong interaction, in vitro inhibition, and clinical follow-through
  species: human
  source_ref: demuynck2025
  uncertainty: 'RELEVANT BECAUSE HYPOCHONDROPLASIA IS A WEAKER FGFR3 GAIN OF FUNCTION THAN ACHONDROPLASIA,
    so this is the closest any FGFR agent gets to a near-normal receptor background - the direction the
    atlas needs. It is still a gain-of-function lesion and still not a pathway-intact subject. Abstract
    level; the clinical effect size has not been read.'
- parameter: 'PROPEL 3 PRIMARY ENDPOINT - the FGFR arm placebo-adjusted, at last'
  value: 1.74 LS mean, 2.10 raw
  unit: cm/year difference in change from baseline versus placebo at week 52
  conditions: 'randomised double-blind placebo-controlled phase 3, 114 randomised (74 infigratinib, 39
    placebo), children 3 to <18 with genetically confirmed achondroplasia, 0.25 mg/kg/day orally for 52
    weeks. Annualised height velocity: infigratinib baseline 4.28 (SE 0.16) to 5.75 (SE 0.15) at week 52;
    placebo 4.57 (SE 0.23) to 3.95 (SE 0.14). Mean change +1.48 (SE 0.22) against -0.62 (SE 0.29). LS mean
    change +1.58 (0.19) against -0.16 (0.23); LS mean difference 1.74, 95 per cent CI 1.31 to 2.1'
  species: human
  source_ref: savarirayan2026infig
  uncertainty: 'THIS REFUTES THE NARRATIVE-REVIEW FIGURE THE ATLAS REFUSED TO ADMIT LAST ROUND, AND THE
    REFUSAL WAS CORRECT. zakheim2025 printed 6.0 cm/yr for infigratinib against 1.7 for vosoritide; the
    primary source gives a placebo-adjusted 1.74 cm/yr, and vosoritide pivotal gives 1.57 cm/yr on the same
    metric in the same disease. THE TWO ARMS ARE EQUIVALENT IN ACHONDROPLASIA, not several-fold apart.
    Round 82 speculated the FGFR arm might be much larger and explicitly declined to bank it - that call
    saved a substantial error.'
- parameter: 'PROPEL 2 dose-response shape - the decisive fact for whether more FGFR blockade buys more'
  value: effect only at the top dose
  unit: five cohorts
  conditions: 0.016, 0.032, 0.064, 0.128 and 0.25 mg/kg/day (n=8, 19, 16, 16, 13) for 6 months then 12
    months extension; an increased annualised height velocity was observed in COHORT 5 ONLY, mean change
    from baseline at 18 months +2.50 cm/yr (95 per cent CI 1.22-3.79, P=0.001), height z-score +0.54
    (0.35-0.72) against an untreated achondroplasia reference, upper-to-lower segment ratio -0.12
  species: human
  source_ref: savarirayan2025
  uncertainty: 'THE HIGHEST DOSE TESTED IS THE FIRST DOSE THAT WORKS. There is no plateau in this
    dose-response - the curve is still climbing where the programme stopped. The authors note that doses
    10 to 100-fold lower than oncology exposure have been used in achondroplasia, and oncology went to 200
    mg/day, so the characterised headroom above the proven growth dose is large. That single fact is what
    makes target-coverage arithmetic worth doing rather than academic.'
- parameter: 'TARGET COVERAGE AT PROVEN-EFFECTIVE DOSES - infigratinib against erdafitinib'
  value: 0.97 versus 2.1
  unit: multiples of the FGFR3 IC50 at free Cmax
  conditions: 'infigratinib FGFR3 IC50 about 2 nM biochemically and 1.99 +/- 0.32 nM against the
    achondroplasia G380R mutant, 3.01 +/- 1.81 nM across nine hypochondroplasia variants; plasma protein
    binding 96.8 per cent; oncology 125 mg/day gives total Cmax 282.5 ng/mL = about 504 nM, so free Cmax
    about 16 nM = 8x IC50. Scaling dose-proportionally to 0.25 mg/kg gives about 15 mg for a 60 kg subject,
    free Cmax about 1.9 nM = 0.97x IC50. Erdafitinib at 8 mg has a MEASURED free Cmax of 6.3 nM against an
    FGFR3 IC50 of 3.0 nM = 2.1x. Computation in atlas/tools/fgfr_exposure.py'
  species: human
  source_ref: savarirayan2026infig
  uncertainty: 'THE RESULT IS COUNTERINTUITIVE AND MATTERS. The FGFR inhibitor with a positive phase 3
    achieves only ABOUT HALF-MAXIMAL FGFR3 inhibition at its proven dose, while erdafitinib at 8 mg
    achieves roughly twice that coverage. Read with the PROPEL 2 dose-response, which is still climbing,
    this argues that the FGFR arm is UNDER-DOSED at the dose that works - and that erdafitinib at 8 mg sits
    further up the same curve. CAVEATS THAT MUST TRAVEL WITH IT: infigratinib PK is scaled here
    dose-proportionally from an oncology anchor and its protein binding is reported concentration-dependent;
    free plasma concentration is not intracellular kinase-site concentration; and the two drugs differ in
    selectivity, with erdafitinib far more potent on FGFR4 (5.7 nM against 61 nM for infigratinib) and
    binding RET at 0.94 nM, tighter than its own FGFR3. More coverage is not automatically more benefit.'
- parameter: 'the asymmetry that decides what vosoritide adds'
  value: 3.56 against no comparator
  unit: cm/year outside achondroplasia
  conditions: vosoritide gives +3.56 cm/yr in RASopathies, ACAN and NPR2 deficiency (dauber2026), which is
