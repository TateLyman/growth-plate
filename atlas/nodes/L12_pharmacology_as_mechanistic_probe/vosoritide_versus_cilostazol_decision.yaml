id: vosoritide_versus_cilostazol_decision
name: Vosoritide versus cilostazol for the h_term arm, and which pairs with erdafitinib
aliases:
- cGMP arm decision
- CNP analogue or PDE inhibitor
type: intervention
layer: L12
stub: false
summary: 'REVISED ROUND 80 ON FULL TEXTS OF BOTH PDE PAPERS - the round-79 verdict was wrong and is
  reversed (CORR-073). The atlas used wang2018 to falsify raise-cGMP-and-grow and concluded cilostazol
  therefore fails. wang2018 tested TADALAFIL, a PDE5 inhibitor, and kawabe2025 PREDICTED that null from
  mouse genetics before ever testing PDE3: it cites Pde5a-null mice having SMALL body size and Pde9a-null
  mice normal body size, reasons explicitly that PDE5A and PDE9A inhibitors are unlikely to stimulate bone
  growth, and contrasts Pde3b-null mice, which show ENLARGEMENT OF THE TIBIA. Opposite knockout phenotypes,
  opposite predictions, and both predictions confirmed experimentally. The two papers do not conflict. What
  they say together is stronger than either alone: THE PDE ISOFORM IS THE VARIABLE AND BULK cGMP IS NOT.
  THE SIZES, MEASURED. wang2018: 1-month-old rats, tadalafil 10 mg/kg/day for 3 weeks at paediatric-PAH-
  comparable doses, tissue cGMP +52 per cent (p<0.01), body weight gain -9 per cent (p<0.01), and long bone
  length, cortical and trabecular properties and histology ALL UNALTERED - a clean sufficiency failure with
  confirmed in vivo target engagement. kawabe2025: juvenile C57BL/6 mice from weaning, cilostazol 10
  mg/kg/day intraperitoneally for 4 weeks, naso-anal length 93.6 +/- 0.3 mm in vehicle against 95.3 +/- 0.5
  mm treated, P<0.05 - a gain of 1.7 mm, 1.82 per cent of body length, IN A WILD-TYPE ANIMAL, which is the
  rarest kind of result in this atlas because nearly every other positive is a rescue of a deficient model.
  Tibial growth plate length and alcian-blue ECM area rose, cell density fell slightly. The mechanism is
  dissected both pharmacologically and genetically - PKG to BK potassium channel to hyperpolarisation to
  TRPM7 calcium entry to CaMKII, blocked by KT5823, paxilline and FTY720 respectively, with Trpm7
  conditional knockouts built for the genetic test. AND THE DOSE COMES OUT THE RIGHT WAY. Allometrically
  scaled, 10 mg/kg/day in mouse is about 57 mg/day in a 70 kg human, roughly a third of the 200 mg/day
  people already take long-term for intermittent claudication. WHERE THAT LEAVES THE CHOICE. Cilostazol now
  has the better mechanistic case, better delivery (369.5 Da sits on the plateau of the partition curve
  where vosoritide at about 4 kDa is partway down the slope), oral rather than daily subcutaneous dosing,
  a wild-type length result, and a favourable dose margin. Vosoritide has the only HUMAN efficacy data,
  and no cytochrome interaction. THE ONE HARD STRIKE AGAINST CILOSTAZOL IN THIS PARTICULAR STACK IS
  UNCHANGED AND IS PHARMACOKINETIC: the FDA review states erdafitinib is in vitro a time-dependent
  INHIBITOR AND INDUCER of CYP3A4, and cilostazol is a CYP3A4 and CYP2C19 substrate, so one drug pushes the
  same enzyme in both directions with different time courses and the net effect on cilostazol exposure is
  unpredictable. Vosoritide is a 39-residue peptide cleared by peptidases and has no such interaction.
  ON MECHANISM THE STACKING ARGUMENT ALSO FLIPS. Both approved CNP-analogue labels put their mechanism at
  the RAF-1 step of the FGFR3-MAPK cascade, which is where erdafitinib already acts; the cilostazol chain
  runs through a potassium channel and a calcium channel to matrix synthesis, orthogonal to MAPK. By the
  atlas own rule - stack across control points, not within one - cilostazol is the better PARTNER and
  vosoritide the better STANDALONE. Caveat on that: CNP-NPR2 signalling also drives PKG, so the two
  converge upstream and are one axis approached from production and from degradation. CURRENT POSITION:
  neither is clearly dominant; cilostazol wins on mechanism, delivery, route and dose margin, vosoritide
  wins on human evidence and DDI cleanliness, and the decision should not be made until dauber2026 is read
  for vosoritide effect size OUTSIDE a FGFR3-driven pathology, which is the one number that would settle
  it.'

quantitative:
- parameter: 'THE FALSIFYING RESULT. Chondrocyte cGMP raised by a PDE inhibitor, and the length outcome'
  value: cGMP +37 to +52 per cent, bone length unchanged
  unit: per cent, and mm over 3 weeks
  conditions: newborn rat epiphyseal chondrocytes and rat long bone in vivo; tadalafil; peak CNP-stimulated
    cGMP +37 per cent, tissue cGMP +52 per cent; PDE5 identified as the major cGMP-hydrolysing PDE in this
    tissue; no increase in long bone length over three weeks
  species: rat
  source_ref: wang2018
  uncertainty: 'THE MOST DECISION-RELEVANT ROW IN THE NODE AND THE ATLAS HELD IT UNREAD SINCE BEFORE ROUND
    67. Abstract-level only. A three-week window in rat may be too short, and absence of a length effect
    is a negative with unstated power. But the cGMP elevation was CONFIRMED, which makes this a test of
    sufficiency rather than a failed delivery: the second messenger went up substantially and the bone did
    not grow. Any argument that a PDE inhibitor is equivalent to a CNP analogue has to answer this.'
- parameter: dominant cGMP-hydrolysing phosphodiesterase in growth plate chondrocytes
  value: PDE5, not PDE3
  unit: qualitative
  conditions: newborn rat epiphyseal chondrocytes (wang2018); separately, ursachi2026 indexes growth plate
    chondrocytes of human, mouse and chicken as expressing PDE1B, 3B, 4B, 4D, 5A, 7A, 8A and 10A
  species: rat
  source_ref: wang2018
  uncertainty: 'Cilostazol inhibits PDE3. If PDE5 carries the cGMP hydrolysis, cilostazol is acting on a
    minor route for that second messenger - and PDE3 hydrolyses cAMP as well as cGMP, so its skeletal
    effect may be a cAMP effect. Species caveat: the PDE inventory is rat for the dominance claim and
    multi-species for the expression index.'
- parameter: the human PDE3 skeletal lesion, and its direction
  value: brachydactyly
  unit: qualitative
  conditions: gain-of-function PDE3A mutations cause autosomal dominant hypertension with brachydactyly;
    described as a cAMP-hydrolysis lesion
  species: human
  source_ref: maass2015
  uncertainty: 'A WARNING RATHER THAN A REFUTATION, and it needs care about direction. More PDE3A activity
    gives SHORT digits, which naively predicts that inhibiting PDE3 should lengthen - the direction
    cilostazol wants. What it establishes is that the human PDE3 skeletal phenotype runs through cAMP, so
    the cGMP rationale for cilostazol is not the mechanism the human genetics supports. Abstract only.'
- parameter: the one positive result for cilostazol, and what it actually proposes
  value: elongation of cultured bones and enlarged juvenile mice
  unit: qualitative
  conditions: cilostazol and milrinone raised cGMP in growth plate chondrocytes, activated cell-surface
    potassium channels probably by PKG-mediated phosphorylation, and the resulting hyperpolarisation
    facilitated TRPM7-mediated calcium influx for extracellular matrix synthesis
  species: mouse
  source_ref: kawabe2025
  uncertainty: 'A WILD-TYPE LENGTH RESULT, WHICH THIS ATLAS HAS FOUND ALMOST NOWHERE ELSE, AND IT IS
    ABSTRACT-ONLY. Its proposed mechanism is NOT bulk cGMP - it is a potassium-channel and calcium-influx
    route - so wang2018 does not refute it directly. That makes cilostazol a live but single-study
    hypothesis on a different axis, not a cheap oral substitute for a CNP analogue.'
- parameter: erdafitinib target coverage at the top of its label
  value: 6.3 against 3.0
  unit: nM unbound Cmax against FGFR3 enzymatic IC50
  conditions: FDA multidisciplinary review, 8 mg dose; phosphate is the dose-limiting on-target effect and
    the label titration endpoint
  species: human
  source_ref: fda_balversa_review_2019
  uncertainty: 'WHY THE COMBINATION IS NOT REDUNDANT. Roughly twofold over the half-maximal concentration
    at maximum dose is not pathway saturation. A second agent acting downstream in the same cascade adds
    inhibition that erdafitinib cannot be pushed hard enough to supply, and does so without adding free
    erdafitinib, which is what drives the phosphate toxicity.'
- parameter: 'the drug-drug interaction that separates the two candidates in THIS stack'
  value: erdafitinib is a CYP3A4 time-dependent inhibitor AND inducer; cilostazol is a CYP3A4 substrate
  unit: qualitative
  conditions: FDA review states erdafitinib is in vitro a P-gp substrate, a time-dependent inhibitor and
    inducer for CYP3A4, and a P-gp and OCT2 inhibitor; cilostazol is metabolised by CYP3A4 and CYP2C19
  species: human
  source_ref: fda_balversa_review_2019
  uncertainty: 'One drug both inhibiting and inducing the same enzyme, with opposite signs and different
    onset kinetics, makes the net effect on a CYP3A4 substrate unpredictable and time-varying. Vosoritide,
    a 39-residue peptide cleared by peptidases, has no such interaction. This is a concrete, sourced
    reason to prefer the peptide in a stack that already contains erdafitinib, independent of which agent
    is more potent.'
- parameter: vosoritide effect size where it is established
  value: '1.57'
  unit: cm/yr adjusted mean difference in annualised growth velocity versus placebo
  conditions: pivotal phase 3, 121 randomised participants, 15.0 ug/kg/day, achondroplasia
  species: human
  source_ref: fda_voxzogo_label_2025
  uncertainty: 'ACHONDROPLASIA IS THE WRONG POPULATION FOR THE INFERENCE WE WANT. Vosoritide there is
    partly CORRECTING a pathological FGFR3 excess; a subject with normal FGFR3 has no such excess to
    correct, so this number is an upper bound on what to expect and probably a loose one. dauber2026, the
    phase 2 basket trial in RASopathies, ACAN and NPR2 deficiency, is the only place the question has been
    asked outside achondroplasia and is the single most important paper for this decision.'
- parameter: 'REVERSAL. Cilostazol effect on body length in WILD-TYPE juvenile mice - the measured size'
  value: 93.6 versus 95.3
  unit: mm naso-anal length, vehicle versus cilostazol
  conditions: C57BL/6 juveniles injected daily intraperitoneally from weaning at 3 weeks with 10 mg/kg/day
    cilostazol in olive oil for 4 weeks; naso-anal length and body weight measured weekly; P<0.05 at the
    endpoint by two-way ANOVA with Sidak's test
  species: mouse
  source_ref: kawabe2025
  uncertainty: 'A gain of 1.7 mm, which is 1.82 per cent of body length. SMALL, SIGNIFICANT, AND IN A
    WILD-TYPE ANIMAL - the last of those is what makes it rare, because almost every positive length result
    in this atlas is a rescue of a deficient model. Fraction-scaled to a 175 cm human it would be about
    3.2 cm, and fraction-scaling across species is an assumption rather than a result. Four weeks in the
    fastest phase of murine growth; naso-anal length includes the spine.'
- parameter: 'the dose question, which comes out favourably'
  value: 57 against 200
  unit: mg/day for a 70 kg human - allometrically scaled effective dose against the routine clinical dose
  conditions: FDA human-equivalent-dose conversion with Km 3 for mouse and 37 for human applied to the
    10 mg/kg/day effective dose; standard cilostazol dosing for intermittent claudication is 100 mg twice
    daily
  species: multiple
  source_ref: kawabe2025
  uncertainty: 'The mouse-effective exposure scales to roughly a THIRD of the dose people already take
    long-term for claudication. That is the opposite of the usual situation, where an animal-effective dose
    scales above anything tolerable. Allometric HED conversion is a regulatory rule of thumb for starting
    doses, not a statement about equal efficacy.'
- parameter: 'THE GENETICS THAT PREDICT BOTH PDE RESULTS - why wang2018 does not refute cilostazol'
  value: PDE5 knockout small, PDE9 knockout normal, PDE3B knockout ENLARGED TIBIA
  unit: mouse knockout body-size phenotypes
  conditions: kawabe2025 cites International Mouse Phenotyping Consortium records - Pde5a-null mice have
    small body size (MGI:2651499), Pde9a-null normal body size, and Pde3b-null show enlargement of the tibia
    (MGI:1333863) - and reasons explicitly that inhibitors of PDE5A and PDE9A are unlikely to stimulate bone
    growth
  species: mouse
  source_ref: kawabe2025
  uncertainty: 'THIS IS THE ROW THAT REVERSES THE ROUND-79 VERDICT (CORR-073). The atlas used wang2018 to
    falsify raise-cGMP-and-grow and concluded that cilostazol therefore fails. But wang2018 tested PDE5, and
    kawabe2025 PREDICTED that null from mouse genetics before testing PDE3 - opposite knockout phenotypes,
    opposite predictions, and both predictions confirmed. The two papers do not conflict. Together they say
    the PDE ISOFORM is the variable and bulk cGMP is not, which is a stronger and more useful statement than
    either alone. Knockout body-size phenotypes from a consortium database are coarse and are not a
    substitute for the pharmacology.'
- parameter: 'the mechanism, dissected pharmacologically and genetically'
  value: PKG - BK channel - hyperpolarisation - TRPM7 calcium entry - CaMKII
  unit: signalling chain
  conditions: KT5823 (PKG inhibitor) and paxilline (BK channel blocker) attenuated the cilostazol-facilitated
    calcium fluctuations; the TRPM7 inhibitor FTY720 almost abolished them; Trpm7 conditional knockout mice
    (Trpm7 fl/fl, 11EnhCre) were generated for the genetic test; resting potential moved from -40.0 +/- 0.2
    to -41.2 mV; autophosphorylated CaMKII staining increased; cilostazol 3 uM and milrinone 10 uM in vitro
  species: mouse
  source_ref: kawabe2025
  uncertainty: 'THIS IS NOT THE RAF-1 ROUTE, AND THAT MATTERS FOR THE STACKING QUESTION. Both approved
    CNP-analogue labels put their mechanism at the RAF-1 step of the FGFR3-MAPK cascade, which is where
    erdafitinib already acts. The cilostazol chain runs PKG to a potassium channel to a calcium channel to
    CaMKII to matrix synthesis, which is orthogonal to MAPK. Caveat: CNP-NPR2 signalling also drives PKG, so
    the two agents converge upstream and are the same axis approached from production and from degradation.'
- parameter: 'cardiovascular tolerability at the effective dose'
  value: no influence on major cardiovascular or haematological parameters
  unit: qualitative
  conditions: 4-week treatment period in juvenile mice; the authors note cilostazol frequently causes
    hypotension and tachycardia clinically
  species: mouse
  source_ref: kawabe2025
  uncertainty: 'Mouse, four weeks, and the parameters monitored are in a supplementary figure not read here.
    It does not retire the human class signal - oral PDE3 inhibitors raised mortality in heart failure
    trials, which is why cilostazol carries a heart-failure contraindication.'
- parameter: 'wang2018 at full text - what the null actually was'
  value: cGMP +52 per cent, long bone length unchanged
  unit: per cent and qualitative
  conditions: 1-month-old Sprague Dawley rats, tadalafil 10 mg/kg/day for three weeks at doses comparable
    to those used in children with pulmonary arterial hypertension; tissue cGMP +52 per cent (p<0.01); body
    weight gain REDUCED 9 per cent (p<0.01); long bone length, cortical and trabecular bone properties and
    histological features all unaltered; in vitro CNP-stimulated peak cGMP +37 per cent (p<0.01) with the
    decline significantly attenuated
  species: rat
  source_ref: wang2018
  uncertainty: 'STRONGER THAN THE ABSTRACT SUGGESTED, and it stands: target engagement was confirmed in
    tissue in vivo, the drug demonstrably did something systemic (9 per cent less weight gain), and the bone
    did not lengthen. What it does NOT support is the round-79 generalisation to all PDE inhibitors.'
localization:
- 'growth plate hypertrophic zone: where CNP-NPR-B signalling acts on terminal cell volume'
- 'growth plate chondrocytes: where wang2018 measured cGMP and identified PDE5 dominance'
human_evidence: direct
human_evidence_note: Vosoritide has randomised human efficacy data and a non-achondroplasia basket trial.
  Cilostazol has no human height data of any kind; its human evidence is a PDE3A gain-of-function
  phenotype pointing at cAMP and at shortening.
species_basis:
- human
- rat
- mouse
translation_risk: moderate
translation_risk_reason: The falsifying wang2018 result is rat and abstract-level, and a three-week window
  may understate a slow effect. The cilostazol positive is mouse and abstract-level. The vosoritide
  efficacy data are human but in the wrong genetic background for this use.
confidence: C
claim_grades:
- claim: Raising chondrocyte cGMP with a phosphodiesterase inhibitor is not sufficient to increase bone
    length.
  grade: C
  basis: One rat study with confirmed target engagement (cGMP +37 to +52 per cent) and a null length
    outcome over three weeks, read at abstract level. A single negative in one species with one PDE
    inhibitor.
- claim: Vosoritide is the better choice for the h_term arm in a stack containing erdafitinib.
  grade: C
  basis: Human randomised efficacy, a non-achondroplasia basket trial, no cytochrome interaction with
    erdafitinib, and a competitor whose central premise is falsified by wang2018. Graded C because the
    comparison has never been run and vosoritide's effect size on a normal FGFR3 background is unknown.
- claim: Vosoritide plus erdafitinib is dose-sparing rather than redundant.
  grade: E
  basis: 'Inference from two sourced facts: the two agents act at different nodes of one cascade, and
    erdafitinib reaches only about twice its FGFR3 IC50 in free concentration at maximum label dose. No
    combination study exists - see g_l12_fgfr_plus_cnp_combination.'
