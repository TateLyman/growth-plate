  species: human
  source_ref: dauber2026
  uncertainty: 'THIS INVERTS THE ROUND-82 ANSWER TO WHAT DOES VOSORITIDE ADD. In achondroplasia the two
    arms are equivalent. OUTSIDE achondroplasia vosoritide is the only agent with human efficacy data, and
    its effect there is more than twice its achondroplasia effect. For a subject who does not have
    achondroplasia, vosoritide is the arm with relevant evidence and the FGFR arm is the one extrapolating.
    The caveat from CORR-074 stands unchanged: every dauber2026 subject had MAPK excess or an NPR2 defect,
    so pathway-intact remains untested for BOTH agents.'
