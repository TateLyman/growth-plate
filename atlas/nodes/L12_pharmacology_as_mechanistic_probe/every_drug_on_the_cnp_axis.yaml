id: every_drug_on_the_cnp_axis
name: Every documented drug on the CNP axis, enumerated by intervention point - and the pick changes because navepegritide is now approved and the CNP-plus-GH combination has been run
aliases:
- the CNP drug list
- what else hits this axis
- navepegritide over vosoritide
type: intervention
layer: L12
stub: false
summary: 'THE INSTRUCTION WAS TO ENUMERATE EVERY DOCUMENTED DRUG ON THIS AXIS BEFORE COMPARING TO WHAT THE
  STACK NEEDS, AND THE ENUMERATION CHANGED THE ANSWER TWICE. FIRST, NAVEPEGRITIDE IS NO LONGER
  INVESTIGATIONAL. It received ACCELERATED APPROVAL IN THE USA as YUVIWEL for increasing linear growth in
  children aged 2 and over with achondroplasia AND OPEN EPIPHYSES - a once-weekly sustained-release CNP
  prodrug designed for CONTINUOUS exposure, which is the exact property round 100 argued for from the fact
  that hirota2018 needed an osmotic minipump to get its large wild-type effect. QUALIFIED ROUND 124 - CONTINUOUS EXPOSURE IS NOT WHAT THE RECEPTOR NEEDS. biomarin_cnp_variants_us8198242 FIG 25 reports that exposing rat chondrosarcoma cells to CNP-22 for ONE HOUR or TWO HOURS ONCE DAILY was substantially as effective as CONTINUOUS exposure at reversing FGF2-induced arrest of chondrocyte growth. That does not contradict the minipump result, it EXPLAINS it: native CNP has a plasma half-life of about 2.6 minutes, so a bolus cannot deliver even one hour above threshold and a pump is the only way to reach the requirement. The corrected statement is that the axis needs roughly an HOUR A DAY of adequate concentration, not permanent occupancy - which also predicts that daily vosoritide and weekly sustained navepegritide should perform similarly, as they do. The round-101 pick was a
  mechanistic preference for sustained-release CNP over daily vosoritide; it is now also the difference
  between two approved drugs. SECOND, AND LARGER: THE CNP-PLUS-GH COMBINATION HAS BEEN RUN IN HUMANS AND
  IT IS ADDITIVE. In the COACH phase 2 trial, children already on navepegritide monotherapy for over a year
  gained +3.28 cm/year WHEN GROWTH HORMONE WAS ADDED ON TOP, within-subject, P<0.0001, with arm span rising
  7.9 to 9.4 cm. That is a direct human test of two arms of the proposed stack and the atlas had no such
  result for any pair. THE ENUMERATION, BY INTERVENTION POINT. LIGAND SUPPLY - vosoritide (approved, daily),
  NAVEPEGRITIDE (approved, weekly, sustained), CNP-53 and CNP-22 (research), collagen-binding CNP
  (preclinical), cenderitide (cardiac, not skeletal). RECEPTOR CLEARANCE - osteocrin/musclin (endogenous,
  50-mer, no product), C-ANF(4-23), AP-811, SC-46542 (all research reagents). ENZYMATIC CLEARANCE -
  sacubitril (approved only in fixed combination with valsartan), thiorphan and racecadotril (approved for
  diarrhoea in some countries), candoxatril and omapatrilat and ecadotril (all discontinued). PDE -
  cilostazol and milrinone (PDE3, and cilostazol is now OUT on zonal grounds, CORR-098), tadalafil and
  sildenafil (PDE5, NEGATIVE with confirmed target engagement), PDE2 and PDE10 inhibitors (NEGATIVE).
  RECEPTOR POTENTIATION - LB-100 and cantharidin (PP2A inhibitors preventing NPR2 dephosphorylation).
  DOWNSTREAM - BK channel openers (NS1619, NS11021, BMS-204352), TRPM7 modulators (naltriben), all
  untested on bone. AND ONE ENTIRE PARALLEL SOURCE OF cGMP THAT NOBODY HAS TESTED ON CARTILAGE: the
  SOLUBLE guanylate cyclase stimulators riociguat and vericiguat, both approved oral drugs. A search
  crossing them against cartilage, chondrocyte, growth plate and bone growth returned NOTHING skeletal -
  the lead is unexplored rather than refuted, and the atlas own PDE5 null is the reason to expect it to
  fail, because sGC-derived cGMP is a different pool from NPR2-derived cGMP and bulk cGMP has already been
  shown insufficient. THE VERDICT ON THE QUESTION ASKED - IS VOSORITIDE BEATEN, OR PAIRED. BEATEN: yes,
  by NAVEPEGRITIDE, on continuity of exposure, on dosing burden, and on the age gradient, though never
  head-to-head. PAIRED: yes, by TWO things and only two. GROWTH HORMONE, which is documented additive in
  humans within-subject (mcdonnell2026) and is already in the stack. And NPR2-DEPHOSPHORYLATION BLOCKADE,
  the only pairing on this axis carrying four independent layers - mechanism, a genetic rescue to
  wild-type, an additive length endpoint, and human target expression - but preclinical, oncological, and
  partly redundant with an FGFR inhibitor by its own mechanism. NOT PAIRED BY: sacubitril, which
  hakata2024 tested with CNP and found NOT additive, and which the human expression data further
  undercuts because ECE1 and IDE both out-transcribe MME; cilostazol, which shares the cGMP/PKG segment
  and cannot reach the hypertrophic zone (CORR-098); PDE5, PDE2 and PDE10 inhibitors, all negative, one
  with confirmed target engagement. AND EMPTY AT: BK channels, TRPM7 and soluble guanylate cyclase, where
  the architecture predicts non-redundancy, the human expression is strong for the first two, and NO
  BONE-LENGTH ENDPOINT EXISTS IN ANY SPECIES. The axis is now mapped to its ends and the ends are the
  answer: there is no third drug to add.'
quantitative:
- parameter: 'THE APPROVED SUSTAINED-RELEASE AGENT, AND THE EFFECT GROWS WITH AGE'
  value: '+1.49 cm/year overall; +1.41 in ages 5-7; +2.48 in ages 8 and older'
  unit: cm/year, least-squares mean treatment difference vs placebo at 52 weeks
  conditions: 'savarirayan2026, APPROACH phase 2b, randomised double-blind placebo-controlled, 84 children
    aged 2-11 with genetically confirmed achondroplasia, naive to growth-promoting agents, 2:1 to
    navepegritide 100 micrograms/kg ONCE WEEKLY subcutaneous or placebo, 52 weeks, 10 hospitals across 7
    countries. Primary endpoint met, 95% CI 1.05-1.93, P<0.001. Age subgroups: 5-7 years +1.41 (n=36, CI
    0.65-2.17); 8 years and older +2.48 (n=17, CI 1.39-3.57). Secondary skeletal outcomes all improved -
    tibial-femoral angle -1.81 degrees, mechanical axis deviation -2.78 mm, fibula-to-tibia length ratio
    -0.016.'
  species: human
  source_ref: savarirayan2026
  uncertainty: 'THE AGE GRADIENT IS THE MOST RELEVANT SINGLE NUMBER IN THIS NODE FOR A LATE-BONE-AGE
    SUBJECT AND IT RUNS THE RIGHT WAY - the treatment difference is 76 per cent LARGER in children aged 8
    and over than in those aged 5-7, which is the opposite of the usual pattern where growth interventions
    decay as the plate matures. IT IS ALSO THE WEAKEST-POWERED COMPARISON IN THE TRIAL: n=17 in the older
    stratum, a subgroup analysis, with a confidence interval from 1.39 to 3.57 that overlaps the younger
    stratum. It is a hypothesis-generating subgroup, not a demonstrated age effect, and the oldest child
    in the trial was 11 - nobody near bone age 16 was studied. THE OTHER LIMIT IS THE POPULATION:
    achondroplasia, where FGFR3 is pathologically overactive, so this measures correction of an excess.
    The atlas has been burned on exactly that distinction (CORR-077).'
- parameter: 'BONE AGE, MEASURED IN A RANDOMISED PLACEBO-CONTROLLED TRIAL - unchanged'
  value: mean bone age to chronological age ratio unchanged from baseline in BOTH groups at week 52
  unit: ratio
  conditions: savarirayan2026, bone maturation and integrity assessed as a prespecified safety endpoint
    alongside bone-related adverse events; no fractures reported in either arm; no symptomatic
    hypotension, with 4 asymptomatic blood-pressure adverse events all within 2 hours of first dose (2 of
    57 navepegritide, 2 of 27 placebo); transient low-level anti-CNP antibodies in 4 of 54 with no effect
    on pharmacokinetics, efficacy or safety
  species: human
  source_ref: savarirayan2026
  uncertainty: 'THIS IS THE PROPERTY THAT MATTERS MOST AT BONE AGE 16 AND IT IS NOW MEASURED IN A
    RANDOMISED PLACEBO-CONTROLLED DESIGN RATHER THAN INFERRED. Velocity gained without bone age spent
    converts to adult height; velocity that advances maturation does not. Every other agent in the stack
    is weaker on this point - cilostazol is entirely unmeasured, and erdafitinib rests on an uncontrolled
    case plus one randomised infigratinib trial. LIMITS: 52 weeks is short for a maturation endpoint,
    the ratio is a coarse measure, and this is achondroplasia rather than a normal plate. It also does not
    show that the gain SURVIVES to adult height, which no CNP trial has yet demonstrated because none has
    run to final height.'
- parameter: 'THE COMBINATION THE STACK ASSUMED - CNP PLUS GROWTH HORMONE, RUN IN HUMANS, AND ADDITIVE'
  value: '+3.28 cm/year added on top of navepegritide, within-subject'
  unit: cm/year annualised growth velocity
  conditions: 'mcdonnell2026, COACH phase 2, children aged 2-11 with achondroplasia given weekly
    navepegritide PLUS lonapegsomatropin (a long-acting somatropin prodrug), n=21 - 12 treatment-naive and
    9 already on navepegritide monotherapy for more than one year. TREATMENT-NAIVE: least-squares mean AGV
    8.69 cm/yr against 5.95 for matched navepegritide-monotherapy children from ApproaCH, difference +2.74
    cm/yr (P<0.0001); observed mean 8.80, +3.89 from baseline (P=0.0015). NAVEPEGRITIDE-EXPERIENCED:
    observed mean AGV 8.42 cm/yr, +3.28 cm/yr on their OWN navepegritide-treated baseline (P<0.0001). Arm
    span +9.4 cm treatment-naive and +7.9 cm navepegritide-experienced, with improved body proportionality.
    Well tolerated, no discontinuations.'
  species: human
  source_ref: mcdonnell2026
  uncertainty: 'THE NAVEPEGRITIDE-EXPERIENCED ARM IS THE ONE TO READ AND IT IS THE STRONGER DESIGN.
    Children already on a CNP agent for over a year - therefore past any initial catch-up - gained +3.28
    cm/year when GH was added, WITHIN SUBJECT, which is hard to attribute to regression to the mean or to
    trial-entry effects. That is a direct human answer to a question this atlas has carried since round 46
    and has repeatedly answered from mechanism alone: GH ADDS ON TOP OF A CNP AGENT. It also revises the
    round-88 weakening of the GH arm, which rested on a case series where growth ran at 10 cm/year with
    IGF-1 at -3.8 SDS - that showed GH is not NECESSARY, and this shows it is nonetheless ADDITIVE, which
    are different claims. THE LIMITS ARE REAL AND SEVERE. n=21 total and 9 in the within-subject arm; no
    placebo arm for the combination, with the treatment-naive comparison drawn from a DIFFERENT TRIAL;
    phase 2 proof-of-concept; 52 weeks; achondroplasia rather than a pathway-intact plate; and no bone age
    is reported for the combination in what was read here, which matters because GH advances maturation
    where a CNP agent does not. The authors mechanistic proposal - that CNP action ENHANCES the plate
    RECEPTIVITY to GH - is a hypothesis they state, not something the trial tested.'
- parameter: 'THE UNEXPLORED PARALLEL SOURCE OF cGMP - two approved oral drugs, and no skeletal data at all'
  value: 0 studies crossing sGC stimulators with cartilage, chondrocyte, growth plate or bone growth
  unit: count
  conditions: Europe PMC 2026-08-08, query crossing riociguat, vericiguat, cinaciguat, soluble guanylate
    cyclase and sGC stimulator against cartilage, chondrocyte, growth plate, bone growth and skeletal.
    1738 hits, all cardiovascular, pulmonary or muscle; nothing skeletal in the top-ranked records.
    Riociguat is approved for pulmonary arterial hypertension and CTEPH, vericiguat for heart failure -
    both oral, both raising cGMP through the SOLUBLE cyclase rather than the particulate one NPR2 uses
  species: not_applicable
  source_ref: wang2018
  uncertainty: 'RECORDED AS AN UNEXPLORED LEAD AND NOT AS A PROMISING ONE, BECAUSE THIS ATLAS ALREADY
    HOLDS THE RESULT THAT PREDICTS IT FAILS. wang2018 raised tissue cGMP by 52 per cent with tadalafil,
    with confirmed target engagement, and long bone length did not move - a sufficiency failure for BULK
    cGMP. CORR-073 drew the conclusion that the PDE ISOFORM is the variable and bulk cGMP is not, and the
    same logic applies to the cyclase: sGC-derived cGMP is a cytosolic pool physically distinct from the
    membrane-delimited pool NPR2 generates, and the evidence says the pool matters. AGAINST THAT, THE
    ABSENCE IS GENUINE AND THE DRUGS ARE ORAL AND APPROVED, so the cost of checking is one expression query
    and one organ-culture arm. I RAN THE EXPRESSION CHECK THIS ROUND AND IT DOES NOT CLOSE THE LEAD, BUT IT
    DOES WEAKEN IT. From GSE288028: GUCY1A1 in 3 of 4 donors at 0.6-7.6 per cent of cells and GUCY1B1 in 3
    of 4 at 1.0-6.3 - the soluble cyclase heterodimer IS transcribed, so the lead survives, but at an order
    of magnitude below the axis genes that matter (PPP2CA 29-39, CAMK2D 39-66). MORE TELLING IS THE INPUT:
    NOS1 is detected in 0 of 4 donors (0.24-0.68 per cent), NOS2 in 2 of 4 and NOS3 in 2 of 4, all under 7.
    sGC is a nitric-oxide sensor, and the enzymes that make nitric oxide are the scarcest genes I have
    measured on this axis. A stimulator needs basal NO to potentiate; riociguat has an NO-independent mode
    but it is the weaker of its two.'
- parameter: 'THE ONLY DOCUMENTED ADDITIVE PARTNER ON THIS AXIS - preventing NPR2 dephosphorylation, with
    genetic validation, pharmacology, and human target expression'
  value: 'genetic rescue to WILD-TYPE bone length; LB-100 alone 1.30x vehicle and additive with a CNP
    analogue; PPP2CA and PPP2CB detected in 4 of 4 human donors'
  unit: multiple
  conditions: 'THREE INDEPENDENT LAYERS ON ONE NODE. (1) MECHANISM - shuhaibar2017: FGF lowers growth
    plate cGMP by DEPHOSPHORYLATING NPR2, blocked by cantharidin, implicating a PPP-family phosphatase.
    (2) GENETIC VALIDATION - wagner2021: a phospho-mimetic GC-B-7E/7E allele crossed into FGFR3-G380R mice
    RESTORES LONG BONE LENGTH AND HYPERTROPHIC ZONE AREA TO WILD-TYPE, so NPR2 dephosphorylation is
    REQUIRED for the achondroplasia phenotype. (3) PHARMACOLOGY - shuhaibar2021: in E16.5 Fgfr3-Y367C/+
    femur culture, BMN-111 alone gave 1.78x vehicle, LB-100 ALONE gave 1.30x, and the combination 2.06x,
    against an additive prediction of 2.08 - additive, and the ONLY combination on this axis that beat its
    own monotherapy on a length endpoint. (4) HUMAN TARGET EXPRESSION, computed here from GSE288028:
    PPP2CA in 4/4 donors at 29.2-39.4 per cent of cells, PPP2CB in 4/4 at 25.1-67.2 per cent.'
  species: multiple
  source_ref: wagner2021
  uncertainty: 'THIS IS THE BEST-SUPPORTED PAIRING CANDIDATE ON THE AXIS AND IT IS STILL PRECLINICAL.
    What makes it stronger than every other downstream option is that all four layers exist - a mechanism,
    a genetic rescue to wild-type, an additive pharmacological combination with a length endpoint, and
    confirmation that the drug target is transcribed in human growth plate. Nothing else on this axis has
    more than one layer. THE LIMITS ARE SERIOUS. The combination was run in E16.5 FETAL femur ORGAN
    CULTURE over 6 days, in an Fgfr3 GAIN-OF-FUNCTION background, with a CNP analogue rather than with the
    FGFR inhibitor the stack actually contains. LB-100 is a clinical-stage ONCOLOGY agent and PP2A is a
    tumour suppressor, so the therapeutic index is the opposite of benign. shuhaibar2017 could only narrow
    the phosphatase to the PPP FAMILY - cantharidin at 100 micromolar inhibits PPP1, PPP2, PPP4 and PPP5
    together - and PPP1CA is also expressed in all four human donors, so PP2A is not established as the
    specific enzyme. AND THE REDUNDANCY OBJECTION FROM CORR-083 STANDS: LB-100 works by counteracting
    FGF-INDUCED dephosphorylation, so in a subject already taking an FGFR inhibitor much of its substrate
    may be gone.'
- parameter: 'THE DOWNSTREAM AND PARALLEL POINTS ARE EMPTY - no bone length endpoint exists for any of them'
  value: 0 studies with a bone length or growth plate endpoint for BK openers, TRPM7 modulators or sGC
    stimulators
  unit: count
  conditions: 'Europe PMC 2026-08-08. BK channel openers and TRPM7 modulators (NS1619, NS11021,
    BMS-204352, naltriben) crossed against bone, chondrocyte, growth plate, skeletal and cartilage - 389
    hits, all vascular calcification, diabetic osteopenia, glioblastoma or osteoarthritis; NOTHING with a
    growth endpoint. sGC stimulators (riociguat, vericiguat, cinaciguat) crossed against chondrocyte,
    growth plate, endochondral and longitudinal growth - 84 hits, nothing skeletal; the nearest is PKG2
    activation restoring bone MASS in glucocorticoid osteoporosis, which is a density endpoint not a
    length one. NPR3 antagonism crossed against bone length, growth plate, longitudinal growth, stature
    and elongation - no antagonist has ever been given with a growth endpoint.'
  species: not_applicable
  source_ref: wang2018
  uncertainty: 'THESE ARE THE POINTS WHERE THE ARCHITECTURE SAYS AN AGENT WOULD BE NON-REDUNDANT AND THE
    LITERATURE IS SIMPLY BLANK. BK, TRPM7 and CaMKII sit DOWNSTREAM of the cGMP convergence, so an agent
    acting there would by construction not duplicate either a CNP analogue or an FGFR inhibitor - and my
    human expression check makes the target case unusually strong: KCNMA1 4/4, TRPM7 4/4 at 27.9-53.7 per
    cent, and CAMK2D 4/4 at 39.3-65.8 per cent, which is among the best-detected genes in the whole table.
    THE REASON THIS IS NOT A RECOMMENDATION is that expression is necessary and not sufficient, and this
    atlas holds the proof in the same tissue: PDE5A and PDE10A are both 4/4 and their inhibitors do
    nothing to bone length, one of them with confirmed target engagement. A blank literature at a
    well-expressed node is a research proposal, not a candidate.'
- parameter: 'AND NEPRILYSIN IS NOT THE DOMINANT CNP-DEGRADING ENZYME IN HUMAN GROWTH PLATE BY EXPRESSION'
  value: 'ECE1 4/4 at 2.7-25.0 per cent and IDE 4/4 at 15.9-17.9 per cent, against MME 3/4 at 0.9-9.9'
  unit: per cent of cells, donors detected
  conditions: computed here from GSE288028. Neprilysin (MME) is the target sacubitril blocks; endothelin
    converting enzyme 1 and insulin degrading enzyme both also degrade natriuretic peptides and both are
    detected in ALL FOUR donors at higher rates than MME
  species: human
  source_ref: chu2026
  uncertainty: 'A MECHANISTIC ARGUMENT AGAINST SACUBITRIL THAT THIS ATLAS HAD NOT MADE. If two other
    peptidases capable of degrading natriuretic peptides are more abundantly transcribed in the target
    tissue than neprilysin is, then blocking neprilysin alone leaves the larger degradation routes intact,
    and the ceiling on the enzymatic-clearance strategy is lower than the mouse data suggest. IT IS AN
    EXPRESSION ARGUMENT AND THEREFORE WEAK IN THE USUAL WAY - transcript abundance is not enzyme activity,
    substrate preference matters more than abundance, ECE1 and IDE have broad substrate ranges in which
    CNP may be minor, and hakata2024 showed a real sacubitril effect in mouse where the same objection
    would apply. It lowers the prior on sacubitril; it does not refute it. It also stacks with the
    round-99 zonal finding that MME peaks in the STEM zone where NPR2 is least present.'
localization:
- 'growth plate proliferative and prehypertrophic zones: where NPR2/GC-B sits and where a CNP agent acts'
- 'growth plate hypertrophic zone: where the CNP PKA arm acts and where cilostazol cannot reach'
human_evidence: direct
human_evidence_note: Both decisive results are human randomised or within-subject clinical trials -
  APPROACH for navepegritide against placebo, COACH for the CNP-plus-GH combination.
species_basis:
- human
translation_risk: low
translation_risk_reason: The two load-bearing results are human clinical trials of approved or
  late-stage agents. The residual translation question is not species but POPULATION - both trials are
  achondroplasia, where FGFR3 is pathologically overactive.
confidence: B
claim_grades:
- claim: A once-weekly sustained-release CNP prodrug is now an approved option and is preferable to daily
    vosoritide on continuity of exposure.
  grade: B
  basis: Accelerated US approval plus a randomised placebo-controlled phase 2b meeting its primary
    endpoint. The continuity argument itself is mechanistic, from hirota2018 needing continuous infusion,
    and no head-to-head against vosoritide exists.
- claim: Growth hormone adds substantially on top of a CNP agent in humans.
  grade: C
  basis: COACH phase 2, +3.28 cm/yr within-subject in 9 navepegritide-experienced children, P<0.0001. No
    placebo arm for the combination, n=21 total, 52 weeks, achondroplasia only, no bone age reported.
- claim: The CNP arm does not spend bone age.
  grade: B
  basis: Prespecified safety endpoint in a randomised placebo-controlled trial, bone age to chronological
    age ratio unchanged in both arms at 52 weeks. Short duration and a coarse measure.
- claim: sGC stimulators are worth testing on this axis.
  grade: E
  basis: An absence of data plus two approved oral drugs, against a direct sufficiency failure for bulk
    cGMP with confirmed target engagement, sGC subunits transcribed at only 0.6-7.6 per cent of cells,
    and NOS1 undetected in all four donors. Listed for completeness, not recommended.
- claim: Preventing NPR2 dephosphorylation is the best-supported pairing partner for a CNP agent on this
    axis.
  grade: C
  basis: Four converging layers - shuhaibar2017 mechanism, wagner2021 genetic rescue to wild-type,
    shuhaibar2021 additive length endpoint (2.06x observed against 2.08x predicted), and PPP2CA/PPP2CB in
    4 of 4 human donors. All of it preclinical, all in an Fgfr3 gain-of-function background, in fetal
    organ culture, with cantharidin unable to distinguish PP2A from PPP1/PPP4/PPP5, and with the
    substrate-depletion objection of CORR-083 unresolved.
- claim: No agent acting at BK, TRPM7 or soluble guanylate cyclase can be recommended, despite the
    architecture predicting non-redundancy there.
  grade: A
  basis: This grades an ABSENCE, which is why it is high. Two systematic searches, 389 and 84 hits, with
    no bone-length or growth-plate endpoint in any species. The absence itself is well established; what
    would happen if the experiment were run is entirely unknown.
key_refs:
- ref_id: savarirayan2026
  year: 2026
  type: primary
  one_line_finding: APPROACH phase 2b - navepegritide 100 ug/kg weekly gave +1.49 cm/yr over placebo,
    +2.48 in children 8 and older, with the bone age to chronological age ratio unchanged.
- ref_id: mcdonnell2026
  year: 2026
  type: primary
  one_line_finding: COACH phase 2 - adding long-acting GH to navepegritide gave +3.28 cm/yr within-subject
    in children already on navepegritide for over a year.
- ref_id: kang2026
  year: 2026
  type: review
  one_line_finding: Navepegritide received accelerated US approval as a once-weekly sustained-release CNP
    prodrug for achondroplasia with open epiphyses.
- ref_id: hirota2018
  year: 2018
  type: primary
  one_line_finding: CNP-53 by CONTINUOUS infusion grew wild-type rats dose-dependently and prevented
    growth plate closure - the mechanistic basis for preferring sustained release.
- ref_id: wagner2021
  year: 2021
  type: primary
  one_line_finding: A phospho-mimetic GC-B-7E/7E allele crossed into FGFR3-G380R mice restores long bone
    length and hypertrophic zone area to WILD-TYPE - the genetic validation of the NPR2-dephosphorylation
    node that LB-100 targets pharmacologically.
- ref_id: shuhaibar2021
  year: 2021
  type: primary
  one_line_finding: LB-100 alone 1.30x vehicle, BMN-111 alone 1.78x, the combination 2.06x against an
    additive prediction of 2.08 - the only combination on this axis that beat its own monotherapy on a
    length endpoint.
- ref_id: hakata2024
  year: 2024
  type: primary
  one_line_finding: Sacubitril grows mice through NPR-B and is explicitly NOT additive with CNP - the
    result that removes neprilysin inhibition from the pairing candidates.
