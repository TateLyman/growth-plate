    concurrent control, and cells per column falls with age regardless'
localization:
- 'the proliferative column, where ogawa2002 reports fewer cells, lower density and a more ellipsoidal
  cell shape under PTH'
human_evidence: direct
human_evidence_note: 'winer2025 is direct human evidence with linear growth and, for one patient, FINAL
  ADULT HEIGHT as endpoints, under twice-daily PTH(1-34) in children of mean baseline age 13.7 years
  followed for up to six years. It is replacement dosing in a disease population, so it cannot establish
  efficacy in a normal child - but it is the only human dataset in existence with these endpoints under a
  PTH1R agonist.'
species_basis:
- human
- rat
translation_risk: high
translation_risk_reason: 'The human data is replacement dosing in hypoparathyroidism, where correcting
  calcium homeostasis plausibly explains the entire height gain. What transfers better than the effect
  size is the NEGATIVE: a decade of PTH1R agonism through childhood did not truncate final height, and
  that is the observation pool depletion would have degraded regardless of why the height rose.'
confidence: C
claim_grades:
- claim: silvestrini2007 is a non-replication of ogawa2002.
  grade: X
  basis: 'WITHDRAWN. Three-month-old adult Wistar rats against ogawa2002 six-week cohort, 80 micrograms
    per kilogram three times weekly against five, and a zone height as the endpoint. ogawa2002 own adult
    cohort also found no change in thickness or cell number. The studies agree. Round 185 counted this as
    one of three reasons to downgrade and it should not have.'
- claim: Frequent dosing drives PTH1R agonism toward the harmful continuous arm in humans.
  grade: E
  basis: 'NOW CONTRADICTED BY HUMAN DATA AT A HIGHER FREQUENCY THAN PROPOSED. winer2025 dosed TWICE DAILY
    for up to six years in children of mean baseline age 13.7 and height-for-age Z rose in the arm without
    an independent growth-suppressing disease. Together with the label pharmacokinetics from round 187 -
    one-hour half-life, calcium back to baseline by 16 to 24 hours - the round-185 benchmark has lost its
    empirical support in both directions. It survives only as an untested mechanistic possibility.'
- claim: PTH1R agonism spends the growth plate progenitor pool the way growth hormone does.
  grade: E
  basis: 'THE FIRST EVIDENCE ON THIS QUESTION IN ANY SPECIES, AND IT POINTS AWAY. winer2025 reports CaR
    patients attaining or exceeding midparental height and a case reaching normal final adult height after
    a DECADE of PTH(1-34) from age six. Pool depletion produces early cessation and a final height below
    target. Held at E rather than X because the design is replacement dosing in a disease population, the
    decade figure is a single case, and no one has measured a resting-zone cycle time under any PTH1R
    agonist in any species.'
- claim: ogawa2002 shows PTH raises amplification.
  grade: E
  basis: 'ITS OWN HISTOLOGY MILDLY SUGGESTS THE OPPOSITE. Cell number per column FELL in the proliferative
    zone with lower density and more ellipsoidal cells, while cell production rate rose - which is faster
    turnover through a shorter column, i.e. reduced residence time, which is reduced amplification. The
    comparison is against the basal rather than the concurrent control so it is not clean, but it is the
    only structural evidence available and it does not favour the amplification reading.'
- claim: Someone has measured what a PTH1R agonist does to the resting zone.
  grade: X
  basis: 'NO. A targeted search across resting zone, reserve zone, label-retaining cells and
    chondroprogenitors under PTH, teriparatide, abaloparatide or PTH1R returns nothing in any species.
    This is the term the whole candidate turns on and it has never been measured.'
