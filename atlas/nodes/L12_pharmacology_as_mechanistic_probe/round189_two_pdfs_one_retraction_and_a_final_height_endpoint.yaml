id: round189_two_pdfs_one_retraction_and_a_final_height_endpoint
name: ROUND 189 - the silvestrini non-replication is withdrawn, and a decade of PTH in a child ending at
  midparental height is the best evidence yet that this drug does not spend the pool
aliases:
- silvestrini withdrawn
- winer2025 read in full
- the final height endpoint
- round 189
type: hypothesis
layer: L12
stub: false
summary: 'TWO PAPERS THE USER SUPPLIED, AND BOTH MOVE THE VERDICT. One withdraws a negative this atlas
  raised in round 185. The other supplies the first human FINAL-HEIGHT endpoint under a PTH1R agonist and
  bears directly on the question the whole programme has been stuck on.

  FIRST - THE silvestrini2007 NON-REPLICATION IS WITHDRAWN. Round 185 cited it as "the only other rat
  study to measure the same structure under PTH and it found nothing", and used it as one of three
  reasons to downgrade the candidate. The full text shows it cannot contradict ogawa2002''s young cohort
  for three separate reasons. THE ANIMALS ARE ADULT - three-month-old male Wistar rats at 225 to 250
  grams, which corresponds to ogawa2002''s FIFTEEN-WEEK cohort, not its six-week one. THE SCHEDULE IS
  DIFFERENT - 80 micrograms per kilogram THREE TIMES A WEEK against ogawa2002''s FIVE, so 60 per cent of
  the exposure. AND THE ENDPOINT IS A ZONE HEIGHT - Cartilage Growth Plate Width, the quantity CORR-189
  says cannot separate the terms, and the quantity ogawa2002''s OWN ADULT COHORT also found unchanged.
  THE TWO STUDIES AGREE. Adult rat growth plate thickness does not move under PTH. ogawa2002 additionally
  measured longitudinal growth rate and cell production rate, which did move in adults; silvestrini2007
  measured neither. The assay was not insensitive - corticosterone in the same experiment DID reduce
  cartilage growth plate width, with recovery on withdrawal.

  SECOND - winer2025 READ IN FULL, AND IT IS BETTER THAN ITS ABSTRACT IN THREE WAYS.

  THE SCHEDULE IS TWICE DAILY. Not once. Fourteen pulses a week, MORE frequent than the daily regimen
  round 185 called twenty-fold too frequent, sustained for up to six years in children whose mean
  baseline age was 13.7 years - and height-for-age Z ROSE in the calcium-sensing-receptor group. Combined
  with the label pharmacokinetics from round 187, the schedule objection is now contradicted by human
  data at a dosing frequency HIGHER than anything proposed here.

  THE GROWTH SIGNAL IS NOT GROWTH HORMONE. Two APS-1 patients receiving daily growth hormone injections
  were EXCLUDED from the analysis. Whatever moved height-for-age Z in the CaR arm, it was not GH.

  AND THE THIRD IS THE ONE THAT MATTERS MOST. The authors report that patients with CaR "attained or
  exceeded" sex-adjusted MIDPARENTAL HEIGHT, and cite a case in which PTH(1-34) reversed unexplained
  growth retardation in a six-year-old who reached a FINAL ADULT HEIGHT CONSISTENT WITH MIDPARENTAL
  HEIGHT AFTER A DECADE OF PTH THERAPY. A decade of exposure spanning the entire growth period, ending in
  a normal final height, is the INTEGRAL endpoint. Pool depletion is precisely the failure that would
  show up there - round 183 established that growth hormone buys rate by spending the reserve, with
  amplification at 0.77, and the signature of that is a plate that runs out early. TEN YEARS OF PTH1R
  AGONISM THROUGH CHILDHOOD DID NOT SHORTEN THIS PATIENT. That is the best available human evidence that
  this drug class does not spend the pool, and this programme has had no evidence on that question in any
  species until now.

  THE CAVEATS ARE HEAVY AND THEY ALL POINT THE SAME WAY. This is REPLACEMENT dosing in hypoparathyroid
  children, so correcting calcium homeostasis is a large confound and much or all of the height gain
  could be disease correction rather than a growth-plate effect. APS-1 carries constitutional delay of
  growth and hypogonadism, which is why that arm stayed flat and why the comparison between arms is not
  a drug comparison. The informative arm is n = 9. The dose is not stated in the paper. And "attained or
  exceeded midparental height" is a wide target. WHAT SURVIVES ALL OF THAT is the negative: if PTH1R
  agonism spent the growth plate pool, a decade of it across childhood should have produced a final
  height BELOW midparental, and it did not.

  THIRD - AND CUTTING THE OTHER WAY, ogawa2002''S OWN HISTOLOGY IS AMBIGUOUS ON AMPLIFICATION AND MILDLY
  AGAINST IT. In the PTH-treated young animals, growth plate thickness rose but the mean CELL NUMBER PER
  COLUMN FELL, specifically in the proliferative zone, with cell density LOWER and proliferative
  chondrocytes more ELLIPSOIDAL rather than flattened. More cells produced per day from FEWER
  proliferative cells per column means faster turnover through a shorter column - which is reduced
  residence time, and round 175 established that amplification IS residence time. That is the
  pool-spending signature rather than the amplification signature. THE COMPARISON IS NOT CLEAN: the cell
  count was reported against the BASAL control killed at study start rather than the concurrent control,
  and cells per column falls with age anyway. But it is the only structural hint available and it does
  not favour the amplification story.

  FOURTH - A TARGETED SEARCH CONFIRMS THE CENTRAL GAP IS REAL. Searching specifically for PTH1R agonism
  against the resting zone, reserve zone, label-retaining cells or chondroprogenitors returns nothing.
  NOBODY HAS MEASURED WHAT A PTH1R AGONIST DOES TO THE PROGENITOR POOL IN ANY SPECIES. The winer2025
  final-height observation is currently the only thing in the atlas that bears on it, and it does so
  indirectly.

  WHERE THIS LEAVES THE CANDIDATE. Round 188''s molecule reversal to TERIPARATIDE stands and is
  strengthened - winer2025 used PTH(1-34), which is teriparatide, so the human growth data and the only
  wild-type animal growth data and the benign immunogenicity profile are now all the SAME MOLECULE.
  Round 185 loses its second of three negatives. And the one question that decides whether this is worth
  doing has acquired its first piece of human evidence, from the endpoint that matters most, pointing the
  right way, in a design too confounded to settle it.'
