claim_grades:
- claim: Letrozole slows bone age advance and lowers oestradiol in pubertal boys.
  grade: A
  basis: Randomised trial with annual hormone and bone age measurement, n=79.
- claim: Letrozole monotherapy meaningfully increases predicted adult height in boys with ISS.
  grade: D
  basis: The year-1 gain did not persist; the 3-year combined gain was +1.3 cm and the authors conclude efficacy
    as monotherapy may be limited.
- claim: Letrozole combined with rhGH increases attained adult height.
  grade: C
  basis: Propensity-matched single-centre cohort of 32 per arm; not randomised, and letrozole underperformed anastrozole.
