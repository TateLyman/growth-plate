id: thread_status_igf_versus_temperature
name: VERDICT on both threads - local IGF-1 is CLOSED and dropped, temperature is not closed but is not addable either and is parked with a defined trigger
aliases:
- is local IGF-1 dead
- is temperature dead
- what to go after next
- the bone age discriminator
type: hypothesis
layer: L12
stub: false
summary: 'VERDICT ROUND. The instruction was to close both threads or add them to the stack, with full
  confidence. THREAD 1 IS CLOSED AND DROPPED. THREAD 2 IS NOT CLOSED, IS NOT ADDABLE ON PRESENT EVIDENCE,
  AND IS PARKED WITH ONE DEFINED TRIGGER. The goal throughout is ADULT height at bone age 16 with spine
  and knee reserve, and the test that decides both is whether an intervention SPENDS BONE AGE.
  THREAD 1, LOCAL IGF-1 - CLOSED, ON SIX CONVERGING LINES.
  (1) THE CAUSAL CEILING. de2026, Mendelian randomisation over 1.18 million people: 1 SD of serum IGF-1
  buys 0.09 SD of adult height, about 0.6 cm. GH therapy already drives total IGF-1 to about +2 SDS
  (bannink2007), so the stack is at or past the exposure this instrument covers. THIS ATLAS ALREADY HELD
  THAT PAPER, READ IN FULL, CITED IN THREE NODES, WITH A NODE ALREADY CONCLUDING IT CAPS THE AXIS -
  CORR-109, and the thread was closable before I opened it.
  (2) THE PROPOSAL HAS BEEN RUN. machnicki2022 produced exactly the state this thread wanted - raised
  LOCAL growth-plate IGF-I bioavailability with NORMAL serum IGF-I, verified by perivascular ligand,
  uptake, receptor activation and reduced binding proteins - and got accelerated elongation into
  DISORGANISED plates, with premature growth cessation and diminished bone quality (white2023).
  (3) THE CELLULAR CEILING. hunziker1994 restored hypertrophic cell HEIGHT to physiological values and no
  further, while SHORTENING the hypertrophic phase from 6 days to 4.
  (4) THE HUMAN PREDICTOR RUNS THE WRONG WAY. bannink2007, 73 children followed to adult height: baseline
  free IGF-I NEGATIVELY correlated with adult height and with first-year response, out-predicting total.
  (5) THE PHARMACOLOGY OPPOSES ITSELF. bach1994: exogenous IGF-I suppressed GH secretion about 50 per cent
  and induced IGFBP-1, which sequesters the free fraction.
  (6) THE AXIS IS NOT EVEN NECESSARY. bilha2025: five patients with severe GH deficiency reached normal or
  TALL stature with persistently low IGF-1, and rhGH did not significantly change their growth velocity.
  Nothing in that list is a null result waiting for a better experiment. The effect size is capped by
  human genetics, the mechanism has been executed and produces the failure mode, and the pharmacology
  fights itself. DROP IT.
  THREAD 2, LOCAL WARMING - NOT CLOSED, NOT ADDABLE, PARKED.
  WHAT IT HAS: a measured delivery multiplier (10 kDa tracer entry up about 150 per cent from 22 to 34
  degrees C, serrat2014); a LENGTH endpoint with the contralateral limb as control that PERSISTED 49 days
  after treatment stopped, at skeletal maturity (serrat2015, replicated by racine2018); an internal
  negative control in the same animals, since the warmer humerus did not respond in four trials; a human
  thermal premise now measured rather than assumed - the resting knee at 31.4 degrees C, about 5-6 below
  core, with 60 minutes of jogging raising it 6.1 degrees (becher2008); and site-selectivity by
  construction, since it cannot reach the spine.
  WHAT IT LACKS, AND WHY IT CANNOT BE ADDED. There is NO human growth endpoint of any design. serrat2013
  confines the growth response to an initial rapid phase that a bone-age-16 subject has passed. cao2026a,
  the best-controlled human test, finds precipitation rather than temperature dominant and the colder
  north TALLER. The human unilateral-use literature - decades of studies of racquet-sport players -
  reports large dominant-side asymmetries in bone MASS, DENSITY and WIDTH and does not report LENGTH,
  which is where a human effect should have shown up first if it existed. serrat2008 shows part of the
  effect is a direct thermal action on cartilage rather than delivery. And aeppli2025a shows regional
  hyperaemia in children can RETARD growth or close plates rather than only accelerate.
  AND THE PRACTICAL POINT THAT SETTLES IT FOR NOW: becher2008 means ORDINARY EXERCISE ALREADY DELIVERS
  the thermal excursion. Sixty minutes of jogging moves the human knee about half the span serrat2014
  used. So there is no separate lever to add to the stack - the available version of this intervention is
  activity, which the coverage audit already wants for the absorptive term. Adding a heating protocol on
  top has no evidence behind it at a late plate and a real thermal-dose question in front of it.
  THE ONE TRIGGER THAT WOULD REOPEN IT: a demonstration that the DELIVERY enhancement survives in a
  mature plate when the growth response has gone - serrat2014 own protocol in older animals, contralateral
  limb as control. Delivery and growth are different claims and serrat2013 tested only the second. If
  delivery survives, warming becomes a free multiplier on the peptide arm rather than a growth agent, and
  that is worth revisiting. Until then it is parked, not pursued.'
quantitative:
- parameter: 'THE CAUSAL CEILING, WHICH THIS ATLAS ALREADY HELD - 0.09 SD of adult height per 1 SD of
    IGF-1'
  value: 0.09 +/- 0.04 SD taller adult height per 1 SD higher serum IGF-1 (P=0.015), replicated at 0.12
    +/- 0.03 in South Asians
  unit: SD of adult height per SD of serum IGF-1
  conditions: 'de2026. Two-sample Mendelian randomisation, IGF-1 instruments from UK Biobank GWAS against
    GIANT height EXCLUDING UK Biobank - non-Hispanic White n=1,176,465, African descent 168,191, South
    Asian 49,032, East Asian 361,369, Hispanic 58,709 - by inverse-variance weighting, persisting after
    adjustment for childhood BMI and replicated longitudinally against measured heights at ages 7-17 in
    ALSPAC. THIS ENTRY WAS ALREADY IN THE BIBLIOGRAPHY, READ IN FULL ON 2026-08-07, AND CITED IN THREE
    NODES INCLUDING mendelian_randomization_height, WHICH ALREADY CONCLUDED IT PUTS A HARD CEILING ON THE
    AXIS. See CORR-109.'
  species: human
  source_ref: de2026
  uncertainty: 'PUT IN CENTIMETRES THIS IS WHAT CLOSES THE THREAD. One SD of adult male height is roughly
    7 cm, so 1 SD of lifelong genetically-elevated IGF-1 buys about 0.6 cm. bannink2007 shows GH therapy
    already drives total IGF-1 to about +2 SDS, so the stack is at or past the exposure this instrument
    covers; adding a bioavailability agent on top is chasing tenths of a centimetre, and bach1994 says it
    would suppress endogenous GH by half while doing so. THE LIMITS OF MR ARE REAL AND DO NOT RESCUE THE
    THREAD: it estimates lifelong exposure to NORMAL variation, not pharmacological elevation, so a
    non-linear response above the physiological range is not excluded; the instrument is TOTAL IGF-1, not
    the bioactive fraction this thread argued for; and assortative mating for height inflates genetic
    variance in ways that bias height MR specifically. But the estimate would have to be wrong by roughly
    an order of magnitude to make this axis worth an arm, and four independent lines of evidence point the
    same way.'
- parameter: 'THE THREAD ITSELF HAS BEEN RUN IN VIVO, WITH THE DELIVERY READOUT, AND THE ENDPOINT IS
    PREMATURE CESSATION'
  value: raised local growth-plate IGF-I bioavailability with NORMAL serum IGF-I gave accelerated
    elongation, disorganised plates, premature growth cessation and diminished bone quality
  unit: qualitative, with the delivery step measured
  conditions: 'machnicki2022 - 114 C57BL/6 mice, high-fat versus control diet from weaning to skeletal
    maturity. Tibial and tail elongation rates rose within 1-2 weeks WITHOUT any change in serum IGF-I.
    In vivo multiphoton imaging showed MORE IGF-I in the vasculature surrounding growth plates and
    INCREASED UPTAKE when vascular levels peaked; immunostaining showed MORE ACTIVATED IGF-1 RECEPTORS and
    FEWER INHIBITORY BINDING PROTEINS in the plate. Femoral bone density and growth plate size were
    increased but the plates were DISORGANISED before the mice were even obese. white2023, the same
    group: childhood obesity gives growth acceleration, PREMATURE GROWTH CESSATION and diminished bone
    quality while systemic IGF-1 stays normal.'
  species: mouse
  source_ref: machnicki2022
  uncertainty: 'THIS IS AS CLOSE AS ANY THREAD IN THIS ATLAS HAS COME TO HAVING ITS OWN PROPOSAL EXECUTED
    BY SOMEONE ELSE. The state this thread wanted to engineer - high local IGF bioavailability at the
    plate with normal circulating IGF-1 - was produced, verified at three levels (perivascular ligand,
    uptake, receptor activation and binding-protein reduction), and the skeletal outcome was faster
    elongation into a disorganised plate that stops early. THE INSTRUMENT IS DIET, NOT IGF, and that is
    the caveat: high-fat feeding changes insulin, leptin, adipokines and aromatase alongside IGF
    bioavailability, so the causal arrow from local IGF to premature cessation is not isolated. What
    cannot be waved away is that the delivery mechanism was directly imaged and the endpoint was measured
    to skeletal maturity, which is more than this thread ever had in its favour.'
- parameter: 'THE DISCRIMINATOR - raising free IGF-1 in humans advances bone age and LOWERS predicted
    adult height'
  value: 'bone age 12.00 (IQR 11.00-13.00) against chronological 10.67 (IQR 9.50-12.00), p<0.001; predicted
    adult height -0.28 +/- 0.81 against mid-parental +0.10 +/- 0.60, p<0.001'
  unit: years of bone age; SD score of predicted adult height
  conditions: 'sun2026 - 130 Chinese boys aged 5-15, overweight (n=43) or obese (n=87), cross-sectional;
    bone age advancement in 52.3 per cent (67/128) and predicted-adult-height impairment in 22.6 per cent.
    Read together with martnrivada2025 - 150 prepubertal children with severe obesity against 206 matched
    controls, showing DECREASED PAPP-A, PAPP-A2 and STC2 but INCREASED total AND FREE IGF-I, accelerated
    growth and height z-score +1.28 +/- 1.04. So the same population that carries elevated free IGF-I and
    grows fast is the population whose bone age runs ahead and whose predicted adult height falls below
    target.'
  species: human
  source_ref: sun2026
  uncertainty: 'THESE ARE TWO SEPARATE COHORTS JOINED BY THIS ATLAS AND THAT JOIN IS THE WEAK POINT.
    martnrivada2025 measured free IGF-I and growth; sun2026 measured bone age and predicted adult height;
    neither measured both in the same children, so the chain "high free IGF-1 therefore advanced bone age
    therefore lower adult height" is an inference across cohorts and is graded accordingly. OBESITY IS
    ALSO A TERRIBLE INSTRUMENT for isolating free IGF-1, because it simultaneously raises aromatase
    activity and oestrogen, raises insulin and leptin, and alters the GH axis - any of which advances bone
    age independently of IGF bioavailability. AND PREDICTED adult height is a prediction, not an outcome;
    Bayley-Pinneau and similar methods are themselves bone-age-based, so a cohort with advanced bone age
    is partly guaranteed to show reduced predicted height by construction. WHAT THE ROW ESTABLISHES is not
    that raising free IGF-1 must cost adult height, but that the ONLY human state of elevated free IGF-1
    available for inspection carries the exact signature this goal must avoid, and that no human data
    exists showing the opposite.'
- parameter: 'THE HUMAN ADULT-HEIGHT TEST OF FREE IGF-I EXISTS AND IT RUNS THE WRONG WAY - higher baseline
    free IGF-I predicted WORSE adult height'
  value: baseline free IGF-I and IGFBP-3 NEGATIVELY correlated with adult height SDS, and free IGF-I also
    negatively correlated with first-year growth response
  unit: direction of regression coefficient against adult height SD score
  conditions: 'bannink2007. 73 short children born small for gestational age in a randomised double-blind
    GH dose-response study (1 or 2 mg/m2/d), baseline mean age 7.7 years, GH for 8.2 years, stopping at
    15.9 years, followed to ADULT HEIGHT. Untreated baseline free IGF-I SDS -0.2 (1.2) and NOT RELATED TO
    TOTAL IGF-I. On GH, free IGF-I rose to 1.6 (0.7) SDS, total to 2.0 (0.8), IGFBP-3 to 1.3 (0.9).
    Multiple regression on adult height SDS: baseline free IGF-I and IGFBP-3 NEGATIVE; baseline bone-age
    delay, target height SDS, baseline height SDS and GH dose POSITIVE. Height SDS gain 1.7 (0.8), adult
    height -1.4 (0.9). The authors conclusion is that free IGF-I is a BETTER predictor of adult height
    than total IGF-I or the total-to-IGFBP-3 ratio.'
  species: human
  source_ref: bannink2007
  uncertainty: 'THIS INVERTS THE DECISION LOGIC I PROPOSED LAST ROUND AND THE INVERSION IS THE USEFUL
    PART. I said a HIGH bioactive IGF-I on the current GH arm would mean the IGF thread is delivering. In
    the only cohort that has measured free IGF-I against ACHIEVED ADULT HEIGHT, high baseline free IGF-I
    predicted a WORSE outcome - both a smaller first-year response and a lower adult height. THE
    MARKER-VERSUS-MEDIATOR DISTINCTION IS EVERYTHING HERE and the study cannot settle it: a short child
    with high bioactive IGF-I is plausibly IGF-RESISTANT, with the defect downstream of the ligand, so
    high free IGF-I marks a phenotype with less headroom rather than causing a worse outcome. Nothing here
    shows that RAISING free IGF-I lowers adult height. WHAT IT DOES ESTABLISH, and this is what the atlas
    needed: free IGF-I is measurable, is NOT related to total IGF-I at baseline, and out-predicts total
    for adult height - so the measurement is worth making, but a high value should be read as a reason to
    CLOSE this thread for a given subject rather than as a green light.'
- parameter: 'WHAT IGF-I ACTUALLY DOES TO THE HYPERTROPHIC CELL IN VIVO - restores height to NORMAL, not
    above, and SHORTENS the hypertrophic phase'
  value: 'hypertrophic phase duration 6 days to 4 (IGF-I) and 2.8 (GH); cell height and volume restored to
    PHYSIOLOGICAL values; matrix volume per cell unchanged in every group'
  unit: days of phase duration; cell height and volume relative to normal
  conditions: 'hunziker1994. Hypophysectomised 35-day-old male Wistar rats, continuous osmotic-minipump
    infusion of IGF-I or GH, analysed by quantitative autoradiography, stereology and incident-light
    fluorescence microscopy stage by stage. Stem cell cycle time 50 days to 15 (IGF-I) and 8 (GH);
    proliferating cell cycle time 11 days to 4.5 and 3; hypertrophic phase 6 days to 4 and 2.8. Mean cell
    volume and cell height were significantly REDUCED by hypophysectomy at proliferative and hypertrophic
    stages and were RESTORED TO PHYSIOLOGICAL VALUES by both hormones. Average matrix volume per cell at
    each stage was similar for normal, hormone-treated and untreated hypophysectomised groups. Cell
    PRODUCTIVITY - volume, height and matrix produced per unit time - did NOT reach normal with either
    hormone and was inversely proportional to cell cycle time or phase duration. IGF-I was less effective
    than GH throughout.'
  species: rat
  source_ref: hunziker1994
  uncertainty: 'THIS IS THE h_term MEASUREMENT UNDER IGF THAT I SAID DID NOT EXIST, AND IT ANSWERS THE
    QUESTION IN THE LEAST HELPFUL WAY AVAILABLE. Cell height WAS restored - so IGF-I does reach the
    parameter this project cares about - but only TO PHYSIOLOGICAL VALUES from a deficient state, never
    above them, which is rescue and not gain and is the same ceiling every other arm of this thread has
    hit. AND THE PHASE DURATION SHORTENED, from 6 days to 4: cells pass through hypertrophy FASTER, which
    is the cellular signature of spending maturation rather than banking it, and it aligns with the human
    obesity data in this node. THE DESIGN LIMITS ARE REAL - hypophysectomised rat is a maximally deficient
    background, so a ceiling at physiological values is exactly what a rescue experiment would produce and
    it cannot exclude headroom in an intact animal. But no experiment has looked for that headroom, and
    this is the closest anyone has come.'
- parameter: 'AND THE SYSTEM DEFENDS ITSELF AGAINST EXOGENOUS IGF-I - GH suppressed by half, and a
    sequestering binding protein induced'
  value: 3-fold rise in serum IGF-I, GH secretion suppressed by about 50 per cent, IGFBP-1 increased
    dramatically
  unit: fold change and per cent suppression
  conditions: 'bach1994. Subcutaneous IGF-I at 20 micrograms/kg/h for 10 hours daily in four diabetic
    adolescents and six pubertal stage-matched controls, against saline. Serum IGF-I rose 3-fold; both
    spontaneous overnight and arginine-stimulated GH secretion fell by about 50 per cent IN BOTH GROUPS;
    IGFBP-1 rose dramatically in diabetics and modestly in controls; IGFBP-3 was not significantly
    altered. Blood glucose remained stable and no hypoglycaemia occurred.'
  species: human
  source_ref: bach1994
  uncertainty: 'A PHARMACOLOGICAL BRAKE ON THIS THREAD THAT IS INDEPENDENT OF EVERY BIOLOGICAL ARGUMENT IN
    IT. Giving IGF-I halves endogenous GH secretion by negative feedback and induces IGFBP-1, which
    sequesters free IGF-I - so the intervention triggers two homeostatic responses that oppose it, one of
    them acting on the very fraction the delivery argument says matters. In a stack that already contains
    a GH arm, adding exogenous IGF-I is therefore partly self-cancelling rather than additive, which is
    the opposite of the COACH result for GH added to a CNP agent. LIMITS: n=4 diabetics and 6 controls,
    adolescents, 10-hour daily infusion rather than chronic replacement, and diabetes distorts the IGF
    axis independently. The GH suppression was seen in BOTH groups, which is what makes it a general
    pharmacological point rather than a diabetes finding.'
- parameter: 'THE PROPERTY WARMING HAS THAT NOTHING ELSE IN THIS ATLAS HAS - the gain was still there at
    skeletal maturity, 49 days after treatment stopped'
  value: 'femur about 1 per cent (paired t=2.20, p=0.040) and tibia about 1 per cent (t=4.02, p=0.005)
    still longer on the treated side at 12 weeks of age'
  unit: per cent difference between treated and contralateral limb, measured after treatment ended
  conditions: 'serrat2015. Treatment ran 14 days post-weaning and then STOPPED; animals were examined 49
    days later at 12 weeks. Ear area was over 6 per cent larger, hindfoot 3.5 per cent longer, tibia 1 per
    cent and femur nearly 1 per cent longer on the heat-treated side, all significant, with the humerus
    unchanged (t=0.18, p=0.431). Untreated controls showed no left-right difference in femoral length, ear
    area, humeral length, hindfoot length or tibial elongation rate.'
  species: mouse
  source_ref: serrat2015
  uncertainty: 'THE PERSISTENCE MEASUREMENT IS WHAT MAKES THIS WORTH RANKING ABOVE ITS EFFECT SIZE. Almost
    every growth intervention in this atlas is reported as a VELOCITY, and velocity is exactly what
    dissociates from adult height when maturation is advanced - the atlas holds that failure mode for
    oestrogen, for obesity, and as the central unresolved question for the CNP arm. Here the treatment was
    withdrawn and the difference was still present at skeletal maturity, in the same animals, against
    their own contralateral limb. THE LIMITS REMAIN EVERYTHING ELSE. It is mouse, it is post-weaning, the
    effect is about 1 per cent, and bone age was not measured directly - persistence of a length
    difference is strong evidence the gain was not reclaimed, but it is not the same as showing the growth
    plate matured no faster. And the whole thread has no human evidence: serrat2013 confines the growth
    response to the rapid phase, and cao2026a fails to replicate the human temperature correlation within
    a single country.'
- parameter: 'THE TEST TO RUN, AND IT IS ALREADY A CLINICAL ASSAY WITH PAEDIATRIC REFERENCE RANGES'
  value: bioactive IGF-I correlates with total IGF-I at r=0.61 in males and r=0.58 in females
  unit: Pearson correlation between bioactive and total IGF-I
  conditions: 'vilmann2026. Kinase receptor activation assay (KIRA) for bioactive IGF-I in a reference
    population of 570 children (59 per cent girls) from the Copenhagen Puberty Study III, plus 126 short
    children with GH deficiency and non-GHD conditions; paediatric sex-specific reference ranges
    established and compared against total IGF-I, the IGF-I/IGFBP-3 molar ratio, and total IGF-I, IGF-II,
    IGFBP-3 and acid-labile subunit by LC-MS/MS in a subgroup. Bioactive IGF-I increased with age in
    healthy children.'
  species: human
  source_ref: vilmann2026
  uncertainty: 'r=0.61 MEANS TOTAL IGF-1 EXPLAINS ABOUT 37 PER CENT OF THE VARIANCE IN THE BIOACTIVE
    FRACTION, and total IGF-1 is what is measured in clinic and what GH dosing is titrated against. That
    is the quantitative form of the delivery argument and it is human. WHAT IT DOES NOT DO IS PROVE THE
    BIOACTIVE FRACTION IS WHAT REACHES THE PLATE - KIRA measures IGF-1R activation in a cell assay from
    serum, which is a proxy for bioavailability in blood, not for partition into cartilage. The two
    arguments are consistent and independent rather than one supporting the other. THE PRACTICAL POINT
    STANDS EITHER WAY: a measurement with a published paediatric reference range exists for the fraction
    this atlas argues matters, it is not the one being used, and it has a decision attached.'
localization:
- 'systemic: where bioactive IGF-I is measured and where total IGF-1 is titrated'
- 'growth plate: where the partition argument applies and where neither thread has a cell-size measurement'
- 'knee and distal limb: the cool compartment warming can reach and the one with reserve in this case'
human_evidence: direct
human_evidence_note: The discriminating evidence on thread 1 is human - two paediatric cohorts and a
  near-adult-height registry. The discriminating evidence on thread 2 is entirely mouse, and the human
  ecogeographic data does not replicate within a single country.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: Thread 1's human evidence comes from obesity, which is a poor instrument for
  isolating free IGF-1; thread 2 has no human evidence at all and its animal data sits inside a
  rapid-growth window a bone-age-16 subject has passed.
confidence: C
claim_grades:
- claim: The local IGF-1 thread should be dropped from the stack.
  grade: B
  basis: 'SIX CONVERGING LINES, and the two decisive ones are human and in vivo respectively. de2026 caps
    the axis at 0.09 SD of adult height per SD of IGF-1 across 1.18 million people, against a stack whose
    GH arm already sits near +2 SDS. machnicki2022 produced the exact state the thread proposed - raised
    LOCAL plate IGF bioavailability with normal serum IGF-I, verified at four levels - and got
    disorganised plates and, per white2023, premature growth cessation. Added to hunziker1994 (cell height
    restored to normal, never above; hypertrophic phase 6 to 4 days), bannink2007 (baseline free IGF-I
    negatively predicts adult height), bach1994 (exogenous IGF-I halves GH and induces IGFBP-1) and
    bilha2025 (normal to tall stature with low IGF-1 and no GH response). GRADED B NOT A because the MR
    instrument is total rather than bioactive IGF-1 and covers normal rather than pharmacological
    variation, and because machnicki2022 manipulates diet rather than IGF directly.'
- claim: The local IGF-1 thread is fully dead as biology.
  grade: X
  basis: NOT THE SAME CLAIM AS DROPPING IT, and this one is not supported. Phase 3 is genuinely
    IGF-dependent (cooper2013), free IGF-I genuinely partitions an order of magnitude better than the
    ternary complex in human cartilage (schneiderman1995), and free bioactive IGF-I genuinely reaches a
    live growth plate within 30 minutes (serrat2017). The biology is real; what is closed is its use as
    an ADDITIONAL ARM for adult height at a late bone age.
- claim: Raising free IGF-1 in humans advances bone age and reduces predicted adult height.
  grade: D
  basis: An inference joining two cohorts that did not measure both variables, in obesity, which
    independently advances bone age through oestrogen and insulin. Predicted adult height is also
    partly bone-age-derived by construction. It is the only human state of elevated free IGF-1 available,
    and it carries the signature this goal must avoid.
- claim: Local warming produces a length gain that survives to skeletal maturity.
  grade: B
  basis: serrat2015 measured 49 days after treatment stopped, at 12 weeks - femur p=0.040 and tibia
    p=0.005 against the contralateral limb, humerus unchanged, untreated controls symmetric. Mouse,
    post-weaning, about 1 per cent, and bone age was not measured directly.
- claim: The temperature thread should be added to the stack now.
  grade: E
  basis: 'NO. There is no human growth endpoint of any design; serrat2013 confines the growth response to
    a rapid phase this subject has passed; cao2026a finds no temperature effect within one country; the
    human unilateral-use literature reports dominant-side asymmetry in bone mass, density and width but
    not LENGTH; and becher2008 means ordinary exercise already produces about half the thermal excursion,
    so there is no separate lever to add. Parked with one trigger - a demonstration that the DELIVERY
    enhancement survives at a mature plate.'
- claim: The temperature thread is fully dead.
  grade: X
  basis: NO, but it is in a different state from thread 1 - it fails for ABSENCE of human evidence rather
    than CONTRARY human evidence. No human warming study exists in any design; the ecogeographic
    correlation does not replicate within China; and serrat2013 confines the growth response to the rapid
    phase. None of that is a negative result on the intervention.
- claim: The next step is to measure bioactive IGF-I in this subject, and a HIGH value closes the thread
    rather than opening it.
  grade: C
  basis: vilmann2026 provides paediatric reference ranges and shows total IGF-1 explains only about a
    third of the variance in the bioactive fraction. bannink2007 supplies the direction against ACHIEVED
    ADULT HEIGHT in 73 GH-treated children - baseline free IGF-I negatively correlated with both adult
    height and first-year response, and out-predicting total. Marker versus mediator is unresolved and the
    likeliest reading is resistance, so the test discriminates without establishing causality.
- claim: IGF-I can raise terminal hypertrophic cell height ABOVE physiological values.
  grade: E
  basis: NOT SHOWN, AND THE ONE EXPERIMENT THAT LOOKED FOUND A CEILING. hunziker1994 restored cell height
    and volume to physiological values in hypophysectomised rats and no further, while SHORTENING the
    hypertrophic phase from 6 days to 4. A rescue design cannot exclude headroom in an intact animal, but
    nobody has looked for it.
- claim: Adding exogenous IGF-I to a stack containing GH would be additive.
  grade: E
  basis: bach1994 - subcutaneous IGF-I suppressed spontaneous and stimulated GH secretion by about 50 per
    cent in both diabetic and control adolescents and induced IGFBP-1, which sequesters the free fraction.
    Two homeostatic responses oppose the intervention, one of them acting on precisely the fraction the
    delivery argument depends on.
- claim: The human knee has enough thermal headroom for the warming thread to be physiologically
    plausible, and ordinary exercise already uses it.
  grade: B
  basis: becher2008 - direct intra-articular probe in six healthy men, resting knee 31.4 degrees C and 60
    minutes of jogging raising it 6.1 degrees, with skiing in cold ambient lowering it. Joint space rather
    than physis, adults with closed plates, n=6, and no growth endpoint.
key_refs:
- ref_id: sun2026
  year: 2026
  type: primary
  one_line_finding: Overweight and obese boys have bone age 12.00 against chronological 10.67 and predicted
    adult height significantly below mid-parental height.
- ref_id: martnrivada2025
  year: 2025
  type: primary
  one_line_finding: The same population carries increased total AND free IGF-I with accelerated growth
    despite reduced pappalysins - high free IGF-1 buys velocity.
- ref_id: vilmann2026
  year: 2026
  type: primary
  one_line_finding: Bioactive IGF-I by KIRA has paediatric reference ranges in 570 healthy children and
    correlates with total IGF-I at only r=0.61 - total is a poor proxy for the fraction that matters.
- ref_id: ramonkrauel2026
  year: 2026
  type: primary
  one_line_finding: The only adult-height data for giving IGF-1 - 0.9 SDS gain to near-adult height in
    severe primary IGF-I deficiency, 1.4 SDS in treatment-naive prepubertal patients.
- ref_id: serrat2015
  year: 2015
  type: primary
  one_line_finding: The heat-induced length difference was still present 49 days after treatment stopped,
    at skeletal maturity - the gain was not reclaimed.
- ref_id: cao2026a
  year: 2026
  type: primary
  one_line_finding: Within China, precipitation rather than temperature is the strongest climatic
    correlate of body form and the colder north is taller - the human temperature correlation does not
    replicate.
