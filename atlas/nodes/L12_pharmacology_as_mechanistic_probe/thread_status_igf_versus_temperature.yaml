id: thread_status_igf_versus_temperature
name: Are the two live threads dead or alive - the discriminator turns out to be whether each SPENDS BONE AGE, and on that test they separate cleanly
aliases:
- is local IGF-1 dead
- is temperature dead
- what to go after next
- the bone age discriminator
type: hypothesis
layer: L12
stub: false
summary: 'THE INSTRUCTION WAS TO GO AFTER ONE THING AT A TIME AND CLOSE A THREAD ONLY WHEN IT IS ACTUALLY
  DEAD. This node audits the two live threads against the goal - MAXIMISE ADULT HEIGHT AT BONE AGE 16 WITH
  SPINE AND KNEE RESERVE - and finds a discriminator that had not been applied to either: DOES THE
  INTERVENTION SPEND BONE AGE. This project has held since round 1 that velocity gained without maturation
  converts to adult height and velocity gained with maturation does not. Applied to these two threads it
  separates them, and not in the direction I expected.
  THREAD 1, LOCAL IGF-1: NOT DEAD, BUT THE HUMAN EVIDENCE POINTS AT THE FAILURE MODE. Three components of
  it died on inspection - the IGFBP-restraint expression argument (CORR-104), the STC2 localisation
  (CORR-103), and the wild-type body-length claim for rhPAPP-A2 (CORR-108). What survives is real:
  cooper2013 phase 3 is IGF-dependent by genetic test; schneiderman1995 measures free IGF-I partitioning
  an order of magnitude better than the ternary complex in human cartilage; serrat2017 shows free
  bioactive IGF-I reaching a live growth plate within 30 minutes; harboe2024 shortens the mouse femur 7
  per cent by deleting PAPP-A; and rhPAPP-A2 shifts limb-to-trunk proportions in wild-type mice at
  p<0.001. BUT THE HUMAN NATURAL EXPERIMENT FOR RAISING FREE IGF-1 IS CHILDHOOD OBESITY, AND IT IS THE
  WRONG ANSWER. martnrivada2025 shows those children have INCREASED total and FREE IGF-I with accelerated
  growth and height z-score +1.28; sun2026 shows the same population has BONE AGE 12.00 AGAINST
  CHRONOLOGICAL 10.67 and PREDICTED ADULT HEIGHT SIGNIFICANTLY BELOW MID-PARENTAL HEIGHT (-0.28 against
  +0.10, p<0.001), with predicted-adult-height impairment in 22.6 per cent. High free IGF-1 in humans buys
  velocity and spends maturation. That is precisely the trade this goal cannot use.
  THREAD 2, LOCAL WARMING: THE ONE PROPERTY THIS GOAL NEEDS IS THE ONE PROPERTY IT HAS. serrat2015 killed
  the treatment after 14 days and measured the animals 49 DAYS LATER AT SKELETAL MATURITY - femur about 1
  per cent and tibia about 1 per cent STILL longer on the treated side, with the contralateral limb as
  control and no asymmetry in untreated animals. The gain was not reclaimed. That is the bone-age question
  answered in the right direction, and no other intervention in this atlas has answered it by measuring
  at maturity. AGAINST IT: no human study of warming exists in any design, the human ecogeographic
  correlation is confounded and does not replicate within China (cao2026a), and serrat2013 confines the
  growth response to the rapid phase, which a bone-age-16 subject is past.
  SO NEITHER IS DEAD AND THEY FAIL DIFFERENTLY. Thread 1 has human data, a clinical assay and an approved
  drug, and the human data says it spends bone age. Thread 2 has no human data at all, and the animal
  data says it does not spend bone age. A thread that fails because the evidence is ABSENT is in a
  different state from a thread that fails because the evidence is CONTRARY, and only the second is on
  its way to being closed.
  WHAT TO DO NEXT, AND IT IS A MEASUREMENT RATHER THAN A DRUG. vilmann2026 established paediatric
  sex-specific reference ranges for BIOACTIVE IGF-I by kinase receptor activation assay in 570 healthy
  children, and found bioactive IGF-I correlates with TOTAL IGF-I at only r=0.61 in males and r=0.58 in
  females. TOTAL IGF-1 THEREFORE EXPLAINS ABOUT A THIRD OF THE VARIANCE IN THE FRACTION THAT CAN ACTUALLY
  ENTER A GROWTH PLATE, and total IGF-1 is what is measured clinically and what GH dosing is titrated
  against. Measuring bioactive IGF-I in this subject is cheap, has a published reference range, and
  discriminates: if it is high on the current GH arm, the IGF thread is delivering and adding a
  bioavailability agent is redundant; if it is low or mid-range despite GH, the delivery argument is live
  and PAPP-A2 becomes a real candidate rather than a mouse proportion result. Either way the answer
  changes what is done next, which is the property this atlas requires of a test.'
quantitative:
- parameter: 'THE DISCRIMINATOR - raising free IGF-1 in humans advances bone age and LOWERS predicted
    adult height'
  value: 'bone age 12.00 (IQR 11.00-13.00) against chronological 10.67 (IQR 9.50-12.00), p<0.001; predicted
    adult height -0.28 +/- 0.81 against mid-parental +0.10 +/- 0.60, p<0.001'
  unit: years of bone age; SD score of predicted adult height
  conditions: 'sun2026 - 130 Chinese boys aged 5-15, overweight (n=43) or obese (n=87), cross-sectional;
    bone age advancement in 52.3 per cent (67/128) and predicted-adult-height impairment in 22.6 per cent.
    Read together with martnrivada2025 - 150 prepubertal children with severe obesity against 206 matched
    controls, showing DECREASED PAPP-A, PAPP-A2 and STC2 but INCREASED total AND FREE IGF-I, accelerated
    growth and height z-score +1.28 +/- 1.04. So the same population that carries elevated free IGF-I and
    grows fast is the population whose bone age runs ahead and whose predicted adult height falls below
    target.'
  species: human
  source_ref: sun2026
  uncertainty: 'THESE ARE TWO SEPARATE COHORTS JOINED BY THIS ATLAS AND THAT JOIN IS THE WEAK POINT.
    martnrivada2025 measured free IGF-I and growth; sun2026 measured bone age and predicted adult height;
    neither measured both in the same children, so the chain "high free IGF-1 therefore advanced bone age
    therefore lower adult height" is an inference across cohorts and is graded accordingly. OBESITY IS
    ALSO A TERRIBLE INSTRUMENT for isolating free IGF-1, because it simultaneously raises aromatase
    activity and oestrogen, raises insulin and leptin, and alters the GH axis - any of which advances bone
    age independently of IGF bioavailability. AND PREDICTED adult height is a prediction, not an outcome;
    Bayley-Pinneau and similar methods are themselves bone-age-based, so a cohort with advanced bone age
    is partly guaranteed to show reduced predicted height by construction. WHAT THE ROW ESTABLISHES is not
    that raising free IGF-1 must cost adult height, but that the ONLY human state of elevated free IGF-1
    available for inspection carries the exact signature this goal must avoid, and that no human data
    exists showing the opposite.'
- parameter: 'THE PROPERTY WARMING HAS THAT NOTHING ELSE IN THIS ATLAS HAS - the gain was still there at
    skeletal maturity, 49 days after treatment stopped'
  value: 'femur about 1 per cent (paired t=2.20, p=0.040) and tibia about 1 per cent (t=4.02, p=0.005)
    still longer on the treated side at 12 weeks of age'
  unit: per cent difference between treated and contralateral limb, measured after treatment ended
  conditions: 'serrat2015. Treatment ran 14 days post-weaning and then STOPPED; animals were examined 49
    days later at 12 weeks. Ear area was over 6 per cent larger, hindfoot 3.5 per cent longer, tibia 1 per
    cent and femur nearly 1 per cent longer on the heat-treated side, all significant, with the humerus
    unchanged (t=0.18, p=0.431). Untreated controls showed no left-right difference in femoral length, ear
    area, humeral length, hindfoot length or tibial elongation rate.'
  species: mouse
  source_ref: serrat2015
  uncertainty: 'THE PERSISTENCE MEASUREMENT IS WHAT MAKES THIS WORTH RANKING ABOVE ITS EFFECT SIZE. Almost
    every growth intervention in this atlas is reported as a VELOCITY, and velocity is exactly what
    dissociates from adult height when maturation is advanced - the atlas holds that failure mode for
    oestrogen, for obesity, and as the central unresolved question for the CNP arm. Here the treatment was
    withdrawn and the difference was still present at skeletal maturity, in the same animals, against
    their own contralateral limb. THE LIMITS REMAIN EVERYTHING ELSE. It is mouse, it is post-weaning, the
    effect is about 1 per cent, and bone age was not measured directly - persistence of a length
    difference is strong evidence the gain was not reclaimed, but it is not the same as showing the growth
    plate matured no faster. And the whole thread has no human evidence: serrat2013 confines the growth
    response to the rapid phase, and cao2026a fails to replicate the human temperature correlation within
    a single country.'
- parameter: 'THE TEST TO RUN, AND IT IS ALREADY A CLINICAL ASSAY WITH PAEDIATRIC REFERENCE RANGES'
  value: bioactive IGF-I correlates with total IGF-I at r=0.61 in males and r=0.58 in females
  unit: Pearson correlation between bioactive and total IGF-I
  conditions: 'vilmann2026. Kinase receptor activation assay (KIRA) for bioactive IGF-I in a reference
    population of 570 children (59 per cent girls) from the Copenhagen Puberty Study III, plus 126 short
    children with GH deficiency and non-GHD conditions; paediatric sex-specific reference ranges
    established and compared against total IGF-I, the IGF-I/IGFBP-3 molar ratio, and total IGF-I, IGF-II,
    IGFBP-3 and acid-labile subunit by LC-MS/MS in a subgroup. Bioactive IGF-I increased with age in
    healthy children.'
  species: human
  source_ref: vilmann2026
  uncertainty: 'r=0.61 MEANS TOTAL IGF-1 EXPLAINS ABOUT 37 PER CENT OF THE VARIANCE IN THE BIOACTIVE
    FRACTION, and total IGF-1 is what is measured in clinic and what GH dosing is titrated against. That
    is the quantitative form of the delivery argument and it is human. WHAT IT DOES NOT DO IS PROVE THE
    BIOACTIVE FRACTION IS WHAT REACHES THE PLATE - KIRA measures IGF-1R activation in a cell assay from
    serum, which is a proxy for bioavailability in blood, not for partition into cartilage. The two
    arguments are consistent and independent rather than one supporting the other. THE PRACTICAL POINT
    STANDS EITHER WAY: a measurement with a published paediatric reference range exists for the fraction
    this atlas argues matters, it is not the one being used, and it has a decision attached.'
localization:
- 'systemic: where bioactive IGF-I is measured and where total IGF-1 is titrated'
- 'growth plate: where the partition argument applies and where neither thread has a cell-size measurement'
- 'knee and distal limb: the cool compartment warming can reach and the one with reserve in this case'
human_evidence: direct
human_evidence_note: The discriminating evidence on thread 1 is human - two paediatric cohorts and a
  near-adult-height registry. The discriminating evidence on thread 2 is entirely mouse, and the human
  ecogeographic data does not replicate within a single country.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: Thread 1's human evidence comes from obesity, which is a poor instrument for
  isolating free IGF-1; thread 2 has no human evidence at all and its animal data sits inside a
  rapid-growth window a bone-age-16 subject has passed.
confidence: C
claim_grades:
- claim: The local IGF-1 thread is fully dead.
  grade: X
  basis: NO. Three components died (CORR-103, CORR-104, CORR-108) but the core survives - phase 3 is
    IGF-dependent by genetic test, free IGF-I partitions an order of magnitude better than complexed IGF-I
    in human cartilage, and free bioactive IGF-I reaches a live growth plate within 30 minutes. What has
    changed is that the human evidence for RAISING it now points at advanced maturation rather than added
    adult height.
- claim: Raising free IGF-1 in humans advances bone age and reduces predicted adult height.
  grade: D
  basis: An inference joining two cohorts that did not measure both variables, in obesity, which
    independently advances bone age through oestrogen and insulin. Predicted adult height is also
    partly bone-age-derived by construction. It is the only human state of elevated free IGF-1 available,
    and it carries the signature this goal must avoid.
- claim: Local warming produces a length gain that survives to skeletal maturity.
  grade: B
  basis: serrat2015 measured 49 days after treatment stopped, at 12 weeks - femur p=0.040 and tibia
    p=0.005 against the contralateral limb, humerus unchanged, untreated controls symmetric. Mouse,
    post-weaning, about 1 per cent, and bone age was not measured directly.
- claim: The temperature thread is fully dead.
  grade: X
  basis: NO, but it is in a different state from thread 1 - it fails for ABSENCE of human evidence rather
    than CONTRARY human evidence. No human warming study exists in any design; the ecogeographic
    correlation does not replicate within China; and serrat2013 confines the growth response to the rapid
    phase. None of that is a negative result on the intervention.
- claim: The next step is to measure bioactive IGF-I in this subject.
  grade: C
  basis: vilmann2026 provides paediatric sex-specific reference ranges and shows total IGF-1 explains only
    about a third of the variance in the bioactive fraction, while total is what clinical GH dosing is
    titrated against. The test is cheap, published, and has a decision attached in both directions. It
    does not measure cartilage partition, which remains unmeasured in any species.
key_refs:
- ref_id: sun2026
  year: 2026
  type: primary
  one_line_finding: Overweight and obese boys have bone age 12.00 against chronological 10.67 and predicted
    adult height significantly below mid-parental height.
- ref_id: martnrivada2025
  year: 2025
  type: primary
  one_line_finding: The same population carries increased total AND free IGF-I with accelerated growth
    despite reduced pappalysins - high free IGF-1 buys velocity.
- ref_id: vilmann2026
  year: 2026
  type: primary
  one_line_finding: Bioactive IGF-I by KIRA has paediatric reference ranges in 570 healthy children and
    correlates with total IGF-I at only r=0.61 - total is a poor proxy for the fraction that matters.
- ref_id: ramonkrauel2026
  year: 2026
  type: primary
  one_line_finding: The only adult-height data for giving IGF-1 - 0.9 SDS gain to near-adult height in
    severe primary IGF-I deficiency, 1.4 SDS in treatment-naive prepubertal patients.
- ref_id: serrat2015
  year: 2015
  type: primary
  one_line_finding: The heat-induced length difference was still present 49 days after treatment stopped,
    at skeletal maturity - the gain was not reclaimed.
- ref_id: cao2026a
  year: 2026
  type: primary
  one_line_finding: Within China, precipitation rather than temperature is the strongest climatic
    correlate of body form and the colder north is taller - the human temperature correlation does not
    replicate.
