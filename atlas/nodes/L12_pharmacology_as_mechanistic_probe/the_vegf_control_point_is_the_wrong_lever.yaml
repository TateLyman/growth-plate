contradicts:
- 'UNDERCUTS THE PROPOSED MECHANISM of resveratrol_delays_fusion_the_untouched_compound without
  withdrawing its length result. That node records a real caliper-measured length gain; this node records
  that the VEGF explanation offered for it is the signature of a phenotype that IMPAIRS bone formation.
  Both stand: the effect may be real and the mechanism wrong.'
