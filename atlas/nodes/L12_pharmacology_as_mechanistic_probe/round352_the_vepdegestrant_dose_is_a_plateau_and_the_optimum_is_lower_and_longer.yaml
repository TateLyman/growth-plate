id: round352_the_vepdegestrant_dose_is_a_plateau_and_the_optimum_is_lower_and_longer
name: 'Round 352 - the FDA label and multidiscipline review pulled and read: the 200 mg dose sits on a
  degradation plateau that starts at or below 30 mg, degradation depth tracks TIME not dose, the theoretical
  optimum for this indication is 100 mg with a consistent fatty meal for as long as possible - and three new
  objections appear, the worst of which is that vepdegestrant raises erdafitinib exposure'
aliases:
- vepdegestrant optimal dose
- ER degradation plateau 30 to 500 mg
- hook effect
- vepdegestrant CYP3A and P-gp inhibition
- ARV-473 antagonist metabolite
- the dose is lower and longer
type: intervention
layer: L12
stub: false
summary: 'R351 proposed vepdegestrant at the label dose. The operator asked what the THEORETICAL optimum is
  rather than the given one. The FDA label (NDA 219835) and the 298-page multidiscipline review were retrieved
  from Drugs@FDA using R350s recipe and read. THE ANSWER IS THAT THE LABEL DOSE IS NOT AN OPTIMUM, IT IS A
  POINT ON A PLATEAU, AND FOR THIS INDICATION THE OPTIMUM IS LOWER AND LONGER.

  ONE - THE DEGRADATION PLATEAU STARTS AT OR BELOW 30 mg. In the first-in-human study, ER protein in tumour
  biopsies fell a median 69% from baseline after one 28-day cycle ACROSS DAILY DOSES OF 30 mg TO 500 mg -
  reported as a SINGLE POOLED MEDIAN over a 16.7-fold dose range, with no dose-dependence stated anywhere.
  That is what a flat curve looks like in a regulatory document. Independently, the review records that daily
  doses of 60 mg OR MORE already produced steady-state exposures exceeding those associated with tumour
  regression in preclinical models. And the dose escalation went to 700 mg with no further increase in
  exposure.

  TWO - AND THE DOSE WAS NOT CHOSEN FOR POTENCY. In the reviews own words, dose selection rested on the
  totality of biologic evidence with NO NOTABLE DIFFERENCES OBSERVED WITH HIGHER DOSES, including clinical
  efficacy, ER degradation, or safety - EXCEPT for an apparent higher risk for potential QTc at 500 mg. The
  comparison that produced 200 mg was 200 versus 500, both carried into expansion cohorts; the doses BELOW
  200 were on the same plateau and were simply not carried forward. Exposure-response analysis found NO
  statistically significant relationship between exposure and PFS, and NO statistically significant
  relationship between exposure and any of grade 3+ adverse events, arthralgia, fatigue, nausea, anaemia,
  transaminase rise or neutropenia across 30 to 500 mg. Flat for benefit, flat for harm, over sixteen-fold.

  THREE - WHAT ACTUALLY DEEPENS THE DEGRADATION IS TIME. At a CONSTANT 200 mg in the neoadjuvant study, ER
  protein fell 76% at 14 days and 94% at approximately 5.5 months. The dose did not change; the depth almost
  doubled its distance to zero. FOR A SUBJECT WHOSE OBJECTIVE IS MAXIMUM PROTEIN ABSENCE, THE VARIABLE TO
  MAXIMISE IS DURATION, NOT MILLIGRAMS - which inverts the usual instinct and means the right dose is the one
  he is most likely to still be taking in six months.

  FOUR - AND FOR A PROTAC, MORE IS NOT MERELY WASTEFUL, IT CAN BE WORSE. The FDA assigned vepdegestrant a new
  Established Pharmacologic Class, heterobifunctional protein degrader, specifically so that prescribers
  recognise class effects including off-target degradation, bystander degradation, and THE HOOK EFFECT -
  which the review defines in terms as reduced activity at high concentrations due to formation of binary
  rather than ternary complexes. A degrader needs the target and the E3 ligase in one complex; saturating
  either binding site separately breaks it. This is the mechanistic reason the dose-response for a degrader
  is bell-shaped rather than monotonic, and it is why the oncology reflex of pushing toward the MTD is the
  wrong reflex here.

  FIVE - SO THE THEORETICAL OPTIMUM, DERIVED RATHER THAN QUOTED. The objective here is not tumour control
  over weeks but maximal ERalpha protein absence sustained over months in a growing male, with the smallest
  possible burden of QTc, off-target degradation and drug interaction. Given a degradation plateau extending
  down to at least 30 mg, an exposure threshold satisfied at 60 mg, flat exposure-response for both benefit
  and harm, depth governed by time, and a hook effect above the plateau, THE OPTIMUM IS THE LOWEST EXPOSURE
  THAT REMAINS ON THE PLATEAU, SUSTAINED FOR THE LONGEST TIME. That is 100 mg once daily with food - an
  approved strength and the approved dose-reduction step - rather than 200 mg. Halving the dose halves the
  concentration driving QTc, halves the off-target and bystander degradation burden, halves the perpetrator
  effect on the rest of the stack, and by every measure in this application costs nothing in degradation.

  SIX - AND THE MEAL IS A THREE-FOLD DOSE LEVER THAT NOBODY THINKS OF AS ONE. A high-fat meal raises AUC
  2.9-fold and Cmax 3.2-fold. So 100 mg taken with a substantial fatty meal delivers exposure of the same
  order as a much larger dose taken lightly, and - more important for a QTc-prolonging drug taken for months -
  INCONSISTENT MEALS ARE A THREE-FOLD EXPOSURE SWING. The instruction that actually matters is not the number
  of milligrams but taking it at the same time each day with a similar fat load.

  SEVEN - THREE NEW OBJECTIONS THAT R351 DID NOT HAVE, AND THE FIRST IS THE SERIOUS ONE.
  (a) VEPDEGESTRANT IS A CYP3A INHIBITOR AND A P-gp INHIBITOR. Midazolam AUC rose 1.7-fold and dabigatran
  etexilate AUC rose 2.0-fold with Cmax 1.9-fold on vepdegestrant 200 mg. R351 recorded the reverse
  interaction direction as untested; IT IS NOW MEASURED AND IT RUNS AGAINST US. Erdafitinib is cleared about
  20% by CYP3A4 and is a P-gp substrate, so vepdegestrant is expected to RAISE erdafitinib exposure by both
  routes. This atlas already holds erdafitinibs paediatric record of five of five cases permanently
  discontinued with three requiring surgery. Raising its exposure is not a theoretical concern, and this is
  now the single biggest practical objection to the combination. It is also a direct argument for the lower
  dose.
  (b) A THIRD OF THE CIRCULATING DRUG-RELATED MATERIAL IS A PURE ANTAGONIST. The metabolite ARV-473 retains
  ER antagonist activity but has NO ER-degrading activity, at 34% of parent exposure. That is a fulvestrant-
  like species - the exact class R338 showed is null at the growth plate - occupying the same receptor the
  degrader must engage. Nobody has raised it, and it means the effective degrader fraction is lower than
  total exposure implies.
  (c) QTc. The largest mean increase is 12 ms with an upper confidence bound of 15 ms at 200 mg, the risk was
  apparently higher at 500 mg, and the pivotal trial excluded concurrent QT-prolonging drugs. Over years
  rather than months, in a subject on several agents, this is a real constraint and another argument for 100 mg.

  EIGHT - ONE GENUINELY FAVOURABLE FINDING THAT ONLY THE REVIEW SHOWS. The target-organ toxicity of this drug
  is overwhelmingly FEMALE REPRODUCTIVE - ovary, uterus, cervix, vagina and mammary gland, with the female
  LOAEL at the LOWEST dose tested in the 6-month rat study (30 mg/kg/day) and both dog studies (15 and
  10 mg/kg/day). In the same studies THE MALE NOAEL WAS THE HIGHEST DOSE TESTED - 300 mg/kg/day in rats and
  90 mg/kg/day in dogs. In a male subject, the principal toxicity of the molecule is largely not applicable.
  A caveat recorded rather than resolved: the reviews executive summary states that adverse changes in male
  reproductive organs in dogs did NOT recover after a four-week recovery period, which sits awkwardly against
  the individual dog study tables setting the male NOAEL at the top dose with findings fully or partially
  recovered. The discrepancy is in the document.

  NINE - AND THE COSTS THAT SCALE WITH DURATION, WHICH IS AWKWARD BECAUSE DURATION IS WHAT WE WANT TO
  MAXIMISE. Toxicities emerging only in studies of three months or longer included adrenal gland weight
  decrease with zona fasciculata atrophy in rats, PITUITARY changes (decreased weight in rats, hypertrophy in
  dogs), kidney and liver weight changes, and increased bone marrow haematopoietic cells in dogs. The
  pituitary finding deserves naming in a subject whose stack contains growth hormone. Recovery was assessed
  only in the 28-day studies and not in the longer ones.

  TEN - THE DELIVERY QUESTION IS STILL OPEN AND THE REVIEW MAKES IT SHARPER, NOT SOFTER. Whole-body
  autoradiography in rats put the highest distribution in liver, ovaries, kidneys, thyroid, spleen and
  melanin-containing tissues. BONE AND CARTILAGE ARE NOT NAMED. Plasma protein binding exceeds 99% in every
  species tested. Against that, the apparent volume of distribution is 764 L, so the molecule does leave
  plasma extensively. R315s delivery wall for avascular cartilage has never been addressed for this molecule,
  and the growth plate is the tissue the entire proposal depends on reaching.

  ELEVEN - AND A NOVEL PREDICTED INTERACTION BETWEEN THE TWO THINGS THIS FILE IS PROPOSING AT ONCE.
  Vepdegestrant is metabolised PRIMARILY BY DIRECT SULFATION via multiple SULT isoforms. The other proposed
  addition is ORAL SODIUM SULFATE, whose entire rationale is raising the inorganic sulfate pool that feeds
  PAPS, the universal sulfate donor for SULT. Supplying sulfate could therefore INCREASE vepdegestrant
  clearance and lower its exposure; conversely paracetamol, which R321 showed drops serum sulfate 24% per
  1.5 g dose, could raise it. Grade E and entirely inferential - no study has varied sulfate availability and
  measured a SULT-cleared drugs exposure in this way - but it is specific, it is testable, and it means the
  two proposed additions should not be started on the same day.'
quantitative:
- parameter: 'THE DEGRADATION PLATEAU AND WHY 200 mg WAS CHOSEN - THE DOSE IS NOT AN OPTIMUM'
  value: 'ER protein in tumour biopsies fell a MEDIAN 69% from baseline after approximately one 28-day cycle
    across daily monotherapy doses of 30 mg TO 500 mg, reported as one pooled median with no dose-dependence
    stated. Daily doses >=60 mg produced steady-state AUC24 on C1D15 exceeding exposures associated with
    tumour regression in preclinical models. Dose escalation covered 30, 60, 100, 120, 180, 200, 360, 500 and
    700 mg with no further increase in exposure at 700 mg. Two RP2Ds, 200 mg and 500 mg, were carried into
    expansion (n=35 and n=36); objective response rates were low and comparable. Dose selection is stated to
    rest on no notable differences with higher doses in efficacy, ER degradation or safety EXCEPT an apparent
    higher QTc risk at 500 mg. Exposure-response was NOT statistically significant for PFS, and NOT
    significant across 30-500 mg for grade 3+ TEAEs, arthralgia, fatigue, nausea, anaemia, AST/ALT rise or
    neutropenia. DEPTH TRACKS TIME AT CONSTANT DOSE: at 200 mg, -76% median ER at 14 days and -94% at
    approximately 5.5 months'
  unit: per cent change in ER protein; mg/day
  conditions: fda_veppanu_mdr_2026, 298-page multidiscipline review retrieved from Drugs@FDA and read
    2026-08-13; biopsy data from studies ARV-471-mBC-101 and ARV-471-BC-201.
  species: human
  source_ref: fda_veppanu_mdr_2026
  uncertainty: 'THE PLATEAU IS INFERRED FROM A POOLED MEDIAN, NOT FROM A PUBLISHED DOSE-RESPONSE CURVE. The
    review reports one figure for 30-500 mg; it does not state that degradation was equal at each dose, and
    the per-dose biopsy numbers are small and not given. The two comparisons that ARE explicit are 200 versus
    500 mg, so the evidence that 100 mg equals 200 mg on degradation is indirect. The time-deepening
    comparison is across two DIFFERENT studies and different patient populations - 14 days in the neoadjuvant
    setting versus 5.5 months - not a within-patient time course, so the -76 to -94% progression is
    suggestive rather than established. And all of it is TUMOUR tissue, not growth plate.'
- parameter: 'PHARMACOKINETICS, THE FOOD LEVER, AND WHY BODY WEIGHT DOES NOT MATTER'
  value: 'At the approved 200 mg once daily with food: Cmax 926 ng/mL (CV 39%), AUC 17,155 ng.h/mL (36%).
    AUC and Cmax increase approximately DOSE PROPORTIONALLY from 100 mg to 500 mg. Accumulation 1.4-fold AUC
    and 1.3-fold Cmax; steady state in approximately 7 days; Tmax 6 hours (range 4-8); effective half-life
    19 hours (50%); apparent oral clearance 12 L/h; apparent volume of distribution 764 L; plasma protein
    binding >99%. FOOD: a high-fat meal (800-1000 kcal, >=50% fat) raises AUC 2.9-FOLD and Cmax 3.2-FOLD.
    Metabolism is primarily DIRECT SULFATION via multiple SULT isoforms plus oxidation by CYP3A4 and to a
    lesser extent CYP2C8, CYP2C9 and CYP3A5; unchanged drug is 92% of plasma radioactivity. Excretion 68%
    faecal (18% unchanged), 1.5% urinary. NO clinically significant PK differences by age (26-89), sex, race,
    or BODY WEIGHT ACROSS 37 TO 181 kg'
  unit: ng/mL; ng.h/mL; hours; L; fold
  conditions: fda_veppanu_label_2026 section 12.3 and fda_veppanu_mdr_2026 population PK analysis, read
    2026-08-13.
  species: human
  source_ref: fda_veppanu_label_2026
  uncertainty: 'THE WEIGHT-INDEPENDENCE IS THE MOST USEFUL SINGLE FACT FOR AN ADOLESCENT AND IT IS STILL AN
    EXTRAPOLATION: 37 kg is the lower bound of an ADULT oncology population, and no one under 18 was studied.
    Body weight not affecting adult PK does not establish that a 16-year-old clears the drug identically,
    although it makes flat dosing far more defensible than allometric guessing. The food effect is measured
    with a defined high-fat meal; ordinary meals lie somewhere below it, so real-world exposure sits between
    the fasted and high-fat extremes and is not precisely controllable.'
- parameter: 'THE PERPETRATOR PROFILE - VEPDEGESTRANT RAISES CYP3A AND P-gp SUBSTRATES, WHICH INCLUDES ERDAFITINIB'
  value: 'VEPDEGESTRANT AS PERPETRATOR at 200 mg once daily: midazolam (CYP3A substrate) AUC increased
    1.7-fold and Cmax 1.2-fold; dabigatran etexilate (P-gp substrate) AUC increased 2.0-fold and Cmax
    1.9-fold. VEPDEGESTRANT AS VICTIM: itraconazole (strong CYP3A inhibitor) raised AUC 1.7-fold and Cmax
    1.5-fold; carbamazepine (strong CYP3A inducer) reduced AUC to 64% and Cmax to 80%; esomeprazole
    (proton-pump inhibitor) reduced AUC to 84% and Cmax to 74%. CARDIAC: largest mean QTc increase 12 ms,
    upper confidence interval 15 ms, at 200 mg once daily; the review notes an apparently higher QTc risk at
    500 mg and the pivotal trial excluded concurrent QT-prolonging drugs'
  unit: fold change in AUC and Cmax; milliseconds
  conditions: fda_veppanu_label_2026 sections 7 and 12.3, read 2026-08-13.
  species: human
  source_ref: fda_veppanu_label_2026
  uncertainty: 'THE ERDAFITINIB PREDICTION IS MINE AND IS NOT MEASURED. Erdafitinib is reported in this atlas
    as cleared 39% by CYP2C9 and 20% by CYP3A4; vepdegestrant inhibits CYP3A and P-gp but its effect on CYP2C9
    is not characterised in the label. A 1.7-fold rise in a probe substrate does NOT translate to a 1.7-fold
    rise in erdafitinib, because only about a fifth of erdafitinib clearance runs through CYP3A4 - the
    expected effect is materially smaller and could be modest. But the direction is unambiguous and additive
    across two mechanisms, and the consequence of raising erdafitinib exposure in an adolescent is recorded in
    this atlas as five of five permanent discontinuations. This has not been modelled and should be before any
    co-administration.'
- parameter: 'NONCLINICAL - THE TOXICITY IS FEMALE-REPRODUCTIVE, AND THERE IS NO SKELETAL OR JUVENILE DATA AT ALL'
  value: 'Repeat-dose toxicity: adverse findings concentrated in FEMALE reproductive organs - decreased corpora
    lutea, follicle haemorrhage and granulosa cell hyperplasia in ovary, and atrophy of uterus, oviduct, cervix
    and vagina at doses >=30 mg/kg/day. 6-month rat study: male NOAEL the HIGHEST DOSE TESTED, 300 mg/kg/day;
    female LOAEL the LOWEST DOSE TESTED, 30 mg/kg/day. 1-month dog study: male NOAEL the highest dose tested,
    90 mg/kg/day; female LOAEL 15 mg/kg/day. 3-month dog study: male NOAEL the highest dose tested,
    90 mg/kg/day; female LOAEL 10 mg/kg/day. Toxicities emerging only at 3 months or longer: adrenal weight
    decrease with zona fasciculata atrophy (rat), PITUITARY weight decrease (rat) and hypertrophy (dog),
    kidney and liver weight changes, increased bone marrow haematopoietic cells (dog). Not mutagenic in Ames,
    not clastogenic in vitro or in vivo. Rat whole-body autoradiography: highest distribution in liver,
    ovaries, kidneys, thyroid, spleen and melanin-containing tissues. ACROSS 298 PAGES THERE IS NO JUVENILE
    TOXICITY STUDY AND THE WORDS GROWTH PLATE, PHYSIS AND EPIPHYSIS DO NOT APPEAR'
  unit: mg/kg/day
  conditions: fda_veppanu_mdr_2026 nonclinical sections, read 2026-08-13.
  species: multiple
  source_ref: fda_veppanu_mdr_2026
  uncertainty: 'THE MALE-VERSUS-FEMALE ASYMMETRY IS THE MOST FAVOURABLE THING IN THE APPLICATION FOR A MALE
    SUBJECT AND IT CARRIES ONE INTERNAL CONTRADICTION: the executive summary states that adverse changes in
    MALE reproductive organs in dogs did not recover after a four-week recovery period, while the individual
    dog study tables set the male NOAEL at the highest dose tested with findings fully or partially recovered.
    I cannot resolve that from this document and record it as it stands. Separately, absence of juvenile and
    skeletal data is exactly what CORR-350 predicts for a drug with no paediatric programme - it is a GAP
    under R302 rather than reassurance, and it means the effect of this molecule on a growing skeleton is
    unmeasured in every species.'
localization:
- 'rat whole-body autoradiography places the highest tissue distribution in liver, ovaries, kidneys, thyroid,
  spleen and melanin-containing tissues; bone and cartilage are not named, and penetration of avascular
  growth-plate cartilage by a >99% protein-bound heterobifunctional degrader is unmeasured'
human_evidence: direct
human_evidence_note: 'All pharmacokinetic, degradation, exposure-response, interaction and QTc data are human,
  from the registrational programme. What is entirely absent in humans is any growth, skeletal or paediatric
  data, and no PROTAC has been given to a growing human.'
species_basis:
- human
- rat
- dog
translation_risk: high
translation_risk_reason: 'The dose recommendation is derived from human oncology degradation data in tumour
  tissue and extrapolated to a growth plate that no study in the application examined, in an age group that no
  study enrolled.'
confidence: B
claim_grades:
- claim: The 200 mg dose sits on a plateau rather than at an optimum, and was selected against 500 mg on QTc.
  grade: A
  basis: 'Stated directly in the multidiscipline review: ER degradation reported as one pooled median across
    30-500 mg; doses >=60 mg already exceeding preclinically efficacious exposure; dose selection resting on
    no notable differences with higher doses except an apparent higher QTc risk at 500 mg; and
    exposure-response not significant for either efficacy or safety across 30-500 mg.'
- claim: For this indication the optimal dose is 100 mg once daily with a consistent fatty meal, not 200 mg.
  grade: C
  basis: 'Derived, not quoted. It follows from a degradation plateau reaching down to at least 30 mg, an
    exposure threshold met at 60 mg, flat exposure-response for benefit and harm, depth of degradation
    tracking time rather than dose, a named hook effect above the plateau, and three dose-proportional
    liabilities (QTc, CYP3A/P-gp perpetration, off-target degradation) that halve with the dose. Graded C
    because the plateau below 200 mg is inferred from a pooled median rather than demonstrated per dose, and
    because the objective being optimised - ERalpha absence in a growth plate - was never measured.'
- claim: Depth of ER degradation is governed by treatment duration more than by dose.
  grade: C
  basis: '-76% median ER at 14 days versus -94% at approximately 5.5 months at an unchanged 200 mg. Graded C
    because the two figures come from different timepoints in a study population that is not a within-patient
    time course, and no formal time-course model is presented.'
- claim: Vepdegestrant will raise erdafitinib exposure.
  grade: D
  basis: 'Direction is well supported - vepdegestrant raised midazolam AUC 1.7-fold and dabigatran AUC
    2.0-fold, and erdafitinib is a CYP3A4-cleared P-gp substrate - but the magnitude is unmodelled and likely
    modest because only about 20% of erdafitinib clearance is CYP3A4. Recorded as the single biggest practical
    objection to the combination and as an argument for the lower dose.'
- claim: The molecule reaches growth-plate cartilage.
  grade: X
  basis: 'UNKNOWN AND NOT ADDRESSED ANYWHERE IN THE APPLICATION. Bone and cartilage are absent from the
    whole-body autoradiography distribution list, plasma protein binding exceeds 99%, and R315s avascular
    cartilage delivery wall has never been tested for this molecule. The large apparent volume of distribution
    (764 L) is the only thing pointing the other way.'
