contradicts:
- 'REFINES R351 rather than contradicting it. R351 proposed the label dose on the reasoning that this is the
  one node where the oncology dose is right because both indications want maximal degradation. That reasoning
  survives for the TARGET but not for the DOSE: maximal degradation is already achieved on a plateau reaching
  down to at least 30 mg, so the oncology dose is not the maximal-degradation dose, it is a point chosen
  against 500 mg on QTc.'
- 'CLOSES R351s open item that the reverse interaction direction was untested. It is measured, vepdegestrant
  inhibits CYP3A and P-gp, and it runs against the combination.'
