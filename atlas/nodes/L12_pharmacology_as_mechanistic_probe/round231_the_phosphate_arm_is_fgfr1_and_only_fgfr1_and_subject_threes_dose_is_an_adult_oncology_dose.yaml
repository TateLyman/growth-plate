contradicts:
- >-
  ROUND 230's inference that the phosphate arm is an FGFR1 effect, which rested on a two-point contrast
  that could not separate FGFR1 from FGFR4. The conclusion survives and the basis is replaced by a
  three-agent series in which the FGFR4-sparing agent sits with the high pair.
- >-
  ROUND 228's premise that the APEC1621B films are the only serial physeal imaging in existence. farouk2021
  took tibial growth plate radiographs every 8 to 12 weeks in five children. Recorded as CORR-239.
- >-
  ROUND 229's caveat that the growth observations are confounded by the prior chemotherapy and cranial
  irradiation typical of this population. True of the cohort and NOT TRUE OF SUBJECT 3, who had surgery only.
- >-
  The round-230 ask list, which requested the ASCO 10007 abstract while it sat in atlas/data/round227_supplied/.
  Recorded as CORR-238 and answered with atlas/tools/holdings.py.
