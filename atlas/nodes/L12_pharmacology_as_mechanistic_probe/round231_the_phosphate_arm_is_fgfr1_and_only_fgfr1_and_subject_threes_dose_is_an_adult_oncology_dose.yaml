open_questions:
- g_l12_how_much_of_the_fgfr_tki_growth_response_requires_fgfr1
- g_l12_has_an_fgfr3_selective_inhibitor_ever_grown_a_human_with_a_normal_fgfr3
- g_l7_does_physeal_widening_under_an_fgfr_inhibitor_mean_preserved_reserve_or_arrested_remodelling
