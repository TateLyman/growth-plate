id: round231_the_phosphate_arm_is_fgfr1_and_only_fgfr1_and_subject_threes_dose_is_an_adult_oncology_dose
name: >-
  ROUND 231 - a third agent breaks the two-point tie and shows the phosphate arm is FGFR1 and only
  FGFR1; subject 3's dose was a full adult oncology exposure and he is the only unconfounded growth
  observation in the field; and a second set of serial physeal films exists that round 228 did not know about
type: hypothesis
layer: L12
aliases:
- the receptor coverage series
- the phosphate arm is FGFR1 only
- subject 3's dose
- the second set of physeal films
- round 231
stub: false
summary: |
  THREE DOCUMENTS SUPPLIED, TWO OF WHICH WERE ON THE ROUND-230 ASK LIST AND ONE OF WHICH WAS ALREADY ON
  DISK. That last fact is recorded as CORR-238 and answered with a tool rather than a promise -
  atlas/tools/holdings.py now indexes all 268 files under atlas/data/ and answers "do I already have this?"
  by identifier and by title phrase, fails any ask list naming something held, and reports the 90 held
  documents that no bibliography ref names, which is the root cause: a document on disk with no ref is
  invisible to every other check in this repository.

  ONE - THE PHOSPHATE ARM IS FGFR1 AND ONLY FGFR1, AND IT TOOK A THIRD AGENT TO SHOW IT. Round 230
  attributed the hyperphosphataemia to FGFR1 on a two-point contrast: pan-FGFR1-4 erdafitinib at about 75
  per cent against FGFR3-selective TYRA-300 at 13 per cent. THAT CONTRAST CANNOT SEPARATE LOSING FGFR1 FROM
  LOSING FGFR4, because TYRA-300 drops both at once. farouk2021 breaks the tie: DEBIO1347 SPARES FGFR4,
  COVERS FGFR1, AND PRODUCED HYPERPHOSPHATAEMIA IN FOUR OF FIVE CHILDREN, all grade 2, with no dose
  modification in any patient. Agents covering FGFR1 run at 75 and 80 per cent; the agent sparing FGFR1 runs
  at 13; dropping FGFR4 does nothing at all. AND THE SAME THREE ROWS SPEAK TO HEIGHT - the largest human
  growth response ever recorded came from the FGFR4-sparing agent, so FGFR4 contributes nothing to the
  phosphate arm and nothing demonstrable to the height. PAN-FGFR1-4 COVERAGE IS THEREFORE THE WORST OF THE
  THREE PROFILES: it buys the toxicity of FGFR1 and the redundancy of FGFR4.

  TWO - SUBJECT 3's DOSE, THE TOP ITEM ON THE ROUND-230 ASK LIST. DEBIO1347 AT 80 mg/1.73 m2 x BODY SURFACE
  AREA ONCE DAILY, continuous, 20-mg tablets crushed where needed, described by the authors as the
  approximate BSA-adjusted ADULT RECOMMENDED PHASE II DOSE. So the largest linear growth response on record
  was produced at a FULL ADULT ONCOLOGY EXPOSURE, not at a paediatric growth dose - one to two orders of
  magnitude above the achondroplasia programmes, which top out at 0.25 mg/kg for infigratinib in PROPEL 2
  and 0.50 mg/kg for TYRA-300 in BEACH301.

  AND HE IS THE ONLY UNCONFOUNDED GROWTH OBSERVATION IN THIS FIELD. Round 229 flagged that this population
  is heavily pretreated with corticosteroids and cranial irradiation and argued the confound runs AGAINST
  the finding. FOR SUBJECT 3 THE ARGUMENT IS UNNECESSARY: Table 1 records "Surgery only (partial
  resection)", no prior chemotherapy, no radiotherapy, and an interval from previous therapy recorded as a
  dash because there was none. His tumour was POSTERIOR FOSSA - right cerebellar hemisphere circumscribing
  the brainstem - with NO hypothalamic or pituitary involvement. Every other quantified child has a lesion
  in this respect: brizini2024's had hypothalamic obesity from an optic pathway tumour; erdaseries2025
  patient 1 had irradiation, temozolomide, GH deficiency on replacement and hypogonadotropic hypogonadism;
  farouk2023 subjects 1 and 2 had optic pathway tumours and prior regimens. SUBJECT 3 HAD AN INTACT
  UNTREATED HYPOTHALAMIC-PITUITARY-GONADAL AXIS, A NORMAL GERMLINE FGFR3, AND FORTY MONTHS OF MEASUREMENT
  FROM AGE 14.

  AND HE EXISTS BY ACCIDENT. At nine months he developed bilateral knee pain with osteochondritis dissecans
  on MRI; farouk2021 records that the event was DEEMED UNRELATED and the drug was CONTINUED. Subject 2,
  whose bilateral SCFE was also considered unrelated, stopped anyway because the family chose to. THE ONLY
  FORTY-MONTH EXPOSURE IN EXISTENCE HAPPENED BECAUSE A SKELETAL ADVERSE EVENT WAS ATTRIBUTED AWAY.

  THREE - THERE IS A SECOND SET OF SERIAL PHYSEAL FILMS AND ROUND 228 DID NOT KNOW IT EXISTED. farouk2021
  Methods: plain radiographs of TIBIAL GROWTH PLATES were performed EVERY 8 TO 12 WEEKS, in all five
  children, prospectively, at one centre. Round 228 closed the line partly on the premise that APEC1621B
  held the only serial physeal imaging. THIS DOES NOT REOPEN THE BONE AGE - a tibial film yields no
  Greulich-Pyle reading and no on-treatment bone age exists anywhere - BUT IT MATTERS MORE THAN THE BONE AGE
  WOULD. The surviving question is PROPORTIONALITY, and the gap record names the discriminating experiment
  as pairing physeal width against length gain over the same interval, calling it the cheap version that
  needs no new procedure. BOTH HALVES EXIST FOR SUBJECT 3 ACROSS FORTY MONTHS AND NEITHER IS PUBLISHED.

  FOUR - APEC1621B READ IN FULL, AND THE DENOMINATOR HIDING IN ITS SILENCE. 20 evaluable patients, median
  age 15, enrolled June 2018 to July 2022, erdafitinib 4.7 mg/m2/dose capped at 8 mg, 28-day cycles, MAXIMUM
  26 CYCLES; partial response 2/20, median stable disease 6.5 cycles, six-month PFS 45 per cent. Its entire
  toxicity sentence names hyperphosphataemia, nail changes or infections, grade 1 vision changes, one grade
  3 spinal cord compression and one grade 4 intracranial haemorrhage. NOT ONE WORD ABOUT GROWTH, PHYSIS,
  EPIPHYSIOLYSIS OR BONE AGE, in the one cohort whose protocol mandated baseline and serial physeal films
  with central submission.

  THE DENOMINATOR NOBODY EXTRACTED: TWENTY CHILDREN, MEDIAN AGE 15, ON ERDAFITINIB, ZERO SLIPPED EPIPHYSES -
  against farouk2023's 3 of 7 and RAGNAR's 1 of 11. THAT IS NOT A CONTRADICTION, IT IS THE DURATION THESIS
  CONFIRMED BY ITS OWN EXPOSURE DATA. Median stable disease 6.5 cycles and six-month PFS 45 per cent mean
  most of the cohort was off drug by six months through progression, and farouk2023 predicted precisely
  this, attributing the paucity of bony toxicity in trials to exposure limited by early progression. THE
  TRIAL WITH THE SHORTEST EFFECTIVE EXPOSURE IS THE TRIAL WITH NO SLIPS, despite the oldest median age and
  imaging specifically looking for them. WHICH TIGHTENS ROUND 230's SHAPE - the failure has a shorter
  latency than the benefit, but not a short one absolutely: BELOW ABOUT FOUR MONTHS YOU GET NEITHER.

  FIVE - PROPEL 2's SCHEDULE OF ASSESSMENTS, THE THIRD CONFIRMATION AT A THIRD LEVEL OF THE RECORD. The
  supplied Supplementary Table 1 schedules anthropometry, range of motion, ECG, POLYSOMNOGRAM, ophthalmic
  exam, DENTAL EXAM, images (x-rays and DXA), labs, PRO, PK and pregnancy tests. THERE IS NO BONE AGE LINE
  ITEM. A trial that schedules a sleep study and a dental exam in children with a growth disorder does not
  schedule a measurement of skeletal maturation. With the registry sweep of five trials and APEC1621B's
  total silence, that is three independent levels of the record saying the same thing: THE FIELD DOES NOT
  MEASURE THIS. It is not hidden and it is not hard - IT IS NOT ON ANYBODY'S SCHEDULE OF ASSESSMENTS.
quantitative:
- parameter: hyperphosphataemia by FGFR receptor coverage - the three-agent series that discriminates
  value: >-
    erdafitinib, covering FGFR1-2-3-4, about 75 per cent with about 4 per cent grade 3. DEBIO1347, covering
    FGFR1-2-3 and SPARING FGFR4, FOUR OF FIVE CHILDREN, ALL GRADE 2, with NO DOSE MODIFICATION IN ANY
    PATIENT and all adverse events grade 1-2. TYRA-300, FGFR3-selective and sparing both FGFR1 and FGFR4, 13
    per cent at 90 mg once daily in n = 15. AGENTS COVERING FGFR1 RUN AT 75 AND 80 PER CENT; THE AGENT
    SPARING FGFR1 RUNS AT 13; SPARING FGFR4 CHANGES NOTHING
  unit: per cent of patients with hyperphosphataemia, against receptor coverage
  conditions: three different agents in three different populations - adults with urothelial cancer, five
    children with gliomas, and adults in dose escalation
  species: human
  source_ref: farouk2021
  uncertainty: >-
    THREE POPULATIONS, THREE TRIALS, NO HEAD-TO-HEAD, and the Debio1347 point is FIVE CHILDREN. Different
    ascertainment and different grading thresholds could move any single number. WHAT THE SERIES SUPPORTS IS
    THE ORDERING AND THE ATTRIBUTION, not the exact percentages: the two FGFR1-covering agents sit together
    and far from the FGFR1-sparing one, and the FGFR4 contrast is internal to that pair
- parameter: the dose behind the largest human linear growth response on record
  value: >-
    DEBIO1347 at 80 mg/1.73 m2 x body surface area, ONCE DAILY, continuous, 20-mg tablet formulation crushed
    and suspended in water where needed - described by the authors as the approximate body-surface-area
    adjusted ADULT RECOMMENDED PHASE II DOSE. For comparison the paediatric growth programmes run one to two
    orders of magnitude lower - infigratinib to 0.25 mg/kg in PROPEL 2, TYRA-300 to 0.50 mg/kg in BEACH301
  unit: mg per 1.73 m2 body surface area per day
  conditions: farouk2021 Methods, single patient use protocols at MSKCC; this is the cohort dose, and no
    per-patient dose is tabulated
  species: human
  source_ref: farouk2021
  uncertainty: >-
    THE DOSE IS STATED FOR THE COHORT, NOT FOR SUBJECT 3 INDIVIDUALLY, and the paper says the patients were
    treated "at the approximate" adult RP2D, which leaves room for per-patient variation it does not report.
    No dose modification was required in any patient, so it is unlikely he ran below it for long. His body
    surface area is not given, so the absolute daily milligram figure cannot be computed without assuming
    one
- parameter: subject 3's confounding exposures, and there are none
  value: >-
    prior lines of therapy NONE - Table 1 records "Surgery only (partial resection)"; prior chemotherapy
    none; prior radiotherapy none; interval from previous therapy recorded as a dash. Tumour site POSTERIOR
    FOSSA, right cerebellar hemisphere circumscribing the brainstem and extending to C2, with NO
    hypothalamic or pituitary involvement. Age 13 at diagnosis, 14 at start of treatment, treated 40 months,
    height Z +0.97 to +3.40
  unit: presence or absence of each growth-confounding exposure
  conditions: farouk2021 Table 1 and case narrative, cross-read with farouk2023 Table 1
  species: human
  source_ref: farouk2021
  uncertainty: >-
    THE ABSENCE OF CONFOUNDERS DOES NOT MAKE ONE PATIENT A STUDY. He remains n = 1, retrospective, with two
    height points forty months apart and no bone age. What changes is that the standard dismissal of this
    literature - that these are sick, irradiated, steroid-exposed children whose growth means nothing -
    DOES NOT APPLY TO HIM
- parameter: APEC1621B in full, including the slip denominator it does not comment on
  value: >-
    20 evaluable patients, MEDIAN AGE 15, enrolled June 2018 to July 2022. Erdafitinib 4.7 mg/m2/dose capped
    at 8 mg daily, 28-day cycles, MAXIMUM 26 CYCLES. 17 of 20 glioma or glioneuronal. Partial response 2/20
    (90 per cent CI 3.4 to 26.2); stable disease in 6 more with median duration 6.5 cycles; six-month PFS 45
    per cent (95 per cent CI 23.1 to 64.7); six-month OS 89.7 per cent. Named toxicities in full -
    hyperphosphataemia, nail changes or infections, grade 1 vision changes, one grade 3 spinal cord
    compression, one grade 4 intracranial haemorrhage. ZERO SLIPPED EPIPHYSES AND ZERO GROWTH EVENTS NAMED
  unit: patients, cycles, per cent
  conditions: ASCO 2023 abstract 10007, read in full; the only published output of APEC1621B
  species: human
  source_ref: asco2023_apec1621b_abstract
  uncertainty: >-
    AN ABSTRACT NAMES SELECTED ADVERSE EVENTS AND IS NOT AN ADVERSE EVENT TABLE, so "zero slips" is an
    absence of report rather than a reported zero - and CORR-233 requires that distinction be made. What
    supports treating it as informative is that the protocol specifically mandated physeal imaging, so this
    is a source that WAS looking. The registry-posted results separately record one serious scoliosis in 20
- parameter: a second set of serial physeal radiographs, previously unknown to this atlas
  value: >-
    plain radiographs of TIBIAL GROWTH PLATES performed EVERY 8 TO 12 WEEKS in all five children of the
    Debio1347 cohort, alongside ECG, echocardiogram and imaging response assessment. For subject 3 that
    should span the full 40 months over which his height moved from the 83rd centile to above the 99.9th,
    giving serial physeal width and serial length in the same patient over the same interval
  unit: imaging interval and cohort size
  conditions: farouk2021 Methods; single centre, prospective, unpublished
  species: human
  source_ref: farouk2021
  uncertainty: >-
    THE FILMS ARE STATED TO HAVE BEEN TAKEN AND NOTHING IS PUBLISHED FROM THEM - no widths, no images
    except the SCFE series in farouk2023, and no statement that they were measured rather than merely
    reviewed. A tibial physeal film also yields NO bone age, so this does not touch round 228's closure
localization:
- 'the kidney, where FGFR1 and only FGFR1 sets the phosphate arm'
- 'a drawer at one centre, holding forty months of serial physeal films on the best patient in the field'
human_evidence: direct
human_evidence_note: >-
  Five children on Debio1347 with doses, adverse events and imaging schedule; twenty children on erdafitinib
  with exposure and response; and one trial protocol schedule. All human, all primary.
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  Human children on the exact drug class. The limits are sample size and cross-trial comparison, not species.
confidence: B
claim_grades:
- claim: the hyperphosphataemia of FGFR inhibitors is an FGFR1 effect and not an FGFR4 effect
  grade: B
  basis: >-
    A THREE-AGENT SERIES THAT DISCRIMINATES. Both FGFR1-covering agents sit at 75 and 80 per cent and the
    FGFR1-sparing agent at 13; the FGFR4-sparing agent is one of the high pair, so FGFR4 contributes
    nothing. Consistent with FGF23 signalling through FGFR1-Klotho. Held below A because the three points
    come from three unmatched populations with no head-to-head
- claim: FGFR4 coverage contributes to either the phosphate arm or the height
  grade: X
  basis: >-
    FALSE ON BOTH. Debio1347 spares FGFR4 and still produces 80 per cent hyperphosphataemia, and it produced
    the largest human growth response ever recorded. Pan-FGFR1-4 coverage buys the FGFR1 toxicity and the
    FGFR4 redundancy
- claim: subject 3's growth is confounded by the prior therapy typical of this population
  grade: X
  basis: >-
    FALSE FOR HIM SPECIFICALLY. Surgery only, no chemotherapy, no radiotherapy, posterior fossa tumour with
    no hypothalamic or pituitary involvement. He is the only quantified child in this literature without
    such a lesion
- claim: the largest human growth response was obtained at a paediatric growth dose
  grade: X
  basis: >-
    FALSE. It was a full adult oncology exposure - 80 mg/1.73 m2 BSA-scaled, the adult recommended phase II
    dose - one to two orders of magnitude above the achondroplasia programmes
- claim: APEC1621B holds the only serial physeal imaging in existence
  grade: X
  basis: >-
    FALSE, and round 228 partly closed on it. farouk2021 states tibial growth plate radiographs were taken
    every 8 to 12 weeks in all five of its children, including the 40-month patient
- claim: an on-treatment bone age exists somewhere
  grade: X
  basis: >-
    STILL FALSE AND NOW CONFIRMED AT A THIRD LEVEL. The APEC1621B abstract read in full is silent, and
    PROPEL 2's schedule of assessments has no bone age line item while scheduling a polysomnogram and a
    dental exam. The field does not measure it
- claim: the low slip rate in APEC1621B contradicts the 3-of-7 and 1-of-11 rates elsewhere
  grade: X
  basis: >-
    FALSE - it confirms the duration thesis. Median stable disease 6.5 cycles and six-month PFS 45 per cent
    mean most of the cohort was off drug by six months, and farouk2023 predicted exactly this, attributing
    the trials' paucity of bony toxicity to exposure limited by early progression
