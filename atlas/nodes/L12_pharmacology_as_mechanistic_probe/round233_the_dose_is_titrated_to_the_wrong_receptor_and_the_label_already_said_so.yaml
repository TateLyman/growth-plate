confidence: A
claim_grades:
- claim: erdafitinib's dose is titrated upward to a serum phosphate target
  grade: A
  basis: >-
    STATED IN THE LABEL - escalation from 8 to 9 mg when phosphate is below 5.5 mg/dL at day 14 to 21, with
    a dose increase occurring in 41 per cent of patients on that basis
- claim: the only pharmacodynamic marker used to set this drug's dose is a readout of a receptor that is
    not the growth target
  grade: B
  basis: >-
    FOLLOWS FROM TWO ESTABLISHED PIECES - the label titrates on phosphate, and rounds 231 and 232 showed the
    phosphate arm is FGFR1 and only FGFR1 from three agents and two directions of human genetics. The
    inference is one step and the step is small, but no source states it in these words
- claim: the tumoral-calcinosis tissue phenotype under FGFR inhibition rests on three case reports
  grade: X
  basis: >-
    FALSE, AND ROUND 230 SOURCED IT THAT WAY. Label section 5.2 states soft tissue mineralization, cutaneous
    calcinosis, non-uremic calciphylaxis and vascular calcification, from the pooled adjudicated
    registration database, with denominators
- claim: an FGFR3-selective inhibitor is expected by its developer to act on an open growth plate
  grade: C
  basis: >-
    The SURF301 protocol says FGFR3-selective inhibition may alter bone development and that effects are
    likely minimal only where growth plates are CLOSED. That is a sponsor's prior stated in a regulatory
    document, not a measurement, and the gap it bears on remains open
