contradicts:
- >-
  ROUND 230's sourcing of the tumoral-calcinosis convergence to three case reports when the label states it
  with denominators. Recorded as CORR-241.
- >-
  ROUNDS 212 AND 213's shared framing of serum phosphate as a toxicity CEILING on the erdafitinib dose. It
  is that, and it is also the pharmacodynamic TARGET the label escalates toward - which makes the dose
  FGFR1-driven in both directions.
