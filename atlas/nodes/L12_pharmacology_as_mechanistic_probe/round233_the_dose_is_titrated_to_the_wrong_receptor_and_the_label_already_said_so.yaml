id: round233_the_dose_is_titrated_to_the_wrong_receptor_and_the_label_already_said_so
name: >-
  ROUND 233 - erdafitinib's dose is titrated UP to a serum phosphate target, which is a readout of the one
  receptor that is not the growth target; the label already names the tumoral-calcinosis phenotype this atlas
  assembled from case reports; and the FGFR3-selective sponsor's own protocol states the opposite posture
type: hypothesis
layer: L12
aliases:
- the dose is titrated to the wrong receptor
- 5.5 mg/dL is a target and a threshold
- the label said it first
- round 233
stub: false
summary: |
  MINED FROM TWO DOCUMENTS THIS ATLAS ALREADY HELD - the BALVERSA label archived at round 227 and the
  SURF301 protocol archived at round 215, neither read for this purpose. This is the first round in which
  the holdings index found the material rather than the user supplying it.

  ONE - THE DOSE IS TITRATED UP TO A PHOSPHATE TARGET, AND PHOSPHATE IS AN FGFR1 READOUT. The label
  increases erdafitinib from 8 mg to 9 mg in patients whose serum phosphate is BELOW 5.5 mg/dL at day 14 to
  21 of cycle 1, and records that A DOSE INCREASE OCCURRED IN 41 PER CENT OF PATIENTS on that basis. Round
  212 called phosphate "the gate" and round 213 partly walked it back because hyperphosphataemia is rarely
  severe. BOTH WERE TREATING PHOSPHATE AS A CEILING. It is also, explicitly, the pharmacodynamic marker that
  drives the dose UPWARD.

  ROUNDS 231 AND 232 ESTABLISHED THAT THE PHOSPHATE ARM IS FGFR1 AND ONLY FGFR1 - across three agents where
  sparing FGFR4 changes nothing and sparing FGFR1 collapses it six-fold, and across two directions of human
  genetics where FGFR1 gain gives hypophosphataemia and FGFR1 inhibition gives hyper. PUT THOSE TOGETHER AND
  THE CONCLUSION IS UNCOMFORTABLE: THE ONLY PHARMACODYNAMIC MARKER ANYONE TITRATES THIS DRUG AGAINST IS A
  READOUT OF THE RECEPTOR THAT IS NOT THE GROWTH TARGET. There is no FGFR3 pharmacodynamic marker in
  clinical use anywhere. That is why round 212 could not establish whether any tolerated dose saturates the
  growth target, and why round 228's flat 3-to-7 mg human dose-response has no mechanistic anchor on either
  side - nobody was ever measuring the thing that matters.

  TWO - THE LABEL ALREADY NAMES THE PHENOTYPE ROUND 230 ASSEMBLED FROM THREE CASE REPORTS. Section 5.2 is
  titled HYPERPHOSPHATEMIA AND SOFT TISSUE MINERALIZATION and states that the drug can cause
  hyperphosphataemia leading to soft tissue mineralization, CUTANEOUS CALCINOSIS, NON-UREMIC CALCIPHYLAXIS
  and VASCULAR CALCIFICATION - with vascular calcification in 0.2 per cent and 24 PER CENT OF PATIENTS
  RECEIVING PHOSPHATE BINDERS during treatment. Those are the defining lesions of hyperphosphataemic
  familial tumoral calcinosis. Round 230 was right and sourced it three grades too weakly, from
  ghimire2025, chandana2024 and slaymaker2025, when the pooled adjudicated trial database said it in the
  label. Recorded as CORR-241.

  THREE - THE TWO PHOSPHATE ALGORITHMS, SIDE BY SIDE, AND THEY DISAGREE AT THE SAME NUMBER. Erdafitinib
  continues unchanged below 6.99 mg/dL, adds a binder at 7 to 8.99, withholds at 9 to 10, and DISCONTINUES
  PERMANENTLY if phosphate stays at or above 10 for more than two weeks. TYRA-300's protocol restricts diet
  and considers sevelamer 800-1600 mg three times daily FROM 5.5 mg/dL, and HOLDS THE DRUG AT 7.0 - where
  erdafitinib is still only adding a binder. SO 5.5 mg/dL IS ERDAFITINIB'S DOSE-ESCALATION TARGET AND
  TYRA-300's INTERVENTION THRESHOLD. The same number, opposite postures, because one programme treats
  phosphate as evidence of engagement and the other treats it as pure cost.

  FOUR - THE FGFR3-SELECTIVE SPONSOR STATES THE STACK'S OWN THESIS IN ITS PROTOCOL. SURF301's rationale
  section says there may be a THERAPEUTIC BENEFIT OF LIMITING INHIBITION OF FGFR1, FGFR2 AND FGFR4 while
  allowing more potent inhibition of FGFR3 - which is rounds 231 and 232's conclusion, written by the
  developer before either round existed. AND IT SPEAKS TO THE LOAD-BEARING ASSUMPTION: it states that FGFR3
  plays a major role in cartilage differentiation and bone development in children, that FGFR3-SELECTIVE
  INHIBITION MAY ALTER BONE DEVELOPMENT, and that the effects are likely minimal only in those with CLOSED
  GROWTH PLATES. THAT IS THE DEVELOPER'S OWN PRIOR THAT FGFR3-SELECTIVE INHIBITION ACTS ON AN OPEN PLATE.
  IT IS AN EXPECTATION AND NOT A MEASUREMENT, and the gap it bears on stays open - but the people who built
  the molecule expect it to work on a growing skeleton and wrote the exclusion criteria accordingly.

  FIVE - TWO NUMBERS FOR THE DURATION LEVER, BOTH FROM THE LABEL. Median duration of treatment in the adult
  registration cohort was 5.3 MONTHS, RANGE 0 TO 17. Dose reductions for an adverse reaction occurred in 69
  per cent of patients in one cohort and 53 per cent in another, with hyperphosphataemia the single most
  common cause of dosage INTERRUPTION at 24 per cent. Rounds 228 and 229 established that duration is the
  only lever left; THE DRUG'S OWN REGISTRATION EXPERIENCE SAYS THE MEDIAN PATIENT GETS 5.3 MONTHS OF IT, and
  the commonest reason for interrupting is the FGFR1 arm.
quantitative:
- parameter: erdafitinib is dose-escalated to a serum phosphate target
  value: >-
    the label increases the dose from 8 mg to 9 mg in patients whose serum phosphate is BELOW 5.5 mg/dL at
    day 14 to 21 of cycle 1; A DOSE INCREASE OCCURRED IN 41 PER CENT OF PATIENTS on that basis. The
    downward algorithm - continue below 6.99, binder at 7 to 8.99 with reduction if it persists 2 months,
    withhold at 9 to 10 with reduction if it persists 1 month, and PERMANENT DISCONTINUATION if 10 or above
    for more than 2 weeks. Monthly phosphate monitoring throughout
  unit: mg/dL serum phosphate as both an escalation target and a stopping rule
  conditions: BALVERSA US prescribing information, revision s010, October 2024, adults with urothelial cancer
  species: human
  source_ref: balversa_label_2025
  uncertainty: >-
    THIS IS AN ADULT ONCOLOGY LABEL and no paediatric dosing algorithm exists. The inference it supports is
    about WHICH RECEPTOR IS BEING TITRATED, which is a property of the algorithm rather than of the
    population. What it cannot say is whether a phosphate-targeted dose happens to coincide with a
    growth-saturating dose, because no FGFR3 pharmacodynamic marker exists to check against
- parameter: the label's own statement of the tumoral-calcinosis phenotype, with denominators
  value: >-
    section 5.2, HYPERPHOSPHATEMIA AND SOFT TISSUE MINERALIZATION - the drug can cause hyperphosphataemia
    leading to SOFT TISSUE MINERALIZATION, CUTANEOUS CALCINOSIS, NON-UREMIC CALCIPHYLAXIS and VASCULAR
    CALCIFICATION. Vascular calcification observed in 0.2 per cent of patients. TWENTY-FOUR PER CENT OF
    PATIENTS RECEIVED PHOSPHATE BINDERS during treatment. Hyperphosphataemia was the commonest cause of
    dosage interruption at 24 per cent; dose reductions for any adverse reaction occurred in 69 per cent of
    one cohort and 53 per cent of another; median duration of treatment 5.3 months, range 0 to 17
  unit: per cent of patients, and months of treatment
  conditions: pooled adjudicated registration safety database, adults
  species: human
  source_ref: balversa_label_2025
  uncertainty: >-
    ADULTS, and adults do not have open growth plates, so the soft-tissue mineralisation denominators do not
    transfer to a child's skeleton. The 5.3-month median duration is set by cancer progression and death as
    much as by toxicity, so it is a floor on what is achievable rather than a ceiling
- parameter: the two phosphate algorithms disagree at the same threshold
  value: >-
    ERDAFITINIB - continue unchanged below 6.99 mg/dL; binder at 7 to 8.99; withhold at 9 to 10; permanent
    discontinuation at 10 or above for over 2 weeks. TYRA-300 - restrict dietary phosphorus to 600-800
    mg/day and MAY CONSIDER SEVELAMER 800 to 1600 mg THREE TIMES DAILY WITH FOOD from 5.5 mg/dL, monitoring
    at least twice weekly; HOLD THE DRUG AT 7.0 to 9.0 and resume at the same dose level once below 5.5;
    hold above 9.0. SO 5.5 mg/dL IS ERDAFITINIB'S ESCALATION TARGET AND TYRA-300's INTERVENTION THRESHOLD
  unit: mg/dL thresholds for intervention, hold and discontinuation
  conditions: BALVERSA label table 2 against SURF301 protocol table 6.4, TYR300-101 version 4.0, 6 Dec 2023
  species: human
  source_ref: surf301_protocol
  uncertainty: >-
    A PROTOCOL IS A PLAN AND A LABEL IS AN OUTCOME - the two documents are not the same class, and
    TYRA-300's conservatism may reflect caution in a first-in-human study rather than a considered view of
    the biology. The contrast in posture is nonetheless real and is stated by the sponsors themselves
- parameter: the FGFR3-selective sponsor's stated rationale and its expectation about open plates
  value: >-
    SURF301's rationale states there may be a THERAPEUTIC BENEFIT OF LIMITING INHIBITION OF FGFR1, FGFR2 AND
    FGFR4 while allowing more potent inhibition of FGFR3; that FGFR3 plays a major role in cartilage
    differentiation and bone development IN CHILDREN; that FGFR3-SELECTIVE INHIBITION MAY ALTER BONE
    DEVELOPMENT; and that these effects are likely to be minimal in children and adults WITH CLOSED GROWTH
    PLATES. Preclinical toxicities listed for TYRA-300 include hyperphosphataemia, hypercalcaemia, liver
    function abnormalities, gastrointestinal abnormalities and SKELETAL SYSTEM DISORDERS
  unit: sponsor rationale, qualitative
  conditions: TYR300-101 protocol version 4.0, section 1.5 and section 6.5.1
  species: not_applicable
  source_ref: surf301_protocol
  uncertainty: >-
    A SPONSOR'S RATIONALE IS A PRIOR, NOT A RESULT, and this one is written to justify a trial design in
    adults. It bears on the load-bearing gap - whether an FGFR3-selective agent grows a normal-FGFR3 human -
    only as evidence about what the people who built the molecule expect, which is not evidence about what
    it does
localization:
- 'the kidney, whose phosphate output is the only pharmacodynamic marker anyone titrates this drug against'
- 'the growth plate, for which no pharmacodynamic marker exists in clinical use at all'
