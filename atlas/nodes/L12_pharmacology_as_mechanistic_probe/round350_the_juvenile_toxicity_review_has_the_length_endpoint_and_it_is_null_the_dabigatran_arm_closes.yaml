contradicts:
- 'CLOSES R348''s dabigatran proposal and DELETES its central gap statement. "No thrombin inhibitor has a
  bone-length endpoint in any species" is false; the endpoint exists in a regulatory review and is null.'
- 'CORRECTS R349 in both directions: the juvenile toxicity study is a stronger constraint than R349 could see
  because it contains a length endpoint, and a weaker one on mortality because the preliminary study found
  haemorrhage indistinguishable from control across 20-70 mg/kg/day.'
- 'DOES NOT contradict R347''s ECRG4 finding. The genetic phenotype stands; what is removed is one molecule
  aimed at the activating protease.'
