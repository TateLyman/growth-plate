id: round350_the_juvenile_toxicity_review_has_the_length_endpoint_and_it_is_null_the_dabigatran_arm_closes
name: 'Round 350 - the FDA nonclinical review was hunted down and it holds the exact experiment R348 asked
  for: serial ULNA LENGTH in rats dosed with a direct thrombin inhibitor from PND 7 to PND 62 across a dose
  range spanning lethality. It is NULL. The dabigatran arm closes, the ECRG4 target survives, and a whole
  class of length endpoints - regulatory juvenile toxicity reviews - is opened'
aliases:
- dabigatran juvenile toxicity ulna length
- the length endpoint exists and is null
- juvenile toxicity reviews are a length-endpoint source
- CORR-350
type: intervention
layer: L12
stub: false
summary: 'R348 proposed a direct thrombin inhibitor as the only obtainable agent aimed at ECRG4 and stated as
  its leading gap that NO THROMBIN INHIBITOR HAS A BONE-LENGTH ENDPOINT IN ANY SPECIES. R349 read the FDA
  clinical review and named the nonclinical review as the document that might hold it. That document was
  retrieved and read. IT HOLDS THE EXPERIMENT, AND THE EXPERIMENT IS NEGATIVE.

  ONE - THE STUDY IS ALMOST EXACTLY WHAT R348 SPECIFIED. Definitive GLP juvenile toxicity study n00251085-1:
  Han Wistar rat pups, oral gavage, dosed from POST-NATAL DAY 7 TO PND 62 - the whole juvenile growth period -
  at 0, 15, 32.5 and 70 mg/kg/day, 12/sex/group main phase and 20/sex/group recovery phase, with a four-week
  recovery to PND 91. Endpoints explicitly included body weight, food consumption, LIMB MEASUREMENTS and
  sexual maturation. LEFT ULNA LENGTH was recorded on PND 14, 28, 42, 56 and at necropsy in main-phase
  animals and on PND 14, 28, 42, 56, 70, 84 and at necropsy in recovery-phase animals. R348 asked for a
  growing animal dosed with a direct thrombin inhibitor and a caliper on a long bone; this is that, serially,
  under GLP, at doses that killed animals.

  TWO - AND IT IS NULL. The reviewer records no effects on ulna length or growth in MALES at any dose across
  the whole treatment and recovery period. In FEMALES there is one statistically significant REDUCTION at the
  top dose of 70 mg/kg/day on PND 28 (24.3 +/- 1.9 mm versus 25.2 +/- 0.55 mm in controls) which is absent at
  every other timepoint, absent in the change in ulna length from PND 14 to PND 56, and gone by the end of
  treatment and by the end of recovery. Key study finding 4 states there was no clear effect on growth or
  development, and the Integrated Summary repeats it. THE ONLY DIRECTIONAL SIGNAL IN THE ENTIRE DATASET RUNS
  THE WRONG WAY - shorter, transiently, at the top dose.

  THREE - THE PRELIMINARY STUDY AGREES FROM THE OTHER END OF THE DOSE RANGE. Study n0024900 dosed Han Wistar
  pups PND 7 to PND 28 at up to 200 mg/kg/day and recorded individual body weights from PND 6 through 28. At
  every dose from 20 to 200 mg/kg/day, in both sexes, there were no clear test-article-related body-weight
  changes - the ratios to control run 0.88 to 1.05. A drug that substantially accelerated growth in a juvenile
  rat would be expected to move the crudest available readout, and it did not.

  FOUR - SO R348''S CENTRAL GAP IS CLOSED IN THE UNFAVOURABLE DIRECTION AND THE COMPOUND IS DEAD FOR THIS
  PURPOSE. The sentence "no thrombin inhibitor has a bone-length endpoint in any species" is FALSE and must be
  deleted wherever it appears. Dabigatran was given to growing rats, at the right age, over the right
  interval, with serial limb length measured, and it did not lengthen bone.

  FIVE - WHAT SURVIVES, STATED NARROWLY. THE TARGET IS UNTOUCHED. Ecrg4-null body length is +0.950 at
  P=4.45e-07 with normal weight and increased bone density, and ECRG4 is 694.6 CPM at 16.35x cartilage
  enrichment in the human growth plate. This is a failure of the DRUG and the ROUTE, not of the target. Two
  limitations of the null have standing in this file and are not invented for the occasion: the ULNA IS A
  FORELIMB BONE, and R318 established that the upper limb contributes nothing to standing height while R330
  showed the elbow runs OPPOSITE to the knee on HHIP, STC2, NPR3 and PAPPA - so the forelimb is the least
  height-relevant segment that could have been chosen. No femur, tibia or vertebra was measured. And whether
  dabigatran reaches avascular cartilage at all is unmeasured - R315''s delivery wall was never addressed for
  this molecule. Those narrow the null; they do not rescue the compound, because nothing else moved either.

  SIX - THE DOSE PICTURE, CORRECTED AGAINST MY OWN R349. R349 wrote that in a growing animal there is no
  demonstrated dose free of bleeding mortality. The definitive study supports that - 28 premature deaths, none
  in controls, distributed 1 female at 15 mg/kg/day, 9 males and 4 females at 32.5, and 10 males and 3 females
  at 70, with dark or enlarged eye correlating to haemorrhage in almost all - and no NOAEL could be set. But
  the PRELIMINARY study qualifies it: histopathological haemorrhage was similar to control across 0, 20, 30,
  45 and 70 mg/kg/day and rose only at 100 and 300. The two studies disagree at the low end and the GLP one
  governs, so the claim stands but with less force than R349 gave it.

  SEVEN - THE GENERALISABLE RESULT, AND IT IS WORTH MORE THAN THE KILL. CORR-350: REGULATORY JUVENILE
  TOXICITY REVIEWS ARE A LENGTH-ENDPOINT SOURCE THIS ATLAS HAS NEVER MINED. Any drug with a paediatric
  indication has a juvenile toxicity study behind it, and the ICH S11 design routinely records serial LIMB
  LENGTH, body weight, sexual maturation and skeletal histopathology in animals dosed through the entire
  growth period - which is precisely the experiment this file keeps declaring does not exist. These reviews
  are free, public, and invisible to PubMed and to Europe PMC. The atlas has written "no bone-length endpoint
  in any species" about at least eight agents; that phrase is now also a claim about Drugs@FDA and the EMA
  assessment reports, and must be checked against them.'
quantitative:
- parameter: 'SERIAL ULNA LENGTH IN GROWING RATS UNDER A DIRECT THROMBIN INHIBITOR - THE ENDPOINT R348 SAID DID NOT EXIST'
  value: 'Definitive juvenile toxicity study n00251085-1, GLP, Han Wistar rat pups, oral gavage once daily
    from PND 7 to PND 62, doses 0 / 15 / 32.5 / 70 mg/kg/day, 12/sex/group main phase and 20/sex/group
    recovery phase, four-week recovery to PND 91. LEFT ULNA LENGTH recorded on PND 14, 28, 42, 56 and at
    necropsy (main phase) and on PND 14, 28, 42, 56, 70, 84 and at necropsy (recovery phase).
    RESULT - MALES: no effects on ulna length or growth at any dose throughout treatment or recovery.
    FEMALES: at 70 mg/kg/day a statistically significant REDUCTION on PND 28 only, 24.3 +/- 1.9 mm versus
    25.2 +/- 0.55 mm in controls; not present at any other measurement day, not present in the change in ulna
    length from PND 14 to PND 56, and no difference from controls by the end of treatment or the end of
    recovery. Key Study Finding 4 and the Integrated Summary both state there was no effect on growth or
    development'
  unit: mm; mg/kg/day; post-natal day
  conditions: 'fda_pradaxa_juvenile_tox_2021, full 33-page nonclinical review retrieved from Drugs@FDA and
    read 2026-08-13. Statistics - Williams or Dunnett for parametric, Shirley or Steel for non-parametric,
    Fisher exact for ulna length where 75% of data across groups were identical; significance at p<0.05 and
    p<0.01.'
  species: rat
  source_ref: fda_pradaxa_juvenile_tox_2021
  uncertainty: 'THIS IS THE STRONGEST NEGATIVE THE ATLAS HAS EVER OBTAINED ON A PROPOSED AGENT, AND ITS LIMITS
    ARE NARROW BUT REAL. The bone measured is the ULNA, a forelimb bone - R318 found the upper limb
    contributes nothing to standing height and R330 found the elbow runs opposite to the knee on four of this
    file''s brake genes, so it is the least height-relevant long bone available. NO FEMUR, TIBIA OR VERTEBRAL
    LENGTH WAS MEASURED, and the femur was retained only for femorotibial joint histology. Group sizes are
    12-20/sex and no effect size or confidence interval is given for the null, so the minimum detectable
    difference is unknown - this is a safety study, not a powered efficacy study. Rat, not human. And the
    cartilage exposure of dabigatran is entirely unmeasured, so a null could reflect failure to reach the
    tissue rather than absence of a target effect. NONE OF THAT MAKES IT A POSITIVE, and the one significant
    directional result runs the wrong way.'
- parameter: 'BODY WEIGHT ACROSS THE FULL DOSE RANGE IN THE PRELIMINARY STUDY - ALSO FLAT'
  value: 'Preliminary juvenile toxicity study n0024900, Han Wistar rat pups, oral gavage PND 7 to PND 28,
    8/sex/group main phase. Phase 1 doses 0, 30, 100, 200 mg/kg/day; Phase 2 doses 0, 20, 45, 70 mg/kg/day.
    Body weights recorded individually PND 6 through 28 and at necropsy. In surviving MALES PND 7 to PND 21
    the ratios to matched control were 0.98x (200), 0.98x (100), 0.92x (70), 1.04x (45), 0.88x (30) and 0.96x
    (20); PND 7 to PND 28 they were 0.96x (100), 0.92x (70), 1.05x (45), 0.92x (30), 1.01x (20). FEMALES were
    equivalent - 0.98x, 0.98x, 0.94x, 1.01x, 0.89x, 0.96x to PND 21 and 0.95x, 0.97x, 1.01x, 0.91x, 1.00x to
    PND 28. The reviewer records no clear test-article-related change at any dose in either sex. HAEMORRHAGE:
    the number of animals with histopathological haemorrhage was similar across 0, 20, 30, 45 and 70
    mg/kg/day (0-4 animals per group) and higher at 100 (n=8) and 300 (n=6) mg/kg/day, with dose-dependent
    severity'
  unit: fold of control body weight; mg/kg/day
  conditions: fda_pradaxa_juvenile_tox_2021, preliminary study section, read 2026-08-13. Non-GLP, no QA
    statement.
  species: rat
  source_ref: fda_pradaxa_juvenile_tox_2021
  uncertainty: 'BODY WEIGHT IS NOT A LENGTH ENDPOINT - this atlas made exactly that correction in CORR-326
    about morales2026 - so a flat body weight does not by itself exclude a length effect. It is reported here
    because it is concordant with the ulna null from an independent study at a four-fold higher dose ceiling,
    and because a growth-accelerating agent would be expected to move it. The preliminary study is NON-GLP
    with no QA statement and n=8/sex/group, and its haemorrhage data at 20-70 mg/kg/day disagree with the
    definitive study''s mortality at 15 mg/kg/day.'
- parameter: 'THE MORTALITY PICTURE, WHICH CORRECTS R349 IN BOTH DIRECTIONS'
  value: 'Definitive study: 28 premature deaths, NONE in control animals, distributed as 15 mg/kg/day (1
    female), 32.5 mg/kg/day (9 males, 4 females) and 70 mg/kg/day (10 males, 3 females). Eight were
    cannibalised by the dam and could not be evaluated. Among animals killed for welfare reasons the common
    finding was dark and/or enlarged eye correlating with haemorrhage in all but one. Key Study Finding 1 is
    increased mortality in ALL dosage groups, and because mortality occurred at the lowest dose a NOAEL could
    not be established. Other findings - eye abnormalities, cataracts, failure of the pupil dilation reflex -
    were considered secondary to bleeding. The bleeding is described as an exaggeration of the pharmacology of
    the direct thrombin inhibitor rather than organ toxicity. Skeletal tissues examined microscopically
    included femur (femorotibial joint), left ulna, sternum and bone marrow, with no skeletal finding reported'
  unit: animal counts; mg/kg/day
  conditions: fda_pradaxa_juvenile_tox_2021, definitive study section, read 2026-08-13.
  species: rat
  source_ref: fda_pradaxa_juvenile_tox_2021
  uncertainty: 'R349 wrote that in a growing animal there is no demonstrated dabigatran dose free of bleeding
    mortality. That survives on the GLP study - one death at 15 mg/kg/day and none in controls - but it is
    weaker than R349 implied, because the preliminary study found haemorrhage indistinguishable from control
    across 20 to 70 mg/kg/day. A single female death at the lowest dose in a study of 12-20 per sex per group
    is a thin basis for a NOAEL failure, and the reviewer treats it conservatively. The histopathology of the
    femorotibial joint is reported only as an absence of findings, with no growth-plate description, no zone
    measurements and no statement that the physis was specifically evaluated.'
localization:
- 'not a localisation result - this is a pharmacological and regulatory finding that closes an agent'
human_evidence: absent
human_evidence_note: 'Rat only. The human arm remains what R349 established - serial heights exist in ~390
  children across Pradaxa trials 1160.106 and 1160.108 and were never analysed - and this rat null lowers the
  prior on that analysis returning anything.'
species_basis:
- rat
translation_risk: not_applicable
translation_risk_reason: 'The finding is a negative on the proposed agent in the species and life stage where
  it was proposed; no translation is being attempted.'
confidence: A
claim_grades:
- claim: A direct thrombin inhibitor given to growing rats through the whole juvenile period does not lengthen bone.
  grade: A
  basis: 'GLP juvenile toxicity study, oral gavage PND 7 to PND 62 plus four-week recovery, four dose levels
    spanning lethality, 12-20 per sex per group, with left ulna length recorded serially at five to seven
    timepoints from PND 14 to PND 91. No effect in males at any dose or timepoint; the single significant
    female result is a transient REDUCTION at the top dose at one timepoint that resolves. Corroborated by a
    second study showing flat body weight at every dose to 200 mg/kg/day.'
- claim: No thrombin inhibitor has a bone-length endpoint in any species.
  grade: X
  basis: 'FALSE AND WITHDRAWN. This was R348''s leading stated gap and it was wrong. The endpoint exists in
    the FDA nonclinical review for the Pradaxa paediatric application, it is serial ulna length in juvenile
    rats, and it is null. The sentence must be deleted wherever it appears.'
- claim: Dabigatran is an addable compound for this stack.
  grade: X
  basis: 'NO. R348 graded it D as a specification and a re-measurement; the re-measurement has already been
    done and is negative. Tested in the right species, at the right age, over the right interval, with serial
    limb length, across a dose range that killed animals - and nothing moved except a transient shortening at
    the top dose in females.'
- claim: The ECRG4 target is damaged by this result.
  grade: E
  basis: 'NOT ESTABLISHED, AND PROBABLY NOT. The Ecrg4-null mouse phenotype - body length +0.950 at
    P=4.45e-07, ranked eighth of 367 positive significant body-length rows in IMPC, with normal weight and
    increased bone density - is a genetic result about the protein. This is a pharmacological result about one
    molecule whose cartilage exposure was never measured, read out on a forelimb bone that R318 and R330
    identify as the least height-relevant segment. What it removes is the compound, not the target.'
