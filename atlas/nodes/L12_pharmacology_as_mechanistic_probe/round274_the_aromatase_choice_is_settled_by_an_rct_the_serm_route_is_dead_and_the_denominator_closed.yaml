id: round274_the_aromatase_choice_is_settled_by_an_rct_the_serm_route_is_dead_and_the_denominator_closed
name: >-
  ROUND 274 - three supplied PDFs, and one of them was not the paper requested but was more useful. The
  anastrozole-versus-letrozole question is settled by a RANDOMISED HEAD-TO-HEAD in pubertal boys - no
  difference in predicted adult height, and letrozole pays IGF-1, growth velocity and bone age for that
  nothing. TAMOXIFEN kills the SERM route by killing the RESTING ZONE. And aeppli2025 CLOSES the per-site
  denominator that round 273 said could not be closed
aliases:
- round 274
- anastrozole versus letrozole settled
- tamoxifen kills the resting zone
- the denominator closed
- the knees are worth zero by bone age 15
type: hypothesis
layer: L12
stub: false
summary: >-
  THREE PDFs SUPPLIED. ONE IS NOT WHAT I ASKED FOR - I requested chagin2007a, the human GPR30 growth-plate
  paper, and received chagin2007, "Tamoxifen induces permanent growth arrest through selective induction of
  apoptosis in growth plate chondrocytes". Recorded per CORR-261, which requires checking the returned
  title. IT IS MORE USEFUL THAN THE ONE I ASKED FOR, because it kills a lever I had been building for three
  rounds.

  ONE - THE AROMATASE QUESTION, ANSWERED BY THE ONLY RANDOMISED HEAD-TO-HEAD THAT EXISTS. zegarra2024
  randomised 79 pubertal boys with idiopathic short stature, bone age 14 or less, to ANASTROZOLE 1.0 mg
  (n = 35) or LETROZOLE 2.5 mg (n = 30) daily for up to three years, with predicted adult height as the
  PRIMARY endpoint, bone ages reread blind by a single endocrinologist, and spine radiographs plus DXA at
  baseline and two years. The paper states plainly that no RCT had previously compared them.
  LETROZOLE PRODUCED LOWER ESTRADIOL, LOWER IGF-1, HIGHER TESTOSTERONE, SLOWER GROWTH VELOCITY AND SLOWER
  BONE AGE ADVANCE THAN ANASTROZOLE. AND THE PREDICTED ADULT HEIGHT DID NOT DIFFER BETWEEN THE GROUPS. The
  PAH gain seen at year one in both arms DID NOT PERSIST at years two and three. Pooled across both arms,
  the three-year PAH gain versus baseline was +1.3 cm (P = 0.043).
  SO LETROZOLE BUYS MORE HORMONAL SUPPRESSION AND NO MORE HEIGHT, AND PAYS FOR IT IN IGF-1 AND VELOCITY.
  The operator's instinct about the blunted IGF-1 was correct and is now measured in a randomised design.

  TWO - AND THE SAME TRIAL ANSWERS THE DOSE-ESCALATION QUESTION WITHOUT ANYONE HAVING RUN IT. The proposal
  was to titrate anastrozole from 1 to 2 mg to suppress aromatase more completely. THE TRIAL ALREADY
  CONTAINS A MORE-SUPPRESSION ARM: letrozole 2.5 mg drove estradiol LOWER than anastrozole 1 mg, which is
  exactly what doubling the anastrozole dose would aim at, and it produced NO ADDITIONAL PREDICTED HEIGHT.
  THE AXIS IS SATURATED WITH RESPECT TO HEIGHT BEFORE IT IS SATURATED WITH RESPECT TO OESTRADIOL. Escalating
  anastrozole pursues a variable that has already been moved further, by a different molecule, to no
  benefit. This does not prove 2 mg is useless - nobody has given it - but it removes the mechanism by
  which it was expected to help.

  THREE - THE SERM ROUTE IS DEAD, AND IT DIES ON THE COMPARTMENT THIS PROGRAMME CARES MOST ABOUT. Rounds
  269, 270 and 272 built toward blocking oestrogen AT THE PLATE rather than removing its ligand
  systemically. The obvious agent class is the SERM. chagin2007 tested the first-generation SERM tamoxifen
  in cultured fetal rat metatarsals and in the human chondrocytic line HCS-2/8. Tamoxifen caused
  DOSE-DEPENDENT GROWTH RETARDATION. NO CATCH-UP GROWTH OCCURRED AFTER WASHOUT. And the mechanism is the
  worst possible one for this case: INCREASED APOPTOSIS OF CHONDROCYTES WITHIN THE RESTING AND HYPERTROPHIC
  ZONES, caspase-dependent, abolished by caspase-8 or caspase-9 inhibitors, running through FasL/Fas with
  caspase-8 activated first.
  THE RESTING ZONE IS THE POOL. Round 247 established that at bone age 16 remaining height is
  N_remaining x A x h_term, so N is what binds. A drug that kills resting-zone chondrocytes irreversibly
  spends the exact term the whole programme is trying to preserve. AND THE FIELD'S INTENT IS THE TELL: the
  paper's own framing is that SERMs were being explored as an alternative to high-dose oestrogen FOR
  LIMITING GROWTH IN TALL GIRLS. Tamoxifen is a height-REDUCING agent that works.

  FOUR - ERBETA IS FEMALE-ONLY, WHICH CLOSES THE OTHER HALF OF THAT LINE. Round 273 hoped ERbeta was the
  brake that reaches the AXIAL skeleton, since borjesson2010's cartilage-ERalpha effect is appendicular
  only. chagin2004 read in full: the entire study is FEMALE ERbeta-null, ERalpha-null and double-null mice.
  Four-month-old ERbeta-null females showed increased axial AND appendicular growth; 18-month-old
  ERalpha-null females had appendicular growth plates CONSISTENTLY FUSED, and that fusion was ERbeta-
  mediated because the double-nulls stayed unfused. No male data at all. The authors also flag their own
  confound - the ERalpha-null and double-null models have clearly raised serum oestradiol; the ERbeta-null
  does not.

  FIVE - AND THE PER-SITE DENOMINATOR IS CLOSED, ONE ROUND AFTER I SAID IT COULD NOT BE. Round 273
  concluded the literature stops where this subject starts, and named aeppli2025 as the cohort that might
  close it. It does, and I had not read it.
  BOYS, n = 27, BONE AGE 13.6 AT SURGERY, PREDICTED REMAINING GROWTH 20 cm. Bilateral epiphysiodesis around
  the knees reduced final height by 8.6 plus or minus 0.9 cm. AFTER surgery, SITTING HEIGHT rose 8.6 plus
  or minus 0.8 cm while LEG growth - total height gain minus sitting height gain - was only 2.3 plus or
  minus 0.8 cm.
  SO AT BONE AGE 13.6 IN BOYS THE SPLIT IS: KNEES 8.6 cm, TRUNK 8.6 cm, REST OF LEG 2.3 cm. Roughly 43 per
  cent, 43 per cent and 11 per cent.
  AND THE AGE DEPENDENCE IS STEEP AND MEASURED. Height reduction correlated with bone age at surgery at
  r = -0.63 (P < 0.001) in boys. Read off Figure 2, the regression runs from about 15.8 cm at bone age 12.2
  to about 4.0 cm at bone age 14.6 - a slope near -4.9 cm per bone-age year, crossing zero around bone age
  15.4. THE DATA ONLY SPAN 12.3 TO 14.5 AND THIS NODE DOES NOT EXTRAPOLATE PAST THAT.
  IT DOES NOT NEED TO, BECAUSE THE PAPER REPORTS THE TWO LATEST BOYS INDIVIDUALLY. At bone ages 14.2 and
  14.5 the height reductions were 0.3 cm and 0.4 cm - the knees were worth essentially NOTHING - while
  their UPPER BODY grew 9.0 cm and 6.5 cm and their legs 0.9 cm and 1.5 cm. BY BONE AGE ABOUT 14.5 IN BOYS,
  IN THIS POPULATION, THE KNEE PLATES CONTRIBUTE APPROXIMATELY ZERO AND ALMOST EVERYTHING LEFT IS TRUNK.
  This agrees with round 273's hori2025 shape - spine growth peaking later than total body growth - by a
  completely different method, and it puts numbers on it.

  SIX - AND THE OPERATOR'S OWN OBSERVATION SITS OUTSIDE THAT DISTRIBUTION, WHICH IS INFORMATION RATHER THAN
  A CONTRADICTION. The report is knee-driven growth on GH with open, active knee plates at bone age 16. The
  aeppli2025 population says knees are worth about zero by bone age 14.5. BOTH CAN BE TRUE ONLY IF THIS
  SUBJECT IS OFF THAT DISTRIBUTION - which is precisely the standing case description, late with reserve at
  multiple open sites, and is why CORR-195 forbids collapsing this case to any one compartment. The
  population numbers are a FLOOR and a prior, not a measurement of this subject. The operational reading is
  that the trunk is where the population says the residual is, and the knees are where the observed growth
  is, and neither should be abandoned for the other.
quantitative:
- parameter: >-
    ANASTROZOLE VERSUS LETROZOLE, RANDOMISED, IN PUBERTAL BOYS - MORE SUPPRESSION, NO MORE HEIGHT
  value: >-
    letrozole 2.5 mg gave LOWER estradiol, LOWER IGF-1, HIGHER testosterone, SLOWER growth velocity and
    SLOWER bone age advance than anastrozole 1.0 mg; change in predicted adult height from baseline did NOT
    differ between groups; the year-1 PAH increase seen in both arms did NOT persist at years 2 and 3;
    pooled 3-year PAH gain versus baseline +1.3 cm (P = 0.043)
  unit: cm of predicted adult height, and direction of hormone and velocity differences
  conditions: >-
    zegarra2024, open-label randomised trial at Stanford, 79 pubertal males aged 10 or more with bone age
    14 or less and predicted adult height below the 5th percentile or more than 10 cm below mid-parental
    height. Anastrozole 1.0 mg (n = 35) or letrozole 2.5 mg (n = 30) daily for up to 3 years, plus a year
    post-therapy. PRIMARY endpoint was change in PAH. Bone ages reread by a single blinded paediatric
    endocrinologist. Spine radiographs and DXA at baseline and 2 years. The paper states no RCT had
    previously compared the two.
  species: human
  source_ref: zegarra2024
  uncertainty: >-
    OPEN-LABEL, NOT BLINDED TO TREATMENT, AND THE ENDPOINT IS PREDICTED ADULT HEIGHT RATHER THAN ACHIEVED
    FINAL HEIGHT - Bayley-Pinneau prediction is itself computed FROM bone age, and the two arms differed in
    bone age advance, which couples the exposure to the outcome measure. Power was set at 80 per cent for
    n = 40 per arm and both arms under-recruited, so the absence of a between-group difference is not a
    demonstration of equivalence. The population is idiopathic short stature with normal IGF-1 and normal
    growth velocity at entry, and bone age 14 or less - YOUNGER AND LESS MATURE THAN THIS CASE. This is AI
    MONOTHERAPY; it does not test either drug alongside growth hormone.
- parameter: >-
    THE DOSE-ESCALATION QUESTION, ANSWERED WITHOUT ANYONE RUNNING IT
  value: >-
    letrozole 2.5 mg suppressed estradiol BELOW the level achieved by anastrozole 1 mg and produced NO
    additional predicted adult height
  unit: comparison of oestradiol suppression against height outcome
  conditions: zegarra2024, same trial, both arms.
  species: human
  source_ref: zegarra2024
  uncertainty: >-
    THIS IS AN INFERENCE FROM A BETWEEN-DRUG CONTRAST TO A WITHIN-DRUG DOSE CONTRAST AND IS NOT THE SAME
    EXPERIMENT. Anastrozole 2 mg has not been given to pubertal boys for height, so its effect is unknown.
    The two drugs also differ in more than potency - letrozole raised testosterone more, and higher
    testosterone is itself aromatisable substrate and has independent skeletal effects. What the trial does
    remove is the MECHANISM by which escalation was expected to help: on this axis, deeper oestradiol
    suppression did not convert into more predicted height.
- parameter: >-
    TAMOXIFEN CAUSES PERMANENT GROWTH ARREST BY KILLING RESTING-ZONE CHONDROCYTES
  value: >-
    dose-dependent growth retardation of cultured metatarsals with NO CATCH-UP GROWTH after washout;
    increased apoptosis of chondrocytes within the RESTING and HYPERTROPHIC zones; apoptosis
    caspase-dependent and completely abrogated by caspase-8 or caspase-9 inhibitors, with caspase-8
    activated first, then 9 and 3; FasL secretion stimulated and blockade of FasL or Fas reduced the
    apoptosis
  unit: metatarsal length, TUNEL, BrdU, caspase activation
  conditions: >-
    chagin2007, cultured fetal rat metatarsal bones plus the human chondrocytic cell line HCS-2/8 (FACS and
    cell-death ELISA). The paper's stated motivation is that SERMs were being explored as an alternative to
    high-dose oestrogen FOR LIMITING GROWTH in girls with predicted extreme tall stature.
  species: rat
  source_ref: chagin2007
  uncertainty: >-
    EX VIVO FETAL RAT METATARSAL - the preparation this file has been burned by repeatedly, and fetal rather
    than juvenile tissue. The human component is an immortalised chondrosarcoma-derived cell line, not
    primary human chondrocytes or a human plate. Doses are pharmacological and were chosen to produce an
    effect. What makes it decisive anyway is the DIRECTION plus the IRREVERSIBILITY plus the LOCATION: no
    catch-up after washout, and apoptosis specifically in the resting zone, which is the term round 247
    identifies as binding at bone age 16. A class effect across SERMs is assumed here and NOT demonstrated -
    raloxifene and bazedoxifene have not been tested in this preparation.
- parameter: >-
    THE PER-SITE DENOMINATOR IN BOYS - KNEES, TRUNK AND RESIDUAL LEG, MEASURED TO FINAL HEIGHT
  value: >-
    boys n = 27, bone age 13.6 plus or minus 0.1 at surgery, predicted remaining growth 20 cm: bilateral
    knee epiphysiodesis reduced final height by 8.6 plus or minus 0.9 cm; after surgery SITTING HEIGHT rose
    8.6 plus or minus 0.8 cm and LEG growth was 2.3 plus or minus 0.8 cm. The two boys operated latest, at
    bone ages 14.2 and 14.5, had height reductions of only 0.3 and 0.4 cm while their upper body grew 9.0
    and 6.5 cm and their legs 0.9 and 1.5 cm
  unit: cm to final height, by segment
  conditions: >-
    aeppli2025, 72 patients (45 girls, 27 boys) with extreme tall stature at Karolinska, bilateral
    epiphysiodesis around the knees, all followed to FINAL HEIGHT. Height and sitting height measured by an
    experienced professional with a Harpenden stadiometer; leg length computed as total height minus
    sitting height; bone age by Greulich and Pyle read by two blinded experts with re-reading if they
    diverged by more than 0.5 years. Height reduction correlated with bone age at surgery, r = -0.63,
    P < 0.001 in boys. Girls, at bone age 12.1: sitting height +8.0 plus or minus 0.5 cm, leg growth +0.2
    plus or minus 0.4 cm.
  species: human
  source_ref: aeppli2025
  uncertainty: >-
    THE POPULATION IS EXTREME TALL STATURE - mean predicted final height 208.4 cm in boys - AND SELECTED FOR
    RELATIVELY LONG LEGS, since a relative sitting height below the mean was an INCLUSION CRITERION. That
    biases the leg-to-trunk split of the residual in the leg's favour at entry, which if anything
    strengthens the finding that the trunk dominates late. Six patients had Marfan syndrome and three
    Klinefelter. The knee figure is what epiphysiodesis REMOVED, so it is the distal femoral plus proximal
    tibial contribution and not all leg growth - the 2.3 cm residual leg growth is hip, ankle, foot and
    incomplete ablation combined. THE FIGURE 2 REGRESSION SPANS BONE AGE 12.3 TO 14.5 ONLY; the slope of
    about -4.9 cm per bone-age year and the zero crossing near 15.4 are read off the published line and
    MUST NOT be extrapolated to bone age 16, which is why the two individually-reported late boys carry
    this row instead.
localization:
- 'resting zone: where tamoxifen kills chondrocytes, and the term that binds at bone age 16'
- 'distal femoral and proximal tibial physes: worth 8.6 cm at bone age 13.6 in boys and about zero by 14.5'
- 'trunk / sitting height: 8.6 cm at bone age 13.6 in boys and almost the entire residual by 14.5'
human_evidence: direct
human_evidence_note: >-
  Two direct human datasets - a randomised head-to-head of the two aromatase inhibitors with predicted adult
  height as primary endpoint, and a 72-patient epiphysiodesis cohort followed to final height with sitting
  height measured throughout. The tamoxifen and ERbeta results are animal.
species_basis:
- human
- rat
- mouse
translation_risk: moderate
translation_risk_reason: >-
  The two decision-relevant datasets are human, but both populations differ from this case - short stature
  at bone age 14 or less, and extreme tall stature at bone age 13.6 - and neither spans bone age 16.
confidence: B
confidence_reason: >-
  The aromatase answer rests on the only randomised head-to-head that exists, with a prespecified primary
  endpoint and blinded bone-age re-reading. The denominator rests on a 72-patient cohort followed to final
  height with segment measurements. Graded B rather than A because the RCT is open-label with a
  prediction-based endpoint coupled to the exposure, and the epiphysiodesis cohort is an extreme-tall-stature
  population selected for long legs.
claim_grades:
- claim: >-
    Letrozole is superior to anastrozole for height augmentation in pubertal boys.
  grade: X
  basis: >-
    THE ONLY RANDOMISED HEAD-TO-HEAD SAYS NO. zegarra2024 - change in predicted adult height did not differ
    between arms over three years, while letrozole gave lower estradiol, LOWER IGF-1, slower growth velocity
    and slower bone age advance. More suppression, no more height, and a measured cost in IGF-1.
- claim: >-
    Deeper aromatase suppression buys more height on this axis.
  grade: X
  basis: >-
    NOT IN THE ONE EXPERIMENT THAT VARIED IT. Letrozole 2.5 mg drove oestradiol below anastrozole 1 mg and
    produced no additional predicted adult height. That is the mechanism by which escalating anastrozole to
    2 mg was expected to help, and it did not operate. It does not prove 2 mg is useless, because nobody has
    given it.
- claim: >-
    Aromatase inhibitor monotherapy produces a large height gain in pubertal boys.
  grade: X
  basis: >-
    Pooled across both arms the three-year gain in predicted adult height was +1.3 cm (P = 0.043), and the
    year-1 gain did not persist into years 2 and 3. The authors conclude efficacy as monotherapy may be
    limited and that safety remains an issue. This is consistent with round 254's ceiling and tightens it.
- claim: >-
    A SERM is a viable route to blocking oestrogen action at the growth plate.
  grade: X
  basis: >-
    TAMOXIFEN CAUSES PERMANENT GROWTH ARREST BY KILLING RESTING-ZONE CHONDROCYTES - dose-dependent growth
    retardation with NO CATCH-UP after washout, caspase- and FasL/Fas-dependent apoptosis in the RESTING and
    hypertrophic zones. The resting zone is the pool that binds at bone age 16. And the field was exploring
    SERMs precisely as height-REDUCING agents for tall girls. Class effect across SERMs is assumed, not
    demonstrated.
- claim: >-
    ERbeta is the oestrogen brake that reaches the axial skeleton and could be exploited in this subject.
  grade: X
  basis: >-
    chagin2004 is FEMALE MICE ONLY - female ERbeta-null, ERalpha-null and double-null. No male data exists in
    it, and windahl2009 records ERbeta as modulating growth in female but not male mice. Round 273 hoped
    this was the axial-reaching lever; for a male subject it is unsupported.
- claim: >-
    At bone age 16 in boys the knee physes still carry a large share of remaining height.
  grade: D
  basis: >-
    THE POPULATION DATA SAY NO, WITH A CAVEAT THAT MATTERS HERE. In aeppli2025 the two boys operated at bone
    ages 14.2 and 14.5 gained only 0.3 and 0.4 cm from knee epiphysiodesis while their trunks grew 9.0 and
    6.5 cm, and the group regression (r = -0.63) trends to zero around bone age 15.4. Graded D and not X
    because n = 2 at the late end, the cohort is extreme tall stature selected for long legs, and an
    individual with radiographically open and demonstrably active knee physes at bone age 16 is by
    construction off this distribution - which is the standing description of this case.
- claim: >-
    The per-site remaining-growth denominator cannot be obtained from the existing literature.
  grade: X
  basis: >-
    ROUND 273 SAID THIS AND IT WAS WRONG BY ONE PAPER - the one that round itself named as the cohort that
    could close it. aeppli2025 measured sitting height and computed leg length to FINAL HEIGHT in 27 boys at
    a known bone age, giving knees 8.6 cm, trunk 8.6 cm and residual leg 2.3 cm at bone age 13.6.
key_refs:
- ref_id: zegarra2024
  pmid: '39262574'
  year: 2024
  type: primary
  one_line_finding: >-
    The only randomised head-to-head - anastrozole 1 mg versus letrozole 2.5 mg in 79 pubertal boys over 3
    years, letrozole giving lower estradiol, lower IGF-1, slower velocity and slower bone age advance with
    NO difference in predicted adult height; pooled 3-year gain +1.3 cm
- ref_id: chagin2007
  pmid: '17293177'
  year: 2007
  type: primary
  one_line_finding: >-
    Tamoxifen causes dose-dependent growth retardation with NO catch-up after washout, through caspase- and
    FasL/Fas-dependent apoptosis of chondrocytes in the RESTING and hypertrophic zones - a SERM that
    permanently spends the pool
- ref_id: aeppli2025
  pmid: '38402874'
  year: 2025
  type: primary
  one_line_finding: >-
    THE DENOMINATOR - in 27 boys at bone age 13.6 with 20 cm predicted remaining, knee epiphysiodesis
    removed 8.6 cm while sitting height went on to gain 8.6 cm and the legs only 2.3 cm; at bone ages 14.2
    and 14.5 the knees were worth 0.3 and 0.4 cm
- ref_id: chagin2004
  pmid: '14753739'
  year: 2004
  type: primary
  one_line_finding: >-
    FEMALE MICE ONLY - ERbeta inhibits axial and appendicular growth in young adult females and mediates the
    growth plate fusion seen in old ERalpha-null females, with double-nulls staying unfused; no male data
- ref_id: hori2025
  pmid: '40343231'
  year: 2025
  type: primary
  one_line_finding: >-
    The independent agreement by a different method - spine height growth peaks later than total body
    growth, so the trunk's share of the residual rises with maturity
contradicts: >-
  CORRECTS round254_the_final_height_roi_table_and_the_two_stack_changes_it_forces, which ranked letrozole
  above anastrozole on attained height at 4.2 cm versus 0.8 cm - figures drawn from separate
  non-randomised sources. The only randomised head-to-head finds NO difference in predicted adult height
  between the two, with letrozole paying in IGF-1, growth velocity and bone age advance.
  CORRECTS round273_the_per_site_denominator_is_not_free_because_every_cohort_ends_where_this_subject_starts,
  which concluded the per-site denominator could not be obtained and named aeppli2025 as the cohort that
  might close it; it does close it, and I had not read it.
  CLOSES the SERM route implied by rounds 269, 270 and 272 - chagin2007 shows tamoxifen permanently arrests
  growth by apoptosis of RESTING ZONE chondrocytes, and chagin2004 shows the ERbeta arm is female-mice-only.
