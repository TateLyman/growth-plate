id: round294_the_hedgehog_arm_and_the_stack_are_in_series_through_the_cilium_and_nobody_has_measured_the_sign
name: >-
  ROUND 294 - the answer to "can we dose it and add it to the stack". HHIP cannot be dosed today; no agent
  exists in any species. The hedgehog thing that CAN be dosed is a Smoothened agonist in a proven
  growth-plate vehicle - and that is the arm most exposed to a collision nobody in this file had noticed.
  FGFR3 sits UPSTREAM of hedgehog THROUGH THE PRIMARY CILIUM, so the stack's lead agent and the lever we
  want are IN SERIES, not parallel. The relationship is biphasic and in NORMAL animals an FGFR inhibitor
  SHORTENS cilia in every tissue tested. The sign in a wild-type growth plate has never been measured, and
  it is the gate
aliases:
- round 294
- can we dose HHIP - no
- FGFR3 and hedgehog are in series through the cilium
- the biphasic cilium
- the gate on adding a hedgehog arm
type: hypothesis
layer: L12
stub: false
summary: >-
  THE QUESTION WAS WHETHER THE HEDGEHOG LEVER CAN BE DOSED AND ADDED. THE ANSWER HAS THREE PARTS AND ONLY
  THE THIRD IS ACTIONABLE.

  ONE - STEP 0 OF THE PRE-ROUND CHECKLIST, RUN HONESTLY. Which term of the height identity does hedgehog
  move, and which arm already in the stack moves it? HEDGEHOG MOVES N. trompet2024's intra-articular arm is
  unambiguous: resting-zone Pthrp-positive cells rose 65.5 to 139.8 per mm squared with proliferation in the
  top 50 microns unchanged AND terminal hypertrophic cell height unchanged - N up with lambda and h_term
  held. haraguchi2025 agrees from the genetic side: plate AREA up 41 and 52 per cent with zones widened but
  ORDERED. ERDAFITINIB MOVES lambda AND h_term - round 265 settled discharge as CREB, downstream of FGFR3
  and ERK-independent, and horike2026 shows the Fgfr3-Ach resting zone is JAMMED rather than large, with
  CREB the mechanism and a CREB inhibitor restoring bone length. DIFFERENT TERMS. On the arithmetic of the
  height identity this passes step 0 where LUM-201 failed: hedgehog is an addition, not a substitution.

  TWO - AND THEN THE TOPOLOGY KILLS THE CLEAN VERSION OF THAT ARGUMENT. Different TERMS is not the same as
  different PATHWAYS, and this atlas has never held the paper that connects them. kunovabosakova2018:
  FGFR SIGNALLING CONTROLS THE PRIMARY CILIUM, AND THE PRIMARY CILIUM IS WHERE ALL HEDGEHOG TRANSDUCTION
  HAPPENS - SMO must translocate into it and GLI processing occurs there. Achondroplasia and thanatophoric
  dysplasia growth plates have significantly SHORTENED cilia in vivo; the authors call these disorders
  ciliopathies. FGFR3 IS NOT PARALLEL TO HEDGEHOG. IT IS UPSTREAM OF IT.
  That is why ye2026 works at all: in Fgfr3 V376D chondrocytes, single-cell RNA-seq shows hedgehog and
  ciliogenesis genes markedly downregulated with IHH protein and acetylated alpha-tubulin both reduced by
  Western blot, and a Smoothened agonist restores them.

  THREE - AND THE RELATIONSHIP IS BIPHASIC, WITH THE WILD-TYPE DIRECTION BEING THE UNFAVOURABLE ONE. This
  is the finding that changes the recommendation. kunovabosakova2018 separates two regimes: SUSTAINED FGF
  activation SHORTENS cilia - the achondroplasia case - while TRANSIENT OR PHYSIOLOGIC FGF activation
  ELONGATES them, via ERK MAP kinase and mTORC2 but not mTORC1, by raising intraflagellar transport
  velocity.
  THE EXPERIMENT THAT MATTERS FOR THIS SUBJECT: normal mice given the FGFR inhibitor AZD4547 systemically
  for 28 days had SIGNIFICANTLY SHORTER CILIA, P < 0.001, IN ALL THREE TISSUES EXAMINED - biliary duct,
  kidney proximal tubule and lung bronchus. Suppressing PHYSIOLOGIC FGFR signalling shortens the organelle
  that hedgehog needs.
  THIS SUBJECT DOES NOT HAVE AN FGFR3 GAIN-OF-FUNCTION MUTATION. He has wild-type FGFR3 and is taking a
  pan-FGFR inhibitor. So the relevant regime is the second one, and the prediction is that erdafitinib
  SHORTENS his chondrocyte cilia rather than lengthening them. NOT REDUNDANCY WITH A HEDGEHOG LEVER -
  POTENTIAL ANTAGONISM OF IT.
  BUT THE SAME PAPER CONTAINS THE OPPOSITE ARM AND IT MUST BE STATED WITH EQUAL WEIGHT: FGF2 PARTIALLY
  COUNTERACTED SAG-mediated degradation of the GLI3 REPRESSOR and the corresponding induction of Gli1 and
  Ptch1. So FGF signalling SUPPRESSES hedgehog transcriptional output while SUPPORTING the ciliary apparatus
  that transduces it. Removing FGF signalling should therefore RAISE Gli output and SHORTEN cilia at the
  same time. TWO ARMS, OPPOSITE SIGNS, AND THE NET IS UNMEASURED.

  FOUR - SO WHAT IS ACTUALLY DOSABLE, STATED WITHOUT OPTIMISM.
  HHIP ITSELF: NOTHING. Round 291 found three handles - the GAG clamp, the HHIP-N CRD pocket, an Fc-HHIP
  that runs the wrong way - and not one is a molecule that lowers HHIP function in an animal. The GAG clamp
  is validated by a six-residue charge-reversal mutant; the pocket is a homology prediction with no ligand;
  the RNA route rests on a lncRNA whose two bone papers disagree and whose mouse orthologue has zero
  publications. HHIP CANNOT BE ADDED TO THIS STACK. That is the honest answer and it does not improve by
  being restated.
  THE HEDGEHOG PATHWAY: YES, AND THE VEHICLE IS SOLVED. ye2026's CT-CM-NPs carried purmorphamine to growth
  plate cartilage from a TAIL VEIN at 1 mg/kg every two days for five weeks. But purmorphamine is a
  SMOOTHENED AGONIST, which is (a) the arm most exposed to the cilium problem above, since SMO must enter
  the cilium to work, and (b) the CORR-300 category that SUBTRACTS length in a normal pathway - flooding
  with an agonist rather than removing a secreted antagonist. ye2026's gain was in a hedgehog-DEFICIENT
  plate, where flooding is restoration; CORR-203 applies. THIS SUBJECT'S PLATE IS NOT HEDGEHOG-DEFICIENT -
  unless erdafitinib has made it so, which is exactly the unmeasured question.

  FIVE - THEREFORE THE GATE, AND IT IS ONE CHEAP EXPERIMENT. Before any hedgehog agent is added to this
  stack, someone must give an FGFR inhibitor to a NORMAL growing animal and measure, in the GROWTH PLATE:
  primary cilium length, Gli1 and Ptch1 transcript, and bone length. Nobody has. kunovabosakova2018's cilia
  data are biliary duct, kidney and lung - NOT CARTILAGE - and its Gli3-repressor data are NIH3T3
  fibroblasts. The one manipulation that would tell us whether the stack's lead agent is helping or hurting
  the lever we want to add has never been run, and it needs no new chemistry.
  IF CILIA SHORTEN AND Gli1 FALLS: erdafitinib is costing hedgehog tone, a hedgehog arm is CORRECTIVE rather
  than additive, and the combination is favourable for a reason nobody has articulated.
  IF Gli1 RISES: erdafitinib is already a partial hedgehog-elevating agent and a SMO agonist on top is the
  LUM-201 trap in a new costume.
  Those two outcomes point opposite ways and the file currently cannot distinguish them.

  SIX - AND A PRIMARY-DATA COST ON THE PAN-FGFR CLASS THAT THIS ATLAS DID NOT HOLD. gudernova2016 tested
  five FGFR TKIs - SU5402, PD173074, AZD1480, AZD4547, BGJ398. ALL of them strongly inhibited FGFR in
  cultured chondrocytes and limb rudiments and completely relieved FGFR-mediated inhibition of proliferation
  and maturation. IN NEWBORN MICE THE SAME COMPOUNDS DID NOT IMPROVE SKELETAL GROWTH AND WERE LETHALLY TOXIC
  TO LIVER, LUNG AND KIDNEY. None was selective for FGFR3 over FGFR1, 2 or 4, and all showed significant
  off-target activity across 14 unrelated tyrosine kinases.
  THIS DOES NOT REOPEN THE SETTLED ERDAFITINIB-OVER-VOSORITIDE RANKING - that was decided on topology and is
  a COMPARISON between two agents, which gudernova2016 does not make, and erdafitinib is not among the five
  tested. What it does is convert the atlas's general "pan-FGFR has FGFR1/2/4 liabilities" line into primary
  data, and it converges with the cilium finding from the same laboratory: pan-FGFR inhibition of a normal
  animal shortens cilia and, in newborns, failed to grow bone at all. IT IS THE STRONGEST ARGUMENT IN THIS
  FILE FOR ISOFORM-SELECTIVE FGFR3 - dabogratinib - OVER ANY PAN-FGFR AGENT, and dabogratinib remains
  unobtainable.
human_evidence: absent
human_evidence_note: >-
  No human data anywhere in this node. The cilium experiments are mouse and cell line; the FGFR TKI toxicity
  is newborn mouse; the delivery vehicle is mouse. The only human anchor in the surrounding argument is
  external - kosmicki2026's HHIP effect sizes and round 292's human growth-plate expression. No human has
  received a hedgehog-directed agent for growth, and the human record on this axis is entirely in the
  withdrawal direction where it is grade A for HARM (irreversible physeal fusion in children).
species_basis:
- mouse
translation_risk: high
translation_risk_reason: >-
  The load-bearing cilium result is in biliary duct, kidney tubule and lung bronchus rather than cartilage,
  with a different FGFR inhibitor from the one in this stack, in mice rather than humans. The transcriptional
  arm is NIH3T3 fibroblasts. The conclusion drawn here is deliberately NOT a mechanism but a GAP - that the
  sign is unmeasured - which is the one claim that does not require translation to hold. Everything else is
  a reason to measure before acting.
confidence: B
confidence_reason: >-
  The topology claim - that hedgehog transduction requires the primary cilium and that FGFR signalling
  regulates cilium length - is well established and multiply demonstrated in kunovabosakova2018 by in vivo
  and in vitro routes. The biphasic direction and the AZD4547 in-vivo result are that paper's own primary
  data at P < 0.001. What is held at B rather than A is the TRANSFER to a wild-type human growth plate on
  erdafitinib, which is an inference across tissue, species, compound and genotype. The node's operative
  output is a refusal to recommend and a specified experiment, both of which are appropriate at B.
claim_grades:
- claim: >-
    HHIP can be added to this stack now.
  grade: X
  basis: >-
    NO. No HHIP-directed agent exists in any species. Round 291's three handles are a charge-reversal mutant
    protein, a homology-predicted pocket with no ligand, and an Fc-HHIP that runs the wrong direction; the
    RNA route rests on a lncRNA whose two bone papers directly contradict each other and whose mouse
    orthologue Gm53441 has zero publications. Recorded as X so that the strength of the target validation is
    not mistaken for availability.
- claim: >-
    Hedgehog and erdafitinib move different terms of the height identity, so the hedgehog arm is an addition
    rather than a substitution.
  grade: B
  basis: >-
    Hedgehog moves N: trompet2024's intra-articular arm raised resting-zone Pthrp-positive cells 65.5 to
    139.8 per mm squared with proliferation and terminal hypertrophic cell height both unchanged.
    Erdafitinib moves lambda and h_term: round 265 settled discharge as CREB downstream of FGFR3, and
    horike2026 shows the Fgfr3-Ach resting zone is a jam relieved by a CREB inhibitor. This passes step 0 of
    the pre-round checklist, which LUM-201 failed. It is an argument about TERMS and is not disturbed by the
    pathway topology below.
- claim: >-
    FGFR3 is parallel to hedgehog in the growth plate.
  grade: X
  basis: >-
    FALSE AND THE ATLAS DID NOT HOLD THE PAPER. kunovabosakova2018 establishes that FGFR signalling
    regulates primary cilium length and intraflagellar transport velocity, and hedgehog transduction occurs
    entirely within the cilium - SMO translocates into it and GLI processing happens there. ACH and TD
    growth plates have significantly shortened cilia in vivo and the authors classify these as ciliopathies.
    ye2026 independently finds hedgehog and ciliogenesis genes downregulated with IHH protein reduced in
    Fgfr3 V376D chondrocytes. FGFR3 IS UPSTREAM OF HEDGEHOG, THROUGH THE CILIUM.
- claim: >-
    An FGFR inhibitor given to a normal animal shortens primary cilia.
  grade: B
  basis: >-
    kunovabosakova2018: normal mice treated systemically with AZD4547 for 28 days had significantly shorter
    cilia (P < 0.001) in ALL THREE tissues examined - biliary duct, kidney proximal tubule, lung bronchus -
    irrespective of their differing FGFR expression profiles. Together with the finding that transient and
    physiologic FGF activation ELONGATES cilia via ERK and mTORC2, this establishes that physiologic FGFR
    tone supports the organelle. NOT MEASURED IN CARTILAGE, and AZD4547 is not erdafitinib.
- claim: >-
    Therefore erdafitinib lowers hedgehog output in this subject's growth plate.
  grade: E
  basis: >-
    PLAUSIBLE, UNMEASURED, AND THE SAME PAPER CONTAINS THE OPPOSITE ARM. FGF2 partially counteracted
    SAG-mediated GLI3-repressor degradation and the induction of Gli1 and Ptch1, so FGF signalling also
    SUPPRESSES hedgehog transcriptional output. Removing it should raise Gli output while shortening cilia.
    Two arms with opposite signs and no measurement of the net in a growth plate, in any species. This is
    the gap, not the finding, and it is graded E deliberately.
- claim: >-
    A Smoothened agonist can be delivered to a human growth plate today.
  grade: D
  basis: >-
    The VEHICLE is real - ye2026's CT-CM-NPs, chondrocyte-membrane-coated PLGA with the collagen-II peptide
    WYRGRL, carried purmorphamine to growth plate cartilage from a tail vein at 1 mg/kg every two days for
    five weeks. But the atlas already records that delivery is quantified only as normalised DiR
    fluorescence with no absolute concentration, no AUC and no half-life, and the authors could not obtain
    human growth plate to validate in. It is a mouse platform. And on the efficacy side a SMO agonist is
    both the arm most exposed to the cilium interaction and the CORR-300 category that subtracts length in a
    normal pathway - ye2026's gain was restoration in a hedgehog-deficient plate.
- claim: >-
    Pan-FGFR inhibitors failed to grow bone in vivo despite complete target engagement in vitro.
  grade: B
  basis: >-
    gudernova2016. Five TKIs, all strongly inhibiting FGFR in chondrocytes and limb rudiments and completely
    relieving FGFR-mediated inhibition of proliferation and maturation - yet no improvement in skeletal
    growth in newborn mice, with lethal hepatic, pulmonary and renal toxicity, no FGFR3 selectivity over
    FGFR1/2/4, and off-target activity across 14 unrelated kinases. DOES NOT REOPEN the settled
    erdafitinib-over-vosoritide ranking, which is a comparison this paper does not make, and erdafitinib is
    not among the five. It is the primary evidence behind the atlas's isoform-selective preference.
key_refs:
- ref_id: kunovabosakova2018
  pmid: '29360984'
  year: 2018
  type: primary
  one_line_finding: >-
    FGFR signalling controls the primary cilium and therefore sits upstream of all hedgehog transduction;
    the relationship is biphasic, and an FGFR inhibitor given to NORMAL mice shortened cilia in all three
    tissues examined at P < 0.001, while FGF2 separately opposed hedgehog transcriptional output via GLI3R
- ref_id: gudernova2016
  pmid: '26494904'
  year: 2016
  type: primary
  one_line_finding: >-
    Five pan-FGFR TKIs relieved FGFR-mediated inhibition of chondrocyte proliferation completely in vitro
    and produced no skeletal growth improvement plus lethal organ toxicity in newborn mice, with no FGFR3
    selectivity and off-target activity across 14 kinases
- ref_id: ye2026
  pmid: '42338508'
  year: 2026
  type: primary
  one_line_finding: >-
    The delivery problem is solved - chondrocyte-membrane-coated collagen-II-targeting nanoparticles carried
    a Smoothened agonist to growth plate cartilage from a tail vein - but the payload is the arm most
    exposed to the cilium interaction and the gain was restoration in a hedgehog-deficient plate
- ref_id: trompet2024
  pmid: '38516888'
  year: 2024
  type: primary
  one_line_finding: >-
    Establishes that the hedgehog lever moves N specifically - resting-zone Pthrp-positive cells 65.5 to
    139.8 per mm squared with proliferation and terminal hypertrophic cell height both unchanged
- ref_id: martin2022
  pmid: '35078974'
  year: 2022
  type: primary
  one_line_finding: >-
    The cilium is pharmacologically manipulable with a length endpoint - (-)-epicatechin rescued growth-plate
    ciliogenesis and increased bone elongation in Fgfr3 Y367C/+ mice, though in a deficit model
contradicts: >-
  Does not overturn a prior node, and specifically DOES NOT reopen the SETTLED erdafitinib-over-vosoritide
  ranking (R263, R265) - gudernova2016 makes no comparison between those agents and does not test
  erdafitinib. It adds a pathway relation the atlas did not hold: FGFR3 is UPSTREAM of hedgehog via the
  primary cilium rather than parallel to it, which means the hedgehog arm and the stack's lead agent
  interact by a route nobody in this file had considered.
  It also constrains rounds 290 to 293 in the practical direction. Those rounds established HHIP as the
  best-validated lever in the atlas. This one establishes that it cannot be dosed, that the dosable
  substitute is in the wrong CORR-300 category, and that the interaction with the existing stack has an
  unmeasured sign. The target survives; the protocol does not yet exist.
