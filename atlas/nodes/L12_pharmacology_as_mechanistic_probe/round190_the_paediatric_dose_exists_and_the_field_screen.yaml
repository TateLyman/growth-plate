id: round190_the_paediatric_dose_exists_and_the_field_screen
name: ROUND 190 - a decade of PTH(1-34) in children at 0.75 to 1.49 mcg/kg/day with normal height
  velocity and final heights at or above target, and the first systematic screen of the field
aliases:
- the paediatric dose
- winer2018
- the 275-paper screen
- round 190
type: intervention
layer: L12
stub: false
summary: 'FOUR PDFs AND A SYSTEMATIC SCREEN. The dosing question is now answered by a decade of
  paediatric experience rather than by scaling from rodents, the missing PNAS endpoint is definitively
  resolved, and the field has been enumerated for the first time.

  THE DOSE EXISTS AND IT IS PAEDIATRIC. winer2018 followed 14 children with hypoparathyroidism - five
  APS-1 aged 7 to 12 and nine CaSR-variant aged 7 to 16 - on subcutaneous PTH(1-34) for a MEAN OF 6.9
  PLUS OR MINUS 3.1 YEARS, RANGE 1.5 TO 10 YEARS. Mean dose 0.75 plus or minus 0.15 micrograms per
  kilogram per day, given as 0.35 plus or minus 0.08 per injection TWICE OR THRICE DAILY, with an
  individual range of 0.2 to 1.49 micrograms per kilogram per day and 8 to 108 micrograms per day
  absolute. FOR A 60 KG SUBJECT THAT MEAN IS 45 MICROGRAMS A DAY AND THE TOP OF THE RANGE IS 89 - which
  is 2.3-fold and 4.5-fold the approved adult teriparatide dose on a per-kilogram basis. This is not an
  extrapolation. It is what children actually received, for up to a decade, with semiannual monitoring
  at the NIH Clinical Center.

  AND MEAN HEIGHT VELOCITY WAS NORMAL FOR AGE THROUGHOUT THE STUDY. Renal function remained stable in
  the 192-patient companion cohort (winer2021). Bone accretion velocities were normal; distal one-third
  radius accrual was reduced in years one and two and normalised in years three to five; total hip
  accrual was ABOVE average in years two and four.

  THE FINAL-HEIGHT DATA, WHICH IS THE POINT. All patients but three reached adult height during
  treatment. APS-1 patients B, C and D finished 8 TO 12 CENTIMETRES BELOW sex-adjusted midparental
  height. By contrast ALL CaSR PATIENTS EXCEPT ONE ATTAINED MIDPARENTAL HEIGHT, AND TWO EXCEEDED IT BY 4
  AND 6 CENTIMETRES. Patient H is the informative case: twice-daily at 1.4 micrograms per kilogram per
  day - 40.2 micrograms a day - for treatment years 0.5 to 6, then thrice-daily at 0.54 for years 6.5 to
  10, and exceeded midparental height by 4 cm.

  AND THE APS-1 SHORTFALL HAS AN EXPLANATION THAT IS NOT PTH. The paper records that APS-1 Addison''s
  disease was treated with thrice-daily oral steroid at 15 mg per square metre, which it explicitly
  calls HIGHER THAN TYPICALLY REQUIRED FOR PHYSIOLOGIC REPLACEMENT. Supraphysiologic glucocorticoid is
  among the most potent growth suppressants known. The between-group difference that winer2025 reports
  as an age-by-group interaction is therefore not a PTH effect and not evidence about PTH at all.

  WHAT THIS DOES TO THE POOL QUESTION. Round 183 established that growth hormone buys elongation almost
  entirely by consuming the resting pool faster, and the signature of that is a plate that runs out
  early. A DECADE OF PTH1R AGONISM AT UP TO 4.5-FOLD THE APPROVED ADULT PER-KILOGRAM DOSE, SPANNING THE
  ENTIRE GROWTH PERIOD, WITH NORMAL HEIGHT VELOCITY THROUGHOUT AND FINAL HEIGHTS AT OR ABOVE TARGET, IS
  THE OPPOSITE OF THAT SIGNATURE. It does not show the drug raises yield - height velocity was normal,
  not supranormal - but it is strong evidence the drug does not SPEND the plate. Held at D: replacement
  dosing in a disease population, n = 9 in the informative arm, and midparental height has a standard
  deviation of roughly 8 to 9 centimetres so two children exceeding it by 4 and 6 cm is unremarkable in
  isolation.

  THE PNAS SUPPLEMENT RESOLVES THE MISSING ENDPOINT - AND THE ANSWER IS THAT IT WAS NEVER MEASURED.
  Tibia length appears in every GENOTYPE-comparison table in liao2026 (Tables S5, S7, S9, S11, S13). It
  appears in NONE of the DRUG-treatment tables (S15 to S18). The abaloparatide arm reports trabecular
  and cortical microarchitecture only. So the question can be closed: nobody measured it.

  BUT THE NUMBERS THAT ARE THERE ARE STRIKING AND THEY CUT BOTH WAYS. In WILD-TYPE mice, abaloparatide
  at 5 micrograms per kilogram per day for 30 days from one month of age produced trabecular bone volume
  up 189 PER CENT (10.05 to 29.04), bone mineral density up 115 per cent, trabecular number up 215 per
  cent, connectivity up 648 per cent and connectivity density up 504 per cent, with trabecular
  separation down 66 per cent and thickness down 8 per cent. FIRST, THAT SETTLES THAT 5 MICROGRAMS PER
  KILOGRAM PER DAY IS A POWERFULLY ACTIVE DOSE and not a threshold, which strengthens the round-188
  point that the approved human doses are not obviously too low. SECOND, IT IS A VERY LARGE PERTURBATION
  OF THE METAPHYSIS OF A GROWING ANIMAL, and the primary spongiosa has to be resorbed for the plate to
  advance. Whether near-tripling trabecular bone directly beneath the plate impedes that is unknown and
  nobody has asked.

  THREE MORE THINGS FROM THE SCREEN. trompet2024 - which this atlas already held as the only pool
  intervention with a length endpoint - turns out to act THROUGH Pthrp-creER epiphyseal skeletal stem
  cells, and its length effect was MORE PRONOUNCED AT TWO AND SIX MONTHS than at one. An effect that
  grows over six months is not a pool being spent. hosokawa2015 shows PTH RESETS THE CHONDROCYTE
  CIRCADIAN CLOCK IN A CIRCADIAN-TIME-DEPENDENT MANNER, which upgrades the round-187 evening-dosing
  argument from a bare inference to something with a demonstrated time-dependence behind it - and makes
  consistency of clock time a requirement rather than a nicety. And toribio2010, the parent of
  hashmi2026, shows the PTHrP knock-in lacking midregion, NLS and C-terminus has fewer chondrocytes AND
  osteoblasts, decreased bone mass, chondrodysplasia and death by day five, concluding that many PTHrP
  effects are NOT mediated by the N terminus. The composition objection stands: a 1-34 fragment
  reproduces one arm of a polyhormone.

  THE FIELD SCREEN, BECAUSE THE STANDING INSTRUCTION IS TO CLEAR EVERY PAPER. The full space of PTH1R
  agonist against growth plate is 2,727 records - not screenable one by one and not all relevant. The
  DECISION-RELEVANT slice, requiring both a growth-plate term and a length or growth endpoint, is 275
  records. All 275 were retrieved and triaged, leaving 131 candidates. The highest-priority five have
  been read this round. THAT IS 131 CANDIDATES OF WHICH ROUGHLY 25 ARE NOW READ IN FULL OR IN ABSTRACT
  ACROSS ROUNDS 184 TO 190. The remaining approximately 106 are enumerated in the round-190 archive and
  are the honest measure of what "100 per cent sure" still requires.'
