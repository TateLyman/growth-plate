localization:
- 'the metaphyseal primary spongiosa, where abaloparatide nearly tripled trabecular bone in growing mice
  and where the plate must resorb to advance'
human_evidence: direct
human_evidence_note: 'winer2018 is direct human evidence: 14 children on PTH(1-34) at 0.75 +/- 0.15
  micrograms per kilogram per day for a mean of 6.9 years, with normal height velocity throughout and
  final adult heights recorded against midparental height. winer2021 adds 192 patients aged 2 to 74 with
  stable renal function on long-term therapy. It is replacement dosing in hypoparathyroidism, so it
  establishes tolerability and the absence of growth truncation rather than efficacy in a normal child.'
species_basis:
- human
- mouse
- rat
translation_risk: moderate
translation_risk_reason: 'Downgraded from high. The dose no longer requires interspecies scaling - there
  is a decade of paediatric dosing at 0.75 to 1.49 micrograms per kilogram per day with growth measured.
  What still requires extrapolation is whether a drug that produces NORMAL height velocity in
  hypoparathyroid children produces SUPRANORMAL velocity in a eucalcaemic adolescent, which is a
  different question and is unaddressed by any human data.'
confidence: C
claim_grades:
- claim: The right dose has to be scaled from animal studies because no human paediatric dosing exists.
  grade: X
  basis: 'FALSE, AND IT INVALIDATES THE FRAMING OF ROUNDS 184 AND 187. winer2018 documents 14 children on
    0.75 +/- 0.15 micrograms per kilogram per day, range 0.2 to 1.49, twice or thrice daily, for a mean
    of 6.9 years and up to 10. For a 60 kg subject that is 45 micrograms a day at the mean and 89 at the
    top. The body-surface-area scaling exercises in rounds 184 and 187 were answering a question that had
    already been answered empirically in children.'
- claim: PTH1R agonism spends the growth plate progenitor pool.
  grade: E
  basis: 'THE STRONGEST EVIDENCE AGAINST IT IS NOW HUMAN AND SPANS A DECADE. Normal height velocity
    throughout 6.9 +/- 3.1 years of treatment at up to 4.5-fold the approved adult per-kilogram dose,
    with CaSR patients attaining or exceeding midparental height. Pool spending produces early cessation
    and a final height below target. Corroborated in rat by trompet2024, whose length effect GREW between
    one and six months rather than fading. Still E because both are confounded - replacement dosing in a
    disease population, and a Hedgehog agonist rather than a PTH1R agonist - and because no resting-zone
    cycle time has ever been measured under any PTH1R agonist.'
- claim: liao2026 measured bone length under abaloparatide in wild-type growing mice.
  grade: X
  basis: 'RESOLVED AND THE ANSWER IS NO. Tibia length is in every genotype-comparison table and in none
    of the drug tables. The access-queue item is closed: the experiment was run in one-month-old animals
    for thirty days and the length endpoint was not reported.'
- claim: 5 micrograms per kilogram per day of abaloparatide is a low or threshold dose in mice.
  grade: X
  basis: 'NO - IT NEARLY TRIPLED TRABECULAR BONE VOLUME IN WILD-TYPE GROWING MICE, with connectivity up
    648 per cent. It is a powerfully active dose. That strengthens the round-188 correction that the
    approved human doses are not obviously too low, and it raises an unexamined question about what that
    much new trabecular bone does to a metaphysis the growth plate has to advance through.'
- claim: The winer2025 between-group difference is evidence about PTH.
  grade: X
  basis: 'IT IS NOT, AND THE EXPLANATION IS IN winer2018. The APS-1 group''s 8 to 12 centimetre shortfall
    against midparental height is confounded by treatment of their Addison''s disease with oral steroid at
    15 mg per square metre, which the authors themselves flag as higher than physiologic replacement.
    Supraphysiologic glucocorticoid is a potent growth suppressant. The age-by-group interaction
    winer2025 reports is a disease-and-cotreatment difference, not a drug effect.'
- claim: Every paper in this area has been cleared.
  grade: X
  basis: 'NO, AND THE GAP IS NOW QUANTIFIED RATHER THAN GUESSED. The decision-relevant slice is 275
    records, of which 131 survive triage and roughly 25 have been read across rounds 184 to 190. About
    106 triaged candidates remain unread and are listed in the round-190 archive. The unrestricted space
    is 2,727 records.'
