contradicts:
- 'INVALIDATES THE DOSE-SCALING FRAMING OF ROUNDS 184 AND 187. Both scaled from rodent doses by body
  surface area to estimate a human dose and concluded the approved dose was about tenfold short.
  winer2018 documents children given 0.75 to 1.49 micrograms per kilogram per day for up to a decade with
  growth measured. The empirical paediatric dose was available the whole time.'
- 'REMOVES THE winer2025 BETWEEN-GROUP INTERACTION AS EVIDENCE ABOUT PTH. Round 189 recorded the
  APS-1-versus-CaSR difference as a drug-relevant contrast. winer2018 records that APS-1 Addison''s
  disease was treated with 15 mg per square metre oral steroid, above physiologic replacement, which
  independently explains the shortfall.'
- 'CLOSES THE ROUND-188 AND ROUND-189 ACCESS-QUEUE ITEM ON liao2026. Bone length was not measured in the
  abaloparatide arm - it appears in every genotype table and no drug table.'
