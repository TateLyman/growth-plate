human_evidence: direct
human_evidence_note: The fracture-overgrowth arm is measured in two independent human paediatric series
  (shapiro1981, 74 children followed to skeletal maturity; cho2025, 79 children under 14). The androgen
  sign-inversion is a human adult-height observation but reaches this file through a perspective article
  rather than the primary series. The LIPUS and periosteal-resection arms are rodent and lagomorph; the
  historical velocity-only finding is human but is a statement about what was measured rather than about
  an effect.
translation_risk: moderate
translation_risk_reason: The decisive LIPUS null is rat at a stated dose, and whether the 2021 rabbit pilot
  used the same parameters is an inference from the abstract. The periosteal arm carries an ROC age cutoff
  of 9.6 years in humans, which is against a subject at bone age 16. The local GH depot has a proxy endpoint
  in a pilot and has never been given to any human by that route.
summary: 'AN EXTERNAL SWEEP OF ABANDONED, HISTORICAL AND COMMERCIALLY-KILLED GROWTH INTERVENTIONS, WITH EVERY
  LOAD-BEARING IDENTIFIER RE-RESOLVED BY DIRECT PubMed FETCH. It produces one candidate that dies on
  verification, one that survives from the same experiment''s other arm, one human phenomenon that turns out
  to have two mechanisms rather than one, and a structural correction to how the entire pre-1990 record
  should be read.


  CORR-362 - AN AGENT THAT SEARCHES FOR FOLLOW-UP IS NOT SEARCHING FOR PRIOR WORK, AND THAT IS HOW THE BEST-
  LOOKING LEAD SURVIVED TO BE PROPOSED. rickert2021 is a genuinely good design - randomised, four arms,
  HEALTHY IMMATURE RABBITS, blinded observers, calcein labels at days 1 and 18, contralateral leg as control:
  transdermal LIPUS plus 35 per cent and epiphyseal rGH injection plus 41 per cent, both p=0.04, with no
  difference among the four control groups (p=0.37) and no physeal bar. It was presented as unfollowed,
  obtainable and the only positive signal in a normal growing animal. IT WAS PRECEDED. spadaro1998, in the
  same journal, gave young rats 1.5 MHz pulsed ultrasound at 30 mW/cm2 SATA for 20 minutes a day for 28 days
  and found NO LENGTH DIFFERENCE - 2 per cent or less in femur or tibia against the SHAM LEG or unexposed
  controls, and no BMD difference of more than 6 per cent - then repeated it with a periosteal trauma stimulus
  added and found nothing again. AND THE DOSE IS THE POINT: 1.5 MHz, 30 mW/cm2, 20 minutes a day ARE the
  standard clinical LIPUS parameters, so the obtainable device was tested at the obtainable dose in a normal
  growing animal with a caliper and returned 2 per cent or less. chow2011 agrees from a third direction - in
  a rabbit physeal injury a bioengineered cartilage pellet improved femoral lengthening and adding LIPUS gave
  no additional enhancement at 4, 8 or 16 weeks. THE 1998 STUDY IS A LENGTH ENDPOINT AND THE 2021 STUDY IS A
  PROXY - calcein-labelled microscopic growth over 18 days - which is failure mode 3 with the proxy on the
  positive side. LIPUS AS A PHYSEAL STIMULUS IS NOT A LEAD. What survives is a live inconsistency: a sustained
  35 per cent rate effect should have appeared inside Spadaro''s 2 per cent bound, so either it is not
  sustained or dose, placement, species or duration separates the two, and nobody has run them against each
  other. Rickert''s own parameters are not in the abstract, so "same dose" is an inference the full text
  would settle.


  WHAT DOES SURVIVE IS THE OTHER ARM OF THE SAME PILOT, AND IT IS A CONFIGURATION THIS FILE HAS NEVER
  CONSIDERED - A LOCAL EPIPHYSEAL rGH DEPOT AT PLUS 41 PER CENT. Spadaro tested ultrasound and not this.
  Step 0 is not obviously a substitution: R254 and R269 price SYSTEMIC GH at approximately zero attained
  height after mid-puberty via SOCS2, but R326 and yakar2016 split the axis, with circulating IGF-1 driving
  RADIAL growth and LOCAL IGF-1 driving LONGITUDINAL growth, so a depot inside the epiphysis targets the arm
  the systemic drug reaches least - the same argument that let R341 reopen STC2. And the route is already
  specified here: R373, R374 and R385 to R387 worked out percutaneous, image-guided, intraosseous placement
  into the secondary ossification centre in detail, including cannula gauge, vehicle, confirmation imaging
  and sites. Same route, different payload, and the payload is an APPROVED drug the subject already takes
  systemically, so there is no GMP problem - which is the single thing blocking the SAG programme. Against
  it: a proxy endpoint, pilot numbers, rabbit, no length, an injection rather than a non-invasive route, and
  the possibility that SOCS2 simply saturates faster at a higher local concentration.


  THE JOIN, AND IT IS THE ROUND: THE PERIOSTEUM ARM AND THE FRACTURE-OVERGROWTH ARM ARE TWO DIFFERENT
  MECHANISMS, THIS FILE HOLDS ONE OF THEM, AND periosteum.yaml DOES NOT CONTAIN THE WORDS FRACTURE OR
  OVERGROWTH ANYWHERE. Three papers, never read together. kaneko2020 is the causal version in a normal
  animal with a sham control inside the same mouse: circumferential periosteal resection of the proximal
  tibia in WILD-TYPE and Fgfr3-ach mice at four weeks, repeated at five, read at six, with tibial LENGTH and
  bone volume significantly larger on the resected side than the sham side in wild-type mice and the growth
  plate significantly wider - and no significant effect in Fgfr3-ach mice, which is the entire basis for
  nominating IHH as the mediator, an inference from a non-response rather than a measurement. Its cost is in
  the same paper: metaphyseal BV/TV and Tb.N significantly decreased on the resected side in BOTH genotypes.
  shapiro1981 gives femoral fracture followed by 0.92 cm of femoral overgrowth AND 0.29 cm in the UNBROKEN
  ipsilateral tibia in 82 per cent of children. cho2025 is the mirror - tibial shaft fracture in 79 children
  under 14 followed by ipsilateral FEMORAL overgrowth contributing 25 per cent of the leg-length discrepancy.


  AND THE DECOMPOSITION IS THE AUTHORS'' OWN, REACHED FROM RISK FACTORS WHILE THIS FILE REACHED IT FROM
  ANATOMY: the risk factors for tibial and femoral overgrowth DIFFERED - distal location for the femur, and
  length-stable fracture pattern, fibular involvement, operative treatment and fracture-site shortening for
  the tibia - which the authors say may reflect different mechanisms. So there are two arms and only one is
  covered here. The LOCAL arm, a bone that was broken or stripped, is plausibly release of a periosteal
  restraint, and kaneko2020 demonstrates exactly that causally in a normal animal with a within-animal sham.
  The CROSS-BONE arm cannot be, because that bone''s periosteum was never touched - so R440''s limb-wide
  signal is the second arm, and it now has two independent human series and an author-stated mechanistic
  split behind it. The periosteal arm carries periosteum.yaml''s ROC age cutoff of 9.6 years, which is
  against this subject; the cross-bone arm has no age analysis in either series.


  A DISCREPANCY RECORDED RATHER THAN SMOOTHED, AND A CORR-336 INSTANCE. cho2025 has been in this bibliography
  since 2026-08-08 with fuller numbers than the sweep extracted, is cited by three nodes, and the
  duplicate-key check caught this round about to add it a second time. Its stored entry says 66 per cent of
  children had ipsilateral femoral overgrowth; the abstract says 35 patients, which is 44 per cent and is
  internally consistent at 35 of 79. Both figures are value_unverified until the full text is read. What does
  not depend on the percentage: the phenomenon, the 25 per cent contribution to the discrepancy, the authors''
  statement that the femoral contribution to leg-length discrepancy was NOT significant, and the differing
  risk factors.


  THE MOST GENERALISABLE FINDING IS ABOUT THE HISTORICAL RECORD ITSELF - NO ADULT-HEIGHT ENDPOINT EXISTS FOR
  ESSENTIALLY ANY PRE-1990 GROWTH AGENT. thorner1996 gave once-daily subcutaneous GHRH to GH-deficient
  children and roughly DOUBLED height velocity, 4.1 to 8.0 cm per year at six months and 7.2 at twelve, in
  86 of 110 children, with a bone-age ratio of 1.04 plus or minus 0.58 - velocity doubled with the skeletal
  clock unmoved, which is the profile this file says it wants - and the entire GHRH programme ended without
  collecting a single adult height. The same holds for every other GHRH arm and for the cadaveric human GH
  era as a body of work. THEREFORE "ABANDONED FOR LACK OF EFFICACY", APPLIED TO ANY PRE-rhGH AGENT, IS A
  CLAIM ABOUT A SIX-TO-TWELVE-MONTH VELOCITY DATASET AND NOT ABOUT ATTAINED HEIGHT. It does not rescue GHRH
  here, because a secretagogue acts on the somatotroph and exogenous GH bypasses it, which is R284''s LUM-201
  argument verbatim.


  AND THE COMMERCIAL GRAVEYARD IS REAL, DOCUMENTED, AND EMPTY FOR US. Three clean cases of an agent removed
  with its efficacy file intact: GEREF (sermorelin), which the FDA formally determined was NOT withdrawn for
  reasons of safety or effectiveness and was discontinued commercially; iPlex (mecasermin rinfabate), the
  only IGF-1/IGFBP-3 BINARY complex ever approved, removed by a patent settlement; and NCT00572156, a
  106-patient rhGH plus rhIGF-1 combination trial terminated for strategic reasons, which was the one
  registered test of whether the two arms are additive. ALL THREE SIT ON THE SOMATOTROPIC AXIS AND ALL THREE
  FAIL STEP 0. The generalisation is R298''s base rate in the regulatory record: the commercial graveyard and
  the biological frontier do not overlap, because the only growth agents anyone ever commercialised were
  GH-axis agents.


  THE ANDROGEN SIGN-INVERSION REFRAMES R419 AND R420 WITHOUT REOPENING THEM. tanaka2020 states that anabolic
  steroid hormone improved adult height in Turner patients WITHOUT spontaneous puberty and decreased adult
  height in those WITH spontaneous puberty - one drug class, one disease, one endpoint, opposite signs, with
  endogenous oestrogen exposure as the discriminating variable. The consequence for this file is that the
  constitutional-delay nulls are from the oestrogen-REPLETE configuration: R419 declined oxandrolone partly
  because wang2026 has testosterone beating it by 2.64 cm on attained adult height, but constitutional-delay
  boys have intact aromatase, so that comparison tests the replete case while a subject on anastrozole is
  the deplete case, which is the arm where Tanaka''s sign is positive. It still does not reopen, on two
  grounds that do not depend on oestrogen status. First, R420''s vanderwerff2011 - the graded human androgen-
  receptor CAG-repeat association with height completely disappears after the age of 16, and that is the only
  dose-response instrument on AR function. Second, and sharper, Step 0: ferris2017 measured peak testosterone
  at 1156 plus or minus 302 ng/dL in Tanner IV to V boys ON an aromatase inhibitor, because an AI raises
  testosterone and simultaneously blocks its only route out - so the non-aromatisable androgen channel is
  already being driven hard by a drug in the stack. And tanaka2020 is a perspective article, an index rather
  than the primary Japanese series.'
quantitative:
- parameter: growth versus contralateral control leg under transdermal LIPUS and epiphyseal rGH injection
  value: 35 and 41
  unit: per cent, both p=0.04; four control groups did not differ (p=0.37)
  species: rabbit
  source_ref: rickert2021
  note: healthy immature rabbits, randomised, blinded, calcein-labelled at days 1 and 18, no physeal bar -
    but the endpoint is MICROSCOPIC CALCEIN-LABELLED GROWTH OVER 18 DAYS and not bone length
- parameter: femoral and tibial length change under low-intensity pulsed ultrasound in normal growing rats
  value: 2
  unit: per cent or less - NO DIFFERENCE versus sham leg or unexposed controls
  species: rat
  source_ref: spadaro1998
  note: 1.5 MHz, 30 mW/cm2 SATA, 20 min/day for 28 days - the standard clinical LIPUS parameters; BMD also
    unchanged (6 per cent or less), and null again when a periosteal trauma stimulus was added
- parameter: tibial length on the periosteally resected side versus the sham side in WILD-TYPE mice
  value: significantly larger
  unit: within-animal sham control; growth plate also significantly wider
  species: mouse
  source_ref: kaneko2020
  note: circumferential resection at 4 weeks repeated at 5, read at 6; NOT significant in Fgfr3-ach mice,
    which is the sole basis for nominating IHH. The +0.71 +/- 0.72 per cent magnitude is full-text and
    value_unverified - the SD exceeds the mean
- parameter: metaphyseal trabecular bone on the periosteally resected side
  value: significantly decreased
  unit: BV/TV and Tb.N, in BOTH wild-type and Fgfr3-ach mice
  species: mouse
  source_ref: kaneko2020
  note: the cost recorded in the same paper as the length gain
- parameter: ipsilateral femoral overgrowth after paediatric tibial shaft fracture
  value: 44
  unit: per cent (35 of 79 patients) per the abstract - value_unverified against this atlas's own 2026-08-08
    entry of 66 per cent
  species: human
  source_ref: cho2025
  note: the mirror of shapiro1981; contributed 25 per cent (IQR 18-31) of the leg-length discrepancy, and
    the authors state that contribution was NOT significant. The two percentages cannot both be right for
    one denominator and the full text must settle it
- parameter: height velocity under once-daily subcutaneous GHRH, with the bone-age ratio
  value: 4.1 -> 8.0
  unit: cm/yr at 6 months (7.2 at 12 months), in 86 of 110 children, bone-age ratio 1.04 +/- 0.58
  species: human
  source_ref: thorner1996
  note: velocity doubled with the skeletal clock unmoved, and NO ADULT HEIGHT WAS EVER COLLECTED for this or
    any other GHRH arm - the evidentiary basis on which the whole pre-rhGH pharmacopoeia was abandoned
