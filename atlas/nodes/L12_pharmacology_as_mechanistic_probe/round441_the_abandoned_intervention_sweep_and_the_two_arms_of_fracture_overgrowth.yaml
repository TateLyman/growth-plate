id: round441_the_abandoned_intervention_sweep_and_the_two_arms_of_fracture_overgrowth
name: R441 - the abandoned-intervention sweep - LIPUS is killed by a paper 23 years older than it, a local
  epiphyseal GH depot survives, and fracture overgrowth turns out to be two mechanisms
