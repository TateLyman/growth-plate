id: round428_the_transport_finding_refiled_as_the_exposure_term_and_the_multiplier_priced_honestly
name: >-
  R428: the transport finding re-filed under the exposure/targeting term and PRICED - and the multiplier
  largely FAILS, for a quantitative reason: the three small molecules in the stack already sit at unity
  partition, so there is nothing to multiply. Two of my own assertions withdrawn - a human joint-loading
  device HAS been built, twice; and the instrument that would measure physeal solute uptake EXISTS and has
  resolved a growth plate at 3 T with an ionic-versus-neutral comparison
aliases:
  - exposure and targeting term
  - delivery multiplier priced
  - dGEMRIC physis
  - human knee loading device
  - the 940-child extraction
type: method
layer: L12
stub: false
summary: >-
  ══ MISS 1 - THE EXTRACTION, STARTED, AND IT CORRECTS MY OWN FRAMING BEFORE IT CORRECTS ANYTHING ELSE ══

  ⭐ PRE-DECLARATION, RECORDED BEFORE EXTRACTING, AS THE BRIEF REQUIRED. My expectation is that the point
  estimates scatter around zero. Reason: a height gain in a paediatric bone trial would be a headline
  finding, not a covariate, and none of these trials reported one. If instead the estimates lean
  systematically positive, that is informative and I will say so.

  ⛔ FIRST CORRECTION, AGAINST R426 AND R427: "940 CHILDREN DOSED WITH JUMPING" IS WRONG ON TWO COUNTS.
  The 2025 review's twelve trials are Arnett & Lutz 2002 (n=25, F), Dowthwaite 2019 (43, F), Fuchs 2001
  (89, mixed), Gomez 2021 (31, F), Macdonald 2008 (222, mixed), Nichols 2008 (89, mixed), Nichols 2001
  (16, F), Nogueira 2014 (138, F), Nogueira 2015 (36, M), Thein-Nissenbaum 2023 (45, F), Weeks 2008
  (99, mixed), Witzke & Snow 2000 (53, F).
  · FOUR OF THE TWELVE ARE RESISTANCE EXERCISE, NOT JUMPING (Dowthwaite, Gomez, Nichols 2001,
    Thein-Nissenbaum = 135 participants), and Witzke & Snow is combined resistance-then-jumping. The
    jumping-only total is about 698, not 940.
  · AND THE TRIALS I NAMED SEPARATELY ARE NOT IN THE TWELVE - anliker2012, vlachopoulos2018, johannsen2003
    and weeks2012 are all outside the review's inclusion set. So the true number of controlled paediatric
    loading trials that measured height is LARGER than twelve, but the sentence I wrote was not right.
  · ⚠ AND THE ARITHMETIC DOES NOT CLOSE: those twelve sample sizes sum to 886, not 940. Recorded as a
    discrepancy rather than resolved, because the review's own participant total may count differently.

  ⭐ WHAT IS EXTRACTED SO FAR - THREE OF TWELVE, AND ONLY ONE HAS NUMBERS.
  · fuchs2001 (R427): jumpers 125.1 to 128.7 cm, controls 126.8 to 129.9 - +3.6 vs +3.1, a difference of
    +0.5 cm over 7 months FAVOURING JUMPERS, never tested, entered as a covariate. Dispersion reported is
    SEM OF THE LEVEL, so no interval is recoverable.
  · witzke2000: the paper states that CHANGES IN ANTHROPOMETRIC VARIABLES WERE NOT DIFFERENT between
    groups over 9 months - an explicit anthropometric null, with no arm-wise numbers in the abstract.
  · weeks2012, the 3-year follow-up of weeks2008: measured BOTH STANDING AND SITTING HEIGHT and found no
    differences in subject characteristics between groups.
  → SCORE: one point estimate leaning positive and untested, two stated nulls without numbers. THAT IS NOT
  ENOUGH TO LEAN EITHER WAY, and it would be a misuse of the pre-declaration to claim otherwise.
  ⛔ THE REMAINING NINE ARE ALL CLOSED-ACCESS. Arnett & Lutz 2002, Macdonald 2007/2008, Nichols 2008,
  Nichols 2001, Nogueira 2014, Nogueira 2015, Weeks 2008, Dowthwaite 2019, Gomez 2021,
  Thein-Nissenbaum 2023 - none has a PMC record. The extraction is blocked on PDFs, not on method.

  ⭐ AND THE FALSIFIABLE PREDICTION IS STATED NOW, BEFORE THE REST ARRIVE: if the effect is real it should
  SCALE WITH MECHANICAL DOSE. fuchs2001's 61 cm drop landing is 8.8 +/- 0.9 BODY WEIGHTS, the highest
  measured dose in the layer and about 2.3 times brailey2026's standardised high jump at 3.77 BW; the
  resistance-exercise arms are the lowest-impact members of the set. If the twelve estimates are unordered
  with respect to peak ground reaction force, the arm is dead regardless of the pooled sign.

  ══ MISS 2 - RE-FILED UNDER THE EXPOSURE TERM, AND THEN PRICED - AND THE PRICE IS LOW ══

  THE RE-FILING IS CORRECT. R426 found a lasting exercise-induced increase in solute delivery to the growth
  plate (serrat2010) and graded it as a weak growth lever. Judged instead as a term in EXPOSURE AND
  TARGETING it does not need its own length endpoint - it needs to raise the concentration at the plate of
  agents already aboard. That is the term growth_plate_drug_exposure has carried at grade B since R155:
  NOT ONE of twelve audited agents has a published growth-plate tissue concentration in any species.

  ⛔⛔ AND THEN THE ARITHMETIC KILLS MOST OF THE VALUE, FOR A REASON THE BRIEF ASKED ME TO CHECK AND WHICH
  RUNS AGAINST ITS OWN FRAMING. The relevant curve is not serrat2014's alone but farnum2006's baseline:
  A 332 Da SOLUTE ALREADY REACHES ABOUT 100 PER CENT OF THE VASCULAR CONCENTRATION IN THE GROWTH PLATE,
  SATURATING IN FIVE MINUTES; 3 kDa is about 60 per cent, 10 kDa about 10 per cent, 40 kDa undetectable.
  ⭐ A SOLUTE ALREADY AT UNITY PARTITION HAS NOTHING TO MULTIPLY. Diffusive delivery cannot take a molecule
  above the concentration of the blood supplying it.
  Against the current stack by molecular weight:
  · erdafitinib about 447 Da, anastrozole about 293 Da, sulfate ion 96 Da - ALL AT OR NEAR THE TOP OF THE
    PARTITION CURVE. Predicted multiplier about 1.0. NOTHING TO GAIN.
  · vepdegestrant 723.9 Da - still small, but over 99 per cent protein bound, so what partitions is a small
    free fraction, and that free fraction is itself near unity. Multiplier small.
  · the CNP analogue - released CNP-38 is about 4 kDa, sitting where farnum2006's curve is around half -
    THIS IS THE BAND WHERE A DELIVERY INCREASE BITES, and serrat2014 measured +150 per cent at 10 kDa.
  · growth hormone at about 22 kDa - baseline entry very low, so the relative multiplier could be large
    while the absolute remains small, and much of GH's action is hepatic anyway.
  → ⭐ "A MULTIPLIER ON FIVE AGENTS" BECOMES "A MULTIPLIER ON ONE - THE PEPTIDE ARM - AND APPROXIMATELY
  NOTHING ON THE THREE SMALL MOLECULES." That is the honest price.
  ⚠ AND THE LIMIT OF THAT ARITHMETIC, STATED: serrat2014 never measured below 10 kDa, so the near-unity
  conclusion for small molecules is an INFERENCE FROM farnum2006's CEILING, not a measurement. Protein
  binding, active transport, metabolism and residence time are absent from both curves. This is a chain of
  uncertain steps recorded to price a decision, not a prediction.
  ⭐ WHAT SURVIVES, AND IT IS NOT NOTHING: the one arm the multiplier would help is the CNP analogue, which
  is precisely the arm R425 has just put back into the stack. So the reframe does not raise the arm's grade
  but it does re-rank WHICH agent a delivery intervention protects.
  ⛔ AND R155's #1 LIVE ITEM IS NOT ANSWERED BY THIS. serrat2010 measures a fluorescent TRACER, not a drug.
  The exposure term's core claim - no agent has a published growth-plate tissue concentration in any
  species - is untouched by anything in R426, R427 or this round.

  ══ MISS 2, ITEM 4 - ⛔ MY OWN ASSERTION WITHDRAWN: THE HUMAN DEVICE EXISTS, AND IT WAS BUILT TWICE ══

  R427 wrote that there is no human device for lateral joint loading. CORR-267 and CORR-284 both forbid
  asserting what the literature contains without running the query. Run:
  · fitzwater2013, from the same laboratory as the mouse work: a PORTABLE VOICE-COIL ELECTROMECHANICAL KNEE
    LOADING SYSTEM whose two stated tasks were developing loading magnitude and frequency SUITABLE FOR
    HUMANS and making it portable, characterised for force, duty cycle and frequency ON A HUMAN KNEE MODEL.
  · korupolu2017: an under-actuated four-finger 3D-printed loader, experimentally validated to generate the
    required forces at the required frequencies, ending with a recommendation that it BE TESTED IN A
    CLINICAL STUDY.
  → THE CORRECTED STATEMENT IS BETTER FOR THE ARM, NOT WORSE: THE DEVICE HAS BEEN BUILT FOR HUMANS TWICE
  AND NEVER USED IN ONE. That moves lateral loading from "no modality exists" to "a characterised device
  awaiting its first biological endpoint", which is a different and much smaller gap.

  ══ MISS 3 - ⭐⭐⭐ THE INSTRUMENT EXISTS, IT RESOLVES A GROWTH PLATE, AND IT HAS ALREADY BEEN RUN WITH THE
  CHARGE COMPARISON THE ATLAS'S DONNAN MODEL PREDICTS ══

  ⛔ CORR-356 FIRST, BECAUSE THE ATLAS PARTLY KNEW. menezes2006 HAS BEEN IN THIS BIBLIOGRAPHY SINCE
  2026-08-07, IS CITED BY drug_property_screen AND the_stack_in_a_normal_human, AND HAD NO
  one_line_finding. drug_property_screen already carries its CHARGE result correctly - the neutral chelate
  enhances the physis more than the anionic one, the ionic agent reports fixed charge density - and even
  flags "abstract only; enhancement ratio values not read" while calling it the cleanest in vivo
  charge-isolating comparison in a large-animal growing physis. Only the duplicate-ref check caught this
  pre-commit, which is CORR-336's fourth instance. WHAT R428 ADDS IS NOT THE PAPER BUT THE READING: the
  atlas filed it as a CHARGE datum and never as a METHODS datum, so nobody noticed that it answers the
  question of whether the instrument can see a growth plate at all.

  The brief's load-bearing question was whether contrast-enhanced cartilage MRI resolves the PHYSIS at all
  and whether uptake there can be quantified rather than merely visualised. It does, and it has.
  ⭐ menezes2006 (Radiology): 3-T MRI of the KNEES OF TWELVE THREE-WEEK-OLD PIGLETS - a growing skeleton
  with an open physis - after intravenous IONIC gadopentetate dimeglumine (Gd-DTPA 2-) or NONIONIC
  gadoteridol. Enhancement ratios AND T1 values were quantified SEPARATELY IN THE PHYSIS, epiphyseal
  cartilage, secondary ossification centre and metaphysis, before contrast and at THREE 15-MINUTE INTERVALS
  after - a transport time course, not a single equilibrium reading. ENHANCEMENT RATIOS WERE SIGNIFICANTLY
  HIGHER FOR THE NEUTRAL AGENT THAN FOR THE ANIONIC AGENT IN THE PHYSIS, epiphyseal cartilage and SOC
  (P<0.05), and the authors conclude that the nonionic agent suits perfusion and anatomy while THE IONIC
  AGENT SUITS EVALUATING CARTILAGE FIXED-CHARGE DENSITY.
  → THAT IS THIS ATLAS'S DONNAN PARTITION MODEL MEASURED IN VIVO, IN A GROWTH PLATE, WITH A CHARGE
  COMPARISON, IN A GROWING ANIMAL. The atlas has run that model since R153 - fostriecin 0.21 dianionic,
  endothall 0.22, neutral M372049 0.82, neutral compound 23 0.74 - and never asked whether the instrument
  existed.
  ⭐ AND THE VALENCE DEPENDENCE IS ORDERED QUANTITATIVELY. kang2017 (Radiology), 44 porcine patellae, four
  agents, T1 maps every 10 minutes to 120 minutes, normal versus proteoglycan-depleted: slope difference
  Gd-BOPTA 2- 0.037 > Gd-DTPA 2- 0.022 > Gd-DOTA - 0.018 > NONIONIC gadobutrol 0.011, with ONLY THE
  DOUBLE-NEGATIVE AGENTS reaching significance. z = -2 beats z = -1 beats z = 0, which is r^z scaling.

  ⛔ THE COSTS, PRICED RATHER THAN WAVED THROUGH.
  · THE TWO BEST-PERFORMING AGENTS ARE LINEAR CHELATES - gadopentetate and gadobenate - which are the class
    restricted or withdrawn in Europe over gadolinium retention. The macrocyclic ionic alternative,
    gadoterate, carries a SINGLE negative charge and about half the discrimination; the macrocyclic
    nonionic agents have the least. So the safest agent for an adolescent is the least informative one.
  · ⚠ THE CONFOUND THAT DECIDES WHETHER THIS MEASURES TRANSPORT AT ALL: li2008dce shows physeal enhancement
    ratio and enhancement SPEED track the adjacent metaphyseal vascular bed, concluding that physeal
    perfusion may derive from the metaphysis when the epiphyseal supply is occluded. So enhancement at the
    physis carries a VASCULAR component and is not purely solute in the cartilage matrix. Separating them
    is a modelling problem, not a resolution problem.
  · ⚠ AND NO QUANTITATIVE MRI OF THE HUMAN PHYSIS HAS BEEN PUBLISHED. The tissue is visualised on every
    paediatric knee MRI; T1 mapping, dGEMRIC or DCE kinetics of the human growth plate returns nothing.
  · Gadolinium exposure in a growing person, contrast dosing, a defined loading protocol between injection
    and imaging, roughly 90-120 minutes of distribution time, and serial scanning are all real costs.

  ⭐ THE STUDY IT ENABLES, WHICH IS THE ONE THE FILE HAS WANTED SINCE R155: a WITHIN-SUBJECT before-and-after
  measurement of physeal solute uptake under a defined loading or exercise intervention, WITH THE
  CONTRALATERAL LIMB AS INTERNAL CONTROL - which is exactly serrat2010's design, in a human, non-invasively.
  It is also the only route this atlas has ever identified to a growth-plate tissue concentration in a
  living human, and it would bear on every agent in the stack rather than on this arm alone.
  → VERDICT ON THE BRIEF'S FIFTH OPTION: THE MEASUREMENT HALF OF THE EXPOSURE TERM IS NOT CLOSED. An
  instrument class exists, it has resolved and quantified a physis in a growing animal, and it has never
  been pointed at this question. That is a promotion with a named protocol, not a thirteenth deferral.

  ══ WHAT R428 SETTLES ══

  The extraction is started, corrected and blocked on nine PDFs, with the dose-scaling prediction declared
  in advance. The transport finding belongs under exposure and targeting, and priced there it multiplies
  the peptide arm and essentially nothing else, because small molecules already sit at unity partition -
  which is a smaller prize than the reframe promised and is worth knowing before anyone spends on it. Two
  assertions of mine are withdrawn: a human joint-loading device has been built twice and never used, and
  the instrument for measuring physeal solute uptake exists and has already been run with the exact charge
  comparison this atlas's own partition model predicts.
quantitative:
  - parameter: the partition ceiling that decides the multiplier, by solute size
    value: >-
      332 Da about 100 per cent of vascular concentration, saturating in 5 minutes; 3 kDa about 60 per cent;
      10 kDa about 10 per cent; 40 kDa undetectable
    unit: percent of vascular concentration
    species: mouse
    source_ref: farnum2006
    note: >-
      a solute already at unity partition cannot be raised by a delivery intervention. This is what prices
      the multiplier for the three small molecules in the stack at about 1.0
  - parameter: the measured delivery increase under limb warming, by solute size
    value: growth plate 10 kDa up about 150 per cent, 40 kDa up 18 per cent, 70 kDa up 42 per cent
    unit: percent
    species: mouse
    source_ref: serrat2014
    note: >-
      never measured below 10 kDa, so the near-unity conclusion for small molecules is an inference from
      farnum2006's ceiling and not a measurement
  - parameter: charge dependence of gadolinium partition into the PHYSIS in a growing animal
    value: >-
      enhancement ratios significantly HIGHER for nonionic gadoteridol than for ionic gadopentetate in the
      physis, epiphyseal cartilage and secondary ossification centre (P<0.05), at 3 T, with T1 quantified
      before contrast and at three 15-minute intervals after
    unit: qualitative
    species: porcine
    source_ref: menezes2006
    value_unverified: true
    note: >-
      twelve 3-week-old piglets. The physis is resolved and quantified separately from epiphyseal cartilage,
