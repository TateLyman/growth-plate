    value: >-
      slope difference between normal and proteoglycan-depleted cartilage - Gd-BOPTA 2- 0.037, Gd-DTPA 2-
      0.022, Gd-DOTA - 0.018, nonionic gadobutrol 0.011; only the double-negative agents reached significance
    unit: dimensionless slope
    species: porcine
