contradicts:
- 'WITHDRAWS the ESR1 weakness R353 raised against itself. The transcript ratio of 0.16 measured enrichment
  against an immune- and vascular-rich comparator, not presence in chondrocytes.'
- 'CORRECTS the scope of the purity-ratio method introduced in R344 and used since: a low ratio is a
  hypothesis about a transcript''s cellular origin and is overridden by direct protein localisation. It does
  not retire the method, which correctly killed AGTR1 and MME, neither of which has a protein measurement
  showing presence.'
