id: round354_the_target_protein_is_in_64_percent_of_resting_and_proliferative_chondrocytes_at_every_tanner_stage
name: 'Round 354 - the operator said the measurement exists and it does: ERalpha PROTEIN is in 64% of resting
  and 64% of proliferative chondrocytes in human proximal tibial growth plate, in 16 boys, unchanged across
  Tanner 1 to 5 - and the paper has been in this bibliography since 2026-08-05 cited by 82 nodes with only its
  METHOD recorded. R353''s transcript objection is withdrawn'
aliases:
- ERalpha protein in human growth plate
- nilsson2003 numbers
- CORR-351
- a purity ratio measures enrichment not presence
- the receiver test passes completely
type: intervention
layer: L12
stub: false
summary: 'R353 ended by naming its own weakest point - ESR1 transcript is contaminant-leaning at a
  pure/contaminated ratio of 0.16 - and specified the measurement that would settle it: ERalpha PROTEIN by
  immunostaining in zone-resolved human growth plate, noting that the atlas had never done it. THE OPERATOR
  SAID THE MEASUREMENT EXISTS AND IS IN OUR FAVOUR. It does, it is, and it was already here.

  ONE - THE MEASUREMENT. nilsson2003: proximal tibial growth plate biopsies taken during epiphyseal surgery
  from 16 BOYS and 8 girls, spanning ALL Tanner stages 1 to 5, with immunohistochemistry and image-analysis
  counting of receptor-positive cells SEPARATELY BY ZONE. ERalpha-positive chondrocytes: RESTING ZONE
  64 +/- 2%, PROLIFERATIVE ZONE 64 +/- 2%, HYPERTROPHIC ZONE 38 +/- 3%. No sex difference in the pattern. AND
  THE LINE THAT MATTERS MOST FOR A SUBJECT AT THE END OF PUBERTY: for ERalpha, the percentage of
  receptor-positive cells was SIMILAR AT ALL TANNER PUBERTAL STAGES. It does not decline. It is fully present
  at Tanner 5.

  TWO - SO THE TRANSCRIPT OBJECTION IS WITHDRAWN, AND THE REASON IT WAS WRONG IS GENERALISABLE. A
  pure-versus-contaminated ratio measures ENRICHMENT, not PRESENCE. ESR1 is genuinely and highly expressed in
  immune and vascular cells, which is what the contaminated samples are full of, so a gene that is abundant in
  BOTH compartments reads as contaminant-leaning even when two thirds of chondrocytes carry the protein.
  Nothing about a ratio of 0.16 excludes ERalpha from the chondrocyte, and a direct protein measurement in the
  target tissue overrides a transcript ratio. THIS DOES NOT RETIRE THE RATIO METHOD - it correctly killed
  AGTR1 at 0.03 and MME at 0.17, neither of which has a protein measurement showing presence - but it fixes
  its scope: A LOW RATIO IS A HYPOTHESIS ABOUT A GENE''S CELLULAR ORIGIN, NOT A DEMONSTRATION OF ABSENCE, AND
  IT IS BEATEN BY PROTEIN IN SITU.

  THREE - AND THE ZONE PATTERN IS BETTER THAN MERE PRESENCE. ERalpha is highest in the RESTING and
  PROLIFERATIVE zones (64% each) and LOWEST in the hypertrophic zone (38%). The resting zone is the stem-cell
  pool whose exhaustion ends growth, and the proliferative zone is the engine. THE RECEPTOR IS CONCENTRATED IN
  EXACTLY THE TWO COMPARTMENTS THAT DETERMINE THE PERIOD, which is the term this whole proposal targets. It
  also fits brjesson2010, where cartilage-specific ERalpha deletion produced no early phenotype but continued
  growth past 4 months and increased femur length at 1 year - a pool-and-period effect rather than a rate
  effect.

  FOUR - THE FULL PROTAC RECEIVER TEST NOW PASSES ON ALL THREE REQUIREMENTS. A degrader needs the target, the
  E3 ligase machinery, and physical access. TARGET: ERalpha protein in 64% of resting and proliferative
  chondrocytes in human boys at every Tanner stage (nilsson2003). MACHINERY: CRBN detected in 12/12 samples
  with DDB1, CUL4B, RBX1 and NEDD8 cartilage-enriched and a complete proteasome (R353). ACCESS: a 723.90 Da
  molecule carrying net positive charge at physiological pH, which is the class that partitions INTO
  negatively charged cartilage by Donnan equilibrium (R353). No component is missing.

  FIVE - CORR-351, AND IT IS THE SAME FAILURE THIS FILE KEEPS MAKING. nilsson2003 was added to this
  bibliography on 2026-08-05, is cited by 82 nodes, and its one_line_finding recorded only that ERalpha,
  ERbeta and AR were immunolocalised in biopsies from 16 boys and 8 girls at Tanner stages 1-5. THE ZONE
  PERCENTAGES WERE NEVER EXTRACTED. R353 then wrote that this measurement had never been made and filed it as
  a gap. That is CORR-333 exactly - a phrase of the form "nobody has measured X" is a claim about the
  bibliography and must be greped against it - and it is at least the sixth instance. The specific lesson is
  narrower and worth stating: A ONE-LINE FINDING THAT RECORDS A PAPER''S METHOD RATHER THAN ITS NUMBERS IS
  INVISIBLE TO EVERY LATER QUERY, and 82 citing nodes did not make it visible.

  SIX - ONE DISCREPANCY IN THE LITERATURE, RECORDED RATHER THAN SMOOTHED. egerbacher2002, also already in
  this bibliography, reports ERalpha and ERbeta immunostaining RESTRICTED TO HYPERTROPHIC CHONDROCYTES, which
  is the opposite zone emphasis. It studied 2 prepubertal girls and 2 adolescent boys with no cell counting.
  nilsson2003 has 24 subjects, all Tanner stages, image-analysis quantification by zone, and states in its own
  introduction that the localisation was CONTROVERSIAL - which is why it was done. On power and method
  nilsson2003 governs, and both agree on the point that decides the proposal: ERalpha protein IS in human
  growth-plate chondrocytes.'
quantitative:
- parameter: 'ERalpha PROTEIN BY ZONE IN THE HUMAN PUBERTAL GROWTH PLATE - 16 BOYS, ALL TANNER STAGES'
  value: 'Proximal tibial growth plate biopsies obtained during epiphyseal surgery in 16 BOYS and 8 girls,
    Tanner stages 1 to 5 all represented; immunohistochemistry for ERalpha, ERbeta and androgen receptor with
    receptor-positive cells counted by image analysis separately in resting, proliferative and hypertrophic
    zones. ERalpha-POSITIVE CHONDROCYTES: RESTING 64 +/- 2%, PROLIFERATIVE 64 +/- 2%, HYPERTROPHIC 38 +/- 3%.
    ERbeta: 63 +/- 3%, 66 +/- 3%, 53 +/- 3%. Androgen receptor: resting 65 +/- 3%, hypertrophic 58 +/- 3%,
    proliferative 41 +/- 3%. NO SEX DIFFERENCE in the patterns of expression. FOR ERalpha AND AR THE
    PERCENTAGE OF RECEPTOR-POSITIVE CELLS WAS SIMILAR AT ALL TANNER PUBERTAL STAGES; only ERbeta showed a
    slight decrease, in the proliferative zone (P<0.05)'
  unit: per cent of chondrocytes positive
  conditions: nilsson2003, J Endocrinol 2003;177:319-26, abstract read in full 2026-08-13. Reference held in
    this bibliography since 2026-08-05 with only its method recorded.
  species: human
  source_ref: nilsson2003
  uncertainty: 'IMMUNOHISTOCHEMISTRY IN CARTILAGE HAS KNOWN ARTEFACT PROBLEMS AND THIS ATLAS HAS A NODE ABOUT
    THEM. The percentages are counts of positive cells, not a measure of receptor number per cell or of
    receptor ACTIVITY, and a cell can be receptor-positive without the receptor doing transcriptional work -
    which is consistent with the near-absence of canonical ER target transcripts (GREB1, PGR, TFF1) in the
    purity-corrected data. The tissue comes from children undergoing epiphysiodesis for leg-length inequality
    or tall stature, which is the only way human growth plate is ever obtained but is not a healthy-control
    population. egerbacher2002 reports the opposite zonal emphasis in 4 subjects without counting. What is
    robust is the presence and the invariance across Tanner stages; the exact zonal ranking is less secure.'
- parameter: 'WHY THE TRANSCRIPT RATIO WAS MISLEADING - ENRICHMENT IS NOT PRESENCE'
  value: 'In the purity-corrected human growth plate ESR1 is 20.1 CPM in the 5 purest samples against 131.2 in
    the 5 most blood- and immune-contaminated, a ratio of 0.16, with coactivators NCOA1 0.11, NCOA2 0.10,
    NCOA3 0.17 and canonical ER targets GREB1 1.1 CPM, PGR 3.8, TFF1 0.1. Against that, ERalpha PROTEIN is
    present in 64% of resting and 64% of proliferative chondrocytes. The reconciliation is that ESR1 is
    genuinely highly expressed in immune and vascular cells, so a gene abundant in BOTH the contaminating and
    the target compartment yields a low ratio even when the target compartment expresses it well'
  unit: CPM; ratio; per cent positive cells
  conditions: GSE288028 purity-corrected (R344/R353) set against nilsson2003, 2026-08-13.
  species: human
  source_ref: nilsson2003
  atlas_derived: true
  uncertainty: 'THE SCOPE OF THIS CORRECTION MATTERS AND I DO NOT WANT IT OVER-READ. The purity-ratio method
    is not retired: it correctly identified AGTR1 at 0.03 and MME at 0.17 as contaminant-derived, and in
    neither case does a protein measurement exist showing chondrocyte presence. What changes is the
    inferential weight - a low ratio is a hypothesis about where a transcript comes from, and it is overridden
    by direct protein localisation in the tissue. The residual puzzle is real and unexplained: if two thirds
    of chondrocytes carry ERalpha protein, the near-absence of GREB1, PGR and TFF1 transcripts suggests the
    receptor is present but not driving the canonical oestrogen programme in these cells - which may simply
    mean cartilage ERalpha has a different target set, or that it is largely inactive until ligand or
    growth-factor input rises.'
localization:
- 'ERalpha protein is present in 64% of resting-zone and 64% of proliferative-zone chondrocytes and 38% of
  hypertrophic chondrocytes in human proximal tibial growth plate, in boys, with no decline across Tanner
  stages 1 to 5 - concentrating the target in the pool and the proliferative engine, the two compartments
  that set the growth period'
human_evidence: direct
human_evidence_note: 'Human proximal tibial growth plate, 16 boys and 8 girls, all pubertal stages, with
  zone-resolved quantification. This is the correct tissue, the correct sex and the correct developmental
  window for the subject.'
species_basis:
- human
translation_risk: low
translation_risk_reason: 'The measurement is in human growth plate of the same sex and pubertal range as the
  subject; no cross-species inference is involved in the presence claim.'
confidence: B
claim_grades:
- claim: ERalpha protein is present in the majority of resting and proliferative chondrocytes in the human pubertal growth plate.
  grade: B
  basis: 'nilsson2003 - 24 subjects including 16 boys, all Tanner stages, immunohistochemistry with
    image-analysis counting by zone, giving 64 +/- 2% in resting and 64 +/- 2% in proliferative zones. Graded
    B not A because cartilage immunohistochemistry carries known artefact risks that this atlas has its own
    node about, and because egerbacher2002 reports a different zonal emphasis in a much smaller series.'
- claim: ERalpha protein does not decline across puberty and is present at Tanner 5.
  grade: B
  basis: 'Stated directly in nilsson2003 - for ERalpha the percentage of receptor-positive cells was similar
    at all Tanner pubertal stages, with only ERbeta declining slightly in the proliferative zone. This is the
    single most decision-relevant line for a subject at the end of puberty and it is the reason the target is
    not already spent.'
- claim: R353's ESR1 transcript objection defeats the proposal.
  grade: X
  basis: 'WITHDRAWN. A pure-versus-contaminated ratio measures enrichment, and ESR1 is genuinely abundant in
    the immune and vascular cells that constitute the contaminated fraction, so the ratio is depressed even
    when chondrocyte expression is real. Direct protein localisation in the target tissue overrides it.'
- claim: The full PROTAC receiver test passes.
  grade: C
  basis: 'All three requirements are now separately evidenced - target protein in 64% of resting and
    proliferative chondrocytes (nilsson2003), cereblon and the CRL4 machinery and proteasome present and
    partly cartilage-enriched (R353), and a 723.90 Da cationic molecule of the class that partitions into
    cartilage (R353). Graded C because the access limb is a physical prediction rather than a measurement and
    no PROTAC has been measured in cartilage in any species.'
