id: round324_nrk_taken_all_the_way_down_the_mechanism_exists_the_mouse_exists_and_the_modality_is_wrong
name: >-
  ROUND 324 - NRK/NESK taken as deep as the evidence goes. THE HUMAN GENETICS ARE THE BEST IN THIS ATLAS -
  a graded allelic series, pLoF > deleterious missense > possibly deleterious missense > all missense,
  monotone in severity AND in rarity, best P = 6.4e-29. THE MECHANISM EXISTS AND IT IS AKT. THE KNOCKOUT
  MOUSE EXISTS AND ITS SKELETON WAS NEVER LOOKED AT. AND THE MODALITY IS WRONG - NRK's antiproliferative
  function is KINASE-INDEPENDENT, so an ATP-competitive inhibitor of the atlas's favourite "most drugged
  fold there is" would probably do nothing
aliases:
- round 324
- NRK deep dive
- the NRK allelic series
- NRK is kinase-independent
- the Nrk knockout mouse exists
- NRK CK2 PTEN AKT
- NRK is Tdark
type: hypothesis
layer: L12
stub: false
summary: >-
  ZERO - WHY THIS ROUND. NRK has been the atlas's nominal lead gene since round 283 and has never been taken
  apart. Round 310 called it "the cleanest localisation result in the atlas" and round 313 confirmed ChEMBL
  has no human NRK record. Nobody had asked what NRK DOES, whether a knockout exists, or - decisively -
  whether the part of the protein that does the job is the part a kinase inhibitor would hit.


  ONE - ⭐⭐⭐ THE ALLELIC SERIES, AND IT IS THE STRONGEST INTERNAL VALIDATION OF ANY TARGET IN THIS FILE.
  kosmicki2026 Supplementary Table 6 carries THIRTY-FIVE NRK rows and this atlas had only ever quoted two of
  them. Read as a series they are monotone in BOTH predicted severity and rarity:
  · pLoF, singleton                     **+3.79 cm**  P=1.3e-09,    32 carriers
  · pLoF + deleterious missense, singleton  **+2.98 cm**  P=8.1e-12,   82
  · pLoF, AAF<0.01%                     **+2.79 cm**  P=1.0e-20,   247
  · pLoF, AAF<0.1-1%                    **+2.49 cm**  P=7.7e-19,   319
  · deleterious missense, singleton      +2.21 cm  P=2.9e-04,    50
  · pLoF + deleterious missense, AAF<0.01% **+2.02 cm**  **P=6.4e-29**, 544  <- most significant row
  · deleterious missense, AAF<0.01%      +1.59 cm  P=2.8e-12,   300
  · possibly deleterious missense, AAF<0.01% +0.61 cm  P=1.3e-11, 1,880
  · ALL missense, AAF<1%                 +0.16 cm  P=4.9e-05, 10,564
  **More damaging class gives more height; rarer allele of the same class gives more height; and the effect
  decays smoothly to +0.16 cm when you dilute the mask with benign missense.** That is the shape a real
  causal loss-of-function effect makes and the shape that confounding does not. No other target in this
  atlas has it - FBN1, HHIP, TET1 and CHAD are each quoted from a single row.


  TWO - X-LINKAGE, AND IT CUTS IN THE FAVOURABLE DIRECTION FOR ONCE. NRK is on Xq22. In an exome burden
  test a male "carrier" of a protein-truncating NRK variant is HEMIZYGOUS - a complete null, with no second
  copy. So the +2.79 cm may be substantially a COMPLETE-LOSS effect rather than a haploinsufficiency effect,
  which is exactly what a drug at full target engagement would emulate; and this subject is male. ✗ The
  supplementary table does not split by sex and kosmicki2026's X-chromosome handling is not stated in what
  this atlas holds, so this is a structural argument, not a measurement. Recorded as the single most
  valuable thing to look up next about NRK.


  THREE - ⭐⭐⭐ THE MECHANISM EXISTS, IT IS AKT, AND EVERY NODE OF IT IS IN THE POSTNATAL HUMAN GROWTH PLATE.
  `lestari2022`: NRK carries a **CK2-INHIBITORY REGION (CIR)** that binds CK2beta directly and inhibits CK2.
  Chain, with directions: **NRK -| CK2 -> (CK2 phosphorylates PTEN at S380, inactivating it) -| PTEN ->
  more PIP3 -> more AKT (T308/S473).** So losing NRK RAISES AKT signalling. Verified in the animal:
  Nrk-knockout placentas show increased phospho-PTEN S380 AND increased phospho-AKT S473. `morioka2017`
  reaches the same place independently in trophoblast; `lu2020nrk` finds NRK restrains proliferation in
  vascular smooth muscle. Three tissues, one direction: **NRK is an antiproliferative brake on AKT.**
  ⭐ **AND THE WHOLE CHAIN PASSES CORR-327 IN THE RIGHT TISSUE** (GSE288028, 14 postnatal human growth
  plates): NRK 76.0 CPM in 81.5% of cells, CSNK2A1 75.5, CSNK2A2 54.9, **CSNK2B 82.1 (78.5% of cells)**,
  **PTEN 121.0 (68%)**, AKT1 45.7 (72%), AKT3 111.8, PIK3CA 58.6, MTOR 22.5, RICTOR 59.3, FOXO3 118.9.
  ⭐⭐ **AND THE HUMAN PHENOTYPES OF THE OTHER NODES ALL POINT THE SAME WAY**, which is the first time an
  atlas target's mechanism has been corroborated at three independent genes:
  · **PTEN** - HPO Tall stature + Overgrowth (PTEN hamartoma syndrome, macrocephaly and tall stature)
  · **AKT1** - HPO Tall stature + DISPROPORTIONATE tall stature + Overgrowth (Proteus, activating mosaic)
  · **PIK3CA** - HPO Tall stature + Overgrowth (PIK3CA-related overgrowth spectrum)
  · **MTOR** - kosmicki pLoF **-3.65 cm** (P=2.2e-11) and HPO short stature: losing the pathway's output
    node SHORTENS
  · **and the pharmacology agrees**: `alvarezgarcia2007` gave rapamycin 2 mg/kg/day to 4-week-old rats and
    **HALVED the bone longitudinal growth rate, 94 +/- 3 against 182 +/- 3 micrometres per day.**
  **Activating this pathway makes humans overgrow; inhibiting it halves a normal rat's growth rate; and NRK
  is the endogenous brake on it.** That is a complete, signed, human-anchored circuit.
  ⭐ **AND IT LANDS ON h_term.** AKT-mTOR sets CELL SIZE, and hypertrophic chondrocyte volume is ~80% of
  longitudinal growth - the term round 296 concluded had NO upward-pointing agent after sweeping six
  compound classes.


  FOUR - ⛔⛔⛔ **AND HERE IS THE FINDING THAT MATTERS MOST, BECAUSE IT OVERTURNS THIS ATLAS'S OWN FRAMING.
  NRK's ANTIPROLIFERATIVE FUNCTION IS KINASE-INDEPENDENT.** `lestari2022`, in terms: "the kinase domain was
  NOT required for mNRK-induced inhibition of AKT signaling or cell proliferation". The active element is
  the CIR - **aa 565-868**, between the kinase domain and the C-terminal CNH domain - with **aa 565-831
  required for binding CK2beta and aa 832-868 required for MAXIMAL inhibition of CK2 activity.**
  ⛔ Round 310 wrote that the direction is inhibition "which for a KINASE is the most drugged fold there
  is". **That sentence is wrong for this target.** An ATP-competitive NRK inhibitor would occupy a domain
  the phenotype does not depend on, and is predicted NOT to reproduce the human loss-of-function effect.
  ⭐ **What WOULD reproduce it, stated as a specification rather than a wish:**
  · a **DEGRADER** - removing the whole protein is the exact genetic experiment, and it is agnostic to which
    domain matters;
  · or a **disruptor of the CIR-CK2beta interface** - a protein-protein interaction, mapped to ~300 residues
    with a **37-residue sub-element (aa 832-868) required for maximal inhibition.** That is the same shape
    as CHAD's LRRWLEAK318 (CORR-335): a short, functionally defined motif, which is what makes a PPI
    tractable rather than hopeless.
  ✗ Neither exists. And note the inversion this creates: **inhibiting NRK means DISINHIBITING CK2**, so the
  clinical CK2 inhibitor **silmitasertib runs the wrong way** - which independently agrees with round 311,
  where Csnk2b knockout ACCELERATED chondrocyte maturation (+3.620).


  FIVE - THE CHEMISTRY, QUANTIFIED RATHER THAN ASSERTED (CORR-312/335). Pharos/IDG: **NRK is Tdark - 0
  ligands, 0 drugs.** Its three GCK-IV siblings are all **Tchem: MAP4K4 105 ligands + 1 drug, TNIK 143 + 2,
  MINK1 42 + 3.** ChEMBL has **no human NRK target record** at all.
  ⚠ **NRK IS THE DIVERGENT MEMBER OF ITS OWN SUBFAMILY** - MAP4K4, TNIK and MINK1 share ~92% kinase-domain
  identity with each other; NRK shares only **59%**. That cuts both ways: existing GCK-IV chemistry is
  unlikely to cross-inhibit NRK at useful potency, and equally a selective NRK ligand is chemically more
  plausible than separating the other three from each other. Either way the kinase domain is the wrong
  target here, so the point is largely moot.
  ⛔ **TWO NAME-COLLISION TRAPS, both of which will mislead the next search.** (1) ChEMBL's three "NRK" hits
  are **rat kidney CELL LINES** (NRK, NRK-49F, NRK-52E), not the kinase. (2) A search for "NIK inhibitor"
  returns **MAP3K14** compounds and crystal structures - a completely different kinase. Neither has anything
  to do with NRK/NESK.


  SIX - ⭐⭐ THE KNOCKOUT MOUSE EXISTS, AND THIS ATLAS HAS BEEN SAYING FOR ROUNDS THAT NRK HAS "NO
  PERTURBATION IN ANY SPECIES". MGI carries **Nrk<tm1Mkom> on a B6.129S4 congenic background**
  (MGI:5292104/5/6, `denda2011`), already phenotyped in the three genotypes an X-linked gene needs -
  **hemizygous males, homozygous females and heterozygous females.**
  Its seven MP terms are enlarged placenta, increased placenta weight, increased spongiotrophoblast size,
  dystocia, pregnancy-related premature death, postnatal lethality with incomplete penetrance, neonatal
  lethality with incomplete penetrance. **NOT ONE IS SKELETAL. The skeleton was never looked at.**
  ⛔ **And IMPC has never phenotyped Nrk at all** - zero rows in 2,236,257, checked directly, against 189
  for Tnks and 33 for Pde3b. So the largest systematic mouse phenotyping effort in existence has no NRK
  data, which is why every automated sweep this atlas has run came back empty.
  ⭐ **This converts the standing gap from "nobody has made the model" to "order the mouse and use a
  caliper".** Incomplete-penetrance lethality means survivors exist; dystocia is a maternal-genotype effect
  and is avoidable by breeding design.


  SEVEN - THE EXPRESSION CONFLICT, AND IT RESOLVES IN THE ATLAS'S FAVOUR. `lestari2022` states mouse Nrk is
  "restrictedly expressed in the placenta". Against that:
  · **`kanaiazuma1999`, the original cloning paper: whole-mount in situ puts Nrk in SKELETAL MUSCLE, first
    in the VENTRAL MYOTOME at E10.5**, rising E15-E17. `nakano2000` independently cloned it as NESK and
    also reports skeletal muscle in late embryogenesis. The myotome is the somite compartment adjacent to
    the sclerotome that builds the axial skeleton.
  · **The atlas's own primary human measurements**: 83.5-fold chondrocyte enrichment - 46.99% of
    chondrocytes against 0.56% of every other cell in the same tissue (R310); 76.0 CPM in up to 81.5% of
    cells across 14 postnatal human growth plates (R308); detected in ALL FIVE compartments of BOTH GSE9160
    donors, one of only three genes in that panel alongside ACAN and COL2A1 (R292); 183-301 CPM in mouse
    perichondrium (R291).
  **A mouse multi-tissue expression panel does not contain growth-plate cartilage.** "Restricted to the
  placenta" is a statement about the tissues that were on the panel, which is CORR-316 in the mirror.


  EIGHT - THE TENSIONS, RECORDED BECAUSE THEY ARE NOT RESOLVED.
  ⚠ **The R312 direction problem stands and the mechanism does not fix it.** In GSE114919 NRK is
  CAPACITY-LIKE in both mouse and rat - it FALLS with age and is LOWER in the low-output plate (mouse
  -0.89/-0.82/-1.24; rat -0.88/-0.92/-0.83) - i.e. highest where growth is highest. For a brake you would
  predict the opposite. A homeostatic reading (more restraint where more growth needs restraining) is
  available and is post hoc.
  ⚠ **Module CD4 is not height-enriched.** `richard2025`'s co-expression modules put NRK in CD4 (635 genes,
  with COL11A1, COL9A1, ENPP1 and its sibling TNIK); CD4's height-rank enrichment is P=0.145, not
  significant - though every module in that test scores "Worse Rank", so the test is weak in both directions.
  ⚠ **CORR-292's jam applies.** Raising AKT could enlarge cells without lengthening bone, and this atlas has
  been wrong that way seven times. Only a length endpoint separates them - which is the experiment that has
  never been run.
  ⚠ **The pathway's other human alleles are cancer alleles.** PTEN, AKT1 and PIK3CA overgrowth syndromes are
  mosaic activating lesions with tumour risk, and all three are ALSO annotated to short stature because the
  syndromes are heterogeneous. The direction is right; the class is dangerous - which is precisely the
  argument for entering it at a chondrocyte-restricted node rather than at PI3K or AKT.
  ⛔ **AND THE COMPARTMENT COORDINATE CANNOT BE COMPUTED FOR NRK - THE GWAS IS BLIND TO THE X CHROMOSOME.**
  Streaming bartell2026's standing-height summary statistics returned **ZERO chrX rows in 11.2 million
  variants**. So R318's and R323's trunk-versus-limb framework cannot place NRK, or any X-linked gene, at
  all - a structural limit on that method which nobody had noticed and which happens to hit the atlas's own
  lead gene. ✓ The three GCK-IV siblings ARE in the data and all three carry height-associated lead
  variants (MAP4K4 P=3e-13, MINK1 P=2.5e-07, TNIK P=2.3e-04) - weak, unfine-mapped, but the family is not
  invisible to height.
  ⚠ **INPPL1 is a counterexample inside the pathway** - it degrades PIP3, so its loss should raise AKT and
  lengthen, yet biallelic INPPL1 loss is opsismodysplasia, a short-stature dysplasia. CORR-325 applies
  (biallelic disease is not the het effect), but it is recorded rather than explained away.
human_evidence: direct
human_evidence_note: >-
  The allelic series is 1.45M human exomes. The pathway corroboration (PTEN, AKT1, PIK3CA, MTOR) is human
  clinical genetics and human burden testing. The expression is human growth plate at single-cell and
  zone-resolved level. The mechanism, the knockout and the kinase-independence are mouse and cell-based.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The mechanism is established in placenta and cell lines, not in cartilage - no experiment has perturbed
  NRK in a growth plate in any species, and no length endpoint exists. The therapeutic direction is
  inhibition of a protein-protein interface for which no chemical matter of any kind exists.
confidence: C
confidence_reason: >-
  C. The human genetics are grade A and the allelic series is the best in this atlas. The mechanism is
  grade B - established in placenta with an in vivo phospho-readout and reproduced in two other tissues, but
  never tested in cartilage. The kinase-independence is grade B and comes from one paper's domain-deletion
  experiments. Everything downstream of "so what do we give" is grade E, because the target is Tdark with
  zero ligands and the functional element is a PPI.
limitations:
- No perturbation of NRK in a growth plate in any species; no bone-length endpoint anywhere.
- The CK2-PTEN-AKT mechanism is demonstrated in placenta and cell lines, not cartilage.
- kosmicki2026's supplementary table does not split the X-linked burden by sex, so the hemizygous-versus-
  heterozygous decomposition is inferred and not measured.
- Kinase-independence rests on domain-deletion and kinase-dead constructs in one paper.
- The expression conflict is resolved by argument (panels lacking growth plate), not by a direct
  side-by-side measurement.
