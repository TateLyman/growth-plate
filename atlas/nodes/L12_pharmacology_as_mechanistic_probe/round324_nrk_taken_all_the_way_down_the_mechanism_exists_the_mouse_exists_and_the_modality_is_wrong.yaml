claim_grades:
- claim: NRK loss increases adult human height, and the effect has the internal structure of a causal
    loss-of-function effect.
  grade: A
  basis: Thirty-five burden rows in 1.45M exomes forming a monotone series in both variant severity and
    allele rarity, from +3.79 cm for singleton pLoF down to +0.16 cm when the mask is diluted with benign
    missense, with the most significant row at P=6.44e-29. No OMIM entry, no HPO annotation.
- claim: NRK restrains growth by inhibiting CK2, which keeps PTEN active and AKT down.
  grade: B
  basis: lestari2022 maps the CK2-inhibitory region and shows Nrk-knockout placentas have raised
    phospho-PTEN S380 and phospho-AKT S473; morioka2017 reaches the AKT conclusion independently in
    trophoblast; lu2020nrk finds the same antiproliferative direction in vascular smooth muscle. B and not A
    because none of it is in cartilage.
- claim: An ATP-competitive NRK kinase inhibitor would reproduce the human loss-of-function phenotype.
  grade: X
  basis: 'NO. lestari2022 states the kinase domain is NOT required for NRK-induced inhibition of AKT
    signalling or cell proliferation; the function sits in the CK2-inhibitory region at aa 565-868. Round
    310''s framing - inhibition, "which for a KINASE is the most drugged fold there is" - is wrong for this
    target. The tractable-looking domain is not the functional one.'
- claim: NRK has never been perturbed in any species.
  grade: X
  basis: 'NO. Nrk<tm1Mkom> exists on a B6.129S4 congenic background and has been phenotyped as hemizygous
    male, homozygous female and heterozygous female (denda2011, MGI:5292104-6). What is true is narrower and
    more useful: its SKELETON was never examined, and IMPC has never phenotyped the gene at all.'
- claim: Mouse Nrk is restricted to the placenta.
  grade: X
  basis: 'NO. The original cloning paper puts it in skeletal muscle from the ventral myotome at E10.5
    (kanaiazuma1999), the independent NESK cloning agrees (nakano2000), and this atlas has measured it
    directly in human growth plate at 83.5-fold chondrocyte enrichment, in all five GSE9160 compartments of
    both donors, and at 183-301 CPM in mouse perichondrium. A mouse tissue panel does not contain growth
    plate.'
- claim: This round produces an obtainable agent.
  grade: X
  basis: It does not. NRK is Tdark with zero ligands and zero drugs, ChEMBL has no human target record, and
    the functional element is a protein-protein interface rather than a catalytic site. What it produces is
    a specification (degrader, or CIR-CK2beta disruptor) and a cheap animal experiment.
key_refs:
- ref_id: kosmicki2026
  first_author: Kosmicki JA
  year: 2026
  type: primary
  one_line_finding: Thirty-five NRK burden rows across seven variant classes and five allele-frequency bins,
    monotone from +3.79 cm for singleton pLoF to +0.16 cm for all-missense, best P=6.44e-29.
- ref_id: lestari2022
  pmid: '34999820'
  first_author: Lestari B
  year: 2022
  type: primary
  one_line_finding: NRK inhibits CK2 through a CK2-inhibitory region at aa 565-868, raising PTEN activity and
    lowering AKT - and the kinase domain is NOT required for that effect.
- ref_id: denda2011
  pmid: '21715335'
  first_author: Denda K
  year: 2011
  type: primary
  one_line_finding: The Nrk knockout mouse - Nrk<tm1Mkom>, B6.129S4 congenic - with placental hyperplasia,
    dystocia and incompletely penetrant neonatal lethality, and no skeletal phenotype ever examined.
- ref_id: kanaiazuma1999
  pmid: '10559491'
  first_author: Kanai-Azuma M
  year: 1999
  type: primary
  one_line_finding: Mouse Nrk is expressed in skeletal muscle from the ventral myotome at E10.5, rising
    E15-E17 - the original evidence against a placenta-restricted reading.
- ref_id: nakano2000
  pmid: '10801798'
  first_author: Nakano K
  year: 2000
  type: primary
  one_line_finding: NESK, independently cloned mouse Nrk, selectively activates JNK and is predominantly
    expressed in skeletal muscle during late embryogenesis.
- ref_id: morioka2017
  pmid: '28152035'
  first_author: Morioka Y
  year: 2017
  type: primary
  one_line_finding: NRK restrains trophoblast proliferation and placental size by holding AKT
    phosphorylation down.
- ref_id: lu2020nrk
  pmid: '32330120'
  first_author: Lu YJ
  year: 2020
  type: primary
  one_line_finding: NRK expression in vascular smooth muscle attenuates inflammation and intimal hyperplasia
    - the same antiproliferative direction in a third tissue.
- ref_id: alvarezgarcia2007
  pmid: '17370095'
  first_author: Alvarez-Garcia O
  year: 2007
  type: primary
  one_line_finding: Rapamycin 2 mg/kg/day for 14 days in 4-week-old rats halved the bone longitudinal growth
    rate, 94 against 182 micrometres per day - the mirror of the direction NRK loss pushes.
