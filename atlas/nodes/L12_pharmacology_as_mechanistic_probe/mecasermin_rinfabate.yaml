localization:
  - "human growth plate: no data; the complex was never studied with a growth plate readout"
human_evidence: indirect
human_evidence_note: >-
  The compound was licensed on paediatric growth-failure data but the primary efficacy
  reports are not retrievable through the current indexed literature and no adult-height
  cohort was ever published.
species_basis: [human]
translation_risk: unknown
translation_risk_reason: >-
  There is no current human growth dataset to translate from or to. Contemporary
  development of the same molecule is in preterm neonatal lung disease, where the endpoint
  is not linear growth at all.
confidence: X
claim_grades:
  - claim: Complexing IGF-1 with IGFBP-3 extends its circulating half-life and permits once-daily dosing.
    grade: C
    basis: Formulation rationale supported by pharmacokinetic reasoning and contemporaneous review; the underlying human PK comparison is not retrievable.
  - claim: Mecasermin rinfabate improves adult height in children with IGF-1 deficiency.
    grade: X
    basis: Widely asserted in the historical literature but traceable to no published adult-height cohort; see gap g_l12b_012.
