id: round467_the_1963_papain_experiment_read_in_full
name: 'R467 - the 1963 intra-osseous papain experiment read in full: NOT blocked, 26 of 63 normal rabbits gained 3 to
  6 mm at p=1.5e-4, the cost is dose-segregated above 0.6 mg, there is a cross-bone femoral arm - and the honest intention-to-treat
  effect is +0.98 mm, an order of magnitude below the 3.5 per cent headline'
