human_evidence: absent
human_evidence_note: No human has received intra-osseous papain. The nearest human member of the same surgical-irritation
  class is kramer1955 - 12 children, 15 procedures, 11 beneficial, stimulation persisting six to ten months, with varus
  or valgus deformity, growth delay, complete fusion and infection named as complications.
translation_risk: high
translation_risk_reason: A 1963 rabbit experiment with no statistics reported, an endpoint measured on excised specimens
  with a caliper, and a bimodal response in which 41 per cent gain 3 to 6 mm and 8 per cent are harmed. The route is
  an intramedullary injection with a 30-minute tourniquet, which the operator has excluded on route grounds, and the
  agent is a broad-spectrum chondrolytic protease whose systemic administration arrests growth.
summary: 'R464 listed PMID 13992165 as blocked and "not open access". THAT WAS WRONG - the publisher serves the

  complete 5-page PDF free at the DOI-resolved URL, and it has now been read in full and every number in Tables I and
  II

  independently re-extracted and checked for internal consistency. The correction is owed to CLAUDE.md and is made there.

  What the paper contains is the single largest response rate of any growth-stimulation method of its era, a

  dose-segregated cost, a cross-bone arm, a plate-thickness-versus-length dissociation demonstrated in 1963, and an

  author''s generalisation that explains why the entire surgical-irritation corpus is unpredictable.


  ONE - THE EXPERIMENT. NORMAL New Zealand white rabbits about 1 kg, weighed daily with failure-to-thrive animals

  excluded. n=113: 89 experimental and 24 control. Papain protease activated with cysteine and versene, buffered to

  1 mg/ml, each shipment assayed against iodine-131-labelled albumin. Intramedullary injection into the PROXIMAL TIBIAL

  METAPHYSIS of the LEFT tibia through a No. 22 needle under intravenous nembutal, at 3 or 4 day intervals, with a RUBBER

  TOURNIQUET on the lower thigh maintained for 30 MINUTES after each injection to limit diffusion. Controls received

  three intratibial injections of buffer alone or of papain PREVIOUSLY INACTIVATED BY BOILING - so the control arm

  controls for the needle, the volume, the anaesthetic and the tourniquet, which is a strong design for 1963. Endpoint:

  caliper on the excised specimen, mean of three measurements, S.E. plus or minus 0.3 mm, with two-plane radiographs
  and

  coronal histology of both tibial plates, the lower femur and the contralateral upper tibia.


  TWO - TABLE I, RE-EXTRACTED AND INTERNALLY CONSISTENT. Of the 63 experimental animals followed 1 to 4 months the

  distribution of injected-minus-contralateral tibial length is: shorter by 2 to 11 mm, 5 animals; minus 1 to 0 mm, 1;

  equal, 15; plus 1 mm, 8; plus 2, 8; plus 3, 13; plus 4, 6; plus 5, 6; plus 6, 1 - summing to 63. The 20 long-term

  controls: minus 1 to 0 mm, 2; equal, 8; plus 1 mm, 7; plus 2 mm, 3; nothing at plus 3 or beyond - summing to 20. Both

  columns reconcile with the text exactly: 26 of 63 at plus 3 to plus 6 is the paper''s 41 per cent, and 3 of 20 controls

  at plus 2 with the remaining 17 within 1 mm is the paper''s own sentence.


  THREE - THE HONEST EFFECT SIZE IS AN ORDER OF MAGNITUDE BELOW THE HEADLINE, AND THIS IS THE MOST IMPORTANT NUMBER IN

  THE ROUND. The paper''s quoted 3.8 mm, 3.5 per cent of a 10.8 cm adult rabbit tibia, is a RESPONDER mean - it conditions

  on the outcome. Computing the intention-to-treat mean over the whole distribution, using the exact shortening values

  recoverable from Table II, gives papain plus 1.579 mm against control plus 0.600 mm: A NET EFFECT OF PLUS 0.98 mm,

  0.91 PER CENT OF TIBIAL LENGTH, t equals 2.56. And the papain standard deviation is 2.67 mm against the control''s
  0.80

  - a 3.3-fold variance ratio, which is the signature of a bimodal response rather than a shifted one. The paper reports

  no statistics at all; Fisher''s exact test computed here on the plus-3-mm threshold gives 26 of 63 against 0 of 20
  at

  p equals 1.5e-4, and on the plus-2-mm threshold 34 of 63 against 3 of 20 at p equals 1.9e-3.


  FOUR - THE CONTROLS CARRY THEIR OWN FINDING AND SECONDARY SUMMARIES OF THIS PAPER OBSCURE IT. Three of twenty controls

  reached plus 2 mm, and the author attributes this explicitly to the trauma of three intra-osseous injections. NEEDLE

  TRAUMA ALONE MOVES THE ENDPOINT. Papain''s marginal contribution is therefore the plus 3 to plus 6 band specifically,

  not the whole positive tail.


  FIVE - THE DOSE BAND, AND THE COST IS SEGREGATED FROM THE BENEFIT. Table II by arm: 0.2 mg times 3 read at 1 month,

  n=34, 11 responders, 1 animal 2 mm short; 0.2 mg times 3 read at 4 MONTHS, n=7, 5 responders, ZERO retardation; 0.2
  mg

  times 6 read at 2 months, n=14, 7 responders, 1 animal 2 mm and 2 animals 4 mm short; 0.3 mg times 3 read at 2 months,

  n=8, 3 responders, 1 animal 11 mm short. Responders sum to 26 and retardations to 5, reconciling with Table I. The

  author states that significant retardation occurred only above 0.6 mg TOTAL dose. Independently, 7 of the 63 showed

  PERMANENT plate changes - V-shaped deformity, persistent cartilaginous rests in the metaphysis, or areas reduced to
  a

  few rows of resting cells - and ALL were in the 0.3 mg or 6-injection groups. THE THERAPEUTIC WINDOW IS THREE

  INJECTIONS OF 0.2 mg AND EVERYTHING ABOVE IT COSTS. The 4-month arm has both the highest hit rate and zero harm, so
  the

  gain PERSISTS and is not an early transient.


  SIX - THE PLATE-THICKNESS VERSUS LENGTH DISSOCIATION, DEMONSTRATED IN 1963. Normal rabbit tibial cartilage columns

  measure about 0.4 mm. Four days after a single 0.2 mg injection every animal showed thickening of part or all of one
  or

  both plates, with portions reaching 0.85 mm, declining over the next 10 days. Six days after the second of two spaced

  injections one or both plates had UNIFORMLY DOUBLED with TRANSVERSE SPLITTING THROUGH THE HYPERTROPHIC ZONE. The

  author''s own words are that these changes did not persist more than a few days, and animals sacrificed 10 and 17 days

  after the second injection showed NO microscopic abnormality. Meanwhile the LENGTH gain persisted to 4 months. R463

  established from wilson2021 and bylskiaustrow2018 that hypertrophic zone height does not track growth and can miss
  a

  34 per cent cell-level effect at p equals 0.21 on the same sections. HERE THE DISSOCIATION RUNS THE OTHER WAY - a

  dramatic and fully reversible thickening sits on top of a small and permanent length gain - and it was in print in

  1963.


  SEVEN - A CROSS-BONE ARM, IN THE SAME ANIMALS. The FEMUR of the injected limb was 2 mm longer than the contralateral

  femur in 6 of 63 experimental animals, against no control difference exceeding 1 mm. R440, R441 and R442 identified
  the

  cross-bone arm of fracture overgrowth - an untouched bone in the same limb lengthening - as the genuinely unexplained

  residue after fracture-end callus and local periosteal release are subtracted. Here it appears after an intramedullary

  enzyme injection with no fracture, no periosteal stripping and no hardware.


  EIGHT - THE AUTHOR''S GENERALISATION IS A BAND AND IT IS THE MOST TRANSFERABLE THING IN THE PAPER. Reviewing the whole

  surgical corpus - periosteal stripping, metaphyseal drilling, insertion of metallic or organic materials, and

  Meisenbach''s 1910 intra-osseous irritants which were negative except for three animals RETARDED by formalin - he

  concludes that a mild tissue irritant near a plate does accelerate longitudinal growth, and that this is READILY

  REVERSED INTO RETARDATION IF THE OPTIMAL DEGREE OF IRRITATION IS EXCEEDED BY A SMALL MARGIN, attributing the field''s

  unpredictability to the narrow limits of tolerance of the plate. He claims papain gave the highest percentage of

  responders of any method then known - which is consistent with kramer1955''s 11 of 15 in children and forgon1985''s
  18 of

  20 in rabbits only if those are read as the author read them, i.e. as unpredictable methods with high deformity rates.


  NINE - AND THE ROUTE IS THE ENTIRE INTERVENTION, WHICH RESOLVES THE APPARENT CONTRADICTION R466 RECORDED. Schneider''s

  own opening sentence states that INTRAVENOUS papain in immature animals causes profound degenerative change in all

  epiphyseal plates and ARREST of growth. johnson1978papain and dixon1994papain report exactly that - systemic papain

  shortens bones. THERE IS NO CONTRADICTION: systemic papain arrests growth and intramedullary papain confined by a

  tourniquet lengthens the injected bone. The tourniquet is not a detail; it is what converts a chondrolytic systemic

  agent into a local stimulus.'
