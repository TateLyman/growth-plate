human_evidence: direct
human_evidence_note: 'The settled column rests on human trials (dauber2026, mcdonnell2026, accomplish2023)
  and the dead column on human Mendelian randomisation (de2026) plus mouse intervention studies that are
  labelled as such at each entry.'
species_basis:
- human
- mouse
