translation_risk: low
translation_risk_reason: 'A ledger inherits the translation risk of the nodes it indexes rather than adding
  its own. The risk specific to this node is STALENESS - it is a snapshot, and the gp130 entry is the
  proof that a ranking can survive in a summary after the evidence under it has been regraded.'
confidence: C
claim_grades:
- claim: The four terms listed as untouched are untouched because no agent exists, rather than because
    nobody looked.
  grade: D
  basis: 'Not established, and the distinction matters. POOL has a candidate with a length endpoint
    (trompet2024) so it is under-pursued rather than empty. ABSORPTIVE has agents in adjacent fields that
    this atlas has not audited against a height endpoint. SITE and NON-ENDOCHONDRAL have neither an agent
    nor a search logged, so for those two the honest statement is that nobody has looked.'
- claim: gp130/STAT3 is no longer a live lever.
  grade: D
  basis: 'The node grades "raising gp130/STAT3 output would lengthen bone" at E and the tool compound
    RCGD 423 at E, while keeping B for the axis being REQUIRED postnatally. Required and limiting are
    different properties and only the second makes a lever, so the round-89 ranking is superseded. But E
    means inference-level support, NOT refutation - the honest statement is that the lever claim is
    UNTESTED rather than dead, and that the one tool compound tried did not do what was assumed. A
    different agonist has never been screened. Graded D because this is a claim about the state of the
    evidence resting on a single node with no primary experiment behind either direction.'
- claim: A claim graded E in this atlas is a dead direction.
  grade: X
  basis: 'NO, AND THE FIRST DRAFT OF THIS NODE ASSERTED IT - CORR-113. schema/vocab.yaml defines E as
    "plausible inference from adjacent biology; explicitly flagged as inference" and X as "commonly
    repeated in reviews but not traceable to primary data". Neither is a refutation grade. Of the 64
    E-graded and 26 X-graded claims in the atlas, most mark an ABSENCE of primary evidence, which is a
    reason to measure rather than a reason to abandon. Only claims with contrary primary evidence are
    dead, and the ledger now separates the two columns.'
- claim: The exposure and targeting term is the highest-value live item.
  grade: C
  basis: 'It bears on the only arm with a proven bone-age-sparing effect, which is the property this
    subject needs; the constraint it attacks is documented in a sponsor protocol rather than inferred; and
    it has an existing molecule class. Against it, the thread hypothesis is itself graded D in
    thread_3_the_dose_ceiling_is_a_systemic_safety_margin and is directly opposed by the vosoritide PK/PD
    finding that exposure predicts target engagement but not growth. Ranked first on expected value, not
    on established support.'
- claim: This ledger is complete.
  grade: D
  basis: 'It covers every thread and named control point the atlas has explicitly opened or closed. It does
    NOT systematically cover the 343 open gaps, of which only three are tractability 1, nor the 64 E-graded
    and 26 X-graded claims spread across 662 nodes - those are the raw dead ledger and are only partly
    reflected here. A complete audit would enumerate them.'
