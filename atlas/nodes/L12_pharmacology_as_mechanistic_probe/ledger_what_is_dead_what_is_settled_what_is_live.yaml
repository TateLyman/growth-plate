id: ledger_what_is_dead_what_is_settled_what_is_live
name: THE LEDGER - every thread and axis sorted into dead, settled, or live, with the reason each one sits
  where it does
aliases:
- what is dead
- what is done
- what is left
- the audit
- where do we stand
- what should we go after next
type: hypothesis
layer: L12
stub: false
summary: 'THIS IS A BOOKKEEPING NODE, NOT A NEW FINDING. It exists because the atlas is now 662 nodes,
  1,269 references and 343 gaps, and the failure mode at that size is re-opening something already closed -
  which has happened eight times and is logged as CORR-077, CORR-086, CORR-094, CORR-109 and CORR-112. The
  ledger is sorted by the eight-term height decomposition this atlas uses: pool, amplification, h_term,
  duration, site, non-endochondral, delivery, absorptive.
  WHAT IS SETTLED AND IN THE STACK. FOUR TERMS ARE HIT. AMPLIFICATION is hit twice and the zone data
  separate the two agents - FGFR3 inhibition raises proliferative-zone length (kot2026, infigratinib) and
  growth hormone acts on the same term, while h_term belongs to the CNP axis, which nakao2015 partitions
  onto the hypertrophic zone. h_term IS THE ONLY ARM WITH A PROVEN HUMAN BONE-AGE-SPARING EFFECT -
  dauber2026 raised velocity 4.0 SD in non-FGFR3 children with the bone-age-to-chronological-age ratio
  unmoved - which is why it is the arm that matters most for a subject at bone age 16. DURATION is hit by
  oestrogen suppression. The combination evidence exists rather than being inferred: mcdonnell2026 gave
  navepegritide plus lonapegsomatropin 8.69 cm/year against 5.95 for matched navepegritide monotherapy.
  AND THE DESIGN RULE IS SETTLED AND IS A NEGATIVE - STACK ACROSS TERMS, NEVER WITHIN ONE. Two independent
  routes to more cGMP both failed to convert it into bone: sacubitril overgrows mice 2 to 3 per cent but is
  explicitly NOT additive with CNP (hakata2024), and tadalafil raised CNP-stimulated cGMP 37 per cent and
  tissue cGMP 52 per cent with NO gain in long bone length (wang2018). cGMP is not the limiting step once
  a CNP analogue is aboard.
  WHAT IS DEAD, AND THE DISTINCTION THAT HAS TO BE HELD. There are TWO negative categories in this atlas
  and collapsing them is a mistake this node made in its first draft and corrects here as CORR-113. The
  vocab defines grade E as "plausible inference from adjacent biology, explicitly flagged as inference"
  and grade X as "commonly repeated in reviews but not traceable to primary data". NEITHER MEANS REFUTED.
  A direction is DEAD only when contrary evidence exists; a direction graded E is merely UNSUPPORTED, and
  the correct response to it is a measurement, not avoidance.
  DEAD ON CONTRARY EVIDENCE - these must not be re-entered. (1) CILOSTAZOL AS AN h_term AGENT - CORR-098,
  it does not reach that term. (2) STACKING INSIDE THE cGMP NODE - two direct negative experiments, not
  inferences: sacubitril overgrows mice but is explicitly NOT additive with CNP (hakata2024), and
  tadalafil raised cGMP substantially with NO gain in bone length (wang2018). (3) THREAD 1, LOCAL IGF-1 -
  closed on six converging lines, the two decisive being de2026, where Mendelian randomisation over 1.18
  million people buys only 0.09 SD of adult height per 1 SD of serum IGF-1, and machnicki2022, where the
  intervention was effectively already run and raised local plate IGF-I bioavailability produced faster
  elongation, DISORGANISED plates, premature growth cessation and worse bone quality - the specific
  failure mode this project guards against. (4) THREAD 2, LOCAL WARMING - tired on an age gate this
  subject is past (serrat2013), a complete absence of any human length endpoint, and a partition ceiling
  at peptide molecular size.
  NOT DEAD, JUST UNSUPPORTED - graded E, meaning nobody has produced primary evidence either way, and each
  is therefore a MEASUREMENT OPPORTUNITY rather than a closed door. (5) gp130/STAT3 - THIS IS THE ONE THE
  LEDGER EXISTS TO CATCH, and the catch is a demotion rather than a burial. Ranked in round 89 as the top
  unhit entry, the only axis moving pool and duration together, it now carries B for being REQUIRED
  postnatally but E for "raising it would lengthen bone" and E for the compound RCGD 423 doing what was
  assumed. Required is not the same as limiting; the axis-audit summary still carries the superseded
  ranking, and a different agonist has never been screened. (6) THE PAPP-A AXIS as an h_term or phase-3
  lever, and hypertrophic-zone IGF restraint relief, both E - though both sit downstream of the IGF axis
  that de2026 caps, so their ceiling is inherited even if their mechanism is untested. (7) A PTHrP
  ANALOGUE such as abaloparatide, E. (8) sGC STIMULATORS, E - but note these sit inside the cGMP node,
  which IS dead on direct evidence, so this one is effectively closed by category rather than by its own
  grade. (9) DELAYING THE PROGRAM BY SLOWING GROWTH being height-neutral rather than height-additive, E -
  an inference that would kill an entire intuitive class of strategy if established, and it is not.
  WHAT IS LIVE, RANKED. FIRST AND NEW THIS ROUND: THE EXPOSURE AND TARGETING TERM - see
  thread_3_the_dose_ceiling_is_a_systemic_safety_margin. The ACcomplisH protocol shows the CNP dose was
  capped at half the trial pre-specified maximum by an ANTICIPATORY SYSTEMIC CARDIOVASCULAR MARGIN, not by
  observed human toxicity and not by an efficacy plateau, on a dose-response still rising at the top dose.
  Meanwhile growth_plate_drug_exposure establishes that not one of twelve audited agents has a published
  growth-plate tissue concentration in any species. The safety argument is denominated in systemic
  concentration and the efficacy argument in plate concentration, and only the first is ever measured. A
  cartilage-restricted molecule attacks exactly that gap and the delivery literature has already built the
  class. THIS IS THE RECOMMENDED NEXT DIVE. SECOND: THE POOL TERM, where trompet2024 remains the only pool
  intervention with a LENGTH endpoint - intra-articular SAG, plus 3.63 per cent femur in rat - and is the
  only arm that ADDS a progenitor rather than redistributing a fixed budget. THIRD: THE ABSORPTIVE TERM -
  rauch2004, peak lean mass velocity leads and predicts peak bone mineral velocity; every agent in the
  stack drives length and nothing drives the tissue that carries it, and the one catastrophic human outcome
  on this axis was spinal. FOURTH: THE MECHANICAL TERM, which is free but internally contradictory -
  axial load restrains elongation through mTOR (caetanosilva2021) and the remaining reserve at bone age 16
  is spinal (costa2021), yet serrat2010 shows running LENGTHENS limb bones. Nobody has tested delivery and
  load restraint in one preparation, so the prescription LOAD THE LIMBS AND UNLOAD THE SPINE is
  underdetermined rather than settled. FIFTH: PP2A INHIBITION AT THE FGFR3-NPR2 NODE, demoted by CORR-083
  from supra-additive to merely additive, and possibly redundant with an FGFR inhibitor that has already
  removed the FGF signal it counteracts. SITE and NON-ENDOCHONDRAL remain entirely untouched.
  THREAD 3 UPDATE, ROUNDS 116-125 - SEE thread_3_close_out FOR THE FULL ACCOUNTING. Eleven questions
  answered, each with a document behind it: the CNP dose cap is an anticipatory systemic cardiovascular
  margin and not an efficacy plateau; vosoritide IS cleared by NPR-C and its engineering bought no
  selectivity there; the human plate makes NO CNP of its own and is a starved consumer that transcribes
  both local sinks; human physeal half-thickness is about 400 micrometres and cartilage diffusivity is
  measured and zone-resolved; the NPR-C-evading molecule was patented in 2009 and never built; and
  continuous exposure is NOT required at the receptor. TWO CANDIDATES DIED IN THE PROCESS - the NPR2
  allosteric modulator, killed by the consumer finding, and the sub-picomolar SPR affinity that round
  121 built on, withdrawn as a 577-fold outlier against radioligand data. ONE QUESTION REMAINS AND IT
  IS A SINGLE MEASUREMENT: whether the dual-resistant CNP analogue gains therapeutic index or is a dose
  increase in disguise turns entirely on the Thiele modulus, and a concentration-versus-depth profile
  in a growth plate returns it as one fitted parameter. Every documentary route is exhausted; this one
  needs an experiment.
  ROUND 140 - THE VERDICT ON THE PHOSPHATASE ARM IS *HELD*, NOT IN AND NOT OUT, AND THE REASON IS NOW
  DOCUMENTED. Human population genetics was interrogated directly - GWAS Catalog, GTEx and gnomAD, all
  queried by this atlas rather than read from a review - to ask whether people carrying less PPP-family
  phosphatase are taller. THE TARGET SURVIVES: NPR2 is a first-rank human height gene to p = 6e-150 with
  missense alleles moving stature in both directions. THE ROUTE DOES NOT. PPP5C, one of the two enzymes
  LB-100 actually inhibits, is a height locus whose height-LOWERING allele LOWERS PPP5C expression across
  seven tissues - less phosphatase, SHORTER. The apparently spectacular PPP2R5D signal at p = 4e-73
  dissolves on inspection into a seven-gene expression locus in which PEX6 and CUL7, both established
  human short-stature genes, outrank PPP2R5D. And the direct test - variants at the seven NPR2 regulatory
  phosphosites - is IMPOSSIBLE IN PRINCIPLE: every phospho-destroying allele in gnomAD v4 sits near one in
  a million, so a 500,000-person biobank holds about six carriers.
  SO THE ARM CANNOT BE ADDED AND CANNOT BE REMOVED FROM DOCUMENTS. Everything documentary is now spent:
  the mechanism is real in mouse, the exposure arithmetic closes with a 2.6 to 3.2-fold margin, the
  delivery format is solved, and the human genetics either points the wrong way or cannot be powered.
  What decides it is one minipump study, fully specified in
  the_experiment_specified_and_what_is_missing. Until that runs, this arm is HELD - carried in the atlas
  as a specified, costed, undecided proposition, and NOT counted in any height projection.
  ROUND 141 - THE LEDGER SPLITS THE CNP AXIS IN TWO, AND THE LIGAND HALF MOVES TO *IN*. Rounds 134 to 140
  asked whether phosphatase inhibition works. For a case at bone age 16 whose reserve is SPINAL, two prior
  questions decide more, and neither had been asked: does this axis reach the SPINE, and does it survive to
  a LATE age. Both now answer favourably. SITE: the 7E mouse grows its TAIL - pure caudal vertebrae - by 8.5
  to 9.7 per cent against femur 8.4, computed here from the shuhaibar2017 per-animal file the atlas had held
  unread since round 133, and the axial advantage DECAYS LESS than the appendicular one, 12 per cent lost
  against 39. In humans SITTING HEIGHT rises +0.79 SD at 24 months, significantly and by MORE than arm span
  at +0.32. NOTE THE CLAIM THAT DID *NOT* SURVIVE: this ledger initially recorded the axis as PROPORTIONATE
  on the pooled ULS ratio of -0.02, I-squared 0 - but that is a NULL, p = 0.17, and reading the 24-month
  cohort at source shows its ULS ratio DOES move, -0.10, p at most 0.01, leg-favouring. Strict
  proportionality is downgraded to grade D as conflicting (CORR-146). What the case needs is the weaker
  claim, which holds at B: the axis REACHES the trunk. AGE: the meta-analysis finds the velocity gain LARGER above five years, 1.63
  cm/yr against 0.91 below, p_subgroup = 0.01 - the OPPOSITE of the age decay this atlas had assumed for
  late bone ages since the thread began, and NOT a regression artefact, because it is an absolute cm/year
  difference against a concurrent placebo arm. SO THE LIGAND ARM IS IN: it is the only agent here with RANDOMISED
  HUMAN evidence that it grows the axial skeleton at all and does not fade with age within the
  range measured. It is NOT evidence at bone age 16 - the trials stop below 18 chronological years in a
  skeletally DELAYED population, and the achondroplasia background is not a normal one - so what moved is
  the prior, not the evidence at the target age.
  AND THE PHOSPHATASE ARM STAYS HELD, BUT ITS PRICE IS NOW A NUMBER. Scaled to a normal FGFR3 background,
  the ligand arm is worth roughly 0.5 to 1.1 cm/yr and the phosphatase increment 0.2 to 0.5 cm/yr on top -
  over a two-to-four-year residual spinal window, about 1 to 4.6 cm from the ligand and 0.4 to 1.9 cm from
  the phosphatase. That projection is grade E, a chain of four uncertain multiplications recorded to PRICE
  the decision and not as a prediction. What it buys the ledger is a clean trade: the phosphatase route is
  the ONLY thing that gets past the ligand ceiling - FGF inhibition of NPR2 is not surmountable by more
  ligand - and it is worth ON THE ORDER OF ONE CENTIMETRE, against a compound with a 2.6 to 3.2-fold
  exposure margin, no in vivo bone-length data in any species, and human genetics pointing the wrong way on
  the two genes that can be read. One centimetre is not nothing at bone age 16, and it is not enough to buy
  blind. The minipump study remains the gate. Written up in the_verdict_on_the_cnp_axis_for_this_case.
  ROUND 142 - THE ARMS FINALLY RESOLVE TO NAMED MOLECULES, AND TWO OF THE THREE CHOICES WERE DECIDABLE ON
  EVIDENCE ALREADY HELD. See the_named_compounds_for_this_case. DURATION resolves to ANASTROZOLE, not
  letrozole, on the only attained-adult-height comparison at the right bone age - cui2025, boys at bone age
  13 or above followed to adult height, 0.81 SDS against 0.60 for letrozole - and the mechanism is a
  DISSOCIATION: letrozole suppresses oestrogen harder and delivers LESS height, so this arm must not be
  dosed to maximal suppression. The arm is a MULTIPLIER, not an agent: NCT01248416 gives +0.5 cm predicted
  adult height alone against +7.4 combined. AMPLIFICATION resolves to INFIGRATINIB, now peer-reviewed in the
  NEJM (n = 114, ages 3 to 17, +1.74 cm/yr, height Z +0.32) - and the round added a datum the atlas did not
  have: its UPPER-TO-LOWER SEGMENT RATIO IS -0.02, THE SAME POINT ESTIMATE THE CNP META-ANALYSIS RETURNS.
  Two unrelated axes, two randomised datasets, neither distorts proportion, so proportionality cannot be
  used to choose between them. h_term resolves to VOSORITIDE over navepegritide on a tissue-level inference
  the atlas held but had never applied - thread 3 found continuous receptor exposure is NOT required, which
  removes the weekly agent advantage, while the plate transcribes neprilysin at receptor-comparable levels
  and vosoritide alone is NEP-resistant. That call is grade E and reversible.
  TWO THINGS THE ROUND ESTABLISHED THAT CONSTRAIN THE PLAN. TYRA-300, now named dabogratinib, is the
  compound this case most wants - the ONLY agent lengthening bone in a WILD-TYPE animal and the only one
  raising LUMBAR VERTEBRAL length - and it is UNAVAILABLE: its skeletal trial BEACH301 is capped at age 10
  and its only human data are three oncology case reports. AND THE WEAKEST LINK IS NAMED: an FGFR3 inhibitor
  and a CNP analogue have NEVER been co-administered in any species, the zonal model predicts additivity and
  the shared-ERK model predicts redundancy, and this atlas has used each argument elsewhere. The third drug
  in the plan is the least justified one.
  ROUND 144 - THE CNP ARM WAS *NOT* UNCHANGED, AND THE COMPOUND IT POINTS AT IS AN NPR3 ANTAGONIST.
  Round 142 put vosoritide on the h_term arm, which CONTRADICTED this atlas own compound specification -
  the_compound_this_thread_needs derives the molecule from constraints and concludes the answer is NOT a
  CNP analogue but a small NPR3-SELECTIVE ANTAGONIST that blocks CLEARANCE instead of adding ligand. Three
  things established this round put that route in materially better shape than the atlas had recorded.
  FIRST, NPR3 BLOCKADE LENGTHENS BONE, AND THE PAPER WAS ALREADY HERE. watanabetakano2021, in this
  bibliography since 2026-08-08: periosteal OSTEOCRIN occupies NPR3, spares CNP from clearance and
  ELONGATES LONG BONES in mouse. The compound-spec node asserted no NPR3 antagonist had ever been tested
  against a bone-length endpoint in any species; a held reference refutes it (CORR-150). It also closes the
  MECHANICAL arm onto this one - load induces Ostn via FoxO1 suppression, so loading lengthens bone THROUGH
  THIS NODE, which is a mechanism for the direction the ledger had recorded as contradictory.
  SECOND, AND THIS IS THE ROUND MOST IMPORTANT FINDING: THE CARDIOVASCULAR CEILING THAT CAPS THIS ENTIRE
  AXIS IS A MOUSE PHENOTYPE. Every candidate on the CNP axis has died against vascular NPR2 and an
  anticipatory cynomolgus margin. Reading lauffer2022 in full - it was abstract-only here - gives three
  biallelic NPR3-null males at +3.03, +3.9 and +3.93 SDS, the proband 205.1 cm at 14.7 years with NORMAL
  body proportions, and blood pressures of 99/62, 95/54 and 111/69 with normal haematocrit, creatinine and
  GFR and explicitly NO volume contraction, hypotension or excessive diuresis. THE MOUSE NULL IS
  HYPOTENSIVE. A species dissociation running the favourable way (CORR-151). AND IT ROUTES AROUND THE
  ROUND-122 TRANSPORT FAILURE: that verdict closed the dual-resistant ANALOGUE, whose escape needed a
  diffusion-limited plate, and the atlas let it cover the CLEARANCE BLOCKER too. It should not have - the
  human proof of concept is a SYSTEMIC lifelong knockout invoking no local asymmetry at all.
  THIRD, THE ANTAGONIST CHEMISTRY EXISTS. nishizawa2017 built a potent, NPR3-selective, protease-hardened
  11-MER blocker that is serum-stable and raises PLASMA cGMP IN LIVE MICE; veale2000 optimised ANP(4-23)
  and AP-811 for physical properties while retaining affinity. The atlas had recorded only the AGONIST
  series (smith2022) and dismissed the antagonists as research reagents.
  WHAT IS STILL MISSING, STATED SO THE ROUTE IS NOT OVERSOLD: no pharmacological NPR3 antagonist has been
  dosed against a bone endpoint in any species or given to any human; compound 23 selectivity over NPR2 -
  the receptor that carries the liability - is not reported; n = 3 for the human phenotype, all children;
  scoliosis is part of that phenotype; and the proband bone age was ADVANCED, 11 y 3 m at chronological
  age 10, which is the worst possible property for a bone-age-16 case. SO THE ARM SPLITS: TAKE vosoritide
  now, BUILD OR ACQUIRE an NPR3 antagonist, and the second is the highest-value unbuilt compound in this
  atlas.
  THE CEILING THAT SITS OVER ALL OF IT, restated so no live item is read as unbounded: two men with zero
  lifetime oestrogen signal reached 197 and 204 cm, one still growing at 24 with plates anatomically open.
  Every intra-plate axis rearranges a budget a human natural experiment has already shown to be finite.'
quantitative:
- parameter: 'THE SCORECARD - eight terms, how many are hit'
  value: 'four hit (amplification, h_term, duration, delivery-as-currently-conceived), four untouched
    (pool, site, non-endochondral, absorptive)'
  unit: count of terms in the atlas own height decomposition
  conditions: 'Derived from every_axis_checked_against_the_stack, corrected forward. That node scored
    h_term as hit WEAKLY via cilostazol; CORR-098 removed cilostazol from that term, and the CNP axis
    subsequently filled it properly, so h_term is now hit WELL rather than weakly. The delivery term is
    scored hit only in the sense that the stack has agents that reach the circulation - thread 3 argues
    the term should be rescored as UNMEASURED, since no growth-plate concentration exists for any agent.'
  species: not_applicable
  source_ref: accomplish_protocol_v5
  uncertainty: 'THIS IS A STRUCTURAL COUNT OVER THE ATLAS OWN DECOMPOSITION AND CARRIES NO EVIDENCE GRADE.
    The decomposition is this atlas construction, stated so it can be checked rather than trusted; a
    different factorisation would give a different scorecard. The source_ref is nominal - the row is
    bookkeeping over other nodes, not a claim from a paper.'
localization:
- 'not localised - this node is an index over the whole atlas'
human_evidence: direct
human_evidence_note: 'The settled column rests on human trials (dauber2026, mcdonnell2026, accomplish2023)
  and the dead column on human Mendelian randomisation (de2026) plus mouse intervention studies that are
  labelled as such at each entry.'
species_basis:
- human
- mouse
- rat
translation_risk: low
translation_risk_reason: 'A ledger inherits the translation risk of the nodes it indexes rather than adding
  its own. The risk specific to this node is STALENESS - it is a snapshot, and the gp130 entry is the
  proof that a ranking can survive in a summary after the evidence under it has been regraded.'
confidence: C
claim_grades:
- claim: The four terms listed as untouched are untouched because no agent exists, rather than because
    nobody looked.
  grade: D
  basis: 'Not established, and the distinction matters. POOL has a candidate with a length endpoint
    (trompet2024) so it is under-pursued rather than empty. ABSORPTIVE has agents in adjacent fields that
    this atlas has not audited against a height endpoint. SITE and NON-ENDOCHONDRAL have neither an agent
    nor a search logged, so for those two the honest statement is that nobody has looked.'
- claim: gp130/STAT3 is no longer a live lever.
  grade: D
  basis: 'The node grades "raising gp130/STAT3 output would lengthen bone" at E and the tool compound
    RCGD 423 at E, while keeping B for the axis being REQUIRED postnatally. Required and limiting are
    different properties and only the second makes a lever, so the round-89 ranking is superseded. But E
    means inference-level support, NOT refutation - the honest statement is that the lever claim is
    UNTESTED rather than dead, and that the one tool compound tried did not do what was assumed. A
    different agonist has never been screened. Graded D because this is a claim about the state of the
    evidence resting on a single node with no primary experiment behind either direction.'
- claim: A claim graded E in this atlas is a dead direction.
  grade: X
  basis: 'NO, AND THE FIRST DRAFT OF THIS NODE ASSERTED IT - CORR-113. schema/vocab.yaml defines E as
    "plausible inference from adjacent biology; explicitly flagged as inference" and X as "commonly
    repeated in reviews but not traceable to primary data". Neither is a refutation grade. Of the 64
    E-graded and 26 X-graded claims in the atlas, most mark an ABSENCE of primary evidence, which is a
    reason to measure rather than a reason to abandon. Only claims with contrary primary evidence are
    dead, and the ledger now separates the two columns.'
- claim: The exposure and targeting term is the highest-value live item.
  grade: C
  basis: 'It bears on the only arm with a proven bone-age-sparing effect, which is the property this
    subject needs; the constraint it attacks is documented in a sponsor protocol rather than inferred; and
    it has an existing molecule class. Against it, the thread hypothesis is itself graded D in
    thread_3_the_dose_ceiling_is_a_systemic_safety_margin and is directly opposed by the vosoritide PK/PD
    finding that exposure predicts target engagement but not growth. Ranked first on expected value, not
    on established support.'
- claim: This ledger is complete.
  grade: D
  basis: 'It covers every thread and named control point the atlas has explicitly opened or closed. It does
    NOT systematically cover the 343 open gaps, of which only three are tractability 1, nor the 64 E-graded
    and 26 X-graded claims spread across 662 nodes - those are the raw dead ledger and are only partly
    reflected here. A complete audit would enumerate them.'
