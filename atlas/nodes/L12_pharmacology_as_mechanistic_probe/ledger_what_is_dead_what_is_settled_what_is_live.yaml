id: ledger_what_is_dead_what_is_settled_what_is_live
name: THE LEDGER - every thread and axis sorted into dead, settled, or live, with the reason each one sits
  where it does
aliases:
- what is dead
- what is done
- what is left
- the audit
- where do we stand
- what should we go after next
type: hypothesis
layer: L12
stub: false
summary: 'THIS IS A BOOKKEEPING NODE, NOT A NEW FINDING. It exists because the atlas is now 662 nodes,
  1,269 references and 343 gaps, and the failure mode at that size is re-opening something already closed -
  which has happened eight times and is logged as CORR-077, CORR-086, CORR-094, CORR-109 and CORR-112. The
  ledger is sorted by the eight-term height decomposition this atlas uses: pool, amplification, h_term,
  duration, site, non-endochondral, delivery, absorptive.
  WHAT IS SETTLED AND IN THE STACK. FOUR TERMS ARE HIT. AMPLIFICATION is hit twice and the zone data
  separate the two agents - FGFR3 inhibition raises proliferative-zone length (kot2026, infigratinib) and
  growth hormone acts on the same term, while h_term belongs to the CNP axis, which nakao2015 partitions
  onto the hypertrophic zone. h_term IS THE ONLY ARM WITH A PROVEN HUMAN BONE-AGE-SPARING EFFECT -
  dauber2026 raised velocity 4.0 SD in non-FGFR3 children with the bone-age-to-chronological-age ratio
  unmoved - which is why it is the arm that matters most for a subject at bone age 16. DURATION is hit by
  oestrogen suppression. The combination evidence exists rather than being inferred: mcdonnell2026 gave
  navepegritide plus lonapegsomatropin 8.69 cm/year against 5.95 for matched navepegritide monotherapy.
  AND THE DESIGN RULE IS SETTLED AND IS A NEGATIVE - STACK ACROSS TERMS, NEVER WITHIN ONE. Two independent
  routes to more cGMP both failed to convert it into bone: sacubitril overgrows mice 2 to 3 per cent but is
  explicitly NOT additive with CNP (hakata2024), and tadalafil raised CNP-stimulated cGMP 37 per cent and
  tissue cGMP 52 per cent with NO gain in long bone length (wang2018). cGMP is not the limiting step once
  a CNP analogue is aboard.
  WHAT IS DEAD, AND THE DISTINCTION THAT HAS TO BE HELD. There are TWO negative categories in this atlas
  and collapsing them is a mistake this node made in its first draft and corrects here as CORR-113. The
  vocab defines grade E as "plausible inference from adjacent biology, explicitly flagged as inference"
  and grade X as "commonly repeated in reviews but not traceable to primary data". NEITHER MEANS REFUTED.
  A direction is DEAD only when contrary evidence exists; a direction graded E is merely UNSUPPORTED, and
  the correct response to it is a measurement, not avoidance.
  DEAD ON CONTRARY EVIDENCE - these must not be re-entered. (1) CILOSTAZOL AS AN h_term AGENT - CORR-098,
  it does not reach that term. (2) STACKING INSIDE THE cGMP NODE - two direct negative experiments, not
  inferences: sacubitril overgrows mice but is explicitly NOT additive with CNP (hakata2024), and
  tadalafil raised cGMP substantially with NO gain in bone length (wang2018). (3) THREAD 1, LOCAL IGF-1 -
  closed on six converging lines, the two decisive being de2026, where Mendelian randomisation over 1.18
  million people buys only 0.09 SD of adult height per 1 SD of serum IGF-1, and machnicki2022, where the
  intervention was effectively already run and raised local plate IGF-I bioavailability produced faster
  elongation, DISORGANISED plates, premature growth cessation and worse bone quality - the specific
  failure mode this project guards against. (4) THREAD 2, LOCAL WARMING - tired on an age gate this
  subject is past (serrat2013), a complete absence of any human length endpoint, and a partition ceiling
  at peptide molecular size.
  NOT DEAD, JUST UNSUPPORTED - graded E, meaning nobody has produced primary evidence either way, and each
  is therefore a MEASUREMENT OPPORTUNITY rather than a closed door. (5) gp130/STAT3 - THIS IS THE ONE THE
  LEDGER EXISTS TO CATCH, and the catch is a demotion rather than a burial. Ranked in round 89 as the top
  unhit entry, the only axis moving pool and duration together, it now carries B for being REQUIRED
  postnatally but E for "raising it would lengthen bone" and E for the compound RCGD 423 doing what was
  assumed. Required is not the same as limiting; the axis-audit summary still carries the superseded
  ranking, and a different agonist has never been screened. (6) THE PAPP-A AXIS as an h_term or phase-3
  lever, and hypertrophic-zone IGF restraint relief, both E - though both sit downstream of the IGF axis
  that de2026 caps, so their ceiling is inherited even if their mechanism is untested. (7) A PTHrP
  ANALOGUE such as abaloparatide, E. (8) sGC STIMULATORS, E - but note these sit inside the cGMP node,
  which IS dead on direct evidence, so this one is effectively closed by category rather than by its own
  grade. (9) DELAYING THE PROGRAM BY SLOWING GROWTH being height-neutral rather than height-additive, E -
  an inference that would kill an entire intuitive class of strategy if established, and it is not.
  WHAT IS LIVE, RANKED. FIRST AND NEW THIS ROUND: THE EXPOSURE AND TARGETING TERM - see
  thread_3_the_dose_ceiling_is_a_systemic_safety_margin. The ACcomplisH protocol shows the CNP dose was
  capped at half the trial pre-specified maximum by an ANTICIPATORY SYSTEMIC CARDIOVASCULAR MARGIN, not by
  observed human toxicity and not by an efficacy plateau, on a dose-response still rising at the top dose.
  Meanwhile growth_plate_drug_exposure establishes that not one of twelve audited agents has a published
  growth-plate tissue concentration in any species. The safety argument is denominated in systemic
  concentration and the efficacy argument in plate concentration, and only the first is ever measured. A
  cartilage-restricted molecule attacks exactly that gap and the delivery literature has already built the
  class. THIS IS THE RECOMMENDED NEXT DIVE. SECOND: THE POOL TERM, where trompet2024 remains the only pool
  intervention with a LENGTH endpoint - intra-articular SAG, plus 3.63 per cent femur in rat - and is the
  only arm that ADDS a progenitor rather than redistributing a fixed budget. THIRD: THE ABSORPTIVE TERM -
  rauch2004, peak lean mass velocity leads and predicts peak bone mineral velocity; every agent in the
  stack drives length and nothing drives the tissue that carries it, and the one catastrophic human outcome
  on this axis was spinal. FOURTH: THE MECHANICAL TERM, which is free but internally contradictory -
  axial load restrains elongation through mTOR (caetanosilva2021) and the remaining reserve at bone age 16
  is spinal (costa2021), yet serrat2010 shows running LENGTHENS limb bones. Nobody has tested delivery and
  load restraint in one preparation, so the prescription LOAD THE LIMBS AND UNLOAD THE SPINE is
  underdetermined rather than settled. FIFTH: PP2A INHIBITION AT THE FGFR3-NPR2 NODE, demoted by CORR-083
  from supra-additive to merely additive, and possibly redundant with an FGFR inhibitor that has already
  removed the FGF signal it counteracts. SITE and NON-ENDOCHONDRAL remain entirely untouched.
  THREAD 3 UPDATE, ROUNDS 116-125 - SEE thread_3_close_out FOR THE FULL ACCOUNTING. Eleven questions
  answered, each with a document behind it: the CNP dose cap is an anticipatory systemic cardiovascular
  margin and not an efficacy plateau; vosoritide IS cleared by NPR-C and its engineering bought no
  selectivity there; the human plate makes NO CNP of its own and is a starved consumer that transcribes
  both local sinks; human physeal half-thickness is about 400 micrometres and cartilage diffusivity is
  measured and zone-resolved; the NPR-C-evading molecule was patented in 2009 and never built; and
  continuous exposure is NOT required at the receptor. TWO CANDIDATES DIED IN THE PROCESS - the NPR2
  allosteric modulator, killed by the consumer finding, and the sub-picomolar SPR affinity that round
  121 built on, withdrawn as a 577-fold outlier against radioligand data. ONE QUESTION REMAINS AND IT
  IS A SINGLE MEASUREMENT: whether the dual-resistant CNP analogue gains therapeutic index or is a dose
  increase in disguise turns entirely on the Thiele modulus, and a concentration-versus-depth profile
  in a growth plate returns it as one fitted parameter. Every documentary route is exhausted; this one
  needs an experiment.
  ROUND 140 - THE VERDICT ON THE PHOSPHATASE ARM IS *HELD*, NOT IN AND NOT OUT, AND THE REASON IS NOW
  DOCUMENTED. Human population genetics was interrogated directly - GWAS Catalog, GTEx and gnomAD, all
  queried by this atlas rather than read from a review - to ask whether people carrying less PPP-family
  phosphatase are taller. THE TARGET SURVIVES: NPR2 is a first-rank human height gene to p = 6e-150 with
  missense alleles moving stature in both directions. THE ROUTE DOES NOT. PPP5C, one of the two enzymes
  LB-100 actually inhibits, is a height locus whose height-LOWERING allele LOWERS PPP5C expression across
  seven tissues - less phosphatase, SHORTER. The apparently spectacular PPP2R5D signal at p = 4e-73
  dissolves on inspection into a seven-gene expression locus in which PEX6 and CUL7, both established
  human short-stature genes, outrank PPP2R5D. And the direct test - variants at the seven NPR2 regulatory
  phosphosites - is IMPOSSIBLE IN PRINCIPLE: every phospho-destroying allele in gnomAD v4 sits near one in
  a million, so a 500,000-person biobank holds about six carriers.
  SO THE ARM CANNOT BE ADDED AND CANNOT BE REMOVED FROM DOCUMENTS. Everything documentary is now spent:
  the mechanism is real in mouse, the exposure arithmetic closes with a 2.6 to 3.2-fold margin, the
  delivery format is solved, and the human genetics either points the wrong way or cannot be powered.
  What decides it is one minipump study, fully specified in
  the_experiment_specified_and_what_is_missing. Until that runs, this arm is HELD - carried in the atlas
  as a specified, costed, undecided proposition, and NOT counted in any height projection.
  THE CEILING THAT SITS OVER ALL OF IT, restated so no live item is read as unbounded: two men with zero
  lifetime oestrogen signal reached 197 and 204 cm, one still growing at 24 with plates anatomically open.
  Every intra-plate axis rearranges a budget a human natural experiment has already shown to be finite.'
quantitative:
- parameter: 'THE SCORECARD - eight terms, how many are hit'
  value: 'four hit (amplification, h_term, duration, delivery-as-currently-conceived), four untouched
    (pool, site, non-endochondral, absorptive)'
  unit: count of terms in the atlas own height decomposition
  conditions: 'Derived from every_axis_checked_against_the_stack, corrected forward. That node scored
    h_term as hit WEAKLY via cilostazol; CORR-098 removed cilostazol from that term, and the CNP axis
    subsequently filled it properly, so h_term is now hit WELL rather than weakly. The delivery term is
    scored hit only in the sense that the stack has agents that reach the circulation - thread 3 argues
    the term should be rescored as UNMEASURED, since no growth-plate concentration exists for any agent.'
  species: not_applicable
  source_ref: accomplish_protocol_v5
  uncertainty: 'THIS IS A STRUCTURAL COUNT OVER THE ATLAS OWN DECOMPOSITION AND CARRIES NO EVIDENCE GRADE.
    The decomposition is this atlas construction, stated so it can be checked rather than trusted; a
    different factorisation would give a different scorecard. The source_ref is nominal - the row is
    bookkeeping over other nodes, not a claim from a paper.'
