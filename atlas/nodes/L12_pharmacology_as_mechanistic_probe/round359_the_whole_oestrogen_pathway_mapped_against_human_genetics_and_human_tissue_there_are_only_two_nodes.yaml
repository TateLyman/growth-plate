contradicts:
- ANSWERS THE OPERATOR'S QUESTION IN THE NEGATIVE FOR THE REASON OPPOSITE TO THE ONE EXPECTED. The obstacle
  to covering the whole pathway with compounds is not that the compounds are missing - it is that the
  pathway is not in the tissue. Six branches close on measurement.
- CLOSES ERbeta AGENTS, GPER ANTAGONISTS, COACTIVATOR-INTERACTION INHIBITORS, SULFATASE INHIBITORS,
  17-beta-HSD1 INHIBITORS AND GONADOTROPIN SUPPRESSION for this case, each for a stated reason.
- CORRECTS R353 ON ITS OWN AXIS. CRBN, the E3 vepdegestrant recruits, is contaminant-leaning at ratio 0.69
  while STUB1 is enriched at 2.26. The PROTAC recruits the less tissue-appropriate ligase of the two. This
  does not disqualify it - 31.5 CPM in 12/12 is real presence - but it removes the claim that cereblon is
  the natural choice here.
- CORRECTS MYSELF WITHIN THE ROUND. I first read the ESR1 heterozygous pLoF row (+0.040, P=0.963) as
  evidence that ERalpha is haplosufficient for height, which would have argued that partial degradation is
  useless. The 95% CI is [-1.626, +1.706] and the row is uninformative.
- REINFORCES R358's REFRAMING. With the pathway two nodes wide and one already occupied, the only available
  addition is an ERalpha-directed agent - so the question is not which combination to assemble but whether
  that single remaining node is worth taking.
