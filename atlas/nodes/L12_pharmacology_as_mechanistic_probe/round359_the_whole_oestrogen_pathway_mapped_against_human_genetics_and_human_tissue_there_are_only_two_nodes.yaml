id: round359_the_whole_oestrogen_pathway_mapped_against_human_genetics_and_human_tissue_there_are_only_two_nodes
name: Round 359 - the complete oestrogen pathway run against 1.45M exomes and against purity-corrected
  human growth plate. Of about seventy genes only TWO reach the height table, the plate has the receptor and
  almost none of the classical apparatus, and anastrozole plus a degrader is a MORE complete lesion than
  either human genetic model
aliases:
- the whole oestrogen pathway mapped
- can we cover every node with compounds
- there is no third node
- exceeding the ERalpha-null
- STUB1 is the endogenous PROTAC
type: hypothesis
layer: L12
stub: false
summary: 'The operator asked whether every closure mechanism running through oestrogen - synthesis, the
  sulfate reservoir, ERalpha, ERbeta, GPER, AF-1, AF-2, coregulators, clearance, the gonadotropin axis -
  could be covered with compounds, however niche, to reproduce or exceed the ERalpha-null human. About
  seventy genes spanning the whole pathway were run against kosmicki2026''s signed burden table and against
  the purity-corrected human growth plate. THE ANSWER IS THAT THERE IS NO PATHWAY TO COVER. ⭐ ONLY TWO OF
  ABOUT SEVENTY GENES REACH THE 207: POR, the obligate electron donor for CYP19A1, at pure-pLoF +1.080 cm
  (P=5.0e-08, 1,261 carriers) and perfectly monotone in variant severity - which is the aromatase-inhibitor
  direction with a human effect size, and the arm anastrozole already occupies; and ESR1 itself, all-missense
  +0.356 cm at P=5.6e-16 across 26,176 carriers, rising to +1.68 to +1.92 cm on the singleton rows. EVERY
  OTHER NODE IS ABSENT FROM THE HEIGHT TABLE - CYP19A1, STS, SULT1E1, all seven HSD17Bs, ESR2, GPER1, AR, all
  eleven coregulators, GREB1, PGR, TFF1, the entire gonadotropin axis, and the whole clearance apparatus.
  ⭐⭐ AND THE TISSUE SAYS THE SAME THING FROM THE OTHER DIRECTION. In purity-corrected human growth plate the
  plate has the RECEPTOR PROTEIN and almost none of the canonical machinery: ESR2 ratio 0.04 (ERbeta in the
  plate was contamination outright), GPER1 0.76 at 3.2 CPM, and EVERY classical coregulator
  contaminant-leaning - NCOA1 0.11, NCOA2 0.10, NCOA3 0.17, GATA3 0.14, CREBBP 0.24, EP300 0.36, NCOR1 0.37 -
  with the classical target genes GREB1 0.52, PGR 0.68 and TFF1 4/12 near-absent. CYP19A1 is 0.6 CPM at ratio
  0.71, so there is no local aromatase and anastrozole necessarily acts systemically. The estrone-sulfate
  reservoir is not local either (STS 0.39, SLCO2B1 0.27, SULT2B1 0.36), so irosustat and every sulfatase
  inhibitor is systemic ligand-lowering - anastrozole''s own arm, and R274 and R337 already showed deeper
  ligand suppression buys no height. The gonadotropin receptors are absent (GNRHR 0.64, LHCGR 0.71) and R329
  closed GnRH analogues on adult height. ⛔ SO SIX WHOLE BRANCHES CLOSE ON MEASUREMENT RATHER THAN ARGUMENT:
  ERbeta agents, GPER antagonists, coactivator-interaction inhibitors, sulfatase inhibitors, 17beta-HSD1
  inhibitors and gonadotropin suppression. ⭐ WHAT SURVIVES IS EXACTLY ONE DRUGGABLE NODE - ERalpha PROTEIN -
  AND ONE NEW UNDRUGGED ONE. STUB1/CHIP, the E3 ubiquitin ligase that cao2026sirt7 names as the route by
  which UNLIGANDED ERalpha is degraded, is CARTILAGE-ENRICHED at ratio 2.26 and 71.5 CPM in all twelve
  samples - it is the physiological version of a PROTAC, it is enriched in the right tissue, and it acts on
  precisely the species of receptor this subject has. No STUB1 activator exists in any species. ⭐⭐⭐ AND THE
  ANSWER TO "OR EVEN FURTHER" IS YES IN PRINCIPLE, FOR A REASON NOBODY HAD STATED: THE ERalpha-NULL MAN HAS
  HIGH CIRCULATING OESTRADIOL because he has no negative feedback, so his phenotype is "no ERalpha with
  abundant ligand still acting on whatever remains". The aromatase-deficient man is the mirror - no ligand,
  intact receptor. ANASTROZOLE PLUS A DEGRADER IS BOTH AT ONCE, AND NO HUMAN HAS EVER BEEN IN THAT STATE. It
  is strictly a more complete lesion than either natural experiment. ⚠ Whether that buys anything is a
  different question, because the receptors whose ligand it additionally removes - ERbeta and GPER - are the
  ones this round just showed are not in the plate.'
quantitative:
- parameter: THE GENETIC MAP - about seventy oestrogen-pathway genes against 1.45M exomes, and only TWO reach
    the height table
  unit: cm per allele
  value: 'Run over kosmicki2026 Supplementary Table 6 (7,185 rows, 207 genes) with a gene list spanning
    terminal and upstream synthesis, the sulfate reservoir, receptors, coregulators, ER target genes,
    degradation machinery, clearance and the gonadotropin axis.
    ⭐ POR - the obligate electron donor for CYP19A1 and every microsomal P450. PURE pLoF +1.080 cm
    (P=5.0e-08, 1,261 het), and MONOTONE IN VARIANT SEVERITY exactly as R324 describes a real causal loss:
    pLoF +1.080 > pLoF+deleterious-missense +0.450 > deleterious missense +0.391 > pLoF+possibly-del +0.287
    > all missense +0.268 (n=27,128). THIS IS THE AROMATASE-INHIBITOR DIRECTION WITH A HUMAN EFFECT SIZE,
    and it is the arm anastrozole already occupies.
    ⭐ ESR1 - all missense +0.356 cm at P=5.58e-16 across 26,176 carriers; deleterious missense +0.432
    (P=1.4e-09, 9,729); and the SINGLETON rows reach +1.68 to +1.92 (P=3.3e-04 to 8.8e-04, n=166-198), i.e.
    monotone in ALLELE RARITY. Reduction of ERalpha function raises adult height in the general population.
    ⛔ NOT IN THE 207 AT ANY VARIANT CLASS - CYP19A1, STS, SULT1E1, SULT1A1, SULT2B1, SLC10A6, SLCO2B1,
    HSD17B1/2/3/7/12, AKR1C3, CYP11A1, CYP17A1, HSD3B1/2, STAR, SRD5A1/2, ESR2, GPER1, AR, NCOA1/2/3,
    NCOR1/2, CREBBP, EP300, FOXA1, GATA3, SPEN, PELP1, GREB1, PGR, TFF1, COMT, CYP1A1, CYP1B1, CYP3A4,
    UGT1A1, UGT2B7, SHBG, GNRH1, GNRHR, LHCGR, FSHR, KISS1, KISS1R, TAC3, TACR3, STUB1, SIRT7, UBR5, MDM2,
    SKP2, UBE3A, BRCA1, CRBN, DDB1, CUL4B, RBX1, NEDD8, PSMB5.
    ⭐ THE STRUCTURAL RESULT: THERE IS NO THIRD NODE. The pathway is two genes wide at population scale, we
    already occupy one, and the other is ERalpha.'
  species: human
  n: 1.45M exomes; ~70 genes queried
  source_ref: kosmicki2026
  value_unverified: false
- parameter: THE ESR1 pLoF ROW IS AN UNDERPOWERED NULL, NOT A MEASURED ZERO - CORRECTED WITHIN THE ROUND
  unit: cm per allele with 95 percent confidence interval
  value: 'ESR1 PURE pLoF: eff +0.040, se 0.850, P=0.963, n_het 68. I first read this as haplosufficiency -
    losing one whole copy of ESR1 does nothing to height - which would have been a strong argument that
    partial degradation is useless. ⛔ THE CONFIDENCE INTERVAL REFUTES THAT READING: 95% CI [-1.626, +1.706],
    a width of 3.33 cm. It cannot exclude an effect as large as +1.7 cm per allele, which is larger than
    POR''s entire pure-pLoF effect (+1.08) and comparable to SMOC1''s (-1.63). For contrast, SMOC1 pLoF has
    a CI width of 1.58 cm on 303 carriers and NPR3 1.83 cm on 224.
    THE ROW IS UNINFORMATIVE IN BOTH DIRECTIONS. It neither supports nor excludes a heterozygous effect.
    CORR-348''s shape applied to statistics rather than to assay parameters: an absent signal at n=68 is not
    a measured null. What carries ESR1 is the missense series, which is well powered and monotone in rarity.'
  species: human
  n: 68 pLoF heterozygotes
  source_ref: kosmicki2026
  value_unverified: false
- parameter: THE RECEIVER TEST ACROSS THE WHOLE PATHWAY - SIX BRANCHES CLOSE ON MEASUREMENT
  unit: purity ratio (5 purest vs 5 most blood-contaminated by COL2A1) and CPM
  value: 'Calibrators: COL2A1 9.67, ACAN 4.25 | PTPRC 0.03, AGTR1 0.24 (killed losartan), MME 0.35 (killed
    sacubitril), HBB 0.69.
    ⛔ ERbeta IS CONTAMINATION OUTRIGHT - ESR2 ratio 0.04, 0.6 CPM pure vs 41.6 contaminated. Every
    ERbeta-directed agent is pointless here, and this independently reconfirms R274''s closure of the ERbeta
    axial lever by a completely different route.
    ⛔ GPER1 ratio 0.76 at 3.2 CPM - contaminant-leaning and low. G15/G36 and every GPER antagonist are not
    worth pursuing.
    ⛔ EVERY CLASSICAL COREGULATOR IS CONTAMINANT-LEANING: NCOA1 0.11, NCOA2 0.10, GATA3 0.14, NCOA3 0.17,
    CREBBP 0.24, NCOR2 0.36, EP300 0.36, NCOR1 0.37, SPEN 0.41; FOXA1 is 0.1 CPM. Only PELP1 is neutral at
    1.02. Coactivator-interaction inhibitors have no substrate here.
    ⛔ AND THE CLASSICAL OUTPUT IS ABSENT TOO - GREB1 0.52, PGR 0.68, TFF1 detected in 4/12 at 0.1 CPM. This
    reproduces R354''s recorded residual puzzle from an independent analysis: the plate has ERalpha protein
    in 64% of resting and proliferative chondrocytes and does NOT appear to run the canonical oestrogen
    transcriptional programme.
    ⛔ NO LOCAL AROMATASE - CYP19A1 0.6 CPM at ratio 0.71. Anastrozole necessarily acts systemically, which
    is fine because that is what it is for.
    ⛔ THE ESTRONE-SULFATE RESERVOIR IS NOT LOCAL - STS 0.39, SULT2B1 0.36, SLCO2B1 0.27, SLC10A6 0.56,
    SULT1E1 6/12 at 0.0 CPM. So irosustat and the sulfatase-inhibitor class act SYSTEMICALLY on ligand
    supply, which is anastrozole''s own arm - a Step 0 substitution, not an addition. R274 (letrozole equals
    anastrozole on height) and R337 (letrozole suppresses the tissue estrone-sulfate reservoir deeper,
    90.1% vs 72.9%, and still no height) already tested deeper ligand suppression and it bought nothing.
    ⛔ THE GONADOTROPIN AXIS IS NOT IN THE PLATE - GNRHR 0.64, LHCGR 0.71, FSHR 0.82, TACR3 0.80, all at
    ~0 CPM. It acts centrally, and R329 closed GnRH analogues on ADULT HEIGHT (anastrozole+rhGH 0.81 SDS vs
    GnRHa+rhGH 0.48, P<.01).
    ✓ PRESENT AND NEUTRAL: AR 8.7 CPM ratio 0.93 - the androgen receptor is there, which matters in a male,
    but AR is not in the 207 and the aromatase-deficient men show androgens alone do not close a plate.'
  species: human
  n: 12 human growth-plate samples, 4 patients
  source_ref: gse288028
  value_unverified: false
- parameter: THE ONE NEW TARGET THE MAP PRODUCES - STUB1/CHIP IS CARTILAGE-ENRICHED AND IT IS THE
    PHYSIOLOGICAL PROTAC FOR THE UNLIGANDED RECEPTOR
  unit: purity ratio and CPM
  value: '⭐ STUB1 ratio 2.26, 71.5 CPM pure vs 31.1 contaminated, detected 12/12 - CARTILAGE-ENRICHED, on
    the same side of the calibration as COL2A1 and ACAN. And cao2026sirt7 names STUB1 as the E3 ubiquitin
    ligase through which SIRT7 drives degradation of UNLIGANDED and misfolded ERalpha, with the stated
    purpose of "maintaining a functional receptor pool and preserving estrogen responsiveness".
    ⭐ THE FIT IS EXACT: this subject''s ERalpha is overwhelmingly UNLIGANDED at 3.3-6 pmol/L, which is the
    precise substrate STUB1 handles; the ligase is enriched in the target tissue; and driving it harder is
    the physiological version of what a PROTAC does artificially. It is also the direction CORR-300 prefers -
    the endogenous route rather than a foreign one.
    The surrounding machinery is enriched too: PSMB5 2.27, NEDD8 2.18, RBX1 1.68, DDB1 1.60, CUL4B 1.50,
    SKP2 1.40, BRCA1 1.11, MDM2 0.90.
    ⚠ AND IT CORRECTS R353 ON ITS OWN AXIS: CRBN - cereblon, the E3 vepdegestrant recruits - is
    CONTAMINANT-LEANING at ratio 0.69 (31.5 CPM pure vs 45.9). Present, per CORR-351 a ratio measures
    enrichment not presence, and 31.5 CPM in 12/12 is real - but it is NOT enriched, whereas STUB1 is. The
    PROTAC recruits the less tissue-appropriate ligase of the two.
    ✗ NO STUB1 ACTIVATOR EXISTS IN ANY SPECIES, and SIRT7 itself is contaminant-leaning (0.77). This is a
    target, not a lever. ✗ STUB1 loss-of-function causes a human ataxia, so the opposite direction is
    already a disease.'
  species: human
  n: 12 human growth-plate samples
  source_ref: cao2026sirt7
  value_unverified: false
- parameter: THE ANSWER TO "OR EVEN FURTHER" - ANASTROZOLE PLUS A DEGRADER IS A MORE COMPLETE LESION THAN
    EITHER HUMAN GENETIC MODEL
  unit: qualitative (lesion completeness)
  value: '⭐ THE POINT NOBODY HAD STATED: THE ERalpha-NULL MAN HAS HIGH CIRCULATING OESTRADIOL. With the
    receptor gone there is no negative feedback, so oestradiol and gonadotropins run high. His phenotype is
    therefore "ERalpha absent WITH abundant ligand still available to whatever receptors remain". The
    aromatase-deficient man is the exact mirror - LIGAND absent, receptor intact.
    NEITHER NATURAL EXPERIMENT HAS BOTH. Anastrozole plus an ERalpha degrader is both at once, and NO HUMAN
    HAS EVER BEEN IN THAT STATE. On lesion completeness it strictly exceeds either genetic model.
    ⚠ AND THE HONEST DISCOUNT, FROM THIS ROUND''S OWN DATA: the additional thing the combination removes is
    LIGAND ACTING ON THE NON-ERalpha RECEPTORS - and those receptors are the ones just shown not to be in
    the plate (ESR2 ratio 0.04, GPER1 0.76 at 3.2 CPM). So the theoretical completeness gain may deliver
    nothing AT THE GROWTH PLATE, even though it is real systemically.
    ⚠ AND THE BOUND IS UNCHANGED: smith2008 shows bone age still advanced 15 to 17.5 over 3.5 years with
    ERalpha absent from conception, about 0.7 bone-age years per calendar year. Removing both ligand and
    receptor cannot be assumed to beat that, because nothing has ever tested it.'
  species: human
  n: 5 ERalpha-null subjects across 4 families; at least 4 aromatase-deficient males
  source_ref: smith2008
  value_unverified: false
- parameter: THE NICHE COMPOUND SWEEP, RUN RATHER THAN ASSERTED
  unit: qualitative (compound existence and stage)
  value: 'STEROID SULFATASE - IROSUSTAT (STX64/BN83495) is real and has been in clinical trials in ER-positive
    breast and endometrial cancer. ✗ But STS is contaminant-leaning in the plate (0.39), so its action is
    systemic ligand supply, i.e. anastrozole''s arm - and deeper ligand suppression has already been tested
    twice with no height gain. Step 0 fails.
    17beta-HSD1 - the Europe PMC record is 20 items and they are in-silico, phytosterol and medicinal-chemistry
    papers. NO CLINICAL-STAGE 17beta-HSD1 INHIBITOR EXISTS. And HSD17B1 is only 2.3 CPM at ratio 1.21 in the
    plate.
    ⚠ HSD17B12 IS THE ONE STEROIDOGENIC ENZYME THAT IS CARTILAGE-ENRICHED - ratio 2.03, 82.8 CPM, 12/12,
    with HSD17B7 at 1.50 and 32.6 CPM. ✗ BUT ITS FUNCTION IS AMBIGUOUS AND I AM NOT CLAIMING IT AS AN
    OESTROGEN NODE: HSD17B12''s canonical role is fatty-acid elongation (3-ketoacyl-CoA reductase), and the
    2025 functional analysis of HSD17B3-deficient male mice assigns HSD17B7 and HSD17B12 roles in TESTOSTERONE
    biosynthesis rather than specifically in oestradiol. In a male plate with no aromatase, local
    HSD17B activity may be making androgen, not oestrogen. Recorded as an observation; no selective inhibitor
    exists either way.
    GPER - G15 and G36 are preclinical tool compounds only, and the receptor is not in the tissue.
    COREGULATOR INTERACTION INHIBITORS - no substrate in the tissue.
    ⚠ AN UNEXPLAINED OBSERVATION, RECORDED NOT CHASED: KISS1R is CARTILAGE-ENRICHED at ratio 5.77, 7.8 CPM,
    12/12. The kisspeptin receptor is canonically hypothalamic and this atlas has never localised it to
    cartilage. Direction unknown, abundance low, not in the 207, no obtainable antagonist. Not a lead.'
  species: human
  n: not applicable - compound and localisation triage
  source_ref: gse288028
  value_unverified: false
localization:
- The human growth plate carries ERalpha PROTEIN (R354, 64% of resting and proliferative chondrocytes, 16
  boys, every Tanner stage) and essentially none of the canonical oestrogen apparatus - no ERbeta, no GPER,
  no classical coactivators or corepressors, no classical target genes, and no aromatase. The degradation
  machinery IS enriched, and STUB1 in particular.
human_evidence: direct
human_evidence_note: Both halves are human - a 1.45M-exome burden table and twelve human growth-plate
  samples. The interpretation that the plate does not run a canonical oestrogen programme is an inference
  from transcript enrichment and is contradicted in one direction by R354's protein measurement, which is
  why the receptor itself is retained as the only live node.
species_basis:
- human
translation_risk: moderate
translation_risk_reason: 'The negative half is strong - six branches close on human genetics plus human
  tissue, and that is about as good as this file gets for a closure. The positive half is weaker: the
  surviving node has no agent that has ever been given to a growth plate, and STUB1 has no activator in any
  species. The lesion-completeness argument for exceeding the ERalpha-null is logically sound and
  empirically untested.'
confidence: B
claim_grades:
- claim: Of about seventy genes spanning the whole oestrogen pathway, only POR and ESR1 reach a 1.45M-exome
    height table.
  grade: A
  basis: Direct query of kosmicki2026 Supplementary Table 6. POR is monotone in variant severity with a pure
    pLoF effect of +1.080 cm at P=5.0e-08; ESR1's missense series reaches P=5.6e-16 across 26,176 carriers.
- claim: ERbeta, GPER, the coregulator machinery, the sulfate reservoir and the gonadotropin receptors are
    not in the human growth plate, so agents directed at them cannot act there.
  grade: B
  basis: Purity-corrected enrichment across twelve human samples against calibrators that already killed
    losartan and sacubitril on the same test. Downgraded from A because CORR-351 establishes that a low
    enrichment ratio measures origin rather than presence, and only ESR1 has had that distinction settled by
    protein measurement.
- claim: STUB1 is cartilage-enriched and is the endogenous route by which unliganded ERalpha is degraded.
  grade: C
  basis: The enrichment is measured here; the STUB1-ERalpha link is from cao2026sirt7 read at abstract level
    in cancer and ageing cell biology with no growth-plate work. No STUB1 activator exists.
- claim: Anastrozole plus a degrader is a more complete lesion than either the ERalpha-null or the
    aromatase-deficient human.
  grade: C
  basis: Logically follows from the two natural experiments being complementary - one lacks ligand with an
    intact receptor, the other lacks the receptor while carrying high ligand from lost feedback. But the
    additional coverage falls on receptors this same round shows are absent from the plate, so the
    completeness may be nominal.
- claim: The ESR1 heterozygous pLoF row does not show that partial receptor loss is ineffective.
  grade: A
  basis: 95% CI [-1.626, +1.706] on 68 carriers. The interval contains effects larger than any target in
    this file. It is uninformative, and reading it as a null would have been an error.
