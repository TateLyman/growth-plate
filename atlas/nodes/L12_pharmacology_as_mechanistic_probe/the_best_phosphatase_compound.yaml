id: the_best_phosphatase_compound
name: WHICH PHOSPHATASE COMPOUND - the enzyme is unidentified, one of the three is contraindicated, and the
  optimised LB-100 analogue was optimised in the wrong direction
aliases:
- best phosphatase inhibitor
- which PP2A inhibitor
- fostriecin versus LB-100
- what compound for the phosphatase arm
- PP5 sparing
type: intervention
layer: L12
stub: false
summary: 'THE QUESTION IS WHICH PHOSPHATASE COMPOUND TO CARRY, AND IT CANNOT BE ANSWERED ON POTENCY BECAUSE
  THE ENZYME HAS NEVER BEEN IDENTIFIED. Every experiment supporting this arm used a PAN-PPP tool. Cantharidin
  at 100 micromolar inhibits PPP1, PPP2, PPP4, PPP5 and PPP6. LB-100 is a catalytic inhibitor of PPP2CA and
  PPP5C and also inhibits PPP1C below 2 micromolar. potter1998 dephosphorylated NPR-B membranes with
  PURIFIED PP2A, which shows PP2A CAN do it, not that it is the physiological enzyme. THERE IS NO
  PP2A-SELECTIVE TEST OF THIS MECHANISM ANYWHERE.
  THAT MATTERS NOW BECAUSE THE THREE ENZYMES HAVE DIFFERENT HUMAN GENETIC DIRECTIONS AND ONE IS
  CONTRAINDICATED. PPP5C is a clean height locus running the WRONG WAY - rs3764613-G lowers height at
  p = 5e-18 and the same allele LOWERS PPP5C expression across seven tissues. Less PP5, shorter. PPP1CB has
  ZERO height associations across 43 catalogued, so PP1 is neutral. And PPP2CA - the catalytic subunit of
  the enzyme we would actually want to hit - has ONE height association out of eight, with no effect
  direction reported, so it is essentially silent. A compound for this arm should therefore hit PP2A and
  SPARE PP5, and LB-100 does the opposite of sparing it.
  THE OPTIMISED LB-100 ANALOGUE WAS OPTIMISED IN THE WRONG DIRECTION, AND THIS IS THE SAME ERROR CLASS AS
  M372049. CORR-141 recorded li2024a as proof that the 7-oxabicycloheptane scaffold CAN be tuned for
  PPP-family selectivity - compound 28a, 82 per cent oral bioavailability, orally tolerated. But the
  selectivity it achieved is 38-FOLD FOR PP5 OVER PP2A - PP2A IC50 33.8 micromolar against PP5 at 0.9. For
  an oncology programme that is a success. For THIS indication it is a PP5-selective inhibitor, and PP5 is
  the one enzyme the human genetics says not to inhibit. The best-optimised molecule in this chemotype is
  pointed the wrong way.
  WHICH LEAVES FOSTRIECIN, AND ITS STATUS CHANGED IN 2025. Fostriecin is the classical PP2A-selective
  natural product and the only PP2A-selective agent ever given to humans. dejong1999 ran the phase I: 20
  patients, 2 to 20 mg/m2/day, and THE MAXIMUM TOLERATED DOSE WAS NEVER REACHED - the trial stopped because
  DRUG SUPPLY RAN OUT, with the authors stating further escalation seemed possible and warranted. Toxicity
  was reversible transaminase elevation and grade 2 creatinine. jiang2025 then reports that the phase I was
  halted over COMPOUND STABILITY AND PURITY, and delivers a NINE-STEP modular chemoenzymatic synthesis
  against 17 to 34 steps for the previous seventeen routes, with LATE-STAGE DIVERSIFICATION OF THE
  HYDROPHOBIC TAIL built in for analogue generation. THE THING THAT KILLED FOSTRIECIN WAS MANUFACTURABILITY
  AND IT HAS JUST BEEN SOLVED.
  SO THE ANSWER, WITH ITS HOLE STATED FIRST. THE HOLE: I could not verify fostriecin PP1, PP2A, PP4 or PP5
  numbers from any clean source this round. The one comparative table obtained is a PP1-versus-PP2A table
  with NO PP5 COLUMN, and the fostriecin row parsed garbled, so no figure is recorded here. Fostriecin
  PP2A-selectivity is carried as REPUTATION, not as a number this atlas has read. THE ANSWER GIVEN THAT
  HOLE: fostriecin is the right CHEMOTYPE to pursue and the wrong compound to assume - it is the only
  PP2A-selective agent with human exposure, its failure mode was supply rather than biology or toxicity,
  and it now has a synthesis designed for analogues. LB-100 remains the only phosphatase agent with an
  additivity experiment on bone, and it inhibits the contraindicated enzyme.
  ROUND 153 CLOSED THE HOLE, AND FOSTRIECIN SELECTIVITY IS NOT REPUTATION ANY MORE - IT IS EXACTLY RIGHT.
  ChEMBL curated activities for CHEMBL17377: PP2A 3.4 nM, PP4 catalytic 3.0 nM, PP5 GREATER THAN 10,000 nM,
  PP7 greater than 1,000 nM, and in the canonical PPP panel 131,000 nM for PP1 and 45,000 for calcineurin,
  with curated selectivity ratios above 100,000. THAT IS MORE THAN 2,900-FOLD PP2A OVER PP5 AND ABOUT
  38,500-FOLD OVER PP1. Fostriecin hits the presumed target and SPARES THE ONE ENZYME THE HUMAN GENETICS
  CONTRAINDICATES. Two further checks came back clean. The topoisomerase II activity that gives the 1999
  trial its title is 40,000 nM - about 12,000-fold weaker than PP2A - so it is not an off-target at
  PP2A-effective concentrations and this atlas should stop listing it as one. And PPP4C, the one enzyme
  fostriecin hits equipotently and unavoidably, has 55 catalogued GWAS associations and ZERO for height,
  so PP4 co-inhibition is not a height liability.
  BUT THE MOLECULE HAS THE RIGHT PHARMACOLOGY AND THE WRONG CHARGE, AND THIS ATLAS HAS ALREADY PRICED THAT
  EXACT PROBLEM. Fostriecin is C19H27O9P, MW 430.4, cLogP 1.06, and carries ONE PHOSPHATE MONOESTER, so it
  is DIANIONIC at pH 7.4. Running the atlas own ideal-Donnan model at the lesperance1992 fixed charge
  density: a dianion partitions into cartilage at 0.14 to 0.30 of free plasma. Combining with the
  farnum2006 size term, fostriecin nets about 0.21 - which is the SAME PENALTY ENDOTHALL PAYS, 0.22, and
  for the same reason. Against neutral candidates at 0.82 for M372049 and 0.74 for compound 23, the charge
  costs roughly four-fold.
  AND THE FIX IS THE ONE THIS ATLAS ALREADY DOCUMENTED ON THE OTHER MOLECULE. LB-100 EXISTS BECAUSE
  ENDOTHALL IS A DIANION - it is a prodrug that masks the charge to get the active species delivered.
  THE CANDIDATE IS THEREFORE A NEUTRAL, PHOSPHATE-MASKED PRODRUG OF FOSTRIECIN, which should take plate
  partition from about 0.21 to about 0.95 at the same plasma concentration - roughly four-and-a-half-fold
  more drug at the target for no change in systemic exposure. It must be a PRODRUG rather than an analogue,
  because the phosphate is a binding pharmacophore that mimics the substrate phosphate; deleting it would
  be expected to delete the activity. And the route to make it now exists: jiang2025 is nine steps,
  modular, with LATE-STAGE CHEMOENZYMATIC INSTALLATION OF THE KEY PHARMACOPHORES, which is precisely the
  step at which a masked phosphate would be introduced.
  ROUND 154 ASKED WHETHER THE THING EXISTS OR CAN BE MADE CHEAPLY, AND THE PRIMARY SAR PAPER TURNED UP
  AND SETTLED THREE THINGS AT ONCE. swingle2009 was read in full - it is the primary source behind the
  ChEMBL curation round 153 leaned on - and it carries a side-by-side panel of fostriecin plus ten
  synthetic analogues. FIRST, THE PP5 BOUND IS NOW A MEASUREMENT. Fostriecin PP2A 1.4 nM, PP1 72 microM,
  PP5 60 microM, all measured. That is about 43,000-fold PP2A over PP5 and about 51,000-fold over PP1,
  against the greater-than-2,900-fold the atlas could only bound at round 153. The node own flagged
  weakness - that PP5-sparing rested on a greater-than - IS CLOSED, AND IT RESOLVED IN THE GOOD DIRECTION.
  SECOND, THE PRODRUG-NOT-ANALOGUE CALL IS NO LONGER AN INFERENCE. Round 153 argued the phosphate must be
  MASKED rather than DELETED because it is a binding pharmacophore. swingle2009 measured exactly that
  compound: DEPHOSPHOFOSTRIECIN, analogue 7, PP2A IC50 GREATER THAN 100 microM against 0.0014 for the
  parent. DELETING THE PHOSPHATE COSTS MORE THAN 71,000-FOLD. The design constraint is now a number.
  THIRD, THERE IS A SIMPLER MOLECULE IN THAT TABLE AND IT IS WORTH NAMING EVEN THOUGH IT LOSES. Analogue
  10 is fostriecin WITH THE ENTIRE LACTONE RING DELETED - a plain C13 trienetetraol monophosphate, MW
  about 322 - and it still inhibits PP2A at 0.1 microM while leaving PP1 at about 100 and PP5 above 100,
  so it keeps roughly 1,000-fold selectivity. It deletes the alpha,beta-unsaturated lactone, which is both
  the electrophilic warhead and the labile group that jiang2025 blames for the stability failure, and it
  would be far cheaper to make. IT IS STILL NOT THE ANSWER: 0.1 microM against 0.0014 is a 70-fold potency
  loss, it is STILL A DIANION so it pays the same Donnan penalty (net 0.22), and on potency-times-partition
  it lands about 100-fold behind a masked fostriecin. Naming it anyway because it is the cheap fallback if
  the parent proves unmakeable, and because its PP4 number was never measured.
  DOES IT EXIST. YES, NICHELY, AND THE NCI STILL HAS IT ON THE BOOKS AS A NUMBERED COMPOUND. NSC 339638 is
  registered in the NCI DTP chemical database as fostriecin MONOSODIUM SALT, C19H27O9P.Na, MW 453.0, CAS
  87810-56-8, with NCI60 five-dose screening data attached. PubChem lists about fifteen chemical vendors
  including MedChemExpress, TargetMol, BOC Sciences, Ambinter, BLD Pharm and Biorbyt. NO PRICE IS RECORDED
  HERE - every vendor page refused automated retrieval with a 403 or 412 - so the honest statement is that
  research-grade material is listed for sale and this atlas has NOT verified a price or a quantity. And the
  DTP index lists SCREENING data, not inventory: it is not evidence DTP can supply anything today, and the
  1999 trial stopping because NCI supply ran out is direct evidence the original stock was finite.
  CAN IT BE MADE CHEAPLY. NO - CHEAP IS THE WRONG WORD FOR ALL THREE ROUTES, THOUGH TWO ARE TRACTABLE.
  FERMENTATION is the historical route: stampwala1983 isolated it from a streptomycete broth and kong2013
  sequenced the 73 kb cluster in Streptomyces pulveraceus - six modular Type I PKS plus seven tailoring
  enzymes. That is the route that already failed on supply, and no titre figure was obtained. TOTAL
  SYNTHESIS is the jiang2025 route, nine steps from R-1,2,4-butanetriol against 17 to 34 for the previous
  seventeen routes - but its abstract states the key enzymatic C-H oxidation needed BOTH RATIONAL ENZYME
  ENGINEERING AND SMALL-MOLECULE ADDITIVES to work. That is an engineered biocatalyst, not a reagent off a
  shelf: tractable in a competent academic lab, not cheap and not a purchase. THE ANALOGUE ROUTE is the
  only genuinely cheap one, and it buys the weaker molecule 10.
  AND THE PRODRUG HAS NO PRIOR ART AT ALL. A literature search for a fostriecin prodrug returns nothing -
  no phosphate-masked fostriecin has ever been made. Generic masking chemistry exists and klootwyk2023 is
  one recent example, releasing phosphate monoesters from boryl-allyloxy phosphotriesters, but its trigger
  is H2O2, which is a tumour and inflammation trigger rather than a cartilage one. SO THE ROUND 153
  CANDIDATE IS NOT A COMPOUND ANYONE HAS, IT IS A SYNTHESIS PROGRAMME.
  ONE FINDING CUTS AGAINST THE WHOLE CHOICE AND IT IS NOT A SUPPLY PROBLEM. theobald2013 knocked down each
  fostriecin-sensitive phosphatase separately and found that SUPPRESSING PP4C ALONE reproduces fostriecin
  cellular phenotype, while suppressing PP1C, PP2AC or PP5C does not. The known cellular action of
  fostriecin - and therefore, plausibly, the toxicity that would set its dose ceiling - runs through PP4,
  the enzyme it hits at 3.0 nM and cannot avoid, not through the PP2A this arm wants. That does not stop
  fostriecin inhibiting PP2A at 1.4 nM. It does mean the dose ceiling and the intended effect may be
  carried by DIFFERENT enzymes, which is an argument for a PP4-sparing analogue nobody has built, and it
  is a new gap.
  AND NOTHING HERE TOUCHES THE ARM DEEPER PROBLEM. CORR-125 stands: the 1.42-fold restraint on NPR2 is
  TONIC and FGF-independent, so a systemic phosphatase inhibitor lifts a standing brake wherever NPR2 and
  the phosphatase coexist, including vasculature. Selectivity between PPP enzymes does not address
  selectivity between TISSUES, and it is the tissue problem that killed the allosteric modulator.'
quantitative:
- parameter: 'THE THREE ENZYMES LB-100 HITS HAVE THREE DIFFERENT HUMAN GENETIC VERDICTS, AND THE ONLY CLEAN
    ONE IS CONTRAINDICATING'
  value: 'PPP5C: rs3764613-G lowers height at p = 5e-18, allele frequency 0.53, and the SAME allele lowers
    PPP5C expression across SEVEN GTEx tissues at NES minus 0.17 - less PP5, shorter. A second signal
    rs759302 is a PPP5C expression QTL at minus 0.37. PPP1CB: ZERO height associations among 43 catalogued.
    PPP2CA: ONE height association among eight catalogued (rs146374310, p = 1e-8) with NO risk allele and NO
    effect size reported'
  unit: p-value; normalised effect size; association counts
  conditions: GWAS Catalog downloads for ensemblMappedGenes PPP5C, PPP1CB and PPP2CA archived at round 140
    in atlas/data/round140_human_genetics/; GTEx v8 single-tissue eQTL. The PPP2CA count was extracted from
    that archive at round 152 - it had been downloaded but never analysed for direction.
  species: human
  source_ref: gwas_catalog_2026
  atlas_derived: true
  uncertainty: 'THE PPP2CA SILENCE IS AMBIGUOUS AND SHOULD NOT BE READ AS REASSURANCE. PP2A catalytic is an
    essential, highly constrained gene; strong purifying selection removes the common regulatory variation
    that a GWAS detects, so absence of association is at least as consistent with intolerance as with
    irrelevance. Contrast NPR3 at 95 height associations and NPR2 at p = 6e-150 - both tolerate common
    variation. WHAT IS NOT AMBIGUOUS is the PPP5C direction, which is a clean locus with a consistent eQTL
    across seven tissues and points against inhibiting PP5. AND THE STANDING CAVEAT APPLIES TO ALL THREE:
    a lifelong ten-to-twenty per cent expression difference across every tissue is a different perturbation
    from acute inhibition in cartilage, so these are priors about direction, not predictions of drug effect.'
- parameter: 'THE OPTIMISED LB-100 ANALOGUE IS PP5-SELECTIVE, WHICH IS THE WRONG DIRECTION FOR THIS INDICATION'
  value: 'li2024a compound 28a from rational redesign of the LB-100 7-oxabicycloheptane dicarboxylic acid
    scaffold: PP2A IC50 33.8 micromolar against PP5 IC50 0.9 micromolar - 38-FOLD SELECTIVE FOR PP5 - with
    82 per cent oral bioavailability and oral tolerability in a xenograft model'
  unit: IC50 in micromolar; fold selectivity
  conditions: li2024a, PRIMARY_ABSTRACT_ONLY in this atlas.
  species: not_applicable
  source_ref: li2024a
  uncertainty: 'CORR-141 RECORDED THIS PAPER AS EVIDENCE THAT THE CHEMOTYPE CAN BE TUNED, WHICH IS TRUE AND
    REMAINS TRUE. What was never checked is WHICH WAY it was tuned. For an oncology programme targeting PP5
    this is a success; for a growth programme it is a 38-fold enrichment of the one activity the human
    genetics argues against. THE SAME ERROR CLASS AS M372049 AT CORR-161 - a compound identified as
    satisfying a specification when the specification had the sign wrong or the sign unchecked. LIMITS: the
    paper is abstract-level here, the IC50s are enzyme assays, and the assumption that PP2A rather than PP5
    is the NPR2 phosphatase is itself unestablished - if PP5 were the physiological enzyme, 28a would be the
    right molecule and the PPP5C genetics would be the thing to explain away.'
- parameter: 'FOSTRIECIN FAILED ON SUPPLY, NOT ON TOXICITY OR BIOLOGY - AND THE SUPPLY PROBLEM IS SOLVED'
  value: 'Phase I, 20 patients, 60-minute IV infusion days 1 to 5 every 4 weeks, 2 to 20 mg/m2/day. THE MTD
    WAS NEVER REACHED - the trial stopped because DRUG SUPPLY WAS STOPPED, and the authors state further
    escalation seems possible and is warranted. Toxicities were reversible: liver transaminases to grade 4,
    serum creatinine to grade 2 only, both with limited dose-dependence and often recovering during
    administration; the dose-limiting event was DURATION OF ALT ELEVATION in one patient. Half-life 0.36 h
    initial and 1.51 h terminal; plasma concentrations reached were INSUFFICIENT for in vitro activity.
    jiang2025 attributes the halt to COMPOUND STABILITY AND PURITY and delivers a NINE-STEP chemoenzymatic
    synthesis against 17 to 34 steps for the prior seventeen routes, with late-stage diversification of the
    hydrophobic tail'
  unit: mg/m2/day; hours; synthetic steps
  conditions: dejong1999 phase I (abstract read, PMC2362650) and jiang2025 synthesis (abstract read).
  species: human
  source_ref: dejong1999
  uncertainty: 'THIS REOPENS A COMPOUND THIS ATLAS HAD IMPLICITLY WRITTEN OFF, AND THE REOPENING IS ABOUT
    MANUFACTURABILITY RATHER THAN ABOUT ANY NEW BIOLOGY. WHAT IS STILL WRONG WITH FOSTRIECIN: the plasma
    half-life is 0.36 to 1.51 hours, which is hopeless for chronic dosing without continuous infusion; the
    exposure achieved in the trial was below its own in vitro active range; it carries a TOPOISOMERASE II
    catalytic inhibitory activity as a documented off-target, so it is not a clean phosphatase probe; and
    hepatic toxicity reached grade 4 even reversibly. AND THE DECISIVE NUMBERS ARE NOT IN HAND - no
    verified PP1, PP2A, PP4 or PP5 IC50 for fostriecin was obtained this round, so its PP5-sparing property,
    which is the entire reason to prefer it, is UNVERIFIED REPUTATION.'
- parameter: 'THE CLASS-EFFECT CLAIM AGAINST THE WHOLE CHEMOTYPE IS WEAKER THAN THIS ATLAS RECORDED'
  value: 'the_receptor_phosphorylation_branch_is_the_live_one carries, from chung2017, that the RENAL
    dose-limiting toxicity of LB-100 is IDENTICAL to that of fostriecin, and infers that the ceiling may be
    a CLASS EFFECT of PP2A inhibition that swapping compounds cannot escape. In the primary fostriecin
    phase I the dose-limiting event was HEPATIC - duration of ALT elevation - and serum creatinine reached
    only grade 2'
  unit: qualitative - organ of dose-limiting toxicity
  conditions: dejong1999 read at abstract level against the chung2017 statement already held.
  species: human
  source_ref: dejong1999
  uncertainty: 'THE INFERENCE IS WEAKENED, NOT ELIMINATED, AND THE DISTINCTION MATTERS BECAUSE A CLASS
    EFFECT WOULD MEAN NO CHEMISTRY ESCAPES THE CEILING. Both agents do produce a renal signal - fostriecin
    reached grade 2 creatinine - so the organs overlap even if the DOSE-LIMITING organ differs. Against
    over-reading the correction: this is one 20-patient trial that never reached MTD, so its DLT profile is
    an incomplete picture of what fostriecin does at a tolerated ceiling, and chung2017 may be drawing on
    fostriecin data this atlas has not read.'
- parameter: 'FOSTRIECIN ENZYME SELECTIVITY, MEASURED - IT SPARES THE CONTRAINDICATED ENZYME'
  value: 'ChEMBL curated IC50 for CHEMBL17377: PP2A 3.4 nM; PP4 catalytic subunit 3.0 nM; PP5 GREATER THAN
    10,000 nM (second record greater than 1,000); PP7 greater than 1,000 nM; canonical PPP panel also
    carries 1.5, 3.0, 10, 45,000 (calcineurin) and 131,000 nM (PP1), with curated selectivity ratios
    greater than 100,000 and greater than 1,000,000. SO PP2A OVER PP5 IS GREATER THAN 2,900-FOLD and PP2A
    over PP1 about 38,500-fold. DNA topoisomerase 2 IC50 40,000 nM - about 12,000-fold weaker than PP2A.
    PPP4C has 55 catalogued GWAS associations and ZERO for height'
  unit: IC50 in nM; fold selectivity; association counts
  conditions: ChEMBL activity API and GWAS Catalog download, both retrieved by this atlas 2026-08-09.
  species: not_applicable
  source_ref: chembl_fostriecin
  atlas_derived: true
  uncertainty: 'THIS CLOSES THE HOLE THE PREVIOUS VERSION OF THIS NODE FLAGGED AS ITS OWN WEAKEST POINT -
    fostriecin PP5-sparing is now a labelled number rather than reputation. TWO CAVEATS ON PROVENANCE.
    These are CURATED aggregations of primary literature this atlas has not read directly, and several
    rows are assigned only to an unchecked target, so the PP1 and calcineurin figures are matched to the
    canonical panel by value rather than read from a labelled record - the PP5 and PP4 figures ARE
    explicitly target-labelled and they are the two that decide the question. AND PP5 IS A GREATER-THAN
    BOUND, not a measurement, so the true selectivity could be far larger or could sit just above 10 microM.
    THE PP4 ABSENCE IS AN ABSENCE: PPP4C is a constrained essential gene, so zero height associations is at
    least as consistent with intolerance to common variation as with irrelevance, and it bounds the HEIGHT
    risk only - PP4 has DNA-damage-response roles a height GWAS cannot see.'
- parameter: 'THE RIGHT PHARMACOLOGY WITH THE WRONG CHARGE - AND THE FIX THIS ATLAS ALREADY DOCUMENTED'
  value: 'Fostriecin is C19H27O9P, MW 430.4, cLogP 1.06, TPSA 153.8, with ONE PHOSPHATE MONOESTER and
    therefore DIANIONIC at pH 7.4. Ideal Donnan partition of a dianion at the lesperance1992 fixed charge
    density of minus 0.19 to minus 0.35 M against a 0.15 M bath is 0.30 to 0.14 of free plasma. Combined
    with the farnum2006 size term at 430 Da (0.95), NET CARTILAGE PARTITION IS ABOUT 0.21 - against 0.22
    for endothall, 0.82 for the neutral M372049, 0.74 for neutral compound 23 and 0.47 for vosoritide.
    Masking the phosphate as a neutral prodrug removes the Donnan term and takes the net to about 0.95'
  unit: fraction of free plasma concentration
  conditions: COMPUTED BY THIS ATLAS 2026-08-09 using the ideal-Donnan function from
    endothall_experiment_design.py with lesperance1992 fixed charge density, and log-linear interpolation
    of the farnum2006 size anchors. Charge state assigned from the PubChem structure via RDKit.
  species: not_applicable
  source_ref: chembl_fostriecin
  atlas_derived: true
  uncertainty: 'THE FOUR-AND-A-HALF-FOLD PRIZE IS A MODEL OUTPUT, NOT A MEASUREMENT, and it inherits every
    assumption the endothall Donnan work already carries: ideal Donnan with no activity coefficients, no
    matrix binding, cartilage water at bath ionic strength, and bovine or calf fixed charge density applied
    to another species. The size and charge terms are also multiplied as if independent, which they are not.
    THE PRODRUG STEP CARRIES ITS OWN UNTESTED ASSUMPTION - that the phosphate can be masked and unmasked
    with useful kinetics. The LB-100 precedent is encouraging and also cautionary: this atlas established
    at round 134 that LB-100 hydrolyses with a half-life of 3.2 to 4.9 hours at 37 degrees and that the
    prodrug delivers relatively little active species. A fostriecin prodrug would need the same arithmetic
    run before it is believed.'
- parameter: 'THE PRIMARY SAR PANEL - PP5 IS NOW MEASURED, AND DELETING THE PHOSPHATE COSTS MORE THAN
    71,000-FOLD'
  value: 'swingle2009 Table 1, side-by-side assays, 32P-phosphohistone substrate. FOSTRIECIN (1): PP2A
    IC50 0.0014 microM, PP1 72 microM, PP5 60 microM, PP1(YRCG) chimera 0.09, PP5(YRCG) chimera 0.30 -
    so PP2A over PP5 is about 43,000-fold and over PP1 about 51,000-fold, both MEASURED. CYTOSTATIN (2):
    PP2A 0.029, PP1 and PP5 both greater than 100. DEPHOSPHOFOSTRIECIN (7): PP2A GREATER THAN 100 microM.
    DEPHOSPHOCYTOSTATIN (8): greater than 100 microM. LACTONE-DELETED (10, the C13 trienetetraol
    10-phosphate): PP2A 0.1 microM, PP1 about 100, PP5 greater than 100. TRIENE-DELETED (11): PP2A 4.2,
    PP1 greater than 100, PP5 greater than 100. Lactone-reduced (9): PP2A 2.1'
  unit: IC50 in micromolar
  conditions: swingle2009, FULL TEXT AND TABLE 1 READ 2026-08-09 via PMC2766224, with compound identities
    taken from the Fig. 1 legend in the same paper.
  species: not_applicable
  source_ref: swingle2009
  uncertainty: 'THIS IS THE PRIMARY SOURCE BEHIND THE CHEMBL CURATION USED AT ROUND 153 AND IT AGREES WITH
    IT WHILE BEING MORE INFORMATIVE - 1.4 nM here against 3.4 nM curated is ordinary between-assay spread.
    THE ONE THING THIS PANEL DOES NOT CONTAIN IS PP4, which is the enzyme fostriecin hits equipotently and
    the enzyme theobald2013 implicates in its cellular action, so no analogue in this table has a known PP4
    number. These are also purified-enzyme assays with an artificial substrate, not NPR2 dephosphorylation,
    and the identity of the NPR2 phosphatase remains unestablished.'
- parameter: 'THE CHEAP SIMPLIFIED ANALOGUE EXISTS, KEEPS SELECTIVITY, AND STILL LOSES ON DELIVERED POTENCY'
  value: 'swingle2009 analogue 10 is fostriecin with the entire alpha,beta-unsaturated delta-lactone
    deleted - C13H23O7P, MW about 322 - retaining PP2A at 0.1 microM with PP1 about 100 and PP5 greater
    than 100. Running the atlas Donnan and size model: at 322 Da the size term is 1.00, it is STILL a
    phosphate monoester and therefore still dianionic, so Donnan is still 0.14 to 0.30 and NET PARTITION IS
    0.22 - no better than fostriecin 0.21 or endothall 0.22. On potency times partition, relative to
    fostriecin free acid at 1.00: masked fostriecin 4.5, analogue 10 free acid 0.01, masked analogue 10
    0.06'
  unit: IC50 in micromolar; fraction of free plasma; relative delivered potency
  conditions: IC50s from swingle2009 Table 1; MW from the Fig. 1 systematic name; partition COMPUTED BY
    THIS ATLAS 2026-08-09 with the same ideal-Donnan function and farnum2006 size interpolation used for
    the round 153 table.
  species: not_applicable
  source_ref: swingle2009
  atlas_derived: true
  uncertainty: 'THE 70-FOLD POTENCY LOSS IS MEASURED, THE 100-FOLD DELIVERED-POTENCY GAP IS A MODEL OUTPUT
    that multiplies a measured IC50 by a modelled partition and inherits every Donnan assumption already
    listed. WHAT THE ARITHMETIC LEAVES OUT IS THE REASON TO KEEP THIS MOLECULE ON THE LIST: deleting the
