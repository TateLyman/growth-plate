claim_grades:
- claim: A compound for this arm should inhibit PP2A and spare PP5.
  grade: C
  basis: 'PPP5C is a clean height locus whose height-lowering allele lowers PPP5C expression across seven
    tissues - less PP5, shorter - which is the opposite of what the branch needs. PPP1CB is neutral and
    PPP2CA is silent. Graded C not B because lifelong expression differences are a different perturbation
    from acute inhibition, and because the identity of the NPR2 phosphatase is unestablished, so the
    premise that PP2A is the right target is itself assumed.'
- claim: li2024a compound 28a is the optimised molecule for this arm.
  grade: X
  basis: 'It is optimised 38-fold FOR PP5 over PP2A - PP2A 33.8 microM against PP5 0.9 microM - which is
    selectivity for the one enzyme the human genetics argues against inhibiting. CORR-141 correctly recorded
    that the scaffold can be tuned and never checked which way this tuning went.'
- claim: Fostriecin has the enzyme selectivity this arm requires - potent PP2A, sparing PP5.
  grade: B
  basis: 'UPGRADED FROM D AT ROUND 153 once the numbers were obtained. ChEMBL curated IC50s give PP2A
    3.4 nM against PP5 GREATER THAN 10,000 nM - more than 2,900-fold - and PP1 at 131,000 nM. PP4 is hit
    equipotently at 3.0 nM but PPP4C has zero height associations in 55, so that co-hit is not a height
    liability. Not A because the PP5 figure is a greater-than bound rather than a measurement, and because
    the values are curated aggregations of primary literature not read directly here.'
- claim: Fostriecin as the free acid is the compound to use.
  grade: D
  basis: 'NO - right pharmacology, wrong charge. The phosphate monoester makes it DIANIONIC at pH 7.4, and
    the atlas own Donnan model puts a dianion at 0.14 to 0.30 of free plasma in cartilage, netting about
    0.21 with the size term - the same penalty endothall pays, against 0.82 for a neutral molecule of
    similar size. Add a 1.5 h half-life, a Vdss of 0.086 L/kg indicating almost no tissue distribution,
    grade 4 reversible hepatotoxicity, and no bone endpoint in any species.'
- claim: The candidate is a neutral, phosphate-masked prodrug of fostriecin.
  grade: E
  basis: 'DESIGNED HERE, NOT TESTED, AND STILL E AT ROUND 154 - but one of its three premises stopped being
    an inference. It follows from: fostriecin has the right enzyme profile, its dianionic phosphate costs
    about four-fold in cartilage partition, and LB-100 already exists as a charge-masking prodrug of the
    dianion endothall for exactly this reason. THE PRODRUG-NOT-ANALOGUE PREMISE IS NOW MEASURED - swingle2009
    analogue 7, dephosphofostriecin, is greater than 100 microM against 0.0014 for the parent, so deleting
    the phosphate costs more than 71,000-fold. jiang2025 supplies a nine-step modular route with late-stage
    pharmacophore installation, which is where a masked phosphate would go. STILL UNTESTED AT EVERY OTHER
    STEP, NO FOSTRIECIN PRODRUG HAS EVER BEEN MADE, and the LB-100 precedent warns that a prodrug can
    deliver little active species.'
- claim: Fostriecin exists and can be obtained.
  grade: D
  basis: 'IT EXISTS AND IS LISTED; WHETHER IT CAN BE OBTAINED IS UNVERIFIED. NSC 339638 is a live NCI DTP
    registry entry for the monosodium salt with NCI60 data attached, and about 15 chemical vendors list
    CID 6913994. Against that: no price or quantity was retrievable from any vendor, a catalogue listing is
    not stock, the DTP entry is screening data rather than inventory, and the 1999 trial ended because NCI
    supply ran out. Graded D because the positive evidence is registry and catalogue presence only.'
- claim: Fostriecin can be made cheaply.
  grade: D
  basis: 'NO. Three routes, none cheap. Fermentation from Streptomyces pulveraceus is documented down to a
    sequenced 73 kb cluster and is the route that already failed on supply, with no titre in hand. The
    jiang2025 nine-step synthesis is a real advance over 17 to 34 steps but its key C-H oxidation needed
    rational enzyme engineering plus small-molecule additives, so it requires an engineered biocatalyst.
    Only the simplified lactone-deleted analogue is genuinely cheap, and it is 70-fold weaker. Graded D
    rather than higher because no cost, scale or yield figure was obtained for any route.'
- claim: The lactone-deleted analogue is a viable cheaper substitute for fostriecin.
  grade: D
  basis: 'NOT ON DELIVERED POTENCY. swingle2009 analogue 10 keeps PP2A at 0.1 microM with PP1 about 100 and
    PP5 above 100, so selectivity survives, and at MW 322 it is simple and lacks the labile electrophilic
    lactone. But it is 70-fold weaker than the parent and remains a phosphate monoester, so it pays the
    same Donnan penalty at net 0.22 and lands about 100-fold behind a masked fostriecin on potency times
    partition. Retained as the fallback if the parent proves unmakeable. Its PP4 activity was never
    measured.'
- claim: Fostriecin PP4 co-inhibition is a tolerated passenger.
  grade: D
  basis: 'WEAKENED AT ROUND 154. The tolerance argument was that PPP4C has 55 GWAS associations and zero
    for height, which bounds the HEIGHT risk only. theobald2013 then shows that knocking down PP4C alone
    reproduces the fostriecin cellular phenotype while knocking down PP1C, PP2AC or PP5C does not - so PP4
    may carry the toxicity that sets the dose ceiling. Knockdown is not inhibition and none of this was
    measured in chondrocytes, but PP4 can no longer be written down as a free co-hit.'
- claim: The renal dose-limiting toxicity is a PP2A class effect that no compound escapes.
  grade: D
  basis: 'WEAKENED. The atlas carried this from chung2017. The primary fostriecin phase I reports a HEPATIC
    dose-limiting event with creatinine only grade 2. The organs overlap but the dose-limiting organ
    differs, and the fostriecin trial never reached MTD so its profile is incomplete.'
