id: thread_3_the_dose_ceiling_is_a_systemic_safety_margin
name: THREAD 3 - the CNP arm is capped by a systemic cardiovascular safety margin rather than by efficacy,
  and that is the one cap a cartilage-restricted molecule would remove
aliases:
- why did the CNP dose stop at 100
- is the CNP ceiling efficacy or tolerability
- the exposure thread
- thread 3
- what is the next thread
type: hypothesis
layer: L12
stub: false
summary: 'TWO NODES IN THIS ATLAS MADE OPPOSITE PREDICTIONS ABOUT THE ONLY ARM WITH A PROVEN HUMAN
  BONE-AGE-SPARING EFFECT, AND THE TRIAL PROTOCOL SETTLES IT. growth_plate_drug_exposure (B) held that the
  CNP arm is capped by TOLERABILITY, on the grounds that the delivery literature names hypotension as the
  liability of systemic CNP distribution. cnp_analog_pk_challenge (D) held that both agents hit a shared
  EFFICACY ceiling, on the grounds that vosoritide exposure correlated with urine cGMP but not with growth
  outcome within cohort. The two readings prescribe opposite actions - the first says build a
  cartilage-restricted molecule, the second says nothing you do to delivery will help.
  THE DISCRIMINATING DOCUMENT IS PUBLIC AND WAS NEVER READ. The ACcomplisH protocol (TCC-201 version 5,
  posted on ClinicalTrials.gov) states the dose-selection logic outright, and it supports NEITHER node
  cleanly. The trial pre-specified UP TO FIVE dose levels with a MAXIMUM OF 200 ug CNP/kg/week - double
  the dose that was actually carried forward - and scheduled a Data Monitoring Committee meeting at
  Cohort 4 week 26 for the specific purpose of deciding whether to investigate up to that maximum. The
  200 ug ceiling was not set by toxicity either: it was set by PK SIMULATION, chosen so that predicted
  steady-state free CNP-38 Cmax in a 35 kg child would be comparable to the mean Cmax already observed
  after a single 150 ug/kg dose in healthy adults. The binding preclinical number is elsewhere and it is
  cardiovascular: the CV no-observed-adverse-effect level in cynomolgus monkeys was 100 ug CNP/kg -
  EXACTLY THE CLINICAL DOSE - with QTc increases appearing at or above 300 ug CNP/kg and judged not
  biologically significant. In juvenile rats, by contrast, the NOAEL for off-target effects was the
  HIGHEST DOSE TESTED, up to 4000 ug CNP/kg/week. The constraint is therefore cardiovascular and
  anticipatory, sitting forty-fold below the skeletal off-target margin.
  WHAT THIS MAKES THE CEILING. Not an efficacy plateau - the ACcomplisH dose-response is monotonic and
  still rising at 100 ug (4.09, 4.52, 5.16, 5.42 cm/year against pooled placebo 4.35), and the final
  doubling of dose still added about a third to the placebo-subtracted effect. Not observed human
  toxicity - no grade 3/4 events and NO symptomatic hypotension at any dose. It is a SYSTEMIC EXPOSURE
  MARGIN carried over from monkey cardiovascular pharmacology and from a Cmax-matching rule, applied to a
  molecule whose target tissue is avascular.
  WHY THAT IS THE MOST ACTIONABLE FACT IN THE ATLAS FOR THIS CASE. Every term in the safety argument is a
  SYSTEMIC FREE CNP-38 concentration. Every term in the efficacy argument is a GROWTH-PLATE concentration,
  which growth_plate_drug_exposure establishes has never been measured for any of twelve agents in any
  species. A molecule that decouples the two - the collagen-binding CNP and the WYRGRL collagen-II-binding
  targeted particles that the delivery literature has already built - attacks the exact quantity that is
  binding, and nothing else in this atlas does. The headroom is at least two-fold on the sponsor own
  pre-specified maximum, against a dose-response that had not flattened.
  WHAT THIS NODE DOES NOT CLAIM. The protocol records the AUTHORITY to escalate to 200 ug and the meeting
  convened to consider it. IT DOES NOT RECORD WHY THE ESCALATION DID NOT HAPPEN, and no motive is asserted
  here - a sponsor may stop escalating for commercial, regulatory, timeline or safety reasons, and the
  document distinguishes none of them. What is documented is that 100 ug was not the top of the planned
  range, was not set by an observed human adverse effect, and was not shown to be the top of the efficacy
  curve.'
quantitative:
- parameter: 'THE PRE-SPECIFIED MAXIMUM DOSE, AND THE BASIS ON WHICH IT WAS SET'
  value: '200 ug CNP/kg/week, against 100 ug actually carried into phase 3'
  unit: ug CNP/kg/week
  conditions: 'accomplish_protocol_v5, TCC-201 version 5.0 dated 28 December 2022, posted on
    ClinicalTrials.gov for NCT04085523. The trial was designed to evaluate UP TO FIVE dose levels; four
    were run (6, 20, 50, 100). The protocol states that a DMC meeting would be held on completion of
    26 weeks of treatment for all Cohort 4 participants to assess whether ADDITIONAL HIGHER DOSE LEVELS,
    up to 200 ug CNP/kg/week, should be investigated on emerging data, with the Sponsor deciding after
    consultation. The 200 ug maximum was set by PK SIMULATION rather than by toxicology - chosen so that
    predicted steady-state free CNP-38 Cmax in a 35 kg child, about the 95th weight percentile for an
    11-year-old with achondroplasia, would be comparable to the mean free CNP-38 Cmax observed after a
    single 150 ug CNP/kg dose in healthy adults. The starting dose was set by the same method in the other
    direction: 6 ug/kg/week was predicted to give a steady-state free CNP-38 Cmax of about 0.77 to 1.1 pM,
    overlapping endogenous plasma CNP of 1 to 3 pM.'
  species: human
  source_ref: accomplish_protocol_v5
  uncertainty: 'THE PROTOCOL IS A PLAN, NOT A RECORD OF WHAT WAS DECIDED. It establishes that escalation
    to 200 ug was authorised and scheduled for consideration; it cannot establish whether the DMC
    recommended against it, whether the Sponsor declined, or whether the question was simply overtaken by
    the move to the pivotal trial. NO MOTIVE IS ASSERTED. The reference is a manual entry flagged
    verify_by_hand - it is a sponsor document rather than a peer-reviewed record, and its status is that
    of a primary regulatory disclosure.'
- parameter: 'THE BINDING PRECLINICAL MARGIN IS CARDIOVASCULAR AND SITS AT THE CLINICAL DOSE, WHILE THE
    SKELETAL OFF-TARGET MARGIN SITS FORTY-FOLD ABOVE IT'
  value: 'cardiovascular NOAEL 100 ug CNP/kg in cynomolgus monkey; off-target NOAEL up to 4000 ug
    CNP/kg/week in juvenile rat, the highest dose tested'
  unit: ug CNP/kg
  conditions: 'accomplish_protocol_v5, nonclinical summary. QTc increases were seen in cynomolgus monkeys
    at doses at or above 300 ug CNP/kg but produced no clinical signs and were judged not biologically
    significant; the cardiovascular no-observed-adverse-effect level in that species was 100 ug CNP/kg. In
    the pivotal repeat-dose toxicity studies in JUVENILE ANIMALS WITH A NORMAL FGFR3 PATHWAY, the NOAEL
    for off-target effects after weekly subcutaneous administration was the highest dose tested, up to
    4000 ug CNP/kg/week in rats. The protocol notes that administering CNP to intact animals disturbs the
    normal balance between FGFR3 activation and CNP-mediated suppression, so skeletal overgrowth and
    eventually adverse exaggerated pharmacology can be observed.'
  species: multiple
  source_ref: accomplish_protocol_v5
  uncertainty: 'THE FORTY-FOLD GAP IS BETWEEN TWO DIFFERENT SPECIES, TWO DIFFERENT ENDPOINTS AND TWO
    DIFFERENT DOSING UNITS, and should not be read as a therapeutic index. The monkey figure is per dose
    and cardiovascular; the rat figure is per week and covers off-target effects generally. What the pair
    supports is the DIRECTION of the argument - that the constraint on this molecule is cardiovascular and
    systemic rather than skeletal - not a numerical margin. NOTE ALSO THE OPPOSITE-SIGN OBSERVATION IN THE
    SAME PARAGRAPH: in animals with an intact FGFR3 pathway, which is this subject situation and NOT the
    achondroplasia situation, CNP produces skeletal overgrowth that the sponsor characterises as
    eventually adverse exaggerated pharmacology. That is the sponsor own statement that the intact-pathway
    subject is the one at risk of too much effect, and it belongs in any dosing discussion here.'
- parameter: 'THE EFFICACY CURVE WAS STILL RISING WHERE THE DOSING STOPPED'
  value: '4.09, 4.52, 5.16, 5.42 cm/year at 6, 20, 50, 100 ug/kg/week against pooled placebo 4.35'
  unit: cm/year, least-squares mean annualised growth velocity at week 52
  conditions: 'savarirayan2023 Table 3, read in full from Europe PMC. p = 0.6004, 0.7022, 0.0849, 0.0218
    respectively; n = 10, 11, 10, 11 and pooled placebo n = 15. Monotonic across all four doses. The final
    doubling of dose, 50 to 100 ug, raised the placebo-subtracted effect from 0.81 to 1.07 cm/year - about
    a third more effect for twice the systemic exposure. 100 ug/kg/week was carried unchanged into the
    pivotal APPROACH trial, so no dose above it has been evaluated in any trial in either direction.'
  species: human
  source_ref: savarirayan2023
  uncertainty: 'THE LOW ARMS ARE THE FLOOR OF A CURVE, NOT A PLATEAU, and a search summary consulted this
    round glossed them the other way - three non-significant arms read as evidence of saturation. They are
    not: the curve is monotonic and the top arm is the only one powered to separate. Against this, the
    countervailing within-drug finding stands and is held in cnp_analog_pk_challenge - a vosoritide PK/PD
    analysis found exposure correlated with urine cGMP but NOT with growth outcome within the treated
    cohort. Both facts are real and the reconciliation is not settled.'
localization:
- 'the safety constraint is systemic and vascular - NPR2 in vasculature, cardiovascular NOAEL, orthostatic
  blood pressure monitoring - while the efficacy target is an avascular, alymphatic, diffusion-limited
  tissue; the entire thread is about the fact that these are different compartments and only one of them
  is measured'
human_evidence: direct
human_evidence_note: 'The dose-selection rationale, the pre-specified maximum, the PK simulation basis and
  the adverse-event record are all human trial documents for a drug approved in humans. The 40-fold
  off-target margin and the cardiovascular NOAEL are animal, and are labelled as such.'
species_basis:
- human
- non-human primate
- rat
translation_risk: low
translation_risk_reason: 'The load-bearing facts are human regulatory and trial documents about a marketed
  drug. The translation risk is not in the evidence but in the EXTRAPOLATION - that a cartilage-restricted
  molecule would convert the freed systemic headroom into plate exposure, which depends on the unmeasured
  partition that growth_plate_drug_exposure exists to flag.'
confidence: C
claim_grades:
- claim: The ACcomplisH maximum dose level was pre-specified at 200 ug CNP/kg/week, twice the dose carried
    into phase 3, with a DMC meeting scheduled to consider escalating to it.
  grade: A
  basis: Stated directly in the trial protocol posted on ClinicalTrials.gov, in both the synopsis and the
    trial-design section, with the PK-simulation basis for the 200 ug figure given explicitly.
- claim: The clinical dose was capped by an observed human adverse effect.
  grade: X
  basis: 'NO. savarirayan2023 reports no grade 3/4 events, two serious TEAEs both assessed as unrelated,
    and NO symptomatic hypotension at any dose including 100 ug. The one anti-CNP antibody response was
    transient, low-titre and without impact. There is no human toxicity signal that would have set this
    ceiling.'
- claim: The clinical dose was capped by an efficacy plateau.
  grade: X
  basis: 'NO. The dose-response is monotonic across all four arms and the placebo-subtracted effect still
    grew by about a third across the final doubling of dose. A plateau would require the top arms to
    converge, and they do not.'
- claim: The operative constraint on this molecule is a systemic cardiovascular exposure margin rather
    than a skeletal one.
  grade: B
  basis: 'The cardiovascular NOAEL in cynomolgus monkey is 100 ug CNP/kg, the clinical dose; the
    off-target NOAEL in juvenile rat is the highest dose tested at up to 4000 ug CNP/kg/week; the
    maximum dose was set by matching systemic free CNP-38 Cmax to an adult single-dose observation; and
    the protocol monitors orthostatic blood pressure at every visit with orthostatic intolerance named as
    a drug-holding criterion. Every one of those is a systemic vascular quantity. Graded B rather than A
    because the two NOAELs are different species, endpoints and units, and because the protocol does not
    state in one place that cardiovascular safety is THE dose-limiting consideration - that is this
    node reading of a converging set.'
- claim: A cartilage-restricted CNP would convert the freed systemic headroom into additional height.
  grade: D
  basis: 'THIS IS THE THREAD HYPOTHESIS AND IT IS NOT YET SUPPORTED. It requires three unmeasured steps -
    that plate exposure is what limits effect, that a targeted molecule raises plate exposure at
    equal systemic Cmax, and that additional plate exposure converts to length rather than to
    accelerated maturation. Step one is directly contradicted by the vosoritide PK/PD finding that
    exposure predicts urine cGMP but not growth. Step three is the bone-age discriminator this whole atlas
    turns on and is untested for any CNP analogue above its approved dose.'
- claim: This thread supersedes the temperature thread as the delivery lever.
  grade: B
  basis: 'It is the same term of the height equation approached from the side that is actually binding.
    Thread 2 tried to raise plate exposure by raising local perfusion, and tired on an age gate, an
    absent human endpoint and a partition ceiling at peptide size. This thread raises plate exposure per
    unit of SYSTEMIC exposure, which is the quantity the sponsor own dose-selection logic is built on, and
    it has a molecule class already built by the delivery literature rather than a physiological
    manoeuvre.'
