contradicts:
- 'RESOLVES A STANDING INTERNAL TENSION AND REPLACES IT WITH A NARROWER ONE. growth_plate_drug_exposure
  (B) held the cap to be tolerability; cnp_analog_pk_challenge (D) held it to be a shared efficacy
  ceiling downstream. The protocol supports the tolerability reading in a specific and previously
  unstated form - an ANTICIPATORY systemic cardiovascular margin rather than observed intolerance - and
  excludes the efficacy-plateau reading for navepegritide. It does NOT dissolve the vosoritide PK/PD
  finding that exposure predicts target engagement but not growth, which remains the strongest single
  argument against this thread and is held unchanged in cnp_analog_pk_challenge.'
