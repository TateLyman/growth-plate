id: vosoritide_is_cleared_by_npr3
name: ANSWERED - vosoritide IS cleared by the NPR3 receptor, the regulator said so in 2021, and that makes
  the NPR-C-evading variant the smallest high-value step on this axis
aliases:
- is vosoritide cleared by NPR3
- does vosoritide bind NPR-C
- vosoritide clearance pathways
- why is vosoritide PK supraproportional
type: process
layer: L12
stub: false
summary: 'g_l12_is_vosoritide_cleared_by_npr3 WAS OPENED AT TRACTABILITY 1 ON THE GUESS THAT A REGULATORY
  PHARMACOLOGY PACKAGE WOULD CARRY THE ANSWER. It does, in a public document, and the answer is YES.
  THE DIRECT STATEMENT. The EMA CHMP assessment report for Voxzogo (EMA/397108/2021) says, discussing why
  exposure rises faster than dose, that a scavenger receptor NPR-C exists for CNP WHICH ALSO BINDS
  VOSORITIDE, and that saturating it with increasing dose could retard elimination and thereby raise
  plasma levels. It then states three separate times, in the nonclinical and clinical pharmacology
  sections and again in the discussion, that vosoritide is cleared primarily by protease-mediated
  catabolism, RECEPTOR-MEDIATED CLEARANCE VIA NPR-C, and renal elimination.
  THE PHARMACOKINETIC SIGNATURE THAT CONFIRMS IT. In a rat toxicology study at day 182, a NINE-FOLD dose
  increase from 10 to 90 micrograms per kilogram produced a 35.7-fold rise in Cmax and a 36.2-fold rise in
  AUC. Markedly supraproportional exposure is the classic fingerprint of a saturable clearance receptor,
  and the assessors attribute it to exactly that.
  THE HUMAN CORROBORATION, AND IT IS AGE-DEPENDENT. ANP rose dose-dependently in ADULT cynomolgus monkeys
  and in adult subjects of the phase 1 study, but NOT in juvenile monkeys and NOT in the paediatric
  patients of the later trials. The applicant attributed this to competition between endogenous ANP and
  vosoritide for the natriuretic peptide clearing receptor NPR-C, and the CHMP agreed. So competition at
  NPR-C is observable in vivo in humans - and the age dependence is a warning in its own right, since it
  implies the clearance compartment is not the same in a child as in an adult.
  AND THE APPLICANT NAMED THE INTERACTION THIS PROJECT WAS PROPOSING. In the drug-interaction discussion
  the applicant identified, as a potential interaction, DRUGS BINDING TO THE NPR-C RECEPTOR THAT COULD
  REDUCE VOSORITIDE CLEARANCE. That is the co-administration strategy the compound specification arrived
  at from the other direction, written down by the sponsor and accepted by the regulator as a real
  mechanism - dismissed only because no such drug is approved for children.
  WHAT THIS SETTLES. Wendt2015, the primary pharmacology paper, opens by naming BOTH clearance routes -
  exogenous CNP is compromised by rapid clearance through RECEPTOR-MEDIATED AND PROTEOLYTIC pathways -
  and then engineers only the proteolytic one, producing a variant resistant to neutral endopeptidase
  with roughly a tenfold half-life extension, from about 2.6 minutes for endogenous CNP to about 28
  minutes. THE RECEPTOR ARM WAS LEFT ON THE TABLE. And biomarin_cnp_variants_us8198242 shows the same
  sponsor had already claimed the fix in 2009 - ring-glycine substitutions including G8T, G8S, G8V and
  G8N intended to cut NPR-C affinity while retaining NPR-B. So the design exists, the need is now
  documented by the regulator, and no molecule combining both resistances has been tested against a length
  endpoint anywhere this atlas can find.
  THE OBJECTION THAT STOPS THIS BEING A CLEAN WIN, AND IT IS THE SAME TRAP AS THE PAM. NPR3 is expressed
  systemically, not only at the plate. Blocking it systemically - or removing NPR-C binding from the
  ligand - raises SYSTEMIC exposure, which is the quantity the cardiovascular margin in thread 3 is
  denominated in. Longer half-life is not free: it is a dose increase by another route. The escape is the
  same one the compound specification identified, and it is unchanged by this finding - the clearance
  blocker must itself partition preferentially into cartilage, or the ligand must be retained
  preferentially there, so that the clearance that is blocked is the LOCAL clearance and not the
  circulating one.'
quantitative:
- parameter: 'SUPRAPROPORTIONAL EXPOSURE - THE FINGERPRINT OF SATURABLE RECEPTOR-MEDIATED CLEARANCE'
  value: 'a 9-fold dose increase produced a 35.7-fold rise in Cmax and a 36.2-fold rise in AUC'
  unit: fold change relative to the 10 microgram per kilogram dose
  conditions: 'ema_voxzogo_epar_2021, Table 12, rat toxicology study BMN111-11-052, gender-combined,
    DOSE DAY 182. Doses 10, 30 and 90 micrograms per kilogram: Cmax 603, 2922 and 21,525 picograms per
    millilitre; AUC0-t 16,488, 112,208 and 597,397 picogram-minutes per millilitre. On DAY 1 the same
    doses gave Cmax 1645, 1597 and 3007 with a Cmax ratio of only 1.83 at nine-fold dose, so the
    nonlinearity is far more pronounced after repeated dosing than after the first dose. The assessors
    attribute the phenomenon to saturation of NPR-C and note the mechanism was not formally determined.'
  species: rat
  source_ref: ema_voxzogo_epar_2021
  uncertainty: 'THE MECHANISM IS ATTRIBUTED, NOT DEMONSTRATED - the report states plainly that the
    mechanism underlying the phenomenon was not determined and offers NPR-C saturation as an explanation.
    Accumulation of an anti-drug antibody, a change in absorption from the injection site over 182 days, or
    altered renal handling would produce similar curves. The day-1 versus day-182 divergence is itself
    unexplained. This is rat, at doses of 10 to 90 micrograms per kilogram against a human dose of 15,
    and no equivalent human dose-proportionality table was extracted here.'
- parameter: 'VOSORITIDE-DERIVED RADIOACTIVITY IN BONE RELATIVE TO PLASMA'
  value: 'femur/plasma about 0.26 and tibia/plasma about 0.24 at one hour; about 0.28 and 0.27 at 15
    minutes'
  unit: ratio of ng-equivalents per gram to ng-equivalents per millilitre
  conditions: 'ema_voxzogo_epar_2021, Table 13, study BMN111-18-004. Male Sprague Dawley rats, single
    subcutaneous 124I-vosoritide at 90 micrograms per kilogram, necropsy at 0.25, 0.5 and 1 hour, n=3, 2
    and 3. Values in ng equivalents per gram: plasma 101 / 140 / 191; femur 27.9 / 48.9 / 49.0; tibia
    27.7 / 45.8 / 45.9; brain 11.1 / 19.6 / 18.5.'
  species: rat
  source_ref: ema_voxzogo_epar_2021
  uncertainty: 'THIS IS NOT A GROWTH-PLATE CONCENTRATION AND MUST NOT BE USED AS ONE. Two independent
    reasons. FIRST, WHOLE BONE IS NOT GROWTH PLATE - femur and tibia include marrow, cortex, periosteum
    and vasculature, and the physis is a small fraction of the mass, so a whole-bone ratio could conceal
    either enrichment or exclusion at the plate. SECOND, 124I RADIOACTIVITY IS NOT INTACT DRUG - the same
    study found radioactivity predominantly in the STOMACH, which is where free iodide goes, so
    deiodination is evidently substantial and an unknown share of the bone signal is label rather than
    vosoritide. n is 2 to 3 animals per timepoint. What the number supports is an order-of-magnitude
    statement - drug-derived material reaches bone at a few tens of per cent of plasma - which is broadly
    consistent with farnum2006 predicting roughly 60 per cent partition at 3 kDa for a freely diffusing
    tracer, given whole-bone dilution.'
- parameter: 'THE ANSWER, QUANTIFIED - VOSORITIDE NPR-C SELECTIVITY IS INDISTINGUISHABLE FROM NATIVE
    CNP-22, SO THE ENGINEERING BOUGHT NEP RESISTANCE AND NOTHING AT THE CLEARANCE RECEPTOR'
  value: 'vosoritide 5.9 to 11.4-fold NPR-B-favouring; native CNP-22 7.2 plus or minus 8.1-fold
    NPR-B-favouring - the ranges overlap entirely'
  unit: ratio of NPR-C EC50 to NPR-B EC50, same assay format for both
  conditions: 'fda_yuviwel_review_2026, Table 50. Vosoritide NPR-B EC50 3.5 to 10 nM against NPR-C EC50
    20.6 to 113.5 nM. Native CNP-22 NPR-B EC50 13.4 plus or minus 11.2 nM against NPR-C EC50 57.5 plus or
    minus 35.8 nM. THIS IS THE INTERNALLY CONSISTENT COMPARISON IN THIS DATASET - both agents measured the
    same way - and it is the one that answers the question. It corroborates wendt2015, whose potency
    system expressed NPR-B but NOT NPR-A or NPR-C and therefore could not have detected an NPR-C change,
    and which reports no NPR-C binding constant at all.'
  species: in_vitro_human_cell
  source_ref: fda_yuviwel_review_2026
  uncertainty: 'THESE ARE EC50 VALUES, NOT Kd, AND MUST NOT BE COMPARED WITH THE SPR ROW BELOW. No
    publicly reported direct NPR-C Kd or Ki for vosoritide was found. The CNP-22 error bars are enormous -
    plus or minus 8.1 on a ratio of 7.2 - so the overlap conclusion is robust precisely BECAUSE the
    claim is a null: vosoritide cannot be shown to differ from native peptide. That is a weaker statement
    than "vosoritide has no NPR-C evasion" and is the one supported. VALUES SUPPLIED BY THE PROJECT OWNER
    from the FDA review; the source document was not retrieved in-session.'
- parameter: 'BY DIRECT SPR, THE CLEARANCE RECEPTOR OUTBINDS THE SIGNALLING RECEPTOR FOR THE ACTIVE
    RELEASED SPECIES OF NAVEPEGRITIDE'
  value: 'free CNP-38: NPR-B Kd 27.3 pM against NPR-C Kd at or below 0.711 pM, so NPR-C is at least
    38.4-fold tighter'
  unit: Kd, direct surface plasmon resonance
  conditions: 'fda_yuviwel_review_2026, Table 50. Free CNP-38 / CNP(89-126) is the species navepegritide
    releases. CARRIER-BOUND PRODRUG for comparison: NPR-B Kd 71.9 nM, NPR-C Kd at or below 1.21 nM. The
    carrier therefore costs about 2,634-fold at NPR-B and about 1,702-fold at NPR-C - it is a GENERAL
    INACTIVATOR, which is what a TransCon prodrug is designed to be, and NOT a selectivity device. The
    carrier-bound NPR-C to NPR-B ratio works out at about 59-fold, marginally WORSE than the 38-fold of
    the free peptide.'
  species: in_vitro_human_cell
  source_ref: fda_yuviwel_review_2026
  uncertainty: 'THE NPR-C VALUES ARE CENSORED - reported as at or below a limit - so 38.4-fold and
    59-fold are LOWER BOUNDS and the true ratios could be far larger. DO NOT CROSS THE ASSAY FORMATS: free
    CNP-38 NPR-B Kd is 27.3 pM while CNP-22 NPR-B EC50 is 13.4 nM, a roughly 500-fold gap between peptides
    sharing the same ring, which is assay format rather than biology. Any vosoritide-versus-CNP-38 NPR-C
    ratio computed across these two datasets is meaningless and is not computed here. SPR affinity is also
    not the same as clearance flux, which depends on receptor density, internalisation rate and
    recycling - a tighter Kd does not by itself establish that NPR-C is the dominant sink in vivo.
    VALUES SUPPLIED BY THE PROJECT OWNER; source document not retrieved in-session.'
- parameter: 'THE PRIMARY-LITERATURE AFFINITIES FOR NATIVE CNP-22 CONFLICT WITH THE SPR VALUE THIS ATLAS
    USED IN ROUND 121, AND THEY POINT THE OTHER WAY'
  value: 'CNP-22 NPR-B 7 to 30 pM against NPR-C 11 to 140 pM - comparable, and possibly WEAKER at the
    clearance receptor; against FDA SPR putting free CNP-38 NPR-C at or below 0.711 pM, i.e. at least
    38-fold TIGHTER than its NPR-B'
  unit: dissociation constant, picomolar
  conditions: 'biomarin_cnp_variants_us8198242, background section, citing Bennett et al. J Biol Chem 266:
    23060-67 (1991), Koller and Goeddel Circulation 86: 1081-88 (1992) and Suga et al. Endocrinology 130:
    229-39 (1992). THE CONFLICT IS SPECIFICALLY AT NPR-C: the NPR-B figures agree well across sources
    (7-30 pM here against 27.3 pM by SPR), while the NPR-C figures differ by 15 to 200-fold. AND THE
    OBVIOUS ESCAPE IS CLOSED BY THE PATENT ITSELF - FIG 24 reports that CNP-22 and Pro-Gly-CNP37 (CNP-38)
    stimulated cGMP through NPR-B with similar dose-response curves and exhibited a SIMILAR PROFILE FOR
    NPR-B VERSUS NPR-C SELECTIVITY in competition assays, so the discrepancy cannot be attributed to the
    CNP-22 versus CNP-38 difference.'
  species: in_vitro_animal_cell
  source_ref: biomarin_cnp_variants_us8198242
  uncertainty: 'THE MOST LIKELY EXPLANATION IS AN ASSAY ARTEFACT AND IT WOULD FALL ON THE SPR SIDE. NPR-C
    is a disulphide-linked HOMODIMER, and an immobilised dimeric receptor on an SPR chip reports avidity
    rather than affinity, which systematically overstates tightness and is a recognised failure mode for
    this receptor class; a censored value reported as at or below a limit is also consistent with the
    measurement hitting the assay floor rather than the true Kd. Against that, the radioligand values are
    from 1991-1992 methods with their own limits and span a 13-fold range at NPR-C themselves. NEITHER
    SET IS ADOPTED HERE AS CORRECT. What changes is the confidence in the round-121 claim that the
    clearance receptor OUTBINDS the signalling receptor for the released species - that claim rests on the
    SPR number alone and the older literature does not support it.'
localization:
- 'NPR3 is expressed both at the growth plate - transcript comparable to NPR2 in human plate per
  the_plate_consumes_cnp_it_does_not_make_it - and systemically, and that dual localisation is precisely
  what prevents clearance blockade from being a free therapeutic-index gain'
human_evidence: direct
human_evidence_note: 'The clearance-pathway statement and the ANP competition observation are human and
  regulatory; the dose-proportionality and biodistribution tables are rat. The document is the assessment
  of a marketed human product.'
species_basis:
- human
- rat
- non-human primate
translation_risk: low
translation_risk_reason: The load-bearing claim is a regulator's characterisation of the clearance
  pathways of an approved human drug, drawn from the sponsor own package.
confidence: B
claim_grades:
- claim: Vosoritide is cleared in part by receptor-mediated uptake via NPR-C/NPR3.
  grade: B
  basis: 'Stated directly and repeatedly in the EMA CHMP assessment report, supported by supraproportional
    exposure in rat and by ANP competition observed in adult monkeys and adult humans. Graded B rather
    than A because the assessment report presents this as the accepted characterisation rather than
    reporting a measured NPR-C binding constant for vosoritide - no affinity value was found in the
    document, and the mechanism behind the nonlinear PK is explicitly stated to be undetermined.'
- claim: A CNP analogue resistant to BOTH neutral endopeptidase and NPR-C clearance would have
    substantially greater exposure than vosoritide.
  grade: D
  basis: 'It follows from the clearance characterisation and the sponsor own 2009 patent claims that
    such a molecule is designable and would be expected to last longer. It has not been built and tested
    against any endpoint in anything this atlas has found, no comparative NPR-B versus NPR-C binding data
    is public, and greater exposure is not the same as greater height.'
- claim: Removing NPR-C clearance improves the therapeutic index of this axis.
  grade: X
  basis: 'NO - AND THIS IS THE TRAP. NPR3 is expressed systemically as well as at the plate. Removing
    NPR-C clearance from the ligand, or blocking NPR-C systemically, raises SYSTEMIC exposure, which is
    the quantity the cynomolgus cardiovascular NOAEL constrains. A longer half-life bought this way is a
    dose increase by another name and runs into the same ceiling thread 3 identified. Only clearance
    blockade that is LOCAL to cartilage escapes, which is what the_compound_this_thread_needs specifies
    and which no existing molecule provides.'
- claim: This closes the atlas claim that no growth-promoting agent has a published tissue concentration.
  grade: X
  basis: 'NO, BUT IT NARROWS IT AND THE NARROWING MATTERS. growth_plate_drug_exposure states that not one
    of twelve audited agents has a published GROWTH PLATE tissue concentration in any species, and that
    remains true - whole femur and tibia are not the physis. What is no longer true is the surrounding
    framing that nothing but attention is missing: a rat biodistribution study including femur and tibia
    sat in the public regulatory package for vosoritide the whole time and this atlas had not looked at
    it.'
