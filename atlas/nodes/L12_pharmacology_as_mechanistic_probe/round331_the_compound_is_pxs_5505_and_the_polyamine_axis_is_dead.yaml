contradicts: >-
  Does not overturn a node. It CLOSES round 328's direction with a complete enumeration, KILLS the polyamine
  axis that round 301 left with its sign unresolved and round 302 re-ranked upward, and promotes round 301's
  own surviving candidate from "the only one left standing" to a named compound with a published human dose.
  It also records that round 312's rat contradiction of the LOXL2 axis stands unresolved against the mouse
  and human joint data.
