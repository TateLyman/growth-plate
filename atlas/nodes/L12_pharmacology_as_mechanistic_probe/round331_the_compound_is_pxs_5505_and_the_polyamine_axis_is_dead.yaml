id: round331_the_compound_is_pxs_5505_and_the_polyamine_axis_is_dead
name: >-
  ROUND 331 - the screen run to conclusion. The ACTIVATE direction is entirely occupied by the stack, which
  is why round 328 produced no compound. The polyamine axis is KILLED by three independent lines. What is
  left standing with an obtainable, human-dosed molecule is the lysyl oxidase axis, and the compound is
  PXS-5505 (lenumlostat), oral, 200 mg twice daily, phase I/IIa complete
aliases:
- round 331
- PXS-5505
- lenumlostat
- the compound
- polyamines are dead
- Snyder-Robinson kills the polyamine direction
type: intervention
layer: L12
stub: false
summary: >-
  THE INSTRUCTION WAS TO SETTLE IT AND NOT COME BACK WITHOUT A COMPOUND. This round ran the signed screen to
  the end in both directions, killed the axis that looked best on paper, and names the one candidate that
  has a real molecule with human dosing behind it.

  ONE - WHY ROUND 328's DIRECTION PRODUCED NO COMPOUND, ANSWERED DEFINITIVELY. Round 328 opened the
  ELEVATION direction - for a gene whose loss shortens, raise its function. Run against Open Targets, only
  FIVE of the 96 shortening genes have any agent that pushes them the wanted way, and EVERY ONE IS ALREADY
  IN THIS SUBJECT'S STACK OR WAS ALREADY DISQUALIFIED: NPR2 to carperitide (the CNP arm), IGF1R to
  mecasermin (the GH/IGF arm, and round 326 disqualified it as circulating ligand supplying the radial
  half), GHR to somatropin (he is on it), GHSR to ibutamoren (round 284 demoted it as a substitution), and
  MTOR to indoximod (a keyword artefact, and mTOR activation is not an available intervention). THE
  ELEVATION DIRECTION IS FULLY OCCUPIED. That is a complete and decisive negative, and it means the
  remaining compound has to come from the inhibit direction.

  TWO - THE AXIS THAT LOOKED BEST ON PAPER, AND ITS DEATH. AMD1 pLoF is +7.18 cm on the small pure-pLoF row
  and +3.08 cm (P=7.10e-09, 173 carriers) on the better-powered pLoF-plus-deleterious-missense row, with
  SMOX at -1.84 cm (P=1.07e-25, 1,616 carriers) running the other way - AMD1 makes the aminopropyl donor for
  spermine, SMOX destroys spermine, and read naively both say LESS SPERMINE IS TALLER. The whole pathway is
  abundant in the postnatal human growth plate: OAZ1 308 CPM in 94.8 per cent of cells, SAT1 379, AMD1 120
  in 67.6 per cent, AZIN1 108, SMOX 59, SRM 57, ODC1 48, SMS 40. Step 0 is clean - polyamines are touched by
  nothing in the stack - and there are real inhibitors, including APPROVED oral eflornithine with paediatric
  dosing.
  THEN CORR-325 WAS APPLIED, AND IT KILLED IT. The rule is: before proposing a target from a heterozygous
  effect, read its BIALLELIC disease. SMS loss of function is SNYDER-ROBINSON SYNDROME - hemizygous humans
  with spermine deficiency - and they have asthenic build, progressive kyphoscoliosis, early-onset
  osteoporosis with non-traumatic fractures, and case series describe SHORT STATURE. The G56S mouse
  reproduces it: raised spermidine/spermine ratio, failure to thrive, SHORT STATURE and reduced bone
  density. And the IMPC data already on this disk closes it a third time - Sms hemizygote BODY LENGTH
  -3.367, P=1.70e-03. THREE INDEPENDENT LINES, TWO SPECIES, ALL SAYING A SPERMINE-DEFICIENT SKELETON IS
  SHORT AND OSTEOPOROTIC. Add that eflornithine is an ANTIPROLIFERATIVE developed as an anticancer agent,
  and a polyamine synthesis inhibitor is not a way to grow a child. THE AXIS IS DEAD AND SHOULD NOT BE
  REOPENED WITHOUT A LENGTH ENDPOINT UNDER AMD1-SPECIFIC INHIBITION.

  THREE - WHAT SURVIVES, AND THE COMPOUND. The lysyl oxidase / collagen cross-linking axis is the only
  candidate left that has BOTH a human direction and an obtainable molecule with human dosing.
  HUMAN DIRECTION, THREE GENES, ONE PATHWAY, ONE SIGN: LOXL2 +1.40 cm (P=2.2e-09, 907 carriers), PLOD2
  +1.34 cm (P=4.7e-06), PLOD1 +1.03 cm. Loss makes people taller, so the wanted action is INHIBITION.
  RECEIVER TEST PASSES EMPHATICALLY. LOXL2 is 186.3 CPM in 12 of 14 postnatal human growth-plate samples, in
  up to 87.3 per cent of cells - among the highest-expressed genes in the entire panel against COL2A1 at
  9,201 - with the family co-expressed (LOXL4 peaking in the hypertrophic zone at 21,618 in GSE9160, plus
  LOX, PLOD1, PLOD2 at 745 CPM, PLOD3, P4HA1, P4HB).
  STEP 0 IS CLEAN. Matrix cross-linking is moved by nothing in this stack - not CNP/cGMP, not FGFR3/ERK/CREB,
  not GH/IGF-1, not oestrogen. It is the test that eliminated sacubitril, LUM-201, meclozine, PDE3 and
  cobimetinib, and this passes it.
  AND IT ACTS ON h_term, THE LARGEST TERM. Hypertrophic volume is roughly 80 per cent of longitudinal
  growth, and round 296 concluded that term had no upward-pointing agent because every marketed tool on the
  swelling machinery is an inhibitor built for a clinical demand to REDUCE swelling. Cross-link density
  restrains matrix expansion, so lowering it points UP.

  FOUR - TWO NEW PIECES OF EVIDENCE THIS ROUND, NEITHER OF WHICH THE AXIS HAD BEFORE. (i) IMPC, queried
  here: PLOD1 TIBIA LENGTH +0.090, P=2.40e-03 - positive and significant. CORR-329 established that 63.7 per
  cent of all knockouts are shorter and that significant hits run 245 negative to 38 positive, so a
  significant POSITIVE is the rare and therefore informative direction. It is a small effect and it is the
  FIRST length endpoint anywhere on this pathway in this atlas. (ii) Round 330's site data: LOXL2 is -0.347
  at the KNEE (padj 1.14e-05) and +0.253 at the SHOULDER - LOW in the fast-growing plate and HIGH in the
  slow one, which is the brake-like configuration, matching HHIP and STC2.

  FIVE - THE COMPOUND, WITH ITS ACTUAL HUMAN PARAMETERS. PXS-5505 (lenumlostat) is a first-in-class ORAL
  pan-lysyl-oxidase inhibitor. In the phase I/IIa myelofibrosis trial, 200 mg TWICE DAILY was the highest
  dose tested, was safe, achieved ROBUST SYSTEMIC REDUCTION OF LYSYL OXIDASE ACTIVITY and was selected for
  cohort expansion; steady state was reached by day 28; in the 24-patient expansion the majority of adverse
  events were grade 1-2 and 92 per cent of treatment-emergent events were judged unrelated to drug, with 13
  of 24 completing 24 weeks. A dose, a route, a schedule, a target-engagement readout and a human safety
  window all exist.

  SIX - AND THE OBJECTION THAT DECIDES WHETHER IT IS USABLE, WHICH IS NOT A SAFETY OBJECTION BUT AN EFFICACY
  ONE. Beta-aminopropionitrile, the classical lysyl oxidase inhibitor, causes OSTEOLATHYRISM - a skeletal
  disease including EPIPHYSEAL SEPARATION. A drug that separates the epiphysis does not lengthen the bone,
  it ends growth. That is an on-target, on-tissue class liability and it is the single biggest reason this
  is graded C. What separates PXS-5505 from it is unproven: BAPN is an irreversible non-selective
  high-dose lathyrogen and PXS-5505 is a designed reversible inhibitor at a dose titrated to systemic LOX
  activity, but nobody has given either to a growing animal and measured a bone.
  ⭐ EXCEPT THAT SOMEBODY MAY ALREADY HAVE. CORR-340 asks who has already dosed the right animal.
  `mcnerny2015` gave BAPN 350 mg/kg/day subcutaneously to GROWING MALE C57Bl/6 MICE FROM 5 TO 8 WEEKS OF AGE
  and states that tibial MORPHOLOGY was measured. The abstract reports cross-linking, modulus, yield strain
  and mineral density and no length. THE PAPER IS PAYWALLED AND ITS PMC RECORD IS AN EMPTY AUTHOR
  MANUSCRIPT. If tibia length is in that paper it is the first bone-length endpoint under lysyl oxidase
  inhibition in any species, and it decides this candidate either way.
quantitative:
- parameter: >-
    THE ELEVATION DIRECTION IS FULLY OCCUPIED BY THE EXISTING STACK - the complete answer to round 328
  value: >-
    of 96 genes whose pLoF SHORTENS at P less than 1e-4, only 5 have any agent acting in the wanted
    (activating/supplying) direction: NPR2 (carperitide), IGF1R (mecasermin), GHR (somatropin and analogues),
    GHSR (ibutamoren, macimorelin, anamorelin), MTOR (indoximod). All five are the CNP arm, the GH/IGF arm,
    or agents this atlas already demoted
  unit: genes with a matching agent, of 96
  conditions: >-
    atlas/data/round300/signed_target_drug_table.tsv, generated by round 300 from kosmicki2026 Supplementary
    Table 6 joined to Open Targets known drugs with mechanism-of-action direction classified; filtered here
    to want='up' rows at pLoF P less than 1e-4 and cross-referenced to GSE288028 presence.
  species: human
  source_ref: kosmicki2026
  uncertainty: >-
    MECHANISM-OF-ACTION STRINGS ARE KEYWORD-MATCHED FROM OPEN TARGETS AND CHEMBL, so this undercounts agents
    whose annotation does not contain the matched verb - AMD1's clinical-stage inhibitor SAM486A was missed
    by exactly that failure and had to be found by hand, which means the count of 5 is a floor and not a
    ceiling. What the result establishes is the pattern rather than the exact number: the agents that exist
    for load-bearing height genes are the hormones and receptor ligands this subject is already taking.
- parameter: >-
    THE POLYAMINE AXIS IS KILLED BY THREE INDEPENDENT LINES - a spermine-deficient skeleton is short and
    osteoporotic in both species
  value: >-
    HUMAN - Snyder-Robinson syndrome, hemizygous SMS loss of function, gives asthenic build, progressive
    kyphoscoliosis, early-onset osteoporosis with non-traumatic fractures in the first decade, and case
    series describing SHORT STATURE. MOUSE - the G56S Sms model shows raised spermidine/spermine ratio,
    failure to thrive, SHORT STATURE and reduced bone density. IMPC - Sms hemizygote BODY LENGTH -3.367,
    P=1.70e-03, n=8. Against the naive reading of AMD1 +3.08 cm (P=7.10e-09) and SMOX -1.84 cm (P=1.07e-25)
  unit: qualitative human phenotype; IMPC effect size and P
  conditions: >-
    schwartz1993srs (GeneReviews), akinyele2024 (G56S mouse), and atlas/data/round303/impc_length_endpoints_all.json.
    Burden effects from kosmicki2026 Supplementary Table 6.
  species: multiple
  source_ref: schwartz1993srs
  uncertainty: >-
    SMS LOSS IS NOT THE SAME MANIPULATION AS AMD1 INHIBITION and this is the honest weakness of the kill.
    SMS loss lowers spermine while RAISING spermidine, so it moves the ratio; AMD1 inhibition sits upstream
    of both synthases and should lower both while roughly preserving the ratio, which is why AMD1
    heterozygotes are taller. So the strict reading is that the pathway is a BAND - perturbing the ratio in
    either direction shortens (SMS one way, SMOX the other) - and only the upstream flux reduction is
    associated with height. THE KILL RESTS ON THE PRACTICAL POINT rather than the genetic one: the available
    drugs (eflornithine, and MGBG/SAM486A) are antiproliferative agents developed to arrest cell division,
    the growth plate is a proliferative tissue, and no polyamine inhibitor has a bone-length endpoint in any
    species. Reopening requires an AMD1-selective agent with a caliper on a bone.
- parameter: >-
    THE SURVIVING AXIS - three genes, one pathway, one direction, and the target is among the most abundant
    transcripts in the human growth plate
  value: >-
    LOXL2 +1.40 cm (P=2.2e-09, 907 carriers), PLOD2 +1.34 cm (P=4.7e-06, 576), PLOD1 +1.03 cm; LOXL2 186.3
    CPM detected in 12/14 postnatal human growth-plate samples in up to 87.3 per cent of cells, PLOD2 745.4
    CPM; LOXL4 peaking at 21,618 in the hypertrophic zone in GSE9160. NEW THIS ROUND - IMPC Plod1 TIBIA
    LENGTH +0.090, P=2.40e-03, the rare positive direction; and round 330's site configuration, LOXL2 -0.347
    at the knee (padj 1.14e-05) against +0.253 at the shoulder
  unit: centimetres per allele; CPM; IMPC effect size
  conditions: >-
    kosmicki2026 Supplementary Table 6; GSE288028 (14 postnatal human growth plates, 79,934 cells); GSE9160
    zone-resolved arrays; atlas/data/round303/impc_length_endpoints_all.json; richard2025 joint contrasts.
  species: multiple
  source_ref: kosmicki2026
  uncertainty: >-
    THE EFFECT IS SMALL - 1.40 cm per allele against ACAN's 16.6 - and PLOD1's mouse tibia effect of +0.090
    is tiny even though its P is 2.4e-03. IMPC HAS NO Loxl2 LENGTH ROW AT ALL, so the mouse support is from
    a partner gene and not the target. Round 312 damaged the axis independently: in rat the site contrast
    runs BACKWARDS, with LOXL2 lower in the low-output plate, which is the opposite of brake-like, and only
    the mouse and the human joint data agree with the brake reading. CORR-325 also bites at the biallelic
    end - PLOD2 biallelic loss is Bruck syndrome, which is short - so this module is not monotone either.
- parameter: >-
    THE COMPOUND, WITH HUMAN DOSE AND TARGET ENGAGEMENT
  value: >-
    PXS-5505 (lenumlostat), oral first-in-class pan-lysyl-oxidase inhibitor. 200 mg TWICE DAILY was the
    highest dose tested in the dose-escalation phase, was safe, achieved robust systemic reduction of lysyl
    oxidase activity and was selected for cohort expansion; steady state reached by day 28; cohort expansion
    24 patients of median age 72 with 13/24 completing 24 weeks; majority of adverse events grade 1-2 and 92
    per cent of treatment-emergent adverse events judged unrelated to drug
  unit: mg twice daily; patients; weeks
  conditions: >-
    vachhani2025, phase I/IIa, advanced myelofibrosis, dose-escalation plus cohort-expansion design.
  species: human
  source_ref: vachhani2025
  uncertainty: >-
    THE POPULATION IS ELDERLY PATIENTS WITH MARROW FIBROSIS AND THE ENDPOINTS ARE HAEMATOLOGICAL - there is
    no growth, height, bone-length or growth-plate endpoint anywhere in this programme, and no adolescent has
    ever received the drug. A dose that reduces systemic lysyl oxidase activity in a 72-year-old is not
    established as the dose that would partially reduce cross-linking in an open growth plate, and the
    interior-optimum problem applies: too much cross-link inhibition is osteolathyrism. The trial establishes
    that the compound exists, is oral, is tolerated and engages its target in humans - not that it is safe or
    effective for this purpose.
localization:
- 'growth plate, all zones: LOXL2 186 CPM in up to 87.3 per cent of cells, LOXL4 hypertrophic-peaked'
- 'the knee: where LOXL2 is LOW (-0.347) - the fast plate, brake-like configuration'
- 'NOT the polyamine pathway, which is abundant in the plate but whose perturbation shortens the skeleton'
human_evidence: direct
human_evidence_note: >-
  The gene directions are human burden effects from 1.45M exomes, the localisation is human postnatal growth
  plate, and the compound's dose and tolerability are from a human phase I/IIa trial. What is animal is the
  single mouse length endpoint (Plod1) and the entire osteolathyrism literature.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The compound has never been given to a growing animal, let alone an adolescent, and its class has a
  documented growth-plate toxicity (epiphyseal separation) at high non-selective doses. The human genetics
  are germline heterozygous from conception, so CORR-299's open-plate question is unanswered for this axis.
confidence: C
confidence_reason: >-
  The human direction and the tissue localisation are strong and multiply anchored; the compound is real,
  oral and human-dosed. It is capped at C because there is no bone-length endpoint under lysyl oxidase
  inhibition in any species, the mouse support comes from a partner gene at a tiny effect size, round 312
  contradicted the axis in rat, and the class has an on-target skeletal toxicity that would end growth
  rather than extend it.
claim_grades:
- claim: >-
    Round 328's elevation direction will yield a compound if searched harder.
  grade: X
  basis: >-
    IT WILL NOT. Only 5 of the 96 shortening genes have any agent in the activating direction and all five
    are the CNP arm, the GH/IGF arm, or agents already demoted here - carperitide, mecasermin, somatropin,
    ibutamoren and a keyword artefact. The elevation direction is fully occupied by this subject's existing
    stack. That is why round 328 ended without a molecule and it is now established rather than suspected.
- claim: >-
    Inhibiting polyamine synthesis is a route to height, on the strength of AMD1 +7.18/+3.08 cm.
  grade: X
  basis: >-
    NO. CORR-325 applied: SMS loss of function is Snyder-Robinson syndrome - spermine-deficient humans with
    asthenic build, kyphoscoliosis, early-onset osteoporosis and short stature; the G56S mouse reproduces
    short stature and reduced bone density; and IMPC gives Sms hemizygote body length -3.367 at P=1.70e-03.
    Three lines, two species. The available drugs are antiproliferatives and the growth plate is a
    proliferative tissue.
- claim: >-
    PXS-5505 is a validated height agent.
  grade: E
  basis: >-
    ABSOLUTELY NOT, AND NOTHING HERE SHOULD BE READ THAT WAY. No lysyl oxidase inhibitor has a bone-length
    endpoint in any species. The compound has been given only to elderly patients with myelofibrosis, with
    haematological endpoints. What is established is that an oral, human-dosed, target-engaging molecule
    exists for an axis with a human direction, tissue presence and a clean Step 0.
- claim: >-
    PXS-5505 is the best-supported obtainable candidate remaining in this atlas.
  grade: C
  basis: >-
    On the conjunction of criteria this file uses - signed human direction (three genes, one pathway),
    CORR-327 receiver test passed at 186 CPM in 87 per cent of cells, Step 0 clean against all four stack
    arms, acting on h_term which round 296 said had no upward agent, and an actual oral compound with a
    published human dose and target-engagement readout - yes. Every competitor fails at least one: HHIP,
    CHAD, NRK, SCUBE3 and STC2 have no agent; TET1 has no selective obtainable inhibitor; polyamines are
    dead; tankyrase failed from four directions; the CNP and GH arms are occupied.
- claim: >-
    The lysyl oxidase class is safe to give to an open growth plate.
  grade: E
  basis: >-
    UNKNOWN AND THE CLASS PRIOR IS BAD. Beta-aminopropionitrile causes osteolathyrism including EPIPHYSEAL
    SEPARATION, which would end growth rather than extend it - an efficacy objection, not merely a safety
    one. PXS-5505 is reversible, selective for the LOX family and dosed to a measured systemic activity
    reduction, but no growing animal has received either compound with a bone measured.
