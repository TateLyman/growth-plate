id: round278_the_aromatase_arm_spends_vertebral_height_which_is_the_compartment_the_residual_is_made_of
name: >-
  ROUND 278 - the aromatase arm's cost is not a safety footnote, it is an OFFSETTING TERM IN THE HEIGHT
  CALCULATION. Lumbar spine BMD Z-score fell significantly in BOTH arms over two years from an already-low
  baseline, and anterior vertebral WEDGING appeared in two boys on films taken beyond the study window -
  in the exact compartment rounds 273 and 274 showed holds the residual
type: hypothesis
layer: L12
stub: false
summary: >-
  ROUND 274 SETTLED WHICH AROMATASE INHIBITOR AND PRICED THE ARM AT ABOUT +1.3 cm OF PREDICTED HEIGHT OVER
  THREE YEARS. What it did not do is read the same trial's SAFETY arm, which ran DXA and lateral
  thoracolumbar radiographs at baseline and two years precisely because a Cochrane review had flagged
  vertebral morphology and bone density as the unresolved questions. Read now, it changes how the arm
  should be priced - because the tissue at risk is the tissue the remaining height is made of.

  ONE - BONE DENSITY FELL SIGNIFICANTLY IN BOTH ARMS, FROM A BASELINE THAT WAS ALREADY LOW. Lumbar spine
  BMD Z-score on ANASTROZOLE went from -1.33 plus or minus 0.81 at baseline to -1.54 plus or minus 0.91 at
  year two. On LETROZOLE, from -1.37 plus or minus 0.89 to -1.94 plus or minus 1.16. THE DECREASE IN
  WHOLE-BODY AND LUMBAR Z-SCORES FROM BASELINE TO TWO YEARS WAS SIGNIFICANT IN BOTH GROUPS. Letrozole's
  decline looked larger but was not statistically distinguishable from anastrozole's - which is the same
  pattern as the efficacy comparison: letrozole moves every intermediate further and delivers no different
  endpoint.

  TWO - AND THE VERTEBRAL SIGNAL APPEARED AFTER THE PROTOCOL STOPPED LOOKING. At two years, in 39 subjects
  with paired lateral thoracolumbar films, there were NO compression fractures and NO de novo abnormalities;
  the three abnormalities found were present at baseline as well. THAT IS THE REASSURING SENTENCE AND IT IS
  NOT THE LAST ONE. Two boys, one on each drug, were found to have ANTERIOR WEDGING on films performed
  off-protocol MORE THAN FOUR YEARS AFTER TREATMENT INITIATION. Scoliosis was recorded as an adverse event
  in three subjects. Eight fractures occurred overall, all appendicular and sports-related.
  ANTERIOR WEDGING IS THE EARLIEST MORPHOLOGICAL STAGE OF VERTEBRAL COMPRESSION, AND THE TRIAL'S TWO-YEAR
  WINDOW MISSED IT. A two-year null on vertebral morphology is therefore not a clean safety result; it is a
  null inside a window that the only positive findings fell outside of.

  THREE - WHY THIS IS AN EFFICACY PROBLEM AND NOT ONLY A SAFETY ONE, WHICH IS THE POINT OF THE ROUND. The
  operator has deprioritised risk, so a conventional safety finding would be noted and set aside. THIS ONE
  CANNOT BE, because it subtracts from the objective directly. Round 274 measured that in boys at bone age
  13.6 the trunk still grows 8.6 cm while the knees deliver 8.6 cm, and that by bone age 14.2 to 14.5 the
  knees are worth 0.3 to 0.4 cm while the trunk still grows 6.5 to 9.0 cm. Round 273 showed spine growth
  peaks LATER than total body growth. THE RESIDUAL AT THIS MATURITY IS LARGELY VERTEBRAL.
  Anterior wedging reduces anterior vertebral body height. Reduced vertebral BMD is the substrate for it.
  SO THE AROMATASE ARM BUYS ABOUT 1.3 cm OF PREDICTED HEIGHT WHILE PLACING A MEASURED, SIGNIFICANT
  DOWNWARD PRESSURE ON THE DENSITY OF THE VERTEBRAE THAT ARE SUPPOSED TO SUPPLY THE REST OF IT. Those two
  numbers belong in the same equation, and this atlas has never put them there.

  FOUR - WHAT FOLLOWS OPERATIONALLY, AND IT IS CHEAP. The trial's own design is the recommendation: a
  BASELINE lateral thoracolumbar radiograph and DXA, repeated - and repeated BEYOND two years, because that
  is where the only positive findings appeared. This is not a reason to stop the arm; +1.3 cm is still
  +1.3 cm and the fractures observed were sports injuries, not fragility fractures. It is a reason to
  measure the offsetting term rather than assume it is zero.

  FIVE - THE HONEST CONFOUND, WHICH CUTS THE FINDING DOWN BUT NOT OUT. Baseline lumbar Z-scores were
  ALREADY about -1.3 in both arms before any drug. DXA reports AREAL density and systematically
  underestimates volumetric density in small bones, so short boys carry low Z-scores as a measurement
  artefact independent of any real deficit. The decline of roughly 0.2 to 0.6 Z units over two years is on
  top of that, in 24 subjects with paired scans (15 anastrozole, 9 letrozole), during a period when a
  normal pubertal boy is ACCRUING bone mass rapidly - so a falling Z-score during puberty means falling
  behind the accrual curve rather than losing bone. That is the correct reading and it is still the wrong
  direction.
quantitative:
- parameter: >-
    LUMBAR SPINE BMD Z-SCORE UNDER AROMATASE INHIBITION - SIGNIFICANT DECLINE IN BOTH ARMS OVER TWO YEARS
  value: >-
    anastrozole -1.33 plus or minus 0.81 at baseline to -1.54 plus or minus 0.91 at year 2; letrozole -1.37
    plus or minus 0.89 to -1.94 plus or minus 1.16; the decrease in whole-body AND lumbar Z-scores from
    baseline to 2 years was SIGNIFICANT in both groups, with letrozole's larger decline not statistically
    distinguishable from anastrozole's
  unit: DXA Z-score
  conditions: >-
    zegarra2024, randomised open-label trial in pubertal boys with idiopathic short stature; DXA (Hologic)
    whole-body and lumbar at baseline and 2 years, paired scans available in 24 subjects (15 anastrozole, 9
    letrozole); analysed by linear mixed model. Hip Z-scores were not obtainable for lack of standards.
  species: human
  source_ref: zegarra2024
  uncertainty: >-
    TWENTY-FOUR PAIRED SCANS, NINE OF THEM ON LETROZOLE - small, and the between-arm comparison is
    underpowered. DXA REPORTS AREAL DENSITY AND UNDERESTIMATES VOLUMETRIC DENSITY IN SMALL BONES, so short
    boys carry low Z-scores partly as an artefact; baseline was already about -1.3 before any drug. During
    puberty a normal boy accrues bone mass rapidly, so a FALLING Z-score means falling behind the accrual
    curve rather than absolute bone loss - which is the correct reading and is still the wrong direction.
    No untreated control arm existed in this trial.
- parameter: >-
    VERTEBRAL MORPHOLOGY - NULL AT TWO YEARS, ANTERIOR WEDGING BEYOND FOUR
  value: >-
    at 2 years, paired lateral thoracolumbar films in 39 subjects (21 anastrozole, 18 letrozole) showed NO
    compression fractures and NO de novo abnormalities, the three abnormalities present being present at
    baseline too; but TWO boys (1 anastrozole, 1 letrozole) were found to have ANTERIOR WEDGING on films
    performed off-protocol MORE THAN FOUR YEARS after treatment initiation. Scoliosis was recorded in 3
    subjects; 8 fractures overall (5 anastrozole, 3 letrozole), all appendicular and sports-related
  unit: counts of subjects with radiographic findings
  conditions: >-
    zegarra2024. Lateral thoracolumbar radiographs at baseline and 2 years, assessed qualitatively for
    vertebral anomalies and compression fractures. No subject reported vertebral fracture or persistent
    back pain during the trial.
  species: human
  source_ref: zegarra2024
  uncertainty: >-
    THE WEDGING FINDINGS ARE OFF-PROTOCOL, UNCONTROLLED AND UNBLINDED - films obtained for other reasons
    more than four years after starting, in two boys, with no comparison group and no systematic follow-up
    of the other 37. They cannot establish causation. What they DO establish is that the trial's two-year
    null was measured inside a window the only positive findings fell outside of, so the null cannot be
    read as clearance. Anterior wedging also has causes unrelated to drug - Scheuermann changes and normal
    variant morphology among them - and adolescent boys playing sport are exactly the population in which
    those appear.
