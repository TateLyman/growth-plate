human_evidence: direct
human_evidence_note: >-
  Randomised trial data in the target population - pubertal boys on aromatase inhibitors - with DXA and
  spine radiography as prespecified safety endpoints.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: Human trial data in the relevant population and on the relevant drugs.
confidence: B
confidence_reason: >-
  The BMD decline is a prespecified endpoint, significant in both arms by mixed model, in the exact drugs
  and population at issue. Graded B rather than A because n = 24 paired scans, there is no untreated
  control, and the vertebral wedging observations are off-protocol in two subjects.
claim_grades:
- claim: >-
    Aromatase inhibition in pubertal boys is bone-neutral over two years.
  grade: X
  basis: >-
    NO. Whole-body AND lumbar spine BMD Z-scores fell significantly from baseline to 2 years in BOTH arms -
    anastrozole -1.33 to -1.54, letrozole -1.37 to -1.94. During puberty, when a boy should be accruing
    bone mass rapidly, a falling Z-score means falling behind the accrual curve.
- claim: >-
    The two-year vertebral morphology null clears the arm.
  grade: X
  basis: >-
    IT CANNOT, BECAUSE THE ONLY POSITIVE FINDINGS FELL OUTSIDE THE WINDOW. No compression fractures and no
    de novo abnormalities at 2 years in 39 subjects - and then anterior wedging in two boys on films taken
    off-protocol more than FOUR years after initiation. A null measured before the signal appears is not a
    clearance.
- claim: >-
    The aromatase arm's bone cost is a safety consideration that this programme can deprioritise.
  grade: X
  basis: >-
    IT IS AN EFFICACY TERM, NOT A SAFETY FOOTNOTE. Rounds 273 and 274 established that the residual growth
    at this maturity is largely VERTEBRAL - the trunk still grows 6.5 to 9.0 cm at bone ages where the knees
    deliver 0.3 to 0.4 cm. Anterior wedging reduces anterior vertebral body height and reduced vertebral
    BMD is its substrate. The arm buys about +1.3 cm of predicted height while pressing down on the density
    of the vertebrae meant to supply the rest. Both numbers belong in one equation.
- claim: >-
    This is a reason to stop the aromatase arm.
  grade: E
  basis: >-
    NOT ESTABLISHED AND NOT CLAIMED. +1.3 cm remains +1.3 cm, all eight fractures in the trial were
    appendicular sports injuries rather than fragility fractures, no subject reported a vertebral fracture
    or persistent back pain during the trial, and the wedging observations are two uncontrolled
    off-protocol films. What follows is MEASUREMENT, not discontinuation - baseline and repeated lateral
    thoracolumbar radiography and DXA, continued beyond two years, because that is where the only positive
    findings appeared.
