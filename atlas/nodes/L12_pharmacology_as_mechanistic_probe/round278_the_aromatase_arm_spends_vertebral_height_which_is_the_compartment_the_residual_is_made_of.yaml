contradicts: >-
  EXTENDS round274_the_aromatase_choice_is_settled_by_an_rct_the_serm_route_is_dead_and_the_denominator_closed
  rather than overturning it. That round read zegarra2024's efficacy arm and priced the aromatase inhibitor
  at about +1.3 cm of predicted height over three years with no difference between the two drugs. It did
  not read the same trial's prespecified SAFETY arm. Read now: whole-body and lumbar BMD Z-scores fell
  SIGNIFICANTLY in both arms over two years, and anterior vertebral wedging appeared in two boys on films
  taken beyond four years. Because rounds 273 and 274 established that the residual growth at this maturity
  is largely vertebral, that cost is an OFFSETTING TERM IN THE HEIGHT CALCULATION rather than a safety
  footnote the programme can set aside.
