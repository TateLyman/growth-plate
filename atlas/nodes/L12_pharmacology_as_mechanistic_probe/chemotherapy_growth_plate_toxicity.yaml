localization:
  - "human growth plate: direct cytotoxic injury to proliferative chondrocytes is the proposed mechanism for antimetabolites and platinums"
  - "human hypothalamic-pituitary axis: irradiation-induced GH deficiency is a separate and additive route to growth failure"
human_evidence: direct
human_evidence_note: >-
  Growth failure in childhood cancer survivors is documented at population scale, and a
  prospective cohort has examined methotrexate and growth plate development in JIA.
species_basis: [human, in_vitro_human_cell]
translation_risk: moderate
translation_risk_reason: >-
  The clinical growth failure is human and unambiguous, but the cellular mechanisms
  (cisplatin-induced chondrocyte apoptosis, methotrexate antiproliferation) come from
  in vitro and animal work, and the relative contribution of each route in a treated child
  has not been apportioned.
confidence: C
claim_grades:
  - claim: Childhood cancer treatment causes growth failure that persists into survivorship.
    grade: A
    basis: Population-scale survivorship data and the existence of dedicated GH replacement programmes after transplantation.
  - claim: Methotrexate has a direct adverse effect on growth plate development at therapeutic doses.
    grade: C
    basis: A prospective observational cohort in JIA plus a narrative review of bone metabolism effects; not randomised.
  - claim: Growth hormone replacement incompletely rescues growth after irradiation because the plate itself is damaged.
    grade: C
    basis: Consistent with post-transplant GH cohorts but not formally partitioned between effector damage and residual endocrine deficit.
