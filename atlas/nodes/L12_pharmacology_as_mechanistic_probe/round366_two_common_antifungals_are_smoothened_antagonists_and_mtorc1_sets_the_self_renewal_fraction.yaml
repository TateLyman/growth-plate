id: round366_two_common_antifungals_are_smoothened_antagonists_and_mtorc1_sets_the_self_renewal_fraction
name: Round 366 - ITRACONAZOLE AND POSACONAZOLE ARE SMOOTHENED ANTAGONISTS AT ORDINARY ANTIFUNGAL EXPOSURE
  and therefore inherit the hardest contraindication in this file, with a free substitution available; vitamin
  D3 binds SMO too, which makes megadosing a band question; and newton2019 read properly says mTORC1 sets the
  SYMMETRIC-versus-ASYMMETRIC division balance with every rate control null, which is a pure N lever and which
  upgrades the rapalog and metformin contraindications from slows-growth to SPENDS-THE-POOL
aliases:
- itraconazole is a smoothened antagonist
- posaconazole hedgehog
- which antifungal is safe for an open growth plate
- vitamin D3 binds smoothened
- mTORC1 sets the self-renewal fraction
- what raises the fraction of self-renewing divisions
type: hypothesis
layer: L12
stub: false
summary: 'R365 established that the closure clock is counted in DIVISIONS, so nothing that blocks the output
  can pause it. That collapses the whole objective onto one variable - THE FRACTION OF DIVISIONS THAT ARE
  SELF-RENEWING - and this round works both signs of it. The positive sign has a mechanism and no drug. The
  negative sign produced two immediately actionable findings that cost nothing.

  ⛔⛔⛔ ONE - ITRACONAZOLE AND POSACONAZOLE ARE SMOOTHENED ANTAGONISTS, AND THE HEDGEHOG-INHIBITORY
  CONCENTRATION IS THE ORDINARY CLINICAL ONE. This file hardest contraindication is SMO antagonism - in
  newton2019, vismodegib given to NORMAL juvenile mice for FOUR DAYS fused the growth plate, a grade A direct
  fusion endpoint. kim2010itra found itraconazole in a screen of drugs already tested in humans, showed it
  antagonises SMO by a mechanism DISTINCT from cyclopamine and DISTINCT from its own antifungal sterol effect,
  showed it PREVENTS THE CILIARY ACCUMULATION OF SMO, and - the clause that decides this - suppressed hedgehog
  activity and tumour growth in vivo AT SERUM LEVELS COMPARABLE TO THOSE IN PATIENTS UNDERGOING ANTIFUNGAL
  THERAPY. chen2016posa reproduces it for posaconazole, also at the level of SMO, also non-cyclopamine-
  competitive, also active in vivo. ITRACONAZOLE APPEARED IN THIS ATLAS EXACTLY ONCE BEFORE TODAY - as a
  CYP3A inhibitor in a vepdegestrant drug-interaction table. Its hedgehog pharmacology was never noted.

  ⭐⭐ TWO - AND THE CLASS IS BOUNDED, WHICH TURNS A WARNING INTO A SUBSTITUTION. Queried individually,
  FLUCONAZOLE, VORICONAZOLE, KETOCONAZOLE AND TERBINAFINE RETURN ZERO TITLE-PLUS-HEDGEHOG RECORDS. This is
  NOT a triazole class effect and NOT an antifungal class effect - it is specific to itraconazole and
  posaconazole. So the actionable form is not avoid antifungals; it is IF AN ORAL ANTIFUNGAL IS NEEDED WHILE
  THE PLATE IS OPEN, USE TERBINAFINE OR FLUCONAZOLE, NOT ITRACONAZOLE OR POSACONAZOLE. Oral itraconazole and
  terbinafine are the two standard agents for adolescent onychomycosis and tinea capitis, so this is a live
  choice rather than a hypothetical one.

  ⚠⚠ THREE - VITAMIN D3 ALSO BINDS SMOOTHENED, AND THIS ONE IS A BAND, NOT A CONTRAINDICATION. bijlsma2006 -
  vitamin D3 binds SMO with high affinity in a cyclopamine-sensitive manner, inhibits Gli activity, and
  treating zebrafish embryos with vitamin D3 MIMICKED THE SMO-NULL PHENOTYPE. chen2025vd3 corroborates it
  independently from a medicinal-chemistry programme building vitamin-D3-scaffold Hh inhibitors that target
  SMO without binding the cyclopamine site - and its SAR is the load-bearing detail, because it raises
  anti-Hh activity while DELIBERATELY REDUCING VDR activity, which means the two activities are separable and
  that native vitamin D3 carries both. ⛔ THE CAVEAT IS ABSOLUTE AND IS THE SAME ONE THIS FILE ALREADY
  ATTACHES TO VITAMIN C - THIS IS ABOUT MEGADOSING, NEVER ABOUT ADEQUACY. Vitamin D deficiency is rickets, a
  skeletal disease, and this atlas already asks for 25-OH-D to be measured. ⛔ AND THE HONEST GAP - no Kd or
  concentration is given, the active species is (pro-)vitamin D3 rather than calcitriol, the in vivo
  demonstration is a zebrafish EMBRYO, and NOBODY HAS MEASURED WHETHER ANY ORAL CHOLECALCIFEROL DOSE REACHES
  SMO-OCCUPYING CONCENTRATIONS AT A GROWTH PLATE. Target mid-normal 25-OH-D; do not megadose.

  ⭐⭐⭐ FOUR - AND THE POSITIVE SIGN. newton2019 READ PROPERLY IS A PURE N LEVER, AND R364 UNDERSOLD IT.
  Chondrocyte-specific Tsc1 ablation, which activates mTORC1, shifts cell division from asymmetric toward
  symmetric - PAR3 was distributed symmetrically in a larger proportion of stem-cell clonal dyads - and the
  number and thickness of multi-columnar clones increased with time from P3 to P90, which the authors call
  accelerated expansion of colony-forming cells. ⭐ WHAT MAKES IT A POOL RESULT RATHER THAN A RATE RESULT IS
  THAT EVERY RATE CONTROL IS NULL: EdU-positive stem cells rose 24.7 +/- 3.7 to 62.4 +/- 7.5 per section
  (P=0.014) but WITH NO CHANGE RELATIVE TO TOTAL RESTING-ZONE CELL NUMBER; Ki67 and phospho-histone-H3
  confirmed unchanged stem-cell proliferation; the percentage of EdU-positive flat cells and their migration
  to the hypertrophic zone were unaltered; proliferation of the underlying flat chondrocytes and SOX9
  expression were unaffected. The authors own summary is that neither proliferation of chondroprogenitors nor
  their recruitment into the proliferative layer changed detectably while clones in the resting zone grew.
  THAT IS THE SPIN4 SIGNATURE - N UP WITH THE RATE TERMS FLAT - REACHED BY A COMPLETELY DIFFERENT PATHWAY.
  ⭐ AND THE AXIS IS BIDIRECTIONAL AT THE POOL: mTORC1 INHIBITION by tissue-specific Raptor ablation ENHANCED
  LOSS OF CLONES in otherwise phenotypically normal growth plates.

  ⛔⛔ FIVE - WHICH UPGRADES TWO EXISTING CONTRAINDICATIONS FROM SLOWS-GROWTH TO SPENDS-THE-POOL. Rapalogs
  were already contraindicated three times over - MTOR pLoF -3.65 cm, FKBP1A +4.605 on the maturation screen,
  and rapamycin halving rat longitudinal growth rate. All three are RATE arguments. Raptor ablation enhancing
  clone loss is a POOL argument, and for a subject whose entire residual is pool-limited that is the worse
  one. THE SAME ARGUMENT REACHES METFORMIN, which activates AMPK and therefore inhibits mTORC1 - R326 noted
  the conflict with R297 promotion of metformin as the only period-directed agent and neither round priced
  it; this prices it, in the pool.
  ⛔⛔ CORR-353 - I WROTE THAT ENERGY RESTRICTION HAS ZERO COVERAGE HERE AND IS NEVER ONCE ASKED, AND THAT
  IS FALSE. IT IS ALSO THE WRONG SIGN. I greped caloric restriction and fasting; THE ATLAS CALLS IT DIETARY
  RESTRICTION, and `g_l2_cycling_the_progenitor_pool` has held the worked answer since round 178. A GREP THAT
  MISSES ON VOCABULARY IS STILL A FAILED GREP - and this is the second CORR-313 instance in two rounds.
  WHAT oichi2023 ACTUALLY SHOWS IS THE OPPOSITE OF WHAT I WROTE: seven days of dietary restriction in mouse
  ACCUMULATED Axin2-positive resting-zone progenitors and BLOCKED their differentiation, raising the
  resting-zone-to-plate-length ratio; refeeding released them into columns at a growth rate ABOVE control to
  at least P48, with column output up (adjusted P=0.0043 at P41, P<0.0001 at P48) and THE PROGENITOR
  DENOMINATOR UNCHANGED (P>0.9999) - a yield increase with both terms measured in the same animals. The
  switch is IGF-1 through IGF1R and PI3K/Akt in the resting zone. gafni2001 gives the same shape with
  glucocorticoid - a three-week senescence delay, 14 per cent of plates fused versus 88 per cent in controls.
  RESTRICTION CHARGES THE POOL. IT DOES NOT SPEND IT.
  ⛔ AND THE REASON IT IS STILL NOT A LEVER, WHICH IS ALSO ALREADY IN THAT GAP: NEITHER EXPERIMENT EXCEEDED
  CONTROL ON LENGTH. oichi2023 deficit closed to 0.02 mm and 0.10 mm, both non-significant, and gafni2001
  stopped with growth still running. The charge phase is a demonstrated loan repaid, not a demonstrated
  battery, and nobody has run REPEATED cycles at matched total intake. So the corrected statement is that
  energy restriction is NEITHER the free cost I wrote NOR a lever - it is a charge-discharge cycle that has
  been run once and came back to par.
  ⭐⭐ AND THE TENSION IS WORTH MORE THAN EITHER CLAIM, BECAUSE IT IS THE THIRD INSTANCE OF ONE PATTERN.
  newton2019 Raptor ablation - mTORC1 down, CHRONIC, genetic - ENHANCES CLONE LOSS. oichi2023 dietary
  restriction - the same axis down, TRANSIENT, seven days - ACCUMULATES PROGENITORS. Same direction on one
  axis, opposite results, separated by DURATION. That is exactly the hedgehog result R363 and R364 fought
  over, where a PULSE expands the pool and SUSTAINED activation converts it to bone. PULSE VERSUS SUSTAINED
  IS NOW A DISCRIMINATOR ON THREE INDEPENDENT AXES - hedgehog, mTORC1 and GH - and in all three the pulse is
  the favourable one. ✗ Caveat kept: Axin2-positive progenitors may not be the same cells as newton2019
  PTHrP-positive CD73-positive stem cells, so the two results may not be about one population.

  ⛔ SIX - AND THE HUMAN ANCHOR FOR THE POOL DIRECTION DOES NOT EXIST, WHICH IS WHY THIS IS NOT A PROMOTION.
  Run against the two datasets on disk: MTOR is the ONLY mTORC1-pathway gene in kosmicki 207 and its pLoF is
  -3.65 cm - the deficit direction, consistent but uninformative about elevation. TSC1 AND TSC2 RETURN NO
  STATURE PHENOTYPE AT ALL IN HPO, so the human heterozygous version of newton2019 experiment does not make
  people tall. DEPDC5, a GATOR1 brake whose loss also raises mTORC1, returns SHORT STATURE - recorded because
  it is inconvenient, and weak because the disease is an epilepsy syndrome where stature is confounded. The
  pathway HPO annotations that do show overgrowth - PIK3CA, AKT1 - are MOSAIC ACTIVATING SOMATIC lesions,
  which R324 already flagged. There is no obtainable mTORC1 activator, and the direction cannot be promoted
  on a mouse conditional alone.'
quantitative:
- parameter: ITRACONAZOLE ANTAGONISES SMOOTHENED AT ORDINARY ANTIFUNGAL SERUM CONCENTRATIONS
  value: 'Identified in a screen of drugs previously tested in humans as a potent antagonist of the hedgehog
    pathway. Acts by a mechanism DISTINCT from its inhibitory effect on fungal sterol biosynthesis and
    DISTINCT from cyclopamine and other known SMO antagonists. Prevents the ciliary accumulation of SMO
    normally caused by Hh stimulation. Systemically administered, suppressed Hh pathway activity and the
    growth of medulloblastoma in a mouse allograft model, and did so AT SERUM LEVELS COMPARABLE TO THOSE IN
    PATIENTS UNDERGOING ANTIFUNGAL THERAPY.'
  unit: qualitative with a stated exposure equivalence
  conditions: kim2010itra, abstract read 2026-08-13. Cell-based Hh reporter plus mouse medulloblastoma
    allograft.
  species: mouse
  source_ref: kim2010itra
  uncertainty: 'The exposure equivalence is the load-bearing claim and it is stated in the abstract without a
    number, so the margin between antifungal exposure and Hh-inhibitory exposure is not quantified here and
    the full text was not read. NO AZOLE HAS EVER BEEN GIVEN TO A GROWING ANIMAL WITH A FUSION OR BONE-LENGTH
    ENDPOINT, so the physeal consequence is inherited from vismodegib by shared target rather than measured.
    That inheritance is the grade C step in this node.'
- parameter: POSACONAZOLE DOES THE SAME THING, WHICH BOUNDS THE CONTRAINDICATION TO TWO AGENTS
  value: 'Posaconazole is a potent inhibitor of the hedgehog pathway that functions AT THE LEVEL OF SMO, by a
    mechanism distinct from cyclopamine and other cyclopamine-competitive SMO antagonists, with robust
    activity against drug-resistant SMO mutants, and inhibits the growth of Hh-dependent basal cell carcinoma
    IN VIVO. The authors position it as preferable to itraconazole for oncology use because it has minimal
    drug-drug interactions and a favourable side-effect profile.'
  unit: qualitative with direction
  conditions: chen2016posa, abstract read 2026-08-13.
  species: mouse
  source_ref: chen2016posa
  uncertainty: 'Same inheritance caveat as itraconazole - no physeal or length endpoint. The favourable
    side-effect and interaction profile the authors praise makes posaconazole MORE likely to be chosen, not
    less, which is why it is recorded alongside rather than as a lesser concern.'
- parameter: THE CLASS BOUNDARY - FOUR OTHER ANTIFUNGALS RETURN NOTHING, SO A SUBSTITUTION EXISTS
  value: 'Europe PMC, title-of-drug AND abstract-mentions-hedgehog, queried individually 2026-08-13:
    itraconazole 64 records; posaconazole 4 records; FLUCONAZOLE 0; VORICONAZOLE 0; KETOCONAZOLE 0;
    TERBINAFINE 0. The hedgehog activity is therefore specific to itraconazole and posaconazole rather than
    being a triazole or antifungal class property.'
  unit: record counts
  conditions: Query run by this atlas 2026-08-13 against Europe PMC.
  species: not_applicable
  source_ref: kim2010itra
  atlas_derived: true
  uncertainty: 'AN EMPTY QUERY IS WEAK EVIDENCE OF ABSENCE - CORR-267 and CORR-284 both apply, and a drug
    could inhibit SMO without anyone having published it under that title. What the zeros support is that no
    RECOGNISED hedgehog activity attaches to those four, which is enough to prefer them but not enough to
    call them proven clean. Terbinafine is mechanistically reassuring on separate grounds - it inhibits
    fungal squalene epoxidase, an entirely different step from the azoles 14-alpha-demethylase.'
- parameter: VITAMIN D3 BINDS SMOOTHENED AND PHENOCOPIES THE SMO NULL IN VIVO
  value: 'Vitamin D3 bound to SMO with HIGH AFFINITY in a CYCLOPAMINE-SENSITIVE manner; adding the
    3-beta-hydroxysteroid (pro-)vitamin D3 to the medium effectively inhibited Gli activity; and treating
    zebrafish embryos with vitamin D3 MIMICKED THE SMO-NULL PHENOTYPE, confirming inhibitory action in vivo.
    The paper proposes that Ptch1 represses Smo non-cell-autonomously by secreting this sterol.
    INDEPENDENT CORROBORATION - a 2025 medicinal-chemistry programme states that vitamin D3 and its
    derivatives have been identified as potent Hh inhibitors, builds aromatic A-ring 23-oxavitamin D3
    analogues, and shows their anti-Hh effect is mainly due to targeting SMO WITHOUT binding the cyclopamine
    site; its SAR raises anti-Hh activity with a C25 hydroxyl while REDUCING VDR activity with a side-chain
    oxygen.'
  unit: qualitative with direction
  conditions: bijlsma2006 and chen2025vd3, abstracts read 2026-08-13. Cell reporter assays plus zebrafish
    embryo.
  species: multiple
  source_ref: bijlsma2006
  uncertainty: 'THIS IS A BAND AND MUST NEVER BE READ AS A CONTRAINDICATION ON VITAMIN D ADEQUACY. Deficiency
    is rickets, a skeletal disease, and this atlas already asks for 25-OH-D to be measured. FOUR SPECIFIC
    GAPS: no Kd or effective concentration is given in either abstract; the active species is (pro-)vitamin
    D3, not calcitriol, and the relationship between an oral cholecalciferol dose and local SMO occupancy at
    a growth plate is entirely unmeasured; the in vivo demonstration is a zebrafish EMBRYO; and the proposed
    Ptch1-secretes-vitamin-D3 mechanism is NOT the current field consensus, which favours Ptch1 as a sterol
    transporter acting on the SMO CRD. The binding-and-inhibition observation is separable from that
    mechanistic proposal and is what chen2025vd3 corroborates. Grade D, megadosing only.'
- parameter: mTORC1 SETS THE SYMMETRIC-VERSUS-ASYMMETRIC DIVISION BALANCE WITH EVERY RATE CONTROL NULL
  value: 'Col2-creERT Tsc1-floxed mice crossed to R26R-Confetti, tamoxifen at P3. PAR3 was distributed
    symmetrically in a larger proportion of stem-cell clonal dyads (P3-P40), and the number and thickness of
    multi-columnar clones increased with time during P3-P90, indicating accelerated expansion of
    colony-forming cells. CD73 was expressed by all cells in isolated Confetti-labelled dyads in the resting
    zone of both Tsc1 heterozygous (n=7) and Tsc1 null (n=7) mice.
    THE RATE CONTROLS, ALL NULL: EdU-positive epiphyseal stem cells 62.4 +/- 7.5 (n=7) versus 24.7 +/- 3.7
    (n=3) per section, P=0.014, but WITH NO CHANGE RELATIVE TO THE TOTAL NUMBER OF RESTING-ZONE CELLS;
    unchanged stem-cell proliferation confirmed by Ki67 and phospho-histone-H3; percentage of EdU-positive
    flat cells and their migration to the hypertrophic zone unaltered; proliferation of underlying flat
    chondrocytes unaffected; SOX9 expression unaffected. The authors conclude that neither proliferation of
    chondroprogenitors nor their recruitment into the proliferative layer changed detectably while clones in
    the resting zone grew gradually.
    THE OPPOSITE DIRECTION, SAME PAPER: inhibition of mTORC1 by tissue-specific ablation of Raptor slightly
    ENHANCED LOSS OF CLONES in otherwise phenotypically normal growth plates.'
  unit: proportion of dyads; cells per section; clone number and thickness
  conditions: newton2019, full text extracted and read 2026-08-13 from the operator-supplied PDF. Mouse,
    chondrocyte-specific inducible alleles.
  species: mouse
  source_ref: newton2019
  uncertainty: 'NO BONE LENGTH WAS MEASURED IN ANY ARM, which under R302 is a gap rather than a
    disqualification but is the reason this is not a promotion. The Tsc1 phenotype also has a real cost
    recorded in the same paper - the resting zone becomes DISORGANIZED from P28, and cilia above the columns
    are irregularly distributed, suggesting loss of tissue polarisation. Constitutive genetic mTORC1
    activation from P3 is not a model of adult pharmacological modulation, and the PAR3 dyad readout is
    reported as a larger proportion without a number in the main text. CORR-292 applies - an expanded clone
    is not automatically a usable pool.'
- parameter: THE HUMAN ANCHOR FOR THE POOL DIRECTION IS ABSENT, RUN AGAINST BOTH DATASETS ON DISK
  value: 'kosmicki2026 supplementary table 6, all 7,185 rows - the ONLY mTORC1-pathway gene reaching the 207
    is MTOR itself, pLoF -3.650 cm at P=2.17e-11 across 166 heterozygotes. TSC1, TSC2, RPTOR, RHEB, DEPDC5,
    NPRL2, NPRL3, AKT1, PTEN, PIK3CA, PRKAA1, PRKAA2, STK11 and FLCN return NO rows.
    HPO genes_to_phenotype - TSC1 and TSC2 return NO stature or growth annotation of any kind. DEPDC5, whose
    loss also raises mTORC1, returns SHORT STATURE (ORPHA:442835). The overgrowth annotations on this pathway
    belong to PIK3CA and AKT1 and are mosaic activating somatic lesions - asymmetric growth, acral
    overgrowth, Proteus - while PTEN returns BOTH tall (ORPHA:109) and short.'
  unit: centimetres per allele; HPO term presence
  conditions: Queried by this atlas 2026-08-13 against atlas/data/round300/s6_burden_effects.json and
    atlas/data/supplied_2026_08_13/hpo_genes_to_phenotype.txt.
  species: human
  source_ref: kosmicki2026
  atlas_derived: true
  uncertainty: 'CORR-348 APPLIES TO THE TSC1 AND TSC2 RESULT - an absent annotation is not a measured null,
    and HPO records what is clinically recognised rather than what was systematically measured. For a
    condition as well characterised as tuberous sclerosis the absence is weakly informative that stature is
    not a recognised feature, which is the most that can be claimed. The DEPDC5 short-stature row is
    confounded by the epilepsy syndrome it belongs to and CORR-341 was not run down to the allele. MTOR pLoF
    being negative is the DEFICIT direction and says nothing about elevation - CORR-203.'
localization:
- the epiphyseal resting zone, where the symmetric-versus-asymmetric division decision is made and where PAR3
  segregation is read
- the primary cilium, where SMO must accumulate for hedgehog transduction and which itraconazole specifically
  prevents
human_evidence: indirect
human_evidence_note: 'No human growth-plate or height data exist for any of the four agents in this node.
  Itraconazole and posaconazole have extensive human safety experience but no physeal endpoint, and the
  hedgehog consequence for an open plate is inherited from vismodegib by shared target rather than measured.
  The human genetics that do exist run against the mTORC1 pool direction being promotable - MTOR pLoF is
  -3.65 cm, TSC1 and TSC2 carry no recognised stature phenotype, and the pathway overgrowth syndromes are
  mosaic somatic activating lesions.'
species_basis:
- mouse
- zebrafish
- human
translation_risk: moderate
translation_risk_reason: 'The contraindication half rests on a target-sharing inference - itraconazole and
  posaconazole antagonise the same protein whose antagonist fused a normal juvenile mouse plate in four days
  - and no azole has ever been given to a growth plate. The risk is of overstating a hazard that has never
  been observed in a child. It is mitigated by the fact that the recommended action is a SUBSTITUTION between
  agents of equivalent efficacy, which costs nothing if the concern is wrong.'
confidence: C
claim_grades:
- claim: Itraconazole and posaconazole antagonise Smoothened at ordinary clinical exposure.
  grade: B
  basis: 'kim2010itra shows itraconazole is a potent SMO antagonist acting by a mechanism distinct from
    cyclopamine and from its own antifungal sterol effect, prevents ciliary SMO accumulation, and is active in
    vivo at serum levels comparable to those in patients on antifungal therapy. chen2016posa reproduces the
    SMO-level inhibition for posaconazole with in vivo activity. Two independent agents, one target, primary
    literature, 406 and 48 citations.'
- claim: They should therefore be avoided while the growth plate is open, in favour of terbinafine or
    fluconazole.
  grade: C
  basis: 'THE INFERENCE IS BY SHARED TARGET, NOT BY MEASUREMENT. newton2019 fused a normal juvenile mouse
    plate with four days of vismodegib, a grade A fusion endpoint on a SMO antagonist. No azole has been given
    to a growing animal with a physeal or length endpoint. Graded C for that step and recommended anyway
    because the action is a substitution between agents of comparable clinical efficacy, so the cost of being
    wrong is approximately zero and the cost of being right is a fused plate.'
- claim: The hedgehog effect is a property of azoles or of antifungals generally.
  grade: X
  basis: 'NO, and this is what makes the finding usable. Queried individually, fluconazole, voriconazole,
    ketoconazole and terbinafine return zero title-plus-hedgehog records while itraconazole returns 64 and
    posaconazole 4. Terbinafine acts on squalene epoxidase, a different step entirely. The concern attaches to
    two named molecules.'
- claim: Vitamin D3 supplementation should be reduced or stopped.
  grade: X
  basis: 'NO. Deficiency is rickets, a skeletal disease, and adequacy is not negotiable. What the evidence
    supports is a caution about MEGADOSING only - the same shape this file already applies to vitamin C - with
    the honest gap that no Kd, no dose-to-occupancy relationship and no mammalian growth-plate experiment
    exists. Measure 25-OH-D and target mid-normal.'
- claim: Vitamin D3 binds Smoothened and inhibits hedgehog signalling.
  grade: D
  basis: 'bijlsma2006 reports high-affinity cyclopamine-sensitive binding, Gli inhibition, and a zebrafish
    embryo phenocopy of the SMO null. chen2025vd3 independently states vitamin D3 and derivatives are potent
    Hh inhibitors and shows its analogues act on SMO outside the cyclopamine site. Grade D because the
    concentration is unstated, the in vivo work is a fish embryo, and the surrounding mechanistic proposal is
    not the field consensus.'
- claim: mTORC1 activity sets the fraction of resting-zone divisions that are self-renewing.
  grade: C
  basis: 'newton2019 - Tsc1 ablation shifts PAR3 toward symmetric distribution in stem-cell dyads and grows
    multi-columnar clones progressively from P3 to P90, while EdU relative to total resting-zone cells, Ki67,
    phospho-histone-H3, flat-cell proliferation, migration to the hypertrophic zone and SOX9 are ALL
    unchanged; and Raptor ablation runs the other way, enhancing clone loss. Bidirectional, with the rate
    terms controlled. Grade C rather than B because no bone length was measured and the resting zone becomes
    disorganised.'
- claim: Therefore an mTORC1 activator should be added to the stack.
  grade: X
  basis: 'NO - on three grounds. No obtainable mTORC1 activator exists. The human anchor is absent or
    negative: MTOR is the only pathway gene in the 207 and its pLoF is -3.65 cm, TSC1 and TSC2 have no
    recognised stature phenotype, and the overgrowth alleles are mosaic somatic. And the mouse gains a
    DISORGANISED resting zone, which is CORR-292 territory. What the finding is good for is pricing the
    OPPOSITE direction as a cost.'
- claim: Energy or protein restriction spends the resting-zone pool.
  grade: X
  basis: 'WITHDRAWN WITHIN THIS ROUND - CORR-353. I asserted it from the mTORC1 direction and from a grep that
    failed on vocabulary. oichi2023, held in g_l2_cycling_the_progenitor_pool since round 178, shows seven days
    of dietary restriction ACCUMULATES Axin2-positive resting-zone progenitors and BLOCKS their
    differentiation, with refeeding discharging them above control rate and the progenitor denominator
    unchanged. Restriction CHARGES the pool. It is still not a lever, because neither oichi2023 nor gafni2001
    exceeded control on final length.'
- claim: Rapalogs and metformin cost this subject the resting-zone pool, not merely growth rate.
  grade: D
  basis: 'The three existing arguments against rapalogs - MTOR pLoF -3.65 cm, FKBP1A +4.605 on the maturation
    screen, rapamycin halving rat longitudinal growth - are all RATE arguments. Raptor ablation enhancing loss
    of resting-zone clones is a POOL argument, which is worse for a pool-limited subject. Metformin inherits
    it through AMPK. Grade D: Raptor ablation is genetic and complete, and no rapalog or metformin experiment
    has ever counted resting-zone clones. AND CORR-353 BOUNDS IT FURTHER - oichi2023 lowers the same axis
    TRANSIENTLY and accumulates progenitors rather than losing them, so the pool cost may belong to SUSTAINED
    suppression specifically. A rapalog taken continuously is the sustained case; that is the version this
    claim covers.'
