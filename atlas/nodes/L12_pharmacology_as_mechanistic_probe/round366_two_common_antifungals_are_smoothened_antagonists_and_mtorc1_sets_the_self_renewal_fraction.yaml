  coverage in this file is withdrawn on both counts - oichi2023 has been in g_l2_cycling_the_progenitor_pool
  since round 178 and shows restriction CHARGES the pool. The grep failed because the atlas calls it dietary
  restriction rather than caloric restriction or fasting.
- DOES NOT PROMOTE THE mTORC1 DIRECTION. The human anchor is absent or negative and there is no obtainable
  activator, so the finding is recorded as a cost on the opposite direction rather than a lever.
