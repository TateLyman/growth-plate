id: round203_the_cnp_axis_is_linear_and_the_term_is_still_unmeasured
name: ROUND 203 - the CNP axis is near-linear in humans where the somatotropic axis saturates, it grows
  the segments proportionately, and at constitutive activation it diverts output into digits and spine
  deformity - but no terminal cell height has ever been measured under any CNP agent
type: hypothesis
layer: L12
aliases:
- CNP dose census
- the dimmer switch
- CNP term assignment unresolved
- round 203
stub: false
summary: 'ROUND 202 LEFT ONE QUESTION AS THE MOST DECISION-RELEVANT UNMEASURED QUANTITY IN THE STACK -
  does the CNP axis raise TERMINAL CELL HEIGHT, the free axis, and does it saturate the way the
  somatotropic axis does? This round answers the second question and establishes that the first cannot
  currently be answered by anyone.

  THE SATURATION ANSWER IS THE OPPOSITE OF THE SOMATOTROPIC ONE, AND IT IS HUMAN AND POPULATION-SCALE.
  jeong2026 - held in this bibliography as a bare citation with no finding and never read until now -
  functionally characterised 245 NPR2 missense variants observed in UK Biobank, classifying 47
  loss-of-function, 34 partial loss and 14 GAIN-OF-FUNCTION. Activity score against standing height is
  NEAR-LINEAR, R-squared 0.438, p = 5.8e-10, with the effects ADDITIVE against polygenic background,
  protein-truncating and loss-of-function variants enriched in the shortest individuals and GAIN-OF-
  FUNCTION VARIANTS ENRICHED IN THE TALLEST. The authors call the relationship a DIMMER SWITCH. Round
  202 found h_term saturating hard against somatotropic drive - 40 per cent of the available gain in the
  first tripling of pool consumption and 9 per cent in the next 3.3-fold. The CNP axis shows no such
  ceiling across its characterised range. THE TWO AXES SHOULD THEREFORE BE DOSED BY OPPOSITE LOGIC, and
  the stack currently doses them by the same logic.

  A PHENOME-WIDE ASSOCIATION ON THE SAME DATA FOUND NPR2 ACTIVITY SIGNIFICANTLY ASSOCIATED ONLY WITH
  HEIGHT AND HEIGHT-ASSOCIATED TRAITS. That is a strong clean-target result and it must not be
  over-read, because a population PheWAS samples the MILD end of the activity range by construction.

  THE PHARMACOLOGICAL POINT ANSWERS THE SITE QUESTION AND ANSWERS IT FAVOURABLY. cnpmeta2026 pools four
  randomised trials, n = 326, low risk of bias - the upper-to-lower segment ratio is UNCHANGED, mean
  difference minus 0.02 (95 per cent CI minus 0.04 to plus 0.01), P = 0.17, I-squared 0, with vosoritide
  and navepegritide separately both at minus 0.02. Against the open-site register built this round, an
  agent that grows the segments proportionately is the RIGHT KIND of agent for a case with several sites
  open rather than one. The age gradient also runs the helpful way - the annualised velocity gain is
  LARGER at age five and above (1.63 cm/year) than under five (0.91), subgroup P = 0.01 - though it
  stops far short of bone age 16 and the review states explicitly that adult height is not yet known.

  AND THEN THE CONSTITUTIVE POINT, WHICH IS WHERE THE ATLAS HAD NEVER LOOKED SYSTEMATICALLY. Six human
  reports of strong CNP-axis activation are held here and had only ever been read one at a time. Read as
  a census they show two patterns that a single case report cannot show. DIGITAL OVERGROWTH IS THE MOST
  CONSISTENT NON-HEIGHT FEATURE, in FOUR of six - macrodactyly of the great toes, markedly elongated
  proximal and middle phalanges, and additional or pseudo-epiphyses in phalangeal and metacarpal bones.
  THE PHALANGES CONTRIBUTE NOTHING TO STATURE. At maximal activation a visible share of the axis output
  goes to sites with zero height value. SCOLIOSIS APPEARS IN THREE OF SIX, and in moffatt2025 in all
  three siblings with ONE REQUIRING SPINAL FUSION SURGERY and lumbar spine bone mineral density low for
  the height achieved. A spinal fusion ends spinal growth outright and a curve converts axial length
  into deviation, so THIS IS A YIELD TERM AND NOT ONLY A SAFETY TERM.

  THOSE THREE POINTS ARE NOT IN CONFLICT - THEY ARE THREE POINTS ON ONE DOSE CURVE, and the atlas had
  been quoting whichever one suited the paragraph. Mild lifelong variation gives height only, linearly,
  with a clean PheWAS. Pharmacological exposure gives proportionate segment growth. Maximal constitutive
  activation gives height plus digital overgrowth plus spine deformity. The population PheWAS cannot
  exclude the constitutive phenotypes and must not be quoted as if it did; equally the constitutive
  families are germline and lifelong and do not bound a months-long exposure at a late bone age.

  THE TERM ITSELF REMAINS UNMEASURED, AND THIS ROUND ESTABLISHES THAT AS A FACT ABOUT THE LITERATURE
  RATHER THAN A GAP IN THIS ATLAS''S READING. Full text was obtained for the two candidate sources and
  neither contains a cell. hirota2018 - the wild-type result, CNP-53 by infusion in wild-type as well as
  CNP-knockout rats - measures GROWTH PLATE THICKNESS at nine sites on the femur and five on the tibia
  and calcaneus, and the thickness of hypertrophic and non-hypertrophic zones. No cell dimension
  anywhere. nakao2015 - cartilage-specific Nppc and Npr2 deletion - measures LAYER THICKNESS, reporting
  the hypertrophic layer falling to 34.6 and 23.0 per cent of control against the non-hypertrophic layer
  at 76.7 and 71.1 per cent. No cell dimension anywhere.

  AND nakao2015 CONTAINS THE OBSERVATION THAT MAKES THE ZONE EVIDENCE UNUSABLE RATHER THAN MERELY
  INSUFFICIENT. In both knockouts THE EXTRACELLULAR SPACES OF THE NON-HYPERTROPHIC LAYER WERE GREATLY
  DECREASED. CORR-189 states that a zone height is cells per column times cell height. THAT IS
  INCOMPLETE. A zone height is cells per column times cell height PLUS EXTRACELLULAR MATRIX, and the CNP
  axis demonstrably moves the matrix term. So the entire CNP zone-height literature is consistent with a
  matrix effect, a cell-number effect, a cell-height effect or any mixture, and cannot be decomposed.
  Logged as CORR-197. The same paper also reports TUNEL showing almost no difference in apoptosis, so
  the collapse of the hypertrophic layer is not a clearance effect.

  THE ONLY CELL-LEVEL MEASUREMENT ON THIS PATHWAY IN EXISTENCE IS STILL weber2025''S PLUS 20 PER CENT,
  AND IT IS NPR3 LOSS - the clearance arm, not NPR2 agonism, in a receptor the atlas separately records
  as bifunctional. It cannot be transferred to vosoritide.'
quantitative:
- parameter: shape of the human NPR2 activity-to-height relationship
  value: near-linear, Pearson R-squared 0.438, p = 5.8e-10, across 245 functionally characterised
    missense variants (47 loss-of-function, 34 partial loss, 14 gain-of-function); effects additive with
    polygenic background; protein-truncating and loss-of-function variants enriched in the shortest
    individuals, gain-of-function variants enriched in the tallest
  unit: correlation of in vitro activity score against standing height
  conditions: jeong2026, UK Biobank, high-throughput GFP cGMP reporter assay in HEK293T plus CatchPoint,
    integrated with participant standing height
  species: human
  source_ref: jeong2026
  uncertainty: 'LINEAR IN ACTIVITY SCORE, WHICH IS NOT THE SAME AS LINEAR IN DRUG DOSE. The score is an
    in vitro HEK293T cGMP readout and the height is attained adult height under LIFELONG mild genetic
    modulation, not a pharmacological exposure at a late bone age. R-squared 0.438 leaves most of the
    variance unexplained, as expected for a single gene against height. The gain-of-function end rests
    on 14 variants'
- parameter: upper-to-lower segment ratio under a CNP-axis agent
  value: unchanged, mean difference minus 0.02 (95 per cent CI minus 0.04 to plus 0.01), P = 0.17,
    I-squared 0; vosoritide and navepegritide separately both minus 0.02
  unit: upper-to-lower segment ratio
  conditions: cnpmeta2026, 4 randomised trials, n = 326, low risk of bias, achondroplasia
  species: human
  source_ref: cnpmeta2026
  uncertainty: 'THE FAVOURABLE ANSWER AGAINST THE OPEN-SITE REGISTER - proportionate growth rather than
    one segment at the expense of others. ACHONDROPLASIA, where baseline proportions are abnormal, and
    short-term. rua2025 in one 27-child cohort found the ULS ratio shifting minus 0.10 leg-favouring
    while the sitting-height-to-height ratio did not move, two proportion measures disagreeing inside
    one cohort'
- parameter: age gradient of the CNP-axis velocity effect
  value: annualised growth velocity gain 1.63 cm/year (95 per cent CI 1.34 to 1.92, I-squared 0) at age
    five and above against 0.91 cm/year (0.41 to 1.41, I-squared 0) under five; test for subgroup
    difference P = 0.01
  unit: centimetres per year
  conditions: cnpmeta2026, subgroup analysis within the pooled randomised evidence
  species: human
  source_ref: cnpmeta2026
  uncertainty: 'THE ONLY AGE-DIRECTION EVIDENCE THE ATLAS HAS ON THIS AXIS AND IT RUNS THE HELPFUL WAY,
    against the usual assumption that younger is better. It stops far short of bone age 16, the review
    states adult height is not yet known, and a velocity gain is not an adult-height gain under the
    round-198 reserve model'
- parameter: non-height phenotypes under constitutive human CNP-axis activation
  value: digital overgrowth in 4 of 6 reports (macrodactyly of great toes, elongated proximal and middle
    phalanges, additional or pseudo-epiphyses of phalangeal and metacarpal bones); scoliosis in 3 of 6,
    including all three siblings of one family with one requiring spinal fusion surgery and lumbar spine
    BMD low for the height achieved; progressive aortic root dilatation in 2 of 4 individuals in 1 report
  unit: count of reports showing the feature, of six
  conditions: census over miura2012, miura2014, lauffer2020 (NPR2 gain-of-function) and moffatt2025,
    lauffer2022, boudin2018 (NPR3 biallelic loss-of-function)
  species: human
  source_ref: moffatt2025
  uncertainty: 'A CENSUS OVER CASE REPORTS, WITH ALL THE ASCERTAINMENT BIAS THAT IMPLIES - families are
    published because they are striking, and a report that does not mention scoliosis has not
    necessarily excluded it. THE DIGITAL FINDING IS THE MORE ROBUST OF THE TWO because it is what these
    families are diagnosed on. Germline and lifelong at maximal activation, so it does not bound a
    months-long pharmacological exposure'
- parameter: what the CNP growth-plate literature actually measures
  value: hirota2018 measures growth plate THICKNESS at nine femoral sites and five tibial and calcaneal
    sites plus hypertrophic and non-hypertrophic ZONE thickness; nakao2015 measures LAYER thickness,
    hypertrophic falling to 34.6 per cent (Nppc) and 23.0 per cent (Npr2) of control against
    non-hypertrophic at 76.7 and 71.1 per cent. NEITHER MEASURES A CELL DIMENSION ANYWHERE
  unit: enumeration over the full texts
  conditions: full text obtained for both from Europe PMC and searched exhaustively for cell height, cell
    size, cell volume and chondrocyte size
  species: rat
  source_ref: hirota2018
  uncertainty: 'THIS IS A FACT ABOUT THE LITERATURE, NOT AN ADMISSION ABOUT THIS ATLAS''S READING. Both
    full texts were obtained and searched. Combined with CORR-189, it means no CNP-axis agent has a term
    assignment and the atlas must stop implying one'
- parameter: the extracellular matrix term inside a growth plate zone height
  value: in both cartilage-specific knockouts the extracellular spaces of the non-hypertrophic layer were
    greatly decreased; TUNEL showed almost no difference in apoptosis between knockout and control
  unit: qualitative, author-stated
  conditions: nakao2015, Col2a1-Cre Nppc flox/flox and Col2a1-Cre Npr2 flox/flox
  species: mouse
  source_ref: nakao2015
  uncertainty: 'THE OBSERVATION THAT REFINES CORR-189 INTO CORR-197. A zone height is cells per column
    times cell height PLUS EXTRACELLULAR MATRIX, and the CNP axis moves the matrix term, so a CNP zone
    height cannot be decomposed even in principle from the published data. Author-stated qualitatively
    with no quantity attached, which is itself the problem. The unchanged apoptosis rules out clearance
    as the explanation for the hypertrophic layer collapse'
localization:
- 'the hypertrophic layer, which is where the CNP axis does most of its work and where the atlas cannot
  say whether that work is cells, cell height or matrix'
- 'the phalanges and metacarpals - where constitutive activation demonstrably diverts output, at zero
  height value'
- 'the vertebral column - where the same activation produces curve rather than length in half the
  reports'
human_evidence: direct
human_evidence_note: 'The dose-response and the PheWAS are UK Biobank human; the segment ratio and age
  gradient are pooled randomised human trials; the constitutive census is six human reports. The two
  negative findings about what the literature measures are rodent full texts. The single cell-level
  measurement on the pathway remains mouse and remains NPR3 rather than NPR2.'
species_basis:
- human
- rat
- mouse
translation_risk: moderate
translation_risk_reason: 'The linearity, the segment proportionality and the phenotype census are all
  human, which is unusually strong for this atlas. What does not transfer is the mapping from lifelong
  germline activity to a months-long pharmacological exposure at a late bone age, and the mechanism
  underneath remains unassigned to any term.'
confidence: B
claim_grades:
- claim: the human NPR2 activity-to-height relationship is near-linear across the characterised range
    with no ceiling at the gain-of-function end
  grade: B
  basis: 245 functionally characterised variants against standing height in UK Biobank, R-squared 0.438,
    p = 5.8e-10, additive with polygenic background; linear in an in vitro activity score rather than in
    drug dose, and the gain-of-function end rests on 14 variants
- claim: a CNP-axis agent grows the body segments proportionately
  grade: B
  basis: 4 randomised trials, n = 326, I-squared 0 on the segment ratio; achondroplasia only, short-term,
    and one observational cohort disagrees on one of two proportion measures
- claim: the CNP-axis velocity gain is larger in older children rather than younger
  grade: C
  basis: a subgroup analysis inside a meta-analysis, P = 0.01 for the difference, I-squared 0 in both
    strata; a subgroup finding is hypothesis-generating and the cut is at age five, nowhere near the
    case
- claim: constitutive CNP-axis activation diverts growth into the digits
  grade: C
  basis: four of six human reports, but these families are ascertained and diagnosed partly on that
    feature, so the count is inflated by design
- claim: constitutive CNP-axis activation is associated with scoliosis
  grade: D
  basis: three of six reports, one of them three siblings from a single family; case reports with no
    denominator, and absence of mention is not exclusion
- claim: no terminal cell height has been measured under any CNP-axis agent in any species
  grade: A
  basis: full texts obtained and exhaustively searched for hirota2018 and nakao2015, the two candidate
    sources; agoston2007 reports a zone; weber2025's cell measurement is NPR3 loss, not NPR2 agonism
- claim: a growth plate zone height can be decomposed into cells per column times cell height
  grade: X
  basis: FALSE AS STATED IN CORR-189 AND CORRECTED HERE. nakao2015 shows the extracellular space of the
    non-hypertrophic layer changing greatly under CNP-axis loss, so matrix is a third term and the CNP
    axis moves it
