contradicts:
- 'REFINES CORR-189, WHICH THIS ATLAS WROTE. The rule said a zone height is cells per column times cell
  height, and used it to forbid term assignments from zone measurements. nakao2015 shows the rule is
  incomplete - the extracellular spaces of the non-hypertrophic layer change greatly under CNP-axis loss,
  so a zone height is cells per column times cell height PLUS MATRIX. The prohibition stands and gets
  stronger; the decomposition it implied was wrong. Logged as CORR-197.'
- 'SEPARATES FROM ROUND 202 RATHER THAN CONTRADICTING IT. Round 202 found h_term saturating against
  somatotropic drive. This round finds the CNP axis near-linear in humans. Those are different axes and
  different endpoints - h_term against pool consumption in one case, standing height against receptor
  activity in the other - so they can both be true, and together they say the two arms of the stack
  should be dosed by opposite logic. What would reconcile or break them is a terminal cell height
  measurement under a CNP agent, which does not exist.'
- 'QUALIFIES THE CLEAN-TARGET READING OF THE PheWAS. jeong2026 finding NPR2 activity associated only with
  height is a strong result at the mild end of the activity range and is silent about the constitutive
  end, where four of six human reports show digital overgrowth and three of six show scoliosis. Quoting
  the PheWAS as evidence that strong pharmacological activation is phenotypically clean would be an
  extrapolation past the data.'
