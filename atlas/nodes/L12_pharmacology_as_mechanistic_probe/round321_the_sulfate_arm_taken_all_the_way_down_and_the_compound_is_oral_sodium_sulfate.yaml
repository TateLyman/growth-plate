type: hypothesis
layer: L12
stub: false
summary: "ZERO - WHAT ROUND 320 GOT RIGHT AND WHAT IT GOT WRONG. Round 320 established that the sulfate arm\nwas\
  \ killed on the wrong transporters (SLC13A1/SLC26A1 are RENAL; the cartilage one is SLC26A2, present at\n118 CPM\
  \ in up to 82% of cells) and nominated **N-acetylcysteine**. The target work stands. **The agent was\nthe wrong\
  \ choice**, because NAC's only human demonstration is INTRAVENOUS, in a patient with complete\ntransporter loss\
  \ - restoration in a deficit, CORR-203 - and oral NAC has low, variable bioavailability plus a\nbroad antioxidant\
  \ confound. There is a better agent with a cleaner human experiment.\n\nONE - ⭐⭐ THE COMPOUND: ORAL SODIUM SULFATE.\
  \ AND THE EXPERIMENT IS IN HEALTHY, REPLETE ADULTS.\n`morris1983` (Clinical Pharmacology and Therapeutics), 8\
  \ healthy adults (6 men, 2 women, 26-35 y), four-way\ncrossover, occasions at least 4 days apart, single oral\
  \ doses in aqueous solution, serum at 2 h:\n| arm | serum inorganic sulfate | change |\n|---|---|---|\n| **control**\
  \ | **0.410 +/- 0.043 mM** | - |\n| **sodium sulfate decahydrate 9 g** | **0.513 +/- 0.055 mM** | **+25%, P<0.001**\
  \ |\n| **acetaminophen 1.5 g** | **0.311 +/- 0.043 mM** | **-24%, P<0.001** |\n| ascorbic acid 6 g | 0.417 +/-\
  \ 0.059 mM | unchanged |\nUrinary inorganic sulfate excretion fell after acetaminophen and rose after sodium sulfate;\
  \ creatinine\nclearance was unaffected by all treatments.\n⭐ **THIS IS ELEVATION IN REPLETE HUMANS, NOT RESTORATION\
  \ IN A DEFICIT.** It is the single thing round 320\nwas missing and it directly answers the objection round 320\
  \ raised against itself.\n⭐ **AND ~80% OF AN ORAL SULFATE DOSE IS ABSORBED**, by a sodium-dependent active transport\
  \ mechanism\noperating throughout the gastrointestinal tract (Dietary Reference Intakes, sulfate chapter).\n\n\
  TWO - ⭐ THE MECHANISM IS NOW CONFIRMED BY THE FIELD'S OWN REVIEW, AND IT DEMOLISHES MY MAIN OBJECTION.\nRound\
  \ 320 hedged: \"chondrocytes have a second sulfate source in cysteine catabolism, so supply may already be\nsaturated.\"\
  \ `paganini2020` (Superti-Furga and Rossi, a review of skeletal dysplasias caused by sulfation\ndefects) states\
  \ the opposite plainly: **\"In chondrocytes, THE MAIN SULFATE SOURCE IS THE EXTRACELLULAR\nSPACE, then sulfate\
  \ is taken up and activated in the cytosol to the universal sulfate donor to be used in\nsulfotransferase reactions.\"\
  **\n=> The chain is: **plasma sulfate -> SLC26A2 -> PAPS (PAPSS1/2) -> sulfotransferases (CHST3/CHST11/UST) ->\n\
  sulfated aggrecan GAG -> fixed charge density -> osmotic swelling -> h_term.** Round 320 showed every step of\n\
  that chain is present and abundant in postnatal human growth plate, with SLC26A2 at 118 CPM in up to 82% of\n\
  cells and PAPSS2 at 530 CPM in up to 94%. **The first link in the chain is the one that oral sodium sulfate\n\
  demonstrably moves.**\n\nTHREE - ⛔⛔ A NEW, QUANTIFIED, COMMON CONTRAINDICATION: **PARACETAMOL / ACETAMINOPHEN.**\n\
  A single **1.5 g dose - three ordinary 500 mg tablets - dropped serum inorganic sulfate by 24%, P<0.001.**\nParacetamol\
  \ is cleared substantially by sulfate conjugation, and that conjugation draws on the same\ncirculating inorganic\
  \ sulfate pool chondrocytes take up through SLC26A2.\n· `li2021_sulfation` makes the reserve explicit: sulfation's importance\
  \ in paracetamol handling \"is often\n  underestimated\", **patients with LOW SULFATE RESERVES are at higher risk**,\
  \ and **serum inorganic sulfate\n  should be considered a biomarker** - it is a real, depletable, measurable pool.\n\
  · ⭐ **This is a free subtraction and it is not in this atlas.** Round 316's audit flagged NSAIDs on a grade-E\n\
  \  cAMP argument; **paracetamol is not an NSAID and was never named**, and its evidence here is far stronger -\n\
  \  a direct, quantified, human, placebo-controlled-by-crossover depletion of the exact substrate.\n✓ **AND A CORRECTION\
  \ TO MY OWN SPECULATION: ASCORBIC ACID 6 g DID NOT DEPLETE SULFATE** (0.417 vs 0.410\ncontrol). I had reasoned\
  \ that megadose vitamin C might drain the sulfate pool. It does not. **The megadose\nvitamin C contraindication\
  \ stands only on the TET/dioxygenase argument (R302) and gains nothing here.**\n\nFOUR - ⭐ THE COMPOUND COMPARISON,\
  \ RUN PROPERLY.\n| agent | raises human plasma inorganic sulfate? | ceiling / liability | verdict |\n|---|---|---|---|\n\
  | **SODIUM SULFATE (oral)** | **YES - +25%, n=8 healthy adults, P<0.001** | **osmotic laxative**; renal reabsorption\
  \ saturable | **the evidence winner** |\n| magnesium sulfate (Epsom) | same anion, same class | laxative + magnesium\
  \ load | equivalent, no separate data |\n| **MSM** | **NOT demonstrated for INORGANIC sulfate.** 35S-MSM is rapidly\
  \ and efficiently absorbed (tmax 2.1 h) and its sulfur appears in protein fractions, but the authors could not\
  \ say whether that was via methionine/cysteine incorporation or post-translational sulfation | non-laxative, well\
  \ tolerated | plausible, unproven on the biomarker; has separate MSC chondrogenic effects |\n| **NAC** | IV only,\
  \ in a transporter-null patient | low/variable oral bioavailability; broad antioxidant confound | round 320's\
  \ pick, and second-best |\n| glucosamine sulfate | sulfate salt; contribution unquantified | - | not assessable\
  \ |\n=> **If the goal is to move the measured variable that human genetics ties to height, sodium sulfate is the\n\
  only agent with a direct human demonstration of doing so in normal people.**\n\nFIVE - THE DOSE, AND ITS CEILING,\
  \ WHICH IS PHYSIOLOGICALLY DEFINED RATHER THAN GUESSED.\n· **Renal tubular reabsorption of inorganic sulfate is\
  \ CAPACITY LIMITED** - the reabsorbed fraction falls as\n  filtered load rises (r = -0.54, P<0.005) - and the\
  \ authors note this **saturable reabsorption facilitates\n  sulfate homeostasis**. So plasma sulfate PLATEAUS:\
  \ past a point, extra dose spills into urine. There is a\n  ceiling and it is built into the physiology.\n· **The\
  \ dose-limiting toxicity is osmotic diarrhoea.** Sodium sulfate is an osmotic laxative and a bowel-prep\n  ingredient.\
  \ The DRI chapter puts increased diarrhoea risk above roughly **600 mg/L in drinking water**,\n  with wide individual\
  \ variation. **9 g of the decahydrate is about 2.7 g of sulfate ion, against a normal\n  total daily sulfate throughput\
  \ of roughly 3.3-5.6 g from all sources** - so the tested dose is a large\n  acute addition and would very likely\
  \ be laxative as a single bolus. **Divided dosing is the obvious\n  mitigation and has not been tested for this\
  \ purpose.**\n· **No Tolerable Upper Intake Level exists** - the DRI panel found insufficient information to set\
  \ one.\n\nSIX - ⛔ THE STRONGEST ARGUMENT AGAINST, STATED FAIRLY BECAUSE IT IS OFFICIAL.\nThe Dietary Reference\
  \ Intakes conclude that **\"sulfate requirements are thus met when intakes include\nrecommended levels of sulfur\
  \ amino acids\"**, and set no RDA, no Adequate Intake and no UL, on the view that\nadequate protein supplies enough\
  \ sulfate for glycosaminoglycan synthesis and normal growth. **If that is\nright for a well-fed adolescent, a\
  \ donor adds nothing.**\n✓ **The counter, and it is the reason this arm is alive at all:** `scherer2025`'s allelic\
  \ series shows\n**GRADED effects on plasma sulfate AND on human height in HETEROZYGOTES** - a dose-response inside\
  \ the\nordinary, sub-clinical range. If sulfate were simply non-limiting above a deficiency threshold, a modest\n\
  heterozygous reduction in plasma sulfate should not track height. It does. **The DRI position is about\navoiding\
  \ deficiency; it does not address whether more than adequate helps, which is precisely the open\nquestion.**\n\
  ⚠ Note also `long2025`: a PAPSS2-null boy on growth hormone improved from **-5.02 SD to -3.87 SD over 2 years\n\
  3 months** - GH works partially through a broken sulfation pathway but leaves a severe residual floor. That\n\
  says sulfation capacity is a constraint GH does not bypass, which is relevant to a subject already on GH.\n\n\
  SEVEN - WHAT IS STILL MISSING, AND IT IS THE SAME ONE ITEM.\n**NOBODY HAS GIVEN A SULFATE DONOR TO A NORMAL GROWING\
  \ ANIMAL AND MEASURED A BONE.** Round 296 said it, round\n320 said it, and it is still true. The intermediate\
  \ step is also unmeasured: no experiment shows that raising\nplasma sulfate ABOVE normal increases cartilage proteoglycan\
  \ sulfation in a normal animal. Everything\nupstream of that is now in place - the transporter is present and\
  \ abundant, the main chondrocyte source is\nextracellular, human genetics grade plasma sulfate against height,\
  \ and an oral agent moves plasma sulfate 25%\nin healthy people. **The experiment is a low-sulfate versus normal\
  \ versus supplemented growing rodent, 35S\nincorporation into cartilage proteoglycan, and a caliper on the femur\
  \ and the vertebral column. It is the\ncheapest unrun experiment in this entire file.**"
human_evidence: direct
human_evidence_note: 'The pharmacology is human and in HEALTHY subjects: 8 replete adults, four-way crossover, oral
  dosing, with serum inorganic sulfate up 25% on sodium sulfate and down 24% on paracetamol, both P<0.001. The genetics
  are human and graded (scherer2025 heterozygous allelic series on plasma sulfate and height; tise2025 biallelic
  loss with short stature and scoliosis). The expression data are human, 14 postnatal growth-plate samples. The
  mechanistic statement that chondrocytes draw sulfate mainly from the extracellular space is from a review of the
  human dysplasia class. What remains non-human and, in fact, non-existent is any length endpoint under a sulfate
  donor in any species.'
species_basis: human
translation_risk: moderate
translation_risk_reason: 'MODERATE, and lower than round 320''s because the key pharmacodynamic step is now demonstrated
  in healthy humans rather than in a transporter-null patient by the intravenous route. The residual risk sits in
  two places: whether a 25% rise in plasma sulfate translates into increased cartilage proteoglycan sulfation in
  someone already replete, and whether increased sulfation translates into length. Neither has been measured in
  any species. The Dietary Reference Intakes position - that adequate protein meets sulfate requirements - is the
  informed prior against, and it is only challenged, not overturned, by the graded heterozygous genetics.'
confidence: C
confidence_reason: 'Graded C overall, with components differing sharply. The human pharmacology is A - a four-way
  crossover in healthy adults with P<0.001 in both directions and an internal negative control (ascorbic acid) that
  did not move. The mechanistic chain is A, being the field review''s own statement plus the atlas''s own expression
  data. The paracetamol contraindication is B, resting on a single well-designed acute study extrapolated to chronic
  use. The claim that a sulfate donor adds HEIGHT remains C at best: no length endpoint exists in any species, the
  intermediate sulfation step is unmeasured in a replete animal, and the official nutritional position is that sulfate
  is not limiting on an adequate-protein diet.'
limitations: No sulfate donor has a bone-length endpoint in any species, and no experiment shows that raising plasma
  sulfate above normal increases cartilage proteoglycan sulfation in a normal animal - the two missing links are
  consecutive and neither is addressed here. Morris and Levy is n=8, single acute doses, serum sampled at one time
  point (2 h), in adults aged 26-35 rather than adolescents, and it measures serum sulfate rather than anything
  skeletal. The paracetamol depletion is likewise acute and single-dose; chronic-use effects on the sulfate pool
  and on cartilage are not measured. The effective dose of sodium sulfate is very likely osmotically laxative as
  a bolus and divided dosing is untested for this purpose. No Tolerable Upper Intake Level exists for sulfate. MSM's
  effect on inorganic sulfate is not demonstrated, so the non-laxative alternative is unproven on the biomarker.
  scherer2025's effect size for plasma sulfate on height has not been extracted here, so the round cannot say how
  many centimetres a 25% rise might correspond to - that supplementary table is the single most useful thing still
  to obtain.
