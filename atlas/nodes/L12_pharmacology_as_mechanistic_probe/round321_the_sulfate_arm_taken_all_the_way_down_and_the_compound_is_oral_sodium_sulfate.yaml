claim_grades:
- claim: An obtainable oral agent raises plasma inorganic sulfate in healthy, replete humans.
  grade: A
  species: human
  source_ref: morris1983
  basis: 9 g of sodium sulfate decahydrate, orally, raised serum inorganic sulfate from 0.410 +/- 0.043 mM to 0.513
    +/- 0.055 mM at 2 hours, P<0.001, in 8 HEALTHY adults in a four-way crossover, with urinary sulfate excretion
    rising in parallel and creatinine clearance unaffected. The study carries its own internal negative control
    - ascorbic acid did not move sulfate - and its own positive control in the opposite direction - paracetamol
    lowered it. More than 80% of an oral sulfate dose is absorbed by sodium-dependent active transport. This is
    ELEVATION IN REPLETE PEOPLE and it is exactly what round 320 lacked, since NAC's only human demonstration was
    intravenous in a transporter-null patient.
- claim: N-acetylcysteine is the best agent on this axis, as round 320 proposed.
  grade: X
  species: human
  source_ref: morris1983
  basis: NO - sodium sulfate is better on every count that matters. NAC's human demonstration is INTRAVENOUS and
    in a patient with complete renal sulfate wasting, so it is restoration in a deficit (CORR-203); oral NAC has
    low and variable bioavailability; and NAC is simultaneously a glutathione precursor and broad antioxidant, so
    any effect could not be attributed to sulfate without measuring it. Sodium sulfate has a direct oral demonstration
    in healthy replete adults with a quantified 25% rise. Round 320's target work stands; its choice of agent does
    not.
- claim: Chondrocytes make enough of their own sulfate, so supply cannot be limiting.
  grade: X
  species: human
  source_ref: paganini2020
  basis: NO, and this was round 320's own stated hedge. The field's review of sulfation-defect dysplasias states
    that in chondrocytes THE MAIN SULFATE SOURCE IS THE EXTRACELLULAR SPACE, from which sulfate is taken up and
    then activated in the cytosol to the universal donor for sulfotransferase reactions. That makes plasma sulfate
    the head of the chain rather than a redundant input, and round 320 showed every downstream step is present and
    abundant in postnatal human growth plate - SLC26A2 at 118 CPM in up to 82% of cells, PAPSS2 at 530 CPM in up
    to 94%.
- claim: Paracetamol is neutral for this goal.
  grade: X
  species: human
  source_ref: morris1983
  basis: 'NO. A single 1.5 g dose - three ordinary 500 mg tablets - lowered serum inorganic sulfate from 0.410 to
    0.311 mM, a 24% fall at P<0.001, with urinary sulfate excretion falling in parallel because the pool is being
    consumed by sulfate conjugation of the drug. li2021 makes the same point from the toxicity side: sulfation is
    underestimated in paracetamol handling, patients with low sulfate reserves are at higher risk, and serum inorganic
    sulfate should be treated as a biomarker. Since chondrocytes draw their sulfate mainly from that circulating
    pool, regular paracetamol is a plausible and quantified drain on the substrate for cartilage proteoglycan sulfation.
    GRADE X for ''neutral''; the positive claim that it costs height is unproven, and the depletion data are acute
    rather than chronic.'
- claim: A sulfate donor will add height in this subject.
  grade: C
  species: human
  source_ref: scherer2025
  basis: 'NOT ESTABLISHED, and two consecutive links are missing: no experiment shows that raising plasma sulfate
    above normal increases cartilage proteoglycan sulfation in a replete animal, and no sulfate donor has a bone-length
    endpoint in any species. The informed prior against is official - the Dietary Reference Intakes concluded that
    sulfate requirements are met when intakes include recommended levels of sulfur amino acids, and set no RDA and
    no UL. What keeps the arm alive is scherer2025''s GRADED effect on plasma sulfate AND height in HETEROZYGOTES,
    which places the dose-response inside the ordinary range rather than only at a deficiency threshold. Everything
    upstream is now in place; the experiment that would settle it is a growing rodent on graded sulfate with 35S
    incorporation into cartilage proteoglycan and a caliper on the femur and spine.'
key_refs:
- ref_id: morris1983
  year: 1983
  type: primary
  one_line_finding: 'THE HUMAN PHARMACOLOGY, IN HEALTHY REPLETE ADULTS. 8 subjects, four-way crossover: oral sodium
    sulfate decahydrate 9 g raised serum inorganic sulfate 0.410 to 0.513 mM (+25%, P<0.001); acetaminophen 1.5
    g LOWERED it to 0.311 mM (-24%, P<0.001); ascorbic acid 6 g did nothing; renal tubular reabsorption is capacity
    limited (r=-0.54, P<0.005)'
- ref_id: paganini2020
