id: round321_the_sulfate_arm_taken_all_the_way_down_and_the_compound_is_oral_sodium_sulfate
name: 'ROUND 321 - the sulfate arm taken all the way down. The compound is ORAL SODIUM SULFATE, not NAC: 9 g raised
  serum inorganic sulfate 25% in EIGHT HEALTHY ADULTS, which is elevation in replete humans and answers CORR-203
  directly. The authoritative review confirms chondrocytes draw their sulfate mainly from the EXTRACELLULAR space.
  And a single ordinary 1.5 g dose of PARACETAMOL drops serum sulfate 24%'
