contradicts: This round REVISES round 320's choice of agent from N-acetylcysteine to ORAL SODIUM SULFATE, because
  sodium sulfate has a direct human demonstration of raising serum inorganic sulfate 25% in HEALTHY REPLETE adults
  while NAC's is intravenous in a transporter-null patient. Round 320's target work - that round 295 killed the
  arm on the renal rather than the cartilage transporter - stands unchanged. It also REMOVES round 320's own main
  hedge, since the field review states that chondrocytes draw sulfate mainly from the extracellular space rather
  than from cysteine catabolism. It ADDS a quantified contraindication the atlas has never named - paracetamol,
  24% depletion at an ordinary dose - and CORRECTS my own speculation that megadose vitamin C might drain the pool,
  which the same experiment shows it does not.
