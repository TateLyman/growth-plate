id: round212_the_erda_ceiling_is_time_and_tyra_already_cleared_the_dose
name: ROUND 212 - erdafitinib's ceiling is 1.29-fold of dose and about 7 cm of time, its dose gate is an
  FGFR1 toxicity, and TYRA-300 has ALREADY been dosed past it in humans with no gate and no MTD
type: hypothesis
layer: L12
aliases:
- the erdafitinib ceiling
- can TYRA-300 be pushed past erdafitinib
- the phosphate gate
- round 212
stub: false
summary: 'ROUND 210 SAID "THE DECISIVE UNKNOWN IS DOSE, NOT MOLECULE" AND STOPPED. That was a framing, not
  an answer. This round computes both ceilings from held data.

  ERDAFITINIB''S DOSE CEILING IS 1.29-FOLD AND IT IS GATED BY THE WRONG RECEPTOR. Every human growth
  response on record was obtained BELOW the label starting dose - 3 mg, 5 mg and 7 mg against a label of 8
  up-titrated to 9. Using the population PK (CL/F 0.362 L/h, 99.7 per cent bound to alpha-1-acid
  glycoprotein, MW 446.5, linear 0.5 to 12 mg), steady-state average FREE concentration runs 2.32 nM at 3
  mg to 6.96 nM at the 9 mg label maximum. The index child took 7 mg, which is 5.41 nM free. SO THE ENTIRE
  THEORETICAL HEADROOM ABOVE WHAT HE ACTUALLY RECEIVED IS 1.29-FOLD - and it is unreachable, because the
  label''s up-titration from 8 to 9 mg is triggered by SERUM PHOSPHATE, an FGFR1 effect, in a child who was
  already having FREQUENT INTERRUPTIONS FOR HYPERPHOSPHATAEMIA at 7 mg. Hyperphosphataemia affects more
  than 70 per cent of erdafitinib patients and FGFR1 is the renal receptor that sets phosphate
  reabsorption. ERDAFITINIB''S DOSE IS TITRATED TO, AND CAPPED BY, A RECEPTOR THAT IS NOT THE GROWTH TARGET.

  AND NOBODY HAS SHOWN THAT ANY TOLERATED DOSE SATURATES THE GROWTH TARGET. The only pharmacodynamic
  anchor in existence is erdachild2024''s experiment in the patient''s OWN serum-starved fibroblasts, where
  100 nM erdafitinib maximally suppressed phospho-ERK1/2 and phospho-AKT with no further reduction at 200
  or 300 nM. NOTHING BELOW 100 nM WAS TESTED. That bounds the saturating concentration from above and says
  nothing about where the curve turns over. The 9 mg free plasma concentration is about 14-fold below it,
  though the comparison is not clean - serum-starved culture is nearly all free drug while plasma is 99.7
  per cent bound, and cartilage penetration is unmeasured for this drug in any species. THE HONEST
  STATEMENT IS THAT THE CONCENTRATION-RESPONSE WAS NEVER MAPPED, so "erdafitinib was already at its
  pharmacodynamic ceiling" is unsupported in both directions.

  THE CEILING THAT ACTUALLY BINDS IS TIME. At the best observed velocity of 19.07 cm/year, and the FDA
  postmarketing time-to-onset distribution of 84, 137 and 274 days, erdafitinib delivers 4.38 cm at the
  earliest onset, 7.15 cm at the median and 14.30 cm at the latest - and the 274-day figure IS the index
  case, so it is the observed maximum rather than a projection. ALL FIVE CASES DISCONTINUED PERMANENTLY
  AND THREE REQUIRED SURGERY. That is before subtracting the spine lost to kyphoscoliosis, and a spinal
  fusion ends spinal growth permanently, which turns a yield gain into a yield loss. ERDAFITINIB''S CEILING
  IS ABOUT 7 cm MEDIAN AND 14 cm AT BEST, AND IT IS A CLOCK, NOT A DOSE.

  THE VELOCITY DOES APPEAR TO BECOME ADULT HEIGHT, WHICH IS THE PERMISSION THE ROUND-198 FRAMEWORK
  REQUIRES. Round 198 makes fusion the exhaustion of proliferative potential, so a drug that only
  accelerates consumption adds nothing. Three human observations say FGFR3 inhibition is not that drug -
  toydemir2006''s CATSHL kindred, lifelong heterozygous partial FGFR3 loss, gives an ADULT male height mean
  of 195.6 cm, about +2.8 SD, above the 97th centile in five of five men; propel3_2026, randomised and
  placebo-controlled, n = 74 against 39, reports NO accelerated progression of bone age at 52 weeks under
  oral infigratinib; and erdaseries2025 describes physeal widening WITHOUT progression of bone maturation,
  though that patient had unmeasurable sex steroid which holds bone age still by itself.

  NOW THE QUESTION THE USER ASKED. CAN TYRA-300 BE DOSED PAST ERDAFITINIB? YES, AND IT ALREADY HAS BEEN.
  The bridge does not need PK, because both drugs'' FGFR3 engagement in a human can be read off tumour
  response in an FGFR3-DRIVEN tumour - same target, same disease, same criterion. Erdafitinib: overall
  response rate 35.3 per cent, serious AE rate 41 per cent, dose interruption in 68 per cent, reduction in
  53 per cent, permanent discontinuation in 21 per cent. TYRA-300 in SURF301: dose range 10 to 120 mg once
  daily explored, dosages THROUGH 100 mg cleared, 120 mg administered, MTD NOT ESTABLISHED, and SIX
  CONFIRMED PARTIAL RESPONSES IN ELEVEN (54.5 PER CENT) FGFR3-ALTERED PATIENTS AT 90 mg OR ABOVE, with a
  very low frequency of grade 3 treatment-related AEs and none in the three detailed cases. The two dose
  reductions in those cases were for grade 2 neuropathy and grade 2 AST - NEITHER was hyperphosphataemia.
  Cellular IC50 at FGFR3 is 9 to 17 nmol/L across three bladder lines, potency in FGFR3-driven lines is
  stated to be similar to the pan-FGFR inhibitors, and head to head in the UM-UC-14 xenograft dabogratinib
  gave slightly MORE regression than erdafitinib.

  AND THE GROWTH DOSE IS AN ONCOLOGY DOSE, WHICH IS WHY THE GATE MATTERS. In wild-type mice TYRA-300
  raised naso-anal length significantly ONLY at 14 mg/kg and raised tibia and femur dose-dependently at 12
  and 14 mg/kg, against an 18 mg/kg oncology dose giving 96 per cent tumour growth inhibition. The authors
  chose 8 to 14 mg/kg deliberately BELOW the oncology dose as more appropriate for long-term paediatric
  use, and THE CURVE HAD NOT TURNED OVER AT THE TOP OF WHAT THEY TESTED. Infigratinib makes the same point
  from the other end - 0.25 mg/kg/day, a fraction of its oncology dose and chosen for tolerability, buys
  +1.74 cm/year, about a ninth of erdafitinib''s velocity at near-oncology exposure. THE FGFR GROWTH EFFECT
  IS STEEPLY DOSE-DEPENDENT AND NOBODY HAS TOPPED IT OUT IN ANY SPECIES.

  THE COUNTERARGUMENT, AND IT IS THE ATLAS''S OWN. SCOLIOSIS IS IN THE NAME OF THE FGFR3 SYNDROME. The
  NPR3 biallelic patient needed spinal fusion at 12 for a 39-degree Cobb angle; the NPR2 activating family
  had severe scoliosis with vertebral fractures. EVERY ROUTE TO EXTREME ENDOCHONDRAL GROWTH PRODUCES SPINAL
  DEFORMITY, FGFR and CNP alike, genetic and pharmacological alike. If the deformity is intrinsic to
  driving a physis rather than to FGFR1, then FGFR3-selectivity buys DOSE and does not buy TIME, TYRA-300
  hits the same wall at a higher dose, and the ceiling is the same 7 cm. One piece of evidence leans the
  other way - in the achondroplasia mouse TYRA-300 INCREASED femoral metaphyseal bone mineral density and
  bone volume to tissue volume ratio, the opposite of the weakening that produces slipped capital femoral
  epiphysis - but that is a dysplasia model, not a normal one, and mice do not fuse.

  THE VERDICT. Erdafitinib is finished as a candidate: 1.29-fold of unreachable dose headroom, a median 7
  cm before forced discontinuation, and a gate on the wrong receptor. TYRA-300 is the molecule, and the
  reason is not safety - it is that removing the phosphate gate removes the thing that capped the dose, and
  the growth effect is still climbing at the top of every dose range anyone has tested. WHAT IS NOT
  SETTLED IS WHETHER THAT BUYS TIME AS WELL AS DOSE, and TYRA-300 has never been given to a child.'
quantitative:
- parameter: erdafitinib steady-state free plasma concentration at every dose that has grown a human
  value: 3 mg gives 345 ng/mL total and 2.32 nM free; 5 mg 576 ng/mL and 3.87 nM; 7 mg 806 ng/mL and 5.41
    nM; 8 mg 921 ng/mL and 6.19 nM; 9 mg 1036 ng/mL and 6.96 nM. Headroom above the 7 mg the index child
    received is 1.29-fold
  unit: ng/mL total and nmol/L free, steady state average
  conditions: computed as Dose/(CL/F x 24 h) from zhu2026's population PK - CL/F 0.362 L/h, effective
    half-life 59 h, protein binding 99.7 per cent primarily to alpha-1-acid glycoprotein, dose-proportional
    0.5 to 12 mg - with MW 446.5 from PubChem CID 67462786
  species: human
  source_ref: zhu2026
  uncertainty: 'THIS ATLAS''S ARITHMETIC ON PUBLISHED POPULATION PARAMETERS, not a measured concentration in
    any of the three children. It uses adult population clearance for adolescents, assumes the 99.7 per cent
    binding figure applies at these concentrations, and ignores CYP2C9 polymorphism which the atlas already
    notes makes exposure vary. The RATIO, 1.29-fold, is robust to all of these because they cancel'
  value_unverified: true
- parameter: the erdafitinib dose gate is an FGFR1 toxicity
  value: the label starting dose is 8 mg once daily with permissible increase to 9 mg AT DAY 14 TO 21 BASED
    ON SERUM PHOSPHATE and tolerability; hyperphosphataemia affects MORE THAN 70 PER CENT of erdafitinib
    patients; FGFR1 is expressed in kidney cells where it regulates phosphate and calcium reabsorption and
    its inhibition causes the hyperphosphataemia; and the index child's 7 mg period ran WITH FREQUENT
    INTERRUPTIONS FOR HYPERPHOSPHATAEMIA
  unit: mg, per cent of patients, and the titration rule
  conditions: BALVERSA label as quoted in zhu2026; mechanism and incidence from dabogratinib2026;
    interruption history from erdachild2024 via erdaseries2025's dose table
  species: human
  source_ref: dabogratinib2026
  uncertainty: 'THE STRUCTURAL POINT OF THE ROUND. The molecule''s dose is titrated to a pharmacodynamic
    marker of the OFF-TARGET receptor and capped by that receptor''s toxicity. AGAINST OVERREADING - the
    label also permits reduction for general tolerability, so phosphate is not the only constraint, and no
    paper states that phosphate specifically prevented escalation in these three children'
- parameter: erdafitinib's time ceiling converted to centimetres
  value: at 19.07 cm/year, the FDA time-to-onset distribution of 84, 137 and 274 days yields 4.38, 7.15 and
    14.30 cm; all five cases permanently discontinued and three required surgical correction
  unit: cm accrued before forced discontinuation
  conditions: velocity from erdachild2024 (14.3 cm in 9 months); time-to-onset from nadeaunguyen2026, FDA
    postmarketing review of five paediatric cases
  species: human
  source_ref: nadeaunguyen2026
  uncertainty: 'THE 274-DAY FIGURE IS THE INDEX CASE ITSELF, so 14.30 cm is an observed maximum rather than
    a projection and the arithmetic is a consistency check at that end. FAERS has no denominator so the
    time-to-onset distribution is from reported cases only and may be biased toward severe presentations.
    The centimetres are GROSS - no study reports how much spine was lost to the kyphoscoliosis that
    developed alongside'
  value_unverified: true
- parameter: TYRA-300 has already been dosed past erdafitinib in humans on an FGFR3 pharmacodynamic readout
  value: dose range 10 to 120 mg once daily plus 40 and 50 mg twice daily explored; dosages THROUGH 100 mg
    once daily cleared; 120 mg administered; MTD NOT ESTABLISHED; six confirmed partial responses in eleven
    (54.5 per cent) FGFR3-altered efficacy-evaluable mUC patients at 90 mg or above, with a very low
    frequency of grade 3 treatment-related AEs, against erdafitinib's 35.3 per cent overall response rate
    with 41 per cent serious AEs, 68 per cent dose interruption, 53 per cent reduction and 21 per cent
    permanent discontinuation
  unit: mg, per cent response, per cent toxicity
  conditions: dabogratinib2026, SURF301 phase I/II (NCT05544552) against the erdafitinib registrational
    figures the same paper cites
  species: human
  source_ref: dabogratinib2026
  uncertainty: 'A CROSS-TRIAL COMPARISON, and that is its main weakness - different studies, different
    populations, an n of 11 against a registrational cohort, prior FGFR-inhibitor exposure permitted in
    SURF301, and response rate is a downstream readout of target engagement rather than a measurement of
    it. WHAT IT DOES ESTABLISH is that at 90 mg and above TYRA-300 delivers FGFR3-driven tumour regression
    at a rate at least matching erdafitinib''s, without the phosphate gate and without having found its
    maximum tolerated dose'
- parameter: the growth-effective dose of an FGFR3 inhibitor is an oncology dose
  value: in wild-type mice naso-anal length rose significantly ONLY at 14 mg/kg once daily (+7.3 per cent)
    and tibia and femur rose significantly and dose-dependently at 12 AND 14 mg/kg, across a tested range
    of 8 to 14 mg/kg chosen deliberately below the 18 mg/kg oncology dose that gives 96 per cent tumour
    growth inhibition. THE CURVE HAD NOT TURNED OVER AT THE TOP OF THE RANGE TESTED and 18 mg/kg was never
    tested for growth
  unit: mg/kg/day and per cent length change
  conditions: tyra300_2025, C57BL/6J wild-type mice dosed orally once daily from 4 to 8 weeks of age;
    oncology dose-response from dabogratinib2026's UM-UC-14 xenograft
  species: mouse
  source_ref: tyra300_2025
  uncertainty: 'THE SINGLE MOST DECISION-RELEVANT NUMBER IN THIS ROUND - the growth dose is 67 to 78 per
    cent of the oncology dose and still climbing, so the FGFR3 growth effect is steeply dose-dependent and
    has never been topped out. Mouse, four weeks, and the top of the range was set by the sponsor''s
    judgement about paediatric tolerability rather than by an observed plateau or an observed toxicity'
- parameter: does FGFR3 inhibition raise ADULT height or only velocity
  value: CATSHL, lifelong heterozygous partial FGFR3 loss of function in a kindred with 27 affected - ADULT
    male height mean 195.6 cm, about +2.8 SD, above the 97th centile in five of five men. Under oral
    infigratinib in a randomised placebo-controlled phase 3, n = 74 against 39, NO accelerated progression
    of bone age at 52 weeks and no negative change in bone mineral density
  unit: cm and SD at adult height; bone age progression on treatment
  conditions: toydemir2006 for the kindred; propel3_2026 for the randomised bone age result
  species: human
  source_ref: toydemir2006
  uncertainty: 'THIS IS THE PERMISSION THE ROUND-198 FRAMEWORK REQUIRES - fusion is exhaustion, so a drug
    that only accelerates consumption adds nothing, and these say FGFR3 inhibition is not that drug. LIMITS
    - CATSHL is germline, partial, heterozygous and lifelong, and says nothing about a nine-month block at
    bone age 16; the infigratinib bone-age null is at a dose a fraction of oncology exposure and may not
    hold at the exposure this round is arguing for; and NO BASELINE BONE AGE EXISTS for the erdafitinib
    index case'
  value_unverified: true
localization:
- 'the kidney, where FGFR1 sets phosphate reabsorption and therefore sets erdafitinib''s dose'
- 'the growth plate chondrocyte, where FGFR3 sits and where neither drug''s local concentration has ever
  been measured in any species'
- 'the perichondrium and periosteum, where FGFR1 and FGFR2 sit and where the structural failure is
  hypothesised to originate'
human_evidence: direct
human_evidence_note: 'Both arms of the comparison are human. Erdafitinib''s PK, label, toxicity incidence,
  three growth responses and five toxicity cases are all human. TYRA-300''s dose range, clearance through
  100 mg, response rate and toxicity profile are human. What is NOT human for TYRA-300 is anything about
  growth - the entire growth case is mouse, and it has never been given to a child.'
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: 'The dose-attainment argument is solid and human on both sides. The inference that
  higher attainable dose converts into more retained height depends on two unproven links - that the FGFR3
  growth dose-response continues to climb into oncology exposure in a human, and that the physeal
  structural failure is FGFR1-mediated rather than intrinsic to the growth.'
confidence: C
claim_grades:
- claim: erdafitinib's dose headroom above the dose that produced 19 cm/year is about 1.29-fold
  grade: B
  basis: arithmetic on published population PK and the published label, with the ratio robust to the
    parameter assumptions because they cancel
- claim: erdafitinib's dose is gated by an FGFR1-mediated toxicity rather than by its growth target
  grade: B
  basis: the label titrates on serum phosphate, hyperphosphataemia affects more than 70 per cent of
    patients, FGFR1 is the renal receptor that sets phosphate handling, and the index child's high-dose
    period ran with frequent interruptions for exactly that
- claim: any tolerated erdafitinib dose saturates FGFR3 signalling in vivo
  grade: E
  basis: UNKNOWN IN BOTH DIRECTIONS. The only anchor tested 100, 200 and 300 nM in serum-starved culture
    and nothing below 100 nM, so the concentration-response was never mapped
- claim: erdafitinib's realistic ceiling is about 7 cm median and about 14 cm at best
  grade: C
  basis: one velocity from one child multiplied by a five-case FAERS time-to-onset distribution with no
    denominator; the upper bound is the index case itself so it is observed rather than projected
- claim: TYRA-300 can be dosed to at least erdafitinib-equivalent FGFR3 engagement in a human
  grade: B
  basis: 54.5 per cent confirmed partial response in FGFR3-altered mUC at 90 mg or above against
    erdafitinib's 35.3 per cent overall response rate, with dosing cleared through 100 mg, 120 mg
    administered and MTD not reached. Cross-trial, n = 11, and response rate is downstream of engagement
- claim: the FGFR3 growth dose-response has been topped out in any species
  grade: X
  basis: FALSE. The wild-type mouse curve was still climbing at 14 mg/kg, the 18 mg/kg oncology dose was
    never tested for growth, and every human growth response occurred below the label starting dose
- claim: FGFR3-selectivity extends the time on drug as well as the dose
  grade: E
  basis: THE UNRESOLVED HALF. Scoliosis appears on every route to extreme endochondral growth including
    purely genetic CNP-axis routes, so the deformity may be intrinsic to driving a physis. The only
    counter-evidence is increased metaphyseal bone mineral density and BV/TV under TYRA-300 in a
    dysplasia mouse
- claim: TYRA-300 has been given to a growing child
  grade: X
  basis: FALSE. SURF301 is an adult oncology study; the paediatric programme had not reported at the time
    of the sources held here
