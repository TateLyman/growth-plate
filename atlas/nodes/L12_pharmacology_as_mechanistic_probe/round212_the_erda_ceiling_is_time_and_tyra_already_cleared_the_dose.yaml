contradicts:
- 'ROUND 210''s closing line, "the decisive unknown is dose, not molecule." Half of it is now answered and
  the half that survives is different. For ERDAFITINIB the dose question is closed by the label - there is
  1.29-fold of headroom and it is gated by phosphate. For TYRA-300 the dose has already been cleared to a
  level erdafitinib cannot reach. THE DECISIVE UNKNOWN IS NOT DOSE, IT IS WHETHER THE CLOCK MOVES WITH IT.'
- 'ROUND 210''s implication that erdafitinib''s 19.06 cm/year represents oncology-scale exposure. It does
  not. It was obtained at 7 mg then 5 mg, both BELOW the 8 mg label starting dose, with interruptions.'
