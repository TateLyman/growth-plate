id: round208_restoration_is_not_elevation_and_the_two_arms_may_be_complementary
name: ROUND 208 - restoration is not elevation, GH has no demonstrated h_term effect above a normal
  baseline, no combination study measuring terminal cell height exists anywhere, and FGFR3 inhibition
  grows the sites the CNP axis misses
type: hypothesis
layer: L12
aliases:
- restoration versus elevation
- h_term baseline audit
- FGFR3 versus CNP by site
- the question ledger
- round 208
stub: false
summary: 'THE ADDITIVITY QUESTION WAS THE TOP UNMEASURED QUANTITY IN THE STACK AND WORKING IT PRODUCED
  THREE THINGS - A CORRECTION TO MY OWN ARITHMETIC, AN ENUMERATED NEGATIVE, AND A COMPARISON THAT MAY
  MATTER MORE THAN THE ORIGINAL QUESTION.

  FIRST THE CORRECTION, BECAUSE IT CHANGES WHAT THE QUESTION EVEN MEANS. Round 205 concluded that the
  whole observed range of terminal cell height across every agent in this atlas is about 1.0 to 1.4
  times, and used hunziker1994''s 1.36x for growth hormone alongside weber2025''s 1.20x for NPR3 loss as
  if they were the same kind of number. THEY ARE NOT. hunziker1994''s control is a HYPOPHYSECTOMISED rat.
  Its 1.36x is a deficiency correction, and it does not even reach the intact animal''s 29.8 micrometres
  - GH-treated hypophysectomised rats sit at 26.5. THE SUBJECT OF THIS PROGRAMME IS NOT GROWTH HORMONE
  DEFICIENT, so every restoration number is inadmissible as a prediction for them.

  SORTED BY BASELINE THE PICTURE IS DIFFERENT AND MORE USEFUL. RESTORATION, up to 1.53x, is what
  returning a deficient plate to normal buys. ELEVATION - pushing a NORMAL plate above its own baseline -
  is what actually applies here, and only two agents in this atlas have ever done it: NPR3 loss at 1.20x
  against wild-type littermates, and an intra-articular hedgehog agonist at 1.18x in femur and 1.25x in
  tibia against the contralateral limb of the same animal. THE HEADROOM ABOVE NORMAL IS ABOUT 21 PER
  CENT, NOT 40, AND GROWTH HORMONE IS NOT ONE OF THE AGENTS THAT PROVIDES IT.

  THAT REFRAMES THE ADDITIVITY QUESTION ENTIRELY. It was posed as "do GH and a CNP agent add on h_term".
  On the evidence GH has no demonstrated h_term effect above normal at all, so there is nothing for a
  second agent to add to. The live question is whether the two arms that DO elevate a normal plate - the
  hedgehog arm and the natriuretic arm - share a ceiling. AND AN ENUMERATED SEARCH THIS ROUND FOUND THAT
  NO STUDY IN THE LITERATURE HAS GIVEN TWO GROWTH-PLATE AGENTS TOGETHER AND MEASURED TERMINAL
  HYPERTROPHIC CELL HEIGHT. Not one. That is a hard negative and it is now recorded as such rather than
  as a gap in this atlas''s reading.

  THE THIRD FINDING IS A COMPARISON THE ATLAS HAD THE PIECES FOR AND HAD NEVER MADE. tyra300_2025 was
  already in this bibliography with its headline recorded, but not with the numbers or the histology. In
  WILD-TYPE C57BL/6J mice dosed orally from 4 to 8 weeks, the FGFR3-selective inhibitor TYRA-300 raised
  naso-anal length 7.3 per cent, tibia 6.4 per cent and femur 8.2 per cent at 14 mg/kg, dose-dependently,
  with tibia 3.9 and femur 5.0 per cent at 12 mg/kg - AND WITH NO DIFFERENCE IN BODY WEIGHT BETWEEN
  GROUPS, which clears the CORR-191 confound that spoils so many length results in this file. It also
  increased LUMBAR VERTEBRAE LENGTH and improved the size and shape of the SKULL AND FORAMEN MAGNUM.
  Histologically it increased both proliferation and differentiation, the hypertrophic zone chondrocytes
  were LARGER than in vehicle, and THE OVERALL STRUCTURE OF THE GROWTH PLATE WAS MORE ORGANISED after
  treatment.

  SET THAT AGAINST WHAT ROUNDS 205 AND 207 ESTABLISHED FOR THE CNP AXIS AND THE CONTRAST IS SYSTEMATIC.
  Vosoritide in skeletally normal primates lengthened tibia and humerus and produced NO change in L1-L4
  vertebral length, foramen magnum or skull; in thanatophoric mice L4-L6 was the only segment failing
  significance at both doses; and its dose ceiling in normal animals is set by GROWTH PLATE DYSPLASIA at
  0.08 to 0.2 times the human exposure. FGFR3 INHIBITION GROWS THE AXIAL AND CRANIAL SITES THE CNP AXIS
  MISSES, AND ORGANISES THE PLATE WHERE THE CNP AXIS DISORGANISES IT. If that holds, the two arms are
  COMPLEMENTARY BY SITE rather than redundant, which is the most consequential thing this stack could
  learn and is now the top-ranked open question.

  THE CAVEAT THAT MUST TRAVEL WITH IT. TYRA-300 IS NOT ERDAFITINIB. TYRA-300 is FGFR3-SELECTIVE and was
  designed for paediatric growth; erdafitinib is a pan-FGFR oncology agent, and the physeal and laryngeal
  cartilage findings this atlas holds against the FGFR class come from oncology dosing of pan-FGFR
  compounds. The selectivity difference may be the whole difference, and the atlas has been carrying the
  FGFR arm under the wrong molecule.

  AND THE QUESTION LEDGER THE USER ASKED FOR IS NOW A TOOL RATHER THAN A MEMORY. Fourteen questions this
  programme opened since round 199, each with its status, what would close it and who can get it. EIGHT
  OF THE FOURTEEN NEED NO NEW ANIMAL AND NO NEW PATIENT.'
quantitative:
- parameter: terminal cell height by baseline type
  value: 'RESTORATION - hypophysectomised 19.5 micrometres, GH-treated 26.5 (1.36x), IGF-I-treated 27.3
    (1.40x), intact normal 29.8 (1.53x). ELEVATION above a normal control - NPR3 loss 1.20x, hedgehog
    bead 1.18x femur and 1.25x tibia at one month, falling to 0.93x femur at two months'
  unit: micrometres and ratio to the study's own control
  conditions: hunziker1994 rat proximal tibia for the restoration series; weber2025 mouse tail vertebrae
    and trompet2024 rat femur and tibia for the elevation series
  species: multiple
  source_ref: hunziker1994
  uncertainty: 'THE SORT IS THE FINDING. Round 205 mixed the two and quoted 1.36x as though it were a
    ceiling on what an agent can do to a normal plate. GH-treated hypophysectomised rats do not even
    reach the intact control value, so the number is a deficiency correction. THE HEADROOM ABOVE A NORMAL
    BASELINE IS ABOUT 21 PER CENT on present evidence, resting on two studies in two species'
- parameter: existence of any combination study measuring terminal hypertrophic cell height
  value: none found
  unit: enumeration over four Europe PMC queries
  conditions: searches combining hypertrophic cell height or size with combination, combined treatment,
    co-treatment, growth hormone plus CNP, and FGFR3 inhibitor terms
  species: not_applicable
  source_ref: hunziker1994
  uncertainty: 'A HARD NEGATIVE ON THE LITERATURE RATHER THAN ON THIS ATLAS''S READING. Four queries;
    a fifth phrasing could surface something, and the search cannot see unpublished or supplementary-only
    measurements'
- parameter: FGFR3-selective inhibition in WILD-TYPE mice
  value: naso-anal length +7.3 per cent, tibia +6.4 per cent and femur +8.2 per cent at 14 mg/kg; tibia
    +3.9 and femur +5.0 per cent at 12 mg/kg; significant increases also at 8 and 10 mg/kg; tail length
    increased dose-dependently; NO DIFFERENCE IN BODY WEIGHT between treatment groups
  unit: per cent over vehicle
  conditions: tyra300_2025, wild-type C57BL/6J mice dosed orally once daily from 4 to 8 weeks of age
  species: mouse
  source_ref: tyra300_2025
  uncertainty: 'ELEVATION OF A NORMAL ANIMAL, not restoration, and the body-weight null clears the
    CORR-191 confound that spoils most length results in this file. Mouse, four weeks of treatment during
    rapid growth, no adult-length endpoint, and TYRA-300 is FGFR3-SELECTIVE where erdafitinib is
    pan-FGFR'
- parameter: site coverage of FGFR3 inhibition against the CNP axis
  value: 'TYRA-300 increased LUMBAR VERTEBRAE LENGTH and improved the size and shape of the SKULL AND
    FORAMEN MAGNUM, and in the hypochondroplasia model raised femur 3.70, tibia 3.75, ulna 5.03 and
    humerus 3.22 per cent. Vosoritide in skeletally normal juvenile primates produced NO change in L1-L4
    vertebral length, foramen magnum dimensions or skull measurements'
  unit: per cent and presence or absence of effect by site
  conditions: tyra300_2025 mouse models against ema_voxzogo_epar_2021 juvenile cynomolgus study, n = 7
    per sex in control and high dose
  species: multiple
  source_ref: tyra300_2025
  uncertainty: 'A CROSS-STUDY, CROSS-SPECIES, CROSS-MODEL COMPARISON AND IT IS NOT A HEAD-TO-HEAD. The
    FGFR3 vertebral result is in FGFR3-mutant models where the vertebrae are themselves affected and have
    room to respond; the CNP null is in skeletally normal primates. THE COMPARISON IS A HYPOTHESIS ABOUT
    COMPLEMENTARITY, not a demonstration of it'
- parameter: growth plate architecture under FGFR3 inhibition against the CNP axis
  value: 'under TYRA-300 the hypertrophic zone chondrocytes were LARGER than vehicle and the overall
    structure of the growth plate was MORE ORGANISED, with improved proliferative zone organisation.
    Under vosoritide at the normal-animal dose ceiling the finding is increased growth plate thickness
    and/or GROWTH PLATE DYSPLASIA with irregular contours'
  unit: qualitative histology
  conditions: tyra300_2025 Fgfr3-Y367C/+ mice against ema_voxzogo_epar_2021 repeat-dose toxicology
  species: multiple
  source_ref: tyra300_2025
  uncertainty: 'THE ARCHITECTURE CONTRAST IS THE MOST DECISION-RELEVANT PART AND IT IS QUALITATIVE ON
    BOTH SIDES. The TYRA-300 organisation claim is in a dysplasia model where the baseline is disordered,
    so "more organised" partly means "closer to normal"; the vosoritide dysplasia finding is in normal
    animals at supratherapeutic dose'
localization:
- 'the terminal hypertrophic cell, where the headroom above a normal baseline is about 21 per cent'
- 'the lumbar vertebrae and foramen magnum, which respond to FGFR3 inhibition and not to the CNP axis'
human_evidence: absent
human_evidence_note: 'Everything decided this round is rodent or a cross-species comparison of animal
  studies. The human contribution is negative - no human terminal cell height exists under any agent, and
  no combination study measuring it exists in any species.'
species_basis:
- mouse
- rat
- non_human_primate
translation_risk: high
translation_risk_reason: 'The baseline correction is an arithmetic point and transfers. The FGFR3-versus-
  CNP site comparison is assembled across different species, different models and different laboratories,
  and is a hypothesis rather than a result.'
confidence: C
claim_grades:
- claim: restoration and elevation numbers for terminal cell height are not interchangeable
  grade: A
  basis: arithmetic on the study designs - hunziker1994's control is hypophysectomised and its GH arm
    does not reach the intact control value
- claim: growth hormone raises terminal cell height above a normal baseline
  grade: X
  basis: NOT DEMONSTRATED ANYWHERE. The only number is against a hypophysectomised control and falls
    short of the intact animal
- claim: the headroom for terminal cell height above a normal baseline is about 20 per cent
  grade: C
  basis: two agents, two species, two bones, one of which does not sustain the effect to two months
- claim: no study has given two growth-plate agents together and measured terminal cell height
  grade: B
  basis: enumerated over four Europe PMC queries; a fifth phrasing could surface something
- claim: FGFR3-selective inhibition elevates growth in a genetically normal animal without a body-weight
    confound
  grade: B
  basis: dose-dependent across four doses in wild-type mice with an explicit body-weight null; single
    study, mouse, four weeks
- claim: FGFR3 inhibition and the CNP axis are complementary by site
  grade: E
  basis: A HYPOTHESIS ASSEMBLED ACROSS STUDIES. The FGFR3 vertebral data are in FGFR3-mutant models and
    the CNP axial null is in normal primates; no head-to-head exists
- claim: erdafitinib and TYRA-300 can be treated as the same agent
  grade: X
  basis: FALSE. TYRA-300 is FGFR3-selective and designed for paediatric growth; erdafitinib is pan-FGFR
    at oncology dosing, which is where the atlas's physeal and laryngeal cartilage findings come from
