contradicts:
- 'CORRECTS ROUND 205''S OWN ARITHMETIC. That round quoted a 1.0 to 1.4 times range for terminal cell
  height across every agent, mixing a hypophysectomised-baseline restoration number with wild-type-baseline
  elevation numbers. Sorted properly, restoration reaches 1.53x and elevation above a normal plate reaches
  about 1.21x, and growth hormone appears only in the restoration column. Logged as CORR-203.'
- 'REFRAMES THE GAP THIS ATLAS CALLED ITS TOP UNMEASURED QUANTITY. g_l1_are_the_hterm_agents_in_the_stack_
  additive_or_saturating was posed as whether GH and a CNP agent share an h_term ceiling. GH has no
  demonstrated h_term effect above a normal baseline, so the premise fails. The live version is whether
  the hedgehog and natriuretic arms share one, and no combination study measuring terminal cell height
  exists in any species.'
- 'SITS AGAINST THE ATLAS''S OWN ORDERING OF THE TWO ARMS. Vosoritide is the approved agent and has been
  carried as the safer, better-evidenced arm; the FGFR arm has been carried under erdafitinib with an
  oncology toxicology. On the evidence read this round the FGFR3-SELECTIVE compound elevates a normal
  animal without a body-weight confound, grows the axial and cranial sites the CNP axis misses, and
  ORGANISES the plate where the CNP axis at its normal-animal ceiling produces dysplasia. That does not
  make erdafitinib the right molecule - it makes the molecule choice the question.'
