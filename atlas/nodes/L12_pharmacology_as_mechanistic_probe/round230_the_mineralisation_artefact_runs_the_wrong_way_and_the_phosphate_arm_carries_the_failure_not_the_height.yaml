id: round230_the_mineralisation_artefact_runs_the_wrong_way_and_the_phosphate_arm_carries_the_failure_not_the_height
name: >-
  ROUND 230 - the artefact round 227 used to discount the only maturation observation belongs to the OPPOSITE
  metabolic state and is measured there at 1.2 years; the isolated phosphate arm carries slips, sclerosis and
  ectopic calcification and no height; and round 229's headline patient was on a different drug
type: hypothesis
layer: L12
aliases:
- the mineralisation artefact runs the wrong way
- the phosphate arm carries the failure not the height
- subject 3 was on Debio1347
- the failure has a shorter latency than the benefit
- round 230
stub: false
summary: |
  THREE LINES CLOSED AND THREE CORRECTIONS, TWO OF THEM TO YESTERDAY.

  LINE ONE - THE RESERVE QUESTION, CLOSED INDIRECTLY BECAUSE IT CANNOT BE CLOSED DIRECTLY. Round 228
  established that no on-treatment bone age exists anywhere. The only maturation observation that does
  exist is erdaseries2025's "atypical physeal widening without apparent progression of bone maturation",
  and round 227 offered a mechanism for discounting it: a Greulich-Pyle reading scores MINERALISED
  ossification centres, so an agent that IMPAIRS MINERALISATION shows an unadvanced bone age while
  preserving nothing. THE MECHANISM REQUIRES HYPOMINERALISATION AND NOTHING ELSE IN IT DOES ANY WORK.

  ERDAFITINIB DOES THE OPPOSITE TO MINERAL, FROM FIVE DIRECTIONS. Hyperphosphataemia in about 75 per cent
  of patients. The radiographic finding is METAPHYSEAL SCLEROSIS - increased density, not decreased - which
  round 227 read with the sign inverted. CALCINOSIS CUTIS with selective FGFR inhibitors and CALCIPHYLAXIS
  with pemigatinib and with futibatinib: three molecules depositing mineral where it does not belong, which
  are the defining lesions of hyperphosphataemic familial tumoral calcinosis, so the pharmacological and
  genetic phosphate arms converge on the SAME HUMAN TISSUE PHENOTYPE. And a 104-result sweep for rickets,
  osteomalacia, metaphyseal lucency or hypomineralisation under any FGFR inhibitor returns NOT ONE CASE.

  AND THE HUMAN MIRROR MEASURES THE DIRECTION, WHICH IS WHAT MAKES THIS A REFUTATION RATHER THAN A QUIBBLE.
  soto2026 studied bone age in X-linked hypophosphataemia - chronic HYPOphosphataemia with rickets - stated
  round 227's mechanism explicitly as a known concern, and then measured it: 56 children, four blinded
  readers, two methods, BONE AGE DELAYED 1.2 (SD 1.0) YEARS IN MALES and 0.4 (SD 1.0) in females, with 58
  per cent of males delayed one to two years. ROUND 227'S ARTEFACT IS REAL. IT BELONGS TO THE OPPOSITE
  METABOLIC STATE. Erdafitinib patients are hyperphosphataemic with sclerotic metaphyses, so the correction
  runs the other way or not at all, and the one maturation observation should be read as what it says.

  soto2026 ALSO ANSWERS A QUESTION THIS ATLAS HAD NOT THOUGHT TO ASK. In those same children - rickets,
  deformity, orthopaedic surgery - bone-age-based ADULT HEIGHT PREDICTION still landed within about two
  inches, the interval accepted in healthy children. A BONE AGE, HAD ANYONE TAKEN ONE, WOULD STILL HAVE BEEN
  INTERPRETABLE UNDER A METABOLIC BONE DISEASE. The question is open because nobody used the instrument, not
  because the instrument is broken.

  LEAD A - THE ISOLATED PHOSPHATE ARM HAS NO STATURE PHENOTYPE, AND NOW THE SILENCE IS ADMISSIBLE. Round 229
  rested this on two case reports and a review's feature list, which fails CORR-233's own test. ramnitz2016
  passes it: the NIH natural-history cohort of familial tumoral calcinosis / hyperostosis-hyperphosphataemia
  syndrome, protocol-evaluated with DXA, cardiac CT, dental radiographs and skeletal survey. IT MEASURED
  HEIGHT - it computes HEIGHT-ADJUSTED BMD Z-SCORES, which cannot be done without heights. IT WAS HUNTING
  NEW PHENOTYPES AND SAID SO, reporting heterotopic ossification, submucosal calcification of the large
  intestine, a shoulder destroyed to ankylosis, and destruction of a growth plate as previously undescribed.
  AND IT REPORTS NO STATURE OR GROWTH ABNORMALITY ANYWHERE. A group that publishes gut-wall calcification as
  novel would not have omitted tall stature.

  THE ONE GROWTH-PLATE LESION IN THAT COHORT POINTS THE OTHER WAY: subject FTC8 had the ULNAR PHYSIS
  OBLITERATED BY INVADING CALCINOSIS, WITH ULNAR SHORTENING. Where the phosphate arm reaches a plate, the
  bone ends up SHORTER. With the two independent slipped epiphyses already held - a 9-year-old girl with a
  GALNT3 mutation and a 13-year-old boy with an FGF23 mutation and generalised osteosclerosis - the isolated
  phosphate arm's skeletal ledger reads: SLIPS YES, OSTEOSCLEROSIS YES, PATHOLOGICAL FRACTURE YES, ECTOPIC
  CALCIFICATION YES, LOCAL PHYSEAL DESTRUCTION WITH SHORTENING YES, TALL STATURE OR ACCELERATED GROWTH NOT
  REPORTED IN A COHORT THAT MEASURED HEIGHTS.

  LEAD B - IN TREATED HUMANS PHOSPHATE AND GROWTH DISSOCIATE IN BOTH DIRECTIONS, from two children already
  in this bibliography. HIGH PHOSPHATE, NO GROWTH: brizini2024's patient developed hyperphosphataemia at
  FOUR WEEKS requiring chelation and slipped at twelve, and the paper states explicitly that it did NOT see
  increased growth velocity, height between the 25th and 50th centile. GROWTH WHILE PHOSPHATE FELL:
  erdaseries2025 patient 1 ran 2.47 mmol/L BEFORE the drug, then 1.88 and 2.01 on it, then 1.81 after -
  reference 1.28 to 1.82 - so THE DRAMATIC SPURT HAPPENED WHILE HIS PHOSPHATE SAT BELOW ITS OWN
  PRE-TREATMENT VALUE, with IGF-1 SDS falling from -0.04 to -1.4 and testosterone unmeasurable throughout.
  farouk2023 cannot adjudicate this and must not be cited as if it could: 7 of 7 hyperphosphataemic and 7 of
  7 growing is no variance and therefore no correlation. PHOSPHATE IS NEITHER NECESSARY NOR SUFFICIENT FOR
  THE HEIGHT, AND IS SUFFICIENT FOR THE SLIP.

  SO THE ACTION IS NOT THE ONE ROUND 229 PROPOSED. Binders bolted onto erdafitinib remain reasonable and
  nearly free. BUT THE STRUCTURAL VERSION IS BETTER AND THIS ATLAS ALREADY HOLDS ITS NUMBERS. FGF23 SIGNALS
  THROUGH FGFR1, which round 212 established, so the phosphate arm is not the price of inhibiting FGFR3 -
  IT IS THE PRICE OF INHIBITING FGFR1 ALONGSIDE IT. Erdafitinib, pan-FGFR1-4, hyperphosphataemia about 75
  per cent; TYRA-300, FGFR3-selective, 13 per cent. A SIX-FOLD REDUCTION IN THE ARM THAT CARRIES THE FAILURE
  AND NONE OF THE HEIGHT. And the one statement that survived the retraction of this atlas's receptor ledger
  is that FGFR3 spans about 65 cm of human stature while FGFR1 AND FGFR4 HAVE NO HUMAN STATURE PHENOTYPE, so
  the switch should cost nothing on the other side.

  WHY THAT IS THE MOST VALUABLE THING IN THE ROUND. Rounds 228 and 229 established the lever is DURATION and
  not dose. What ends the duration is the mechanical failure - ALL FIVE FDA CASES DISCONTINUED PERMANENTLY
  AND THREE REQUIRED SURGERY. REMOVING THE TERMINATOR IS THEREFORE WORTH MORE THAN RAISING THE DOSE.

  AND TWO CORRECTIONS TO YESTERDAY, BOTH FROM ONE TABLE IN brizini2024 THAT NAMES THE DRUG EACH farouk2023
  PATIENT RECEIVED. SUBJECT 3 - the 40-month, +2.43 SD, 83rd-to-above-99.9th-centile patient round 229 called
  the closest human analogue to this case - WAS ON DEBIO1347, NOT ERDAFITINIB. That costs erdafitinib the
  largest response and the longest exposure on record, and buys something larger: THE BIGGEST HUMAN GROWTH
  RESPONSE EVER RECORDED CAME FROM AN AGENT WITH NO FGFR4 COVERAGE AT ALL, which is an argument for
  narrowing the molecule made by the best data point in the field. And CORR-233's claim that brizini2024
  "never measured serial height at all" IS FALSE - they measured and reported no increase - an error
  committed inside the correction that announced the rule against exactly it.

  THE DISSOCIATION IS THEREFORE NOT WHOLLY DEAD, AND WHAT SURVIVES IS INFORMATIVE. One of round 228's three
  children was a double count, one grew +1.02 SD, and THE THIRD IS REAL - brizini's patient failed
  mechanically with nothing banked, at TWELVE WEEKS. Set the clocks side by side: slips at 84, 137 and 274
  days; +0.36 SD at five months, +1.02 SD at five months, +2.43 SD at forty. THE FAILURE HAS A SHORTER
  LATENCY THAN THE BENEFIT. That is the worst possible shape for this programme and it is precisely why an
  avoidable cause of early discontinuation is worth removing.
quantitative:
- parameter: bone age delay in the hypophosphataemic mirror state, which is where round 227's artefact lives
  value: >-
    X-linked hypophosphataemia, 56 children, each radiograph read by 4 blinded readers using both
    Greulich-Pyle and Gilsanz-Ratib. Bone age delay (chronological age minus bone age) 1.2 (SD 1.0) years in
    MALES and 0.4 (SD 1.0) years in FEMALES, males significantly more delayed, p < .05; 58 per cent of males
    and 21 per cent of females delayed 1 to 2 years, 11 per cent of males and 9 per cent of females delayed
    more than 2 years. ADULT HEIGHT PREDICTION FROM THAT BONE AGE REMAINED ACCURATE TO ABOUT TWO INCHES - 4
    males achieved 171.2 (SD 5.3) cm against Bayley-Pinneau 176.3 (SD 11.7) and Tanner-Whitehouse 173.0 (SD
    6.8); 15 females achieved 155.9 (SD 5.2) against Bayley-Pinneau 156.0 (SD 6.8)
  unit: years of bone-age delay, and cm of adult-height prediction error
  conditions: retrospective cross-sectional and longitudinal, single academic centre, no intervention
  species: human
  source_ref: soto2026
  uncertainty: >-
    XLH IS NOT THE ERDAFITINIB STATE AND THAT IS THE POINT OF CITING IT - it is the opposite phosphate
    state, used to establish the DIRECTION of the artefact rather than its magnitude under a drug. The
    adult-height comparison rests on 4 males and 15 females who had reached or neared final height without
    prior orthopaedic surgery, which is a small and selected subgroup
- parameter: the skeletal ledger of the isolated phosphate arm in humans
  value: >-
    in hyperphosphataemic familial tumoral calcinosis - lifelong loss of FGF23 signalling with no FGFR3
    inhibition in cartilage - SLIPPED CAPITAL FEMORAL EPIPHYSIS is reported independently twice, generalised
    OSTEOSCLEROSIS and hyperostosis are characteristic, PATHOLOGICAL FRACTURE is reported, ectopic
    periarticular calcification is definitional, and one NIH cohort subject had the ULNAR GROWTH PLATE
    OBLITERATED BY INVADING CALCINOSIS WITH ULNAR SHORTENING. NO STATURE OR GROWTH ABNORMALITY IS REPORTED
    IN THE NIH COHORT, WHICH COMPUTED HEIGHT-ADJUSTED BMD Z-SCORES AND THEREFORE MEASURED HEIGHTS
  unit: presence or absence of each skeletal phenotype
  conditions: ramnitz2016 NIH natural-history cohort, plus reddy2026 and kashayichowdoj2025
  species: human
  source_ref: ramnitz2016
  uncertainty: >-
    THE HEIGHT LEG IS STILL AN ARGUMENT FROM SILENCE, but it now passes CORR-233's admissibility test rather
    than failing it: the source measured the quantity and was actively cataloguing novel phenotypes. What is
    still missing is a HEIGHT SDS DISTRIBUTION for an HFTC cohort, which would convert an admissible silence
    into a measurement. The analogy is also partial - erdafitinib inhibits FGFR1 in bone directly and HFTC
    does not, so this isolates the phosphate arm and not the receptor-in-bone arm
- parameter: phosphate and growth dissociate in both directions in treated children
  value: >-
    HIGH PHOSPHATE WITH NO GROWTH - brizini2024's patient developed hyperphosphataemia at 4 weeks requiring
    chelation and slipped a capital femoral epiphysis at 12 weeks, and the authors state they did NOT see
    increased growth velocity, height between the 25th and 50th centile. GROWTH WITH PHOSPHATE BELOW ITS OWN
    BASELINE - erdaseries2025 patient 1, serum phosphate mmol/L against reference 1.28-1.82: 2.47
    pre-erdafitinib, 1.88 at 3 months, 2.01 at 6 months, 1.81 at 2 months post; the dramatic growth spurt
    occupied the middle two values, with IGF-1 SDS falling -0.04 to -1.4 and testosterone below 0.03 ng/mL
    throughout
  unit: mmol/L serum phosphate against presence or absence of growth acceleration
  conditions: two published cases, both already in this atlas's bibliography
  species: human
  source_ref: erdaseries2025
  uncertainty: >-
    TWO PATIENTS AND NEITHER IS AN EXPERIMENT. brizini's child had only 12 weeks of exposure, which the
    authors themselves offer as the explanation for his flat growth, and he was obese. Patient 1's 2.47 is a
    SINGLE PRE-TREATMENT VALUE WITH NO REPLICATE, and growth hormone - which he was receiving at 16
    microgram/kg/day - itself raises tubular phosphate reabsorption and is the likeliest reason the baseline
    was high. What the pair rules out is the strong form, that the hyperphosphataemia is HOW the height is
    bought. farouk2023 cannot contribute: 7 of 7 hyperphosphataemic and 7 of 7 growing is no variance
  value_unverified: true
- parameter: the phosphate arm is an FGFR1 effect and is six-fold smaller on an FGFR3-selective agent
  value: >-
    erdafitinib, pan-FGFR1-4, hyperphosphataemia about 75 per cent with about 4 per cent grade 3. TYRA-300,
    FGFR3-selective, hyperphosphataemia 13 per cent. FGF23 signals through FGFR1-Klotho in the kidney, so
    the phosphate arm is the price of FGFR1 coverage and not of FGFR3 coverage. The human-genetics anchor
    that survived the retraction of this atlas's receptor ledger holds that FGFR3 spans about 65 cm of human
    stature while FGFR1 and FGFR4 have NO human stature phenotype
  unit: per cent incidence of hyperphosphataemia by receptor coverage
  conditions: incidences held since round 213; the receptor-coverage statement is the surviving remnant of
    CORR-046, CORR-147 and CORR-217
  species: human
  source_ref: balversa_label_2025
  uncertainty: >-
    THE TWO INCIDENCES COME FROM DIFFERENT POPULATIONS AND DIFFERENT TRIALS AND ARE NOT A HEAD-TO-HEAD.
    Neither was measured in a growing child. AND THE LOAD-BEARING ASSUMPTION IS UNTESTED - that FGFR1
    coverage contributes nothing to the height. The genetics says FGFR1 loss of function has no stature
    phenotype, but pharmacological inhibition of a receptor with no loss-of-function phenotype can still act
    in a growing plate, and the largest human response on record came from an FGFR1-3 agent
- parameter: the failure has a shorter latency than the benefit
  value: >-
    time to slipped epiphysis across the five FDA cases, median 137 days, range 84 to 274. brizini2024's
    patient slipped at 84 days WITH NO MEASURABLE HEIGHT GAIN. Against that, height gain by exposure -
    farouk2023 subject 5, +0.36 SD at 5 months; subject 6, +1.02 SD at 5 months, slipping at about 137 days;
    subject 3, +2.43 SD at 40 months
  unit: days to mechanical failure against months to height gain
  conditions: nadeaunguyen2026, brizini2024 and farouk2023 Table 1
  species: human
  source_ref: nadeaunguyen2026
  uncertainty: >-
    THE TWO CLOCKS COME FROM DIFFERENT AND OVERLAPPING PATIENT SETS and the comparison is descriptive rather
    than a hazard analysis. Spontaneous reporting has no denominator and favours early dramatic events,
    which would bias the failure clock EARLY relative to truth. The direction is nonetheless the one that
    matters for planning and no source contradicts it
localization:
- 'the kidney, where FGFR1 sets phosphate handling and where the arm that ends the treatment begins'
- 'the proximal femoral physis, which slips from the growth and from the phosphate independently'
human_evidence: direct
human_evidence_note: >-
  A 56-child bone-age cohort in the mirror metabolic state, an NIH natural-history cohort of the isolated
  phosphate lesion, two treated children with serial phosphate and growth, and three pharmacological ectopic
  calcification reports. All human.
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  Every load-bearing observation is human. The residual risk is not species but inference across conditions
  - from a genetic phosphate disease to a pharmacological one - and that is stated wherever it is used.
confidence: B
claim_grades:
- claim: the unadvanced bone maturation seen under erdafitinib is an artefact of impaired mineralisation
  grade: X
  basis: >-
    FALSE BY DIRECTION, AND IT WAS ROUND 227's CENTRAL INFERENCE. The mechanism requires
    hypomineralisation; the drug class produces hyperphosphataemia, metaphyseal sclerosis, calcinosis cutis
    and calciphylaxis, and has no reported rickets or osteomalacia in a 104-result sweep. The artefact is
    real and measured at 1.2 years in males - in X-linked hypophosphataemia, the opposite state
- claim: an on-treatment bone age exists, or has now been established indirectly
  grade: X
  basis: >-
    STILL FALSE. Round 228's closure is untouched. This round removes a reason for disbelieving the one
    qualitative observation; it does not create a measurement
- claim: the isolated phosphate arm produces slipped epiphyses, sclerosis and ectopic calcification but no
    increase in stature
  grade: C
  basis: >-
    Two independent slips in genetic FGF23 loss, characteristic osteosclerosis and hyperostosis, and no
    stature phenotype in an NIH cohort that measured heights and was actively reporting novel features. The
    height leg is an admissible silence rather than a measurement, which caps it below B
- claim: hyperphosphataemia is how the FGFR-inhibitor height gain is produced
  grade: X
  basis: >-
    FALSE IN BOTH DIRECTIONS. brizini2024's patient had hyperphosphataemia requiring chelation with
    explicitly no increase in growth velocity; erdaseries2025 patient 1 had his dramatic spurt while
    phosphate sat below his own pre-treatment value
- claim: switching to an FGFR3-selective inhibitor keeps the height and drops most of the phosphate arm
  grade: E
  basis: >-
    THE PHOSPHATE HALF IS WELL SUPPORTED - 75 per cent against 13 per cent, with FGF23 signalling through
    FGFR1 - AND THE HEIGHT HALF IS AN ASSUMPTION. No human with a normal FGFR3 has ever been given an
    FGFR3-selective inhibitor and measured, and the largest response on record came from an FGFR1-3 agent
- claim: farouk2023 subject 3 is evidence about erdafitinib
  grade: X
  basis: >-
    FALSE. brizini2024's literature table names his drug as DEBIO1347, an FGFR1-3 selective inhibitor, over
    40 months. Round 229 framed him as the closest human analogue for this stack's agent
- claim: brizini2024 never measured serial height
  grade: X
  basis: >-
    FALSE, and CORR-233 asserted it while establishing the rule against exactly that move. The paper states
    it did not see increased growth velocity, height between the 25th and 50th centile
- claim: the mechanical failure has a shorter latency than the height benefit
  grade: D
  basis: >-
    Slips at 84 to 274 days including one at 84 days with nothing banked, against +0.36 and +1.02 SD at five
    months and +2.43 SD at forty. Descriptive, overlapping patient sets, and spontaneous reporting biases
    the failure clock early - but no source points the other way
