open_questions:
- g_l12_does_phosphate_control_subtract_from_fgfr_tki_growth_or_only_from_the_mechanical_failure
- g_l12_has_an_fgfr3_selective_inhibitor_ever_grown_a_human_with_a_normal_fgfr3
- g_l12_how_much_of_the_fgfr_tki_growth_response_requires_fgfr1
- g_l12_how_long_does_the_fgfr_tki_growth_response_last_and_at_what_age_does_it_stop
contradicts:
- >-
  ROUND 227's inference that the unadvanced bone maturation under erdafitinib is an artefact of impaired
  mineralisation. The mechanism requires hypomineralisation and the drug class produces the opposite;
  soto2026 measures the artefact at 1.2 years in the hypophosphataemic state instead. Recorded as CORR-237.
- >-
  ROUND 229's framing of farouk2023 subject 3 as the closest human analogue for erdafitinib. He was on
  DEBIO1347, an FGFR1-3 selective inhibitor. Recorded as CORR-235.
- >-
  CORR-233's statement that brizini2024 never measured serial height. It measured and reported no increase,
  so one real child with mechanical failure and no growth survives. Recorded as CORR-236.
- >-
  ROUND 229's proposed action of adding phosphate binders to erdafitinib as the way to separate the arms.
  Still reasonable, but superseded as the primary route by FGFR3-selectivity, which removes the arm at
  source rather than managing it downstream.
