localization: systemic subcutaneous
human_evidence: absent
human_evidence_note: >-
  No Smoothened agonist has been given to a human by any route. No oral
  administration of any Smoothened agonist was found in any species either - every in
  vivo route in the literature is intraperitoneal or subcutaneous.
species_basis:
  - mouse
translation_risk: high
translation_risk_reason: >-
  The dose anchors are all mouse, scaled by a convention rather than by
  pharmacokinetics. The mid anchor rests on pathway-marker induction in chondrocytes
  rather than on any length or stature endpoint, and both endpoints that do exist at
  a growth plate sit at the top of the range, so moving down is a genuine bet on
  potency rather than a free simplification.
confidence: C
claim_grades:
  - claim: >-
      The atlas imported its dose from the one study whose effect size CORR-203 had
      already excluded
    grade: A
    basis: >-
      a statement about this file's own reasoning. R388-R392 scaled from li2021 while
      simultaneously recording that CORR-203 governs li2021's effect sizes absolutely
  - claim: >-
      rundle2023's 5 mg/kg is a better-justified anchor because it measured pathway
      induction in chondrocytes
    grade: C
    basis: >-
      PTCH1, GLI1 and SOX9 induction in chondrocytes is target engagement in the right
      cell type, but it is a marker rather than a length or pool endpoint, and it was
      measured in a fracture-defect model rather than a normal growth plate
  - claim: >-
      At the mid anchor every body weight from 50 to 80 kg is a single sub-millilitre
      injection and annual material falls to about 1 g
    grade: A
    basis: arithmetic on the scaled dose against a conventional 2 mL per-site limit
  - claim: Both growth-plate results sit at the top of the range, so moving down is a bet
    grade: A
    basis: >-
      trompet2024 at 25 mg/kg and li2021 at 20 mg/kg are the only growth-plate
      results; no lower dose has been tested at a plate in any species
  - claim: The growth plate may be easier to move proportionally than the colon
    grade: E
    basis: >-
      inference from lee2016colitis's own explanation of its modest colonic Gli1 rise -
      high basal tone from constitutive epithelial ligand - applied to a tissue whose
      hedgehog output is declining. Never tested
  - claim: No oral route exists for any Smoothened agonist in any species
    grade: B
    basis: >-
      a targeted query returning only intraperitoneal and subcutaneous in vivo
      administration. An absence from one search, so recorded as a gap rather than a
      proof
key_refs:
  - ref_id: rundle2023
    year: 2023
    type: primary
    role: >-
      the new anchor - 5 mg/kg systemic with PTCH1, GLI1 and SOX9 induction in
      chondrocytes, plus the explicit statement that 5 to 20 mg/kg/day is the effective
      systemic range in mice
  - ref_id: li2021
    year: 2021
    type: primary
    role: >-
      the old anchor, and the reason the correction was needed - its stature endpoint
      is excluded by CORR-203, so it should never have supplied the dose either
  - ref_id: lee2016colitis
    year: 2016
    type: primary
    role: >-
      the low anchor, and the demonstration that a Smoothened agonist can be dosed
      systemically in an aqueous vehicle at a dose in that range
  - ref_id: trompet2024
    year: 2024
    type: primary
    role: >-
      the counterweight - the only pool result in a normal animal sits at 25 mg/kg,
      at the top of the range
