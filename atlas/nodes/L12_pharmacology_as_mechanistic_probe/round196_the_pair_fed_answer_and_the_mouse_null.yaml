    is 25.6 g, fifty-eight per cent of the control''s own gain. "Did not influence body weight gain" is a
    Type II result, and the larger experiment finds the effect'
- parameter: tibia length, growth plate height, hypertrophic zone height, osseous front advance and BrdU
