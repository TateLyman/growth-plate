contradicts:
- 'PARTIALLY ANSWERS AND PARTIALLY DISMANTLES gap g_l12_is_the_pth1r_length_gain_only_body_weight. The
  pair-fed experiment exists. Its healthy-animal contrast does not survive re-analysis, its weight null
  is underpowered and contradicted by the same paper''s larger experiment, and pair-feeding equalises
  intake rather than weight in a drug that raises feed efficiency. The gap is not closed but the
  specific design that was supposed to close it turns out not to.'
- 'CORRECTS THE ROUND-195 EXPECTATION THAT A PAIR-FED POSITIVE WOULD REOPEN THE LINE. It would have.
  This one does not, because it is a rescue in a disease model and because the mirror experiment in the
  same model finds the plate unmoved by a 61 per cent swing in PTH.'
- 'OVERTURNS THE ROUND-195 ENUMERATION THAT NO GROWING NON-RODENT-OR-RAT MAMMAL HAS A LENGTH ENDPOINT.
  That enumeration was over the REGULATORY package and was correct for it. koh2022 supplies the mouse,
  and it is null.'
