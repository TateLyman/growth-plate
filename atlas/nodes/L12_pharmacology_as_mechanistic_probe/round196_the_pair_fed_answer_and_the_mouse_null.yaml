  source_ref: nakagawa2008
  uncertainty: 'THE MIRROR EXPERIMENT, same group, same model, same duration, measuring everything
    schmitt2000 omitted. Total body length gain also unchanged in every group including sham pair-fed:
    sham pair-fed 3.3 plus or minus 0.5 against 3.5 plus or minus 0.6 cm'
- parameter: body weight gain and feed efficiency under cinacalcet in uraemic rats
  value: 21.6 plus or minus 8.7 against 12.7 plus or minus 11.2 g, and 141 plus or minus 50 against 77
    plus or minus 70 g per kilogram
  unit: grams and grams per kilogram of food
  conditions: same study, food intake similar
  species: rat
  source_ref: nakagawa2008
  uncertainty: 'LOWERING PTH RAISES WEIGHT GAIN, and raising PTH1R signalling in schmitt2000 also raises
    weight gain. Body weight is not tracking PTH1R tone in this model'
- parameter: tibia length in wild-type growing mouse pups under intermittent PTH(1-34)
  value: no effect
  unit: mm by digital caliper accurate to 0.001 mm
  conditions: wild-type and Alpl knockout littermates, PTH(1-34) 50 micrograms per kilogram daily from
    postnatal day 4 to day 13; n=8 wild-type vehicle against n=16 wild-type PTH
  species: mouse
  source_ref: koh2022
  uncertainty: 'in the same animals PTH significantly raised tibial BV/TV, trabecular number, trabecular
    spacing and BMD, so the drug was pharmacologically active. THE FIRST NON-RAT MAMMAL WITH A BONE
