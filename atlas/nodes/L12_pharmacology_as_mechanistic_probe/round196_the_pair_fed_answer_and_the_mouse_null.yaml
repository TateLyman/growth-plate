  conditions: female Sprague-Dawley rats from 133 g, sham-operated and pair fed, PTH(1-37) 30
    micrograms per kilogram twice daily subcutaneously
  species: rat
  source_ref: schmitt2000
  uncertainty: 'RECOMPUTED AS A TWO-SAMPLE t-TEST: t equals 1.40, p equals 0.19, Cohen d 0.75 - NOT
    significant. The paper''s significance for this contrast rests on ANOVA followed by Duncan''s multiple
    range test across four groups'
- parameter: snout-to-tail-tip length gain, uraemic animals, recomputed
  value: 4.78 plus or minus 0.20 solvent against 6.17 plus or minus 0.36 PTH
