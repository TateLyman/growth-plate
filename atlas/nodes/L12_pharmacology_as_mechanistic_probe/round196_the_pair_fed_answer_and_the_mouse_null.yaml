  conditions: subtotally nephrectomised rats, same protocol
  species: rat
  source_ref: schmitt2000
  uncertainty: 't equals 3.38, p equals 0.0055, Cohen d 1.80 - robust. But uraemia costs 0.57 cm and PTH
    returns the animal to the treated-sham value, so the pattern is RESCUE of a deficit rather than
    supranormal growth'
