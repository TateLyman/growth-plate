id: round196_the_pair_fed_answer_and_the_mouse_null
name: ROUND 196 - the pair-fed experiment exists and it is a uraemia rescue, the mirror experiment
  moves nothing at the plate, and a wild-type growing mouse gives six length nulls at once
type: hypothesis
layer: L12
aliases:
- schmitt2000 re-analysed
- the cinacalcet mirror
- the mouse null
- round 196
stub: false
summary: 'ROUND 195 CLOSED BY NAMING THE EXPERIMENT THAT WOULD SETTLE IT - A PAIR-FED ARM. IT EXISTS,
  IT WAS RUN IN 2000, AND IT DOES NOT SAY WHAT ITS ABSTRACT SAYS.

  schmitt2000, supplied by the user, is exactly the design gap
  g_l12_is_the_pth1r_length_gain_only_body_weight asked for: female Sprague-Dawley rats at 133 g -
  actively growing - subtotally nephrectomised or sham, fourteen days of PTH(1-37) at 30 micrograms
  per kilogram TWICE DAILY, with the sham controls PAIR FED. The abstract reports that length gain
  was significantly increased by intermittent PTH in both uraemic animals and pair-fed sham controls,
  and that PTH "did not influence body weight gain and food conversion ratio". If that held, the
  body-size explanation built in round 195 would die.

  RECOMPUTING THE PAIRWISE CONTRASTS FROM THE PAPER''S OWN MEANS AND STANDARD ERRORS SPLITS THE RESULT
  IN TWO. The uraemic contrast is robust: 4.78 to 6.17 cm of length gain, t equals 3.38, p equals
  0.0055, Cohen d 1.80. THE SHAM PAIR-FED CONTRAST IS NOT: 5.35 to 6.19 cm, t equals 1.40, p equals
  0.19, d 0.75, at n equals seven per group. The paper analysed by ANOVA followed by DUNCAN''S multiple
  range test, which is among the most permissive post-hoc procedures in use. The significance letter on
  the healthy pair-fed group comes from Duncan''s, not from the data surviving a pairwise test.

  AND THE PATTERN IS RESCUE. Uraemia costs 0.57 cm of length gain. PTH brings the uraemic animal to
  6.17, which is the same as the treated sham at 6.19 and above the untreated sham at 5.35. The
  question of whether a PTH1R agonist pushes a HEALTHY animal past its own ceiling is precisely the
  contrast that fails.

  THE "NO WEIGHT EFFECT" CLAIM IS ALSO AN UNDERPOWERED NULL, AND THE PAPER''S OWN LARGER EXPERIMENT
  CONTRADICTS IT. In experiment 2 the sham pair-fed weight gain went 44.4 to 52.8 grams, nineteen per
  cent, p equals 0.34 - and the minimum difference detectable at eighty per cent power in that design
  is 25.6 grams, fifty-eight per cent of the control''s own gain. In experiment 3, with n equals eleven,
  the same drug raised weight gain from 37.4 to 45.2 grams, p equals 0.036, AT IDENTICAL FOOD INTAKE
  - 213 against 210 grams - so it raised feed efficiency. Pair-feeding equalises INTAKE, not weight,
  and this drug moves the conversion of one into the other.

  WHAT SURVIVES schmitt2000 CLEANLY IS THE SCHEDULE CONTRAST, WHICH IS INTERNAL. Continuous infusion of
  PTH(1-37) at the same 60 micrograms per kilogram per day did NOT alter length gain. Intermittent
  administration did. Nothing else in the atlas tests continuous against intermittent on a length
  endpoint in the same animals.

  THE MIRROR EXPERIMENT WAS RUN BY THE SAME GROUP AND IT IS DEVASTATING FOR THE PLATE HYPOTHESIS.
  nakagawa2008 - Oh J is an author on both papers - gave CINACALCET to subtotally nephrectomised and
  sham ad-lib and PAIR-FED Sprague-Dawley rats for the same fourteen days, cutting PTH by 61 per cent,
  and measured everything schmitt2000 did not: TIBIA LENGTH, total growth plate height, HYPERTROPHIC
  ZONE height, osseous front advance by calcein labelling, and chondrocyte proliferation rate by BrdU.
  ALL FIVE WERE UNCHANGED. Total body length gain was unchanged in every group including sham pair-fed.
  What DID change was body weight gain, from 12.7 to 21.6 grams, and feed efficiency, from 77 to 141
  grams per kilogram. A 61 per cent swing in PTH tone in a growing animal moved the body-weight axis
  and left every growth plate parameter where it was.

  READ TOGETHER THE TWO PAPERS DISSOCIATE THE AXES. Raising PTH1R signalling raises weight gain and
  feed efficiency; lowering PTH raises weight gain and feed efficiency. Weight is not tracking PTH1R
  tone at all - it is tracking uraemia control. And the one paper that looked at the plate directly
  found nothing there to move.

  THEN THE HUNT FOUND A WILD-TYPE GROWING MOUSE, AND IT GIVES SIX NULLS AT ONCE. koh2022 dosed
  wild-type mouse pups and Alpl knockout littermates with intermittent PTH(1-34) at 50 micrograms per
  kilogram DAILY FROM POSTNATAL DAY 4 TO DAY 13 - the fastest-growing window a mammal has - with eight
  wild-type vehicle animals against SIXTEEN wild-type PTH animals. "PTH treatment had no effect on
  tibia length in either genotype." Nor on presphenoid, basisphenoid or basioccipital bone length. Nor
  on either of the two cranial synchondrosis lengths, which ARE growth plates. Six endochondral length
  measurements, all null, in animals where the same drug significantly raised tibial bone volume
  fraction, trabecular number, bone mineral density and skull width. THE DRUG WAS WORKING. IT JUST WAS
  NOT LENGTHENING ANYTHING.

  THIS IS THE FIRST NON-RAT MAMMAL WITH A BONE-LENGTH ENDPOINT UNDER A PTH1R AGONIST IN A GROWING
  ANIMAL. Round 195 established by enumeration that the regulatory package contained none. It exists in
  the academic literature and it is negative.

  ONE OBSERVATION POINTS THE OTHER WAY AND IT IS THE ONLY FUSION-TIMING DATUM THAT EXISTS. koh2022''s
  discussion records that in an FGFR3 gain-of-function achondroplasia mouse, PTH at 100 micrograms per
  kilogram for four weeks reduced the dome-shaped skull and "partially prevent[ed] the premature fusion
  of the cranial synchondroses". That is xie2012, already in this atlas for its limb-length rescue.
  Nobody has measured fusion timing under a PTH1R agonist in a wild-type animal, but the single
  observation that exists points to DELAY rather than advance, which is the favourable direction for
  gap g_l12_is_the_pth1r_acceleration_banked_or_does_it_advance_fusion.

  THE SWEEP ALSO CONFIRMS THREE GAPS EMPTY BY SEARCH. A ten-query Europe PMC sweep returning a thousand
  records, filtered to eighty-two that pair a PTH1R agonist with a length, growth, maturation or zone
  endpoint, returned NOTHING on bone age under a PTH1R agonist, NOTHING on PTH1R expression across
  human pubertal stage, and NOTHING on vertebral body height in a growing animal. Those three are not
  gaps in my reading; they are gaps in the field.'
