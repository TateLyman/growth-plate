localization:
- 'the endpoints that moved - body weight, feed efficiency, trabecular bone volume, BMD'
- 'the endpoints that did not - tibia length, cranial base bone length, synchondrosis length, total
  growth plate height, hypertrophic zone height, osseous front advance, BrdU proliferation index'
human_evidence: absent
human_evidence_note: This round is rodent. The human position is unchanged from round 195 - a
  three-year randomised null on linear growth and ten years of normal height velocity Z.
species_basis:
- rat
- mouse
translation_risk: moderate
translation_risk_reason: 'The mouse and rat nulls agree with the human randomised null, so for once the
  species are not in conflict. The residual risk runs the other way: every animal null is at a dose far
  above what a eucalcaemic human can take, so if anything the animals overstate the exposure a human
  could achieve, which makes the nulls harder rather than easier to escape.'
confidence: B
claim_grades:
- claim: intermittent PTH1R agonism does not lengthen bone in a wild-type growing mouse
  grade: C
  basis: six independent endochondral length endpoints in one study, n=8 against n=16, with positive
    controls on bone volume and density in the same animals
- claim: the schmitt2000 healthy pair-fed length effect does not survive a pairwise test
  grade: C
  basis: re-analysis of the paper's own means and SEMs; p equals 0.19 at n equals 7 against a reported
    significance derived from Duncan's multiple range test
- claim: a 61 per cent reduction in PTH tone changes no growth plate parameter in a growing uraemic rat
  grade: C
  basis: single study, but it measures tibia length, plate height, hypertrophic zone height, calcein
    osseous front advance and BrdU together with pair-fed controls
- claim: PTH1R agonism moves body weight and feed efficiency independently of the growth plate
  grade: C
  basis: two studies from the same group in which opposite manipulations of PTH tone both raise weight
    gain while neither moves the plate
- claim: the only fusion-timing observation under a PTH1R agonist points to DELAY
  grade: D
  basis: a single disease-model observation reported secondhand in koh2022's discussion of xie2012 -
    partial prevention of premature synchondrosis fusion in achondroplastic mice at 100 micrograms per
    kilogram for four weeks
- claim: no study anywhere pairs a PTH1R agonist with bone age, human pubertal-stage PTH1R expression,
    or vertebral body height in a growing animal
  grade: A
  basis: enumeration over a ten-query sweep of 1000 Europe PMC records
