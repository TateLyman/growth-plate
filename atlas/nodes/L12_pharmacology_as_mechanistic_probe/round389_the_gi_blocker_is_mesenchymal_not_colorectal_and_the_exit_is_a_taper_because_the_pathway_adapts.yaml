id: round389_the_gi_blocker_is_mesenchymal_not_colorectal_and_the_exit_is_a_taper_because_the_pathway_adapts
name: "R389: the GI blocker is MESENCHYMAL and mechanical, not colorectal-neoplastic - the colon is the safe segment, the stomach is the risk, and the exit must be a TAPER because the pathway adapts below Smoothened"
aliases:
  - intestinal hyperplasia under SAG
  - hedgehog in the colon
  - segment-specific hedgehog tumorigenesis
  - hedgehog pathway adaptation and rebound
  - the systemic SAG exit
type: intervention
layer: L12
stub: false
summary: >-
  R388 accepted two liabilities on the systemic route and did not take either
  apart: a 6.1 percent incidence of intestinal hyperplasia, and an exit that was
  simply "then stop". This round works both to the primary literature. Neither
  survives in the form R388 left it, and one of them inverts.

  FIRST, WHAT THE GI FINDING ACTUALLY IS. li2021's own discussion, not its
  abstract, states that the affected animals showed INCREASED THICKNESS OF THE
  SMOOTH MUSCLE LAYER, and names the consequence the authors were worried about
  as BOWEL OBSTRUCTION. It is a MESENCHYMAL and MECHANICAL finding, not an
  epithelial, mucosal or neoplastic one, and it occurred in both the Ihh
  conditional knockout and the Ihh flox/flox groups, so it is an effect of the
  drug and not of the disease model. The same paragraph asks for exactly the
  study nobody has run: mechanistic and preclinical toxicity work on SAG's effect
  on intestinal tissue and function.

  SECOND, AND THIS IS THE INVERSION: THE COLORECTAL EPITHELIAL DIRECTION RUNS THE
  OPPOSITE WAY TO THE INTUITIVE FEAR. Hedgehog in the gut is a paracrine
  epithelium-to-mesenchyme signal - the ligand is made by epithelium and the
  receptor is expressed only in the mesenchyme. Removing it is the harmful
  direction. westendorp2021: loss of Ihh signalling gives increased epithelial
  proliferation with lengthening and multiplication of intestinal crypts, and in
  an inducible Apc-mutant colonic adenoma model, deleting Ihh produced a
  remarkable increase in the hyperproliferative phenotype and increased
  accumulation of Lgr5-positive stem cells. westendorp2018 and razumilava2018:
  epithelial Ihh suppresses a stromal-cell-driven intestinal immune response and
  suppresses intestinal inflammation. So on the colorectal epithelium and its
  immune compartment, a Smoothened agonist is predicted to be restraining and
  protective rather than tumorigenic.

  THIRD, THE TUMOUR RISK FROM HEDGEHOG GAIN IN THE GUT IS REAL, MESENCHYMAL, AND
  SEGMENT-SPECIFIC TO THE STOMACH. li2026stromalhh activated Hedgehog genetically
  in Col1a2-, Pdgfra-, Gli1-, Acta2- and Prrx1-marked stromal lineages: activation
  in Col1a2-, Pdgfra- or Gli1-marked stroma induced tumorigenesis in the STOMACH
  and gastroesophageal junction and NOT in small or large intestine, because
  Hedgehog raises BMP antagonists in gastric but not colonic stromal cells, which
  then activate Wnt in gastric stem cells. The human counterpart is a recognised
  entity: GLI1-altered GASTRIC MESENCHYMAL tumours, including plexiform
  fibromyxoma with MALAT1::GLI1 fusion and gastric mesenchymal tumours with
  PTCH1::GLI2 fusion. Three independent lines - a mouse toxicity finding in
  smooth muscle, a mouse tumorigenesis experiment restricted to stomach, and a
  human tumour class that is gastric and mesenchymal - all point at the same
  compartment, and it is not the colorectum.

  FOURTH, AN AGE ARGUMENT THAT MITIGATES BUT DOES NOT REMOVE THE FINDING. The
  Hedgehog-to-gut-mesenchyme axis is a morphogenetic programme: epithelial
  Hedgehog drives mesenchymal cluster formation and villification through Foxl1,
  BMP and PDGFRalpha. li2021 dosed from postnatal day 7 or 14 to day 30, straddling
  the period in which the murine gut wall is still being built and remodelled
  through weaning. A subject at bone age 16 has a fully formed gut. Whether an
  adult gut mesenchyme responds to a Smoothened agonist by thickening at all has
  never been tested, and that is the difference between a developmental artefact
  and a real adult liability.

  FIFTH, THE HUMAN PHARMACOVIGILANCE DIRECTION IS ALSO INVERTED. The only
  human-scale safety data on this pathway come from the marketed ANTAGONISTS.
  Their common adverse events - muscle spasms, alopecia, ageusia - are the human
  loss-of-hedgehog phenotype, and both vismodegib and sonidegib carry a
  disproportionality signal for cutaneous squamous cell carcinoma that persists
  against a comparator of other basal-cell-carcinoma drugs. On the one axis where
  human data exist, the cancer signal belongs to hedgehog suppression. This is
  hypothesis-generating pharmacovigilance and it does not establish that an
  agonist is safe; it establishes that the intuitive direction of concern is not
  the one the human data show.

  SIXTH, AND THE PART THAT CHANGES THE PROTOCOL: THE EXIT. R375 argued that a
  Smoothened agonist cannot self-limit because PTCH1 is a Gli target and the drug
  acts below it. cohen2015 shows that is too strong. Quantifying Shh signalling in
  the neural tube, Gli transcriptional activity first rises and then FALLS while
  the ligand gradient is still rising, and three mechanisms drive that adaptation:
  transcriptional upregulation of PTCH1, transcriptional downregulation of Gli,
  and differential stability of active versus inactive Gli isoforms. Decisively,
  adaptation CONTINUES when the pathway is stimulated downstream of PTCH1 - the
  Gli-level arms are not bypassed by acting at Smoothened. It is cell-type
  dependent: in NIH/3T3 fibroblasts, Shh-induced upregulation of Gli2 transcription
  prevents adaptation despite PTCH1 rising. trompet2024 observed exactly this in
  the relevant cells, reporting hedgehog pathway downregulation in sorted
  SAG-treated stem cells and calling it internal compensation.

  Compose that with two facts this atlas already holds and a specific prediction
  follows. HHIP is itself a Gli target (chuang1999), so agonist exposure INDUCES
  HHIP transcription; and Smoothened activation simultaneously drives HHIP protein
  internalisation and degradation (kwong2014). Stopping the drug removes the
  degradation arm instantly while the induced transcript persists. The predicted
  state on abrupt withdrawal is therefore elevated PTCH1, a surge of HHIP protein
  and downregulated Gli2 - a REBOUND TROUGH of hedgehog output below the
  pre-treatment baseline. That matters here and almost nowhere else, because
  newton2019 showed six doses of a Smoothened antagonist FUSED a normal growth
  plate. The dangerous moment on this protocol is predicted to be the stop, not
  the dosing.

  The counterweight is empirical and real: trompet2024's local bead had no Gli1
  signal left by three weeks and the length gain kept widening to six months, so
  no catastrophic post-pulse collapse followed a local pulse. But that is one
  local depot at one site, and the systemic route exposes every plate including
  the trunk.

  THE FIX IS FREE AND IT IS A TAPER. Rather than eleven doses at a fixed
  every-other-day interval followed by an abrupt stop, hold the every-other-day
  interval for the first two weeks and then lengthen it - one dose at 72 hours,
  then one at 96 hours - so that PTCH1 and HHIP induction decay while residual
  agonist is still present, and the system is walked down rather than dropped.
  Total drug is slightly lower, not higher. And liu2026gorlin supports the
  intermittent principle from the opposite pharmacology in humans: two Gorlin
  syndrome relatives on sonidegib, one daily and one every other day, both
  regressed their lesions, and only the daily arm developed dysgeusia and
  alopecia.

  Adaptation also bounds the pulse length from above. If Gli output declines with
  time under sustained stimulation, a longer pulse buys progressively less, which
  is an independent reason - alongside orikasa2024's conversion result - not to
  extend beyond about three weeks.
quantitative:
  - parameter: character of the intestinal finding under systemic SAG
    value: increased thickness of the SMOOTH MUSCLE layer, in 6.1 percent of treated animals, in both Ihh cko and Ihh flox/flox groups
    unit: histological description and percent incidence
    species: mouse
    source_ref: li2021
    note: >-
      from the discussion of the full text, not the abstract. The authors name
      bowel obstruction as the concern and call for dedicated toxicity work on
      intestinal tissue and function. It is mesenchymal, not epithelial, and it is
      a drug effect rather than a model effect because it appeared in both genotypes
  - parameter: effect of REMOVING gut hedgehog on the colonic epithelium
    value: >-
      increased epithelial proliferation, lengthening and multiplication of crypts;
      in an Apc-mutant adenoma model, increased hyperproliferation and increased
      Lgr5-positive stem cell accumulation
    unit: qualitative direction
    species: mouse
    source_ref: westendorp2021
    note: >-
      the direction that matters for a systemic agonist - more hedgehog restrains
      the colonic crypt. Hedgehog in gut is paracrine epithelium-to-mesenchyme, so
      the colonic epithelium is not the receiving cell
  - parameter: segment specificity of hedgehog-gain tumorigenesis in the gastrointestinal tract
    value: >-
      tumorigenesis in stomach and gastroesophageal junction from Col1a2-, Pdgfra-
      or Gli1-marked stroma; NOT in small or large intestine
    unit: qualitative, by anatomical segment
    species: mouse
    source_ref: li2026stromalhh
    note: >-
      mechanism is the segment difference itself - hedgehog raises BMP antagonists
      in gastric but not colonic stroma, which then activate Wnt in gastric stem
      cells. Human counterpart is the GLI1-altered gastric mesenchymal tumour class
  - parameter: hedgehog pathway adaptation under sustained stimulation
    value: >-
      Gli transcriptional activity rises then falls while ligand amplitude is still
      rising; adaptation continues when the pathway is stimulated DOWNSTREAM of PTCH1
    unit: qualitative dynamics
    species: mouse
    source_ref: cohen2015
    note: >-
      three mechanisms - PTCH1 upregulation, Gli transcriptional downregulation,
      differential Gli isoform stability. Corrects R375's claim that a Smoothened
      agonist cannot self-limit. Cell-type dependent: NIH/3T3 do not adapt because
      Gli2 transcription is induced
  - parameter: human schedule comparison for a Smoothened-directed drug
    value: >-
      sonidegib 200 mg once daily versus 200 mg every other day, 6 months - both
      regressed lesions; dysgeusia and alopecia only on the daily arm
    unit: qualitative, n=2
    species: human
    source_ref: liu2026gorlin
    note: >-
      opposite pharmacology (antagonist), so it carries nothing about agonist
      efficacy. What it supports is that intermittent dosing at Smoothened can keep
      the on-target effect and shed the on-target toxicity - the same schedule
      li2021 used from the agonist side
localization: >-
  gastrointestinal mesenchyme and smooth muscle (the liability), colonic epithelium
  and stroma (protective direction), gastric stroma (the segment-specific tumour
  risk), and the growth-plate resting zone (where the withdrawal trough would matter)
human_evidence: indirect
human_evidence_note: >-
  No Smoothened agonist has been given to a human by any route, so there is no
  direct human safety data on the agonist direction. The human evidence here is of
  three indirect kinds: the pharmacovigilance profile of the marketed ANTAGONISTS
  (zheng2025faers), which describes the loss-of-hedgehog phenotype and carries a
  squamous-cell-carcinoma signal; the recognised human class of GLI1-altered
  GASTRIC MESENCHYMAL tumours, which localises hedgehog-gain oncogenesis in the
  gut to the stomach and to mesenchyme; and a two-person schedule comparison on an
  antagonist (liu2026gorlin).
species_basis:
  - mouse
  - human
translation_risk: high
translation_risk_reason: >-
  The GI toxicity observation is a single mouse study at n small enough that 6.1
  percent is a handful of animals, in a developmental window with no adult
  equivalent, and it was not characterised beyond a histological description. The
  segment-specificity result is genetic activation in specific stromal lineages,
  which is not the same perturbation as a systemic agonist. The adaptation result
  is from neural tube and fibroblasts, not cartilage, and the rebound trough is a
  composed prediction rather than a measurement - nobody has measured hedgehog
  output at a growth plate after withdrawal of an agonist in any species.
confidence: C
claim_grades:
  - claim: >-
      The intestinal finding under systemic SAG is smooth muscle layer thickening
      with a risk of bowel obstruction, not epithelial or neoplastic disease
    grade: B
    basis: stated in li2021's full text; single study, mouse, histology only
  - claim: >-
      Removing hedgehog from the gut drives colonic crypt hyperproliferation,
      Lgr5-positive stem cell accumulation and worse Apc-driven adenoma
    grade: B
    basis: westendorp2021, mouse conditional genetics with a tumour model
  - claim: >-
      Hedgehog-gain tumorigenesis in the gastrointestinal tract is specific to
      stomach and gastroesophageal junction and spares small and large intestine
    grade: B
    basis: >-
      li2026stromalhh, five Cre lines with lineage tracing and a stated mechanism;
      corroborated in humans only by the existence of a GLI1-altered gastric
      mesenchymal tumour class, which is association not causation
  - claim: >-
      A Smoothened agonist self-limits through Gli-level adaptation despite acting
      below PTCH1
    grade: B
    basis: >-
      cohen2015 states adaptation continues on downstream stimulation; corroborated
      in the relevant cell type by trompet2024's observed pathway downregulation in
      sorted SAG-treated stem cells. Different tissue from cartilage
  - claim: >-
      Abrupt withdrawal produces a rebound trough of hedgehog output below baseline
    grade: E
    basis: >-
      composed from cohen2015 (PTCH1 up, Gli2 down), chuang1999 (HHIP is a Gli
      target) and kwong2014 (Smoothened activation degrades HHIP protein). It is an
      inference and has never been measured. The one empirical counterweight is
      trompet2024, whose local gain kept widening for six months after the signal
      had gone
  - claim: >-
      A tapered exit is safer than an abrupt stop on this protocol
    grade: E
    basis: >-
      follows from the rebound prediction above plus newton2019's demonstration that
      six antagonist doses fuse a normal plate. Free to do, no cost in drug, and
      untested in any species
key_refs:
  - ref_id: li2021
    year: 2021
    type: primary
    role: >-
      the source of the GI liability, and its full text is what reclassifies it -
      smooth muscle layer thickening with a bowel-obstruction concern, in both
      genotypes, from a paper whose abstract says only that stature was corrected
      without evidence of toxicity
  - ref_id: westendorp2021
    year: 2021
    type: primary_abstract_only
    role: >-
      the inversion - loss of gut hedgehog drives colonic crypt hyperproliferation,
      Lgr5-positive stem cell accumulation and worse Apc-driven adenoma, so the
      agonist direction is restraining in the colorectal epithelium
  - ref_id: westendorp2018
    year: 2018
    type: primary_abstract_only
    role: >-
      the second colorectal line and the compartment fact the whole argument rests
      on - hedgehog in the gut is paracrine, the receptor is in the mesenchyme only,
      and epithelial Ihh suppresses a stromal-driven intestinal immune response
  - ref_id: li2026stromalhh
    year: 2026
    type: primary_abstract_only
    role: >-
      the segment specificity - hedgehog activation in gut stroma transforms the
      stomach and gastroesophageal junction and not the small or large intestine,
      with BMP antagonist production as the stated mechanistic difference
  - ref_id: cohen2015
    year: 2015
    type: primary_abstract_only
    role: >-
      the exit biology, and a correction to R375 - the pathway adapts by
      upregulating PTCH1, downregulating Gli and shifting Gli isoform stability, and
      adaptation continues when stimulation is applied below PTCH1
  - ref_id: chuang1999
    year: 1999
    type: primary
    role: >-
      the first half of the withdrawal prediction - HHIP is a Gli target, so agonist
      exposure induces transcription of the brake
  - ref_id: kwong2014
    year: 2014
    type: primary
    role: >-
      the second half - Smoothened activation drives HHIP protein internalisation
      and degradation, so stopping the drug removes the degradation arm while the
      induced transcript persists
  - ref_id: newton2019
    year: 2019
    type: primary
    role: >-
      why the trough would matter at all - six doses of a Smoothened antagonist at
      P31 to P34 reduced resting-zone clonal size and FUSED a normal growth plate
  - ref_id: liu2026gorlin
    year: 2026
    type: primary_abstract_only
    role: >-
      the human schedule datapoint, from the opposite pharmacology - every-other-day
      sonidegib kept the effect and lost the toxicity that daily dosing produced
  - ref_id: zheng2025faers
    year: 2025
    type: primary_abstract_only
    role: >-
      the human loss-of-hedgehog phenotype at scale, and the inversion that the
      cancer signal in human pharmacovigilance attaches to hedgehog SUPPRESSION
  - ref_id: das2013
    year: 2013
    type: primary_abstract_only
    role: >-
      the only precedent for a single systemic hedgehog input producing a lasting
      anatomical correction - and the reference whose dose figure li2021 quotes and
      this atlas could not verify
  - ref_id: trompet2024
    year: 2024
    type: primary
    role: >-
      the empirical counterweight to the rebound prediction, and the observation of
      pathway downregulation in sorted SAG-treated stem cells that adaptation explains
