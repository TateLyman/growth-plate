- human
translation_risk: not_applicable
translation_risk_reason: A methods and bookkeeping node recording what a literature screen found and why
  it failed, not a biological claim.
confidence: B
claim_grades:
- claim: The dexamethasone yield can be computed from published data.
  grade: X
  basis: 'NO. schrier2006 has the resting-zone cell count but no growth rate and no terminal cell size -
    which the atlas own round-26 document had already noted. gafni2001 has the growth rate and the terminal
    cell size but reports the resting zone as a HEIGHT. They are different experiments, so the terms cannot
    be combined, and substituting height for count fails hardest on dexamethasone specifically because
    schrier2006 shows it RAISES resting-zone cell number (P = 0.016) without a matching height change.'
- claim: Most of the growth-plate literature could yield a yield if someone divided.
  grade: X
  basis: 'THIS WAS THE ROUND-176 CLAIM AND THE SCREEN CORRECTS IT. The optimistic version said three
    measurements suffice and many papers report all three. In practice the field reports the resting zone
    as a HEIGHT IN MICROMETRES, not a cell count - two of the five most relevant papers examined here do
    exactly that. The numerator is widely available; the denominator almost never is.'
- claim: Growth rate divided by terminal hypertrophic cell height is a valid measure of cell production
    per column.
  grade: A
  basis: 'It is the standard construction of the classical cell-kinetics literature and gafni2001 names it
    explicitly as "the method of Kember and Sissons". kember1976 uses it for the human number. This atlas
    arrived at it independently in round 174 and should record that it is standard rather than novel - what
    is novel is dividing by a resting-zone denominator.'
- claim: Five weeks of growth inhibition delays growth plate senescence by about three weeks.
  grade: C
  basis: 'gafni2001 measured the right-shift of the senescent curves directly, at P<0.001 for growth plate
    and hypertrophic zone heights and P<0.005 for proliferative zone, with 88 per cent of control plates
    fused at 16 weeks against 14 per cent of treated. C not B because it is one experiment in one species
    and the shift is read from curve fitting rather than from a single measured interval.'
- claim: Transient growth inhibition nets more final length than uninhibited growth.
  grade: E
  basis: 'THE EXPERIMENT THAT WOULD ANSWER THIS WAS TWO-THIRDS RUN AND STOPPED. gafni2001 shows the femoral
    deficit falling from 17.4 mm to 1.6 mm while the treated plates remained overwhelmingly unfused and the
    controls had closed - so growth was still running in one arm and finished in the other when the study
    ended at 16 weeks of recovery. The sign of the final difference is unmeasured. This is the same
    question as g_l2_cycling_the_progenitor_pool and gafni2001 is much closer to answering it than a
    feeding experiment would be.'
