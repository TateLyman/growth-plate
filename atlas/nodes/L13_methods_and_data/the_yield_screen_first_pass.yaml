contradicts:
- 'CORRECTS the round-176 optimism in the_first_yield_under_a_drug, which claimed that three measurements
  suffice and that many published papers report all three. The numerator is common; the DENOMINATOR - a
  resting-zone cell count - is rare, and its absence is why the first pass of the screen returned no new
  yield for any agent.'
