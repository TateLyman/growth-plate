id: the_yield_screen_first_pass
name: THE YIELD SCREEN, FIRST PASS - dexamethasone does not compute, and the reason is structural - the
  field measures resting-zone HEIGHT and a yield needs resting-zone CELLS
aliases:
- yield screen
- can dexamethasone yield be computed
- why the yield is uncomputable
- resting zone height versus cell count
- gafni2001 three week right shift
- round 177
type: method
layer: L13
stub: false
summary: 'THE SCREEN WAS OPENED TO FIND AN AGENT THAT RAISES AMPLIFICATION, WITH DEXAMETHASONE AS THE
  PRIORITY TARGET BECAUSE schrier2006 SHOWS IT MOVES THE EXCHANGE RATE OPPOSITE TO OESTROGEN. IT DOES NOT
  COMPUTE, AND THE REASON IS WORTH MORE THAN THE ANSWER WOULD HAVE BEEN.

  THE STRUCTURAL FINDING. A yield needs a numerator in bone or cells and a DENOMINATOR IN RESTING-ZONE
  CELLS. Almost the entire field reports the resting zone as a HEIGHT IN MICROMETRES, not as a count.
  gafni2001 measures resting-zone height, proliferative-zone height, hypertrophic-zone height, terminal
  hypertrophic cell height and growth rate - everything except the one quantity the denominator needs.
  weise2001 measures growth rate, proliferative and hypertrophic cells per column, terminal hypertrophic
  cell height, column density and BrdU index by cell position - and treats the resting zone only as the
  anatomical landmark from which cell position 1 is counted. NEITHER PAPER COUNTS A RESTING-ZONE CELL. The
  three datasets that do - lui2018, schrier2006 and nilsson2014 - are the three the atlas has already used,
  and that is not a coincidence.

  AND DEXAMETHASONE IS THE WORST POSSIBLE AGENT TO SUBSTITUTE HEIGHT FOR COUNT ON. It would be tempting to
  use gafni2001''s resting-zone HEIGHT as a proxy denominator. That is invalid HERE SPECIFICALLY, because
  schrier2006 measured what dexamethasone does to the two quantities separately: it RAISED resting-zone
  cell NUMBER (P = 0.016) while lowering the labelling index. An agent that changes cell number without a
  matching change in zone height has changed the cell DENSITY, and a height-based denominator would then
  be wrong by exactly the amount of the effect being measured. The substitution fails hardest on the agent
  it was wanted for.

  WHAT THE SCREEN RETURNED INSTEAD, AND IT IS BIGGER. kember1976 gives the HUMAN ANCHOR - see
  the_human_anchor_for_yield. The decomposition holds in man at 88 per cent, terminal cell height is
  conserved across three species, and the human proliferative cycle is 20 days against 2 in rodent.

  A METHODOLOGICAL VALIDATION THIS ATLAS DID NOT KNOW IT HAD. Round 174 computed cell production per
  column as GROWTH RATE DIVIDED BY TERMINAL HYPERTROPHIC CELL HEIGHT, treating it as an obvious
  construction. gafni2001 uses precisely that and names it: "proliferation rate (new cells per chondrocyte
  column per day) was assessed by dividing the growth rate by the height of the terminal hypertrophic cell
  according to the method of Kember and Sissons". It is the standard construction of the classical cell-
  kinetics literature, it is the same method kember1976 used for the human number, and this atlas
  reinvented it. The round-174 and round-176 tools are therefore not novel arithmetic - they are the
  standard method with a resting-zone denominator bolted on, which IS the novel part.

  AND ONE RESULT IN gafni2001 IS THE BEST DURATION EVIDENCE IN THE ATLAS AND IS INCOMPLETELY EXPLOITED.
  Five weeks of dexamethasone in young rabbits, then sixteen weeks of recovery. The senescent curves for
  growth plate height, hypertrophic zone and proliferative zone were RIGHT-SHIFTED relative to controls
  (P < 0.001, P < 0.001, P < 0.005) AND THE MAGNITUDE OF THE SHIFT WAS APPROXIMATELY THREE WEEKS. At
  sixteen weeks of recovery, 88 PER CENT OF CONTROL DISTAL FEMORAL PLATES HAD FUSED AGAINST 14 PER CENT OF
  THE TREATED ONES. The femoral length deficit at the end of the arrest was 17.4 mm and had fallen to 1.6
  mm by the end of recovery. So: five weeks of growth inhibition bought three weeks of senescence delay,
  left the plates overwhelmingly still open when controls had closed, and cost 1.6 mm at the last
  measurement - WITH GROWTH STILL RUNNING IN THE TREATED ANIMALS AND THE STUDY ENDING THERE. THE
  EXPERIMENT WAS NOT FOLLOWED TO FINAL LENGTH. Whether the treated animals ultimately overtook controls is
  the single most valuable unmeasured endpoint on the duration arm, and the experiment was two-thirds run.

  THE SCREEN CONTINUES WITH A SHARPER INCLUSION CRITERION. Do not search for agents; search for the
  DENOMINATOR. Any study reporting resting-zone CELL COUNTS alongside a growth rate is a computable yield
  regardless of what it was testing, and studies reporting resting-zone height are not, regardless of how
  relevant their agent is.'
