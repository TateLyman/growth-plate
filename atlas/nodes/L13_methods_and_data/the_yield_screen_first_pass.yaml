  literature'
human_evidence: indirect
human_evidence_note: 'This is a methods node about what the literature measures. Its human content is the
  observation that kember1976, the one human dataset with the numerator terms, also reports the resting
  zone as a WIDTH - so the human yield fails for exactly the same structural reason as the animal ones.'
