id: round412_the_blind_spots_cluster_into_three_zonal_programmes_and_the_hypertrophic_one_is_new
name: "R412: the 1,492 blind spots cluster into THREE replicated zonal programmes - a 76-gene HYPERTROPHIC-ZONE programme with zero atlas coverage whose top member PANX3 rises 180-fold and has a cryo-EM structure, a 46-gene reserve programme, and a 17-gene proliferative one - plus a self-correction to R366's antifungal advice"
aliases:
  - blind spot zonal programmes
  - PANX3 growth plate
  - PPA1 pyrophosphatase growth plate
  - ARSI hypertrophic sulfatase
  - terbinafine SQLE cartilage
type: method
layer: L13
stub: false
summary: >-
  R411 produced 1,492 genes that are cartilage-enriched and abundant in the human growth plate
  and have never been mentioned anywhere in this atlas. A flat list of 1,492 is not usable, and
  R411's own negative control showed a large fraction is mitochondrial and ribosomal
  housekeeping. The separator is SHAPE: a programme turns on or off at a point along the column;
  housekeeping is flat. So each blind-spot gene was given its zonal profile from GSE9160 - the
  only zone-resolved human growth plate - with the perichondrium excluded (CORR-339), a
  detection floor well above the array's own floor calibrator, one auditable probe set per gene,
  and the requirement that BOTH DONORS AGREE IN DIRECTION at 1.5-fold or more.
  Tool: atlas/tools/round412_blind_spot_zonal_clustering.py. Data: atlas/data/round412/.

  ⭐ THE RESULT. 1,298 of the 1,492 have a usable profile, and 139 of those fall into three
  replicated shapes: 76 HZ_RISING, 46 RZ_FALLING, 17 MID_PEAK. Everything else is flat and drops
  out, which is the housekeeping control working. ⭐ THE METHOD DOES WHAT IT WAS BUILT TO DO -
  it returns PROGRAMMES rather than genes, and a programme is what a missing arm looks like.

  ⭐⭐ THE HYPERTROPHIC PROGRAMME IS THE PRIZE, BECAUSE h_term IS MADE THERE AND IT IS ROUGHLY
  80 PERCENT OF LONGITUDINAL GROWTH. Top members, by log2 hypertrophic-over-reserve, with donor
  1 values:
  · ARSI +5.11 - an ARYLSULFATASE, reserve 23 rising to hypertrophic 6,820, a ~300-fold rise
  · PANX3 +4.87 - PANNEXIN 3, reserve 223 to hypertrophic 40,113, ~180-fold, at COL2A1-scale
    abundance in the hypertrophic zone
  · SLC18A2 +4.77 · SCIN +4.48 · F13A1 +3.94 (factor XIII-A transglutaminase, 546 to 21,494)
  · SLC44A2 +3.18 · PPA1 +3.08 - INORGANIC PYROPHOSPHATASE, 1,330 to 21,144
  · SQLE +2.63 - squalene epoxidase, cholesterol synthesis, 566 to 8,754
  · PCOLCE2 +2.35 (609 CPM) · CAPN6 +2.22 · SLC30A1 +2.13 (a ZINC EXPORTER) · CSPG4 +1.71
    (927 CPM) · TMEM45A · RCN1 · CD24 · OSTC · TUBB2A/2B

  ⭐⭐ PANX3 IS THE STANDOUT AND IT IS A CHANNEL. Pannexin 3 is a large-pore channel, 7.6x
  cartilage-enriched, rising ~180-fold into the zone that makes height, at an abundance
  comparable to the tissue's own collagen - and this atlas has never said the word. It is not
  obscure: a cryo-EM structure of the human channel was published in 2025, knockout mice exist,
  and the skeletal literature on it is active (knee osteoarthritis and disc degeneration after
  forced running, severe osteoarthritis in aged nulls, impaired fracture healing, and noncoding
  PANX3 variants associated with chronic back pain).
  ⚠ AND THE DIRECTION LOOKS WRONG FOR A LEVER, WHICH IS WHY IT IS RECORDED RATHER THAN
  PROMOTED. IMPC Panx3 homozygote BODY LENGTH is -1.358 at P=0.055 (n=7m/6f) - trending SHORTER,
  which is the common direction under CORR-329 and underpowered, but it is the largest and most
  nearly significant length row in the whole programme. Loss shortening means the direction of
  interest is preservation or activation, and every pannexin agent in existence is a BLOCKER
  (probenecid, carbenoxolone, the 10Panx peptide). That is R342's shape again: the shelf exists
  and points the wrong way.
  ⛔ WHAT IS STILL OWED: Europe PMC returned 503 during this round, so PANX3's growth-plate
  MECHANISM abstracts were not extracted. The titles establish that the field exists and that
  its endpoints are osteoarthritis, disc, fracture and pain - not bone length. The mechanism read
  is the immediate next step and is recorded as such rather than guessed.

  ⭐ THREE MORE MEMBERS THAT EACH TOUCH SOMETHING THIS FILE ALREADY WORKS.
  · PPA1, inorganic pyrophosphatase, rising 16-fold into the hypertrophic zone with ZERO atlas
    coverage - while ALPL, ENPP1 and ANKH, the other three nodes of pyrophosphate control, all
    have coverage. Pyrophosphate is THE inhibitor of hydroxyapatite formation and mineralisation
    at the chondro-osseous junction is the discharge step, so a 16-fold induction of the enzyme
    that destroys it is a control point the atlas has an incomplete map of.
  · ARSI, a sulfatase rising ~300-fold into the hypertrophic zone, QUALIFIES R410. R410 wrote
    that the plate is built to ADD charge and not to remove it, on the basis that ARSB, SULF1 and
    SULF2 are all contaminant-leaning. ARSI was not in that panel and it is the single steepest
    riser in this programme. Whether ARSI acts on chondroitin sulfate is not established here -
    a 2026 paper reporting arylsulfatase L as a Golgi chondroitin sulfatase makes the question
    live rather than settled.
  · SLC30A1, a zinc exporter, sits in this programme, and R411's inventory separately returned
    MT1X and MT1E, the metallothioneins, at 665 and 604 CPM and 17.9x and 13.7x. Zinc handling
    is therefore a candidate cluster across two independent screens, and zinc deficiency is a
    recognised cause of short stature. No zinc gene has ever appeared in this atlas.

  ⛔ A SELF-CORRECTION TO R366's OWN ADVICE, FOUND IN THIS PROGRAMME. R366 recommended
  TERBINAFINE as the safe oral antifungal, because itraconazole and posaconazole are Smoothened
  antagonists at ordinary antifungal exposure. Terbinafine's target is SQUALENE EPOXIDASE, and
  SQLE is in this hypertrophic programme - cartilage-enriched at the benchmark and rising
  15-fold from reserve to hypertrophic zone. R375 established that CHOLESTEROL is Smoothened's
  endogenous agonist at the cysteine-rich domain. So terbinafine inhibits, in the hypertrophic
  zone specifically, an enzyme of the pathway that makes the sterol the receptor needs.
  ⚠ Grade E - no bone, growth-plate or height endpoint exists for terbinafine in any species,
  local cholesterol is largely taken up rather than synthesised, and 2.0x is barely above the
  1.96 benchmark. It does NOT reverse R366: itraconazole and posaconazole have direct Smoothened
  pharmacology at clinical exposure and terbinafine has none. What it does is remove terbinafine's
  status as unambiguously clean and promote FLUCONAZOLE, which has no target in this tissue at
  all, to the preferred substitution.

  ⭐ THE OTHER TWO PROGRAMMES, RECORDED SO THEY ARE NOT REDISCOVERED ONE GENE AT A TIME.
  RESERVE (RZ_FALLING, 46): SLC14A1 -4.60 (a UREA TRANSPORTER, i.e. an osmolyte channel, falling
  24-fold out of the reserve zone) · OGN -3.03 · NPDC1 -2.80 · CRIP2 · SSPN · SERPINA3 ·
  PAX1 -1.60 (a sclerotome and AXIAL identity transcription factor, in the trunk-relevant
  direction) · TM4SF1 · PCGF2 (polycomb) · GAS6 · TRIP6.
  PROLIFERATIVE (MID_PEAK, 17): MIF (1,081 CPM) · PRDX4 · EPYC (epiphycan, named for the
  epiphysis) · HMGB2 · SNAI2 · MUC1 · CHST6 (a keratan-sulfate 6-O-sulfotransferase, peaking in
  the proliferative zone exactly as CHST11 does, which extends R410's zonal partition of the
  sulfotransferases) · TYMS.

  ⛔ THE LIMITS, WHICH ARE SEVERE AND APPLY TO EVERY ROW. NOT ONE gene in any of the three
  programmes is among kosmicki2026's 207, so none has a human effect size. Most have NO IMPC
  length row at all (ARSI, SLC30A1, PCOLCE2, CAPN6, OGN, PAX1, EPYC, SLC14A1 - CORR-348 case
  one, never phenotyped rather than measured null), and the ones that do are null or
  underpowered. The replication is n = 2 donors who are one female and one male, which CORR-317
  says is never a replicate pair - weaker for absolute level than for shape, since each donor is
  its own baseline, but not nothing. And everything here is transcript abundance, not protein,
  activity or flux.
  ⭐ WHAT THE ROUND DELIVERS IS NOT A LEVER. It is the demonstration that the inverse search
  returns COHERENT PROGRAMMES rather than scattered genes, three named programmes archived for
  mining, one channel worth a mechanism read, one control point (PPA1) whose neighbours are all
  already covered, one qualification of R410, and one correction to R366's own substitution.
