  No member has a human effect size, most have no mouse length endpoint at all, and the one
  informative row runs in the load-bearing direction with only blockers available.
confidence: B
claim_grades:
  - claim: The blind-spot list contains three zonal programmes that replicate across both donors
    grade: B
    basis: >-
      139 of 1,298 profiled genes pass a two-donor concordance filter at 1.5-fold; the flat
      majority drops out, which is the intended housekeeping control. n = 2 donors, CORR-317
  - claim: PANX3 rises about 180-fold into the hypertrophic zone and has zero atlas coverage
    grade: B
    basis: >-
      both donors, one auditable probe set, against the array's own floor calibrator; and a
      word-boundary count of zero across the whole graph
  - claim: PANX3 is a lever
    grade: E
    basis: >-
      not supported. Mouse loss trends shorter, its published endpoints are osteoarthritis, disc,
      fracture and pain rather than length, and only blockers exist. The growth-plate mechanism
      literature was not extracted this round because Europe PMC was unavailable
  - claim: PPA1 is an uncovered node of pyrophosphate control at the discharge step
    grade: C
    basis: >-
      a 16-fold induction into the hypertrophic zone with zero coverage, while ALPL, ENPP1 and
      ANKH are covered. Positional, not functional - no PPA1 perturbation exists in cartilage
  - claim: ARSI qualifies R410's statement that the plate only adds charge
    grade: C
    basis: >-
      the steepest riser in the programme is an arylsulfatase, and R410's panel did not contain
      it. Whether ARSI acts on chondroitin sulfate is not established here
  - claim: Terbinafine is no longer unambiguously the clean antifungal choice
    grade: E
    basis: >-
      its target SQLE is at the enrichment benchmark and rises 15-fold into the hypertrophic zone,
      and cholesterol is Smoothened's endogenous agonist. Mechanistic only - no skeletal endpoint
      for terbinafine in any species, and local cholesterol is largely taken up rather than made
