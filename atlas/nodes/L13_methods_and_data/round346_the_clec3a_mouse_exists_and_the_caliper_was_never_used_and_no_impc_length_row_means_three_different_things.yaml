human_evidence_note: This round is entirely mouse resource data. The human anchor for CLEC3A (+1.52 cm, P=1.2e-43,
  4,160 carriers) and for HHIP (+9.92 cm) and TET1 (+7.95 cm) is recorded in R345, R285 and R334.
