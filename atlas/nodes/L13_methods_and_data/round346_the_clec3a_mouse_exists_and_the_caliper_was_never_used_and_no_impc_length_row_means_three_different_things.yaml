confidence: B
claim_grades:
- claim: The Clec3a-null mouse exists, is orderable, and body length was never measured in it.
  grade: A
  basis: MGI:6357989, strain C57BL/6NJ-Clec3a<em1(IMPC)J>/Mmjax, IMPC colony JR34222, phenotyped at JAX across
    145 parameters read directly from statistical-results-ALL.csv.gz, with no length parameter and no radiography
    procedure present. The allele string is a clean single-gene homozygous null (CORR-341 checked).
- claim: My earlier inference that the missing length row was a null result was wrong.
  grade: A
  basis: Recorded because it was made in this session. Seeing six MGI terms without a length term, I inferred
    IMPC had measured length and found nothing. The raw file shows length was never measured, so no result
    existed to report or suppress.
- claim: '"No IMPC length row" is not evidence of a null.'
  grade: A
  basis: Demonstrated on the atlas's own targets - Stc2, Chad, Nrk, Scube3, Amd1 and Ihh have no IMPC rows
    at all; Clec3a, Loxl2 and Pappa were phenotyped on 145, 116 and 30 parameters respectively without length
    among them; only Hhip and Tet1 had length measured. R333's reading of the missing Loxl2 length row needs
    restating on this basis.
- claim: Clec3a-null males gain bone mineral density and lean mass and lose fat.
  grade: B
  basis: Male lean mass +2.32 g at p=4.6e-08, fat mass -2.46 g at p=2.7e-08 and BMD +0.0032 at p=3.9e-06,
    all clearing a Bonferroni threshold of 3.4e-04 across the 145 measured parameters, with the female arm
    null throughout. Graded B not A because n is 8 per sex, the sex-specificity is unexplained, and areal
    DXA BMD cannot be separated from a body-size effect without the length measurement that is missing.
- claim: This is the only candidate in the file whose bone term points the right way.
  grade: C
  basis: SPIN4 carries BHI -2.34 and TBLH BMD Z -3.29 in the human proband; the ERalpha-null humans reach
    spine Z -3.85 to -5.6; the aromatase-inhibitor arm spends lumbar BMD in both arms of zegarra2024; Tnks-null
    mice lose BMD -1.749 and bone area -1.817. Clec3a-null males gain BMD. Graded C because it is a comparison
    across heterogeneous measurements in different species rather than a head-to-head.
- claim: Hhip heterozygous mice have increased body length.
  grade: C
  basis: 'Male effect +0.228 at p=0.00346, n=10, in the rare positive direction for this dataset. Not higher
    than C because the combined-sex test is null at p=0.588, the female arm is null, and IMPC sex-specific
    calls are exploratory. Its value is that it is HETEROZYGOUS - matching the human pLoF architecture - where
    the atlas''s existing mouse evidence (haraguchi2025) is a limb-restricted homozygous conditional.'
- claim: This produces a compound.
  grade: X
  basis: It does not. CLEC3A has zero chemical matter on a proper ChEMBL query, tranexamic acid was disqualified
    in R345 on a characterised endothelin-receptor off-target that raises MMP13, and the plasmin-versus-PI3K-AKT
    contradiction in the CLEC3A mechanism literature is untouched by a body-composition phenotype. What this
    round delivers is a validation route that can be bought rather than proposed.
