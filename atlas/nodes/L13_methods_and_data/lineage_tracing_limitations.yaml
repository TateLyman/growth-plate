human_evidence: absent
human_evidence_note: No human in vivo clonal fate data exist; the nearest human data are xenograft
  barcode experiments that measure potency, not native fate.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: Clonal architecture is exactly the property that differs between a lifelong-open
  murine plate and a fusing human plate, so transferring murine clonal dynamics is transferring the
  property most likely to diverge.
confidence: A
