reanalysis_observations:
- observation: Re-analysis of GSE9160 shows the two donors' laser captures are not of equal quality. COL10A1,
    which defines the hypertrophic zone, sits at 0.6% of its hypertrophic-zone level in donor 1's resting-zone
    sample and at 15-36% in donor 2's. Genome-wide, 9.6% of donor 1's probe sets detected in all four
    zones vary more than five-fold across the zonal axis, against 1.0% of donor 2's; median fold range
    2.32 vs 1.66, 99th percentile 12.26 vs 4.99.
  interpretation: 'The only publicly deposited zone-resolved human growth-plate transcriptome is, for
    zonal-contrast purposes, effectively n=1. Zonal claims drawn from this series that pool the two donors
    are diluted. Detection is unaffected and runs the other way: donor 2''s arrays are the more sensitive
    and account for 87% of one-donor calls genome-wide, so a both-donor NON-detection is the strongest
    inference this dataset supports.'
  caveats: The deposit carries no accompanying publication, so this was never available to peer review.
    The diagnostic is a within-dataset comparison and does not generalise to LCM as a method.
  reanalysis: p8_01_gse9160_human_zonal
  source_ref: gse9160
  species: human
  grade: D
  date: '2026-08-05'
