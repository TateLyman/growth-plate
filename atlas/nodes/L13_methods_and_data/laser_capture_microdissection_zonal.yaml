claim_grades:
- claim: Zone-resolved human growth plate transcriptomes exist and are public.
  grade: A
  basis: GSE9160 is deposited with raw CEL files.
- claim: Any given transcript detected in GSE9160 is genuinely zone-restricted.
  grade: D
  basis: n=2 donors, morphological boundary assignment and 3prime-biased linear amplification; single-gene
    conclusions need independent confirmation.
