translation_risk: moderate
translation_risk_reason: The physical basis of the bias (cell size, matrix stiffness) is species-general,
  but its magnitude scales with hypertrophic cell volume, which is larger in human and large mammals
  than in mouse.
confidence: D
claim_grades:
- claim: Hypertrophic chondrocytes are large and sit in mineralising matrix.
  grade: A
  basis: Direct stereological measurement in human tissue and in multiple species.
- claim: Hypertrophic chondrocytes are systematically lost in growth plate scRNA-seq.
  grade: E
  basis: Mechanistically compelled by cell size and matrix, and named as a barrier in methodological
    reviews, but never quantified against a histological ground truth.
