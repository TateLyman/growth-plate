  species: human
  source_ref: nilsson2003
  uncertainty: SEM 2%
- parameter: ER-alpha positive chondrocytes, hypertrophic zone, human
  value: '38'
  unit: '% of chondrocytes'
  conditions: same cohort and assay
  species: human
  source_ref: nilsson2003
  uncertainty: SEM 3%
- parameter: androgen receptor positive chondrocytes, resting zone, human
  value: '65'
  unit: '% of chondrocytes'
  conditions: same cohort; proliferative zone 41%, hypertrophic 58%
  species: human
  source_ref: nilsson2003
  uncertainty: SEM 3%
localization:
- 'human RZ: ER-alpha reported positive by nilsson2003 and negative by egerbacher2002 - unresolved'
human_evidence: direct
human_evidence_note: The contradiction is between two human-tissue immunohistochemistry studies,
  so the evidence at issue is human throughout.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: A methodological property of human tissue staining; nothing is transferred
  across species.
confidence: B
claim_grades:
- claim: Human growth plate ER-alpha zonal distribution is reported in mutually exclusive ways by
    two IHC studies.
  grade: A
  basis: Both primary reports read; quantitative gradient in nilsson2003 versus hypertrophic-only
    restriction in egerbacher2002.
- claim: The discrepancy is caused by antibody and decalcification artefact.
  grade: E
  basis: Plausible and consistent with the known chemistry, but not experimentally demonstrated.
