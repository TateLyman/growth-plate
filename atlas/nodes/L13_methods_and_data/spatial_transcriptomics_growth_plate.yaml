localization:
- 'mouse RZ: ApoE identified as a pan-resting-zone marker by spatial transcriptomics'
- 'human RZ: no spatial data of any kind'
human_evidence: absent
human_evidence_note: No spatially resolved transcriptomic dataset from a postnatal human growth plate
  exists in any public repository.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: Every spatially resolved zonal marker claim in the field is murine, and
  the murine plate never fuses, so the zonal programme that terminates growth cannot be observed
  in the species where the data exist.
confidence: A
