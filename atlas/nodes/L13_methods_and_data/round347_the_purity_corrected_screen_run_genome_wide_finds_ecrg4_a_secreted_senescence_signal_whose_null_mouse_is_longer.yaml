    ACTIVELY DESTROYS IT: CYP26A1 20.4 CPM at 18.63x enrichment. RBP4 393.2 at 4.15x, zero atlas coverage.
    BUT THE DIRECTION RUNS THE WRONG WAY ON TWO INDEPENDENT LINES: CYP26B1 pLoF+delmis +0.81 cm P=1.0e-11
    (less RA degradation, i.e. MORE retinoic acid, is TALLER), and IMPC Rbp4 homozygote TIBIA LENGTH -0.999
    P=6.3e-04 (less retinol delivery is SHORTER)'
  unit: CPM; cm per allele; IMPC effect size
