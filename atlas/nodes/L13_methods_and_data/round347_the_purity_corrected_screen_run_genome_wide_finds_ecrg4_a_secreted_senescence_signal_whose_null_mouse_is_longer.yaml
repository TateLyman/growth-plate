id: round347_the_purity_corrected_screen_run_genome_wide_finds_ecrg4_a_secreted_senescence_signal_whose_null_mouse_is_longer
name: 'Round 347 - R344 purity-corrected 72 genes by hand; run genome-wide it returns 301 abundant cartilage-enriched
  genes with ZERO atlas coverage, and the best of them is ECRG4, a secreted furin-cleaved senescence signal
  whose knockout mouse is longer at P=4.45e-07 with normal weight and HIGHER bone density; plus the one-carbon
  axis, which is the obtainable inverse of a hypomethylating agent'
aliases:
- ECRG4 augurin
- genome-wide purity-corrected cartilage enrichment
- the one-carbon axis
- NNMT is the growth plate methyl sink
- the obtainable inverse of decitabine
- carbonic anhydrase contraindication
- HIF is already maximal in the plate
type: dataset
layer: L13
stub: false
summary: 'R344 corrected the flagship human dataset for two mouse samples and 66-fold purity variation, then
  applied the correction to SEVENTY-TWO HAND-PICKED GENES. That correction is what produced CLEC3A in R345,
  which was 11.3x understated. THE SAME CORRECTION HAS NEVER BEEN RUN ON THE OTHER 36,529 GENES. Run
  genome-wide it returns 380 genes at >=50 CPM in pure cartilage and >=3x enriched over the blood-contaminated
  samples, and 301 OF THEM HAD ZERO MENTIONS ANYWHERE IN THIS ATLAS (275 still do - this round names 26).

  ONE - ECRG4 IS THE FINDING, AND IT IS THE FIRST NEW TARGET IN THIS FILE WITH A LENGTH ENDPOINT IN THE RARE
  DIRECTION. ECRG4 (C2orf40, augurin) is 694.6 CPM in pure cartilage against 41.6 in the contaminated samples
  = 16.35x enriched, detected 12/12, and it had ZERO nodes and ZERO references here. IMPC has already
  phenotyped its null: Ecrg4<tm1b(EUCOMM)Hmgu> homozygote, ICS, n=7m/8f, BODY LENGTH +0.950 AT P=4.45e-07.
  Two controls make that specific rather than a bigger mouse: LEAN MASS ns (P=0.157), FAT MASS ns (P=0.086),
  fat/body weight ns, BMC/body weight ns - and BODY LENGTH IS THE SECOND MOST SIGNIFICANT OF ALL 183
  PARAMETERS MEASURED. The rest of its significant rows are haematological and cardiac, unrelated to length.
  CORR-341 applied: single gene, homozygous, no Cre, no double mutant.

  TWO - THE BASE RATE WAS COMPUTED BEFORE THE CLAIM, WHICH IS WHAT CORR-329 DEMANDS, AND IT IS WHY THIS ONE
  COUNTS. Across all 6,817 IMPC Body length rows, 64.1% are negative; among rows at P<0.05 only 24.8% are
  POSITIVE, and at P<1e-4 only 12.8%. ECRG4 +0.950 at P=4.45e-07 RANKS EIGHTH OF THE 367 POSITIVE SIGNIFICANT
  BODY-LENGTH ROWS IN THE ENTIRE CONSORTIUM. That is the rare direction at the top of the rare direction.

  THREE - AND THE BONE COST RUNS THE OTHER WAY FROM EVERY OTHER CANDIDATE. Bone Mineral Density excluding
  skull +0.639, P=3.40e-03 - UP. SPIN4 costs BHI -2.34, the ESR1-null human costs spine Z -3.85 to -5.6, the
  aromatase arm costs lumbar trabecular, Tnks-null costs BMD -1.749. ECRG4 and CLEC3A are the only two
  candidates in this file whose knockouts gain bone density.

  FOUR - WHAT ECRG4 IS, AND WHY THE DIRECTION IS COHERENT. It is a SECRETED precursor cleaved by furin and
  thrombin into augurin peptides (kurabi2022 shows the cleavage and a defined receptor). Per richter2023
  (review, index only) those peptides INHIBIT PROLIFERATION AND MIGRATION, INDUCE SENESCENCE and DECREASE
  TELOMERASE ACTIVITY through NF-kB, p27 and p53. A secreted, cartilage-specific, senescence-inducing
  proliferation brake is exactly the shape of a lever on N - THE POOL TERM, WHICH NOTHING IN THIS STACK
  MOVES. Step 0 is clean: not CNP/cGMP, not FGFR3/ERK/CREB, not GH/IGF-1, not oestrogen. It is R287s LAYER
  again and R314s antibody-tractable class again. Direction is to BLOCK, which is the drugging-favourable
  half.

  FIVE - AND THE HONEST OBJECTIONS, WHICH ARE SEVERE. ZERO CHEMICAL MATTER: no human ChEMBL target record at
  all, same as HHIP, CHAD, SCUBE3, STC2 and CLEC3A. NOT IN kosmicki2026s 207, so there is no human height
  effect size. THE RECEPTORS THAT ARE DESCRIBED ARE INNATE-IMMUNE - the endotoxin receptor complex and
  scavenger receptors - so the CARTILAGE mechanism is entirely unmapped and the published receptor biology
  gives no obvious blockade point at the plate. THE TIBIA ROWS DO NOT AGREE: -1.040 (P=0.681) and -0.863
  (P=0.494), both ns at n=5m/5f. Body length up with tibia flat WOULD point axial, which is the compartment
  R274/R318 say holds the residual - but the tibia arm is underpowered and this is recorded as a hypothesis,
  not a result. And ECRG4 is a tumour suppressor, so blocking it is a two-sided bet, unlike STC2.

  SIX - THE OTHER HALF OF THE ROUND: THE ONE-CARBON AXIS, WHICH IS THE OBTAINABLE INVERSE OF A HYPOMETHYLATING
  AGENT. R342 concluded that the marketed epigenetic pharmacopoeia is an oncology INHIBITOR shelf and that for
  height the usable direction is almost always the other one - which is why an instruction to think at
  decitabine scale keeps returning contraindications. THE MOVE OUT OF THAT DEAD END IS CORR-344s OTHER SHELF:
  substrate donors and cofactors, the shelf that produced this files only obtainable compound (oral sodium
  sulfate). YOU CANNOT BUY A DNMT ACTIVATOR, A KMT2B ACTIVATOR OR AN EZH2 ACTIVATOR. YOU CAN BUY THE METHYL
  GROUP. And the growth plates one-carbon configuration is unusual and was never looked at: NNMT, the major
  SAM-consuming methyltransferase, is 446.2 CPM at 5.51x cartilage enrichment with ZERO atlas coverage, while
  GNMT (the liver SAM buffer) is 0.1 CPM, BHMT is 0.0, and MTR (0.52x) and MTHFR (0.54x) are
  contaminant-leaning. A tissue with a large tissue-specific methyl sink, no SAM buffer and no methionine
  regeneration is a flow-through tissue whose methylation capacity depends on imported substrate.

  SEVEN - THE DIRECTION HAS THREE INDEPENDENT HUMAN-ANCHORED ARMS ALREADY IN THIS FILE, PLUS A MOUSE LENGTH
  ENDPOINT, AND THEY ALL SAY MORE METHYLATION IS TALLER. 5mC: UHRF1 -2.52 cm and UHRF2 -3.10 against TET1
  +7.95 (R343). H3K4me3: writers KMT2B -0.35 and ASH1L -0.41 (R333). PRC2/H3K27me3: R311s maturation screen
  puts Eed +2.654, Ezh2 +1.874 and Suz12 +1.525 as ACCELERATED, so more PRC2 activity DELAYS maturation.
  Length endpoint: yanagihara2025, Dnmt1 deletion in limb mesenchyme SHORTENS long bones, and the new
  mechanism is that reduced methylation DE-REPRESSES ossification and energy-metabolism genes. Raising SAM
  pushes every one of those writers.

  EIGHT - AND THEN THE AXIS FAILS ITS OWN TESTS, WHICH IS WHY IT IS RECORDED AND NOT PROMOTED. (a) THE
  CONCENTRATION GAP IS THE MINOXIDIL PROBLEM AGAIN: hoang2023s chondrocyte effects are at 10-100 ug/mL of SAM
  = roughly 25-250 uM, against a plasma SAM around 100 nM - two to three orders of magnitude, and oral SAMe
  raises plasma SAM only modestly. (b) SAM NEGATIVELY REGULATED PROLIFERATION in those same cells, which is
  the parameter erdafitinib exists to relieve - the identical conflict resveratrol carries. (c) THE
  MECHANISM RUNS THROUGH POLYAMINES AND DFMO COMPLETELY ELIMINATED IT, i.e. the axis R331 killed, and AMD1
  +3.08 cm says less polyamine flux is taller. (d) NNMTs OWN MOUSE ARM IS WEAK: Nnmt<em1(IMPC)Mbp>
  homozygote body length +0.897 at P=0.0277 ranks 256th of 367, its second body-length row is -0.475 (ns),
  and no skeletal parameter appears among its 12 rows at P<0.01. (e) No one-carbon metabolic gene appears in
  kosmicki2026s 207 at all. (f) MAT2A, which MAKES SAM, has a het TIBIA row of +0.565 at P=0.0132 - the
  WRONG direction for the chain - though a second allele is -0.025 ns, so the two alleles disagree and it is
  uninformative rather than refuting. (g) Homocystinuria is a hypomethylating human state with TALL stature;
  the standard reading is fibrillin disruption, i.e. the FBN1 axis this file already holds at +9.13, but the
  tension is recorded rather than explained away.

  NINE - WHAT SURVIVES OF THE METHYL ARM IS ONE THING AND IT CLOSES HALF OF A GAP OPEN SINCE R287. hoang2023
  raises COL2A1, ACAN, SOX9 and the chondroitin-sulfate synthesis enzymes CHSY1, CHSY3, CSGALNACT1 and
  CSGALNACT2 in human chondrocyte cells. R337 wrote that the only route to raising aggrecan is blocking its
  catabolism, which is the RANKL/denosumab trap, and that THE SYNTHESIS-SIDE ROUTE IS UNTOUCHED. This is a
  synthesis-side aggrecan elevator, and it raises the GAG SULFATION enzymes as well, which is the same term
  R320-R322 reached from the sulfate donor. ACAN is -16.60 cm, the largest number in the burden table. The
  agent is 250-2500x short; the demonstration that the synthesis side moves is not.

  TEN - A FREE SUBTRACTION FALLS OUT OF THE SAME MECHANISM. NNMT consumes SAM AND nicotinamide. Raising
  nicotinamide raises NNMT flux and therefore DRAINS SAM. NICOTINAMIDE RIBOSIDE, NMN AND HIGH-DOSE
  NICOTINAMIDE ARE UBIQUITOUS LONGEVITY SUPPLEMENTS AND THEY LOAD THE ONE ENZYME THIS ROUND IDENTIFIES AS THE
  PLATES METHYL SINK. Grade E, mechanistic, costs nothing to stop - the same class as the AKG and
  megadose-vitamin-C avoidances, and it should be ASKED ABOUT alongside topical minoxidil and paracetamol.'
