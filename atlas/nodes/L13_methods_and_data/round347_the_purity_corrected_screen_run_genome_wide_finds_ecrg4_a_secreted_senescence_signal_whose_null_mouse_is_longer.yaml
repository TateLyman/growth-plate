claim_grades:
- claim: ECRG4 is abundant and strongly chondrocyte-enriched in the postnatal human growth plate.
  grade: B
  basis: '694.6 CPM against 41.6 in contaminated samples = 16.35x, detected 12/12, in the only postnatal
    human growth-plate single-cell dataset this atlas holds. Graded B not A because the pure-vs-contaminated
    split is partly confounded with donor (R344) and a composition contrast cannot distinguish a growth-plate
    chondrocyte from any other chondrocyte.'
- claim: Loss of Ecrg4 lengthens the mouse, specifically rather than as part of a larger animal.
  grade: C
  basis: 'Body length +0.950 at P=4.45e-07, the second most significant of 183 parameters, with lean mass,
    fat mass, fat/body weight, BMC/body weight and heart weight ALL null, and BMD increased. It ranks 8th of
    the 367 positive significant body-length rows in the whole consortium against a base rate computed here
    (only 24.8% of significant body-length rows are positive). Graded C because it is one allele at one
    centre with n=7m/8f, never replicated, and the two tibia rows are negative and ns.'
- claim: ECRG4 is a lever on the resting-zone pool (the N term).
  grade: E
  basis: 'INFERENCE ONLY. It rests on richter2023, a REVIEW, reporting that augurin peptides inhibit
    proliferation, induce senescence and lower telomerase in other tissues, plus the direction of the mouse
    length effect. No one has measured ECRG4 in a growth plate by zone, perturbed it in cartilage, or counted
    a resting-zone cell under it in any species.'
- claim: Raising methyl-donor availability is the obtainable direction for the height-increasing epigenetic arm.
  grade: D
  basis: 'The DIRECTION is well supported - three independent human-anchored modules in this file (UHRF1/UHRF2
    vs TET1; KMT2B/ASH1L; PRC2 via the R311 maturation screen) plus a mouse length endpoint (yanagihara2025)
    all say more methylation is taller, and R342 established that no activator exists for any of those
    writers. The ARGUMENT THAT SUPPLY IS RATE-LIMITING is grade E and unmeasured. Graded D overall, not
    higher, because no methyl donor has a bone-length endpoint in any species and no SAM/SAH measurement
    exists for cartilage.'
- claim: SAMe is an addable compound for this stack.
  grade: X
  basis: 'NO, AND THE REASONS ARE SPECIFIC. hoang2023s active concentrations are ~25-250 uM against a plasma
    SAM of order 100 nM (the R335/R336 minoxidil problem); SAM LOWERED proliferation in those cells, which is
    the parameter erdafitinib is in the stack to raise; and DFMO completely eliminated the effect, placing
    the mechanism on the polyamine axis R331 closed. What survives is narrower and real: it is the first
    synthesis-side aggrecan elevator in this file.'
- claim: NNMT inhibition has a mouse length endpoint.
  grade: E
  basis: 'BARELY. Nnmt-null body length +0.897 at P=0.0277 ranks 256th of 367 positive rows, a SECOND body
    length row is -0.475 (ns), and no skeletal parameter appears among its 12 rows at P<0.01. The NNMT case
    rests on expression and on the methylation chain, NOT on this mouse, and it must not be quoted as if it
    did.'
- claim: Carbonic anhydrase inhibitors are a contraindication for this subject.
  grade: D
  basis: 'CA2 is cartilage-enriched at 6.49x and 369 CPM, and human CA2 deficiency includes SHORT STATURE
    alongside osteopetrosis and renal tubular acidosis. Graded D because that is a biallelic null with
    systemic acidosis, not partial pharmacological inhibition, and no CA inhibitor has a bone-length endpoint
    in any species. It is a watch-item worth asking about because topiramate and zonisamide are commonly
    prescribed to adolescents.'
- claim: A HIF prolyl-hydroxylase inhibitor could raise growth-plate output.
  grade: X
  basis: 'The HIF OUTPUT signature is among the most cartilage-enriched in the tissue (NDUFA4L2 43.08x, CA9
    9.47x, BNIP3 5.48x) while the drugged sensors are not enriched at all (EGLN1 1.12x, EGLN3 0.49x) and no
    HIF-pathway gene reaches kosmicki2026s 207. The plate is already near-maximally hypoxia-activated. This
    gives R284s empty roxadustat query a mechanism instead of an absence.'
