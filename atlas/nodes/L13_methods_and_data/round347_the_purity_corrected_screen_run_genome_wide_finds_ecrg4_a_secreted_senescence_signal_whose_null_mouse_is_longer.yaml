    mean in the pure set AND >=3x enriched over the contaminated set: 380. Of those, 301 had ZERO literal
    mentions across every atlas YAML and CLAUDE.md at the moment the screen was run, and 19 more had <=3;
    recomputed after this round wrote, 275 remain untouched. Full table:
    atlas/data/round347/purity_corrected_enrichment_genomewide.json. Highest enrichment ratios:
    COL10A1 107.3x, NDUFA4L2 43.1x, MMP13 31.2x, LOX 25.3x, CHI3L2 23.1x, IHH 22.3x, PLA2G2A 21.3x,
    CHI3L1 21.2x, COL1A1 18.4x, ECRG4 16.4x, FGFBP2 15.9x, STC2 13.8x, SNORC 12.8x, CHAD 12.8x,
    CLEC3A 9.9x, COL2A1 9.7x. Highest-abundance zero-coverage genes: SPARC 11,126 CPM, SNORC 7,753,
    FGFBP2 3,320, SERPINE2 2,197, CNMD 1,695, PRELP 1,408, ECRG4 695'
  unit: CPM; fold enrichment; gene counts
  conditions: computed 2026-08-13 from atlas/data/round344/gse288028_human12_cpm.npy; atlas coverage by literal
    word-boundary match across all atlas/**/*.yaml plus CLAUDE.md, excluding atlas/data.
  species: human
  source_ref: gse288028
  atlas_derived: true
  uncertainty: 'THE 5-VS-5 SPLIT IS R344s AND CARRIES R344s LIMIT: it is partly confounded with PATIENT, four
    of the five purest samples coming from one donor. A ratio of pure to contaminated is a COMPOSITION
    contrast, so it identifies chondrocyte-restricted transcripts and cannot distinguish a growth-plate
    chondrocyte from any other chondrocyte. Zero atlas coverage is a statement about this file, not about the
    literature - several of these genes have large literatures elsewhere.'
- parameter: 'ECRG4 - EXPRESSION, AND THE KNOCKOUT BODY LENGTH WITH ITS SPECIFICITY CONTROLS'
  value: 'EXPRESSION: ECRG4 694.6 CPM in pure cartilage vs 41.6 contaminated = 16.35x, detected 12/12 human
    samples. IMPC Ecrg4<tm1b(EUCOMM)Hmgu> HOMOZYGOTE, phenotyping centre ICS, 183 rows over 181 parameters:
    BODY LENGTH effect +0.950, P=4.45e-07, n=7m/8f - the SECOND most significant of all 183 parameters.
    SPECIFICITY CONTROLS ALL NULL: lean mass +0.179 (P=0.157), fat mass +0.252 (P=0.086), lean/body weight
    +0.221 (P=0.126), fat/body weight +0.222 (P=0.082), BMC/body weight +0.098 (P=0.518), heart weight
    +0.295 (P=0.521). BONE MINERAL DENSITY excluding skull +0.639, P=3.40e-03 - INCREASED. Tibia length
    -1.040 (P=0.681) and -0.863 (P=0.494), both ns at n=5m/5f. Other rows at P<0.01 are haematological
    (mean corpuscular haemoglobin -0.883 P=3.13e-07, MCHC, haemoglobin) and cardiac/ocular'
  unit: IMPC standardised effect size; P-values; CPM
  conditions: IMPC statistical-results-ALL, queried 2026-08-13; expression from GSE288028 purity-corrected.
  species: mouse
  source_ref: impc_statistical_results
  uncertainty: 'n=7m/8f is an IMPC pipeline n and the effect is a standardised effect size, NOT millimetres -
    this cannot be converted to a human centimetre figure. The tibia rows run NEGATIVE and ns, so the axial
    reading is a hypothesis generated by an underpowered contrast, not a compartment result. Sex-disaggregated
    rows were not separated here. ONE allele, ONE centre, never independently replicated. And IMPC body length
    is a nose-to-rump measure whose relationship to human standing height is not established.'
- parameter: 'THE BASE RATE FOR AN IMPC LENGTH ROW, COMPUTED BEFORE THE CLAIM (CORR-329)'
  value: 'BODY LENGTH: 6,817 rows with both an effect size and a P-value; 64.1% NEGATIVE. At P<0.05: 1,480
    rows, of which only 367 (24.8%) are POSITIVE against 1,113 negative. At P<1e-4: 266 rows, only 34
    (12.8%) positive. TIBIA LENGTH: 4,477 rows, 63.3% negative; at P<0.05, 242 of 1,072 (22.6%) positive; at
    P<1e-4, 34 of 202 (16.8%) positive. ECRG4 at +0.950 / P=4.45e-07 RANKS 8th OF THE 367 POSITIVE
    SIGNIFICANT BODY-LENGTH ROWS. The seven above it are Ebf4, Rnd2, Uso1, Slc38a3, Lingo2, Acot8 and Hltf.
    NNMT at +0.897 / P=0.0277 ranks 256th of 367'
  unit: percentages; ranks
  conditions: computed 2026-08-13 over every Body length and Tibia length row in IMPC statistical-results-ALL.
  species: mouse
  source_ref: impc_statistical_results
  atlas_derived: true
  uncertainty: 'This refines CORR-329s global figure (63.7% of all knockouts shorter) to the two specific
    parameters this atlas actually reads, and the conclusion is unchanged: the POSITIVE direction is roughly
    a quarter of significant rows at P<0.05 and an eighth at P<1e-4, so a positive carries several times the
    information of a negative. It does NOT correct for the fact that IMPC rows are not independent (multiple
    alleles, centres and sexes per gene), so the ranking is a descriptive position, not a formal p-value.'
