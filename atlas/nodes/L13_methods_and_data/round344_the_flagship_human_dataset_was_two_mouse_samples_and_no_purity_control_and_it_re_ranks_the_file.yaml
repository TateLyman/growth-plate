id: round344_the_flagship_human_dataset_was_two_mouse_samples_and_no_purity_control_and_it_re_ranks_the_file
name: 'Round 344 - the atlas''s most-cited human dataset contained two MOUSE samples counted as human and
  was pooled across a 66-fold range of cartilage purity. Recomputed from the raw matrices, the leads move
  4 to 72 fold and two of my own recent proposals move in opposite directions.'
aliases:
- GSE288028 is 12 human samples not 14
- purity-corrected growth plate expression
- IHH is 60-fold higher than the atlas believed
- why every present gene reads 12/14
type: dataset
layer: L13
stub: false
summary: 'THE INSTRUCTION WAS TO STOP SEARCHING INSIDE THE FRAME AND EXPAND THE PICTURE. I opened the raw
  matrices of the dataset this atlas cites more than any other and found two errors in its foundation. Neither
  reverses a major conclusion. Both change the NUMBERS that thirty-six rounds of ranking were built on,
  and the correction runs in BOTH directions - it strengthens several kills, materially strengthens the
  file''s own best-validated lead, and weakens two proposals I made in the last three rounds.

  ERROR ONE - TWO OF THE FOURTEEN SAMPLES ARE MOUSE. GSM9328230 and GSM9328231 (both patient code P27153)
  carry the mm10 genome with 32,285 features and gene symbols Xkr4, Gm1992, Sox17. They contribute 11,869
  of the 79,934 cells - FOURTEEN POINT EIGHT PER CENT of what R308 reported as human. The dataset is TWELVE
  human samples from FOUR patients plus two mouse. ⭐ AND THIS EXPLAINS A PATTERN NOBODY QUESTIONED: essentially
  every gene this atlas calls present is reported as exactly 12/14 - COL2A1, ACAN, GNAS, the entire Hippo
  cassette, the whole m6A apparatus, STC2, TET1, LOXL2. TWELVE OF FOURTEEN IS THE CEILING, NOT A COINCIDENCE.
  COL2A1 is the most abundant transcript in cartilage and it reads 12/14 in 100 per cent of cells. Every
  "/14" denominator in this file should be "/12", and a gene at 12/14 is at CEILING - universally detected
  - rather than present in 86 per cent of samples. The two structurally-zero mouse samples also sit inside
  every median, which systematically UNDERESTIMATES abundance.

  ERROR TWO, AND IT IS THE LARGER ONE - THE TWELVE HUMAN SAMPLES VARY SIXTY-SIX FOLD IN CARTILAGE CONTENT
  AND WERE POOLED AS EQUIVALENT. COL2A1 runs from 1,518 CPM (P30453_1002) to 99,798 (P25452_001). The identity
  of the low-purity samples is not ambiguous: PTPRC (CD45, pan-leukocyte) is 1.0 CPM in the purest five
  and 537.4 in the least pure - a five-hundred-fold difference - and HBB is 0.2 against 194.8, a thousand-fold.
  THE LOW-COL2A1 SAMPLES ARE BLOOD AND IMMUNE TISSUE. A median CPM pooled across that range reports tissue
  COMPOSITION, not chondrocyte biology. Stratifying on COL2A1 (purest five against least pure five) separates
  the two cleanly, and the contamination markers behave exactly as they must, which is what licenses the
  split.

  WHAT MOVES, AND THE HEADLINE IS THE HEDGEHOG AXIS. ⭐⭐ IHH IS 89.5 CPM IN PURE CARTILAGE AGAINST 1.2 IN
  THE CONTAMINATED SAMPLES - SEVENTY-TWO FOLD ENRICHED, AND SIXTY FOLD HIGHER THAN THE 1.5 CPM R308 REPORTED.
  This atlas has treated IHH as barely expressed since R308 and has quoted chu2026''s mouse baseMean of 0.035
  alongside it. IHH is -13.10 cm in kosmicki2026 (P=1.0e-26), THE SECOND LARGEST SHORTENING EFFECT AFTER
  ACAN. ⭐ PTH1R is 783.8 against 69.9 - eleven-fold enriched and seven-fold above the reported 108.7 - so
  the Ihh-PTHrP feedback loop, the master controller of the growth plate, is THE most cartilage-enriched
  signalling axis in the tissue and this file has been reading it at between a tenth and a sixtieth of its
  true level. HHIP itself is 68.8 against 14.8, 4.65-fold enriched and 3.2-fold above the reported 21.4.
  The atlas''s own best-validated target and its buffer are both substantially larger than believed.

  THE OTHER LEADS ALL MOVE THE SAME WAY, WHICH IS THE POINT - CARTILAGE-ENRICHED GENES WERE SYSTEMATICALLY
  UNDERSTATED. STC2 203.6 against 11.7 (17.4-fold enriched, 11.3-fold above the reported 18.1) - the best-powered
  secreted target in the file is an order of magnitude more abundant than R341 and R342 used. SCUBE3 171.0
  against 10.7 (16.0-fold). CCN1 1,487 against 111. CHAD 198.5 against 25.1. LOXL2 600.0 against 88.8 -
  the standing lead is a 600 CPM transcript in real cartilage. CCN2 6,086 against 715. PLOD1 156.9, ACAN
  3,537, SERPINH1 384, CHST3 177, IGF2 31.7 (5.9-fold enriched, so the LOCAL IGF ligand is genuinely chondrocyte).

  AND IT CUTS AGAINST ME TWICE, WHICH IS THE HALF WORTH TRUSTING. ⛔ ESR1 IS 14.7 IN PURE CARTILAGE AGAINST
  65.8 IN THE CONTAMINATED SAMPLES - a ratio of 0.22, and 0.45 of the reported 33.1. Much of "ESR1 is present
  in the human growth plate" is immune and vascular contamination, which WEAKENS the receiver-test half of
  the R338/R339 vepdegestrant argument. ⛔ ESR2 is 0.2 against 46.3, a ratio of 0.00 - ERbeta in the growth
  plate was contamination outright. ⛔ STS is 3.3 against 18.3, so R337''s sulfatase-route observation was
  mostly contaminant; that thread was closed on other grounds and stays closed, for a better reason.

  AND IT STRENGTHENS THE KILLS, FOR THE SAME REASON. Every absence this file leans on gets cleaner once the
  residual signal is shown to be contaminating tissue rather than chondrocyte: AGTR1 0.2 against 6.6 (ratio
  0.03) so the losartan kill improves; REN 0.0 against 0.5; MME 2.7 against 15.4 (0.17) so the sacubitril
  kill improves; SOST and NPPC remain at 0.1 in pure cartilage; CYP19A1 0.6, so R337''s conclusion that anastrozole
  cannot act locally survives; and IGFALS IS 0.0 IN PURE CARTILAGE, so R341''s local-versus-circulating IGF
  argument - the basis for reopening STC2 - survives and strengthens.

  WHAT THIS IS. It is not a new compound and it does not reverse a verdict. It is a correction to the measurement
  layer that every ranking in this file since R308 has been quoting, and it re-orders the leads: the hedgehog
  axis, STC2, SCUBE3, CHAD and LOXL2 are all substantially bigger in real cartilage than recorded, while
  the oestrogen receptor is smaller. Corrected table for 72 named targets at atlas/data/round344/gse288028_purity_corrected.json.'
quantitative:
- parameter: 'the composition of the dataset - twelve human samples from four patients plus two mouse, not
    fourteen human'
  value: 'GSM9328230_P27153_1001 and GSM9328231_P27153_1002 are mm10 with 32,285 features and mouse gene
    symbols (Xkr4, Gm1992, Sox17), contributing 11,869 of the 79,934 cells = 14.8 per cent. Human samples:
    P30453 x3, P31011 x3, P25452 x5, P22202 x1 = 12, from 4 patients aged 11-14.'
  unit: samples and cells
  conditions: Read directly from the raw CellRanger h5 matrices in atlas/data/supplied_2026_08_12/GSE288028_RAW.tar,
    from matrix/features/genome and matrix/features/name. The library_ids attribute also carries design labels
    - hs_gp_unc_2024 (uncultured) and hs_gp_veh_2024 (vehicle).
  species: human
  source_ref: kosmicki2026
  uncertainty: 'THE SPECIES SPLIT IS NOT AMBIGUOUS - the genome field says mm10 and the gene symbols are
    mouse. WHAT IS NOT ESTABLISHED is exactly how R308 computed its detection calls: recomputing with a
    permissive threshold (CPM greater than zero) gives different det values for low-abundance genes than
    R308 reported, which is a threshold difference rather than an error, so the det discrepancies for trace
    genes are NOT claimed as mistakes. The unambiguous consequences are the denominator (12, not 14), the
    cell count, and the systematic downward bias in every median from two structurally-zero samples. NO
    GH-STIMULATION CONTRAST IS IDENTIFIABLE among the twelve human samples - CISH and SOCS2 vary 27-fold
    but track patient and purity rather than any treatment grouping, so the inventory''s "+/- GH stimulation"
    most likely refers to the mouse arm or to samples not deposited.'
- parameter: 'the purity range that was pooled, and the markers that identify it'
  value: 'COL2A1 spans 1,518 to 99,798 CPM across the twelve human samples - 66-fold. PTPRC (CD45) is 1.0
    CPM in the purest five against 537.4 in the least pure (500-fold); HBB 0.2 against 194.8 (1000-fold);
    CD74 19.3 against 147.1. Conversely SP7 (osterix) is 60.7 in the purest against 6.4, so the pure samples
    carry the expected chondro-osseous fraction.'
  unit: CPM, median of the purest five against the least pure five
  conditions: Samples ranked by COL2A1 CPM. Purest five - P25452_001 (99,798), P25452_004 (73,497), P25452_005
    (67,204), P22202_1015 (38,556), P25452_007 (21,373). Least pure five - P30453_1001 (8,333), P31011_1003
    (8,049), P31011_1002 (7,538), P31011_1001 (5,624), P30453_1002 (1,518).
  species: human
  source_ref: kosmicki2026
  uncertainty: 'THE CONTAMINATION MARKERS ARE WHAT MAKE THIS A MEASUREMENT RATHER THAN AN ASSUMPTION - a
    500-fold PTPRC and 1000-fold HBB difference identifies the low-COL2A1 samples as blood and immune tissue
    directly, and this is the control CORR-339 demands before any composition-based contrast. LIMITS: the
    split is five against five with no replication, purity is a continuum rather than two groups, and the
    purest and least pure sets are partly confounded with PATIENT (four of the purest five are P25452),
    so patient effects and purity cannot be fully separated. A per-cell-type analysis on the annotated cells
    would be better than a purity-stratified pseudobulk and has not been done.'
- parameter: 'the hedgehog axis is the most cartilage-enriched signalling axis in the tissue and was read
    at a fraction of its size'
  value: 'IHH 89.5 CPM in pure cartilage against 1.2 in contaminated - 72.5-fold enriched, and 60-fold above
    the 1.5 CPM previously recorded. PTH1R 783.8 against 69.9 - 11.2-fold enriched, 7.2-fold above the recorded
    108.7. HHIP 68.8 against 14.8 - 4.65-fold enriched, 3.2-fold above the recorded 21.4.'
  unit: median CPM in the purest five against the least pure five, and fold change against the previously
    recorded value
  conditions: Recomputed pseudobulk from the raw matrices, purity-stratified. IHH carries a human burden
    effect of -13.10 cm (P=1.0e-26, 33 carriers) in kosmicki2026, the second largest shortening effect in
    the table after ACAN.
  species: human
  source_ref: kosmicki2026
  uncertainty: 'THIS IS THE ROUND''S LARGEST NUMBER AND IT IS AN EXPRESSION CORRECTION, NOT A NEW LEVER.
    It says the Ihh-PTHrP loop is far more prominent in real growth-plate cartilage than this file believed,
    which strengthens the prior for the hedgehog arm that R285, R290 and R294 built - but expression is not
    direction and not tractability, and R294''s conclusion stands unchanged: no HHIP-directed agent exists
    in any species. The IHH value in particular should be treated as provisional until confirmed on an independent
    human dataset, because a 60-fold correction on a single gene from a five-sample stratification of one
    study is exactly the kind of number that should not be trusted alone.'
localization:
- 'postnatal human growth plate cartilage, purity-stratified: the corrected reference for every expression
  call this atlas makes'
human_evidence: direct
human_evidence_note: Twelve human growth-plate samples from four patients aged 11-14, recomputed from the
  raw deposited matrices.
species_basis:
- human
translation_risk: low
translation_risk_reason: This is a correction to human measurement in the target tissue and involves no cross-species
  inference.
confidence: B
claim_grades:
- claim: GSE288028 contains two mouse samples that were counted as human.
  grade: A
  basis: Read directly from the raw matrices. GSM9328230 and GSM9328231 carry genome mm10, 32,285 features
    and mouse gene symbols, and contribute 11,869 of the 79,934 cells. The dataset is 12 human samples from
    4 patients plus 2 mouse.
- claim: Every "/14" denominator in this file should be "/12", and 12/14 means universally detected.
  grade: A
  basis: Arithmetic consequence of the above, and visible throughout - COL2A1, the most abundant transcript
    in cartilage, reads 12/14 at 100 per cent of cells. Twelve is the ceiling.
- claim: The twelve human samples vary 66-fold in cartilage purity and the low-purity samples are blood and
    immune tissue.
  grade: A
  basis: COL2A1 1,518 to 99,798 CPM, with PTPRC at 1.0 against 537.4 (500-fold) and HBB at 0.2 against 194.8
    (1000-fold) between the purest and least pure five. The identity of the contaminant is measured, not
    assumed.
- claim: Cartilage-enriched targets were systematically underestimated and contaminant-weighted genes overestimated.
  grade: B
  basis: 'Measured across 72 named targets. Underestimated - IHH 60-fold, STC2 11.3-fold, PTH1R 7.2-fold,
    COL2A1 7.3-fold, CCN2 4.9-fold, CCN1 4.6-fold, PLOD1 4.0-fold, CHAD 3.3-fold, LOXL2 3.2-fold, HHIP 3.2-fold,
    SCUBE3 2.7-fold. Overestimated - ESR1 at 0.45 of the recorded value with a purity ratio of 0.22, ESR2
    at 0.16 with a ratio of 0.00, STS at 0.29, AGTR1 at 0.29, MME at 0.32. Graded B not A because the purity
    split is five against five and partly confounded with patient.'
- claim: This weakens the receiver-test half of the vepdegestrant proposal.
  grade: B
  basis: ESR1 is 14.7 CPM in pure cartilage against 65.8 in the contaminated samples, so a substantial part
    of the "ESR1 is present in the human growth plate" observation used in R338 and R339 is immune and vascular
    contamination. It does not touch the human ESR1-null phenotype, the mouse protein-ablation ordering,
    or the biphasic argument - but the local presence claim is weaker than stated, and brjesson2010 already
    placed the operative compartment outside cartilage in any case.
- claim: This strengthens R341's STC2 argument and the absence-based kills.
  grade: B
  basis: 'IGFALS is 0.0 CPM in pure cartilage, so the circulating ternary carrier is absent from chondrocytes
    by a cleaner measurement than before, while STC2 is 203.6 and IGF2 is 31.7 with 17.4-fold and 5.9-fold
    cartilage enrichment. The same logic improves the losartan kill (AGTR1 ratio 0.03, REN 0.00), the sacubitril
    kill (MME 0.17) and R337 aromatase argument (CYP19A1 0.6 in pure cartilage): in each case the residual
    signal is demonstrably contaminating tissue rather than chondrocyte.'
- claim: A GH-stimulation contrast can be recovered from these samples.
  grade: X
  basis: Tested and no. CISH and SOCS2 vary 27-fold across the twelve human samples but do not separate into
    treated and untreated groups - the variation tracks patient and cartilage purity. The inventory's "+/-
    GH stimulation ex vivo" most plausibly refers to the mouse arm or to samples not deposited, which is
    consistent with the GEO record's own caveat that raw human files were withheld.
