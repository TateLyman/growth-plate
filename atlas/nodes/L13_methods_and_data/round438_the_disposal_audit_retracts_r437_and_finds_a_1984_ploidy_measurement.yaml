human_evidence_note: The audit half is a measurement over this repository and carries no species. The ploidy
  half is rat (kusuzaki1984) and chick embryo (erenpreisa1999); no human growth-plate ploidy measurement
  exists, and no species has a length endpoint attached to it.
translation_risk: high
translation_risk_reason: Nothing here is proposed as an intervention. The ploidy observation is descriptive,
  forty-two years old, has no relationship to cell size or bone length in either paper, and its direction
  is unknown - if ploidy tracks proliferation rather than causing volume it is a marker and not a lever.
summary: 'TWO HALVES. The first retracts the previous round''s headline. The second applies the same discipline
  to that round''s own claims and finds something.


  HALF ONE - THE DISPOSAL AUDIT, AND IT EXONERATES THE FILE. R437 wrote that 6 of 8 instances of "no length
  endpoint in any species" sit beside a kill word, and offered that as evidence the atlas bins agents
  on a ground R302 rules is a gap. Counted properly across all 19 instances: 12 sit in a bulleted AGAINST
  list beside another NAMED objection that actually carries the disposal - zero chemical matter, an interior
  optimum, not in the 207, a tumour signal, wrong direction, a deficit model. 2 are the file correcting
  itself, CORR-350 withdrawing the thrombin line. Only 5 stand alone, and of those one is TET1, which
  the same file re-ranked UP in R302 and calls its best chemical-matter candidate; one is the sulfate
  arm, filed under "STILL MISSING" and left as the standing recommendation; one names "and no agent exists"
  in the same sentence; and one is vibration, whose stated ground is that the entire literature is three
  patents. PROXIMITY IS NOT CAUSATION AND R437 READ IT AS CAUSATION.


  THE NODE-LEVEL AUDIT AGREES. atlas/tools/process_evidence_rerank.py scores every node citing a missing
  caliper for whether the disposal also names one of R302''s real disqualifiers and whether the node carries
  a measured effect on a term of the height identity. 98 nodes qualify. Split by node class, the result
  is clean: of the 16 SINGLE-TOPIC nodes, 13 record the missing caliper as a GAP and ZERO dispose on it
  together with a real ground, and the 3 flagged recoverable turn out on reading to record it as a scoped
  caveat with the finding explicitly kept - one says in terms that there is no bone-length endpoint, that
  the measurement is growth-plate length which is a different quantity, and that what survives is the
  zonal and second-messenger dissociation. The other 82 are ROUND-SUMMARY nodes, which are multi-agent,
  so a disposal word and a caliper complaint co-occur while belonging to different agents. That is the
  tool''s scope limit and it means this audit has to run at CLAIM level rather than node level.


  AND THE TOOL OVER-CALLED UNTIL IT WAS FIXED, WHICH IS ITS OWN FINDING: R302''S THREE DISQUALIFIERS ARE
  NOT THE COMPLETE SET THIS FILE LEGITIMATELY USES. R302 lists absent-from-tissue, wrong-direction and
  redundant-with-the-stack, and all three are about BIOLOGY. The file also disposes, correctly, on ZERO
  CHEMICAL MATTER - there is nothing to give, and CORR-347 makes that checkable rather than assertable
  - and on AN INTERIOR OPTIMUM WITH NO TITRATABLE AGENT, CORR-325''s band. AEBP1 is the case that exposed
  it: 35 monotone burden rows with the best-powered at P=8.4e-15, correct compartment, correct depth on
  a mapped axis, and it fails on those two grounds rather than on the caliper. Scoring it as mis-binned
  would have been the auditor''s error and not the file''s.


  SO THE CRITICISM IS RIGHT ABOUT THE SEARCH AND WRONG ABOUT THE DISPOSAL. R437''s other half stands untouched
  and is the important one: every compound sweep in this project is shaped "query X AND bone length", nobody
  was trying to make people taller so nobody measured length, and that query returns near-nothing by construction.
  The recovery operation this round expected to find candidates in returns none - which is a real answer
  rather than a failure.


  HALF TWO - AND THE SAME DISCIPLINE TURNED ON R437''S OWN ZEROS WAS OVERDUE. R437 called eight processes
  "ZERO everywhere" having checked only this repository, and CORR-267/284 says do not assert what the literature
  contains without querying it. Queried: "hypertrophic chondrocyte AND ploidy" returns ZERO PubMed records;
  "endoreduplication AND chondrocyte" returns ONE, a cytogenetics quality-control paper on cultured chondrocytes;
  "polyploidy AND chondrocyte" returns five, of which none concerns a growth plate; "macromolecular crowding
  AND chondrocyte" returns three and ALL THREE are tissue engineering, crowding used as a culture additive
  to boost matrix deposition rather than as an intracellular set point. Most instructive of all, "chondrocyte
  AND DNA content AND hypertrophy" returns fourteen and EVERY ONE uses DNA content as a NORMALISER for
  cell number - micrograms of proteoglycan per microgram of DNA - which is precisely why a ploidy question
  is invisible to a keyword search of this literature.


  AND THE ZERO DOES NOT SURVIVE, WHICH IS A BETTER OUTCOME THAN IF IT HAD. Two papers exist, in two species
  by two methods, both descriptive and both uncited in this context. kusuzaki1984 ran multiparametric cytofluorometry
  on the GROWING RAT epiphyseal cartilage plate, measuring nuclear DNA against cellular RNA, protein and
  autoradiographic grain; chondrocytes resolve into G0-G1, S and G2, and the author reports TWO FURTHER
  SUBPOPULATIONS - BINUCLEAR CELLS AND MONONUCLEAR TETRAPLOID CELLS - both carrying higher RNA than mononuclear
  G2 cells. That is the only ploidy measurement of a mammalian growth plate that exists, it is forty-two
  years old, and it sits in a Japanese-language orthopaedic journal with no DOI. erenpreisa1999 examined
  chick embryo femoral epiphyses by electron microscopy and found polyploid metaphases and giant segmentating
  cells in the perichondrium, premature chromosome condensation in the RESTING ZONE, about 5 per cent of
  proliferative-zone divisions aberrant, and a-mitotic nuclear segmentation in dark chondrocytes across
  ALL layers - which its authors call normal developmental mechanisms rather than pathology.


  THE REASON IT WENT NOWHERE IS THE INTERPRETATION, NOT THE DATA. kusuzaki1984 read tetraploidy as polyploid
  groups ACCOMPANYING HIGHLY ACTIVE PROLIFERATION - a by-product of dividing fast. Nobody has asked the
  other question: does ploidy SET terminal chondrocyte volume? In every other tissue where cells become
  very large - hepatocyte, megakaryocyte, trophoblast, cardiomyocyte, insect and plant - endoreduplication
  is a principal volume mechanism; a terminal hypertrophic chondrocyte enlarges five- to tenfold and delivers
  the largest term in the height identity; and this mechanism sits entirely outside every osmotic and matrix-synthesis
  argument this file has made about h_term.


  AGAINST IT, STATED WITH IT. Both papers are descriptive - no ploidy fraction by zone, no relationship
  to cell size, no growth-rate contrast, and no bone-length endpoint in either. erenpreisa1999 is chick
  and EMBRYONIC, so CORR-299 governs any inference to an open postnatal plate. kusuzaki1984 is abstract-only
  and its numbers cannot be extracted without the full text. And the direction is unknown: if ploidy tracks
  proliferation rather than causing volume it is a marker and not a lever. What changes is that the experiment
  in g_l5_437a is now a REPLICATION AND EXTENSION of a 1984 result rather than a first look, which makes
  it both easier to justify and easier to interpret.'
