confidence: B
claim_grades:
- claim: Human proliferative zone columns contain about 24 cells.
  grade: B
  basis: Direct count in kember1976; never independently replicated in human tissue.
- claim: Human proliferative chondrocyte cycle time is about 20 days.
  grade: D
  basis: Derived from a column count and a radiographic growth rate, not measured by labelling; see
    gap g_l1arch_002.
