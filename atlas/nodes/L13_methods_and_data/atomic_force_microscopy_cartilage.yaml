localization:
- 'porcine PERI: pericellular matrix resolved as mechanically distinct'
- 'rabbit RZ/PZ/HZ: zonal modulus differences demonstrated'
human_evidence: indirect
human_evidence_note: AFM zonal mapping of growth plate exists in rabbit and pig; the only human physeal
  micromechanics is interface nanoindentation in ten donors.
species_basis:
