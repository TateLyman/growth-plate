human_evidence_note: The coverage map itself is a fact about this repository, not about biology, so it
  carries no species. The individual findings folded in below each carry their own species and are cited
  to primary sources that were re-resolved against PubMed or Europe PMC by the main loop rather than taken
  on an agent's word.
translation_risk: low
translation_risk_reason: Nothing here is proposed as an intervention. The round produces a coverage measurement,
  a disposal audit, one new axis recorded with its objection stated, and a set of free subtractions.
summary: 'THE PROBLEM THIS ROUND EXISTS TO SOLVE. Every prior round of this project was LEAD-DRIVEN -
  follow a thread, work it, close it, report a negative. That produces depth and it structurally cannot
  produce coverage, because you can only follow a thread you have already thought of. R411 built a blind-spot
  inventory for GENES and R431 built a ledger sweep for NODES-versus-CLAUDE.md, but nobody had ever asked
  the prior question: what is the complete concept space of human growth, and which parts of it has this
  atlas never once touched? That question cannot be answered from inside the atlas - deriving the concept
  list from the node graph is circular and returns exactly what is already there.


  THE METHOD. Twenty-one domain agents enumerated the EXTERNAL literature under a hard rule that they
  must not read this repository beyond their own brief. Domains: genetic skeletal disorder nosology, endocrine
  axes, growth-plate cell biology, signalling, nutrition, environment, matrix and mineralisation, systemic
  disease as natural experiment, mechanics, vascular/neural/immune/ microbiome, all drug classes, comparative
  and evolutionary body size, axial skeleton, timing and heterochrony, human height genetics, developmental
  origins, the chondrocyte transcription-factor network, cell-intrinsic capacity limits, advanced non-small-molecule
  modalities, the quantitative structure of growth, and the actual intervention landscape. The last five
  came from auditing my own first sixteen domains for holes. 2,562 table rows normalised to 2,193 unique
  concepts, scored against 941 nodes, 521 gaps, 1,903 references and CLAUDE.md.


  THE RESULT. ZERO 825 (37.6%) - never mentioned in a node, a gap, a reference or the ledger. REF_ONLY
  41 (1.9%). THIN 319 (14.5%) - worked in a node but absent from CLAUDE.md, the CORR-352 lossy-ledger
  state. COVERED 1,008 (46.0%).


  AND THE DOMAIN PROFILE IS THE FINDING, NOT THE HEADLINE NUMBER. The atlas is deepest exactly where it
  has spent its rounds - endocrine 17.9% zero, transcription factors 18.4%, dysplasia nosology 20.5%,
  signalling 24.0%, matrix 25.2%, mechanics 25.6%. It is emptiest exactly where it never looked - AXIAL/TRUNK
  65.4% and VASCULAR/NEURAL/IMMUNE/MICROBIOME 62.9%, then environment 58.3%, comparative 55.3%, cell biology
  50.0%. Those two worst domains are not arbitrary: R274 and R318 put the residual growth in the TRUNK,
  and R315''s delivery wall is the recurring obstacle to every biologic here. THE ATLAS IS THINNEST IN
  THE COMPARTMENT WHERE THE CENTIMETRES ARE AND IN THE SYSTEM THAT GOVERNS WHETHER ANYTHING REACHES IT.


  THE CONTROL, WHICH IS THE MORE INTERESTING HALF. A ZERO list only means something if the external enumeration
  is at least as broad as the atlas. Run the contrast the other way and 182 of 447 hard-worked atlas gene
  symbols are MISSING from the 2,193-concept enumeration - and the top misses are the atlas''s own leads:
  HHIP at 976 ledger mentions, SAG, NRK, PDE3B, SCUBE3, ECRG4, TET1, SFRP5. NEITHER SET CONTAINS THE OTHER.
  The atlas''s depth is real and the enumeration''s breadth is real and the union is much larger than
  either. It also carries an inversion worth stating: this file''s best-validated target is essentially
  invisible to a broad survey of the field, which is precisely why no HHIP-directed agent exists in any
  species.


  THE ANSWER TO "WE SEEM TO ALWAYS GET THE BAD ENDS". Two checks, and the first REFUTED MY OWN HYPOTHESIS.
  (1) CORR-203 is the file''s most-invoked correction at 40 uses, and R302''s operator ruling says the
  only three real disqualifiers are absent-from-tissue, wrong-direction and redundant - so CORR-203 might
  be killing candidates R302 says are gaps. Reading all forty instances refutes that: it is used as a
  MAGNITUDE DISCOUNT or an explicitly scoped caveat ("applies to the length gain, not to the vehicle";
  "applies to efficacy, not to delivery"), five instances use it in the NEGATIVE to certify a clean normal-animal
  result, and where it is cited as disqualifying an independent decisive ground sits in the same sentence.
  Three instances are mislabelled - study quality, CORR-327, CORR-325 - which is labelling, not misuse.
  (2) The useful half. Disposal vocabulary in CLAUDE.md runs 255 words against 43 promotion words, a ratio
  of 5.9 to 1. And of everything in this atlas with a POSITIVE length endpoint in a NORMAL animal - fourteen
  items, listed in atlas/data/round436/ - EXACTLY THREE ARE AVAILABLE TO A PERSON TODAY AND NONE OF THEM
  IS A DRUG (local limb warming, resveratrol, and myo-inositol which has no long-bone effect). ALL THREE
  APPROVED DRUGS ON THE LIST FAIL STEP 0 because the arm is already occupied: cilostazol and sacubitril
  saturate the cGMP arm, meclozine acts on erdafitinib''s own arm. THE EMPTINESS IS STRUCTURAL, NOT BAD
  LUCK - the drugs that work are already in use, and everything additive is genetic with no agent, research-grade
  with no GMP, or physical with no one having built it.


  WHAT THE 825 ZEROS DO NOT CONTAIN. Filtering them to concepts that are simultaneously cartilage-enriched
  at or above the ACAN benchmark, at or above 20 CPM in the purity-corrected human growth plate, AND recorded
  with a direction pointing TALL or LONGER, returns FOUR - and all four are syndromes rather than levers
  (Costello, AIP pituitary gigantism, congenital generalised lipodystrophy which carries accelerated bone
  age, NONO-related X-linked ID). The blind spot is real and large and it does not hide an obvious missed
  compound. That is consistent with R298''s base rate and it is worth saying plainly rather than implying
  otherwise.


  WHAT IT DOES CONTAIN - ONE NEW AXIS, RECORDED WITH ITS OBJECTION. SOLUBLE EPOXIDE HYDROLASE. The atlas
  returns ZERO files for soluble epoxide hydrolase, EPHX2, TPPU and epoxyeicosatrienoic acids, and two
  independent agents surfaced it. chen2026seh: the sEH inhibitor TPPU PROMOTED LONG-BONE GROWTH IN NEWBORN
  MICE - normal animals, so CORR-203 does not apply - by raising FABP5+ SEPTOCLAST activity through HIF-1a
  and NOTCH. Step 0 is clean and sEH inhibitors have reached humans (GSK2256294, EC5026). AGAINST IT,
  AND THIS IS SERIOUS: the reported phenotype is a REDUCED ratio of hypertrophic to proliferative cartilage
  width, h_term is about 80% of longitudinal growth, and the mechanism is faster MMP9-driven clearance
  plus more H-type vessel coupling - while R365 established that vascular invasion IS the terminal event
  of closure. It buys length only if DISCHARGE is rate-limiting, and it may spend the period. Newborn
  mice, and CORR-299''s question is unasked in any species. Worth a full round; not a promotion.'
