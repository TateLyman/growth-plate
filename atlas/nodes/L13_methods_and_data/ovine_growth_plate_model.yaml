id: ovine_growth_plate_model
name: Ovine growth plate model
aliases:
- sheep physis model
type: process
summary: |
  Sheep are used where a large, weight-bearing, surgically accessible physis is needed over
  months rather than weeks, principally for mechanically modulated growth and for tissue
  mechanics. CORRECTION 2026-08-07 (CORR-036): this node previously stated that physeal tensile
  properties were characterised "in ovine tissue" by williams2001. THAT PAPER CONTAINS NO SHEEP.
  It is BOVINE - 12-18-month heifers and 5-month calves, proximal tibia - plus eight human capital
  femoral specimens from two cerebral palsy patients. The claim was read into the node from a title
  that names no species, and it stood as the anchor primary for a sheep model. The bovine and human
  findings are now held on zonal_stiffness_gradient and chondron, where the species is stated
  correctly, and williams2001 is no longer a key reference here. Ovine
  and bovine cartilage supplied the zonal biochemistry that underpins matrix models -
  differential aggrecan synthesis and breakdown rates by zone (shapses1994) and collagen
  fibril composition (mendler1989, keene1995). Growth modulation by sustained compression has
  been compared across three species at two anatomical locations, which is the closest thing
  the field has to a cross-species dose-response for mechanical growth suppression
  (stokes2006). Lamb studies provided the recumbency-growth observations behind the growing-
  pains literature (noonan2004). Scored on the four-axis scheme defined in
  mouse_model_translation_risk (fusion competence, plate architecture, scale, tempo; each 1-5,
  mean reported). Sheep score A=3, B=1, C=1, D=2, mean 1.75, translation_risk moderate. The
  weak axis is fusion: ovine epiphyseal closure timing is documented for veterinary purposes
  but the terminal cellular events have not been characterised, so sheep cannot currently
  substitute for rabbit as a fusion model.
quantitative:
- parameter: sheep translation risk score (this layer, 1-5)
  value: '1.75'
  unit: score
  conditions: mean of fusion competence 3, architecture 1, scale 1, tempo 2
  species: ovine
  source_ref: stokes2006
  uncertainty: ATLAS-ASSIGNED SCORE, NOT A REPORTED VALUE. The scoring scheme is
    defined in mouse_model_translation_risk and the axis scores are this atlas's judgement.
    source_ref formerly named williams2001 as the anchor primary for this model, which was wrong
    on two counts - that paper contains no sheep (CORR-036), and it does not contain this number
    either. It now names stokes2006, which is genuinely ovine among its three species. NO PRIMARY
    CONTAINS THIS SCORE; it must not be cited for it.
  atlas_derived: true
localization:
- 'ovine physis: no zonal tensile failure data located. The claim previously recorded here - that
  failure occurs preferentially near the HYPERTROPHIC zone - was wrong twice over (CORR-036): it
  was sourced to a bovine paper, and that paper reports the opposite end of the plate. williams2001
  found failure in the zone of columnation just below the resting zone, sometimes deviating INTO the
  reserve zone.'
human_evidence: absent
human_evidence_note: 'NO HUMAN OVINE-COMPARISON EXISTS. This field previously read that ovine
  physeal tensile data were generated alongside human comparison in the same study; the study
  (williams2001) compared HUMAN against BOVINE and included no sheep at all. The human physeal
  mechanical data this atlas holds are recorded on zonal_stiffness_gradient.'
species_basis:
- ovine
- bovine
translation_risk: moderate
translation_risk_reason: Large weight-bearing physis with human-comparable dimensions, but terminal
  fusion biology is uncharacterised in sheep.
