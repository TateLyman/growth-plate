localization:
- 'porcine RZ/PZ/HZ: zone-specific compressive properties measured'
- 'porcine inert zone: labelled cells present in all five animals, unlike human (thurston1985)'
human_evidence: indirect
human_evidence_note: One study labelled human and porcine growth plates side by side with the same pulse
  and the same processing (thurston1985), which is the strongest direct human-porcine comparison available
  and the only one in which a species difference cannot be an inter-laboratory difference. It rests on
  five pigs against two usable human subjects.
species_basis:
- porcine
- human
translation_risk: moderate
translation_risk_reason: Dimensional and mechanical similarity to human is high, but pigs are studied
  juvenile, growth completes much faster, and fusion is rarely the endpoint.
confidence: B
