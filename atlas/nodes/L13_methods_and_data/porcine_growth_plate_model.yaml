  unit: cells
  conditions: distal femur, five pigs, estimated from the labelling profiles
  species: porcine
  source_ref: thurston1985
  uncertainty: range across five animals (30, 36, 31, 34, 30); estimated from histogram shape, no dispersion
    reported
- parameter: terminal hypertrophic cell height along the growth axis
  value: 22-35
  unit: um
  conditions: distal femur, five pigs, mean of 20 cells each along the metaphyseal border
  species: porcine
  source_ref: thurston1985
