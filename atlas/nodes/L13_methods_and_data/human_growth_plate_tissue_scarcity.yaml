human_evidence: direct
human_evidence_note: The census counts human donors in human studies; it is a direct measurement
  of the human evidence base.
species_basis:
- human
translation_risk: not_applicable
translation_risk_reason: This node measures the size of the human evidence base rather than transferring
  an animal claim.
confidence: A
claim_grades:
- claim: At most about 100 postnatal growing human growth plates have been examined in studies that
    state a donor count.
  grade: A
  basis: Arithmetic over stated donor counts in 21 located primary studies; reproducible from atlas/quant/human_growth_plate_donor_census.csv.
- claim: The true number of distinct postnatal donors is lower than 102 because of cohort overlap.
  grade: E
  basis: Inference from shared authorship and single-centre recruitment; not verified against patient
    identifiers.
- claim: Essentially all postnatal human growth plate tissue is surgical waste.
  grade: A
  basis: 'Provenance is stated in each source: epiphysiodesis, polydactyly, amputation, transplant
    salvage.'
