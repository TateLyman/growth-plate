  species: human
  n: 5 preregistered panels, 32 genes
  source_ref: gse9160
  value_unverified: false
- parameter: SMOC1 - THE HUMAN BURDEN EFFECT, AND IT IS MONOTONE IN VARIANT SEVERITY
  unit: cm per allele
  value: 'kosmicki2026 Supplementary Table 6, 35 SMOC1 rows. PURE pLoF <0.1%: -1.630 cm, P=5.4e-05,
    303 heterozygotes. Best-powered row, pLoF + deleterious missense <0.1%: -0.990 cm, P=1.0e-09, 1,895
    carriers. The series orders by predicted damage: deleterious missense -0.87 to -0.98 (n~1,600),
    possibly-deleterious missense -0.31 to -0.34 (n~12,000), all missense -0.30 (n=12,123). More damaging
    = larger effect, which is the shape R324 identified as a real causal loss-of-function signal.
    DIRECTION: loss SHORTENS, so SMOC1 is LOAD-BEARING and the therapeutic direction is to RAISE it.
    SMOC1 is the ONLY one of the ten screen hits present in the 207.'
  species: human
  n: 1.45M exomes; 303 pLoF heterozygotes on the pure row
  source_ref: kosmicki2026
  value_unverified: false
- parameter: CORR-325 RUN BEFORE PROPOSING - AND SMOC1 PASSES MONOTONICALLY, WHICH THE MICROFIBRIL MODULE DID NOT
  unit: HPO term (qualitative direction)
  value: 'HPO genes_to_phenotype (operator-supplied 2026-08-13), SMOC1 = gene 64093: HP:0008897 Postnatal
    growth retardation (OMIM:206920), HP:0004322 Short stature (ORPHA:1106), HP:0001510 Growth delay
    (OMIM:206920). BIALLELIC LOSS SHORTENS AND HETEROZYGOUS LOSS SHORTENS - same direction, larger with
    fewer functional copies. THIS IS NOT A BAND. CORR-325 exists because FBN1 (+8.82 het / acromicric
    dysplasia biallelic), LTBP2 (+2.36 / Weill-Marchesani) and PLOD2 (+1.34 / Bruck) invert between the
    two doses and therefore have an interior optimum no agent can be titrated to. SMOC1 does not invert.
    None of the other nine screen hits has any HPO stature annotation at all.'
  species: human
  n: OMIM 206920 and ORPHA 1106
  source_ref: hpo_gene_phenotype
  value_unverified: false
- parameter: THE MOUSE LENGTH ENDPOINT - IN THE EXTREME TAIL OF THE ENTIRE CONSORTIUM, WITH A DOSE-RESPONSE
  unit: IMPC effect size; percentile of consortium-wide distribution
  value: 'IMPC statistical-results-ALL. Smoc1<tm1b(EUCOMM)Wtsi>, MRC Harwell, CORR-341 checked - single
    gene, no Cre, no double mutant. TIBIA LENGTH homozygote -7.483 (n=2m/4f) and heterozygote -2.050,
    genotype_effect_p=0.0538 (n=4m/5f). BASE RATE COMPUTED FIRST (CORR-329): 4,477 tibia-length rows,
    median -0.262, 63.3% negative - so the SIGN is the common direction and carries little information,
    but -7.483 SITS AT THE 0.18th PERCENTILE WITH ONLY 8 ROWS IN THE WHOLE CONSORTIUM MORE EXTREME
    DOWNWARD, and -2.050 at the 4.22nd. The het is 27% of the homozygous effect: a dose-response matching
    the human one.
    PARALOGUE, DIFFERENT CENTRE, DIFFERENT ALLELE TYPE: Smoc2<tm1.1(KOMP)Vlcg>, JAX, n=8m/8f, BODY LENGTH
    -3.577 at the 0.81st percentile of 6,817 rows, female_ko_p=1.26e-24 and male_ko_p=1.07e-07.
    CORR-348 APPLIED TO THE OTHER HITS: Frzb, Itih5, Ptgds, Crlf1, Cacnb1, Lrrc43 and Lyl1 have ZERO IMPC
    rows - never phenotyped, which says nothing. Sfrp5 has 144 rows across 123 parameters and NOT ONE IS A
    LENGTH - phenotyped with length absent from the assay, which also says nothing and looks like a null in
    any automated sweep. Cilp is the only genuine length null: body -0.470 P=0.147, tibia ns.'
  species: mouse
  n: Smoc1 hom 2m/4f, het 4m/5f; Smoc2 hom 8m/8f; base rate over 4,477 and 6,817 rows
  source_ref: impc_statistical_results
  value_unverified: false
- parameter: THE MECHANISM - SMOC1/SMOC2 KEEP CANONICAL WNT AWAY FROM STEM CELLS AND THAT IS WHAT MAINTAINS QUIESCENCE
  unit: qualitative mechanism (no numeric endpoint)
  value: 'chen2025smoc (Nat Commun 2025, abstract; full text NOT yet retrieved): incisor mesenchymal stem
    cells are marked by Smoc2, establish their identity and quiescence between E14.5 and E16.5 and persist
    into adulthood; "Smoc2 and its homologous molecule Smoc1 are indispensable for maintaining the
    quiescence and hierarchy of mesenchymal stem cells"; the stated mechanism is that they DISRUPT THE
    BINDING BETWEEN CANONICAL WNT LIGANDS AND GLYPICAN, the step that transports hydrophobic WNT ligands
    through an aqueous niche. Conclusion as written: stem cells establish quiescence through autocrine
    extracellular matrix molecules that keep canonical WNT ligands from accessing them.
    THE DIRECTIONS AGREE ACROSS THREE INDEPENDENT SOURCES: less SMOC = more Wnt reaching the stem cell =
    lost quiescence; SMOC1 pLoF = -1.63 cm; and R281 SPIN4 = mild chronic REDUCTION of canonical Wnt =
    LONGER BONE WITH A BIGGER RESTING POOL (TOPFLASH down, Axin2 down, RZ height up, Sfrp5+/CD73+
    progenitors up). One direction, three routes, and the screen found it without knowing about SPIN4.'
  species: mouse
  n: abstract-level for chen2025smoc - genotypes and any recombinant-protein arm NOT yet verified
  source_ref: chen2025smoc
  value_unverified: true
- parameter: THE RECLASSIFICATION AGAINST PERICHONDRIUM - AND WHY IT IS GOOD NEWS
  unit: ratio RZ/PC and MAS5 linear intensity
  value: 'Perichondrium was excluded from the denominator by design (it is a different tissue - CORR-339),
    so each hit was re-scored against PC afterwards. RZ-SPECIFIC, i.e. above the column AND above
    perichondrium in both donors: SFRP5 only, cleanly (RZ/PC 2.46 and 66.08), with LRRC43 and PTGDS
    qualifying on one probe set of three each and therefore weak.
    SMOC1 IS NOT AN RZ-SPECIFIC GENE: perichondrium >= RZ in BOTH donors (RZ/PC 0.42 and 0.87). Its honest
    compartment is PERICHONDRIUM + RESTING ZONE. Absolute values, probe 222784_at: RZ 2618/2606, PC
    6245/2985, against PZ 244/616, PHZ 109/118, HZ 638/298.
    PROBE HONESTY: of SMOC1''s two probe sets only 222784_at carries the signal; 222783_s_at is flat at
    ~300 everywhere. The carrier is the non-cross-hybridising probe and the flat one is the _s_at, which
    is the favourable way round, but it is one probe set of two and is recorded as such.
    WHY THIS HELPS: R323 established that R315''s delivery wall is about AVASCULAR cartilage and that the
    perichondrium - a vascularised sheath continuous with periosteum - is reachable by a systemic agent.
    HHIP, CHAD, CLEC3A, STC2 and ECRG4 all require crossing into avascular cartilage. SMOC1 does not.'
  species: human
  n: 2 donors, 5 compartments, every probe set scored separately
  source_ref: gse9160
  value_unverified: false
- parameter: POSTNATAL HUMAN CONFIRMATION AND CHEMICAL MATTER
  unit: CPM and pure/contaminated ratio; ChEMBL molecule count
  value: 'GSE288028 purity-corrected (R344 method, 5 purest vs 5 most blood-contaminated by COL2A1):
    SMOC1 41.8 CPM pure vs 17.4 contaminated = 2.32x, detected 12/12. SMOC2 137.3 = 1.97x, 12/12.
    SFRP5 54.8 = 9.17x, FRZB 51.0 = 3.26x, PTGDS 45.5 = 2.50x, ITIH5 19.4 = 1.53x - all 12/12.
    CILP 0.9 CPM, LRRC43 0.1 and LYL1 3.1 with ratio 0.62 are effectively absent or contaminant-leaning
    postnatally and are DROPPED. Reference: COL2A1 9.67x, ECRG4 16.35x, CLEC3A 9.91x, PTPRC 0.03.
    SMOC1 is present and modestly cartilage-enriched - NOT in the CHAD/ECRG4/CLEC3A enrichment class, and
    that is stated rather than hidden. Its claim is zonal position and human genetics, not abundance
    (CORR-349).
    CHEMICAL MATTER, on the proper ChEMBL query (CORR-347, not a drug count): SMOC1 has NO HUMAN CHEMBL
    TARGET RECORD AT ALL - zero, as expected for a secreted matricellular protein.'
  species: human
  n: 12 human samples, 4 patients
  source_ref: gse288028
  value_unverified: false
- parameter: THE WNT-AVAILABILITY LAYER IS ALMOST ENTIRELY UNCOVERED AND SMOC1 IS ITS ONLY HUMAN NUMBER
  unit: gene counts; cm per allele
  value: 'Of the whole secreted Wnt-availability set, only SMOC1 reaches kosmicki''s 207. NOT IN THE 207:
    SMOC2, SFRP1, SFRP2, SFRP4, SFRP5, FRZB, WIF1, DKK1, DKK2, NOTUM, GPC1, GPC3, GPC4, GPC5, GPC6.
    Prior atlas coverage of the transport machinery: GPC3 0 files, GPC4 0, GPC5 0, GPC1 1, GPC6 1,
    NOTUM 2 - i.e. the glypican step named as the mechanism has essentially never been examined here.
    CORR-300 REACHED A FOURTH TIME, NOW ON THE WNT AXIS WITH A COMPARTMENT: the extracellular Wnt brakes
    (SPIN4-like output reduction, SFRP5, FRZB, SMOC1) lengthen; the intracellular brake (tankyrase) failed
    from four independent directions - IMPC length R303, maturation timing R311, growth-capacity expression
    R312, compartment R318; and total ligand-secretion blockade (PORCN) gives the inverse zone
    decomposition and exhausts the plate (CORR-290). SAME PATHWAY, THREE DEPTHS, AND ONLY THE
    EXTRACELLULAR ONE WORKS. That is the first mechanistic account this file has of WHY tankyrase failed.'
  species: human
  n: 207 genes; 15 layer members checked
  source_ref: kosmicki2026
  value_unverified: false
- parameter: NEW CONTRAINDICATION CLASS - THE BONE-ANABOLIC WNT SHELF POINTS THE WRONG WAY FOR LENGTH
  unit: mm of metatarsal growth over 14 days (qualitative elsewhere)
  value: 'R281 places the canonical-Wnt optimum BELOW wild type, so raising Wnt from normal moves away from
    it. Every marketed or clinical-stage Wnt agent in bone RAISES Wnt, because the indication has always
    been bone MASS: romosozumab (already killed on absence, R314), GSK3 inhibitors including LITHIUM,
    NOTUM inhibitors, DKK1 antibodies. LITHIUM IS PRESCRIBED TO ADOLESCENTS AND HAS NEVER APPEARED IN THIS
    FILE''S CONTRAINDICATION LIST; the atlas holds it only as an in-vitro GSK3 tool in gsk3b_kinase
    (guidotti2015: LiCl raises beta-catenin and drives terminal differentiation plus oxidative DNA damage
    in human OA chondrocytes). This is R342''s shape on a new axis - the marketed shelf is pointed the
    opposite way from what height wants.
    ⚠ RECORDED AGAINST MYSELF, BECAUSE IT IS THE ONLY LENGTH DATA THAT EXISTS: lithium has TWO
    length-adjacent results and NEITHER supports the contraindication and NEITHER refutes it.
    soucek2024 - FETAL rat metatarsals ex vivo, 14 days: control +2.4+/-0.3 mm, dexamethasone +1.4+/-0.2,
    dexamethasone+LiCl +1.9+/-0.3 (P<0.001 vs dexamethasone alone). A PARTIAL RESCUE THAT DOES NOT REACH
    ITS OWN CONTROL, and no LiCl-alone arm is reported - CORR-203 exactly.
    lau2022lithium - MPS I dogs, oral lithium carbonate 14 days to 6 months: improved vertebral trabecular
    spacing/number/connectivity, and growth plates showed INCREASED HYPERTROPHIC CHONDROCYTE NUMBER
    relative to untreated MPS I AND to heterozygous controls - but no vertebral or long-bone LENGTH was
    reported, and more hypertrophic cells can equally mean faster differentiation, i.e. spending the
    period. Grade E. The honest statement is that no GSK3 inhibitor has a bone-LENGTH endpoint in a
    NORMAL animal, and that the two restoration results do not decide it. SPECIES: soucek2024 is RAT (fetal,
    ex vivo), lau2022lithium is DOG (disease model), guidotti2015 is HUMAN chondrocytes in vitro.'
  species: rat
  n: metatarsal culture; MPS I dogs
  source_ref: soucek2024
  value_unverified: false
localization:
- SMOC1 in the HUMAN growth plate is a PERICHONDRIUM + RESTING ZONE gene, not a resting-zone-specific one
  (GSE9160 probe 222784_at, both donors), and is present in 12/12 postnatal human samples at 2.32x
  cartilage enrichment. SFRP5 is the only unambiguously resting-zone-SPECIFIC gene the screen returns.
human_evidence: direct
human_evidence_note: The target''s effect size, its dose-response across variant severity, its biallelic
  phenotype and its zonal and postnatal localisation are all human. The MECHANISM (Wnt-glypican blockade
  maintaining stem-cell quiescence) is mouse incisor and is read at abstract level only; the length
  endpoints are mouse. The proposal therefore has a human TARGET and a mouse MECHANISM, and that split is
  the main thing standing between this and a promotion.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: 'Three separable risks. (1) The mechanism is from a TOOTH, and incisor mesenchymal
  stem cells are not resting-zone chondrocytes; that Smoc1/2 do the same job in the growth plate is an
  inference. (2) The direction is to SUPPLY a secreted protein, and SMOC2 is reported to modulate BMP2
  BIPHASICALLY - enhancing at low concentration and inhibiting receptor engagement at high - so a supply
  strategy has an interior optimum and could overshoot, which is the objection CORR-325 raises against
  every band. (3) The Smoc1 homozygous length result rests on n=2 males and 4 females, and its P is
  reported as 0.0, which is underflow rather than a real zero.'
confidence: C
claim_grades:
- claim: The genome-wide resting-zone contrast returns ten genes out of 6,219 detected, seven with zero
    prior atlas coverage, and three of the ten are secreted canonical-Wnt antagonists.
  grade: B
  basis: Direct computation on the only zone-resolved human growth-plate transcriptome, each donor scored
    separately against its own background, with a five-panel preregistered control set of which the
    hypertrophic and housekeeping panels behaved.
- claim: SMOC1 loss shortens humans monotonically from one copy to two, and the mouse null has a tibia in
    the bottom 0.2 per cent of the entire IMPC consortium with a heterozygous dose-response.
  grade: B
  basis: kosmicki2026 S6 with a 35-row internally consistent allelic series; HPO biallelic annotation;
    IMPC with the allele string checked (CORR-341), the length parameter confirmed present (CORR-348) and
    the base rate computed before the claim (CORR-329). Downgraded from A only by the tiny homozygous n.
- claim: SMOC1 acts by keeping canonical WNT ligands from reaching stem cells, and that is why its loss
    shortens.
  grade: D
  basis: Read at ABSTRACT level from a mouse INCISOR paper whose full text has not been retrieved. The
    genotypes, whether a double mutant was required, and whether recombinant protein was used are all
    unverified. The direction agrees with SPIN4 and with the human burden sign, which is why it is D and
    not E, but the growth plate has never been tested.
- claim: SMOC1 is the first pool-direction target in this file whose principal compartment is perfused.
  grade: C
  basis: Follows from the GSE9160 perichondrial peak (measured, both donors, one probe set of two) plus
    R323's established point that the perichondrium is vascularised and systemically reachable. It is a
    combination of two measured facts, not a delivery measurement - no agent has been shown to reach
    perichondrial SMOC1 in any species.
- claim: The bone-anabolic Wnt-raising pharmacopoeia, lithium included, is a contraindication for bone LENGTH.
  grade: E
  basis: Mechanistic only, from R281's band placing the optimum below wild type. The only two
    length-adjacent lithium results are restorations in damaged systems and one does not reach its own
    control. No GSK3 inhibitor has a bone-length endpoint in a normal animal. Recorded as a watch-item
    and an ask, not as established harm.
