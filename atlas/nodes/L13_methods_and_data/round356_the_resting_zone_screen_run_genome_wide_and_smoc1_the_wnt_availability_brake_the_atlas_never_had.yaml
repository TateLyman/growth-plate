contradicts:
- CORRECTS THE FRAMING OF ITS OWN HEADLINE. SMOC1 is not a resting-zone-specific gene - perichondrium
  exceeds RZ in both donors. The only unambiguously RZ-specific gene the screen returns is SFRP5, which
  lui2023 had already named. Anyone citing SMOC1 as an RZ gene is citing this node wrongly.
- QUALIFIES the whole screen. Four of five preregistered must-be-RZ controls (NT5E, PTHLH, GREM1, HHIP)
  fell below background in the resting zone, so the 0.2 per cent hit rate is a detection FLOOR and this
  platform cannot see the low-abundance secreted regulator class the pool question is about. A gene absent
  from this hit list has NOT been excluded - CORR-334's shape on a third platform.
- SUPPLIES THE FIRST MECHANISTIC ACCOUNT OF WHY TANKYRASE FAILED (R302/R303/R311/R312/R318). It is not
  that the canonical-Wnt band was wrong; it is that tankyrase is an INTRACELLULAR brake and CORR-300 says
  this axis pays off extracellularly. Does not revive tankyrase.
- ADDS A CONTRAINDICATION CLASS THE FILE NEVER STATED - the marketed Wnt-raising bone shelf, lithium
  included. Grade E, and the only two lithium length-adjacent results are restorations that do not decide it.
- DOES NOT PRODUCE A PRESCRIBABLE ADDITION. SMOC1 has zero chemical matter, the direction is to supply a
  secreted protein, and the mechanism has never been tested in a growth plate.
