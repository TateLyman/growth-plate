id: round356_the_resting_zone_screen_run_genome_wide_and_smoc1_the_wnt_availability_brake_the_atlas_never_had
name: Round 356 - the POOL round. The genome-wide resting-zone contrast, run for the first time on human
  tissue, returns SMOC1 - and the resting zone's own programme is three secreted canonical-Wnt antagonists
aliases:
- the pool round
- resting zone enrichment screen
- SMOC1
- the Wnt-availability layer
- why tankyrase was the wrong half
type: hypothesis
layer: L13
stub: false
summary: 'R355 concluded that the PERIOD question is substantially answered - anastrozole removes oestrogen
  ligand, vepdegestrant removes the receptor - and that the residual is N, the resting-zone pool, which
  nothing in the stack moves. Every pool candidate this atlas holds (HHIP, CHAD, SCUBE3, STC2, CLEC3A,
  ECRG4, SPIN4) arrived by some other route. THE OBVIOUS SCREEN HAD NEVER BEEN RUN. GSE9160 is the only
  zone-resolved transcriptome of a human growth plate and it separates RESERVE from proliferative,
  prehypertrophic and hypertrophic; R302 used it for PRESENCE on 251 hand-picked symbols and nobody had
  asked it, genome-wide, which genes the resting zone runs that the rest of the column does not. That is
  the pool-compartment analogue of R347 and it is free. Run with a preregistered five-panel control set:
  42,986 unambiguous probe sets, each donor separately (CORR-317), RZ against the CARTILAGE COLUMN ONLY
  with perichondrium excluded from the denominator, RZ required above that array''s own background.
  THE SCREEN RETURNS TEN GENES OUT OF 6,219 DETECTED - 0.2 PER CENT - AND SEVEN OF THE TEN HAD ZERO PRIOR
  ATLAS COVERAGE. Its structure is the finding: THREE of the ten are SECRETED CANONICAL-WNT ANTAGONISTS
  (SFRP5, FRZB, SMOC1), which is R281''s pool lever arrived at from human tissue by a route that knew
  nothing of SPIN4. SMOC1 is the only one of the ten in kosmicki''s 207 and it is LOAD-BEARING at
  -1.63 cm pLoF with a monotone missense series; its biallelic disease is short stature, so unlike the
  microfibril module it passes CORR-325 monotonically; the IMPC Smoc1 null has TIBIA LENGTH -7.48 at the
  0.18th percentile of 4,477 rows with a heterozygous dose-response at -2.05; the paralogue Smoc2 null
  has BODY LENGTH -3.58 at the 0.81st percentile with female P=1.3e-24; and the published mechanism is
  that SMOC1 and SMOC2 maintain mesenchymal STEM CELL QUIESCENCE by blocking canonical WNT ligands from
  binding glypican. A secreted extracellular Wnt-availability brake that preserves a stem-cell pool is
  exactly what the identity term N wants and exactly what CORR-300 says should outperform an intracellular
  brake - which is the first mechanistic account of why TANKYRASE failed from four independent directions
  while the same axis, entered extracellularly, keeps working. TWO HONEST LIMITS DOMINATE. Four of five
  preregistered must-be-RZ controls FELL BELOW BACKGROUND in the resting zone, so this platform is
  underpowered for precisely the low-abundance secreted regulators the pool question is about and the
  0.2 per cent is a FLOOR, not a measurement. And SMOC1''s peak compartment is the PERICHONDRIUM, not the
  resting zone - which is a correction to the framing and simultaneously the best practical news in the
  round, because R323 established the perichondrium is the one compartment where R315''s avascular
  delivery wall does not apply. SMOC1 is the first pool-direction target in this file whose principal
  compartment is PERFUSED. It has no chemical matter and its direction is to SUPPLY, but recombinant
  human AND mouse SMOC-1 are catalogue reagents and the Smoc1 mouse is made, so the validating experiment
  is an order and a caliper, not a discovery programme.'
