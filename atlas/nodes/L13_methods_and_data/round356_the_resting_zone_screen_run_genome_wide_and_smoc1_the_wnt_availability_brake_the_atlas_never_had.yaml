  unit: fold enrichment (RZ / max(PZ,PHZ,HZ)); gene counts
  value: '42,986 probe sets with an unambiguous gene symbol. 6,219 genes detected in RZ above that array''s
    own or_null_p95 background in BOTH donors. TEN of them are RZ-preferential at >=2x against the maximum
    of PZ/PHZ/HZ in BOTH donors = 0.2%. Ranked by minimum-across-donors enrichment: ITIH5 7.09, SMOC1 4.10,
    LRRC43 2.92, FRZB 2.79, SFRP5 2.67, PTGDS 2.60, CILP 2.37, CACNB1 2.29, CRLF1 2.15, LYL1 2.10.
    PRIOR ATLAS COVERAGE: ITIH5 0 files, SMOC1 0, PTGDS 0, CRLF1 0, CACNB1 0, LRRC43 0, LYL1 0; CILP 2,
    FRZB 3, SFRP5 22.'
  species: human
  n: 2 donors (female 11y10m, male 13y3m), 5 microdissected compartments each
  source_ref: gse9160
  value_unverified: false
- parameter: THE PREREGISTERED CONTROL PANEL - written before any result was printed, and it fired twice
  unit: fold enrichment (RZ / max(PZ,PHZ,HZ)), per donor
  value: 'MUST-BE-RZ panel: only SFRP5 passed (enr 2.67/12.26). NT5E, PTHLH, GREM1 and HHIP ALL FELL BELOW
    BACKGROUND in the resting zone in at least one donor. FOUR OF FIVE FAILED - the screen is insensitive
    to low-abundance secreted regulators in this compartment.
    MUST-NOT-BE-RZ (hypertrophic) panel: COL10A1, IBSP, MMP13, SPP1, ALPL, MEF2C - all six correctly NOT
    called RZ-preferential.
    FLAT housekeeping: GAPDH 1.10/0.96, PPIA 0.85/1.09, TUBB 0.98/0.84 all flat; ACTB 3.15 in donor 1 only.
    B2M was deliberately omitted as a housekeeper because CORR-339 caught it failing that role.
    CONTAMINANT panel (the reserve zone abuts the secondary ossification centre): DONOR 1''s RZ CARRIES A
    VESSEL SIGNATURE DONOR 2''s DOES NOT - VWF 74.66x, PECAM1 12.37x, CDH5 4.49x, CD74 4.59x, ALL IN DONOR
    1 ONLY (donor 2: 0.73, 1.04, 0.90, 0.89). The both-donors requirement is what removes it, and it was
