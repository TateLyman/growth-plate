localization:
- 'mouse HZ: type X collagen and MMP-13 present at 10 weeks, absent at 55 weeks'
human_evidence: absent
human_evidence_note: The node is about transferability; the human comparator facts come from human
  histology and imaging, not from mouse.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: Mice cannot fuse, so no murine experiment can be an experiment about fusion;
  tempo and scale differ by roughly an order of magnitude in the same direction.
confidence: A
