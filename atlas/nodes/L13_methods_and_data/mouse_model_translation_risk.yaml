  value: 2 vs 20
  unit: days
  conditions: rodent literature value quoted against the human estimate derived in the same paper
  species: multiple
  source_ref: kember1976
  uncertainty: human value derived, not directly measured
- parameter: mouse growth plate status at 55 weeks
