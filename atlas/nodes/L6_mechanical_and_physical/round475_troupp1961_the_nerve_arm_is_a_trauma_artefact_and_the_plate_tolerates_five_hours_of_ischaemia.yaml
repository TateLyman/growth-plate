id: round475_troupp1961_the_nerve_arm_is_a_trauma_artefact_and_the_plate_tolerates_five_hours_of_ischaemia
name: 'R475 - Troupp 1961: the nerve arm is a trauma artefact, devascularisation kills the plate, and the growth plate
  tolerates five hours of complete ischaemia'
aliases:
- troupp1961
- nervous and vascular influence on longitudinal growth
- tourniquet ischaemia tolerance
type: intervention
layer: L6
stub: false
confidence: B
last_verified: '2026-08-27'
species_basis: rabbit
human_evidence: absent
human_evidence_note: No human arm. The motivating clinical problem is poliomyelitic limb-length inequality, and the author's
  own conclusion is that the mechanism of that retardation remains obscure.
translation_risk: high
translation_risk_reason: Rabbit, operated at 13-17 days, all procedures unilateral and surgical. The ischaemia tolerance
  is the one figure with a plausible route to a human protocol and it is still a rabbit number.
summary: 'Obtained 2026-08-27 by resolving the CrossRef DOI (the hyphenated 10.3109/ort.1961.32.suppl-51.01 form), which
  redirects to actaorthop.org and serves the complete 78-page PDF free - the same B1 lesson a third time, since PubMed
  carries no abstract for it. 132 usable rabbits, nine procedures on the left hind limb, contralateral control, femoral
  and tibial length to 40-70 days.


  THE NERVE ARM RESOLVES AND IT RESOLVES AS AN ARTEFACT. Section of 3-4 lumbosacral MOTOR roots produced almost complete
  paralysis and severe muscle atrophy with only 5 per cent or less femoral retardation and almost none in the tibia;
  two roots gave atrophy and osteoporosis with no significant retardation. Section of 4 SENSORY roots did retard the
  femur - and histology found METAPHYSIAL FRACTURES, so the limb was being injured because it was anaesthetic, and PROTECTING
  it under the abdominal skin abolished both the fractures and the retardation. That is the control neither killion2017
  nor garces1988 has, and it adjudicates their disagreement in the direction of ''denervation per se does very little
  to longitudinal growth''.


  THE VASCULAR ARM IS A DESTRUCTION RESULT, NOT A REGULATION RESULT. Subtotal devascularisation retarded the femur 10-15
  per cent and the tibia more, through outright NECROSIS of the growth cartilage within 24 hours, with regeneration starting
  at the PERIPHERY at 48 hours and moving inward, and survivors past 21 days showing a cup-shaped tibial plateau with
  a broad central bony bridge. Lumbar sympathectomy did not compensate. So this arm says nothing about whether RAISING
  supply helps; it says removing it kills cells.


  THE NUMBER WORTH MOST IS AN ISCHAEMIA TOLERANCE. Complete limb ischaemia by rubber tourniquet caused NO significant
  retardation of tibial growth UP TO FIVE HOURS, read 40-42 days later as a percentage of the control limb; 6 hours gave
  some retardation and 7 hours more, with the author noting the residue may be vascular injury rather than the ischaemia.
  schneider1963''s whole method - a 30-minute tourniquet to confine intramedullary papain to one bone - therefore sits
  about ten-fold inside a measured envelope, and this atlas had no idea.


  AND THE HISTORICAL REVIEW SUPPLIES A GENERAL EXPLANATION FOR THE ABANDONED CORPUS THAT THIS FILE HAD NEVER HELD: Arkin
  and Katz''s proposal that IMMOBILISATION of the operated limb, with less pressure on the growth cartilages, is what
  accelerates growth. It would explain the corpus''s whole signature - transience, indifference to material, the narrow
  band, hansson1967''s spared operated side, elo1960''s within-bone split - with no local mechanism at all. This atlas''s
  own modern data argue against it (sibonga2000 and foster2019: going below normal weight-bearing does not lengthen bone),
  which is why it is recorded as a candidate the file can adjudicate rather than adopt. The competing explanation in
  the same review, Janes and Musgrove''s ''the common denominator is increased blood flow'', is undercut in the same
  paragraph by the observation that flow is DECREASED just distal to an arteriovenous fistula, at least at first.'
