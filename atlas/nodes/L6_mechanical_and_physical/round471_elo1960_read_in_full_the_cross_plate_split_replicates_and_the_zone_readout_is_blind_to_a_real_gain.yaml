  unit: mm
  species: rabbit
  source_ref: elo1960
  note: Table 14; the lesion is proximal and the gain is distal, while the proximal plate stimulates briefly at 7 weeks
    and then begins to retard and never reaches significance - and rabbit tibial growth comes MAINLY from the proximal
