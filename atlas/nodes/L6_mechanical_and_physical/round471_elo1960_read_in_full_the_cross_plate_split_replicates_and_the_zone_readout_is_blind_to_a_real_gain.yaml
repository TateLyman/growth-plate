id: round471_elo1960_read_in_full_the_cross_plate_split_replicates_and_the_zone_readout_is_blind_to_a_real_gain
name: 'R471 - elo1960 read in full: the within-bone cross-plate split replicates with bone markers, and a 2 mm length
  gain sits on zone heights indistinguishable from control'
aliases:
- elo1960 full read
- cross-plate split
- distal plate carries the gain
- zone height blind to a length gain
type: intervention
layer: L6
stub: false
confidence: B
last_verified: '2026-08-27'
species_basis: rabbit
human_evidence: indirect
human_evidence_note: No human arm. The two human counterparts of the cross-plate observation are shapiro1981 (unbroken
  ipsilateral tibia overgrows 0.29 cm in 82 per cent of children after femoral fracture) and cho2025 (unbroken ipsilateral
  femur after tibial fracture, 25 per cent of the discrepancy), neither of which has a mechanism. The zone-readout finding
  has a direct human counterpart in bylskiaustrow2018 and in the human arm of wilson2021.
translation_risk: high
translation_risk_reason: Rabbit, surgical, 1960, and the intervention itself is a subperiosteal skin graft that is of
  no interest as a route. What is claimed to transfer is not the intervention but two structural facts - that a distant
  plate responds while the near plate is inhibited, and that a real length gain can leave every zone height unmoved.
summary: 'elo1960 was item C2 in this atlas blocked list and item 9 on the operator own list of ten, sought as the abandoned-methods
  catalogue that schneider1963 cites. It was in the supplied bundle and read in full. The review section is there, but
  the EXPERIMENT is the valuable half and the blocked-item note had that backwards. 143 young rabbits, subperiosteal
  autogenous whole-thickness skin graft, free and without function, serial roentgenologic tibial length to one year,
  contralateral tibia as control, with FOUR control arms: subcutaneous tissue implanted the same way, plain periosteal
  detachment, skin graft into the MEDULLARY CAVITY, and an unoperated growth-control group. ONE - the effect and its
  band. Maximal mean discrepancy 2.3 mm at 17 weeks falling to 1.6 mm at 25 weeks and 1.4 mm at 12 months, so it decays
  partially and leaves a residual. Plain detachment and detachment plus subcutaneous tissue gave about 0.5 mm, minimal
  and transient, and plain LARGE detachment turned NEGATIVE by a year (-1.0 mm at 53 weeks). Extending the detachment
  BEYOND the epiphyseal line (series C) gave RETARDATION as the rule at 12 and 24 weeks. The authors own summary states
  the band: the detachment had to be sufficiently large AND outside the area of the epiphyseal cartilage or retardation
  ensued between 12 and 24 weeks. That is schneider1963 narrow limits of tolerance conclusion reached independently on
  a different intervention. TWO - the medullary-cavity control removes the obvious mechanisms. Implanting the skin graft
  INTO the marrow cavity produced the same cyst and did not stimulate growth. The authors words: cyst formation in the
  bone did not in itself cause stimulation of longitudinal bone growth; stimulation required extensive periosteal detachment.
  So it is not the foreign body, not the cyst, and not medullary occlusion - which is a direct negative control on the
  occlusion mechanism R442 and R450 built from Trueta 1953 and the modern metaphyseal-hole series. And the nutrient artery
  was deliberately LEFT INTACT by Brodin method, against Trueta who regarded its ligation as the stimulating factor and
  Brookes who RETARDED growth by ligating it - so this stimulation happened without touching the vessel the field argued
  about. THREE - the finding of the round. Series D placed X-RAY-POSITIVE MARKERS in the bone with the marker DISTAL
  to the cyst, and the postoperative positive discrepancy derives from the DISTAL epiphyseal cartilage, while the PROXIMAL
  cartilage - the one at the operative field, and the one that supplies most of rabbit tibial growth - gave some stimulation
  at 7 weeks and then began to RETARD, never reaching significance. Table 14, distal minus proximal: 0.3+/-0.1 (CI 0.0-0.6)
  over 6-8 weeks, 0.8+/-0.2 (0.2-1.3) over 6-12, 1.5+/-0.3 (0.9-2.2) over 6-16 - significant and growing. The marker
  placement also excludes new bone at the operation site as the source, which the author states and attributes to epiphyseal
  cartilage activity, citing Compere and Adams 1937 on femoral fractures. THIS INDEPENDENTLY REPLICATES brodin1955 -
  different laboratory, different decade, different intervention, added bone markers - and R450 line that the compartment
  split has not been reported since 1955 is therefore false in the file favour. FOUR - and Table 17 is a readout result.
  At 16 weeks, in animals carrying about a 2 mm length gain, there was NO significant difference between stimulated and
  control tibia in the height of the whole epiphyseal cartilage, NOR in the proliferating zone, NOR in the hypertrophic
  zone, at EITHER plate. The same table detects the within-animal proximal-versus-distal height difference at 2.48+/-0.44
  proliferating, 1.26+/-0.16 hypertrophic and 3.74+/-0.56 total - so the assay was sensitive and the treatment effect
  was invisible to it. R463 established from wilson2021 and bylskiaustrow2018 that the zone-height readout does not track
  growth and can miss a 34 per cent cell-level effect; this is the same rule with a POSITIVE, sustained, multi-millimetre
  length gain attached, and it says a plate can lengthen a bone without thickening at all.'
