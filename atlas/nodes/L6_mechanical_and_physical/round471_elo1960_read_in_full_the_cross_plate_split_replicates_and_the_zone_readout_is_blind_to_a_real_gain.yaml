  value: NO significant difference in whole cartilage height, proliferating zone height or hypertrophic zone height at
    either the proximal (left minus right 0.28 +/- 0.21, 0.11 +/- 0.10, 0.39 +/- 0.28) or the distal plate (0.30 +/-
    0.29, 0.15 +/- 0.10, 0.45 +/- 0.36), in animals carrying about a 2 mm length gain
