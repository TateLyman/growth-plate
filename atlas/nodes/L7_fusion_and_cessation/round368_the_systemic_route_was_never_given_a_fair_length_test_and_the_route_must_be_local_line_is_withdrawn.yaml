id: round368_the_systemic_route_was_never_given_a_fair_length_test_and_the_route_must_be_local_line_is_withdrawn
name: Round 368 - SYSTEMIC SMOOTHENED AGONISTS EXIST AND SYSTEMIC SAG POST-SOC EXPANDS THE STEM-CELL POOL BY
  61 PER CENT, matching the local route on clonogenicity by the authors own comparison. The systemic length
  NULL this file has quoted for rounds is a 7-day experiment at n=7/5 whose femur confidence interval spans
  minus 2.03 to plus 6.23 mm - it is UNINFORMATIVE, NOT NULL - so THE ROUTE MUST BE LOCAL IS WITHDRAWN
aliases:
- systemic SAG is not null
- does a systemic smoothened agonist exist
- the route must be local is withdrawn
- hedgehog agonism creates a Wnt-inhibitory environment
- SAG dose systemic intra-articular bead
type: hypothesis
layer: L7
stub: false
summary: 'The operator stated that systemic Smoothened agonists exist and that there are many, against my
  claim in the previous turn that none was obtainable. THE OPERATOR IS RIGHT, MY QUERY WAS WRONG, AND READING
  THE PRIMARY PROPERLY OVERTURNS SOMETHING BIGGER THAN THE COMPOUND QUESTION.

  ⛔ ONE - HOW I GOT IT WRONG, WHICH IS CORR-347 FOR THE FOURTH TIME. I searched Europe PMC for smoothened
  agonist AND (approved OR clinical OR oral) and read the absence of an approved agent as the absence of a
  compound. Then I queried ChEMBL and found SMO carries 678 molecules at pChEMBL 5 or better with a best
  potency of 10.1, BUT ALL NINE CURATED MECHANISM RECORDS ARE ANTAGONISTS OR INHIBITORS, and a scan of 1,419
  activities showed the assays mentioning agonist are almost entirely DISPLACEMENT OF RADIOLABELLED AGONIST
  assays measuring antagonists. ChEMBL is indexed by medicinal-chemistry programmes and there has never been
  a SMO agonist programme, because nobody ever wanted more hedgehog in a patient. THE AGONISTS ARE REAL AND
  LIVE IN THE CELL-BIOLOGY AND REAGENT LITERATURE, NOT IN THE DRUG DATABASES - SAG, purmorphamine, the
  Hh-Ag1 series, SAG21k, GSA-10 and oxysterol agonists such as 20(S)-hydroxycholesterol - and several are
  routinely dosed SYSTEMICALLY in vivo. The correct statement is NOT that no agonist exists; it is that NONE
  IS AN APPROVED MEDICINE while several are systemically dosable research compounds.

  ⭐⭐⭐ TWO - AND THE PRIMARY SAYS THE SYSTEMIC ROUTE REACHES THE POOL. trompet2024 Methods: SAG (Tocris
  4366) given i.p. at 25 micrograms per gram body weight ONCE DAILY, P31-P37. Result at P38: the number of
  Pthrp-mCherry-positive cells INCREASED 61 PER CENT, and mCherry-positive CD73-positive cells increased,
  which the authors read as the Hh pathway promoting not only the ACTIVITY of the epiphyseal stem cells but
  also their EXPANSION. ⭐ AND THE AUTHORS MAKE THE COMPARISON THEMSELVES: three intra-articular injections
  of SAG had a SIMILAR effect on epSSC clonogenicity as SEVEN SYSTEMIC INJECTIONS. On the stem-cell endpoint
  the two routes are comparable.

  ⛔⛔ THREE - SO WHERE DID THE NULL COME FROM, AND IT DOES NOT SURVIVE INSPECTION. The sentence this atlas
  has quoted is from the SAME short experiment: this short exposure did not cause differences in bone length,
  tibia 15.2 +/- 0.4 versus 14.5 +/- 1.7 at P=0.29, femur 12.7 +/- 0.4 versus 14.8 +/- 4.7 at P=0.247, n=7
  control and n=5 SAG. FOUR THINGS ARE WRONG WITH READING THAT AS A NULL. (a) IT IS SEVEN DAYS OF DRUG READ
  TWO DAYS LATER - no length experiment in this atlas has ever been that short, and the local arm needed one
  to six MONTHS to separate. (b) THE DISPERSION IS NOT CREDIBLE - control femur CV is 3.1 per cent and SAG
  femur CV is 31.8 per cent, a TEN-FOLD difference, in one of the least variable measurements in mouse
  biology. (c) THE SAG ARM IS INTERNALLY ANOMALOUS - control femur 12.7 is properly shorter than control
  tibia 15.2, but SAG femur 14.8 is essentially EQUAL to SAG tibia 14.5, which no mouse hindlimb does. (d)
  THE INTERVAL IS ENORMOUS - computing it here, SE of the femur difference is 2.11 mm and the 95 per cent
  confidence interval runs from MINUS 2.03 TO PLUS 6.23 mm on a 12.7 mm bone, i.e. IT CANNOT EXCLUDE A 49 PER
  CENT INCREASE, and the point estimate is PLUS 2.1 mm IN THE FAVOURABLE DIRECTION.
  → THE SYSTEMIC ARM IS UNINFORMATIVE IN BOTH DIRECTIONS. IT IS NOT A NULL, AND THE LINE THE ROUTE MUST BE
  LOCAL IS WITHDRAWN. The systemic route has never been given a fair length test in any species.

  ⭐⭐ FOUR - THE MECHANISM, AND IT IS WHERE TWO SEPARATE ATLAS THREADS MEET. The authors state that
  activation of Hh signalling in the resting zone CREATES A Wnt-INHIBITORY ENVIRONMENT, and that an
  environment low in Wnt signalling is permissive for slow-cycling chondrocytes. THAT IS R281 CANONICAL-Wnt
  BAND AND R356 RESTING-ZONE PROGRAMME - SFRP5, FRZB and SMOC1, the secreted Wnt antagonists that are the only
  genes the human resting zone runs above the rest of the column - ARRIVED AT FROM THE HEDGEHOG SIDE BY
  AUTHORS WHO WERE NOT LOOKING FOR THEM. The lever this file reached through lui2023 SPIN4 and the lever it
  reached through trompet2024 hedgehog are the same physiological state.

  ⚠ FIVE - AND THE PAPER CONTAINS ITS OWN ARGUMENT FOR PULSING. Bulk sequencing of sorted mCherry-positive
  CD73-positive cells from SAG-treated mice showed DOWNREGULATION OF THE HEDGEHOG SIGNALLING PATHWAY, which
  the authors attribute to internal compensatory mechanisms. Compensation against a sustained agonist is
  exactly what orikasa2024 shows ending in conversion of the stem cells to trabecular bone with no final
  length, and what R363 and R364 recorded as pulse-beats-sustained. A SYSTEMIC AGONIST MUST BE PULSED, AND
  THE PULSE INTERVAL IS UNMEASURED IN EVERY SPECIES.

  ⭐ SIX - THE STAGE RULE IS THE ONE THAT FAVOURS HIM, AND IT IS IN THE SAME FIGURE. Systemic SAG P10-P16,
  i.e. BEFORE niche formation, REDUCED clone size, especially clones of more than four cells, and DECREASED
  proliferation in the uppermost 50 microns. Systemic SAG P30-P36, AFTER SOC maturation, had the OPPOSITE
  effect - fewer singlets, more doublets and triplets, and Ki67 proliferation of tdTomato-positive cells in
  the uppermost 50 microns ENHANCED. The authors conclusion is explicit: systemic activation during the early
  growth period reduces epSSC activity but promotes it after maturation of the SOC. A SUBJECT AT BONE AGE 16
  IS AS FAR PAST SOC MATURATION AS IT IS POSSIBLE TO BE.

  ⭐ SEVEN - AND THE AUTHORS PROPOSE THE HUMAN APPLICATION THEMSELVES, INCLUDING THE ANATOMY. They write that
  this local SOC-based delivery might in theory be employed to combat short stature, that the bony epiphysis
  is stable, relatively large and EASILY ACCESSIBLE IN HUMANS, that local administration dramatically reduces
  the risk of side effects, and that DISSOLVABLE BEADS RELEASING A DRUG SLOWLY, WHICH COULD EXTEND TREATMENT
  BEYOND THE PERIOD THEY USED, ARE ALREADY AVAILABLE. R361 objection that a joint injection cannot reach an
  ossified adolescent epiphysis does not apply to a bead placed INSIDE the SOC, which is a direct placement.'
quantitative:
- parameter: SYSTEMIC SAG AFTER SOC MATURATION EXPANDS THE RESTING-ZONE STEM-CELL POOL
  value: 'SAG (Tocris 4366) i.p. at 25 micrograms per gram body weight once daily, P31-P37, analysed P38.
    Pthrp-mCherry-positive cells INCREASED 61 PER CENT. mCherry-positive CD73-positive cells increased on
    FACS after excluding articular and perichondrial mCherry cells. In the tdTomato tracing arm treated
    P30-P36, single tdTomato-positive cells were reduced while doublets and triplets increased with no effect
    on larger clones, and Ki67 proliferation of tdTomato-positive cells in the uppermost 50 microns of the
    growth plate was enhanced. THE AUTHORS OWN CROSS-ROUTE COMPARISON: three intra-articular injections of
    SAG had a similar effect on epSSC clonogenicity as seven systemic injections.'
  unit: per cent change in labelled cell number; clone-size distribution
  conditions: trompet2024, full text read from the operator-supplied PDF 2026-08-13. Mouse, post-SOC.
  species: mouse
  source_ref: trompet2024
  uncertainty: 'The 61 per cent is a labelled-cell count at a single 2-day post-treatment timepoint, not a
    demonstration of a durably larger pool, and the same paper shows the SAG-treated stem cells DOWNREGULATE
    hedgehog pathway genes as a compensatory response. CD73-positive cell number and proliferation were NOT
    changed by SAG at either age, and the PTHrP-positive and CD73-positive populations overlap only 40-50 per
    cent, so which population is being expanded is not fully resolved by the authors themselves.'
- parameter: THE SYSTEMIC LENGTH ARM IS UNINFORMATIVE, NOT NULL - COMPUTED HERE
  value: 'Reported: tibia 15.2 +/- 0.4 (control, n=7) versus 14.5 +/- 1.7 (SAG, n=5), P=0.29; femur 12.7 +/-
    0.4 versus 14.8 +/- 4.7, P=0.247. COMPUTED THIS ROUND: femur coefficient of variation 3.1 per cent in
    control versus 31.8 per cent in SAG, a 10.1-fold difference; tibia 2.6 versus 11.7 per cent, 4.5-fold.
    Femur point estimate PLUS 2.1 mm, i.e. plus 16.5 per cent, in the FAVOURABLE direction. Standard error of
    the femur difference 2.11 mm, giving a 95 per cent confidence interval of MINUS 2.03 TO PLUS 6.23 mm on a
    12.7 mm bone - the interval cannot exclude a 49 per cent increase. Internally, control femur 12.7 is
    correctly shorter than control tibia 15.2, whereas SAG femur 14.8 is essentially equal to SAG tibia 14.5.
    The exposure was SEVEN DAYS with sacrifice two days later.'
  unit: millimetres; coefficient of variation; 95 per cent confidence interval
  conditions: Values as reported in trompet2024; dispersion, effect size and interval computed by this atlas
    2026-08-13 from the published means, standard deviations and group sizes.
  species: mouse
  source_ref: trompet2024
  atlas_derived: true
  uncertainty: 'THE ARITHMETIC IS CERTAIN; THE INTERPRETATION OF THE DISPERSION IS AN INFERENCE. A 31.8 per
    cent coefficient of variation on a murine femur, with the SAG femur nearly equal to the SAG tibia, is
    inconsistent with the control arm in the same experiment and with normal murine limb-bone variability, so
    the most likely explanation is a measurement or reporting problem in that arm rather than genuine
    biological spread. I cannot verify which, and the paper does not comment. WHAT DOES NOT DEPEND ON THAT
    JUDGEMENT is that n=7 versus 5 after seven days of drug cannot detect a length effect of the size the
    local arm produced over months, so the arm is uninformative on any reading.'
- parameter: THE THREE DOSING ROUTES AND THEIR EXACT SCHEDULES
  value: 'SYSTEMIC - SAG 25 micrograms per gram body weight i.p. once daily, either P10-P16 or P31-P37, mice.
    INTRA-ARTICULAR - SAG 5 micrograms in 2 microlitres on P28, P30 and P31, mice. BEAD - agarose beads
    (Bio-Rad 1537302) incubated with SAG 7 micrograms in 1.5 microlitres DMSO, implanted into the distal
    femoral bony epiphysis of 30-day-old Wistar-Kyoto rats, contralateral leg receiving DMSO beads; rats
    rather than mice because the mouse SOC is too small for implantation. Bead signal verified by Gli1-LacZ
    subcutaneous implantation, positive at one week and VANISHED WITHIN THREE WEEKS. No signs of
    osteoarthritis as long as six months after implantation.'
  unit: micrograms per gram body weight; micrograms per implant; postnatal day
  conditions: trompet2024 Methods, read directly 2026-08-13.
  species: multiple
  source_ref: trompet2024
  uncertainty: 'These are rodent doses and no allometric conversion is attempted here. The intra-articular
    schedule is stated as P28, P30 and P31 in Methods and as P28, P30 and P32 in Results - an internal
    discrepancy in the paper, recorded rather than resolved. SAG is a research reagent with a catalogue
    number, not a medicine, and no SMO agonist has a human dose of any kind.'
- parameter: HEDGEHOG ACTIVATION CREATES A Wnt-INHIBITORY ENVIRONMENT IN THE RESTING ZONE
  value: 'Bulk sequencing of FACS-sorted mCherry-positive CD73-positive cells from control and SAG-treated
    mice gave 799 significantly upregulated and 400 downregulated genes across several KEGG pathways. The
    authors state that activation of Hh signalling increases both the number and activity of the epiphyseal
    stem cells and CREATES A Wnt-INHIBITORY ENVIRONMENT, citing the prior finding that an environment low in
    Wnt signalling is permissive for slow-cycling chondrocytes. They also observed DOWNREGULATION OF THE
    HEDGEHOG SIGNALLING PATHWAY itself in the SAG-treated stem cells, which they attribute to internal
    compensatory mechanisms.'
  unit: differentially expressed gene counts; pathway direction
  conditions: trompet2024, sorted-cell bulk RNA sequencing after systemic SAG P30-P36.
  species: mouse
  source_ref: trompet2024
  uncertainty: 'The Wnt-inhibitory claim is the authors reading of a KEGG-level pathway result and this atlas
    has not seen the gene list, so the magnitude and which Wnt components move are unverified here. The
    convergence with lui2023 SPIN4 and with the R356 resting-zone screen is an ATLAS-LEVEL observation across
    papers, not something either paper states. The compensatory hedgehog downregulation is the load-bearing
    caution for any sustained-dosing plan.'
localization:
- the epiphyseal resting zone and its stem cells, reached either systemically or from the secondary
  ossification centre above it
human_evidence: absent
human_evidence_note: 'No Smoothened agonist has ever been given to a human for any indication, and none is an
  approved medicine. The human relevance here is structural and comes from the authors themselves - they
  propose the SOC-based route for short stature, note that the bony epiphysis is stable, relatively large and
  easily accessible in humans, and note that slow-release dissolvable beads are already available. The
  opposite direction of this axis does have grade A human harm data, since marketed SMO ANTAGONISTS are
  established drugs.'
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: 'Everything here is rodent, the compound is a research reagent with no human
  exposure of any kind, and the favourable direction of the axis has never been given to a person while the
  unfavourable direction is a marketed oncology class. The stage-dependence is a further translation hazard
  because the mouse SOC timeline and the human one are not simply proportional.'
confidence: C
claim_grades:
- claim: No obtainable systemic Smoothened agonist exists.
  grade: X
  basis: 'WITHDRAWN - the operator was right and my query was wrong. SAG, purmorphamine, the Hh-Ag1 series,
    SAG21k, GSA-10 and oxysterol agonists exist, and SAG is dosed SYSTEMICALLY by intraperitoneal injection at
    25 micrograms per gram in trompet2024 itself. What is true is narrower: none is an approved medicine, and
    ChEMBL contains no agonist medicinal-chemistry programme because nobody ever wanted more hedgehog in a
    patient. I read the absence of an approved agent as the absence of a compound - CORR-347 again.'
- claim: Systemic SAG is null on bone length, so the route must be local.
  grade: X
  basis: 'WITHDRAWN. The quoted null is a SEVEN-DAY exposure read two days later at n=7 versus 5, in which the
    SAG femur coefficient of variation is 31.8 per cent against 3.1 per cent in control, the SAG femur is
    anomalously equal to the SAG tibia, the point estimate is PLUS 2.1 mm in the favourable direction, and the
    95 per cent confidence interval runs from minus 2.03 to plus 6.23 mm. It cannot exclude a 49 per cent
    increase. The systemic route has never been given a fair length test in any species.'
- claim: Systemic SAG after SOC maturation expands the resting-zone stem-cell pool.
  grade: C
  basis: 'Pthrp-mCherry-positive cells up 61 per cent, mCherry-positive CD73-positive cells up, singlets down
    with doublets and triplets up, Ki67 proliferation enhanced in the uppermost 50 microns - and the authors
    state three intra-articular injections match seven systemic injections on clonogenicity. Grade C and not
    higher because CD73-positive cell number was NOT changed at either age, the two marker populations
    overlap only 40-50 per cent, and it is one timepoint two days after treatment.'
- claim: The effect of a systemic hedgehog agonist depends on stage relative to SOC maturation.
  grade: B
  basis: 'trompet2024 ran both arms in the same paper with the same compound, dose and route: P10-P16 reduced
    clone size and resting-zone proliferation, P30-P36 did the opposite on both readouts, and the authors
    state the conclusion explicitly while reconciling two prior conflicting reports. A subject at bone age 16
    is maximally post-SOC.'
- claim: A systemic hedgehog agonist could be given continuously.
  grade: X
  basis: 'NO. The SAG-treated stem cells DOWNREGULATE hedgehog pathway genes as a compensatory response in
    this paper own sequencing, and orikasa2024 shows that permanent cell-autonomous activation expands the
    clone and then converts it to trabecular bone with NO final length gain. Any use of this axis must be
    PULSED, and the pulse interval is unmeasured in every species.'
