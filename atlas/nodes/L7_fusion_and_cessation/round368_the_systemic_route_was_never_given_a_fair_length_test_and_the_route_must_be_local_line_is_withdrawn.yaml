contradicts:
- WITHDRAWS THE LINE THE ROUTE MUST BE LOCAL, which this atlas has carried since R361 on the strength of a
  P value from a seven-day experiment. The systemic arm is uninformative in both directions and its femur
  point estimate is favourable.
- WITHDRAWS MY OWN CLAIM FROM THE PREVIOUS TURN that no obtainable systemic Smoothened agonist exists. That
  was CORR-347 for the fourth time - reading an absent APPROVED agent as absent chemical matter.
- CONVERGES R281 AND R356 WITH THE HEDGEHOG ARM. Hedgehog activation in the resting zone creates a
  Wnt-inhibitory environment; the human resting zone own programme is secreted canonical-Wnt antagonists; and
  SPIN4 loss produces a larger pool and a longer bone by lowering the same output. Three routes, one state.
