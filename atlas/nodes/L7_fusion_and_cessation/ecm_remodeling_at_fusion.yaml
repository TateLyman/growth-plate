human_evidence: indirect
human_evidence_note: >-
  Human evidence is limited to classical histology of mineralisation and metaplastic bone at
  union (haines1975); no human matrix composition data at fusion exist.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: >-
  The only quantitative matrix data come from a species that does not complete fusion, and the
  murine trajectory (loss of MMP-13 and Col X) is not obviously the trajectory of a plate that
  is about to be replaced by bone.
