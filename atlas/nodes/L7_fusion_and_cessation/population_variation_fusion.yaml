  unit: months (bone age older)
  conditions: 472 paediatric ACL reconstruction candidates, multicentre
  species: human
  source_ref: guevel2026
  uncertainty: SD 12.8; P<0.001; 95% limits of agreement approximately 2 years
- parameter: mean Greulich-Pyle bone age minus chronological age, Australian children
