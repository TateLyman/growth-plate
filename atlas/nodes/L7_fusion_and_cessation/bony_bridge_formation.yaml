localization:
- 'human plate at union: single or multiple perforations depending on epiphysis size (haines1975)'
- 'mouse tibial plate: hundreds of discrete bridges detectable by micro-CT (samvelyan2022)'
human_evidence: direct
human_evidence_note: >-
  Human bridging and perforation at union are described histologically (haines1975); no
  quantitative 3D bridge counts have been published for human physes.
species_basis:
- human
- mouse
translation_risk: moderate
translation_risk_reason: >-
  Bridge counting is well developed in mouse, where bridges never complete fusion; the human
  quantitative equivalent does not exist, so bridge number cannot currently be used as a
  cross-species surrogate for progress toward fusion.
confidence: C
