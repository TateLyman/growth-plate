key_refs:
- ref_id: king1994
  pmid: '7953224'
  first_author: King DG
  year: 1994
  type: primary
  one_line_finding: >-
    GP interobserver spread 0.96 years versus TW2 0.74 years, with GP more than five times faster
    (1.4 versus 7.9 minutes).
- ref_id: bull1999
  pmid: '10490531'
  first_author: Bull RK
  year: 1999
  type: primary
  one_line_finding: >-
    GP and TW2 are not equivalent (95% CI of difference -1.52 to +2.28 y) and GP has wider
    intra-observer limits (-2.46 to +2.18 y).
- ref_id: guevel2026
  pmid: '42159483'
  first_author: Guevel B
  year: 2026
  type: primary
  one_line_finding: >-
    In modern diverse US patients GP shows a 2.9-month systematic bias and about 2-year limits of
    agreement, with no differences by race, ethnicity or deprivation.
- ref_id: paxton2013
  pmid: '23374549'
  first_author: Paxton ML
  year: 2013
  type: primary
  one_line_finding: >-
    GP bone age was 2.2 months below chronological age in 406 Australian children, with no
    significant intra- or inter-observer difference.
