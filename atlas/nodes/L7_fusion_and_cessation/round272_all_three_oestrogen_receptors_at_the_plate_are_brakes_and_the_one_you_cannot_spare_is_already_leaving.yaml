id: round272_all_three_oestrogen_receptors_at_the_plate_are_brakes_and_the_one_you_cannot_spare_is_already_leaving
name: >-
  ROUND 272 - both GPR30 papers supplied and read in full. The sign is RESOLVED and it is not what round
  269 said or what round 270 settled for: ERalpha, ERbeta and GPR30 are ALL brakes on the plate, GPR30 is
  the transducer of oestradiol's suppression of TERMINAL CELL HEIGHT, and in the human growth plate GPR30
  DECLINES THROUGH PUBERTY while the other two do not - so at bone age 16 the receptor that cannot be
  spared is the one already leaving
aliases:
- round 272
- all three oestrogen receptors are brakes
- GPR30 resolved
- GPR30 declines through puberty
- oestrogen and h_term
type: hypothesis
layer: L7
stub: false
summary: >-
  TWO PAYWALLED PAPERS SUPPLIED AND READ IN FULL. Round 269 called GPER-1 the local ACCELERATOR opposing
  ERalpha. Round 270, on their abstracts, withdrew that to UNRESOLVED. Both were wrong in the same
  direction - the full texts resolve it, and they resolve it toward a simpler and more useful picture.

  ONE - GPR30 IS A BRAKE TRANSDUCER, AND THE EXPERIMENT IS CLEAN. windahl2009 gave ovariectomised
  three-month-old wild-type and GPR30-null mice graded oestradiol (0, 30, 70, 160, 830 ng/mouse/day). E2
  DECREASED FEMUR LENGTH in wild-type and DID NOT in GPR30-null. It reduced total growth plate height, the
  proliferative zone, the hypertrophic zone AND THE TERMINAL HYPERTROPHIC CHONDROCYTE HEIGHT in wild-type
  and in none of them in GPR30-null. Type X collagen immunostaining confirmed the hypertrophic reduction.
  PCNA-positive cells per millimetre of plate fell 50.4 plus or minus 7.3 per cent in wild-type (P < 0.05)
  and 25.2 plus or minus 15.4 in GPR30-null (not significant).
  AND THE SPECIFICITY IS THE STRONGEST PART. Across five doses, EVERY OTHER OESTROGENIC RESPONSE WAS
  INTACT in the nulls - total body BMD, spine BMD, trabecular BMD, cortical thickness, uterine weight,
  thymic atrophy, fat mass reduction, marrow cellularity. The authors' own conclusion is that GPR30 is NOT
  required for normal oestrogenic responses generally and IS required for the normal oestrogenic response
  IN THE GROWTH PLATE. That is about as selective as an in vivo receptor result gets.

  TWO - AND IT ASSIGNS OESTROGEN TO h_term, WHICH ROUND 264 COUNTED AMONG THE WORST-COVERED TERMS. The
  terminal hypertrophic chondrocyte height is the h_term of the round-247 identity, and it is 10 per cent
  of yield by the kember/lui/nilsson decomposition. windahl2009 shows oestradiol shrinks it and that GPR30
  is required for that to happen. This atlas had no receptor assignment for oestrogen's action on terminal
  cell height at all.

  THREE - THE BASELINE ROLE IS REAL BUT MOSTLY SYSTEMIC, WHICH IS WHY IT LOOKED LIKE AN ACCELERATOR.
  windahl2009 notes that VEHICLE-treated GPR30-null mice had reduced growth plate height versus vehicle
  wild-type, with a NON-SIGNIFICANT trend of reduced femur length. mrtensson2009 read in full shows why
  that is not a cartilage story: female GPR30-null mice lost 9.6 per cent of body weight by 19 weeks with
  BOTH crown-rump AND femur length significantly reduced - a PROPORTIONAL reduction, with organ-to-body
  weight ratios unaffected - alongside REDUCED SERUM IGF-I, hyperglycaemia, impaired glucose tolerance,
  raised blood pressure and abolished oestradiol-stimulated insulin release. MALE GPR30-NULL MICE HAD
  NORMAL SKELETAL DEVELOPMENT. Body fat and leptin were unchanged, so it is not nutritional, and ERalpha
  and ERbeta were expressed at normal levels, so it is not compensation.
  THAT IS THE SAME SHAPE AS BORJESSON'S ERALPHA RESULT - a systemic, IGF-1-mediated growth arm and a local
  cartilage arm that point different ways. chou2021's Col2a1-Cre chondrocyte-specific GPER-1 knockout,
  which DOES shorten bones cell-autonomously, is the genuine local baseline role; mrtensson2009's smaller
  female mice are largely the systemic one.

  FOUR - AND THE THIRD RECEPTOR IS A BRAKE TOO. chagin2004 followed female ERbeta-null, ERalpha-null and
  double-null mice to 18 months and reports that ERbeta INHIBITS BOTH APPENDICULAR AND AXIAL SKELETAL
  GROWTH and has the capacity to induce growth plate fusion. Note what that adds: BORJESSON'S CARTILAGE
  ERALPHA EFFECT WAS APPENDICULAR ONLY, with crown-rump non-significant. ERbeta reaches the axial skeleton
  as well - which is the half of standing height the ERalpha lever misses.
  SO ALL THREE OESTROGEN RECEPTORS EXPRESSED IN THE PLATE ARE BRAKES ON LONGITUDINAL GROWTH IN AT LEAST
  ONE RESPECT. There is no local accelerator. Round 269's two-receptor opposition does not exist.

  FIVE - THE HUMAN STAGE DATA, AND IT IS THE MOST DECISION-RELEVANT THING HERE. chagin2007a took TIBIAL
  GROWTH PLATE BIOPSIES FROM 14 BOYS AND 7 GIRLS at different pubertal stages, undergoing epiphysiodesis
  for leg-length inequality or EXTREME TALL STATURE - the same operation aeppli2025 describes and
  effectively the same population this programme cares about. GPR30 protein was highest in HYPERTROPHIC
  chondrocytes, and ITS EXPRESSION DECLINES AS PUBERTY PROGRESSES. heino2008 found the same decline in
  human osteocytes (R = -0.56, P < 0.01). By contrast, windahl2009's introduction records that ERalpha and
  ERbeta are expressed in the human plate at RELATIVELY SIMILAR LEVELS THROUGHOUT PUBERTY.
  THE RECEPTOR YOU CANNOT SELECTIVELY SPARE IS THE ONE THAT IS ALREADY LEAVING. At bone age 16 the
  GPR30-mediated brake is at its smallest and the ERalpha and ERbeta brakes are still fully present.

  SIX - WHAT THIS DOES TO THE LEVER ROUND 269 PROPOSED, AND IT SHARPENS IT RATHER THAN KILLING IT. The
  proposal was ERalpha blockade at the plate, sparing GPER-1, to remove the local brake while keeping
  oestrogen's systemic GH/IGF-1 benefit that an aromatase inhibitor destroys. THE CORRECTION IS THAT
  SPARING GPER-1 IS NOT THE POINT AND WAS NEVER AN ADVANTAGE - GPER-1 is a brake, not an accelerator. What
  survives, and is stronger for being simpler, is the LOCALITY argument: a systemic aromatase inhibitor
  removes the ligand for all three receptors AND removes the systemic arm, whereas blockade restricted to
  the plate removes the brake and keeps the arm. And the stage data says an ERalpha-directed agent loses
  less at a LATE plate than at an early one, because the receptor it does not cover is already declining.
  IT IS STILL GRADED E. Nobody has given a receptor-selective oestrogen antagonist to a normal growing
  animal with a bone length endpoint, no such agent is plate-restricted, and every result here is mouse
  except the expression data.
quantitative:
- parameter: >-
    GPR30 IS REQUIRED FOR OESTRADIOL TO SUPPRESS THE GROWTH PLATE - INCLUDING TERMINAL CELL HEIGHT - AND
    FOR NOTHING ELSE OESTROGEN DOES
  value: >-
    E2 decreased FEMUR LENGTH in wild-type (P < 0.05) and NOT in GPR30-null; E2 reduced total growth plate
    height, proliferative zone height, hypertrophic zone height AND TERMINAL HYPERTROPHIC CHONDROCYTE
    HEIGHT in wild-type and in NONE of them in GPR30-null; PCNA-positive cells per mm of plate fell 50.4
    plus or minus 7.3 per cent in wild-type (P < 0.05) versus 25.2 plus or minus 15.4 per cent in
    GPR30-null (n.s.). Total body BMD, spine BMD, trabecular BMD, cortical thickness, uterine weight,
    thymic atrophy, fat mass and marrow cellularity responded to E2 SIMILARLY in both genotypes at all five
    doses
  unit: femur length, zone and terminal cell heights, PCNA-positive cells per mm
  conditions: >-
    windahl2009, read in full from the supplied PDF. Three-month-old OVARIECTOMISED wild-type and
    GPR30-null mice, oestradiol at 0, 30, 70, 160 or 830 ng/mouse/day by slow-release pellet. DXA, pQCT,
    quantitative histology of the distal femur growth plate, type X collagen immunostaining, FACS of
    marrow.
  species: mouse
  source_ref: windahl2009
  uncertainty: >-
    OVARIECTOMISED ADULTS AT THREE MONTHS, so this is oestrogen-replacement pharmacology in a mature
    skeleton rather than pubertal physiology, and mouse plates do not fuse. The high dose, 830 ng/mouse/day,
    is the same supraphysiological dose borjesson2010 used to shrink the plate. THE PROPORTION of
    PCNA-positive chondrocytes was NOT significantly changed in either genotype - only the count per
    millimetre was - so the proliferation result is partly a plate-size effect. And a global knockout
    cannot separate cartilage-autonomous from systemic action, which is exactly the ambiguity
    mrtensson2009 exposes.
- parameter: >-
    THE BASELINE GPR30-NULL GROWTH DEFICIT IS PROPORTIONAL, FEMALE-SPECIFIC AND TRACKS SERUM IGF-I - SO IT
    IS LARGELY SYSTEMIC
  value: >-
    female GPR30-null mice lost 9.6 per cent of body weight by 19 weeks (P < 0.05) with BOTH crown-rump
    length AND femur length significantly reduced and organ-to-body-weight ratios unaffected, alongside
    REDUCED SERUM IGF-I, hyperglycaemia, impaired glucose tolerance and raised blood pressure; MALE
    GPR30-null mice had NORMAL skeletal development. White adipose depot weights and serum leptin were
    unchanged; ERalpha and ERbeta were expressed at normal levels
  unit: per cent of wild-type, and significance of crown-rump and femur length
  conditions: >-
    mrtensson2009, read in full from the supplied PDF. Global GPR30 knockout, female and male, followed to
    19 weeks. The authors' own summary is that GPR30 is required for normal bone growth, glucose
    homeostasis and blood pressure IN FEMALE MICE.
  species: mouse
  source_ref: mrtensson2009
  uncertainty: >-
    THE CONFOUND IS THE POINT OF THIS ROW. A proportional axial-and-appendicular deficit, female-only,
    with reduced serum IGF-I and a full metabolic syndrome alongside it, is the signature of a SYSTEMIC
    growth defect - not a cartilage one. It cannot be used as evidence that GPR30 drives growth at the
    plate, which is how round 269 used it at second hand. What DOES support a local baseline role is
    chou2021's chondrocyte-specific Col2a1-Cre knockout, and windahl2009's observation that
    VEHICLE-treated GPR30-nulls had reduced plate height with only a non-significant trend in femur length.
- parameter: >-
    IN THE HUMAN GROWTH PLATE, GPR30 IS HIGHEST IN HYPERTROPHIC CHONDROCYTES AND DECLINES THROUGH PUBERTY,
    WHILE ERALPHA AND ERBETA DO NOT
  value: >-
    GPR30 protein highest in HYPERTROPHIC chondrocytes and declining as puberty progresses, in tibial
    growth plate biopsies from 14 boys and 7 girls; in human osteocytes the same decline, R = -0.56,
    P < 0.01, with no sex difference; ERalpha and ERbeta are expressed in the human plate at relatively
    similar levels throughout puberty
  unit: immunohistochemical expression against pubertal stage
  conditions: >-
    chagin2007a - tibial growth plate biopsies taken at epiphysiodesis performed for leg-length inequality
    or EXTREME TALL STATURE, patients at different stages of puberty, paraffin sections, immunohistochemistry.
    heino2008 - metaphyseal bone biopsies from 14 boys and 6 girls across puberty; GPR30-positive osteocytes
    58 plus or minus 4 per cent versus osteoblasts 46 plus or minus 3 per cent (P < 0.05).
  species: human
  source_ref: chagin2007a
  uncertainty: >-
    READ FROM ABSTRACTS - both papers are paywalled and are on the ask list, so the quantification of the
    growth-plate decline, its statistics and its zonal detail are not held. Immunohistochemistry is
    semi-quantitative and antibody-dependent, and GPR30 antibodies have a poor reputation in the wider
    literature. Twenty-one patients, cross-sectional across pubertal stages rather than longitudinal, and
    drawn from a surgical population selected for abnormal growth. The ERalpha/ERbeta comparison is taken
    from windahl2009's citation of two other papers rather than measured alongside.
- parameter: >-
    ERBETA IS ALSO A BRAKE, AND UNLIKE CARTILAGE ERALPHA IT REACHES THE AXIAL SKELETON
  value: >-
    ERbeta INHIBITS both APPENDICULAR and AXIAL skeletal growth and has the capacity to induce fusion of
    the growth plates in female mice
  unit: qualitative, appendicular and axial growth and fusion
  conditions: >-
    chagin2004, female ERbeta-null, ERalpha-null and ERalpha/ERbeta double-null mice followed to 4 and 18
    months, with X-ray, dynamic histomorphometry, quantitative histology, calcein double labelling, BrdU
    and TUNEL.
  species: mouse
  source_ref: chagin2004
  uncertainty: >-
    READ FROM THE ABSTRACT - paywalled and on the ask list, so magnitudes are not held. THE AUTHORS FLAG
    THEIR OWN CONFOUND AND IT IS SERIOUS: the ERalpha-null and double-null models have CLEARLY INCREASED
    SERUM OESTRADIOL, so comparisons involving them are not clean. The ERbeta-null model itself does not
    carry that confound, which is what makes the ERbeta conclusion usable. FEMALE MICE ONLY, and
    windahl2009's own introduction records that ERbeta modulates growth in female but NOT male mice - so
    the axial reach of this brake may not transfer to a male subject.
localization:
- 'hypertrophic chondrocyte: where human GPR30 is highest, and where oestradiol shrinks terminal cell
  height through GPR30'
- 'human growth plate resting and hypertrophic zones: where GPR30 immunoreactivity was localised'
- 'whole animal: where the GPR30-null growth deficit actually sits - proportional, female-only, with
  reduced serum IGF-I'
human_evidence: indirect
human_evidence_note: >-
  The human evidence here is EXPRESSION, not function - GPR30 protein in tibial growth plate biopsies from
  21 children across puberty, and in metaphyseal bone from 20 more, both showing a pubertal decline. No
  human functional or interventional data on any of these receptors in the plate exists. The human
  functional anchor for the oestrogen axis as a whole is held elsewhere in this atlas as aromatase
  deficiency and ESR1 loss of function.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: >-
  Every functional result is mouse, two of them in global knockouts and one in ovariectomised adults at a
  supraphysiological oestradiol dose; the human data are immunohistochemical expression in a small
  surgical cohort.
confidence: B
confidence_reason: >-
  The two load-bearing papers were read in full from supplied PDFs and the specificity control in
  windahl2009 - eight other oestrogenic responses intact across five doses while only the growth plate
  response was lost - is unusually strong. Graded B rather than A because the ERbeta and human-expression
  rows are abstract-only, the knockouts are global, and no human functional test exists.
claim_grades:
- claim: >-
    GPER-1 is the local oestrogen ACCELERATOR, opposing ERalpha.
  grade: X
  basis: >-
    ROUND 269 SAID THIS AND IT IS WRONG. windahl2009 read in full - oestradiol reduced femur length, total
    plate height, proliferative and hypertrophic zone heights and terminal hypertrophic cell height in
    wild-type mice and in NONE of them in GPR30-null mice, while eight other oestrogenic responses were
    intact across five doses. GPR30 TRANSDUCES OESTROGEN'S SUPPRESSION OF THE PLATE. It is a brake.
- claim: >-
    The sign of GPER-1 is unresolved.
  grade: X
  basis: >-
    ROUND 270 SAID THIS ON THE ABSTRACTS AND IT WAS TOO WEAK. The full texts resolve it. GPR30 is a brake
    transducer with an additional BASELINE permissive role, and mrtensson2009 shows that baseline role is
    proportional, female-specific and accompanied by reduced serum IGF-I with a full metabolic syndrome -
    i.e. largely SYSTEMIC. The cartilage-autonomous baseline component rests on chou2021's Col2a1-Cre
    knockout and on the reduced plate height in vehicle-treated nulls.
- claim: >-
    All three oestrogen receptors expressed in the growth plate act as brakes on longitudinal growth.
  grade: C
  basis: >-
    Cartilage ERalpha - borjesson2010, deletion gives +3.17 per cent femur at one year and protection from
    high-dose E2. ERbeta - chagin2004, inhibits appendicular AND axial growth and can induce fusion. GPR30
    - windahl2009, required for E2 to shorten the femur and shrink every zone including terminal cell
    height. THERE IS NO LOCAL ACCELERATOR IN THIS SET. Graded C because it assembles three studies with
    different models, sexes and ages, two of them read from abstracts, and because each receptor also has a
    systemic arm pointing the other way.
- claim: >-
    Oestradiol suppresses TERMINAL HYPERTROPHIC CELL HEIGHT, and GPR30 is required for it.
  grade: C
  basis: >-
    windahl2009 measured terminal hypertrophic chondrocyte height directly and found E2 reduced it in
    wild-type and not in GPR30-null mice. This is the h_term term of the round-247 identity - about 10 per
    cent of yield - and this atlas previously had NO receptor assignment for oestrogen's action on it.
    Single study, global knockout, ovariectomised adults, supraphysiological dose.
- claim: >-
    In humans the GPR30 brake is smaller at a late plate than at an early one.
  grade: D
  basis: >-
    chagin2007a - GPR30 protein in tibial growth plate biopsies from 21 children DECLINES as puberty
    progresses, highest in hypertrophic chondrocytes; heino2008 finds the same decline in human osteocytes
    (R = -0.56). ERalpha and ERbeta do not decline. Graded D because both are abstract-only,
    immunohistochemical, cross-sectional, small, from a surgical population selected for abnormal growth,
    and because GPR30 antibody specificity is contested in the wider literature.
- claim: >-
    Sparing GPER-1 was an advantage of a receptor-selective approach.
  grade: X
  basis: >-
    IT WAS NOT, AND THAT WAS ROUND 269's ERROR COMPOUNDING ITSELF. GPER-1 is a brake, so sparing it
    preserves a brake. What survives from round 269's proposal is the LOCALITY argument alone - blockade
    restricted to the plate removes the brake while keeping the systemic GH/IGF-1 arm that an aromatase
    inhibitor destroys - and that argument never depended on which receptor was covered.
- claim: >-
    A plate-restricted oestrogen-receptor antagonist is a demonstrated lever.
  grade: E
  basis: >-
    NO SUCH AGENT EXISTS AND NO SUCH EXPERIMENT HAS BEEN RUN. Nobody has given a receptor-selective
    oestrogen antagonist to a normal growing animal with a bone length endpoint, nothing available is
    plate-restricted, and the entire functional case is mouse. Recorded as the round's open proposal.
