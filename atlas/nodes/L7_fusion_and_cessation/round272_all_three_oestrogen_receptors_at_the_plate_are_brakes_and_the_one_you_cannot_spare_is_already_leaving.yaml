contradicts: >-
  CORRECTS BOTH OF THE TWO PRECEDING ROUNDS ON THE SAME POINT.
  round269_the_sweep_the_atlas_owed_itself_and_the_three_levers_it_was_sitting_on called GPER-1 the local
  ACCELERATOR opposing ERalpha; that is refuted - GPR30 is required for oestradiol to shorten the femur and
  shrink every growth plate zone including terminal cell height.
  round270_the_oestrogen_brake_is_local_and_worth_three_per_cent_and_my_two_receptor_story_was_wrong then
  withdrew the claim to UNRESOLVED on the abstracts; the full texts resolve it. GPR30 is a brake transducer
  with an additional baseline permissive role that mrtensson2009 shows to be proportional, female-specific
  and IGF-I-linked, hence largely systemic. Adding chagin2004's ERbeta result gives a single picture: ALL
  THREE oestrogen receptors in the plate are brakes and there is no local accelerator. The LOCALITY
  argument of round 269 survives intact and is now the whole of that proposal; the receptor-selectivity
  half of it is withdrawn.
