contradicts:
- ANSWERS THE OPERATOR'S QUESTION AGAINST THE STACK'S OWN DESIGN. What is closing him once oestrogen is
  suppressed is the pool running down, and the stack's largest arm is a throughput agent that consumes the
  pool five times faster while lowering yield per resting cell by 23 per cent.
- CORRECTS MY OWN FIRST READING WITHIN THE ROUND. "GH spends the reserve" does not mean GH destroys height.
  On a fixed pool, amplification times terminal cell height gives GH +5.2 per cent, IGF-I +11.3 per cent.
  The somatotropic axis is height-neutral per unit pool and acts on SPEED.
- SHARPENS RATHER THAN CONTRADICTS THE SETTLED ROW THAT GH AFTER MID-PUBERTY GIVES ABOUT ZERO ATTAINED
  HEIGHT. That row was a human observation with SOCS2 as its stated mechanism; this supplies a second,
  independent mechanism at the level of the plate itself.
- PUTS A COST ON THE ANSWER TO R355. R355 noted approvingly that vosoritide and infigratinib raise velocity
  without advancing bone age, and read that as the rate arms buying velocity without spending period. This
  round warns that BONE AGE IS NOT THE POOL - a maturation marker and a division count are different
  quantities, and an agent can spend the pool without moving bone age.
