  uncertainty: single specimen; described by the authors as unique
localization:
- 'human growth plate: mineralisation advances from both epiphyseal and metaphyseal surfaces before union (haines1975)'
- 'human fusing plate: disorganised large chondrocytes bounded by dense cortical-like bone (emons2009)'
- 'human late-uniting epiphyses: multiple perforations, remnants persist as physeal scar (haines1975)'
human_evidence: direct
human_evidence_note: >-
  Directly described in human autopsy/surgical material (haines1975) and in one human fusing
  growth plate with immunohistochemistry and electron microscopy (emons2009); radiographic and
  MRI timing data exist in cohorts of hundreds (kvist2021).
