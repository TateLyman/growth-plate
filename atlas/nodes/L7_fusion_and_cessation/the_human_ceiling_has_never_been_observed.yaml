human_evidence: direct
human_evidence_note: 'Human throughout: one 88-patient cohort, one 24-year-old case report, and one uniquely uncloseable
  individual followed for 3.5 years.'
species_basis:
- human
translation_risk: low
translation_risk_reason: Human observations. The risk is that censored observations were read as endpoints, which
  is what this node corrects.
confidence: B
confidence_note: 'RAISED C to B on 2026-08-06 after the systematic census. The central claim is now a negative one
  supported by an exhaustive search rather than by two case reports: 743 records screened, 45 full texts read, one
  published tabulation of all male aromatase cases, and no spontaneous endpoint anywhere. B not A because a literature
  census cannot exclude unpublished clinical follow-up - which is the point, since that is where the answer would
  be - and because the count of male aromatase cases is one review''s tabulation.'
