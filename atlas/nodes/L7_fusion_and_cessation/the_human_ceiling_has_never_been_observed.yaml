id: the_human_ceiling_has_never_been_observed
name: The oestrogen-null ceiling has been observed ONCE - growth stopped at 24 with the plates still open
type: hypothesis
layer: L7
stub: false
summary: 'CORRECTED 2026-08-07, AND THE CORRECTION IS THE HEADLINE. This node asserted that no oestrogen-null
  human has ever reached a final height without intervention. ONE HAS. herrmann2002, read in full for the first time
  on 2026-08-07, records that his patient was 170 cm at 14 and CONTINUED TO GROW UNTIL THE AGE OF 24 - and that at
  presentation aged 27, still untreated, he was 197 cm with an arm span of 204 cm, a bone age of 16, and a hand X-ray
  showing OPEN EPIPHYSES. GROWTH CEASED SPONTANEOUSLY AT 24 WHILE THE PLATES REMAINED ANATOMICALLY OPEN THREE YEARS
  LATER. That is the human counterpart of rat_growth_cessation_without_fusion, it is the first observed endpoint in
  this literature, and it says the plate exhausts itself whether or not anything closes it. THE CENSUS SURVIVAL
  ANALYSIS IS UNCHANGED ON ITS OWN TERMS - its event was SPONTANEOUS EPIPHYSEAL CLOSURE and there are still zero of
  those - but on the event that actually decides height, GROWTH CESSATION, there is now ONE EVENT: age 24, about 197
  cm, untreated. The cessation age is a HISTORY STATEMENT in a case report rather than a series of measurements, and
  everything here is qualified by that. MOST OF THE ORIGINAL NODE SURVIVES: every other observation remains
  right-censored by treatment, and 204 cm is still not a final height. This atlas has been treating 204 cm as the
  ceiling of the duration lever, on the strength of two men - one
  ESR1-null, one aromatase-deficient - who reached it. THAT NUMBER IS NOT A FINAL HEIGHT. It is the height at which
  each was measured and, in the aromatase cases, the height at which a clinician deliberately stopped them: the 2022
  case report of a 24-year-old with undetectable oestradiol, a history of progressive increase in height and open
  wrist and knee epiphyses states that he was started on oral estradiol valerate FOR EPIPHYSEAL CLOSURE TO PREVENT
  FURTHER INCREASE IN HEIGHT. Every aromatase-deficient man is treatable, and is treated on diagnosis, because oestrogen
  replacement closes the plates. The natural endpoint is therefore never reached. THERE IS EXACTLY ONE EXCEPTION AND
  HE IS THE MOST INFORMATIVE PERSON IN THIS FIELD. The ESR1-null man cannot be closed pharmacologically - his receptor
  is broken, and six months of transdermal oestrogen producing a tenfold rise in free oestradiol had no detectable
  effect. He was 204 cm at 28 with incomplete epiphyseal closure and a history of continued linear growth into adulthood;
  on follow-up 3.5 years later his bone age had advanced only from 15 to 17.5. AT ROUGHLY 31 YEARS OLD HIS GROWTH
  PLATE HAD NOT RUN OUT. No later height for him appears in the record this atlas can reach. AND THE LARGE COHORT
  COMPLICATES THE PICTURE RATHER THAN CONFIRMING IT. 88 patients with combined 17-hydroxylase/17,20-lyase deficiency
  - complete absence of sex steroid synthesis from birth - give final heights for 51: 77% at or above the 50th percentile
  and 39% at or above the 90th, not 204 cm. Most were treated. So total lifelong sex-steroid absence does NOT reliably
  produce extreme stature, and the two 204 cm men are the tail of a distribution rather than its centre. A SYSTEMATIC
  CENSUS ON 2026-08-06 SETTLES THE QUESTION AND THE ANSWER IS THAT NOBODY HAS EVER LOOKED. Across 743 records screened
  and 45 full texts read, at least twenty people are documented with complete loss of oestrogen signal or synthesis
  - six with ESR1 loss of function, fourteen males with aromatase deficiency - and NOT ONE has a reported final height
  reached without intervention. Eleven of the fourteen aromatase males are described at the time of report as tall,
  with delayed skeletal age, or with unfused epiphyses. The two people whose signal cannot be restored by any means
  - the Smith propositus and the female of brakta2020, who failed 2.5 years of diethylstilbestrol after 75 compounds
  were screened - were followed to about 31 and to 24 respectively, and neither has a published endpoint.'
quantitative:
- parameter: FINAL HEIGHT under complete lifelong absence of sex steroid synthesis
  value: 77% at or above the 50th percentile; 39% at or above the 90th; 8% at or below the 25th
  unit: percentile of final height
  conditions: 51 patients with final height available, from a cohort of 88 with combined 17-hydroxylase/17,20-lyase
    deficiency (CYP17D) in Brazil. Bone age delayed by 2 years or more in 92.5%; median chronological age 15.8 years
    against bone age 11 years at diagnosis
  species: human
  source_ref: cyp17d2025
  uncertainty: 'THIS IS THE LARGEST HUMAN COHORT WITH LIFELONG SEX-STEROID ABSENCE AND IT DOES NOT SHOW EXTREME STATURE.
    It bounds the 204 cm claim hard. THREE THINGS LIMIT IT AND ALL RUN THE SAME WAY: patients are treated once diagnosed,
    and hormone replacement closes the plates, so these are largely TREATED final heights; the reference percentile
    is not specified in the abstract and virtually all patients are phenotypically female regardless of karyotype,
    so an XY patient at the 90th female percentile is near an average male height; and diagnosis is late, median 15.8
    years. The authors nonetheless describe UNTREATED adults as tall and eunuchoid. THE UNTREATED SUBGROUP''S FINAL
    HEIGHTS ARE THE NUMBER THIS ATLAS WANTS AND THE ABSTRACT DOES NOT SEPARATE THEM.'
- parameter: is the 204 cm figure a final height
  value: no - it is a height at measurement, and in the aromatase cases a height at intervention
  unit: none
  conditions: a 24-year-old male with two novel CYP19A1 mutations, undetectable oestradiol, progressive increase in
    height and open wrist and knee epiphyses was started on oral estradiol valerate for epiphyseal closure to prevent
    further increase in height
  species: human
  source_ref: aromdef2022
  uncertainty: THE SENTENCE IS EXPLICIT AND IT REFRAMES EVERY AROMATASE-DEFICIENCY HEIGHT IN THE LITERATURE. These
    men are stopped on purpose, because oestrogen replacement is both the treatment for their osteopenia and the means
    of closing their plates. So the published heights are censored observations, not endpoints, and the field has
    been reading a treatment decision as a biological limit. This atlas did the same until 2026-08-06.
- parameter: the one human whose growth plate could not be switched off
  value: 204 cm at 28 with incomplete closure; bone age 15 to 17.5 over the next 3.5 years
  unit: cm and years of bone age
  conditions: homozygous ESR1 nonsense mutation; six months of transdermal oestrogen producing a tenfold rise in free
    oestradiol had no detectable effect, because the receptor is absent
  species: human
  source_ref: smith2008
  uncertainty: 'AT ROUGHLY 31 YEARS OF AGE HIS PLATE HAD NOT RUN OUT - bone age 17.5 and epiphyses still open. He
    is the only human being in the record whose growth plate has never been switched off and cannot be. NO LATER HEIGHT
    FOR HIM HAS BEEN LOCATED. That single missing number discriminates between the two models this atlas holds: if
    oestrogen merely ACCELERATES a fixed division budget, he should converge on a final height reached late; if oestrogen
    imposes an endpoint the budget would not otherwise reach, he should still be growing. n=1, and one of the most
    informative n=1s in human biology.'
- parameter: what the atlas previously claimed, and withdraws
  value: that the duration lever has a demonstrated ceiling of +25 cm
  unit: none
  conditions: docs/POSITIVE_LEDGER.md sections 3 and 9, written 2026-08-06
  species: human
  source_ref: cyp17d2025
  uncertainty: WITHDRAWN THE SAME DAY. Two case reports at 204 cm were treated as a ceiling; a 51-patient cohort with
    the same physiological lesion has final heights mostly near the population median, and the 204 cm figures are
    censored by treatment. THE HONEST STATEMENT IS THAT THE CEILING OF THE DURATION LEVER IS UNKNOWN IN BOTH DIRECTIONS
    - it may be lower than 204 cm typically, and it has never been observed at its upper end in the one person who
    could show it.
- parameter: CENSUS - every human with complete loss of oestrogen signal or synthesis, and whether any reached a spontaneous
    endpoint
  value: at least 20 people; ZERO reported final heights reached without intervention
  unit: count
  conditions: 'systematic Europe PMC census 2026-08-06, 743 records screened, 45 open-access full texts read. ESR1
    LOSS OF FUNCTION, at least 6 people: the Smith propositus (male, USA); two sisters and one brother in a consanguineous
    Algerian family, homozygous R394H (bernard2017); the first reported female, followed 8 years (brakta2020); a 13-year-old
    girl (2024). AROMATASE DEFICIENCY, 14 male cases tabulated in a 2022 review, of which 11 are described at report
    as tall, with delayed skeletal age, or with UNFUSED or OPEN epiphyses'
  species: human
  source_ref: aromdef2022
  uncertainty: THE CENSUS IS THE FINDING. In roughly twenty people worldwide with complete loss of oestrogen signal
    or synthesis, NOT ONE HAS BEEN FOLLOWED TO A SPONTANEOUS CESSATION OF GROWTH. Every one was either given oestrogen
    - which closes the plate and is the standard of care, and in the aromatase cases is given explicitly to stop growth
    - or was last reported still growing with open epiphyses. THE ENDPOINT DOES NOT EXIST IN THE HUMAN RECORD. This
    is a census of published reports, not of people; unpublished follow-up may exist in clinical records, which is
    precisely why the question is answerable by correspondence rather than by experiment. The count of 14 male aromatase
    cases is one review's tabulation and may be incomplete.
- parameter: the two people whose oestrogen signal cannot be restored, and how far each was followed
  value: 'Smith propositus: 204 cm at 28, bone age 15 to 17.5 by about 31, no report since. Brakta patient: followed
    8 years to age 24, treatment failed, no height reported'
  unit: none
  conditions: the Smith propositus did not respond to six months of transdermal oestrogen raising free oestradiol
    tenfold. The brakta2020 patient was screened against 75 compounds for transactivation of her variant receptor;
    diethylstilbestrol worked in vitro and failed in her over 2.5 years
  species: human
  source_ref: brakta2020
  uncertainty: THESE ARE THE ONLY TWO PEOPLE IN THE RECORD WHOSE GROWTH PLATES COULD NOT BE SWITCHED OFF BY ANY AVAILABLE
    MEANS, and neither has a reported endpoint. The Smith propositus was last reported in 2008 with a 2010 review;
    he would now be in his sixties. brakta2020 followed her patient for eight years and reports bone density and endocrinology
    but no adult height. THE SINGLE MOST INFORMATIVE MEASUREMENT IN THIS FIELD IS A NUMBER IN TWO SETS OF CLINICAL
    NOTES.
- parameter: WHAT ADVANCES BONE AGE WITHOUT ER-ALPHA - named by the people who studied him
  value: ER-beta, truncated ER-alpha forms, non-classical oestrogen receptors, and androgen acting on epiphyseal growth
  unit: candidate mechanisms
  conditions: the propositus advanced 2.5 years of bone age in 3.5 chronological years with no functional ER-alpha.
    His mutation is a premature stop in exon 2, which permits downstream translation initiation and therefore a truncated
    receptor
  species: human
  source_ref: smith2010
  uncertainty: THIS IS THE OESTROGEN-INDEPENDENT COMPONENT OF FUSION AND IT IS THE UNBLOCKED TERM. Smith and Korach
    name four candidates and resolve none of them; sixteen years later none has been resolved. It matters because
    if ER-alpha blockade is bounded by its bone cost, the residual route is what is still closing the plate in the
    one person in whom the main route is absent - and nobody has identified which of the four it is. Androgen is the
    candidate the review singles out as augmenting epiphyseal growth, which would make it a growth-promoting rather
    than a fusion-promoting term, so the four are not equivalent hypotheses.
- parameter: THE ONE OBSERVED ENDPOINT — GROWTH CEASED AT 24 WITH THE EPIPHYSES STILL OPEN
  value: 170 cm at 14 years, growth continuing until 24 years, 197 cm at 27 with arm span 204 cm, bone age 16 and
    OPEN epiphyses on hand X-ray
  unit: cm and years
  conditions: human male, homozygous CYP19A1 intron V splice-acceptor mutation, consanguineous parents; untreated
    until oestrogen was started at 27; weight 120 kg with eunuchoid proportions, genu valgum, kyphoscoliosis; oestradiol
    below 20 pg/ml and testosterone elevated at 9.0 ng/ml
  species: human
  source_ref: herrmann2002
  uncertainty: 'THE FIRST AND ONLY OBSERVED ENDPOINT IN THE OESTROGEN-NULL LITERATURE, AND IT FALSIFIES THIS NODE''S
    ORIGINAL HEADLINE. Its evidential weight must be stated exactly. THE CESSATION IS A HISTORY STATEMENT - one clause
    in a case report, "he continued to grow until the age of 24 yr", almost certainly from the patient rather than
    from serial clinic measurements - so the age is soft and a slow residual growth below the resolution of recall
    cannot be excluded. WHAT IS MEASURED, AND IS HARD, IS THE DISSOCIATION: at 27 the epiphyses were OPEN and the bone
    age was 16, three years after growth is said to have stopped. Whatever the exact age, this man stopped growing
    while his plates were anatomically and hormonally unclosed. He is also obese, and obesity raises peripheral
    aromatisation in people who have any - here there is none, so it cannot rescue him, but it does complicate the
    metabolic picture. NOTE WHAT THIS DOES AND DOES NOT OVERTURN: the census counted SPONTANEOUS EPIPHYSEAL CLOSURE
    as its event and there are still ZERO of those. On growth cessation there is now one.'
- parameter: THE SERUM OESTRADIOL THRESHOLD THAT DECIDES WHETHER A PLATE CLOSES
  value: 60.6 pmol/L (16.5 pg/mL) was INEFFECTIVE to complete bone maturation; maturation, BMD normalisation and bone-turnover
    normalisation were reached only when serum oestradiol rose ABOVE 73 pmol/L (20 pg/mL)
  unit: pmol/L
  conditions: human male, compound heterozygous CYP19A1; transdermal oestradiol gel 0.75 mg/day; 5-year follow-up
    with height 193.0 cm at 26.8 years, 193.6 at 30.5 and 193.6 at 33.6; arm span 212 rising to 213 cm; bone age 15.5
    by TW2 with unfused epiphyses at baseline; complete maturation took more than 20 months
  species: human
  source_ref: lanfranco2008
  uncertainty: 'A HUMAN DOSE-RESPONSE THRESHOLD FOR THE DURATION LEVER, AND IT EXISTS ONLY BECAUSE THE PATIENT DID
    NOT TAKE HIS MEDICATION. That accident is what makes it informative and also what limits it: this is an uncontrolled
    natural experiment in one man, the authors themselves flag the poor accuracy of immunoassay oestradiol at these
    very low concentrations, and a threshold inferred from a compliance failure is a boundary somewhere between two
    observed levels rather than a measured inflection. The authors state the surrounding range as 44 to 73 pmol/L
    (12-20 pg/mL). THE DIRECTION IS THE USABLE PART: there is a serum oestradiol concentration in the high teens of
    pg/mL below which a human growth plate does not complete maturation and above which it does, which is the quantity
    any regimen intending to hold plates open would have to sit under. Note also that arm span and the upper-to-lower
    segment ratio KEPT RISING through 24 months of undertreatment while standing height barely moved.'
- parameter: OESTROGEN DOES NOT ARREST GROWTH ON STARTING — ABOUT 15 CM ACCRUED WHILE THE PLATES CLOSED
  value: height 176 to 185 to 188 to 191 cm during oestrogen replacement, a gain of 8.5%, with closure of the epiphyses
    observed only at 20 years and 5 months
  unit: cm
  conditions: human male, 17 years old at diagnosis with bone age 12 and 172 cm; the youngest treated patient in the
    male aromatase series; oestrogen started at 17
  species: human
  source_ref: bouillon2004
  uncertainty: THE TIME CONSTANT OF THE CLOSING DIRECTION, MEASURED IN CENTIMETRES RATHER THAN MONTHS, AND IT IS LARGE.
    Starting oestrogen at 17 in a boy with bone age 12 did not stop him growing; it began a roughly three-year process
    over which he gained about 15 cm and then closed. Read alongside carani1997's nine months to closure from bone
    age 14.8 at age 38, the lesson is that the closing response depends heavily on how much maturation is left to
    run, and that a young plate with a large bone-age deficit takes years and delivers substantial height on the way.
    One patient, and the height series is tabulated without stated measurement intervals.
- parameter: THE UNTREATED ADULT GROWTH TRAJECTORIES, RECOVERED FROM FULL TEXTS THE CENSUS COULD NOT REACH
  value: 'morishima1995 brother 170.2 cm at 14 y 8 m to 204.0 cm at 24 y 3 m, still growing; carani1997 170 cm at 18,
    187 at 31, 190 at 38; maffei2004 172 cm at 21, 177 at 25, 183.5 at 29; chen2015arom 172 cm at 20, 182.5 at 24;
    maffei2007 191.8 cm at 25; baykan2013 187 cm at 27; miedlich2016 180 cm at 25 y 2 m'
  unit: cm by chronological age
  conditions: seven men with congenital aromatase deficiency, heights before any oestrogen; all seven had unfused or
    open epiphyses at last untreated measurement and bone ages of 14 to 15.3 where recorded
  species: human
  source_ref: carani1997
  uncertainty: 'THE CENSUS CONCLUDED A SURVIVAL ANALYSIS ON HEIGHT COULD NOT BE DONE BECAUSE ONLY 1 OF 14 CASES REPORTED
    A HEIGHT IN ITS ABSTRACT. THE HEIGHTS WERE IN THE FULL TEXTS ALL ALONG, and five of these seven were paywalled
    until supplied. That is a correction to the census method rather than to its conclusion: the conclusion - that
    every observation is right-censored by treatment - still holds, because every one of these men was either treated
    or last seen growing. What changes is that seven observations now carry a height and an age rather than an age
    alone, which is what a survival analysis on height requires. Target heights are unknown for three of the seven,
    who were adopted or orphaned, so absolute heights cannot be converted to gains for those men.'
- parameter: AND IN THE LONGEST FOLLOW-UP THE VELOCITY DECAYS — THE POOL RUNS DOWN ANYWAY
  value: 1.31 cm per year between ages 18 and 31, then 0.43 cm per year between 31 and 38 — a threefold fall
  unit: cm per year
  conditions: carani1997's patient, untreated across both intervals apart from a six-month testosterone trial that
    changed nothing; 170 cm at 18, 187 cm at 31, 190 cm at 38
  species: human
  source_ref: carani1997
  uncertainty: 'THIS IS THE CLOSEST THING TO AN ANSWER THE HUMAN RECORD CONTAINS FOR WHETHER THE DURATION LEVER HAS
    AN ASYMPTOTE, AND IT SAYS IT DOES. Growth in a man whose plates cannot be closed by his own physiology did not
    continue at a constant rate; it fell threefold across two decades of adulthood. Extrapolating a decaying 0.43 cm/yr
    from 190 cm at 38 gives a few more centimetres at most. TWO POINTS PER INTERVAL AND ONE MAN, so this is a shape
    rather than a curve, and the earlier interval spans the tail of his pubertal growth while the later does not -
    part of the fall is expected for that reason alone and cannot be separated out. Compare chen2015arom at 2.6 cm/yr
    between 20 and 24 and maffei2004 at 1.25 then 1.63 cm/yr between 21 and 29: the rates in the twenties are
    heterogeneous across men, and only carani1997 is followed far enough to show the decay.'
- parameter: GROWTH DECELERATES WHILE THE MATURATION CLOCK IS STOPPED — THE TWO ARE SEPARABLE
  value: height rose 187 to 190 cm between ages 31 and 38 while bone age stayed at 14.8; height rose 177 to 183.5 cm
    between 25 and 29 while bone age stayed at 15
  unit: cm gained against bone-age years gained
  conditions: carani1997 and maffei2004, both untreated aromatase-deficient men, both with hand radiographs at both
    ends of the interval
  species: human
  source_ref: maffei2004
  uncertainty: 'THE MOST IMPORTANT DECOUPLING IN THIS NODE AND IT CUTS AGAINST THE HOPEFUL READING. Bone age is the
    readout of the oestrogen-driven maturation programme, and in these men it is FROZEN - yet the plates keep producing
    height, and in the one man followed long enough, that production SLOWS ANYWAY. So the deceleration is not being
    driven by the programme that bone age measures. It is consistent with the atlas position everywhere else: growth
    plate senescence is division-dependent depletion, and the pool runs down whether or not the oestrogen clock is
    running. STOPPING THE CLOCK DOES NOT STOP THE SPENDING. Stated with its limits - the decay is one man, bone age is
    a coarse instrument that could hide half a year of drift, and no proliferative or histological measurement exists
    in any of these patients to confirm depletion directly. What it rules out is the strong version of the duration
    argument, in which an unclosed plate grows indefinitely at its current rate.'
- parameter: THE FIRST MEASURED ADULT GROWTH VELOCITY IN AN UNTREATED OESTROGEN-NULL MAN
  value: 172 cm at age 20 and 182.5 cm at age 24 — 10.5 cm over four adult years, a sustained 2.6 cm per year
  unit: cm per year
  conditions: Chinese man with compound heterozygous CYP19A1 mutations Y81C and L451P, untreated until 24, bone age
    delayed by 6-8 years, tibial and fibular epiphyses incompletely fused at 24, oestrogen started at 24 at 182.5 cm
    which is the 97th percentile
  species: human
  source_ref: chen2015arom
  uncertainty: 'THE CENSUS RECORDED THAT NO VELOCITY EXISTED IN THIS LITERATURE AND ONE DOES - it was in a full text
    rather than an abstract, which is exactly where the census said the missing numbers would be. TWO POINTS FROM ONE
    MAN, so it is an average over four years and not a velocity at any instant, and it cannot show whether the rate
    was falling. Its importance is that it is HIGHER than the 1-2 cm/yr terminal velocity this atlas assumed when
    extrapolating a final height for the Smith propositus, and it is sustained across the whole of the early twenties
    rather than tailing off. Two cautions against transferring it. FIRST, this man is AROMATASE-deficient, not ER-alpha-null:
    he has an intact receptor and no ligand, so he is treatable and was treated at 24, and his residual maturation
    route is not the same question. SECOND, 2.6 cm/yr at 20-24 says nothing about 30-34, which is the interval the
    ceiling extrapolation actually depends on. THE VALUE OF THE ROW IS THAT IT CONVERTS ONE OF THE SIXTEEN CENSORED
    OBSERVATIONS FROM AN AGE INTO AN AGE AND A HEIGHT AND A RATE, which is what the survival analysis on height needs
    and could not previously get.'
- parameter: A SECOND CENSORED OBSERVATION RECOVERED WITH HEIGHT AND BONE AGE ATTACHED
  value: 187 cm at age 27, bone age 15, open metacarpal and phalangeal epiphyses, oestrogen started at 27
  unit: cm
  conditions: man with homozygous R375H CYP19A1; no earlier heights reported, so no velocity is recoverable
  species: human
  source_ref: baykan2013
  uncertainty: A TWELVE-YEAR BONE-AGE DEFICIT AT 27 WITH OPEN HAND EPIPHYSES, and then treatment. Recorded because
    the census could recover an age for this man but not a height, and the height is in the full text. It is another
    right-censored observation, not an endpoint - he was stopped, like all the others.
- parameter: THE DISSOCIATION CANNOT BE BOUGHT AT THE RECEPTOR-SUBTYPE LEVEL — ER-ALPHA CARRIES BOTH THE BONE BENEFIT
    AND THE FUSION COST
  value: 'ER-alpha-selective agonist PPT raised total body BMD to 0.146 +/- 0.009 against control 0.121 +/- 0.006
    (P = 0.003) and lumbar BMD to 0.155 +/- 0.009 against 0.135 +/- 0.006 (P = 0.038); the ER-beta-selective agonist
    DPN did neither (0.124 and 0.138). Body length and growth plate thickness differed in NEITHER group: crown-rump
    21.0 / 20.44 / 20.94 cm, P = 0.083; plate 91.25 / 89.51 / 82.36 micrometres, P = 0.251'
  unit: g/cm2 and cm
  conditions: 30 female Sprague-Dawley rats, ovariectomised at 4 weeks, treated from 6 weeks with 10 mg/kg subcutaneous
    PPT (400-fold ER-alpha selective) or DPN (70-fold ER-beta selective) or sesame oil, 5 days a week for 5 weeks,
    n = 10 per group
  species: rat
  source_ref: kang2020
  uncertainty: 'THE THERAPEUTIC IDEA THIS ATLAS HAS BEEN CARRYING WAS THAT OESTROGEN''S PLATE-CLOSING ACTION MIGHT
    BE SEPARABLE FROM ITS BONE-PROTECTING ONE, AND THIS IS THE ONE EXPERIMENT THAT TRIED IT BY RECEPTOR SUBTYPE. It
    was designed for exactly that purpose - the authors state the aim as increasing final adult height without markedly
    reducing BMD by manipulating binding to each subtype. THE BONE SIDE ANSWERED CLEANLY AND THE GROWTH SIDE DID NOT
    ANSWER AT ALL. BMD is ER-alpha''s, twice over, at conventional significance. But NEITHER agonist significantly
    changed body length or plate thickness in five weeks, so this experiment does not show that ER-alpha closes plates
    - it is a null on the growth side, in ovariectomised animals already past the fastest growth phase, with n = 10
    and a five-week window. Note also that the PPT body length is the SHORTEST of the three groups at P = 0.083, which
    is a trend in the costly direction rather than a reassuring one. WHAT THE COMPOSITE ARGUMENT ESTABLISHES, using
    this study only for the bone side and human ESR1-null genetics for the fusion side, is that BOTH effects point
    at ER-alpha. A subtype-selective drug therefore cannot separate them. Any dissociation has to be TISSUE-selective
    - growth plate versus bone - which is a SERM problem, not a receptor-subtype problem. That is a real narrowing
    of the search space and it closes a route this atlas had left open.'
- parameter: ER-BETA IS NOT ELIMINATED AS THE RESIDUAL ROUTE, AND THE ONE HUMAN WHO COULD ELIMINATE IT IS CONFOUNDED
  value: one reported human with an ESR2 loss-of-function mutation; 16 years old at report; no bone age or height in
    the abstract
  unit: count
  conditions: heterozygous loss-of-function mutation in a highly conserved ESR2 residue with a dominant negative effect,
    in a 16-year-old woman with absent breast development, primary amenorrhoea and osteoporosis
  species: human
  source_ref: langmuritano2018
  uncertainty: 'THIS WAS THE CLEAN ELIMINATION TEST AND IT IS SPOILED BY THE PATIENT''S OWN PHENOTYPE. Smith & Korach
    named ER-beta first among four candidates for whatever advances bone age in the absence of ER-alpha, and the obvious
    test is whether an ER-beta-null human shows delayed bone age or continued adult growth. SHE HAS STREAK GONADS.
    A woman with streak gonads makes no oestrogen, so she lacks the LIGAND as well as the receptor, and any skeletal
    delay in her is explained by ligand absence without invoking ER-beta at all - she is phenotypically closer to an
    aromatase-deficient patient than to a receptor-specific experiment. She was also 16 at report, far too young for
    the endpoint that matters. THE RESIDUAL ROUTE THEREFORE REMAINS UNRESOLVED SIXTEEN YEARS AFTER IT WAS NAMED, and
    this atlas has now checked and can say why rather than merely that. Her bone age and height, if recorded, are in
    the paywalled full text and are not in the abstract.'
- parameter: IS THE BONE COST PERMANENT
  value: aBMD may normalise on late oestrogen replacement; architecture and strength recovery are uncertain
  unit: qualitative
  conditions: oestrogen replacement given even late in the third decade, in ER-alpha-deficient and aromatase-deficient
    individuals
  species: human
  source_ref: smith2010
  uncertainty: 'IF THIS HOLDS IT CHANGES THE THERAPEUTIC ARITHMETIC OF THE WHOLE DURATION LEVER, because the -3.85
    BMD Z that this atlas has been treating as the fixed price of oestrogen blockade would then be a TEMPORARY price
    recoverable after growth is complete. THE QUALIFICATION IS THE AUTHORS'' OWN AND IS NOT MINOR: areal BMD is not
    architecture, and they say explicitly that complete recovery of architecture and strength is less certain. Cortical
    thinning, low trabecular thickness and an activation frequency of 0.099/yr are structural, and a normalised areal
    density can conceal them. Stated as a possibility that changes the calculus if true, and as an open question,
    not as a licence.'
- parameter: SURVIVAL ANALYSIS - event is spontaneous epiphyseal closure
  value: '16 observations, ZERO events, all right-censored. Maximum age observed with open epiphyses: 37 years'
  unit: years
  conditions: 'every reported human with complete loss of oestrogen signal or synthesis for whom an age at last observation
    is recoverable: 17.0, 24.0, 24.0, 24.25, 25.0, 27.0, 27.0, 29.0, 31.5 and 37.0 years, all with open epiphyses,
    ongoing linear growth, or treatment given to close the plates'
  species: human
  source_ref: aromdef2022
  uncertainty: 'THIS IS THE FORMAL STATEMENT OF THE CENSUS AND IT IS A DEGENERATE SURVIVAL PROBLEM: the Kaplan-Meier
    survival function is 1.00 at every observed age and the median age at closure is UNDEFINED, because there are
    no events. The intended analysis was a survival curve on HEIGHT rather than age, and it COULD NOT BE DONE: only
    1 of the 14 tabulated male aromatase cases reports a height in its abstract and the rest are old, paywalled case
    reports. Ages are recoverable where heights are not. Six of the sixteen have no recoverable age at all. So the
    maximum of 37 years is a floor on what the literature contains, not on what the clinical records contain.'
- parameter: BONE-AGE VELOCITY WITH NO FUNCTIONAL OESTROGEN RECEPTOR, and what it predicts
  value: 0.71 bone-age years per chronological year - 71% of normal
  unit: bone-age years per year
  conditions: 'the Smith propositus, the only person in the entire record with TWO bone ages: 15 to 17.5 over 3.5
    chronological years, ending at about 31.5 years of age'
  species: human
  source_ref: smith2008
  uncertainty: 'THE ONE MEASURED RATE IN THIS FIELD, n=1, TWO TIME POINTS. Extrapolating it forward: from bone age
    17.5 he reaches 18 at about age 32 and 19 - where male fusion is typically complete - at about age 34. SO EVEN
    THE MAN WHOSE PLATE COULD NOT BE SWITCHED OFF WAS PROBABLY WITHIN A FEW YEARS OF STOPPING WHEN LAST SEEN. He was
    204 cm at 28; at a declining terminal velocity of 1-2 cm/yr over the remaining five to eight years, a final height
    in the region of 208 to 215 cm follows. THAT IS AN EXTRAPOLATION FROM ONE PERSON AND TWO POINTS AND IT SHOULD
    BE READ AS AN ORDER OF MAGNITUDE, NOT A PREDICTION. It also assumes the rate is constant, and his own numbers
    say it is not - a lifetime average from bone age 15 at 28 years is 0.54 y/y against the 0.71 measured in his late
    twenties, so the residual maturation appears to ACCELERATE with age, which is what an androgen-driven residual
    route would do and an intrinsic-clock route would not.'
- parameter: THE TEST THAT WOULD IDENTIFY THE RESIDUAL ROUTE - and why it cannot currently be made
  value: requires two bone ages in an aromatase-deficient patient; no published case provides them
  unit: none
  conditions: ESR1-null has ligand present and ER-alpha absent, so ER-beta and non-classical receptors remain liganded
    and functional. Aromatase-deficient has no ligand at all, so every oestrogen receptor is unliganded while ER-alpha
    itself is intact
  species: human
  source_ref: smith2010
  uncertainty: THE LOGIC IS CLEAN AND THE DATA IS ONE POINT SHORT. If residual maturation ran through ER-beta or a
    non-classical receptor, the aromatase-deficient man - who has NO ligand - should mature more slowly than the ESR1-null
    man, who has ligand in excess. Matching rates would exclude every ligand-dependent oestrogen route and leave androgen
    or the intrinsic senescence programme. Morishima gives a single bone age of 14 at chronological 24.25, and a single
    point yields no velocity without assuming when divergence began - an assumption that moves the answer between
    0.16 and 0.58 y/y, which spans the entire question. A SECOND BONE AGE IN ANY LIVING AROMATASE-DEFICIENT PATIENT
    WOULD SETTLE IT, and roughly fifteen are described in the literature.
