id: the_human_ceiling_has_never_been_observed
name: The oestrogen-null ceiling has never been observed - it has only ever been imposed
type: hypothesis
layer: L7
stub: false
summary: 'This atlas has been treating 204 cm as the ceiling of the duration lever, on the strength of two men - one
  ESR1-null, one aromatase-deficient - who reached it. THAT NUMBER IS NOT A FINAL HEIGHT. It is the height at which
  each was measured and, in the aromatase cases, the height at which a clinician deliberately stopped them: the 2022
  case report of a 24-year-old with undetectable oestradiol, a history of progressive increase in height and open
  wrist and knee epiphyses states that he was started on oral estradiol valerate FOR EPIPHYSEAL CLOSURE TO PREVENT
  FURTHER INCREASE IN HEIGHT. Every aromatase-deficient man is treatable, and is treated on diagnosis, because oestrogen
  replacement closes the plates. The natural endpoint is therefore never reached. THERE IS EXACTLY ONE EXCEPTION AND
  HE IS THE MOST INFORMATIVE PERSON IN THIS FIELD. The ESR1-null man cannot be closed pharmacologically - his receptor
  is broken, and six months of transdermal oestrogen producing a tenfold rise in free oestradiol had no detectable
  effect. He was 204 cm at 28 with incomplete epiphyseal closure and a history of continued linear growth into adulthood;
  on follow-up 3.5 years later his bone age had advanced only from 15 to 17.5. AT ROUGHLY 31 YEARS OLD HIS GROWTH
  PLATE HAD NOT RUN OUT. No later height for him appears in the record this atlas can reach. AND THE LARGE COHORT
  COMPLICATES THE PICTURE RATHER THAN CONFIRMING IT. 88 patients with combined 17-hydroxylase/17,20-lyase deficiency
  - complete absence of sex steroid synthesis from birth - give final heights for 51: 77% at or above the 50th percentile
  and 39% at or above the 90th, not 204 cm. Most were treated. So total lifelong sex-steroid absence does NOT reliably
  produce extreme stature, and the two 204 cm men are the tail of a distribution rather than its centre. A SYSTEMATIC
  CENSUS ON 2026-08-06 SETTLES THE QUESTION AND THE ANSWER IS THAT NOBODY HAS EVER LOOKED. Across 743 records screened
  and 45 full texts read, at least twenty people are documented with complete loss of oestrogen signal or synthesis
  - six with ESR1 loss of function, fourteen males with aromatase deficiency - and NOT ONE has a reported final height
  reached without intervention. Eleven of the fourteen aromatase males are described at the time of report as tall,
  with delayed skeletal age, or with unfused epiphyses. The two people whose signal cannot be restored by any means
  - the Smith propositus and the female of brakta2020, who failed 2.5 years of diethylstilbestrol after 75 compounds
  were screened - were followed to about 31 and to 24 respectively, and neither has a published endpoint.'
quantitative:
- parameter: FINAL HEIGHT under complete lifelong absence of sex steroid synthesis
  value: 77% at or above the 50th percentile; 39% at or above the 90th; 8% at or below the 25th
  unit: percentile of final height
  conditions: 51 patients with final height available, from a cohort of 88 with combined 17-hydroxylase/17,20-lyase
    deficiency (CYP17D) in Brazil. Bone age delayed by 2 years or more in 92.5%; median chronological age 15.8 years
    against bone age 11 years at diagnosis
  species: human
  source_ref: cyp17d2025
  uncertainty: 'THIS IS THE LARGEST HUMAN COHORT WITH LIFELONG SEX-STEROID ABSENCE AND IT DOES NOT SHOW EXTREME STATURE.
    It bounds the 204 cm claim hard. THREE THINGS LIMIT IT AND ALL RUN THE SAME WAY: patients are treated once diagnosed,
    and hormone replacement closes the plates, so these are largely TREATED final heights; the reference percentile
    is not specified in the abstract and virtually all patients are phenotypically female regardless of karyotype,
    so an XY patient at the 90th female percentile is near an average male height; and diagnosis is late, median 15.8
    years. The authors nonetheless describe UNTREATED adults as tall and eunuchoid. THE UNTREATED SUBGROUP''S FINAL
    HEIGHTS ARE THE NUMBER THIS ATLAS WANTS AND THE ABSTRACT DOES NOT SEPARATE THEM.'
- parameter: is the 204 cm figure a final height
  value: no - it is a height at measurement, and in the aromatase cases a height at intervention
  unit: none
  conditions: a 24-year-old male with two novel CYP19A1 mutations, undetectable oestradiol, progressive increase in
    height and open wrist and knee epiphyses was started on oral estradiol valerate for epiphyseal closure to prevent
    further increase in height
  species: human
  source_ref: aromdef2022
  uncertainty: THE SENTENCE IS EXPLICIT AND IT REFRAMES EVERY AROMATASE-DEFICIENCY HEIGHT IN THE LITERATURE. These
    men are stopped on purpose, because oestrogen replacement is both the treatment for their osteopenia and the means
    of closing their plates. So the published heights are censored observations, not endpoints, and the field has
    been reading a treatment decision as a biological limit. This atlas did the same until 2026-08-06.
- parameter: the one human whose growth plate could not be switched off
  value: 204 cm at 28 with incomplete closure; bone age 15 to 17.5 over the next 3.5 years
  unit: cm and years of bone age
  conditions: homozygous ESR1 nonsense mutation; six months of transdermal oestrogen producing a tenfold rise in free
    oestradiol had no detectable effect, because the receptor is absent
  species: human
  source_ref: smith2008
  uncertainty: 'AT ROUGHLY 31 YEARS OF AGE HIS PLATE HAD NOT RUN OUT - bone age 17.5 and epiphyses still open. He
    is the only human being in the record whose growth plate has never been switched off and cannot be. NO LATER HEIGHT
    FOR HIM HAS BEEN LOCATED. That single missing number discriminates between the two models this atlas holds: if
    oestrogen merely ACCELERATES a fixed division budget, he should converge on a final height reached late; if oestrogen
    imposes an endpoint the budget would not otherwise reach, he should still be growing. n=1, and one of the most
    informative n=1s in human biology.'
- parameter: what the atlas previously claimed, and withdraws
  value: that the duration lever has a demonstrated ceiling of +25 cm
  unit: none
  conditions: docs/POSITIVE_LEDGER.md sections 3 and 9, written 2026-08-06
  species: human
  source_ref: cyp17d2025
  uncertainty: WITHDRAWN THE SAME DAY. Two case reports at 204 cm were treated as a ceiling; a 51-patient cohort with
    the same physiological lesion has final heights mostly near the population median, and the 204 cm figures are
    censored by treatment. THE HONEST STATEMENT IS THAT THE CEILING OF THE DURATION LEVER IS UNKNOWN IN BOTH DIRECTIONS
    - it may be lower than 204 cm typically, and it has never been observed at its upper end in the one person who
    could show it.
- parameter: CENSUS - every human with complete loss of oestrogen signal or synthesis, and whether any reached a spontaneous
    endpoint
  value: at least 20 people; ZERO reported final heights reached without intervention
  unit: count
  conditions: 'systematic Europe PMC census 2026-08-06, 743 records screened, 45 open-access full texts read. ESR1
    LOSS OF FUNCTION, at least 6 people: the Smith propositus (male, USA); two sisters and one brother in a consanguineous
    Algerian family, homozygous R394H (bernard2017); the first reported female, followed 8 years (brakta2020); a 13-year-old
    girl (2024). AROMATASE DEFICIENCY, 14 male cases tabulated in a 2022 review, of which 11 are described at report
    as tall, with delayed skeletal age, or with UNFUSED or OPEN epiphyses'
  species: human
  source_ref: aromdef2022
  uncertainty: THE CENSUS IS THE FINDING. In roughly twenty people worldwide with complete loss of oestrogen signal
    or synthesis, NOT ONE HAS BEEN FOLLOWED TO A SPONTANEOUS CESSATION OF GROWTH. Every one was either given oestrogen
    - which closes the plate and is the standard of care, and in the aromatase cases is given explicitly to stop growth
    - or was last reported still growing with open epiphyses. THE ENDPOINT DOES NOT EXIST IN THE HUMAN RECORD. This
    is a census of published reports, not of people; unpublished follow-up may exist in clinical records, which is
    precisely why the question is answerable by correspondence rather than by experiment. The count of 14 male aromatase
    cases is one review's tabulation and may be incomplete.
- parameter: the two people whose oestrogen signal cannot be restored, and how far each was followed
  value: 'Smith propositus: 204 cm at 28, bone age 15 to 17.5 by about 31, no report since. Brakta patient: followed
    8 years to age 24, treatment failed, no height reported'
  unit: none
  conditions: the Smith propositus did not respond to six months of transdermal oestrogen raising free oestradiol
    tenfold. The brakta2020 patient was screened against 75 compounds for transactivation of her variant receptor;
    diethylstilbestrol worked in vitro and failed in her over 2.5 years
  species: human
  source_ref: brakta2020
  uncertainty: THESE ARE THE ONLY TWO PEOPLE IN THE RECORD WHOSE GROWTH PLATES COULD NOT BE SWITCHED OFF BY ANY AVAILABLE
    MEANS, and neither has a reported endpoint. The Smith propositus was last reported in 2008 with a 2010 review;
    he would now be in his sixties. brakta2020 followed her patient for eight years and reports bone density and endocrinology
    but no adult height. THE SINGLE MOST INFORMATIVE MEASUREMENT IN THIS FIELD IS A NUMBER IN TWO SETS OF CLINICAL
    NOTES.
- parameter: WHAT ADVANCES BONE AGE WITHOUT ER-ALPHA - named by the people who studied him
  value: ER-beta, truncated ER-alpha forms, non-classical oestrogen receptors, and androgen acting on epiphyseal growth
  unit: candidate mechanisms
  conditions: the propositus advanced 2.5 years of bone age in 3.5 chronological years with no functional ER-alpha.
    His mutation is a premature stop in exon 2, which permits downstream translation initiation and therefore a truncated
    receptor
  species: human
  source_ref: smith2010
  uncertainty: THIS IS THE OESTROGEN-INDEPENDENT COMPONENT OF FUSION AND IT IS THE UNBLOCKED TERM. Smith and Korach
    name four candidates and resolve none of them; sixteen years later none has been resolved. It matters because
    if ER-alpha blockade is bounded by its bone cost, the residual route is what is still closing the plate in the
    one person in whom the main route is absent - and nobody has identified which of the four it is. Androgen is the
    candidate the review singles out as augmenting epiphyseal growth, which would make it a growth-promoting rather
    than a fusion-promoting term, so the four are not equivalent hypotheses.
- parameter: IS THE BONE COST PERMANENT
  value: aBMD may normalise on late oestrogen replacement; architecture and strength recovery are uncertain
  unit: qualitative
  conditions: oestrogen replacement given even late in the third decade, in ER-alpha-deficient and aromatase-deficient
    individuals
  species: human
  source_ref: smith2010
  uncertainty: 'IF THIS HOLDS IT CHANGES THE THERAPEUTIC ARITHMETIC OF THE WHOLE DURATION LEVER, because the -3.85
    BMD Z that this atlas has been treating as the fixed price of oestrogen blockade would then be a TEMPORARY price
    recoverable after growth is complete. THE QUALIFICATION IS THE AUTHORS'' OWN AND IS NOT MINOR: areal BMD is not
    architecture, and they say explicitly that complete recovery of architecture and strength is less certain. Cortical
    thinning, low trabecular thickness and an activation frequency of 0.099/yr are structural, and a normalised areal
    density can conceal them. Stated as a possibility that changes the calculus if true, and as an open question,
    not as a licence.'
localization:
- systemic
human_evidence: direct
human_evidence_note: 'Human throughout: one 88-patient cohort, one 24-year-old case report, and one uniquely uncloseable
  individual followed for 3.5 years.'
species_basis:
- human
translation_risk: low
translation_risk_reason: Human observations. The risk is that censored observations were read as endpoints, which
  is what this node corrects.
confidence: B
confidence_note: 'RAISED C to B on 2026-08-06 after the systematic census. The central claim is now a negative one
  supported by an exhaustive search rather than by two case reports: 743 records screened, 45 full texts read, one
  published tabulation of all male aromatase cases, and no spontaneous endpoint anywhere. B not A because a literature
  census cannot exclude unpublished clinical follow-up - which is the point, since that is where the answer would
  be - and because the count of male aromatase cases is one review''s tabulation.'
