id: round270_the_oestrogen_brake_is_local_and_worth_three_per_cent_and_my_two_receptor_story_was_wrong
name: >-
  ROUND 270 - the top ask supplied and read in full. Figure 5A digitised: cartilage-specific ERalpha
  deletion gives +3.17 per cent femur at one year and 2.93x the post-maturational growth increment, with
  serum IGF-1 untouched, no pubertal spurt lost, and NO axial gain. The authors' own Figure 6 is the
  local/systemic split. And round 269's clean ERalpha-brake / GPER-accelerator story is WRONG
aliases:
- round 270
- the oestrogen brake is local
- borjesson figure 5A digitised
- GPER sign unresolved
- appendicular only
type: hypothesis
layer: L7
stub: false
summary: >-
  THE PAPER I ASKED FOR WAS SUPPLIED AND IT DOES THREE THINGS: it supplies the magnitude that was missing,
  it adds four constraints the abstract did not carry, and it breaks a claim I made last round.

  ONE - THE MAGNITUDE, DIGITISED, BECAUSE THE TEXT NEVER STATES IT. borjesson2010 says only "increased
  femur length" and gives no number anywhere. atlas/tools/round270_borjesson2010_fig5A.py reads Figure 5A
  against its own six printed axis labels - 231.19 pixels per millimetre, worst tick residual 1.40 px, so
  the calibration is sound - and finds all four bars by horizontal top-rule detection, which is necessary
  because two bars are solid black, two are open outlines, and the error whiskers rise ABOVE the bar tops
  and defeat any topmost-dark-pixel method.
  AT FOUR MONTHS: control 15.644 mm, knockout 15.770 mm - a difference of 0.125 mm, 0.80 per cent, which
  the paper reports as not significant.
  AT TWELVE MONTHS: control 15.839 mm, knockout 16.341 mm - A DIFFERENCE OF 0.502 mm, 3.17 PER CENT, and
  this is the bar carrying the asterisk. n = 9 to 12, mean plus or minus SEM.
  AND THE INCREMENT IS THE REAL RESULT: between four and twelve months the controls added 0.195 mm and the
  knockouts added 0.571 mm - 2.93 TIMES AS MUCH. That is what "continued to grow after 4 months, whereas
  very little growth was seen in control mice" means numerically.

  TWO - FOUR THINGS THE ABSTRACT DID NOT CARRY, AND TWO OF THEM CUT AGAINST THE LEVER.
  IT IS APPENDICULAR ONLY. Crown-rump length in the same one-year-old animals was 2.1 per cent plus or
  minus 1.7, NOT SIGNIFICANT. The femur lengthened and the axial skeleton did not. For a height goal that
  is half the body, and CORR-195 forbids collapsing this case to the spine - this is the mirror of that
  error and it must not be made in the other direction either.
  IT IS LOCAL, AND THAT IS MEASURED, NOT ASSUMED. Serum IGF-1 in the one-year-old cartilage-specific nulls
  was -3.0 per cent plus or minus 6.5 versus littermates, not significant. Serum E2, LH, testosterone and
  uterine weight were all normal. THE MODEL HAS NO SYSTEMIC ENDOCRINE CONFOUND, which is exactly what makes
  it worth something.
  IT IS SPECIFIC TO LENGTH. pQCT and micro-CT of the same femurs found bone length increased while BONE
  MINERAL DENSITY AND CORTICAL BONE DIMENSIONS WERE UNAFFECTED. This is not general skeletal overgrowth.
  AND THE DELETION IS PARTIAL - 62 PER CENT reduction in ERalpha protein by Western blot, with
  immunoreactivity "almost completely abolished" by immunohistochemistry. The authors raise this themselves
  as a possible explanation for the normal pubertal growth, which is the half of the result that makes the
  lever attractive. Their counter-argument is that the loss of the high-dose E2 response and the continued
  growth in elderly animals show the knockdown was physiologically meaningful.

  THREE - THE SEPARABILITY IS THE AUTHORS' OWN CONCLUSION, NOT MY INFERENCE, AND FIGURE 6 STATES IT. Their
  model: INDIRECT, probably GH/IGF-1-mediated effects, NOT REQUIRING ERalpha in growth plate cartilage,
  carry oestrogen's growth-PROMOTING role during early sexual maturation at low E2; DIRECT effects of
  ERalpha in growth plate cartilage are required for high-dose E2 to reduce growth plate height in adults
  and for the reduction of longitudinal growth in elderly mice. The supporting contrast is in the same
  paper: TOTAL ERalpha-null males had reduced femur AND crown-rump length with serum IGF-1 down 20 per cent
  plus or minus 6, while the cartilage-specific nulls had normal growth and normal IGF-1. TWO ARMS, AND
  ONLY ONE OF THEM IS IN THE CARTILAGE. A systemic aromatase inhibitor removes both.
  THE HIGH-DOSE ARM IS THE ONE THAT TRANSFERS. E2 at 830 ng per mouse per day reduced distal femur growth
  plate height in controls and NOT in cartilage-specific nulls; it did so by reducing PROLIFERATION, with
  apoptosis unaffected, and it shortened the PROLIFERATIVE zone and not the hypertrophic zone. Replicated
  in orchidectomised males. High oestradiol is what closes a human plate, so this is the experiment that
  bears on a sixteen-year-old bone age - not the elderly-mouse creep.

  FOUR - AND HERE IS WHERE I WAS WRONG LAST ROUND. Round 269 recorded ERalpha as the local BRAKE and GPER-1
  as the local ACCELERATOR, "opposite directions". THE GPER HALF DOES NOT HOLD.
  windahl2009 - which borjesson2010 cites, from the same laboratory - reports that E2 reduced femur length
  AND distal femur growth plate height in wild-type mice BUT NOT IN GPR30-NULL MICE, while every other
  oestrogenic response tested was intact. SO GPR30 IS REQUIRED FOR OESTROGEN'S GROWTH-SUPPRESSING EFFECT.
  It is a brake mediator too.
  mrtensson2009 - the paper behind "GPR30-null mice are smaller" - is a GLOBAL knockout whose females had
  reduced body growth WITH REDUCED SERUM IGF-1, alongside hyperglycaemia, impaired glucose tolerance,
  hypertension and abolished oestradiol-stimulated insulin release. The growth deficit in that animal is
  confounded by systemic metabolic derangement and is not evidence of a cartilage-autonomous role.
  AND BORJESSON SAYS SO HIMSELF, WHICH I SHOULD HAVE READ BEFORE WRITING ROUND 269: it is difficult to
  evaluate whether GPR30 is a functional oestrogen receptor in the growth plate at all, or whether the
  growth phenotype of the female nulls is secondary to their other phenotypes.
  WHAT REMAINS ON THE GPER SIDE is chou2021's Col2a1-Cre chondrocyte-specific GPER-1 knockout, which IS
  cell-autonomous and DOES show shorter tibia, femur and crown-rump - and it now stands against two papers
  from another laboratory in which losing the same receptor PROTECTS from oestradiol. THE SIGN OF GPER-1 IS
  UNRESOLVED. The sign of cartilage ERalpha is not.

  FIVE - THE HUMAN ANCHOR IS ALREADY IN THIS FILE AND IT LINES UP, WHICH IS WHY THE LOCAL/SYSTEMIC SPLIT
  MATTERS. borjesson2010 notes that elderly mice with COMPLETE ERalpha inactivation show increased growth
  plate height and prolonged growth resembling aromatase-deficient patients and the man with an
  inactivating ERalpha mutation. This atlas holds those humans in detail already -
  residual_maturation_route_is_oestrogen_dependent records carani1997's patient holding bone age 14.8 for
  SEVEN YEARS and maffei2004's holding bone age 15 for FOUR. THE NEW THING IS NOT THAT REMOVING THIS AXIS
  KEEPS PLATES OPEN - THIS FILE KNEW THAT. It is that the CARTILAGE ARM ALONE is sufficient for the
  continued-growth phenotype, and costs no serum IGF-1 and no pubertal spurt - which is precisely what
  systemic aromatase inhibition cannot deliver, and a mechanistic account of why round 254 measured its
  attained-height yield at only 0.8 cm for anastrozole and 4.2 cm for letrozole.
quantitative:
- parameter: >-
    FIGURE 5A DIGITISED - FEMUR LENGTH IN CARTILAGE-SPECIFIC ERALPHA-NULL FEMALE MICE AT FOUR AND TWELVE
    MONTHS
  value: >-
    4 months: control 15.644 mm, knockout 15.770 mm, difference +0.125 mm (+0.80 per cent, not significant
    in the paper). 12 months: control 15.839 mm, knockout 16.341 mm, difference +0.502 mm (+3.17 PER CENT,
    asterisked in the paper). Increment from 4 to 12 months: control +0.195 mm, knockout +0.571 mm - 2.93
    TIMES the control increment
  unit: femur length, mm
  conditions: >-
    borjesson2010 Figure 5A, J Bone Miner Res 25:2690-2700, PDF supplied by the operator. Female
    Col2a1-Cre; ERalpha-floxed mice versus control littermates, n = 9 to 12, values mean plus or minus SEM.
    Digitised by atlas/tools/round270_borjesson2010_fig5A.py against the figure's own six printed axis
    labels (17.0 down to 14.5 mm): 231.19 px/mm with a worst tick residual of 0.0061 mm = 1.40 px. Bar tops
    located as horizontal dark runs matching the bar width, which is required because two bars are solid
    and two are open outlines and the error whiskers rise above the bar tops.
  species: mouse
  source_ref: brjesson2010
  uncertainty: >-
    THESE ARE NUMBERS READ OFF A PUBLISHED FIGURE, NOT NUMBERS THE AUTHORS REPORTED - the text states no
    value anywhere. They are means only; the SEM whiskers were deliberately not digitised because the
    paper's own asterisk carries the significance. Bar-top rows are the top RULE of each bar, so a
    half-rule-width systematic offset of roughly 0.01 mm is possible and is far below the effect. AND THE
    REGIME IS THE PROBLEM, NOT THE PRECISION: this is post-maturational creep between 4 and 12 months in a
    species whose growth plate does not fuse (mouse_does_not_fuse), and the human counterpart of an elderly
    mouse still slowly growing does not exist.
- parameter: >-
    THE GAIN IS APPENDICULAR ONLY, AND THE MODEL IS LOCAL - SERUM IGF-1, SEX STEROIDS AND BONE DENSITY ALL
    UNCHANGED
  value: >-
    crown-rump length +2.1 per cent plus or minus 1.7, NOT SIGNIFICANT, in the same one-year-old animals
    whose femurs were significantly longer; serum IGF-1 -3.0 per cent plus or minus 6.5, not significant;
    serum E2, LH, testosterone and uterine weight all normal; bone mineral density and cortical bone
    dimensions unaffected by pQCT and micro-CT; ERalpha protein reduced 62 per cent in cartilage by Western
    blot
  unit: per cent versus control littermates
  conditions: borjesson2010, read in full. Col2a1-Cre is constitutive and recombines in appendicular AND
    axial cartilage by the authors' own reporter data, so the absence of an axial gain is not a
    Cre-coverage artefact by their account.
  species: mouse
  source_ref: brjesson2010
  uncertainty: >-
    A NON-SIGNIFICANT +2.1 PER CENT WITH AN SEM OF 1.7 IS NOT A DEMONSTRATED ABSENCE OF AXIAL EFFECT - it
    is an underpowered null, and the point estimate is positive. It should be read as "the axial gain, if
    any, is smaller than the appendicular one" rather than as zero. The 62 per cent protein knockdown is
    the authors' own leading caveat on the normal-puberty half of the result.
- parameter: >-
    CARTILAGE ERALPHA IS REQUIRED FOR HIGH-DOSE OESTRADIOL TO SHRINK THE PLATE - AND IT DOES SO THROUGH
    PROLIFERATION, IN THE PROLIFERATIVE ZONE
  value: >-
    E2 at 830 ng per mouse per day reduced distal femur growth plate height in control mice and NOT in
    cartilage-specific ERalpha-null mice; it reduced chondrocyte PROLIFERATION significantly in controls
    and not in nulls; the number of APOPTOTIC chondrocytes was unaffected in both; and the height reduction
    was in the PROLIFERATIVE zone, not the hypertrophic zone. Replicated in 17-week-old orchidectomised
    males
  unit: growth plate and zone height, proliferation and apoptosis counts
  conditions: borjesson2010, Figure 4 and Table 2, n = 8 to 18.
  species: mouse
  source_ref: brjesson2010
  uncertainty: >-
    830 ng/mouse/day is a PHARMACOLOGICAL dose chosen to shrink the plate, not a physiological pubertal
    level, so this establishes which receptor transmits a high-oestradiol insult rather than which receptor
    times normal fusion. It is nonetheless the arm of this paper that bears on a human adolescent, because
    high oestradiol in late puberty is what closes a human plate - unlike the elderly-mouse creep, which
    has no human counterpart.
- parameter: >-
    GPER-1 IS REQUIRED FOR OESTROGEN TO SUPPRESS GROWTH - WHICH CONTRADICTS THE ACCELERATOR ROLE ROUND 269
    ASSIGNED IT
  value: >-
    E2 reduced longitudinal bone growth - decreased femur length and distal femur growth plate height - in
    wild-type mice BUT NOT in GPR30-null mice, while responses on total body BMD, spine BMD, trabecular
    BMD, cortical thickness, uterine weight, thymic atrophy, fat mass and marrow cellularity were SIMILAR
    in both genotypes across five E2 doses (0, 30, 70, 160, 830 ng/mouse/day)
  unit: femur length and growth plate height under graded oestradiol
  conditions: >-
    windahl2009, three-month-old ovariectomised GPR30-null and wild-type mice. Read from the abstract. The
    companion global-knockout paper mrtensson2009 reports reduced body growth in GPR30-null females but
    WITH reduced serum IGF-1 and alongside hyperglycaemia, impaired glucose tolerance and hypertension.
  species: mouse
  source_ref: windahl2009
  uncertainty: >-
    BOTH GPR30 PAPERS ARE READ FROM ABSTRACTS AND BOTH USE A GLOBAL KNOCKOUT, so neither is
    cell-autonomous and mrtensson2009's growth deficit is confounded by systemic metabolic disease.
    chou2021's chondrocyte-specific knockout IS cell-autonomous and points the other way. The honest
    verdict is that the sign is unresolved, not that it is reversed - and borjesson2010's own text says it
    is difficult to evaluate whether GPR30 is a functional oestrogen receptor in the growth plate at all.
localization:
- 'growth plate cartilage ERalpha: the local brake - deleting it in cartilage alone gives +3.17 per cent
  femur at one year with no change in serum IGF-1'
- 'proliferative zone: where high-dose oestradiol shrinks the plate, through proliferation and not
  apoptosis, and only when cartilage ERalpha is present'
- 'appendicular skeleton: where the gain is - the axial gain was +2.1 per cent and not significant'
human_evidence: indirect
human_evidence_note: >-
  No human data in borjesson2010. The human anchor is held elsewhere in this atlas -
  residual_maturation_route_is_oestrogen_dependent records aromatase-deficient men holding bone age flat
  for seven and four years, and the ESR1-null propositus. borjesson2010 explicitly notes that its
  complete-ERalpha-null elderly mice resemble those patients.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: >-
  The length gain is post-maturational creep between four and twelve months in a species whose growth plate
  does not fuse, so that arm has no human counterpart. The high-dose oestradiol arm does transfer in
  principle, because high oestradiol is what closes a human plate, but it was measured on plate height
  rather than on bone length.
confidence: B
confidence_reason: >-
  Full text read directly and the missing magnitude digitised from the figure with a reported calibration
  and a stated residual. Graded B rather than A because the load-bearing number is read off a figure rather
  than reported, the deletion is 62 per cent rather than complete, and the regime in which the length gain
  occurs is one that does not exist in man.
claim_grades:
- claim: >-
    Cartilage-specific ERalpha deletion increases femur length in the mouse.
  grade: B
  basis: >-
    +0.502 mm, +3.17 per cent at twelve months, asterisked by the authors, n = 9 to 12, with the growth
    increment from four to twelve months 2.93 times the control's. Digitised from Figure 5A against its own
    axis with a 1.40 px worst tick residual. B and not A because it is one study and the number is read
    from a figure the paper never states in text.
- claim: >-
    The oestrogen brake on the growth plate is separable from oestrogen's systemic growth benefit.
  grade: B
  basis: >-
    THE AUTHORS' OWN CONCLUSION AND THEIR FIGURE 6, NOT AN INFERENCE OF MINE. Cartilage-specific nulls -
    normal pubertal growth, normal serum IGF-1, protected from high-dose E2, longer femurs when old. Total
    nulls - reduced femur AND crown-rump with serum IGF-1 down 20 per cent. Round 269 graded the
    separability idea at E; the full text raises it, because the contrast is within one paper.
- claim: >-
    Cartilage ERalpha deletion lengthens the axial skeleton as well as the limbs.
  grade: X
  basis: >-
    NOT DEMONSTRATED - crown-rump length was +2.1 per cent plus or minus 1.7 and NOT significant in the
    same animals whose femurs were significantly longer. Graded X for the claim as stated while noting the
    point estimate is positive and the null is underpowered, so the correct reading is that any axial gain
    is smaller than the appendicular one.
- claim: >-
    GPER-1 is the local oestrogen ACCELERATOR and points opposite to ERalpha.
  grade: X
  basis: >-
    ROUND 269 SAID THIS AND IT IS WRONG AS STATED. windahl2009 - E2 reduced femur length and growth plate
    height in wild type and NOT in GPR30-null mice, so GPR30 is required for oestrogen's growth-SUPPRESSING
    effect. mrtensson2009's smaller GPR30-null mice are a global knockout with reduced serum IGF-1,
    hyperglycaemia and hypertension. borjesson2010 itself states it is difficult to evaluate whether GPR30
    is a functional oestrogen receptor in the growth plate or whether the growth phenotype is secondary.
    chou2021's chondrocyte-specific knockout remains the one cell-autonomous result on the other side. THE
    SIGN IS UNRESOLVED.
- claim: >-
    This result shows that blocking cartilage ERalpha would delay human epiphyseal fusion.
  grade: E
  basis: >-
    IT DOES NOT, AND THE TWO ARMS OF THE PAPER MUST NOT BE MERGED. The length gain occurs between four and
    twelve months in a species that does not fuse, so it is a statement about post-maturational creep. The
    arm that bears on fusion is the separate high-dose oestradiol experiment showing cartilage ERalpha is
    required for E2 to shrink the plate - measured on plate height, in adults, at a pharmacological dose.
    The human genetics held elsewhere in this atlas are consistent with the direction but concern COMPLETE,
    lifelong, systemic loss.
key_refs:
- ref_id: brjesson2010
  pmid: '20564247'
  year: 2010
  type: primary
  one_line_finding: >-
    READ IN FULL FROM THE SUPPLIED PDF AND FIGURE 5A DIGITISED - cartilage-specific ERalpha deletion gives
    +3.17 per cent femur length at twelve months and 2.93x the control growth increment, with serum IGF-1,
    sex steroids, BMD and cortical dimensions all unchanged, NO significant axial gain, and normal growth
    through sexual maturation; and cartilage ERalpha is required for high-dose oestradiol to shrink the
    proliferative zone
- ref_id: windahl2009
  pmid: '19088255'
  year: 2009
  type: primary_abstract_only
  one_line_finding: >-
    THE PAPER THAT BREAKS ROUND 269's STORY - oestradiol reduced femur length and growth plate height in
    wild-type but NOT in GPR30-null mice, so GPR30 is REQUIRED for oestrogen's growth-suppressing effect
    rather than opposing it
- ref_id: mrtensson2009
  pmid: '18845638'
  year: 2009
  type: primary_abstract_only
  one_line_finding: >-
    The source of "GPR30-null mice are smaller", and it is a global knockout with reduced serum IGF-1,
    hyperglycaemia, impaired glucose tolerance and hypertension - the growth deficit is confounded and not
    evidence of a cartilage-autonomous role
- ref_id: chou2021
  pmid: '34490260'
  year: 2021
  type: primary
  one_line_finding: >-
    The one cell-autonomous result on the other side - chondrocyte-specific GPER-1 deletion shortens tibia,
    femur and crown-rump length, which is why the sign is recorded as unresolved rather than reversed
- ref_id: carani1997
  year: 1997
  type: primary
  one_line_finding: >-
    The human anchor this atlas already held - an aromatase-deficient man holding bone age 14.8 from age 31
    to 38, which borjesson2010 explicitly likens to its complete-ERalpha-null elderly mice
contradicts: >-
  CORRECTS round269_the_sweep_the_atlas_owed_itself_and_the_three_levers_it_was_sitting_on on its oestrogen
  finding. That round recorded ERalpha as the local brake and GPER-1 as the local accelerator, "opposite
  directions", on the strength of chou2021 and chou2025. windahl2009 - cited by borjesson2010, from the
  laboratory that made the ERalpha mouse - reports that oestradiol reduced femur length and growth plate
  height in wild-type mice and NOT in GPR30-null mice, so GPR30 transmits oestrogen's growth SUPPRESSION;
  and mrtensson2009's smaller GPR30-null mice are a global knockout confounded by reduced serum IGF-1 and
  metabolic disease. The ERalpha half of round 269 is STRENGTHENED and quantified; the GPER half is
  withdrawn to unresolved. It also QUALIFIES round 269's implied lever by adding that the gain is
  appendicular only - crown-rump was +2.1 per cent and not significant.
builds_on: round269_the_sweep_the_atlas_owed_itself_and_the_three_levers_it_was_sitting_on
