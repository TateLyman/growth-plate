id: residual_maturation_route_is_oestrogen_dependent
name: What closes a plate without ER-alpha needs OESTROGEN, and it is not androgen
type: process
layer: L7
stub: false
summary: 'Smith and Korach named four candidates for whatever advances bone age in a man with no functional ER-alpha
  - ER-beta, truncated ER-alpha, non-classical or membrane receptors, and androgen - and sixteen years later this
  atlas recorded all four as unresolved. THREE PRIMARIES, READ IN FULL, ELIMINATE ONE OF THEM AND ORDER THE REST.
  THE DECISIVE COMPARISON IS BETWEEN TWO KINDS OF OESTROGEN-NULL MAN. In AROMATASE deficiency there is no ligand and
  the receptor is intact; in ESR1 loss of function the ligand is present, even elevated, and the receptor is gone.
  If the residual route ran on androgen, or on anything ligand-independent, both should mature. THEY DO NOT BEHAVE
  THE SAME. In aromatase deficiency BONE AGE DOES NOT ADVANCE AT ALL: carani1997''s patient held bone age 14.8 from
  age 31 to 38, SEVEN YEARS, and maffei2004''s held bone age 15 from 25 to 29, FOUR YEARS. In the ESR1-null Smith propositus,
  who makes oestrogen and cannot use it through ER-alpha, bone age advanced from 15 to 17.5 in 3.5 years - 0.71 bone-age
  years per year. THE RESIDUAL ROUTE THEREFORE REQUIRES THE LIGAND AND DOES NOT REQUIRE ER-ALPHA. AND ANDROGEN IS
  EXCLUDED BY DIRECT INTERVENTION, TWICE. carani1997 gave testosterone enanthate 250 mg every 10 days for six months
  and reports that bone age did not change. maffei2004 gave supraphysiological testosterone across two phases totalling
  27 months and bone age sat at 15 throughout. Roughly 33 patient-months of androgen at physiological-to-supraphysiological
  levels, in two men, moved skeletal maturation not at all - while transdermal oestradiol closed the plates of the
  same two men in nine and six months respectively. Of the four candidates, ANDROGEN IS OUT and the three that remain
  - ER-beta, truncated ER-alpha, non-classical receptors - are all oestrogen-mediated, which is exactly what the
  ligand-versus-receptor contrast predicts.'
quantitative:
- parameter: BONE AGE DOES NOT ADVANCE IN UNTREATED AROMATASE DEFICIENCY — SEVEN YEARS
  value: bone age 14.8 at chronological age 31, and unchanged at 38
  unit: bone-age years
  conditions: human male, homozygous R365Q CYP19A1 with 0.4% of wild-type activity in vitro; untreated between the
    two readings apart from a six-month testosterone trial; the 1995 assessment is reported as bone age and biochemistry
    not appreciably changed
  species: human
  source_ref: carani1997
  uncertainty: 'THE LONGEST BONE-AGE OBSERVATION IN THIS LITERATURE AND IT IS A FLAT LINE. The qualification that matters:
    "had not changed appreciably" is a NARRATIVE PHRASE, NOT A MEASUREMENT, and Greulich-Pyle reading carries roughly
    half a year of error in any case, so this excludes a fast rate rather than establishing exactly zero. What it does
    establish is that nothing approaching the 0.71 bone-age years per year seen in the ER-alpha-null man was happening
    here over seven years, which is the comparison the node rests on.'
- parameter: AND FOUR YEARS IN A SECOND, INDEPENDENT PATIENT
  value: bone age 15 at ages 25, 26, 27, 28-29 and 29 — unchanged at every phase until oestradiol was given
  unit: bone-age years
  conditions: human male, homozygous Glu210Lys CYP19A1 destroying the exon V donor splice site; hand radiograph at
    every study phase; the interval includes both testosterone phases
  species: human
  source_ref: maffei2004
  uncertainty: BETTER DOCUMENTED THAN carani1997 BECAUSE THE BONE AGE WAS READ AT EVERY PHASE AND TABULATED, so the
    flat line is a series of measurements rather than a summary sentence. Same reader-precision caveat. Two men from
    different countries, different mutations, different decades, and different radiologists give the same flat line,
    which is what makes the pair worth more than either alone.
- parameter: ANDROGEN EXCLUDED BY DIRECT INTERVENTION IN TWO MEN, ABOUT 33 PATIENT-MONTHS
  value: 'no change in bone age under: testosterone enanthate 250 mg every 10 days for 6 months; and 250 mg every 21
    days for 6 months then every 15 days for 8 months, followed after a break by transdermal testosterone 6 mg daily
    for 13 months'
  unit: months of androgen exposure with zero bone-age advance
  conditions: both regimens produced physiological-to-supraphysiological serum testosterone - carani1997 records 1186
    ng/dl on treatment against a 360-900 normal range, and maffei2004 describes both phases as supraphysiological; in
    both men serum oestradiol remained undetectable throughout because the aromatase block is upstream
  species: human
  source_ref: maffei2004
  uncertainty: 'THIS IS AN INTERVENTIONAL EXCLUSION, NOT AN OBSERVATIONAL ONE, WHICH IS WHY IT CARRIES WEIGHT AT n=2.
    The design is close to ideal for the question by accident: androgen was raised to supraphysiological levels in men
    who cannot convert any of it to oestrogen, so it isolates the androgen arm cleanly. The limits are that six and
    twenty-seven months may be short against a route running at well under one bone-age year per year, that bone age
    is the only maturation readout available, and that both men were adults with bone ages near 15 rather than children.
    Smith and Korach named androgen as AUGMENTING PERIOSTEAL AND EPIPHYSEAL GROWTH rather than as fusion-promoting,
    so what is excluded here is androgen as a driver of skeletal MATURATION, not androgen as a growth stimulus.'
- parameter: THE CONTRAST THAT LOCATES THE ROUTE — LIGAND PRESENT, RECEPTOR ABSENT
  value: 'bone-age velocity by condition: no ligand with intact ER-alpha, approximately 0; ligand present with ER-alpha
    absent, 0.71 bone-age years per year; ligand restored with intact ER-alpha, 0.86 to about 2.1'
  unit: bone-age years per chronological year
  conditions: 'the three conditions are, respectively: untreated aromatase deficiency (carani1997 over 7 years, maffei2004
    over 4 years); the ESR1-null Smith propositus between bone age 15 and 17.5 over 3.5 years, who cannot be treated
    because his receptor is absent; and oestradiol-treated aromatase deficiency - miedlich2016 from bone age 15.0 to
    17.5 over 2 years 11 months, and carani1997 from 14.8 to over 16 with complete closure in 9 months'
  species: human
  source_ref: miedlich2016
  uncertainty: 'THE ORDERING IS THE RESULT AND THE ARITHMETIC IS THIS ATLAS''S OWN, COMPUTED FROM PUBLISHED PAIRS OF
    BONE AGES AND DATES IN FOUR DIFFERENT PAPERS. Every caution applies at once: these are different men, different
    mutations, different laboratories and four different decades of Greulich-Pyle reading, and the ER-alpha-null arm
    is a single person with two readings. The 2.1 figure is a lower bound derived from "greater than 16" and should
    not be treated as a point estimate. WHAT SURVIVES ALL OF THAT IS THE ORDERING, NOT THE VALUES: removing the ligand
    stops maturation, removing ER-alpha only slows it. A route that needed androgen, or needed nothing, could not produce
    that ordering. NOTE THE ONE CANDIDATE THIS CANNOT SEPARATE: the Smith mutation is a premature stop in exon 2 that
    permits downstream translation initiation, so a truncated ER-alpha may be doing the residual work, and if so the
    route is not ER-alpha-independent at all - it is partially-ER-alpha-dependent. That is candidate two of the remaining
    three and nothing here distinguishes it from ER-beta or a membrane receptor.'
- parameter: HOW FAST OESTROGEN CLOSES AN ADULT PLATE ONCE GIVEN
  value: complete epiphyseal closure 9 months after starting transdermal oestradiol from bone age 14.8; bone age past
    16 within 6 months in a second man; complete closure of all epiphyses about 3 years after starting in a third
  unit: months to closure
  conditions: carani1997 transdermal oestradiol from bone age 14.8 at 38 years; maffei2004 transdermal oestradiol 25
    micrograms twice weekly from bone age 15 at 29 years; miedlich2016 transdermal oestradiol 25-75 micrograms daily
    from bone age 15.0 at 25 years
  species: human
  source_ref: carani1997
  uncertainty: THE TIME CONSTANT OF THE DURATION LEVER IN THE CLOSING DIRECTION, WHICH THE ATLAS HAS NEEDED AND NOT
    HELD. Nine months to complete closure in one man against about three years in another is a fourfold spread on doses
    that are not directly comparable across transdermal formulations, and the endpoint is read differently in each paper.
    It is recorded as an ORDER OF MAGNITUDE - months to a few years, not weeks and not decades. The practical reading
    is that oestrogen exposure is not a switch that can be flicked and unflicked quickly, which matters for any regimen
    that proposes to modulate it during growth.
localization:
- growth plate, and the hand and wrist epiphyses in which bone age is read
human_evidence: direct
human_evidence_note: Entirely human, and entirely from the two natural experiments that separate ligand from receptor
  - congenital aromatase deficiency and ESR1 loss of function. Four men supply the bone-age series and two of them
  supply an interventional androgen arm. No animal data are used, because the mouse growth plate never closes and
  cannot carry this comparison.
species_basis:
- human
translation_risk: low
translation_risk_reason: The evidence is human throughout and the conditions are the human diseases themselves, so
  there is no species step to make. The risk here is not translation but power - the whole node rests on four men,
  one of whom contributes the entire ER-alpha-null arm.
confidence: C
confidence_note: C. The androgen exclusion is the strongest element - an intervention, in two independent men, at
  supraphysiological doses, in a background where conversion to oestrogen is impossible, with a flat tabulated bone
  age across 27 months in one of them. The ligand-versus-receptor ordering is weaker because it compares men across
  papers and decades and rests on a single ER-alpha-null individual with two readings. It is not D because the
  aromatase arm is replicated in two men with different mutations and because two of the four bone-age series were
  tabulated at multiple timepoints rather than summarised. It is not B because no two of these numbers were produced
  by the same reader, because one key value is a narrative phrase rather than a measurement, and because a truncated
  ER-alpha remains an unexcluded explanation of the whole pattern.
