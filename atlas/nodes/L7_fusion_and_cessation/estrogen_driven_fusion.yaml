  first_author: Smith EP
  year: 1994
  type: primary
  one_line_finding: >-
    A 204 cm man homozygous for an ESR1 codon 157 stop mutation had incomplete epiphyseal
    closure and no response to six months of transdermal estrogen.
- ref_id: smith2008
  pmid: '18505767'
  first_author: Smith EP
  year: 2008
  type: primary
  one_line_finding: >-
    Longitudinal follow-up of the same propositus: bone age advanced 15 to 17.5 y over 3.5 y and
    spine aBMD fell to Z -3.85; heterozygous carriers had normal spine aBMD.
- ref_id: morishima1995
  pmid: '8530621'
  first_author: Morishima A
  year: 1995
  type: primary
  one_line_finding: >-
    CYP19A1 mutation in a brother-sister pair; the man was 204 cm with a bone age of 14 years at
    chronological age 24.25 years and osteoporosis.
- ref_id: carani1997
  pmid: '9211678'
  first_author: Carani C
  year: 1997
  type: primary_abstract_only
  one_line_finding: >-
    Showed that transdermal estradiol, but not testosterone, produced epiphyseal closure and
    growth arrest in a man with aromatase deficiency.
- ref_id: singhania2022
  pmid: '36504506'
  first_author: Singhania P
  year: 2022
  type: primary
  one_line_finding: >-
    A 188 cm 24-year-old man with two novel CYP19A1 variants and open epiphyses; tabulates 15
