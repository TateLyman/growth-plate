localization:
- 'SYS: circulating estradiol acting on ER-alpha; no human growth plate ER-alpha localisation at fusion has been reported'
human_evidence: direct
human_evidence_note: >-
  Two complementary human loss-of-function experiments of nature with interventional follow-up:
  ESR1 nonsense mutation (estrogen-unresponsive, plates stay open) and CYP19A1 mutations
  (estrogen-deficient, plates close on estradiol replacement).
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  The evidence is human genetic and human interventional. The residual risk is not species but
  sample size and publication bias: single cases, no untreated control course, and treatment
  responses reported without blinding.
confidence: B
key_refs:
