  first_author: Rochira V
  year: 2009
  type: review
  one_line_finding: >-
    All reported men with aromatase deficiency present with tall stature, delayed bone
    maturation, unfused epiphyses, osteopenia or osteoporosis and eunuchoid proportions.
- ref_id: quaynor2013
