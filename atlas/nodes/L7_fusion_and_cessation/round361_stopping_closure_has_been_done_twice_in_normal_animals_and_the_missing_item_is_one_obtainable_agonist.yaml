id: round361_stopping_closure_has_been_done_twice_in_normal_animals_and_the_missing_item_is_one_obtainable_agonist
name: Round 361 - stopping closure and adding the pool back have BOTH been done in normal animals, the
  delivery vehicle exists separately, and the single missing item is a hedgehog agonist that can be obtained
  and placed locally
aliases:
- can closure be stopped completely
- adding the pool back
- the trompet2024 pool doubling
- a 3-week signal that grew for 6 months
- the marketed smoothened shelf points the wrong way
type: hypothesis
layer: L7
stub: false
summary: 'The operator asked whether depletion can be slowed to zero or the pool added back, and said that
  difficulty is not a reason to stop. IT IS NOT IMPOSSIBLE AND IT IS NOT HYPOTHETICAL. BOTH HALVES HAVE BEEN
  DEMONSTRATED IN NORMAL ANIMALS AND BOTH RESULTS ARE ALREADY IN THIS FILE, IN NODES THAT HAVE NEVER BEEN
  READ AS ONE ANSWER. ⭐⭐ ADDING THE POOL BACK IS DONE. trompet2024: INTRA-ARTICULAR SAG on three days
  (P28/P30/P32, read at P37) raised total Pthrp-tdTomato-positive cells from 65.5 to 139.8 per mm2 (n=5,
  P=0.017), ALL OF THE INCREASE WITHIN THE RESTING ZONE, WITH NO CHANGE IN PROLIFERATION and NO CHANGE IN
  TERMINAL HYPERTROPHIC CELL SIZE. THE POOL WAS DOUBLED AND NOTHING ELSE MOVED - a clean N increase, which is
  the term R360 identifies as the binding constraint and which nothing in the stack touches. ⭐⭐⭐ AND THE
  LENGTH ARM CARRIES THE FACT THAT MATTERS MOST IN THIS ENTIRE FILE: a SAG BEAD placed in one distal femoral
  secondary ossification centre gave a longer femur at 1 month and FURTHER at 2 and 6, tibia longer at 2 and
  6 as SAG diffused proximally, OVERALL LEG LENGTH UP AT EVERY TIMEPOINT, growth rate significantly increased
  by calcein and xylenol labelling - WHILE THE Gli1-LacZ BEAD SIGNAL WAS GONE BY THREE WEEKS. A TRANSIENT
  THREE-WEEK LOCAL INPUT PRODUCED A GAIN THAT WAS STILL GROWING AT SIX MONTHS. That is not a rate effect,
  which would decay with the signal; it is the signature of a PERMANENTLY ENLARGED BUDGET paying out over the
  remaining growth period, and it is exactly what R360 predicts if the pool is what is finite. No
  osteoarthritis at six months. ⭐⭐ STOPPING CLOSURE IS ALSO DONE. haraguchi2025: Hhip1-flox x Prx1-Cre
  limb-restricted knockout - GROWTH PLATE AREA 0.29 mm2 in the 53-week wild type against 0.44 in the mutant,
  AND THE 53-WEEK MUTANT PLATE EQUALS THE 10-WEEK WILD-TYPE PLATE (0.44). The wild type involutes from 0.44
  to 0.29 and the mutant does not involute at all; the histology is a thin flattened band against a tall
  columnar plate. Femur +4.5 per cent at 53 weeks, body weight unchanged. A NORMAL ANIMAL HELD ITS GROWTH
  PLATE OPEN AT YOUNG-ANIMAL DIMENSIONS FOR A YEAR. ⭐ AND THE DELIVERY VEHICLE EXISTS SEPARATELY: ye2026
  CT-CM-NPs, chondrocyte-membrane-coated PLGA with the collagen-II peptide WYRGRL, carried the hedgehog
  agonist PURMORPHAMINE to growth-plate cartilage FROM A TAIL VEIN. ⛔ WHAT BLOCKS IT IS ONE THING AND IT IS
  NOT BIOLOGY. NO OBTAINABLE HEDGEHOG AGONIST EXISTS. The entire agonist literature is SAG, purmorphamine and
  20(S)-hydroxycholesterol - research compounds, purchasable as reagents, not as medicines - while EVERY
  MARKETED SMOOTHENED DRUG IS AN ANTAGONIST (vismodegib, sonidegib, glasdegib) because the indication was
  always cancer. R342 shape, third instance: the shelf exists and points the wrong way. ⛔ AND THE ROUTE IS
  THE SECOND PROBLEM: trompet2024s SYSTEMIC arm was NULL, so it must be local; the pool-doubling arm was
  intra-articular in a P28 rat whose epiphysis is still largely cartilaginous and continuous with articular
  cartilage, whereas at bone age 16 the human secondary ossification centre is nearly fully ossified and an
  intra-articular injection is separated from the resting zone by bone. THE LENGTH-ENDPOINT ARM AVOIDS THAT
  ENTIRELY because a bead placed IN the secondary ossification centre is a direct surgical placement and is
  indifferent to how ossified the epiphysis is. R248 and R290 both wrote that the mechanism and the vehicle
  exist separately and nobody has combined them. That is still true and it is now the whole of the answer.'
quantitative:
- parameter: THE POOL WAS DOUBLED IN A NORMAL RAT WITH EVERYTHING ELSE HELD CONSTANT
  unit: Pthrp-tdTomato-positive cells per mm2
  value: 'trompet2024, INTRA-ARTICULAR SAG at P28, P30 and P32, analysed at P37: total Pthrp-tdTomato+ cells
    65.5 -> 139.8 cells per mm2, n=5, P=0.017, and ALL OF THE INCREASE WAS WITHIN THE RESTING ZONE.
    THE SPECIFICITY CONTROLS ARE WHAT MAKE IT A POOL RESULT RATHER THAN A GROWTH RESULT: NO CHANGE IN
    PROLIFERATION in the top 50 micrometres or in the proliferative zone, and NO CHANGE IN TERMINAL
    HYPERTROPHIC CELL SIZE. In the height identity H = N x A x h_term, N DOUBLED and A and h_term did not
    move. R360 identifies N as the binding constraint once an aromatase inhibitor has removed the deadline,
    and this is the only intervention in the atlas shown to raise it in a normal animal.'
  species: rat
  n: 5
  source_ref: trompet2024
  value_unverified: false
- parameter: A THREE-WEEK LOCAL SIGNAL PRODUCED A LENGTH GAIN STILL GROWING AT SIX MONTHS - THE SIGNATURE OF
    AN ENLARGED BUDGET RATHER THAN A RAISED RATE
  unit: per cent femur, tibia and whole-leg length; weeks of signal
  value: 'trompet2024, SAG BEAD implanted in ONE distal femoral secondary ossification centre, contralateral
    leg as internal control: femur longer at 1 month and FURTHER at 2 and 6 months (+2.75, +2.64, +3.63 per
    cent; 6/6, 9/9, 8/8 animals); tibia longer at 2 and 6 months as SAG diffused proximally; OVERALL LEG
    LENGTH UP AT EVERY TIMEPOINT (+1.06, +1.09, +1.65 per cent); growth rate SIGNIFICANTLY INCREASED by
    calcein and xylenol labelling; growth plate height augmented, probably through raised terminal
    hypertrophic chondrocyte height; proliferation up in the uppermost 50 micrometres at 1 week with the
    columnar zone unaffected.
    ⭐⭐ AND THE DECISIVE DETAIL: THE Gli1-LacZ BEAD SIGNAL WAS GONE BY THREE WEEKS. The input stopped at
    three weeks and the difference kept WIDENING to six months. A rate effect decays when the signal stops;
    a larger pool keeps paying out for as long as the plate runs. THIS IS THE STRONGEST EVIDENCE IN THE FILE
    THAT THE POOL IS THE QUANTITY THAT SETS FINAL LENGTH, AND THAT IT CAN BE ENLARGED ONCE.
    ✓ NO OSTEOARTHRITIS AT SIX MONTHS - the relevant local safety observation for an intra-articular or
    intra-epiphyseal route.
    ⛔ SHORT SYSTEMIC SAG DID NOT CHANGE BONE LENGTH (tibia 15.2 +/- 0.4 vs 14.5 +/- 1.7, P=0.29; femur
    12.7 +/- 0.4 vs 14.8 +/- 4.7, P=0.247). THE ROUTE MUST BE LOCAL.'
  species: rat
  n: 6, 9 and 8 animals at 1, 2 and 6 months
  source_ref: trompet2024
  value_unverified: false
- parameter: A NORMAL ANIMAL HELD ITS GROWTH PLATE OPEN AT YOUNG-ANIMAL DIMENSIONS FOR A YEAR
  unit: growth-plate area in mm2; per cent femur length
  value: 'haraguchi2025, Hhip1-flox x Prx1-Cre limb-restricted conditional knockout, MALE at both ages.
    GROWTH PLATE AREA: 10 weeks 0.44 (control) vs 0.62 (mutant), +41 per cent; 53 weeks 0.29 vs 0.44,
    +52 per cent; both marked p<0.001.
    ⭐ READ AS A GRID RATHER THAN AS TWO COMPARISONS: THE 53-WEEK MUTANT PLATE (0.44) EQUALS THE 10-WEEK
    WILD-TYPE PLATE (0.44). The wild type involutes 0.44 -> 0.29 over that year and the mutant does not
    involute at all. The histology says it without arithmetic - a thin flattened band in the wild type
    against a tall columnar plate with large chondrocytes in the mutant.
    FEMUR +2.7 per cent at 10 weeks and +4.5 per cent at 53 weeks, BODY WEIGHT NOT SIGNIFICANT AT EITHER
    AGE. Zones widened but ORDERED. THE GAIN GROWS WITH TIME, matching trompet2024 in a second species by a
    second modality.
    ⚠ Prx1-Cre is embryonic-onset, so this is not a postnatal intervention; and it is a genetic deletion,
    not a drug. It establishes that the phenotype is achievable, not that it is reachable pharmacologically.'
  species: mouse
  n: 6 and 4 at 10 weeks; 6 and 6 at 53 weeks
  source_ref: haraguchi2025
  value_unverified: true
- parameter: THE BLOCKING ITEM IS ONE OBTAINABLE AGONIST, AND THE MARKETED SHELF POINTS THE WRONG WAY
  unit: qualitative (compound availability)
  value: 'SEARCHED RATHER THAN ASSERTED. The entire hedgehog-agonist literature is preclinical tool
    compounds: SAG, purmorphamine, and 20(S)-hydroxycholesterol - a natural oxysterol allosteric agonist of
    Smoothened, characterised in 2026 for post-stroke neuroprotection and angiogenesis. All three are
    PURCHASABLE AS RESEARCH REAGENTS AND NONE IS A MEDICINE. NO SMOOTHENED AGONIST HAS EVER ENTERED CLINICAL
    DEVELOPMENT.
    ⛔ AND EVERY MARKETED SMOOTHENED DRUG IS AN ANTAGONIST - vismodegib, sonidegib, glasdegib - because the
    indication was always cancer. R342 established that the marketed epigenetic shelf is an oncology
    INHIBITOR shelf pointed the wrong way for height; this is the third instance of the same structure, and
    it is why every sweep of approved agents returns nothing on this axis.
    ⭐ THE CONSEQUENCE IS PRECISE AND WORTH STATING PLAINLY: the obstacle is not biology, not delivery, not
    dose and not mechanism. It is that the one class of molecule this axis needs was never developed as a
    drug because nobody ever wanted MORE hedgehog signalling in a patient.'
  species: human
  n: not applicable - compound availability
  source_ref: trompet2024
  value_unverified: false
- parameter: THE ROUTE PROBLEM, AND WHY ONE OF THE TWO ARMS ESCAPES IT
  unit: qualitative (anatomy and route)
  value: 'THE SYSTEMIC ARM IS NULL, so any version of this must be local.
    THE INTRA-ARTICULAR ARM - the one that doubled the pool - was done in a P28 rat. In a juvenile the
    epiphysis is largely cartilaginous and the articular cartilage is continuous with the epiphyseal
    cartilage that becomes the resting zone, so a small molecule injected into the joint can diffuse to it.
    ⛔ AT BONE AGE 16 THE HUMAN SECONDARY OSSIFICATION CENTRE IS NEARLY FULLY OSSIFIED, so an intra-articular
    injection is separated from the resting zone by BONE. This is a genuine anatomical objection to the
    easiest route and it is recorded as unresolved rather than assumed either way. It is also the specific
    reason R315 concluded a joint injection cannot reach a growth plate - a conclusion trompet2024s
    intra-articular arm complicates in the juvenile but does not overturn in the late adolescent.
    ⭐ THE LENGTH-ENDPOINT ARM AVOIDS THE PROBLEM ENTIRELY. A bead placed IN the secondary ossification
    centre is a DIRECT SURGICAL PLACEMENT and is indifferent to how ossified the epiphysis is. That is the
    arm with the femur, tibia and whole-leg measurements, and it is the arm whose effect grew for six months
    from a three-week signal.
    ⭐ AND ye2026 IS THE THIRD ROUTE: CT-CM-NPs - chondrocyte-membrane-coated PLGA carrying the collagen-II
    binding peptide WYRGRL - delivered PURMORPHAMINE, a hedgehog agonist, to growth-plate cartilage FROM A
    TAIL VEIN. ✗ Delivery is quantified only as normalised DiR fluorescence with no absolute concentration,
    and the efficacy model was a hypochondroplasia mutant, so CORR-203 applies to the length gain but NOT to
    the demonstration that the vehicle reaches the tissue.'
  species: rat
  n: not applicable - route analysis
  source_ref: ye2026
  value_unverified: false
- parameter: THE TWO OBJECTIONS THIS FILE ALREADY HOLDS AGAINST HEDGEHOG AGONISM, STATED SO THEY ARE NOT
    REDISCOVERED AS NEW
  unit: qualitative (recorded costs)
  value: 'FIRST - R311s maturation screen says cell-autonomous hedgehog ACTIVATION ACCELERATES MATURATION:
    Ptch1 knockout +6.004 and Sufu knockout +3.628, i.e. spends the period. That is the opposite direction
    from haraguchi2025 holding a plate open. CORR-300 is the proposed reconciliation - removing a SECRETED
    antagonist shifts a setpoint inside a feedback-regulated envelope, while disabling an INTRACELLULAR brake
    saturates the pathway - and SAG is a Smoothened agonist, i.e. acting at the membrane rather than in the
    secreted layer, so it does not sit cleanly on the favourable side of that distinction.
    ⚠ WHAT ARGUES trompet2024 IS ON THE ORDERED SIDE ANYWAY: proliferation and terminal hypertrophic cell
    size were UNCHANGED, the zones stayed ordered, there was no osteoarthritis at six months, and the input
    was TRANSIENT AND LOCAL (gone by three weeks) rather than a permanent germline null. A pulse and a
    knockout are different perturbations of the same node.
    SECOND - R294: FGFR3 sits upstream of hedgehog through the PRIMARY CILIUM, all hedgehog transduction
    happens inside the cilium, and AZD4547 SHORTENED CILIA SIGNIFICANTLY in normal mice in all three tissues
    tested. The subject is on a pan-FGFR inhibitor. That could mean his hedgehog transduction is blunted and
    an agonist works less well, OR that he is already hedgehog-deficient and correction is exactly right.
    THE GATE R294 SPECIFIED HAS STILL NOT BEEN RUN: give an FGFR inhibitor to a normal growing animal and
    measure growth-plate cilium length, Gli1/Ptch1 and bone length.'
  species: mouse
  n: not applicable - recorded objections
  source_ref: haraguchi2025
  value_unverified: false
localization:
- The intervention compartment is the RESTING ZONE and the secondary ossification centre immediately above
  it. trompet2024 places the effect there explicitly - the entire Pthrp-positive cell increase was within the
  resting zone - and haraguchi2025 puts Hhip1 mRNA in resting-zone chondrocytes, periosteum and primary
  spongiosa.
human_evidence: absent
human_evidence_note: There is no human evidence of any kind for pool expansion. The pool-doubling and
  length results are rat, the plate-preservation result is mouse, and the human anchor is only indirect -
  HHIP pLoF is +9.92 cm in 1.45M exomes, which says the direction is right in humans but says nothing about
  whether a local agonist reproduces it. No hedgehog agonist has ever been given to a human for any
  indication.
species_basis:
- rat
- mouse
- human
translation_risk: high
translation_risk_reason: 'Three separable risks. The pool-doubling and length results are rat and the
  plate-preservation result is an embryonic-onset genetic deletion in mouse, so neither is a postnatal
  pharmacological intervention in a fusing species. The route that produced the length endpoint is a
  surgical bead placement in a secondary ossification centre, which has never been done in a human for any
  purpose. And the subject is on a pan-FGFR inhibitor that shortens primary cilia, which is where all
  hedgehog transduction occurs, so his responsiveness to a Smoothened agonist is unknown and could be
  reduced.'
confidence: C
claim_grades:
- claim: The resting-zone pool can be doubled in a normal animal without changing proliferation or terminal
    cell size.
  grade: B
  basis: trompet2024, direct cell counting of Pthrp-tdTomato-positive cells, 65.5 to 139.8 per mm2, P=0.017,
    with proliferation and terminal hypertrophic cell size measured in the same animals and unchanged.
- claim: A transient local hedgehog input produces a length gain that keeps growing long after the signal
    has stopped.
  grade: B
  basis: Gli1-LacZ bead signal gone by three weeks; femur, tibia and whole-leg differences larger at two and
    six months than at one, with contralateral internal controls and 6, 9 and 8 animals per timepoint.
- claim: A growth plate can be held at young-animal dimensions for a year in a normal animal.
  grade: C
  basis: haraguchi2025 growth-plate area 0.44 at 53 weeks in the mutant against 0.44 in the 10-week wild
    type. Downgraded because the effect sizes are figure-only with no means or SDs in the text, and Prx1-Cre
    is embryonic-onset rather than a postnatal intervention.
- claim: No obtainable hedgehog agonist exists, and every marketed Smoothened drug is an antagonist.
  grade: A
  basis: Searched rather than asserted. The agonist literature is SAG, purmorphamine and
    20(S)-hydroxycholesterol, all research reagents; vismodegib, sonidegib and glasdegib are the marketed
    agents and all are antagonists developed for cancer.
- claim: An intra-articular route reaches the resting zone in a late adolescent human.
  grade: E
  basis: NOT established and possibly false. It worked in a P28 rat whose epiphysis is largely cartilaginous
    and continuous with articular cartilage. At bone age 16 the human secondary ossification centre is
    nearly fully ossified. This is the main unresolved practical question and it is recorded as unknown.
key_refs:
- ref_id: trompet2024
  year: 2024
  type: primary
  role: the pool doubled with proliferation and terminal cell size unchanged, and a three-week local signal
    producing a leg-length gain still growing at six months - the two facts the whole proposal rests on
- ref_id: haraguchi2025
  year: 2025
  type: primary
  role: a normal animal whose growth plate at 53 weeks matches a 10-week wild type - the demonstration that
    involution can be prevented rather than merely slowed
- ref_id: ye2026
  year: 2026
  type: primary
  role: the vehicle - chondrocyte-membrane nanoparticles with WYRGRL carried a hedgehog agonist to
    growth-plate cartilage from a tail vein
- ref_id: kosmicki2026
  year: 2026
  type: primary
  role: the human anchor for direction - HHIP pLoF +9.92 cm, and HHIP gain-of-function missense -3.96 cm, so
    both directions of one hedgehog brake move human height monotonically
- ref_id: newton2019
  year: 2019
  type: primary
  role: clonal tracing showing the switch to self-renewing monoclonal columns after secondary ossification
    centre formation - the reason the pool may not be strictly finite, and the paper this round most needs
    in full
open_questions:
- g_l7_360a
- g_l7_361a
contradicts:
- ANSWERS THE OPERATOR DIRECTLY AND FAVOURABLY. Stopping closure and adding the pool back are neither
  impossible nor untested. Both have been done in normal animals, the vehicle exists separately, and R248 and
  R290 both noted that nobody has combined them. The obstacle is a missing molecule, not a missing mechanism.
- COMPLICATES R315's DELIVERY CONCLUSION WITHOUT OVERTURNING IT. R315 concluded a joint injection cannot
  reach a growth plate. trompet2024's intra-articular arm doubled the resting-zone pool in a juvenile rat,
  where the epiphysis is still largely cartilaginous. Whether that transfers to a nearly ossified adolescent
  epiphysis is the round's main unresolved question.
- SITS IN UNRESOLVED TENSION WITH R311. That screen scores cell-autonomous hedgehog activation as
  ACCELERATING maturation, which would spend the period. trompet2024's zone measurements and six-month safety
  argue its transient local pulse landed on the ordered side, but SAG acts at Smoothened rather than in the
  secreted layer, so it does not sit cleanly on CORR-300's favourable side.
- DOES NOT PRODUCE A PRESCRIBABLE AGENT. Every hedgehog agonist is a research reagent; every marketed
  Smoothened drug is an antagonist.
