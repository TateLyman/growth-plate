localization:
- 'human: complete union, residual cartilage destroyed (haines1975)'
- 'dog: complete union (haines1975)'
- 'rabbit: abrupt fusion when proliferation approaches zero (weise2001)'
- 'goat autopod: epiphyseal synostosis (panebianco2026)'
- 'rat: plate persists, growth ceases (roach2003)'
- 'mouse: plate persists as calcified cartilage (yu2025)'
- 'cynomolgus monkey lumbar endplate: unclosed at 9-15 y (iwata2018)'
human_evidence: direct
human_evidence_note: >-
  Human union histology is directly described in autopsy/surgical material by haines1975 and
  in one fusing pubertal plate by emons2009; the comparative claims about other species come
  from those species' own primaries.
