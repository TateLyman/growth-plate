id: round362_the_papers_were_on_disk_hedgehog_to_the_resting_zone_is_required_to_prevent_fusion
name: Round 362 - the papers were on disk and I never opened them. The pool SELF-RENEWS after secondary
  ossification, so closure is niche failure rather than budget exhaustion; hedgehog to the resting zone is
  REQUIRED to prevent fusion; and six doses of an approved drug fuse a mouse growth plate
aliases:
- newton2019 read in full
- trompet2024 read in full
- vismodegib causes growth plate fusion
- the pool self-renews
- closure is niche failure not budget exhaustion
type: hypothesis
layer: L7
stub: false
summary: 'CORR-333 AGAIN AND I EARNED IT. R361 ended by asking the operator for trompet2024, newton2019 and
  a human resting-zone paper. ALL THREE WERE ALREADY IN THE UPLOAD STORE, ALONG WITH THE OFFICIAL JCI
  NUMERIC SOURCE DATA FOR TROMPET FIGURE 5, AND I HAD NEVER LOOKED. Read in full they answer the question
  the last three rounds were built around, and they change the frame. ⭐⭐⭐ ONE - THE POOL SELF-RENEWS, SO
  R360''s FIXED-BUDGET MODEL IS WRONG IN ITS STRONG FORM. newton2019 (Nature): clonal tracing shows that
  during the FETAL AND NEONATAL period longitudinal growth DOES deplete chondroprogenitors - but LATER,
  COINCIDING WITH FORMATION OF THE SECONDARY OSSIFICATION CENTRE, chondroprogenitors ACQUIRE THE CAPACITY
  FOR SELF-RENEWAL, form large stable MONOCLONAL columns that persist for at least five months, express
  stem-cell markers and undergo SYMMETRIC division. A stem-cell niche DEVELOPS POSTNATALLY and supplies
  chondrocytes over a prolonged period. So the resting zone is not a tank draining to empty. CLOSURE IS
  FAILURE OF A NICHE, NOT ARRIVAL AT THE BOTTOM OF A BUDGET - which is a different and far more tractable
  problem, because a failing niche can in principle be supported. ⭐⭐⭐⭐ TWO - AND THE PAPER NAMES WHAT
  MAINTAINS IT AND PROVES IT BY NECESSITY. Shh is abundantly expressed IN THE SOC by mesenchymal, endothelial
  and haematopoietic cells and diffuses DOWN, while Ihh from the hypertrophic zone diffuses UP, giving
  maximal hedgehog signalling SPECIFICALLY IN THE RESTING ZONE. Then the decisive experiment: SIX
  ADMINISTRATIONS OF VISMODEGIB - AN APPROVED SMO ANTAGONIST - AT P31-P34 REDUCED CLONAL SIZE SPECIFICALLY
  IN THE RESTING ZONE AND SUBSEQUENTLY CAUSED FUSION OF THE GROWTH PLATE. Resting-zone proliferation was
  inhibited; premature hypertrophy was NOT detected; and stem cells RETAINED CD73, so hedgehog maintains the
  CYCLE of the stem cells rather than their identity. HEDGEHOG SIGNALLING TO THE RESTING ZONE IS REQUIRED TO
  KEEP A GROWTH PLATE OPEN, AND REMOVING IT CLOSES ONE IN DAYS. ⛔ THREE - SO THIS IS A MAJOR NEW
  CONTRAINDICATION CLASS: VISMODEGIB, SONIDEGIB AND GLASDEGIB, all approved SMO antagonists, are predicted
  to fuse a growth plate, and one of them has done it experimentally. ⛔ FOUR - A SECOND NEW
  CONTRAINDICATION FROM THE SAME PAPER: IMPAIRING SOC MATURATION WITH AXITINIB (VEGFR inhibitor, P18-P27)
  REDUCED BOTH SOC SIZE (P=0.0054) AND CLONE SIZE (P=0.0023). The epiphyseal vasculature FEEDS the niche
  while the metaphyseal vasculature ERODES the plate, and an anti-angiogenic hits both - so the class is a
  cost, not the vascular-invasion lever R355 hoped for. ⚠ FIVE - AND A CORRECTION AGAINST MY OWN LAST
  ANSWER. I told the operator that trompet2024 showed the pool DOUBLED with nothing else moving. The full
  text is more specific and less strong: the number of SINGLE Tomato+ cells FELL while DOUBLETS AND TRIPLETS
  ROSE, with no effect on larger clones - so the doubled cell count is labelled stem cells HAVING DIVIDED,
  not necessarily more stem cells. And newton2019''s own independent readout of the stem-cell compartment,
  the CD73-positive domain, DID NOT EXPAND UNDER SAG (P=0.3, n=5 vehicle vs 3 SAG). What still carries the
  pool interpretation is the LENGTH data, not the cell counts.'
quantitative:
- parameter: THE POOL SELF-RENEWS AFTER SECONDARY OSSIFICATION - THE ANSWER TO g_l7_360a
  unit: qualitative, clonal lineage tracing
  value: 'newton2019, Nature, Col2-creERT x R26R-Confetti multicolour clonal tracing. FETAL AND NEONATAL
    growth DOES deplete chondroprogenitors - tracing E14.5-P4, P0-P10 and P3-P18 gives only small clones,
    and columns are MULTICLONAL. LATER, COINCIDING WITH SOC FORMATION, clonal size increases markedly
    (P30-P40, P30-P44), columns become MONOCLONAL, and those monoclonal columns REMAIN IN RENEWING CARTILAGE
    FOR AT LEAST FIVE MONTHS. Progenitors begin to express stem-cell markers and undergo SYMMETRIC division.
    Authors: a stem-cell niche DEVELOPS POSTNATALLY in the epiphyseal growth plate and provides a continuous
    supply of chondrocytes over a prolonged period.
    ⭐ CONSEQUENCE FOR R360: the strong fixed-budget model is wrong. The resting zone is not a tank draining
    to empty; it is a self-renewing niche. CLOSURE IS NICHE FAILURE, NOT BUDGET ARRIVAL. That is a different
    problem and a more tractable one, because a failing niche can be supported whereas a spent budget cannot.
    ⚠ WHAT SURVIVES OF R360: the terminus is still reached at zero proliferation (weise2001), the rate-yield
    trade-off is still measured (hunziker1994), and self-renewal being POSSIBLE does not mean it is
    UNLIMITED - newton2019 demonstrates persistence to five months in a mouse and says nothing about whether
    renewal capacity declines with age.'
  species: mouse
  n: clonal tracing across multiple windows
  source_ref: newton2019
  value_unverified: false
- parameter: HEDGEHOG TO THE RESTING ZONE IS REQUIRED TO PREVENT FUSION, AND SIX DOSES OF AN APPROVED DRUG
    PROVED IT
  unit: qualitative necessity test
  value: 'newton2019. THE SIGNAL SOURCE: Shh is abundantly expressed IN THE SOC by mesenchymal stem cells and
    their progenitors, endothelial and haematopoietic cells; diffusion of Shh DOWN from the SOC together with
    Ihh diffusing UP from the hypertrophic zone gives MAXIMAL HEDGEHOG SIGNALLING SPECIFICALLY IN THE RESTING
    ZONE. Extensive hedgehog signalling confirmed in round chondrocytes by Gli2 in situ and Gli1-creERT
    recombination.
    ⭐⭐ THE NECESSITY TEST: SIX ADMINISTRATIONS OF VISMODEGIB, AN APPROVED SMO ANTAGONIST, AT P31-P34 (tracing
    P30-P35) REDUCED CLONAL SIZE SPECIFICALLY WITHIN THE RESTING ZONE AND SUBSEQUENTLY CAUSED FUSION OF THE
    GROWTH PLATE. Resting-zone proliferation was inhibited. PREMATURE HYPERTROPHY WAS NOT DETECTED (MEF2C).
    Stem cells RETAINED CD73 expression - so the pathway maintains the CYCLE of the stem cells, not their
    IDENTITY.
    ⭐ THIS IS THE STRONGEST STATEMENT IN THE FILE ABOUT WHAT HOLDS A PLATE OPEN. It is not a correlation and
    not a knockout phenotype confounded by development - it is a pharmacological removal in a normal juvenile
    animal with fusion as the outcome, over four days of dosing.
    ⚠ And it is consistent with the human genetics from the opposite direction: HHIP pLoF (less hedgehog
    ANTAGONIST, therefore more hedgehog) is +9.92 cm, HHIP gain-of-function missense is -3.96 cm.'
  species: mouse
  n: six administrations, P31-P34
  source_ref: newton2019
  value_unverified: false
- parameter: NEW CONTRAINDICATION CLASS - APPROVED SMOOTHENED ANTAGONISTS ARE PREDICTED TO FUSE A GROWTH PLATE
  unit: qualitative (drug class)
  value: 'VISMODEGIB (Erivedge), SONIDEGIB (Odomzo) and GLASDEGIB (Daurismo) are the approved Smoothened
    antagonists, developed for basal cell carcinoma and AML. newton2019 gave VISMODEGIB ITSELF to juvenile
    mice for four days and the growth plate FUSED.
    ⭐ THE CLASS ALREADY CARRIES THIS WARNING IN HUMANS AND THIS FILE HAD NEVER CONNECTED IT: premature
    physeal fusion is a recognised paediatric concern for hedgehog pathway inhibitors, which is why they are
    not used in growing children. newton2019 supplies the mechanism - loss of resting-zone stem-cell cycling
    with stem-cell identity retained.
    ⛔ ADD TO THE CONTRAINDICATION LIST AT THE TOP OF THE CLASS. Unlike the grade-E entries already there
    (lithium, menin-MLL inhibitors, DNMT inhibitors), this one has a DIRECT EXPERIMENTAL FUSION ENDPOINT in a
    normal animal under the marketed molecule.
    ⚠ ALSO RELEVANT AS A DESIGN CONSTRAINT: it means the hedgehog axis has a proven, fast, unambiguous
    downside direction, which raises the prior that the upside direction is real and lowers the prior that
    the pathway is inert in an older plate.'
  species: mouse
  n: not applicable - class
  source_ref: newton2019
  value_unverified: false
- parameter: SECOND NEW CONTRAINDICATION - ANTI-ANGIOGENICS DAMAGE THE NICHE BY DAMAGING THE SOC
  unit: SOC size and clone size, P values
  value: 'newton2019 Figure 1 legend, read directly: IMPAIRING SOC MATURATION (P10-P28) REDUCES CLONE SIZE.
    DMSO versus AXITINIB (VEGFR inhibitor) given P18-P27: SOC SIZE P=0.0054 and CLONE SIZE P=0.0023, both
    reduced. And separately, SOC development CORRELATES with clone size, long columns start close to the SOC
    bone surface, and CD73 APPEARS UNDER THE SOC.
    ⭐⭐ THE STRUCTURAL POINT, WHICH THIS FILE HAS NEVER MADE: THE TWO VASCULAR BEDS DO OPPOSITE THINGS. The
    EPIPHYSEAL vasculature builds and sustains the SOC, which is the SOURCE of the Shh that maintains the
    stem-cell niche. The METAPHYSEAL vasculature erodes the hypertrophic zone and is the terminal event at
    fusion. AN ANTI-ANGIOGENIC HITS BOTH, and this experiment shows the niche side loses.
    ⛔ SO THE VASCULAR-INVASION LEVER R355 LISTED AS UNTOUCHED PROGRAM C IS NOT SIMPLY AVAILABLE - blocking
    angiogenesis systemically is predicted to shrink the SOC and starve the niche. Class: bevacizumab,
    axitinib, sunitinib, pazopanib, sorafenib, lenvatinib, regorafenib, cabozantinib, ramucirumab.
    ⚠ Timing-dependent and species-limited: the same paper uses axitinib in another window purely to block
    hypertrophic erosion for visualisation. The damaging result is the one where SOC maturation was still
    ongoing.'
  species: mouse
  n: DMSO vs axitinib, P18-P27
  source_ref: newton2019
  value_unverified: false
- parameter: THE EXACT DOSES, NOW READ FROM METHODS RATHER THAN INFERRED
  unit: micrograms
  value: 'trompet2024 Methods, verbatim quantities.
    INTRA-ARTICULAR (mice): SAG 5 ug in 2 uL, or DMSO, on P28, P30 and P31. (Note an internal discrepancy -
    the Results describe P28, P30 and P32; the Methods say P28, P30 and P31. Recorded, not resolved.)
    BEAD (rats): agarose beads (Bio-Rad 1537302) incubated with SAG 7 ug in 1.5 uL DMSO, implanted into the
    epiphyses of 30-DAY-OLD WISTAR-KYOTO RATS, PLACED IMMEDIATELY ABOVE THE GROWTH PLATE, IN THE SOC OF THE
    DISTAL FEMUR ONLY, with the contralateral hind leg receiving a DMSO bead as an internal control.
    ⭐ SEVEN MICROGRAMS, ONCE, IN A BEAD, PLACED IMMEDIATELY ABOVE THE PLATE. The intervention that produced a
    leg-length difference still widening at six months is a single microgram-scale local depot, not a
    systemic drug regimen. That is the most translationally important number in the paper.
    Growth rate was measured by calcein 10 mg/kg and xylenol 90 mg/kg double labelling.'
  species: rat
  n: 30-day-old Wistar-Kyoto rats
  source_ref: trompet2024
  value_unverified: false
- parameter: THE FIGURE 5 SOURCE DATA, ANALYSED - THE GAIN IS REAL, PAIRED, AND GROWS, BUT NOT EQUALLY ON
    EVERY ENDPOINT
  unit: millimetres, paired within-animal
  value: 'Official JCI numeric source data, animal-level, SAG leg minus contralateral DMSO leg in the SAME rat.
    FEMUR: 1 month +0.817 mm (n=6, SD 0.567, t=3.53, 6/6 positive); 2 months +0.822 (n=9, t=5.12, 9/9);
    6 months +1.263 (n=8, SD 0.400, t=8.93, 8/8).
    ENTIRE LEG: +1.033 (n=6, t=8.23); +1.078 (n=9, t=3.64); +1.700 (n=8, t=14.79, 8/8).
    TIBIA: +0.100 (n=6, t=1.37, only 3/6 positive - NOT significant at 1 month); +0.433 (t=5.00); +0.862
    (t=7.95). The tibia effect DEVELOPS with time, consistent with SAG diffusing proximally from a femoral
    bead - an internal consistency check.
    ⭐ IS THE ABSOLUTE GAIN GROWING? ENTIRE LEG 1.033 -> 1.700 mm, difference +0.667, Welch t=3.92 - YES.
    FEMUR 0.817 -> 1.263, difference +0.446, Welch t=1.64 - TRENDING ONLY. I had been quoting percentages,
    which inflate the impression; on absolute paired millimetres the growth of the gain is solid for the
    whole leg and only suggestive for the femur.
    ⭐⭐ AND THE ARITHMETIC THAT MATTERS: between 1 and 6 months the control femur grew 29.72 -> 34.81 mm, i.e.
    5.09 mm, while the SAG femur gained an EXTRA 0.446 mm over the same window - about 8.8 per cent faster
    growth during months 1 to 6, AFTER THE BEAD SIGNAL HAD STOPPED AT THREE WEEKS.
    ⚠ CROSS-SECTIONAL, NOT LONGITUDINAL: different animals at each timepoint (6, 9 and 8), so the time course
    is a between-cohort comparison. The paired design controls for animal size within a timepoint but not
    across them.'
  species: rat
  n: 6, 9 and 8 animals at 1, 2 and 6 months
  source_ref: trompet2024
  value_unverified: false
- parameter: THE CORRECTION AGAINST MY OWN LAST ANSWER - WHAT DOUBLED WAS CELLS, NOT DEMONSTRABLY STEM CELLS
  unit: cells per mm2; CD73-positive domain
  value: 'I told the operator in R361 that the pool doubled with nothing else moving. The full text is more
    specific and weaker. trompet2024: with three intra-articular SAG injections the number of SINGLE Tomato+
    cells was LOWERED while DOUBLETS AND TRIPLETS were INCREASED, with NO EFFECT ON LARGER CLONES; the total
    rose 65.5 -> 139.8 cells/mm2 (n=5, P=0.017), all within the resting zone. SO THE DOUBLED COUNT IS LABELLED
    STEM CELLS HAVING DIVIDED ONCE OR TWICE - it is a division result expressed as a cell count, and it does
    not by itself establish that there are more STEM cells.
    ⛔ AND newton2019''s INDEPENDENT READOUT OF THE STEM-CELL COMPARTMENT DID NOT MOVE: SAG (six systemic
    administrations P31-P34, analysed P35) increased proliferation within the niche but DID NOT EXPAND THE
    CD73-POSITIVE DOMAIN, P=0.3, n=5 vehicle versus n=3 SAG. A single intra-articular SAG injection
    accelerated niche proliferation within 24 hours. And neither Shh, nor vismodegib, nor the Gli inhibitor
    GANT61 altered colony-forming units of CD73+CD49e+ cells.
    ⚠ n=3 in the SAG arm means P=0.3 is close to uninformative, and CD73 domain area and Pthrp+ cell count are
    different quantities. But the honest position is: THE CELL COUNTS SHOW DIVISION; THE STEM-CELL COMPARTMENT
    WAS NOT SHOWN TO ENLARGE; AND WHAT CARRIES THE POOL INTERPRETATION IS THE SIX-MONTH LENGTH DATA, WHICH
    KEPT WIDENING AFTER THE SIGNAL STOPPED.
    ⭐ Since newton2019 shows post-SOC divisions are SYMMETRIC, division of a stem cell IS expansion of the
    stem pool under their own model - but that is an inference chaining two papers, not a measurement.'
  species: mouse
  n: 5 mice (trompet2024); 5 vs 3 (newton2019 CD73)
  source_ref: trompet2024
  value_unverified: false
- parameter: mTORC1 IS THE SECOND NICHE REGULATOR, AND IT IS A BAND
  unit: EdU-positive epiphyseal stem cells per section
  value: 'newton2019: chondrocyte-specific ablation of Tsc1 - which ACTIVATES mTORC1 - DISORGANIZES the
    resting zone after SOC formation without affecting chondrocyte proliferation or differentiation. The
    resting zone begins to disorganize at P28 with clonal clusters 12 days later; clusters express no ColX or
    Ihh but do express Gli2 and CD73; phosphorylated S6 confirms pathway activation.
    ⭐ AND THE NUMBER: EdU-POSITIVE EPIPHYSEAL STEM CELLS INCREASED FROM 24.7 +/- 3.7 (n=3) TO 62.4 +/- 7.5
    (n=7) PER SECTION, P=0.014 - mTORC1 activation more than DOUBLES stem-cell cycling.
    ⛔ BUT IT DISORGANIZES THE ZONE, so this is another interior optimum rather than a lever to push - the
    R307 cAMP shape and the R281 Wnt shape, a third time.
    ⛔ AND IT ADDS A MECHANISM TO AN EXISTING CONTRAINDICATION: RAPALOGS (sirolimus, everolimus,
    temsirolimus) INHIBIT mTORC1, which newton2019 names as one of the two pathways regulating the
    self-renewing pool. R300 had MTOR at -3.65 cm and R311 flagged FKBP1A; this supplies the niche-level
    mechanism. And alvarezgarcia2007 already showed rapamycin HALVES longitudinal growth rate in 4-week rats.'
  species: mouse
  n: 7 versus 3
  source_ref: newton2019
  value_unverified: false
- parameter: THE MOST ACTIONABLE CONSEQUENCE FOR THIS SUBJECT, AND IT CONCERNS A DRUG HE IS ALREADY TAKING
  unit: qualitative (mechanism conflict)
  value: 'CHAIN THE THREE FACTS THIS FILE NOW HOLDS. (1) newton2019: hedgehog signalling to the resting zone
    is REQUIRED to keep a growth plate open - remove it pharmacologically and the plate fuses in days.
    (2) kunovabosakova2018 via R294: ALL hedgehog transduction occurs inside the PRIMARY CILIUM - SMO
    translocates in and GLI is processed there - and FGFR signalling sets cilium length. (3) R294 again: in
    NORMAL mice, systemic AZD4547 for 28 days produced SIGNIFICANTLY SHORTER CILIA (P<0.001) in all three
    tissues tested.
    ⭐⭐ THE SUBJECT IS A WILD-TYPE-FGFR3 MALE ON A PAN-FGFR INHIBITOR. THE PREDICTION IS THAT ERDAFITINIB
    SHORTENS HIS GROWTH-PLATE CILIA AND THEREFORE ATTENUATES THE ONE SIGNAL DEMONSTRATED TO BE REQUIRED TO
    KEEP THE PLATE OPEN. That is a specific, mechanistic, testable conflict between the stack''s lead agent
    and the niche.
    ⚠ AND THE OPPOSITE ARM IS IN THE SAME PAPER, WHICH IS WHY THIS IS A GATE AND NOT A CONCLUSION: FGF2
    stabilises the GLI3 REPRESSOR and blunts SAG-induced Gli1/Ptch1, so removing FGF signalling should RAISE
    Gli output while SHORTENING cilia. Two arms, opposite signs, net effect never measured in any growth
    plate.
    ⭐ THE GATE IS UNCHANGED FROM R294 AND IS NOW MUCH MORE URGENT: give an FGFR inhibitor to a NORMAL growing
    animal and measure growth-plate CILIUM LENGTH, Gli1/Ptch1 AND bone length. If Gli1 falls, erdafitinib is
    costing the niche the signal that prevents fusion.'
  species: mouse
  n: not applicable - mechanism chain
  source_ref: newton2019
  value_unverified: false
localization:
- The niche sits immediately beneath the secondary ossification centre - long columns start close to the SOC
  bone surface, CD73 appears under the SOC, and SOC size correlates with clone size. The hedgehog signal
  reaches it from BOTH directions - Shh diffusing down from the SOC and Ihh diffusing up from the hypertrophic
  zone, giving maximal signalling specifically in the resting zone.
human_evidence: indirect
human_evidence_note: All of the mechanism is mouse clonal tracing and rat bead implantation. The human
  anchors are consistency only - HHIP pLoF +9.92 cm and HHIP gain-of-function missense -3.96 cm in 1.45M
  exomes, which put both directions of one hedgehog brake on human height, and the recognised paediatric
  concern about premature physeal fusion with hedgehog pathway inhibitors.
species_basis:
- mouse
- rat
- human
translation_risk: high
translation_risk_reason: 'The self-renewal, niche and necessity results are mouse clonal tracing at P28-P40,
  which is a juvenile animal in a species that never fuses its plates in the human sense; the length result
  is rat with a surgically implanted bead. Whether a niche that self-renews in a P30 mouse still does so in a
  human at bone age 16, and whether hedgehog remains its controller that late, is entirely unmeasured. The
  contraindication half translates more safely than the intervention half, because a necessity result
  transfers better than a sufficiency one.'
confidence: B
claim_grades:
- claim: Chondroprogenitors acquire self-renewal after secondary ossification centre formation, so the
    postnatal resting zone is a self-renewing niche rather than a draining budget.
  grade: B
  basis: newton2019, Nature - multicolour clonal tracing with monoclonal columns persisting at least five
    months, stem-cell markers, and symmetric division. Mouse only, and persistence for five months is not the
    same as unlimited renewal.
- claim: Hedgehog signalling to the resting zone is required to prevent fusion.
  grade: A
  basis: A pharmacological necessity test in a normal juvenile animal - six administrations of vismodegib
    reduced resting-zone clonal size and caused growth-plate fusion, with resting-zone proliferation
    inhibited, no premature hypertrophy, and stem-cell identity retained.
- claim: Approved SMO antagonists are contraindicated for anyone trying to keep a growth plate open.
  grade: A
  basis: The experiment used vismodegib itself, the marketed molecule, and the outcome was fusion.
- claim: Anti-angiogenic agents damage the niche by impairing the SOC.
  grade: C
  basis: Axitinib P18-P27 reduced SOC size (P=0.0054) and clone size (P=0.0023) in the same figure. One
    agent, one window, one species, and the effect is on SOC maturation rather than on an established SOC.
- claim: The trompet2024 cell-count doubling demonstrates an enlarged stem-cell pool.
  grade: D
  basis: WEAKENED ON READING THE FULL TEXT. The rise is singles becoming doublets and triplets, i.e.
    division; newton2019's independent CD73-domain readout did not expand under SAG (P=0.3, n=5 vs 3). The
    pool interpretation now rests mainly on the six-month length data rather than on the cell counts.
