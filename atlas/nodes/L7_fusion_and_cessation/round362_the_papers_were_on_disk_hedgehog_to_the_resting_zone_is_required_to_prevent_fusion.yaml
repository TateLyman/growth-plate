contradicts:
- CORRECTS R360 IN ITS STRONG FORM. The postnatal resting zone SELF-RENEWS, so closure is not simple budget
  exhaustion. What survives is that the terminus is still zero proliferation and that the rate-yield trade-off
  is still measured; what changes is that a self-renewing niche can in principle be supported, which a spent
  budget cannot.
- CORRECTS MY OWN STATEMENT TO THE OPERATOR IN R361 that the pool doubled with nothing else moving. The
  doubling is singles becoming doublets and triplets - division - and newton2019's CD73-domain readout did
  not expand under SAG.
- ADDS TWO CONTRAINDICATION CLASSES WITH DIRECT EXPERIMENTAL BASIS - approved SMO antagonists (vismodegib,
  sonidegib, glasdegib), where the marketed molecule itself caused fusion, and anti-angiogenics, which
  impair the SOC that sources the niche signal.
- SHARPENS R294 FROM A CURIOSITY INTO THE MOST URGENT GATE IN THE FILE. Hedgehog is now demonstrated to be
  REQUIRED to prevent fusion, all hedgehog transduction happens in the primary cilium, and an FGFR inhibitor
  significantly shortens cilia in normal mice. The subject is on one.
- CORR-333, EARNED. R361 asked the operator for three papers that were already in the upload store, together
  with the official numeric source data for the figure whose interpretation the round turned on.
