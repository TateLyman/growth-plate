key_refs:
- ref_id: emons2011
  pmid: '21540578'
  first_author: Emons J
  year: 2011
  type: review
  one_line_finding: >-
    Names the species barrier explicitly as the reason experimental study of fusion is
    complicated, and lists apoptosis, autophagy, transdifferentiation and hypoxia as the four
    competing hypotheses for the final step.
- ref_id: yu2025
  pmid: '40478277'
  first_author: Yu X
  year: 2025
  type: primary
  one_line_finding: >-
    States and demonstrates that the mouse and rat growth plates do not fuse completely even
    after sexual maturity, making fusion mechanism hard to study in these models.
- ref_id: lanfranco2008
  pmid: '18590994'
  first_author: Lanfranco F
  year: 2008
  type: primary
  one_line_finding: >-
    In an aromatase-deficient man with poor compliance, epiphyseal closure occurred only once
    serum estradiol exceeded 73 pmol/L.
- ref_id: kvist2021
  pmid: '33047349'
  first_author: Kvist O
  year: 2021
  type: primary
  one_line_finding: >-
    MRI in 958 healthy subjects aged 14.0-21.5 y establishes site-specific fusion percentages
    and an ascending foot-to-wrist order.
