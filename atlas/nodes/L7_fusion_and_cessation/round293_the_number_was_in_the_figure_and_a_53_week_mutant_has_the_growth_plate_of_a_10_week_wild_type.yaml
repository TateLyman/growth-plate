contradicts: >-
  Corrects a claim rounds 285 and 290 made from this same paper: "no body-weight difference" excludes somatic
  overgrowth for the LIMB-RESTRICTED conditional only. The GLOBAL null has significantly increased neonatal
  body weight and body size. The two were cited interchangeably and are opposite.
  Otherwise it quantifies rather than overturns - it converts round 285's and round 290's "significantly
  longer femur, effect sizes figure-only" into numbers, and adds the growth-plate-area timecourse that
  neither round quoted because neither round opened the figure. See CORR-318.
builds_on: round292_the_human_growth_plate_puts_hhip_and_fbn1_in_different_compartments_and_finds_our_lead_gene
