id: round293_the_number_was_in_the_figure_and_a_53_week_mutant_has_the_growth_plate_of_a_10_week_wild_type
name: >-
  ROUND 293 - rounds 285 and 290 recorded haraguchi2025's effect size as "figure-only" and moved on twice.
  The paper is open access; the figure was rendered at 420 dpi and read. Femur +2.7 per cent at 10 weeks and
  +4.5 PER CENT AT 53 WEEKS, body weight not significant at either age - and the growth plate area of a
  53-week-old mutant EQUALS THAT OF A 10-WEEK-OLD WILD TYPE. This is the only agent or allele in the atlas
  shown to hold a growth plate open into old age in a normal animal. Every panel is MALE
aliases:
- round 293
- the HHIP effect size
- a 53-week plate the size of a 10-week plate
- figure-only is not unobtainable
- haraguchi2025 quantified
type: hypothesis
layer: L7
stub: false
summary: >-
  ZERO - WHY THIS WAS NOT ALREADY KNOWN. haraguchi2025 states its central skeletal result as "quantitative
  analysis confirmed a statistically significant increase in femur length in cKO mice at both stages (Fig. 6
  b, d)" and gives NO MEAN, NO SD AND NO PERCENTAGE ANYWHERE IN THE TEXT. Rounds 285 and 290 both recorded
  "effect sizes figure-only" and proceeded on the qualitative claim. THE ARTICLE IS OPEN ACCESS ON J-STAGE.
  The PDF page carrying Figure 6 was rendered at 420 dpi and read. It took one download.

  ONE - THE LENGTH NUMBERS, AND THEY ARE THE RIGHT SHAPE. All readings are digitised from scatter plots and
  are marked unverified; the axis ranges are given so anyone can check them.
  TEN WEEKS, MALE (Fig. 6b, y-axis 1.3-1.7 cm): control about 1.49 cm with n = 6, mutant about 1.53 cm with
  n = 4. PLUS 0.04 CM, ABOUT PLUS 2.7 PER CENT, marked * which in this paper's own non-standard legend means
  p < 0.01.
  FIFTY-THREE WEEKS, MALE (Fig. 6d, y-axis 1.4-1.8 cm): control about 1.55 cm, mutant about 1.62 cm, n = 6
  and 6. PLUS 0.07 CM, ABOUT PLUS 4.5 PER CENT, marked *** which in this paper's legend means p < 0.0001.
  BODY WEIGHT IS NOT SIGNIFICANT AT EITHER AGE - about 25.5 versus 25 g at 10 weeks and 45 versus 47 g at 53.
  So the length gain is not somatic overgrowth, and the authors say so.
  THE EFFECT GROWS: 2.7 per cent to 4.5 per cent, and the absolute gap widens from 0.04 to 0.07 cm. Between
  10 and 53 weeks wild-type femurs gained about 0.06 cm and mutant femurs about 0.09 cm - THE MUTANT KEPT
  ACCRUING ABOUT FIFTY PER CENT MORE LENGTH THAN WILD TYPE DURING THE PERIOD WHEN A MOUSE PLATE IS WINDING
  DOWN. That is the same shape as trompet2024's hedgehog bead, where the femoral gain rose from 2.75 to 2.64
  to 3.63 per cent at one, two and six months. TWO INDEPENDENT HEDGEHOG-ELEVATION EXPERIMENTS, DIFFERENT
  SPECIES, DIFFERENT MODALITY - GENETIC VERSUS PHARMACOLOGICAL - AND IN BOTH THE GAIN INCREASES WITH TIME
  RATHER THAN FADING. A velocity effect does not do that. A prolonged growth period does.

  TWO - AND THE PANEL NOBODY QUOTED IS THE ONE THAT MATTERS FOR THIS CASE. Figure 6i, growth plate area,
  y-axis 0 to 0.8 mm squared, both timepoints marked ** (p < 0.001).
  AT TEN WEEKS: control about 0.44, mutant about 0.62 mm squared - about PLUS 41 PER CENT.
  AT FIFTY-THREE WEEKS: control about 0.29, mutant about 0.44 mm squared - about PLUS 52 PER CENT.
  NOW READ THOSE FOUR NUMBERS AS A GRID RATHER THAN AS TWO COMPARISONS. Wild-type plate area falls from 0.44
  to 0.29 between 10 and 53 weeks, which is normal involution. The mutant falls from 0.62 to 0.44. THE
  53-WEEK-OLD MUTANT'S GROWTH PLATE AREA IS THE SAME AS THE 10-WEEK-OLD WILD TYPE'S. A mutant approaching
  the end of a mouse's life has the plate a normal mouse has in young adulthood.
  THE HISTOLOGY SAYS IT WITHOUT ARITHMETIC. At 53 weeks the wild-type plate (Fig. 6g) is a thin flattened
  band, largely involuted. The mutant plate at the same age (Fig. 6h) is tall, columnar and populated with
  large chondrocytes - it looks like a young plate.
  THIS IS THE ONLY ENTRY IN THIS ATLAS - AGENT, ALLELE OR PROTOCOL - SHOWN TO HOLD A GROWTH PLATE OPEN INTO
  OLD AGE IN A NORMAL ANIMAL WITH A LENGTH ENDPOINT ATTACHED. The case is bone age 16 with a closing window.
  Every other lever in the file raises a rate; this one appears to extend the period.

  THREE - EVERY SKELETAL PANEL IS LABELLED MALE, WHICH THE TEXT NEVER STATES. Figure 6 is headed "10 weeks
  male" and "53 weeks male", and panels e-h are labelled the same. So the entire skeletal phenotype of this
  paper is male, which happens to match this case - and which means SEX-SPECIFICITY IS COMPLETELY UNTESTED.
  Given that CORR-314 and CORR-317 were both about sex confounding this same week, the correct reading is
  that this paper AVOIDED the confound by using one sex, and paid for it with no generalisability across
  sexes.

  FOUR - TWO SMALLER FACTS FROM THE FULL TEXT, ONE OF WHICH QUALIFIES A CLAIM WE MADE.
  (a) THE GLOBAL NULL DOES SHOW SOMATIC OVERGROWTH. Hhip1 ex2delta homozygous neonates have increased body
  size and SIGNIFICANTLY GREATER BODY WEIGHT than wild type (Fig. 2, n = 9-18). Rounds 285 and 290 cited "no
  body-weight difference" as excluding generalised overgrowth - true for the LIMB-RESTRICTED cKO, which is
  the relevant animal, but the whole-organism null is a different result and the atlas should not blur them.
  All global nulls die within hours of birth of respiratory failure.
  (b) THE DELETED REGION IS IN HHIP-N, NOT THE PROPELLER. Exon 2 encodes 193 bp corresponding to amino acids
  94-157 of the 700-residue protein, and its excision causes a frameshift annulling the Hedgehog
  ligand-binding domain. On the UniProt architecture used in round 291, residues 94-157 sit in the
  N-TERMINAL domain - the same HHIP-N that griffiths2021 shows binds the ligand's cholesterol at 23
  micromolar through a CRD of Smoothened's structural family. So the allele that lengthens this femur
  destroys the domain round 291 nominated as the druggable pocket. That is an argument that the pocket is
  load-bearing, and it is the closest thing to pharmacological validation this target has.
human_evidence: indirect
human_evidence_note: >-
  This node is entirely mouse. Its human anchor is external and was established elsewhere: kosmicki2026's
  HHIP pLoF at +9.92 cm per allele and p.V496E at -3.96 cm, and round 292's finding that HHIP is expressed in
  the human growth plate in the resting and proliferative zones. Nothing here is a human measurement, and no
  human has received any HHIP-directed agent.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: >-
  A mouse femur is not a human femur and 4.5 per cent of 1.55 cm is 0.7 mm. The model is a germline
  limb-mesenchyme deletion from embryonic onset via Prx1-Cre, not a postnatal intervention, so it shows what
  the gene does across a lifetime rather than what removing it at bone age 16 would do - the tamoxifen-
  inducible experiment remains unrun. All panels are male, n = 4-6, one laboratory, effect sizes digitised
  from scatter plots rather than tabulated. And the opposite direction of this axis carries grade-A
  irreversible physeal fusion in children.
confidence: B
confidence_reason: >-
  The qualitative claims are the authors' own and are B: significant femur length increase at two ages with
  body weight unchanged, and significantly greater growth plate area at both, n = 4-6, unpaired t-tests. The
  NUMBERS are digitised from published scatter plots by rendering the open-access PDF, which is reproducible
  and auditable - the renders are committed - but is a reading, not a tabulation, and every figure-derived
  value carries value_unverified. The 53-week-equals-10-week observation is arithmetic on four such readings
  and is the claim most exposed to digitisation error, so it is graded C on its own.
claim_grades:
- claim: >-
    Limb-restricted Hhip1 deletion lengthens the mouse femur by about 2.7 per cent at 10 weeks and about 4.5
    per cent at 53 weeks, with body weight unchanged.
  grade: B
  basis: >-
    haraguchi2025 Fig. 6b and 6d, digitised. 10 wk male: control about 1.49 cm (n=6) versus mutant about 1.53
    cm (n=4), marked * = p < 0.01 on this paper's non-standard legend. 53 wk male: about 1.55 versus about
    1.62 cm, n = 6 and 6, marked *** = p < 0.0001. Body weight ns at both ages, which is the authors' stated
    ground for excluding generalised somatic overgrowth. The significance and the direction are the authors'
    claims; only the magnitudes are mine, and they carry value_unverified.
  value_unverified: true
- claim: >-
    The gain grows with time rather than fading, and that is the second independent instance on this axis.
  grade: B
  basis: >-
    2.7 per cent to 4.5 per cent between 10 and 53 weeks, with the absolute gap widening from 0.04 to 0.07
    cm; wild-type femurs gained about 0.06 cm over that interval and mutants about 0.09. Independently
    matched by trompet2024, a different species and a pharmacological rather than genetic manipulation,
    where the unilateral hedgehog bead gave 2.75, 2.64 and 3.63 per cent at one, two and six months in 6/6,
    9/9 and 8/8 animals. A rate effect on a closing plate shrinks as a fraction; a prolonged growth period
    does not.
  value_unverified: true
- claim: >-
    A 53-week-old Hhip1 cKO mouse has the growth plate area of a 10-week-old wild type.
  grade: C
  basis: >-
    THE MOST DECISION-RELEVANT NUMBER IN THE HHIP CASE AND THE ONE MOST EXPOSED TO DIGITISATION ERROR, hence
    C. Fig. 6i, y-axis 0-0.8 mm squared, both ages marked ** = p < 0.001. 10 wk: control about 0.44, mutant
    about 0.62 mm squared. 53 wk: control about 0.29, mutant about 0.44. The mutant's 53-week value equals
    the wild type's 10-week value. Corroborated qualitatively and independently of the digitisation by the
    histology in Fig. 6g and 6h - at 53 weeks the wild-type plate is a thin flattened band while the
    mutant's is tall, columnar and full of large chondrocytes.
  value_unverified: true
- claim: >-
    This is the only entry in the atlas shown to hold a growth plate open into old age in a normal animal
    with a length endpoint.
  grade: C
  basis: >-
    A CLAIM ABOUT THE FILE, NOT ABOUT BIOLOGY, AND IT SHOULD BE RE-CHECKED RATHER THAN TRUSTED. Every other
    lever in the atlas is characterised on rate or on zone height over weeks. lui2026's Spin4-KO is longer at
    18 months but reports normal BMD and no plate-area timecourse. Distraction osteogenesis works after
    fusion but is surgical. If a counter-example exists it belongs here; graded C because absence-in-the-file
    is exactly the claim CORR-313 says this ledger is bad at.
- claim: >-
    The absence of a body-weight difference means Hhip1 loss causes no somatic overgrowth.
  grade: X
  basis: >-
    TRUE FOR THE LIMB-RESTRICTED cKO AND FALSE FOR THE GLOBAL NULL, AND ROUNDS 285 AND 290 BLURRED THEM.
    haraguchi2025 Fig. 2: Hhip1 ex2delta homozygous NEONATES have increased body size and significantly
    greater body weight than wild type (n = 9-18, one-way ANOVA with Tukey). They die within hours of birth
    from respiratory failure. The Prx1-Cre limb-restricted animals are the ones with no weight difference,
    and they are the relevant model - but the whole-organism statement is the opposite and must not be cited
    as if the two agreed.
- claim: >-
    The exon deleted in this model corresponds to the domain round 291 nominated as druggable.
  grade: B
  basis: >-
    haraguchi2025 states exon 2 encodes 193 bp corresponding to amino acids 94-157 of the 700-residue Hhip1
    protein, and that its excision frameshifts and annuls the Hedgehog ligand-binding domain. On UniProt
    Q96QV1, used in round 291, 94-157 lies in the N-terminal domain - the HHIP-N that griffiths2021 shows
    binds the SHH cholesterol at K_D 23 micromolar via a CRD of Smoothened's structural family, and whose
    DL1/DL2 loops are the predicted small-molecule pocket. The allele that produces this femur destroys that
    domain. It is not pharmacology, but it is the closest thing to target validation the pocket has.
