human_evidence: absent
human_evidence_note: >-
  No human counterpart of the rat's sealed-edge/acellular terminal morphology has been sought
  in human physes; the only human fusing-plate histology series describes a different picture
  (disorganised large chondrocytes bounded by dense cortical-like bone) (emons2009).
species_basis:
- rat
translation_risk: high
translation_risk_reason: >-
  The rat terminal phenotype is a different endpoint from human fusion, so rat mechanism data
  about growth cessation cannot be read as data about fusion. Rat is also the source species
  for much endocrine growth plate pharmacology.
