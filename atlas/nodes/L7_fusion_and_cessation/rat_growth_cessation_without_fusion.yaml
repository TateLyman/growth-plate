  species: rat
  source_ref: roach2003
  uncertainty: ADDED 2026-08-06 ON READING THE FULL TEXT; the node previously held only the four old-plate morphologies
    from the abstract. The authors' conclusion is explicit - absence of the volume increase appeared to be the main
    factor associated with deceleration and, eventually, cessation of growth. They also say plainly that it is not
    known what regulates the volume increase during active growth or what prevents it as growth slows.
- parameter: what does NOT change while rat growth decelerates
  value: proliferative zone height and proliferation rate, to at least 12 weeks
  unit: qualitative, PCNA index
  conditions: PCNA immunostaining at 2, 4, 12 weeks and in old rats; hypertrophic chondrocytes PCNA-negative throughout
  species: rat
  source_ref: roach2003
  uncertainty: 'A DOUBLE DISSOCIATION WITHIN ONE STUDY: the hypertrophic side collapses while the proliferative side
    holds. In OLD rats PCNA-positive cells could no longer be identified at all, so proliferation does eventually
    fail - but after the deceleration, not during it. At 12 weeks PCNA-positive cells also appeared near the vascular
    front in cells that looked hypertrophic, which the authors note without explaining.'
- parameter: decomposition of rat elongation into its three sources
  value: 9% proliferation, 32% matrix synthesis, 59% chondrocyte enlargement
  unit: '% of longitudinal growth'
  conditions: proximal tibial growth plate of a 4-week-old rat
  species: rat
  source_ref: roach2003
  uncertainty: 'Quoted by roach2003 from Wilsman et al. 1996, i.e. SECOND-HAND HERE - the atlas has not read that
    primary and the row is graded accordingly. It is recorded because it is the quantitative statement of why the
    rat decelerates the way it does: the term that supplies 59% of elongation is the term that fails. In human the
    same term does not vary at all across childhood (kember1976), which is contradiction C-L1-09.'
- parameter: rabbit comparison - both arms fail, in a plate that does close
  value: proliferating cells 55% at 5 weeks to 13% at 20 weeks; TUNEL-positive 3% to 26%
  unit: '% of chondrocytes'
  conditions: rabbit growth plate, cited by roach2003 from Aizawa et al. 1997
  species: rabbit
  source_ref: roach2003
  uncertainty: SECOND-HAND, not read from the primary. Included because the rabbit is a plate that actually closes
    and shows BOTH reduced proliferation and increased death, where the rat shows mainly loss of hypertrophy - so
    the three rodent/lagomorph models do not agree with each other either, and the atlas should stop treating "the
    animal data" as one thing.
