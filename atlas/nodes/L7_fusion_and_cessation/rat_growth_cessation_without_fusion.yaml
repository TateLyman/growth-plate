confidence_note: 'HELD AT C on 2026-08-06 after reading roach2003 in full. The study is one laboratory and one strain,
  the key comparisons are qualitative and figure-based, and two of the new rows are quoted second-hand from primaries
  this atlas has not read. What the full text adds is not certainty but SPECIFICITY: the rat''s deceleration is located
  in the hypertrophic arm, and that is precisely the arm human data says does not vary.'
