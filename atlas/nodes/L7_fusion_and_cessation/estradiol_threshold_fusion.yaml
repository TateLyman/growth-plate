  year: 2008
  type: primary
  one_line_finding: >-
    Epiphyseal closure, BMD normalisation and turnover-marker normalisation occurred only when
    serum estradiol exceeded 73 pmol/L in an aromatase-deficient man on transdermal estradiol.
