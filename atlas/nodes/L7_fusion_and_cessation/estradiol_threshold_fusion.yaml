localization:
- 'SYS: circulating estradiol; the effective concentration at the growth plate has never been measured in humans'
human_evidence: direct
human_evidence_note: >-
  Within-subject longitudinal human data from an aromatase-deficient man on variable estradiol
  replacement, supported by a cross-sectional obese-versus-lean comparison at Tanner G5.
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  Human-only data. The risk is n=1 for the interventional element and the assay dependence of
  low estradiol measurements, which differ substantially between immunoassay and LC-MS/MS.
confidence: D
