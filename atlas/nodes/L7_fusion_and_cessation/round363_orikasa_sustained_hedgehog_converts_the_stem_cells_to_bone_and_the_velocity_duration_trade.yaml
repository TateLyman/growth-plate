id: round363_orikasa_sustained_hedgehog_converts_the_stem_cells_to_bone_and_the_velocity_duration_trade
name: Round 363 - Orikasa 2024 read in full. SUSTAINED hedgehog activation expands the resting-zone clone
  and then converts it into trabecular OSTEOBLASTS, which reconciles R311 with trompet2024 and rules out the
  forever version of the hedgehog strategy - and it reframes "keep velocity as long as possible" as a
  yield-versus-throughput problem with a measured exponent
