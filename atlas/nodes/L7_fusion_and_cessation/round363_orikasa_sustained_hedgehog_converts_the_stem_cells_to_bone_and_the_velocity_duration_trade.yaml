contradicts:
- RULES OUT THE SUSTAINED VERSION OF THE HEDGEHOG STRATEGY, WHICH IS THE VERSION THE OBJECTIVE WAS DRIFTING
  TOWARD. Permanent activation converts the resting-zone stem cells into trabecular osteoblasts. If this axis
  is used at all it must be pulsed, and the pulse interval is unmeasured in every species.
- RESOLVES THE R311-VERSUS-trompet2024 TENSION THAT R361 AND R362 BOTH LEFT OPEN, and does it with the same
  perturbation the screen used, so the two data sets now agree rather than conflict.
- WEAKENS THE MAGNITUDES IN R360 WHILE KEEPING ITS DIRECTION. The fixed-pool premise is too strong given
  newton2019's self-renewal, so the +5.2 per cent and +11.3 per cent figures are illustrative rather than
  predictive; what survives is that throughput and yield trade against each other and that only yield
  contributes to total height.
- DOES NOT PRODUCE A NEW COMPOUND. The answer to keeping velocity longest is a weighting and a protection
  list built from what is already in the stack, plus one unresolved question about whether the FGFR
  inhibitor is attenuating the niche signal.
