stub: false
summary: 'The operator supplied five Ono-lab papers, asked whether orikasa2024 was held. ⛔ IT WAS -
  since 2026-08-07, cited by TEN nodes, WITH A FULLER one_line_finding THAN THE ONE I THEN WROTE, and the
  companion commentary was held too as orikasa2026. I downloaded a paper the file already had, for the second
  time in three rounds. CORR-333 again. And then
  narrowed the objective to a single question: keep velocity on erdafitinib and GH for as long as possible,
  with an aromatase inhibitor already in place and using compounds already available. ⛔⛔ ORIKASA 2024 IS THE
  MOST IMPORTANT QUALIFIER ON THE HEDGEHOG DIRECTION IN THIS FILE AND IT ARRIVES EXACTLY WHEN THE STRATEGY
  WAS ABOUT TO BECOME "SUSTAIN HEDGEHOG FOREVER". Tamoxifen-inducible Pthrp-creER with Ptch1-floxed and
  tdTomato - i.e. PERMANENT, CELL-AUTONOMOUS hedgehog activation specifically in the PTHrP+ resting-zone stem
  cells. SHORT TERM IT DOES EXACTLY WHAT WE WANT: the activated cells form large concentric clonally expanded
  populations within the resting zone that the authors name "patched roses", generate SIGNIFICANTLY WIDER
  COLUMNS of chondrocytes, and produce HYPERPLASIA OF THE GROWTH PLATE. ⛔ LONG TERM IT DOES THE OPPOSITE OF
  WHAT WE WANT: the descendants MIGRATE AWAY FROM THE GROWTH PLATE AND TRANSFORM INTO TRABECULAR OSTEOBLASTS
  IN THE DIAPHYSEAL MARROW SPACE. The authors state the mechanism as hedgehog activation driving resting-zone
  chondrocytes into TRANSIT-AMPLIFYING states and EVENTUALLY CONVERTING THEM INTO OSTEOBLASTS - hence
  TRANSIENT clonal competency. ⭐⭐ THIS RECONCILES TWO RESULTS THIS FILE HAD IN UNRESOLVED TENSION, AND THE
  RECONCILIATION IS ON THE TIME AXIS RATHER THAN THE COMPARTMENT AXIS. R311s maturation screen scored Ptch1
  knockout at +6.004, i.e. matures early - the SAME perturbation Orikasa uses - and now has a mechanism: the
  stem cells do not mature early so much as LEAVE THE CARTILAGE LINEAGE. trompet2024s local SAG bead, whose
  signal was gone by three weeks, gave pool expansion with ordered zones and a length gain that kept widening.
  A PULSE EXPANDS; SUSTAINED ACTIVATION CONVERTS AND EXHAUSTS. That is CORR-300s shape on a new axis and it
  is a direct answer to the operator: the FOREVER version of the hedgehog strategy is the version that spends
  the niche into bone. ⭐⭐⭐ AND FOR THE ACTUAL OBJECTIVE - VELOCITY FOR AS LONG AS POSSIBLE - THE FILE NOW
  HAS THE ARITHMETIC. Velocity = D x A x h_term where D is pool consumption; duration is approximately pool
  divided by D; so velocity-times-duration is maximised by raising AMPLIFICATION and TERMINAL CELL HEIGHT and
  NOT by raising throughput. hunziker1994 measured the exchange rate: amplification is proportional to
  throughput to the power -0.150. GH is the throughput arm - 5.00x pool consumption, 0.77x amplification,
  1.36x h_term, pool consumption carrying 97 per cent of the log effect - so it buys velocity out of
  duration at roughly break-even on total height (+5.2 per cent). IGF-I in the SAME experiment is a better
  yield profile (+11.3 per cent). And the one arm with a demonstrated human bone-age-sparing velocity gain is
  h_term: dauber2026, 30 children, +4.0 SD velocity Z with the bone-age-to-chronological-age ratio UNMOVED.
  SO THE ANSWER IS NOT A NEW COMPOUND - IT IS TO STOP TREATING ALL VELOCITY AS EQUIVALENT, MAXIMISE THE
  h_term ARM, QUESTION THE GH DOSE RATHER THAN THE GH ARM, AND PROTECT THE NICHE SIGNAL.'
quantitative:
- parameter: SUSTAINED CELL-AUTONOMOUS HEDGEHOG ACTIVATION EXPANDS THE RESTING-ZONE CLONE AND THEN CONVERTS
    IT INTO TRABECULAR OSTEOBLASTS
  unit: qualitative lineage tracing with growth-plate morphology
  value: 'orikasa2024, JCI Insight, Ono lab. Model: tamoxifen-inducible Pthrp-creER crossed to Ptch1-floxed
    and tdTomato - deletion of Patched-1 gives PERMANENT, CELL-AUTONOMOUS hedgehog pathway activation
    specifically in the PTHrP-expressing resting-zone stem cells, with lineage tracing of all descendants.
    SHORT TERM - THE DESIRED RESULT: activated PTHrP+ chondrocytes formed LARGE, CONCENTRIC, CLONALLY
    EXPANDED cell populations within the resting zone, which the authors name PATCHED ROSES; they generated
    SIGNIFICANTLY WIDER COLUMNS of chondrocytes; and the result was HYPERPLASIA OF THE GROWTH PLATE.
    ⛔ LONG TERM - THE COST: Hedgehog-activated PTHrP+ cell descendants MIGRATED AWAY FROM THE GROWTH PLATE
    AND TRANSFORMED INTO TRABECULAR OSTEOBLASTS IN THE DIAPHYSEAL MARROW SPACE.
    AUTHORS CONCLUSION, verbatim in substance: hedgehog activation drives resting-zone chondrocytes into
    TRANSIT-AMPLIFYING states as proliferating chondrocytes and EVENTUALLY CONVERTS THESE CELLS INTO
    OSTEOBLASTS - which is why the competency is called TRANSIENT.
    ⛔⛔ AND THE FULL TIME COURSE - WHICH THIS FILE ALREADY HELD AND WHICH IS WORSE THAN THE ABSTRACT ALONE
    SUGGESTS: labelled cells RISE STEEPLY P21 TO P36, THEN FALL AT P56-P70, AND BY P96 THERE IS NO
    STATISTICAL DIFFERENCE AT ALL. The expansion is COMPLETELY REVERSED. Descendants are Col1a1-GFP+
    trabecular osteoblasts in the diaphyseal marrow by P96. Columns widen from about 1-2 to a maximum of 5-6
    cells at P36.
    ⛔⛔⛔ AND THE LENGTH ENDPOINT IS NOT NEUTRAL, IT IS NEGATIVE THEN NULL: FEMUR LENGTH IS TRANSIENTLY
    REDUCED AT P21 before becoming equivalent, and the authors own words are that hedgehog activation
    "negatively affects the bone length only transiently". SO SUSTAINED ACTIVATION BOUGHT A LARGER PLATE, A
    WIDER COLUMN, AND NO FINAL LENGTH.
    ⭐ THE OPERATIONAL READING: hedgehog does not merely make the stem cells divide faster, it moves them
    ALONG A FATE TRAJECTORY THAT ENDS OUTSIDE THE CARTILAGE LINEAGE - and the clone that looked expanded at
    P36 is gone by P96. Sustained activation converts a renewable niche into a one-way pipeline into bone
    and returns nothing on length.'
  species: mouse
  n: lineage tracing, short and long term
  source_ref: orikasa2024
  value_unverified: false
- parameter: THIS RECONCILES R311 WITH trompet2024, AND THE RECONCILING VARIABLE IS DURATION OF SIGNAL
  unit: qualitative (mechanism reconciliation)
  value: 'THE TENSION R362 LEFT OPEN: R311s CRISPR maturation screen scored Ptch1 knockout at +6.004 and Sufu
    at +3.628, i.e. cell-autonomous hedgehog activation ACCELERATES maturation and spends the period - while
    trompet2024s local SAG produced pool expansion and a growing length gain, and haraguchi2025s Hhip1 loss
    held a plate open for a year.
    ⭐ ORIKASA SUPPLIES THE MISSING MECHANISM AND USES THE SAME PERTURBATION AS THE SCREEN - Ptch1 deletion.
    The stem cells do not simply mature early; THEY LEAVE THE CARTILAGE LINEAGE AND BECOME OSTEOBLASTS. That
    is why a permanent genetic activation scores as accelerated maturation.
    ⭐⭐ AND THE DISCRIMINATING VARIABLE IS TIME, NOT COMPARTMENT: trompet2024 delivered a bead whose Gli1
    signal was GONE BY THREE WEEKS and saw ordered zones, unchanged proliferation and terminal cell size, no
    osteoarthritis at six months, and a length gain that kept widening. newton2019 gave six systemic doses
    and saw raised niche proliferation with NO expansion of the CD73+ domain. Orikasa gave a PERMANENT
    cell-autonomous activation and saw conversion to bone.
    A PULSE EXPANDS. SUSTAINED ACTIVATION CONVERTS AND EXHAUSTS.
    ⛔ DIRECT CONSEQUENCE FOR THE OPERATORS STATED GOAL: the "keep it on forever" version of the hedgehog
    strategy is precisely the version Orikasa shows converts the stem cells into trabecular bone. If this
    axis is ever used it must be PULSED, and the interval between pulses is an unmeasured parameter in every
    species.'
  species: mouse
  n: three studies compared
  source_ref: orikasa2024
  value_unverified: false
- parameter: THE VELOCITY-DURATION ARITHMETIC, WHICH IS THE ACTUAL ANSWER TO THE OBJECTIVE
  unit: dimensionless multipliers on velocity and on total height from a fixed pool
  value: 'Velocity = D x A x h_term, where D is pool consumption rate, A is amplification (hypertrophic cells
    delivered per resting cell consumed) and h_term is terminal hypertrophic cell height. Duration is
    approximately pool divided by D. SO VELOCITY MULTIPLIED BY DURATION - which is total height - DEPENDS ONLY
    ON A AND h_term, AND NOT ON D.
    hunziker1994, four groups in one experiment, gives the exchange rate: AMPLIFICATION IS PROPORTIONAL TO
    THROUGHPUT TO THE POWER -0.150. Halving throughput raises amplification 11.0 per cent; a five-fold rise
    costs 21.5 per cent.
    THE ARMS, SCORED ON THIS BASIS:
    GH - 5.00x pool consumption, 0.77x amplification, 1.36x h_term. Pool consumption carries 97 per cent of
    the log effect. TOTAL HEIGHT FROM A FIXED POOL = 0.77 x 1.36 = 1.052, i.e. +5.2 per cent. GH IS A
    THROUGHPUT AGENT: it converts the niche into height about five times faster at roughly break-even yield.
    IGF-I in the same experiment - 2.67x, 1.40x, 0.79x. TOTAL = 1.113, i.e. +11.3 PER CENT, A BETTER YIELD
    PROFILE THAN GH. ⚠ Recorded, not promoted: these are hypophysectomised rats, and R326 disqualified
    mecasermin on the separate grounds that circulating IGF-1 drives RADIAL rather than longitudinal growth.
    VOSORITIDE / the CNP arm - assigned to h_term, and dauber2026 is the only arm in the stack with a
    demonstrated human BONE-AGE-SPARING velocity gain: 30 children, annualised velocity 4.53 to 8.09 cm/yr,
    +4.0 SD velocity Z (95% CI 3.08-4.91), height +0.65 SD, AND THE BONE-AGE-TO-CHRONOLOGICAL-AGE RATIO
    UNMOVED. ⚠ Same trial, longer use: five discontinued, including THREE slipped capital femoral epiphyses.
    ⭐ THE CONCLUSION THE OPERATOR ASKED FOR: not all velocity is equivalent. Velocity bought through h_term
    does not spend duration; velocity bought through throughput does. The stack should be weighted toward the
    h_term arm and the GH DOSE - not the GH arm - is the variable nobody has priced.'
  species: rat
  n: four groups of six (hunziker1994); 30 children (dauber2026)
  source_ref: hunziker1994
  value_unverified: false
- parameter: GH ACTS DIRECTLY ON HUMAN GROWTH-PLATE STEM CELLS - THE RAT DECOMPOSITION NOW HAS A HUMAN TARGET
  unit: qualitative
  value: 'orikasa2026 (Trends in Endocrinology and Metabolism, commentary on Chu et al.): the epiphyseal
    growth plate is the key target of GH therapy; growth-plate stem cells are well defined in mice and their
    presence in humans was unclear; using RARE SURGICAL SPECIMENS, Chu et al. reveal CONSERVED, GH-RESPONSIVE
    STEM CELLS IN THE HUMAN PUBERTAL GROWTH PLATE.
    ⭐ WHY IT MATTERS HERE: hunziker1994 showed in rats that GH raises growth rate almost entirely by
    consuming the resting pool faster, with amplification falling. The unstated weak link was whether GH acts
    on the stem-cell compartment in HUMANS at all. This says it does, in human pubertal tissue.
    ⚠ It is a COMMENTARY, i.e. an index rather than a source, and the underlying data are Chu et al., which
    this atlas already holds as chu2026. Recorded at that strength.'
  species: human
  n: commentary on human surgical specimens
  source_ref: orikasa2026
  value_unverified: true
- parameter: WHAT ACTUALLY PROTECTS DURATION, USING ONLY WHAT IS ALREADY AVAILABLE
  unit: qualitative (actionable list)
  value: 'FOUR ITEMS, NONE REQUIRING A NEW COMPOUND, RANKED BY LEVERAGE.
    1. ANASTROZOLE ADHERENCE. R355: closure proceeds above roughly 55-73 pmol/L and stalls below it, and in
    the aromatase-deficiency cases maturation completed within 6-12 months once oestradiol was adequate. At
    3.3-6 pmol/L he is 10-25x below that band. MISSING DOSES IS THE SINGLE FASTEST WAY TO LOSE THE WINDOW,
    and it is a behaviour rather than a prescription.
    2. PROTECT THE NICHE SIGNAL. newton2019: six doses of vismodegib fused a normal juvenile growth plate.
    So the avoid-list is now mechanistically load-bearing rather than precautionary - NO SMO ANTAGONISTS
    (vismodegib, sonidegib, glasdegib), NO ANTI-ANGIOGENICS (axitinib reduced SOC size P=0.0054 and clone
    size P=0.0023), NO RAPALOGS (mTORC1 is the second niche regulator).
    3. WEIGHT THE STACK TOWARD h_term. It is the only term with a human bone-age-sparing velocity gain
    (dauber2026). Within the CNP arm, navepegritide is approved, once weekly, with an open-epiphyses label
    criterion - R329 priced that as a substitution decided on adherence and continuous exposure rather than a
    demonstrated height upgrade, and that assessment is unchanged.
    4. TREAT THE GH DOSE AS A VARIABLE. On hunziker1994s exponent, throughput and yield trade at
    A proportional to D^-0.150, so if DURATION is the binding constraint a lower GH dose gives higher yield
    per stem cell consumed. ⚠ THIS IS A DERIVATION FROM RAT DATA AND HAS NEVER BEEN TESTED AT A DOSE
    ENDPOINT IN ANY SPECIES; it is stated as the variable to measure, not as a recommendation to change.
    ⛔ AND THE UNRESOLVED ONE THAT OUTRANKS ALL FOUR: R294/R362s gate. Hedgehog is REQUIRED to prevent fusion,
    all hedgehog transduction occurs in the primary cilium, and an FGFR inhibitor significantly shortened
    cilia in NORMAL mice. He is on a pan-FGFR inhibitor continuously. Whether erdafitinib is attenuating the
    signal that keeps his plate open has never been measured in any species.'
  species: human
  n: not applicable - actionable synthesis
  source_ref: newton2019
  value_unverified: false
localization:
- The perturbation compartment is the PTHrP-expressing resting-zone stem cell. Orikasa traces those cells
  specifically and follows them out of the growth plate into the diaphyseal marrow space, where they become
  trabecular osteoblasts.
human_evidence: indirect
human_evidence_note: Orikasa is mouse lineage tracing and hunziker1994 is rat. The human anchors are
  dauber2026 for the bone-age-sparing h_term velocity gain, and the report that conserved GH-responsive stem
  cells exist in the human pubertal growth plate - the latter read at commentary level only.
species_basis:
- mouse
- rat
- human
translation_risk: high
translation_risk_reason: 'Orikasa uses a permanent genetic activation of one pathway in one cell type in a
  juvenile mouse, which is a much stronger perturbation than any pharmacological pulse, so the conversion to
  osteoblasts may be specific to constitutive activation rather than a general property of the axis. The
  velocity-duration arithmetic rests on a rat experiment whose species never fuses. And the strongest
  practical items - adherence and the avoid-list - translate far better than the dose derivation, which
  translates least well of anything here.'
confidence: C
claim_grades:
- claim: Sustained cell-autonomous hedgehog activation in resting-zone stem cells expands the clone and then
    converts the descendants into trabecular osteoblasts outside the growth plate.
  grade: B
  basis: orikasa2024, tamoxifen-inducible Pthrp-creER with Ptch1 deletion and tdTomato lineage tracing, with
    both the short-term hyperplasia and the long-term osteoblast fate reported in the same model.
- claim: The reconciling variable between trompet2024 and R311 is duration of signal - a pulse expands,
    sustained activation converts.
  grade: C
  basis: A synthesis across three studies using different perturbations (local transient bead, six systemic
    doses, permanent genetic activation) rather than a single dose-duration experiment. Nobody has titrated
    signal duration against stem-cell fate in one design.
- claim: Total height from a fixed pool depends on amplification and terminal cell height and not on
    throughput, so velocity bought through h_term does not spend duration while velocity bought through
    throughput does.
  grade: C
  basis: Follows algebraically from the identity and from hunziker1994's measured terms, but the
    fixed-pool premise is now known to be too strong because newton2019 shows the postnatal pool
    self-renews. The direction of the argument survives; the magnitudes do not.
- claim: A lower GH dose would give more total height if duration is the binding constraint.
  grade: E
  basis: A derivation from a rat exponent fitted to four points. No dose-response experiment on total height
    exists in any species. Stated as the variable to measure, explicitly not as a recommendation.
