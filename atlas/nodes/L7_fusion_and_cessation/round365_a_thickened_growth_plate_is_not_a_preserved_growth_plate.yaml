contradicts:
- CORRECTS MY OWN FIRST DRAFT OF THIS ROUND, WHICH READ gerber1999 AS A REVERSIBLE CHARGE-AND-DISCHARGE WITH
  PRODUCTION INTACT. The abstract says bone growth was restored on cessation, which means it was impaired
  during treatment. That is a direction, and under R302 a wrong direction is one of the three real
  disqualifiers rather than a gap.
- NARROWS R364. Its factual finding stands, newton2019 does use axitinib to prevent fusion, but its framing
  of this as the first pharmacological anti-fusion agent must carry the gerber1999 direction alongside it.
  Preventing fusion and preserving growth capacity are different things, and this class separates them.
- CONFIRMS AND EXTENDS the_vegf_control_point_is_the_wrong_lever RATHER THAN REOPENING IT. That node closed
  the route on 2026-08-09 with human evidence marked absent. The class sweep supplies the human half and it
  points the same way.
- BOUNDS CORR-350. Regulatory juvenile toxicity reviews are a real and unmined length-endpoint source, but
  only for drugs with a paediatric indication. Adult-only oncology agents have no juvenile study at all.
