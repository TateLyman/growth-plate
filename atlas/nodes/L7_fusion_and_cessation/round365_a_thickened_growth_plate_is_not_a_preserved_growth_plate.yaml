id: round365_a_thickened_growth_plate_is_not_a_preserved_growth_plate
name: Round 365 - the VEGF class thickens the growth plate in five species including one human child, and
  that is the FAILURE phenotype, not the lever. The atlas closed this route on 2026-08-09 on the same paper
  and the closure never reached CLAUDE.md, so I nearly reopened it. Plus the composed kill - proliferation
  continues under blockade while output stops, so depletion runs at full rate for nothing
aliases:
- a thickened growth plate is not a preserved growth plate
- axitinib fusion blocker reconsidered
- the VEGF class effect across six agents
- does blocking vascular invasion stop closure
- CORR-352 the ledger is lossy in both directions
type: hypothesis
layer: L7
stub: false
summary: 'I set out to record a class effect - six VEGF-pathway agents that thicken or persist the growth
  plate across five species, including a human paediatric observation - as support for holding the plate
  open. THE ATLAS HAD ALREADY CLOSED THIS ROUTE ON 2026-08-09, IN the_vegf_control_point_is_the_wrong_lever,
  ON THE SAME PAPER I WAS BUILDING ON, AND I DID NOT GREP FOR IT. The closure is correct and my draft had the
  load-bearing sentence backwards. What survives is the human half of that node argument, which it did not
  have, and one composed argument that kills the route harder than either.

  ⛔⛔ ONE - THE SENTENCE, VERIFIED VERBATIM FROM THE ABSTRACT THIS ROUND, AND IT IS A DIRECTION RATHER THAN A
  GAP. gerber1999 inactivated VEGF with the soluble receptor chimera Flt-(1-3)-IgG in 24-day-old mice. Blood
  vessel invasion was almost completely suppressed. The abstract then states that proliferation,
  differentiation and maturation of chondrocytes were apparently normal and that resorption was inhibited -
  and that cessation of treatment was followed by capillary invasion and RESTORATION OF BONE GROWTH.
  Restoration on withdrawal is only meaningful if growth was impaired while the drug ran. R364 and my own
  first draft of this round both filed this as no length endpoint measured. IT IS NOT A MISSING ENDPOINT. It
  is the primary reporting that bone growth was suppressed and then recovered. Under the R302 rule that is
  disqualifier number two, the direction is wrong, which is one of the three real disqualifiers and not a gap
  to fill.

  ⭐⭐⭐⭐ TWO - AND THE ARGUMENT THAT SETTLES IT COMPOSES TWO FACTS THIS ATLAS ALREADY HELD, NEITHER OF WHICH
  WAS EVER PUT NEXT TO THE OTHER. gerber1999 states that under near-complete VEGF blockade PROLIFERATION IS
  APPARENTLY NORMAL - the chondrocytes keep dividing. marino2008 and the local catch-up literature, carried
  in this atlas growth_plate_senescence node, state that growth-plate senescence is DIVISION-DEPENDENT rather
  than time-dependent - the plate ages by dividing, not by waiting. PUT THEM TOGETHER: VEGF BLOCKADE SPENDS
  THE POOL AT THE NORMAL RATE WHILE PRODUCING NO BONE LENGTH. It is not a pause on the clock. It is the one
  configuration that is strictly worse than doing nothing - the depletion continues and the output stops.
  THAT IS THE PRECISE OPPOSITE OF THE STATED OBJECTIVE, and it is derivable without any new experiment.
  ⭐ THE SLOGAN WORTH KEEPING - A THICKENED GROWTH PLATE IS NOT A PRESERVED GROWTH PLATE. Every radiographic
  and histological sign this class produces, widened and thickened and persistent, is the signature of
  cartilage that is not being cleared, which is this file failure mode number one, and the file has read
  plate height as evidence of benefit before.

  ⭐⭐ THREE - WHAT IS GENUINELY NEW, AND IT CONFIRMS THE CLOSURE RATHER THAN REOPENING IT. The existing node
  records human evidence as ABSENT. It is no longer absent, though it is still only indirect. Six
  agents, from the approved labels and three nonclinical reviews pulled from Drugs@FDA this round: AXITINIB
  thickened growth plates in mice and dogs with a dose-response in the review own tables; PAZOPANIB
  epiphyseal growth plate hypertrophy in rats; SUNITINIB physeal dysplasia in cynomolgus monkeys with open
  growth plates; REGORAFENIB persistent femoral epiphyseal growth plate in dogs, with chondrodystrophy of the
  sternal symphyses, and the reviewer own class generalisation that such alterations are known to occur in
  growing dogs treated with VEGF inhibitors; SORAFENIB irregular thickening in young dogs; BEVACIZUMAB
  physeal dysplasia in juvenile monkeys, dose-related and partially reversible on cessation - the animal echo
  of the gerber1999 withdrawal result. ⭐ AND ONE HUMAN - the RAMUCIRUMAB label records that among sixteen
  paediatric patients one had progressive widening of the distal femoral growth plate. The class reaches a
  human child and produces the Gerber phenotype there.

  ⛔ FOUR - AND THE CORR-350 MOVE WAS RUN AND RETURNED A STRUCTURAL LIMIT ON ITSELF. CORR-350 established
  that regulatory juvenile toxicity reviews record serial limb length and are invisible to PubMed - that is
  how the dabigatran ulna null was found. Run against this class it fails, and the reason is worth recording:
  the axitinib and regorafenib reviews both state that juvenile studies were NOT DONE and NOT REQUIRED. ICH
  S11 juvenile studies attach to a PAEDIATRIC INDICATION. Dabigatran has one, so it has serial ulna lengths
  at five timepoints. Adult-only oncology drugs do not, so the growth-plate findings in this class come from
  ordinary repeat-dose studies in young animals, which record histopathology and never a caliper.
  → CORR-350 IS INDICATION-DEPENDENT AND ITS COVERAGE IS NOT UNIVERSAL. Ask whether the drug has a paediatric
  indication BEFORE expecting a length endpoint from Drugs@FDA.

  ⛔⛔ FIVE - CORR-352, AND IT IS THE MIRROR OF CORR-313. CORR-313 states that this ledger is lossy in one
  direction, that closures write DEAD and SETTLED rows while positives stay in nodes that do not survive
  compaction, so the file drifts pessimistic by selection. THIS ROUND IS THE OTHER DIRECTION. A CORRECT
  CLOSURE - the_vegf_control_point_is_the_wrong_lever, written 2026-08-09, grade C, with gerber1999 as its
  decisive experiment - NEVER REACHED CLAUDE.md EITHER, and four days later I built a round on the same paper
  in the opposite direction and got as far as a written node before greping. The lossiness runs BOTH WAYS.
  Anything that does not reach CLAUDE.md is invisible, and its sign does not matter. THE FIX IS THE ONE
  ALREADY WRITTEN DOWN AND NOT FOLLOWED - grep the graph BEFORE drafting, not before committing.'
quantitative:
- parameter: THE gerber1999 ABSTRACT SENTENCE THAT MAKES THIS A DIRECTION AND NOT A GAP
  value: 'Flt-(1-3)-IgG soluble VEGF receptor chimera, systemic, 24-day-old mice. Blood vessel invasion
    almost completely suppressed, with impaired trabecular bone formation and expansion of the hypertrophic
    chondrocyte zone. Recruitment and differentiation of chondroclasts, and resorption of terminal
    chondrocytes, decreased. THE TWO LOAD-BEARING CLAUSES - proliferation, differentiation and maturation of
    chondrocytes were apparently normal while resorption was inhibited; and cessation of treatment was
    followed by capillary invasion, RESTORATION OF BONE GROWTH, resorption of the hypertrophic cartilage and
    normalisation of growth plate architecture. Growth being RESTORED on withdrawal entails that it was
    IMPAIRED on drug.'
  unit: qualitative with direction
  conditions: gerber1999, abstract retrieved and read verbatim from Europe PMC 2026-08-13 to verify the
    wording rather than inherit the atlas paraphrase.
  species: mouse
  source_ref: gerber1999
  uncertainty: 'The abstract gives no numeric length or velocity, so the MAGNITUDE of the impairment is
    unrecorded and the full text has not been read. What is not uncertain is the SIGN, which is stated. This
    is near-complete blockade by a receptor trap rather than the partial suppression a small molecule gives,
    so it fixes the shape of the failure mode and the ceiling, not the position of any window.'
- parameter: THE COMPOSED KILL - PROLIFERATION CONTINUES WHILE OUTPUT STOPS, AND SENESCENCE IS
    DIVISION-DEPENDENT
  value: 'Premise one, gerber1999, mouse - under near-complete VEGF blockade proliferation, differentiation
    and maturation are apparently normal and only resorption is inhibited. Premise two, marino2008 and the
    local catch-up literature as carried in this atlas growth_plate_senescence node - growth-plate senescence
    is a DIVISION-DEPENDENT decline in proliferation rate, plate height and resting-zone cell density, and is
    explicitly NOT time-dependent and NOT p16 or SASP cellular senescence. CONCLUSION - blocking vascular
    invasion does not stop the clock, because the clock is counted in divisions and the divisions continue.
    The pool is spent at the normal rate and no bone length is produced from it. Anti-angiogenic blockade is
    therefore not a pause but a pure loss, and it is strictly worse for the stated objective than no
    intervention at all.'
  unit: qualitative - composed argument
  conditions: Composed by this atlas 2026-08-13 from two facts it already held separately. Neither paper
    makes this argument.
  species: mouse
  source_ref: gerber1999
  atlas_derived: true
  uncertainty: 'GRADE D AND IT IS AN ARGUMENT, NOT A MEASUREMENT. The weak joint is that apparently normal
    proliferation is a histological impression in a 1999 abstract rather than a measured labelling index, and
    that nobody has counted resting-zone cells during or after VEGF blockade in any species. If proliferation
    were in fact suppressed in proportion to the output block, the argument fails and the blockade becomes a
    genuine pause. THAT IS THE ONE MEASUREMENT THAT WOULD OVERTURN THIS - EdU or label retention in the
    resting zone under chronic VEGF blockade - and it does not exist. Recorded as the discriminating
    experiment rather than assumed away.'
- parameter: THE CLASS EFFECT ACROSS SIX AGENTS AND FIVE SPECIES, FROM LABELS AND NONCLINICAL REVIEWS
  value: 'AXITINIB - thickened growth plates in mice and dogs at doses at or above 15 mg/kg/dose; the
    nonclinical review incidence tables give a dose-response for thickened femoral growth plate of 0, 0, 3,
    0, 9 in males and 0, 0, 1, 2, 9 in females across the ascending dose groups, with tibia 0, 0, 0, 1, 4 and
    0, 0, 0, 0, 4. PAZOPANIB - epiphyseal growth plate hypertrophy, rats. SUNITINIB - physeal dysplasia in
    cynomolgus monkeys with open growth plates dosed three months or longer. REGORAFENIB - increased
    persistent femoral epiphyseal growth plate in dogs versus control, thickened in some animals, with
    chondrodystrophy of the sternal symphyses, and the reviewer states that these alterations are known to
    occur in growing dogs treated with VEGF inhibitors. SORAFENIB - irregular thickening of the growth plate
    in young dogs. BEVACIZUMAB - physeal dysplasia in juvenile cynomolgus monkeys, dose-related and partially
    reversible on cessation. HUMAN - the ramucirumab label records that of sixteen paediatric patients, one
    had progressive widening of the distal femoral growth plate; the ramucirumab and sunitinib labels both
    state that the effect on open tibial growth plates in paediatric patients has not been adequately
    studied.'
  unit: histopathology incidence counts and label text
  conditions: Approved US labels queried through the openFDA label API, and the axitinib, regorafenib and
    cabozantinib nonclinical reviews retrieved from Drugs@FDA, all 2026-08-13. Cabozantinib is the
    within-class exception in its 2012 review.
  species: multiple
  source_ref: fda_vegfr_labels_2026
  uncertainty: 'THIS IS A TOXICOLOGY FINDING READ AS A MECHANISM AND THE DIRECTION MUST NOT BE INVERTED.
    Thickened and widened and persistent all describe cartilage that has not been cleared, which is the
    gerber1999 phenotype, and gerber1999 says bone growth is impaired while that phenotype is present. The
    class effect therefore CONFIRMS the closure rather than reopening it. The human observation is ONE CHILD
    among sixteen in a label safety paragraph, with no height, no velocity and no follow-up, and it is
    recorded as evidence that the phenotype reaches humans, not as an outcome.'
- parameter: NO VEGF-PATHWAY AGENT HAS A BONE-LENGTH ENDPOINT IN ANY SPECIES, AND CORR-350 CANNOT SUPPLY ONE
    HERE
  value: 'Checked this round - no femur, tibia, ulna, limb or body length appears in the axitinib,
    regorafenib or cabozantinib nonclinical reviews, and none is reported in gerber1999 or in any of the six
    labels. The reason is structural rather than accidental. The axitinib and regorafenib reviews both record
    that juvenile studies were NOT DONE and NOT REQUIRED. ICH S11 juvenile toxicity studies, which is where
    serial limb length is recorded, attach to a PAEDIATRIC INDICATION. Dabigatran has one, which is why
    CORR-350 recovered serial left ulna lengths at five timepoints for it. Adult-only oncology agents do not,
    so their skeletal findings come from ordinary repeat-dose studies in young animals that record
    histopathology and never a caliper.'
  unit: presence or absence of a length parameter
  conditions: Full-text grep of three Drugs@FDA nonclinical reviews plus six openFDA label records,
    2026-08-13.
  species: not_applicable
  source_ref: fda_vegfr_labels_2026
  atlas_derived: true
  uncertainty: 'The grep covered three reviews of the six agents. The bevacizumab, sunitinib, pazopanib and
    ramucirumab nonclinical reviews were NOT retrieved, and bevacizumab and sunitinib have paediatric
    exposure, so a juvenile study MAY exist for one of them. Under R302 that is a gap. It does not change the
    verdict, because the verdict rests on the gerber1999 direction and the division-dependent argument rather
    than on an absence.'
- parameter: THE ADJACENT HUMAN CAUTION THAT IS NOT THIS CLASS AND MUST NOT BE MERGED WITH IT
  value: '13 children with chronic myeloid leukaemia on imatinib followed to skeletal maturity, median 14.3
    years - height Z fell from -0.6 to -1.1, p=0.04. Split by timing, the decline was significant only when
    imatinib was started BEFORE the pubertal growth spurt, -0.5 to -1.3 at p=0.03, while initiation after the
    spurt gave p=0.60 and no decline.'
  unit: height standard deviation score
  conditions: sadanand2026, human paediatric cohort, retrospective. Already held in this atlas since
    2026-08-05 in tyrosine_kinase_inhibitor_growth_toxicity.
  species: human
  source_ref: sadanand2026
  uncertainty: 'IMATINIB IS NOT A VEGFR AGENT - its relevant targets are ABL, KIT and PDGFR - so this is NOT
    evidence about the VEGF class, and is recorded here only because it is the nearest human paediatric
    kinase-inhibitor growth dataset and because its STAGE split reproduces the discriminator R364 found
    independently in the hedgehog and axitinib literature. n=13, retrospective, uncontrolled. Its stage
    result favours this subject, who is post-spurt, but that is a statement about imatinib.'
localization:
- the chondro-osseous junction, where capillary invasion, chondroclast recruitment and terminal chondrocyte
  resorption convert cartilage to bone
- the resting zone, which is where the division-dependent depletion argument applies and where nobody has
  counted cells under VEGF blockade in any species
human_evidence: indirect
human_evidence_note: 'INDIRECT, but upgraded from ABSENT, which is what the 2026-08-09 node recorded. The ramucirumab label
  records progressive widening of the distal femoral growth plate in one of sixteen paediatric patients, and
  two labels state the effect on open tibial growth plates in paediatric patients has not been adequately
  studied. This is a label safety observation in one child with no height or velocity attached. It
  establishes that the phenotype occurs in humans; it establishes nothing about height, and the phenotype it
  establishes is the one gerber1999 shows accompanies impaired bone growth.'
species_basis:
- mouse
