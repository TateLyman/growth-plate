translation_risk: moderate
translation_risk_reason: 'The node closes a route rather than proposing one, so the risk is closing it
  wrongly. The direction rests on a 1999 mouse abstract clause and on a composed argument whose weak joint,
  whether proliferation really continues at normal rate under chronic blockade, has never been measured. The
  class toxicology is cross-species and consistent, which lowers the risk on the phenotype itself.'
confidence: C
claim_grades:
- claim: A VEGF-pathway inhibitor could be used to hold the growth plate open and delay closure.
  grade: X
  basis: 'NO, AND FOR A STATED MECHANISM RATHER THAN A MISSING ENDPOINT. gerber1999 reports that bone growth
    was RESTORED on cessation, which entails it was impaired on drug, and that proliferation continued
    normally while only resorption was blocked. Since growth-plate senescence is DIVISION-dependent, the pool
    is spent at the normal rate while no bone is produced. The plate persists as uncleared cartilage. This is
    charge without discharge, the file first and most frequent failure mode, in its purest form.'
- claim: A thickened or widened growth plate on a VEGF inhibitor is evidence the plate has been preserved.
  grade: X
  basis: 'NO. It is the signature of cartilage that is not being resorbed. gerber1999 produces exactly that
    histology while impairing trabecular bone formation, and the standing atlas decision already forbids
    reading zone thickness as growth. The class toxicology - thickened, hypertrophied, persistent, dysplastic
    - is the failure phenotype recorded across five species by regulators who were looking for harm.'
- claim: The VEGF class effect on the growth plate reaches humans.
  grade: D
  basis: 'YES, as a phenotype. The ramucirumab label records progressive widening of the distal femoral
    growth plate in one of sixteen paediatric patients. Grade D because it is a single child in a label
    safety paragraph with no height, velocity or follow-up. Two labels separately state that the effect on
    open tibial growth plates in paediatric patients has not been adequately studied.'
- claim: CORR-350 can supply a bone-length endpoint for any drug through Drugs@FDA.
  grade: X
  basis: 'NO - it is INDICATION-DEPENDENT. Juvenile toxicity studies, where serial limb length is recorded,
    attach to a paediatric indication. The axitinib and regorafenib reviews both state that juvenile studies
    were not done and not required. Ask whether the drug has a paediatric indication before expecting a
    length endpoint from this source.'
- claim: R364 was right that axitinib is used to prevent growth-plate fusion in normal mice.
  grade: B
  basis: 'THE FACT IS CORRECT AND THE INFERENCE FROM IT IS NOT. newton2019 does use axitinib exactly that
    way, and R364 recorded the charge-without-discharge objection itself. What R364 and my own first draft of
    this round both got wrong is treating gerber1999 as silent on growth. It is not silent; it reports
    impairment and recovery. Preventing fusion is not the same as preserving the capacity to grow, and this
    class separates the two.'
- claim: Imatinib data bear on the VEGF class.
  grade: X
  basis: 'NO. Imatinib acts on ABL, KIT and PDGFR, not VEGFR. sadanand2026 is recorded here only as the
    nearest human paediatric kinase-inhibitor growth dataset, and because its pre- versus post-spurt split
    reproduces the STAGE discriminator found independently in R364.'
