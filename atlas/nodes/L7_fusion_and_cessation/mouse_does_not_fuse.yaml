human_evidence: absent
human_evidence_note: >-
  This node is a statement about mice. The human side of the contrast rests on human histology
  showing complete cartilage-to-bone replacement (haines1975) and on direct assertion within a
  human growth plate study (chu2026); no study has processed human and mouse fusing plates in
  the same assay.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: >-
  Reverse-direction risk: this node is what makes every murine node in the atlas high-risk.
  Because the mouse cannot express the endpoint, murine mechanism data can only be transferred
  to humans by assuming that the sub-fusion processes mice do show (plate thinning, bridging,
  senescent decline) are the processes that terminate the human plate. That assumption is untested.
