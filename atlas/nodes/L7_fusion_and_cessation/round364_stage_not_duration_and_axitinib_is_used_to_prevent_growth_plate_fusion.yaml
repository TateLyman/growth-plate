contradicts:
- CORRECTS R363. Duration is not the best discriminator between orikasa2024 and trompet2024 - STAGE relative
  to secondary ossification centre formation is, and it favours this subject rather than warning against him.
- REVERSES MY OWN R362 CONTRAINDICATION ON ANTI-ANGIOGENICS, WITH THE SAME STAGE VARIABLE. Axitinib during
  SOC maturation damages the niche; axitinib given to an established plate is used as a fusion blocker. Both
  readings are correct and the subject is in the second window.
- DOES NOT RESCUE ANTI-ANGIOGENICS AS A LEVER. Blocking resorption at the chondro-osseous junction is
  charge without discharge, the file's first and most frequent failure mode, and it has never once failed to
  apply. No length endpoint exists under axitinib in any species.
- SHARPENS THE GH QUESTION FROM DOSE-UNKNOWN TO MECHANISM-KNOWN. GH lowers the fraction of self-renewing
  divisions in GH-sufficient animals, which is depletion in the precise sense asked about, and the authors
  identify it as the basis of the diminishing long-term efficacy of GH therapy.
