id: round364_stage_not_duration_and_axitinib_is_used_to_prevent_growth_plate_fusion
name: Round 364 - the five Ono-lab papers read properly. STAGE not duration is the hedgehog discriminator and
  it favours this subject; AXITINIB IS USED ROUTINELY TO PREVENT GROWTH PLATE FUSION IN NORMAL MICE, which
  reverses my own contraindication; and GH lowers the self-renewal fraction, which is the mechanism of its
  own tachyphylaxis
aliases:
- stage not duration
- axitinib prevents growth plate fusion
- the charge and discharge pair
- GH lowers the self-renewal fraction
- what actually stops depletion
type: hypothesis
layer: L7
stub: false
summary: 'The operator supplied five Ono-lab papers and told me to read them rather than ask for more. Doing
  so corrects TWO of my own rounds from the last two days and produces the first pharmacological anti-fusion
  agent in this file. ⭐⭐ ONE - STAGE, NOT DURATION, IS THE HEDGEHOG DISCRIMINATOR, AND IT FAVOURS THIS
  SUBJECT. R363 concluded that a hedgehog PULSE expands while SUSTAINED activation converts the stem cells to
  bone. Checked against the primaries that is at best incomplete. orikasa2024 induced with tamoxifen AT P6 -
  the paper names its cells PTHrP-CE-P6 throughout - which is at or before secondary ossification centre
  formation; trompet2024 dosed at P28, P30 and P32, well after. cheng2025 states the rule directly: BEFORE
  SOC formation BOTH the antagonist LDE225 AND the agonist SAG reduce PTHrP+ stem cells and their progeny -
  both directions harmful; AFTER SOC formation the roles separate, with vismodegib causing premature fusion
  around P35 and SAG promoting resting-zone proliferation. A SUBJECT AT BONE AGE 16 IS AS FAR POST-SOC AS IT
  IS POSSIBLE TO BE. ⭐⭐⭐⭐ TWO - AND THE FINDING OF THE ROUND, WHICH REVERSES MY OWN CONTRAINDICATION FROM
  R362: NEWTON2019 USES AXITINIB ROUTINELY AND EXPLICITLY TO PREVENT GROWTH PLATE FUSION IN NORMAL MICE.
  Methods, verbatim in substance: with the Col2-creERT:Tsc1 Confetti model, vismodegib was given P40-P44 and
  "during this same experiment, single daily doses of AXITINIB were administered on P41-P44 TO PREVENT FUSION
  OF THE GROWTH PLATE"; and separately, axitinib 25 mg/kg once daily is used "to reduce the resorption of
  terminal hypertrophic chondrocytes". So the same molecule that damages the niche when given DURING SOC
  maturation (R362: SOC size P=0.0054, clone size P=0.0023, dosed P18-P27) is used as a FUSION BLOCKER in an
  ESTABLISHED plate. AXITINIB IS APPROVED. This is the first agent in this file shown to prevent growth-plate
  fusion pharmacologically in a normal animal, and it targets R355 program C - the terminal vascular event -
  which nothing in the stack touches. ⛔ AND THE OBJECTION IS THIS FILE OWN FAILURE MODE NUMBER ONE: blocking
  resorption at the chondro-osseous junction is CHARGE WITHOUT DISCHARGE. The plate persists because the
  cartilage is not being replaced by bone - and no length endpoint was measured under axitinib in that paper
  or any other. A plate that survives without discharging does not lengthen a bone. ⭐⭐ THREE - THE
  CHARGE-AND-DISCHARGE PAIR SITS INSIDE ONE PAPER AND NOBODY HAS MEASURED A BONE AFTER IT. Tsc1 ablation
  CHARGES: PAR3 distributed symmetrically in a larger proportion of stem-cell dyads, and the number and
  thickness of multi-columnar clones increased with time from P3 to P90. Vismodegib DISCHARGES: eight doses
  twice daily forced those clusters to differentiate directly into columnar cells, with CD73+ cells detaching
  from the niche and entering the columnar layer WITHOUT starting to proliferate. Charge with mTORC1,
  discharge with hedgehog inhibition, and hold the plate open with axitinib - all three agents in one
  experiment, and NO BONE LENGTH MEASURED AFTER ANY OF IT. ⛔⛔ FOUR - AND THE DIRECT ANSWER ON THE ARM THE
  OPERATOR WANTS TO KEEP FOREVER. chu2025, in NON-GH-DEFICIENT mice: pharmacological GH REDUCES the pool of
  slow-cycling label-retaining stem cells BY PROMOTING COMMITTED RATHER THAN SELF-RENEWING DIVISION. Renewal
  is by POPULATION ASYMMETRY, so the controllable variable is the FRACTION of divisions that are
  self-renewing, and GH lowers it. The authors name the consequence themselves - it may underpin both the
  therapeutic action AND THE DIMINISHING LONG-TERM EFFICACY of GH. THAT IS THE MECHANISM OF GH TACHYPHYLAXIS
  AND IT IS DEPLETION IN THE PRECISE SENSE THE OPERATOR ASKED ABOUT.'
quantitative:
- parameter: STAGE NOT DURATION - THE HEDGEHOG DISCRIMINATOR, VERIFIED AGAINST BOTH PRIMARIES
  unit: postnatal day of induction relative to secondary ossification centre formation
  value: 'orikasa2024 INDUCED AT P6. The paper names its traced populations PTHrP-CE-P6 and PTHrP-CE-dSmo-P6
    throughout, and states mice were "pulsed at P6 with tamoxifen and analyzed at P28". P6 is at or before
    SOC formation in the mouse distal femur.
    trompet2024 DOSED AT P28, P30 and P32 intra-articularly, and implanted beads in 30-day-old rats - well
    after SOC formation.
    cheng2025 states the rule: BEFORE SOC formation, BOTH the antagonist LDE225 AND the agonist SAG
    significantly REDUCED PTHrP-expressing stem cells and their progeny - both directions harmful. AFTER SOC
    formation the roles change - vismodegib reduced clonal expansion and caused PREMATURE GROWTH PLATE FUSION
    around P35, while SAG PROMOTED PROLIFERATION of resting-zone chondrocytes.
    ⭐ SO THE TWO RESULTS THIS FILE COULD NOT RECONCILE SIT ON OPPOSITE SIDES OF THE SOC BOUNDARY, AND THE
    FAVOURABLE SIDE IS THE ONE THIS SUBJECT IS ON. A subject at bone age 16 is as far post-SOC as it is
    possible to be.
    ⛔ THIS CORRECTS R363, WHICH PROPOSED DURATION AS THE DISCRIMINATOR. Duration remains one candidate -
    the manipulations also differ in kind, orikasa2024 causing LOSS OF QUIESCENCE and concentric masses that
    obliterate the resting-proliferative boundary while trompet2024 gave a clean pool doubling with
    proliferation and terminal cell size explicitly unchanged - but STAGE is the better-supported variable
    and it is the one with a directional consequence for this case.'
  species: mouse
  n: two primaries plus a review stating the rule
  source_ref: orikasa2024
  value_unverified: false
- parameter: AXITINIB IS USED ROUTINELY AND EXPLICITLY TO PREVENT GROWTH PLATE FUSION IN NORMAL MICE
  unit: mg/kg/day
  value: 'newton2019 Methods, read directly. "Vismodegib ... was injected intraperitoneally twice daily. With
    the Col2-creERT:Tsc1 Confetti model, vismodegib (or the DMSO vehicle) was injected as follows: once on
    P40, twice daily on P41-P43 and once on P44; DURING THIS SAME EXPERIMENT, SINGLE DAILY DOSES OF AXITINIB
    WERE ADMINISTERED ON P41-P44 TO PREVENT FUSION OF THE GROWTH PLATE."
    And separately: "To REDUCE THE RESORPTION OF TERMINAL HYPERTROPHIC CHONDROCYTES and to block SOC
    development, mice were injected intraperitoneally with AXITINIB (25 mg per kg body weight, an inhibitor
    of VEGFR) once daily."
    ⭐⭐ AXITINIB IS AN APPROVED DRUG (Inlyta, VEGFR inhibitor). THIS IS THE FIRST AGENT IN THIS FILE SHOWN TO
    PREVENT GROWTH-PLATE FUSION PHARMACOLOGICALLY IN A NORMAL ANIMAL, and it acts on R355 program C - the
    terminal vascular event - which nothing in the stack touches.
    ⛔ AND IT REVERSES MY OWN R362 ENTRY, WHICH LISTED ANTI-ANGIOGENICS AS A CONTRAINDICATION. Both readings
    are correct and the variable is STAGE, exactly as for hedgehog: axitinib given P18-P27, DURING SOC
    maturation, reduced SOC size (P=0.0054) and clone size (P=0.0023) because the SOC is the niche organiser;
    axitinib given P41-P44, to an ESTABLISHED plate, is used as a fusion blocker. The subject has a fully
    formed SOC and is therefore in the second window, not the first.'
  species: mouse
  n: 25 mg/kg once daily, P41-P44
  source_ref: newton2019
  value_unverified: false
- parameter: THE OBJECTION TO AXITINIB IS THIS FILE'S OWN FAILURE MODE NUMBER ONE
  unit: qualitative (charge without discharge)
  value: 'Bone lengthens by producing cartilage at the top of the plate AND resorbing it at the
    chondro-osseous junction, where the metaphyseal vasculature invades. Axitinib works by REDUCING THE
    RESORPTION OF TERMINAL HYPERTROPHIC CHONDROCYTES - it blocks the discharge step.
    ⛔ THAT IS CORR-189 EXACTLY, THE FILE''S FIRST AND MOST FREQUENT FAILURE MODE: A TALLER PLATE IS NOT A
    LONGER BONE. The plate persists precisely because the cartilage is not being converted into bone, and a
    plate that survives without discharging does not lengthen anything.
    ⛔ AND NO LENGTH ENDPOINT WAS MEASURED UNDER AXITINIB - not in newton2019, where it is used purely as an
    experimental tool to keep the plate open long enough to run another experiment, and not anywhere else
    this file has found.
    ⚠ It is also the same trap that killed RANKL blockade in R317 (osteoclastic resorption is REQUIRED at the
    junction; denosumab gives retained cartilage and abnormal growth plates) and aggrecanase inhibition in
    R337. This is the third member of that class and the objection has never once failed to apply.
    ⭐ WHAT WOULD SEPARATE IT FROM THE TRAP: axitinib preserving a plate that CONTINUES TO ELONGATE THE BONE
    rather than merely persisting. That is a caliper on a femur under chronic low-dose VEGFR inhibition in a
    normal growing animal, and it has never been done.'
  species: mouse
  n: not applicable - mechanism
  source_ref: newton2019
  value_unverified: false
- parameter: THE CHARGE-AND-DISCHARGE PAIR INSIDE ONE PAPER, WITH ALL THREE AGENTS AND NO BONE MEASURED
  unit: qualitative with dosing
  value: 'newton2019, Col2-creERT:R26R-Confetti:Tsc1 model, tamoxifen at P3.
    CHARGE - Tsc1 ablation activates mTORC1: PAR3 was distributed SYMMETRICALLY in a larger proportion of
    stem-cell clonal dyads, and THE NUMBER AND THICKNESS OF MULTI-COLUMNAR CLONES INCREASED WITH TIME FROM P3
    TO P90, indicating accelerated expansion of colony-forming cells. Earlier in the same paper, mTORC1
    activation raised EdU-positive epiphyseal stem cells from 24.7 +/- 3.7 to 62.4 +/- 7.5 per section
    (P=0.014) while DISORGANIZING the resting zone.
    DISCHARGE - vismodegib, eight doses twice daily P40-P44: FORCED those clusters TO DIFFERENTIATE DIRECTLY
    INTO COLUMNAR CELLS and form multi-columnar clones, with some CD73-POSITIVE CELLS DETACHING FROM THE
    NICHE AND ENTERING THE COLUMNAR LAYER WITHOUT STARTING TO PROLIFERATE. Authors read this as hedgehog
    regulating stem-cell RENEWAL but not IDENTITY.
    HOLD - axitinib daily P41-P44 to prevent fusion during the discharge step.
    ⭐ THREE AGENTS, ONE EXPERIMENT, A COHERENT PROTOCOL - EXPAND THE POOL, THEN FORCE IT INTO COLUMNS, WHILE
    PREVENTING THE PLATE FROM FUSING - AND NO BONE LENGTH WAS MEASURED AFTER ANY OF IT. That is the whole
    experiment this axis needs and it has never been run.
    ⛔ AND THE SAME PAPER BOUNDS THE DISCHARGE AGENT: extending vismodegib caused the growth plate to FUSE.
    The window between forcing differentiation and forcing fusion has never been mapped in any species.
    ⚠ mTORC1 activation is not obtainable pharmacologically in the wanted direction - rapalogs INHIBIT it -
    so the charge step currently has no agent.'
  species: mouse
  n: 3-4 mice per group
  source_ref: newton2019
  value_unverified: false
- parameter: GH LOWERS THE SELF-RENEWAL FRACTION, WHICH IS DEPLETION IN THE EXACT SENSE ASKED ABOUT
  unit: qualitative (division fate)
  value: 'chu2025, in NON-GH-DEFICIENT mice: GH REDUCES THE POOL OF SLOW-CYCLING LABEL-RETAINING STEM CELLS
    BY PROMOTING COMMITTED RATHER THAN SELF-RENEWING DIVISION, expanding transit-amplifying progenitors and
    raising proliferation throughout the plate WHILE SPENDING THE ROOT POPULATION THAT GENERATES IT. Deleting
    the GH receptor in stem cells impairs their ability to make chondrocytes, so the action is DIRECT, and
    JAK2/STAT5 activation is spatially restricted to the RESTING ZONE.
    ⭐ THE AUTHORS NAME THE CONSEQUENCE THEMSELVES: it may underpin both the therapeutic action AND THE
    DIMINISHING LONG-TERM EFFICACY OF GH. THAT IS THE MECHANISM OF GH TACHYPHYLAXIS.
    ⭐ AND IT IS THE RIGHT VARIABLE: renewal is by POPULATION ASYMMETRY (chu2025, clonal and lineage tracing),
    not by an obligate one-stem-one-committed switch, so the controllable quantity is THE FRACTION OF
    DIVISIONS THAT ARE SELF-RENEWING. "Replacement greater than or equal to loss" is exactly the statement
    that this fraction is at or above one half. GH moves it the wrong way.
    ⚠ THE COUNTERWEIGHT, CARRIED: the direction is DOSE AND CONTEXT DEPENDENT. PHYSIOLOGICAL GH in
    HYPOPHYSECTOMISED rats did the OPPOSITE, increasing slowly-dividing resting-zone cells, and GHR deletion
    impairs chondrocyte generation - so GH is REQUIRED for normal stem-cell output. The depletion result is
    PHARMACOLOGICAL dosing in GH-SUFFICIENT mice, which is this subject''s configuration.
    ⚠ And chu2026 reports GH acting directly on human growth-plate explants, stimulating proliferation of
    both cartilage stem cells and proliferative-zone chondrocytes. Stimulating proliferation and depleting
    the pool are not contradictory under population asymmetry - the pool can cycle faster and still shrink if
    the renewing fraction falls.'
  species: mouse
  n: non-GH-deficient mice
  source_ref: chu2025
  value_unverified: false
- parameter: THE SECOND ROUTE OUT OF THE LINEAGE, AND WHY PLUGGING IT IS NOT WORTH MUCH
  unit: qualitative (fate mapping)
  value: 'mizuhashi2019: at the PERIPHERY of the growth plate immediately adjacent to the perichondrium sit
    BORDERLINE chondrocytes, aligned PERPENDICULARLY to the other chondrocytes, and in vivo they behave as
    TRANSIENT MESENCHYMAL PRECURSOR CELLS for osteoblasts and marrow stromal cells. ono2014 is the same
    lineage from the other end - Col2-expressing cells and their descendants contribute to perichondrial
    cells, osteoblasts and marrow stromal cells.
    ⛔ SO THERE ARE AT LEAST THREE ROUTES BY WHICH CELLS LEAVE THE CARTILAGE LINEAGE: hypertrophic
    transdifferentiation at the junction, borderline chondrocytes at the periphery, and PTHrP+ resting cells
    under sustained hedgehog activation (orikasa2024).
    ⚠ BUT THE STANDING LEAK IS SMALL AND THAT IS WHAT CLOSES IT AS A LEVER. orikasa2024 states the baseline
    directly: descendants of PTHrP+ resting chondrocytes normally contribute to only a SMALL NUMBER of
    osteoblasts and CAR cells in the adult bone marrow. The osteoblast conversion is something hedgehog
    activation CREATES, not a large standing loss it reveals. There is little to recover by plugging a leak
    that is not normally leaking.
    ⚠ And removing hedgehog from those cells does NOT shorten bone - Smo conditional knockout in PTHrP+ cells
    significantly reduced their column contribution while BONE LENGTH AND GROWTH PLATE STRUCTURE WERE
    UNCHANGED, because other cells compensate. A pool whose contribution can be cut without costing length is
    not a pool whose leak is worth plugging.'
  species: mouse
  n: lineage tracing
  source_ref: mizuhashi2019
  value_unverified: false
localization:
- The relevant compartments are the resting zone immediately beneath the secondary ossification centre (the
  hedgehog-responsive niche), the chondro-osseous junction (where the metaphyseal vasculature invades and
  where axitinib acts), and the growth-plate periphery adjacent to the perichondrium (mizuhashi2019's
  borderline chondrocytes).
human_evidence: absent
human_evidence_note: Every result in this round is mouse or rat. There is no human evidence that a VEGFR
  inhibitor delays physeal fusion, no human hedgehog agonist experience of any kind, and no human measurement
  of the self-renewal fraction. The human anchors elsewhere in the file - HHIP pLoF +9.92 cm, and the
  recognised paediatric fusion concern for hedgehog inhibitors - bear on direction only.
species_basis:
- mouse
- rat
translation_risk: high
translation_risk_reason: 'The anti-fusion use of axitinib is an experimental tool used for four days to keep
  a mouse plate open long enough to run a different experiment, at 25 mg/kg, with no length endpoint and no
  intention of therapy. Mice do not fuse their plates the way humans do, which is the standing objection to
  every rodent result about closure. And the charge step of the charge-discharge pair is a genetic
  manipulation with no pharmacological equivalent in the wanted direction.'
confidence: C
claim_grades:
- claim: Stage relative to secondary ossification centre formation, not duration of signal, is the
    discriminator between the favourable and unfavourable hedgehog results.
  grade: B
  basis: Verified in both primaries - orikasa2024 induced at P6 and names its populations PTHrP-CE-P6
    throughout, trompet2024 dosed at P28-P32 - with cheng2025 stating the stage rule explicitly in both
    directions. Graded B not A because the two manipulations also differ in kind, not only in stage.
- claim: Axitinib is used to prevent growth plate fusion in normal mice.
  grade: A
  basis: Stated in newton2019's Methods as the explicit purpose of the dosing schedule, with a second passage
    describing its use to reduce resorption of terminal hypertrophic chondrocytes.
- claim: Blocking vascular invasion is charge without discharge and will not lengthen a bone.
  grade: C
  basis: Mechanistically the same trap that killed RANKL blockade and aggrecanase inhibition in this file,
    and no length endpoint exists under axitinib in any species. Graded C rather than higher because it is a
    prediction from a mechanism, and a plate held open for longer could in principle still elongate if
    production continues and resorption is only partially reduced.
- claim: Pharmacological GH lowers the self-renewal fraction and this is the mechanism of its own
    diminishing long-term efficacy.
  grade: B
  basis: chu2025 in non-GH-deficient mice with clonal and lineage tracing, direct GHR deletion showing the
    action is cell-autonomous, and the authors themselves naming diminishing long-term efficacy as the
    consequence. Opposed by the physiological-dose result in hypophysectomised animals, which is a different
    configuration from this subject's.
