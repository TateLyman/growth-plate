id: the_duration_term_broken_down
name: THE DURATION TERM BROKEN DOWN - duration is not a lever, it is five, four of them are not oestrogen,
  and the operative quantity across all of them is bone-age cost per centimetre, which has never been
  tabulated
aliases:
- can we do anything for duration
- what is left for duration
- duration sub-levers
- bone age cost per centimetre
- yield per progenitor
- does the stack spend the pool
- round 172
type: hypothesis
layer: L7
stub: false
summary: 'THE INSTRUCTION WAS TO STOP ASSUMING THERE IS NOTHING TO DO FOR DURATION AND BREAK IT ALL DOWN.
  DOING THAT EXPOSES THAT ROUNDS 169-171 AUDITED ONE SUB-LEVER OUT OF FIVE AND CALLED IT THE ARM.

  THE REFRAME COMES FROM THIS ATLAS OWN KEYSTONE, WHICH I DID NOT APPLY. fusion_is_proliferative_exhaustion
  (grade B, from weise2001 read in full) says fusion is NOT something oestrogen does to a plate - it is
  what happens to a plate that has RUN OUT, and oestrogen is a RATE MULTIPLIER on a programme already
  running. Senescence is spontaneous in vehicle-treated animals. So DURATION IS NOT "TIME UNTIL OESTROGEN
  CLOSES THE PLATE". It is TIME UNTIL PROLIFERATIVE EXHAUSTION, and oestrogen is one term in the rate.
  Auditing SERDs, sulfatase and aromatase for three rounds was auditing the multiplier and calling it the
  clock.

  THE FIVE SUB-LEVERS, WITH HONEST STATUS.

  ONE - SLOW THE MULTIPLIER. In the stack (anastrozole). Closed exhaustively rounds 169-171 and the
  closure holds: the receptor class fails on an AF-2 mechanism, the sulfatase route fails on a human
  knockout with no skeletal phenotype, and depth of blockade is unrewarding. It works only alongside a
  velocity agent that preserves the pubertal spurt (CORR-182), and the prize is bounded at single-digit
  centimetres.

  TWO - RAISE THE YIELD. THIS IS THE ONE THE ATLAS FLAGGED AS NEVER ATTEMPTED AND I WALKED PAST IT THREE
  TIMES. the_exchange_rate_between_growth_and_pool_depletion, grade B: HEIGHT IS POOL SIZE TIMES YIELD PER
  CELL SPENT, and NOTHING HAS EVER TARGETED THE YIELD. It is not a hypothetical quantity - lui2018 per-
  animal data give the METACARPAL, which fuses at 2-3 weeks, 14 micrometres of bone per resting zone cell
  spent (95% CI 12-18) against the FEMUR at 146 (110-208), a TENFOLD SEPARATION WITH NON-OVERLAPPING
  INTERVALS INSIDE ONE ANIMAL. And it is movable in principle by two hormones in opposite directions:
  schrier2006 measured oestrogen LOWERING resting-zone proliferation (P=0.011) with NO change in cell
  number, while dexamethasone lowered proliferation (P<0.001) and RAISED cell number (P=0.016) because it
  additionally blocks differentiation OUT of the pool. Same direction on the observable, opposite
  direction on senescence. The residual is the yield.

  THREE - ADD PROGENITORS. trompet2024 is the only pool intervention in this atlas with a LENGTH endpoint
  and the only arm that ADDS a progenitor rather than redistributing a fixed budget. Intra-articular
  Smoothened agonist raised resting-zone Pthrp-tdTomato+ cells from 65.5 to 139.8 per mm2 (P=0.017) with
  proliferation and terminal hypertrophic cell size UNCHANGED - a clean pool expansion. SAG beads in the
  distal femoral secondary ossification centre of one rat leg gave femur +0.817 mm (+2.75%) at 1 month,
  P=0.017, rising to +1.263 mm (+3.63%) at 6 months, P=0.00004, 8 of 8 animals. THE EFFECT GREW RATHER
  THAN WASHING OUT. Two things keep this honest and both are already recorded: SHORT SYSTEMIC SAG DID
  NOTHING to bone length, so this is a LOCAL-DELIVERY lever and not an oral one; and the bead moved pool,
  h_term and growth rate together, so the length gain cannot be attributed to pool expansion alone.

  FOUR - STOP SPENDING THE POOL, AND THE UNCOMFORTABLE PART IS THAT THE STACK MAY BE SPENDING IT. chu2025
  (PNAS, full text read by this atlas 2026-08-07) shows GH shifts growth-plate stem cell divisions toward
  the COMMITTED side and DEPLETES the slow-cycling pool, cell-autonomously via GHR, and the authors offer
  it as an explanation for the declining long-term efficacy of GH therapy. THEIR OWN CLINICAL PROPOSAL IS
  NOT AVOIDANCE BUT SCHEDULE - they warrant exploration of INTERMITTENT GH, especially in non-GH-deficient
  children. TWO COUNTERWEIGHTS THE ATLAS ALREADY RECORDED AND WHICH MUST TRAVEL WITH THIS: the dose was 5
  mg/kg/day, roughly ONE HUNDRED TIMES a human therapeutic dose and called pharmacological by the authors;
  and THE GHR CONDITIONAL KNOCKOUT DID NOT CHANGE BONE LENGTH (tibia P=0.31, femur P=0.35), so the pool
  phenotype has no demonstrated organ-level consequence in the animals carrying it. The human component is
  ONE 14-year-old epiphysiodesis specimen showing PTHrP+ cells are PRESENT in the adolescent human resting
  zone - presence, not GH-responsiveness, and orikasa2026 describing them as "GH-responsive" in humans
  overstates its own primary source.

  FIVE - CYCLE THE POOL. g_l2_cycling_the_progenitor_pool, tractability 5, the highest in the atlas: a
  charge phase in which differentiation is blocked and progenitors accumulate, then a discharge phase.
  forcinito2011 gives the physiological precedent - senescence is GROWTH-dependent, not time-dependent,
  and four weeks of tryptophan restriction bought about two weeks of senescence delay. The decisive
  experiment needs no drug, only matched-intake feeding cycles and final bone length.

  THE SYNTHESIS, AND IT IS THE ACTUAL ANSWER TO THE QUESTION. DURATION AND VELOCITY ARE NOT INDEPENDENT
  TERMS. Every velocity agent has a BONE-AGE COST PER CENTIMETRE, and that is the quantity the height
  problem actually turns on at bone age 16. The numbers exist agent by agent and NOBODY HAS PUT THEM ON
  ONE AXIS:
  CNP/vosoritide - dauber2026, annualised growth velocity 4.53 to 8.09 cm/yr, +4.0 SD (95% CI 3.08-4.91),
  in NON-FGFR3 children, and this atlas records the bone-age-to-chronological-age ratio as unmoved.
  ANASTROZOLE ON TOP OF GH - mauras2008, bone age +2.5 versus +4.1 years at 3 years, P<0.0001, with LINEAR
  GROWTH COMPARABLE between arms: the aromatase inhibitor does not add velocity, it LOWERS THE BONE-AGE
  COST OF THE VELOCITY THE GH IS ALREADY BUYING.
  GH - chu2025 supplies a mechanism by which its cost is paid in progenitors rather than in bone age, which
  is a DIFFERENT currency and is not captured by a bone-age ratio at all.
  FGFR INHIBITION - horike2026 shows excess FGFR3 disrupts resting-zone turnover and stem-cell-like
  behaviour via CREB, with a CREB inhibitor restoring bone length in the achondroplasia mouse. In a
  WILD-TYPE subject, pushing FGFR3 tone BELOW normal is off the bottom of that curve and the direction is
  genuinely unknown.

  VERDICT: THERE IS SOMETHING TO DO FOR DURATION AND IT IS NOT A NEW ANTI-OESTROGEN. Three routes are open
  and none of them is the oestrogen axis: the yield (never attempted, quantity now estimated), the pool
  (one compound, one length endpoint, local delivery only), and the schedule of the agents already in the
  stack. The single highest-value analysis is the bone-age-cost-per-centimetre table, which requires no
  experiment and no new compound - only reading bone-age data that four trials already collected.'
quantitative:
- parameter: yield - micrometres of bone elongation per resting zone chondrocyte spent, per 500 micrometre
    plate width, same animals same interval
  value: metacarpal 14, femur 146
  unit: micrometres per resting zone cell
  conditions: mouse, 2-3 week interval; metacarpal fuses at 2-3 weeks, femur never fuses; 95% CI 12-18 and
    110-208, non-overlapping. THIS ATLAS'S ARITHMETIC on the lui2018 open supplementary workbook, not a
    measurement, and an UPPER BOUND because a falling standing stock understates gross consumption
  species: mouse
  source_ref: lui2018
  uncertainty: value_unverified - re-analysis of published per-animal data, graded as such
- parameter: resting zone Pthrp-tdTomato+ cells after intra-articular Smoothened agonist
  value: 65.5 -> 139.8
  unit: cells per mm2
  conditions: rat/mouse, SAG at P28, P30, P32 analysed P37; all increase within the resting zone, with NO
    change in proliferation in the top 50 micrometres or the proliferative zone and NO change in terminal
    hypertrophic cell size - a clean pool expansion
  species: mouse
  source_ref: trompet2024
  uncertainty: n=5, P=0.017
- parameter: femur length gain, SAG bead in the distal femoral secondary ossification centre versus
    contralateral vehicle bead
  value: '+3.63'
  unit: '%'
  conditions: rat, unilateral, at 6 months; +2.75% at 1 month (P=0.017, 6/6) and +2.64% at 2 months
    (P=0.00091, 9/9). THE EFFECT GREW RATHER THAN WASHING OUT. SHORT SYSTEMIC SAG changed nothing (tibia
    P=0.29, femur P=0.247)
  species: rat
  source_ref: trompet2024
  uncertainty: '+1.263 mm, 8/8 animals, P=0.00004; paired t-tests recomputed by this atlas from the JCI
    numeric source data'
- parameter: dexamethasone conserves the resting zone pool while lowering its proliferation
  value: labelling index DOWN, cell number UP
  unit: direction
  conditions: rabbit; BrdU labelling index decreased P<0.001 while resting zone chondrocyte NUMBER was
    greater than controls P=0.016, because dexamethasone additionally inhibits differentiation OUT of the
    resting zone; serum IGF-I unchanged. Oestrogen in the same experiment lowered labelling index (P=0.011)
    with NO effect on cell number
  species: rabbit
  source_ref: schrier2006
  uncertainty: the two agents move senescence in OPPOSITE directions while moving the observable the SAME
    way - which is what forces the yield term
- parameter: bone age advance on GH plus anastrozole versus GH plus placebo, with linear growth comparable
  value: +2.5 vs +4.1
  unit: years over 3 years
  conditions: human, placebo-controlled, GH-deficient adolescent boys already on GH. THE AROMATASE
    INHIBITOR DID NOT ADD VELOCITY - it lowered the bone-age cost of the velocity GH was already buying
  species: human
  source_ref: mauras2008
  uncertainty: P<0.0001; predicted adult height +6.7 vs +1.0 cm at 36 months
- parameter: annualised growth velocity on vosoritide in NON-FGFR3 children
  value: 4.53 -> 8.09
  unit: cm/year
  conditions: 30 pre-pubertal children aged 3-11 with RASopathies, ACAN or NPR2 deficiency, 6-month
    observation then 12-month treatment at 15 microgram/kg/day; height +0.65 SD. Five discontinuations on
    longer use including three slipped capital femoral epiphyses and four genu valgum
  species: human
  source_ref: dauber2026
  uncertainty: +4.0 SD, 95% CI 3.08-4.91, p<0.0001. THE BONE-AGE-SPARING CLAIM IS NOT IN THE ABSTRACT and
    was not verified from full text this round - see the gap
- parameter: senescence delay bought by growth inhibition
  value: '~2'
  unit: weeks
  conditions: rat, four weeks of tryptophan deficiency; structural, functional AND molecular markers of
    growth plate senescence all delayed, similar magnitude across marker classes. Senescence is
    GROWTH-dependent, not time-dependent
  species: rat
  source_ref: forcinito2011
  uncertainty: about 2 weeks delay for 4 weeks of inhibition - the exchange rate is unfavourable if the
    inhibition costs growth one-for-one
localization:
- 'resting zone: where all four non-oestrogen sub-levers act - yield, pool size, pool spending and cycling
  are all properties of the resting-zone progenitor compartment'
- 'the whole plate: the oestrogen multiplier acts on the senescence programme rather than on one zone'
human_evidence: indirect
human_evidence_note: 'Split sharply by sub-lever. The oestrogen multiplier has human randomised trials to
  attained height. The bone-age-cost framing has human numbers (mauras2008, dauber2026). But YIELD, POOL
  EXPANSION and POOL SPENDING are mouse, rat and rabbit only - the sole human datum on the entire
  progenitor axis is a single 14-year-old epiphysiodesis specimen showing PTHrP+ cells are present in the
  adolescent resting zone (chu2025).'
species_basis:
- human
- mouse
- rat
- rabbit
translation_risk: high
translation_risk_reason: 'The three open sub-levers rest on rodent and rabbit data in a compartment whose
  human counterpart has been visualised exactly once. The yield figure is this atlas arithmetic on
  published per-animal data, not a measurement. And rodent plates do not fuse, which is the specific
  reason the duration question does not transfer cleanly from them.'
confidence: C
claim_grades:
- claim: Duration is the oestrogen axis, so auditing anti-oestrogens audits the duration arm.
  grade: X
  basis: 'NO, AND THIS IS THE ERROR OF ROUNDS 169-171. fusion_is_proliferative_exhaustion establishes at
    grade B from weise2001 that senescence is SPONTANEOUS in untreated animals and that fusion occurs when
    proliferation approaches zero; oestrogen accelerates every senescence parameter and CAUSES none of
    them. Oestrogen is a rate multiplier on a running programme. Four of the five sub-levers of duration
    are not oestrogenic at all.'
- claim: The number of proliferative divisions obtained per resting-zone progenitor consumed - the yield -
    is a real, variable quantity that no intervention has ever targeted.
  grade: C
  basis: 'The variability is established by arithmetic on lui2018 per-animal data - metacarpal 14 versus
    femur 146 micrometres per resting zone cell, non-overlapping intervals, same animals - and the
    movability is established by schrier2006, where oestrogen and dexamethasone move senescence in
    opposite directions while both LOWERING resting-zone proliferation, which excludes both observable
    state variables and leaves the yield as the residual. C not B because the yield has never been
    MEASURED in any species, only inferred and estimated, and the atlas estimate is flagged
    value_unverified.'
- claim: Expanding the resting-zone progenitor pool lengthens bone.
  grade: C
  basis: 'trompet2024 is the only length-endpoint proof: intra-articular SAG doubled resting-zone PTHrP+
    cells with proliferation and terminal cell size unchanged, and unilateral SAG beads gave +3.63% femur
    at 6 months, 8/8 animals, P=0.00004, with the effect GROWING over time. C not B because the bead moved
    pool, h_term and growth rate together so the length gain is not attributable to pool expansion alone,
    and because SHORT SYSTEMIC SAG did nothing - the effect requires local delivery into the secondary
    ossification centre.'
- claim: Growth hormone in the stack is depleting the progenitor pool and therefore costing duration.
  grade: D
  basis: 'MECHANISM DEMONSTRATED, CONSEQUENCE NOT. chu2025 shows GH shifts stem cell divisions toward the
    committed side and depletes the slow-cycling pool, cell-autonomously via GHR. But the dose was 5
    mg/kg/day, about 100-fold a human therapeutic dose and called pharmacological by the authors, and the
    GHR CONDITIONAL KNOCKOUT DID NOT CHANGE BONE LENGTH (tibia P=0.31, femur P=0.35) - the pool phenotype
    has no demonstrated organ-level consequence. The same paper also shows GH signalling is REQUIRED for
    the pool to generate chondrocytes. D for conflicting, not X.'
- claim: Intermittent rather than continuous GH would net more final height.
  grade: E
  basis: 'PLAUSIBLE AND PROPOSED BY THE PRIMARY AUTHORS, NOT TESTED BY ANYONE. chu2025 explicitly warrants
    exploration of intermittent GH strategies especially in non-GH-deficient children, and the clinical
    observation it is meant to explain - efficacy concentrated in the first 1-2 years - is real. But no
    schedule comparison with a final-height endpoint exists in any species, and the 100-fold dose caveat
    applies to the mechanism it rests on. Recorded at g_l2_cycling_the_progenitor_pool, tractability 5.'
- claim: The bone-age cost per centimetre differs between the agents in this stack and can be compared.
  grade: E
  basis: 'THE HIGHEST-VALUE UNBUILT ANALYSIS IN THE DURATION ARM, and it is an inference until the table is
    built. mauras2008 is the clean instance: anastrozole added to GH left LINEAR GROWTH COMPARABLE while
    bone age advanced +2.5 versus +4.1 years - the agent bought duration without buying velocity.
    dauber2026 is the claimed counterpart on the CNP axis at +4.0 SD velocity, but the bone-age ratio is
    NOT in its abstract and was not verified from full text this round. Until each agent has a measured
    bone-age advance per centimetre gained, this is a framework, not a result.'
- claim: There is nothing further to do for duration.
  grade: X
  basis: 'FALSE, AND IT IS WHAT THIS ATLAS EFFECTIVELY SAID AT THE END OF ROUND 170. Three routes are open
    and none is the oestrogen axis: yield (never attempted), pool expansion (one compound, one length
    endpoint, local delivery), and scheduling the agents already present. The atlas ledger had already
    ranked the pool term SECOND among all live arms before rounds 169-171 began.'
key_refs:
- ref_id: weise2001
  year: 2001
  type: primary
  role: THE REFRAME - fusion is what happens to a plate that has run out, and oestrogen is a rate
    multiplier on a programme already running
- ref_id: schrier2006
  year: 2006
  type: primary
  role: the double dissociation that forces the yield term - oestrogen and dexamethasone both lower
    resting-zone proliferation and move senescence in opposite directions
- ref_id: lui2018
  year: 2018
  type: primary
  role: the per-animal data from which the yield is estimated - tenfold separation between a fusing and a
    non-fusing bone inside one animal
- ref_id: trompet2024
  year: 2024
  type: primary
  role: the only pool intervention with a LENGTH endpoint, and the only arm that adds a progenitor rather
    than redistributing a fixed budget
- ref_id: chu2025
  year: 2025
  type: primary
  role: growth hormone depletes the progenitor pool - with the 100-fold dose and the null bone length in
    the GHR knockout both travelling with it
- ref_id: nilsson2014
  year: 2014
  type: primary
  role: pool depletion is the IRREVERSIBLE half of oestrogen action and the resting zone empties by
    differentiation, not death
- ref_id: mauras2008
  year: 2008
  type: primary
  role: the clean human instance of buying duration without buying velocity - linear growth comparable,
    bone age +2.5 versus +4.1 years
- ref_id: dauber2026
  year: 2026
  type: primary
  role: the claimed bone-age-sparing velocity agent, +4.0 SD in non-FGFR3 children - and the claim needs
    verifying from full text
- ref_id: forcinito2011
  year: 2011
  type: primary
  role: senescence is growth-dependent rather than time-dependent, which is what makes cycling coherent
- ref_id: horike2026
  year: 2026
  type: primary
  role: FGFR3 excess disrupts resting-zone turnover via CREB - so the FGFR arm of the stack touches the
    progenitor compartment in an unknown direction in a wild-type subject
