contradicts:
- 'SHARPENS RATHER THAN OVERTURNS the atlas coverage audit, which stated that the ceiling of this
  pharmacological class is bracketed by two men at 197 and 204 cm. That remains true. What the audit did
  not carry is the VELOCITY at which those heights were reached in adulthood - about one centimetre a
  year - or the fact that one of the two could not be stopped and has no published endpoint.'
- 'ADDS A FIFTEENTH CASE TO A CENSUS THAT REPORTED FOURTEEN. The round-86 census predates imre2025. Its
  central conclusion is unaffected - he was treated, so the natural endpoint is still unobserved - but
  the count and the adult velocity both change.'
