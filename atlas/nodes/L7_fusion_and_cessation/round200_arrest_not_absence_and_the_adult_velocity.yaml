    fifteenth aromatase male and was also treated
  species: human
  source_ref: herrmann2002
  uncertainty: 'every aromatase-deficient man is treatable and is treated on diagnosis, so the natural
    endpoint is structurally unobservable in this population. The single exception is the ESR1-null man,
    who cannot be closed, and no later height for him exists in the record'
