    length endpoint'
localization:
- 'the arrested human plate - cartilage anatomically present, bone age frozen, growth stopped'
- 'the cells inside it - never examined in any human who had stopped growing with plates open'
human_evidence: direct
human_evidence_note: 'Entirely human case reports. Three of them carry the quantities that matter -
  herrmann2002 the only spontaneous endpoint, maffei2004 and imre2025 the two adult velocities - and all
  are single cases with the reliability that implies.'
