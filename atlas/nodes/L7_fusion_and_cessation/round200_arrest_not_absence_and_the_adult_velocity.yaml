id: round200_arrest_not_absence_and_the_adult_velocity
name: ROUND 200 - the plate is still there when growth stops, one man quit at 24 while others ran a
  decade longer, and lifelong oestrogen absence buys about one centimetre a year in the third decade
type: hypothesis
layer: L7
aliases:
- arrest not absence
- adult growth velocity oestrogen-null
- imre2025
- round 200
stub: false
summary: 'THE QUESTION CHOSEN FOR THIS ROUND WAS THE ONE THAT DECIDES WHETHER ANY OTHER ROUTE IS THE
  RIGHT KIND OF ROUTE. Round 198 established that fusion is triggered by exhaustion of proliferative
  potential, and round 199 asked how to expand the budget. Both assume the budget is SPENT STOCK. If
  instead the plate at cessation still contains cells that have merely stopped being used, then the
  problem is arrest, and arrest is a different and more tractable problem than depletion.

  THE HUMAN ANSWER IS ARREST, AND IT HAS BEEN SITTING IN THIS ATLAS SINCE ROUND 87 WITHOUT BEING READ
  THIS WAY. herrmann2002 is the only observed spontaneous growth endpoint in the entire oestrogen-null
  literature. His patient grew from 170 cm at 14 to 197 cm and CEASED SPONTANEOUSLY AT 24. THREE YEARS
  LATER, still untreated, the hand X-ray showed OPEN EPIPHYSES and the bone age was 16. A plate that had
  run out of cells would not still be a plate. At the tissue level the cartilage remains and stops being
  used.

  AND THE ENDPOINT IS NOT SHARED, WHICH IS THE MORE USEFUL HALF. herrmann2002 quit at 197 cm by 24.
  maffei2004 was still producing at 29, having grown 172 to 183.5 cm between 21 and 29 with bone age
  frozen at 15 throughout - including through twenty-seven months of supraphysiological testosterone.
  imre2025, new to this atlas, was still producing at 31. The ESR1-null man of smith2008 was 204 cm at 28
  with a history of continued adult growth, could not be closed by any means - six months of transdermal
  oestrogen raising free oestradiol tenfold had no detectable effect - and his bone age advanced only
  from 15 to 17.5 over three and a half years. ONE MAN''S PLATE QUIT AT TWENTY-FOUR WHILE OTHERS RAN A
  DECADE LONGER. That spread is larger than any pharmacological effect in this file and it is direct
  evidence that the budget is not a species constant.

  THE NEW CASE ADDS TWO NUMBERS THE CENSUS DID NOT HAVE. The systematic census of round 86 screened 743
  records and read 45 full texts to find twenty people with complete loss of oestrogen signal or
  synthesis, fourteen of them aromatase-deficient males, and found not one reported final height reached
  without intervention. imre2025 is the fifteenth and was published after that census. He is a
  thirty-one-year-old whose height had increased by FIVE CENTIMETRES OVER THE PRECEDING SIX YEARS to 193
  cm with incomplete epiphyseal fusion. That is an ADULT growth velocity of 0.83 cm per year at ages 25
  to 31, measured rather than inferred.

  PUT WITH maffei2004''S 1.44 CM PER YEAR ACROSS 21 TO 29, THE ADULT VELOCITY UNDER LIFELONG OESTROGEN
  ABSENCE IS ABOUT ONE CENTIMETRE A YEAR. herrmann2002''s apparent 2.70 is excluded from that mean
  because his span begins at fourteen and therefore contains pubertal growth; pooling it would be an
  arithmetic error. ONE CENTIMETRE A YEAR IS THE MEASURED CEILING OF THE DURATION LEVER. Removing
  oestrogen for an entire lifetime does not restore pubertal velocity - it sustains a slow residual
  output into the third decade. Every statement in this atlas that treats delayed fusion as an
  open-ended lever has to be read against that number.

  AND THE SECOND NUMBER POINTS THE OTHER WAY AND IS THE MORE ACTIONABLE OF THE TWO. imre2025 closed the
  plates of a thirty-one-year-old with TRANSDERMAL ESTRADIOL 25 MICROGRAMS TWICE WEEKLY IN SIX MONTHS.
  carani1997 and maffei2004 report the same direction, maffei2004''s oestradiol advancing a bone age
  frozen at 15 for eight years past 16 within six months. A DECADE OF ACCUMULATED RESIDUAL CAPACITY IS
  SPENT BY SIX MONTHS OF A LOW TRANSDERMAL DOSE. The off-switch is fast and cheap; the on-switch is
  neither. That asymmetry is why an aromatase inhibitor is worth more than anything acting inside the
  plate, and it is also why accidental or endogenous oestrogen exposure is the dominant downside risk in
  this programme rather than a background concern.

  WHAT THIS DOES NOT SETTLE, AND IT IS THE WHOLE OF THE ORIGINAL QUESTION. The cartilage remains at
  cessation. Whether the cells inside it retain any capacity to divide has NEVER BEEN TESTED, IN ANY
  SPECIES. Nobody has taken a senescent or arrested growth plate and attempted to restart it. The atlas
  already holds that the ceiling is IMPOSED rather than intrinsic - resting-zone chondrocytes losing
  maintenance methylation in vivo regain it when put into culture - which predicts the cells are
  recoverable. That prediction has never been tested against a length endpoint, and a dedicated sweep
  for growth plate reactivation returns nothing. THIS ARM TERMINATES AT AN UNRUN EXPERIMENT, and the
  honest statement is that the tissue-level answer is arrest while the cell-level answer is unknown.'
quantitative:
- parameter: adult growth velocity under lifelong oestrogen absence
  value: 0.83 cm per year at ages 25 to 31 (imre2025) and 1.44 cm per year at ages 21 to 29
    (maffei2004), mean 1.14
  unit: cm per year
  conditions: male aromatase deficiency, untreated at the time of the measured interval; herrmann2002 is
    EXCLUDED from the mean because his 14-to-24 span contains pubertal growth
  species: human
  source_ref: imre2025
  uncertainty: 'DERIVED by division from author-stated heights and ages, n=2. THE MEASURED CEILING OF THE
    DURATION LEVER. Removing oestrogen for a whole lifetime sustains about a centimetre a year into the
    third decade; it does not restore pubertal velocity'
- parameter: the only observed spontaneous growth endpoint in the oestrogen-null literature
  value: growth ceased at age 24 at about 197 cm, with OPEN EPIPHYSES and bone age 16 documented at age
    27, untreated
  unit: age and height at cessation
  conditions: congenital aromatase deficiency; arm span 204 cm at presentation
  species: human
  source_ref: herrmann2002
  uncertainty: 'THE PLATE WAS STILL THERE WHEN GROWTH STOPPED, three years after it stopped. At the
    tissue level this is ARREST, not emptying. The cessation age is a history statement in a case report
    rather than a series of measurements'
- parameter: spread of the endpoint between oestrogen-null individuals
  value: one man ceased at 24; others were still producing at 29, at 31, and at about 31
  unit: age at which growth was still occurring
  conditions: herrmann2002 against maffei2004, imre2025 and the ESR1-null man of smith2008 and smith2010,
    whose bone age advanced only 15 to 17.5 over three and a half years and who cannot be closed
    pharmacologically
  species: human
  source_ref: herrmann2002
  uncertainty: 'the spread between individuals is larger than any pharmacological effect recorded in this
    atlas, and it is direct evidence that the budget is not a fixed species constant'
- parameter: time to epiphyseal fusion under low-dose transdermal oestradiol in an adult
  value: six months
  unit: months to fusion
  conditions: 31-year-old aromatase-deficient man, transdermal estradiol 25 micrograms twice weekly,
    which normalised estradiol, testosterone and gonadotropins
  species: human
  source_ref: imre2025
  uncertainty: 'THE OFF-SWITCH IS FAST AND CHEAP. maffei2004 gives the same direction, oestradiol
    advancing a bone age frozen at 15 for eight years past 16 within six months. The asymmetry between a
    six-month off-switch and a one-centimetre-a-year on-switch is the central practical fact of the
    duration lever'
- parameter: reported male aromatase deficiency cases with a final height reached without intervention
  value: '0'
  unit: cases
  conditions: the round-86 systematic census screened 743 records and read 45 full texts, finding
