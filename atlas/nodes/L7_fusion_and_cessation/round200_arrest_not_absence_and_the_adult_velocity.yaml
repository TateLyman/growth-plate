claim_grades:
- claim: the human growth plate is still anatomically present when growth ceases spontaneously
  grade: D
  basis: one case, in which open epiphyses and a bone age of 16 were documented three years after growth
    stopped; the cessation date is a history statement rather than a measured series
- claim: adult growth under lifelong oestrogen absence runs at about one centimetre a year
  grade: D
  basis: two cases with author-stated heights and ages, velocities derived by division, n=2
- claim: the age at which the oestrogen-null plate stops varies by at least seven years between
    individuals
  grade: D
  basis: comparison across four case reports with different mutations, ancestries and treatment
    histories, and no common measurement protocol
- claim: low-dose transdermal oestradiol closes an adult oestrogen-null plate within six months
  grade: C
  basis: one case with a stated dose and interval, concordant in direction with two further cases in
    which oestradiol stopped growth and advanced a long-frozen bone age within the same window
- claim: no experiment has attempted to restart a senescent or arrested growth plate
  grade: A
  basis: enumeration over a dedicated sweep
