human_evidence_note: 'The human member of the triad is emons2009: growth-plate tissue across pubertal stages including
  one late-pubertal plate about to fuse, with NOT A SINGLE TUNEL-POSITIVE CELL in the fusing plate and electron microscopy
  showing no typical signs of apoptosis or autophagy but morphological signs of hypoxia and necrosis. It is n=1 fusing
  specimen and unreplicated. Everything else here - the 10-35 per cent dark-chondrocyte fraction, the oestrogen band
  on chondrocyte number, the resting-zone depletion series and the cross-system pool-preservation results - is rabbit,
  chick, mouse or fly. AND THE HUMAN RESTING-ZONE CELL NUMBER DOES NOT EXIST AT ANY AGE (see quantitative).'
translation_risk: high
translation_risk_reason: The largest number in the round - dark chondrocytes at 10-35 per cent of the cell population
  - is EMBRYONIC CHICK, which is the weakest possible species and stage for an open postnatal human plate under CORR-299.
  The depletion series is rabbit. The oestrogen band is female rabbit with an ovariectomised deficiency arm, so CORR-203
  governs it. What is human is a single fusing specimen. This node records a MECHANISM CANDIDATE and a CORRECTION, not
  a demonstrated human process.
summary: "R440 recorded, from nilsson2014, that the resting-zone pool empties WITHOUT DIVIDING AND WITHOUT DYING, and\
  \ treated that as a challenge to the division-budget model at its root. Checked properly, the premise is half right\
  \ and the half that is wrong matters.\n\nONE - THE CORRECTION, AND IT IS AGAINST THIS FILE'S OWN READING. nilsson2014's\
  \ abstract says the decrease in resting-zone cell number DID NOT APPEAR TO BE DUE TO APOPTOSIS. That is a statement\
  \ that the OESTROGEN-INDUCED EXCESS LOSS IS NOT APOPTOTIC. It is NOT a statement that the pool drains without dying,\
  \ which is how this atlas has been reading it. The paper compares two arms and finds no difference between them; a\
  \ standing death rate common to both arms is invisible to that comparison by construction. AGENT-REPORTED AND UNVERIFIED\
  \ HERE BECAUSE THE FULL TEXT IS NOT OPEN: the resting-zone TUNEL indices are said to be 4.6 plus or minus 0.6 per cent\
  \ under oestrogen versus 4.4 plus or minus 1.0 per cent under vehicle at P equals 0.87. If that is right then resting-zone\
  \ apoptosis is NOT ZERO, it is about 4.5 per cent standing, and NOBODY HAS EVER CONVERTED IT INTO A PER-DAY FLUX AND\
  \ COMPARED IT AGAINST THE DIFFERENTIATION OUTFLOW - which is arithmetic on numbers that already exist. The irreversibility\
  \ result is untouched and remains the strongest thing in the paper: transient oestrogen gave depletion still present\
  \ five weeks after withdrawal and hastened fusion, which no reversible-suppression model generates.\n\nTWO - AND THE\
  \ NON-APOPTOTIC ROUTE IS REAL, IS LARGE, WAS MEASURED, AND ITS HUMAN MEMBER HAS BEEN IN THIS ATLAS SINCE THE apoptosis_at_fusion\
  \ NODE WAS WRITTEN. Three independent lines, three species, three methods, and they had never been read together:\n\
  \  - HUMAN, emons2009: not a single TUNEL-positive cell in the fusing plate; EM found NO typical signs of apoptosis\
  \ or autophagy in any plate, but did show morphological signs of HYPOXIA AND NECROSIS.\n  - RABBIT, roach2000, NORMAL\
  \ animals: the authors set out to provide definitive EM evidence of chondrocyte apoptosis in vivo and were UNABLE TO\
  \ FIND A SINGLE CHONDROCYTE with classical apoptotic ultrastructure IN VIVO - while finding one IN VITRO, which is\
  \ the internal control that makes the negative interpretable. What they found instead were DARK CHONDROCYTES and PARALYSED\
  \ CELLS, and their proposed reason is mechanical and specific to this tissue: confinement within lacunae prevents phagocytosis\
  \ of apoptotic bodies, so cartilage needs a different elimination mechanism.\n  - CHICK, erenpreisa1998: dark chondrocytes\
  \ COMPRISE 10 TO 35 PER CENT OF THE CELL POPULATION, at all stages of differentiation and all ages studied, with 15-30\
  \ per cent tetraploid and no S-phase, about 10 per cent showing substantial DNA loss, and advanced cells carrying nuclear\
  \ features of BOTH apoptosis AND necrosis.\nTHREE SPECIES SAYING THE SAME THING, AND THE ONE THAT IS HUMAN WAS ALREADY\
  \ HELD. Meanwhile CHONDROPTOSIS - the name Roach and colleagues gave the morphology - RETURNS ZERO FILES ANYWHERE IN\
  \ THIS ATLAS, and its published literature of roughly a hundred records is entirely osteoarthritis, alkaptonuria and\
  \ intervertebral disc, with NOT ONE growth plate.\n\nTHREE - AND IT JOINS R438's PLOIDY FINDING, WHICH IS THE SAME\
  \ OBSERVATION SEEN FROM THE OTHER SIDE. R438 chased endoreduplication as a candidate volume mechanism for h_term and\
  \ found erenpreisa1999's polyploid chick metaphases, recording it as descriptive and uncited. erenpreisa1998 is the\
  \ SAME LABORATORY AND THE SAME PHENOMENON read as death rather than as ploidy: 15-30 per cent tetraploid dark cells\
  \ with no S-phase. THE POLYPLOIDY QUESTION AND THE NON-APOPTOTIC-DEATH QUESTION ARE ONE OBSERVATION, and this atlas\
  \ has been holding one half of it since R438 without the other.\n\nFOUR - WHAT WOULD CONVERT MORPHOLOGY INTO A DRAINAGE\
  \ RATE, AND IT HAS NEVER BEEN DONE: NOBODY HAS SCORED DARK CHONDROCYTES OR CHONDROPTOSIS SPECIFICALLY IN THE RESTING\
  \ ZONE IN ANY SPECIES. A standing fraction of cells with a death-like appearance is not a rate, and Erenpreisa's own\
  \ dark cells are described as secretorily hyperactive before dying, so some may not be dying at all. A fraction present\
  \ in ALL zones at ALL ages may equally be a constitutive feature of cartilage rather than a drain on the pool.\n\n\
  FIVE - THE OESTROGEN BAND, RECORDED BECAUSE IT RUNS AGAINST THE STACK AND NOT FOR IT. takano2008, 48 female rabbits\
  \ in three arms - sham, ovariectomised, and ovariectomised plus high-dose oestrogen - found that BOTH OVARIECTOMY AND\
  \ HIGH-DOSE OESTROGEN REDUCED CHONDROCYTE NUMBER, the oestrogen arm more dramatically, with the authors concluding\
  \ oestrogen must be maintained WITHIN A NARROW RANGE. That is another band on this file's list. IT DOES NOT REOPEN\
  \ RAISING OESTRADIOL, AND R419 ALREADY CLOSED THAT WITH TWO HUMAN LINES: belgorosky1989, where growth velocity correlates\
  \ with testosterone and NOT with oestradiol including the bioavailable fractions of both, and ferris2017, where predicted\
  \ adult height was unchanged in both Tanner groups on an aromatase inhibitor. takano2008 is a PROXY - cell number,\
  \ PCNA, caspase-3 - in FEMALE rabbits with a deficiency arm, so CORR-203 governs it. It is recorded as a cost to watch\
  \ on an endpoint (progenitor number) that the human trials did not measure, not as an argument to change the anastrozole\
  \ arm.\n\nSIX - THE CROSS-SYSTEM ANSWER, AND IT REPRODUCES THIS TISSUE'S OWN LESSON FROM OUTSIDE IT. A draining stem-cell\
  \ pool HAS been made to stop draining, three times, by three different mechanisms: chakkalakal2012 (mouse muscle -\
  \ inhibiting Fgfr1 or overexpressing Spry1 PREVENTS satellite-cell depletion in aged animals), boyle2007 (fly testis\
  \ - forced niche unpaired MAINTAINS germline stem cells in older males), easwaran2022 (fly ovary - reduced juvenile\
  \ hormone ENHANCED germline stem-cell longevity IN NON-DIAPAUSING FLIES, i.e. on a normal background). IN NONE OF THE\
  \ THREE DOES THE ABSTRACT DEMONSTRATE THAT DOWNSTREAM FUNCTIONAL OUTPUT ROSE. chakkalakal2012 demonstrates regenerative\
  \ capacity in the DEPLETION direction; boyle2007 reports no fertility endpoint; easwaran2022 gives no egg-output number\
  \ for the reduced-JH arm. THE COUNT ROSE AND THE OUTPUT WAS NOT MEASURED, OR WAS MEASURED ONLY IN THE OPPOSITE DIRECTION.\
  \ That is exactly what this atlas's own stem_pool_size_versus_flux node found inside cartilage - hedgehog activation\
  \ enlarged the plate without lengthening the bone, achondroplasia expands the resting zone and shortens the bone -\
  \ and the cross-system literature reproduces it independently. POOL SIZE AND OUTPUT ARE SEPARATE VARIABLES, IN FOUR\
  \ TISSUES AND THREE PHYLA.\n\nSEVEN - IS THE POOL FINITE? THE HONEST ANSWER IS THAT IT IS FINITE IN THE SENSE THAT\
  \ MATTERS AND NOT IN THE SENSE USUALLY ASSERTED. For a budget: rabbit resting-zone proliferation rate and cell number\
  \ both fall with age (schrier2006); transient oestrogen gives PERMANENT depletion (nilsson2014); fetal and neonatal\
  \ growth demonstrably depletes progenitors and labelled column number falls to a plateau (newton2019, mizuhashi2018);\
  \ the durably slow-cycling compartment is about 2.6 per cent of chondrocytes (hallett2021); and GH measurably spends\
  \ it (chu2025). Against a budget: POST-SOC PROGENITORS ACQUIRE SELF-RENEWAL and form stable monoclonal columns still\
  \ present at 12 months (newton2019, mizuhashi2018) - and this subject is maximally post-SOC; nilsson2005 shows the\
  \ methylation counter does NOT tick during far more rapid replication in culture, so it is niche-imposed rather than\
  \ an obligate per-division event; and depletion is sufficient to STOP growth but NOT sufficient to FUSE, since rodents\
  \ senesce to near-cessation without fusing. THE MODEL THAT FITS IS NEITHER BUDGET NOR IMMORTAL: A SELF-RENEWING POOL\
  \ WHOSE RENEWAL FRACTION SITS BELOW REPLACEMENT, WITH THE DEFICIT SET BY THE NICHE. That makes RENEWAL FRACTION, not\
  \ pool size, the controllable variable - which is the only formulation consistent with pool size and output being separate.\n\
  \nWHAT THIS ROUND DOES NOT PRODUCE. No compound and no agent. Chondroptosis has no pharmacology in any species; the\
  \ caspase inhibitors that would be the obvious handle target the pathway these three papers say is NOT the one operating.\
  \ The 4.5 per cent TUNEL figure is agent-reported and unverified. And the human resting-zone cell number, which is\
  \ the denominator every attrition argument needs, DOES NOT EXIST AT ANY AGE."
quantitative:
- parameter: resting-zone TUNEL index under oestrogen versus vehicle
  value: 4.6 +/- 0.6 versus 4.4 +/- 1.0, P = 0.87
  unit: per cent of resting-zone chondrocytes, juvenile ovariectomised rabbits, n=8-10
  species: rabbit
  source_ref: nilsson2014
  value_unverified: true
  note: AGENT-REPORTED FROM FULL TEXT AND NOT VERIFIED HERE - the PMC and Europe PMC full texts did not return. The ABSTRACT
    supports only the qualitative claim that the decrease did not appear to be due to apoptosis. If the numbers are right,
    resting-zone apoptosis is NOT ZERO at about 4.5 per cent standing, and the atlas has been reading a NOT-DIFFERENTIAL
    result as a NOT-HAPPENING result
- parameter: dark chondrocytes as a fraction of the growth-plate cell population
  value: 10 to 35
  unit: per cent of the cell population, at all stages of differentiation and all ages of femur studied
  species: chicken
  source_ref: erenpreisa1998
  note: EMBRYONIC CHICK, so CORR-299 governs any inference to an open postnatal plate. 15-30 per cent tetraploid with
    no S-phase and about 10 per cent with substantial DNA loss - the SAME observation R438 recorded as a ploidy finding
    from erenpreisa1999, same laboratory
- parameter: chondrocytes with classical apoptotic ultrastructure found in vivo by electron microscopy
  value: zero
  unit: cells, in normal rabbit physes and chondroepiphyses, with a positive in-vitro control cell found in the same
    study
  species: rabbit
  source_ref: roach2000
  note: the in-vitro positive control is what makes this negative interpretable rather than a staining failure
- parameter: TUNEL-positive cells in the one human growth plate about to fuse
  value: none
  unit: cells; EM found no typical signs of apoptosis or autophagy in any plate but did show hypoxia and necrosis
  species: human
  source_ref: emons2009
  note: n=1 fusing specimen, unreplicated - and the HUMAN member of the three-species triad, already held in this atlas
    and never read alongside roach2000 and erenpreisa1998
- parameter: effect of ovariectomy versus high-dose oestrogen on growth-plate chondrocyte number
  value: BOTH arms reduced chondrocyte number versus sham, the oestrogen arm more dramatically
  unit: histomorphometry plus PCNA and caspase-3, 48 female rabbits aged 10-25 weeks in three arms
  species: rabbit
  source_ref: takano2008
  note: a BAND on cell number, with the authors' own conclusion that oestrogen must be maintained within a narrow range.
    PROXY not length; female; the OVX arm is a deficiency state. Does NOT reopen raising oestradiol, which R419 closed
    on two human lines
- parameter: satellite-cell pool preserved in aged mice by blocking niche FGF
  value: depletion PREVENTED by Fgfr1 inhibition or Spry1 overexpression
  unit: satellite-cell number in aged animals
  species: mouse
  source_ref: chakkalakal2012
  note: 'the pool was made to stop draining - and regenerative capacity is demonstrated in the DEPLETION direction, not
    shown to rise in the PRESERVATION direction. Same pattern in boyle2007 and easwaran2022: count up, output unmeasured'
- parameter: human RESTING-ZONE chondrocyte number at any age
  value: does not exist
  unit: 'five independent query formulations returned nothing on point, while the human PROLIFERATIVE zone IS measured
    (kember1976: 24 cells per column, cycle time about 20 days against 2 days in rodent)'
  species: human
  source_ref: kember1976
  note: VERIFIED ZERO. The denominator every resting-zone attrition argument needs has never been measured in a human
    - and per R449 the tissue is being surgically removed and discarded at epiphysiodesis
