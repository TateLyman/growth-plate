id: round459_the_plate_does_not_die_by_apoptosis_in_three_species_and_the_human_member_was_already_held
name: 'R459 - the resting pool drains by a route nobody has named: THREE SPECIES, THREE METHODS, TWENTY YEARS APART all
  find that growth-plate chondrocytes do NOT die by classical apoptosis, the HUMAN member has been in this atlas the
  whole time, chondroptosis has ZERO coverage anywhere - and nilsson2014 says the loss is NOT DIFFERENTIAL, not that
  it is NOT HAPPENING'
