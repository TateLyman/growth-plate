id: round442_a_metaphyseal_hole_lengthens_a_bone_only_if_you_plug_it
name: R442 - a metaphyseal hole lengthens a bone and only if it is plugged, which refutes both mechanisms
  the field offers - and post-fracture overgrowth splits three ways with only the cross-bone arm unexplained
