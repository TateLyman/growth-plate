human_evidence_note: The phenomenon originates in a human clinical observation - tibial overgrowth in
  skeletally immature children after anterior cruciate ligament reconstruction, which drills a metaphyseal
  tunnel - and there is a live paediatric sports-medicine literature on it. li2024overgrowth is 138 human
  children. The causal, randomised, sham-controlled and material-controlled work is rabbit.
translation_risk: moderate
translation_risk_reason: The causal experiments are 7-8 week old rabbits over six weeks and the effect size
  cannot be transferred. The human arm is an uncontrolled complication series in a surgical population. The
  route is surgical and therefore excluded for this subject by operator constraint, so the node records a
  mechanism rather than a proposal.
summary: 'THE STRONGEST RESULT THE ANOMALY SWEEP HAS PRODUCED, AND IT WAS ABSENT FROM THIS ATLAS ENTIRELY -
  bone wax, metaphyseal hole and DPGP all return zero across every node before this round.


  THE HUMAN OBSERVATION IS WHY THE ANIMAL WORK EXISTS. Children who undergo anterior cruciate ligament
  reconstruction, which drills a metaphyseal tunnel, get tibial overgrowth. That is lee2023metaphyseal''s own
  opening sentence and there is a live paediatric sports-medicine literature on the skeletally-immature ACL
  overgrowth question. THE FIELD IS STUDYING IT AS A COMPLICATION TO BE AVOIDED AND NOBODY IS STUDYING IT AS
  A LEVER - CORR-295''s shape applied to a procedure instead of to a gene.


  THE EXPERIMENT IS TWO PAPERS FROM ONE GROUP AND BOTH WERE VERIFIED VERBATIM BY DIRECT FETCH.
  lee2023metaphyseal took 7-8 week old male New Zealand White rabbits, proximal tibia, six weeks, with sham
  controls: a metaphyseal hole with the cancellous bone beneath the physis curetted and the space filled with
  BONE WAX gave overgrowth of 3.17 plus or minus 1.16 mm against sham minus 0.17 plus or minus 0.39 mm at
  P<0.001, with the operated tibia at 10.65 plus or minus 0.35 against 10.43 plus or minus 0.29 cm at
  P=0.002 - AND STATISTICALLY INDISTINGUISHABLE FROM PERIOSTEAL RESECTION at 2.23 plus or minus 1.52 mm,
  P=0.287. park2025metaphyseal is the randomised follow-up and its design is what turns this from a curiosity
  into a finding: 38 rabbits randomised to a hole at 5, 10 or 15 mm distal to the physis filled with bone wax,
  or sham, gave higher length and rate of overgrowth at 5 and 10 mm with new bone width significantly
  increased at 10 mm and nothing at 15 mm; then 20 more rabbits with the defect at 10 mm filled with TISSEEL
  or LEFT UNFILLED gave NO significant growth stimulation in either.


  THE REFUTATION FALLS OUT OF THE DESIGN AND NOBODY HAS STATED IT. lee2023metaphyseal offers two mechanisms -
  hyperaemia from the drilling and microinstability from the hole. AN UNFILLED HOLE DELIVERS BOTH IN FULL AND
  PRODUCES NOTHING. Same drill, same injury, same bleeding, same defect, same microinstability, and the only
  variable separating a null from plus 3.17 mm is whether a persistent occlusive material is sitting in the
  metaphysis beneath the physis. SO THE STIMULUS IS NOT THE INJURY AND NOT THE HYPERAEMIA - IT IS SUSTAINED
  OCCLUSION. That lands on the oldest mechanistic proposal in this area, which this atlas holds only
  secondhand: Cavadias and Trueta in 1965 reported that blocking the medullary canal produces a lasting
  compensatory rise in metaphyseal blood flow and an increased growth rate. A 1965 hypothesis, re-demonstrated
  in 2025 with randomisation, a sham arm and a material comparison, and the two have never been joined. The
  distinction is testable because hyperaemia is transient and occlusion is sustained: the material dependence
  says the tissue integrates a MAINTAINED physical state rather than an ACUTE insult, which is the same shape
  as R427''s finding that lateral joint loading acts through intramedullary pressure and fluid flow rather
  than through strain, and as R437''s convective solute transport driven by a vascular-to-cartilage pressure
  difference, which scores zero nodes and one ledger mention.


  AND IT HANDS AN EXISTING PROGRAMME HERE A FREE PUBLISHED IN-VIVO NEGATIVE CONTROL. TISSEEL IS THE EXACT
  VEHICLE R373, R374 and R385 to R387 specified for the SAG depot, and a Tisseel-filled defect in a growing
  animal produced no growth stimulation - so the fibrin gel by itself is not a growth stimulus and any effect
  from a SAG-loaded fibrin depot would be attributable to the drug rather than to the vehicle. That question
  has been open since R374 and it is answered by a control arm in somebody else''s experiment. The compartment
  caveat is stated: R373''s depot goes into the EPIPHYSEAL secondary ossification centre while this hole is
  METAPHYSEAL and 5 to 15 mm distal to the physis on the other side, so the control is informative rather than
  exact. The other half of the same result is a warning - an occlusive material placed near a physis is NOT
  inert for growth, bone wax proves the compartment is growth-responsive to a filling, and choosing a depot
  vehicle is therefore not a neutral decision.


  THE COST IS UNAVOIDABLE AND IS IN THE SAME PAPER: VALGUS DEFORMITY IN ALL METAPHYSEAL-HOLE GROUPS VERSUS
  SHAM. A unilateral stimulus at one side of a metaphysis produces an angular deformity, which is the generic
  failure mode of every asymmetric local intervention and the reason the ACL literature treats this as a
  complication. And the route is surgical, which the operator has excluded, so this is recorded as MECHANISM
  and not as a proposal. Its value is that it identifies WHAT the stimulus is, which opens the question of
  whether a sustained metaphyseal pressure or flow change can be produced without drilling anything - a
  question nobody has asked.


  AND A SECOND PAPER NARROWS R440''S HEADLINE ANOMALY WHILE MAKING WHAT REMAINS PURER. li2024overgrowth, 138
  children with femoral shaft fracture treated by flexible intramedullary nail, introduces distal physis
  growth proportion to ask where the extra femoral length actually comes from. Mean DPGP was 50.9 per cent
  with 114 of 138 (82.6 per cent) below 70 per cent, and the authors conclude this indicates a significant
  role for FRACTURE-END STIMULATION in femoral lengthening. So the overgrowth of the BROKEN bone is
  substantially not physeal - it is callus and fracture-end new bone, which has an ordinary explanation, and
  R440 framed shapiro1981''s 0.92 cm as a growth-plate phenomenon when roughly half of it is not. But that
  sharpens the anomaly rather than dissolving it, because it cannot touch the cross-bone arm: the unbroken
  ipsilateral tibia in shapiro1981 (0.29 cm in 82 per cent) and the unbroken ipsilateral femur in cho2025
  have no fracture end, so their overgrowth must be physeal or periosteal. The decomposition is now three-way
  - fracture-end in the broken bone, periosteal restraint release in a broken or stripped bone (kaneko2020,
  causally, sham-controlled), and a CROSS-BONE arm in a bone nobody touched which remains unexplained and is
  the actual anomaly. DPGP is a new parameter introduced by that paper and is not independently validated,
  and the roughly 70 per cent expected physeal share is the paper''s own premise.'
