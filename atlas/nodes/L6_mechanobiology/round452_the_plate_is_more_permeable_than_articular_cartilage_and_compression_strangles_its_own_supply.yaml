id: round452_the_plate_is_more_permeable_than_articular_cartilage_and_compression_strangles_its_own_supply
name: R452 - the growth plate's OWN biphasic parameters, at last - it is 8.5 to 32 fold more permeable than
  articular cartilage, its periphery is twice as diffusive as its interior, a 1994 curve-fit independently
  selects the METAPHYSEAL side as the open boundary, and permeability is EXPONENTIALLY strain-dependent so
  sustained compression closes the plate's own transport pathway
