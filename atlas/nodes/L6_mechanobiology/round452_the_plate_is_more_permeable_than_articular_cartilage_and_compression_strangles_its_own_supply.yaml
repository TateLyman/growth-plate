human_evidence: absent
human_evidence_note: Every parameter here is bovine distal femoral growth plate. No biphasic or poroelastic
  measurement of a HUMAN growth plate exists in any age group, and the penetration depths and time constants
  derived from these parameters are therefore bovine numbers applied to a human question.
translation_risk: moderate
translation_risk_reason: The parameters are bovine and the specimens are bone-plate-bone cylinders under
  confined compression rather than intact loaded limbs. But the quantities are intrinsic material properties
  rather than physiological responses, the plate-versus-articular contrast is internal to one study, and the
  qualitative conclusions - the frequency ceiling, the periphery-interior asymmetry, the exponential strain
  dependence - do not depend on the absolute values.
summary: 'R448 computed the poroelastic penetration depth of an oscillating load into a growth plate and drew
  a hard conclusion from it: at 1 to 20 Hz a load ventilates only micrometres of a millimetre-thick tissue,
  so impact and vibratory loading cannot be bulk solute transport, while the diurnal and duty-cycle timescales
  can. It did so using MOW''s ARTICULAR CARTILAGE parameters, and named the growth plate''s own hydraulic
  permeability as the single most valuable missing number in the round, because every penetration depth scales
  on it. cohen1994 measured it in 1994 and used it only for stress relaxation. Read properly it changes four
  things and closes g_l6mech_448a.


  ONE - THE PLATE IS FAR MORE PERMEABLE THAN ARTICULAR CARTILAGE, AND THE CONTRAST IS INTERNAL TO ONE PAPER.
  Bovine distal femoral growth plate, bone-plate-bone cylinders from three peripheral and six interior sites
  across ten femora, confined compression with a nonlinear biphasic curve-fit. On the best-fitting boundary
  condition the intrinsic permeability k0 is 3.4 plus or minus 0.3 at interior sites (n=39) and 13.0 plus or
  minus 4.0 at peripheral sites (n=17), in units of 10^-15 m4/N.s, against 0.4 plus or minus 0.2 for
  skeletally immature bovine articular cartilage in the same table. THE GROWTH PLATE IS 8.5-FOLD MORE
  PERMEABLE AT ITS INTERIOR AND 32-FOLD MORE PERMEABLE AT ITS PERIPHERY THAN THE TISSUE R448 BORROWED ITS
  PARAMETERS FROM. Aggregate modulus is 1.20 MPa interior and 0.66 MPa peripheral against 0.89 MPa articular,
  so the plate is also stiffer inside and more compliant at its rim.


  TWO - R448''S CONCLUSION SURVIVES AND STRENGTHENS, WHICH IS THE POINT OF CHECKING. Poroelastic diffusivity
  D_p equals aggregate modulus times permeability, giving 4.08 x 10^-9 m2/s at interior sites and 8.58 x 10^-9
  at peripheral sites. R448 published 5.32 x 10^-9 from articular parameters, and by luck that sits BETWEEN
  the plate''s own two values, so every number it derived was approximately right for the wrong reason. On the
  plate''s own parameters the penetration depth sqrt(D_p/omega) is 6.6 to 9.5 micrometres at 15 Hz, 25 to 37
  micrometres at 1 Hz, about 1.1 to 1.6 millimetres for a thirty-minute period, and 7.5 to 10.9 millimetres
  diurnally. IMPACT AND VIBRATORY LOADING AT 1 TO 20 HZ STILL CANNOT VENTILATE THE BULK OF A GROWTH PLATE, BY
  ROUGHLY TWO ORDERS OF MAGNITUDE, AND THE POSTURAL AND DUTY-CYCLE TIMESCALES STILL CAN. Consolidation time
  L^2/D_p for a 1 mm plate is 1.9 to 4.1 minutes and for a 3 mm plate 17.5 to 37 minutes, so R448''s figure of
  28 minutes for 3 mm was an articular number and the plate''s own is comparable; full ventilation of a 1 mm
  plate requires a loading PERIOD of order 26 minutes.


  THREE - AND A TRANSPORT ASYMMETRY NOBODY HAS NAMED: THE PERIPHERY IS 2.1-FOLD MORE DIFFUSIVE THAN THE
  INTERIOR. That is intrinsic to the material and is independent of, and additive to, the SUPPLY asymmetry
  brodin1955 measured with intravenous tracers, where entry into the plate is mainly from the metaphyseal
  side. Two different asymmetries, measured forty years apart by two different physics, both pointing at the
  outside and the metaphyseal face of the plate as the accessible surfaces.


  FOUR - AND THE 1994 CURVE-FIT INDEPENDENTLY SELECTS THE METAPHYSEAL SIDE AS THE OPEN BOUNDARY. The three
  models tested are A with permeable epiphysis and metaphysis, B with permeable metaphysis and IMPERMEABLE
  epiphysis, and C with both impermeable. The authors report that model B gives a significantly higher
  curve-fit quality than model C and a slightly - though not significantly - higher fit than model A. So the
  defensible claim is that THE METAPHYSEAL INTERFACE IS PERMEABLE, with the epiphyseal interface being closed
  supported but not established. A mechanical stress-relaxation experiment and a fluorescent tracer study
  forty years apart, neither citing the other, both make the metaphysis the open side.


  FIVE - AND THE FINDING THAT MATTERS MOST, BECAUSE IT IS A MECHANISM FOR SOMETHING THIS FILE ALREADY HOLDS
  AS A PHENOMENON: PERMEABILITY IS EXPONENTIALLY STRAIN-DEPENDENT. The fitted strain-dependency coefficient M
  in k = k0 exp(M e) is 5.8 plus or minus 1.3 at interior sites and 9.5 plus or minus 2.1 at peripheral sites
  on the best-fitting model, rising to 17.8 on model C. At 20 per cent compressive strain that is a 3.2 to
  35-fold FALL in permeability and a 1.8 to 5.9-fold fall in penetration depth; at 10 per cent strain, a 1.8
  to 5.9-fold fall in permeability. SUSTAINED COMPRESSION DOES NOT MERELY DEFORM THE PLATE - IT PROGRESSIVELY
  CLOSES THE PLATE''S OWN TRANSPORT PATHWAY, AND IT DOES SO EXPONENTIALLY IN STRAIN. That is a poroelastic
  mechanism for the Hueter-Volkmann principle and for stokes2005''s duty-cycle result, in which halving the
  hours of sustained loading from 24 to 12 recovered 14 to 16 points of growth rate. It also predicts the
  asymmetry stokes2002 measured, where load costs about 3.7 times more growth than an equal distraction buys,
  because compression closes the pathway exponentially while tension cannot open it by the same factor.


  WHAT THIS DOES NOT SETTLE. Every parameter is bovine, from bone-plate-bone cylinders in confined
  compression, not an intact loaded limb. NO BIPHASIC OR POROELASTIC MEASUREMENT OF A HUMAN GROWTH PLATE
  EXISTS AT ANY AGE. And a diffusivity is not a delivery measurement: it says how fast a pressure disturbance
  and its associated fluid movement propagate, not what concentration of any particular solute arrives.'
