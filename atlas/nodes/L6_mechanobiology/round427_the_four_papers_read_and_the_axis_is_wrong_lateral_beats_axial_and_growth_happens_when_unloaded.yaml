id: round427_the_four_papers_read_and_the_axis_is_wrong_lateral_beats_axial_and_growth_happens_when_unloaded
name: >-
  R427: the four papers read in full, and three of R426's claims change. Fuchs is NOT a flat null - the
  table gives +0.5 cm in the FAVOURABLE direction, never tested, at 8.8 body weights. The meta-analysis
  says frequency does nothing and DUTY CYCLE is everything. And the decisive fact is that AXIAL compression
  of a long bone SHORTENS it in proportion to peak load while LATERAL loading of the joint at one
  thirty-fourth of that force LENGTHENS it by 3.5 per cent - an axis no human exercise delivers
aliases:
  - lateral joint loading
  - knee loading
  - Fuchs +0.5 cm
  - recumbency gating
  - duty cycle
  - the jam at 17 N
type: intervention
layer: L6
stub: false
summary: >-
  ══ ONE - ⛔ THE FUCHS CORRECTION, AGAINST MYSELF, AND IT REOPENS THE ARM R426 CLOSED ══

  R426 read fuchs2001's abstract sentence - jumpers and controls had similar increases in height - as a
  randomised human null. TABLE 1 SAYS SOMETHING DIFFERENT. Jumpers (n=45) went 125.1 to 128.7 cm; controls
  (n=44) went 126.8 to 129.9 cm. THAT IS +3.6 cm AGAINST +3.1 cm - A DIFFERENCE OF +0.5 cm OVER SEVEN
  MONTHS, IN THE FAVOURABLE DIRECTION, IN THE RANDOMISED ARM.
  ⛔ AND IT WAS NEVER TESTED. The only statistic attached to Table 1 is ANOVA p>0.05, which is on the
  LEVELS - dominated by between-child variance, SEM 1.2-1.3 cm on a 126 cm mean - and cannot see a 0.5 cm
  difference in CHANGE. The change scores were entered into the primary analysis AS COVARIATES. The
  potential outcome was used as a nuisance variable and never analysed as an outcome.
  ⚠ WHAT CANNOT BE COMPUTED: the paper reports SEM of the LEVEL, not the SD of the CHANGE, so the standard
  error of that +0.5 cm cannot be recovered and no p-value can be reconstructed. Recorded as a point
  estimate with no interval, not as a positive.
  ⚠ ONE WEAK ARGUMENT THAT IT IS CONSERVATIVE: controls were 1.7 cm TALLER at baseline, and taller children
  at 7.6 years are on average slightly more mature and growing slightly faster, so the imbalance should
  favour the controls and it did not. Ordinary chance imbalance at this n, so this is a remark, not evidence.
  ⭐ AND THE DOSE IS FAR HIGHER THAN ANY OTHER NUMBER IN THIS LAYER: average peak ground reaction force
  across the 100 jumps was 8.8 +/- 0.9 TIMES BODY WEIGHT for jumpers and 8.6 +/- 1.05 for controls, measured
  on a force plate in a subsample. The paper's own comparators are gymnastics at 10-15 BW and running at
  2-3 BW. brailey2026's standardised high jump is 3.77 BW, so THE 61 cm DROP LANDING IS ROUGHLY 2.3 TIMES
  THE MECHANICAL DOSE OF AN ORDINARY JUMP.
  → ⭐ R426's SENTENCE "A RANDOMISED HUMAN NULL AT ITS OWN DOSE" IS WITHDRAWN. The correct statement is that
  the only randomised trial at this dose produced a +0.5 cm seven-month difference in the favourable
  direction, called it similar, and never tested it - which is CORR-340's shape, not a null. The arm is
  UNDECIDED, and with 940 children already dosed across twelve trials it is decidable without new subjects.

  ══ TWO - THE META-ANALYSIS, AND IT SETTLES WHICH VARIABLE MATTERS ══

  · ⭐ FREQUENCY DOES NOTHING. dandrea2021a: meta-analysis of stress-normalised loading on caudal vertebrae
    showed NO significant effect of loading frequency on growth rate within magnitude- and
    duration-normalised results, and two rat ulna studies across 8.5-17 N at 0 and 2 Hz found longitudinal
    growth inhibited ONLY by maximum load amplitude and loading duration. THE AUTHORS THEREFORE COMBINED
    STATIC AND CYCLIC DATA IN ALL FURTHER ANALYSIS. The field's own synthesis treats them as one variable.
  · ⭐ THE POOLED SENSITIVITY: 15.03 per cent per 0.1 MPa from meta-analysis of rat caudal vertebrae,
    agreeing with stokes2006. By location the metadata regression gives TIBIA 19.04 and VERTEBRAE 15.36 per
    cent per 0.1 MPa - THE LIMB IS MORE STRESS-SENSITIVE THAN THE SPINE, so sustained load costs the limb
    more. Proliferative zone height alone changes 12.1 per cent per 0.1 MPa.
  · ⛔ THERE IS A HARD CEILING: above a threshold of 0.3 to 1 MPa in compression, or 8.5 to 17 N in the rat
    ulna, GROWTH IS ARRESTED. This is not a linear extrapolation region.
  · ⭐ NO AGE EFFECT WITHIN THE ADOLESCENT RANGE. Across the largest single group (N=162 rat caudal
    vertebrae) and across all species and sites, NO correlation between chronological age and stress
    sensitivity. The authors caution it may differ approaching skeletal maturity, and note less vertebral
    wedging in rats approaching maturity.
  · ⛔ TORSION IS A COST. Lazarus showed torsion applied through oblique fixation plating significantly
    REDUCED longitudinal growth in rabbit femurs within 4 weeks; Moreland found chondrocyte organisation
    disruption near fracture-threshold torsion without short-term length change.
  · ⭐ AND THE MECHANISM THE AUTHORS THEMSELVES PROPOSE FOR WHY INTERMITTENCY HELPS IS TRANSPORT, NOT STRAIN.
    dandrea2021b: no- or low-loading periods allow relatively uninhibited growth and stress recovery, MAY
    FACILITATE FLUID INTAKE in response to loading history, and CORROBORATE noonan2004; and the pronounced
    zone-height response to pseudo-intermittent waveforms may work THROUGH FLUID DIFFUSION as constrained by
    viscoelastic recovery time.

  ══ THREE - ⭐⭐⭐ THE FACT THAT REORGANISES THE WHOLE LAYER, AND THE ATLAS HAS HELD IT SINCE noonan2004 ══

  IMPLANTED MICROTRANSDUCERS IN LAMBS, SAMPLED EVERY 167 SECONDS FOR 21-25 DAYS: AT LEAST 90 PER CENT OF
  BONE ELONGATION OCCURS DURING RECUMBENCY AND ALMOST NO GROWTH OCCURS DURING STANDING OR LOCOMOTION.
  It is in this atlas, cited by 25 nodes, and saltation_stasis_growth states it correctly - growth is
  mechanically gated on a diurnal cycle. It has never been in CLAUDE.md.
  ⭐ IT RECONCILES THE TWO RESULTS THAT LOOKED CONTRADICTORY. stokes2005's duty-cycle effect - 24 h/day to
  12 h/day recovering 14-16 points - is not a dose effect on a stress-response curve; it is the RESTORATION
  OF AN UNLOADED WINDOW IN WHICH GROWTH ACTUALLY HAPPENS. And sibonga2000's null - unloading across four
  spaceflights and two ground models did not raise growth rate - is what you expect if the unloaded window
  in a normal animal is ALREADY LONG ENOUGH for growth to saturate into it.
  → ⭐ THE VARIABLE IS NOT HOW MUCH LOAD BUT WHETHER THE UNLOADED WINDOW IS INTACT. That makes recumbency
  and sleep duration a FIRST-ORDER MECHANICAL variable with a direct continuous measurement behind it, and
  it makes the recumbency arm a PROTECTION arm - losing the window costs growth, extending it beyond
  sufficiency buys nothing.
  ⚠ Lamb, and the human diurnal partition between disc and physis has never been measured.

  ══ FOUR - ⛔⛔ THE JAM, MEASURED, AND I NEARLY QUOTED IT AS A GAIN ══

  dandrea2021b reports that increasing cyclic load magnitude raised hypertrophic zone height in rat distal
  ulnae, citing robling2001's rise from 96 +/- 6 to 540.7 +/- 67.2 microns over two weeks of haversine
  loading at 17 N and 2 Hz - a 5.6-fold expansion of the zone that carries about 80 per cent of longitudinal
  growth. READ ON ITS OWN THAT LOOKS LIKE THE BIGGEST h_term RESULT IN THE FILE.
  ⛔ ohashi2002, same model, same laboratory: at 17 N the LONGITUDINAL MINERALIZATION RATE WAS COMPLETELY
  SUPPRESSED AND DID NOT RECOVER, with CRACKS in the plate, suppressed cartilage mineralization and
  suppressed capillary invasion despite MORE chondrocytes expressing VEGF - while growth plate height and
  hypertrophic zone height were greater than control and hypertrophic chondrocyte number was increased.
  robling2001 gives the length: loaded ulnae about 4 PER CENT SHORTER at 17 N.
  → THE 5.6-FOLD HYPERTROPHIC EXPANSION IS A JAM. Failure mode 1, eighth instance, and it was one sentence
  away from entering this atlas as a positive. IT ALSO PUTS A CAVEAT ON dandrea2021b's OWN ABSTRACT LINE
  that intermittent regimens increase hypertrophic chondrocyte presence - increased hypertrophic presence is
  the signature of BOTH a working h_term and a blocked discharge, and only a length endpoint separates them.

  ══ FIVE - ⛔ AND AXIAL LOADING OF A LONG BONE IS SUPPRESSIVE AT TEN MINUTES A DAY ══

  robling2001, growing rats, daily 10-min bouts for 2 weeks: loaded ulnae about 4 per cent shorter at 17 N
  STATIC and about 4 per cent shorter at 17 N DYNAMIC, about 2 per cent shorter at 8.5 N static.
  ⭐ AT HIGH MAGNITUDE, DYNAMIC IS AS SUPPRESSIVE AS STATIC, and suppression tracks PEAK LOAD rather than
  waveform. ohashi2002 adds the dose-response and the recovery: 4 N and 8.5 N suppressed growth and
  recovered within a week; 17 N did not recover.
  ⚠ AND THE TENSION WITH mcgarry2024 IS REAL AND I AM NOT RESOLVING IT BY ASSERTION. mcgarry2024 applied
  5 N axially to a MOUSE tibia - which relative to body mass is a far larger load than 4 N on a rat ulna -
  and got a LONGER bone. The one parameter that separates them by a large factor is DUTY CYCLE: mcgarry2024
  delivers 100 cycles at 2 Hz three times weekly, which is 2.5 MINUTES PER WEEK, against robling2001's
  10 min/day, which is 70 MINUTES PER WEEK - TWENTY-EIGHT TIMES MORE. That is the most parsimonious
  reconciliation and it is a hypothesis, not a result. Different bone and different species are equally
  available explanations.
  → ⭐ IF THE DUTY-CYCLE READING IS RIGHT THEN AXIAL LOADING IS AN INVERTED U IN DURATION AT FIXED
  MAGNITUDE: seconds per week stimulate through PTHrP, tens of minutes per day suppress through stress
  integration, and high magnitude jams the plate outright.

  ══ SIX - ⭐⭐⭐ THE FINDING: THE PRODUCTIVE AXIS IS LATERAL, NOT AXIAL, AND NO HUMAN EXERCISE DELIVERS IT ══

  zhang2010knee: LATERAL - transverse - oscillatory loading applied ACROSS THE KNEE of C57/BL6 mice about
  EIGHT WEEKS OLD, 21 animals, FIVE-MINUTE BOUTS AT 0.5 N, left limb loaded and right as contralateral
  control. FEMUR +2.3 per cent versus contralateral and +3.5 per cent versus age-matched; TIBIA +2.3 and
  +3.7 per cent; all P<0.001. Proximal tibial growth plate HEIGHT +19.5 per cent and CROSS-SECTIONAL AREA
  +30.7 per cent, and in the HYPERTROPHIC ZONE both chondrocyte NUMBER and CELLULAR HEIGHT rose.
  zhang2012elbow replicates it in the forelimb - humerus +1.2 per cent, ulna +1.7 and +3.4 per cent - and
  shows the response PROPAGATES: c-fos, egr1 and atf3 rose not only at the loaded elbow but at the WRIST
  AND SHOULDER of the same limb.
  ⭐ COMPARE THE TWO AXES DIRECTLY. AXIAL 4-17 N to a rat ulna, 10 min/day: 2-4 per cent SHORTER. LATERAL
  0.5 N across a mouse knee, 5 min/day: 2.3-3.7 per cent LONGER, with the growth plate 19.5 per cent taller
  AND the bone longer, which is the pairing that distinguishes a real h_term gain from ohashi2002's jam.
  ⭐⭐ AND THE PROPOSED MECHANISM IS NOT STRAIN. The programme's own reviews state that joint loading
  enhances anabolic responses WITHOUT INDUCING SIGNIFICANT IN SITU STRAIN at the site of the response, and
  attribute it to intramedullary pressure and interstitial FLUID FLOW.
  ⭐⭐⭐ WHICH MAKES THREE INDEPENDENT LITERATURES CONVERGE ON TRANSPORT INTO AN AVASCULAR TISSUE AS THE
  OPERATIVE VARIABLE: yokota's joint loading (lengthens without local strain, fluid-flow mechanism);
  serrat2010 (chronic running raises solute delivery to the growth plate, measured at rest, with tail length
  as the systemic control); and dandrea2021b (zone height responds to no- and low-load windows, perhaps
  through fluid diffusion). noonan2004 is the phenomenon those three mechanisms would produce.
  ⛔ AND THE HARD LIMIT: IT IS A PIEZOELECTRIC DEVICE CLAMPED ACROSS A MOUSE JOINT. There is no human
  device, no human study, and no ordinary movement that loads a knee transversely at 5-25 Hz - walking,
  running and jumping are all AXIAL. The human exercise literature has never tested the axis that works.

  ══ SEVEN - THE PTHrP DOSE-RESPONSE, WITH ITS THRESHOLD AND ITS INCONVENIENT TIME COURSE ══

  xu2013pthrp, rat growth plate chondrocytes sorted with anti-CD200 into prehypertrophic and hypertrophic
  fractions, cyclic TENSILE strain at 0.5 Hz.
  · MAGNITUDE THRESHOLD: 1000 microstrain had NO effect on PTHrP mRNA or protein; 2000 and 4000 microstrain
    significantly raised BOTH. The authors state it explicitly - strain regulates PTHrP only ABOVE A
    THRESHOLD lying between 1000 and 2000 microstrain, i.e. between 0.1 and 0.2 per cent strain.
  · ⛔ TIME COURSE, AND IT RUNS AGAINST THE BRIEF-BOUT MODEL: 1 h of strain did nothing; 6 h raised mRNA;
    24 h AND 48 h were required to raise PROTEIN. mcgarry2024's bout is FIFTY SECONDS. Either the in vivo
    strain is far above 2000 microstrain, or the 2D-membrane culture time course does not transfer, or the
    in vivo PTHrP rise is not driven the way this assay drives it. RECORDED AS A CONFLICT, NOT SMOOTHED.
  · Cyclic strain did NOT change the cell cycle at any magnitude, so this is not a proliferation effect.
  · Frequency was fixed at 0.5 Hz and never varied, so the assay says nothing about it.

  ══ WHAT R427 SETTLES ══

  Fuchs is not a null and the impact arm is undecided rather than dead. Frequency is irrelevant and duty
  cycle is the axial variable. Growth happens in the unloaded window, which makes protecting that window a
  first-order mechanical intervention and explains both the duty-cycle result and the unloading null. A
  taller plate under load can be a jam and one of the biggest zone numbers in the literature is one. And the
  axis that lengthens bone at a thirty-fourth of the suppressive force is LATERAL loading of the joint,
  which no human activity produces and no human study has tried.
