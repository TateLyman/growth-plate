id: primary_cilium_mechanosensing
name: Primary cilium mechanosensing in the growth plate
type: process
summary: 'The primary cilium is the one mechanosensory organelle with a clean, loading-controlled growth
  plate experiment. Cartilage-specific inducible deletion of Ift88 (AggrecanCreERT2;Ift88fl/fl) in juvenile
  and adolescent mice reduced ciliation and disrupted chondrocyte differentiation, cartilage resorption
  and mineralisation - but only in the peripheral tibial regions beneath the load-bearing compartments
  of the knee, which accumulated enlarged hypertrophic populations. Hedgehog signalling was preserved,
  so the defect is not the usual ciliary Hh phenotype; instead hypertrophic VEGF expression fell, with
  downstream loss of vascular recruitment, osteoclastic activity and cartilage-to-bone replacement. Two
  controls make the mechanical interpretation strong: raising physiological loading in control mice reproduced
  the impaired peripheral ossification, and limb immobilisation abolished the Ift88-null phenotype. Separately,
  PIEZO1 colocalises with the cilium in mouse growth plate chondrocytes and chloral hydrate cilia disruption
  (cilia-positive cells 97.2% to 16.6%) or IFT88 knockdown reversed compression-induced cartilage degeneration,
  placing the cilium downstream of or in a feedback loop with PIEZO1. All of this is mouse; no human physeal
  cilium mechanics data exist.'
quantitative:
