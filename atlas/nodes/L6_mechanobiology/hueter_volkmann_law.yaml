id: hueter_volkmann_law
name: Hueter-Volkmann law
type: hypothesis
aliases:
- Hueter-Volkmann principle
- stress-growth law
- growth modulation by sustained stress
summary: 'Stated qualitatively in the 1860s-1870s, the law asserts that sustained compression across a
  physis slows longitudinal growth and sustained tension accelerates it. Its quantitative form comes from
  one experimental programme (Stokes, Aronsson and colleagues), which applied calibrated external loading
  apparatus across caudal vertebral and proximal tibial growth plates in rats, rabbits and calves for
  8 days and measured growth as the separation of fluorochrome labels given 24 and 48 h before euthanasia.
  Over roughly -0.2 to +0.1 MPa the stress-growth relation was apparently linear, with a growth-rate sensitivity
  of 17.1% per 0.1 MPa averaged across all plates (range 9.2-23.9% per 0.1 MPa), 15.0%/0.1 MPa for vertebrae
  and 18.6%/0.1 MPa for proximal tibia, despite baseline growth rates spanning 30 um/day (rat vertebra)
  to 366 um/day (rabbit proximal tibia). Cellularly the modulation is not a single mechanism: about half
  the growth change under sustained compression is accounted for by reduced hypertrophic chondrocyte enlargement
  and the remainder by fewer proliferative-zone chondrocytes per column, and in multiple regression the
  hypertrophic enlargement term carries the larger coefficient (1.39 vs 0.72). The response is asymmetric:
  compression suppresses more than an equal tension accelerates (52% vs 113% of control at ~60% body weight
  in rat tail vertebrae over 4 weeks). No equivalent sensitivity coefficient has ever been measured in
  a human physis; every human application - guided growth, vertebral body tethering, the scoliosis vicious
  cycle - extrapolates the animal coefficient.'
