localization:
- 'rat caudal vertebral physis: measured (stokes2006)'
- 'rat proximal tibial physis: measured (stokes2006)'
- 'rabbit proximal tibial physis: measured (stokes2006)'
- 'calf caudal vertebral and proximal tibial physis: measured (stokes2006)'
- 'human physis: no direct stress-growth measurement located'
human_evidence: indirect
human_evidence_note: 'Human evidence is entirely inferential: guided growth, epiphysiodesis, vertebral
  body tethering and the progression of Blount disease and scoliosis behave as the law predicts, but no
  human study has applied a known stress across a physis and measured the resulting growth rate, so no
  human sensitivity coefficient exists.'
species_basis:
- rat
- rabbit
- bovine
translation_risk: high
translation_risk_reason: The coefficient is extrapolated to humans from three quadrupedal species at two
  skeletal sites over 8-28 day loading windows; human physes differ in thickness, baseline growth rate,
  loading history and duration of exposure, and the human in vivo physeal stress is itself unmeasured.
