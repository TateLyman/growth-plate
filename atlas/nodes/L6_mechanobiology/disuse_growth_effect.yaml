id: disuse_growth_effect
name: Disuse and longitudinal growth
type: process
summary: 'Removing load does not simply reverse the Hueter-Volkmann effect. Two observations bound the
  question. In the growth plate itself, limb immobilisation abolished the abnormal peripheral ossification
  phenotype of cartilage-specific Ift88-null mice, showing that the disruptive stimulus in the adolescent
  plate is physiological load and that unloading is protective rather than growth-promoting for that phenotype.
  In humans, chronic disuse produces smaller and thinner long bones: children and adolescents with cerebral
  palsy and other neuromotor impairments have reduced bone size and cortical thickness, and even ambulatory
  children with spastic cerebral palsy already show smaller bone area and trabecular deficits. Whether
  the length deficit in these children is a physeal effect or is dominated by nutrition, muscle traction
  and the underlying neurological disorder is unresolved and is the reason human disuse cannot be read
  as a clean unloading experiment. Perpendicular evidence comes from prenatal akinesia, where absent fetal
  movement impairs joint and bone development and maternal exercise rescues it. The consistent pattern
  is that loading is required for normal skeletal form and cross-section, while its effect on longitudinal
  growth rate is smaller and its sign depends on the waveform.'
