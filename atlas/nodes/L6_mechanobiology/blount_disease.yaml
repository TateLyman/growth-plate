id: blount_disease
name: Blount disease (tibia vara)
type: phenotype
summary: 'Blount disease is progressive varus of the proximal tibia caused by growth suppression of the
  posteromedial proximal tibial physis, and it is the standard human illustration of the Hueter-Volkmann
  law running away with itself: varus alignment shifts load medially, medial compression suppresses medial
  growth, and the resulting deformity increases the medial load - a mechanical positive feedback identical
  in form to the scoliosis vicious cycle. Its epidemiology fits the mechanical account: obesity is the
  dominant risk factor and early walking is a recognised association, both of which raise medial compartment
  compressive stress in a child whose physis is still soft. Treatment is itself a mechanical experiment
  in the opposite direction - lateral tension band plating or transphyseal screw hemiepiphysiodesis restores
  growth symmetry - but Blount is the setting in which guided growth performs worst, with lower correction
  rates and more failures than idiopathic genu varum, and late-onset disease in heavy adolescents frequently
  requires osteotomy instead. That failure is informative: it implies the compressive stress in a heavy
  varus knee exceeds the range in which the physis remains modulable, or that the medial physis is already
  partly bridged. No study has measured the medial physeal stress in a child with Blount disease.'
