id: round425_the_site_term_opened_the_cnp_decision_made_and_the_loading_prescription_written
name: >-
  R425: three decisions. NAVEPEGRITIDE goes IN, decided against CORR-195 rather than a population prior,
  because h_term is the ONLY term left in the identity with an approved obtainable agent. The SITE term is
  opened and its first-class finding is that the paediatric human vertebral physis has NEVER BEEN SAMPLED
  by anyone. And the loading prescription is JUMPING, not vibration - the atlas already held a controlled
  human height endpoint and never wrote it in the ledger, while vibration has none in any species
aliases:
  - navepegritide decision
  - SITE term opened
  - vertebral physis never sampled
  - jumping not vibration
  - diurnal measurement rule
type: intervention
layer: L6
stub: false
summary: >-
  Operator constraint governing the round - OPEN-PLATE ROUTES ONLY, compounds and techniques; every
  surgical route excluded from consideration regardless of size.

  ══ PART A1 - NAVEPEGRITIDE: IN, AND THE ARGUMENT THAT DECIDES IT IS ONE THE FILE NEVER ASSEMBLED ══

  The CNP arm is out on a compartment objection: the residual at BA16 is trunk-dominant, so a limb-directed
  agent is aimed at the spent compartment. Two things dismantle that as it stands.
  · R421 removed the GWAS half. Both sides of the erdafitinib-versus-CNP comparison were computed by a
    retired method, and NPR2's first-ever compartment assignment is 29.8 percent trunk - BELOW the
    corrected method's own median of 45.0 but entirely unremarkable against its range of 8.2 to 55.2. The
    file has been reading "limb-leaning" as "aimed at the spent compartment". On the method's own reference
    distribution it means slightly below average.
  · ⭐ THE PREMISE IS A POPULATION PRIOR AND THIS FILE'S OWN CORRECTION SAYS IT DOES NOT DESCRIBE HIM.
    "Trunk-dominant residual" comes from aeppli2025, where at bone age 14.5 the knees are worth 0.3-0.4 cm.
    CORR-195 states explicitly that this subject is OFF that distribution - his knees are radiographically
    OPEN, demonstrably GROWING at BA16, and grew on GH alone. CLAUDE.md already carried the sentence "NOT
    an argument to stop vosoritide - CORR-195" and the arm was dropped anyway. FOR HIM THE LIMB COMPARTMENT
    IS NOT SPENT, and the objection has been load-bearing and unexamined for about 150 rounds.
  ⭐⭐ AND THE DECIDING ARGUMENT, WHICH IS STRUCTURAL RATHER THAN COMPARTMENTAL. Under R360's Regime 2 -
  terminus is a BUDGET, not a date - total height is set by AMPLIFICATION and TERMINAL CELL HEIGHT alone,
  because throughput only reaches the terminus sooner. R423 has now CLOSED amplification: no agent
  anywhere, and its one druggable circuit is a band whose both ends shorten. The pool arms have no
  obtainable molecule - SAG has no GMP material and HHIP has no molecule in any species.
  → THEREFORE h_term IS THE ONLY TERM IN THE EIGHT-TERM DECOMPOSITION THAT (a) ADDS HEIGHT UNDER REGIME 2,
  (b) IS POOL-FREE - it adds height WITHOUT SPENDING A DIVISION - and (c) HAS AN APPROVED, OBTAINABLE AGENT
  WHOSE LABEL CRITERION IS "OPEN EPIPHYSES", which matches him. Everything else in this file is closed,
  unobtainable, or a measurement.
  ✓ And it is the only arm with a proven bone-age-sparing human result: dauber2026, +4.0 SD velocity Z with
  BA/CA UNMOVED.
  ⛔ WHAT DOES NOT CHANGE AND MUST BE CARRIED: the three pharmacological lines are untouched - vosoritide's
  L1-L4 null in the EMA report, the axial null in monkeys, and the rat axial dose causing scoliosis,
  kyphosis and fractures. NOTE PRECISELY WHAT THEY ARE: evidence the arm does NOT REACH THE TRUNK. They are
  not evidence it fails at the knee. The decision is therefore not "does the CNP arm reach the spine" - it
  does not - but "is a limb-directed pool-free agent worth running in a subject whose limb plates are open
  and growing", and the answer to that is yes.
  ⚠ THE HONEST CONDITIONS. CORR-195 asserts the knees are open and growing; it has never QUANTIFIED the
  limb residual, and a velocity agent's value scales with remaining time times remaining capacity. So the
  decision is IN, ON THE LIMB COMPARTMENT, and the measurement that sizes it is already on the list -
  standing MINUS sitting height, and knee imaging. SCFE surveillance is not optional: vosoritide
  contributed three of dauber2026's cases and R384 scored the risk as stacked; frog-leg lateral pelvis at
  baseline and every three months, and any hip, groin, thigh or knee pain or limp is an immediate imaging
  indication.

  ══ PART A2 - THE SIX FREE MEASUREMENTS, ORDERED, PLUS THE HYGIENE ITEM THAT INVALIDATES THE REST ══

  ⭐ ZERO - MEASUREMENT HYGIENE, FROM R319, AND IT WAS NEVER IN THE LEDGER. Standing AND sitting height at
  a FIXED TIME OF DAY after a FIXED PERIOD RECUMBENT. The diurnal swing is up to about 2 cm of stature
  (19.3 mm, 1.1 percent) and 0.3-0.8 percent of SITTING height, with 54 percent lost in the first hour
  after rising. AN UNSTANDARDISED MEASUREMENT TIME CAN FABRICATE OR HIDE A CENTIMETRE OF APPARENT ANNUAL
  GROWTH. Every velocity number claimed for this subject is uninterpretable without it, and it costs
  nothing.
  1. ΔBONE AGE / ΔCHRONOLOGICAL AGE by BoneXpert on serial hand films. Named by R355, R360 and R422 as
     outranking every compound question. R360's rule: 0.2-0.4 confirms Regime 2 and puts the height in
     yield and pool; 0.7-1.0 despite a low reported oestradiol matches smith2008's residual and means no
     oestrogen-directed agent reaches it. R422 makes it additionally a FALSIFICATION TEST of the
     oestradiol number.
  2. LC-MS/MS or extraction oestradiol PLUS the ferris2017 engagement panel - testosterone, LH, FSH,
     haematocrit. R422's 2x2 resolves target engagement without mass spectrometry if the panel is drawn.
  3. SERUM INORGANIC SULFATE - promoted to Part B, see B2.
  4. HOMA-IR - gates metformin as a period lever.
  5. SERUM OSTEOCRIN / MUSCLIN - R424's own output; paediatric reference values exist.
  6. EXOME OR WGS AGAINST THE 207 HEIGHT GENES - R300 gave every one a signed effect in centimetres and
     nothing in 425 rounds has ordered it.

  ══ PART B1 - THE SITE TERM, AND ITS FIRST-CLASS FINDING IS AN ABSENCE ══

  ⭐⭐ THE PAEDIATRIC HUMAN VERTEBRAL PHYSIS HAS NEVER BEEN SAMPLED BY ANYONE, AND THE ATLAS'S OWN DATASET
  INVENTORY SAYS SO IN THOSE WORDS. The Human Cell Atlas intervertebral disc entry is annotated "Vertebral
  endplate cartilage in ADULTS; THE PAEDIATRIC VERTEBRAL PHYSIS IS ABSENT FROM EVERY ATLAS." Checked
  against every other axial source the file holds: GSE146904 is ADULT lumbar spine with the growth plate
  used only as a reference tissue; GSE252288, the 69-sample in-vivo human chondrocyte series, is
  APPENDICULAR; richard2025's LUMBAR and THORACIC ATAC sheets are FETAL and were killed by CORR-339 for
  measuring tissue composition rather than chondrocyte regulation; GSE9160 and chu2026 are limb.
  → THE SITE TERM WAS NEVER WORKED BECAUSE THE TISSUE HAS NEVER BEEN COLLECTED. That is why 270 rounds of
  ledger have reported it untouched. It is not an oversight in this atlas; it is a hole in the field.
  ⚠ AND THE CONSEQUENCE IS THAT EVERY AGENT IN THIS FILE WAS CHARACTERISED ON LONG BONES. The complete
  list of agents with any VERTEBRAL length endpoint is four items and three are unusable: dabogratinib
  L4-L6 (unobtainable, no adolescent arm), SAG/li2021 L3 +32.1 percent (research-grade, no GMP),
  shuhaibar2017 tail +8.5-9.7 percent (mouse genetic), and vosoritide L1-L4 (NULL).
  ⚠ DO NOT OVERREAD ekizoglu2026. Median mature cervical ring apophysis at about 22 years in males with
  stage 3 into the third decade is a peripheral RIM maturity MARKER, it is CERVICAL, and vertebral body
  height is produced by the ENDPLATE physes. It is evidence the axial skeleton matures late, not a
  measurement of remaining vertebral growth. R319 already says this.

  ══ PART B2 - ORAL SODIUM SULFATE: THE DECISION, NOT A GATED NOTE ══

  This is the only obtainable compound in the file with a TRUNK-SPECIFIC human anchor, and in a round about
  the SITE term it is the highest-priority obtainable item. Current grade D and it should stay D.
  ✓ FOR: sitting height effect P=2.16e-07 versus 0.0064 for standing on the commonest SLC13A1 allele, and
  twice the effect size at the same N - trunk-specific, which almost nothing here is. Step 0 clean. Acts on
  h_term. CHST3 is hypertrophic-zone peaked while SLC26A2 declines into HZ, which is the configuration
  where substrate rather than enzyme constrains flux. Approved, oral, cheap, obtainable today.
  ⛔ AGAINST: no sulfate donor has a bone-length endpoint in ANY species; renal reabsorption is
  capacity-limited so the kidney dumps an oral load and the only human demonstration is a single-dose
  25 percent excursion at 2 h rather than a new set point; and the two IMPC length rows on the supply chain
  run the WRONG way (Slc26a2 het TIBIA +0.242 at P=0.00384, the rare informative direction).
  ⭐ THE DECISION RULE, STATED SO ONE ASSAY CLOSES IT: draw SERUM INORGANIC SULFATE. If it sits at the LOW
  end of the reference range, the genetics support correcting it, the effect is trunk-weighted, and it is
  worth taking. If it is MID-RANGE OR ABOVE, homeostasis says there is nothing to gain and the compound
  should be dropped rather than left gated. ⭐ AND THE FREE HALF IS ALREADY ACTIONABLE REGARDLESS: ordinary
  paracetamol at 1.5 g drops serum sulfate 24 percent, a larger acute perturbation in the harmful direction
  than carrying a nonsense allele.

  ══ PART B3 - NON-ENDOCHONDRAL: MEASUREMENT ARTEFACT, NOT A LEVER ══

  Sitting height is vertebral BONE plus intervertebral DISC, and the discs are roughly a quarter of the
  spinal column. marcoslorenzo2026: 4 h supine flotation gave stature +1.6 +/- 0.5 cm with only -0.4 +/- 0.3
  reversed by 15 min upright, cervical disc height up at every level C3-T1, passive vertebral stiffness
  falling across the whole column and remaining below baseline after reloading, and muscle CSA unchanged.
  ⛔ DECIDED: THIS IS THE DIURNAL SWING BEING MAXIMISED, NOT A GAIN. Most of it is disc water and it
  returns. R337 already closed the disc as a growth reserve on stokes2006disc - discal height growth is
  effectively ZERO after age 12 across 188 adolescents, and spinal growth from 10 to 20 is almost
  exclusively vertebral. veres2026 prices sustained unloading: chronic back pain, degradation of every
  spinal tissue, elevated post-flight herniation risk, and the flotation subjects developed neck pain
  within four hours.
  ⭐ WHAT SURVIVES IS THE MEASUREMENT CONSEQUENCE, WHICH IS PART A2's HYGIENE ITEM, AND ONE UNASKED
  QUESTION: does sustained axial unloading raise vertebral PHYSEAL output, as distinct from disc height?
  halanski2026's FEA gives a mechanism to think it might - growth-plate stress worsens as disc height
  DECREASES, so a taller disc mechanically protects the vertebral physis - and it has never been asked in
  any species. Recorded as a gap, not a lever.

  ══ PART C - THE LOADING PRESCRIPTION: JUMPING, NOT VIBRATION ══

  ⛔ THE GUARD FIRST, AS INSTRUCTED. gymnastics_stature_effect is the human natural experiment and it runs
  the wrong way - gymnasts training over 18 h/wk had peak height velocity 5.48 cm/yr against 8.0 in
  swimmers, with selective stunting of LEG length and no change in the CA/BA ratio. THE ATLAS'S OWN
  ADJUDICATION RESOLVES IT AND IT IS A MODALITY SPLIT, NOT A CONTRADICTION: where loading is COMPRESSIVE,
  REPETITIVE AND THROUGH A SMALL JOINT it suppresses - the gymnast wrist gives distal radial physeal stress
  injury with acquired positive ulnar variance, an internally controlled demonstration in humans - and
  where it is IMPACT-TYPE, INTERMITTENT AND AXIAL it is preserved or promoted. That is R253's
  two-terms-of-opposite-sign resolution, and the file already contains it.
  ⚠ AND THE CONFOUND THAT BOUNDS THE PRESCRIPTION: the FIG review concluded causality cannot be established
  because training volume is confounded with SELECTION, ENERGY AVAILABILITY and family size, and no study
  has separated mechanical loading of the physis from energy deficit. The dose that promotes is modest
  (3 sessions a week); the dose that suppresses is 20+ hours a week at restricted energy. That boundary is
  the prescription.
  ⭐⭐ AND THE MODALITY WITH A HUMAN HEIGHT ENDPOINT WAS ALREADY IN THIS ATLAS AND NEVER IN THE LEDGER.
  wang2025: 47 prepubertal children aged 8-11, 24 weeks of progressive jumping 3 sessions a week for 50
  minutes, HEIGHT GAIN 4.200 cm VERSUS 2.478 cm IN CONTROLS, p=0.001, with femoral neck BMD Z +1.075.
  ⛔ AND THE DESIGN IS WEAK AND THE ROUND MUST SAY SO. Its sibling report wang2025jumpaxis carries THE SAME
  TRIAL REGISTRATION (ChiCTR2500095544), so they are one trial reported twice, and it describes the design
  as NON-RANDOMIZED. The exercise group is n=20 in one report and n=15 in the other. Registration was
  post-hoc. Single centre, unblinded, unequal groups. AND THE MEDIATION ANALYSIS IS INTERNALLY INCOHERENT -
  the indirect effect of jumping on height via femoral neck BMD is NEGATIVE (beta -0.442, 95% CI -1.474 to
  -0.009) with NO direct effect (p>0.05), which does not support the headline.
  ✓ The mechanism arm is at least coherent: IGF-1 and the IGF-1/IGFBP-3 molar ratio rose, IGFBP-3 FELL, and
  SERUM GH DID NOT CHANGE - so if it is real it is an IGF-1-bioavailability effect, not a somatotroph one.
  ⚠ Two weak independent observational lines point the same way and neither is strong: lin2026lockdown
  (72 children, growth rate lowest during lockdown but NOT significant overall, males significant
  post-versus-during at p=0.04) and yang2026outdoor (5,029 adolescents, at least 1 h daily outdoor activity
  associated with high growth velocity in normal-weight boys 9-15 at OR 1.71-2.01) - but that paper's ORs
  reach 7.96, which for an ordinary exposure is implausible and reads as residual confounding.
  ⛔⛔ AND VIBRATION - THE BRIEF'S NAMED CANDIDATE - HAS NO LENGTH ENDPOINT ANYWHERE. Targeted queries for
  whole-body vibration or low-magnitude high-frequency stimulation against height, stature, linear growth,
  growth plate or longitudinal bone growth return: scoliosis physiotherapy, cranial suture work, jumping
  PERFORMANCE, body composition in Down syndrome, BMC in burned children, muscle function in cystic
  fibrosis, bed-rest bone loss - and three PATENTS for ultrasonic "physis-stimulating growth devices",
  which are a red flag and not evidence. THE ENTIRE VIBRATION LITERATURE IS A BONE MASS AND DENSITY
  LITERATURE. Failure mode 3 applies: a proxy closes nothing.
  ⭐ THE PRESCRIPTION, GRADED HONESTLY: SEEK IMPACT-TYPE, INTERMITTENT, AXIAL LOADING - JUMPING - AT MODEST
  VOLUME WITH ADEQUATE ENERGY AVAILABILITY, AND AVOID SUSTAINED COMPRESSIVE LOADING THROUGH SMALL JOINTS
  AND HIGH-VOLUME TRAINING AT ENERGY DEFICIT. It is free, open-plate-only, mechanistically grounded in
  watanabetakano2021's periosteal osteocrin route, and supported by ONE non-randomised controlled trial
  with an incoherent mediation analysis. That is a low-risk unproven adjunct, NOT a lever, and it should be
  offered as such.
