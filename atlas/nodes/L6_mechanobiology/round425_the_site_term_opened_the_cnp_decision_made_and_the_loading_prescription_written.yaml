confidence: C
claim_grades:
  - claim: Navepegritide should go in, on the limb compartment
    grade: C
    basis: >-
      h_term is the only term with an approved obtainable agent under Regime 2 once amplification is closed
      and the pool arms have no molecule; CORR-195 says the limb compartment is not spent for him; and
      dauber2026 gives a bone-age-sparing velocity result. Conditional on the limb residual being real,
      which has never been quantified
  - claim: The compartment objection to the CNP arm was derived from a distribution that does not describe him
    grade: B
    basis: >-
      aeppli2025 is a population prior and CORR-195 states explicitly that his knees are open and growing at
      BA16, off that distribution. The file carried both sentences and never read them together
  - claim: The three pharmacological lines against the CNP arm still stand
    grade: A
    basis: >-
      EMA L1-L4 null, monkey axial null, rat axial scoliosis and fractures. They are evidence about the
      TRUNK and are untouched by anything in this round
  - claim: The paediatric human vertebral physis has never been sampled
    grade: B
    basis: >-
      the atlas's own dataset inventory states it, and every axial source it holds is adult, appendicular,
      or fetal and composition-confounded. An absence argument, so it inverts if anyone finds a dataset
  - claim: Jumping raises height in children
    grade: D
    basis: >-
      one non-randomised, unblinded, single-centre, post-registered trial with inconsistent group sizes
      between its two reports and a mediation analysis that contradicts its own headline, plus two weak
      observational lines one of which reports an implausible OR of 7.96
  - claim: Vibration or LMHF stimulation raises height
    grade: X
    basis: NO LENGTH ENDPOINT IN ANY SPECIES. The entire literature is bone mass and density
  - claim: Spinal unloading or flotation is a height lever
    grade: E
    basis: >-
      NO - it is the diurnal swing maximised. Disc height growth is effectively zero after age 12, and
      sustained unloading degrades every spinal tissue
