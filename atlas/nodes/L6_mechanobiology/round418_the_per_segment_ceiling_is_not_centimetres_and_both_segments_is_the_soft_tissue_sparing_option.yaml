localization: >-
  human lower limb - femoral and tibial diaphysis (regenerate), common peroneal and posterior tibial
  nerves, gastrocnemius and tibialis anterior, ankle and subtalar joints
human_evidence: direct
human_evidence_note: >-
  The nerve series, the both-segment series and the complication meta-analysis are human. The rate
  dose-response is canine, the muscle adaptation ovine, and the muscle pharmacology rodent and lagomorph.
species_basis:
  - human
  - canine
  - ovine
  - rat
  - mouse
  - rabbit
translation_risk: moderate
translation_risk_reason: >-
  The both-segment evidence is achondroplasia and congenital deficiency, not normal-stature adults, and
  the soft-tissue envelope is exactly the variable that differs between those populations.
confidence: B
claim_grades:
  - claim: The per-segment ceiling is not set by the amount of lengthening
    grade: B
    basis: >-
      two independent human electrophysiological series reaching the same negative, plus an 814-procedure
      series whose risk factors are configuration and diagnosis rather than amount
  - claim: Distraction RATE is a determinant of nerve injury
    grade: B
    basis: >-
      a controlled canine histological dose-response, 2 of 22 at 1 mm/day versus 10 of 18 at 3 mm/day,
      p<0.01, with the clinical corollary that slowing the rate permits continued lengthening
  - claim: Double-level lengthening within one segment is the dangerous configuration
    grade: B
    basis: >-
      77 percent nerve-lesion risk in 814 procedures and multiple osteotomies as a significant risk factor
      (RR 1.30, p=0.02) in 173 osteotomies. Two independent human series
  - claim: Distributing lengthening across femur and tibia spares soft tissue rather than costing it
    grade: C
    basis: >-
      50 patients and 65 procedures with all adverse events resolving and reduced fixator time, plus a
      12-patient series with no subluxation and no neurovascular injury - but both populations are
      skeletal dysplasia or congenital deficiency, not normal-stature adults
  - claim: The permanent muscle deficit is not a failure of sarcomerogenesis
    grade: C
    basis: >-
      goat data showing serial sarcomere addition continuing through 30 percent lengthening, with the
      authors drawing the same conclusion. Ovine, n=8, and no strength endpoint
  - claim: TGF-beta is the mediator of distraction muscle fibrosis
    grade: E
    basis: >-
      NO - refuted. No TGF-beta1 staining in the fibrosis at all and high-dose antagonist gave the most
      fibrosis
  - claim: A systemic anti-catabolic to protect the joint will worsen muscle fibrosis
    grade: E
    basis: >-
      inference from opposite-signed MMP requirements in two compartments. No experiment has measured
      both under one agent
