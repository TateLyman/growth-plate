id: round418_the_per_segment_ceiling_is_not_centimetres_and_both_segments_is_the_soft_tissue_sparing_option
name: >-
  R418: the ceiling on the largest arm in this file is NOT set by centimetres. Three independent human
  lines say the amount of lengthening is not the main determinant of nerve injury; a canine dose-response
  says the variable is RATE; two human series say the dangerous configuration is DOUBLE-LEVEL WITHIN ONE
  SEGMENT; and simultaneous four-segment lengthening is done specifically BECAUSE it spares soft tissue.
  R398's unexplained "almost nobody does both" is a convention of the cosmetic field, not a biological limit
aliases:
  - per-segment lengthening ceiling
  - peroneal nerve palsy limb lengthening
  - simultaneous femoral and tibial lengthening
  - distraction rate and nerve injury
  - muscle sarcomerogenesis during distraction
type: process
layer: L6
stub: false
summary: >-
  R396 to R398 established that distraction osteogenesis is the largest single term in this atlas -
  about 6.7 cm in one segment against 1-3 cm for the entire drug stack, working AFTER fusion so it never
  competes for the closing window - and that its binding constraint is SOFT TISSUE rather than bone.
  R398 then recorded a fact it could not explain: of 760 adults in the aesthetic literature, 717 had
  TIBIA ONLY, 43 femoral, and just SEVEN had both segments. This atlas had ZERO coverage of nerve palsy,
  peroneal palsy, lengthening index, joint subluxation, bifocal lengthening or simultaneous
  femoral-and-tibial lengthening. R418 asks what actually sets the per-segment ceiling and why almost
  nobody takes both segments.

  ⭐ ONE - THE CEILING IS NOT SET BY CENTIMETRES, AND THREE INDEPENDENT HUMAN LINES SAY SO.
  · simpson2013 - 36 patients with electrophysiology at THREE timepoints (pre-operative, after fixator
    and corticotomy but BEFORE lengthening, and after lengthening), which is the design that separates
    the operation from the distraction. 7 of 21 deteriorated with lengthening and not with surgery. The
    authors' conclusion is the load-bearing one: etiology, site and nerve had a FAR GREATER effect on
    risk than the TOTAL AMOUNT OF LENGTHENING.
  · polo1997 - 14 SHORT-STATURE patients undergoing tibial callotasis, motor conduction studies:
    a greater PERCENTAGE increase in tibial length did NOT correspond to a higher rate of peroneal palsy.
    An independent replication of the same negative, in the population closest to this case.
  · nogueira2003 - 814 procedures, the largest denominator in the field: nerve lesions in 9.3 percent,
    84 percent of them arising during gradual distraction. The risk factors are DOUBLE-LEVEL TIBIAL
    lengthening at 77 percent and skeletal dysplasia at 48 percent - configuration and diagnosis, not
    amount. Complete clinical recovery in 74 of 76.

  ⭐⭐ TWO - AND WHAT DOES SET IT IS RATE AND CONFIGURATION, WITH A CONTROLLED DOSE-RESPONSE.
  · shchudlo2018 - canine Ilizarov lengthening, peroneal nerve histology across four regimes.
    At 1 mm/day massive nerve-fibre degeneration occurred in 2 of 22; at 3 mm/day in 10 of 18, p<0.01.
    ⭐ And within the 1 mm/day arm, manual distraction in 4 increments and automatic distraction in 60
    increments did not separate - so at a FIXED RATE, increment frequency did not change nerve injury,
    while R327's ilizarov1989 shows outcome improves monotonically with frequency for BONE. Frequency
    helps the regenerate and is neutral for the nerve at fixed rate; it is the RATE that injures.
  · mehta2025 - 173 tibial osteotomies in 135 children, nerve injury 6.3 percent overall and 3.5 percent
    in tibial LENGTHENING specifically, 81 percent recovering. Significant risk factors are MULTIPLE
    OSTEOTOMIES (p=0.02, RR 1.30) and acute valgus correction (p=0.01, RR 1.35), and the authors
    recommend prophylactic peroneal decompression for DOUBLE-LEVEL osteotomies while stating it is NOT
    routinely required for standard tibial lengthening.
  ⭐ TWO INDEPENDENT HUMAN SERIES THEREFORE CONVERGE ON ONE DANGEROUS CONFIGURATION - DOUBLE-LEVEL WITHIN
  A SINGLE SEGMENT - AND THAT IS PRECISELY THE "GET MORE OUT OF ONE BONE" STRATEGY.
  · nogueira2003 also shows the constraint is managed rather than fixed: slowing the rate and/or
    decompressing ALLOWED CONTINUED LENGTHENING without permanent injury, and time from diagnosis to
    decompression predicted time to recovery (p=0.0005).

  ⭐⭐⭐ THREE - SO THE ANSWER TO R398's UNEXPLAINED FACT IS THAT DISTRIBUTING ACROSS SEGMENTS IS THE
  SOFT-TISSUE-SPARING OPTION, NOT THE RISKY ONE.
  · shabtai2021 - 50 achondroplasia patients, 65 SIMULTANEOUS bilateral femoral AND tibial lengthening
    procedures. Mean tibial lengthening 52 mm and mean femoral 72 mm, about 12.4 cm across four segments
    in a single session. 76 percent had at least one adverse event and 45 percent of events needed a
    further procedure, but ALL RESOLVED by the end of treatment, and mechanical axis deviation IMPROVED.
    ⭐ The stated rationale is explicitly soft-tissue sparing - moderate lengthening distributed across
    femur and tibia to DECREASE trauma on soft tissues and joints - and it DECREASES total external
    fixator time compared with isolated femoral or tibial lengthening.
  · ghaly2023 - 12 children, single-session femoral AND tibial lengthening for 7-14.5 cm of discrepancy:
    NO joint subluxation or dislocation and NO neurovascular injury, with 83 percent achieving plan.
    ⭐ And the field's answer to the joint problem is SURGICAL AND PROPHYLACTIC, done at the index
    operation - Achilles tendon lengthening, peroneal tendon lengthening and iliotibial band release -
    which are exactly the structures R398 identified as the dominant complications (equinus, Achilles
    tightness, subtalar stiffness).
  · havitcioglu2020 - cosmetic, constitutional short stature, intramedullary nails, mean gain 8.7 cm
    across 16 femoral and 2 tibial segments, so cosmetic centres already exceed the 6.7 cm figure.
  → R398's 6.7 cm is the AESTHETIC FIELD'S PRACTICE CONVENTION. The dysplasia field routinely takes
  roughly twice that across four segments in one session and argues on record that it is gentler.

  ⭐⭐ FOUR - AND THE MUSCLE PREMISE BEHIND R397's FRONTIER IS WRONG AT THE LEVEL OF CONTRACTILE MACHINERY.
  · lindsey2002 - goats lengthened to 20 percent AND 30 percent of tibial length: fibre length and
    SARCOMERE NUMBER rose significantly at both, sarcomere LENGTH was unchanged, and the 30 percent group
    added MORE than the 20 percent group. The authors state directly that the higher rate of
    muscle-related complications beyond 20 percent does NOT appear to be a failure of muscle contractile
    elements to adapt.
  · zollner2012 - a mechanistic model with serial sarcomere number as the internal variable reproduces
    the observed acute lengthening and two-week return of sarcomere length, and explains why GRADUAL
    MULTI-STEP lengthening is less invasive than single-step.
  → So speth2026's permanent and worsening extensor deficit is NOT a sarcomerogenesis failure. The
  muscle keeps pace as a contractile machine. What fails is the ECM compartment - fibrosis - and that is
  a different target from the one R397's framing implied.

  ⛔ FIVE - AND R397's "NOBODY HAS EVER GIVEN AN ANTI-CATABOLIC DURING DISTRACTION" IS FALSE AS WRITTEN.
  Four agents have been tested on muscle during distraction and the results are already informative:
  · IGF-1 (feng2015, 102 rats) - POSITIVE. A single injection before distraction raised muscle weight,
    fibre cross-sectional area, maximum limit load and force generation, upregulated Akt, MyoD and
    myogenin, DOWNREGULATED MYOSTATIN, attenuated atrophy and prevented fibrosis.
  · Osteoactivin (tonogai2015, transgenic mice) - POSITIVE. Reduced collagenous tissue and passive torque
    at 8 weeks, by UPREGULATING MMP-3 and MMP-9, i.e. by RAISING matrix degradation.
  · Platelet-rich plasma (tonogai2018) - NULL at 4, 6, 8 and 10 weeks (p=0.89, 0.45, 0.33, 0.52).
  · Suramin / TGF-beta antagonism (koplin2011, 36 rabbits) - NEGATIVE, and it kills the obvious
    hypothesis: no improvement in range of motion, strength or morphometry, NO TGF-beta1 staining in the
    intramuscular fibrosis at all, and high-dose suramin had paradoxically the MOST fibrosis.
  → The field has already excluded TGF-beta as the mediator and PRP as an agent. What remains positive is
  IGF-1 and an MMP-driven ECM-degradation mechanism.

  ⭐⭐⭐ SIX - THE COMPARTMENT CONFLICT THAT R397's OWN PROPOSAL WALKS INTO, AND IT IS NEW.
  R397 proposed IL-1 blockade during distraction because wu2026dolength found IL-1beta, MMP-13 and RANKL
  UP with COL-II, SOX9 and OPG DOWN in ARTICULAR CARTILAGE and subchondral bone at 20 mm - i.e. catabolism
  is the damage there. But tonogai2015 attenuates MUSCLE fibrosis by RAISING MMP-3 and MMP-9 - i.e.
  catabolism is the repair there.
  → ONE DRUG CLASS, TWO COMPARTMENTS, OPPOSITE SIGNS. A systemic anti-catabolic given to protect the joint
  during distraction is predicted to WORSEN the muscle fibrosis that speth2026 shows is the permanent
  cost. R327's compartment lesson, arriving inside a single operation. Grade E - an inference, because no
  experiment has measured both compartments under one agent - but it is specific, falsifiable, and it
  means R397's gap needs compartment-selective delivery or it trades one problem for the other.

  ⭐ SEVEN - AND THE ONE PLACE THIS TOUCHES THE EXISTING STACK. The single positive muscle agent during
  distraction is IGF-1, and this subject is already on GROWTH HORMONE, which raises IGF-1. CLAUDE.md
  prices the GH arm at approximately ZERO attained height after mid-puberty. This is the first use this
  file has found for that arm: it does not grow the plate, but on the surgical route it is the one agent
  shown to attenuate muscle atrophy and prevent fibrosis during lengthening. Grade E - feng2015 is a
  single peri-distraction injection in a rat, not chronic systemic GH in a human, and no GH or IGF-1
  preparation has ever been given during a human lengthening with a muscle endpoint.

  ⛔ EIGHT - THE LIMITS, STATED HARD, BECAUSE THEY BEAR DIRECTLY ON THIS CASE.
  · shabtai2021 is ACHONDROPLASIA. Achondroplasts carry a relatively long soft-tissue envelope for their
    bone length, which is the standard explanation for why they tolerate very large lengthening.
    CORR-203's shape applied to anatomy: a result from a disproportionate skeleton is a claim about that
    disproportion. A NORMAL-STATURE subject is the harder case and the percentage-of-segment limit matters
    more there, not less.
  · ghaly2023 is CHILDREN WITH FIBULAR HEMIMELIA - congenital, which simpson2013 identifies as the
    highest-risk etiology and nogueira2003 puts at 48 percent for dysplasia. Reassuring despite being
    high-risk, which cuts both ways.
  · The goat data cover 20 to 30 percent of segment length. NOBODY has shown muscle adaptation beyond 30
    percent in any species.
  · alramlawi2025 shows outcome is CENTRE-dependent, with medical tourism named as the risk factor - and
    cosmetic lengthening is heavily a medical-tourism market. Referral series, no denominator, so it
    identifies a variable and cannot give a rate.
  · Every nerve series is mixed-etiology limb-length discrepancy, not elective cosmetic lengthening in a
    normal-stature adult.

  ⭐ NINE - TWO CORRECTIONS TO NUMBERS ALREADY IN THIS FILE.
  · bulut2025 splits R398's pooled Paley tiers by TECHNIQUE across 489 patients: external fixation gives
    problems 56 percent, obstacles 48 percent and TRUE COMPLICATIONS 10 percent, while the intramedullary
    nail gives 37 percent and 42 percent with NO significant complications reported, and mortality is zero
    across all studies. marwan2020's pooled 0.15 true complications per patient is an era-mixed figure;
    the modern motorised nail is materially safer than the frame.
  · yalcinkaya2025 is independently reproduced as a scoping review finding - 410 outcomes, adverse events
    3 percent, physiological and clinical 75 percent, quality of life assessed in only 25 percent of
    studies and social functioning least reported at 15 percent. R398's claim that the field measures
    centimetres and does not systematically measure harm now rests on the same review read twice.

  ⭐ WHAT R418 CHANGES. The largest term in this atlas was recorded at about 6.7 cm because that is what
  the cosmetic literature does, and this file read a practice convention as a ceiling. The ceiling is not
  a number of centimetres; it is a RATE constraint, a CONFIGURATION constraint (do not stack levels within
  one segment) and a CENTRE constraint. Distributing across femur and tibia is the field's own
  soft-tissue-sparing strategy, is documented in 50 patients at roughly twice the aesthetic figure with
  all adverse events resolving, and takes LESS time in frame. The soft-tissue frontier R397 opened is real
  but its muscle half is not a contractile-adaptation failure, TGF-beta is excluded as its mediator, and
  the obvious anti-catabolic proposal is predicted to run backwards in the muscle compartment.
