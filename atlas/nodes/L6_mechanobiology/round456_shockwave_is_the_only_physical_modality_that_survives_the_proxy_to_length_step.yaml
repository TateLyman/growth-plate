human_evidence: absent
human_evidence_note: No human trial of any of these modalities has a height or growth-velocity outcome. The only
  human shockwave data in growing subjects are safety observations in 22 adolescent athletes treated at low energy
  for apophysitis, plus one case in which focused ESWT over a calcaneal epiphysis did not cause early physeal closure.
translation_risk: moderate
translation_risk_reason: 'The shockwave device class is already routine clinical equipment and already used on children,
  so the delivery step is not speculative. What does not transfer is the effect size: the rabbit result has no published
  millimetre value and one secondary source puts it near one per cent.'
summary: 'R441 established that the proxy-to-length step is where this field dies - a positive short-term rate proxy
  followed by a null when somebody finally uses a caliper. R456 counts the instances and finds the pattern is broader
  than R441 said, and that two modalities escape it.


  ONE - THE PATTERN, NOW FIVE DEEP. Capacitively coupled electric field: brighton1983 gave a dose-response with
  a maximum at 5 V peak-to-peak on 48-hour oxytetracycline label displacement, and armstrong1986 - SAME GROUP, SAME
  MODALITY, SAME SPECIES, six weeks at that setting - found NO SIGNIFICANT DIFFERENCE IN TIBIAL LENGTH. LIPUS: rickert2021
  gave plus 35 per cent on 18-day calcein-labelled growth, and spadaro1998 - PREDATING IT BY 23 YEARS IN THE SAME
  JOURNAL, at the standard clinical 1.5 MHz and 30 mW per square centimetre - found no length difference at or below
  2 per cent. LOW-LEVEL LASER at 830 nm raised epiphyseal cartilage thickness and chondrocyte number and explicitly
  did not change bone length; at 670 nm it changed neither. LASER ACUPUNCTURE reported a 61 per cent rise in tetracycline
  growth rate and NO LENGTH WAS EVER MEASURED.

  AND WHOLE-BODY VIBRATION IS THE CORRECTION TO THIS FILE: R425 and R426 wrote that vibration has no length endpoint
  in any species. IT DOES. Growing rats at 50 Hz and 0.5 g, 15 minutes a day, five days a week for five or ten weeks,
  with tibia length measured in millimetres - AND IT IS NULL, with no significant difference in any arm. That closes
  the vibration question rather than leaving it open. SECONDHAND AND value_unverified pending retrieval of the primary.


  TWO - THE SURVIVOR THIS FILE ALREADY OWNED AND HAD FILED UNDER THE WRONG ARM. ramesh2022''s TITLE says ''promotes
  chondrogenesis in human growth plate AND LONGITUDINAL BONE GROWTH IN RABBITS'', and its one_line_finding in this
  bibliography since 2026-08-05 recorded ONLY the 24-hour chondrogenic-marker result in cultured human explants.
  Read in full, the paper has three arms: cultured human growth-plate cartilage (n=5) with SOX9 and COL2A1 up at
  24 hours; six-week-old rabbits given four weekly sessions to the distal femur at two energy levels (n=4 each)
  with increased proliferative chondrocytes and column density at both; and - the arm that matters - PROXIMAL TIBIAE
  OF 22-WEEK-OLD RABBITS (n=12) ASYMMETRICALLY EXPOSED WITH THE CONTRALATERAL SIDE AS UNTREATED CONTROL, FINAL BONE
  LENGTH MEASURED, showing an increase in tibial length after the fourth high-energy session and until six weeks
  after treatment. CORR-309 and CORR-343 exactly: a multi-arm paper filed under one arm''s result, and the dropped
  arm is the one with a LENGTH endpoint in a NORMAL growing animal with an internal control.

  The ex vivo companion is the control that makes it interpretable: ramesh2020 applied rSWT to CULTURED FETAL RAT
  METATARSALS, which have no blood supply and no circulating factors, and reported greater growth - so the effect
  is LOCAL TO THE PLATE and not vascular or endocrine. jhan2025 is an independent second laboratory with focused
  ESWT in 4-week-old rats, sham plus untreated contralateral arms, reporting a longer treated tibia but with within-group
  change across timepoints NOT significant.

  AGAINST IT: the abstract gives NO MILLIMETRE VALUE and no percentage, the authors call the results preliminary,
  the dose in bar and impulses is not in the abstract, and one secondary source puts the magnitude near one per
  cent of final length - which is inside the range where a single laboratory''s caliper technique matters.


  THREE - AND THE DEVICE PROBLEM ON THE OTHER SURVIVOR IS WORSE THAN R428 AND R430 RECORDED. Of the three human
  knee-loading devices built by one programme, the 2013 voice-coil loader is specified at 1 to 20 Hz and spans the
  whole effective band, while the 2016 mechatronic device is specified at 1 to 5 Hz - BELOW the 15 Hz femoral optimum
  the same group''s mouse data identify. So the later, more polished device cannot reach the femoral optimum. SECONDHAND
  AND value_unverified.


  FOUR - THE MECHANISM THE SURVIVING MODALITY IS ATTRIBUTED TO IS DELIVERABLE BY A CUFF, AND NOBODY HAS PUT A CALIPER
  ON IT. Knee loading''s own authors attribute the effect to intramedullary pressure and interstitial fluid flow
  rather than strain. hu2013 built exactly that as a non-invasive inflatable cuff around the tibia, swept across
  0.5 to 10 Hz, and reports intramedullary pressure peaking near 2 Hz at roughly seven-fold baseline WITH MINIMAL
  BONE STRAIN. It has been used against disuse bone loss. NO BONE LENGTH HAS EVER BEEN MEASURED UNDER IT IN ANY
  SPECIES - and unlike a voice-coil actuator clamped across a joint, a pressure cuff is trivially human-deliverable.
  ⚠ R452''s own arithmetic bounds what it can be doing: at 2 Hz the poroelastic penetration depth into the plate
  is of order 18 to 26 micrometres, so whatever a 2 Hz cuff does it is NOT bulk ventilation of a millimetre-thick
  plate.'
