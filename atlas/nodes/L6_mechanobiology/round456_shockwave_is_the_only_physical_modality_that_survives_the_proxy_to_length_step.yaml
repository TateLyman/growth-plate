id: round456_shockwave_is_the_only_physical_modality_that_survives_the_proxy_to_length_step
name: 'R456 - the physical-modality sweep run to the end: FIVE modalities now have a positive proxy and a NULL or
  absent length endpoint, whole-body vibration turns out to HAVE a length endpoint and it is null, and the two survivors
  are transverse joint loading and RADIAL SHOCKWAVE - whose in-vivo rabbit LENGTH arm has been in this bibliography
  since 2026-08-05 filed under a 24-hour marker result'
