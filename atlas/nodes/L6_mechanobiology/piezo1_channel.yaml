localization:
- 'mouse growth plate chondrocytes (all zones, Col2a1 domain): confirmed by conditional deletion phenotype
  (brylka2024)'
- 'mouse hypertrophic zone: confirmed by Col10a1-Cre deletion phenotype (tschaffonmller2026)'
- 'mouse growth plate chondrocyte primary cilium: colocalised with acetylated alpha-tubulin (chen2025)'
- 'human osteophyte cartilage: PIEZO1 protein increased (brylka2024)'
- 'human growth plate: unconfirmed - no localisation study located'
human_evidence: absent
human_evidence_note: The only human PIEZO1 protein data in cartilage come from osteophytes in osteoarthritis;
  PIEZO1 has not been localised or functionally tested in human physeal tissue.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Entirely conditional-knockout mouse biology; human physeal expression is unestablished
  and mice do not undergo epiphyseal fusion.
