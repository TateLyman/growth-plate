id: piezo1_channel
name: PIEZO1
type: protein
aliases:
- Piezo1
- FAM38A
summary: 'PIEZO1 is the only mechanosensitive channel with loss-of-function evidence obtained inside the
  growth plate rather than in articular cartilage. Col2a1-Cre inactivation in mice produces near-absence
  of trabecular bone beneath the growth plate postnatally and multiple rib fractures adjacent to the physes
  by day 7, while linear skeletal growth is only mildly affected - so the channel is required for the
  bone that the plate produces more than for the plate''s own output. Col10a1-Cre deletion restricted
  to hypertrophic chondrocytes gives an osteopenic phenotype with increased osteoclast number in the primary
  spongiosa, mediated by RANKL repression and OPG induction, without altering hypertrophic apoptosis or
  chondrocyte-to-osteoblast transdifferentiation. Under applied compression, PIEZO1 is upregulated in
  vertebral growth plate chondrocytes and drives GPX4 loss and ferroptosis; Col2a1-CreERT;Piezo1fl/fl
  deletion or local pharmacological blockade slowed scoliosis progression in mice. PIEZO1 colocalises
  with the primary cilium in mouse growth plate chondrocytes and its stress response requires IFT88. Human
  data are thin: increased PIEZO1 protein has been shown in cartilaginous zones of human osteophytes,
  but no study has localised PIEZO1 in human growth plate tissue.'
