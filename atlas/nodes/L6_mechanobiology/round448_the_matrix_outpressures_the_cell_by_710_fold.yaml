id: round448_the_matrix_outpressures_the_cell_by_710_fold
name: R448 - the swelling cell cannot make the pressure and the matrix beats it 710-fold, so h_term is matrix-yield
  limited - and at 1 to 15 Hz a load ventilates 8 to 29 micrometres of a three-millimetre plate
