human_evidence: indirect
human_evidence_note: The cell-pressure measurement is a human cell line and the cyclic-loading transport experiment
  is human femoral-head cartilage. Everything else is bovine cartilage, plant, fungal or analytic. There is no human
  growth-plate measurement of permeability, swelling pressure or matrix yield.
translation_risk: moderate
translation_risk_reason: Every penetration depth scales on a hydraulic permeability taken from ARTICULAR cartilage
  because the growth plate figure was measured and never published as a number. The growth plate equilibrium modulus
  is within about 20 per cent of articular, which makes the substitution defensible but not exact.
summary: 'THE PRESSURE ARITHMETIC, AND IT MOVES h_term FROM CELL BIOLOGY TO MATRIX RHEOLOGY. fischerfriedrich2014
  measured by wedged AFM cantilever plus confocal reconstruction, fitted to Laplace''s law, the internal hydrostatic
  pressure a single animal cell sustains: about 40 pascals in interphase and 400 in metaphase, with cortical tension
  0.2 to 1.6 millinewtons per metre. stewart2011 gives the mechanism - osmotic pressure makes the force and the
  actomyosin cortex holds it against an impediment. maroudas1981 puts the swelling pressure of a charged matrix
  at cartilage fixed-charge density at about 0.28 megapascals. THE MATRIX OUT-PRESSURES THE CELL BY 710-FOLD, computed
  here. The cross-kingdom comparison says the difference is the WALL and not the cytoplasm - plant roots convert
  turgor into about 0.5 MPa of axial growth pressure and a Magnaporthe appressorium reaches 8.0 MPa, the biological
  record, and both are walled, while no wall-less cell comes within three orders of magnitude. And the second arithmetic
  closes it from the other side: the water flux required to elongate a bone at ordinary rates needs of order 90
  pascals of driving pressure against about 284,000 available, a factor of roughly 3,000. ELONGATION IS NOT PRESSURE-LIMITED
  AND NOT WATER-SUPPLY-LIMITED. By lockhart1965''s law - growth rate equals extensibility times the excess of pressure
  over a yield threshold - if pressure greatly exceeds the threshold then rate is set by EXTENSIBILITY, so h_term
  is a matrix-yield problem. That reframes an arm: R296 searched for osmolytes and agonists to raise the DRIVE and
  R408 for a transporter inhibitor to raise cell volume, and on this arithmetic the drive is already three thousandfold
  sufficient while the missing variable is how readily the matrix yields. fischenich2022 adds a coherent detail
  - across 153 measurements the HYPERTROPHIC ZONE IS THE SOFTEST, which is the zone that expands.


  THE POROELASTIC PENETRATION DEPTH, AND IT RE-PRICES THE MECHANICAL ARM. From mow1980''s parameters the poroelastic
  diffusivity is the product of aggregate modulus and permeability, 5.3e-9 square metres per second, and the oscillatory
  penetration depth is the square root of that over angular frequency. At 15 hertz - R427''s most effective lateral
  joint loading frequency - it is 7.5 micrometres, one cell. At 1 hertz, walking, it is 29 micrometres. At one cycle
  per thirty minutes it is 1.2 millimetres, at one per three hours it is 3.0, and diurnally it is 8.6. Consolidation
  time for a three millimetre plate is 28 minutes. IMPACT AND VIBRATORY LOADING AT 1 TO 20 HERTZ CANNOT VENTILATE
  THE BULK OF A GROWTH PLATE AND IS PHYSICALLY INCAPABLE OF IT BY TWO ORDERS OF MAGNITUDE - a hard constraint on
  R425''s withdrawn jumping prescription, on R426''s impact arm, and on R427''s lateral joint loading, whose own
  authors attribute it to intramedullary pressure and interstitial fluid flow. The same number supports the arm
  that does work: noonan2004''s recumbency result and stokes2005''s duty-cycle recovery are both DIURNAL-timescale,
  where the depth is 8.6 millimetres and ventilation is complete. R426 and R427 read those as mechanotransduction
  and duty cycle; they are equally well explained as transport, and this is the first quantitative reason to prefer
  the postural timescale over the impact timescale. And the size selectivity matches R428 exactly - ohara1990 raised
  albumin desorption 30 to 100 per cent at 2.8 MPa and 1 hertz while urea and sodium iodide were unchanged, which
  is R428''s conclusion from farnum2006''s size curve reached by different physics. The governing limit is one number:
  cohen1994 measured the growth plate''s own biphasic properties, finding the periphery more permeable than the
  interior, and used them only for stress relaxation, while kazemi2021 built a poroelastic model of reserve-zone
  cartilage and computed cell strain and fluid shear and never solute delivery. The modality was borrowed for this
  tissue twice and the transport question was never asked.


  ANIMALS HAVE NO EXPANSIN, AND THAT IS A SPECIFICATION RATHER THAN A DEAD END. Plants have three matrix-loosening
  modalities - non-catalytic slippage by expansin, cut-and-rejoin by transglycosylase, and hydrolysis - and animals
  have only the third. Every matrix-loosening tool in animal biology is a protease, and a query for expansin and
  cartilage returns zero records. The constraint that makes it matter is proven genetically in a third kingdom:
  singh2012 shows an endopeptidase triple mutant cannot incorporate new murein and lyses, so A COVALENTLY CROSS-LINKED
  LOAD-BEARING MATRIX CANNOT GROW WITHOUT CUTTING ITSELF. That is the general form of the aggrecanase and RANKL
  trap - R317 killed denosumab and R337 killed aggrecanase inhibition because blocking matrix catabolism jams the
  plate, and this says the jam is a property of any cross-linked load-bearing matrix rather than a quirk of cartilage,
  with the only escape being a loosening modality that does not degrade. goh2012 measures the phenotype of removing
  loosening: smaller organs with larger cells, which is charge without discharge with a causal gene. The obtainable
  probe is bacterial EXLX1 from Bacillus subtilis, purified and characterised and never applied to cartilage.


  TWO EXPONENTS THAT CONVERT EXISTING ARMS INTO FALSIFIABLE MAGNITUDES. Donnan pressure is superlinear in fixed
  charge with a computed log-log slope of 1.73, so SULFATION IS A LEVERAGED PARAMETER AND NOT A LINEAR ONE - a ten
  per cent rise in fixed charge buys about seventeen per cent more swelling pressure, which upgrades the sulfate
  arm and R446''s ARSI finding. And Flory-Rehner scaling makes swelling ratio go as cross-link density to the power
  minus three fifths, so halving mature cross-linking predicts about fifteen per cent more linear swelling and a
  twenty per cent reduction predicts 4.4 per cent. That converts inhibit LOX from a direction into a number, and
  it is testable against data already here: mcnerny2015 reduced mature cross-linking substantially in growing male
  mice with tibia length unmoved at p=0.580 and a computed 95 per cent interval of plus or minus 0.97 per cent.
  A fifteen per cent prediction is far outside that interval, so either the cross-link reduction was much smaller
  than substantial implies or bone length is not set by matrix swelling ratio at all. Both derivations are ideal-network
  results applied to a biological composite and the second is offered precisely because it is falsifiable against
  a null this file already holds.


  THE PLATE SITS AT ITS OWN TRANSPORT CEILING, WHICH BOUNDS EVERY SYNTHESIS-RAISING PROPOSAL. The canonical avascular
  diffusion limit is 100 to 200 micrometres, against which a millimetre-thick plate should be impossible - and is
  not, because chondrocyte oxygen consumption is of order 16.5 attomoles per cell per second, roughly a twelfth
  of an ordinary cell, giving a computed oxygen penetration of about 1.1 millimetres. VIABLE HALF-THICKNESS SCALES
  AS THE INVERSE SQUARE ROOT OF PER-CELL DEMAND, SO DOUBLING METABOLIC DEMAND CUTS SUPPORTABLE THICKNESS TO 71 PER
  CENT. Asking a chondrocyte to synthesise faster is not free; it is paid for in plate thickness, and R443''s focal
  vascular breach is the only thing in this file that would relax it.


  AND THE GLYCOGEN ENGINE HAS A MEASURED PRECEDENT WITH NAMED GENETIC CONTROL, WHICH IS WHAT R445 LACKED. howard1991
  measured 8.0 megapascals of appressorial turgor and thines2000 identified its source - glycogen and triacylglycerol
  rapidly degraded at the onset of turgor generation yielding molar glycerol, under MAP-kinase and PKA control.
  The colligative arithmetic is the point: osmotic pressure is per particle, so depolymerising a store multiplies
  its osmotic contribution by the degree of polymerisation, of order ten thousand for glycogen, at constant mass
  and near-zero synthetic cost. Two further systems validate the class - nematocysts at about 15 MPa from poly-gamma-glutamate
  plus counterions, and mucin granules swelling hundreds-fold purely by exchanging calcium for two sodium, doubling
  counterion NUMBER at unchanged fixed charge. R445 found the plate concentrates glycogen destruction five to sevenfold
  and not synthesis and could not say what the destruction was for; this is what it could be for. The honest reconciliation
  with the first finding is that an animal cell has no wall, so a full glycogen store cannot make megapascal-scale
  PRESSURE - but it can make a large osmotic GRADIENT, which is what draws water in once the matrix yields. Glycogen
  supplies the drive; matrix loosening permits the expansion.


  AND THE PARADOX THAT IS NOT SMOOTHED OVER, BECAUSE PLANT BIOLOGY HAS THE SAME ONE. Transverse fibres - hoops around
  a barrel - produce axial elongation, and measured wall extensibility is 30 to 90 per cent higher PERPENDICULAR
  to the fibres. Applied naively to a growth plate whose septal collagen runs longitudinally that predicts lateral
  and not axial expansion. baskin2013 raises the identical paradox for plant stems, whose outer epidermal microfibrils
  are axial and which elongate anyway. Three distinguishable resolutions: longitudinal septa anchored at both ends
  resist lateral bulging by tension rather than by fibre stiffness in the expansion direction; the effective hoop
  is the septal network plus the perichondrial ring rather than fibre orientation within one septum; or a second,
  additive, non-fibrillar matrix elastic asymmetry dominates. The prediction common to all three is that the TRANSVERSE
  septum must be the more extensible, and directional stiffness of transverse against longitudinal septa has never
  been measured. The required anisotropy is modest - a cell going tenfold in volume and 1.6-fold in width expands
  3.91-fold axially against 1.6 radially, a linear anisotropy of 2.44 to 1, barely above what a plant wall achieves
  from fibre texture alone - but wiedemeier2002 and baskin1999 both show fibril orientation sets DIRECTION and not
  DEGREE, so a purely orientational explanation is insufficient in the field that owns the problem.'
