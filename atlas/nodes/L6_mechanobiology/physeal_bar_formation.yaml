id: physeal_bar_formation
name: Physeal bar formation
type: phenotype
aliases:
- bony bridge
- physeal bridge
- partial growth arrest
summary: 'A physeal bar is a bridge of bone spanning the growth plate that tethers one region while the
  rest continues to grow, producing angular deformity, or that arrests growth entirely if extensive. It
  is the pathological limit case of mechanical tethering: the bar imposes an internal, self-generated
  tension band. Human incidence after physeal fracture is uncertain and probably higher than textbooks
  state - a prospective cohort of 332 children found growth arrest in 30.1% overall, against up to 5.5%
  in the prior literature, with 86% after distal femoral physeal fractures, older age and initial displacement
  associated with arrest; the authors caution that diagnostic criteria for arrest vary and the true figure
  may be lower. Physeal fractures themselves account for 18-30% of all paediatric fractures. Mechanistically,
  a reproducible mouse distal femoral drill-hole model shows bone tissue accumulating in the defect over
  42 days and identifies the cellular source: Pdgfra- and Pdgfrb-lineage cells, absent from the plate
  before injury, migrate into the defect and contribute to the bar. This makes the bar a repair response
  by perivascular/mesenchymal populations rather than transdifferentiation of resident chondrocytes.'
