id: loading_effect_plate_height
name: Loading effect on growth plate height and zonal structure
type: phenotype
summary: 'Sustained compression thins the growth plate and the thinning is zonally specific. In rat caudal
  vertebrae under 0.2 MPa for two weeks, static loading significantly reduced total plate thickness, the
  number of proliferative chondrocytes per column and hypertrophic chondrocyte height, whereas dynamic
  loading at the same mean stress produced the same growth-rate reduction with none of these histological
  changes. Under four weeks of ~60% body weight compression, hypertrophic zone height fell to 87% of control,
  mean hypertrophic cell height to 85%, and the increment in cell height along the growth direction to
  78%; distraction changed none of these significantly, which is why compression and tension are not mirror
  images. Across species, altered plate height correlates with altered growth rate but explains it only
  partly: proliferative cell number per unit width and maximum hypertrophic cell height together account
  for the growth change with correlation coefficients of 0.38 and 0.56. Plate thinning is reversible -
  height returned to sham within 10 days of unloading. Plate thickness is also the single most influential
  parameter in finite-element models of how the plate adapts its shape to the local mechanical environment.'
