summary: >-
  ══ ZERO - THE LEDGER FAILURE, AND IT IS THE SIXTH IN EIGHT ROUNDS ══

  R425 wrote the loading prescription from two papers. The atlas already contained SEVENTEEN nodes of
  loading dose-response - strain_magnitude_dependence, strain_frequency_dependence, strain_rate_dependence,
  static_vs_dynamic_loading, loading_effect_plate_height, mechanical_modulation_growth, hueter_volkmann_law,
  physeal_stress_in_vivo, sport_specific_loading_human, disuse_growth_effect, bed_rest_growth_human,
  spaceflight_microgravity_growth, gravity_posture_spinal_loading, local_limb_warming, wolff_law,
  static/dynamic explant work and the Stokes programme - and CLAUDE.md carried TWO of them
  (gymnastics_stature_effect and diurnal_stature_variation). The quantitative core of this layer, including
  a measured stress-growth sensitivity coefficient, has been on disk the entire project and has never once
  been in the ledger. CORR-352 again, and the concept greps that would have found it are LOADING, STRAIN,
  COMPRESSION and MECHANOTRANSDUCTION, not JUMPING.

  ══ ONE - THE ANIMAL DOSE-RESPONSE, ASSEMBLED, AND IT IS SHARPER THAN "DYNAMIC GOOD, STATIC BAD" ══

  · ⭐ THE SENSITIVITY COEFFICIENT: growth-rate change is approximately LINEAR in applied stress at
    17.1 PER CENT PER 0.1 MPa pooled across rat, rabbit and calf at two sites (range 9.2-23.9; vertebrae
    15.0, proximal tibia 18.6), with NO DEAD BAND around zero, over roughly -0.2 to +0.1 MPa (stokes2006).
  · ⭐ IT IS ASYMMETRIC AND THE ASYMMETRY RUNS AGAINST US: at about 60 per cent body weight for four weeks,
    COMPRESSION took rat tail vertebral growth to 52 per cent of control while equal DISTRACTION reached
    only 113 per cent (stokes2002). Load costs about 3.7 times more than unload buys.
  · ⭐ DUTY CYCLE IS THE LARGEST SINGLE MODIFIABLE TERM IN THE WHOLE LAYER: cutting sustained 0.1 MPa
    compression from 24 h/day to 12 h/day moved rat vertebral growth from 82 to 90-93 per cent of control
    and TIBIAL growth from 70 to 84-86 per cent - a 14-16 percentage-point recovery from halving the HOURS,
    with NO DIFFERENCE BETWEEN DAY AND NIGHT LOADING (stokes2005).
  · ⛔ AND THE OSCILLATING COMPONENT DOES NOT SET GROWTH RATE. Sinusoidal 0.2 MPa +/-30 per cent at 0.1 Hz
    reduced rat caudal vertebral growth by EXACTLY THE SAME 19 PER CENT as sustained 0.2 MPa - only the
    static group lost plate thickness, proliferative cells per column and hypertrophic cell height
    (valteau2011). dandrea2021b states it as a synthesis: NO SIGNIFICANT EFFECT ON LONGITUDINAL GROWTH WAS
    OBSERVED BY VARYING FREQUENCY AND AMPLITUDE OF CYCLIC LOADING.
    → MEAN STRESS SETS GROWTH RATE; THE WAVEFORM SETS TISSUE DAMAGE. That is the correct one-line summary of
    the layer and it is NOT the summary R425 wrote.
  · ⭐⭐ BUT INTERMITTENCY - RETURNING TO ZERO - IS A DIFFERENT VARIABLE FROM OSCILLATING ABOUT AN ELEVATED
    MEAN, AND IT IS THE ONE THAT POINTS UP. dandrea2021b: INTERMITTENT COMPRESSION REGIMENS PRESERVED OR
    INCREASED GROWTH PLATE HEIGHT WHILE INCREASING CHONDROCYTE PRESENCE IN THE HYPERTROPHIC ZONE relative to
    persistent and static regimens, whereas PERSISTENT STATIC LOADING reduced plate height in compression
    AND ENCOURAGED MINERALIZATION. Mineralisation is closure. So static load spends the period and
    intermittent load loads h_term, the term that carries about 80 per cent of longitudinal growth.
  · ⭐ AND THE POSITIVE LENGTH RESULT IN A NORMAL ANIMAL EXISTS, WITH AN INTERNAL CONTROL AND A DOSE.
    mcgarry2024: ONE HUNDRED compressive cycles at 5 N and 2 Hz - FIFTY SECONDS of loading - three times a
    week for four weeks, from four weeks of age, one tibia loaded and the contralateral tibia as control.
    Loaded tibiae grew significantly more, growth plate height and area were greater, and in FEMALES PTHrP
    was higher in the loaded plates. microCT showed NO difference in bone volume fraction, so it is length
    and not mass. The mechanism is measured separately: cyclic strain induces PTHrP in prehypertrophic and
    hypertrophic chondrocytes in a MAGNITUDE- and TIME-dependent way, and cytochalasin D blocks it, so the
    step runs through the F-actin cytoskeleton (xu2013pthrp).
  · ⛔ AND THE UNLOADING DIRECTION IS NULL, WHICH KILLS THE OBVIOUS INVERSE. sibonga2000 measured
    longitudinal growth rate by fluorochrome labelling across FOUR spaceflights and TWO ground unloading
    models: skeletal unloading GENERALLY DID NOT AFFECT longitudinal growth rate regardless of age, strain,
    sex, duration or method, with one exception that was 34 per cent SUPPRESSION. foster2019 adds the
    postural version - 12 weeks of enforced bipedal walking or standing in rats changed percentage change
    in tibial length but produced NO ABSOLUTE DIFFERENCE IN BONE LENGTH.
    → THE ASYMMETRY, STATED PLAINLY: YOU CAN LOSE LENGTH BY LOADING STATICALLY. YOU CANNOT GAIN IT BY
    LOADING LESS. Relieving an IMPOSED supraphysiological load recovers growth; going below the normal
    operating point does nothing. That makes the unloading half a PROTECTION arm, not a growth arm, and it
    retires the recumbency-as-lever idea R425 left half open.

  ══ TWO - AND THEN THE HUMAN RANDOMISED TRIAL. R425's PRESCRIPTION HAS AN RCT NULL AT ITS OWN DOSE ══

  ⛔⛔ fuchs2001: 89 prepubescent children randomised to ONE HUNDRED two-footed jumps off a 61 cm box, three
  times a week, during the school day, for SEVEN MONTHS, against non-impact stretching. Femoral neck and
  lumbar spine BMC rose significantly in jumpers (4.5 and 3.1 per cent). AND THE PAPER STATES THAT AFTER
  SEVEN MONTHS JUMPERS AND CONTROLS HAD SIMILAR INCREASES IN HEIGHT - height change was then used as a
  COVARIATE in the primary analysis, which is what you do with a variable that did not move.
  ⭐ THE DOSE IS THE SAME DOSE. 100 jumps, three times a week, is fuchs2001's protocol AND mcgarry2024's
  protocol (100 cycles, 3x weekly) AND approximately wang2025's protocol. The randomised human version of
  the experiment R425 prescribed has been run, for longer, and height did not move.
  ⛔ AND IT IS NOT AN ISOLATED NULL. weeks2012 followed an 8-month twice-weekly school jumping trial for
  three years measuring BOTH STANDING AND SITTING HEIGHT and found no differences in subject
  characteristics between groups. anliker2012 ran 9 months twice weekly and was null even on bone.
  vlachopoulos2018 ran the largest dose in the literature - weighted-vest counter-movement jumps, up to
  4 sets of 20 per day, 4 days a week, 9 months, in adolescent males - and reported bone and fitness only.
  ⭐⭐ AND THE FIELD-LEVEL FACT, WHICH IS A DATA REQUEST RATHER THAN AN EXPERIMENT: a 2025 systematic review
  of high-impact jumping in children covers TWELVE controlled studies and 940 PARTICIPANTS over 3 to 24
  months, and NOT ONE reports height as an outcome. Every one of those trials measured height, because BMC
  analysis requires it. NINE HUNDRED AND FORTY CHILDREN HAVE BEEN DOSED WITH JUMPING WITH THE CALIPER
  ALREADY IN HAND AND THE NUMBER HAS NEVER BEEN ANALYSED. CORR-340's shape at the scale of a whole
  literature, and the single cheapest way to settle this arm.
  → ⛔ CONSEQUENCE: R425's grading of the jumping prescription is DOWNGRADED. It was "a low-risk unproven
  adjunct supported by one non-randomised trial". It is now "an intervention with a randomised human null at
  its own dose and one non-randomised positive with an internally incoherent mediation analysis".

  ══ THREE - THE HUMAN MECHANICAL DOSE TABLE, WHICH THE ATLAS HAS NEVER HAD ══

  brailey2026, 282 children aged 8-16 on force plates, split by sex and by maturity offset relative to peak
  height velocity. Peak vertical force in body weights and average loading rate in BW/s.
  ⭐ THE TWO MECHANICAL VARIABLES ARE MAXIMISED BY DIFFERENT ACTIVITIES: HIGH JUMPS give the highest PEAK
  FORCE (3.77 BW in post-PHV boys) while RUNNING gives by far the highest LOADING RATE (66-86 BW/s against
  25-31 for jumps and 11 for walking). Anyone prescribing "impact" is choosing between them without knowing
  which one the physis reads.
  ⭐ AND THE MATURITY INTERACTION FAVOURS JUMPING FOR A POST-PHV MALE SPECIFICALLY: in boys, jumping
  MAINTAINS OR RAISES both peak force and loading rate from pre- to post-PHV (low jumps 3.18 -> 3.45, high
  jumps 3.64 -> 3.77), while walking (1.36 -> 1.21) and running (1.92 -> 1.70 force, 85.90 -> 66.24 rate)
  both FALL. Girls fall on everything. So of the ordinary activities, jumping is the only one that does not
  lose its mechanical dose through puberty in a male.
  ⛔ THE GOVERNING CAVEAT: ground reaction force at a force plate is NOT stress at a physis. koller2023 is
  the best attempt at the human number - musculoskeletal simulation plus mechanobiological finite element
  analysis in 13 typically developing children - and it shows physeal stress is markedly HETEROGENEOUS, with
  the osteogenic index forming a RING (low centre, high border) and peaking POSTERIORLY in 62 per cent of
  femurs. physeal_stress_in_vivo states the position correctly: the value of in vivo human physeal stress
  has never been measured, and without it the animal sensitivity coefficient cannot be converted into a
  human prediction.

  ══ FOUR - ⭐⭐⭐ THE ARM THAT SURVIVES, AND IT IS NOT MECHANOTRANSDUCTION AT ALL ══

  MOVEMENT HAS THREE DISSOCIABLE EFFECTS ON THE GROWTH PLATE AND THE ATLAS HAS ONLY EVER PRESCRIBED ONE.
  · MECHANICAL - strain sensed by chondrocytes. Animal-positive (mcgarry2024), HUMAN-RCT-NULL (fuchs2001).
  · ⭐ VASCULAR / SOLUTE DELIVERY - and this is the one with the best evidence and zero human tests.
    serrat2010: 68 weanling mice, cold or warm housing, with or without a running wheel, 11 days. ALL
    RUNNERS HAD SIGNIFICANTLY LENGTHENED LIMBS REGARDLESS OF HOUSING TEMPERATURE - so it is not a rescue of
    cold stunting, and CORR-203 does not apply. TAIL LENGTH RESPONDED ONLY TO TEMPERATURE, which is the
    internal control proving the exercise effect is LOCAL TO LOADED LIMB BONES and not a systemic endocrine
    reaction. In vivo multiphoton imaging showed ENHANCED SOLUTE DELIVERY TO TIBIAL GROWTH PLATES IN
    RUNNERS, MEASURED AT REST UNDER ANAESTHESIA - a LASTING vascular adaptation, not a transient during
    exercise.
  · THERMAL - direct temperature effect on chondrocytes. serrat2015: 40 degrees C to ONE SIDE, 40 min/day,
    14 days post-weaning, gave treated-side femur +1.3 per cent and tibia +1.5 per cent with tibial
    elongation rate over 12 per cent higher, body mass and HUMERUS unaffected, and about 1 per cent still
    present seven weeks later; racine2018 replicated it.
  ⭐⭐ AND serrat2010 EXPLICITLY DISSOCIATES THE SECOND FROM THE THIRD: rearing temperature had a MINIMAL
  effect on solute delivery when measured at a common temperature, so a lasting delivery increase is
  important for EXERCISE-mediated lengthening and may play NO role in TEMPERATURE-mediated lengthening.
  TWO INDEPENDENT MECHANISMS, BOTH MOVED BY MOVEMENT, AND THEY ARE NOT THE SAME LEVER. The tempting
  synthesis - that jogging works by warming the knee - is refuted by the paper that would have supported it.
  ⭐ WHY THIS MATTERS MORE THAN THE MECHANICAL ARM FOR THIS PROJECT SPECIFICALLY: the growth plate is
  avascular and R315's delivery wall is the recurring obstacle to every biologic in this file. A LASTING
  INCREASE IN SOLUTE DELIVERY MULTIPLIES EVERY SYSTEMICALLY SUPPLIED AGENT IN THE STACK, and the subject is
  on three of them. serrat2014 quantifies the size dependence - 10 kDa entry up more than 150 per cent,
  40 kDa up 18 per cent - and vosoritide sits at about 4 kDa.
  ⛔ AND THE OBJECTIONS, WHICH ARE SERIOUS. serrat2013 resolves tail elongation into an initial phase whose
  rate is temperature-dependent and a second phase in which rates are identical across 7, 21 and 27 degrees
  C - THE SKELETON IS RESPONSIVE DURING A WINDOW OF RAPID GROWTH AND THEN STOPS. Every length result on
  this axis is post-weaning mouse, which is that window. THERE IS NO HUMAN DATA OF ANY KIND - no trial, no
  case series, no observational study with a length endpoint. And cao2026a's better-controlled within-China
  analysis of over 90,000 adults is NEGATIVE for temperature.

  ══ FIVE - THE PATHWAY THE HUMAN TISSUE ACTUALLY TURNS ON UNDER LOAD, AND IT IS THE POOL AXIS ══

  ⭐⭐ zhang2024a is the ONLY transcriptomic response of HUMAN growth plate cartilage to mechanical load that
  exists - biopsies from three children undergoing epiphysiodesis, loaded at 0.4 N and 0.77 Hz for THIRTY
  SECONDS and sequenced 24 h later. THREE PATHWAYS UP: NOTCH, OXYTOCIN, TIGHT JUNCTION. Named Notch genes:
  PSEN2, HEY1, NCOR2.
  ⭐⭐⭐ AND R400 SPENT AN ENTIRE ROUND ESTABLISHING THAT NOTCH ON MAINTAINS THE RESTING-ZONE POOL - lin2011's
  Jagged1/Fc raised the epiphyseal stem-cell zone and BrdU+ stem cells while DAPT lowered both, R399 made
  nirogacestat a contraindication because gamma-secretase inhibition SHRINKS the reserve, and R400's entire
  unsolved problem was that a usable multivalent Notch agonist does not exist as an obtainable agent.
  ⭐ THE CHAIN CLOSES ACROSS THREE INDEPENDENT SYSTEMS AND NOBODY HAD JOINED IT: LOAD -> PTHrP
  (mcgarry2024 in vivo, xu2013pthrp in cells) -> NOTCH (lin2011 puts Notch DOWNSTREAM of PTHrP, with
  PTHrP(1-34) raising NICD and Jagged1) -> RESTING-ZONE MAINTENANCE. And the human tissue confirms the
  Notch step directly under load.
  → MECHANICAL LOADING IS AN ENDOGENOUS AGONIST OF THE EXACT AXIS THIS FILE COULD NOT DRUG. It costs
  nothing and needs no molecule.
  ⛔ THE OBJECTIONS, AND THE FIRST IS SEX-SPECIFIC AND UNFAVOURABLE. mcgarry2024's PTHrP effect was present
  in FEMALES AND ABSENT IN MALES, and the subject is male - the length effect held in both sexes but its
  named mediator did not. zhang2024a is n=3, ex vivo, a single 30-second bout, with no length endpoint and
  no correction across the whole transcriptome for three patients. lin2011 is an abstract-only organ-culture
  study. NO LENGTH ENDPOINT LINKS ANY STEP OF THE CHAIN TO ANY OTHER.
  ⭐ Recorded as a convergence, not a promotion: CACNB1, one of the 15 loading-regulated genes in human
  growth plate, is also one of the ten genes R356 found enriched in the human RESTING ZONE, and NCOR2 is the
  only dose-dependent lengthening knockout series in IMPC (R323, het tibia +1.104, hom +1.495).

  ══ SIX - HOW TO DISTRIBUTE A GIVEN DOSE, AND THE ONE UNRUN EXPERIMENT ══

  · ⭐ FREQUENT SMALL BOUTS BEAT OCCASIONAL LARGE ONES, measured on damage. ziemian2026: cyclic tibial
    compression at 9 N delivered as a SINGLE BOUT produced MORE severe joint damage at 6 weeks - cartilage
    damage, subchondral erosions, soft-tissue calcification - than the SAME peak magnitude delivered as
    DAILY BOUTS, which preserved subchondral plate integrity, with a fibrosis and inflammation signature
    diverging at 1 week. Articular cartilage in skeletally mature mice, so it transfers as a distribution
    principle and not as a growth result.
  · ⭐ THE RESPONSE SATURATES WITHIN A HANDFUL OF CYCLES. mcgarry2024's entire effective dose is 100 cycles
    = 50 SECONDS, three times a week. zhang2024a's human transcriptomic response follows THIRTY SECONDS.
    fuchs2001 delivered 100 jumps. Nothing in this literature supports long-duration impact.
  · ⛔ AND THE OPTIMISATION NOBODY HAS RUN IN ANY SPECIES: REST INSERTION. In BONE, inserting brief rest
    between load cycles restores mechanosensitivity, and rest-inserted loading retains its osteogenic effect
    when bouts are cut from three per week to one, whereas cyclic loading loses it. NO REST-INSERTION OR
    BOUT-PARTITIONING EXPERIMENT HAS EVER BEEN DONE ON A GROWTH PLATE. It is the cheapest available
    improvement to a protocol that already works in mice.

  ══ SEVEN - THE PRESCRIPTION, REWRITTEN, WITH EACH LINE CARRYING ITS OWN GRADE ══

  ⭐ THE HIGHEST-GRADED ITEM IS A SUBTRACTION, NOT AN ADDITION: MINIMISE SUSTAINED STATIC AXIAL COMPRESSION.
  Halving the daily HOURS of sustained load recovered 14-16 percentage points of growth rate in the animal
  experiment (stokes2005), static load is the regimen that thins the plate and ENCOURAGES MINERALISATION
  (dandrea2021b), and the human analogues are prolonged loaded standing, heavy pack carriage and sustained
  slumped sitting. Grade C on the animal coefficient, grade E on the human transfer.
  ⭐ AVOID COMPRESSIVE, REPETITIVE LOADING THROUGH A SMALL JOINT. The gymnast wrist is an internally
  controlled human demonstration - distal radial physeal stress injury with acquired positive ulnar
  variance. Grade B.
  ⭐ AVOID HIGH-VOLUME TRAINING AT LOW ENERGY AVAILABILITY. The FIG review states causality cannot be
  separated from selection, energy availability and family size, and no study has separated mechanical
  loading of the physis from energy deficit. This is the boundary between the dose that promotes (about
  three sessions a week) and the dose that suppresses (20+ hours a week at restricted energy). Grade C.
  ⚠ IMPACT / JUMPING: DOWNGRADED TO GRADE D-X. Randomised human null at its own dose (fuchs2001), a
  literature of 940 dosed children in which height was never analysed, one non-randomised positive with an
  incoherent mediation analysis. Retained ONLY because it is free, because it is the one activity class that
  does not lose its mechanical dose through PHV in a male (brailey2026), and because the animal version is
  positive with an internal control. It should be offered as such and not as a lever.
  ⭐ CHRONIC, HIGH-VOLUME, LOWER-LIMB EXERCISE - the running-wheel equivalent - IS THE ARM WITH THE BEST
  ANIMAL EVIDENCE AND NO HUMAN TEST AT ALL. It is a different prescription from jumping: it favours VOLUME
  and CHRONICITY over peak force, its endpoint is a lasting vascular adaptation, and it plausibly multiplies
  every systemically supplied agent already in the stack. Grade D, and under R302 the missing human endpoint
  is a GAP rather than a disqualification.
  ⚠ KEEP THE LOWER LIMBS WARM RATHER THAN COOL, AND THIS PRODUCES A FREE SUBTRACTION THE FILE HAS NEVER
  NAMED: ROUTINE POST-EXERCISE ICING AND COLD-WATER IMMERSION OF THE LEGS, which is near-universal in youth
  sport, runs directly against the only axis here with a persisting length endpoint in a normal animal.
  Grade E, no human data, free to stop. By the same mechanism, prolonged immersion in a 27-28 degree C
  swimming pool is the modality predicted to be WORST on this axis - and vlachopoulos2018 is consistent
  with that from a different direction, since swimmers and cyclists gained from added jumping while
  footballers did not.
  ⛔ VIBRATION REMAINS AT GRADE X. Re-queried this round against growth plate directly: the only returns are
  three patents for ultrasonic physis-stimulating devices. There is no length endpoint for whole-body
  vibration or low-magnitude high-frequency stimulation in any species.
  ⛔ HANGING, INVERSION AND SPINAL TRACTION: queried directly against stature with an intervention or trial
  design and returning NOTHING. There is no trial of any traction or suspension modality with a height
  endpoint in a growing human, and the disc component of any acute gain is R425's diurnal artefact.

  ══ WHAT R426 SETTLES ══

  The loading layer has a measured dose-response and the ledger never carried it. Optimising the
  prescription splits movement into three mechanisms that had been treated as one; the mechanical half is
  the half with a randomised human null; the delivery half has the internally controlled animal positive and
  has never been tested in a human; the thermal half is dissociated from the delivery half by the paper that
  looked. The largest modifiable term in the layer is a SUBTRACTION - hours of sustained static compression
  - and the single cheapest way to settle the whole arm is to obtain the height data that 940 already-dosed
  children generated and nobody analysed.
