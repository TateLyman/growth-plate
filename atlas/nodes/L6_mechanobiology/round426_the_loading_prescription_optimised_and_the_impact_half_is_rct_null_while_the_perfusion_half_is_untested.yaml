  proximal tibial and distal femoral physes for the mechanical and delivery arms; vertebral endplate physes
  for the duty-cycle argument, where the human partition between disc deformation and physeal stress has
  never been measured
human_evidence: direct
human_evidence_note: >-
  The randomised jumping trials, the ground-reaction-force dose table, the human growth-plate loading
  transcriptome, the gymnast wrist series and the finite-element physeal stress work are human. The
  stress-growth coefficient, the duty-cycle result, the positive dynamic-loading length endpoint, the
  unloading nulls and the entire solute-delivery arm are rodent.
