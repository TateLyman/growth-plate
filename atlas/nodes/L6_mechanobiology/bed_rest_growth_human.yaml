id: bed_rest_growth_human
name: Bed rest as a human unloading experiment
type: phenotype
summary: 'Head-down-tilt bed rest is the standard terrestrial analogue of microgravity and produces a
  well-characterised musculoskeletal deconditioning syndrome, but as an experiment on the growth plate
  it is essentially empty. All established bed rest protocols - 14, 30 and 60 day campaigns with artificial
  gravity, exercise and pharmacological countermeasures - are conducted in adults, whose physes are closed,
  so they measure bone loss and muscle atrophy rather than growth modulation. What bed rest does reliably
  show in adults is spinal lengthening: recumbency removes the axial load that compresses intervertebral
  discs, and stature rises, which is the same mechanism as overnight recovery of diurnal height loss.
  Bed rest in children is never elective and long-term recumbency in paediatric populations occurs only
  alongside serious illness, so no controlled paediatric bed-rest study with a height-velocity endpoint
  has been located. This node therefore exists mainly to mark a gap: the mechanically cleanest human unloading
  protocol has never been applied to a growing skeleton, and the entire human unloading evidence base
  for the physis rests on disease cohorts and on spaceflight anthropometry in adults.'
