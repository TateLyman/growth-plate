contradicts: >-
  WITHDRAWS THE CENTRAL CLAIM OF round252_the_block_is_extrinsic. That node states that Tsc1-null cartilage
  grows 52 per cent faster ex vivo and concludes that the block on growth is extrinsic to the plate. Figure
  2A shows the advantage is transient, so there is no standing headroom for an extrinsic block to suppress,
  and the discriminating experiment round 252 proposed is aimed at a quantity that does not exist. Round
  252 is left in place with this node attached because its other content - the in vivo null itself, the
  ambrosi2025 human stem cell arm, and the SAG21k plus DMH1 convergence - is unaffected. CORR-262. This node
  ALSO closes the "free but internally contradictory" flag the ledger has carried on the mechanical term,
  by showing the contradiction was between two terms of opposite sign rather than within one.
