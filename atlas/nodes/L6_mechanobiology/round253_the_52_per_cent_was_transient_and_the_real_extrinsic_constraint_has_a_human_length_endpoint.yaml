id: round253_the_52_per_cent_was_transient_and_the_real_extrinsic_constraint_has_a_human_length_endpoint
name: >-
  ROUND 253 - the 52 per cent is a one-off burst, not a rate, so round 252's extrinsic block is WITHDRAWN.
  What the exhaustive search of the extrinsic term actually returns is a resolved sign on the mechanical
  arm and ONE constraint with a human length endpoint - periosteal release, which buys about a centimetre
  and whose mechanism is not a tether but a hedgehog source
aliases:
- round 253
- the 52 per cent retraction
- what limits the plate from outside
- periosteal stripping and division
- brake versus ceiling
type: process
layer: L6
stub: false
summary: >-
  THE INSTRUCTION WAS TO FIND EVERYTHING THAT CONSTRAINS THE PLATE FROM OUTSIDE, AS DEEP AS IT GOES. The
  first thing the search found was that the number the search was built on is wrong, and it was wrong in
  this atlas rather than in the paper.

  ONE - THE RETRACTION. Round 252 read newton2018 as showing that Tsc1-null cartilage GROWS 52 PER CENT
  FASTER ex vivo and not at all in vivo, and concluded from the gap that the block on growth is extrinsic
  to the plate. The paper says the cKO metatarsals grew 52 per cent more IN THE FIRST 24 HOURS - 229 +/- 19
  against 150 +/- 13 micrometres - "and this growth increment was sustained over the culture period". Round
  252 read "increment sustained" as "rate sustained". It is not. Figure 2A plots CUMULATIVE growth in
  culture at day 2 and day 4 for control, heterozygote and cKO, and the figure was never opened. It has now
  been extracted from the Europe PMC package and digitised against its own axis ticks
  (atlas/tools/round253_newton2018_fig2A.py). DAY 2 - control 0.207, het 0.184, cKO 0.348 mm, so cKO is 68
  per cent ahead. DAY 4 - control 0.400, het 0.363, cKO 0.489 mm, so cKO is 22 per cent ahead. THE GROWTH
  THAT HAPPENED BETWEEN DAY 2 AND DAY 4 WAS 0.194 mm IN CONTROLS AND 0.141 mm IN THE cKO. The mutant's
  entire advantage is acquired in the first day or two and it then grows NO FASTER than control. A genuinely
  sustained 52 per cent would have put the day-4 cKO bar at 0.61 mm; it is 0.49 mm, and the published error
  bars are of order 0.02 to 0.03 mm. Recorded as CORR-262.

  WHAT SURVIVES OF newton2018 IS STILL WORTH HAVING, AND IT IS SMALLER. mTORC1 activation in chondrocytes
  produces a ONE-OFF elongation of about 79 micrometres on explanting, with NO change in Ki67 and NO change
  in collagen X at 24 hours, and then nothing. A length change with no proliferation change and no
  hypertrophy change, complete within a day, is not a growth-rate phenotype. THIS ATLAS DOES NOT KNOW WHAT
  IT IS. Matrix swelling on release, a transient synthetic burst on transfer to rich medium, and a real but
  self-limiting rate change are all consistent with what is reported, and newton2018 measured none of the
  quantities that would separate them. What can be said is what the paper itself says - that Tsc1 ablation
  in cartilage gives no length in vivo, a trend toward SHORTER tibiae, and a disordered resting zone.

  AND THE CONSEQUENCE FOR ROUND 252. There is no 52 per cent of standing headroom, so there is nothing for
  an extrinsic block to be suppressing, and the discriminating experiment round 252 proposed - culture the
  explant under load, under physiological oxygen, in same-age serum, and see which one costs the 52 per cent
  back - is chasing a quantity that does not exist. Round 252's OTHER legs are untouched: arm3's body-wide
  senescence counter, round 201's explant reactivation, and the in vivo null itself.

  TWO - THE DISTINCTION THAT THE SEARCH ACTUALLY YIELDED, AND IT IS THE USEFUL PART. A BRAKE and a CEILING
  are different objects and they need different experiments. A BRAKE holds a normal plate below its own
  capacity; release it and a normal animal grows faster. A CEILING caps output however hard the machinery
  pushes; it is invisible until something pushes, and it shows up as a drive that works in a dish and
  vanishes in a body. THE ATLAS HAS BEEN LOOKING FOR A BRAKE. The brake test has now been run three ways and
  it is negative every time. sibonga2000 measured longitudinal growth rate by fluorochrome labelling across
  FOUR spaceflight experiments and TWO ground unloading models - hindlimb elevation and unilateral sciatic
  neurotomy - and found that skeletal unloading GENERALLY DID NOT AFFECT longitudinal growth rate,
  regardless of age, strain, sex, duration or method, with one exception in slow-growing ovariectomised
  rats where it was 34 per cent SUPPRESSED. caetanosilva2021 reports that E17 metatarsals in ordinary
  culture grow at about FIFTY PER CENT of the in vivo rate - taking the bone out of the body makes it grow
  slower, not faster. And the human unloading experiments this atlas already holds - spaceflight
  anthropometry and bed rest - lengthen the spine by disc decompression and do nothing to a physis.
  REMOVING THE BODY DOES NOT RELEASE THE PLATE.

  THREE - THE MECHANICAL TERM'S SIGN, WHICH THE LEDGER HAS CARRIED AS "FREE BUT INTERNALLY CONTRADICTORY"
  SINCE ROUND 205, IS NOW RESOLVED, AND THE RESOLUTION IS THAT THERE ARE TWO TERMS OF OPPOSITE SIGN.
  STATIC compression restrains. caetanosilva2021 delivered quasi-static compressive strain of about 2 per
  cent per day through a hydrogel and almost completely arrested longitudinal expansion of mouse metatarsals
  over 14 days, with Col2 and Acan down at day 7 and an S-G2/M arrest; BOTH rapamycin and leucine partially
  reversed it, which the authors read as mTOR compensating across its two complexes rather than as a
  directional mTOR requirement, and which removes the apparent sign conflict with newton2018. DYNAMIC
  loading accelerates. mcgarry2024 applied cyclical, biologically relevant strain to ONE tibia of juvenile
  mice for four weeks with the contralateral tibia as internal control: the loaded tibiae grew
  significantly MORE, their growth plates were taller and larger in area, and in females PTHrP expression
  was HIGHER in the loaded plates, with no change in bone volume fraction. REMOVING BOTH TERMS AT ONCE
  CANCELS, WHICH IS EXACTLY WHAT sibonga2000 MEASURED. This is a reconciliation, not a smoothing: three
  independent designs, two of them internally controlled, and the classical Hueter-Volkmann statement that
  static compression slows and static tension accelerates longitudinal growth.

  THE TWO DISSENTS ARE RECORDED RATHER THAN ABSORBED. park2012 unloaded rat hindlimbs by tail suspension for
  three weeks and found growth plate length and chondrocyte proliferation DECREASED, reversing on reloading -
  which agrees with mcgarry2024 that load is positive but disagrees with sibonga2000's null. akyuz2006
  loaded rat caudal vertebrae asymmetrically at 55 per cent body weight and found DYNAMIC loading produced a
  LARGER wedge deformity than static, with longitudinal growth in BOTH loaded groups significantly LESS than
  in unloaded controls - so "dynamic is growth-promoting" does not generalise from axial mild strain to
  asymmetric loading at half body weight. The safe statement is that the sign of the mechanical term is set
  by the loading regime and not by the presence of load, and that no regime has been shown to raise growth
  in a human.

  FOUR - AND THE ONE EXTRINSIC CONSTRAINT IN THIS ENTIRE SEARCH THAT HAS A HUMAN LENGTH ENDPOINT. The
  periosteum. warrell1979 made vertical or circumferential periosteal incisions over ONE rat tibia, with
  localised stripping in two groups, and measured tibial lengths at five weeks: circumferential periosteal
  DIVISION plus periosteal ELEVATION produced the greatest ipsilateral increase in length, and the alignment
  of cortical blood vessels in that group showed the periosteum had SLID - a released tension. kitta2024
  took that into humans: ten children with leg length discrepancy after proximal femoral osteotomy for
  Perthes disease had periosteal stripping and division of the short femur, six who declined served as
  controls, and at a mean 4.3 years the treated group's discrepancy had closed by a mean 13.9 mm against
  3.2 mm in the controls. THAT IS ABOUT A CENTIMETRE OF EXTRA LENGTH IN A HUMAN FEMUR FROM RELEASING A SOFT
  TISSUE. It is also the sharpest age warning in the atlas: correction correlated NEGATIVELY with age at
  surgery and the ROC cutoff for gaining more than 10 mm was 9.6 YEARS. Mean age in the treated group was
  9.4.

  FIVE - AND THE MECHANISM IS NOT WHAT THE OPERATION'S NAME IMPLIES, WHICH IS WHY IT MATTERS HERE.
  chaudhary2016 set out to confirm the tether and refuted it. Second-harmonic-generation imaging of
  periosteum ON THE BONE in 30 rabbits showed that the periosteal fibres adjacent to the physis are NOT
  aligned - not under tension - in the growing limb, and that their alignment is UNCHANGED by metaphyseal
  periosteal resection. The authors state plainly that this calls the long-accepted mechanical-tether role
  into question. What the same paper DID find is that stretching periosteal strips raised relative mRNA for
  Ihh, PTHrP, Gli AND Patched. THE PERIOSTEUM IS NOT A STRAP. IT IS A STRAIN-DRIVEN HEDGEHOG AND PTHrP
  SOURCE SITTING IMMEDIATELY OUTSIDE THE PLATE. Cutting it out is therefore a LOCAL HEDGEHOG WITHDRAWAL, and
  round 251 established hedgehog withdrawal as the missing second signal that converts an expanded resting
  pool into columnar output - the vismodegib result that forced Tsc1 clusters to differentiate. An operation
  that has been performed on children for forty years may be doing the second step of the two-step protocol
  this atlas derived from mouse genetics. THIS IS AN INFERENCE AND IT IS ENTERED AS ONE: chaudhary2016
  measured periosteal transcript levels in a bioreactor, not hedgehog signalling in the physis, and nobody
  has measured Gli1 or Ptch1 in a growth plate before and after periosteal resection. That is the decisive
  experiment and it is cheap.

  SIX - WHAT THE SEARCH DID NOT FIND, STATED SO IT IS NOT SEARCHED AGAIN. No heterochronic parabiosis, young
  plasma or age-matched serum experiment with a growth plate or metatarsal length endpoint exists. No
  explant study varies oxygen tension with a length readout. No controlled paediatric unloading protocol
  exists. And the delivery arm of the extrinsic term was already fully mapped by this atlas in
  local_limb_warming_is_a_free_delivery_and_growth_lever and the_plate_is_advection_fed_not_diffusion_limited -
  it was not re-derived here, and its verdict stands: temperature raises solute entry and lengthens the
  treated limb by about 1.5 per cent in mice, it acts partly directly on cartilage rather than only through
  delivery, and serrat2013 shows the responsiveness closes with the window of rapid growth, which our
  subject is past.
quantitative:
- parameter: >-
    NEWTON 2018 FIGURE 2A DIGITISED - CUMULATIVE GROWTH IN CULTURE, AND THE 52 PER CENT DOES NOT PERSIST
  value: >-
    day 2 - control 0.207, het 0.184, cKO 0.348 mm; day 4 - control 0.400, het 0.363, cKO 0.489 mm.
    Growth BETWEEN day 2 and day 4 - control 0.194, het 0.179, cKO 0.141 mm
  unit: mm of cumulative elongation in culture
  conditions: >-
    Metatarsals from THREE-DAY-OLD Col2-Cre:Tsc1 fl/fl mice cultured six days ex vivo; n = 12 control, 7
    het, 7 cKO at each timepoint. Figure gr2.jpg taken from the Europe PMC supplementaryFiles package for
    PMC6020113 (CC BY) and digitised by atlas/tools/round253_newton2018_fig2A.py. The y-axis was calibrated
    from its own five tick marks, found at 61.5, 115.5, 169.5, 222.5 and 276.5 px - even to 0.43 px - giving
    268.75 px per mm. Bar tops were taken as the highest row at which more than 85 per cent of the bar's
    interior width is bar-coloured, searched only below y = 145 so the significance annotation lines cannot
    be mistaken for an edge.
  species: mouse
  source_ref: newton2018
  uncertainty: >-
    FIGURE READ, so bar tops carry about +/- 2 px, which is +/- 0.007 mm - smaller than the 0.052 mm
    difference between the control and cKO day2-to-day4 increments, but NOT smaller than the paper's own
    SEMs of roughly 0.02 to 0.03 mm. THE CLAIM THIS SUPPORTS IS THE ABSENCE OF A SUSTAINED ADVANTAGE, NOT
    THE PRESENCE OF A SUSTAINED DISADVANTAGE. A sustained 52 per cent would have put day-4 cKO at 0.608 mm
    against a measured 0.489, a shortfall of 0.119 mm or four to six SEMs, which is why the absence is
    safe. The heterozygote is indistinguishable from control at both timepoints, so there is no gene-dose
    relationship either.
- parameter: >-
    THE BRAKE TEST IN VIVO - UNLOADING DOES NOT MAKE A NORMAL ANIMAL GROW LONGER
  value: >-
    no significant effect of skeletal unloading on longitudinal growth rate in any arm, with one exception
    of 34 per cent SUPPRESSION
  unit: longitudinal growth rate, tibia
  conditions: >-
    sibonga2000. Fluorochrome labelling in rat tibia across four spaceflight experiments (Physiological
    Space Experiments 1, 3 and 4 and Physiological-Anatomical Rodent Experiment 3) plus two ground models of
    skeletal unloading - hindlimb elevation and unilateral sciatic neurotomy. The null held regardless of
    age, strain, gender, duration of unloading or method of unloading. The single exception was
    slow-growing OVARIECTOMISED rats unloaded eight days by hindlimb elevation, where growth rate fell 34
    per cent. An 11-day spaceflight lowered type II collagen mRNA 33 per cent and aggrecan 53 per cent.
  species: rat
  source_ref: sibonga2000
  uncertainty: >-
    ABSTRACT-LEVEL, and the per-experiment n values, the exact ages and the variance are not recoverable
    from it - so this is a null read from a summary rather than from a table, and it is a null across
    heterogeneous experiments rather than one well-powered comparison. park2012 DISSENTS: tail-suspension
    unloading for three weeks DECREASED growth plate length and chondrocyte proliferation in 6-week-old
    Sprague-Dawley rats, n = 6 per group, reversing on reloading. Both cannot be exactly right. What they
    agree on is the direction that matters here - neither found unloading to INCREASE longitudinal growth.
- parameter: >-
    THE DYNAMIC-LOAD ARM, INTERNALLY CONTROLLED, AND IT LANDS ON PTHrP
  value: >-
    loaded tibia grew significantly more than the contralateral unloaded tibia; growth plate height and area
    greater on the loaded side; PTHrP expression higher in loaded plates in females; no difference in bone
    volume fraction or trabecular bone volume
  unit: tibial length, growth plate height and area, PTHrP expression
  conditions: >-
    mcgarry2024. Cyclical, biologically relevant strains applied to ONE tibia of juvenile mice for four
    weeks, contralateral tibia as internal control, mild-to-moderate strain magnitude, microCT plus
    histomorphometry.
  species: mouse
  source_ref: mcgarry2024
  uncertainty: >-
    ABSTRACT-LEVEL - no effect sizes, no n, and no strain magnitude in figures are available from it, so the
    MAGNITUDE of the growth gain is unknown and only its sign and significance are held. The PTHrP result is
    reported for FEMALE mice specifically, which the abstract does not explain. AND akyuz2006 QUALIFIES THE
    GENERALISATION: asymmetric dynamic loading of rat caudal vertebrae at 55 per cent body weight produced a
    LARGER wedge deformity than static loading and lower longitudinal growth than unloaded controls in both
    loaded groups, so dynamic loading is not growth-promoting at every magnitude or geometry.
- parameter: >-
    THE STATIC-LOAD ARM, WITH THE STRAIN DOSE STATED
  value: >-
    control 2.32 +/- 0.36 against hydrogel 1.62 +/- 0.37 mm total length at day 14 - an almost complete
    arrest of longitudinal expansion - at an imposed quasi-static compressive strain of about 30.4 per cent
    over 14 days, equivalent to about 2 per cent per day or about 900 microstrain per hz
  unit: mm total metatarsal length at day 14, and imposed strain
  conditions: >-
    caetanosilva2021, full text read. E17 mouse metatarsals in VitroGel3D at 1:1; starting length about 1500
    micrometres; ordinary culture gives about 40 per cent length increase over 14 days, about 3 per cent per
    day or 45 micrometres per day. Dilution series 1:1 to 1:300 gave full arrest to 1:20 and a sharp
    recovery at 1:50, which the authors argue makes the effect mechanical rather than diffusional. Col2 and
    Acan fell at day 7 with an S-G2/M arrest. BOTH rapamycin (100 nM) and leucine (10 mM) partially reversed
    the arrest; neither betulinic acid nor SC-514 did; and none of the four changed growth under basal
    unloaded conditions.
  species: mouse
  source_ref: caetanosilva2021
  uncertainty: >-
    EMBRYONIC metatarsals with no secondary ossification centre, and a hydrogel is a confining matrix rather
    than a physiological axial load, so the strain figure is a derived equivalent and not a measured tissue
    stress. THE MOST IMPORTANT NUMBER IN THIS PAPER FOR ROUND 253 IS INCIDENTAL TO IT - the authors report
    that ex vivo metatarsals grow at about FIFTY PER CENT of the in vivo rate, which is the direct
    refutation of the idea that explanting releases a brake.
- parameter: >-
    PERIOSTEAL STRIPPING AND DIVISION IN CHILDREN - THE ONLY HUMAN LENGTH ENDPOINT IN THIS SEARCH
  value: >-
    leg length discrepancy closed by a mean 13.9 mm in the treated group against 3.2 mm in controls; ROC
    cutoff for gaining more than 10 mm was 9.6 years of age
  unit: mm of leg length discrepancy correction
  conditions: >-
    kitta2024. Retrospective cohort. Ten children treated with periosteal stripping and periosteal division
    of the short femur at implant removal after proximal femoral intertrochanteric osteotomy for Perthes
    disease, mean age 9.4 years, mean baseline discrepancy 20.5 +/- 4.6 mm, mean follow-up 4.3 years;
    against six who declined the procedure, mean age 10.2 years, mean baseline discrepancy 11.5 +/- 10.0 mm,
    mean follow-up 5.4 years. Lengths measured on full-length standing radiographs. Age at surgery was a
    significant predictor of achieving more than 10 mm by logistic regression.
  species: human
  source_ref: kitta2024
  uncertainty: >-
    RETROSPECTIVE, NOT RANDOMISED, n = 10 AGAINST 6, AND THE GROUPS ARE NOT COMPARABLE AT BASELINE - the
    treated group started with nearly twice the discrepancy (20.5 against 11.5 mm), so regression to the
    mean and a larger available deficit both favour the treated group, and the control group had less room
    to correct. Follow-up differs by a year. These are children with Perthes disease and a prior femoral
    osteotomy, so the growth being released is CATCH-UP in a previously injured limb, not elevation above
    normal - which is the CORR-203 distinction and it applies with full force. The warrell1979 rat arm is
    the internally controlled version and it is a five-week study in one species from 1979.
- parameter: >-
    THE TETHER MECHANISM TESTED DIRECTLY AND REFUTED, WITH A HEDGEHOG SOURCE FOUND INSTEAD
  value: >-
    periosteal fibres adjacent to the physis are NOT aligned in the growing limb and their alignment is
    UNCHANGED by metaphyseal periosteal resection; stretching resected strips DOES align them (p<0.0001) and
    DOES raise relative mRNA for Ihh, PTHrP, Gli and Patched
  unit: collagen fibre alignment by second-harmonic generation, and relative mRNA
  conditions: >-
    chaudhary2016. 30 seven-week-old New Zealand White rabbits. Periosteum imaged on the bone at five
    regions before and after 1 cm proximal tibial metaphyseal periosteal resection (six tibiae for the
    before-and-after comparison); resected strips stretched in a materials testing system, fixed and imaged,
    alignment computed with CurveAlign; separate strips loaded at physiological strains in a bioreactor for
    the transcript panel. One-way ANOVA throughout.
  species: rabbit
  source_ref: chaudhary2016
  uncertainty: >-
    THE NEGATIVE IS THE STRONGER HALF. Fibre alignment is a proxy for tension and an unaligned fibre
    population can still transmit load, so "not under tension" is an inference from imaging rather than a
    stress measurement. THE POSITIVE IS THE WEAKER HALF AND IT IS THE ONE THIS NODE BUILDS ON: the
    Ihh/PTHrP/Gli/Ptch induction is transcript level, in ISOLATED STRIPS IN A BIOREACTOR, with no
    measurement of ligand reaching the physis and no measurement of physeal hedgehog signalling before or
    after resection. The link from periosteal resection to physeal hedgehog withdrawal is UNMEASURED.
localization:
- 'mouse metatarsal explant from P3 animals: where the transient mTORC1 elongation happens'
- 'mouse and rat tibia in vivo: where unloading does nothing and cyclical loading adds length'
- 'rabbit proximal tibial metaphyseal periosteum: where the strain-driven Ihh/PTHrP/Gli/Ptch transcripts sit'
- 'human femur: where periosteal stripping and division closes a leg length discrepancy'
human_evidence: direct
human_evidence_note: >-
  kitta2024 is a human cohort with a radiographic length endpoint, which no other arm of this search has. It
  is retrospective, n = 10 against 6, baseline-imbalanced, and in children with a prior femoral osteotomy
  for Perthes disease. Every mechanistic statement in this node is animal.
species_basis:
- human
- mouse
- rat
- rabbit
translation_risk: high
translation_risk_reason: >-
  The one human result is a catch-up correction in an injured limb in children with a mean age of 9.4 years,
  and the paper's own ROC analysis puts the age cutoff for a meaningful gain at 9.6 years. The subject of
  this atlas is at bone age 16. Nothing here has been shown to add length to a skeletally mature or nearly
  mature human, and the mechanism that would make it plausible - periosteal resection as local hedgehog
  withdrawal - is an inference across two papers in two species.
confidence: C
confidence_reason: >-
  The figure digitisation is a direct measurement of a published figure and the retraction it forces is
  secure - graded on its own below. The mechanical sign resolution rests on four animal studies that
  partially disagree with each other, which is why it is C and not B. The periosteal arm has one human
  cohort of ten and one rat study from 1979. The hedgehog-withdrawal interpretation is speculative and is
  carried as such.
claim_grades:
- claim: >-
    Tsc1-null metatarsals have a SUSTAINED 52 per cent growth rate advantage ex vivo.
  grade: X
  basis: >-
    NO. Figure 2A of newton2018, digitised here, shows the cKO 68 per cent ahead at day 2 and 22 per cent
    ahead at day 4, with LESS growth than control between those two timepoints. The advantage is a one-off
    offset of about 79 micrometres acquired in the first 24 hours. Round 252 asserted the sustained reading
    and it is withdrawn - CORR-262.
- claim: >-
    Removing a limb bone from the body releases a brake and lets it grow faster.
  grade: X
  basis: >-
    NO. caetanosilva2021 reports ex vivo metatarsal growth at about 50 per cent of the in vivo rate, and
    sibonga2000 finds no change in longitudinal growth rate under spaceflight, hindlimb elevation or sciatic
    neurotomy across age, strain, sex, duration and method. Explanting and unloading both fail the brake
    test.
- claim: >-
    The sign of the mechanical term on longitudinal growth is set by the loading regime, with quasi-static
    compression restraining and cyclical axial loading accelerating.
  grade: C
  basis: >-
    caetanosilva2021 for the static arm (mouse, ex vivo, strain dose stated, dilution series as an internal
    control), mcgarry2024 for the dynamic arm (mouse, in vivo, contralateral control), and Hueter-Volkmann
    as the classical statement. Held at C because both are single studies in one species, because
    akyuz2006 shows dynamic asymmetric loading SUPPRESSING growth, and because park2012 and sibonga2000
    disagree with each other on what unloading does.
- claim: >-
    Periosteal stripping and division increases the length of the treated bone.
  grade: C
  basis: >-
    warrell1979 in rat with the contralateral tibia as control, and kitta2024 in ten children against six
    declining controls with radiographic endpoints at 4.3 years. Not B, because kitta2024 is retrospective
    with a large baseline imbalance in the direction that favours the treated group, and because the setting
    is catch-up after injury rather than elevation above normal.
- claim: >-
    The periosteum restrains growth by acting as a mechanical tether across the physis.
  grade: X
  basis: >-
    chaudhary2016 tested exactly this and found periosteal fibres adjacent to the physis are not aligned in
    the growing limb and do not change alignment after resection, and states that its results call the
    long-accepted tether role into question.
- claim: >-
    Periosteal resection accelerates growth because it withdraws a strain-driven hedgehog and PTHrP source
    sitting outside the plate, which is the same second signal round 251 identified.
  grade: E
  basis: >-
    INFERENCE, NOT MEASUREMENT. chaudhary2016 shows strain raises Ihh, PTHrP, Gli and Patched transcripts in
    isolated periosteal strips in a bioreactor. Nobody has measured hedgehog pathway activity in a growth
    plate before and after periosteal resection, and nobody has shown periosteal Ihh reaching the physis.
    Entered as a hypothesised link with a gap, and the decisive experiment is named.
