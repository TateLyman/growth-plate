id: round319_the_trunk_has_two_modifiable_components_and_the_atlas_only_ever_modelled_one
name: ROUND 319 - sitting height is NOT only growth plates. It is vertebral bone PLUS intervertebral disc, the disc
  is about a quarter of the spinal column, it is not limited by fusion, and this atlas has recorded its 19.3 mm
  daily swing as a MEASUREMENT ARTEFACT for the whole project. Four hours of hyper-buoyancy flotation adds 1.6 cm
  of stature. And the vertebral ring apophysis - the growth centre that closes LAST - reaches maturity at a median
  of about 22 years in males
aliases:
- round 319
- the disc is a compartment
- sitting height is two components
- hyper-buoyancy flotation
- ring apophysis closes last
- diurnal is a lever not noise
type: hypothesis
layer: L6
stub: false
summary: "MINUS ONE - WHAT WAS ALREADY HERE, SAID FIRST (CORR-313/336 again). THREE of the four papers below were\
  \ ALREADY in this bibliography before this round: `ekizoglu2026` since 2026-08-07 with its finding already headed\
  \ \"THE SPINE RESERVE MEASUREMENT EXISTS AND IT IS IN FORENSIC MEDICINE\" and the ~22-year median already recorded;\
  \ `halanski2026` since 2026-08-05 with the 53%-to-converged tethering numbers already recorded; `veres2026` since\
  \ 2026-08-05. **Only `marcoslorenzo2026`, the flotation result, is new.** What this round contributes is NOT those\
  \ findings but the SYNTHESIS - that sitting height has a second, fusion-independent component the atlas never\
  \ modelled, and that its own diurnal node has been filing that component's numbers under measurement error. Credit\
  \ where it is due, and a fourth instance of this file already holding what I was about to present as new.\n\n\
  ZERO - THE REFRAME. Round 318 established that the trunk is where this subject's remaining\ncentimetres are, and\
  \ that HHIP and TET1 are the trunk-directed targets. But the whole atlas models sitting\nheight as though it were\
  \ produced by one tissue - the vertebral growth plate. It is not. **Sitting height is\nvertebral BONE plus intervertebral\
  \ DISC**, the discs are roughly a quarter of the spinal column's height,\nand disc height is set by osmotic swelling\
  \ against load rather than by chondrocyte production. **The atlas\nalready holds the disc's numbers and files\
  \ them under measurement error.** `diurnal_stature_variation` opens\nby saying the effect is \"large enough to\
  \ corrupt growth monitoring\" and closes on how to avoid being fooled\nby it. Nobody asked whether it is a lever.\n\
  \nONE - ⭐ THE NUMBER THAT REFRAMES IT: FOUR HOURS OF FLOTATION ADDS 1.6 cm OF STATURE.\n`marcoslorenzo2026` (hyper-buoyancy\
  \ flotation, 12 healthy adults, cervical spine MRI + stadiometry):\n· **4 h supine hyper-buoyancy flotation: stature\
  \ +1.6 +/- 0.5 cm.**\n· **15 min of upright 1 g reversed only -0.4 +/- 0.3 cm** - about a quarter - leaving ~1.2\
  \ cm still present.\n· **Cervical intervertebral disc height increased at EVERY level** C3-T1, with partial reversal.\n\
  · ⭐ **Passive vertebral stiffness fell across the ENTIRE column and REMAINED BELOW BASELINE after reloading.**\n\
  · ✗ Muscle cross-sectional area and thickness unchanged - so it is not a soft-tissue artefact.\n· ⛔ Neck pain\
  \ increased during flotation, and correlated with mid-cervical stiffness.\nAgainst the atlas's own existing figures:\
  \ adult circadian stature variation **19.3 mm (1.1% of stature)**,\n54% of it lost within the FIRST HOUR after\
  \ rising and ~70% regained in the first half of the night; in\n12-14 year old boys 4.6 mm lost between 10:00 and\
  \ 17:00 with **sitting height falling 2.8 mm**; in children\nwith idiopathic scoliosis **7 mm of SITTING height\
  \ (0.79%) between morning and evening.**\n⭐ **AND THE LOAD-DEPENDENCE IS ALREADY QUANTIFIED HERE: static shoulder\
  \ loads from 2.5 to 40 kg increased\nshrinkage rate NONLINEARLY, and REPETITIVE LIFTING PRODUCED MORE SHRINKAGE\
  \ THAN THE EQUIVALENT STATIC LOAD.**\nThe disc creeps faster under cyclic than sustained loading - explicitly\
  \ the opposite ordering to what static\ncompression does to the growth plate.\n\nTWO - ⭐ THE VERTEBRAL GROWTH\
  \ CENTRE CLOSES LAST, AND THERE IS NOW A NUMBER FOR IT.\n`ekizoglu2026`, MRI of cervical ring apophysis maturation\
  \ in **1,000 individuals aged 9.6-26.7 years**:\n· **Median age at stage 4 (mature) is approximately 22 YEARS\
  \ IN MALES.**\n· **Stage 3 persists into the THIRD DECADE.**\n· At stage 4 the probability of being at least 21\
  \ is only 0.65-0.70 in males - i.e. the marker saturates well\n  after 21.\n=> This puts a hard figure under what\
  \ CLAUDE.md already asserted from `hori2025` - spine growth peaks LATER\nthan total body growth - and under R274's\
  \ population split, where at bone age 14.5 the knees are worth\n0.3-0.4 cm and the trunk 6.5-9.0 cm. **At bone\
  \ age 16 with the knees closing, the axial growth centres are\nthe ones with years left.**\n⚠ **Do not overread\
  \ it.** Ring apophysis maturation is the peripheral RIM and is a maturity MARKER; vertebral\nbody height is produced\
  \ by the endplate physes, and this study is CERVICAL, not lumbar or thoracic. It is\nevidence that the axial skeleton\
  \ matures late, not a measurement of remaining vertebral growth.\n\nTHREE - ⚠ MECHANICAL MODULATION OF VERTEBRAL\
  \ GROWTH IS REAL, LARGE, AND TRANSITORY.\n`halanski2026` (posterior vertebral body tethering, kyphotic porcine\
  \ model, fluorochrome-labelled regional growth\nrates): high-tension tethering gave **53 +/- 43% growth modulation\
  \ at 2 weeks versus -1 +/- 15% at low\ntension** - a big Hueter-Volkmann effect. ⛔ **But by 2-4 weeks the two\
  \ cohorts converged (14 +/- 11% vs\n10 +/- 10%) and the authors conclude that growth modulation becomes LOAD-INDEPENDENT\
  \ with time.** In the less\nflexible spine their model predicts growth is ARRESTED rather than modulated.\n⭐ **One\
  \ line in that paper matters for the disc argument: finite-element analysis predicted that growth-plate\nstress\
  \ distributions WORSEN as average disc height is DECREASED.** A taller disc mechanically protects the\nvertebral\
  \ growth plate - which links the two components rather than leaving them independent.\n\nFOUR - ⛔ THE COST, AND\
  \ IT IS NOT SMALL. Chronic axial unloading is not free height.\n`veres2026`: mechanical unloading in spaceflight\
  \ produces a very high incidence of chronic back pain\nand **general degradation of every tissue of the spinal\
  \ column - bone, skeletal muscle, intervertebral disc\nand cartilage** - with elevated lumbar and cervical disc\
  \ herniation risk post-flight. The height that\nmicrogravity gives comes with disc degeneration and bone loss.\
  \ **The flotation study's own subjects developed\nneck pain within four hours.** Anything built on sustained unloading\
  \ has to be priced against this.\n⚠ And the one clinical study reporting sustained disc-height gain from posture\
  \ correction (+1.5 mm anterior,\n+1.15 mm posterior cervical disc height over ~19 weeks) is **uncontrolled, single-practice,\
  \ in ADULTS with\ndegenerative disc disease** - restoration in a deficit, CORR-203, and a proprietary method.\
  \ Not usable.\n\nFIVE - ⭐ WHAT IS ACTUALLY ACTIONABLE, SEPARATED HONESTLY INTO THE TWO THINGS IT COULD MEAN.\n\
  **(a) MEASUREMENT - free, immediate, and it dominates everything else.** The diurnal swing is up to ~2 cm of\n\
  stature and ~0.3-0.8% of SITTING height. **If height is being tracked to decide whether any arm of this stack\n\
  works, an unstandardised measurement time can hide or fabricate a centimetre of apparent annual growth** -\nthe\
  \ atlas's own words. Measure at a fixed time of day, ideally after a fixed period recumbent. This costs\nnothing\
  \ and without it every efficacy judgement in this project is noise-limited.\n**(b) LOAD - plausible, cheap, and\
  \ unproven for set-point.** The exposure-response is already quantified:\naxial load increases shrinkage nonlinearly\
  \ and CYCLIC loading costs more than static. Minimising axial\nimpact and cyclic spinal loading, and maximising\
  \ recumbency, moves the daily *oscillation* in the favourable\ndirection. ⛔ **What is NOT established is that\
  \ it moves the SET POINT** - the spaceflight data say sustained\nunloading degrades the disc, and the tethering\
  \ data say mechanical growth modulation becomes load-independent\nwithin weeks. **This is a lever on the daily\
  \ cycle, and possibly on vertebral growth via Hueter-Volkmann while\nthe endplates are open, but the durable component\
  \ is unmeasured in anyone.**\n\nSIX - ⭐ THE ONE MEASUREMENT THAT WOULD DECIDE THE WHOLE TRUNK QUESTION FOR THIS\
  \ SUBJECT.\nRound 318 says the trunk holds the remaining centimetres. R274 says the trunk is worth 6.5-9.0 cm\
  \ at bone\nage 14.5. This round says the axial growth centres close last. **None of that is his measured value.**\n\
  **What is needed is a SPINE film or MRI read for: vertebral ring apophysis stage, endplate physis status, and\n\
  individual disc heights.** That single image would say whether his axial compartment is actually open - the\n\
  one compartment worth targeting - and it is the same class of question BoneXpert answers for the hand. Every\n\
  trunk-directed conclusion in rounds 317, 318 and 319 is a population prior until that film exists."
human_evidence: direct
human_evidence_note: 'The disc results are human: 12 adults for hyper-buoyancy flotation with cervical MRI and stadiometry,
  and the atlas''s existing diurnal data in adults, in 12-14 year old boys and in children with idiopathic scoliosis.
  The ring apophysis maturation data are human, n=1,000, aged 9.6-26.7. The vertebral growth-modulation data are
  PORCINE. The spaceflight degeneration evidence is human but observational and confounded by everything else about
  spaceflight. Nothing here has been measured in this subject.'
species_basis: human
translation_risk: moderate
translation_risk_reason: 'MODERATE. The disc mechanics are human, directly measured, and the atlas already holds
  concordant numbers from three independent sources, so the existence and size of the effect are not in doubt. What
  is at risk is DURABILITY: every human number here is an acute or diurnal displacement, the one sustained-gain
  study is uncontrolled and in degenerative adult spines, and the spaceflight literature says sustained unloading
  degrades the tissue that produces the gain. The Hueter-Volkmann growth-modulation arm is porcine and explicitly
  transitory. Treat the measurement recommendation as solid and the load recommendation as plausible-but-unproven.'
confidence: B
confidence_reason: 'Graded B. That the disc is a large, load-dependent, non-fusion-limited component of sitting
  height is A - it is measured in humans by multiple methods and the atlas already carried the numbers. That four
  hours of flotation adds 1.6 cm is A within its own design. That the axial growth centres close latest is B, resting
  on a cervical marker in 1,000 people rather than on vertebral body heights. That any of this can be converted
  into DURABLE adult height is graded no higher than D and is explicitly not claimed: the sustained-gain evidence
  is one uncontrolled adult series, and the mechanical growth-modulation effect normalises within weeks in the only
  controlled model.'
limitations: The central unknown is whether the disc-height SET POINT can be moved, as opposed to the daily oscillation
  - no controlled study has moved mean disc height durably in a healthy growing person, and the flotation reversal
  was measured over 15 minutes of upright loading rather than a full day, while the atlas's own diurnal data say
  54% of daily loss occurs within the first hour of rising. Chronic unloading carries documented disc, bone, muscle
  and cartilage degeneration plus herniation risk. The flotation study is 12 adults, cervical spine only, mean age
  30. The ring apophysis data are cervical and are a maturity marker, not a measure of remaining vertebral body
  growth. The tethering result is porcine, is a COMPRESSION-side result being read in reverse, and normalises by
  2-4 weeks. The posture-correction series is uncontrolled, single-practice, adult and degenerative. None of it
  has been measured in this subject, and no disc-directed intervention anywhere has an adult-height endpoint.
