contradicts: 'This round does not overturn a conclusion; it adds a COMPARTMENT the atlas never modelled. Every prior
  round treated sitting height as the output of vertebral growth plates alone, and filed the disc''s 19.3 mm daily
  swing under measurement error - the atlas''s own diurnal node exists to stop that swing corrupting growth monitoring,
  and never asks whether it is a lever. It also sharpens round 318: the trunk is where the remaining centimetres
  are, and the trunk turns out to have a second, faster, fusion-independent component. What it explicitly does NOT
  claim is durable height from disc displacement - the sustained evidence is one uncontrolled adult series, the
  mechanical growth-modulation effect normalises within weeks in the only controlled model, and chronic unloading
  has a documented degenerative cost.'
