claim_grades:
- claim: Sitting height is produced only by vertebral growth plates.
  grade: X
  species: human
  source_ref: marcoslorenzo2026
  basis: NO, and the omission has shaped the whole project. Sitting height is vertebral BONE plus INTERVERTEBRAL
    DISC; the discs are roughly a quarter of the spinal column and their height is set osmotically against mechanical
    load, not by chondrocyte production, so it is NOT limited by physeal fusion. Four hours of hyper-buoyancy flotation
    raised stature by 1.6 +/- 0.5 cm with cervical disc height up at every level and muscle dimensions unchanged,
    and the atlas already held a 19.3 mm adult circadian swing - filed under measurement error rather than treated
    as a compartment.
- claim: The disc component can be converted into durable adult height.
  grade: D
  species: human
  source_ref: veres2026
  basis: 'NOT ESTABLISHED, and this is the honest ceiling of the round. Every human number here is an acute or diurnal
    displacement. The flotation reversal was measured over 15 minutes of upright loading, while the atlas''s own
    diurnal data say 54% of daily loss happens within the first hour of rising. Sustained unloading is not free:
    spaceflight produces degradation of bone, muscle, disc and cartilage with chronic back pain and elevated post-flight
    herniation risk, and the flotation subjects developed neck pain within four hours. The only report of sustained
    disc-height gain is uncontrolled, single-practice, in adults with degenerative disc disease - CORR-203. No disc-directed
    intervention anywhere has an adult-height endpoint.'
- claim: The axial growth centres are the ones with remaining time at bone age 16.
  grade: B
  species: human
  source_ref: ekizoglu2026
  basis: 'Cervical ring apophysis maturation in 1,000 people aged 9.6-26.7 gives a median age at stage 4 of about
    22 years in males, with stage 3 persisting into the third decade and only a 0.65-0.70 probability of being 21
    or older at stage 4. That puts a figure under hori2025''s finding that spine growth peaks later than total body
    growth, and under R274''s split of 0.3-0.4 cm at the knees against 6.5-9.0 cm in the trunk at bone age 14.5.
    GRADE B not A: the marker is cervical and peripheral, it indexes maturity rather than measuring vertebral body
    height, and none of it is this subject''s value.'
- claim: Standardising measurement time is optional.
  grade: X
  species: human
  source_ref: tyrrell1985
  basis: NO. The daily swing is up to ~2 cm of standing stature and 0.3-0.8% of SITTING height, against a measurement
    standard error of 1.8 mm in the paediatric cohort. In the atlas's own words, a single unrecorded measurement
    time can hide or fabricate a centimetre of apparent annual growth. Since every efficacy judgement about this
    stack rests on tracked height, this is the cheapest thing in the entire project and it gates everything else.
