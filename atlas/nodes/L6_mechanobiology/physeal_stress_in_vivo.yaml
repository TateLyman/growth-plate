id: physeal_stress_in_vivo
name: In vivo physeal stress
type: process
aliases:
- growth plate stress in vivo
- physeal loading magnitude
summary: 'Every quantitative claim in this layer is expressed per MPa of applied stress, and the value
  of that stress in a living human has never been measured. The animal stress-growth experiments impose
  known stress with an external apparatus, over a range of roughly 0.02-0.2 MPa, chosen for instrument
  convenience rather than because it matches physiological loading. The only human-facing numbers come
  from modelling: personalised finite element models of four human distal femoral epiphyses driven by
  instrumented gait analysis show that stress across the physis is markedly heterogeneous and geometry-dependent,
  that a tension-band plate imposes local static stress and abolishes cyclic loading at its insertion,
  and that tensile stress rises on the opposite side - but the authors are explicit that their models
  are not fully participant-specific in geometry and loading, so absolute values should not be quoted
  as measurements. Related FE work shows growth plate shape itself adapts to the local mechanical environment,
  so the geometry that determines stress is not a fixed input. Direct measurement is method-blocked: an
  implanted pressure transducer across a healthy child''s physis is not ethically available, and the alternatives
  (MRI-based strain mapping, dual-fluoroscopy kinematics driving subject-specific models validated against
  cadaveric measurement) have not been applied to a paediatric physis. This is the single largest missing
  number in the layer, because without it the animal sensitivity coefficient cannot be converted into
  a human prediction.'
