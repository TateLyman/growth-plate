id: spaceflight_microgravity_growth
name: Spaceflight, microgravity and growth
type: phenotype
summary: 'Astronauts get taller in orbit, but the gain is spinal unloading, not endochondral growth. Photogrammetric
  and tape anthropometry on nine ISS crew members showed a biphasic change: stature rose by up to 3% in
  the early flight phase, then plateaued for the remainder of the mission, and returned to preflight values
  after landing. Acromion height followed the same pattern, while chest, hip, thigh and calf circumferences
  fell by up to 11%. A 3% gain in an adult of 1.75 m is roughly 5 cm, several times the ~19 mm diurnal
  stature loss on Earth, consistent with removal of axial compression from the whole spine plus loss of
  the standing postural curves. Full reversibility on return, and the fact that these are adults with
  closed physes, rule out a growth plate contribution in this dataset. There is no human paediatric spaceflight,
  so the effect of microgravity on a growing physis is unmeasured in humans. The rodent literature provides
  the only direct evidence, showing spaceflight alters skeletal tissue including the spinal column, and
  simulated microgravity has been used experimentally to reverse PIEZO1-driven growth plate ossification
  in mice - which is a mechanistic argument that unloading acts on the physis, not a measurement of growth
  rate in flight.'
