id: integrin_beta1_chondrocyte
name: Integrin beta-1 (ITGB1) in growth plate chondrocytes
type: protein
aliases:
- ITGB1
- beta1 integrin
- CD29
summary: 'Integrin beta-1 is the growth plate''s principal cell-matrix adhesion receptor and, unusually
  for this layer, its growth-plate function has been tested directly rather than borrowed from articular
  cartilage. Live time-lapse confocal imaging of mouse cranial base explants with conditional Itgb1 deletion
  shows that column formation fails: the 90-degree rotation by which a daughter chondrocyte aligns with
  the long axis of the bone is integrin beta-1-driven. Conditional deletion of the cell-cell adhesion
  molecule Cdh2 (N-cadherin) also disrupts column formation, but the compound mutant resolves the hierarchy
  - defective rotation in the N-cadherin mutant is rescued by heterozygous loss of Itgb1, so N-cadherin
  acts as a negative regulator of integrin beta-1 rather than as a parallel driver. Because a column is
  the structural unit of longitudinal growth, this places integrin beta-1 upstream of growth plate architecture
  itself. Integrin beta-1 is also a load-transducing receptor: mechanical loading of chondrocytes activates
  beta-1 integrins and FGFR, and the two target distinct, non-overlapping mechano-response gene sets.
  The integrin''s ligand environment is itself mechanically tuned, since the chondron pericellular matrix
  through which load reaches the cell surface is built and remodelled in a mechanoresponsive way. No human
  growth plate integrin beta-1 perturbation data exist.'
quantitative: []
localization:
