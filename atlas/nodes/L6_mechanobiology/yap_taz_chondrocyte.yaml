id: yap_taz_chondrocyte
name: YAP/TAZ in growth plate chondrocytes
type: protein
aliases:
- YAP1
- WWTR1
- TAZ
- Hippo effectors
summary: 'YAP and TAZ are the canonical stiffness- and tension-responsive transcriptional co-activators,
  shuttling to the nucleus when cytoskeletal tension is high. In skeletal tissue their best-documented
  in vivo mechanoregulatory role is not in the chondrocyte: YAP and TAZ in osteoblast precursors couple
  precursor mobilisation to angiogenesis and mechanoregulation during murine bone development. Within
  the endochondral lineage, Yap/Taz orchestrate chondrocyte differentiation fate in fibrocartilage, and
  substrate stiffness modulates hypertrophic chondrocyte reversion in culture, but neither establishes
  a load-dependent YAP/TAZ function in a growth plate. The one mechanically explicit endochondral result
  is from distraction osteogenesis, where cyclic distraction-compression promotes bone regeneration through
  a Piezo1-YAP-beta-catenin axis - a regenerate, not a physis. There is no chondrocyte-specific Yap1/Wwtr1
  deletion with a physeal loading challenge and a growth-rate readout, and no human growth plate YAP/TAZ
  localisation. This node is therefore held at low confidence deliberately: the pathway is highly plausible
  and widely asserted for the growth plate, and the specific experiment has not been done.'
