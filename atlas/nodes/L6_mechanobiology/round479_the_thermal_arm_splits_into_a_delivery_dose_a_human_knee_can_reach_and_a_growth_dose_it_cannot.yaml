id: round479_the_thermal_arm_splits_into_a_delivery_dose_a_human_knee_can_reach_and_a_growth_dose_it_cannot
name: >-
  R479 - the human knee cavity sits at 31-33 C and a hot pack moves it 1-3.5 C, so surface heating reaches
  serrat2014's DELIVERY temperature and cannot reach serrat2015's GROWTH temperature - and one modality can
aliases:
  - human knee intra-articular temperature
  - depth attenuation of surface heating
  - microwave hyperthermia with skin cooling
type: intervention
