species_basis: human, mouse
human_evidence: direct
human_evidence_note: >-
  Every temperature in this node except the mouse comparators is a direct in vivo human measurement by indwelling
  thermocouple, thermistor or intra-articular probe. What is absent from the human side is any growth endpoint.
translation_risk: moderate
translation_risk_reason: >-
  The temperatures are human and directly measured. The growth results they are being compared against are all
  mouse, from a single laboratory, and female-only.
summary: >-
  THE WARMING ARM HAS BEEN CARRIED IN THIS FILE AS FREE, NON-INVASIVE AND UNTESTED IN HUMANS, WITH ring1958's
  HUMAN NULL RECORDED IN R450 AND NEVER EXPLAINED. The human thermometry explains it, and it splits the arm in two.
  ONE - THE BASELINE. A resting normal human knee joint cavity sits at 31.4 to 32.8 C, about 4 to 5 C BELOW core,
  with the overlying skin 1 to 2 C below that again. That is horvath1949, four normal men aged 32 to 44, a
  thermocouple or thermistor threaded through a 19-gauge needle into the joint space, room at 24 C, reclining 30
  minutes. It replicates twice: becher2008 gives a median of 31.4 and 32.2 C in six healthy males with a probe in
  the notch of the right knee, and oosterveld1992 gives 31.9 and 32.9 C in 42 healthy subjects. Arthritic knees run
  3.5 C hotter at 35.5 to 35.8 C.
  TWO - HOW FAR SURFACE HEAT ACTUALLY GETS, MEASURED WITHIN ONE EXPERIMENT. draper1998, 21 humans, a silicate-gel
  hot pack from 75 C water for 15 minutes, indwelling thermistors in triceps surae: +3.8 C AT 1 cm AND +0.74 C AT
  3 cm. A FIVE-FOLD ATTENUATION OVER TWO CENTIMETRES. sawyer2003 gets +0.4 C at 2.54 cm and takes 20 to 25 minutes
  to get there. The knee joint is the favourable exception because it is shallow anteriorly - paraffin raised skin
  8.9 C and the joint cavity 3.5 C in healthy knees, the largest superficial-heat deep result in the literature -
  but only 1.7 C in arthritic knees, where the baseline is already higher.
  THREE - AND THAT IS THE DECOMPOSITION. serrat2014's DELIVERY result raised murine hindlimb temperature from 22 to
  34 C and increased growth-plate entry of a 10 kDa tracer by more than 150 per cent. serrat2015's GROWTH result
  used 40 C to one side of the body for 40 minutes a day for 14 days and gave femur +1.3 and tibia +1.5 per cent.
  IN A MOUSE A 40 C SURFACE IS A 40 C LIMB, BECAUSE THE LIMB IS MILLIMETRES THICK. IN A HUMAN, PARAFFIN AT ITS BEST
  TAKES A KNEE CAVITY FROM 31.9 TO ABOUT 35.4 C. SO SURFACE HEATING REACHES THE DELIVERY TEMPERATURE AND FALLS
  ROUGHLY 5 C SHORT OF THE GROWTH TEMPERATURE. serrat2014's own authors describe 22 to 34 C as a physiological
  range for a normal human knee, which is exactly the point: the delivery experiment was run inside the reachable
  band and the growth experiment was not. THAT IS A MECHANISTIC ACCOUNT OF ring1958's NULL - four children, 40 C
  maintained around the epiphysial zones at the knee, no influence on longitudinal growth - AND IT PREDICTS IT.
  FOUR - AND ONE MODALITY INVERTS THE CONSTRAINT, WHICH IS THE NEW THING IN THIS ROUND. weinberger1989mw: seven
  human rheumatoid knees, a 915 MHz microwave applicator WITH ACTIVE SKIN COOLING, one hour twice weekly for two
  weeks. INTRA-ARTICULAR TEMPERATURE 40.6 C AT 15 MINUTES, 41.2 AT 30 AND 41.3 AT ONE HOUR, WHILE THE SKIN OVER THE
  HEATED KNEE STAYED AT 24.3 C THROUGHOUT. No adverse reaction observed. The limiting tissue for every hot pack,
  paraffin bath and heating pad is the SKIN, and this deposits energy past it. n=7, single group, no sham, an
  arthritic population with a raised baseline, and no growth endpoint of any kind - but it is the only route found
  that puts a human knee at the temperature the mouse growth experiments used.
  FIVE - AND THE HONEST COMPARATOR IS NOT A HEATING MODALITY AT ALL. becher2008 measured six healthy human knees
  during 60 minutes of treadmill jogging: intra-articular temperature rose 6.1 C, from 31.4 to about 37.5 C, with
  +2.1, +4.0, +5.8 and +6.1 C at 15, 30, 45 and 60 minutes. EXERCISE BEATS EVERY SUPERFICIAL HEATING MODALITY IN
  THE LITERATURE BY ROUGHLY TWO-FOLD, and it is free. That reframes serrat2010's running-wheel result, which this
  file has read purely as a vascular delivery adaptation: a running human knee is also a warm human knee.
  SIX - THE SAFETY CEILING IS A PUBLISHED STANDARD AND IT SITS BELOW THE MOUSE PROTOCOL. EN ISO 13732-1 via CENELEC
  Guide 29 puts the skin burn threshold for prolonged contact at 43 C for 8 hours or longer, 48 C for 10 minutes
  and 51 C for 1 minute on metal, and directs that WATER be assessed against the metal column. serrat2015's 40 C is
  under that. But erythema ab igne is a documented cutaneous reaction to prolonged infrared heat AT TEMPERATURES
  INSUFFICIENT TO CAUSE A BURN, it is reported in adolescents from therapeutic heating pads, and a nationwide
  case-control analysis reports raised odds of basal cell and squamous cell carcinoma and melanoma at the affected
  site. No adverse SKELETAL effect of repeated limb heating has been reported in humans.
  WHAT IS STILL MISSING, AND THE FIRST ITEM IS STRUCTURAL. NOBODY HAS EVER MEASURED THE TEMPERATURE OF A HUMAN
  GROWTH PLATE, EPIPHYSIS OR METAPHYSIS IN VIVO, AT ANY AGE - searched six ways, and the entire human intraosseous
  thermometry literature is dental and orthopaedic drilling heat. There is no intra-articular knee temperature
  measurement in a child or adolescent, so the adult numbers above are being carried across an age gap. And no
  human study of any design has applied local limb heat and measured bone length, limb length or growth velocity.
quantitative:
  - parameter: resting intra-articular temperature, normal human knee
    value: 31.44 to 32.83
    unit: degrees C, four normal men aged 32-44, overlying skin 29.56 to 31.94
    species: human
    source_ref: horvath1949
    note: >-
      Thermocouple or thermistor through a 19-gauge needle into the joint space, room 24 C, reclining 30 minutes.
      Converted here from the paper's Fahrenheit. About 4 to 5 C below core.
  - parameter: resting intra-articular knee temperature, independent replications
    value: 31.4 and 32.2 (n=6); 31.9 and 32.9 (n=42)
    unit: degrees C, median and group means
    species: human
    source_ref: becher2008
    note: becher2008 and oosterveld1992. Three groups, three methods, 59 years apart, one answer.
  - parameter: depth attenuation of a hot pack, measured in one experiment
    value: +3.8 at 1 cm against +0.74 at 3 cm
    unit: degrees C, silicate-gel pack from 75 C water, 15 minutes, n=21
    species: human
    source_ref: draper1998
    note: A five-fold attenuation over two centimetres, in triceps surae with indwelling thermistors.
  - parameter: best superficial-heat result at a human knee joint cavity
    value: '+3.5'
    unit: degrees C intra-articular with skin +8.9, ligno-paraffin, 42 healthy subjects
    species: human
    source_ref: oosterveld1992
    note: >-
      Only +1.7 C in 39 arthritic knees at a 3.5 C higher baseline. Continuous short-wave diathermy gave only
      +1.4 C intra-articular.
  - parameter: intra-articular knee temperature under 915 MHz microwave with active skin cooling
    value: 40.6 / 41.2 / 41.3
    unit: degrees C at 15 / 30 / 60 minutes, WHILE SKIN STAYED AT 24.3 +/- 1.1 C
    species: human
    source_ref: weinberger1989mw
    note: >-
      Seven rheumatoid knees, one hour twice weekly for two weeks, no adverse reaction observed. The only modality
      found that reaches the mouse growth-experiment temperature inside a human knee. No sham, no growth endpoint.
  - parameter: intra-articular knee temperature after 60 minutes of jogging
    value: '+6.1'
    unit: degrees C, from 31.4, in six healthy males
    species: human
    source_ref: becher2008
    note: >-
      Roughly twice the best superficial heating result, and free. +2.1 / +4.0 / +5.8 / +6.1 C at 15/30/45/60 min.
  - parameter: temperature used by the mouse DELIVERY experiment
    value: 22 to 34
    unit: degrees C hindlimb, raising 10 kDa tracer entry to the growth plate by more than 150 per cent
    species: mouse
    source_ref: serrat2014
    note: >-
      Its authors describe this as a physiological range for a normal human knee, and the human thermometry above
      agrees. THIS BAND IS REACHABLE BY SURFACE HEATING IN A HUMAN.
  - parameter: temperature used by the mouse GROWTH experiment
    value: '40'
    unit: degrees C to one side of the body, 40 min/day for 14 days, giving femur +1.3 and tibia +1.5 per cent
    species: mouse
    source_ref: serrat2015
    note: >-
      In a millimetres-thick mouse limb a 40 C surface is a 40 C plate. In a human the same surface gives about
      35 C at the knee cavity. THIS BAND IS NOT REACHABLE BY SURFACE HEATING IN A HUMAN.
  - parameter: skin burn threshold for prolonged contact
    value: 43 (8 h and longer) / 48 (10 min) / 51 (1 min, metal)
    unit: degrees C, EN ISO 13732-1:2006 via CENELEC Guide 29
    species: human
    source_ref: horvath1949
    note: >-
      The standard directs that water be assessed against the uncoated-metal column. The 43 C figure applies only
      to contact by a minor part of the body, under 10 per cent of skin surface.
  - parameter: human in vivo measurements of growth plate, epiphyseal or metaphyseal temperature
    value: '0'
    unit: studies, any age
    species: human
    source_ref: serrat2014
    note: >-
      Earned by six independent query strategies across PubMed and Europe PMC. The human intraosseous literature is
      entirely dental implant and orthopaedic drilling heat, mostly ex vivo. Also zero for intra-articular knee
      temperature in a child or adolescent, and zero for any human local-heat study with a growth endpoint.
