id: guided_growth_tension_band
name: Guided growth (tension band plating)
type: intervention
aliases:
- hemiepiphysiodesis
- eight-Plate
- tension-band plate
- growth modulation
summary: 'Guided growth is the therapeutic application of Hueter-Volkmann: a two-hole plate with divergent
  screws is placed extraperiosteally across one side of a physis, tethering that side while the other
  continues to grow, so the bone angulates. It is the largest human dataset on mechanically modulated
  physeal growth. In 654 growth modulations in 313 children the mean correction rate was 0.67 +/- 0.55
  degrees/month for the distal femur (mLDFA) and 0.43 +/- 0.38 degrees/month for the proximal tibia (mMPTA);
  a neutral mechanical axis was achieved in 68.7% overall, 78.2% in idiopathic and 66.3% in non-idiopathic
  aetiologies, and older age at surgery and varus deformity predicted slower correction. The very wide
  standard deviations - roughly 80-90% of the mean - are the important number: the human response to a
  nominally identical mechanical intervention is far more variable than the tight animal stress-growth
  relation would predict. The mechanical dose is unknown: the only estimate comes from personalised finite
  element models of four human distal femoral epiphyses under gait loads, which show the implant locally
  imposes static stress and removes cyclic loading at the insertion site while raising tensile stress
  on the contralateral side, so the plate acts through both arms of the static/dynamic distinction, not
  by compression alone. Correction is not always permanent; rebound after implant removal is recognised.'
