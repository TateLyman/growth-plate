id: trpv4_channel
name: TRPV4
type: protein
aliases:
- Trpv4
- vanilloid receptor-related osmotically activated channel
summary: 'TRPV4 has the strongest human evidence of any candidate physeal mechanotransducer, but that
  evidence is genetic rather than mechanical. Gain-of-function TRPV4 variants cause a graded series of
  human skeletal dysplasias - metatropic dysplasia, spondylometaphyseal dysplasia Kozlowski type, brachyolmia
  - all of which are growth plate diseases with severe short stature and metaphyseal disorganisation,
  and loss-of-function variants also produce SMD Kozlowski, so the dose-response is non-monotonic. Small-molecule
  TRPV4 inhibition rescues the skeletal phenotype of Trpv4 mutant mice, establishing that the channel''s
  activity level, not merely its presence, sets growth plate output. The direct mechanotransduction experiments,
  however, are prenatal or articular: in mechanically stimulated mouse embryonic hindlimb explants TRPV4
  localises to regions of high biophysical stimulus and is required for loading-driven cartilage growth
  and joint morphogenesis via proliferation and matrix synthesis, while the classic osmotic and compressive
  TRPV4 work is in articular chondrocytes. No study has applied a defined mechanical stimulus to a postnatal
  growth plate and shown a TRPV4-dependent change in longitudinal growth rate, and TRPV4 has not been
  localised zonally in human physeal tissue.'
quantitative: []
localization:
- 'mouse embryonic hindlimb cartilage, regions of high biophysical stimulus: confirmed (khatib2023)'
- 'mouse growth plate (postnatal), zonal: not established mechanically'
- 'human growth plate: inferred from dysplasia phenotypes, no zonal localisation study located'
human_evidence: indirect
human_evidence_note: 'Human evidence is Mendelian: gain- and loss-of-function TRPV4 variants cause metatropic
  dysplasia and spondylometaphyseal dysplasia Kozlowski, both growth plate disorders, but no human mechanical
  experiment exists.'
species_basis:
- mouse
- human
translation_risk: moderate
translation_risk_reason: The human genetic link to growth plate disease is solid; the mechanotransduction
  step is demonstrated only in mouse embryonic explants and articular chondrocytes.
