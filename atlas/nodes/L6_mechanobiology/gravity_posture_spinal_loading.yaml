id: gravity_posture_spinal_loading
name: Gravity, posture and spinal loading
type: process
summary: 'Gravity acting through posture is the largest sustained mechanical variable acting on the growing
  human axial skeleton, and it can be titrated without surgery. Upright posture compresses the intervertebral
  discs and vertebral endplate physes; recumbency releases them, producing the overnight recovery of ~70%
  of the day''s stature loss; and true weightlessness releases them completely, producing a stature gain
  of up to 3% that fully reverses on return to Earth. Added axial load scales the effect: static shoulder
  loads of 2.5-40 kg increased the shrinkage rate nonlinearly, and repetitive lifting exceeded equivalent
  static loading. This makes posture and gravity the natural experiment that most closely mirrors the
  animal compression studies - except that everything that has actually been measured in humans concerns
  the disc, not the physis. The vertebral endplate physis sits in series with the disc and must experience
  some fraction of the same load, but the partition between disc deformation and physeal stress has never
  been measured in a living human, which is precisely why the human vertebral stress-growth relation is
  unquantified. Finite element models of the growth plate show that plate morphology itself adapts to
  the local mechanical environment, so the geometry through which gravity acts is not fixed.'
