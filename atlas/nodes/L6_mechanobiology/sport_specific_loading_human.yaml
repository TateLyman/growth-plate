id: sport_specific_loading_human
name: Sport-specific mechanical loading effects on the human skeleton
type: phenotype
summary: 'Sport gives the only human experiments in which a physis is loaded far outside the normal range
  for years, and the results split by site. Where loading is compressive, repetitive and applied through
  a small joint, local growth is suppressed: in gymnasts the wrist bears body weight, and imaging shows
  distal radial physeal stress injury with acquired positive ulnar variance, i.e. the radius is shortened
  relative to the ulna in the same limb - an internally controlled demonstration of load-suppressed physeal
  output in humans. Wrist pain and physeal injury are common enough in adolescent artistic gymnasts to
  have their own systematic review and meta-analysis. Where loading is impact-type, intermittent and axial,
  growth is preserved or promoted: a 24-week supervised jumping protocol (3 sessions/week, 50 min) in
  47 prepubertal short-stature children gave 4.20 cm of height gain against 2.48 cm in controls (p=0.001)
  alongside a femoral neck BMD Z-score gain of 1.075. The two findings are consistent with the static-versus-dynamic
  distinction seen in animals rather than with a single monotonic load-growth relation. Neither the gymnast
  wrist nor the jumping trial measures the stress at the physis, so the human dose axis remains empty;
  the jumping trial is also small, single-centre and not blinded, and its mediation analysis (via femoral
  neck BMD, beta=-0.442) is fragile.'
quantitative:
- parameter: height gain over 24 weeks, jumping intervention vs control
  value: 4.20 vs 2.48
  unit: cm
  conditions: 47 prepubertal short-stature children aged 8-11 y, 3 sessions/wk of 50 min progressive jumping
  species: human
  source_ref: wang2025
  uncertainty: p=0.001; n=20 intervention, n=27 control; not randomised
- parameter: femoral neck BMD Z-score change, jumping intervention
  value: '1.075'
  unit: Z-score units
  conditions: same trial, DXA
  species: human
  source_ref: wang2025
  uncertainty: p<0.001, Cohen's d 0.869; lumbar spine BMD unchanged
- parameter: mediation of height gain by femoral neck BMD change
  value: '-0.442'
  unit: beta
  conditions: same trial
  species: human
  source_ref: wang2025
  uncertainty: 95% CI -1.474 to -0.009; no direct effect detected
