id: distraction_osteogenesis
name: Distraction osteogenesis
type: intervention
aliases:
- Ilizarov method
- callotasis
- limb lengthening
- tension-stress effect
summary: 'Distraction osteogenesis is the deliberate creation of a de novo growth zone: a bone is osteotomised,
  allowed a latency period, then the fragments are separated slowly, and new bone forms in the gap. Ilizarov''s
  canine experiments established that the resulting tissue is not a growth plate but a distinct structure
  - new bone forms in parallel columns extending in both directions from a central fibrous growth zone,
  with features of both physeal and intramembranous ossification and belonging to neither. Three variables
  were shown to determine success: stability of external fixation, preservation of periosteum, bone marrow
  and medullary blood supply at osteotomy, and the rate and rhythm of distraction. The same experiments
  showed the tension vector, not the bone''s mechanical axis, sets the direction of new bone: canine tibiae
  widened by lateral distraction formed bone parallel to the applied tension even when perpendicular to
  the mechanical axis. Distraction osteogenesis is therefore the cleanest demonstration in any species
  that sustained tensile strain is an instructive, direction-setting stimulus for skeletal tissue formation
  - the tension arm of Hueter-Volkmann operating outside a physis. It is routine human surgery, so its
  efficacy in humans is not in doubt; what is absent is any human measurement of the strain or stress
  in the regenerate.'
