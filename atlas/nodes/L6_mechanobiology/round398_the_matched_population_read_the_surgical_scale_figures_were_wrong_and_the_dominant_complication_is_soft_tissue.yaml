localization: >-
  the lengthened segment and the joints and muscle-tendon units crossing it - ankle,
  subtalar joint, Achilles, knee, quadriceps
human_evidence: direct
human_evidence_note: >-
  All of it is human and all of it is in the matched population - adults undergoing
  elective lengthening for stature rather than for a discrepancy or a dysplasia. The
  weakness is study design, not species: no randomised trials, MINORS mean about 10
  of 16, and complication reporting too heterogeneous to pool.
species_basis:
  - human
translation_risk: low
translation_risk_reason: >-
  There is no species gap. The residual uncertainty is that the underlying studies are
  uncontrolled case series in an elective cosmetic field, with the reporting biases
  yalcinkaya2025 quantifies - adverse events are three percent of all reported
  outcomes.
confidence: B
claim_grades:
  - claim: >-
      The documented aesthetic lengthening is about 6.7 cm in one segment, not 16 cm
      across two
    grade: B
    basis: >-
      two independent systematic reviews covering 1,555 patients reaching the same
      figure, plus the segment distribution showing only 7 patients had both segments
  - claim: >-
      A per-patient complication rate for this population cannot be computed from the
      published literature
    grade: A
    basis: >-
      giorgino2025 states it explicitly as its reason for counting mentions, and
      yalcinkaya2025 quantifies the underlying reporting problem
  - claim: >-
      Joint and soft tissue is the dominant complication category, and it is the ankle,
      subtalar joint, Achilles and quadriceps that fail
    grade: B
    basis: >-
      giorgino2025's largest category at 425 mentions, more than twice infection, and
      marwan2020 independently naming equinus as the most common problem and obstacle
      and subtalar stiffness as a leading true complication
  - claim: True residual complications run about 0.15 per patient
    grade: B
    basis: >-
      marwan2020's Paley-taxonomy synthesis across 795 patients with 4.9 years mean
      follow-up. Depends on consistent application of the taxonomy across heterogeneous
      source studies
  - claim: >-
      This corroborates R397's conclusion that soft tissue rather than bone is the
      rate-limiting tissue
    grade: B
    basis: >-
      convergence of two human systematic reviews with a rat dose-response and a
      ten-year human strength study, from independent literatures
  - claim: The surgical route still dominates the pharmacological stack on magnitude
    grade: B
    basis: >-
      6.7 cm in one segment against 1 to 3 cm for the whole drug stack, and it works
      after fusion so it does not compete for the window
