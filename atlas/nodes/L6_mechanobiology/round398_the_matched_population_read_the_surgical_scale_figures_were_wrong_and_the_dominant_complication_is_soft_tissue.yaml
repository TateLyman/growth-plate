id: round398_the_matched_population_read_the_surgical_scale_figures_were_wrong_and_the_dominant_complication_is_soft_tissue
name: "R398: the matched population finally read - the documented aesthetic lengthening is 6.7 cm in ONE segment and almost never both, the 56.1 percent complication figure cannot be reproduced because the literature cannot support an incidence rate, and in two independent reviews of 1,555 patients the largest complication category is JOINT AND TENDON"
aliases:
  - aesthetic limb lengthening outcomes
  - cosmetic stature lengthening complications
  - surgical scale correction
  - equinus deformity lengthening
type: intervention
layer: L6
stub: false
summary: >-
  R397 named giorgino2025 as the unfinished item - the systematic review of
  AESTHETIC lower limb lengthening in ADULTS, which is the matched population for
  this case, against the mixed-indication pooled figures this atlas has quoted since
  R277. It has been in the bibliography since 2026-08-07, cited by six nodes, with a
  one_line_finding that recorded its METHOD and none of its numbers - CORR-351 again.
  Read in full, together with the earlier review it cites, it corrects the surgical
  scale entry in three ways and independently corroborates R397's frontier.

  ONE - THE DOCUMENTED GAIN IS 6.7 cm IN ONE SEGMENT, AND TWO INDEPENDENT REVIEWS
  REACH THE SAME NUMBER. giorgino2025 pooled 12 studies and 760 adults, mean age
  24.75, 67 percent male, and reports a weighted mean lengthening of 67 mm with study
  means from 62 to 87 mm. marwan2020 pooled 11 studies and 795 patients with a mean
  follow-up of 4.9 years and reports mean end lengthening of 6.7 cm, standard
  deviation 0.6, range 1.5 to 13.0. Two reviews, largely different study sets,
  1,555 patients between them, one number.

  TWO - AND ALMOST NOBODY HAS BOTH SEGMENTS DONE. In giorgino2025, 717 of 760
  patients had TIBIAL lengthening, only 43 femoral, and just SEVEN patients in the
  entire aesthetic literature had both femur and tibia lengthened in the same
  individual. This atlas's roughly 16 cm figure is an ARITHMETIC SUM of two
  mixed-indication pooled means, not a documented practice in the matched population.
  What the literature actually documents is about 6.7 cm, overwhelmingly in the
  tibia.

  THREE - THE 56.1 PERCENT COMPLICATION FIGURE CANNOT BE REPRODUCED, AND THE REASON
  IS THE LITERATURE RATHER THAN THE REVIEW. giorgino2025 states explicitly that
  complications were reported inconsistently across studies - per patient, per
  segment or as unattributed mentions - so it counted MENTIONS and says directly that
  incidence rates cannot be calculated from this evidence base. yalcinkaya2025
  explains why in a different way: across 20 cosmetic stature lengthening studies,
  ADVERSE EVENTS ARE THREE PERCENT of all reported outcomes against 75 percent
  physiological and clinical. The field measures centimetres and does not
  systematically measure harm. So the honest statement is not a different percentage
  - it is that a per-patient complication rate for this population does not exist in
  a form that can be pooled.

  WHAT DOES EXIST IS marwan2020's PALEY TAXONOMY, AND IT IS FAR MORE INFORMATIVE THAN
  A SINGLE PERCENTAGE. Per patient: problems 0.78, obstacles 0.94, and TRUE
  COMPLICATIONS 0.15. In that taxonomy a problem resolves without operation, an
  obstacle needs an operation, and a complication is what is left at the end. So
  roughly one in seven patients carries a residual sequela, while nearly every
  patient encounters something that has to be dealt with along the way. A 56 percent
  figure conflates all three tiers. verdoni2023 gives the modern single-protocol
  comparison from the same group - 19 complications across 92 SEGMENTS, 20.7 percent,
  in achondroplasia.

  FOUR, AND THIS IS THE PART THAT MATTERS MOST HERE - BOTH REVIEWS INDEPENDENTLY PUT
  SOFT TISSUE AND JOINT AT THE TOP. giorgino2025's largest category by a wide margin
  is JOINT AND TENDON at 425 mentions - equinus deformity, knee and ankle
  contractures, Achilles tightness, quadriceps and muscle contractures, valgus and
  varus deviation - against infections 197, bone 100, pain 90, material 82 and
  neurological or vascular 43. Joint and tendon alone is more than twice infection and
  is 425 against 512 for all five other categories put together - a single category
  carrying 45 percent of the total. marwan2020, using a
  completely different taxonomy on a different patient set, names ANKLE EQUINUS
  DEFORMITY as both the most common problem AND the most common obstacle, and
  SUBTALAR JOINT STIFFNESS OR DEFORMITY alongside regenerate deformation as the most
  common true complications.

  THAT IS R397's CONCLUSION ARRIVED AT FROM HUMAN POOLED DATA RATHER THAN FROM A RAT
  DOSE-RESPONSE AND A NINE-PATIENT STRENGTH STUDY. R397 argued from wu2026dolength
  that the joint is the rate-limiting tissue and from speth2026 that the muscle
  deficit is permanent and worsening. Two systematic reviews covering 1,555 patients
  say the same thing in the language of clinical complications: the bone is not what
  fails, the soft-tissue envelope is. And the specific structures named - the
  Achilles, the ankle, the subtalar joint, the quadriceps - are the ones crossing the
  lengthened segment.

  WHAT THIS DOES AND DOES NOT CHANGE. It does NOT reverse the ranking - 6.7 cm in one
  segment is still several times the entire pharmacological stack, it still works
  after fusion so it does not compete for the closing window, and satisfaction runs
  88.8 to 98 percent. What it changes is the number: the file should quote about
  6.7 cm per segment from the matched population, not 16 cm from an arithmetic sum,
  and it should stop quoting 56.1 percent as if it were a per-patient rate. And it
  moves the soft-tissue frontier from an inference to the thing the human literature
  has been reporting as its dominant problem all along.

  ⚠ EVIDENCE QUALITY IS POOR AND BOTH REVIEWS SAY SO. giorgino2025 scores its
  included studies at a MINORS mean of about 10 of 16 with NO randomised trials,
  citing absent prospective collection, no sample size calculation and possibly
  insufficient follow-up. These are case series in an elective cosmetic field with
  obvious publication and reporting incentives.
