id: diurnal_stature_variation
name: Diurnal stature variation
type: phenotype
aliases:
- circadian variation in stature
- spinal shrinkage
- diurnal height loss
summary: 'Human stature falls measurably over a waking day and recovers overnight, and the effect is large
  enough to corrupt growth monitoring. In eight young adults measured to 1 mm precision, mean circadian
  variation was 19.3 mm, 1.1% of stature; 54% of the loss occurred within the first hour after rising
  and about 70% was regained during the first half of the night. The loss is load-dependent: static shoulder
  loads from 2.5 to 40 kg increased the rate of shrinkage nonlinearly, and repetitive lifting produced
  more shrinkage than the equivalent static load, so the disc creeps faster under cyclic than sustained
  loading - the opposite ordering to what static compression does to the growth plate. In children the
  effect is smaller but not negligible: 12-14 year old boys lost 2.0 mm from 09:30 to 14:00 and 4.6 mm
  from 10:00 to 17:00 with sitting height falling 2.0 and 2.8 mm, against a measurement standard error
  of 1.8 mm, and children with idiopathic scoliosis lost a mean 7 mm standing (0.43%) and 7 mm sitting
  (0.79%) between early morning and evening. The mechanism is intervertebral disc fluid exudation and
  unloading of the spinal curves, not physeal growth; the practical consequence is that a single unrecorded
  measurement time can hide or fabricate a centimetre of apparent annual growth.'
