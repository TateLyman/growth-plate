id: epiphysiodesis
name: Epiphysiodesis
type: intervention
aliases:
- physeal arrest
- Phemister procedure
- PETS
- percutaneous epiphysiodesis
summary: 'Epiphysiodesis is the deliberate, permanent destruction or mechanical bridging of a physis to
  stop growth at that site, used to equalise leg lengths or to limit final height. As an experiment it
  is the mechanical converse of guided growth: instead of modulating growth by asymmetric compression,
  it abolishes it by continuity of bone across the plate. Its outcomes establish two facts relevant to
  this layer. First, surgically induced physeal arrest in humans is permanent - 28 to 40 year follow-up
  after epiphysiodesis for leg length discrepancy shows the correction is maintained into middle age,
  with no evidence of late intra-articular knee deformity after temporary epiphysiodesis. Second, the
  effect is quantitatively predictable enough to be planned: remaining growth prediction methods are accurate
  enough to time the operation, which means human physeal output is forecastable from age and skeletal
  maturity even though it is not forecastable from load. Bilateral epiphysiodesis is also used deliberately
  to reduce final height in extremely tall adolescents, which is the only human procedure that directly
  trades measured growth for a mechanical intervention on the physis.'
