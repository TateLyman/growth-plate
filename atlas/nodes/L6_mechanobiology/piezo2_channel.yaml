id: piezo2_channel
name: PIEZO2
type: protein
aliases:
- Piezo2
- FAM38B
summary: 'PIEZO2 is repeatedly listed as a growth plate mechanotransducer but the supporting experiments
  were done elsewhere. Chondrocyte-specific Piezo2 inactivation with Col2a1-Cre produced no growth plate
  or endochondral ossification phenotype and did not protect against surgically induced osteoarthritis,
  in the same study in which Piezo1 deletion did both. In inducible Aggrecan-Cre mice, Piezo2 deletion
  reduced pain behaviour and preserved activity after destabilisation of the medial meniscus but failed
  to protect cartilage, and separately reduced trabecular bone volume, thickness and density independent
  of injury - a bone rather than physis effect. The best-characterised PIEZO2 mechanism in skeletal tissue
  is neuronal: in dorsal root ganglion neurons, PIEZO2 activation by abnormal mechanical stress releases
  CGRP, which acts through RAMP1 on cartilage endplate cells to drive IL-6 and IL-1beta, degrading the
  endplate. No experiment has localised or deleted PIEZO2 in a growth plate with a growth-rate readout,
  and there is no human growth plate PIEZO2 data at all. Human PIEZO2 loss-of-function causes distal arthrogryposis
  and proprioceptive loss, with skeletal consequences that are plausibly secondary to absent fetal movement
  rather than to a chondrocyte-autonomous defect.'
