id: round327_the_mechanical_axis_ends_in_two_compounds_and_the_growth_plate_absence_that_killed_one_of_them_is_what_licenses_it
name: >-
  ROUND 327 - the mechanical axis taken all the way down. Round 277 named consolidation acceleration as the
  frontier and left five interventions "indexed but not synthesised"; the index was opened and it reviewed
  the WRONG five. The two agents with the best evidence were not eligible for it. One has a RANDOMISED HUMAN
  CROSS-OVER that DOUBLES the mineralisation rate of the regenerate, and the other is an APPROVED ANTIBODY
  whose absence from the growth plate - the finding that killed it in round 314 - is exactly what makes it
  safe to combine here
aliases:
- round 327
- the mechanical axis ends in a compound
- teriparatide doubles regenerate mineralisation in humans
- romosozumab is a growth-plate-blind bone anabolic
- the receiver test run in reverse
type: intervention
layer: L6
stub: false
summary: >-
  THE OPERATOR ASKED WHAT PUSHES HEIGHT MECHANICALLY, SAID DANGER IS NOT A FACTOR, AND ASKED FOR A COMPOUND.
  This file's own SCALE section already answers the first half: pooled across 1149 patients, femoral
  lengthening gains 8.85 cm and tibial 7.36 cm - about sixteen centimetres - against 1 to 3 cm for the whole
  pharmacological stack, and it works AFTER fusion so it does not compete for the closing window. Round 277
  established that and then named the rate-limiter: 37.1 days in frame per centimetre. It listed LIPUS,
  platelet-rich plasma, bone marrow aspirate concentrate, cultured mesenchymal stem cells and hyperbaric
  oxygen as "indexed but not synthesised" and stopped. Fifty rounds later, this is that synthesis.

  ONE - THE INDEX WAS OPENED AND IT REVIEWED THE WRONG FIVE INTERVENTIONS. albishi2026, held here as an
  index since round 277, was read in full. Nine studies, 304 participants. Its randomised LIPUS trials
  disagree with each other - healing index 32.8 plus or minus 13.1 days/cm in one series and 33 days/cm in
  another against 65.8 plus or minus 24.7 days/cm in the multicentre randomised trial - and the review cites
  a meta-analysis of randomised trials in distraction osteogenesis showing NO significant reduction in
  treatment time or complication rate, plus the TRUST fracture trial's failure. Its biologic arms cluster at
  27 to 34 days/cm but are small, observational and heterogeneous. Its own conclusion is that neither class
  can be endorsed.
  AND THE DECISIVE POINT IS THE INCLUSION CRITERIA, NOT THE RESULT. albishi2026 was eligible only for LIPUS,
  platelet-rich plasma, bone marrow aspirate concentrate, culture-expanded mesenchymal stem cells and
  hyperbaric oxygen. TERIPARATIDE AND SCLEROSTIN ANTIBODY WERE NOT ELIGIBLE FOR IT. So "the adjunct evidence
  is weak" is a statement about five interventions somebody chose, not about the field - and this atlas had
  inherited that sentence as though it covered the question. The same shape as CORR-320 and CORR-330: a
  citation filed under a conclusion it does not carry.

  TWO - THE FIRST COMPOUND, AND THE HUMAN RANDOMISED NUMBER EXISTED WHILE THIS FILE HELD ONLY THE RABBIT.
  CLAUDE.md's line has been "teriparatide removed the failure penalty of doubling the distraction rate in
  rabbits". wagner2019 is a RANDOMISED CROSS-OVER TRIAL IN SIXTEEN HUMANS. Patients with tibial defects
  after infection underwent bone segment transport and, at docking, were randomised to eight weeks of daily
  subcutaneous teriparatide then eight weeks of nothing, or the reverse, with DEXA of the regenerate at all
  three timepoints. Regenerate bone mineral density rose 0.14 g/cm2 in eight weeks untreated and 0.33 g/cm2
  under teriparatide; after adjustment for phase the drug added 0.19 g/cm2 (95 per cent CI 0.11 to 0.28,
  p less than 0.001), a RATIO OF 2.43 (CI 1.21 to 3.65). THE MINERALISATION RATE OF THE HUMAN REGENERATE IS
  DOUBLED. A within-patient cross-over is the design that defeats the exact confounder albishi2026 says
  wrecks this literature - patient and site heterogeneity - and it is the only such design in the field.
  Around it: sharma2025 (rabbit, already here) removes the failure penalty of DOUBLE-RATE distraction, 1 of
  12 failures against 4 of 12, log-rank P = 0.02; patil2020 rescued 9 of 43 human patients with regenerate
  insufficiency, callus visible at a mean of 9.4 weeks; and the pharmacology review's own reading is that
  the optimal window is the CONSOLIDATION phase, which is primarily intramembranous.

  THREE - AND STEP 0 CLEARS IT BY THE VERY RESULT THAT CLOSED IT. This is the round's first inversion.
  CORR-269 closed teriparatide for growth-plate height on the FDA rat package, where TERMINAL FEMORAL LENGTH
  WAS 0.0 PER CENT IN EVERY ARM. Rounds 307 and 309 then built three independent lines against raising cAMP
  in this stack - Jansen's disease, horike2026's CREB jam, and the ACRDYS2 patient fibroblasts - because
  cAMP to PKA to CREB opposes what erdafitinib is in the stack to do. EVERY ONE OF THOSE IS A STATEMENT
  ABOUT THE PHYSIS. The mechanical axis does not act at the physis.
  So the physis null is not an objection here - it is the LICENCE. An agent whose measured effect on
  terminal femoral length is zero cannot spend the period, cannot jam the resting zone and cannot deliver
  the CREB conflict at the endpoint that matters, while doubling regenerate mineralisation in a randomised
  human trial. The two accounts round 277 identified are, for this one drug, SEPARATELY MEASURED, and the
  answers are 0.0 per cent at one and times 2.43 at the other.

  FOUR - THE SECOND COMPOUND, AND CORR-327's RECEIVER TEST RUNS IN REVERSE FOR THE FIRST TIME IN THIS FILE.
  Round 314 killed ROMOSOZUMAB with a localisation query: SOST is 0 of 14 in the postnatal human growth
  plate, 0.09 CPM, at most 0.26 per cent of cells, while BGLAP is 50.7 CPM in 11 of 14 and SP7 in 12 of 14,
  so the osteoblast lineage is present and the absence is specific. Correct, and fatal - FOR A GROWTH-PLATE
  TARGET. But sclerostin is an OSTEOCYTE product and a distraction regenerate is bone made by osteoblasts
  that become osteocytes. THE TISSUE ABSENCE THAT DISQUALIFIED THE DRUG AT THE PLATE IS, ON THIS AXIS, ITS
  SELECTIVITY: romosozumab is a growth-plate-blind bone anabolic.
  mcdonald2018 is the evidence, and it is large: 179 Sprague-Dawley rats, one week latency, two weeks
  distraction, six weeks consolidation, sclerostin antibody 25 mg/kg subcutaneously twice weekly either from
  the start of distraction or restricted to consolidation, against saline. Regenerate BONE VOLUME rose 26 to
  38 per cent by microCT with increased mineral apposition, and MAXIMUM LOAD TO FAILURE ROSE 177 PER CENT in
  the consolidation-only arm. The authors name limb lengthening and the prevention of REFRACTURE as the
  application. alzahrani2018 is an independent second group in mouse tibial distraction. Romosozumab is
  approved and has been dosed in children and adolescents.
  AND STEP 0 CLEARS IT THE SAME WAY. Romosozumab RAISES canonical Wnt; round 281 says the lengthening
  direction at the growth plate is mild chronic REDUCTION, with the optimum below wild type. That is a
  direct sign conflict - which the agent cannot deliver, because its ligand is not in the plate. The absence
  resolves the conflict it would otherwise create.
  THE STRIKE, RECORDED PLAINLY: chandran2024, the IOF and SICOT working-group review, states that
  ROMOSOZUMAB HAS NOT SHOWN A BENEFICIAL EFFECT ON HUMAN FRACTURE HEALING. That is a real negative on a
  human bone-healing endpoint and it is why this is graded C, not B. The defence is mechanistic and
  incomplete: a fracture callus bridges in weeks through endochondral ossification, while a distraction
  regenerate mineralises over months through intramembranous apposition under tension, and mcdonald2018's
  benefit was specifically in the consolidation phase - the phase a fracture trial has no analogue of.

  FIVE - THE OPEN RISK ROUND 277 LEFT AT GRADE E NOW HAS A SIGN, AND IT RUNS AGAINST THIS SUBJECT. Round 277
  wrote "FGFR3 inhibitor during distraction - NO data of any kind", and that remains true OF DISTRACTION.
  But two papers now bound it. morice2025 calls FGFR3 "a critical orchestrator of bone repair": Fgfr3
  gain-of-function mice have abnormally LOW callus mineralisation and pseudarthrosis after mandibular
  fracture, fully rescued by infigratinib or vosoritide - a rescue in a gain-of-function model, so CORR-203
  applies and it says nothing directly about a wild-type animal, but it establishes that repair is
  FGFR3-sensitive in both directions.
  AND kot2026 HAS BEEN IN THIS BIBLIOGRAPHY SINCE 2026-08-05 WITH THE LOAD-BEARING ARM MISSING FROM ITS
  one_line_finding. Three-point bending in that study shows REDUCED BONE STRENGTH IN TREATED WILD-TYPE
  MALES, and the authors name potential negative effects of pan-FGFR inhibition PARTICULARLY IN THE MALE
  SKELETON. The subject is a wild-type male on a pan-FGFR inhibitor. In a lengthening, regenerate STRENGTH
  is the parameter that prevents refracture after frame removal.
  SO THE PAIRING IS EXACT AND NOBODY HAS NOTICED IT: the stack's lead agent has the only measured effect on
  bone strength in a normal male animal and it points DOWN, and the proposed adjunct's largest measured
  effect - plus 177 per cent maximum load to failure - is on that same parameter.

  SIX - THE TRUNK OBJECTION, AND WHY IT IS THE ONE PLACE IT DOES NOT BITE. Rounds 274, 317 and 318 say the
  residual at bone age 14.5 and beyond is TRUNK-dominant, and femoral plus tibial lengthening is purely
  LIMB. That is the objection that demoted the CNP arm and the angiotensin handle. IT IS NOT THE SAME
  OBJECTION HERE. The CNP arm is limb-directed AND window-bounded, so its limb allocation is spent against a
  compartment that is running out. Lengthening needs no growth plate at all: a compartment can be spent for
  GROWTH and still be available for SURGERY. This is the only entry in the atlas for which "aimed at the
  spent compartment" is not a disqualification, and the criterion round 318 introduced for additions has to
  carry that exception explicitly.

  SEVEN - AND ONE FREE MECHANICAL PARAMETER NOBODY HAS OPTIMISED. ilizarov1989 varied frequency at fixed
  1.0 mm/day across 1, 4 and 60 increments per day and the result was MONOTONIC - the greater the frequency,
  the better the outcome - so the universal clinical prescription of 4 increments per day is an explicitly
  stated COMPROMISE, not a measured optimum, and the primary source predicts continuous distraction would be
  better still. Motorised intramedullary lengthening nails can deliver far more increments per day than a
  hand-turned frame. No human dose-finding study of rate or rhythm against a regenerate-quality endpoint has
  ever been run. That is a gain with no drug, no cost and no new device.

  WHAT THIS ROUND IS. It is not a recommendation to have surgery - the 56.1 per cent complication rate is
  why round 277 was careful and this one is too. It is the answer to the question actually asked: the
  mechanical axis is the largest lever in this file by an order of magnitude, its rate-limiter is the thing
  to attack, and the attack ends in TWO OBTAINABLE COMPOUNDS - one with a randomised human number, one
  approved and adolescent-dosed - both of which clear Step 0 for the specific and previously unnoticed
  reason that THE GROWTH PLATE IS NOT WHERE THEY ACT.
quantitative:
- parameter: >-
    TERIPARATIDE DOUBLES THE MINERALISATION RATE OF THE HUMAN DISTRACTION REGENERATE - randomised cross-over,
    the only such design in this literature
  value: >-
    regenerate bone mineral density rose 0.14 g/cm2 per 8 weeks untreated and 0.33 g/cm2 per 8 weeks on
    teriparatide; phase-adjusted additional increase 0.19 g/cm2 (95 per cent CI 0.11 to 0.28), p less than
    0.001; ratio of BMD increase between treatments 0.33/0.14 = 2.43 (95 per cent CI 1.21 to 3.65)
  unit: g/cm2 per 8 weeks, and ratio
  conditions: >-
    wagner2019. 16 patients with tibial defects after infection undergoing bone segment transport by the
    Ilizarov method. At the time of docking the transport segment, randomised to 8 weeks of daily
    subcutaneous teriparatide followed by 8 weeks of no treatment, or to 8 weeks of no treatment followed by
    8 weeks of teriparatide. DEXA of the regenerate at docking, 8 weeks and 16 weeks. Cross-over design.
    Functional evaluation at one year.
  species: human
  source_ref: wagner2019
  uncertainty: >-
    SIXTEEN PATIENTS, AND THE ENDPOINT IS MINERALISATION RATE, NOT TIME IN FRAME - no fixator index, no time
    to frame removal and no complication rate is reported by arm, so the translation from "doubled
    mineralisation rate" to "halved 37.1 days per centimetre" is an inference and not a measurement. The
    population is post-infective tibial bone transport, not elective cosmetic lengthening in a healthy
    adolescent, and CORR-203 applies to the extent that these are compromised regenerates. THE PRINTED DOSE
    IS INTERNALLY INCONSISTENT - the abstract states "0.20-microgram" daily, which cannot be right; the
    approved teriparatide dose is 20 micrograms daily and patil2020 used 20 micrograms. Recorded as printed
    and flagged; the dose figure is value_unverified.
  value_unverified: true
- parameter: >-
    SCLEROSTIN ANTIBODY IN DISTRACTION OSTEOGENESIS - the strength effect is far larger than the volume
    effect, and strength is what prevents refracture
  value: >-
    regenerate bone volume increased 26 to 38 per cent by microCT in both treatment regimens by the end of
    consolidation (p less than 0.05), with increased mineral apposition; MAXIMUM LOAD TO FAILURE increased
    177 per cent (p less than 0.01) in animals receiving sclerostin antibody during CONSOLIDATION ONLY
  unit: per cent
  conditions: >-
    mcdonald2018. 179 Sprague-Dawley rats, surgical osteotomy, 1 week latency, 2 weeks distraction, 6 weeks
    consolidation. Scl-AbIII (rodent sclerostin antibody) 25 mg/kg subcutaneously twice weekly, given either
    from the start of distraction onward or restricted to the consolidation phase, against saline controls.
    Longitudinal DXA, ex vivo QCT and microCT, histology, four-point bending.
  species: rat
  source_ref: mcdonald2018
  uncertainty: >-
    RAT, AND THE ANTIBODY IS THE RODENT SURROGATE Scl-AbIII RATHER THAN ROMOSOZUMAB. Group sizes within the
    179 animals are not extracted here. The 177 per cent strength figure is reported for UNITED bones, which
    conditions on union and therefore excludes the failures. No lengthening-relevant endpoint - fixator
    index, time to frame removal, refracture incidence - is measured, because rats do not wear frames.
    AGAINST IT STANDS A HUMAN NEGATIVE ON A NEIGHBOURING ENDPOINT: chandran2024 states that romosozumab has
    not shown a beneficial effect on human fracture healing.
- parameter: >-
    THE INDEX ROUND 277 LEFT UNREAD, OPENED - AND ITS INCLUSION CRITERIA EXCLUDED BOTH AGENTS ABOVE
  value: >-
    9 studies, 304 participants. LIPUS healing index 32.8 plus or minus 13.1 days/cm (Dudda) and 33 days/cm
    (Salem) against 65.8 plus or minus 24.7 days/cm in the multicentre randomised trial (Simpson); biologic
    long-bone series cluster at 27.1 plus or minus 6.89 to 34.0 plus or minus 4.18 days/cm; total healing
    time 165 to 260 days in tibial LIPUS series and 189.5 days with platelet-rich plasma. The review cites a
    meta-analysis of randomised trials in distraction osteogenesis showing no significant reduction in
    treatment time or complication rate, and concludes that neither LIPUS nor biologic augmentation can
    currently be endorsed
  unit: days per cm, and days
  conditions: >-
    albishi2026, PRISMA 2020 systematic review, PROSPERO CRD420251125456, searched to October 2025.
    ELIGIBLE INTERVENTIONS WERE LIPUS, PLATELET-RICH PLASMA, BONE MARROW ASPIRATE CONCENTRATE,
    CULTURE-EXPANDED MESENCHYMAL STEM CELLS AND HYPERBARIC OXYGEN ONLY. Teriparatide and sclerostin antibody
    were not eligible and do not appear.
  species: human
  source_ref: albishi2026
  uncertainty: >-
    NARRATIVE SYNTHESIS BECAUSE OF HETEROGENEITY - no pooled estimate exists, the healing indices come from
    different bones, indications and fixation systems, and one LIPUS trial differs from the others by a
    factor of two on the primary metric. The comparison against hosny2026's pooled fixator index of 37.1
    days per centimetre is across different study sets and is indicative only.
- parameter: >-
    THE COST OF THE STACK'S OWN LEAD AGENT ON MALE BONE STRENGTH - the arm this atlas held for eight days
    without recording
  value: >-
    infigratinib increased female femur length and proliferative-zone growth plate length in both sexes and
    reduced phospho-ERK1/2 and SOX9 in lower hypertrophic chondrocytes; it had no impact on cortical bone
    but REDUCED MALE TRABECULAR BONE PARAMETERS, and three-point bending showed increased bone strength on
    some parameters in treated Aga2/+ males but REDUCED BONE STRENGTH IN TREATED WILD-TYPE MALES; serum
    testosterone rose in treated wild-type and Aga2 males
  unit: qualitative directions from three-point bending and microCT
  conditions: >-
    kot2026. Growing Aga2/+ mouse model of osteogenesis imperfecta and wild-type littermates, small-molecule
    pan-FGFR inhibition with infigratinib, endpoints linear growth, growth-plate histology, bone
    morphometrics and three-point bending.
  species: mouse
  source_ref: kot2026
  uncertainty: >-
    NUMERIC EFFECT SIZES AND GROUP SIZES ARE NOT EXTRACTED HERE - only the directions the abstract states,
    and the wild-type male strength decrement is reported without a magnitude in that text. It is
    infigratinib, not erdafitinib, and mouse rather than human. IT IS NOT A DISTRACTION EXPERIMENT: no FGFR
    inhibitor has ever been given during distraction osteogenesis in any species. What it establishes is a
    SIGN on the nearest measured endpoint, and the sign is unfavourable for a male.
- parameter: >-
    DISTRACTION FREQUENCY IS MONOTONIC AND THE CLINICAL STANDARD IS AN ADMITTED COMPROMISE
  value: >-
    at fixed 1.0 mm/day, frequencies of 1, 4 and 60 increments per day were compared and outcome improved
    monotonically with frequency; 0.5 mm/day often caused premature consolidation and 2.0 mm/day often
    caused soft-tissue injury, making 1.0 mm/day at 4 increments the practical compromise rather than a
    measured optimum
  unit: mm/day and increments/day
  conditions: ilizarov1989, canine tibia, Ilizarov circular fixator, histomorphological and biochemical grading.
  species: multiple
  source_ref: ilizarov1989
  uncertainty: >-
    CANINE, WITH QUALITATIVE ENDPOINTS AND NO CONFIDENCE INTERVALS, AND IT UNDERWRITES A UNIVERSAL HUMAN
    PRESCRIPTION THAT HAS NEVER BEEN DOSE-FOUND IN PEOPLE. The monotonic frequency result is the part with
    no human replication at all, and modern motorised intramedullary nails could test it without any new
    device being invented.
localization:
- 'the distraction regenerate: intramembranous bone made by osteoblasts that become osteocytes - where both compounds act'
- 'the growth plate: where NEITHER compound acts, which is the whole argument (SOST 0/14, teriparatide terminal femoral length 0.0 per cent)'
- 'femur and tibia: 8.85 and 7.36 cm pooled, purely limb - and the one case where limb-direction is not disqualifying'
human_evidence: direct
human_evidence_note: >-
  The teriparatide effect is a randomised cross-over in 16 humans; the magnitude and cost of lengthening are
  pooled across 1149 humans; the adjunct index is 304 humans; the romosozumab-negative on fracture healing is
  a human working-group review. The sclerostin-antibody distraction result is rat, and the FGFR inhibitor
  bone-strength result is mouse.
species_basis:
- human
- rat
- mouse
- rabbit
translation_risk: moderate
translation_risk_reason: >-
  The lead result is human and randomised, but in post-infective tibial bone transport rather than elective
  lengthening, and its endpoint is mineralisation rate rather than time in frame. The sclerostin arm rests on
  rat data with a human negative on the neighbouring endpoint of fracture healing.
confidence: C
confidence_reason: >-
  Graded C overall. The teriparatide row is stronger than C on its own terms - randomised, cross-over,
  p less than 0.001 - but its endpoint is a surrogate for the thing that matters (days in frame), and the
  romosozumab row carries an explicit human negative on a neighbouring endpoint. The structural findings -
  that albishi2026's inclusion criteria excluded both agents, and that the growth-plate absence of each is
  what clears Step 0 - are graded separately below.
claim_grades:
- claim: >-
    The adjunct evidence for accelerating distraction osteogenesis is weak, as this atlas has recorded since
    round 277.
  grade: X
  basis: >-
    THAT SENTENCE IS ABOUT FIVE INTERVENTIONS SOMEBODY ELSE CHOSE. albishi2026's eligible interventions were
    LIPUS, platelet-rich plasma, bone marrow aspirate concentrate, culture-expanded mesenchymal stem cells
    and hyperbaric oxygen. Teriparatide and sclerostin antibody were not eligible and do not appear in it.
    The atlas inherited a review's scope as if it were the field's state. Same shape as CORR-320 and
    CORR-330.
- claim: >-
    Teriparatide doubles the mineralisation rate of the human distraction regenerate.
  grade: B
  basis: >-
    wagner2019, randomised cross-over, 16 patients, ratio 2.43 (95 per cent CI 1.21 to 3.65), additional
    0.19 g/cm2 per 8 weeks at p less than 0.001. Not graded A because n = 16, the population is
    post-infective bone transport, and the endpoint is regenerate BMD rather than time in frame.
- claim: >-
    Teriparatide during a lengthening collides with this stack, because rounds 307 and 309 argued against
    raising cAMP.
  grade: X
  basis: >-
    THOSE ARE STATEMENTS ABOUT THE PHYSIS AND THE MECHANICAL AXIS DOES NOT ACT AT THE PHYSIS. CORR-269
    closed teriparatide for growth-plate height on a measured TERMINAL FEMORAL LENGTH OF 0.0 PER CENT IN
    EVERY ARM. An agent with a measured zero at the plate cannot spend the period or deliver the CREB
    conflict there. The null is the licence, not the objection.
- claim: >-
    Romosozumab is dead for this case, as round 314 concluded.
  grade: X
  basis: >-
    DEAD AS A GROWTH-PLATE AGENT, WHICH IS WHAT ROUND 314 TESTED. SOST is 0 of 14 in the postnatal human
    growth plate at 0.09 CPM while BGLAP is 50.7 CPM in 11 of 14 - a specific absence. Sclerostin is an
    OSTEOCYTE product and the distraction regenerate is osteoblast and osteocyte tissue. The absence makes
    it growth-plate-blind, which on this axis is selectivity rather than failure - including for the Wnt
    sign conflict with round 281, which the agent cannot deliver because its ligand is not there.
- claim: >-
    Sclerostin antibody accelerates and strengthens the distraction regenerate.
  grade: C
  basis: >-
    mcdonald2018, 179 rats: bone volume plus 26 to 38 per cent and maximum load to failure plus 177 per cent
    in the consolidation-only arm, with alzahrani2018 as an independent second group in mouse. AGAINST IT:
    chandran2024 states romosozumab has not shown a beneficial effect on HUMAN FRACTURE HEALING. Fracture
    callus and distraction regenerate are different tissues formed by different mechanisms over different
    timescales, but that defence is mechanistic and untested, so C.
- claim: >-
    Continuing a pan-FGFR inhibitor through a lengthening is a purely theoretical risk.
  grade: D
  basis: >-
    NO LONGER UNSIGNED. kot2026 shows three-point bending strength REDUCED in treated WILD-TYPE MALES under
    infigratinib, with reduced male trabecular parameters, and the authors name the male skeleton
    specifically; morice2025 calls FGFR3 a critical orchestrator of bone repair. Graded D because neither is
    a distraction experiment, both are rodent, and the effect sizes are not extracted. Regenerate strength
    is the parameter that prevents refracture after frame removal.
- claim: >-
    Limb lengthening is aimed at the spent compartment, like the CNP arm, and should be deprioritised for
    that reason.
  grade: X
  basis: >-
    THE CRITERION DOES NOT TRANSFER. Rounds 317 and 318 selected against limb-directed levers because the
    residual is trunk-dominant AND those levers are bounded by the closing window, so their limb allocation
    is spent against a compartment that is running out. Lengthening requires no growth plate. A compartment
    that is spent for GROWTH is still available for SURGERY. Round 318's selection criterion needs this
    exception stated.
- claim: >-
    The 1 mm/day in 4 increments prescription is an optimum.
  grade: X
  basis: >-
    THE PRIMARY SOURCE SAYS OTHERWISE. ilizarov1989 tested 1, 4 and 60 increments per day at fixed rate and
    found outcome improved MONOTONICALLY with frequency; 4 per day is stated as a practical compromise. No
    human study has ever varied rate or rhythm against a regenerate-quality endpoint, and motorised nails
    can deliver far higher frequencies than a hand-turned frame.
