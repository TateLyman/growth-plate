contradicts: >-
  Does not overturn round 277 - it EXECUTES it. Round 277 named consolidation acceleration as the frontier
  and recorded LIPUS, platelet-rich plasma, bone marrow aspirate concentrate, mesenchymal stem cells and
  hyperbaric oxygen as "indexed but not synthesised". The index, albishi2026, has now been read in full and
  its inclusion criteria excluded the two agents with the best evidence, so the atlas's inherited
  pessimism about adjuncts was a statement about that review's scope. It also corrects two closures by
  restricting them to the compartment they were made in: CORR-269 and rounds 307/309 close teriparatide AT
  THE PHYSIS, and round 314 closes romosozumab AT THE PHYSIS, and neither closure reaches the distraction
  regenerate - where one has a randomised human effect and the other has 179 rats. And it withdraws the
  round 318 selection criterion for this one axis, because a compartment spent for growth is still available
  for surgery.
