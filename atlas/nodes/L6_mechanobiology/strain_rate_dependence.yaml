id: strain_rate_dependence
name: Strain rate dependence
type: process
summary: 'Growth plate cartilage is strongly viscoelastic and poroelastic, so its mechanical response
  depends on how fast strain is applied, not only on how much. This is the mechanistic root of the static/dynamic
  distinction: under stress control, a slowly or indefinitely applied load allows fluid exudation and
  continued creep, and hypertrophic chondrocytes accumulate lateral and volumetric strain over time, whereas
  a rapidly cycling load of the same mean magnitude truncates creep and leaves cells with the same axial
  but lower lateral and volumetric deformation. Digital image correlation in porcine explants likewise
  shows qualitatively different internal strain fields under static versus dynamic modulation rather than
  a simple scaling. Because the tissue''s apparent modulus rises with loading rate, the stress transmitted
  to chondrocytes during a fast heel strike is not predictable from the quasi-static modulus, which is
  one reason in vivo human physeal stress cannot be inferred from joint contact force alone. No experiment
  has yet varied strain rate as the sole independent variable in an in vivo growth plate and measured
  growth rate.'
quantitative:
- parameter: axial hypertrophic cell strain, static vs dynamic at matched mean stress
  value: not different
  unit: qualitative
  conditions: stress-controlled compression, pre-pubertal rat proximal tibial explants
  species: rat
  source_ref: zimmermann2017
  uncertainty: lateral p<0.001 and volumetric p<=0.015 both higher under static
human_evidence: absent
human_evidence_note: No human physeal strain-rate measurement exists.
species_basis:
- rat
- porcine
translation_risk: high
translation_risk_reason: Inference rests on explant rheology in two species; the in vivo human loading
  rate spectrum is unknown.
