id: local_limb_warming_is_a_free_delivery_and_growth_lever
name: The delivery term has a FREE lever with a length endpoint - local limb warming raises solute entry into the growth plate and lengthens the treated side, with the contralateral limb as its own control
aliases:
- limb heating
- Allen's rule as an intervention
- the free delivery multiplier
- exercise and solute delivery
type: intervention
layer: L6
stub: false
summary: 'THE ATLAS MARKED TERM 7 (DELIVERY) AS "ADEQUATELY HIT FOR THE SMALL MOLECULES AND PARTLY MISSED
  FOR THE PEPTIDE" AND TERM 6 (MECHANICAL) AS "UNHIT AND FREE". A body of work by one group, absent from
  this atlas until now, occupies both at once and does it with a LENGTH endpoint and an internal control.
  THE DELIVERY MEASUREMENT. serrat2014 raised hindlimb temperature from 22 to 34 degrees C - a range the
  authors describe as physiological for a normal human knee - and quantified tracer entry into the tibial
  growth plate by in vivo multiphoton imaging. Entry of 10 kDa dextran rose MORE THAN 150 PER CENT. Entry
  of 40 and 70 kDa rose less than 50 per cent, so the enhancement is SIZE-DEPENDENT and largest in exactly
  the band where this project peptide arm sits. Blood velocity rose 118 per cent and vessel diameter 31
  per cent, while relative leakage OUT of vessels was not temperature dependent - so the mechanism is
  flow and access, not vessel leakiness. serrat2009 had already shown that with body core clamped at 36
  degrees C, immersing the hindlimb at 36 versus 23 degrees C NEARLY DOUBLED fluorescein infiltration into
  the plate.
  THE LENGTH ENDPOINT, AND IT IS INTERNALLY CONTROLLED. serrat2015 applied 40 degrees C to ONE SIDE of the
  body, 40 minutes a day for 14 days post-weaning. The treated side gained 1.3 per cent in femur and 1.5
  per cent in tibia, with tibial elongation rate more than 12 per cent higher (15 micrometres per day),
  and ear 8.8 per cent and hindfoot 3.5 per cent. BODY MASS AND HUMERUS WERE UNAFFECTED, so it is local
  rather than systemic. Left-right differences were ABSENT in untreated controls. AND THE DIFFERENCE
  PERSISTED: at seven weeks post-treatment femur was still about 1 per cent and tibia about 1 per cent
  longer on the treated side. racine2018 replicated it at one week - tibia about 1 per cent (t=7.7,
  p<0.001) and femur about 1.4 per cent (t=11.5, p<0.001).
  EXERCISE DOES THE SAME THING AND THE CONTROL IS ELEGANT. serrat2010 housed mice cold or warm with or
  without a running wheel. All runners had significantly longer limbs regardless of housing temperature,
  while TAIL length responded only to temperature - so the exercise effect was LOCAL TO LIMB BONES and not
  a systemic endocrine reaction. Multiphoton imaging showed enhanced solute delivery to tibial growth
  plates in runners, measured at rest under anaesthesia, i.e. a LASTING change in delivery rather than a
  transient one during exercise.
  WHY THIS MATTERS FOR THE STACK RATHER THAN AS A CURIOSITY. Delivery multiplies every other term. The
  atlas already holds that vosoritide at about 4 kDa sits partway down the partition slope rather than on
  its plateau, and navepegritide is a sustained-release prodrug in the same size class; the 10 kDa result
  is the closest measured bracket. A delivery multiplier would apply to the peptide arm, to endogenous
  IGF-I - which schneiderman1995 measures partitioning an order of magnitude better free than
  ternary-complexed, and which serrat2017 shows reaching a live growth plate within 30 minutes - and to
  anything else systemically supplied. It costs nothing and needs no molecule.
  THREE THINGS ARGUE AGAINST IT AND ONE OF THEM IS SPECIFIC TO THIS CASE. FIRST, THE MECHANISM IS NOT ONLY
  DELIVERY. serrat2008, in PNAS, found chondrocyte proliferation and matrix volume correlate with
  temperature in metatarsals cultured WITHOUT ANY VASCULATURE, and concluded that vasomotor change acts
  INDIRECTLY through appendage temperature rather than through nutrient delivery. Temperature does both,
  and the delivery framing cannot claim the whole effect. SECOND, AND DECISIVE FOR A BONE-AGE-16 SUBJECT:
  serrat2013 resolved tail elongation into two phases - an initial RAPID phase whose rate is directly
  temperature-dependent, and a second phase in which rates are IDENTICAL across 7, 21 and 27 degrees C.
  The skeleton is temperature-responsive during a window of rapid growth and then stops being so. Every
  length result here is post-weaning mouse, which is that window. Our subject is past it. THIRD, THERE IS
  NO HUMAN DATA OF ANY KIND - not a trial, not a case series, not an observational study with a length
  endpoint.'
quantitative:
- parameter: 'THE DELIVERY MULTIPLIER, AND IT IS SIZE-DEPENDENT IN THE BAND THAT MATTERS'
  value: '10 kDa dextran entry into the growth plate up MORE THAN 150 per cent; 40 and 70 kDa up less than
    50 per cent'
  unit: per cent increase in growth-plate tracer entry
  conditions: 'serrat2014. Female mice at 5 weeks, n=22, hindlimb temperature raised from 22 to 34 degrees
    C, described by the authors as a physiological range for normal human knee joints. In vivo multiphoton
    microscopy quantifying vessel diameter, blood velocity, dextran leakage from subperichondrial plexus
    vessels, and accumulation in growth plate cartilage. Blood velocity increased 118 per cent and vessel
    diameter 31 per cent; total dextran in the plexus rose, but RELATIVE leakage out of vessels was not
    temperature dependent. Independently, serrat2009 held body core at 36 degrees C and 120 breaths per
    minute and immersed the hindlimb in 36 versus 23 degrees C saline: standardised fluorescein
    infiltration into the tibial growth plate was NEARLY DOUBLE at 36 degrees C, n=6 per group.'
  species: mouse
  source_ref: serrat2014
  uncertainty: 'THE SIZE DEPENDENCE IS THE USEFUL PART AND ALSO THE LIMIT. The largest gain is at 10 kDa
    and it falls off by 40 kDa, which is favourable for a 4 kDa peptide but says nothing directly about
    it - no CNP analogue has been measured under heating, and dextrans are flexible coils that do not
    behave like globular peptides of matched mass. THE ANAESTHESIA CONFOUND IS REAL: these are
    surgically exposed plates in anaesthetised animals, and anaesthesia alters cardiovascular tone, so
    absolute delivery values are not physiological even if the within-animal temperature contrast is
    valid. And the 22 to 34 degrees C span is a large excursion for a mouse hindlimb; the equivalent
    excursion available in a human knee under any tolerable protocol is smaller and unmeasured.'
- parameter: 'THE LENGTH ENDPOINT, UNILATERAL, WITH THE OTHER LIMB AS CONTROL, AND IT PERSISTS'
  value: 'femur +1.3 per cent and tibia +1.5 per cent on the treated side at 14 days; tibial elongation
    rate more than 12 per cent higher (15 micrometres per day); still about 1 per cent at 7 weeks
    post-treatment'
  unit: per cent difference between treated and contralateral limb
  conditions: 'serrat2015. N=20 mice treated with 40 degrees C unilateral heat for 40 minutes per day for
    14 days post-weaning, N=6 untreated controls. Unilateral increases: ear 8.8 per cent, hindfoot 3.5,
    femur 1.3, tibia 1.5. Extremity lengthening correlated with temperature during treatment. BODY MASS
    AND HUMERAL LENGTH UNAFFECTED. At 7 weeks post-treatment, ear area about 6 per cent, hindfoot 3.5,
    femur about 1 and tibia about 1 per cent still significantly increased on the treated side.
    Left-right differences were ABSENT in non-treated controls, excluding inherent asymmetry. racine2018
    replicated with 7 days of the same protocol in 3-week-old female C57BL/6, N=12: tibiae about 1 per
    cent longer (t=7.7, p<0.001) and femora about 1.4 per cent (t=11.5, p<0.001) on the 40 degrees C side
    versus the contralateral 30 degrees C side, with no left-right difference at baseline.'
  species: mouse
  source_ref: serrat2015
  uncertainty: 'THE DESIGN IS THE STRONGEST FEATURE - each animal is its own control, the untreated
    controls show no inherent asymmetry, the effect persists into adulthood, and it replicated in a
    separate study at a shorter duration. THE MAGNITUDE IS SMALL AND THE EXTRAPOLATION IS NOT SUPPORTED.
    One per cent of a mouse femur is micrometres. Scaling 1 per cent onto a human femur plus tibia gives
    of the order of a centimetre, but that arithmetic assumes the fractional effect transfers across a
    hundred-fold difference in bone length, across species, and across the age boundary serrat2013
    defines - and none of those assumptions is tested. THE THERMAL DOSE IS ALSO NOT INNOCENT: 40 degrees C
    for 40 minutes daily to one limb is a large, sustained local heat load, and no safety endpoint beyond
    body mass was reported.'
- parameter: 'EXERCISE PRODUCES THE SAME DELIVERY CHANGE, AND THE TAIL CONTROL SHOWS IT IS LOCAL'
  value: all runners had significantly longer limbs regardless of housing temperature, while tail length
    responded only to temperature
  unit: qualitative, with a within-study dissociation
  conditions: 'serrat2010. 68 weanling female mice housed at 16 or 25 degrees C with or without voluntary
    running-wheel access, 11 days. Limb length responded to running at both temperatures; TAIL length
    responded only to temperature, which the authors read as showing the exercise effect was local to
    limb bones rather than a systemic endocrine reaction. In vivo multiphoton imaging of fluoresceinated
    tracers showed enhanced solute delivery to tibial growth plates in wheel-running mice MEASURED AT REST
    UNDER ANAESTHESIA - a lasting change in delivery, not a transient one during activity.'
  species: mouse
  source_ref: serrat2010
  uncertainty: 'THE TAIL DISSOCIATION IS A GOOD INTERNAL CONTROL and it is the reason this row is here
    rather than being folded into a generic exercise entry. It separates a local delivery mechanism from
    the systemic endocrine response that exercise also produces. BUT the atlas already holds
    caetanosilva2021, where axial LOAD RESTRAINS elongation through mTOR, and the two are not obviously
    compatible - running loads the limb and here it lengthens it. The reconciliation may be that
    intermittent loading and quasi-static loading do opposite things, which is the atlas own reading of
    strain_frequency_dependence, but no study has tested delivery and load restraint in the same
    preparation. Until one does, the prescription LOAD THE LIMBS AND UNLOAD THE SPINE that the coverage
    audit derived should be treated as underdetermined rather than settled.'
- parameter: 'THE MECHANISM IS NOT ONLY DELIVERY, AND THE AGE WINDOW IS THE BINDING CONSTRAINT'
  value: temperature-dependent chondrocyte proliferation and matrix volume in metatarsals cultured WITHOUT
    vasculature; and tail elongation temperature-sensitive ONLY in the initial rapid phase
  unit: qualitative
  conditions: 'serrat2008 (PNAS): peripheral tissue temperature closely reflects housing temperature in
    vivo, and chondrocyte proliferation and extracellular matrix volume correlate strongly with tissue
    temperature in metatarsals cultured WITHOUT vasculature in vitro; the authors conclude vasomotor
    change modulates extremity growth INDIRECTLY via appendage temperature rather than via vascular
    nutrient delivery. serrat2013: weanling mice at 7, 21 or 27 degrees C for 8 weeks, N=28; tail
    elongation resolves into an initial RAPID phase whose rate is directly temperature-impacted and a
    SECOND phase in which rates are IDENTICAL among groups.'
  species: mouse
  source_ref: serrat2008
  uncertainty: 'THESE TWO RESULTS ARE THE HONEST BRAKE ON THIS NODE AND THEY COME FROM THE SAME GROUP THAT
    PRODUCED THE POSITIVE FINDINGS, WHICH MAKES THEM HARDER TO DISCOUNT. serrat2008 means the delivery
    framing cannot claim the whole effect - temperature acts directly on cartilage with no vasculature
    present at all, so at least part of what heating does is a Q10 effect on chondrocyte metabolism rather
    than better access. serrat2013 is worse for THIS CASE SPECIFICALLY: it says the skeleton is
    temperature-responsive only during a window of rapid growth, and every length result in this node is
    post-weaning mouse, squarely inside that window. A bone-age-16 subject is in the second phase by
    construction. THAT DOES NOT CLOSE THE DELIVERY ARGUMENT - a delivery multiplier for an administered
    drug is a different claim from a temperature effect on endogenous growth rate, and serrat2013 tested
    only the latter - but it removes any expectation that warming alone would lengthen a late plate.'
localization:
- 'growth plate, tibia and femur: where both the delivery and the length effects were measured'
- 'subperichondrial plexus and epiphyseal/metaphyseal vessels: the three routes solute enters by'
- 'extremities generally: ear and hindfoot responded several-fold more than long bones'
human_evidence: absent
human_evidence_note: There is no human study of any design. The temperature range used is described by the
  authors as physiological for a human knee, which is an argument about plausibility and not evidence.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Every result is post-weaning mouse inside the rapid-growth window that the same
  group shows is the only temperature-responsive phase, and mice are small enough that limb temperature
  tracks ambient temperature in a way a human limb does not.
confidence: C
claim_grades:
- claim: Local limb warming increases solute delivery into the growth plate, most strongly for molecules
    around 10 kDa.
  grade: B
  basis: Two independent in vivo multiphoton studies from the same group with quantified tracer entry,
    vessel diameter and blood velocity, and a core-clamped control in serrat2009 that isolates limb
    temperature from systemic temperature. Anaesthetised, surgically exposed preparations; dextrans not
    peptides.
- claim: Unilateral limb warming lengthens the treated limb, and the difference persists into adulthood.
  grade: B
  basis: serrat2015 with the contralateral limb as internal control, untreated animals showing no inherent
    asymmetry, and persistence at 7 weeks; independently replicated at 1 week by racine2018 with large t
    statistics. Mouse only, post-weaning only, and about 1 per cent.
- claim: The mechanism is increased delivery.
  grade: D
  basis: PARTLY REFUTED BY THE SAME GROUP. serrat2008 shows temperature drives chondrocyte proliferation
    and matrix volume in metatarsals cultured with no vasculature at all, so a direct thermal effect on
    cartilage contributes an unknown share and the delivery account cannot claim the whole effect.
- claim: This would work in a subject at bone age 16.
  grade: E
  basis: NOT SUPPORTED AND THERE IS A SPECIFIC REASON TO DOUBT IT. serrat2013 shows temperature
    sensitivity is confined to the initial rapid phase of elongation, with rates identical across a 20
    degree C range in the second phase. Every length result here is inside the rapid window. No human data
    of any kind exists.
- claim: Warming would potentiate a systemically administered peptide such as a CNP analogue.
  grade: E
  basis: Untested. It is an inference from the 10 kDa dextran result to a 4 kDa peptide, and no CNP
    analogue, IGF-I or any therapeutic has been measured in the growth plate under a heating protocol.
    Recorded because it is the version of this idea most relevant to the stack, not because it is shown.
key_refs:
- ref_id: serrat2014
  year: 2014
  type: primary
  one_line_finding: Hindlimb 22 to 34 degrees C increased growth-plate entry of 10 kDa dextran by more than
    150 per cent, size-dependently, with blood velocity up 118 per cent.
- ref_id: serrat2015
  year: 2015
  type: primary
  one_line_finding: Unilateral 40 degrees C heat lengthened the treated femur 1.3 and tibia 1.5 per cent
    with the contralateral limb as control, body mass and humerus unaffected, persisting at 7 weeks.
- ref_id: serrat2010
  year: 2010
  type: primary
  one_line_finding: Wheel running lengthened limbs at both housing temperatures and raised growth-plate
    solute delivery measured at rest, while tail length responded only to temperature.
- ref_id: serrat2008
  year: 2008
  type: primary
  one_line_finding: Temperature drives chondrocyte proliferation and matrix volume in metatarsals cultured
    WITHOUT vasculature - so the effect is not only delivery.
- ref_id: serrat2013
  year: 2013
  type: primary
  one_line_finding: Tail elongation is temperature-sensitive only in an initial rapid phase; in the second
    phase rates are identical across 7, 21 and 27 degrees C.
- ref_id: racine2018
  year: 2018
  type: primary
  one_line_finding: Independent replication - 7 days of unilateral 40 degrees C heat gave tibiae about 1
    per cent and femora about 1.4 per cent longer on the treated side.
