contradicts: >-
  Does not overturn a prior node. It CORRECTS THIS FILE'S SENSE OF SCALE.
  round264_where_to_attack_computed_not_recalled listed distraction osteogenesis among the 32 intervention
  nodes it could not assign to a term of the height identity and moved on; the term it belongs to is none
  of them, because it does not act on a growth plate at all. Pooled across 1149 patients it delivers 8.85 cm
  of femur and 7.36 cm of tibia against a pharmacological stack whose best measured human ceilings are 1.24
  cm (CNP analogues, 52 weeks) and 1.3 cm (aromatase inhibitor, 3 years). It also works AFTER fusion, so it
  is additive to rather than competitive with everything else in this atlas, and the one series that
  combined the two found no interference.
