id: round277_the_largest_intervention_available_is_an_order_of_magnitude_bigger_than_the_whole_pharmacological_stack
name: >-
  ROUND 277 - the uncomfortable arithmetic. Pooled across 1149 patients, femoral lengthening gains 8.85 cm
  and tibial 7.36 cm - about SIXTEEN CENTIMETRES from the two segments - against a whole pharmacological
  stack whose measured ceilings are 1 to 3 cm each. It works AFTER fusion, so it does not compete for the
  window. And the only combination series that exists found NO interference with the stack
aliases:
- round 277
- the sixteen centimetre option
- lengthening does not compete with the stack
- teriparatide doubles the distraction rate
type: intervention
layer: L6
stub: false
summary: >-
  THE OPERATOR ASKED FOR THE ACTUAL BEST THING THAT CAN BE ADDED. This atlas has spent hundreds of rounds
  on pharmacology and carries distraction osteogenesis as an intervention node that round 264's audit could
  not even assign to a term. THE ARITHMETIC IS NOT CLOSE AND IT SHOULD BE STATED PLAINLY.

  ONE - THE MAGNITUDE, POOLED. hosny2026 meta-analysed 14 studies and 1149 patients undergoing limb
  lengthening: MEAN FEMORAL GAIN 8.85 cm (95 per cent CI 7.42-10.28), MEAN TIBIAL GAIN 7.36 cm (CI
  6.21-8.52), mean humeral gain 8.38 cm. Femur and tibia together are about SIXTEEN CENTIMETRES OF STATURE.
  SET THAT AGAINST WHAT THIS FILE HAS MEASURED FOR EVERYTHING ELSE. CNP analogues, meta-analysed across
  four RCTs: +1.24 cm of standing height at 52 weeks. Aromatase inhibitor monotherapy, randomised, three
  years: +1.3 cm. Growth hormone after mid-puberty: approximately zero on attained height. The largest
  wild-type animal effect in the whole file, FGFR3-selective inhibition, is +8.2 per cent of a mouse femur.
  THE SURGICAL OPTION IS AN ORDER OF MAGNITUDE LARGER THAN THE ENTIRE PHARMACOLOGICAL STACK COMBINED.

  TWO - AND IT DOES NOT COMPETE FOR THE WINDOW, WHICH IS THE PROPERTY THAT MATTERS MOST HERE. Every
  pharmacological lever in this atlas is bounded by the closing growth plate; this one operates on a
  surgically created regenerate and WORKS AFTER FUSION. So it is not an alternative to the stack that has
  to be chosen instead - it is a separate account that stays open when the plate closes. For a subject at
  bone age 16 that distinction is the whole point.

  THREE - AND THE INTERFERENCE QUESTION, WHICH NOBODY IN THIS FILE HAD ASKED, HAS A FIRST ANSWER.
  allegri2025 reports the first real-world series combining CNP-analogue therapy with limb surgery: 16
  paediatric patients with molecularly confirmed achondroplasia, 13 undergoing lower limb lengthening and 3
  varus correction, all on vosoritide. The authors describe the roles as complementary with outcomes
  aligning closely with expectations, and note that concerns had been raised about drug effects on bone
  healing while orthopaedic experience suggested THE TWO OSSIFICATION PROCESSES DO NOT INTERFERE WITH ONE
  ANOTHER. THE GROWTH PLATE AND THE REGENERATE ARE SEPARATE ACCOUNTS AND THE ONE SERIES THAT TESTED IT
  FOUND THEM ADDITIVE.

  FOUR - THE REAL COST IS TIME AND COMPLICATIONS, AND BOTH ARE MEASURED. hosny2026 puts the mean FIXATOR
  INDEX at 37.1 days per centimetre (CI 32.37-41.82) and mean fixation duration at 7.71 months, with an
  OVERALL COMPLICATION RATE OF 56.1 PER CENT (CI 26.9-85.2). Pooled paediatric quality of life was 75.69,
  which the authors read as moderate improvement despite high treatment burden. THIS IS NOT A FREE
  SIXTEEN CENTIMETRES. It is roughly 37 days in frame for every centimetre, and a coin-flip chance of a
  complication.

  FIVE - WHICH MAKES THE RATE-LIMITER THE THING WORTH ATTACKING, AND IT IS DRUGGABLE. sharma2025 lengthened
  rabbit tibiae by 10 mm at either the standard 0.75 mm per day or a SUPRAPHYSIOLOGICAL 1.5 mm per day,
  with or without intermittent teriparatide. Failures of distraction osteogenesis occurred in one animal
  each in the standard-rate groups and the treated fast group, but in FOUR of twelve in the fast group
  WITHOUT teriparatide, a difference significant by log-rank at P = 0.02. TERIPARATIDE RESCUED THE FAILURE
  RATE AT DOUBLE THE DISTRACTION RATE. If that transfers, it halves the time in frame per centimetre, which
  is the dominant cost of the whole procedure.
  AND THIS DOES NOT REOPEN A CLOSED DOOR - IT IS A DIFFERENT ENDPOINT ENTIRELY. CORR-269 closed teriparatide
  for growth-plate height gain on the FDA rat package, where terminal femoral length was 0.0 per cent in
  every arm. That was about the physis. This is about a surgical regenerate: different tissue, different
  mechanism, different question, and the closure stands untouched.
  albishi2026 systematically reviewed the other adjuncts - LIPUS, platelet-rich plasma, bone marrow
  aspirate concentrate, culture-expanded mesenchymal stem cells and hyperbaric oxygen - across nine studies
  and 304 participants, and synthesised narratively because of substantial heterogeneity. That is the index
  for this question, not an answer to it.

  SIX - WHAT THIS ROUND IS AND IS NOT. IT IS NOT A RECOMMENDATION TO HAVE SURGERY - that is a decision for
  the subject and their clinicians, and the 56 per cent complication rate is the reason it is not a
  throwaway. IT IS A CORRECTION TO THIS FILE'S SENSE OF SCALE. The atlas has been optimising terms worth
  one to three centimetres while carrying, unanalysed and unassigned, the only intervention in existence
  that delivers sixteen. Every future ROI table has to be drawn against that number.
quantitative:
- parameter: >-
    POOLED LENGTHENING GAIN BY SEGMENT - AGAINST WHICH EVERY PHARMACOLOGICAL CEILING IN THIS FILE SHOULD BE
    READ
  value: >-
    mean femoral gain 8.85 cm (95 per cent CI 7.42-10.28), mean tibial gain 7.36 cm (CI 6.21-8.52), mean
    humeral gain 8.38 cm; mean fixator index 37.1 days per cm (CI 32.37-41.82); mean fixation duration 7.71
    months; overall complication rate 56.1 per cent (CI 26.9-85.2); pooled paediatric quality of life 75.69
    (CI 65.14-86.23)
  unit: cm, days per cm, months, per cent
  conditions: >-
    hosny2026, PRISMA systematic review and single-arm meta-analysis, 14 studies, 1149 patients with
    achondroplasia undergoing upper and/or lower limb lengthening.
  species: human
  source_ref: hosny2026
  uncertainty: >-
    ACHONDROPLASIA POPULATION AND SINGLE-ARM POOLING - there is no control arm because the procedure has no
    sham, so these are attained gains rather than gains against a counterfactual, and the confidence
    interval on the complication rate (26.9 to 85.2 per cent) shows how heterogeneous the studies are. The
    segments are not simply additive to standing height - femoral and tibial lengthening are usually staged
    rather than simultaneous, soft-tissue and joint limits bound the total, and lengthening beyond about 15
    to 20 per cent of segment length raises complication rates sharply. Achondroplastic bone and soft
    tissue may also tolerate lengthening differently from normally proportioned tissue, which cuts in an
    unknown direction for this case.
- parameter: >-
    CNP-ANALOGUE THERAPY AND LIMB LENGTHENING DO NOT APPEAR TO INTERFERE
  value: >-
    16 paediatric patients with molecularly confirmed achondroplasia on vosoritide underwent limb surgery -
    13 lower limb lengthening, 3 varus correction by epiphysiodesis - with outcomes described as aligning
    closely with expectations and the two ossification processes not interfering with one another
  unit: case series, n = 16
  conditions: allegri2025, first multicentre real-world series combining CNP-analogue therapy with limb surgery.
  species: human
  source_ref: allegri2025
  uncertainty: >-
    SIXTEEN PATIENTS, UNCONTROLLED, AND THE KEY PHRASE IS NARRATIVE - "aligning closely with expectations"
    is not a measurement, and no healing index, consolidation time or complication rate is compared against
    a non-vosoritide group. The paper itself describes the prior evidence as anecdotal. AND IT TESTS
    VOSORITIDE ONLY - there is NO data on an FGFR3 tyrosine kinase inhibitor during distraction, which
    matters because FGFR signalling participates in fracture repair and the stack's lead agent is a
    pan-FGFR inhibitor. That is a genuine open risk, not a reassurance.
- parameter: >-
    TERIPARATIDE PERMITTED DOUBLE-RATE DISTRACTION WITHOUT THE FAILURE PENALTY
  value: >-
    failures of distraction osteogenesis in 1 of 12 at standard rate with teriparatide, 1 of 12 at standard
    rate with saline, 1 of 12 at DOUBLE rate with teriparatide, and 4 of 12 at DOUBLE rate with saline;
    Kaplan-Meier log-rank P = 0.02 for the excess failures in the untreated fast group
  unit: failures per group of 12
  conditions: >-
    sharma2025, 24 New Zealand white rabbits, 10 mm tibial lengthening, 7-day latency, distraction at 0.75
    mm/day (physiological) or 1.5 mm/day (supraphysiological), consolidation 2.5 times the distraction
    phase, with intermittent teriparatide or saline. Outcomes included regenerate volume, bone mineral
    density and three-point bending strength.
  species: rabbit
  source_ref: sharma2025
  uncertainty: >-
    A FEASIBILITY STUDY IN 24 RABBITS WITH 12 PER GROUP AND FAILURE COUNTS IN SINGLE DIGITS - four versus
    one is a real difference by log-rank but rests on very small numbers. Rabbit bone healing is faster
    than human. AND THE ENDPOINT THAT MATTERS CLINICALLY, whether the regenerate was mechanically equivalent,
    is reported through bending parameters that are not extracted here. Teriparatide is not approved for
    this use and carries its own paediatric considerations. THIS IS SEPARATE FROM CORR-269's CLOSURE of
    teriparatide for growth-plate height - different tissue and different endpoint - and neither result
    bears on the other.
localization:
- 'surgically created regenerate: where lengthening acts, and it is not the growth plate'
- 'femur and tibia: 8.85 and 7.36 cm pooled'
human_evidence: direct
human_evidence_note: >-
  1149 patients pooled for the magnitude and complication data; 16 patients for the drug-surgery
  combination. The rate-acceleration result is rabbit.
species_basis:
- human
- rabbit
translation_risk: low
translation_risk_reason: >-
  The magnitude and cost data are human and pooled across 14 studies; the transfer question is population
  (achondroplasia versus normally proportioned) rather than species.
confidence: A
confidence_reason: >-
  The central claim is an arithmetic comparison between a pooled human meta-analysis of 1149 patients and
  this atlas's own measured pharmacological ceilings, all of which are already recorded here. Graded A for
  the magnitude comparison specifically; the combination and rate-acceleration rows are graded lower in
  their own fields.
claim_grades:
- claim: >-
    The pharmacological stack is the largest available lever on this subject's final height.
  grade: X
  basis: >-
    NO, AND NOT BY A SMALL MARGIN. Pooled femoral gain 8.85 cm and tibial 7.36 cm across 1149 patients,
    against +1.24 cm for CNP analogues at 52 weeks, +1.3 cm for aromatase inhibitor monotherapy over three
    years, and approximately zero for growth hormone after mid-puberty. The surgical option is an order of
    magnitude larger than the whole stack combined.
- claim: >-
    Lengthening and the pharmacological stack compete for the same window.
  grade: X
  basis: >-
    THEY DO NOT. Every pharmacological lever here is bounded by the closing growth plate; distraction
    osteogenesis operates on a surgically created regenerate and works AFTER fusion. They are separate
    accounts, and allegri2025's 16-patient series found the two ossification processes did not interfere.
- claim: >-
    An FGFR3 tyrosine kinase inhibitor is safe to continue during distraction osteogenesis.
  grade: E
  basis: >-
    UNKNOWN AND IT IS A REAL RISK RATHER THAN A THEORETICAL ONE. allegri2025 tested VOSORITIDE only. FGF
    signalling participates in fracture repair, the stack's lead agent is a pan-FGFR1-4 inhibitor, and no
    series, case report or animal study of an FGFR inhibitor during distraction has been identified. This
    is the specific unanswered question this round raises.
- claim: >-
    The time cost of lengthening is fixed.
  grade: D
  basis: >-
    PROBABLY NOT. sharma2025 doubled the distraction rate in rabbits from 0.75 to 1.5 mm/day and
    intermittent teriparatide removed the failure penalty - 1 of 12 failures with teriparatide against 4 of
    12 without, log-rank P = 0.02. If that transfers it halves the 37.1 days per centimetre that dominates
    the burden. Graded D because it is 24 rabbits, single-digit failure counts, and an off-label use.
- claim: >-
    This round reopens teriparatide, which CORR-269 closed.
  grade: X
  basis: >-
    IT DOES NOT. CORR-269 closed teriparatide for GROWTH PLATE height gain, on the FDA rat package in which
    terminal femoral length was 0.0 per cent in every arm. This is a surgically created regenerate -
    different tissue, different mechanism, different endpoint. The physis closure stands untouched and
    neither result bears on the other.
