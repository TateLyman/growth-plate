edges:
  - to: round428_the_transport_finding_refiled_as_the_exposure_term_and_the_multiplier_priced_honestly
    type: corrects
    note: >
      R428 began this extraction with three of twelve, reported the sample sizes as summing to 886
      and the resistance fraction as 135 participants, and recorded the discrepancy as unresolved.
      Both figures were wrong for the same reason - three studies contribute two intervention arms
      against a shared control. The corrected totals are 940, 177 resistance and 763 jumping.
  - to: round427_the_four_papers_read_and_the_axis_is_wrong_lateral_beats_axial_and_growth_happens_when_unloaded
    type: extends
    note: >
      R427 withdrew the word null from fuchs2001 and left the jumping arm UNDECIDED pending exactly
      this extraction. The extraction is now done and it decides against the arm: fuchs2001's +0.5 cm
      is the most favourable of seven jumping estimates whose weighted mean is -0.13 cm. R427's
      reopening was correct on the facts and does not survive the other six arms.
  - to: round426_the_loading_prescription_optimised_and_the_impact_half_is_rct_null_while_the_perfusion_half_is_untested
    type: supports
    note: >
      R426 predicted that the twelve estimates would scatter around zero because a height gain would
      have been a headline finding rather than a covariate. The prediction was declared in advance and
      the extraction confirms it, though R426's route to the conclusion (reading fuchs2001's abstract
      as a null) was wrong and R427 corrected it.
  - to: round425_the_site_term_opened_the_cnp_decision_made_and_the_loading_prescription_written
    type: contradicts
    note: >
      R425 prescribed impact-type intermittent axial loading - jumping - as a low-risk unproven
      adjunct on the strength of one non-randomised trial. Seven arms and 890 children now put the
      weighted estimate at -0.13 cm. Jumping should be offered as ordinary exercise, not as a height
      intervention.

