id: tgfbr2_receptor
name: TGFBR2
aliases:
- TGF-beta type II receptor
type: protein
layer: L3
stub: false
summary: TGFBR2 is the ligand-binding serine/threonine kinase receptor that recruits and transphosphorylates TGFBR1,
  which then phosphorylates SMAD2/3. Expression of a truncated kinase-defective TGFBR2 in mouse skeletal tissue under
  the Col2a1 promoter produces progressive terminal chondrocyte differentiation, loss of the articular surface and
  osteoarthritis-like change, establishing TGFBR2 output as a brake on chondrocyte maturation (Serra 1997). In human,
  heterozygous TGFBR2 missense mutations cause Loeys-Dietz syndrome, whose skeletal features (arachnodactyly, scoliosis,
  joint laxity, craniosynostosis) are consistent with altered cartilage and connective tissue TGF-beta signalling,
  but the human phenotype is dominated by aortic disease and no growth plate specimen has been assayed. TGFBR2 activity
  in the physis is thus mouse-established and human-inferred.
localization:
- 'mouse growth plate cartilage: transgene-based inference (serra1997)'
- 'human growth plate: unconfirmed'
human_evidence: indirect
human_evidence_note: Human TGFBR2 variants cause Loeys-Dietz syndrome with skeletal features; no human growth plate
  receptor data.
species_basis:
