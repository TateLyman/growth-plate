open_questions:
- g_l12_does_the_human_plate_produce_its_own_cnp
contradicts:
- 'STANDS AGAINST THE MOUSE LITERATURE HELD IN cnp_protein, WHICH IS NOT RESOLVED HERE. That node records
  that CNP is produced by growth-plate chondrocytes and acts locally, with cartilage-specific Nppc
  deletion reproducing essentially the phenotype and Nppc-null mice severely dwarfed. A human plate that
  does not transcribe NPPC at any age sampled here is hard to reconcile with that. The candidate
  reconciliations - species difference, age difference between neonatal mouse and pubertal human, or
  failure of the single GPL570 probe set - are not distinguished by any data in this atlas.'
