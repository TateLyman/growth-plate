type: protein
layer: L3
stub: false
summary: RBPJ is the DNA-binding transcription factor through which all four Notch receptors signal; without NICD
  it recruits corepressors, with NICD it recruits MAML and activates transcription. Because it is a single obligatory
  node, Rbpj deletion is the cleanest available Notch-off experiment. Prx1-Cre and Sox9-Cre driven Rbpj deletion in
  mouse limb mesenchyme/chondroprogenitors impairs the terminal stage of endochondral ossification and raises SOX9
  (Kohn 2015, Hosaka 2013), while Col2a1-CreERT-driven deletion in adult articular cartilage confers resistance to
  surgically induced osteoarthritis (Hosaka 2013). Deleting Rbpj in mesenchymal cells produces a rickets-like phenotype
  in mouse, indicating the requirement extends into mineralisation as well as differentiation (Gao 2022). RBPJ-independent
  Notch outputs exist in cartilage, so an Rbpj-null phenotype is a lower bound on Notch function, not a complete one.
  No human RBPJ growth plate data exist; human RBPJ haploinsufficiency causes Adams-Oliver syndrome, which is not
  primarily a physeal disorder.
localization:
