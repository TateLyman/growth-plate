summary: 'IFT80 is an IFT-B subunit and the first intraflagellar transport protein linked to human disease: hypomorphic
  IFT80 mutations cause a subset of Jeune asphyxiating thoracic dystrophy, an autosomal recessive chondrodysplasia
  with a constricted thoracic cage, short ribs, and often polydactyly, retinal degeneration and cystic kidney disease;
  ift80 knockdown gives cystic kidneys in zebrafish and short or absent cilia in Tetrahymena (Beales 2007). IFT80
  is predominantly expressed in growth plate chondrocytes, and silencing it in mouse stromal cells impairs cilium
  formation and chondrogenic differentiation with lower collagen II and aggrecan; the deficit is caused by simultaneously
  DOWN-regulated Hedgehog and UP-regulated WNT signalling, and is rescued by GLI2 overexpression (Wang 2013, mouse
  cells). Inducible Col2a1-CreER deletion of Ift80 shortens limbs when induced embryonically and, when induced postnatally,
  produces stunted growth with a shortened growth plate but THICKENED articular cartilage - opposite directions in
  the two cartilages of the same bone (Yuan 2015, mouse). IFT80 is therefore the best-anchored cilium node in this
  layer, with both human loss-of-function and mouse conditional genetics.'
localization:
- 'mouse growth plate chondrocytes: predominant expression site (wang2013)'
- 'human: inferred from Jeune asphyxiating thoracic dystrophy (beales2007)'
