paralog_risk: >-
  The FGF21 effect is assigned to an FGFR1-ERK arm on FGFR1 siRNA alone. FGFR3 is co-detected in
  the same chondrocytes by the same paper (wu2012), was never knocked down, and is the receptor
  the human growth plate actually expresses - FGFR1 is NOT detected in human growth plate
  chondrocytes (delezoide1998). The effects also required FGF21 at 5-10 ug/ml, far above
  physiological. The Fgf21-null in vivo result (wu2013) is ligand-selective and does not depend on
  which receptor carries it. See g_para_007.
