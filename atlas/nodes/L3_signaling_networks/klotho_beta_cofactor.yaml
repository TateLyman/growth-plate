id: klotho_beta_cofactor
name: Beta-Klotho
aliases:
- KLB
- beta-klotho
- FGF21 co-receptor
type: protein
layer: L3
stub: false
summary: 'Beta-Klotho (KLB) is the single-pass transmembrane co-receptor that converts FGFR1 and FGFR3
  from heparin-dependent paracrine receptors into receptors for the endocrine ligand FGF21; without KLB,
  FGF21 does not signal. Its relevance to this atlas is that it is the only demonstrated molecular entry
  point by which systemic caloric state reaches the growth plate through the FGF receptor family rather
  than through the GH/IGF-1 axis. Wu 2012 detected Fgf21, Fgfr1, Fgfr3 and Klb transcripts in fetal and
  3-week-old MOUSE growth plate chondrocytes, and showed that recombinant human FGF21 at 5-10 ug/ml suppressed
  thymidine incorporation and Col10a1 mRNA, abolished the GH-stimulated increase in both, and reduced
  125I-GH binding; siRNA against FGFR1 or ERK1 prevented every one of these effects, which localises the
  action to an FGFR1-ERK arm in the chondrocyte itself rather than to a systemic route. Wu 2013 completed
  the circuit in vivo: four weeks of food restriction in wild-type mice raised LEPROT and LEPROTL1 mRNA
  in liver AND in the tibial growth plate, Fgf21-knockout mice did not show that induction, and giving
  rhFGF21 back to food-restricted Fgf21-null mice restored it - so FGF21 is necessary for the undernutrition-induced
  growth-plate GH insensitivity, acting by trafficking GH receptor away from the chondrocyte surface.
  Two limits are load-bearing and must not be smoothed over: the concentrations that inhibited chondrocytes
  (5-10 ug/ml) are far above physiological circulating FGF21, and KLB has never been localised in human
  growth plate cartilage by any method, so the human arm of this pathway is inferred, not shown.'
quantitative:
- parameter: FGF21 concentration inhibiting chondrocyte thymidine incorporation and Col10a1 mRNA
