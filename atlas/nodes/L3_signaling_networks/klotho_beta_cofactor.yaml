paralog_audit_date: '2026-08-05'
paralog_risk: 'The FGF21 effect is assigned to an FGFR1-ERK arm on FGFR1 siRNA alone. FGFR3 is co-detected
  in the same chondrocytes by the same paper (wu2012), was never knocked down, and is the receptor the
  human growth plate actually expresses - FGFR1 is NOT detected in human growth plate chondrocytes (delezoide1998).
  The effects also required FGF21 at 5-10 ug/ml, far above physiological. The Fgf21-null in vivo result
  (wu2013) is ligand-selective and does not depend on which receptor carries it. See g_para_007.

  P8-01 UPDATE (2026-08-05): the premise that FGFR1 is not expressed in human growth plate chondrocytes
  does not survive re-analysis of GSE9160. FGFR1 is detected on 5 of 7 probe sets in all five compartments
  of both human donors, as are FGFR3 and FGFR4, and FGFR2 in two zones. All four FGFRs are present in
  the human physis, so the receptor-assignment question is open in humans rather than settled against
  FGFR1 - and it can no longer be argued from absence in either direction. Separately, CORR-004: the Fgf21-null
  in vivo result that this note called ligand-selective is withdrawn, so the argument that receptor identity
  does not matter for it no longer has a result to apply to.'
