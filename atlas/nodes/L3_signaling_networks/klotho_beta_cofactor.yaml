id: klotho_beta_cofactor
name: Beta-Klotho
aliases:
- KLB
- beta-klotho
- FGF21 co-receptor
type: protein
layer: L3
stub: false
summary: 'Beta-Klotho (KLB) is the single-pass transmembrane co-receptor that converts FGFR1 and FGFR3
  from heparin-dependent paracrine receptors into receptors for the endocrine ligand FGF21; without KLB,
  FGF21 does not signal. It entered this atlas as the one demonstrated molecular entry point by which
  systemic caloric state reaches the growth plate outside the GH/IGF-1 axis. THAT DEMONSTRATION HAS BEEN
  WITHDRAWN (CORR-004). What stands is wu2012, which carries no retraction or correction notice: Fgf21,
  Fgfr1, Fgfr3 and Klb transcripts are detectable in fetal and 3-week-old MOUSE growth plate chondrocytes,
  and recombinant human FGF21 at 5-10 ug/ml suppressed thymidine incorporation and Col10a1 mRNA, abolished
  the GH-stimulated increase in both, and reduced 125I-GH binding; siRNA against FGFR1 or ERK1 prevented
  each of these effects in culture. What has fallen away is the in vivo circuit. Wu 2013 reported that
  four weeks of food restriction raised LEPROT and LEPROTL1 mRNA in liver and tibial growth plate, that
  Fgf21-knockout mice did not show the induction, and that rhFGF21 add-back restored it - the knockout-plus-rescue
  design that made this pathway causal rather than correlative. That paper was WITHDRAWN BY ITS AUTHORS
  in 2020 (notice PMID 32917830) on data-integrity grounds: duplicated lanes in the Fig 1C actin immunoblot,
  duplicated lanes in BOTH the LEPROT and LEPROTL1 immunoblots of Fig 2C, and a splice in the LEPROTL1
  blot. Those blots ARE the LEPROT/LEPROTL1 measurement, so the observation does not survive independently
  of the interpretation and the disposition both_invalid is evidenced, not defaulted. The authors affirmed
  that the conclusions reflect work actually done in their laboratory; that affirmation is recorded and
  is not treated as restoring the data. Three limits are now load-bearing. The concentrations that inhibited
  chondrocytes (5-10 ug/ml) are far above physiological circulating FGF21. KLB has never been localised
  in human growth plate cartilage by any method. And there is no longer any in vivo evidence, in any species,
  that FGF21 mediates undernutrition-induced growth-plate GH insensitivity.'
