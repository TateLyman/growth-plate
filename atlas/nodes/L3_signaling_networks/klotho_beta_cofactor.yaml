- 'mouse growth plate chondrocyte: Klb, Fgfr1 and Fgfr3 mRNA confirmed at fetal and 3 weeks (wu2012)'
- 'human growth plate: not examined - no protein, mRNA or in situ localization retrieved (gap g_l0l9_001)'
human_evidence: absent
human_evidence_note: No human growth plate expression or functional data for beta-Klotho or FGF21 were
  retrieved; all data are murine or murine primary culture.
species_basis:
- mouse
- in_vitro_animal_cell
translation_risk: high
translation_risk_reason: The entire mechanism rests on two papers from one laboratory in mouse, at FGF21
  concentrations well above physiological, and humans differ from mice in the FGF21 response to undernutrition.
  Restating this as a human pathway would be exactly the laundering this atlas exists to prevent.
confidence: D
claim_grades:
- claim: Beta-Klotho is expressed in growth plate chondrocytes and permits FGF21 signalling there.
  grade: D
  basis: Mouse mRNA detection at two ages plus siRNA epistasis in culture, from a single laboratory, in
    ONE paper. It was graded C on the strength of being replicated across wu2012 and wu2013; wu2013 is
    withdrawn, so the replication is gone and the grade falls one step to D. CORR-004.
- claim: FGF21 acting through beta-Klotho/FGFR1 mediates growth-plate GH insensitivity during undernutrition.
  grade: X
  basis: WITHDRAWN. This claim rested entirely on wu2013 (Fgf21-null loss of induction with rhFGF21 add-back
    rescue), withdrawn by J Biol Chem in 2020 with no retrievable reason. There is now no in vivo evidence
    in any species. Graded X - repeated in the literature but not traceable to standing primary data -
    and logged in audit/corrections.md as CORR-004 rather than deleted, because the claim continues to
    circulate.
- claim: This pathway operates in the human growth plate.
  grade: E
  basis: Inference from mouse only; no human localization or functional data exist.
