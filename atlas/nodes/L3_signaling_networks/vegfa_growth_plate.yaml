id: vegfa_growth_plate
name: VEGFA in the growth plate
aliases:
- vascular endothelial growth factor A
type: protein
layer: L3
stub: false
summary: VEGFA couples the hypertrophic chondrocyte to the vasculature that will replace it. Sequestering VEGF with
  a soluble receptor chimera in growing mice suppresses blood vessel invasion of the hypertrophic cartilage, expands
  the hypertrophic zone, impairs trabecular bone formation and is reversible on withdrawal - a pharmacological, dose-reversible
  demonstration that vascular invasion is VEGF-gated (Gerber 1999, mouse). Genetically, Col2a1-Cre deletion of Vegfa
  delays vessel invasion of the primary ossification centre and delays removal of terminal hypertrophic chondrocytes,
  but it also causes massive death of epiphyseal and joint chondrocytes far from any vessel, indicating a direct chondrocyte-survival
  role and not only an angiogenic one (Zelzer 2004, mouse). The cell-death pattern closely resembles the Hif1a-null
  pattern and HIF1A-null epiphyseal chondrocytes make less VEGFA, placing HIF1A-VEGFA on one survival axis - though
  Schipani 2001 also documents HIF1A-independent VEGF induction around dying cells. Perichondrial Vegfa additionally
  controls perichondrial vascularity and osteoblast differentiation (Duan 2015, mouse). No human growth plate VEGFA
  measurement is available.
localization:
- 'mouse HZ: confirmed - VEGFA from hypertrophic chondrocytes drives vessel invasion (gerber1999)'
- 'mouse epiphyseal/joint chondrocytes: VEGFA required for survival (zelzer2004)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No human growth plate VEGFA data; anti-VEGF therapeutics are not used in growing children in
  a way that yields physeal read-outs.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Mouse pharmacology and conditional genetics; human physeal vascular biology is undescribed
  at this level.
confidence: C
