id: gp130_stat3_controls_pool_and_fusion
name: gp130/STAT3 is the first axis found that controls the progenitor pool AND fusion timing together, postnatally and chondrocyte-autonomously - and its small molecule has a contested sign
aliases:
- the gp130 lead
- RCGD 423 / 423F
- STAT3 in the growth plate
type: pathway
layer: L3
stub: false
summary: 'THIS IS THE STRONGEST NEW LEAD IN THE PROJECT AND IT LANDS ON THE TERM THE ROUND-86 COVERAGE
  AUDIT CALLED COMPLETELY UNHIT. liu2022gp130 deleted Stat3 in chondrocytes POSTNATALLY and got SEVERELY
  REDUCED PROLIFERATION, INCREASED HYPERTROPHY, GROWTH PLATE FUSION AND STUNTING, with progressive
  articular dysfunction. Chondrocyte-specific deletion of gp130, the IL-6-family co-receptor that
  activates Stat3, PHENOCOPIED it; deleting Lifr, one of many gp130 co-receptors, gave a milder
  phenotype. The authors frame the tissue exactly as this atlas does - "growth of long bones and
  vertebrae is maintained postnatally by a long-lasting pool of progenitor cells" - and conclude that
  IL-6 family cytokines have a PIVOTAL POSITIVE function in the skeleton. WHY THAT MATTERS MORE THAN
  ANOTHER PATHWAY. Every other candidate in this atlas moves ONE term. This one moves two that the
  atlas had been treating as separate arms: losing it costs proliferation (the pool and amplification
  terms) AND closes the plate (the duration term). Nothing else held here does both, and it does them
  CHONDROCYTE-AUTONOMOUSLY and POSTNATALLY - not from the limb bud, which is the caveat that weakened
  the Dnmt1 and Uhrf1 results. THE MOLECULE EXISTS AND IS PATENTED. shkhyan2018 screened 170,000
  compounds and found RCGD 423, a small-molecule gp130 modulator, which INCREASED PROLIFERATION while
  REDUCING APOPTOSIS AND HYPERTROPHY in adult chondrocytes - the exact profile a growth plate wants.
  It is the same compound sarkar2023 calls "the STAT3 agonist 423F". AND ITS SIGN IS CONTESTED, WHICH
  IS THE REASON THIS NODE IS GRADED D RATHER THAN B. he2024gp130 reports that RCGD423 drives gp130
  homodimerisation and phosphorylation of Y759, that Y759 RECRUITS SHP2 AND SOCS3 AND INHIBITS
  ACTIVATION OF THE STAT3 PATHWAY, and that its effects run through ERK and AKT. Two groups, one
  molecule, opposite claims about whether STAT3 goes up or down. IF he2024gp130 IS RIGHT, THEN GIVING
  RCGD 423 TO A GROWING PLATE WOULD REPRODUCE THE liu2022gp130 DELETION PHENOTYPE - reduced
  proliferation, increased hypertrophy, PREMATURE FUSION. That is the same class of sign error CORR-082
  caught on the methylation axis one round ago, and it must be resolved before this is treated as a
  candidate rather than a question. NO GROWTH PLATE, NO BONE LENGTH, NO GROWING ANIMAL HAS EVER SEEN
  THIS MOLECULE.
  ROUND 90, ON THE FULL TEXT OF liu2022gp130, CHANGES THREE THINGS AND THE THIRD IS THE IMPORTANT ONE.
  FIRST, THE GAIN-OF-FUNCTION EXISTS AND WAS IN THE PAPER ALL ALONG (CORR-086): constitutively active
  Stat3C, Acan-Cre-ERT2, tamoxifen at P2/P3, gives DRAMATIC HYPERCELLULARITY in the proximal tibial growth
  plate with significantly more EdU-positive chondrocytes, and RESCUES the gp130 deletion defect. It has
  NO LENGTH ENDPOINT, and hypercellularity without length is the widening signature that precedes
  mechanical failure. SECOND, THE SIGN: liu2022gp130 states plainly that RCGD 423 "increases activation
  of Stat3" - but that is the originating group for the third time, not an independent measurement, and
  he2024gp130 still stands unanswered. What is genuinely new is the LOCALISATION: gp130 and Stat3 are
  both ENRICHED IN THE RESTING AND PROLIFERATIVE ZONES of the wild-type mouse growth plate, which is
  precisely where a pool-term target should sit. THIRD, AND IT ATTACKS THE CURRENT STACK: estradiol
  RAISES chondrocyte STAT3 in both sexes in vitro, and the aromatase inhibitor LETROZOLE, given daily for
  7 days in vivo, REDUCED both Stat3 levels and activity. An aromatase inhibitor is in the proposed
  stack. Oestrogen closes the plate through ESR1 and sustains proliferation through gp130/STAT3, so
  suppressing it buys duration and pays in proliferation - which is a mechanism for the letrozole-versus-
  anastrozole null the atlas has carried unexplained, where deeper suppression bought NO extra predicted
  height.'
quantitative:
- parameter: 'POSTNATAL chondrocyte-specific Stat3 deletion - the phenotype, and it is both terms at once'
  value: severely reduced proliferation, increased hypertrophy, GROWTH PLATE FUSION, stunting
  unit: qualitative
  conditions: postnatal chondrocyte-specific deletion of Stat3 in mouse; chondrocyte-specific deletion of
    gp130 phenocopied it; deletion of Lifr, one of many co-receptors signalling through gp130, produced a
    MILDER phenotype. The effect is sexually dimorphic, with females more strongly affected than males.
    Articular cartilage showed signs of progressive dysfunction in the same animals
  species: mouse
  source_ref: liu2022gp130
  uncertainty: 'THE DESIGN IS BETTER THAN ANYTHING ELSE THIS ATLAS HOLDS ON THE POOL TERM AND THAT IS WHY
    IT MATTERS: it is POSTNATAL and CHONDROCYTE-SPECIFIC, so it does not carry the developmental
    confound that weakens the Dnmt1 (Prrx1-Cre limb bud) and Uhrf1 results, and the gp130 deletion
    phenocopying the Stat3 deletion makes the receptor-to-transcription-factor link genetic rather than
    pharmacological. WHAT IT IS NOT: a LOSS-of-function result, so it establishes that the pathway is
    REQUIRED and says nothing about whether MORE of it grows a longer bone. The atlas has made exactly
    that leap before and been wrong. The sexual dimorphism is unexplained and is a warning that the
    pathway interacts with sex steroid, which is the arm anastrozole is already acting on. And no bone
    length is reported here in a gain-of-function direction because no gain-of-function was run.'
- parameter: 'THE MOLECULE - a gp130 modulator from a 170,000-compound screen, with the right in vitro
    profile and the wrong tissue'
  value: increased proliferation, reduced apoptosis, reduced hypertrophic responses
  unit: qualitative, adult chondrocytes in vitro
  conditions: RCGD 423 (Regulator of Cartilage Growth and Differentiation), identified by high-throughput
    screening of 170,000 compounds for the ability to decrease a hypertrophy reporter; described as
    biasing gp130 signalling toward the anti-inflammatory and pro-regenerative output. Tested in adult
    chondrocytes in vitro and in a rat partial meniscectomy model. This is the compound sarkar2023 applied
    to aged human chondrocytes as "the STAT3 agonist 423F", where it lowered predicted methylation age in
    5 of 6 donors
  species: rat
  source_ref: shkhyan2018
  uncertainty: 'THE PROFILE IS THE ONE A GROWTH PLATE WANTS - more proliferation, less hypertrophy - AND
    IT HAS NEVER BEEN NEAR A GROWTH PLATE. Every experiment is adult articular cartilage or a joint
    injury model. NO BONE LENGTH ENDPOINT EXISTS FOR THIS MOLECULE IN ANY SPECIES, and no growing animal
    has received it. Two further limits. The osteoarthritis programme selects for compounds that REDUCE
    hypertrophy, which is desirable in a joint and is only conditionally desirable in a growth plate,
    where terminal hypertrophy is the step that produces the height. And the sarkar2023 methylation
    result, which is the only human data on the molecule, moves methylation in the ARTICULAR direction -
    which CORR-082 established is the reverse of the growth plate direction.'
- parameter: 'THE SIGN CONTRADICTION - two groups, one molecule, opposite claims about STAT3'
  value: STAT3 agonist versus SHP2/ERK activator that INHIBITS STAT3
  unit: qualitative, direction
  conditions: 'shkhyan2018 and sarkar2023 (same laboratory) describe RCGD 423 / 423F as biasing gp130
    toward STAT3 and use it as a STAT3 AGONIST. he2024gp130 (independent group) reports that RCGD423
    drives gp130 homodimerisation and phosphorylation of residue Y759 without IL-6 or IL-6R, that
    phosphorylated Y759 recruits SHP2 and SOCS3 and INHIBITS activation of the STAT3 pathway, and that
    the functional effects run through ERK and AKT. A third paper from the originating group
    (Science Translational Medicine 2023) describes a DIFFERENT molecule, R805, acting by INHIBITING
    gp130 Y814 upstream of SRC and MAPK'
  species: multiple
  source_ref: he2024gp130
  uncertainty: 'THIS IS DECISIVE AND UNRESOLVED. gp130 has multiple phosphotyrosines with opposing
    outputs - the STAT3 arm and the Y759-SHP2-RAS-MAPK arm - so "modulator" is doing a great deal of work
    and a molecule that biases between them can be described accurately as an agonist of one and an
    inhibitor of the other. THE CONSEQUENCE FOR THIS PROJECT IS ASYMMETRIC AND THAT IS WHY IT BLOCKS.
    If RCGD 423 raises STAT3 output, it is pointed at the liu2022gp130 phenotype from the protective
    side. If he2024gp130 is right that it suppresses STAT3, then in a growth plate it would move toward
    the DELETION phenotype - reduced proliferation, increased hypertrophy, PREMATURE FUSION - which is
    the worst possible outcome for a bone-age-16 subject and would be indistinguishable from doing
    nothing until the plate had already closed. CORR-082 caught exactly this class of error on the
    methylation axis one round earlier. The atlas does not adopt this molecule until the direction is
    measured in chondrocytes with a STAT3 phosphorylation readout.'
- parameter: 'THE METABOLIC READING OF THE SAME TERM - glycolytic flux holds a stem pool, oxidative flux
    spends it, and MPC1 is the switch'
  value: Ldha deletion PREVENTED stem cell activation; Mpc1 deletion ACCELERATED it
  unit: qualitative, direction
  conditions: 'flores2017, mouse hair follicle stem cells - HFSCs use glycolytic metabolism and produce
    significantly more lactate than other epidermal cells; deleting lactate dehydrogenase Ldha prevented
    their activation; genetically promoting lactate by deleting the mitochondrial pyruvate carrier Mpc1
    accelerated activation; and small molecules raising lactate by stimulating Myc or INHIBITING MPC1
    reproduced the effect topically. Set against yanagihara2025, where Dnmt1-null chondrocytes show
    INCREASED oxygen consumption, ATP production and nearly all TCA metabolites, and differentiate and
    calcify PREMATURELY with arrested elongation'
  species: mouse
  source_ref: flores2017
  uncertainty: 'TWO COMPLETELY INDEPENDENT TISSUES POINT THE SAME WAY AND THAT IS THE WHOLE VALUE OF THE
    ROW: glycolytic flux is the progenitor state, oxidative flux is the differentiating state. It gives
    the yanagihara2025 result a reading beyond its own model - the Dnmt1-null plate is not merely
    dysregulated, it is METABOLICALLY PUSHED OUT OF THE PROGENITOR STATE - and it names a druggable
    node, MPC1, for which tool compounds exist and which nothing in this atlas has touched. THE LIMITS
    ARE SEVERE AND THE ROW IS GRADED E. Hair follicle is not growth plate; no MPC inhibitor has ever
    been given to a growth plate in any species; the growth plate resting zone is already hypoxic and
    glycolytic at baseline, so it may have no headroom on this axis at all; and pushing a plate further
    toward the progenitor state could as easily mean LESS terminal hypertrophy, which is the term that
    produces the height. It is a hypothesis with a named target, not a candidate.'
- parameter: 'THE GAIN-OF-FUNCTION EXISTS AND IS POSITIVE - and it was in the same paper (CORR-086)'
  value: dramatic hypercellularity and significantly more EdU-positive chondrocytes; rescues the gp130
    deletion defect
  unit: qualitative, plus EdU incorporation
  conditions: 'Acan-Cre-ERT2 crossed to a conditional constitutively active Stat3 allele (Stat3C) under
    the Rosa26 promoter, tamoxifen at P2/P3, analysed at 1 month. DRAMATIC HYPERCELLULARITY in proximal
    tibial growth plates, confirmed as hyperproliferation by EdU incorporation with significantly more
    EdU-positive chondrocytes than Rosa26-Stat3C controls. Hypercellularity also in articular cartilage
    superficial and deeper zones, less dramatic than in the growth plate. Constitutive Stat3 activation
    RESCUED the proliferation defect of Acan-Cre-ERT2; gp130 fl/fl mice.'
  species: mouse
  source_ref: liu2022gp130
  uncertainty: 'THIS IS THE EXPERIMENT ROUNDS 88 AND 89 SAID DID NOT EXIST, AND IT WAS IN THE PAPER THE
    ATLAS WAS ALREADY CITING (CORR-086). It is postnatal, inducible, chondrocyte-specific and in the
    right direction, and the rescue of the gp130 mutant closes the receptor-to-effector loop from both
    ends. AND IT HAS NO LENGTH ENDPOINT. The reported outcomes are hypercellularity and EdU incorporation;
    no bone length is given for Stat3C anywhere. Under the CORR-062 rule this cannot support a claim that
    activating STAT3 lengthens bone. THE MISSING ENDPOINT IS NOT NEUTRAL HERE, IT IS THE WORRYING ONE.
    "Dramatic hypercellularity" is a thicker, more crowded plate, and this atlas already holds that an
    FGFR inhibitor produces growth plate WIDENING and that ultimate tensile stress falls linearly with
    plate thickness (williams2001) - the configuration that preceded the human kyphoscoliosis and the
    SCFE series. More cells is not more length, and a hypercellular plate is the histological signature
    of the failure mode this stack is already carrying.'
- parameter: 'THE SIGN QUESTION, ANSWERED BY THE GROUP THAT OWNS THE GROWTH PLATE DATA - but not by a
    third party'
  value: a small molecule modulator of gp130 that INCREASES activation of Stat3
  unit: qualitative, direction
  conditions: liu2022gp130 states directly that RCGD 423 "increases activation of Stat3" and increased
    proliferation of articular chondrocytes without activating ECM catabolism, citing their own earlier
    work. In the same paper, gp130 expression in the wild-type mouse growth plate at 1 month is ENRICHED
    IN THE RESTING AND PROLIFERATIVE ZONES, matching the Stat3 expression pattern
  species: mouse
  source_ref: liu2022gp130
  uncertainty: 'THIS RESOLVES THE ROUND-89 SIGN QUESTION IN THE DIRECTION THAT FAVOURS THE LEAD, AND THE
    RESOLUTION IS WEAKER THAN IT LOOKS. It is the ORIGINATING LABORATORY restating its own position for
    the third time (shkhyan2018, sarkar2023, liu2022gp130 are one group), not an independent measurement.
    he2024gp130 remains the only outside group to have looked, and it reports the opposite - Y759
    phosphorylation recruiting SHP2 and SOCS3 and inhibiting STAT3. NO INDEPENDENT pSTAT3 MEASUREMENT IN
    CHONDROCYTES HAS BEEN PUBLISHED EITHER WAY. What genuinely strengthens the lead is the ZONAL
    LOCALISATION, which is a different kind of evidence: gp130 and Stat3 are both enriched in the resting
    and proliferative zones, which is exactly where a pool-term target should sit and is not something
    either group had to find.'
- parameter: 'THE FINDING THAT ATTACKS THE CURRENT STACK - an aromatase inhibitor LOWERS chondrocyte
    STAT3 in vivo'
  value: Letrozole reduced both Stat3 levels and Stat3 activity
  unit: qualitative, protein level and activity
  conditions: 'Estradiol raised STAT3 protein levels and activity in BOTH female and male articular
    chondrocytes in vitro - females maximal at 0.1 micromolar, males dose-dependent. In vivo, the
    clinically used aromatase inhibitor LETROZOLE was injected intraperitoneally daily for 7 days into
    sexually mature FEMALE mice, and analysis of sternal chondrocytes showed REDUCED Stat3 levels AND
    activity. The authors read this as enhanced oestrogen in growing females creating a differential
    requirement for Stat3.'
  species: mouse
  source_ref: liu2022gp130
  uncertainty: 'THIS IS A MEASURED IN VIVO ANTAGONISM BETWEEN A DRUG IN THE PROPOSED STACK AND THE AXIS
    THAT KEEPS THE PLATE PROLIFERATING AND OPEN, AND THE ATLAS HAS NEVER CONSIDERED IT. Oestrogen turns
    out to do two opposite things at the plate - close it through ESR1, and sustain STAT3-driven
    proliferation through this route - so an aromatase inhibitor buys duration and pays for it in
    proliferation. IT ALSO SUPPLIES A MECHANISM FOR A NULL THIS ATLAS HAS CARRIED UNEXPLAINED: letrozole
    achieves lower oestradiol and slower bone-age advance than anastrozole and produces NO
    predicted-height advantage, with a combined 3-year gain of only +1.3 cm. Deeper suppression buying
    more time and costing more proliferation is exactly what would flatten that curve. THE LIMITS ARE
    REAL AND THEY CUT BOTH WAYS. The letrozole experiment is 7 days, in SEXUALLY MATURE FEMALE mice, read
    out in STERNAL chondrocytes rather than a growth plate, with no length or fusion endpoint - it is a
    biomarker result, not an outcome. The subject here is male, and although E2 raised STAT3 in male
    chondrocytes in vitro, the in vivo aromatase-inhibitor arm was female-only. AND THE HUMAN EVIDENCE
    STILL POINTS THE OTHER WAY OVERALL: smith1994 and herrmann2002 are men with lifetime absent
    oestrogen signal at 204 and 197 cm, so whatever this costs, removing oestrogen remains strongly
    net-positive for adult height. What changes is that the cost is now named and measurable rather than
    assumed to be zero.'
- parameter: 'THE HUMAN EVIDENCE ON THIS AXIS, AND IT RUNS THE OTHER WAY'
  value: growth velocity versus IL-6, r = -0.337, p = 0.003
  unit: Spearman correlation
  conditions: '78 children with juvenile idiopathic arthritis. Growth velocity correlated NEGATIVELY with
    IL-6 (r = -0.337, p = 0.003), CRP (r = -0.386, p = 0.001) and ESR (r = -0.269, p = 0.022). Children
    with IL-6 above 1 pg/mL (n = 28, 35.9 per cent) had growth velocity Z-score -1.66 +/- 2.44 against
    -0.07 +/- 2.48 (p = 0.006). In multiple linear regression only elevated IL-6 was INDEPENDENTLY and
    negatively associated with growth velocity; cumulative glucocorticoid exposure was not. Separately,
    liu2022gp130 itself cites that many juvenile arthritis patients treated with the anti-IL-6R antibody
    TOCILIZUMAB achieved normalised growth rates when serum IL-6 normalised - which is INTERVENTIONAL
    human evidence in the same direction.'
  species: human
  source_ref: souza2008
  uncertainty: 'THE ONLY HUMAN DATA ON THIS AXIS SAY THAT LOWERING IL-6 SIGNALLING IMPROVES GROWTH, WHICH
    IS THE OPPOSITE OF WHAT THE MOUSE GENETICS SAY, AND IT IS OBSERVATIONAL PLUS ONE CITED INTERVENTION
    RATHER THAN A TRIAL. THE OBVIOUS DEFLATION FIRST: CRP correlated MORE strongly than IL-6 (-0.386
    against -0.337), so IL-6 may be indexing inflammation generally rather than acting specifically, and
    chronic inflammation suppresses growth by several routes this atlas already holds - GH resistance,
    IGF-1 suppression, undernutrition, and the disease itself. The multivariable model retaining only
    IL-6 is suggestive but n = 78 with collinear inflammatory markers cannot separate them cleanly. THE
    RECONCILIATION THAT THE PAPER ITSELF SUPPLIES IS BETTER THAN A DEFLATION, AND IT IS IN liu2022gp130
    SUPPLEMENTARY FIGURE 1: across four stages of human ontogeny, gp130 is expressed at all stages but
    LIF IS ENRICHED AT FETAL AND ADOLESCENT STAGES, WHEN GROWTH PLATES ARE ACTIVE IN HUMANS. gp130 is
    the shared co-receptor for a whole cytokine family; if the growth-plate ligand is LIF or OSM, then
    inflammatory IL-6 is a different input arriving at the same receptor. Liu themselves reach for the
    word CALIBRATED and say it remains to be determined whether the disease and developmental functions
    are identical. THE SECOND RECONCILIATION IS MECHANISTIC AND IS THIS ATLAS OWN, GRADED E: chronic
    IL-6 induces SOCS3, SOCS3 docks at gp130 Y759, and that shuts down the STAT3 arm - so sustained
    inflammatory IL-6 could produce LOW chondrocyte STAT3, which would make both datasets agree at the
    level of STAT3 output and disagree only at the level of ligand. Untested here.'
- parameter: 'AND THAT SHARPENS THE SIGN QUESTION RATHER THAN SETTLING IT - Y759 IS the SOCS3 docking site'
  value: the two proposed mechanisms map onto the two arms the human and mouse data already dissociate
  unit: qualitative
  conditions: he2024gp130 reports RCGD423 acting by phosphorylating gp130 Y759 and recruiting SHP2 AND
    SOCS3; Y759 is the canonical negative-feedback site through which sustained IL-6 signalling
    terminates the STAT3 arm. shkhyan2018, sarkar2023 and liu2022gp130 - one laboratory - report the
    molecule as increasing STAT3 activation
  species: not_applicable
  source_ref: he2024gp130
  uncertainty: 'THIS IS THE MOST DECISION-RELEVANT THING IN THE NODE AND IT IS WHY THE MOLECULE STAYS
    UNADOPTED. If he2024gp130 is right, RCGD 423 engages the SAME ARM that chronic inflammatory IL-6
    engages - the Y759-SHP2-SOCS3 arm that terminates STAT3 - which would make it behave at a growth
    plate like the JIA phenotype rather than like the Stat3C phenotype. The two candidate mechanisms for
    this molecule are not merely different, they correspond exactly to the two gp130 output arms that the
    human and mouse evidence already pull apart. THAT IS AN ARGUMENT ABOUT PLAUSIBILITY, NOT A
    MEASUREMENT, and it is graded accordingly: no independent pSTAT3 measurement in chondrocytes exists
    either way, and a single Western blot from any laboratory outside the originating group would settle
    it. Until then the atlas treats a molecule whose sign determines whether it grows a plate or fuses
    one as unusable.'
- parameter: 'THE SIGN DISPUTE IS RESOLVED BY THE PATENT FAMILY, AND THE RESOLUTION IS THAT BOTH SIDES
    ARE RIGHT ABOUT DIFFERENT MOLECULES'
  value: 423F is the POSITIVE CONTROL for the pSTAT3/MYC-activating phenotype; other analogues in the
    same family are neutral or inhibitory at the same pocket
  unit: qualitative, by Western blot
  conditions: 'WO2019169135A1 separates the chemical family by signalling phenotype - Figure 19A-B shows
    different test chemicals acting as ACTIVATORS, NEUTRAL EFFECTORS OR INHIBITORS of pSTAT3 and MYC in
    porcine chondrocytes, assessed by Western blot, and Figure 20 states that "423F is the positive
    control drug". The inhibitory analogues bind the SAME POCKET but stabilise an inactive conformation:
    CX-011/B8 is predicted to bind gp130 where RCGD423 binds while locking domain 2 into a non-permissive
    conformation, and molecule 826 inhibits OSM-mediated gp130 activation and downstream JAK2, SHP2,
    NF-kB and SRC. The patents also name MPA-1/RCGD 423F, MPA-2/RCGD 423N and MPA-4/RCGD 423/RCGD 423B as
    DISTINCT COMPOUNDS. WO2016138533A2 frames them as BINDING SITE 1 gp130 AGONISTS - binding site 1
    being gp130 Lys173, Ala174, Arg175, Lys176 - and its method claims expressly cover increasing pSTAT3
    expression, increasing MYC expression, and TRANSFORMING A MATURE ADULT CELL INTO A PROGENITOR CELL,
    with a reported Western using phospho-STAT3 antibody #9131 Cell Signaling in adult human and pig
    chondrocytes.'
  species: not_applicable
  source_ref: wo2019169135
  uncertainty: 'THIS DISSOLVES THE ROUND-89 AND ROUND-91 CONTRADICTION RATHER THAN ADJUDICATING IT. The
    scaffold produces BOTH signs depending on the analogue, and "RCGD 423" is an ambiguous name covering
    at least four distinct compounds. sarkar2023 used 423F; he2024gp130 used "RCGD423". If those are
    different members, the two groups may both be reporting correctly about different molecules, and the
    atlas spent two rounds treating a naming collision as a mechanistic dispute. WHAT IT DOES NOT DO IS
    MAKE THE EVIDENCE INDEPENDENT. Everything here is the originating group speaking - in a patent, which
    is a document with a commercial interest in a broad mechanistic claim, even though the Western blots
    and antibody catalogue numbers are specific enough to be checkable. AN INDEPENDENT pSTAT3 MEASUREMENT
    ON A NAMED, CAS-IDENTIFIED COMPOUND IS STILL MISSING, and the practical consequence is that any
    sourcing of this molecule must specify WHICH analogue, because two of them do opposite things.'
- parameter: 'THE MOLECULE, IDENTIFIED - and it is small enough that delivery is not a barrier'
  value: N-(4-fluorophenyl)-4-phenylthiazol-2-amine, 270.3 Da
  unit: daltons
  conditions: WO2016138533A2 paragraph immediately before the claims gives 423F as
    "N-(4-fluorophenyl)-4-phenylthiazol-2-amine (MPA-1/RCGD 423F)", C15H11FN2S, molecular weight computed
    by this atlas as 270.3 Da and independently confirmed by a commercial catalogue listing of the same
    compound - CAS 339303-87-6, MW 270.33, 99 per cent purity - which establishes that 423F is a
    catalogued screening chemical rather than only an internal laboratory code, though that listing is
    currently marked unavailable for purchase. Against the growth-plate partition curve this atlas holds, where fluorescein
    at about 332 Da partitions at roughly 100 per cent, 3 kDa at 60 per cent, 10 kDa at 10 per cent and
    40 kDa at zero
  species: not_applicable
  source_ref: wo2016138533
  uncertainty: 'A 270 Da aminothiazole sits firmly on the PLATEAU of the partition curve, below even
    fluorescein - so unlike vosoritide at about 4 kDa, matrix entry into the growth plate is not a
    limiting step for this compound. THAT IS A REAL ADVANTAGE AND IT IS ALSO THE ONLY ADVANTAGE THAT CAN
    BE CLAIMED WITHOUT AN EXPERIMENT. Molecular weight predicts partition into cartilage matrix; it says
    nothing about oral bioavailability, plasma protein binding, half-life, metabolism or free
    concentration at the kinase, none of which is held here for this molecule. A simple aminothiazole is
    also a scaffold with well-known promiscuity risk. The weight is computed from a published chemical
    name rather than taken from a source that measured it.'
- parameter: 'THE MECHANISM CHAIN THE PATENTS CLAIM, AND IT LANDS ON THE METABOLIC MODEL OF THE POOL'
  value: gp130 to STAT3 to MYC to LDHA to glycolysis to stem cell activation
  unit: qualitative, claimed chain
  conditions: WO2018039615A1 states that RCGD423 including MPA-1/423F was used for its ability to promote
    MYC expression through GP130 and JAK/STAT signalling, that it "binds to GP130 ... and activates
    Stat-3", and reports phospho-STAT3 immunostaining in hair follicle stem cells correlating with Ki-67
    induction, with pSTAT1 and pSTAT5 not dramatically affected; topical treatment raised c-MYC, n-MYC and
    LDHA protein. Its claims cover activation of quiescent hair follicle stem cells, INDUCTION OF
    GLYCOLYSIS and ACTIVATION OF LACTATE DEHYDROGENASE. flores2017, from the same collaboration, shows
    that Ldha deletion PREVENTS hair follicle stem cell activation and that Mpc1 deletion ACCELERATES it
  species: mouse
  source_ref: wo2018039615
  uncertainty: 'THIS IS THE ONE PLACE WHERE THREE SEPARATE THREADS OF THIS PROJECT MEET, AND THE
    CONVERGENCE IS THE REASON TO KEEP THE LEAD ALIVE RATHER THAN A REASON TO ACT ON IT. The claimed chain
    connects the gp130 axis to the glycolytic-versus-oxidative stem-state model that flores2017 and
    yanagihara2025 independently support - glycolytic flux holding a progenitor state, oxidative flux
    driving differentiation. THE OBJECTIONS ARE SERIOUS. It is HAIR FOLLICLE, not growth plate. The
    growth plate resting zone is already hypoxic and glycolytic at baseline, so it may have no headroom
    on this axis. pSTAT3 IHC is a weaker readout than a Western. And the two groups are collaborators
    rather than independent, so the convergence is partly by construction. Graded as a hypothesis with a
    named chain, not as evidence for an intervention.'
- parameter: 'THE INTERVENTIONAL HUMAN COUNTERPART - blocking IL-6R produces catch-up growth, and it is
    catch-up rather than excess'
  value: height velocity 6.6 cm/yr, height SDS +0.29 in year 1 and +0.31 in year 2, from a baseline of
    -2.2 SDS
  unit: cm/year and SDS
  conditions: 'TENDER phase 3, n=112 systemic JIA aged 2-17, 12-week randomised placebo-controlled period
    plus long-term extension. Baseline mean height SDS -2.2 with pretreatment height velocity below
    normal in 87.5 per cent. On tocilizumab, velocity 6.6 cm/yr in year 1 and 6.8 in year 2, ABOVE normal
    against WHO norms (P<0.0001); IGF-1 SDS rose -1.0 to -0.2 to -0.1; osteocalcin and CTX-1 both rose
    with the OC/CTX-1 ratio up (P=0.014), a bone balance favouring formation. MULTIPLE REGRESSION: first
    year height velocity was inversely related to JADAS-71 disease activity at year 1, to age, to MEAN
    GLUCOCORTICOID DOSE during the year, and to baseline height SDS.'
  species: human
  source_ref: debenedetti2015
  uncertainty: 'THIS IS THE STRONGEST HUMAN EVIDENCE ON THE AXIS AND IT MEASURES SOMETHING DIFFERENT FROM
    WHAT THE MOUSE GENETICS MEASURE. It is CATCH-UP GROWTH IN STUNTED CHILDREN: SDS moves from -2.2 to
    about -1.6 over two years, so these children are recovering toward normal, not exceeding it, and this
    atlas already holds that catch-up growth is approximately height-neutral with a 2-4 per cent residual.
    Removing an inflammatory suppressor restores a deficit; it does not show what lowering gp130
    signalling would do to a HEALTHY plate, which is the question that matters here. WHAT THE REGRESSION
    DOES ESTABLISH is that disease activity and glucocorticoid dose are SEPARATELY and independently
    associated with velocity - so the catch-up is not merely steroid sparing, and inflammation control
    contributes in its own right. AND NO BONE AGE WAS REPORTED ANYWHERE IN THE PAPER, which is the number
    that would say whether the recovered velocity converts to adult height or is spent. THE AXIS
    THEREFORE HAS HUMAN EVIDENCE POINTING BOTH WAYS ONLY IF THE TWO SETTINGS ARE CONFLATED: inflammatory
    IL-6 excess suppresses growth in sick children, and developmental gp130/STAT3 loss stunts and fuses
    normal mice. Nothing yet tests the developmental setpoint in a healthy human.'
localization:
- 'growth plate: liu2022gp130 deleted Stat3 and gp130 in chondrocytes postnatally and got fusion'
- 'articular cartilage: where every RCGD 423 experiment was actually done'
human_evidence: absent
human_evidence_note: The genetics are mouse and the molecule has been tested in rat, canine and adult
  human articular chondrocytes in culture. No human growth-plate or stature data exist for this axis, and
  the only human experiment with the molecule measured methylation age rather than growth.
species_basis:
- mouse
- rat
- human
translation_risk: high
translation_risk_reason: The axis is defined entirely by loss-of-function in mouse; the molecule has a
  contested mechanism, has never been given to a growing animal, and was optimised against a hypertrophy
  reporter in a disease where suppressing hypertrophy is the goal - the opposite of what a growth plate
  needs from its terminal zone.
confidence: D
confidence_note: D. The genetic result is strong and unusually well designed - postnatal,
  chondrocyte-specific, with a receptor deletion phenocopying the transcription factor deletion. But
  everything that would make it actionable is missing or contested - it is loss-of-function only, the
  molecule's sign is disputed between two groups, and no bone length endpoint exists for the axis in any
  species. Not C, because the sign contradiction is not a detail - it determines whether the compound
  helps or causes premature fusion.
claim_grades:
- claim: gp130/STAT3 signalling is required postnatally in chondrocytes for growth plate proliferation
    and for keeping the plate open.
  grade: B
  basis: Postnatal chondrocyte-specific deletion of Stat3, phenocopied by chondrocyte-specific deletion
    of gp130, with a graded milder phenotype for Lifr. Mouse only, loss-of-function only.
- claim: Raising gp130/STAT3 output would lengthen bone.
  grade: E
  basis: No gain-of-function experiment exists, in any species, with any endpoint. This is the inverse
    inference from a requirement result and the atlas has made that error before.
- claim: RCGD 423 raises STAT3 output.
  grade: E
  basis: Asserted by the originating laboratory in two papers, contradicted by an independent group
    reporting Y759-SHP2 recruitment that inhibits STAT3. Unresolved.
