id: beta_catenin_ctnnb1
name: beta-catenin (CTNNB1)
aliases:
- CTNNB1
type: protein
layer: L3
stub: false
summary: 'beta-catenin is the transducer whose cytoplasmic pool is destroyed by the APC/AXIN/GSK3B destruction complex
  unless WNT-receptor engagement inhibits it. In chondrocytes its level is read as a dose, not a switch. Deleting
  it in committed growth plate chondrocytes lowers proliferation and delays hypertrophy; stabilising it accelerates
  hypertrophy and, if raised further or earlier, blocks chondrogenesis altogether (Akiyama 2004; Dao 2012, mouse).
  Deleting it only from Col10a1-expressing hypertrophic chondrocytes leaves hypertrophic zone height normal but reduces
  Mmp13 and Vegfa and produces less trabecular bone, showing a distinct late requirement in the terminal cell (Golovchenko
  2013, mouse). beta-catenin and SOX9 are mutually antagonistic: SOX9 binds beta-catenin through its C-terminal transactivation
  domain, blocks TCF/LEF-dependent transcription and promotes beta-catenin degradation (Akiyama 2004), and SOX9 promotes
  nuclear phosphorylation of beta-catenin to speed its turnover (Topol 2009). This reciprocal inhibition is the single
  most important convergence in the layer: the same molecular ratio sets both chondrocyte identity and the hypertrophy
  decision.'
localization:
- 'mouse HZ: functionally required for Mmp13/Vegfa expression in Col10a1+ cells (golovchenko2013)'
- 'mouse PZ/PHZ: functionally required for normal proliferation and hypertrophy timing (akiyama2004, chen2008)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No human growth plate beta-catenin localisation or perturbation data; human CTNNB1 variants cause
  neurodevelopmental disease, not a defined physeal phenotype.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: All causal data are mouse conditional alleles; the human dose-response is unmeasured.
confidence: C
