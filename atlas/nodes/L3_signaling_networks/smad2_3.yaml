id: smad2_3
name: SMAD2/SMAD3 (TGF-beta-responsive R-SMADs)
aliases:
- SMAD2
- SMAD3
type: protein
layer: L3
stub: false
summary: SMAD2 and SMAD3 are phosphorylated by TGFBR1 downstream of TGFBR2 and mediate the canonical TGF-beta response.
  Smad3-null mice develop normal-length skeletons at birth but show progressive expansion of the hypertrophic zone
  and accelerated terminal differentiation, with degeneration of articular cartilage - i.e. SMAD3 output is a brake
  on the hypertrophy transition, opposite in sign to the BMP-SMAD1/5/8 arm (Yang 2001, mouse). The same directionality
  is seen with dominant-negative TGFBR2 expression in mouse skeletal tissue, which produces terminal chondrocyte differentiation
  and osteoarthritis (Serra 1997). This BMP-versus-TGF-beta sign split inside one ligand superfamily is the reason
  'TGF-beta superfamily signalling' is not a usable unit of analysis in this atlas. Human SMAD2/SMAD3 variants cause
  aneurysm-osteoarthritis/Loeys-Dietz-spectrum disease with skeletal features, but no human growth plate SMAD2/3 activity
  measurement exists.
localization:
- 'mouse PHZ/HZ: inferred from Smad3-null zonal expansion (yang2001)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: Human SMAD3 variants cause connective tissue disease with skeletal manifestations, but no growth
  plate SMAD2/3 activity data exist.
species_basis:
