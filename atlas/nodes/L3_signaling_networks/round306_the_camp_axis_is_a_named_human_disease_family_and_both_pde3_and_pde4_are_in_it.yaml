id: round306_the_camp_axis_is_a_named_human_disease_family_and_both_pde3_and_pde4_are_in_it
name: >-
  ROUND 306 - the operator asked for every drug on the cAMP axis and exactly what we need. The answer is that
  this is not a hypothesis: REDUCED cAMP/PKA SIGNALLING IS A NAMED HUMAN DISEASE FAMILY (iPPSD), every member
  has SHORT STATURE AND BRACHYDACTYLY, and BOTH DRUGGABLE PHOSPHODIESTERASES ARE IN IT AS GAIN-OF-FUNCTION
  SHORT-STATURE GENES. Plus the survey that decides which handle: of ~30 Gs-coupled receptors the human growth
  plate expresses essentially ONE, so receptor agonism is not the way in - PDE inhibition is
aliases:
- round 306
- iPPSD is the cAMP disease family
- acrodysostosis PDE4D PRKAR1A
- PDE3A hypertension with brachydactyly
- the Gs receptor shelf is empty in cartilage
- every drug on the cAMP axis
type: pathway
layer: L3
stub: false
summary: >-
  ZERO - WHAT WE NEED, STATED FIRST SO THE REST IS JUDGED AGAINST IT. To use this axis we need an agent that
  (a) RAISES cAMP inside growth-plate chondrocytes, (b) acts on a node that is actually PRESENT in that
  tissue, (c) does so TONICALLY rather than in pulses, because the one pulsatile test - teriparatide - gave
  interim velocity and a terminal null, and (d) is obtainable. Round 305 established the axis. This round
  establishes the human proof and enumerates every handle.

  ONE - THE AXIS IS A NAMED HUMAN DISEASE FAMILY, AND THIS IS THE STRONGEST EVIDENCE IN THE FILE FOR ANY
  MECHANISM. Clinical genetics has a formal nosology for exactly this: iPPSD, INACTIVATING PTH/PTHrP
  SIGNALLING DISORDERS, which groups conditions caused by reduced cAMP/PKA signalling. EVERY MEMBER HAS SHORT
  STATURE AND BRACHYDACTYLY.
  · **GNAS loss of function** (less Gs, less cAMP) - pseudohypoparathyroidism 1A / Albright hereditary
  osteodystrophy. Burden effect -9.36 cm.
  · **PRKAR1A gain of function** (more PKA INHIBITION, so less PKA output) - ACRODYSOSTOSIS TYPE 1.
  · **PDE4D gain of function** (more cAMP DEGRADATION) - ACRODYSOSTOSIS TYPE 2, with short stature,
  brachydactyly and ADVANCED BONE MATURATION.
  · **PDE3A gain of function** (more cAMP degradation) - HYPERTENSION WITH BRACHYDACTYLY. ercu2023 states the
  mutant enzymes are HYPERACTIVE; shahid2024's case has brachydactyly type E AND SHORT STATURE.
  ⭐ **BOTH DRUGGABLE PHOSPHODIESTERASES APPEAR AS GAIN-OF-FUNCTION SHORT-STATURE GENES IN HUMANS.** A PDE3 or
  PDE4 INHIBITOR is the pharmacological inverse of the exact human mutation that shortens. That is a far
  stronger form of evidence than a burden association, and it is the answer to round 305's complaint that
  "PDE3 has the genetics and PDE4 has the expression and neither has both." BOTH HAVE HUMAN DISEASE GENETICS.
  I had not looked in the dysplasia literature.
  ⭐ **AND PDE4D ACTS AT THE GROWTH PLATE, IN HUMANS, EXPLICITLY.** morgul2025 describes PDE4D-related
  ACROSCYPHODYSPLASIA: growth retardation at **-4.81 SDS height**, progressive **cup-shaped knee metaphyses**,
  and the authors' own phrase, **MOSAIC GROWTH PLATE INVOLVEMENT**. That answers round 305's open question of
  whether the PDE effect is local or systemic - for PDE4D it is local, and it is at the knee.
  ⚠ **THE BONE-AGE OBSERVATION IS THE ONE THAT MATTERS MOST AT BA16.** Acrodysostosis type 2 features
  ADVANCED bone maturation. Less cAMP therefore ACCELERATES skeletal maturation. Raising cAMP should decelerate
  it - which would act on the PERIOD rather than the rate, and the period is the binding constraint in this
  case. It is also the property teriparatide did NOT have, which is consistent with it producing velocity
  onto an unchanged asymptote. Grade E as an inference from a syndrome feature; nobody has measured bone age
  under a PDE inhibitor.

  TWO - THE SURVEY THAT DECIDES THE HANDLE. ~30 Gs-COUPLED RECEPTORS RUN AGAINST THE HUMAN GROWTH PLATE, AND
  THE SHELF IS EMPTY. This is CORR-327 applied inside a single axis.
  ✗ ABSENT or effectively absent: ADRB1 (0/15), ADRB3 (0/10), ADORA2A (not on platform), ADORA2B (0/5),
  PTGER2 (0/5), PTGDR, PTGFR, PTH2R, CALCR (0/10), CALCRL (0/15), VIPR1, ADCYAP1R1 (0/10), GIPR (0/10),
  GCGR (0/5), CRHR1, SCTR, MC4R, TSHR, LHCGR, FSHR, DRD1, HRH2, HTR4, HTR6, HTR7, GPR101, GPBAR1.
  ⚠ MARGINAL: ADRB2 (1/5 clean donor, resting-zone 844 - the 79-agent beta-agonist block round 298 dismissed,
  and the dismissal survives), PTGER4 (2/10, resting 894 and perichondrium 1588), GLP1R (4/25), VIPR2, DRD5,
  GPR161 (4/30, resting 1437 - the ciliary Gs orphan, interesting for the hedgehog thread).
  ✓ PRESENT AND LARGE: **PTH1R ALONE** - 5/5 in both donors, 2,965 resting rising to 49,326 hypertrophic.
  ⛔ AND PTH1R IS THE ONE THAT FAILED. Teriparatide: femoral length +1.5% and +3.4% at 6 months, 0.0% in every
  arm at 26 months. Its human burden sign is discordant (+2.49 cm). **SO THE ONLY WELL-EXPRESSED Gs RECEPTOR
  IN THIS TISSUE IS THE ONE ROUTE ALREADY KNOWN NOT TO WORK.** Receptor agonism is not the way in.

  THREE - WHICH LEAVES DEGRADATION AND PRODUCTION, AND THE TISSUE RANKS THEM.
  The cAMP-hydrolysing phosphodiesterases in the human growth plate, best to worst:
  **PDE4A (5/25 both donors, proliferative 4,257 - the best-expressed cAMP PDE in this tissue) > PDE2A
  (resting 3,946, perichondrium 2,508) > PDE4B (proliferative 2,092, perichondrium 2,299) > PDE8A (5/20 and
  10/20) > PDE7A (hypertrophic 1,799) > PDE1C (hypertrophic 1,432) > PDE4D (2/30) > PDE3A (1/20) ~ PDE3B
  (1/15).** PDE10A and PDE11A effectively absent.
  ⚠ **BUT DO NOT READ PDE3B's LOW MICROARRAY SIGNAL AS ABSENCE - THE ATLAS ALREADY HELD THE CORRECTION AND
  NOBODY HAD USED IT.** ursachi2026 has been in this bibliography since 2026-08-05 with cited_by = 0, and its
  recorded finding is that growth-plate chondrocytes of HUMAN, MOUSE AND CHICKEN express **PDE1B, PDE3B,
  PDE4B, PDE4D, PDE5A, PDE7A, PDE8A and PDE10A**. So PDE3B IS in growth-plate cartilage across three species,
  and round 305's "the drugged node is the weakest link" was a statement about one microarray's sensitivity
  floor - the same platform that missed NPPC. CORR-313, again, caught before this round shipped.
  ✓ ADENYLYL CYCLASES ARE WELL REPRESENTED: ADCY2 (prehypertrophic 8,789), ADCY3 (8/10 and 10/10), ADCY4
  (resting 3,890), ADCY6 (4/5 and 5/5), ADCY7. ADCY5, ADCY8, ADCY10 absent.
  ✓ AND THE WHOLE DOWNSTREAM ARM IS PRESENT: PRKACA, PRKACB, PRKAR1A, PRKAR2A (17/25 and 21/25), SIK2, SIK3
  (prehypertrophic 6,495), HDAC4, HDAC5, MEF2C (hypertrophic 13,179), ATF4 (5/5 both donors, ~10,000
  everywhere), **CRTC2 and CRTC3 (resting 10,154, perichondrium 9,624)**.

  FOUR - EVERY DRUG ON THIS AXIS, TRIAGED.
  · **PDE4 INHIBITORS - the best expression-plus-genetics combination. ROFLUMILAST and APREMILAST are
  approved and oral**; ibudilast is oral and used in Japan; crisaborole and difamilast are topical and
  therefore useless here. PDE4A is the best-expressed cAMP PDE in the tissue and PDE4D gain of function is a
  human growth-plate dysplasia. THIS IS THE LEAD.
  · **PDE3 INHIBITORS - the best genetics, the biggest mouse effect. CILOSTAZOL is approved and oral**;
  milrinone and enoximone are IV inotropes and unusable; anagrelide is approved but for thrombocythaemia.
  Human PDE3B pLoF +1.22 cm at P=5.1e-13, mouse Pde3b-null tibia +4.597 at P=9e-07, PDE3A gain of function
  shortens humans. ⛔ AGAINST: oral PDE3 inhibitors raised mortality in chronic heart failure and cilostazol
  carries a boxed warning contraindicating it in heart failure of any severity.
  · **NON-SELECTIVE / DUAL PDE3+PDE4 - the interesting middle. PENTOXIFYLLINE is oral, generic, cheap and has
  decades of paediatric use**; theophylline and aminophylline are oral with a narrow therapeutic index;
  **ensifentrine is an approved dual PDE3/PDE4 inhibitor but INHALED**, so systemic exposure is minimal and
  the route is wrong. Pentoxifylline is on round 297's list of twenty-six never-checked agents.
  · **DIRECT ADENYLYL CYCLASE ACTIVATION - the niche entry, and it bypasses the PDE question entirely.
  FORSKOLIN** activates AC directly and is sold as Coleus forskohlii; **COLFORSIN DAROPATE is an approved
  water-soluble forskolin derivative** (Japan, acute heart failure). No skeletal length endpoint for either.
  · **ADORA1 ANTAGONISM - ADORA1 is Gi-COUPLED and is detected 4/10 in the clean donor across every zone
  (~850-930).** Blocking a Gi receptor DISINHIBITS adenylyl cyclase and raises cAMP. **Caffeine is an A1
  antagonist AND a weak non-selective PDE inhibitor**, oral, ubiquitous, and given to preterm infants in
  randomised trials with long-term growth follow-up that this atlas has never read.
  · **SIK INHIBITION - downstream of PKA, and the tissue expresses SIK2, SIK3 and both CRTCs strongly.**
  Clinical-stage only (YKL-05-099 class). Mechanistically it mimics PKA output while bypassing receptor,
  cyclase and PDE alike. ⚠ The mouse data are muddled: Sik1-null body length -0.387 (P=0.00077) and Crtc3-null
  -1.087 (P=4.8e-05) both SHORTEN, which does not sit cleanly with a simple "more PKA output is longer" model.
  · ✗ **RULED OUT BY ABSENT RECEPTOR: beta-agonists (ADRB1/3 absent, ADRB2 marginal), adenosine A2A/A2B
  agonists, VIP/PACAP, glucagon and GIP, CRH, calcitonin, dopamine D1, histamine H2, and the 5-HT4/6/7 shelf.**

  FIVE - AND A CONTRAINDICATION FALLS OUT OF THE SAME SURVEY, WHICH ROUND 297 ASKED FOR AND NEVER CLOSED.
  NSAIDs. PGE2 signals through EP2 and EP4 to Gs and cAMP. In the human growth plate **PTGS1 (COX-1) is
  detected - 14/20 probe-donor cells in donor 2, 1/20 in the clean donor, hypertrophic 805 - while PTGS2
  (COX-2) is 0/10 in BOTH donors**, and PTGER4 is present at 894 resting and 1,588 perichondrium. So the
  plate's cyclooxygenase is COX-1, and the receptor it feeds is Gs-coupled. **A non-selective NSAID blocks
  COX-1, lowering PGE2, lowering EP4/Gs/cAMP - which is the direction that shortens in every member of the
  iPPSD family.** Mouse Ptgs1-null body length is -0.506 (P=0.10, not significant). GRADE E, mechanism plus
  expression, no length endpoint - but round 297 flagged NSAIDs as an unexamined common exposure and this is
  the first mechanistic account of why the worry is the right way round.
human_evidence: direct
human_evidence_note: >-
  The central claim is human clinical genetics of a recognised disease family - GNAS, PRKAR1A, PDE4D and
  PDE3A, all causing short stature and brachydactyly through reduced cAMP/PKA signalling, with PDE4D's
  acroscyphodysplasia showing explicit growth-plate involvement and -4.81 SDS height. The receptor and PDE
  survey is human primary data from GSE9160. The burden effects are human. The teriparatide length data are
  rat. No PDE inhibitor has been given to any species with a bone-length endpoint.
species_basis:
- human
- mouse
- rat
translation_risk: high
translation_risk_reason: >-
  Every human genetic result here is a GAIN-of-function mutation causing disease, and the inference that
  pharmacological inhibition produces the opposite is a direction argument, not a measurement - CORR-299 in
  its usual form. Acrodysostosis and HTNB are severe germline syndromes with developmental and hypertensive
  features, so the skeletal phenotype sits inside a much broader disturbance. The bone-age deceleration
  proposal is an inference from a syndrome feature and has never been tested under a drug. And the one
  pharmacological test of raising cAMP with a terminal length endpoint, teriparatide, produced velocity
  without final height - which remains the pattern that would sink any agent here.
confidence: B
confidence_reason: >-
  The disease-family evidence is strong, independent of any burden statistics, and converges from four genes
  with two different mechanisms of reducing cAMP. The tissue survey is deterministic and reproducible and its
  central negative - the Gs receptor shelf is empty - is unambiguous. Graded B not A because no agent on this
  axis has ever been given with a bone-length endpoint in any species, and because the microarray's
  sensitivity floor means the PDE ranking within the tissue is soft.
claim_grades:
- claim: >-
    Reduced cAMP/PKA signalling causes short stature in humans, and both druggable phosphodiesterases are in
    the responsible disease family.
  grade: A
  basis: >-
    FOUR GENES, TWO MECHANISMS OF REDUCING cAMP, ONE RECOGNISED NOSOLOGY. The iPPSD classification
    (inactivating PTH/PTHrP signalling disorders) groups conditions caused by reduced cAMP/PKA output, and
    short stature with brachydactyly is a defining feature throughout. GNAS loss of function gives
    pseudohypoparathyroidism 1A / Albright hereditary osteodystrophy. PRKAR1A GAIN of function - more
    inhibition of PKA - gives acrodysostosis type 1. PDE4D GAIN of function - more cAMP degradation - gives
    acrodysostosis type 2 with advanced bone maturation. PDE3A GAIN of function gives hypertension with
    brachydactyly, and ercu2023 states the mutant enzymes are hyperactive while shahid2024's case has
    brachydactyly type E and short stature. A PDE3 or PDE4 INHIBITOR is the pharmacological inverse of the
    human mutation that shortens.
  species: human
  source_ref: ercu2023
- claim: >-
    PDE4D acts on the growth plate in humans rather than systemically.
  grade: B
  basis: >-
    morgul2025, PDE4D-related acroscyphodysplasia: severe growth retardation at -4.81 SDS height, progressive
    development of CUP-SHAPED KNEE METAPHYSES, and the authors' own description of MOSAIC GROWTH PLATE
    INVOLVEMENT. Metaphyseal cupping at the knee is a growth-plate lesion by definition. This settles for
    PDE4D the question round 305 left open for PDE3B - whether a phosphodiesterase's height effect is local or
    systemic. Graded B rather than A because it is an ultra-rare syndrome with fewer than ten reported cases
    and the observation is descriptive radiology.
  species: human
  source_ref: morgul2025
- claim: >-
    Gs-coupled receptor agonism is a usable route into growth-plate cAMP.
  grade: X
  basis: >-
    NO - THE SHELF IS EMPTY, AND THIS IS CORR-327 INSIDE A SINGLE AXIS. Of about thirty Gs-coupled receptors
    run against the human growth plate, the following are absent or effectively absent: ADRB1, ADRB3,
    ADORA2A (not on platform), ADORA2B, PTGER2, PTGDR, PTGFR, PTH2R, CALCR, CALCRL, VIPR1, ADCYAP1R1, GIPR,
    GCGR, CRHR1, SCTR, MC4R, TSHR, LHCGR, FSHR, DRD1, HRH2, HTR4, HTR6, HTR7, GPR101, GPBAR1. Marginal:
    ADRB2, PTGER4, GLP1R, VIPR2, DRD5, GPR161. The ONLY strongly expressed Gs receptor is PTH1R at 49,326 in
    the hypertrophic zone - and PTH1R is the route already known to fail, giving +1.5% and +3.4% femoral
    length at six months and 0.0% in every arm at twenty-six. The way into this axis is degradation or
    production, not the receptor.
  species: human
  source_ref: gse9160
- claim: >-
    PDE3B is barely present in growth-plate cartilage, so its height effect is probably systemic.
  grade: X
  basis: >-
    WITHDRAWN FROM ROUND 305. The atlas already held the correction and had never used it: ursachi2026 has
    been in this bibliography since 2026-08-05 with cited_by = 0, recording that growth-plate chondrocytes of
    HUMAN, MOUSE AND CHICKEN express PDE1B, PDE3B, PDE4B, PDE4D, PDE5A, PDE7A, PDE8A and PDE10A. The 1/15
    detection in GSE9160's clean donor is a statement about one microarray's sensitivity floor - the same
    platform that missed NPPC, vosoritide's own ligand, by one to two orders of magnitude - and not about the
    tissue. It is a review and therefore an index rather than a source, so the primaries behind it still need
    reading, but it is enough to withdraw the inference.
  species: human
  source_ref: ursachi2026
- claim: >-
    Common NSAID use lowers cAMP in the growth plate and is a height cost.
  grade: E
  basis: >-
    MECHANISM AND EXPRESSION ONLY, BUT IT IS THE FIRST ACCOUNT OF WHY ROUND 297'S WORRY POINTS THE WAY IT
    DOES. PGE2 signals through EP2/EP4 to Gs and cAMP. In the human growth plate PTGS1 (COX-1) is detected -
    14/20 probe-donor cells in donor 2, hypertrophic 805 - while PTGS2 (COX-2) is 0/10 in BOTH donors, and
    PTGER4 is present at 894 resting and 1,588 perichondrium. So the plate's cyclooxygenase is COX-1 and it
    feeds a Gs-coupled receptor. A non-selective NSAID lowers PGE2, lowering EP4/Gs/cAMP - the direction that
    shortens in every member of the iPPSD family. Mouse Ptgs1-null body length -0.506 is not significant
    (P=0.10). No length endpoint under an NSAID exists. Recorded as a watch-item, not an established harm.
  species: human
key_refs:
- ref_id: ercu2023
  year: 2023
  type: primary
  one_line_finding: >-
    PDE3A gain-of-function mutations produce HYPERACTIVE enzyme and cause hypertension with brachydactyly -
    the human proof that raising PDE3 activity shortens the skeleton, which is the exact inverse of a PDE3
    inhibitor
- ref_id: shahid2024
  year: 2024
  type: primary
  one_line_finding: >-
    Confirms the skeletal half of the PDE3A phenotype - brachydactyly type E together with SHORT STATURE in a
    genetically confirmed HTNB case
- ref_id: morgul2025
  year: 2025
  type: primary
  one_line_finding: >-
    PDE4D-related acroscyphodysplasia with -4.81 SDS height, cup-shaped knee metaphyses and explicit MOSAIC
    GROWTH PLATE INVOLVEMENT - which places a phosphodiesterase's height effect AT THE PLATE in a human
- ref_id: ursachi2026
  year: 2026
  type: review
  one_line_finding: >-
    Held in this bibliography since 2026-08-05 with cited_by zero, and it withdraws round 305's central
    caveat - growth-plate chondrocytes of human, mouse and chicken express PDE1B, PDE3B, PDE4B, PDE4D, PDE5A,
    PDE7A, PDE8A and PDE10A, so the low microarray signal for PDE3B was a sensitivity floor and not an absence
- ref_id: gse9160
  year: 2007
  type: dataset
  one_line_finding: >-
    Supplies the decisive negative - about thirty Gs-coupled receptors run against the human growth plate and
    only PTH1R is strongly expressed, which is the one route already known to fail, so receptor agonism is
    ruled out and the axis must be entered at degradation or production
open_questions:
- g_l12_does_a_pde3_inhibitor_lengthen_bone_in_a_normal_animal
- g_l3_is_the_pde3_height_effect_local_or_systemic
contradicts: >-
  Withdraws one claim from round 305 and closes one of its open questions. WITHDRAWN: that PDE3B is barely
  present in growth-plate cartilage and its effect may therefore be systemic - ursachi2026, already in this
  bibliography and never cited, reports PDE3B expression in growth-plate chondrocytes of three species, so
  the 1/15 microarray detection was a sensitivity floor. CLOSED IN PART: round 305 posed "PDE3 has the
  genetics, PDE4 has the expression, neither has both" as the sharpest unresolved choice. Both have human
  disease genetics - PDE3A and PDE4D are each gain-of-function short-stature genes - and the question becomes
  which inhibitor to prefer rather than whether either is anchored. Nothing here rehabilitates teriparatide or
  the PTH1R route.
