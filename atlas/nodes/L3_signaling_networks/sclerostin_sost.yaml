id: sclerostin_sost
name: Sclerostin (SOST)
aliases:
- SOST
type: protein
layer: L3
stub: false
summary: 'Sclerostin is a secreted WNT antagonist that binds LRP5/LRP6 and blocks canonical signalling.
  Human loss of function is definitive and bidirectional in effect: SOST-null sclerosteosis produces massive
  bone overgrowth with gigantism-adjacent features including tall stature and cranial nerve compression
  (Balemans 2001), which is one of the very few human WNT-pathway phenotypes that includes increased linear
  growth rather than only increased bone mass. In normal human bone, sclerostin protein is a delayed product
  of embedded osteocytes and is not detectable in early osteoblasts, so it acts as a late, spatially restricted
  brake (Poole 2005). The critical unresolved point for this atlas is whether sclerostin reaches the growth
  plate chondrocyte at all: SOST expression in growth plate cartilage has not been demonstrated, and the
  tall stature of sclerosteosis could be an indirect consequence of cortical and endosteal overgrowth.
  The therapeutic antibody romosozumab is licensed in adults only, so no paediatric physeal read-out exists.'
localization:
- 'human osteocyte: confirmed by immunohistochemistry (poole2005)'
- 'human growth plate chondrocyte: unconfirmed - not demonstrated'
- 'mouse growth plate: unconfirmed'
human_evidence: direct
human_evidence_note: SOST null (sclerosteosis) is a human loss-of-function phenotype including increased
  stature; osteocyte localisation is shown in human bone.
