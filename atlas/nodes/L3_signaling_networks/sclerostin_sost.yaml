reanalysis_observations:
- observation: 'SOST gives the most extreme donor disagreement in GSE9160 and is not resolvable there.
    Donor 1 (11y10m F): 45, 8, 24, 48 units across RZ/PZ/PHZ/HZ against thresholds near 700 - absent.
    Donor 2 (13y3m M): 6,618, 7,105, 11,320, 4,274 against thresholds near 300 - abundant - and only 151
    units in that donor''s PERICHONDRIUM, the opposite of the bone-derived expectation.'
  interpretation: A roughly 100-fold discrepancy on a single probe set between two donors. It is not explained
    by donor 2's ~2x sensitivity advantage, nor by its poorer dissection, which would blur signal rather
    than create it. Real inter-individual variation, a sample-specific artefact, and bone contamination
    of one donor's cartilage samples cannot be distinguished in a two-donor dataset.
  caveats: Recorded as attempted_inconclusive. This is a cheap, well-posed experiment for a third party.
  reanalysis: p8_01_gse9160_human_zonal
