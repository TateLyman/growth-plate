id: hes1_tf
name: HES1
aliases:
- hairy and enhancer of split 1
type: protein
layer: L3
stub: false
summary: 'HES1 is a basic helix-loop-helix repressor and canonical RBPJ target. In chondrocytes it is the effector
  through which Notch drives the terminal stage of endochondral ossification: NICD with RBPJ induces Hes1, and Hes1
  induction is required for the ossification phenotype (Hosaka 2013, mouse). Genetic dissection of the Notch target
  repertoire shows HES1 and HES5 suppress chondrogenesis and promote the onset of hypertrophy, with partial overlap
  between them, whereas HEY1 and HEYL have no discernible role in either process - so the Notch output in cartilage
  is carried by the HES and not the HEY branch (Rutkowski 2016, mouse). Only HES5, not HES1, directly regulates Sox9
  transcription in that analysis, which separates the two paralogues mechanistically. HES1 is heavily used in other
  tissues as a Notch activity reporter; in the growth plate it is a functional node in its own right. No human growth
  plate HES1 data exist.'
localization:
- 'mouse PHZ/HZ: induced downstream of NICD-RBPJ (hosaka2013)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No human growth plate HES1 measurement or human HES1 skeletal phenotype.
