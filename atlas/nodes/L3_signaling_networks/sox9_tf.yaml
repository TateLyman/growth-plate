type: protein
layer: L3
stub: false
summary: 'SOX9 is the master chondrogenic transcription factor and the only node in this layer with an unambiguous
  human loss-of-function phenotype. Heterozygous SOX9 mutations and translocations cause campomelic dysplasia with
  bowed long bones, hypoplastic scapulae and autosomal XY sex reversal (Foster 1994; Wagner 1994), so human haploinsufficiency
  alone is sufficient to derail skeletogenesis. In mouse, Sox9-null cells are excluded from cartilage condensations
  (Bi 1999), and staged inactivation shows successive requirements: for condensation, for overt chondrocyte differentiation,
  and for expression of Sox5 and Sox6 (Akiyama 2002). Later in the growth plate, SOX9 maintains columnar proliferation
  and is required to generate hypertrophy while simultaneously restraining Runx2 and beta-catenin, thereby blocking
  acquisition of an osteoblast phenotype; SOX9 protein outlives its mRNA into upper hypertrophic cells, where it acts
  with MEF2C to activate Col10a1 directly (Dy 2012, mouse). SOX9 is antagonised by and antagonises beta-catenin reciprocally
  (Akiyama 2004; Topol 2009), is suppressed by sustained Notch signalling (Kohn 2015), and drives its own nutrient
  supply via GLS1 (Stegen 2020) - making it the single most convergent node in L3.'
