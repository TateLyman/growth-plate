id: round256_the_retinoid_axis_transfers_to_man_and_sost_does_not
name: >-
  ROUND 256 - the query run on the archived human plates. RARgamma is present in the human growth plate at
  37 times the negative-control floor in 4 of 4 donors and is ENRICHED IN THE ROOT AND PROLIFERATIVE
  COMPARTMENTS rather than the hypertrophic one, both arms of the retinoid circuit are there - and SOST is
  BELOW the floor set by genes that have no business in cartilage, in every donor and every gate
aliases:
- round 256
- RARG in the human growth plate
- the SOST answer
- GSE288028 retinoid query
type: dataset
layer: L3
stub: false
summary: >-
  THE TWO GAPS OPENED IN ROUND 255 ARE CLOSED, ONE POSITIVE AND ONE NEGATIVE, FROM DATA ALREADY ON DISK.
  GSE288028 (chu2026), the four directly-processed FRESH pubertal human growth plates - 5295, 12911, 9115
  and 383 cells at 500 UMI minimum. Tool at atlas/tools/round256_retinoid_and_sost_in_the_human_plate.py,
  output at atlas/data/round256_retinoid_sost_query.txt.

  THE CALIBRATION FIRST, BECAUSE EVERY CLAIM BELOW IS RELATIVE TO IT. Seven genes with no business in
  growth plate cartilage - ALB, INS, MYOD1, CD19, KRT14, NEUROD1, SFTPC - give a mean detection of 0.632
  per cent of cells. That is the floor: what a gene that is genuinely absent looks like at this depth. The
  positive controls behave: COL2A1 82.9 per cent, PTH1R 43.2, CYTL1 33.6, COL10A1 28.6.

  ONE - THE RETINOID RECEPTOR AXIS IS PRESENT IN MAN, AND THE FAMILY MEMBER THAT IS NOT USED IS ABSENT,
  WHICH IS THE CONTROL THAT MAKES THE REST BELIEVABLE. RARG 23.66 per cent of cells, THIRTY-SEVEN TIMES THE
  FLOOR, clearing it in 4 of 4 donors. RARA 9.32 and RARB 9.22, both clearing at about 15 times. RXRA -
  the obligate heterodimer partner without which no RAR signals - is the highest of the whole family at
  32.65 per cent. AND RXRG IS AT 0.17 PER CENT, BELOW THE FLOOR. A nuclear receptor family in which five
  members are detected and the sixth is not is a family the assay can resolve, which is the internal
  control that a bare detection rate does not otherwise have.
  ON THE ORDERING, HONESTLY: RARG exceeds RARA in THREE of four donors (19.0 against 14.1; 48.7 against
  3.5; 20.1 against 7.3) AND IS LOWER IN DONOR 2 (6.9 against 12.3). koyama2021's mouse statement that
  RARgamma is the most abundantly expressed retinoid receptor in growth plate is therefore SUPPORTED BUT
  NOT UNIFORM in man, and cross-gene detection rates are confounded by capture efficiency in any case. What
  is not confounded and not equivocal is that RARG is present in every donor at more than an order of
  magnitude above the floor.

  TWO - AND THE ZONAL RESULT IS THE ONE THAT MATTERS, BECAUSE THE WITHIN-GENE ACROSS-ZONE CONTRAST IS THE
  ONLY ONE CAPTURE BIAS DOES NOT TOUCH. RARG detection by marker gate: root-enriched CYTL1+ 45.1 per cent,
  proliferating MKI67+ 52.0, hypertrophic COL10A1+ 29.8, against 23.7 ungated. RARgamma IS ENRICHED IN THE
  ROOT AND PROLIFERATIVE COMPARTMENTS AND DEPLETED IN THE HYPERTROPHIC ONE. In the two donors whose gates
  actually discriminate, the gradient is clean - donor 1 runs 21.5 hypertrophic, 40.3 proliferating, 56.7
  root; donor 2 runs 8.9, 15.0, 22.7. THAT IS WHERE AN ANTAGONIST WOULD HAVE TO ACT. Amplification is
  residence time in the proliferative compartment before hypertrophic commitment (round 175), so a receptor
  that sets commitment timing must sit on the cells that have not yet committed - and it does, in human
  tissue, in the compartment the whole yield argument is about.

  THREE - BOTH ARMS OF koyama2021'S CIRCUIT EXIST IN MAN, AND THE SPECIFIC ENZYME IS THE SPECIFIC ONE.
  CYP26B1, the catabolic enzyme that hedgehog inhibition suppresses, is present at 5.06 per cent, eight
  times the floor, clearing in 3 of 4 donors - while CYP26A1 (0.35) and CYP26C1 (0.05) sit AT the floor. The
  human plate expresses the same CYP26 family member the mouse experiment implicates and not the other two.
  ALDH1A3, the synthesising enzyme that hedgehog inhibition raises, is present at 3.16 per cent, five times
  the floor, in 4 of 4 donors, while ALDH1A1 (1.16) and ALDH1A2 (1.28) are marginal. DHRS3, the
  retinaldehyde reductase that opposes them, is high at 29.3. The circuit that koyama2021 shows being
  subverted by hedgehog withdrawal is transcriptionally present in the human growth plate, with the same
  enzyme isoforms.

  FOUR - AND SOST IS NOT. 0.104 per cent of cells, which is 0.2 TIMES THE FLOOR - lower than ALB, lower
  than CD19, lower than KRT14. It fails to clear in any donor. By gate: 0.03 per cent hypertrophic, 0.05
  proliferating, 0.33 root-enriched. sclerostin_sost recorded that SOST expression in growth plate
  cartilage has never been demonstrated; it is now demonstrated NOT to be there, in 27704 human growth
  plate cells.
  BUT THE CORRECT CONCLUSION IS NARROWER THAN "THE LEVER IS DEAD", AND THE DATA SAY WHICH WAY. LRP5 is
  present at 7.30 per cent and LRP6 at 19.95, both clearing the floor comfortably. THE HUMAN GROWTH PLATE
  IS NOT A SOURCE OF SCLEROSTIN AND IS A PLAUSIBLE TARGET OF IT. Sclerostin is an osteocyte product, and
  osteocytes in the adjacent metaphyseal bone are largely not captured in a growth plate cartilage
  dissociation, so this experiment cannot exclude sclerostin reaching the plate as a diffusible protein
  from outside it. What it does exclude is an autocrine physeal SOST loop. The consequence for
  sclerosteosis is that its tall stature cannot be attributed to loss of a brake the plate makes on itself,
  and the consequence for romosozumab is that it stays a hypothesis - acting, if at all, on a receptor-
  competent plate from an external source - rather than being promoted on the strength of a human tall
  stature phenotype.

  FIVE - WHAT THIS DOES AND DOES NOT LICENCE. It licences carrying the retinoid axis as a HUMAN-ANCHORED
  target rather than a mouse one, and it removes the species objection that was the largest single risk on
  it. IT DOES NOT establish protein, does not establish that RARgamma is rate-limiting, and does not turn
  a direction into a magnitude. The experiment that decides the axis is unchanged and is still unrun:
  g_l3_does_an_rargamma_antagonist_add_length_to_a_normal_animal - CD2665 in a normal growing animal with
  length, growth rate, terminal hypertrophic cell height and resting-zone counts reported together, so that
  A, D and h_term separate by the identity GR = A x D x h_term. Without it, an RARgamma antagonist could
  still fail exactly as growth hormone failed, by buying rate out of the reserve.
quantitative:
- parameter: >-
    RETINOID RECEPTOR DETECTION IN THE HUMAN PUBERTAL GROWTH PLATE, AGAINST A NEGATIVE-CONTROL FLOOR OF
    0.632 PER CENT
  value: >-
    RARG 23.66, RXRA 32.65, RARA 9.32, RARB 9.22, RXRB 14.72 per cent of cells; RXRG 0.17 per cent, BELOW
    the floor
  unit: per cent of cells with at least one count, mean of four donors
  conditions: >-
    GSE288028 (chu2026), the four directly-processed FRESH samples - GSM9328218, GSM9328221, GSM9328224,
    GSM9328229 - 5295, 12911, 9115 and 383 cells respectively after a 500 UMI minimum, 36601 features,
    UNGATED. Floor is the mean detection of seven genes with no expected expression in growth plate
    cartilage: ALB, INS, MYOD1, CD19, KRT14, NEUROD1, SFTPC. Positive controls in the same cells: COL2A1
    82.86, ACAN 48.98, PTH1R 43.21, SOX9 35.91, CYTL1 33.64, COL10A1 28.57, MKI67 2.47.
  species: human
  source_ref: chu2026
  uncertainty: >-
    CROSS-GENE DETECTION RATES ARE CONFOUNDED by transcript length, GC content and 10x capture efficiency,
    so the ORDERING within the family is suggestive rather than quantitative and the claim that RARG is
    "most abundant" is NOT established here - it exceeds RARA in three of four donors and is lower in
    donor 2. What survives the confound is presence: RARG clears the floor by 37-fold in 4 of 4. Detection
    rate is not protein and not activity. RXRG sitting below the floor is the useful internal control - the
    assay resolves members of this family - but a single negative within a family is not a validation of
    every positive in it.
- parameter: >-
    THE ZONAL DISTRIBUTION OF RARG BY MARKER GATE - THE CONTRAST CAPTURE BIAS DOES NOT TOUCH
  value: >-
    root-enriched CYTL1+ 45.1, proliferating MKI67+ 52.0, hypertrophic COL10A1+ 29.8, ungated 23.7 per cent
  unit: per cent of gated cells with at least one RARG count, mean of four donors
  conditions: >-
    Same cells. Gates are single-marker ENRICHMENTS at a threshold of one count, not clusters: COL10A1+ for
    hypertrophic, MKI67+ for proliferating, CYTL1+ for root-enriched (round 244 established CYTL1+ is
    enriched for the GP1 root cluster and includes some GP2 and some non-chondrocytes). Per-donor gradients
    where the gates discriminate - donor 1: 21.5 / 40.3 / 56.7 hypertrophic / proliferating / root; donor 2:
    8.9 / 15.0 / 22.7.
  species: human
  source_ref: chu2026
  uncertainty: >-
    TWO OF THE FOUR DONORS CANNOT CONTRIBUTE TO THIS CONTRAST AND THIS IS THE MAIN WEAKNESS. Donor 3 is
    hypertrophic-dominated - 8578 of 9115 cells are COL10A1+ - so its gates overlap almost entirely and its
    zonal profile is flat by construction. Donor 4 has 383 cells total, 28 in the hypertrophic gate and
    ONE in the proliferating gate, so its numbers there are meaningless and the 100 per cent MKI67-gate
    value is a single cell. THE GRADIENT THEREFORE RESTS ON DONORS 1 AND 2, where it is consistent in
    direction and about 2.5-fold in size. Single-marker gates are also not zones: a CYTL1+ cell is not a
    root cell, and COL10A1 is detected in 94 per cent of donor 3.
- parameter: >-
    THE RETINOID SYNTHESIS AND CATABOLISM ENZYMES, AND THE ISOFORM SPECIFICITY
  value: >-
    CYP26B1 5.06 per cent against CYP26A1 0.35 and CYP26C1 0.05; ALDH1A3 3.16 against ALDH1A1 1.16 and
    ALDH1A2 1.28; DHRS3 29.25; RDH10 7.16
  unit: per cent of cells, mean of four donors, ungated
  conditions: >-
    Same cells and same floor of 0.632 per cent. CYP26B1 clears the floor in 3 of 4 donors, ALDH1A3 in 4 of
    4. koyama2021's mouse mechanism is that hedgehog inhibition markedly DECREASES Cyp26b1 and INCREASES and
    broadens Raldh3 (ALDH1A3) within the growth plate, raising local retinoid tone and closing the plate.
  species: human
  source_ref: chu2026
  uncertainty: >-
    PRESENCE OF THE ENZYMES DOES NOT DEMONSTRATE THE CIRCUIT. Nothing here shows that hedgehog manipulation
    moves them in man, or that retinoid tone in a human plate is set by these enzymes rather than by
    systemic retinol supply. CYP26B1 at 5 per cent detection is a low-abundance transcript and its
    zonal reading (7.8 hypertrophic, 8.4 proliferating, 9.6 root) is within the noise of these gate sizes.
- parameter: >-
    SOST IN THE HUMAN GROWTH PLATE - BELOW THE FLOOR IN EVERY DONOR AND EVERY GATE, WHILE ITS RECEPTORS ARE
    PRESENT
  value: >-
    SOST 0.104 per cent, which is 0.2 times the negative-control floor; by gate 0.03 hypertrophic, 0.05
    proliferating, 0.33 root-enriched. LRP5 7.30 and LRP6 19.95 per cent, both clearing the floor
  unit: per cent of cells, mean of four donors
  conditions: >-
    Same cells, same floor. SOST failed to clear the floor in any of the four donors (0.06, 0.08, 0.02,
    0.26 per cent). SOSTDC1 0.45 and DKK1 1.11 are also marginal. For comparison the floor genes run ALB
    0.06, CD19 1.03, KRT14 3.04.
  species: human
  source_ref: chu2026
  uncertainty: >-
    THIS SHOWS THAT HUMAN GROWTH PLATE CELLS DO NOT TRANSCRIBE SOST. IT DOES NOT SHOW THAT SCLEROSTIN DOES
    NOT REACH THE PLATE. Sclerostin is an osteocyte product and osteocytes in the adjacent metaphyseal and
    epiphyseal bone are largely not recovered in a cartilage dissociation, so a paracrine source outside the
    captured population is untested here and remains entirely possible - and LRP5/LRP6 presence means the
    plate is receptor-competent to respond to it. Droplet data also under-detects low expressors generally;
    what makes this call safe is that SOST is below a floor set by seven genes known to be absent, in all
    four donors and all three gates, rather than merely low.
localization:
- 'human pubertal growth plate, CYTL1-enriched root compartment: highest RARG detection'
- 'human pubertal growth plate, MKI67+ proliferating cells: high RARG detection'
- 'human pubertal growth plate, COL10A1+ hypertrophic cells: RARG present but depleted relative to the
  above'
- 'human growth plate: SOST not transcribed; LRP5 and LRP6 present'
human_evidence: direct
human_evidence_note: >-
  Human tissue, four donors, 27704 cells. This is a transcript-level expression measurement in the target
  organ of the target species, which is the specific thing the retinoid proposition was missing. It is not a
  functional result and no length endpoint exists in it.
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  This node IS the species bridge - it is human tissue answering a question raised by a mouse experiment.
  The translation risk that remains attaches to the mouse functional results it supports, not to these
  measurements.
confidence: B
confidence_reason: >-
  Four human donors, an explicit negative-control floor, an internal family-level negative (RXRG) and
  isoform specificity that matches the mouse mechanism independently. Held at B rather than A because
  detection rate is not protein, because the zonal gradient rests on two of four donors, and because
  single-marker gates are enrichments rather than the authors' clusters.
claim_grades:
- claim: RARgamma is expressed in the human growth plate.
  grade: B
  basis: >-
    23.66 per cent of cells, 37 times a floor defined by seven genes known to be absent, clearing in 4 of 4
    donors, with RXRG below the same floor as an internal family control.
- claim: RARgamma is the most abundantly expressed retinoid receptor in the human growth plate.
  grade: D
  basis: >-
    RARG exceeds RARA in three of four donors and is lower in the fourth, and cross-gene detection rates are
    confounded by capture efficiency. koyama2021's mouse statement is supported in direction and is not
    established as a quantitative fact in man. RXRA is numerically higher than all RARs, as expected for the
    obligate heterodimer partner.
- claim: >-
    RARgamma is enriched in the root and proliferative compartments relative to the hypertrophic one, which
    is where a commitment-delaying antagonist would have to act.
  grade: C
  basis: >-
    Consistent ~2.5-fold gradient in the two donors whose marker gates discriminate; donor 3 is
    hypertrophic-dominated and donor 4 has one cell in the proliferating gate. Within-gene across-zone is
    the contrast capture bias does not affect, which is why this is C and not D despite resting on two
    donors.
- claim: The retinoid synthesis and catabolism circuit koyama2021 implicates exists in the human plate.
  grade: C
  basis: >-
    CYP26B1 clears the floor while CYP26A1 and CYP26C1 do not, and ALDH1A3 clears while ALDH1A1 and ALDH1A2
    are marginal - the same isoforms the mouse experiment names. Presence of enzymes is not demonstration of
    the circuit.
- claim: The human growth plate makes sclerostin.
  grade: X
  basis: >-
    NO. SOST at 0.104 per cent is BELOW a floor of 0.632 per cent set by genes with no business in
    cartilage, in all four donors and all three gates, in 27704 cells. sclerostin_sost's stated gap is
    closed in the negative.
- claim: Sclerostin does not act on the human growth plate.
  grade: D
  basis: >-
    NOT SHOWN AND NOT THE SAME QUESTION. LRP5 and LRP6 are both present, so the plate is receptor-competent,
    and sclerostin's osteocyte source sits in bone that a cartilage dissociation does not recover. What is
    excluded is an autocrine physeal loop, not paracrine delivery from outside.
