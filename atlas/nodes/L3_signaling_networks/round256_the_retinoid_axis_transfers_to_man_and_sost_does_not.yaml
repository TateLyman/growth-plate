contradicts: >-
  CLOSES the stated gap in sclerostin_sost IN THE NEGATIVE. That node records that SOST expression in growth
  plate cartilage has not been demonstrated and that the tall stature of sclerosteosis could be an indirect
  consequence of cortical and endosteal overgrowth. SOST is now measured at 0.2 times the negative-control
  floor in 27704 human growth plate cells across four donors and three gates. The plate is not a source of
  sclerostin. It remains receptor-competent - LRP5 and LRP6 both clear the floor - so paracrine delivery
  from metaphyseal osteocytes is untested rather than excluded, and the romosozumab hypothesis survives in
  that narrower form only.
