paralog_risk: ANP is genetically required for chondrocyte differentiation via chondrocyte cGMP-PKG (zhou2024);
  the Nppc-cKO-versus-Npr2-cKO severity gap is currently explained by residual extra-cartilage CNP alone,
  with the ANP arm unexcluded. No Nppa;Nppc compound cartilage mutant exists. See g_para_001.
reanalysis_observations:
- observation: NPPC transcript is NOT detectable in human growth plate tissue. Across two donors (11y10m
    F, 13y3m M) and all five laser-captured compartments of the distal femoral physis, the single NPPC
    probe set on HG-U133 Plus 2.0 (221348_at) reads 8-20 units in donor 1 and 4-9 in donor 2, against
    array-specific detection thresholds of 646-826 and 254-451 respectively - one to two orders of magnitude
    BELOW background. The receptor NPR2 and the clearance receptor NPR3 are robustly detected in the same
    samples, as is IHH at up to 20,856 units, so the assay is working.
  interpretation: This does not show that CNP is absent from the human growth plate. It shows that at
    11-13 years the local transcript is not detectable by this platform, on one probe set, in two donors.
    Read against the mouse result that cartilage-specific Nppc deletion reproduces the whole systemic
    dwarfism - i.e. that the autocrine pool is the physiological driver in mouse - it is a species discrepancy
    worth resolving, and it bears on why a CNP analogue must be given systemically.
  caveats: Single probe set; a 2003-design array; T7 linear amplification with 3-prime bias; NPPC is a
    small transcript. A both-donor non-detection is the strongest negative this design produces (donor
    2's arrays are ~2x more sensitive and account for 87% of all one-donor calls genome-wide), but it
    remains bounded by platform sensitivity.
  reanalysis: p8_01_gse9160_human_zonal
  source_ref: gse9160
  species: human
