paralog_risk: ANP is genetically required for chondrocyte differentiation via chondrocyte cGMP-PKG (zhou2024);
  the Nppc-cKO-versus-Npr2-cKO severity gap is currently explained by residual extra-cartilage CNP alone,
  with the ANP arm unexcluded. No Nppa;Nppc compound cartilage mutant exists. See g_para_001.
reanalysis_observations:
- observation: WITHDRAWN AND REVERSED (CORR-005). P8-01 reported that NPPC transcript is not detectable
    in human growth plate. P8-02 tested that on three independent human growth-plate series with no donor
    or platform shared with GSE9160, and NPPC is DETECTED at roughly the 70th percentile of the array
    in GSE32398 (Affymetrix GPL9828, 5 prepubertal donors) and GSE18338 (Agilent, tibia through puberty),
    surviving every stringency tested. It is not detected in GSE22855 (Illumina, 2 donors, 60th percentile).
    CNP TRANSCRIPT IS DETECTABLE IN HUMAN GROWTH PLATE.
  interpretation: 'The P8-01 negative rested on the single NPPC probe set that HG-U133 Plus 2.0 carries
    (221348_at). One oligonucleotide failing is indistinguishable from a transcript being absent until
    a second platform is asked, and the second and third platforms disagree with it. The species discrepancy
    P8-01 raised against the mouse cartilage-specific Nppc knockout is therefore removed: local CNP message
    is present in human plate, as in mouse.'
  caveats: Transcript, not peptide. Whole-plate bulk, so no zonal information. None of the three platforms
    has a validated positive control for its detection rule - see P8-02 RESULTS section 4.
  reanalysis: p8_02_independent_corroboration
  source_ref: gse9160
  species: human
  grade: D
  date: '2026-08-05'
  supersedes: p8_01_gse9160_human_zonal NPPC non-detection
