type: protein
layer: L3
stub: false
summary: 'EVC and EVC2 form an obligate complex localised to a discrete compartment at the base of the primary cilium,
  the ''EvC zone''. Evc-null mice reproduce an Ellis-van Creveld-like syndrome with short ribs, short limbs and dental
  abnormalities; their growth plates show delayed bone collar formation and ADVANCED chondrocyte maturation, Ihh expression
  is normal but the Ihh target genes Ptch1 and Gli1 are markedly reduced, cilia are present and Gli3 processing is
  normal - so the lesion is downstream of SMO and independent of ciliogenesis itself (Ruiz-Perez 2007, mouse). Dorn
  2012 supplies the biochemistry: Hedgehog agonists promote a SMO-EVC2 association restricted to the EvC zone, and
  EVC2 mutants that still enter cilia but are displaced from that zone act as dominant inhibitors, blocking signalling
  between SMO and PKA/SUFU before GLI activation. In human, EVC mutations cause recessive Ellis-van Creveld syndrome
  (short limbs, short ribs, postaxial polydactyly, dysplastic nails and teeth, congenital heart defect in about 60%)
  and heterozygous missense alleles cause dominant Weyers acrodental dysostosis, an allelic milder condition (Ruiz-Perez
  2000). This node is the direct mechanical link between the cilium subsystem and the IHH subsystem.'
