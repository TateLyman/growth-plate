paralog_audit_note: >-
  HIF2A is bounded without being deleted: the Vhlh;Hif1a double null resembles the Hif1a single
  null (pfander2004), which it could not if HIF2A carried a substantial share. schipani2001
  additionally shows VEGF induction around dying cells is HIF1A-INDEPENDENT, so VEGF is not
  over-attributed.
