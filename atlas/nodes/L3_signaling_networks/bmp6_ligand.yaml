id: bmp6_ligand
name: BMP6
aliases:
- bone morphogenetic protein 6
type: protein
layer: L3
stub: false
summary: 'BMP6 is expressed by hypertrophic chondrocytes in the mouse growth plate. Germline Bmp6-null mice are viable
  and modestly affected: Perry 2008 reports delayed ossification and altered growth plate architecture with reduced
  hypertrophic zone function rather than gross dwarfism, consistent with heavy redundancy inside the BMP family. BMP6
  is the ligand most cleanly linked to systemic iron handling (hepcidin), so any growth phenotype in Bmp6 mutants
  must be interpreted against a possible iron-status confounder, which the skeletal literature has not controlled.
  There is no human BMP6 skeletal dysplasia. This node is retained as a component of the BMP ligand inventory rather
  than as an established control point of human longitudinal growth.'
localization:
- 'mouse HZ: reported (perry2008)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No human BMP6 growth-plate data and no BMP6-linked human short stature syndrome.
