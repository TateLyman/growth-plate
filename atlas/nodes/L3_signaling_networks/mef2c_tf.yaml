- myocyte enhancer factor 2C
type: protein
layer: L3
stub: false
summary: 'MEF2C is the MADS-box transcription factor that activates the hypertrophy gene programme. Deleting Mef2c
  in endochondral cartilage, or expressing a dominant-negative MEF2C, impairs hypertrophy, cartilage angiogenesis,
  ossification and longitudinal bone growth in mouse; a superactivating MEF2C causes precocious hypertrophy, ossification
  of the growth plates and dwarfism (Arnold 2007). Both directions therefore shorten the bone, by opposite mechanisms
  - failure to hypertrophy and premature exhaustion of the plate - which is why MEF2C output must be described as
  a set point rather than as a ''growth-promoting'' factor. The set point is enforced by HDAC4: the Mef2c-mutant bone
  deficiency is rescued by an Hdac4 mutation, and the ectopic ossification of Hdac4-null mice is reduced by Mef2c
  heterozygosity, i.e. the two are titrated against each other in vivo (Arnold 2007, mouse). MEF2C also acts with
  residual SOX9 protein to activate Col10a1 directly in upper hypertrophic chondrocytes (Dy 2012, mouse). Human MEF2C
  haploinsufficiency (5q14.3 deletion) is a neurodevelopmental syndrome without a defined physeal phenotype.'
