id: sox6_tf
name: SOX6
type: protein
layer: L3
stub: false
summary: SOX6 is the near-identical paralogue of SOX5 and is functionally interchangeable with it in cartilage. Sox6
  single nulls are born with mild skeletal abnormalities; Sox5;Sox6 double nulls have a severe generalised chondrodysplasia
  with matrix-deficient, rudimentary cartilages and disrupted growth plate formation, and epiphyseal chondroblasts
  inappropriately activate hypertrophic markers (Smits 2001, mouse). The redundancy means gene dose, not gene identity,
  is the variable, exactly as for BMP-SMAD1/5 and RUNX2/RUNX3 elsewhere in this layer. SOX6 expression requires SOX9
  (Akiyama 2002, mouse). Human SOX6 variants have been reported with skeletal and haematological features, but no
  human growth plate SOX6 measurement or established SOX6 chondrodysplasia is available.
localization:
- 'mouse cartilage, all zones: co-expressed with Sox5 and Sox9 (smits2001)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No established human SOX6 chondrodysplasia and no human growth plate SOX6 data.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Mouse double-knockout genetics only.
