open_questions:
- g_l12_does_a_pde3_inhibitor_lengthen_bone_in_a_normal_animal
- g_l3_is_the_pde3_height_effect_local_or_systemic
contradicts: >-
  This round removes one of the atlas's own promotions and narrows a standing negative. DPP9, promoted in
  round 300 on human genetics plus tractability, is withdrawn - the mouse tibia effect is -4.062 at P=5.9e-08,
  opposite and larger. And the teriparatide terminal null, which the file has carried since CORR-269 as
  killing the PTH1R arm, is confirmed as a PTH1R-specific result rather than a verdict on cAMP: PTH1R is the
  one gene on this axis whose human burden sign is discordant, so the genetics and the rat pharmacology agree
  with each other about that route specifically while GNAS, ADCY6 and PDE3B agree with each other about the
  axis. Nothing here rehabilitates teriparatide.
