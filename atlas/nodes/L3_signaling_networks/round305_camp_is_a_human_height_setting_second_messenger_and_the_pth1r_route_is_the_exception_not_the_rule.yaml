id: round305_camp_is_a_human_height_setting_second_messenger_and_the_pth1r_route_is_the_exception_not_the_rule
name: >-
  ROUND 305 - cAMP is a height-setting second messenger in humans, anchored in BOTH directions by three genes
  and corroborated in mouse. GNAS -9.36 cm and ADCY6 -2.70 cm (make cAMP, loss shortens) against PDE3B
  +1.22 cm (degrades cAMP, loss lengthens) - and ADCY6 and PDE3B carry the SAME P value, 5.1e-13, with
  opposite signs and opposite roles. The whole apparatus is in the human growth plate. The one pharmacological
  test that failed is PTH1R, and PTH1R is also the one gene whose human sign is discordant
aliases:
- round 305
- the cAMP axis in human height
- GNAS ADCY6 PDE3B bidirectional
- why teriparatide was null and PDE3 may not be
- the cross-species concordance table
type: pathway
layer: L3
stub: false
summary: >-
  ZERO - THE CROSS-SPECIES TABLE, WHICH IS THE INSTRUMENT FOR THE REST. Every one of the 207 human height
  genes with a pLoF burden at P<1e-4 was run against the IMPC length endpoints extracted in round 304. 52 have
  mouse length data; 42 are CONCORDANT in direction and 10 discordant; 83 have no mouse length endpoint at
  all. Concordance must be discounted because both distributions are negative-skewed - 71% of significant
  human effects and 64% of mouse effects shorten, so chance concordance is about 56%, not 50% - but 81%
  against 56% is a real enrichment, and the POSITIVE CONTROL is decisive: **GHRH, human -4.53 cm, mouse body
  length -9.040 at P effectively 0.** The pipeline detects a known growth axis with the right sign and a huge
  effect, which is what licenses reading the rest of the table.

  ONE - THE RESULT. cAMP IS A HEIGHT-SETTING SECOND MESSENGER IN HUMANS, ANCHORED IN BOTH DIRECTIONS.
  · **GNAS** - Gs-alpha, ACTIVATES adenylyl cyclase, so loss LOWERS cAMP: **-9.36 cm** (P=4.3e-06).
  · **ADCY6** - adenylyl cyclase 6, MAKES cAMP, so loss LOWERS it: **-2.70 cm, P=5.1e-13, 355 heterozygotes.**
  · **PDE3B** - phosphodiesterase 3B, DEGRADES cAMP, so loss RAISES it: **+1.22 cm, P=5.1e-13, 1,761
  heterozygotes.**
  ADCY6 AND PDE3B CARRY THE SAME P VALUE TO TWO SIGNIFICANT FIGURES, WITH OPPOSITE SIGNS AND OPPOSITE
  ENZYMATIC ROLES ON THE SAME MOLECULE. That is the internal-control structure that made the NPR2/NPR3 pair
  convincing in round 300, arriving independently on a different axis.
  ✓ AND THE HUMAN CLINICAL GENETICS AGREE WITHOUT ANY BURDEN STATISTICS. GNAS loss of function causes
  pseudohypoparathyroidism type 1a and Albright hereditary osteodystrophy, whose defining features include
  SHORT STATURE and brachydactyly. Less Gs, less cAMP, shorter people - established human medicine, not a
  new association.
  ✓ MOUSE CORROBORATES, DIRECTIONALLY. Adcy9 body length -0.345 (P=0.0034), Adcy2 body length (P=0.0047),
  Adcy6 body length -0.165 (P=0.02) - all cAMP-PRODUCING enzymes, all shorter on loss - against **Pde3b
  tibia +4.597 (P=9e-07)**, the cAMP-DEGRADING enzyme and the largest lengthening effect among 7,216 genes.
  ⚠ THE ADCY NEGATIVES ARE INDIVIDUALLY WEAK BECAUSE NEGATIVE IS THE BASE RATE (CORR-329). What is NOT weak
  is that the single gene running the RARE direction is exactly the one whose loss raises cAMP.

  TWO - AND THE AXIS PASSES THE RECEIVER TEST EMPHATICALLY, WHICH IS WHERE LOSARTAN AND SACUBITRIL DIED.
  CORR-327 killed the ARB shelf because AGTR1/AGTR2/REN are absent from the human growth plate, and the
  nitrate shelf because sGC and NOS are absent. The cAMP apparatus is the opposite case. In GSE9160:
  · **GNAS 32/60 probe-donor cells, 12,047 resting rising to 27,045 prehypertrophic** - among the
  highest-expressed genes in the entire panel, present in every compartment of both donors.
  · **PTH1R 5/5 in BOTH donors, 2,965 resting to 24,470 proliferative to 38,304 prehypertrophic to 49,326
  HYPERTROPHIC** - an enormous, steeply hypertrophy-weighted gradient.
  · ADCY6 4/5 and 5/5 (3,083 resting), ADCY2 5/15 peaking 8,789 prehypertrophic, ADCY3 8/10 and 10/10.
  · PRKACA 5/10, PRKACB 5/15, PRKAR1A 8/20 - the kinase and its regulatory subunit.
  · **ATF4 5/5 in both donors at 9,600-11,400 across every zone**, SIK3 13/30 peaking 6,495 prehypertrophic,
  HDAC4 5/15, MEF2C 8/15 rising to 13,179 hypertrophic.
  THE PRODUCTION MACHINERY, THE RECEPTOR, THE KINASE AND THE ENTIRE DOWNSTREAM ARM ARE ALL PRESENT AND
  HYPERTROPHY-WEIGHTED. This is the first axis in several rounds where the tissue carries the whole thing.

  THREE - BUT THE PDE3 SUBTYPE IS THE WEAKEST LINK IN THE TISSUE, AND THAT IS THE HONEST PROBLEM.
  **PDE3B is 1/15 probe-donor cells in the clean donor (a single prehypertrophic detection at 794) and 0/15
  in donor 2. PDE3A is 1/20 and 2/20.** Meanwhile **PDE4A is 5/25 peaking 4,257 proliferative and PDE4B is
  5/15** - the PDE4 family is better represented in this tissue than the PDE3 family that carries all the
  genetics. Two readings, and they are not exclusive: either PDE3B's human height effect is systemic rather
  than local - its best-characterised biology is adipocyte and hepatic insulin signalling - or this platform
  is missing a low-abundance transcript, which it demonstrably does (it missed NPPC entirely).
  ⚠ IF THE LOCAL HANDLE IS THE POINT, PDE4 IS BETTER EXPRESSED AND HAS APPROVED ORAL AGENTS (roflumilast,
  apremilast) - but PDE4A/4B/4D DO NOT APPEAR among the 207 human height genes at all, so that swap trades
  the genetics away for the expression. Neither subtype has both. Recorded as the round's sharpest unresolved
  choice rather than resolved.

  FOUR - THE COUNTER-ARGUMENT, AND IT IS THE STRONGEST ONE IN THE FILE AGAINST THIS AXIS.
  RAISING cAMP THROUGH PTH1R WAS TESTED PHARMACOLOGICALLY WITH A TERMINAL LENGTH ENDPOINT AND IT WAS NULL.
  The FDA teriparatide package: femoral length **+1.5% at 5 ug/kg/d and +3.4% at 30 ug/kg/d at the 6-month
  interim**, then **0.0% IN EVERY ARM at 26 months**. The atlas already reads that pattern correctly as
  ACCELERATION ONTO AN UNCHANGED ASYMPTOTE - velocity bought without final height, which is failure mode 1.
  ⭐ BUT PTH1R IS ALSO THE ONE GENE IN THIS AXIS WHOSE HUMAN SIGN IS DISCORDANT, AND THAT IS THE RESOLUTION.
  **PTH1R pLoF is +2.49 cm** - loss of a cAMP-RAISING receptor makes people TALLER, the opposite of GNAS and
  ADCY6. So the human genetics and the rat pharmacology AGREE WITH EACH OTHER that the PTH1R route is not a
  length lever and may run the wrong way. The PTHrP/Ihh loop is a feedback controller whose job is to DELAY
  hypertrophy, which is a different function from a tonic rise in chondrocyte cAMP.
  → THE REFINED CLAIM IS THEREFORE NARROWER AND SURVIVES ITS OWN BEST COUNTER-EXAMPLE: cAMP LEVEL SETS
  HEIGHT (GNAS, ADCY6, PDE3B), BUT THE PTH1R ROUTE INTO IT DOES NOT. Teriparatide's terminal null does not
  refute PDE3 inhibition, because they enter the pathway at different points and in different modes -
  intermittent receptor pulses versus tonic block of degradation.
  ✗ WHAT WOULD STILL KILL PDE3 INHIBITION IS THE SAME PATTERN REAPPEARING: an interim velocity gain that
  closes to zero at maturity. NO PDE3 INHIBITOR HAS EVER BEEN GIVEN WITH A TERMINAL LENGTH ENDPOINT, so that
  is untested rather than excluded, and it is the first thing the animal experiment must read out.
  ⚠ PTH1R caveats recorded rather than used: n=80 carriers, P=1.6e-03, below the paper's own threshold; and
  rats do not fuse their growth plates, so a 26-month terminal in rat is not adult height in man.

  FIVE - TWO TARGETS KILLED BY THE CROSS-SPECIES TABLE, ONE OF THEM MINE.
  ✗ **DPP9 IS DEAD. Human +2.50 cm (P=4.4e-05) against MOUSE TIBIA -4.062 at P=5.9e-08** - strongly
  significant in both species and in OPPOSITE directions, with the mouse effect nearly twice the size of the
  largest concordant one. Round 300 put DPP9 on the promote list on the strength of "High-Quality Ligand,
  Small Molecule Binder" and a clinical-stage inhibitor. It should not have survived a mouse check, and now
  it has not.
  ✗ **PDE5A dies a third time, independently.** Human +1.42 against mouse body length -1.092 at P=2.3e-05,
  discordant. It was already absent from the human growth plate (0/30) and already killed on that basis in
  rounds 300 and 301. Three independent methods, same answer.
  ⚠ **SCMH1 (+6.65 cm human) is weakly discordant** at mouse -0.575, P=0.09 - not significant, so not a kill,
  but it is the fourth-largest human effect in the actionable set and the mouse points the wrong way.
  ⚠ **HHIPL1 is discordant with both sides significant** - human -1.02 (P=1.2e-05) against mouse tibia +1.271
  (P=3.6e-05). Recorded because HHIP-adjacent biology is a live thread.
  ✓ **TET1 CONCORDS AND IS UPGRADED**: human +8.32 cm against mouse body length +0.282 (P=0.022), the rare
  positive direction in both species. ✓ **HLTF CONCORDS AT STRENGTH IN BOTH**: human +1.47 (P=1.1e-10),
  mouse +0.058 (P=1.1e-07) - and HLTF had zero atlas coverage before round 300.
human_evidence: direct
human_evidence_note: >-
  The axis claim is human on both anchors: burden effects from 1.45M exomes (GNAS -9.36, ADCY6 -2.70 at
  P=5.1e-13, PDE3B +1.22 at P=5.1e-13, PTH1R +2.49), and clinical genetics that require no statistics at all
  (GNAS loss of function gives Albright hereditary osteodystrophy with short stature and brachydactyly). The
  localisation is human, GSE9160, all compartments of both donors. The mouse contributes the length endpoints
  and the concordance table. The teriparatide length data are RAT, from a regulatory package rather than a
  published experiment.
species_basis:
- human
- mouse
- rat
translation_risk: high
translation_risk_reason: >-
  The axis is well anchored but the AGENT is not. PDE3B's transcript is near background in the only human
  growth-plate dataset, so the human height association may be systemic - PDE3B's established biology is
  adipocyte and hepatic insulin signalling and a metabolic route to stature would not respond to the same
  intervention. The ADCY negatives are individually weak because negative is the IMPC base rate (CORR-329).
  The one pharmacological test of raising cAMP with a terminal length endpoint - teriparatide through PTH1R -
  showed acceleration onto an unchanged asymptote, and although PTH1R is separable on both human sign and
  mechanism, that pattern is exactly what would sink a PDE3 inhibitor too and it has never been tested.
confidence: B
confidence_reason: >-
  The bidirectional human anchoring is strong and is corroborated by independent clinical genetics; the
  receiver test is unambiguous; the cross-species table has a decisive positive control in GHRH. Graded B
  rather than A because the specific druggable node - PDE3 - is the weakest-expressed element of the axis in
  human tissue, because no agent on this axis has a terminal length endpoint, and because the one that was
  tested was null.
claim_grades:
- claim: >-
    cAMP level is a determinant of human adult height, anchored in both directions.
  grade: A
  basis: >-
    THREE GENES, TWO DIRECTIONS, ONE SECOND MESSENGER, ALL IN 1.45M EXOMES. Loss of cAMP PRODUCTION shortens:
    GNAS -9.36 cm (P=4.3e-06) and ADCY6 -2.70 cm (P=5.1e-13, 355 heterozygotes). Loss of cAMP DEGRADATION
    lengthens: PDE3B +1.22 cm (P=5.1e-13, 1,761 heterozygotes). ADCY6 and PDE3B carry the same P value with
    opposite signs and opposite enzymatic roles, which is the internal-control structure that made NPR2/NPR3
    convincing on a different axis. Independent clinical corroboration needs no statistics: GNAS loss of
    function is pseudohypoparathyroidism 1a / Albright hereditary osteodystrophy, whose defining features
    include short stature and brachydactyly. Mouse agrees directionally - Adcy2, Adcy6 and Adcy9 shorter on
    loss, Pde3b tibia +4.597 at P=9e-07.
  species: human
  source_ref: kosmicki2026
- claim: >-
    The cAMP apparatus is present in the human growth plate.
  grade: B
  basis: >-
    EMPHATICALLY, AND THIS IS WHERE THE ARB AND NITRATE SHELVES FAILED. GNAS is detected in 32/60 probe-donor
    cells rising from 12,047 resting to 27,045 prehypertrophic - among the highest-expressed genes in the
    whole panel. PTH1R is 5/5 in BOTH donors and steeply hypertrophy-weighted, 2,965 resting to 49,326
    hypertrophic. ADCY6 (4/5, 5/5), ADCY2 (peaking 8,789 prehypertrophic) and ADCY3 (8/10, 10/10) supply the
    cyclase; PRKACA, PRKACB and PRKAR1A the kinase; and ATF4 (5/5 both donors at 9,600-11,400), SIK3, HDAC4
    and MEF2C (13,179 hypertrophic) the downstream arm. Graded B for the usual n=2-donor, one-platform
    ceiling. THE EXCEPTION IS THE DRUGGED NODE: PDE3B is 1/15 in the clean donor and 0/15 in donor 2, and
    PDE3A 1/20 - the PDE4 family is better represented than the PDE3 family that carries all the genetics.
  species: human
  source_ref: gse9160
- claim: >-
    Teriparatide's terminal null refutes raising cAMP as a way to lengthen bone.
  grade: D
  basis: >-
    IT IS THE STRONGEST COUNTER-ARGUMENT AND IT DOES NOT GENERALISE, FOR A REASON INTERNAL TO THE DATA. The
    FDA package gives femoral length +1.5% and +3.4% at the 6-month interim and 0.0% in every arm at 26
    months - acceleration onto an unchanged asymptote. But PTH1R is ALSO the single gene in this axis whose
    human sign is discordant: PTH1R pLoF is +2.49 cm, so losing a cAMP-RAISING receptor makes people TALLER,
    opposite to GNAS and ADCY6. Human genetics and rat pharmacology therefore agree that the PTH1R route is
    not a length lever, which separates it from the axis rather than condemning the axis. The PTHrP/Ihh loop
    is a feedback controller whose function is to DELAY hypertrophy - a different thing from a tonic rise in
    chondrocyte cAMP, and delivered as intermittent receptor pulses rather than a sustained block of
    degradation. CAVEATS KEPT: PTH1R's human result is n=80 at P=1.6e-03, below the paper's own threshold,
    and rats do not fuse their growth plates.
  species: rat
  source_ref: fda_forteo_pharmreview_2002
- claim: >-
    DPP9 inhibition is a candidate height lever.
  grade: X
  basis: >-
    DEAD, AND IT WAS MINE. Round 300 promoted DPP9 on human +2.50 cm (P=4.4e-05) plus Open Targets scoring it
    "High-Quality Ligand, Small Molecule Binder" with a clinical-stage inhibitor. The mouse runs hard the
    other way: **Dpp9-null TIBIA LENGTH -4.062 at P=5.9e-08** - significant in both species, opposite
    directions, and the mouse effect is nearly twice the size of the largest concordant one in the table. A
    cross-species check costs nothing and should have been run before promotion. PDE5A dies here for the
    third time independently (human +1.42 versus mouse body length -1.092 at P=2.3e-05, after 0/30 in human
    growth plate in rounds 300 and 301).
  species: mouse
  source_ref: impc_statistical_results
