id: wnt_canonical_chondrocyte
name: Canonical WNT/beta-catenin signalling in chondrocytes
aliases:
- Wnt/beta-catenin pathway, growth plate
type: pathway
layer: L3
stub: false
summary: 'Canonical WNT signalling stabilises beta-catenin, which enters the nucleus and converts TCF/LEF from repressors
  into activators. In cartilage the pathway is dose-dependent with opposite phenotypes at the two extremes, and this
  is established by paired gain- and loss-of-function alleles in the same mouse genetic background. Too little: Col2a1-Cre
  inactivation of Ctnnb1 gives dwarfism with reduced chondrocyte proliferation and delayed hypertrophic differentiation
  (Akiyama 2004), and Col2a1-ICAT transgenic mice - normal size at birth, then progressively runted - have narrower
  proliferative and hypertrophic zones, more apoptosis and delayed secondary ossification centre formation (Chen 2008).
  Too much: chondrocyte-restricted beta-catenin stabilisation causes severe chondrodysplasia phenocopying Sox9 inactivation
  (Akiyama 2004), tamoxifen-induced stabilisation accelerates maturation and drives ectopic ossification centres (Dao
  2012), and transient activation in young adult mice causes growth retardation with premature growth plate closure
  and articular cartilage thickening (Yuasa 2009). At the progenitor stage the sign flips again: beta-catenin is required
  for osteoblast fate, and osteoblast precursors lacking it become chondrocytes instead (Hill 2005, Day 2005). No
  dose-response curve has been measured in human chondrocytes.'
localization:
- 'mouse PHZ/HZ: highest canonical activity inferred from reporter and genetic studies (dao2012, guo2009)'
- 'mouse PZ: lower activity; loss-of-function reduces proliferation (akiyama2004, chen2008)'
- 'human growth plate: unconfirmed - no zonal nuclear beta-catenin or TCF-reporter data'
human_evidence: indirect
human_evidence_note: Human evidence is confined to WNT co-receptor genetics (LRP5 OPPG and high-bone-mass alleles)
  and SOST; no human growth plate has been assayed for canonical WNT activity.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Every dose statement comes from mouse conditional alleles; the human physiological range
  of chondrocyte beta-catenin activity is unknown, and mice do not undergo epiphyseal fusion.
confidence: C
