- beta2-AR
- b2-adrenoceptor
- adrenergic input to the growth plate
- sympathetic input to the physis
- catecholamine signalling in cartilage
type: protein
layer: L3
stub: false
summary: 'The atlas had NO autonomic or neural input to the growth plate at all - the strings ''adrenergic''
  and ''catecholamine'' resolved to zero nodes across 614 - and no gap asserted the absence. The Phase
  7 falsification run found the hole (item P08) and it was logged as a coverage gap; this node closes
  it with the primary that motivated the search.

  Chondrocyte-specific deletion of the beta-2 adrenoceptor in mouse REDUCES long bone growth, and the
  authors attribute it to a FASTER transition of proliferative to hypertrophic chondrocytes rather than
  to a proliferation deficit - which places catecholamine input on the same control variable (time spent
  proliferating before hypertrophy) that thyroid hormone, CNP and glucocorticoid act on. Tibiae and femora
  were analysed at 6, 12 and 40 weeks in both sexes. Older knockouts additionally showed an osteopenic
  phenotype with reduced osteoblast number, and fracture healing was delayed with reduced cartilage area
  at an intermediate time point. An in vitro expression experiment implicated WNT and TGF-beta signalling
  (kuhn2026).

  The wider context is that systemic and osteoblast-specific beta-2 adrenoceptor knockouts INCREASE bone
  mass, so the cartilage-specific effect is not the same sign as the skeletal one and cannot be inferred
  from it - which is exactly why a chondrocyte-specific allele was needed.

  ANSWERED R337, IN BOTH DIRECTIONS, AND THE ANSWER IS NO FOR THIS STACK. (1) THE MOUSE RESULT IS STRONGER
  THAN THIS NODE RECORDED: kuhn2026 read in full gives femur AND tibia significantly reduced at 6, 12 AND
  40 weeks in BOTH sexes - six groups, one direction - with increased Collagen 10+ and Collagen 2+ chondrocytes
  and unchanged Runx2+. Effect sizes remain FIGURE-ONLY and the driver is Col2a1-Cre, i.e. embryonic-onset
  (CORR-299). Grade D to C. (2) THE RECEIVER TEST PASSES CLEANLY: in GSE288028, 14 postnatal human growth
  plates, ADRB2 is 12/14 at 8.4 CPM in up to 21.4 per cent of cells and is THE ONLY ADRENOCEPTOR PRESENT
  (ADRB1 0/14, ADRB3 0/14, ADRA1A 1/14, ADRA2A 4/14), with GNAS 564.8 CPM in 97 per cent of cells downstream;
  and the plate makes NO CATECHOLAMINE OF ITS OWN (TH 0/14, DBH 0/14, PNMT 0/14, SLC6A2 1/14), reproducing
  the NPPC/NPR2 configuration in which the receptor is local and the ligand systemic. (3) THE HUMAN QUESTION
  THIS NODE OPENED HAS IN FACT BEEN ASKED, REPEATEDLY, IN THE INFANTILE HAEMANGIOMA LITERATURE, AND IT
  IS NULL FOR LINEAR GROWTH: giese2021 followed 185 infants on propranolol with MONTHLY prospective heights
  against WHO normative data and found no growth impairment; lin2023propranolol reproduced the height null
  in 51 children; a 2025 JAAD report finds none at age 4. Months of systemic beta-blockade during the fastest
  growth phase of human life moved no height, so the axis is not RATE-LIMITING in humans - though blockade
  being harmless does not strictly exclude agonism being useful.

  WHY IT IS STILL NOT AN ADDITION, and the first reason is decisive. STEP 0: ADRB2 is Gs-coupled, so it
  runs to cAMP, PKA and CREB - and R307/R309 built three independent lines against raising cAMP in this
  case (Jansen''s at the gain end, horike2026''s CREB jam of the resting zone, ACRDYS2''s raised pCREB at
  -4.81 SDS). Erdafitinib''s contribution to this stack IS lowering CREB, so a beta-2 agonist pushes the
  node the lead drug exists to suppress. Second, ADRB2 returns ZERO rows in kosmicki2026''s burden table
  - no human height genetics. Third, chronic GPCR agonism self-limits: beta-2 agonists desensitise and
  downregulate their receptor within days to weeks, which is a poor match for an indication needing years
  of tonic drive - a worked instance of R306''s conclusion that the entry point is production or degradation,
  not receptor agonism.'
