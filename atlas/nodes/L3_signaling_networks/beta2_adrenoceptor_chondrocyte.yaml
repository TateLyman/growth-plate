summary: 'The atlas had NO autonomic or neural input to the growth plate at all - the strings ''adrenergic''
  and ''catecholamine'' resolved to zero nodes across 614 - and no gap asserted the absence. The Phase
  7 falsification run found the hole (item P08) and it was logged as a coverage gap; this node closes
  it with the primary that motivated the search.

  Chondrocyte-specific deletion of the beta-2 adrenoceptor in mouse REDUCES long bone growth, and the
  authors attribute it to a FASTER transition of proliferative to hypertrophic chondrocytes rather than
  to a proliferation deficit - which places catecholamine input on the same control variable (time spent
  proliferating before hypertrophy) that thyroid hormone, CNP and glucocorticoid act on. Tibiae and femora
  were analysed at 6, 12 and 40 weeks in both sexes. Older knockouts additionally showed an osteopenic
  phenotype with reduced osteoblast number, and fracture healing was delayed with reduced cartilage area
  at an intermediate time point. An in vitro expression experiment implicated WNT and TGF-beta signalling
  (kuhn2026).

  The wider context is that systemic and osteoblast-specific beta-2 adrenoceptor knockouts INCREASE bone
  mass, so the cartilage-specific effect is not the same sign as the skeletal one and cannot be inferred
  from it - which is exactly why a chondrocyte-specific allele was needed.

  NOTHING HUMAN. There is no human genetic, pharmacological or observational evidence in this atlas connecting
  beta-blockade or sympathetic tone to longitudinal growth, and beta-blockers are prescribed to children.
  That is a gap this node opens rather than closes.'
