translation_risk: high
translation_risk_reason: A single mouse conditional knockout, with the additional complication that the
  systemic and osteoblast-specific knockouts of the same receptor move bone mass in the OPPOSITE direction.
  Nothing licenses transferring the cartilage-specific sign to humans.
confidence: C
claim_grades:
- claim: Beta-2 adrenoceptor signalling in chondrocytes is required for normal long bone growth.
  grade: C
  basis: 'UPGRADED FROM D ON FULL TEXT (R337). kuhn2026 gives femur AND tibia significantly reduced at 6,
    12 AND 40 weeks in BOTH sexes - six groups, one direction - with increased Collagen 10+ and Collagen
    2+ chondrocytes and unchanged Runx2+. Not higher because effect sizes are FIGURE-ONLY, the driver is
    Col2a1-Cre and therefore embryonic-onset rather than an inducible postnatal deletion (CORR-299), and
    there is no independent replication.'
- claim: A beta-2 agonist is an addition to this stack.
  grade: X
  basis: 'FOUR INDEPENDENT REASONS (R337), the first decisive. Step 0 - ADRB2 is Gs-coupled and runs to
    cAMP, PKA and CREB, which erdafitinib exists to lower and which R307/R309 gave three separate reasons
    not to raise. The human test is null - systemic beta-blockade in infancy impairs no height. No human
    height genetics - zero rows in kosmicki2026. And chronic beta-2 agonism desensitises and downregulates
    its own receptor within days to weeks, which is the wrong pharmacology for years of tonic drive.'
- claim: The mechanism is a faster proliferative-to-hypertrophic transition rather than reduced proliferation.
  grade: D
  basis: Author interpretation of the same single study; stated as "most likely" in the source and not
    independently tested.
- claim: Sympathetic tone or beta-blockade affects human longitudinal growth.
  grade: D
  basis: 'ANSWERED IN THE NEGATIVE R337 - and the premise of the old X grade was wrong, because the question
    HAS been asked, in the infantile haemangioma literature. giese2021 (185 infants, monthly prospective
    heights against WHO normative data), lin2023propranolol (51 children, paired Wilcoxon on height, P greater
    than 0.05) and a 2025 four-year follow-up all find no linear-growth impairment on systemic propranolol.
    Graded D rather than higher because none was designed as a growth study, all are infants rather than
    adolescents, and propranolol is non-selective for beta-1 versus beta-2.'
