human_evidence: indirect
human_evidence_note: 'Two human strands added R337. Expression - ADRB2 is present in the postnatal human
  growth plate and is the only adrenoceptor there, while the plate synthesises no catecholamine of its own.
  Pharmacology - systemic beta-blockade in infancy does not impair linear growth (giese2021 n=185 with monthly
  heights; lin2023propranolol n=51; a 2025 four-year follow-up), which is the closest human test of this
  axis and runs against translation of the mouse phenotype. No human genetics: ADRB2 is absent from kosmicki2026''s
  burden table.'
