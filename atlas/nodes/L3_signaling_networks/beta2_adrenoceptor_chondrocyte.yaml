claim_grades:
- claim: Beta-2 adrenoceptor signalling in chondrocytes is required for normal long bone growth.
  grade: D
  basis: One mouse conditional knockout, both sexes, three ages (kuhn2026). No replication.
- claim: The mechanism is a faster proliferative-to-hypertrophic transition rather than reduced proliferation.
  grade: D
  basis: Author interpretation of the same single study; stated as "most likely" in the source and not
    independently tested.
- claim: Sympathetic tone or beta-blockade affects human longitudinal growth.
  grade: X
  basis: Not traceable to any primary data in humans. Recorded because beta-blockers are prescribed to
    children and the question has apparently not been asked.
