id: lrp5_coreceptor
name: LRP5
aliases:
- low-density lipoprotein receptor-related protein 5
type: protein
layer: L3
stub: false
summary: 'LRP5 is a single-pass WNT co-receptor that, with Frizzled, is required for canonical signal transduction.
  Human genetics supplies a rare two-sided dose experiment on one gene: biallelic loss-of-function causes osteoporosis-pseudoglioma
  syndrome with very low bone mass and fractures (Gong 2001), while the heterozygous G171V missense allele, which
  impairs binding of the antagonist DKK1, causes autosomal dominant high bone mass (Boyden 2002). Both phenotypes
  are dominated by bone mass rather than by stature, which is the important negative for this atlas: the human LRP5
  read-out is osteoblastic, not clearly physeal. In mouse, Lrp5 and Lrp6 act redundantly in the embryo, and only the
  compound mutants reveal the full skeletal requirement (Joeng 2011). Whether LRP5 signalling in the growth plate
  chondrocyte itself contributes to human height has not been tested.'
localization:
- 'human bone: inferred from OPPG and HBM phenotypes (gong2001, boyden2002)'
- 'human growth plate chondrocyte: unconfirmed'
human_evidence: direct
human_evidence_note: Two independent human germline allele classes (null and DKK1-resistant missense) give opposite
  bone-mass phenotypes.
species_basis:
- human
