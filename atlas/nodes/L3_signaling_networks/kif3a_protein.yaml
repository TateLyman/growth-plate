id: kif3a_protein
name: KIF3A
aliases:
- kinesin family member 3A
- kinesin-II subunit
type: protein
layer: L3
stub: false
summary: 'KIF3A is a subunit of heterotrimeric kinesin-II, the anterograde IFT motor; without it, cilia are not built.
  Cartilage-restricted Kif3a deletion in mouse produces cranial base growth retardation and progressive synchondrosis
  failure: by postnatal day 7 the mutant growth plate has lost identifiable proliferative and hypertrophic zones and
  is instead composed of cells with strong Col2a1 but barely detectable Ihh, Col10a1, Vegfa, Mmp13 and Sp7 (Koyama
  2007). The informative part is the topology of the signalling defect: hedgehog readouts (Ptch1, Gli1, syndecan-3)
  are LOW inside the mutant plate but HIGHER and spatially spread throughout the adjacent perichondrium, and this
  is accompanied by excessive intramembranous ossification along the perichondrial border and ectopic cartilage masses
  - a combination that cartilage Ihh deletion does not reproduce. The cilium therefore restricts where Hedgehog acts,
  not only whether it acts. There is no human KIF3A skeletal dysplasia.'
localization:
- 'mouse growth plate and synchondrosis: functionally required (koyama2007)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No human KIF3A skeletal phenotype; human KIF3A associations are with atopic disease.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Mouse conditional genetics only, and the reported site is the cranial base synchondrosis
  rather than a long-bone physis.
confidence: C
