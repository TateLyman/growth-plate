id: foxa_family_chondrocyte
name: FOXA family in chondrocytes (FOXA2/FOXA3)
aliases:
- FoxA2
- FoxA3
- forkhead box A
type: protein
layer: L3
stub: false
summary: FOXA factors are pioneer transcription factors induced during chondrogenesis that bind conserved sites in
  the collagen X enhancer and can drive a Col10a1 reporter in both chondrocytes and fibroblasts, i.e. they carry hypertrophy
  competence into a non-cartilage cell (Ionescu 2012). Mice lacking both FoxA2 and FoxA3 in chondrocytes have defective
  hypertrophy, reduced alkaline phosphatase and impaired sternebral mineralisation, and become postnatally dwarfed
  with significantly reduced collagen X and MMP13 in the growth plate; single mutants are unremarkable, so this is
  another redundant pair (Ionescu 2012, mouse). FOXA2 is separately of interest because a FoxA2-marked resting-zone
  population has been proposed in L2, which raises the unresolved question of whether the same factor acts at both
  ends of the differentiation trajectory. There is no human FOXA2/FOXA3 skeletal phenotype and no human growth plate
  FOXA measurement.
