id: dkk1_antagonist
name: DKK1
aliases:
- Dickkopf-1
type: protein
layer: L3
stub: false
summary: 'DKK1 is a secreted antagonist that binds LRP5/LRP6 (with Kremen) and removes them from the receptor complex,
  shutting down canonical WNT. Transgenic overexpression of Dkk1 in mouse bone causes osteopenia with reduced osteoblast
  number, and Dkk1 heterozygous-null mice have increased bone mass, giving a clean in vivo dose relation for the bone
  compartment (Li 2006). The human LRP5 G171V high-bone-mass allele acts by resisting DKK1 binding, which is independent
  human evidence that DKK1 tone is physiologically load-bearing (Boyden 2002). What is missing is the physeal half:
  no report establishes DKK1 protein in the human or mouse growth plate by zone, and no chondrocyte-restricted Dkk1
  deletion growth plate phenotype has been published. DKK1 is thus a well-evidenced bone node and an assumed cartilage
  node.'
localization:
- 'mouse bone: confirmed by transgenic and heterozygous-null phenotypes (li2006)'
- 'growth plate zonal distribution: unconfirmed in mouse and human'
human_evidence: indirect
human_evidence_note: Human evidence is the DKK1-resistant LRP5 allele; there is no direct human DKK1 growth plate
  measurement.
species_basis:
- mouse
- human
translation_risk: moderate
translation_risk_reason: Mouse transgenics for the mechanism; the human inference is via a receptor allele, not via
  DKK1 itself.
