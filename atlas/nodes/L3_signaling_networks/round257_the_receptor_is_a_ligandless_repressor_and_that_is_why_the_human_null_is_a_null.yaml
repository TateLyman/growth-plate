contradicts: >-
  CORRECTS round256_the_retinoid_axis_transfers_to_man_and_sost_does_not ON METHOD. Its zonal claim was made
  on RAW DETECTION RATE, which rises with sequencing depth, and the marker gates are not depth-matched - the
  CYTL1+ and MKI67+ gates hold cells 1.6 to 1.7-fold deeper than the COL10A1+ gate. Re-tested on mean CP10K
  the gradient survives and RARA runs the opposite way across the same gates, which depth cannot produce.
  The conclusion stands on better evidence than was originally offered for it. CORR-265.
  AND CORRECTS round255_the_retinoid_axis_and_the_igf_correction ON THE COMPOUND SPECIFICATION - it asked
  for an RARgamma ANTAGONIST; the ligand-less repressor model requires an INVERSE AGONIST.
