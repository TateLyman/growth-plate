id: round257_the_receptor_is_a_ligandless_repressor_and_that_is_why_the_human_null_is_a_null
name: >-
  ROUND 257 - it has been done, twice, and both results invert rather than kill the axis. Cartilage RARgamma
  deletion causes SEVERE growth retardation because the receptor is an UNLIGANDED REPRESSOR that SUPPORTS
  growth - and isotretinoin in 379196 humans changes adult height by +0.31 cm because the target zone is
  avascular, retinoid-free and CYP26B1-buffered, so systemic retinoid never reaches it
aliases:
- round 257
- the ligand-less repressor
- the isotretinoin null
- williams2009
- PLAGL1 as the co-repressor
type: hypothesis
layer: L3
stub: false
summary: >-
  THE INSTRUCTION WAS TO FIND OUT WHETHER THE DECIDING EXPERIMENT HAS BEEN DONE OR IS INFERRABLE. BOTH. The
  genetic version was done in 2009 and the human version was done in 2026 at a scale nothing else in this
  atlas approaches. Neither says what a naive reading of round 255 would predict, and the reason is the same
  in both cases.

  ONE - THE GENETIC EXPERIMENT. williams2009 made cartilage-conditional RAR mutants. Mice deficient in
  RARalpha+RARgamma, or RARbeta+RARgamma, show SEVERE GROWTH RETARDATION by three weeks postnatally with
  defective growth plates and A MAJOR DROP IN AGGRECAN. Mice deficient in RARalpha+RARbeta are VIRTUALLY
  NORMAL. RARgamma is the essential one. Read flatly, that says removing RARgamma SHORTENS bones, and a
  drug that blocks RARgamma should therefore shorten them too - which would end round 255.
  IT DOES NOT SAY THAT, AND THE REASON IS IN THE SAME PAPER. The proliferative and pre-hypertrophic zones
  are AVASCULAR AND LACK ENDOGENOUS RETINOIDS - established by RARE reporter mice and by the authors' own
  DIRECT BIOCHEMICAL MEASUREMENT of retinoid content. There is no ligand there. So RARgamma in those zones
  "is likely to exert LIGAND-LESS REPRESSOR FUNCTION", and it is that repression which SUPPORTS growth:
  aggrecan production rises with RARgamma over-expression UNDER RETINOID-FREE CULTURE CONDITIONS, rises
  further with the co-repressor Zac1 - gene symbol PLAGL1 - and rises further still with, in their words,
  PHARMACOLOGIC AGENTS THAT ENHANCE RAR REPRESSOR FUNCTION.
  THAT IS THE WHOLE RECONCILIATION AND IT TURNS ON A DISTINCTION THIS ATLAS SHOULD HAVE MADE EARLIER.
  DELETING A REPRESSOR AND LOCKING IT ON ARE OPPOSITE MANIPULATIONS. Genetic ablation removes the repressor
  and growth fails (williams2009). An inverse agonist does the reverse - it stabilises the co-repressor-bound
  conformation, which is the growth-supporting state - and the plate expands and maturation is delayed
  (koyama2021). The two results are not in conflict; reading them as though a knockout and an inverse
  agonist were the same intervention is the error. It is structurally the same error as the Jansen objection
  to PTH1R, which round 175 resolved the same way.
  AND williams2009 INDEPENDENTLY REPRODUCES ROUND 256. It states that RARgamma is the most strongly
  expressed RAR in mouse growth plate and that ITS EXPRESSION CHARACTERISES THE PROLIFERATIVE AND
  PRE-HYPERTROPHIC ZONES. Round 256 measured exactly that distribution in human tissue, from a different
  dataset, seventeen years later, without knowing this paper existed.

  TWO - THE HUMAN EXPERIMENT, AND IT IS ENORMOUS AND IT IS NULL. schmidt2026 linked Danish military
  conscription records from 2001 to 2015 to nationwide prescription registries: 379196 individuals, 368338
  men of whom 16739 had taken isotretinoin, adult height measured at a median age of 19.0 years, with oral
  tetracyclines and topical acne therapy as active comparators against a no-acne reference. THE ADJUSTED
  MEAN HEIGHT DIFFERENCE FOR ISOTRETINOIN WAS PLUS 0.31 cm (95 per cent CI 0.20 to 0.41) IN MEN, consistent
  across strata of AGE AT INITIATION and CUMULATIVE DOSE and with stunting as the outcome. Millions of
  adolescents have taken a retinoid at 0.5 to 1 mg/kg/day through the last years of their growth, and the
  confidence interval excludes any height cost above four millimetres. It is, if anything, positive.
  THAT IS HEAVY NEGATIVE EVIDENCE AGAINST SYSTEMIC RETINOID TONE BEING A LEVER ON HUMAN HEIGHT, AND IT MUST
  BE CARRIED AS SUCH. But it is not evidence against the receptor, and williams2009 explains why in a
  sentence: THE TARGET ZONE HAS NO LIGAND IN IT AND IS BUILT NOT TO. It is avascular; its retinoid content
  was measured and is absent; and round 256 found CYP26B1 - the catabolic enzyme, and specifically that
  isoform, with CYP26A1 and CYP26C1 at the negative-control floor - expressed in the human plate. A tissue
  that is avascular AND transcribes the enzyme that destroys retinoic acid is a tissue defended against
  systemic retinoid. THE HUMAN PLATE IS BUFFERED, AND 379196 CONSCRIPTS ARE WHAT THAT BUFFER LOOKS LIKE
  FROM THE OUTSIDE.
  AND THE BUFFER IS EXACTLY WHAT koyama2021 REMOVES. Hedgehog inhibition closed the plate by MARKEDLY
  DECREASING Cyp26b1 and RAISING Raldh3 - it breaks the buffer, floods the zone, and the plate matures and
  shuts. The axis is reachable by dismantling the defence or by acting on the receptor directly. It is not
  reachable by swallowing more retinoid, which is what the Danish cohort tested.

  THREE - THE SECOND CAVEAT ON THE NULL, WHICH CUTS THE OTHER WAY AND IS STATED BECAUSE IT WEAKENS THE
  ABOVE. Isotretinoin is 13-cis-retinoic acid, a poor direct RAR ligand that acts largely after
  isomerisation, and it is not RARgamma-selective. matsuoka2025 showed that RARalpha and RARbeta agonists
  produce NO skeletal response on regimens where the RARgamma agonist closes plates. So a null from a
  non-selective, indirectly-acting retinoid is a weaker test of RARgamma than its size suggests. Both
  readings - "the plate is buffered" and "the drug was the wrong one" - reduce how much the null constrains
  RARgamma, and neither is established. What the null DOES establish is that the naive version of this
  arm - move systemic retinoid tone and move height - is dead in humans at n = 379196.

  FOUR - AND THE PIECE THAT IS NEW, WHICH CONNECTS THE RECEPTOR TO THIS ATLAS'S OWN SENESCENCE COUNTER.
  williams2009's co-repressor is ZAC1, gene symbol PLAGL1. PLAGL1 IS ONE OF THE ELEVEN GENES IN THE
  IMPRINTED NETWORK THAT arm3_pool_ceiling_is_imposed_not_intrinsic RECORDS AS DECLINING WITH AGE IN STEP
  WITH GROWTH RATE - Igf2, H19, Plagl1, Mest, Peg3, Dlk1, Gtl2, Grb10, Ndn, Cdkn1c, Slc38a4 (lui2010,
  kamran2015). Put the two together and there is a mechanism for the counter that neither literature has
  stated: IF RARgamma's growth-supporting repression requires Zac1, AND Zac1 falls with age as part of the
  body-wide growth-limiting programme, THEN the plate winds down in part because the co-repressor that
  holds RARgamma in its growth-supporting state is being withdrawn - and an RARgamma inverse agonist would
  substitute pharmacologically for a co-repressor that is being lost. THIS IS A HYPOTHESIS, IT IS GRADED E,
  AND IT IS WRITTEN DOWN BECAUSE IT IS TESTABLE, NOT BECAUSE IT IS SUPPORTED. What round 257 could check is
  only whether the components sit in the same human cells, and they do.

  FIVE - THE HUMAN EXPRESSION CHECK, AND A CORRECTION TO ROUND 256'S METHOD THAT NEARLY COST THE RESULT.
  The co-repressor machinery is abundant in the human plate: PLAGL1 34.4 per cent of cells (54 times the
  negative-control floor), NCOR1 53.2, NCOR2 38.6, TBL1XR1 63.8, HDAC3 14.3, all in 4 of 4 donors. Of
  RARG-positive cells, 57 per cent also carry PLAGL1 and 67 per cent carry NCOR1 - lower bounds, because
  droplet co-detection understates co-expression badly.
  THE CORRECTION. Round 256's zonal claim was made on RAW DETECTION RATE, and detection rate rises
  mechanically with sequencing depth. The gates are not depth-matched: in donor 1 the COL10A1+ cells have a
  median 5972 UMI and 2336 genes while the CYTL1+ cells have 13506 and 3842, and the MKI67+ cells 14367 and
  4268. The CYTL1+ and MKI67+ gates contain cells roughly 1.6 to 1.7-fold deeper, which is enough to
  manufacture the entire reported gradient for a sparse transcript. RE-TESTED ON MEAN CP10K, WHICH DIVIDES
  DEPTH OUT, THE GRADIENT SURVIVES - RARG runs 0.499 hypertrophic, 0.713 proliferating, 0.941 root in donor
  1 and 0.150, 0.199, 0.321 in donor 2 - AND THE CONTROL IS WHAT MAKES IT SAFE: RARA RUNS THE OPPOSITE WAY
  IN BOTH DONORS (0.362 to 0.142 and 0.301 to 0.220, hypertrophic to root). Depth would push both genes the
  same way; it pushes them apart. PLAGL1 tracks RARG (0.499/0.713/0.941 against 1.091/1.761/2.740 in donor
  1). Recorded as CORR-265: the conclusion is upheld and its evidence is now better than what was
  originally claimed for it, but the original statistic was confounded and would not have survived on its
  own.

  SIX - WHAT THE COMPOUND HAS TO BE, WHICH THIS ROUND CHANGES. Round 255 asked for an "RARgamma
  antagonist". On the ligand-less repressor model that is the wrong specification. A silent antagonist that
  merely occludes the pocket does nothing useful in a zone with no ligand to occlude. WHAT IS WANTED IS AN
  INVERSE AGONIST - a compound that stabilises the co-repressor-bound conformation and enhances NCoR
  recruitment - which is precisely williams2009's "pharmacologic agents that enhance RAR repressor
  function". That reclassifies the candidates: BMS204,493 is described by riedl2020 as an inverse agonist
  and reduced hypertrophic conversion in human cells; AGN193109 is the canonical pan-RAR inverse agonist;
  CD2665 is usually described as a selective RARbeta/gamma ANTAGONIST and whether it is inverse-agonist at
  RARgamma is not established here. THE COMPOUND QUESTION IS NOW A PHARMACOLOGY QUESTION WITH A DEFINITE
  ANSWER IN THE LITERATURE, AND IT IS NOT ANSWERED IN THIS NODE.
quantitative:
- parameter: >-
    THE HUMAN NULL - ISOTRETINOIN IN ADOLESCENCE AND ADULT HEIGHT AT n = 379196
  value: >-
    adjusted mean height difference +0.31 cm (95 per cent CI 0.20 to 0.41) in men and +0.25 cm (95 per cent
    CI -0.47 to 0.96) in women
  unit: centimetres of adult height
  conditions: >-
    schmidt2026. Nationwide population-based cross-sectional study of Danish military conscription 2001-2015
    linked by personal identifier to prospectively collected national prescription registries. 368338 men
    (16739 isotretinoin users, 4.5 per cent) and 10858 women (278 users). Adult height measured at
    conscription, median age 19.0 years in men; mean height 180.4 (SD 6.7) cm. Reference group had no
    prescribed acne treatment and no hospital-diagnosed acne; oral tetracyclines and topical acne therapy
    served as active comparators. Linear regression adjusted for birth cohort and educational level.
    Predefined minimal clinically important difference 5 cm. Results consistent when stratified by age at
    initiation and by cumulative dose, and with stunting as a secondary outcome.
  species: human
  source_ref: schmidt2026
  uncertainty: >-
    THE EFFECT IS POSITIVE, WHICH IS ALMOST CERTAINLY RESIDUAL CONFOUNDING RATHER THAN A GROWTH BENEFIT -
    acne tracks with earlier maturation, higher BMI and higher socioeconomic position, and the adjustment
    set is birth cohort and education only. Conscription is a selected male population and the female arm is
    280-fold smaller with a CI ten times wider. The design limit that matters most for this atlas: ISOTRETINOIN
    IS 13-CIS-RETINOIC ACID, a poor direct RAR ligand acting largely after isomerisation and NOT
    RARgamma-selective, and matsuoka2025 showed RARalpha and RARbeta agonists produce no skeletal response
    at all. So this is a very large null on SYSTEMIC RETINOID EXPOSURE and a considerably weaker one on
    RARgamma.
- parameter: >-
    THE GENETIC RESULT AND ITS INVERSION - CARTILAGE RARgamma IS REQUIRED FOR GROWTH BECAUSE IT REPRESSES
    WITHOUT LIGAND
  value: >-
    RARalpha+RARgamma or RARbeta+RARgamma cartilage-deficient mice - severe growth retardation by about 3
    weeks postnatal with defective plates and a major drop in aggrecan; RARalpha+RARbeta deficient mice
    virtually normal
  unit: qualitative genetic phenotype
  conditions: >-
    williams2009, Dev Biol. Cartilage-conditional RAR mutants. RARgamma reported as the most strongly
    expressed RAR in mouse growth plate, with expression characterising the PROLIFERATIVE AND
    PRE-HYPERTROPHIC zones where aggrecan is also strongly expressed. Those zones shown to lack endogenous
    retinoids by RARE reporter mice AND by the authors' direct biochemical measurement. Aggrecan production
    enhanced by RARgamma over-expression under retinoid-free culture, boosted further by the co-repressor
    Zac1 (PLAGL1) and by pharmacologic agents that enhance RAR repressor function, possibly via Sox
    proteins.
  species: mouse
  source_ref: williams2009
  uncertainty: >-
    THE LIGAND-LESS REPRESSOR MODEL IS THE AUTHORS' INTERPRETATION AND THE WORD THEY USE IS "LIKELY". What
    is measured is the knockout phenotype, the zonal expression, the absence of retinoid in the zone, and
    the culture experiments; what is inferred is that an inverse agonist would therefore ENHANCE growth
    rather than block it, and NO SUCH EXPERIMENT IS REPORTED HERE. yamaguchi1998 is the standing
    counter-example: a DOMINANT-NEGATIVE RAR in chondrogenic cells also produced skeletal RETARDATION, in an
    embryonic patterning context, and a dominant-negative is usually a constitutive repressor - which is the
    direction the model predicts should help. That is unresolved and it is the sharpest objection to this
    node.
- parameter: >-
    THE CO-REPRESSOR MACHINERY IN THE HUMAN GROWTH PLATE, AND THE PLAGL1 LINK TO THE SENESCENCE NETWORK
  value: >-
    PLAGL1 34.4, NCOR1 53.2, NCOR2 38.6, TBL1XR1 63.8, HDAC3 14.3 per cent of cells - 23 to 101 times the
    negative-control floor. Of RARG-positive cells, 57 per cent carry PLAGL1 and 67 per cent carry NCOR1
  unit: per cent of cells with at least one count, mean of four donors
  conditions: >-
    GSE288028, same four fresh donors and same 0.632 per cent negative-control floor as round 256, 27704
    cells. Tool at atlas/tools/round257_rarg_corepressor_machinery.py, output at
    atlas/data/round257_corepressor_query.txt. Co-activators are also abundant in the same cells - NCOA1
    46.5, NCOA2 44.4, NCOA3 47.1, CREBBP 50.2, EP300 38.7 - and are reported alongside deliberately.
  species: human
  source_ref: chu2026
  uncertainty: >-
    NCOR1, NCOR2, HDAC3 AND TBL1XR1 ARE BROADLY EXPRESSED HOUSEKEEPING-ADJACENT GENES and their presence in
    cartilage is not informative on its own; the co-activator machinery is equally abundant, so nothing here
    shows that repression dominates over activation at this locus. Droplet co-detection understates
    co-expression, so the 57 and 67 per cent figures are lower bounds and cannot be read as a co-expression
    rate. The PLAGL1-to-senescence-counter link is an inference across two literatures that share no data.
- parameter: >-
    THE DEPTH-NORMALISED RE-TEST OF ROUND 256'S ZONAL CLAIM, WITH RARA AS THE INTERNAL OPPOSITE CONTROL
  value: >-
    RARG CP10K hypertrophic / proliferating / root - donor 1: 0.499, 0.713, 0.941; donor 2: 0.150, 0.199,
    0.321. RARA over the same gates - donor 1: 0.362, 0.137, 0.142; donor 2: 0.301, 0.273, 0.220. PLAGL1 -
    donor 1: 1.091, 1.761, 2.740
  unit: mean counts per 10000 UMI, by marker gate
  conditions: >-
    Same cells and gates. The depth control that forced this: in donor 1 the COL10A1+ gate has median 5972
    UMI and 2336 genes detected, the CYTL1+ gate 13506 and 3842, the MKI67+ gate 14367 and 4268 - so the
    gates differ 1.6 to 1.7-fold in depth and raw detection rate is confounded. Donor 3 is
    hypertrophic-dominated (8578 of 9115 cells COL10A1+), its gates overlap, and its CP10K values are flat
    across all three as expected. Donor 4 has one cell in the proliferating gate.
  species: human
  source_ref: chu2026
  uncertainty: >-
    RESTS ON DONORS 1 AND 2, as round 256's did. CP10K normalises depth but is sensitive to a few
    high-expressing cells, and no statistical test is applied here. What raises this above the original
    claim is the INTERNAL CONTROL: sequencing depth would move RARG and RARA in the SAME direction, and they
    move in OPPOSITE directions across the same gates in both discriminating donors. Marker gates remain
    enrichments, not the authors' clusters.
localization:
- 'mouse growth plate proliferative and pre-hypertrophic zones: RARgamma most strongly expressed, and
  retinoid-free by direct measurement (williams2009)'
- 'human growth plate: RARG and PLAGL1 both rise from the hypertrophic toward the root and proliferative
  gates on a depth-normalised statistic, while RARA falls'
human_evidence: direct
human_evidence_note: >-
  schmidt2026 is a human adult-height endpoint at n = 379196. The expression work is human tissue. The
  ligand-less repressor mechanism is entirely mouse and cell culture.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  The mechanism that makes the axis attractive is mouse and is the authors' interpretation of their own
  knockout; the largest human dataset on retinoid exposure and height is a null; and the compound class the
  model actually requires - an RARgamma inverse agonist - has never been given to a human.
confidence: C
confidence_reason: >-
  The two primary results are each strong and each is being used partly against its own plain reading, which
  is exactly the situation that warrants C. The reconciliation is coherent, is grounded in a measured fact
  (the zone is avascular and retinoid-free) rather than an assumption, and reproduces independently in the
  human expression data - but it is a reconciliation, and yamaguchi1998 stands against it unexplained.
claim_grades:
- claim: >-
    Removing RARgamma from cartilage shortens bones.
  grade: B
  basis: >-
    williams2009 - RARalpha+RARgamma and RARbeta+RARgamma cartilage-conditional mutants show severe postnatal
    growth retardation with an aggrecan collapse, while RARalpha+RARbeta mutants are virtually normal.
- claim: >-
    Therefore a drug that acts on RARgamma will shorten bones.
  grade: X
  basis: >-
    DOES NOT FOLLOW. Deleting a repressor and stabilising it in its repressor conformation are opposite
    manipulations. williams2009's own culture data has aggrecan RISING with RARgamma over-expression under
    retinoid-free conditions and rising further with agents that ENHANCE RAR repressor function, and
    koyama2021's antagonist arm delayed maturation and expanded the plate. The inference from knockout to
    drug direction is invalid for a receptor whose relevant function is ligand-independent.
- claim: >-
    Systemic retinoid exposure during adolescence reduces adult height in humans.
  grade: X
  basis: >-
    NO. schmidt2026, n = 379196, adjusted difference +0.31 cm (CI 0.20 to 0.41) in men, consistent across
    age at initiation and cumulative dose. The naive version of this arm is dead at a scale that will not be
    improved on.
- claim: >-
    The human growth plate is buffered against systemic retinoid, which is why that null is a null.
  grade: E
  basis: >-
    Assembled from three measured facts - the zone is avascular; its retinoid content was directly measured
    as absent in mouse (williams2009); and CYP26B1 specifically, with CYP26A1 and CYP26C1 at the
    negative-control floor, is transcribed in the human plate (round 256) - plus koyama2021's demonstration
    that suppressing Cyp26b1 is how hedgehog inhibition closes the plate. No one has measured retinoid
    concentration in a human growth plate, and the alternative explanation for the null (isotretinoin is not
    RARgamma-selective) is equally live.
- claim: >-
    The declining imprinted-network gene PLAGL1 is the co-repressor whose loss weakens RARgamma's
    growth-supporting repression, making it a mechanism for the senescence counter.
  grade: E
  basis: >-
    HYPOTHESIS. williams2009 identifies Zac1/PLAGL1 as a co-repressor that boosts RARgamma-driven aggrecan
    production; arm3 records PLAGL1 among eleven imprinted genes declining with age in step with growth rate.
    The two literatures share no data and nobody has tested whether PLAGL1 decline alters RARgamma output.
    Round 257 establishes only that RARG and PLAGL1 are co-expressed in the same human cells with the same
    zonal direction.
- claim: >-
    The compound needed is an RARgamma antagonist.
  grade: X
  basis: >-
    WRONG SPECIFICATION, from round 255. A silent antagonist occludes a pocket that has no ligand in it. The
    model requires an INVERSE AGONIST that stabilises the co-repressor-bound conformation - williams2009's
    "pharmacologic agents that enhance RAR repressor function". BMS204,493 and AGN193109 are described as
    inverse agonists; whether CD2665 is one at RARgamma is not established in this atlas.
