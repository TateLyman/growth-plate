contradicts: >-
  This round withdraws the central recommendation of rounds 306 and 308 and corrects the criterion behind it.
  WITHDRAWN: that acrodysostosis type 2 is PDE4D gain of function and that PDE4 inhibition is therefore the
  corrective inverse - the direction is a documented open controversy (gardner2024) and the best-designed
  study, native patient fibroblasts, finds PDE4D activity REDUCED with phospho-CREB RAISED, making PDE4
  inhibition a phenocopy risk. WITHDRAWN: PDE4/PDE4B as the node, and with it roflumilast and apremilast as
  height candidates. CORRECTED: round 308's criterion - abundance in the target tissue identifies which
  enzyme is present, not which cAMP pool carries the height signal, and PDE3B versus PDE4D shows the two
  answers can be opposite. UNTOUCHED: the loss-direction human genetics (GNAS, ADCY6), round 307's band, and
  round 308's dataset results, which were measurements rather than inferences.
