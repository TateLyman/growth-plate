id: round290_hhip_taken_all_the_way_down_and_the_handle_is_an_rna
name: >-
  ROUND 290 - HHIP taken all the way down. The target is validated at four levels and expressed in our own
  growth-plate data ABOVE FGFR3. The pharmacological proof of the direction is already in this file and I had
  not restated it: a unilateral hedgehog bead gave +3.63 PER CENT FEMUR AT SIX MONTHS IN 8 OF 8 RATS AND THE
  EFFECT GREW. And there is a handle nobody in this atlas has ever named - HHIP-AS1, a natural antisense
  lncRNA that stabilises HHIP mRNA through ELAVL1, whose knockdown is an RNA-druggable phenocopy of the
  loss-of-function state. Plus the reason the whole axis tolerates being pushed: PTHrP is the buffer
aliases:
- round 290
- HHIP-AS1 is the handle
- the PTHrP buffer
- why HHIP loss is ordered and SUFU loss is not
- local hedgehog beats systemic
type: hypothesis
layer: L3
stub: false
summary: >-
  ONE - THE TARGET, VALIDATED AT FOUR LEVELS. HUMAN POPULATION GENETICS, BOTH DIRECTIONS: HHIP
  putative-loss-of-function +9.92 cm per allele, HHIP p.V496E gain-of-function missense -3.96 cm
  (kosmicki2026). MOUSE CONDITIONAL, LIMB-RESTRICTED: Prx1-Cre Hhip1 deletion gives significantly longer
  femurs at TEN weeks AND at FIFTY-THREE weeks with NO body-weight difference at either age, epiphyseal
  cartilage enlarged with both proliferative and hypertrophic zones widened BUT ORDERED, Gli1 up in
  chondrocytes and primary spongiosa (haraguchi2025). OVEREXPRESSION: transgenic Hhip1 shrinks the zone of
  undifferentiated chondrocytes. AND THE PATHWAY'S OTHER BRAKE: Ptch1-deficient mice show excessive bone
  elongation. Four levels, two species, both directions, monotonic.

  TWO - AND IT IS EXPRESSED WHERE IT NEEDS TO BE, IN DATA THIS ATLAS ALREADY OWNED. In chu2026's mouse
  GP1-versus-GP2 table, HHIP has baseMean 3.73 and is SIGNIFICANTLY cluster-restricted (log2FC -0.549, padj
  0.034). For scale in the same table: PTCH1 4.93, NT5E/CD73 3.21, FGFR3 2.30. HHIP IS EXPRESSED IN THE
  MOUSE GROWTH PLATE ABOVE THE RECEPTOR THIS STACK IS BUILT AROUND.
  AND THE REST OF THE MODULE PARTITIONS WITH IT, WHICH IS THE NEW RESULT. The hedgehog-availability
  machinery is spatially split inside the plate: HHIP (-0.549, padj 0.034) and SCUBE2 (-3.05, padj 1.6e-8),
  the factor that releases lipid-modified hedgehog, sit on one side; the three POSITIVE co-receptors sit on
  the other - GAS1 (+3.06, padj 1.8e-10), CDON (+1.79, padj 6.1e-15), BOC (+1.44, padj 1.2e-10). Per
  CORR-296 the direction of that axis cannot be named, but THE PARTITION ITSELF IS THE FINDING: the
  antagonist and the co-receptors occupy opposite compartments. That is round 287's extracellular
  morphogen-availability layer, resolved spatially, out of a file we have held since round 243.

  THREE - THE PHARMACOLOGICAL PROOF OF THE DIRECTION IS ALREADY IN THIS FILE AND I HAD NOT PUT IT NEXT TO
  THE REST. trompet2024 implanted SAG-containing beads into the femoral SECONDARY OSSIFICATION CENTRE OF ONE
  LEG of rats, with the contralateral leg taking a vehicle bead as a WITHIN-ANIMAL CONTROL. The treated leg
  was longer at one month, MORE SO AT TWO, AND +1.263 mm (+3.63 PER CENT) AT SIX MONTHS, P = 0.00004, IN 8
  OF 8 ANIMALS. THE EFFECT GREW RATHER THAN DECAYED. Transient intra-articular SAG raised resting-zone
  Pthrp-tdTomato-positive cells from 65.5 to 139.8 cells/mm2 with proliferation unchanged in the top 50
  microns and in the proliferative zone.
  AND SYSTEMIC SAG IN THE SAME LITERATURE GAVE POOL UP, LENGTH UNCHANGED. SO THE VARIABLE IS ROUTE AS WELL
  AS DOSE. Local hedgehog agonism at a growth site lengthens a normal bone durably; flooding the animal does
  not. That is CORR-300 with a length endpoint on both sides of it.

  FOUR - THE HANDLE THIS ATLAS HAS NEVER NAMED, AND IT IS AN RNA. HHIP-AS1 is a natural antisense long
  noncoding RNA transcribed from the opposite strand of the HHIP locus, and its mechanism has been worked
  out in bone marrow mesenchymal stromal cells. yin2022: HHIP-AS1 BINDS HHIP mRNA AND RECRUITS ELAVL1 (HuR)
  TO IT, INCREASING HHIP mRNA STABILITY AND PROTEIN LEVEL. Overexpressing HHIP-AS1 raised HHIP and
  SUPPRESSED hedgehog - SMO, GLI1 and GLI2 all down - and inhibited osteogenesis; AND HHIP KNOCKDOWN
  ABOLISHED THAT SUPPRESSION, which is the control that makes the effect HHIP-mediated rather than a generic
  lncRNA artefact. Both HHIP mRNA and HHIP-AS1 fall progressively across days 0, 7 and 14 of osteogenic
  differentiation.
  THEREFORE KNOCKING DOWN HHIP-AS1 DESTABILISES HHIP mRNA, LOWERS HHIP PROTEIN AND RAISES HEDGEHOG - WHICH
  IS A PHENOCOPY OF THE haraguchi2025 GENOTYPE, PRODUCED BY A MODALITY THAT IS ALREADY IN CLINICAL USE.
  Antisense oligonucleotides against RNA targets are approved drugs. AND THE STABILISING RELATIONSHIP
  REPLICATES: HHIP-AS1 stabilises HHIP mRNA in lung squamous carcinoma and in hepatocellular carcinoma as
  well as in BM-MSCs - three tissues, same direction.
  THIS IS THE FIRST PROPOSAL IN THIS FILE THAT IS MECHANISTICALLY THE RIGHT KIND. It removes a SECRETED
  ANTAGONIST rather than flooding a pathway with an agonist or disabling an intracellular brake - the
  distinction CORR-300 derived across three axes and which decides the sign every time.

  FIVE - AND HERE IS WHY THE AXIS TOLERATES BEING PUSHED, WHICH IS THE MECHANISM UNDER CORR-300 RATHER THAN
  JUST ITS PATTERN. saturne2025 RNA-sequenced Hhip-null cranial sutures and found HH target genes UP -
  INCLUDING Pthlh - while Ihh itself was PARADOXICALLY DOWN. PTHrP is a negative regulator of Ihh
  expression. So REMOVING HHIP ENGAGES THE IHH-PTHrP NEGATIVE FEEDBACK LOOP, WHICH ABSORBS PART OF THE
  INCREASE. The authors then deleted both: Hhip-/-;Pthlh-/- double mutants fuse the coronal suture, which
  the Hhip single mutant does not. THE BUFFER IS LOAD-BEARING.
  THAT EXPLAINS THE WHOLE CORR-300 ASYMMETRY ON THIS AXIS. HHIP sits UPSTREAM of the Ihh-PTHrP loop, so
  removing it is damped by the loop and the zones stay ordered. SUFU sits DOWNSTREAM of Smoothened, outside
  the loop's reach, so deleting it cannot be buffered - and xiu2022's Sufu mutants have their zonal order
  destroyed and end up with shorter femurs. Same pathway, same direction of tone, opposite outcome, and the
  reason is which side of the feedback loop the brake is on.

  SIX - THE COSTS, RECORDED IN FULL AND NOT WEIGHED, BECAUSE THE OPERATOR HAS DEPRIORITISED RISK.
  (a) PREMATURE FUSION AT OTHER GROWTH SITES. Hhip-/- mice FUSE THE LAMBDOID SUTURE by E18.5 and have
  coronal suture dysgenesis - ectopic hedgehog is an established cause of craniosynostosis. Against that,
  haraguchi2025's growth plate was still producing extra femur at 53 weeks, so the suture and the plate
  behave differently; but this is the same axis whose opposite direction carries grade-A irreversible
  PHYSEAL fusion in children.
  (b) ONCOLOGY, TWO-SIDED. HHIP is a tumour suppressor that is DOWNREGULATED or silenced in lung, gastric,
  hepatocellular and pancreatic cancer, so lowering it moves toward the cancer-associated state; and
  hedgehog activation causes medulloblastoma and basal cell carcinoma (Ptch1 heterozygotes, Gorlin
  syndrome). Running the other way, HHIP-AS1 knockdown in SHH-driven medulloblastoma would be PROTECTIVE,
  because there it promotes tumorigenicity.
  (c) THE ASO WOULD NOT BE CLEAN. bartl2022 shows HHIP-AS1 has an HHIP-INDEPENDENT function - stabilising
  dynein complex 1 - so knocking it down does more than lower HHIP.
  (d) HHIP is the strongest lung-function and COPD locus in human genetics, and reduced HHIP associates with
  COPD risk.

  SEVEN - WHAT IS MISSING, AND IT IS A SHORT LIST FOR ONCE. No HHIP-AS1 experiment exists in chondrocytes or
  in a growth plate - the mechanism is BM-MSC and cancer work. Whether HHIP-AS1 is conserved in mouse is
  unresolved and lncRNAs frequently are not, which would simultaneously make it a HUMAN-SPECIFIC handle and
  block the obvious preclinical test. No antisense oligonucleotide against HHIP-AS1 has been given to any
  animal with a bone endpoint. The tamoxifen-inducible Hhip1 deletion in a juvenile still has not been run
  although the floxed allele now exists. DELIVERY, UNUSUALLY, IS THE PART THAT IS SOLVED: trompet2024 proves
  intra-articular and intra-secondary-ossification-centre routes reach the target at a knee, and the
  cartilage-targeting nanoparticle of round 248 - chondrocyte membrane plus the collagen-II-binding peptide
  WYRGRL - is a systemic route to the same place.
quantitative:
- parameter: >-
    HHIP IS EXPRESSED IN THE GROWTH PLATE ABOVE FGFR3, AND THE HEDGEHOG-AVAILABILITY MODULE IS SPATIALLY
    PARTITIONED
  value: >-
    chu2026 mouse GP1-versus-GP2 differential expression: HHIP baseMean 3.73, log2FC -0.549, padj 0.034 -
    SIGNIFICANTLY CLUSTER-RESTRICTED. SCUBE2, the hedgehog release factor, baseMean 0.81, log2FC -3.05, padj
    1.6e-8, same side. The three POSITIVE co-receptors sit on the OPPOSITE side: GAS1 baseMean 1.36, log2FC
    +3.06, padj 1.8e-10; CDON baseMean 2.37, log2FC +1.79, padj 6.1e-15; BOC baseMean 2.72, log2FC +1.44,
    padj 1.2e-10. Not significant: PTCH1 (baseMean 4.93), PTCH2, GLI1, IHH, HHIPL1, HHIPL2.
    FOR SCALE IN THE SAME TABLE: COL2A1 783.5, ACAN 47.4, PTCH1 4.93, NT5E/CD73 3.21, FGFR3 2.30
  unit: DESeq2 baseMean and adjusted P, mouse growth-plate clusters
  conditions: >-
    atlas/data/round243_supplied/chu2026_supp/adw3590_data_file_s1.csv, held since round 243, queried this
    round for the hedgehog-availability gene set.
  species: mouse
  source_ref: chu2026
  uncertainty: >-
    DIRECTION IS NOT ASSIGNED AND MUST NOT BE - CORR-296 established that this table's sign convention cannot
    be calibrated, because SFRP5, PTHLH and NT5E place the resting compartment on one side while GAS1 and the
    global 1039:441 skew place it on the other. So "HHIP and the co-receptors are in OPPOSITE compartments"
    is supportable; "HHIP is in the resting zone" is not, from this dataset. haraguchi2025's in situ data is
    the source for that, not this. Two clusters are also not the whole plate, and transcript is not protein.
- parameter: >-
    THE LENGTH PROOF FOR LOCAL HEDGEHOG AGONISM, RESTATED BECAUSE IT IS THE STRONGEST IN THE FILE
  value: >-
    SAG-containing beads implanted into the femoral secondary ossification centre of ONE leg of rats, vehicle
    bead contralateral as a WITHIN-ANIMAL CONTROL: treated leg significantly longer at 1 month, more
    pronounced at 2 months, and +1.263 mm (+3.63 PER CENT) AT SIX MONTHS, P = 0.00004, 8 OF 8 ANIMALS - THE
    EFFECT GREW RATHER THAN DECAYED. Transient intra-articular SAG raised resting-zone Pthrp-tdTomato+ cells
    from 65.5 to 139.8 cells/mm2 (n = 5, P = 0.017) with proliferation unchanged in the top 50 microns and in
    the proliferative zone. Systemic SAG in the same literature raised the pool with length unchanged
  unit: mm and per cent femur length; cells per mm2
  conditions: >-
    trompet2024, read in full and held in the_duration_term_broken_down since before this round. Rat,
    unilateral implantation, six-month follow-up.
  species: rat
  source_ref: trompet2024
  uncertainty: >-
    A SURGICALLY IMPLANTED BEAD IS NOT A DRUG REGIMEN, and the secondary ossification centre is not a
    clinically routine injection site - although the intra-articular arm of the same paper is. SAG is also a
    Smoothened agonist, which by CORR-300's logic is the WRONG KIND of intervention, and the reconciliation
    offered here - that LOCAL low-exposure agonism sits in the setpoint-shifting regime while systemic
    agonism saturates - is an inference from the route difference, not a measured dose-response. What is not
    in doubt is the endpoint: a normal rat bone got 3.63 per cent longer and stayed that way for six months.
- parameter: >-
    HHIP-AS1 - THE RNA HANDLE, WITH ITS MECHANISM AND ITS CONTROL
  value: >-
    HHIP-AS1 is a natural antisense lncRNA at the HHIP locus. In BM-MSCs it BINDS HHIP mRNA AND RECRUITS
    ELAVL1 (HuR), INCREASING HHIP mRNA STABILITY AND PROTEIN. Overexpression of HHIP-AS1 raised HHIP and
    suppressed hedgehog - SMO, GLI1 and GLI2 all reduced - and inhibited osteogenic differentiation; HHIP
    KNOCKDOWN ABOLISHED THE SUPPRESSION. Both HHIP mRNA and HHIP-AS1 fell progressively across days 0, 7 and
    14 of osteogenic differentiation. The same stabilising relationship is reported in lung squamous
    carcinoma and in hepatocellular carcinoma
  unit: mRNA stability, protein level, pathway readout
  conditions: >-
    yin2022, human bone marrow mesenchymal stromal cells, with fluorescence in situ hybridisation,
    immunofluorescence and alkaline phosphatase readouts.
  species: human
  source_ref: yin2022
  uncertainty: >-
    BM-MSCs UNDERGOING OSTEOGENIC DIFFERENTIATION ARE NOT GROWTH PLATE CHONDROCYTES, and no HHIP-AS1
    experiment exists in cartilage or in a growth plate in any species. The readout is osteogenesis, not bone
    length. Mouse conservation of HHIP-AS1 is unresolved - lncRNAs frequently are not conserved - which would
    make this a human-specific handle and simultaneously block the standard preclinical test. AND THE ASO
    WOULD NOT BE CLEAN: bartl2022 shows HHIP-AS1 also stabilises dynein complex 1 independently of HHIP.
- parameter: >-
    THE PTHrP BUFFER - WHY REMOVING THIS BRAKE IS ABSORBED AND REMOVING SUFU IS NOT
  value: >-
    RNA-seq of Hhip-null cranial sutures shows HEDGEHOG TARGET GENES UPREGULATED INCLUDING Pthlh, while Ihh
    itself is PARADOXICALLY DOWNREGULATED - PTHrP being a negative regulator of Ihh expression. Hhip-/- mice
    FUSE THE LAMBDOID SUTURE by E18.5 and show coronal suture dysgenesis with mesenchyme depleted between
    closely opposed but unfused osteogenic fronts; Hhip-/-;Pthlh-/- DOUBLE MUTANTS fuse the coronal suture
    as well
  unit: qualitative, RNA-seq and suture patency
  conditions: saturne2025, mouse embryonic cranial sutures at E18.5.
  species: mouse
  source_ref: saturne2025
  uncertainty: >-
    THIS IS CRANIAL SUTURE, NOT GROWTH PLATE - sutures are fibrous joints with different cell populations and
    the Ihh-PTHrP loop is a growth-plate circuit, so the transfer is an inference. It also carries the
    round's clearest COST: HHIP loss causes premature fusion at a cranial growth site, and this is the same
    axis whose opposite direction gives grade-A irreversible physeal fusion in children. Against that,
    haraguchi2025's growth plate was still adding femur at 53 weeks. The buffer interpretation of CORR-300 is
    a mechanism proposed here, not one demonstrated at the plate.
localization:
- 'growth plate, cluster-restricted: HHIP at baseMean 3.73, above FGFR3, with SCUBE2 on the same side and
  GAS1, CDON and BOC on the opposite side'
- 'resting zone chondrocytes, periosteum and primary spongiosa: where haraguchi2025 localises Hhip1 mRNA'
- 'cranial suture: where HHIP loss causes fusion, which is the cost'
human_evidence: direct
human_evidence_note: >-
  HHIP loss-of-function +9.92 cm and a gain-of-function missense -3.96 cm in 1.45 million exomes; the
  HHIP-AS1 mechanism is human cells. All skeletal length evidence is mouse and rat.
species_basis:
- human
- mouse
- rat
translation_risk: high
translation_risk_reason: >-
  No HHIP-directed agent exists in any species, HHIP-AS1 has never been touched in cartilage, its mouse
  conservation is unresolved, and the axis carries craniosynostosis in one direction and grade-A physeal
  fusion in the other.
confidence: B
confidence_reason: >-
  Target validation is strong and multi-level. The expression result is a direct query of a dataset this
  atlas owns. The trompet2024 length result is read in full and was already graded. The HHIP-AS1 mechanism is
  a single laboratory in a non-cartilage cell type, and the proposal built on it is a phenocopy argument, so
  the compound claim is held at E within an otherwise B-grade node.
claim_grades:
- claim: >-
    HHIP is expressed in the growth plate at a level that makes it a plausible local target.
  grade: B
  basis: >-
    baseMean 3.73 in chu2026's mouse GP1-versus-GP2 table with padj 0.034 - above NT5E/CD73 at 3.21 and above
    FGFR3 at 2.30, and comparable to PTCH1 at 4.93. Corroborated independently by haraguchi2025's in situ
    localisation of Hhip1 mRNA to resting-zone chondrocytes, periosteum and primary spongiosa.
- claim: >-
    The hedgehog-availability module is spatially partitioned within the growth plate.
  grade: C
  basis: >-
    HHIP (-0.549, padj 0.034) and SCUBE2 (-3.05, padj 1.6e-8) fall on one side of the GP1/GP2 axis while the
    three positive co-receptors fall on the other - GAS1 +3.06 (padj 1.8e-10), CDON +1.79 (padj 6.1e-15), BOC
    +1.44 (padj 1.2e-10). The antagonist and the co-receptors are in OPPOSITE compartments. Held at C because
    CORR-296 forbids naming which compartment is which in this dataset, and because two clusters are not the
    whole plate.
- claim: >-
    It is the AVAILABILITY machinery that partitions, not the transduction machinery - and that is an
    internal control, from the same table, that the partition is real and not a cluster artefact.
  grade: B
  basis: >-
    In chu2026's table the entire hedgehog TRANSDUCTION cascade is FLAT and NON-SIGNIFICANT across the two
    clusters - SMO +0.146 (padj 0.49), GLI1 +0.073 (padj 0.82), PTCH1 -0.137 (padj 0.56), and IHH itself is
    barely expressed at baseMean 0.035. Meanwhile SIX of the extracellular availability genes are
    significant and they sort into two groups: HHIP -0.549 (padj 0.034) and SCUBE2 -3.05 (padj 1.6e-8) one
    way; GAS1 +3.06 (padj 1.8e-10), CDON +1.79 (padj 6.1e-15), BOC +1.44 (padj 1.2e-10), DISP1 +1.99 (padj
    1.8e-3) and SCUBE1 +1.82 (padj 1.0e-4) the other. The receptor, the transducer and the pathway's own
    readout gene are UNIFORM between the compartments; what differs is who is allowed to hand the ligand
    over. Note also that SCUBE1 and SCUBE2 - paralogues doing the same job of releasing lipid-modified
    hedgehog - land in OPPOSITE compartments, which is a paralogue switch and not a dosage gradient. Graded B
    rather than C because unlike the partition claim this one does not depend on which cluster is which: it
    is a statement about WHICH GENES MOVE, and the nulls are the control.
- claim: >-
    Local hedgehog agonism durably lengthens a normal bone.
  grade: B
  basis: >-
    trompet2024, rat, unilateral SAG bead into the femoral secondary ossification centre with the
    contralateral limb as a within-animal control: +1.263 mm, +3.63 per cent, at six months, P = 0.00004, in
    8 of 8 animals, with the effect GROWING from one to two to six months. Systemic SAG in the same
    literature gave pool expansion with length unchanged, so the variable is ROUTE as well as dose.
- claim: >-
    Knocking down HHIP-AS1 is a druggable phenocopy of HHIP loss of function.
  grade: E
  basis: >-
    MECHANISTICALLY COHERENT AND ENTIRELY UNTESTED IN CARTILAGE. yin2022 establishes in human BM-MSCs that
    HHIP-AS1 binds HHIP mRNA, recruits ELAVL1/HuR, and raises HHIP stability and protein, and that HHIP
    knockdown abolishes the downstream suppression - so the axis is HHIP-mediated. Two further tissues report
    the same stabilising relationship. Antisense oligonucleotides are an approved modality. AGAINST: no
    HHIP-AS1 work exists in chondrocytes or growth plate, the readout in yin2022 is osteogenesis rather than
    length, mouse conservation is unresolved, and bartl2022 shows an HHIP-independent function, so the ASO
    would not be a clean HHIP knockdown.
- claim: >-
    Removing HHIP is buffered by the Ihh-PTHrP feedback loop, and that is why it does not destroy zonal order.
  grade: E
  basis: >-
    A MECHANISM PROPOSED HERE FOR A PATTERN CORR-300 ONLY DESCRIBED. saturne2025 finds hedgehog targets
    upregulated in Hhip-null sutures INCLUDING Pthlh, with Ihh paradoxically DOWN, and shows the buffer is
    load-bearing because Hhip-/-;Pthlh-/- double mutants fuse a suture the single mutant keeps patent. HHIP
    sits upstream of the loop and is damped by it; SUFU sits downstream of Smoothened, outside its reach, and
    xiu2022's Sufu mutants lose zonal order and end shorter. Graded E because the experiment is cranial
    suture rather than growth plate and the transfer is an inference.
- claim: >-
    This axis is free of a fusion liability.
  grade: X
  basis: >-
    NO. Hhip-null mice FUSE THE LAMBDOID SUTURE by E18.5 with coronal suture dysgenesis, and ectopic hedgehog
    is an established cause of craniosynostosis. HHIP is also a tumour suppressor silenced in lung, gastric,
    hepatocellular and pancreatic cancer, so lowering it moves toward the cancer-associated state, and
    hedgehog activation causes medulloblastoma and basal cell carcinoma. Recorded in full and not weighed,
    per the operator's standing deprioritisation of risk - but recorded, because the opposite direction of
    this same axis carries grade-A irreversible physeal fusion in children.
