contradicts: >-
  Does not overturn a prior node. It EXTENDS
  round285_germline_from_conception_was_a_bad_objection_and_the_test_that_replaces_it_reopens_hedgehog by
  supplying the three things that round left open - growth-plate expression from this atlas's own data, a
  pharmacological handle, and a mechanism for the CORR-300 asymmetry.
  It also supplies a MECHANISM for CORR-300 rather than another instance of it: HHIP sits UPSTREAM of the
  Ihh-PTHrP negative feedback loop and is damped by it, while SUFU sits downstream of Smoothened outside the
  loop's reach and cannot be. That is why the same direction of hedgehog tone gives ordered zones and a
  longer femur in one case and destroyed zones with shorter femurs in the other.
