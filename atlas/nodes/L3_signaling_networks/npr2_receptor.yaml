localization:
- 'mouse PHZ: prehypertrophic GC-B protein is asserted by the Kyoto group but is NOT data in nakao2015
  - that paper cites it to earlier work and uses GC-B IHC only to confirm knock-down. True primary unidentified
  (g_l2d_002)'
- 'mouse resting/proliferative (combined) vs hypertrophic vs mineralized: Npr2 transcript similar across
  these three compartments by zonal microarray (agoston2007). This study makes NO resting-versus-proliferative
  comparison; the atlas previously mis-stated its compartments as RZ/PZ/HZ'
- 'human growth plate: NPR2 zonal protein map unconfirmed'
human_evidence: direct
human_evidence_note: A complete human three-state dosage series (biallelic loss, heterozygous loss, gain
