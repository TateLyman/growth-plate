- 'human growth plate: NPR2 zonal protein map unconfirmed'
human_evidence: direct
human_evidence_note: A complete human three-state dosage series (biallelic loss, heterozygous loss, gain
  of function) with measured heights in cm and SDS, plus in vitro cGMP assays on the patient alleles.
species_basis:
- human
- mouse
translation_risk: low
translation_risk_reason: The human allelic series is measured directly in humans and its direction and
  rank order match the mouse knockouts; residual risk is confined to zonal mechanism, which is murine.
