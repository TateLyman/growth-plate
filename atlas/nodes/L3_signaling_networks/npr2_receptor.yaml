paralog_risk: 'The chondrocyte cGMP-PKG pool is attributed entirely to NPR2; NPR1/ANP is a genetically
  required parallel source in the same cell (zhou2024: Corin- and Nppa-null mice have impaired chondrocyte
  differentiation and shortened long bones, ANP acting in chondrocytes via cGMP-dependent protein kinase
  G) and has never been removed in the same animal. No NPR1 zonal map exists in any species. See g_para_001.'
reanalysis_observations:
- observation: NPR2 is detected in proliferative, prehypertrophic and hypertrophic zones of both human
    donors, prehypertrophic-maximal in the donor whose dissection resolves zones (144, 926, 1208, 333
    units across RZ/PZ/PHZ/HZ). NPR3, the clearance receptor, is detected in the hypertrophic zone with
    fold ranges of 27.4 and 10.1. NPR1 is detected in the resting zone only. The ligand NPPC is not detected
    in either donor in any compartment.
  interpretation: Receptor and clearance receptor are both present and zonally patterned in human tissue;
    the ligand transcript is not detectable. Whatever sets local cGMP tone at the human physis, the source
    of the ligand is not established by local transcription.
  caveats: Two donors, one platform, transcript only. See notebook section 3 on dissection quality.
  reanalysis: p8_01_gse9160_human_zonal
  source_ref: gse9160
  species: human
