reanalysis_observations:
- observation: 'Detected in both human donors: NOTCH1, NOTCH2, NOTCH3, JAG1, JAG2, DLL1, HES1, HEY1, HEY2,
    RBPJ, PSEN1. NOTCH2, RBPJ, PSEN1, JAG2 and HEY2 are detected in all five compartments of both donors.
    NOT detected in either donor: NOTCH4, DLL3, DLL4, HES5. The donor whose dissection resolves zones
    places the maximum in the RESTING zone for NOTCH1/2/3, JAG1, JAG2, HES1, HEY1 and PSEN1, NOTCH3 at
    a 110-fold range.'
  interpretation: The Notch machinery is present in human physis and is not zonally restricted at the
    level of its components. A resting-zone bias appears in the one usable dissection but rests on that
    single donor. Where the pathway is ACTIVE, and whether it restrains hypertrophy in human tissue as
    in mouse, are untouched by this.
  caveats: Component transcription is not pathway activity. See notebook section 3.
  reanalysis: p8_01_gse9160_human_zonal
  source_ref: gse9160
  species: human
