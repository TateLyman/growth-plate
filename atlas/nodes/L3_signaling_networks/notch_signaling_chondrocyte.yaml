id: notch_signaling_chondrocyte
name: Notch signalling in chondrocytes
type: pathway
layer: L3
stub: false
summary: 'Ligand binding releases the Notch intracellular domain (NICD) by gamma-secretase cleavage; NICD
  enters the nucleus and converts RBPJ from repressor to activator. In cartilage the pathway is required
  at two separable steps and its sign depends on which step is examined. Forced NICD expression in the
  mouse chondrocyte lineage reduces cartilage precursor proliferation and blocks hypertrophic differentiation,
  while chondrocyte-lineage Rbpj deletion increases proliferation and increases hypertrophic chondrocyte
  number (Mead 2009) - so Notch restrains both proliferation and, in the gain-of-function direction, hypertrophy.
  Kohn 2015 resolves the mechanism genetically: Notch controls the ONSET of maturation through SOX9 (the
  Rbpj-mutant phenotype is rescued by removing one Sox9 allele), whereas Notch control of TERMINAL maturation
  is SOX9-independent. Hosaka 2013 shows the terminal arm operates through HES1 and demonstrates NICD1/2
  nuclear translocation in human osteoarthritic articular chondrocytes, the only human chondrocyte data
  in this subsystem. Notch activity has never been mapped by zone in a human growth plate.'
localization:
- 'mouse PHZ/HZ: RBPJ-dependent activity required for onset and terminal maturation (mead2009, kohn2015)'
- 'human articular chondrocyte (OA): NICD1/NICD2 nuclear translocation confirmed (hosaka2013)'
- 'human growth plate: unconfirmed'
human_evidence: indirect
human_evidence_note: NICD nuclear translocation has been shown in human OA articular chondrocytes, and
  NOTCH2 gain-of-function causes human Hajdu-Cheney syndrome; neither is a growth plate measurement.
species_basis:
- mouse
- human
translation_risk: moderate
translation_risk_reason: Mechanistic genetics are mouse; the human observations are in diseased articular,
  not physeal, cartilage.
confidence: B
