id: round378_hhip_dissected_by_surface_the_ligand_interface_is_a_patch_for_patched_and_the_only_selective_surfaces_are_the_gag_sites_and_the_crd
name: Round 378 - HHIP DISSECTED SURFACE BY SURFACE. The obvious drug idea is structurally self-defeating
  because HHIP is a DECOY FOR PATCHED and binds the ligand where the real receptor binds it; what survives is
  a precise partition in which only the two glycosaminoglycan sites and the cysteine-rich domain are
  HHIP-selective, which finally gives the function-blocking antibody an epitope specification and names a
  screen that has been run on the neighbouring protein and never on this one
aliases:
- HHIP structure druggable surface
- can we block the HHIP hedgehog interface
- patch for Patched
- where should an anti-HHIP antibody bind
- HHIP GAG site screen
type: hypothesis
layer: L3
stub: false
summary: 'The operator asked to dissect HHIP and the direction wanted, on the reasoning that a niche route
  might exist. Doing it properly kills the obvious route on structure, and replaces it with a much more
  specific one.

  ⛔⛔ ONE - THE OBVIOUS IDEA IS STRUCTURALLY SELF-DEFEATING, AND THE PROOF IS FROM 2009. bosanac2009 solved
  human HHIP alone and bound to SHH. HHIP is TWO EGF DOMAINS PLUS A SIX-BLADED BETA-PROPELLER, and in the
  complex A CRITICAL LOOP FROM HHIP BINDS THE PSEUDO-ACTIVE-SITE GROOVE OF SHH AND DIRECTLY COORDINATES ITS
  Zn2+ CATION. The decisive part is what that loop resembles: comparing it with the PATCHED1 ectodomains, and
  with HHIP- and PTC1-peptide binding studies, the authors identify A PATCH FOR PATCHED at the Shh
  pseudo-active site and propose HHIP IS A STRUCTURAL DECOY RECEPTOR. → HHIP AND THE REAL RECEPTOR BIND THE
  SAME SURFACE ON THE LIGAND. Any molecule that competitively displaces HHIP from hedgehog displaces PATCHED
  too, so the intuitive move - block the HHIP-ligand interface and free the ligand - frees it from its own
  receptor as well.

  ⛔ TWO - AND IT IS CONFIRMED EXPERIMENTALLY, NOT JUST BY HOMOLOGY. maun2010: the antibody 5E1 blocks all
  three mammalian hedgehog homologues from binding PATCHED1, and its co-crystal with SHH shows it binds the
  pseudo-active-site groove WITH AN EPITOPE THAT LARGELY OVERLAPS HHIP''S BINDING SITE. Calcium-enhanced like
  HHIP and Cdon; with calcium and zinc the affinity tightens 10 to 20-fold to better than 1 nM. So a binder
  raised against that surface behaves exactly as predicted - IT INHIBITS THE PATHWAY. That is also why 5E1
  keeps appearing in HHIP searches and is not an anti-HHIP reagent: it binds SHH.

  ⭐⭐⭐ THREE - WHAT SURVIVES IS A CLEAN PARTITION OF HHIP''S SURFACES, AND ONLY TWO OF THEM ARE OURS.
  · EGF1 L2 LOOP plus Zn coordination - binds the ligand pseudo-active site. SHARED WITH PATCHED. UNUSABLE.
  · BETA-PROPELLER GAG SITE 1 - K277, R328, R350 (griffiths2021). HHIP-SELECTIVE.
  · EGF-REPEAT GAG SITE 2 - K569, R610, R613. HHIP-SELECTIVE.
  · HHIP-N CYSTEINE-RICH DOMAIN - binds PEG-cholesterol at Kd 23 micromolar, targets the ligand''s
    cholesterol moiety, loops DL1/DL2 positioned where folate receptor beta''s pocket sits, same CRD fold
    family as NPC1, RFBP, JUNO, Frizzled8 AND SMOOTHENED. HHIP-SELECTIVE.
  → THE GAG SITES AND THE CRD ARE THE ENTIRE DRUGGABLE SURFACE OF THIS TARGET, AND BOTH ARE ABOUT AVIDITY AND
  LIPID RECOGNITION RATHER THAN ABOUT THE LIGAND CONTACT ITSELF. That is why griffiths2021''s authors called
  drugging GAG clustering an unexploited avenue - it is the only avenue.

  ⭐⭐ FOUR - SO THE FUNCTION-BLOCKING ANTIBODY THIS ATLAS HAS ASKED FOR SINCE R314 FINALLY HAS AN EPITOPE
  SPECIFICATION. It must bind the GAG sites or the cysteine-rich domain and MUST NOT bind the L2 loop face.
  An antibody raised naively against HHIP has a good chance of landing on the immunodominant ligand-binding
  face and becoming a second 5E1 - a pathway inhibitor, the exact opposite of what is wanted. THAT IS
  PROBABLY WHY THE COMMERCIAL ANTI-HHIP MONOCLONALS ARE RESEARCH REAGENTS RATHER THAN FUNCTION BLOCKERS, and
  it converts a vague ask into a screenable one: raise against the GAG-site epitopes, counter-screen against
  the L2 loop, and select for LOSS of HHIP potency in a Gli reporter rather than for binding.

  ⭐⭐ FIVE - AND THE SCREEN HAS ALREADY BEEN RUN ON THE NEIGHBOURING PROTEIN, WHICH GIVES A TEMPLATE AND A HIT
  RATE. lamson2024 screened 34,560 compounds for antagonists of SHH binding to HEPARIN: 26 confirmed hits,
  four recurring scaffolds, NINETEEN with IC50 under 50 micromolar, four active in a Shh-responsive cell
  model, two blocking Gli1 induction in Shh-mediated BUT NOT SAG-mediated cells - a counter-screen design
  that cleanly separates ligand-level from receptor-level action - with direct binding confirmed by thermal
  shift and docking. ⛔ Their direction is wrong for us; they inhibit hedgehog. ⭐ WHAT IT ESTABLISHES IS THAT
  A GLYCOSAMINOGLYCAN-BINDING INTERFACE ON A HEDGEHOG-PATHWAY PROTEIN IS SCREENABLE AND YIELDS CHEMICAL
  MATTER AT A WORKABLE HIT RATE. HHIP''S OWN TWO GAG SITES HAVE NEVER BEEN SCREENED BY ANYONE.

  ⛔ SIX - AND THE HONEST CONSTRAINT ON THAT ROUTE, WHICH R377 ESTABLISHED THE DAY BEFORE. The intuitive way
  to occupy a GAG site is a soluble sulfated polysaccharide, and that runs backwards: jakobs2019heparin shows
  soluble heparin and heparan sulfate impair Shh processing and release AND block Shh binding to Patched,
  while griffiths2021 shows GAG binding POTENTIATES HHIP and a heparin 30-mer drives HHIP oligomers from
  50 kDa to 6 MDa. Both arms lower hedgehog output. → THE WANTED MOLECULE IS NOT A GAG MIMETIC. It is a
  SMALL, MONOVALENT, NON-BRIDGING anionic ligand that occupies HHIP''s basic patches without providing a
  scaffold on which HHIP can oligomerise - and jakobs2019heparin''s own finding that the suppressive effect
  depends on SIZE and OVERALL CHARGE rather than on specific sulfation is what makes that distinction
  plausible rather than wishful. Nobody has tested a monovalent occupant at these sites.

  ⚠ SEVEN - ONE FURTHER HYPOTHESIS, RECORDED AS GRADE E BECAUSE IT IS FREE TO TEST AND WOULD MATTER.
  HHIP-N is the same CRD fold family as SMOOTHENED, and R375 assembled six systemic sterols that occupy the
  SMO CRD - cholesterol, cortisol, vitamin D3, B-ring oxysterols, side-chain oxysterols, plus the azoles. If
  HHIP''s CRD shares that fold and binds the ligand''s cholesterol, THE SAME STEROLS MAY OCCUPY HHIP''S CRD
  TOO, in which case R375''s sterol layer has a second target with a possibly opposite sign and the net
  effect of any given sterol on hedgehog output at the plate is not yet knowable. ✗ No sterol has ever been
  tested against HHIP; the only measured ligand of the HHIP CRD is PEG-cholesterol at Kd 23 micromolar, and
  the pocket itself is a homology prediction with no ligand found.'
