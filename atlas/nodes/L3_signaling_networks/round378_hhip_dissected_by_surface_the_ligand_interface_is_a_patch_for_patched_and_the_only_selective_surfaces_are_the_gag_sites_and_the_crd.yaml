contradicts:
- claim: R314 and R315 framed the HHIP problem as needing one function-blocking antibody that nobody has
    made, treating the epitope as unspecified.
  resolution: 'The epitope is now specified by exclusion. An antibody at the immunodominant ligand-binding
    face would reproduce 5E1 and INHIBIT the pathway; only the GAG sites and the cysteine-rich domain are
    HHIP-selective. This is a harder ask than R314 implied - a naive immunisation is more likely to give the
    wrong antibody than none - but it is also a more actionable one, because the selection criterion is now
    a functional counter-screen rather than mere binding.'
- claim: R291 concluded from griffiths2021 that the move is to UNCLAMP HHIP from its glycosaminoglycans, and
    the obvious way to do that is a soluble GAG competitor.
  resolution: 'The site nomination survives and the chemistry does not. R377 showed soluble sulfated GAGs
    lower hedgehog at two independent steps, so a heparin-like competitor is a contraindication. The GAG
    sites remain the best HHIP-selective surface, but the occupant must be small, monovalent and incapable of
    bridging two HHIP molecules.'
