human_evidence: indirect
human_evidence_note: 'The structures are of HUMAN HHIP and human SHH, and the GAG-site mutagenesis is on
  human protein in human-relevant cell assays, so the structural partition is a human-protein result. What is
  absent is any human - or indeed any species - test of an HHIP-directed agent. The human evidence that the
  direction is right remains the burden genetics: HHIP pLoF +9.92 cm and the gain-of-function missense
  p.V496E -3.96 cm.'
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: 'The negative half - that the ligand interface is shared with Patched - is a strong
  structural result and travels well. The positive half is a specification for molecules that do not exist,
  resting on a GAG-site mutant phenotype and on a homology-predicted pocket with no ligand, and no HHIP-
  directed agent has been made in any species.'
confidence: B
claim_grades:
- claim: HHIP binds the hedgehog ligand at the same surface Patched uses
  grade: B
  basis: co-crystal structure plus peptide-binding studies plus the independent 5E1 co-crystal whose epitope
    largely overlaps and which blocks Patched binding
- claim: competitively blocking the HHIP-ligand interface would also block the receptor
  grade: C
  basis: follows from the shared surface and is demonstrated in the 5E1 direction, but no molecule has been
    made that displaces HHIP specifically, so the degree of separability is untested
- claim: the GAG sites and the cysteine-rich domain are the only HHIP-selective surfaces
  grade: C
  basis: a structural inference from the published domain map; other selective epitopes could exist and
    nobody has mapped HHIP's surface exhaustively for function
- claim: an anti-HHIP antibody must avoid the L2 loop face
  grade: C
  basis: derived from the 5E1 result rather than tested with an anti-HHIP antibody, because none exists
- claim: the wanted GAG-site agent is monovalent and non-bridging rather than a GAG mimetic
  grade: E
  basis: a chemical inference from the fact that polymeric GAGs potentiate HHIP by oligomerisation while the
    suppressive effect on the ligand tracks size and charge; no monovalent occupant has ever been tested
- claim: sterols may occupy the HHIP cysteine-rich domain as they do Smoothened's
  grade: E
  basis: fold-family homology plus one measured ligand (PEG-cholesterol, Kd 23 micromolar); no sterol has
    been tested against HHIP
