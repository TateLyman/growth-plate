id: round307_the_camp_axis_is_a_band_and_raising_it_opposes_the_erdafitinib_arm
name: >-
  ROUND 307 - the full mechanistic map of cAMP in the growth plate, built to decide which node to drug. The
  answer is not the one the last two rounds were heading toward. cAMP SHORTENS BONE IN BOTH DIRECTIONS - the
  fifth band in this file - and the overshoot arm has a NAMED PATHWAY with a rescue experiment. Worse for
  this case specifically: raising cAMP raises CREB, and erdafitinib works by LOWERING CREB, so a cAMP-raiser
  partially opposes an arm already in the stack
aliases:
- round 307
- the cAMP band
- Jansen metaphyseal chondrodysplasia is the overshoot arm
- PKA-SIK3-HDAC4 blocks discharge
- raising cAMP raises CREB and opposes erdafitinib
- which cAMP node to drug
type: pathway
layer: L3
stub: false
summary: >-
  ZERO - THE QUESTION. Rounds 305 and 306 established that reduced cAMP/PKA signalling causes short stature in
  a named human disease family and that the tissue carries the whole apparatus, and were heading toward "PDE4
  inhibition is the lead". This round built the mechanism map that decision requires, and the map does not
  support the decision as stated.

  ONE - THE OVERSHOOT ARM EXISTS, IT IS HUMAN, AND THE ATLAS HELD THE PAPER WITHOUT RECORDING WHAT IT FOUND.
  **JANSEN'S METAPHYSEAL CHONDRODYSPLASIA IS CONSTITUTIVELY ACTIVE PTH1R - ligand-independent Gs/cAMP
  signalling - AND PATIENTS HAVE SHORT STATURE.** hppner2025 has been in this bibliography with cited_by = 4
  and a one-line finding that says only "mouse model ... for investigating disease mechanism and candidate
  therapeutics." Its actual content is decisive:
  · T410R-hPTH1R mice: long bones **MARKEDLY MISSHAPEN**, expanded metaphyses, **DISARRAYED CHONDROCYTE
  ZONES**, reduced primary spongiosa, and diminished growth-plate [18F]-fluoride uptake indicating reduced
  mineralisation and vascularisation.
  · ⭐ **GENETIC ABLATION OF Hdac4 RESCUED THE GROWTH PLATE ABNORMALITIES**, which establishes
  **PTH1R–Gαs–cAMP–PKA–SIK3–HDAC4/5 as the main mediator**. That is not an association; it is an epistasis
  experiment naming the arm.
  → SO THE cAMP AXIS SHORTENS IN BOTH DIRECTIONS. Too little (iPPSD: GNAS loss, PRKAR1A gain, PDE4D gain,
  PDE3A gain) gives short stature with brachydactyly and ADVANCED bone age. Too much (Jansen's) gives short
  stature with disarrayed zones and FAILED mineralisation. **THIS IS THE FIFTH BAND IN THIS FILE**, after
  hedgehog, oestrogen receptors, DNA methylation and canonical Wnt, and CLAUDE.md's own pattern section
  predicts exactly this.

  TWO - AND THE OVERSHOOT MECHANISM IS FAILURE MODE 1 WITH A PATHWAY ATTACHED. PKA phosphorylates and
  inhibits SIK3; unrestrained, that leaves HDAC4/5 free to repress MEF2C; MEF2C drives hypertrophy; so
  excess cAMP BLOCKS HYPERTROPHIC DISCHARGE. The plate fills with chondrocytes that cannot complete
  differentiation - charge without discharge, the atlas's oldest and most expensive error, here with a named
  mediator and a rescue. It also explains the Jansen histology directly: disarrayed zones and reduced
  mineralisation are what a discharge block looks like.
  ⚠ AND IT INVERTS ROUND 298'S HDAC READING RATHER THAN CONFIRMING IT. Round 298 flagged HDAC INHIBITORS as a
  contraindication, reasoning that HDAC4 represses MEF2C so de-repressing MEF2C would accelerate hypertrophy
  and spend the period. hppner2025 shows the same axis from the other end: in a state of EXCESS cAMP,
  REMOVING Hdac4 is CORRECTIVE. Both can be true - it is a band - but the round-298 inference was one-sided
  and should not be cited as if HDAC4 loss were simply harmful.

  THREE - THE SECOND OVERSHOOT ARM, AND IT IS THE ONE THAT MATTERS FOR THIS STACK. horike2026 - already in
  this atlas as the basis of round 265 - shows that in Fgfr3-Ach mice the resting zone EXPANDS while its
  turnover and stem-cell-like behaviour are DISRUPTED, that **CREB is the mediator and it is
  ERK-INDEPENDENT**, and that the CREB inhibitor 666-15 partially rescues plate structure and BONE LENGTH.
  That is CORR-292's JAM signature: expanded resting zone with SHORT bones.
  ⛔ **cAMP → PKA → CREB. SO RAISING cAMP RAISES CREB - AND ERDAFITINIB WORKS BY LOWERING IT.** Round 265's
  whole finding is that discharge is CREB, downstream of FGFR3 and ERK-independent, and that erdafitinib is
  the only agent in this stack that reaches it. A cAMP-raising agent therefore pushes the exact node the
  stack's lead drug is there to suppress. **THIS IS A STEP-0 CONFLICT AND I MISSED IT FOR TWO ROUNDS** while
  checking Step 0 against CNP, FGFR3/ERK, GH and oestrogen - CREB is downstream of FGFR3 and I checked the
  receptor, not the node.
  ⚠ THE CONFLICT IS PARTIAL, NOT TOTAL, AND THE ASYMMETRY MATTERS. CLAUDE.md already records that 666-15 was
  **NULL IN WILD-TYPE** - it corrects pathology rather than elevating a normal plate. So at wild-type CREB
  levels, LOWERING CREB does nothing while RAISING it moves toward the achondroplasia-like jam. That is an
  asymmetric band: no upside on this arm, real downside. For a subject who is WILD-TYPE at FGFR3 and taking a
  drug whose mechanism is CREB suppression, adding a CREB-raiser is the wrong direction twice.

  FOUR - SO WHAT SURVIVES, AND IT IS NARROWER THAN ROUND 306 IMPLIED.
  ✓ **THE LOSS DIRECTION IS STILL SOLID.** Four human genes, one nosology, all shortening on reduced cAMP.
  Nothing in this round touches that.
  ✓ **AND THE BAND'S PEAK IS PROBABLY SLIGHTLY ABOVE WILD TYPE**, which is the only reason the axis remains
  live at all. PDE3B HETEROZYGOUS loss - a partial, lifelong, modest elevation of cAMP - is **+1.22 cm at
  P=5.1e-13 in 1,761 people**, and mouse Pde3b-null tibia is +4.597. A partial nudge upward helps; full
  constitutive activation is catastrophic. Same shape as R281's canonical-Wnt band and R300's acromelic band.
  ✗ **THE MAGNITUDE IS SMALL AND SHOULD BE SAID PLAINLY: the human evidence for the beneficial direction is
  +1.22 cm for losing one copy of a phosphodiesterase for a whole lifetime.** That is the scale on offer, not
  a transformation, and it is bounded above by the jam.
  ✗ **AND NO AGENT ON THIS AXIS HAS A BONE-LENGTH ENDPOINT IN ANY SPECIES** - which under the operator's R302
  rule is a gap, not a disqualifier, but it means the window's width is unmeasured in exactly the way R303
  found for tankyrase.

  FIVE - WHICH NODE TO DRUG, IF ANY. The map makes the ranking mechanical rather than rhetorical.
  · ⛔ **PTH1R - RULED OUT TWICE OVER.** Only strongly expressed Gs receptor in the tissue, but agonism gives
  Jansen's at the extreme and teriparatide gave 0.0% terminal femoral length; its human burden sign is
  discordant. Dead.
  · ⛔ **ANY AGENT THAT RAISES cAMP GLOBALLY AND STRONGLY** - forskolin, colforsin, high-dose non-selective
  PDE inhibition - is aimed straight at the Jansen arm and the CREB arm simultaneously. The mechanism map
  says these are the WORST choices, not the most direct ones.
  · ⚠ **PDE4 INHIBITION (roflumilast, apremilast)** - still the best expression-plus-genetics combination
  (PDE4A is the best-expressed cAMP PDE in the plate; PDE4D gain of function is a human growth-plate
  dysplasia with metaphyseal cupping). But it raises cAMP in the same compartment as everything else, so it
  inherits both overshoot arms in proportion to how far it pushes.
  · ⚠ **PDE3 INHIBITION (cilostazol)** - best human burden genetics and the largest mouse length effect, and
  hirota2022 excludes PDE3 from CNP's chain so it is not redundant with vosoritide. Same overshoot exposure,
  plus a boxed warning.
  · ⭐ **THE MAP'S OWN ANSWER IS DOWNSTREAM AND OPPOSITE: the damaging arm is PKA→SIK3→HDAC4/5, and Hdac4
  ABLATION was the rescue.** That points at HDAC4/5 rather than at cAMP itself - and in the direction of
  INHIBITING HDAC4, not raising cAMP. This is unexplored here and is the single most interesting thing the
  map produced. ✗ It also collides with round 298's contraindication on HDAC inhibitors, which is now shown
  to be one-sided. Nobody has given an HDAC4-selective agent with a bone-length endpoint, and the marketed
  HDAC inhibitors (givinostat, panobinostat) are pan-class and reach far more than HDAC4.
  · **NET: the cAMP axis is real, human-proven in the loss direction, present in the tissue, and NOT a good
  place to push hard. If it is used at all it must be a small partial elevation, and for THIS subject it
  carries a specific conflict with the erdafitinib arm that no other candidate has.**
human_evidence: direct
human_evidence_note: >-
  Both ends of the band are human clinical genetics. The loss end is the iPPSD family - GNAS, PRKAR1A, PDE4D,
  PDE3A - all short stature with brachydactyly. The gain end is Jansen's metaphyseal chondrodysplasia, human
  activating PTH1R mutations with short stature, modelled in hppner2025's T410R mouse where the Hdac4 rescue
  was performed. The CREB arm is mouse (horike2026, Fgfr3-Ach knock-in) but bears directly on a human drug
  mechanism the stack depends on. The burden effects are human. No agent on this axis has a bone-length
  endpoint in any species.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  Both ends of this band are severe germline syndromes with wide systemic features, so reading a therapeutic
  window from the space between them is inference. The Hdac4 rescue is genetic ablation in a mutant
  background, which is CORR-203's restoration-versus-elevation problem - it shows Hdac4 is required for the
  Jansen phenotype, not that removing HDAC4 elevates a normal plate. The CREB conflict with erdafitinib is a
  pathway-level inference: nobody has measured what a PDE inhibitor does to CREB activity in a growth plate,
  in any species. And the band's width is unmeasured, so "a small partial elevation" has no defined size.
confidence: B
confidence_reason: >-
  The two anchors are strong and independent - a human disease at each end of the axis, with an epistasis
  rescue naming the overshoot pathway - and both papers were already in this bibliography. The Step-0
  conflict with erdafitinib follows from findings the atlas already holds (round 265) rather than from
  anything new, which is why it should have been caught earlier. Graded B rather than A because the width and
  peak of the band are unmeasured and because the HDAC4 suggestion is a single genetic rescue in a mutant.
claim_grades:
- claim: >-
    Raising cAMP is a straightforward way to lengthen bone.
  grade: X
  basis: >-
    NO - THE AXIS SHORTENS IN BOTH DIRECTIONS AND THIS IS THE FIFTH SUCH BAND IN THIS FILE. The loss end is
    the iPPSD family (GNAS loss, PRKAR1A gain, PDE4D gain, PDE3A gain), all short stature with brachydactyly
    and advanced bone age. THE GAIN END IS JANSEN'S METAPHYSEAL CHONDRODYSPLASIA - constitutively active
    PTH1R giving ligand-independent Gs/cAMP - and those patients are SHORT, with markedly misshapen long
    bones, expanded metaphyses, DISARRAYED CHONDROCYTE ZONES, reduced primary spongiosa and diminished
    growth-plate fluoride uptake. The mediator is named by epistasis: ablating Hdac4 RESCUED the growth plate,
    establishing PTH1R-Gas-cAMP-PKA-SIK3-HDAC4/5. Mechanistically the overshoot is a discharge block - PKA
    inhibits SIK3, HDAC4/5 repress MEF2C, hypertrophy fails - which is failure mode 1 with a pathway attached.
  species: human
  source_ref: hppner2025
- claim: >-
    A cAMP-raising agent is additive with this stack.
  grade: X
  basis: >-
    NO, AND THIS IS A STEP-0 CONFLICT I MISSED FOR TWO ROUNDS. cAMP acts through PKA on CREB. horike2026 -
    the paper round 265 is built on - shows that CREB disrupts the stem-cell-like behaviour of resting zone
    chondrocytes, produces an expanded resting zone with SHORT bones (CORR-292's jam signature), is
    ERK-INDEPENDENT, and that the CREB inhibitor 666-15 partially rescues plate structure and BONE LENGTH.
    Erdafitinib's contribution to this stack is precisely that it reaches and lowers CREB. A cAMP-raiser
    pushes the node the stack's lead drug exists to suppress. The conflict is partial rather than total, and
    the asymmetry makes it worse rather than better: 666-15 is NULL IN WILD-TYPE, so at normal CREB levels
    lowering it does nothing while raising it moves toward the achondroplasia-like jam. No upside on that arm,
    real downside. I checked Step 0 against the FGFR3 receptor and not against its downstream node.
  species: mouse
  source_ref: horike2026
- claim: >-
    The beneficial direction on this axis is nevertheless real, and small.
  grade: A
  basis: >-
    UNTOUCHED BY THIS ROUND AND WORTH STATING PRECISELY. Losing ONE COPY of PDE3B - a partial, lifelong,
    modest elevation of cAMP - is +1.22 cm at P=5.1e-13 across 1,761 heterozygotes, and mouse Pde3b-null
    tibia is +4.597 at P=9e-07. GNAS at -9.36 cm and ADCY6 at -2.70 cm anchor the other side. So the band's
    peak sits slightly ABOVE wild type and a partial nudge upward helps - the same shape as R281's
    canonical-Wnt band and R300's acromelic band. THE SCALE ON OFFER IS ABOUT A CENTIMETRE FOR A LIFETIME OF
    heterozygous loss, bounded above by the Jansen jam, and no agent on this axis has a bone-length endpoint
    in any species.
  species: human
  source_ref: kosmicki2026
- claim: >-
    HDAC4 inhibition, not cAMP elevation, is what the mechanism map actually points at.
  grade: E
  basis: >-
    THE MOST INTERESTING THING THIS ROUND PRODUCED AND THE LEAST SUPPORTED. hppner2025's rescue is genetic
    ablation of Hdac4 correcting the growth plate in a PTH1R-activated mutant, which places HDAC4/5 as the
    effector of the damaging arm. That points at inhibiting HDAC4 rather than at raising cAMP - the opposite
    end of the same pathway. THREE THINGS ARE AGAINST IT. It is CORR-203's restoration-versus-elevation
    problem: the rescue shows Hdac4 is REQUIRED for the Jansen phenotype, not that removing it elevates a
    normal plate. It collides with round 298's contraindication on HDAC inhibitors, which this round shows
    was one-sided but does not overturn. And no HDAC4-selective agent has a bone-length endpoint in any
    species, while the marketed HDAC inhibitors - givinostat, panobinostat - are pan-class and reach far more
    than HDAC4.
  species: mouse
  source_ref: hppner2025
