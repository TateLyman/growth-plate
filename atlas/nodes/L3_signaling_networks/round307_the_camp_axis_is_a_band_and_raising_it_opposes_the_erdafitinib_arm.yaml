open_questions:
- g_l12_does_a_pde3_inhibitor_lengthen_bone_in_a_normal_animal
- g_l3_is_the_pde3_height_effect_local_or_systemic
contradicts: >-
  This round substantially narrows rounds 305 and 306, which were heading toward promoting PDE4 inhibition,
  and it corrects two other things. FIRST, the cAMP axis is a BAND, not a direction: Jansen's metaphyseal
  chondrodysplasia is the human gain-of-function end and those patients are short, with the overshoot arm
  named by an Hdac4 epistasis rescue. SECOND, and specific to this case, raising cAMP raises CREB while
  erdafitinib works by lowering it - a Step-0 conflict that follows from round 265, which the atlas already
  held, and which I failed to check for two rounds because I tested Step 0 against the FGFR3 receptor rather
  than its downstream node. THIRD, round 298's contraindication on HDAC inhibitors is shown to be one-sided:
  in a state of excess cAMP, removing Hdac4 is corrective. None of this touches the loss-direction evidence
  from the iPPSD family, and the beneficial direction remains real at about a centimetre.
