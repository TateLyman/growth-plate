id: wnt5a_ligand
name: WNT5A
type: protein
layer: L3
stub: false
summary: 'WNT5A is the principal non-canonical WNT ligand of the growth plate. In mouse it is expressed in a graded
  fashion across developing limb elements and acts through ROR2 to phosphorylate VANGL2, with the degree of phosphorylation
  reporting position in the gradient (Gao 2011). Functionally, Wnt5a and its paralogue Wnt5b have opposite effects
  on where the proliferative-to-hypertrophic transition occurs: Wnt5a delays and Wnt5b promotes the transition in
  mouse, so they are not interchangeable despite high sequence similarity (Yang 2003). In human, dominant and recessive
  WNT5A mutations cause Robinow syndrome, whose cardinal skeletal feature is mesomelic limb shortening with normal-length
  axial skeleton - a segment-selective growth failure consistent with a positional rather than a rate-limiting role.
  No human growth plate WNT5A protein gradient has been measured.'
localization:
- 'mouse limb mesenchyme, graded: confirmed (gao2011)'
- 'mouse growth plate: reported (yang2003)'
- 'human growth plate: unconfirmed'
