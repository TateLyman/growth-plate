id: raptor_protein
name: RAPTOR (RPTOR)
aliases:
- regulatory-associated protein of mTOR
- RPTOR
type: protein
layer: L3
stub: false
summary: 'RAPTOR is the defining scaffold subunit of mTORC1; it presents TOS-motif substrates such as S6K1 and 4E-BP1
  to the mTOR kinase and is what distinguishes mTORC1 from RICTOR-containing mTORC2. Deleting Raptor in mouse limb
  mesenchyme phenocopies mTor deletion in cartilage - severe reduction of embryonic skeletal growth, delayed chondrocyte
  hypertrophy, smaller chondrocytes and less matrix - and metabolic labelling in Raptor-deficient chondrocytes shows
  the deficit is in the rate of protein synthesis (Chen and Long 2014). Because the mTor-null and Raptor-null cartilage
  phenotypes match, the skeletal growth requirement is attributable to mTORC1 rather than mTORC2. Upstream, RHEB1
  is required for the same axis: Rheb1 loss impairs limb growth through chondrogenesis in mouse (Zhang 2024). No human
  growth plate RAPTOR data exist.'
localization:
- 'mouse limb cartilage: functionally required (chen2014)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No human growth plate RAPTOR measurement or human RPTOR skeletal phenotype.
species_basis:
