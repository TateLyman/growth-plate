id: tsc1_tsc2
name: TSC1-TSC2 complex
aliases:
- tuberous sclerosis complex
- hamartin-tuberin
type: protein
layer: L3
stub: false
summary: 'TSC1-TSC2 is the GTPase-activating complex that holds RHEB in its GDP-bound state and therefore keeps mTORC1
  off; growth-factor signalling through AKT and ERK inactivates it. Chondrocyte-restricted Tsc1 deletion in mouse
  - the constitutive mTORC1-on experiment - gives a zone-specific result: the cranial base synchondroses EXPAND, and
  the expansion is entirely in the resting zone and is due to increased cell number and cell size with no change in
  proliferation rate. Critically, the same study shows that in wild-type mice mTORC1 activity is INHIBITED in resting
  and proliferating zone chondrocytes, and that Tsc1 deletion switches it on there; the resulting resting-zone cells
  acquire prehypertrophic characteristics (large size, high PTH1R and IHH), and rapamycin rescues the phenotype (Hsieh
  2021, mouse). This makes TSC1-TSC2 the enforcer of the low-mTORC1 state that defines the resting zone, and identifies
  mTORC1 activation as one of the events that converts a resting chondrocyte into a prehypertrophic one. The converse
  loss-of-mTORC1 experiments (Raptor/mTor deletion) reduce chondrocyte size and matrix output (Chen and Long 2014).
  Human TSC1/TSC2 loss of function causes tuberous sclerosis complex with sclerotic bone lesions but no characteristic
  stature phenotype, and no human growth plate has been assayed for mTORC1 activity by zone.'
localization:
- 'mouse RZ and PZ: mTORC1 activity normally low, i.e. TSC1-TSC2 active (hsieh2021)'
- 'mouse synchondrosis RZ: Tsc1 deletion activates mTORC1 and expands the zone (hsieh2021)'
- 'human growth plate: zonal mTORC1 activity unmeasured'
human_evidence: indirect
human_evidence_note: Human TSC1/TSC2 loss causes tuberous sclerosis complex without an established growth plate phenotype;
  no physeal measurement exists.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: The decisive experiment is in mouse cranial base synchondroses, not a long-bone physis, and
  human TSC patients have no described growth plate phenotype.
