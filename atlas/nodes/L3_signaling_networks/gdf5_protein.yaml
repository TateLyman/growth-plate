type: protein
layer: L3
stub: false
summary: 'GDF5 is a BMP-family ligand expressed at prospective joint interzones. Loss of function in mouse (brachypodism,
  bp) shortens and fuses limb segments and reduces digit number, and the bp locus was identified as Gdf5 by positional
  cloning (Storm 1994). The human orthologue produces the mirror phenotype: GDF5/CDMP1 mutations cause Grebe- and
  Hunter-Thompson-type acromesomelic chondrodysplasia with severe limb shortening (Thomas 1996), so this is one of
  the few BMP-arm nodes with direct human loss-of-function evidence. GDF5 is also a common-variant height locus: the
  GDF5-UQCC region carries SNPs associated with adult stature in general-population GWAS (Sanna 2008), which places
  the ligand on the normal-variation axis and not only in dysplasia. Guo 2009 proposes Gdf5/BMP signalling as a downstream,
  non-cell-autonomous effector of Wnt/beta-catenin control of hypertrophy in mouse, linking this node to the WNT subsystem.'
