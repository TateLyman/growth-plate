id: tgfb_signaling_chondrocyte
name: TGF-beta signalling in chondrocytes
type: pathway
layer: L3
stub: false
summary: 'TGF-beta1/2/3 signal through TGFBR2-TGFBR1 to SMAD2/3 and, non-canonically, to TAK1-p38. In the growth plate
  the canonical arm restrains terminal differentiation: blocking it either at the receptor (dominant-negative TGFBR2,
  Serra 1997) or at the effector (Smad3-null, Yang 2001) accelerates hypertrophy and causes premature cartilage degeneration
  in mouse. This is the opposite sign to the BMP-SMAD1/5/8 arm, which promotes proliferation and, through beta-catenin/BMP2,
  maturation. Human evidence is indirect but unusually informative because it is dose-signed in both directions: gain-of-function
  TGFB1 mutations that release the latent complex cause Camurati-Engelmann disease with diaphyseal hyperostosis and
  limb pain (Kinoshita 2000), while LTBP3 loss of function - which impairs storage and presentation of latent TGF-beta
  - causes brachyolmia with short stature (Huckert 2015). The physiological ligand concentration seen by a human growth
  plate chondrocyte has never been measured.'
localization:
- 'mouse PHZ/HZ: inferred (yang2001, serra1997)'
- 'human growth plate: unconfirmed'
human_evidence: indirect
human_evidence_note: Human TGFB1 gain-of-function (Camurati-Engelmann) and LTBP3 loss-of-function (brachyolmia) phenotypes
  bracket the pathway in both directions, but neither is a growth-plate measurement.
species_basis:
