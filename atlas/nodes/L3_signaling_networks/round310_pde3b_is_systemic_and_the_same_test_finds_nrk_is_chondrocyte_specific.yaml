id: round310_pde3b_is_systemic_and_the_same_test_finds_nrk_is_chondrocyte_specific
name: >-
  ROUND 310 - the local-or-systemic question is DECIDED, by two independent tests, and the answer closes the
  cAMP axis for this case. PDE3B's PheWAS is dominated by LIPIDS at P=2e-60, forty orders of magnitude beyond
  its height signal, and at single-cell resolution PDE3B is 3.7-fold DEPLETED in chondrocytes relative to the
  other cells of the same tissue. The same test, run as its own control, finds NRK 83-fold chondrocyte-
  ENRICHED - the cleanest growth-plate-specific target in the atlas
aliases:
- round 310
- PDE3B is systemic not local
- the cAMP axis is closed for this case
- NRK is 83-fold chondrocyte enriched
- cell-type resolved expression in human growth plate
type: hypothesis
layer: L3
stub: false
summary: >-
  ZERO - THE QUESTION, WHICH HAS BEEN OPEN SINCE ROUND 305. PDE3B carries the strongest cross-species
  evidence on the cAMP axis - human pLoF +1.22 cm at P=5.1e-13 in 1,761 heterozygotes, and mouse Pde3b-null
  tibia +4.597 at P=9e-07, the largest lengthening effect among 7,216 genes with a length endpoint. But its
  best-known biology is adipocyte and hepatic insulin signalling, and round 309 made the worry explicit: the
  effect might be beneficial BECAUSE it is systemic, in which case five rounds of local-target reasoning are
  the wrong frame for this gene. Two tests were available without running an experiment, both on disk.

  ONE - TEST ONE, THE PheWAS, AND IT IS NOT CLOSE. kosmicki2026 Supplementary Table 27 gives every trait
  associated with each burden gene. PDE3B has 27, and ranked by P the top of the list is not skeletal:
  · **Triglycerides -0.333, P = 2.15e-60**
  · **HDL cholesterol +0.301, P = 9.73e-56**
  · **Apolipoprotein A +0.215, P = 1.87e-27**
  · then sitting height +0.136 at P = 5.29e-21, hip circumference +0.193 at 5.76e-21, reticulocyte counts,
  leg fat-free mass, ApoB, weight, basal metabolic rate, trunk fat mass, forced vital capacity, whole-body
  water, white cell and monocyte counts, and self-reported high cholesterol.
  ⛔ **THE LIPID SIGNAL IS ROUGHLY FORTY ORDERS OF MAGNITUDE MORE SIGNIFICANT THAN THE HEIGHT SIGNAL.** This
  is a lipid gene with a height association, not a height gene with metabolic side effects. The classic
  favourable-lipid quartet - triglycerides down, HDL up, ApoA up, ApoB down - is exactly what an adipocyte
  phosphodiesterase does.
  ⭐ AND THE ROUTE IS VISIBLE IN THE SAME TABLE: **IGF-1 +0.122, P = 1.18e-09.** PDE3B loss RAISES circulating
  IGF-1. That is a systemic endocrine mechanism for a height effect, and it does not require the enzyme to be
  in a chondrocyte at all.
  ⚠ THE COMPARATOR MAKES THE POINT SHARPER. In the same table ACAN - the purest cartilage gene in the set -
  has 18 trait associations. PDE3B has 27 and its top three are lipids. PDE3B does not behave like a
  skeletal gene.

  TWO - TEST TWO, THE DIRECT ONE, AT SINGLE-CELL RESOLUTION. Using GSE288028 (round 308), cells in 8 samples
  were split into CHONDROCYTES - at least 3 of COL2A1, ACAN, COL9A1, COL11A1, COL9A2, HAPLN1, SOX9 detected -
  and NON-CHONDROCYTES, with no marker detected, both filtered to at least 500 counts. 33,359 chondrocytes
  against 3,909 non-chondrocytes from the same tissue, so the comparison is internally controlled for donor,
  dissociation and sequencing.
  ⛔ **PDE3B IS DETECTED IN 11.50% OF CHONDROCYTES AND 42.44% OF NON-CHONDROCYTES - 0.27x, A NEARLY FOURFOLD
  DEPLETION IN THE CELL TYPE THAT MAKES BONE LENGTH.** Whatever PDE3B is doing in this tissue, it is doing it
  mostly outside the chondrocyte.
  ✓ AND THE TEST VALIDATES ITSELF, WHICH IS WHY I TRUST IT. Run on the same cells: **NRK 46.99% of
  chondrocytes against 0.56% of non-chondrocytes - 83.5-FOLD ENRICHED**; LOXL2 61.53% against 4.50% -
  13.7-fold; ADCY6 9.33% against 1.97% - 4.7-fold; GNAS 88.10% against 58.05% - 1.5-fold, appropriately
  near-universal. PDE4B 0.68x, PDE4D 0.60x, PDE8A 0.88x, SIK3 0.68x, TNKS 1.05x - even or slightly depleted.
  A method that puts NRK at 83x and LOXL2 at 13.7x is discriminating properly, and it puts PDE3B at 0.27x.

  THREE - THE DECISION, AND IT CLOSES THE AXIS FOR THIS CASE. **PDE3B'S HEIGHT EFFECT IS SYSTEMIC.** Two
  independent tests agree: the phenotype profile is metabolic by forty orders of magnitude, and the enzyme is
  depleted from chondrocytes in the target tissue. Round 309 left PDE3 as the only direction still standing
  on the cAMP axis; this round establishes that its mechanism is not the one the last five rounds assumed.
  ⛔ **AND STEP 0 THEN FAILS, WHICH IS THE DECISIVE POINT FOR THIS SUBJECT.** The systemic route runs at
  least partly through IGF-1 (+0.122 SD). This stack already contains growth hormone, and CLAUDE.md prices GH
  after mid-puberty at approximately ZERO attained height with SOCS2 as the mechanism. So a PDE3 inhibitor
  would push a channel that is already occupied AND already spent in this subject. That is CORR-297's
  substitution trap in its purest form - the same error that demoted LUM-201 and eliminated sacubitril.
  → **CILOSTAZOL AND THE PDE3 ARM ARE NOT AN ADDITION TO THIS STACK.** Not because the biology is wrong -
  the human and mouse genetics remain the strongest on the axis and would matter for a different subject -
  but because the mechanism is systemic-endocrine and lands on an arm already saturated here.
  → **AND WITH PDE4 WITHDRAWN IN ROUND 309 AND PDE3 NOW SYSTEMIC, THE cAMP AXIS IS CLOSED FOR THIS CASE.**
  The loss-direction human genetics stand; the axis is real; there is no usable entry point for this subject.

  FOUR - AND THE SAME TEST HANDED BACK SOMETHING BETTER THAN WHAT IT KILLED. **NRK IS 83.5-FOLD ENRICHED IN
  CHONDROCYTES - 46.99% of chondrocytes against 0.56% of every other cell in the same tissue.** That is the
  most chondrocyte-specific result in this dataset by a wide margin, and NRK is the gene round 283 named as
  its lead. What it now has: human pLoF **+2.79 cm at P=1.0e-20** (and +3.79 cm on the singleton test), no
  OMIM syndrome, expression at 76 CPM in up to 81% of cells (round 308), presence in every compartment of
  both GSE9160 donors (round 292), mouse growth-plate baseMean above FGFR3, mouse perichondrium at
  183-301 CPM - and now near-exclusive chondrocyte localisation in postnatal human tissue.
  ✗ WHAT IT STILL LACKS IS EVERYTHING PHARMACOLOGICAL: no perturbation of NRK in any species, no inhibitor,
  no length endpoint, and the therapeutic direction is INHIBITION since pLoF lengthens - which for a kinase
  is at least the most drugged fold there is. It is X-linked, and CORR-317's within-donor rule applies to any
  cross-donor comparison. This round does not promote it; it records that the cleanest localisation result in
  the atlas belongs to a gene with no chemical matter.
human_evidence: direct
human_evidence_note: >-
  Both tests are human. The PheWAS is human burden genetics across UK Biobank traits from kosmicki2026
  Supplementary Table 27. The cell-type test is postnatal human growth plate single-cell RNA-seq, 33,359
  chondrocytes against 3,909 non-chondrocytes drawn from the same 8 samples, so donor, dissociation and
  platform are internally controlled. No animal data are used for the decision; the mouse Pde3b length
  endpoint is the finding being interpreted, not evidence for the interpretation.
species_basis:
- human
translation_risk: low
translation_risk_reason: >-
  Low for the negative conclusion, which is what this round is for. Two independent human tests agree and the
  cell-type test carries its own positive controls at 83x and 13.7x. The residual uncertainties do not
  threaten the direction: transcript is not protein, so a lowly-transcribed PDE could still matter locally if
  its protein were long-lived or highly compartmentalised; the non-chondrocyte pool is heterogeneous and not
  typed further here; and 3,909 non-chondrocytes is a small comparator drawn mostly from three samples. None
  of these would convert a 0.27-fold depletion plus a 40-orders-of-magnitude lipid dominance into a local
  mechanism.
confidence: A
confidence_reason: >-
  Graded A for the systemic conclusion. Two independent human datasets, one phenotypic and one at single-cell
  resolution, agree; the cell-type test validates itself with internal positive controls spanning 83-fold to
  0.27-fold; and the PheWAS margin is not marginal - forty orders of magnitude is not a judgement call. The
  NRK enrichment is graded A as a localisation result and carries no therapeutic grade at all.
