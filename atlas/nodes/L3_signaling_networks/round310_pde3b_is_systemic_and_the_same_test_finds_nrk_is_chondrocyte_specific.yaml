contradicts: >-
  This round closes a question the atlas has carried since round 305 and, with round 309, closes the cAMP
  axis for this case. PDE3B's height effect is SYSTEMIC - decided by a PheWAS in which lipids dominate by
  forty orders of magnitude and by a 0.27-fold chondrocyte depletion at single-cell resolution - so the
  local-target framing that drove rounds 304 to 308 was the wrong frame for this gene, exactly as round 309
  warned it might be. Step 0 then fails on the systemic route, because it runs through IGF-1 into an arm this
  stack already contains and already prices at zero. Round 304's claim that PDE3B is the top lengthening
  knockout is untouched - it is still true, and still the largest such effect among 7,216 genes. What changes
  is what it means.
