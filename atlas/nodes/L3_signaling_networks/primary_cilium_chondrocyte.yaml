id: primary_cilium_chondrocyte
name: Primary cilium of the growth plate chondrocyte
aliases:
- chondrocyte primary cilium
type: tissue_structure
layer: L3
stub: false
summary: 'Growth plate chondrocytes carry a single non-motile primary cilium that acts as the compartment in which
  Hedgehog signal transduction occurs: PTCH1 leaves and SMO enters the ciliary membrane on ligand binding, and GLI
  processing depends on intraflagellar transport along the axoneme. Removing the cilium genetically therefore removes
  IHH responsiveness without removing IHH. Ift88 deletion in limb mesenchyme shortens the proximodistal axis and disrupts
  endochondral bone formation through loss of Ihh signalling, in addition to polydactyly from disturbed SHH patterning
  (Haycraft 2007, mouse). Cartilage Kif3a deletion abolishes the normal zonal organisation by postnatal day 7 - proliferative
  and hypertrophic zones are replaced by cells with strong Col2a1 but almost no Ihh, Col10a1, Vegfa, Mmp13 or Sp7
  - while hedgehog signalling paradoxically INCREASES and spreads in the adjacent perichondrium, producing ectopic
  cartilage and excessive intramembranous ossification (Koyama 2007, mouse). The cilium''s importance is thus topological:
  it does not merely amplify Hedgehog, it confines it. Human evidence is the ciliopathy skeletal dysplasias (Jeune,
  Ellis-van Creveld, short-rib polydactyly), which are among the strongest human anchors in this layer.'
localization:
- 'mouse growth plate, all zones: cilia present and required (haycraft2007, koyama2007)'
- 'human growth plate: inferred from ciliopathy dysplasias; direct ultrastructural zonal survey not identified'
human_evidence: indirect
human_evidence_note: Human ciliopathy genes (IFT80, EVC, EVC2) cause defined chondrodysplasias, but no human growth
  plate cilium morphometry was located.
species_basis:
- mouse
- human
translation_risk: moderate
translation_risk_reason: Mechanism is mouse; human evidence is germline ciliopathy phenotypes without physeal tissue
  analysis.
confidence: B
