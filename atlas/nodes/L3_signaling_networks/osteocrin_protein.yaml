id: osteocrin_protein
name: Osteocrin / Musclin (OSTN)
type: protein
layer: L3
aliases:
- osteocrin
- musclin
- OSTN
stub: false
summary: 'OSTEOCRIN IS THE TOP-RANKED ADDITION TO THIS STACK AND UNTIL ROUND 211 IT HAD NO NODE. It is a
  secreted peptide, originally found independently in bone (as osteocrin) and skeletal muscle (as musclin),
  which binds NPR-C specifically and with high affinity and COMPETES WITH THE NATRIURETIC PEPTIDES FOR THAT
  BINDING while having no natriuretic activity of its own. Its mechanism is therefore LIGAND ELEVATION - by
  occupying the clearance receptor it raises the local and circulating concentration of ANP, BNP and CNP,
  which then act through the guanylyl cyclase receptors NPR-A and NPR-B.

  THE SKELETAL CASE. kanai2017 - mice with raised circulating OSTN show dose-dependent skeletal overgrowth;
  the overgrowth is abolished in either CNP-depleted or NPR-C-depleted backgrounds, so both are
  indispensable; and CNP x OSTN DOUBLE TRANSGENICS GAIN ADDITIONAL BONE LENGTH OVER ELEVATED CNP ALONE.
  That is the only demonstrated additivity on bone length for any pair of agents in this atlas.

  THE PHARMACOLOGICAL CLASSIFICATION, WHICH IS NEW AS OF ROUND 211 AND OVERTURNS AN ATLAS ASSUMPTION.
  Osteocrin is a Gi-SILENT OCCUPIER, not a Gi agonist. In HeLa cells expressing functional human NPR-C it
  does not affect basal forskolin-stimulated cAMP at 100 nM, and it REVERSES the cAMP fall produced by the
  NPR-C agonist cANF(4-23) exactly as the antagonist M372049 does. In rat aorta and mouse small mesenteric
  artery it BLOCKS cANF(4-23)-induced vasorelaxation. smith2022 uses it, throughout, as an antagonist tool
  compound. So on the Gi readout osteocrin belongs with M372049 and nishizawa2017 compound 23, not opposite
  them.

  THE CARDIOVASCULAR RECORD IS NEVERTHELESS FAVOURABLE, BECAUSE THE LIGAND-RAISING ARM DOES NOT NEED Gi.
  szaroszyk2022 - skeletal-muscle Ostn knockout exaggerates and Ostn overexpression ATTENUATES cardiac
  dysfunction and myocardial fibrosis under pressure overload, via raised CNP abundance acting through PKA
  and PKG; OSTN is also reduced in skeletal muscle of human heart failure patients. harris2023 - Ostn
  disruption ABOLISHES exercise-induced cardioprotection with blunted cGMP and reduced nuclear PKGI.
  saw2025 - exogenous musclin potentiates natriuretic peptide signalling in skeletal muscle in HFpEF mice.
  scott2024 - incremental intravenous ovine proOSTN in conscious sheep raises plasma ANP, BNP and CNP with
  cGMP and lowers arterial and central venous pressure, with plasma cAMP, renin and aldosterone unchanged
  and no natriuresis. NOT ONE OF THESE MEASURED AN AORTIC DIMENSION, which is the endpoint aubdool2025 and
  boudin2018 put at risk.

  TWO THINGS AGAINST IT. schn2026 gives the first continuous human serum reference values and the LMS
  median rises only 1.31-fold from birth to 18 years while height velocity falls by roughly an order of
  magnitude, so the endogenous ligand does not track growth rate and any dosing is ELEVATION rather than
  restoration. And jin2023 shows it binds a SECOND receptor, transferrin receptor 1, antagonising
  Tfr1-mediated cAMP/PKA thermogenesis in beige fat.'
localization:
- 'bone and skeletal muscle: the two independent discovery tissues'
- 'circulation: measurable in human serum from infancy by ELISA, median about 4 to 5 ng/ml across childhood
  (schn2026)'
- 'receptors: NPR-C, specifically and with high affinity, competing with the natriuretic peptides; and
  transferrin receptor 1 in beige adipose (jin2023)'
- 'growth plate cartilage: NO measurement of local osteocrin concentration in any species'
human_evidence: indirect
human_evidence_note: 'Humans have measurable circulating osteocrin with an established paediatric and adult
  reference range, and OSTN expression is reduced in the skeletal muscle of heart failure patients. The
  target NPR3 has a monotonic human height allele-dose series. But osteocrin has never been administered to
  a human for any indication, and no human growth endpoint exists.'
species_basis:
- human
- mouse
- ovine
translation_risk: high
translation_risk_reason: 'Every skeletal result is transgenic overexpression in mice rather than dosed
  pharmacology, the only large-animal work is a short haemodynamic infusion in sheep, and the peptide has a
  second receptor with a metabolic phenotype.'
confidence: C
claim_grades:
- claim: osteocrin binds NPR-C specifically and competes with the natriuretic peptides
  grade: B
  basis: established binding work cited consistently across the natriuretic peptide literature and used as
    the basis for its use as a tool antagonist
- claim: raising osteocrin adds bone length on top of an already-raised CNP axis
  grade: C
  basis: one double-transgenic experiment with both single-gene controls; genetic overexpression rather
    than dosing, no pharmacological replication
- claim: osteocrin engages the NPR-C Gi arm
  grade: X
  basis: FALSE at the one concentration tested. It is silent on forskolin-stimulated cAMP and blocks
    agonists that are not
- claim: osteocrin is cardioprotective in vivo
  grade: C
  basis: three independent mouse models in one direction plus a matching human muscle expression
    observation; no aortic dimension measured in any of them
- claim: endogenous osteocrin tracks human growth velocity
  grade: X
  basis: FALSE. The LMS median rises 1.31-fold birth to 18 years while height velocity falls about tenfold
- claim: osteocrin has been given to a human
  grade: X
  basis: FALSE. No human administration for any indication
key_refs:
- ref_id: kanai2017
  year: 2017
  type: primary
  role: THE SKELETAL CASE AND THE ONLY DEMONSTRATED ADDITIVITY IN THIS ATLAS - dose-dependent overgrowth
    requiring both CNP and NPR-C, and CNP x OSTN double transgenics gaining bone length over CNP alone
- ref_id: smith2022
  year: 2022
  type: primary
  role: THE PHARMACOLOGICAL CLASSIFICATION - osteocrin used as an antagonist tool compound, silent on human
    NPR-C cAMP at 100 nM and blocking cANF(4-23) in cells and in two vessel preparations
- ref_id: scott2024
  year: 2024
  type: primary
  role: the only large-animal pharmacology - incremental IV proOSTN in conscious sheep raises ANP, BNP, CNP
    and cGMP and lowers pressures, with plasma cAMP unchanged
- ref_id: szaroszyk2022
  year: 2022
  type: primary
  role: cardioprotection by raising CNP abundance, with muscle-specific loss and gain of function in both
    directions and a matching human heart failure observation
- ref_id: harris2023
  year: 2023
  type: primary
  role: Ostn disruption abolishes exercise-induced cardioprotection, second independent model
- ref_id: saw2025
  year: 2025
  type: primary
  role: exogenous musclin potentiates natriuretic peptide signalling in skeletal muscle, third model
- ref_id: schn2026
  year: 2026
  type: primary
  role: THE HUMAN CONCENTRATION ANCHOR - first continuous LMS serum reference percentiles in 399 children
    and 502 adults
- ref_id: jin2023
  year: 2023
  type: primary
  role: THE SECOND RECEPTOR - musclin binds Tfr1 and antagonises Tfr1-mediated cAMP/PKA thermogenesis in
    beige fat
