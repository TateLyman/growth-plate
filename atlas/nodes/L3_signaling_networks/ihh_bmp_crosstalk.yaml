id: ihh_bmp_crosstalk
name: IHH-BMP crosstalk
type: process
layer: L3
stub: false
summary: 'BMP and Indian hedgehog signalling in the growth plate are interdependent but not serial. In mouse limb
  explants, BMP2 beads raise Ihh expression, and Ihh signalling raises Bmp2/Bmp4 expression in the perichondrium,
  so each arm can amplify the other. The decisive experiment is that BMP2 still increases chondrocyte proliferation
  when Ihh signalling is blocked (and Ihh still acts when BMP signalling is blocked with Noggin), which places them
  as parallel proliferative inputs converging on the same columnar chondrocytes rather than as one linear cascade
  (Minina 2001, mouse). The two arms differ in what they control: Ihh/PTHrP sets the position of the hypertrophy boundary
  through the negative feedback loop, whereas BMP raises proliferation rate and delays hypertrophy largely independently
  of PTHrP. Minina 2002 adds the third input, showing FGF opposes BMP on both readouts in the same system. All of
  this is mouse explant work; there is no human tissue equivalent.'
localization:
- 'mouse PZ/PHZ and perichondrium: confirmed in limb explant culture (minina2001, minina2002)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: Crosstalk has never been tested in human tissue; no human explant or organoid experiment addresses
  it.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Bead-implant explant pharmacology in embryonic mouse limbs; dose and diffusion are non-physiological.
confidence: C
