id: bmp7_ligand
name: BMP7
aliases:
- bone morphogenetic protein 7
- OP-1
type: protein
layer: L3
stub: false
summary: 'BMP7 is expressed in mouse perichondrium and, unlike BMP2/BMP4, is individually dispensable for limb skeletal
  element formation: Bmp7-null limb buds pattern and ossify essentially normally, and removing Bmp7 on top of Bmp2/Bmp4
  loss does not add a distinguishable limb phenotype (Bandyopadhyay 2006, mouse). Its non-redundant role appears postnatally
  and in articular rather than growth plate cartilage: conditional elimination of Bmp7 from limb mesenchyme leaves
  the growth plate grossly intact but leads to articular cartilage degeneration with age (Abula 2015, mouse). BMP7
  is therefore a weak candidate as a growth-plate rate-setting ligand and is included here to close the ligand inventory
  and to mark the articular-versus-physeal divergence explicitly.'
localization:
- 'mouse PERI: confirmed by in situ hybridisation (bandyopadhyay2006)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No human growth plate data; recombinant BMP7 clinical use was in spinal fusion, not physiological
  growth.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Mouse-only genetics; the phenotype is articular, and articular and physeal chondrocytes are
  not interchangeable.
confidence: C
