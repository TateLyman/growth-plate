paralog_audit_note: >-
  Re-read in the paralog audit; the SUPERSEDED verdict of CORR-003 stands and no further paralog exposure was
  found on this node. Recorded for completeness: the upstream cGMP source is now also under an unexcluded-relative
  question (NPR1/ANP, zhou2024, g_para_001), so the chain CNP-NPR2-cGMP-PKG-II has an untested alternative at the
  receptor step as well as at the kinase step.
