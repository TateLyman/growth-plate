id: pkg2_kinase
name: PKG-II
aliases:
- PRKG2
- cGMP-dependent protein kinase II
- cGKII
type: protein
layer: L3
stub: false
summary: |
  PKG-II is the membrane-anchored cGMP-dependent protein kinase that carries the CNP signal in
  chondrocytes. Prkg2-null mice and the naturally mutant KMI rat are dwarfed with an expanded, arrested
  hypertrophic zone: PKG-II acts as the switch from proliferation to hypertrophic differentiation,
  mechanistically by blocking nuclear entry of SOX9 (Chikuda 2004) and by phosphorylating GSK-3beta at
  Ser9 (Kawasaki 2008). Its zonal distribution is the best current explanation for why the CNP/NPR2
  effect lands on the hypertrophic zone: NPR2 transcript is reported at similar levels in all three
  zones whereas PKG-I and PKG-II are expressed at much higher levels in hypertrophic cells (Agoston
  2007). Human biallelic PRKG2 loss-of-function variants cause an acromesomelic dysplasia
  phenotypically overlapping the NPR2 form (Diaz-Gonzalez 2022), which is the strongest available
  evidence that the NPR2 to PKG-II wiring is conserved in humans; nonsense PRKG2 alleles also cause
  disproportionate dwarfism in dogs.
localization:
- 'mouse HZ: PKG-I and PKG-II transcript much higher than in PZ or RZ, confirmed by zonal microarray (agoston2007)'
- 'human growth plate: zonal PKG-II protein map unconfirmed'
human_evidence: indirect
human_evidence_note: Biallelic human PRKG2 loss-of-function causes acromesomelic dysplasia, but no human
  growth plate tissue has been examined for PKG-II.
species_basis:
- mouse
- rat
- human
translation_risk: moderate
translation_risk_reason: Mechanism is rodent; the human evidence is a matching monogenic skeletal dysplasia
  without tissue-level confirmation.
confidence: B
