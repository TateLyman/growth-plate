human_evidence: absent
human_evidence_note: >-
  Mouse knock-in and mouse pharmacology. The human relevance is that the genotype modelled is the
  achondroplasia mutation, so the discharge failure is the mechanism of a human disease - but no human has
  received a CREB inhibitor for growth.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: >-
  The discharge agent is rescue-only in the one species and condition tested, and the inference that
  erdafitinib reaches the same arm rests on erdafitinib being upstream of a branch point defined in a
  disease model.
confidence: C
confidence_reason: >-
  horike2026 itself is a strong paper and its findings are graded B below. The stack inference - that
  erdafitinib uniquely reaches the discharge arm - is C, because it is a topological argument from where
  each agent binds rather than a measurement of erdafitinib on resting-zone turnover, which nobody has made.
claim_grades:
- claim: >-
    Excess FGFR3 causes short bones by blocking discharge - the resting pool fills and does not empty.
  grade: B
  basis: >-
    horike2026 - expanded resting zone by histology, disrupted turnover by EdU and lineage tracing, a
    matching scRNA-seq cluster, and pharmacological reversal in the same direction by a CREB inhibitor.
- claim: >-
    Erdafitinib is the only agent in the revised stack that reaches the discharge arm.
  grade: C
  basis: >-
    Topological. CREB is ERK-independent (horike2026); erdafitinib inhibits the receptor kinase and is
    upstream of both arms; vosoritide acts at RAF-1 inside the ERK arm; GH and anastrozole are not on this
    pathway. NOT a measurement - nobody has measured resting-zone turnover under an FGFR3 inhibitor in any
    animal.
- claim: Vosoritide is redundant with erdafitinib and should be dropped.
  grade: X
  basis: >-
    THREE INDEPENDENT ROUTES NOW SAY NO AND THEY AGREE. Trpm7 ablation abolishes CNP-driven growth
    (miyazaki2022); CNP has a cAMP/PKA arm acting predominantly in HYPERTROPHIC chondrocytes whose
    blockade by H89 abolishes CNP-driven plate lengthening (hirota2022); and the CREB arm of FGFR3 is one
    vosoritide cannot reach. They overlap only in the cGMP/PKG2/RAF-1 half. Dropping vosoritide surrenders
    h_term, whose only other agent is cilostazol - the same node as vosoritide and colliding with
    erdafitinib on CYP3A4.
- claim: A CREB inhibitor is a usable discharge agent for this subject.
  grade: X
  basis: >-
    NO. 666-15 changed neither weight nor femur length nor resting-zone CD73 in control mice and the authors
    state it is not effective in a physiological condition. Rescue of pathological FGFR3 tone is not
    elevation above normal - CORR-203.
- claim: Driving cells out of the resting zone is what discharge means.
  grade: X
  basis: >-
    NO, AND THIS IS THE TRAP. Forced beta-catenin activation drives resting cells out of the zone and into
    terminal differentiation with shorter bones; lithium does the same with oxidative DNA damage; hedgehog
    activation drives osteogenic conversion (orikasa2024); Jansen accumulates cells that die. Exit into a
    COLUMN is the thing worth having, and 666-15 is the only agent in this file that moved cells out of the
    resting zone while simultaneously raising proliferative AND hypertrophic zone heights.
