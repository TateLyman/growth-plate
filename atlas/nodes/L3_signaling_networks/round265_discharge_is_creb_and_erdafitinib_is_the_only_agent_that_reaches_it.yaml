id: round265_discharge_is_creb_and_erdafitinib_is_the_only_agent_that_reaches_it
name: >-
  ROUND 265 - DISCHARGE HAS A NAME AND THE STACK ALREADY CONTAINS THE ONLY AGENT THAT REACHES IT. Excess
  FGFR3 blocks resting-zone turnover through CREB, INDEPENDENTLY OF ERK - so erdafitinib, which blocks the
  kinase, reaches the discharge arm, and vosoritide, which acts at RAF-1, cannot. That assigns erdafitinib
  to the term round 264 found empty and settles the redundancy question a third independent way
aliases:
- round 265
- discharge is CREB
- horike2026
- 666-15
- the ERK-independent arm
type: process
layer: L3
stub: false
summary: >-
  ASKED TO CHASE DISCHARGE UNTIL IT CAN BE INTERVENED ON, AND TO FIND ONE THAT SYNERGISES WITH VOSORITIDE,
  ERDAFITINIB, GROWTH HORMONE AND ANASTROZOLE. The answer is that the stack already contains it and the
  atlas held the paper without drawing the consequence.

  ONE - DISCHARGE IS A REAL, NAMED, MEASURED FAILURE MODE AND IT IS THE MECHANISM OF A HUMAN DISEASE.
  horike2026 built the Fgfr3-Ach G380R knock-in mouse and found something the achondroplasia literature had
  not: AN EXPANDED RESTING ZONE. EdU labelling, lineage tracing and single-cell RNA-seq show DISRUPTION OF
  TURNOVER AND IMPAIRMENT OF STEM-CELL-LIKE BEHAVIOUR of resting zone chondrocytes, so cells ACCUMULATE
  there. An expanded pool with short bones. THAT IS CHARGE WITHOUT DISCHARGE, and round 264 catalogued five
  independent instances of it in this file; here it is not a failed experiment but the pathophysiology of
  achondroplasia itself.
  THE MEDIATOR IS CREB AND - THE SENTENCE THAT MATTERS MOST - IT IS INDEPENDENT OF THE ERK PATHWAY.
  Pathway analysis and functional experiments put CREB as the effector that disrupts stem-cell-like
  properties in resting zone chondrocytes and contributes to dwarfism. The CREB inhibitor 666-15 at 10
  mg/kg from P7 to P27 partially rescued weight, bone growth, plate structure, COL2 and COL10 area and
  resting-zone CD73, DECREASING resting zone height while INCREASING proliferative and hypertrophic zone
  heights. THAT DIRECTION IS DISCHARGE MEASURED DIRECTLY: the pool empties and the columns fill.

  TWO - AND THE ERK-INDEPENDENCE IS WHAT CONNECTS IT TO THE STACK, WHICH THIS ATLAS HAD NOT DONE.
  FGFR3 signals down at least two arms. The ERK/MAPK arm runs through RAF-1 and is where both approved
  CNP-analogue labels place their mechanism. The CREB arm is separate and horike2026 states it explicitly.
  ERDAFITINIB INHIBITS THE RECEPTOR KINASE, SO IT SITS UPSTREAM OF BOTH ARMS AND REACHES CREB.
  VOSORITIDE ACTS AT RAF-1, INSIDE THE ERK ARM, AND CANNOT REACH CREB. Growth hormone and anastrozole are
  not on this pathway at all. SO THE ONLY AGENT IN THE REVISED STACK THAT TOUCHES THE DISCHARGE TERM IS
  ERDAFITINIB, and it touches it for a reason nobody in this file had stated.
  THAT ALSO FIXES ROUND 264'S BOOKKEEPING HOLE FOR THE LEAD AGENT. Erdafitinib was one of thirty-two
  intervention nodes with no term assignment. It now has one: it is the stack's amplification agent through
  ERK AND its discharge agent through CREB, which is why dropping it was never on the table and why the
  redundancy question kept resolving in its favour.

  THREE - AND IT SETTLES THE VOSORITIDE QUESTION A THIRD INDEPENDENT WAY, ALL THREE AGREEING.
  ROUTE ONE, round 263: miyazaki2022's Trpm7 ablation abolishes CNP-driven bone growth, so CNP is not
  merely a RAF-1 inhibitor.
  ROUTE TWO, held in this atlas since round 94 and which I re-derived instead of reading -
  is_the_cnp_arm_redundant_with_fgfr3_blockade shows on hirota2022's dual-FRET biosensors that CNP
  activates cAMP/PKA as well as cGMP, PREDOMINANTLY IN HYPERTROPHIC CHONDROCYTES, and that the PKA
  inhibitor H89 BLOCKS CNP-driven plate lengthening - a necessity test. CNP has two arms; arm one
  (cGMP/PKG2/RAF-1) overlaps with FGFR3 blockade and arm two (cAMP/PKA, hypertrophic zone) does not.
  ROUTE THREE, this round: the arm of FGFR3 that erdafitinib uniquely covers is CREB, which vosoritide
  cannot reach.
  THE THREE ROUTES CONVERGE ON A PARTITION RATHER THAN ON A WINNER. Erdafitinib holds ERK and CREB -
  amplification and discharge. Vosoritide holds the cAMP/PKA arm on hypertrophic-zone elongation - h_term,
  which round 86's coverage audit and round 264's recount both name as among the worst-covered terms. THEY
  OVERLAP ONLY IN THE cGMP/PKG2/RAF-1 half of the CNP axis. DROPPING VOSORITIDE WOULD SURRENDER h_term
  ENTIRELY, because the only other agent on it is cilostazol, which round 263 showed is the same node as
  vosoritide and which collides with erdafitinib on CYP3A4.

  FOUR - THE HARD LIMIT, STATED FIRST RATHER THAN LAST. 666-15 IS RESCUE-ONLY WHERE IT HAS BEEN TESTED. In
  control mice it changed NEITHER WEIGHT NOR FEMUR LENGTH NOR RESTING-ZONE CD73, and the authors state it
  is not effective in a physiological condition. So the named discharge agent does nothing to a normal
  animal, which is the CORR-203 distinction and it is fatal to 666-15 as a stand-alone addition for a
  subject with normal FGFR3.
  WHAT THAT DOES NOT SETTLE, AND IT IS THE LIVE QUESTION. The Ach mouse has PATHOLOGICALLY HIGH FGFR3 tone
  and 666-15 removes a pathological CREB signal. A normal subject has NORMAL tone. The question is whether
  pushing FGFR3 BELOW normal - which is what erdafitinib does, and what 666-15 does not do because it acts
  downstream on only one arm - accelerates resting-zone turnover beyond the physiological rate. horike2026
  cannot answer that because it never lowered FGFR3 below wild-type; it only removed the excess. NOBODY HAS
  MEASURED RESTING-ZONE TURNOVER IN A WILD-TYPE ANIMAL UNDER AN FGFR3 INHIBITOR. That is the experiment,
  and it is the same shape as every other unrun experiment in this file - a normal animal, a length
  endpoint, and the resting-zone counts that separate discharge from depletion.

  FIVE - AND THE WARNING THAT COMES WITH WANTING DISCHARGE AT ALL. Discharge without amplification is
  depletion. resting_zone_niche records that FORCED BETA-CATENIN ACTIVATION DRIVES RESTING CELLS OUT OF THE
  ZONE - that is discharge, and it is the wrong kind, because beta-catenin gain-of-function drives terminal
  differentiation and shorter bones, and GSK3 inhibition by lithium does the same with oxidative DNA damage
  attached. The same node records that BOTH Smoothened AGONISM AND ANTAGONISM REDUCE the number of columns
  formed from labelled resting cells, which is a direct problem for the hedgehog-withdrawal discharge
  hypothesis of round 251 and which this atlas has not reconciled. THE THING WORTH HAVING IS NOT EXIT FROM
  THE RESTING ZONE. IT IS EXIT INTO A COLUMN. Every failed discharge in this file exits the wrong way -
  osteogenic conversion under hedgehog (orikasa2024), terminal differentiation under beta-catenin,
  accumulation and death under Jansen. horike2026's 666-15 is the only agent that moved cells out of the
  resting zone AND into taller proliferative and hypertrophic zones simultaneously, which is the signature
  of exit into a column, and it did it only in a disease model.
quantitative:
- parameter: >-
    THE DISCHARGE FAILURE, MEASURED - AN EXPANDED RESTING ZONE WITH SHORT BONES, AND ITS PHARMACOLOGICAL
    REVERSAL
  value: >-
    Fgfr3-Ach knock-in expands the resting zone with disrupted turnover and impaired stem-cell-like
    behaviour; CREB inhibitor 666-15 at 10 mg/kg P7-P27 partially rescued weight, bone growth, plate
    structure, COL2 and COL10 area and resting-zone CD73, DECREASING resting zone height while INCREASING
    proliferative and hypertrophic zone heights. IN CONTROL MICE it changed NEITHER weight NOR femur length
    NOR resting-zone CD73
  unit: zone heights, femur length, body weight
  conditions: >-
    horike2026, Nature Communications. Fgfr3-Ach G380R knock-in mouse, EdU labelling, lineage tracing,
    single-cell RNA-seq identifying a cluster corresponding to the expanded resting zone, pathway analysis
    and functional experiments placing CREB as mediator INDEPENDENTLY OF THE ERK PATHWAY.
  species: mouse
  source_ref: horike2026
  uncertainty: >-
    RESCUE OF A DISEASE MODEL, AND EXPLICITLY NULL IN WILD TYPE - the authors state 666-15 is not effective
    in a physiological condition, so the named discharge agent does nothing to a normal animal. Zone heights
    are the primary readout and CORR-189 limits what they can carry, though here they move in OPPOSITE
    directions (resting down, proliferative and hypertrophic up) alongside a femur length change, which is a
    stronger pattern than any single zone height. The ERK-independence of the CREB arm is the load-bearing
    claim for this node and it rests on this paper's pathway analysis alone.
localization:
- 'resting zone chondrocytes: where FGFR3 excess blocks turnover through CREB'
