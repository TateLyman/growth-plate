paralog_risk: >-
  GSK3A and GSK3B are functionally redundant in chondrocytes via RelA Thr-254, independently of
  Wnt/beta-catenin (itoh2012), and the cartilage-specific Gsk3b SINGLE knockout is phenotypically
  normal with compensatory GSK3A upregulation (bali2021). The only positive chondrocyte evidence
  is LiCl, which does not distinguish the two isoforms at any concentration and for which no
  isoform-selective probe exists. See g_para_008.
