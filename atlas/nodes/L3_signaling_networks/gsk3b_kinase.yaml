id: gsk3b_kinase
name: GSK3B
aliases:
- glycogen synthase kinase 3 beta
- GSK-3beta
type: protein
layer: L3
stub: false
summary: 'GSK3B is the destruction-complex kinase that phosphorylates beta-catenin on the N-terminal degron and targets
  it for beta-TrCP-mediated degradation; WNT-receptor engagement inhibits this activity and lets beta-catenin accumulate.
  In chondrocytes, pharmacological GSK3 inhibition with lithium chloride raises beta-catenin and drives terminal differentiation
  markers together with oxidative DNA damage and matrix remodelling in human OA chondrocytes in vitro (Guidotti 2015),
  which is a chemical-genetics mirror of the beta-catenin gain-of-function mouse phenotype. GSK3B is not chondrocyte-specific
  and sits downstream of many inputs, so any perturbation of it is a blunt instrument: it also regulates glycogen
  metabolism, mTOR-adjacent signalling and microtubule dynamics in the same cell. LiCl is also non-selective in a
  second, sharper sense: it does not distinguish GSK3B from its paralogue GSK3A at any concentration, and no
  ATP-competitive GSK3 inhibitor with meaningful GSK3A/B selectivity exists. The genetics say the distinction matters.
  A chondrocyte-restricted Gsk3b conditional knockout HAS been reported and is phenotypically NORMAL except for
  elevated GSK3A protein - the paralogue upregulates to compensate - whereas the tamoxifen-inducible
  cartilage-specific Gsk3a/Gsk3b DOUBLE knockout causes precocious growth plate remodelling with loss of cellular and
  proteoglycan components, decreased SOX9, increased osteoclast recruitment and apoptosis, shorter long bones and
  growth retardation (Bali 2021, mouse). Gsk3a-null alone and Gsk3b-heterozygous alone are likewise near-normal while
  the compound is dwarfed, and the redundant chondrocyte function runs through RelA Thr-254 phosphorylation
  INDEPENDENTLY of Wnt/beta-catenin (Itoh 2012, mouse). No chondrocyte phenotype is therefore assignable to GSK3B
  specifically: selective genetic removal of GSK3B does nothing, and non-selective chemical removal of both does
  something. No human growth plate GSK3B measurement exists (g_para_008).'
