- ref_id: itoh2012
  pmid: '22761446'
  first_author: Itoh S
  year: 2012
  type: primary
  one_line_finding: >-
    GSK-3alpha and GSK-3beta act with functional redundancy in early chondrocyte differentiation via
    RelA Thr-254 phosphorylation, INDEPENDENTLY of Wnt/beta-catenin. Gsk3a(-/-) alone or Gsk3b(+/-)
    alone does not significantly affect skeletal development; the compound Gsk3a(-/-);Gsk3b(+/-) causes
    dwarfism with impaired chondrocyte differentiation.
