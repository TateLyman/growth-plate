summary: 'ZFP521 is a zinc-finger transcriptional coregulator that PTHrP induces in prehypertrophic chondrocytes and
  that executes part of the PTHrP anti-hypertrophy programme. Chondrocyte-targeted Zfp521 deletion in mouse phenocopies
  PTHrP-null and chondrocyte PTH1R-null animals: reduced proliferation, early hypertrophic transition and a thinner
  growth plate. Mechanistically ZFP521 associates with RUNX2 and antagonises it by an HDAC4-dependent mechanism; without
  ZFP521, Runx2 and its target genes rise while cyclin D1 and BCL2 fall and caspase-3 activation and apoptosis increase,
  and PTHrP can no longer upregulate cyclin D1 or suppress Runx2, Ihh and Col10a1 (Correa 2010, mouse). ZFP521 therefore
  sits in the same RUNX2-restraining module as HDAC4 and provides an independent route by which PTHrP holds the hypertrophy
  switch off. No human ZNF521 skeletal phenotype has been established and there is no human growth plate measurement.'
