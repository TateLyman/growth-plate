type: protein
layer: L3
stub: false
summary: 'Chordin is a secreted BMP antagonist that shares substrate ligands with Noggin. In mouse, Chrd-null animals
  have craniofacial and pharyngeal defects; the appendicular skeleton is comparatively spared until Noggin is also
  removed, at which point mandibular and skeletal morphogenesis fails, demonstrating redundancy between the two antagonists
  (Stottmann 2001). There is no established human CHRD skeletal dysplasia and no report of zonal CHRD protein or transcript
  distribution in human growth plate. Chordin is therefore included as an inventory node with an explicit negative:
  within the growth plate proper, Noggin dominates the published antagonist evidence and Chordin''s physeal role is
  assumed rather than demonstrated.'
localization:
- 'mouse craniofacial mesenchyme: confirmed (stottmann2001)'
- 'mouse growth plate: unconfirmed'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No human CHRD skeletal phenotype and no human growth plate expression data.
