summary: 'RUNX2 is the transcription factor that licenses chondrocyte hypertrophy and osteoblast differentiation.
  Human heterozygous RUNX2/CBFA1 loss of function causes cleidocranial dysplasia with clavicular hypoplasia, delayed
  fontanelle closure, supernumerary teeth and short stature (Mundlos 1997), giving this node direct human dose evidence.
  In mouse, chondrocyte maturation is delayed in Runx2-null animals but still occurs; only Runx2;Runx3 double nulls
  show a complete absence of maturation, and limb length falls in proportion to the combined Runx2 and Runx3 gene
  dose (Yoshida 2004). The same study shows RUNX2 binds the Ihh promoter directly and induces Ihh, so RUNX2 sits upstream
  of the IHH/PTHrP loop as well as downstream of it - a feedback the linear textbook cascade omits. RUNX2 activity
  is restrained post-translationally rather than only transcriptionally: HDAC4 binds and inhibits RUNX2 (Vega 2004),
  ZFP521 antagonises RUNX2 through an HDAC4-dependent mechanism downstream of PTHrP (Correa 2010), and SOX9 keeps
  Runx2 expression in check (Dy 2012).'
