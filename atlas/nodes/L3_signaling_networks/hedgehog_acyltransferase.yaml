id: hedgehog_acyltransferase
name: HHAT
aliases:
- Hedgehog acyltransferase
- Skinny hedgehog
type: protein
layer: L3
stub: false
summary: 'HHAT is the membrane-bound O-acyltransferase that attaches palmitate to the N-terminus of Hedgehog

  ligands including IHH; palmitoylation is required for full signalling potency and for correct

  ligand release and range. Unpalmitoylated Hedgehog is secreted but signals weakly, so HHAT sets the

  effective amplitude of the Ihh arm of the growth plate loop. Human biallelic HHAT variants cause

  Nivelon-Nivelon-Mabille syndrome, a multiple congenital anomaly syndrome including skeletal dysplasia

  and short stature (Ari 2025), and HHAT variants also cause 46,XY differences of sex development,

  consistent with a shared requirement for Hedgehog lipidation across tissues. No study has measured

  Ihh palmitoylation stoichiometry or HHAT expression by zone in growth plate cartilage of any species.

  '
localization:
- 'human: HHAT loss produces skeletal dysplasia, tissue-level growth plate localization unconfirmed'
- 'mouse growth plate: unconfirmed'
human_evidence: indirect
human_evidence_note: Biallelic HHAT loss-of-function causes a human syndrome with skeletal dysplasia,
  but no growth plate tissue analysis has been reported.
species_basis:
- human
translation_risk: moderate
translation_risk_reason: Human genetic evidence exists but the growth plate mechanism is inferred from
  general Hedgehog lipidation biology, not measured in cartilage.
