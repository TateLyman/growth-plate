id: smad1_5_8
name: SMAD1/5/8 (BMP-responsive R-SMADs)
aliases:
- SMAD1
- SMAD5
- SMAD9
- SMAD8
- BMP R-SMADs
type: protein
layer: L3
stub: false
summary: 'SMAD1, SMAD5 and SMAD9(SMAD8) are the receptor-regulated SMADs phosphorylated by BMPR1A/BMPR1B; phospho-SMAD1/5/8
  partners SMAD4 and enters the nucleus. Chondrocyte-restricted removal of Smad1 and Smad5 together in mouse produces
  severe chondrodysplasia with disorganised proliferative columns and impaired hypertrophy, while Smad1 or Smad5 single
  mutants and Smad8-null mice are near-normal - the requirement is for combined dose, not for a particular paralogue
  (Retting 2009). SMAD1/5/8 is also the convergence point for the antagonist layer: Noggin, Chordin and SMAD7 all
  act by lowering pSMAD1/5/8 output. SMAD7 inhibits chondrocyte differentiation at several steps in mouse, including
  by interfering with BMP-SMAD signalling (Iwai 2008). In mouse the zonal activity profile has been measured: pSMAD1/5/8
  immunostaining is highest in the proliferative and prehypertrophic zones and lower in the hypertrophic zone despite
  Bmp2/Bmp6 mRNA being highest there, an inversion attributed to hypertrophic-zone SMAD7 (Garrison 2017). No equivalent
  series has been published on human growth plate tissue, so the human activity gradient across RZ-PZ-PHZ-HZ is unmeasured.'
localization:
- 'mouse PZ/PHZ: pSmad1/5/8 highest by immunohistochemistry (garrison2017)'
- 'mouse HZ: pSmad1/5/8 lower despite high ligand mRNA; Smad7 high (garrison2017)'
- 'human growth plate: unconfirmed - no published zonal pSMAD1/5/8 staining'
human_evidence: absent
human_evidence_note: No human growth plate pSMAD1/5/8 measurement; human evidence for the BMP arm is confined to ligand/antagonist
  genetics.
