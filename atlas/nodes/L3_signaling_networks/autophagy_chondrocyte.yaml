id: autophagy_chondrocyte
name: Autophagy in growth plate chondrocytes
type: process
layer: L3
stub: false
summary: 'Autophagy is the lysosomal recycling pathway that maintains cells under nutrient and oxygen restriction
  - exactly the condition of the avascular mid-plate. Cartilage-specific deletion of Atg5 or Atg7 in mouse (Col2a1-Cre)
  causes growth retardation with increased chondrocyte death and reduced proliferation, and the effect is mild rather
  than catastrophic, i.e. autophagy is a survival buffer rather than an essential differentiation step (Vuppalapati
  2015). The same study provides one of the few pieces of direct human evidence in this layer: pharmacological autophagy
  inhibition with bafilomycin A1 or 3-methyladenine promoted cell death in cultured slices of HUMAN growth plate tissue,
  and impaired growth of mouse metatarsal explants with caspase-3 and caspase-9 processing and cytochrome c release.
  Upstream, autophagic flux in chondrocytes is set by matrix sulfation state and FGF signalling: proteoglycan desulfation
  in the diastrophic dysplasia sulfate transporter mutant changes autophagy efficiency and FGF signalling extent during
  endochondral ossification (Settembre 2008, mouse). Autophagy is not constitutive across the plate: immunohistochemistry
  localises the autophagic phenotype to the postmitotic maturing zone, making it a transient stage of the maturation
  programme rather than a background housekeeping state, and pharmacological/siRNA work places its induction under
  mTOR and AMPK control in a HIF-1-dependent manner (Srinivas 2009, mouse and chondrocytic cells). The genetic test
  of the mTORC1-autophagy link in growth plate chondrocytes in vivo has still not been done.'
localization:
- 'mouse maturing/postmitotic zone: autophagic phenotype localised by immunohistochemistry (srinivas2009)'
- 'human growth plate (cultured tissue slices): autophagy inhibition causes chondrocyte death (vuppalapati2015)'
- 'mouse growth plate: Atg5/Atg7 required for chondrocyte survival (vuppalapati2015)'
human_evidence: direct
human_evidence_note: Autophagy inhibitors killed chondrocytes in cultured human growth plate tissue slices - an ex
  vivo human interventional result.
