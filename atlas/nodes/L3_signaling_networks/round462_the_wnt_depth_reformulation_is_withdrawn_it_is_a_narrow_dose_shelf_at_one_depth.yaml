human_evidence: absent
human_evidence_note: No human genetic or pharmacological test of graded canonical-Wnt elevation in cartilage against
  a height endpoint exists. CXXC5 is absent from kosmicki2026 207-gene table, so there is no human population anchor
  in either direction, and the two null length endpoints are mouse and chicken.
translation_risk: high
translation_risk_reason: Mice do not fuse their growth plates as humans do, so a delayed-senescence claim in a mouse
  is a slowed decline rather than a postponed fusion; and the one compound on this axis is a dual CXXC5-DVL disruptor
  and GSK3beta inhibitor, so neither the mouse genetics nor the mouse pharmacology isolates the target.
summary: 'R460 proposed that the canonical-Wnt axis in cartilage is DEPTH-dependent rather than DOSE-dependent - that
  the

  extracellular depth favours LOWERING while the intracellular depth favours RAISING - on the strength of choi2019cxxc5,

  in which disrupting the CXXC5-Dishevelled interaction raises beta-catenin and lengthens the tibia. THAT REFORMULATION
  IS

  WITHDRAWN. It was written without greping the graph, and the atlas already held the correct model in a grade C non-stub

  node, wnt_canonical_chondrocyte.yaml, whose own summary states that the pathway is dose-dependent with opposite

  phenotypes at the two extremes and cites yuasa2009''s postnatal activation causing premature growth plate closure.
  The

  rule broken is CORR-313 and CORR-324 - grep the graph BEFORE DRAFTING - and it was broken in the round immediately
  after

  R459, which is itself about lossy-ledger failures.


  WHY THE DEPTH MODEL FAILS, BOTH HALVES.


  THE INTRACELLULAR RAISING HALF: five perturbations that raise canonical Wnt inside the cartilage cell all shorten or

  destroy the plate, and the two best-designed members are postnatal, inducible, cartilage-restricted and in normal

  animals. bali2021 - tamoxifen-inducible cartilage-specific Gsk3a/Gsk3b DOUBLE knockout - gives precocious growth plate

  remodelling, SHORTER LONG BONES, growth retardation and lethality, and states in the same paper that cartilage-specific

  Gsk3b SINGLE knockout mice are normal except for elevated GSK3A protein. yuasa2009 - Col11a2-CreER inducible stabilised

  beta-catenin in young adult mice - gives growth retardation with PREMATURE GROWTH PLATE CLOSURE. itoh2012 - Gsk3a null

  on a Gsk3b heterozygous background - gives dwarfism. miclea2009 - Col2a1-Cre Apc deletion - is perinatally lethal.

  akiyama2004 - stabilised beta-catenin in Sox9 lineage - gives severe chondrodysplasia. R460''s own compound sits on
  this

  axis: KY19382 inhibits GSK3beta at IC50 1e-8 M against 1.9e-8 M for CXXC5-DVL, so ITS GSK3beta ARM''S GENETIC COMPLETION

  IS bali2021 - shorter bones and death.


  THE EXTRACELLULAR LOWERING HALF ALSO BREAKS: enomotoiwamoto2002 misexpressed the secreted Wnt antagonist Frzb-1 and

  SHORTENED skeletal elements. So lowering outside the cell is not uniformly favourable either, and PORCN inhibitors

  already gave the inverse zone decomposition with plate exhaustion.


  WHAT REPLACES IT IS R281''s BAND, WITH THE PEAK JUST ABOVE WILD TYPE - A NARROW SHELF, REACHED AT ONE DEPTH AS A MONOTONE

  DOSE-RESPONSE. Order the intracellular perturbations by how much they raise pathway output: Cxxc5 null, which removes
  one

  Dishevelled scaffold and whose whole-body knockout has no gross abnormality, gives about +3.8 per cent tibia; Gsk3b

  single conditional knockout gives no effect; Gsk3a/Gsk3b double knockout gives shorter bones and death; Apc conditional

  deletion is perinatally lethal; stabilised beta-catenin closes the plate. THAT IS A DOSE-RESPONSE WITH A NARROW WINDOW

  JUST ABOVE WILD TYPE, NOT A DEPTH EFFECT. It also explains why choi2019cxxc5 works where every stronger agent fails:
  it

  is the mildest available intracellular elevation.


  AND TWO WNT-RAISING AGENTS HAVE BEEN GIVEN TO NORMAL GROWING ANIMALS WITH A CALIPER, AND BOTH ARE NULL ON LENGTH.

  roschger2014: sclerostin antibody to WILD-TYPE mice from 4 weeks for 4 weeks - no effect on weight or FEMUR LENGTH.

  harvey2015: oral LiCl 20 mg/kg/day to growing broilers from 1 to 6 weeks, n=48 per group - NO DIFFERENCES IN BONE LENGTH

  at P at least 0.52, with femoral stiffness DOWN about 22 per cent at P=0.02. Two agents, two species, two independent

  laboratories, both raising canonical Wnt, both measuring length in a normal growing animal, both null - against

  choi2019cxxc5''s single positive. The honest reading is that the window is narrow enough that two blunt agents missed
  it,

  or that the CXXC5 result is carried by something other than Wnt elevation.


  A THIRD OBJECTION SPECIFIC TO THIS SUBJECT: kapadia2005 shows GSK3 inhibition acts on chondrocyte proliferation through

  beta-catenin to FGF18 to FGFR3, and the effect is REPRESSED IN TISSUES LACKING FGFR3. This subject is on a continuous

  pan-FGFR inhibitor, so the GSK3beta arm of KY19382 is predicted to be attenuated in precisely this stack.


  WHAT SURVIVES R460. R301''s rejection of CXXC5 on an inference while a tibial-length endpoint existed was a real

  CORR-309/CORR-320 failure and stands as recorded. CXXC5 remains the only gene reported to blunt oestrogen-induced growth

  plate senescence, and bendre2026 shows that assay is live and reproducible in 2026 - though yan2022 contests the sign,

  reporting E2 acting through ERalpha/beta and DMP1 to RAISE GSK-3beta/beta-catenin signalling and drive chondrocyte

  trans-differentiation, which is the opposite beta-catenin direction to choi2019cxxc5. The magnitude is about +3 per
  cent

  of tibial length in both the genetic and the pharmacological arm, figure-read. And PTD-DBM - the peptide that separates

  CXXC5 disruption from GSK3beta inhibition - is fully specified in lee2015cxxc5 Figure 7A, was dosed at 1 mg/kg

  intraperitoneally daily for two weeks into 7-week-old normal male mice, reached the tibial growth plate by fluorescent

  imaging and raised cells per column - AND NO LENGTH WAS MEASURED. That is CORR-340 on the one tool that would decide
  the

  target. The authors also DECLINED a reviewer''s request for the Cxxc5 null by KY19382 epistasis control, replying that

  KY19382 is expected to act partly independently of CXXC5 through GSK3.'
