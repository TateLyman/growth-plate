id: round462_the_wnt_depth_reformulation_is_withdrawn_it_is_a_narrow_dose_shelf_at_one_depth
name: R462 - the R460 canonical-Wnt DEPTH reformulation is WITHDRAWN. Five intracellular Wnt-raising perturbations shorten
  or close the plate, the extracellular lowering half breaks too, and two Wnt-raising agents dosed into normal growing
  animals with a caliper are both NULL on length - what replaces it is a narrow dose shelf just above wild type
aliases:
- R462
- withdrawal of the Wnt depth model
- canonical Wnt is a narrow dose shelf
- KY19382 GSK3beta arm is bali2021
- Wnt-raising agents are null on length
- CORR-313 failed one round after R459
type: pathway
layer: L3
stub: false
confidence: B
last_verified: '2026-08-27'
species_basis:
- mouse
