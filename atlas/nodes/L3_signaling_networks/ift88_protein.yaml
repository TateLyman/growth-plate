id: ift88_protein
name: IFT88
aliases:
- polaris
- Tg737
- intraflagellar transport 88
type: protein
layer: L3
stub: false
summary: IFT88 is a core IFT-B complex subunit required to build and maintain the ciliary axoneme; null alleles cause
  mid-gestation lethality, so limb function was established with a conditional allele. Disrupting cilia in limb MESENCHYME
  with conditional Ift88 deletion causes extensive polydactyly with loss of anteroposterior digit patterning (aberrant
  SHH pathway activity) and shortening of the proximodistal axis attributable to disrupted IHH signalling during endochondral
  bone formation; deleting cilia in limb ECTODERM has no overt patterning effect, localising the requirement to the
  mesenchymal lineage (Haycraft 2007, mouse). Ift88-mutant limbs also develop ectopic perichondrium-derived chondrocyte-like
  domains that are not seen in Ihh mutants, so cilium loss is not simply equivalent to Hedgehog loss. Human IFT88
  variants have been reported in ciliopathy cohorts but IFT88 is not an established human chondrodysplasia gene, and
  no human growth plate IFT88 measurement exists.
localization:
- 'mouse limb mesenchyme/growth plate: functionally required (haycraft2007)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: IFT88 is not an established human skeletal dysplasia gene; no human growth plate data.
species_basis:
