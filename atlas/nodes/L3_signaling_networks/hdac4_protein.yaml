id: hdac4_protein
name: HDAC4
aliases:
- histone deacetylase 4
- class IIa HDAC
type: protein
layer: L3
stub: false
summary: 'HDAC4 is a class IIa histone deacetylase with negligible intrinsic deacetylase activity that works as a
  signal-responsive corepressor. It is expressed in prehypertrophic chondrocytes and restrains hypertrophy by two
  routes: binding and inhibiting RUNX2 (Vega 2004) and binding and repressing MEF2 (Arnold 2007; Nishimori 2019).
  Hdac4-null mice show ectopic and premature chondrocyte hypertrophy with premature ossification, phenocopying constitutive
  RUNX2 expression, while HDAC4 overexpression in proliferating chondrocytes blocks hypertrophy and phenocopies RUNX2
  loss (Vega 2004, mouse). Its activity is set by SUBCELLULAR LOCALISATION, not by abundance: phosphorylation at 14-3-3-binding
  sites holds it in the cytoplasm (inactive), and dephosphorylation lets it enter the nucleus (active as a repressor).
  PTHrP drives that dephosphorylation via PP2A (Kozhemyakina 2009) and via inhibition of SIK3 (Nishimori 2019, 2021).
  Human HDAC4 haploinsufficiency in 2q37 deletion syndrome causes brachydactyly type E, present in 48% of 103 reported
  individuals, plus developmental delay - direct human evidence that HDAC4 dose sets metacarpal/metatarsal growth
  plate output (Le 2019); a missense HDAC4 variant produces the same syndrome in a family (Takeyari 2023).'
