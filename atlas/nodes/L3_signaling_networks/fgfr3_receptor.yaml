id: fgfr3_receptor
name: FGFR3
aliases:
- fibroblast growth factor receptor 3
type: protein
layer: L3
stub: false
summary: 'FGFR3 is the brake on the growth plate: Fgfr3-null mice show skeletal overgrowth with expanded

  proliferative and hypertrophic zones (Colvin 1996; Deng 1996), and in human embryo-fetal long bones

  FGFR3 is the only one of the three receptors expressed in growth plate chondrocytes, FGFR1 and FGFR2

  being restricted to perichondrium and periosteum (Delezoide 1998). The achondroplasia allele G380R

  sits in the transmembrane domain, and the mechanism is best described as both ligand-independent

  activation and failed termination, with the second component dominant. Naski 1996 and Webster 1996

  showed graded ligand-independent kinase activation with thanatophoric alleles stronger than

  achondroplasia; Monsonego-Ornan 2000 showed that G380R dimerisation and activation are predominantly

  ligand-dependent but that the mutant receptor is selectively resistant to ligand-mediated

  internalisation and down-regulation, producing an expanded FGFR3 immunoreactive domain in transgenic

  mouse growth plate; Cho 2004 identified the defect as disrupted c-Cbl-mediated ubiquitination

  diverting active receptor from lysosome to recycling. Quantitative FRET in plasma membrane vesicles

  resolved the two claims: G380R has no measurable effect on ligand-bound dimer configuration, and its

  one measurable effect is increased unliganded dimerisation propensity (Sarabipour 2016). So G380R is

  a weak constitutive activator whose principal pathogenic contribution is prolonged signalling from

  receptor that is not switched off.

  '
localization:
- 'human fetal growth plate, mature chondrocytes: confirmed by ISH (delezoide1998)'
- 'human thanatophoric dysplasia cartilage: abundant perinuclear FGFR3 immunoreactivity (legeaimallet1998)'
- 'mouse growth plate: FGFR3 immunoreactive domain expanded in G380R transgenics (monsonegoornan2000)'
human_evidence: direct
human_evidence_note: FGFR3 expression and pathology have been examined directly in human fetal growth
  plate and in thanatophoric dysplasia cartilage, and the achondroplasia allele is the commonest human
  skeletal dysplasia mutation.
species_basis:
- human
- mouse
- in_vitro_human_cell
translation_risk: low
translation_risk_reason: The receptor, its expression domain and the pathogenic allele are all documented
  in human tissue; mouse models reproduce the human phenotype.
confidence: A
