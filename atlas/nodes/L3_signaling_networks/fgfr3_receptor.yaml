id: fgfr3_receptor
name: FGFR3
aliases:
- fibroblast growth factor receptor 3
type: protein
layer: L3
stub: false
summary: 'FGFR3 is the brake on the growth plate: Fgfr3-null mice show skeletal overgrowth with
  expanded

  proliferative and hypertrophic zones (Colvin 1996; Deng 1996), and in human embryo-fetal long
  bones

  FGFR3 is the only one of the three receptors expressed in growth plate chondrocytes, FGFR1 and
  FGFR2

  being restricted to perichondrium and periosteum (Delezoide 1998). The achondroplasia allele
  G380R

  sits in the transmembrane domain, and the mechanism is best described as both ligand-independent

  activation and failed termination; which component dominates is NOT settled. Naski 1996 and
  Webster 1996

  showed graded ligand-independent kinase activation with thanatophoric alleles stronger than

  achondroplasia; Monsonego-Ornan 2000 showed that G380R dimerisation and activation are predominantly

  ligand-dependent but that the mutant receptor is selectively resistant to ligand-mediated

  internalisation and down-regulation, producing an expanded FGFR3 immunoreactive domain in transgenic

  mouse growth plate; Cho 2004 attributed the defect to reduced c-Cbl-mediated ubiquitination

  diverting active receptor from lysosome to recycling - but this is contested in SIGN, not merely
  in

  detail: Monsonego-Ornan et al. 2004 report INCREASED ubiquitination of the same mutants, and
  Cho

  2004 names the disparity, attributes it to Cos-7 versus HEK293, steady-state FGF2 versus pulsed

  FGF9 and retroviral versus transient expression, and states it cannot exclude the alternative

  (g_l2d_003). c-Cbl also does not bind FGFR3 directly: recruitment is via FRS2alpha and Grb2,
  and

  FRS2alpha binds FGFR1 far more strongly than FGFR3, so the recruitment step for this receptor
  is

  weakly established. Quantitative FRET adjudicates the DIMERISATION question only: G380R does
  not

  change ligand-bound dimer configuration and increases unliganded dimerisation propensity by

  -1.8 kcal/mol (Sarabipour 2016). That experiment cannot speak to the down-regulation model,
  because

  the construct is FGFR3 extracellular + transmembrane domain with the ENTIRE INTRACELLULAR KINASE

  DOMAIN REPLACED by a fluorescent protein, in CHO-derived vesicles - the machinery the competing

  mechanism runs on is structurally absent from the assay. The same paper reports that chemical

  cross-linking with Western blot did NOT detect increased G380R dimerisation, and that chemically

  produced vesicles gave ~0.5 rather than 1.8 kcal/mol. The defensible reading is that G380R is
  a weak

  constitutive activator that also fails to be switched off, with the relative weight of the two

  contributions still unresolved.

  '
quantitative:
- parameter: change in unliganded FGFR3 dimerisation free energy due to G380R
  value: '-1.8'
  unit: kcal/mol
  conditions: FGFR3 extracellular+transmembrane construct with the intracellular kinase domain
    replaced by a fluorescent protein; osmotically derived plasma membrane vesicles from CHO cells;
    quantitative FRET
  species: in_vitro_human_cell
  source_ref: sarabipour2016
  uncertainty: chemically produced vesicles gave ~0.5 kcal/mol for the same mutation; chemical
    cross-linking with Western blot detected no significant increase in dimerisation
localization:
- 'human fetal growth plate, mature chondrocytes: confirmed by ISH (delezoide1998)'
- 'human thanatophoric dysplasia cartilage: abundant perinuclear FGFR3 immunoreactivity (legeaimallet1998)'
- 'mouse growth plate: FGFR3 immunoreactive domain expanded in G380R transgenics (monsonegoornan2000)'
human_evidence: direct
human_evidence_note: FGFR3 expression and pathology have been examined directly in human fetal
  growth plate and in thanatophoric dysplasia cartilage, and the achondroplasia allele is the
  commonest human skeletal dysplasia mutation.
species_basis:
- human
- mouse
- in_vitro_human_cell
translation_risk: low
translation_risk_reason: The receptor, its expression domain and the pathogenic allele are all
  documented in human tissue; mouse models reproduce the human phenotype.
confidence: B
