audited: '2026-08-05'
audit_note: Phase 2d canonical-mechanism audit, shard l2daudit. sarabipour2016, monsonegoornan2000
  and cho2004 read in FULL. Verdict SCOPED - sarabipour2016 was being used to adjudicate a mechanism
  its construct cannot test (kinase domain absent), and an unrecorded sign contradiction on FGFR3
  ubiquitination was found. No claim retracted; scope narrowed.
last_verified: '2026-08-05'
claim_grades:
- claim: 'FGFR3 is a negative regulator of longitudinal bone growth: increasing its signalling
    shortens bone and reducing it lengthens bone.'
  grade: A
  basis: Human gain of function across four graded disorders (shiang1994, bellus1995, tavormina1995)
    and human partial loss of function giving tall stature in CATSHL syndrome (toydemir2006),
    concordant with Fgfr3-null mouse overgrowth (colvin1996, deng1996). Both directions are now
    human.
- claim: The achondroplasia allele acts primarily by ligand-independent constitutive kinase activation.
  grade: D
  basis: Contested. naski1996 and webster1996 report ligand-independent activation; monsonegoornan2000
    reports G380R activation is predominantly ligand-DEPENDENT with failed down-regulation. Unresolved.
- claim: The G380R receptor escapes degradation through reduced c-Cbl-mediated ubiquitination.
  grade: D
  basis: 'Contradicted in SIGN: cho2004 reports reduced ubiquitination, Monsonego-Ornan et al.
    2004 report increased ubiquitination of the same mutants. Logged as g_l2d_003. This is the
    claim that sets the node grade.'
- claim: FGFR3 is the only FGF receptor expressed in human growth plate chondrocytes.
  grade: C
  basis: Single human fetal long-bone expression study (delezoide1998), abstract only, not replicated.
