  year: 1994
  type: primary
  one_line_finding: >-
    Its IGF-I arm is a RESTORATION arm and raised longitudinal growth 2.97-fold, which is the regime this
    subject is in rather than the enhancement regime round 254 assumed
contradicts: >-
  WITHDRAWS THE APPLICABILITY of round254_the_final_height_roi_table_and_the_two_stack_changes_it_forces to
  this subject on the growth hormone row. The row's evidence is sound for GH-sufficient, IGF-replete
  adolescents and does not transfer to an IGF-1 of 198; cantasorsdemir2026's own regression puts a low
  starting IGF-1 SDS at the end of the moderator predicting a LARGER gain. The pool-consumption mechanism is
  unaffected and still argues for titrating to a normal IGF-1 rather than above one. ALSO CORRECTS the ROI
  table's SELECTION rule - it ranked only levers with human attained-height evidence and presented a
  statement about what has been measured as a statement about what is possible. CORR-264.
