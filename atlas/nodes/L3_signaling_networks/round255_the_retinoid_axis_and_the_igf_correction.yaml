id: round255_the_retinoid_axis_and_the_igf_correction
name: >-
  ROUND 255 - the GH verdict was wrong for THIS subject and the paper I used says so, and the untouched
  signalling was real. RARgamma is the most abundant retinoid receptor in the growth plate, its antagonist
  ALONE delays maturation and EXPANDS the plate, and it is the antidote to the exact failure mode of this
  atlas's own discharge step
aliases:
- round 255
- the retinoid axis
- RARgamma
- CD2665
- the IGF-1 correction
type: pathway
layer: L3
stub: false
summary: >-
  TWO CORRECTIONS AND ONE OPENING, AND ALL THREE CAME FROM THE OPERATOR RATHER THAN FROM THE ATLAS.

  ONE - THE GH VERDICT DOES NOT APPLY TO THIS SUBJECT, AND THE EFFECT MODIFIER WAS IN THE PAPER I QUOTED.
  Round 254 concluded that growth hormone buys no final height after mid-puberty, on vliegenthart2026 and
  cantasorsdemir2026. THE SUBJECT'S IGF-1 IS 198. Both legs of that conclusion fail on that fact and one of
  them fails on its own reported statistics.
  vliegenthart2026 selected its cohort by RETESTING GH-SUFFICIENT ON A STIMULATION TEST - GH peak above 6.7
  micrograms per litre. A GH PEAK IS NOT AN IGF-1 STATUS. The whole point of the IGF-1 generation test is
  that secretion and effect dissociate, and a subject with a normal GH peak and a low IGF-1 is in the
  GH-insensitivity half of that dissociation, which vliegenthart2026's inclusion criterion selects AGAINST.
  cantasorsdemir2026 is worse, because it reports the moderator directly and round 254 listed it without
  applying it: HIGHER IGF-1 SDS AT THERAPY START WAS ASSOCIATED WITH A SMALLER PUBERTAL HEIGHT GAIN, P <
  0.01. The subject sits at the LOW end of that moderator - the end at which that paper's own regression
  predicts a LARGER gain, not the average null. I quoted the sentence and drew the opposite inference.
  Recorded as CORR-264.
  THE REGIME IS RESTORATION, NOT ENHANCEMENT, AND THIS ATLAS HAS A RULE FOR THAT. CORR-203 separates
  elevation above a normal trajectory from restoration toward one, and grades them differently because they
  are different experiments. hunziker1994's IGF-I arm - the one round 183 decomposed - IS a restoration arm,
  and it raised longitudinal growth 2.97-fold. The x0.77 amplification penalty computed there is real and
  travels, but a 2.97-fold rate restoration in a deficient animal is not the same proposition as adding GH
  to a replete adolescent, and round 254 collapsed the two.
  WHAT IS STILL TRUE AND MUST NOT BE LOST: the somatotropic axis does 90 to 97 per cent of its work through
  POOL CONSUMPTION RATE in every contrast of hunziker1994, and chu2025 shows GH depleting the slow-cycling
  stem pool cell-autonomously through GHR. Restoring a deficient axis is worth doing and it still spends
  reserve to do it. The correct statement is that the GH/IGF-1 arm is indicated here on a deficiency, that
  its return should be indexed to IGF-1 rather than to dose, and that it should be titrated to a normal
  IGF-1 rather than pushed above one - because above the reference range every additional unit is
  enhancement, which is the regime where the nulls of round 254 DO apply.
  THE ONE THING THIS NODE WILL NOT DO IS CONVERT 198 INTO AN SDS. That requires the reporting laboratory's
  assay, the exact chronological age and the pubertal stage, because IGF-1 reference intervals are
  assay-specific and change steeply across puberty. What can be said without those: 198 in the units these
  assays are conventionally reported in sits at or below the lower limit of most published late-pubertal
  male reference intervals, which is a deficiency signal and not a normal value, and it should be read
  against the issuing laboratory's own age- and puberty-adjusted interval before any dose follows from it.

  TWO - AND THE INSTRUCTION TO STOP REQUIRING AN ATTAINED-HEIGHT TRIAL BEFORE A LEVER COUNTS. Round 254
  ranked levers by human attained-height evidence and concluded the whole package was four to six
  centimetres. That ranking is a statement about what has been MEASURED, and it was presented as though it
  were a statement about what is POSSIBLE. Those are different claims and conflating them is a failure of
  this atlas's own grading scheme, which has always had grades C, D and E precisely so that mechanism can be
  carried without human outcome data. The change made here is to the SELECTION rule, not the grading rule: a
  lever now enters the ranking if the mechanism is measured in the right tissue with the right direction,
  and it is graded honestly on what supports it. Nothing about the citation and numeric rules changes.

  THREE - AND ON THAT RULE, THE RETINOID AXIS. IT WAS AT ZERO IN THIS ATLAS AND IT SHOULD HAVE BEEN THE
  FIRST THING FOUND. RARgamma IS, IN THE WORDS OF THE PRIMARY, MOST ABUNDANTLY EXPRESSED IN GROWTH PLATE.
  THE ANTAGONIST DIRECTION, WHICH IS THE ONE WE WANT. koyama2021 gave juvenile mice the selective RARgamma
  antagonist CD2665 at 1.5 mg/kg/day and reports, of the arm given the drug ALONE, MATURATION DELAY AND
  GROWTH PLATE EXPANSION. Delayed maturation with an expanded plate is residence time in the proliferative
  compartment before hypertrophic commitment, which round 175 established IS amplification - the term that
  is 88 to 91 per cent of the yield in three species and that this atlas has repeatedly recorded as having
  NOTHING pointed at it. There is now something pointed at it.
  THE HUMAN-CELL ARM. riedl2020 drove human MSC pellets into hypertrophy with BMP4: retinoic acid ENHANCED
  the hypertrophic phenotype and the RAR inverse agonist BMS204,493 REDUCED it - smaller cells, fewer
  hypertrophic cells, less collagen X - with the effect strongest when applied early. Human cells, correct
  direction, correct term.
  THE AGONIST DIRECTION, WHICH ESTABLISHES THE AXIS IS DOMINANT RATHER THAN MARGINAL. matsuoka2025 loaded a
  selective RARgamma AGONIST into nanoparticles and implanted them beside the juvenile mouse proximal tibial
  growth plate: the plate INVOLUTED AND CLOSED and the tibia SHORTENED against a drug-free-nanoparticle
  contralateral control. Implanted on one side only, the epiphysis TILTED and the tibia angulated - the
  effect is controllable within a single plate. Systemic agonist closed plates at many sites. AND AGONISTS
  FOR RARalpha AND RARbeta DID NOTHING on parallel regimens, so this is a receptor-subtype-specific switch,
  not a general retinoid effect.
  THE PART THAT MATTERS MOST, AND IT IS THE ONE THIS ATLAS HAS BEEN STUCK ON SINCE ROUND 181. Round 251
  established that the second signal - the DISCHARGE that converts an expanded resting pool into columnar
  output - is HEDGEHOG WITHDRAWAL, and round 181 had to record that the discharge agent FUSES THE PLATE two
  doses later. koyama2021 is that experiment run to its mechanism and its antidote. Two days of the hedgehog
  inhibitor LDE225 shortened the growth plate, cut proliferation, cut Ihh and Sox9, cut THE NUMBER OF
  RESERVE PROGENITORS, and led to involution and impaired lengthening - AND IT DID SO BY SUBVERTING RETINOID
  HOMEOSTASIS, markedly DECREASING the retinoid catabolic enzyme Cyp26b1 in the plate while INCREASING and
  broadening the synthesising enzyme Raldh3. ALL OF IT WAS PREVENTED BY CO-ADMINISTERING CD2665.
  SO THE CHARGE-AND-DISCHARGE PROTOCOL NOW HAS A THIRD COMPONENT AND ITS KNOWN FAILURE MODE HAS A NAMED
  BLOCKER: charge the pool (hedgehog agonism or mTORC1), discharge it (hedgehog withdrawal), and hold the
  plate open through the discharge with an RARgamma antagonist. That is a hypothesis, it has never been run,
  and it is written here as the decisive experiment rather than as a finding.

  FOUR - HOW THE ATLAS MISSED IT, BECAUSE THE FAILURE IS INSTRUCTIVE AND IT IS THE SAME ONE AS CORR-262.
  matsuoka2025 HAS BEEN IN THIS BIBLIOGRAPHY SINCE 2026-08-05. It was filed under
  growth_plate_drug_exposure with the recorded finding "a direct attempt to solve the growth-plate delivery
  problem rather than assume plasma exposure reaches the target". The atlas read the DELIVERY VEHICLE and
  never read the DRUG. A paper was catalogued by its method and its pharmacology was discarded. That is why
  "not recorded" was not the failure here - it was recorded, and it was misfiled.

  FIVE - THE REST OF THE SWEEP, HONESTLY. ANDROGENS ARE COVERED AND THE FINDING CUTS AGAINST ROUND 254'S
  OTHER RECOMMENDATION. The oxandrolone node holds a meta-analysis of 13 cohorts and 803 boys in which
  androgen therapy raised measured final adult height by 1.78 cm - and TESTOSTERONE, WHICH IS AROMATISED,
  BEAT OXANDROLONE, WHICH IS NOT, BY 2.64 cm. If the non-aromatisable androgen is the weaker agent then
  there is a genuine OESTROGEN REQUIREMENT for the pubertal height gain, and round 254's push toward the
  more potent aromatase inhibitor has to be read against it. At bone age 16 the spurt is over, which is the
  reason the tension is survivable here and not a general endorsement. WNT IS COVERED ON THE ROOT-CELL SIDE
  - the human root cell holds itself in the root state by secreting nine soluble WNT antagonists (round 245)
  - and the one WNT lever with a human TALL-STATURE phenotype, SOST loss of function in sclerosteosis, has a
  node whose stated gap is the right one: SOST EXPRESSION IN GROWTH PLATE CARTILAGE HAS NEVER BEEN
  DEMONSTRATED, so the tall stature may be cortical overgrowth rather than physeal. That is answerable from
  the human single-cell growth plate data this atlas already has archived, and it is now a named gap.
quantitative:
- parameter: >-
    THE RARgamma ANTAGONIST GIVEN ALONE - MATURATION DELAY AND GROWTH PLATE EXPANSION, WHICH IS THE
    AMPLIFICATION TERM
  value: maturation delay and growth plate expansion
  unit: qualitative, as reported
  conditions: >-
    koyama2021. Juvenile mice, selective RARgamma antagonist CD2665 at 1.5 mg/kg/day. The paper states that
    RARgamma is the most abundantly expressed retinoid receptor in the growth plate and that CD2665 given
    alone "elicited the expected maturation delay and growth plate expansion". In the main experiment,
    CD2665 co-administration PREVENTED all of the skeletal and molecular changes caused by 2 days of the
    hedgehog inhibitor LDE225 at 100 mg/kg by gavage - shortened growth plate, decreased proliferation,
    decreased Ihh and Sox9, decreased number of reserve progenitors, and subsequent involution with impaired
    long bone lengthening. In vitro, LDE225 directly dampened chondrogenic phenotypic expression and CD2665
    fully reversed it.
  species: mouse
  source_ref: koyama2021
  uncertainty: >-
    NO LENGTH NUMBER FOR THE CD2665-ALONE ARM IS RECOVERABLE FROM THE ABSTRACT-LEVEL RECORD HELD HERE - the
    monotherapy result is stated qualitatively as maturation delay and plate expansion, described by the
    authors as "expected", and the paper's designed comparison is the rescue rather than the monotherapy.
    UNTIL THE FULL TEXT IS READ THIS IS A DIRECTION WITHOUT A MAGNITUDE. Growth plate EXPANSION is also a
    zone-height measurement, which CORR-189 established cannot be trusted as a proxy for growth rate, and no
    longitudinal growth rate, terminal cell height or resting-zone count is reported for the monotherapy arm
    in what is held. The authors call the work proof-of-principle and state that translational applicability
    remains to be studied.
- parameter: >-
    THE MECHANISM BY WHICH HEDGEHOG WITHDRAWAL CLOSES A PLATE - IT RAISES LOCAL RETINOID TONE
  value: >-
    Cyp26b1 (retinoid catabolism) markedly DECREASED and Raldh3 (retinoid synthesis) INCREASED and broadened
    within the growth plate
  unit: direction of expression change
  conditions: >-
    koyama2021, juvenile mice, LDE225 (sonidegib) 100 mg/kg by gavage for 2 days. The authors describe this
    as subverting normal homeostatic retinoid circuitries and in turn accelerating maturation and closure.
  species: mouse
  source_ref: koyama2021
  uncertainty: >-
    Two days of an experimental-dose hedgehog inhibitor is a large acute perturbation, and the enzyme changes
    are directional rather than quantified in the record held here. It nonetheless supplies the missing
    mechanism for something this atlas already knew empirically - that hedgehog inhibition fuses the plate -
    and it names an intervention that blocked it completely in the same experiment.
- parameter: >-
    THE AGONIST DIRECTION, THE SUBTYPE SPECIFICITY, AND THE SPATIAL CONTROL
  value: >-
    local RARgamma agonist nanoparticles caused growth plate involution and closure with a SHORTENED tibia
    against the contralateral drug-free control; one-sided implantation tilted the epiphysis and angulated
    the tibia; systemic agonist closed plates at many sites; RARalpha and RARbeta agonists elicited no
    obvious response
  unit: direction, laterality and receptor subtype
  conditions: >-
    matsuoka2025. Juvenile C57BL/6J mice, nanoparticle-based controlled release of a selective RARgamma
    agonist implanted near the medial and lateral sides of the proximal tibial growth plate, contralateral
    limb implanted with drug-free nanoparticles. Parallel regimens with RARalpha and RARbeta agonists.
  species: mouse
  source_ref: matsuoka2025
  uncertainty: >-
    THIS IS THE WRONG-DIRECTION ARM AND IS USED HERE ONLY TO ESTABLISH THAT THE AXIS IS DOMINANT AND
    SUBTYPE-SPECIFIC. It does not show that the antagonist lengthens a normal bone; the antagonist evidence
    is koyama2021 and riedl2020. The paper was in this bibliography from 2026-08-05 filed as a DELIVERY
    result and its pharmacology was never read - see the node text and CORR-264.
- parameter: >-
    THE HUMAN-CELL ARM - RAR INVERSE AGONISM REDUCES HYPERTROPHIC CONVERSION
  value: >-
    decreased cell size, decreased number of hypertrophic cells and decreased collagen type X deposition
  unit: histological, direction as reported
  conditions: >-
    riedl2020. Chondrogenically precultured HUMAN mesenchymal stem cell pellets driven into hypertrophy with
    BMP4. The physiological RAR agonist retinoic acid further ENHANCED hypertrophy; the RAR inverse agonist
    BMS204,493 reduced it. Effects were dependent on timing and strongest when applied early during
    chondrogenic precultivation.
  species: human
  source_ref: riedl2020
  uncertainty: >-
    HUMAN CELLS BUT NOT A HUMAN GROWTH PLATE - MSC pellets in cartilage tissue engineering, where the
    authors' goal is to PREVENT hypertrophy for graft stability, not to grow a bone. BMS204,493 is a
    pan-RAR inverse agonist rather than RARgamma-selective, so it does not by itself confirm the subtype
    assignment that koyama2021 and matsuoka2025 make in mouse. No length endpoint exists in this system and
    none can.
localization:
- 'mouse growth plate: RARgamma stated to be the most abundantly expressed retinoid receptor'
- 'mouse proximal tibial growth plate: where local agonist closes it and the antagonist protects it'
- 'human MSC chondrogenic pellets: where RAR inverse agonism reduces hypertrophic conversion'
- 'human growth plate: RARgamma expression NOT verified by this atlas - named as a gap'
human_evidence: indirect
human_evidence_note: >-
  The only human material is riedl2020's MSC pellets, which are a tissue-engineering model rather than a
  growth plate. There is no human growth plate RARgamma expression measurement in this atlas, no human
  retinoid antagonist exposure with a skeletal endpoint, and no length endpoint of any kind in man.
species_basis:
- mouse
- human
translation_risk: high
translation_risk_reason: >-
  Every directional result is mouse, the monotherapy arm has no magnitude, and the human arm is a cell
  pellet whose investigators wanted the opposite outcome. Systemic RARgamma antagonism has never been given
  to a human for any indication, so its tolerability is unknown, and the retinoid class carries well-known
  systemic toxicity.
confidence: C
confidence_reason: >-
  The axis itself is B-grade - three independent mouse experiments from two groups, bidirectional, with a
  clean subtype control showing RARalpha and RARbeta do nothing, plus a human-cell arm in the same
  direction. The therapeutic proposition is C or lower, because the arm that matters (antagonist alone,
  length endpoint) has a direction and no number, and the combination with hedgehog withdrawal has never
  been run.
claim_grades:
- claim: >-
    Round 254's conclusion that growth hormone buys no final height applies to this subject.
  grade: X
  basis: >-
    NO. vliegenthart2026 selected on GH PEAK, which does not establish IGF-1 sufficiency, and
    cantasorsdemir2026 reports that higher IGF-1 SDS at start predicted a SMALLER gain (P < 0.01) - the
    subject is at the opposite end of that moderator. With IGF-1 at 198 the regime is restoration, not
    enhancement, and CORR-203 requires those to be graded separately. CORR-264.
- claim: >-
    The somatotropic axis does most of its work by spending the resting pool faster.
  grade: C
  basis: >-
    UNCHANGED. hunziker1994's decomposition puts pool consumption at 90 to 97 per cent of the log effect in
    all three contrasts, and chu2025 shows cell-autonomous pool depletion via GHR. This is why the arm should
    be titrated to a normal IGF-1 rather than pushed above one, not a reason to omit it in deficiency.
- claim: >-
    RARgamma is a growth-plate-dominant, subtype-specific pharmacological switch on chondrocyte maturation
    and physeal closure.
  grade: B
  basis: >-
    koyama2021 (antagonist prevents drug-induced closure completely; antagonist alone delays maturation and
    expands the plate; RARgamma stated most abundant in growth plate) and matsuoka2025 (local agonist closes
    the plate and shortens the bone, systemic agonist closes plates at many sites, RARalpha and RARbeta
    agonists do nothing). Two independent experiments, opposite directions, with a receptor-subtype negative
    control. Mouse only.
- claim: >-
    An RARgamma antagonist will add final height in a human.
  grade: E
  basis: >-
    NOT ESTABLISHED IN ANY SPECIES. The monotherapy arm reports maturation delay and plate expansion with no
    length measurement recoverable from what is held, plate expansion is a zone height and CORR-189 says
    zone heights are not growth rates, and no retinoid antagonist has been given to a human with a skeletal
    growth endpoint. It is ranked here on mechanism in the correct tissue and direction, which is what the
    revised selection rule allows, and it is graded accordingly.
- claim: >-
    An RARgamma antagonist can hold the plate open through a hedgehog-withdrawal discharge step.
  grade: E
  basis: >-
    Inference from koyama2021, where CD2665 prevented every consequence of hedgehog inhibition including
    the loss of reserve progenitors. The combination has never been run with a length endpoint and the
    charge step was not present in that experiment. Entered as the decisive experiment, not as a finding.
