id: vangl2_pcp
name: VANGL2
aliases:
- Van Gogh-like 2
- Loop-tail
type: protein
layer: L3
stub: false
summary: VANGL2 is a four-pass transmembrane core PCP protein that becomes asymmetrically localised across a polarised
  cell. In the limb, WNT5A signalling through ROR2 phosphorylates VANGL2 at conserved N-terminal serine/threonine
  residues, and the amount of phosphorylation is proportional to WNT5A concentration; the Looptail (Vangl2 Lp) allele
  is phosphorylation-deficient and acts as a dominant negative (Gao 2011, mouse). This makes VANGL2 the molecular
  ruler that converts a diffusible WNT5A gradient into a directional instruction for chondrocyte stacking. Direct
  growth-plate-restricted conditional Vangl2 genetics with a columnar-organisation read-out are sparse, and no human
  VANGL2 skeletal dysplasia is established (human VANGL2 variants are associated with neural tube defects). This node
  is therefore mechanistically strong in mouse limb and empty in human physis.
localization:
- 'mouse limb mesenchyme: confirmed, phosphorylation graded along the WNT5A axis (gao2011)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: Human VANGL2 variants are linked to neural tube defects, not to a growth plate phenotype.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Mouse limb genetics only; no human skeletal phenotype anchors the node.
