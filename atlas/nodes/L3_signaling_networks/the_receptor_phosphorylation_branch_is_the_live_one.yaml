id: the_receptor_phosphorylation_branch_is_the_live_one
name: THE CNP ARM IS NOT DEAD - what died is ligand delivery, while the RECEPTOR PHOSPHORYLATION branch has
  human genetic proof, a wild-type mouse length endpoint, a tool compound, and a different selectivity
  argument
aliases:
- is the CNP arm dead
- NPR2 phosphorylation as a lever
- GC-B 7E phosphomimetic
- keep the receptor phosphorylated
- what is left on the CNP axis
type: hypothesis
layer: L3
stub: false
summary: 'THE QUESTION WAS WHETHER THE WHOLE CNP ARM IS DEAD AND WHETHER VOSORITIDE IS ALL THERE IS. IT IS
  NOT DEAD, AND THE THING THAT DIED WAS NARROWER THAN IT LOOKED. Rounds 116 to 129 killed four candidates -
  a higher dose, an NPR2 positive allosteric modulator, systemic clearance blockade, and a dual-resistant
  CNP analogue - and every one of them died the same way: it raised LIGAND CONCENTRATION, and everything
  that raises ligand at the plate raises it at the vasculature at least as much, which is the quantity the
  cardiovascular margin constrains. That is a verdict on the LIGAND branch. It says nothing about the
  receptor.
  THE RECEPTOR BRANCH IS A DIFFERENT MECHANISM AND THE ATLAS ALREADY HOLDS ITS EVIDENCE, UNASSEMBLED.
  NPR2 is held active by phosphorylation of seven juxtamembrane serines and threonines, and it is switched
  OFF by dephosphorylation. robinson2017 showed FGF causes rapid, potent and reversible dephosphorylation
  of exactly those seven residues in rat chondrosarcoma cells, and that a SEVEN-GLUTAMATE PHOSPHOMIMETIC
  GC-B IS COMPLETELY FGF-RESISTANT. shuhaibar2017 confirmed it in intact mouse tibia with an in vivo cGMP
  biosensor and showed non-dephosphorylatable NPR2 increases bone elongation. So there is a second,
  entirely non-ligand way to raise output at this receptor: stop it being turned off.
  AND IT HAS A LENGTH ENDPOINT IN A WILD-TYPE BACKGROUND, WHICH IS THE CONDITION THAT MATTERS HERE.
  wagner2021 crossed GC-B(7E) into FGFR3-G380R and the headline is the achondroplasia rescue - but the
  number this project needs is the WILD-TYPE FGFR3 arm, where GC-B(7E) alone lengthened femur by 4.3 per
  cent in males and 5.0 per cent in females. Our subject has an intact FGFR3. The gain was larger in the
  G380R background (12.6 and 7.9 per cent), which is consistent with the effect scaling with how much FGF
  suppression there is to relieve, and predicts the SMALLER number for a normal receptor.
  THE HUMAN PROOF OF CONCEPT EXISTS AND IT IS IN THE SAME DOMAIN. lauffer2020 reports a heterozygous
  two-amino-acid deletion, Met482-Leu483, in the INTRACELLULAR SUBMEMBRANE REGION of NPR-B - the region
  that carries the regulatory phosphosites - causing TALL STATURE with macrodactyly. The mother is +2.77
  standard deviations; the proband own skin fibroblasts show markedly increased BASAL and CNP-stimulated
  cGMP. The paper calls it the second activating variant in that region. Add jeong2026, where assayed NPR2
  ACTIVITY maps near-linearly onto standing height across 245 scored variants, and the human dose-response
  for receptor output - as distinct from ligand supply - is established.
  A TOOL COMPOUND EXISTS. shuhaibar2021 gave LB-100, a phosphatase inhibitor, and got 1.30-fold elongation
  ALONE over vehicle, additive with a CNP analogue rather than synergistic (CORR-083). LB-100 alone is the
  number that matters for a stack containing an FGFR inhibitor rather than a CNP analogue.
  AND THE SELECTIVITY ARGUMENT IS DIFFERENT FROM THE ONE THAT KILLED THE PAM, WHICH IS THE WHOLE POINT.
  The allosteric modulator needed the plate to carry more LIGAND than the blood, and the plate makes none
  of its own, so it failed. This branch does not need unequal ligand - it needs unequal SUPPRESSION.
  NPR2 dephosphorylation here is driven by FGF signalling, and FGFR3 signalling is a growth-plate
  phenomenon. Relieving it restores receptor output preferentially where FGF is suppressing it. That is a
  cartilage-biased argument that does not depend on ligand distribution at all.
  WHAT IS MISSING, AND IT IS SPECIFIC. THE PHOSPHATASE IS NOT IDENTIFIED. shuhaibar2017 infers only a
  PPP-family enzyme from 100 micromolar cantharidin, which inhibits PPP1, PPP2/PP2A, PPP4 and PPP5
  together - already logged as g_l2d_004. NPR2 phosphorylation state has NEVER been measured in a G380R
  growth plate, nor in any human tissue, so the chain from FGFR3 to phosphatase to dephospho-NPR2 has not
  been observed end to end in one system.
  HOMOLOGOUS DESENSITISATION IS NO LONGER A ZERO - IT IS ANSWERED YES, AT ROUND 134. potter1998 named
  dephosphorylation as the desensitisation mechanism for NPR-B under CNP, and shuhaibar2021 Figure 2
  shows BMN-111 itself lowering NPR2 phosphorylation in primary chondrocytes independently of FGF. So
  continuous ligand exposure IS partly self-defeating, and the prediction that a phosphatase inhibitor is
  worth more alongside a sustained-release agent now has a mechanism behind it - though shuhaibar2021 ran
  exactly that pairing for six days and got additivity rather than synergy.
  AND THE PHARMACOLOGY GOT WORSE AT ROUND 134. fenton2023, a UC Davis dissertation on Angelman syndrome
  that has nothing to do with bone, is the only in vivo chronic juvenile dosing record for LB-100 that
  exists: 3 mg/kg killed every mouse on a single dose, 1 mg/kg every other day killed 5 of 12 and cut
  body weight, and the surviving dose sedated wild-type animals. Converted on body surface area, the
  dose that killed 42 per cent of juvenile mice is the human dose-limiting dose. Full accounting in
  the_tool_compound_is_a_prodrug_and_it_kills_juvenile_mice.
  SO THE ANSWER TO THE QUESTION. Vosoritide is not all there is, and navepegritide is the better ligand of
  the two on present evidence. But the ligand arm is close to its ceiling, and the axis that is still open
  is the one that keeps the receptor switched on.'
quantitative:
- parameter: 'NON-DEPHOSPHORYLATABLE NPR2 LENGTHENS BONE IN A WILD-TYPE FGFR3 BACKGROUND - the number this
    project needs, as opposed to the achondroplasia-rescue headline'
  value: 'femur +4.3 per cent in males and +5.0 per cent in females on a wild-type FGFR3 background;
    +12.6 and +7.9 per cent on a G380R background'
  unit: per cent femur length versus littermate control
  conditions: 'wagner2021, as recorded in fgfr3_npr2_crosstalk. HOMOZYGOUS GC-B(7E/7E) crossed into
    HOMOZYGOUS FGFR3-G380R; human achondroplasia is heterozygous. Restores femur and tibia length and
    hypertrophic zone area to wild-type while leaving midface hypoplasia and macrocephaly entirely
    unrescued. Two-week effects are strongly sex-specific - G380R shortened bones and reduced hypertrophic
    zone area in MALES only, GC-B(7E) lengthened bones in FEMALES only, and the hypertrophic-zone rescue
    was demonstrated in males.'
  species: mouse
  source_ref: wagner2021
  uncertainty: 'THE SEX-SPECIFICITY CAVEAT WRITTEN LAST ROUND WAS MY ERROR AND IS WITHDRAWN - CORR-124.
    Reading wagner2021 in full, the "females only" statement is the 2-WEEK, SINGLE-ALLELE analysis, while
    4.3 and 5.0 per cent are the 16-WEEK, HOMOZYGOUS figures quoted for both sexes in one sentence. The
    real caveats are different. IT IS A GERMLINE, HOMOZYGOUS, LIFELONG genotype acting from conception -
    not an intervention at a late bone age, which is the inference gap that has undercut every genetic
    proof in this project. THE GENE-DOSAGE DATA MATTER FOR A DRUG: naso-anal length rose 1.7 per cent
    (male) and 3.3 (female) for ONE GC-B-7E allele against 5.4 and 5.0 for TWO, so partial protection -
    which is all a pharmacological agent could give - buys roughly half. And the effect is larger where
    there is more FGF suppression to relieve, so a normal human receptor should expect the low end.'
- parameter: 'HUMAN ACTIVATING VARIANT IN THE SUBMEMBRANE REGULATORY REGION CAUSES TALL STATURE WITH RAISED
    BASAL AND LIGAND-STIMULATED cGMP'
  value: 'mother +2.77 standard deviation scores; daughters +1.96 SDS at 7 years and +1.30 SDS at 4 years'
  unit: height standard deviation score
  conditions: 'lauffer2020. Heterozygous c.1444_1449delATGCTG in NPR2 exon 8, deleting Met482-Leu483 in the
    intracellular submembrane region. Three family members. Skeletal surveys showed macrodactyly of the
    great toes and pseudo-epiphyses of the mid and proximal phalanges - epiphyseal chondrodysplasia, Miura
    type. In the proband own skin fibroblasts, BASAL cGMP and CNP-stimulated cGMP were both markedly
    increased against controls; transfected HEK-293 cells reproduced augmented baseline and
    ligand-dependent activity. Described as the second activating variant reported in this region.'
  species: human
  source_ref: lauffer2020
  uncertainty: 'ONE FAMILY, THREE INDIVIDUALS, AND THE TWO CHILDREN ARE +1.96 AND +1.30 SDS RATHER THAN
    STRIKINGLY TALL - the phenotype is real but modest, and it arrives with macrodactyly and epiphyseal
    dysplasia, which is a reminder that this receptor does not only set height. The deletion is not a
    phosphomimetic and its mechanism is a conformational change in the submembrane region rather than
    demonstrated phosphosite protection, so it supports the DOMAIN rather than the phosphorylation
    mechanism specifically. Fibroblasts are not chondrocytes.'
- parameter: 'WILD-TYPE GC-B INACTIVATES WITH TIME, AND A HUMAN OVERGROWTH MUTATION THAT BLOCKS THAT
    INACTIVATION PRODUCES ABNORMALLY LONG BONES'
  value: 'V883M-GC-B: basal cGMP raised more than 20-fold and Vmax 15-fold without CNP; CNP added only
    2-fold more; and unlike wild-type it FAILED TO INACTIVATE WITH TIME'
  unit: fold change versus wild-type GC-B
  conditions: 'robinson2013. A Val-to-Met substitution at position 883 in the CATALYTIC domain of GC-B,
    found in humans with raised blood cGMP and abnormally long bones. In cells expressing V883M, CNP
    reduced the Michaelis constant tenfold in a concentration-dependent way WITHOUT raising Vmax, and that
    reduction did not require ATP as it does in the wild-type enzyme. Phosphorylation elevated activity but
    was NOT required for the gain - the substitution also activated a GC-B mutant lacking all known
    phosphorylation sites.'
  species: human
  source_ref: robinson2013
  uncertainty: 'THE PHENOTYPE IS HUMAN BUT THE MECHANISM IS CELL-BASED, and this is a CATALYTIC-DOMAIN
    mutation rather than a phospho-site one - the paper is explicit that it works even without the
    phosphorylation sites. So it establishes that BLOCKING TIME-DEPENDENT INACTIVATION produces long bones
    in humans, and that receptor-side gain is achievable by more than one route, but it does NOT prove the
    phospho-protection route specifically. A greater-than-20-fold basal cGMP rise is also far beyond
    anything a drug would produce, and it arrives with a skeletal overgrowth syndrome rather than simple
    tall stature.'
- parameter: 'THE KINETICS OF FGF-DRIVEN INACTIVATION, AND THE PHOSPHATASE CONTRADICTION'
  value: 'GC-B inhibited with a half-time of about 7 minutes, maximal by 15 minutes, FGF2 IC50 about
    5 ng/ml; and 10 micromolar cantharidin did NOT block the dephosphorylation'
  unit: minutes, and ng/ml
  conditions: 'robinson2017, rat chondrosarcoma cells, read in full. FGF2 inhibited CNP-dependent GC-B
    activity at both sub-saturating (100 nM) and saturating (1 micromolar) CNP with a similar IC50, so the
    inhibition is not surmountable by more ligand. THE PHOSPHATASE: cantharidin at 10 micromolar failed to
    block FGF-induced dephosphorylation, and since cantharidin inhibits PPP1, PPP2, PPP4, PPP5 and PPP6,
    the authors conclude a phosphatase OTHER than those. This CONTRADICTS shuhaibar2017, which inferred a
    PPP-family enzyme from 100 micromolar cantharidin in intact tibia - CORR-123.'
  species: rat
  source_ref: robinson2017
  uncertainty: 'THE CONTRADICTION IS UNRESOLVED AND IT UNDERCUTS THE TOOL COMPOUND. LB-100 is a PP2A
    (PPP2) inhibitor; if PPP2 is not the enzyme, then LB-100 1.30-fold elongation effect is not acting
    through the mechanism this branch attributes to it. The two studies differ tenfold in cantharidin
    concentration and use cells versus intact tibia, so they may be reconcilable, and neither is obviously
    wrong. That FGF inhibition is NOT surmountable by raising CNP is itself important - it means the
    ligand arm cannot compensate for a dephosphorylated receptor, which is the strongest argument for
    working on the receptor instead.'
- parameter: 'THE CANTHARIDIN EXPERIMENT, COMPUTED FROM SOURCE DATA - THE FGF BLOCK IS REAL AND THERE IS
    ALSO A TONIC RESTRAINT'
  value: 'FGF inhibits by 51 per cent without cantharidin (p = 0.00047) and by 14 per cent with 100
    micromolar cantharidin (p = 0.064, ns); and cantharidin ALONE raises the control response 1.42-fold
    (p = 0.0018)'
  unit: fold increase in cGMP, and per cent inhibition
  conditions: 'shuhaibar2017 Figure 6C source data, supplied as the eLife 31343 archive and computed from
    the raw per-animal values rather than read from a plot. Means: no cantharidin control 0.962 (n=6), no
    cantharidin plus FGF18 0.471 (n=10), 100 micromolar cantharidin control 1.361 (n=8), cantharidin plus
    FGF18 1.174 (n=10). Significance from the accompanying statistics sheet, Holm-Sidak adjusted.'
  species: mouse
  source_ref: shuhaibar2017
  uncertainty: 'THIS RESOLVES THE CONTRADICTION WITH robinson2017 AS A CONCENTRATION ARTEFACT - 10
    micromolar in cells against 100 micromolar in intact tibia - BUT 100 MICROMOLAR IS A HIGH,
    NON-SELECTIVE CONCENTRATION. Cantharidin at that level inhibits PPP1, PPP2, PPP4, PPP5 and PPP6
    together and cannot identify which one matters, so LB-100 targeting PPP2 specifically remains
    unproven. THE TONIC FINDING IS THE MORE CONSEQUENTIAL ONE AND IT ARGUES AGAINST THIS BRANCH
    SELECTIVITY, not for it - see the claim grade below.'
- parameter: 'EFFECT SIZE OF THE 7E PHOSPHOMIMETIC IN WILD-TYPE MICE, RECOMPUTED FROM RAW PER-ANIMAL DATA'
  value: 'at 16 weeks: femur +8.4 per cent, tibia +8.8 per cent, BODY LENGTH +8.0 per cent, cranial width
    unchanged; body length +10.0 per cent at 8 weeks'
  unit: per cent difference, Npr2 7E/7E versus wild type
  conditions: 'shuhaibar2017 Figure 1E-1H source data, computed from raw values. Sample sizes at 16 weeks:
    femur 13 versus 22, tibia 13 versus 22, body length 13 versus 22, cranial width 13 versus 22. Both
    genotypes are on a wild-type FGFR3 background. The dissociation matters as much as the magnitude -
    long bones and body length rise about 8 per cent while cranial width does not move (+2.5 per cent at
    16 weeks, -2.4 per cent at 8 weeks).'
  species: mouse
  source_ref: shuhaibar2017
  uncertainty: 'SEX-POOLED, because the source-data sheets do not separate sex, and this atlas has already
    made one error by conflating sex-specific with pooled analyses in this literature (CORR-124). MORE
    IMPORTANTLY THESE ARE ROUGHLY DOUBLE wagner2021 FIGURES for the same genotype on the same background at
    the same age - +8.4 per cent femur here against +4.3 and +5.0 per cent there. Two papers, one genotype,
    a twofold discrepancy, probably genetic background and control choice. THE ATLAS SHOULD CARRY THE RANGE
    +4.3 TO +8.8 PER CENT rather than either figure alone. And it remains a germline lifelong genotype, not
    an intervention at a late bone age.'
- parameter: 'LB-100 IS EXPLICITLY SEMISELECTIVE - IT HITS AT LEAST THREE PPP ENZYMES, SO NO
    PP2A-SELECTIVE TEST OF THIS MECHANISM EXISTS'
  value: 'inhibits PPP1C with IC50 below 2 micromolar, and is a catalytic inhibitor of PPP2CA and PPP5C'
  unit: IC50, micromolar
  conditions: 'shuhaibar2021, read in full. The authors state LB-100 was originally reported as a specific
    inhibitor of the PPP2 catalytic subunit but was later shown also to inhibit PPP5C (darcy2019), and
    that because cantharidin shows only modest selectivity for PPP2C over PPP1C they tested PPP1C directly
    using two assays with different substrates - finding LB-100 inhibits PPP1C at IC50 below 2 micromolar.
    They describe their own tool as A SEMISELECTIVE PPP FAMILY PHOSPHATASE INHIBITOR. On structural
    grounds they note 10 micromolar LB-100 is unlikely to inhibit PPP3C/calcineurin or PPP7C.'
  species: not_applicable
  source_ref: shuhaibar2021
  uncertainty: 'THIS CLOSES THE QUESTION I ASKED AND THE ANSWER IS NEGATIVE. There is no PP2A-selective
    experiment against FGF-induced NPR2 dephosphorylation because there is no PP2A-selective tool in this
    literature - LB-100 covers PPP1C, PPP2CA and PPP5C, and cantharidin covers PPP1/2/4/5/6. NOTE THIS IS
    NOT A DEFECT IN THE ARGUMENT SO MUCH AS A MATCH BETWEEN TOOL AND CLAIM: the atlas states the target as
    "a PPP-family phosphatase", which is exactly the resolution the evidence supports, and LB-100 has
    exactly that breadth. What cannot be said is that PPP2A specifically is the PHYSIOLOGICAL enzyme.
    CORR-126 SOFTENS THE ORIGINAL WORDING HERE, which said nothing in this literature had ever implicated
    PP2A: potter1998 dephosphorylated NPR-B membranes with PURIFIED PP2A and found the loss of
    CNP-dependent cyclase activity tracked it. That is sufficiency in a tube, not identity in a
    chondrocyte, and it does not touch robinson2017 cantharidin-resistance result - but it is not nothing,
    and the earlier sentence overstated the void.
    CORR-127 IS LARGER AND IT LANDS ON THE TOOL ITSELF: LB-100 IS A PRODRUG of endothall (rollema2025),
    so the agent in every LB-100 experiment cited here - including the six-day bone cultures - is
    endothall, not LB-100. See the_tool_compound_is_a_prodrug_and_it_kills_juvenile_mice.'
- parameter: 'LB-100 HUMAN PHASE 1 - THE DOSE-LIMITING TOXICITY IS RENAL, AND NO CARDIOVASCULAR SIGNAL
    APPEARS'
  value: 'DLT reversible rises in serum creatinine / reduced creatinine clearance at 3.1 mg/m2;
    recommended phase 2 dose 2.33 mg/m2 daily for 3 days every 3 weeks; grade 3 drug-related events in
    6 of 29 (20.7 per cent)'
  unit: mg/m2 and per cent of patients
  conditions: 'chung2017, NCT01837667. First-in-human open-label 3+3 dose escalation, LB-100 intravenous
    daily for 3 days in 21-day cycles, 29 patient entries over 7 dose levels in adults with progressive
    solid tumours. The grade 3 drug-related events were anaemia (n=2), decreased creatinine clearance,
    dyspnoea, hyponatraemia and lymphopenia. Ten of 20 response-evaluable patients had stable disease for
    four or more cycles and one pancreatic adenocarcinoma had a partial response.'
  species: human
  source_ref: chung2017
  uncertainty: 'CORR-129 CORRECTS THIS ROW. Round 133 wrote it from the abstract and said NO HYPOTENSION OR
    CARDIOVASCULAR EVENT APPEARS. The full paper Table 2 has grade 1-2 cardiovascular entries: ACCELERATED
    HYPERTENSION in 1 patient (3.4 per cent), EJECTION FRACTION DECREASED in 1, QT PROLONGED in 1, SINUS
    TACHYCARDIA in 2 and CHEST PAIN in 1. So low-grade cardiovascular events exist. TWO THINGS MAKE THE
    CORRECTED PICTURE STRONGER THAN THE ORIGINAL, NOT WEAKER. First, patients were CARDIAC-MONITORED BY
    PROTOCOL - ECG, MUGA or echocardiogram, troponins and BNP before every cycle - precisely because
    animal toxicology showed cardiac toxicity at high doses; so the absence of grade 3 or higher cardiac
    events is a monitored absence rather than an unlooked-for one. Second, the one blood-pressure event
    is HYPERTENSION, the opposite direction from the CNP-analogue fear. THE SCHEDULE OBJECTION STANDS
    UNCHANGED: three days on and eighteen off, in adults with advanced cancer, against chronic dosing in a
    growing child. AND THE DLT IS RENAL, which chung2017 notes is IDENTICAL to the dose-limiting toxicity
    of fostriecin, a structurally unrelated PP2A inhibitor - so the ceiling may be a CLASS effect of PP2A
    inhibition rather than a property of this molecule, which would mean swapping compounds does not
    escape it.'
localization:
- 'the mechanism is intracellular and juxtamembrane - the seven regulatory serines and threonines of NPR2 -
  and its selectivity argument rests on FGFR3 signalling being growth-plate-biased rather than on any
  property of ligand distribution'
human_evidence: direct
human_evidence_note: The human arm is a family with an activating submembrane variant and tall stature,
  plus the 245-variant activity-versus-height relationship in jeong2026. The mechanism and the length
  endpoints are mouse and rat.
species_basis:
- human
- mouse
- rat
translation_risk: high
translation_risk_reason: Every length endpoint is a germline mouse genotype acting from conception, and
  the human evidence is genetic rather than pharmacological. The tool compound has a 1.30-fold effect in
  mouse and no human data at all.
confidence: C
claim_grades:
- claim: The CNP arm as a whole is dead.
  grade: X
  basis: 'NO. What died across rounds 116-129 is the LIGAND branch - four candidates, all killed by the
    same mechanism, that raising ligand at the plate raises it at the vasculature at least as much. The
    receptor-phosphorylation branch is a separate mechanism with its own human genetics, its own wild-type
    length endpoint and its own tool compound, and none of the four refutations touch it.'
- claim: Preventing NPR2 dephosphorylation raises bone length independently of ligand supply.
  grade: B
  basis: robinson2017 identifies the seven-residue mechanism and shows a 7E phosphomimetic is completely
    FGF-resistant; shuhaibar2017 confirms in intact tibia with an in vivo cGMP biosensor and reports
    increased elongation; wagner2021 supplies the length endpoint including a wild-type FGFR3 arm. Three
    groups, three preparations, one mechanism. Graded B not A because all of it is rodent and the human
    evidence is genetic rather than interventional.
- claim: This branch escapes the trap that killed the ligand candidates.
  grade: D
  basis: 'DOWNGRADED FROM C TO D AT ROUND 132 - CORR-125. The argument was that this branch needs unequal
    SUPPRESSION rather than unequal ligand, and that FGF-driven NPR2 dephosphorylation is growth-plate
    biased. The shuhaibar2017 SOURCE DATA undercut it: 100 micromolar cantharidin raised the CNP response
    1.42-fold WITH NO FGF PRESENT (p = 0.0018), so a substantial part of the restraint on NPR2 is TONIC
    rather than FGF-driven. A systemic phosphatase inhibitor would lift a standing brake wherever NPR2 and
    the phosphatase coexist, including vasculature - which is the same failure mode that killed the
    allosteric modulator. The branch is STRONGER on efficacy and WEAKER on selectivity than round 130
    stated.'
- claim: A phosphatase inhibitor is worth adding to a stack that already contains an FGFR inhibitor.
  grade: D
  basis: 'Uncertain and possibly redundant. LB-100 stated mechanism is counteracting FGF-INDUCED NPR2
    dephosphorylation; an FGFR inhibitor has already removed the FGF signal, so the two may occupy the
    same node. shuhaibar2021 found LB-100 additive rather than synergistic with a CNP analogue (CORR-083),
    and LB-100 alone at 1.30-fold is the relevant number for an FGFR-inhibitor stack - but that experiment
    has never been run.'
- claim: Vosoritide is all that is needed on this axis.
  grade: X
  basis: 'NO, on two counts. Navepegritide is the better ligand on present evidence - approved,
    sustained-release, and the atlas records the combination with growth hormone as additive in humans.
    And the ligand arm is near its ceiling regardless, while the receptor branch is untouched by any of
    the refutations.'
