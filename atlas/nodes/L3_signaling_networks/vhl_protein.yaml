- pVHL
type: protein
layer: L3
stub: false
summary: 'pVHL is the substrate-recognition component of the E3 ubiquitin ligase that destroys hydroxylated HIF alpha
  subunits; it is the oxygen-off switch of the pathway. Cartilage-wide conditional inactivation of Vhlh in mouse produces
  viable but severely dwarfed animals with a reduced chondrocyte proliferation rate, increased extracellular matrix
  and atypical enlarged cells in the resting zone, and HIF1A target genes are elevated as expected (Pfander 2004).
  The epistasis is explicit: newborns lacking both Vhlh and Hif1a in chondrocytes look essentially like Hif1a single
  nulls, so most of the Vhlh phenotype is accumulated HIF1A activity. This is the loss-of-brake counterpart to the
  Hif1a knockout and together they bracket the pathway in mouse. In human, germline VHL mutations cause von Hippel-Lindau
  disease (and the Chuvash R200W allele causes congenital polycythaemia) with no reported growth plate phenotype,
  so no human physeal evidence anchors this node.'
localization:
- 'mouse growth plate, all zones (Col2-driven deletion): confirmed functionally (pfander2004)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: Human VHL disease has no described growth plate phenotype; no human physeal VHL measurement exists.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: Mouse conditional genetics only; the human VHL phenotype is tumour-predisposition and erythropoietic.
