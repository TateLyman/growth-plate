id: bmp2_ligand
name: BMP2
aliases:
- bone morphogenetic protein 2
type: protein
layer: L3
stub: false
summary: 'BMP2 is expressed in mouse perichondrium and in prehypertrophic/hypertrophic chondrocytes. Chondrocyte-restricted
  Bmp2 deletion (Col2-Cre) in mouse shortens long bones, reduces chondrocyte proliferation and delays hypertrophic
  maturation, whereas the equivalent Bmp4 deletion produces a much weaker phenotype, so within cartilage BMP2 is the
  non-redundant member of the pair (Shu 2011). Germline analysis of the limb bud shows Bmp2 and Bmp7 are individually
  dispensable for skeletal element formation but Bmp2;Bmp4 double loss in limb mesenchyme blocks skeletogenesis, i.e.
  redundancy is compartment-specific (Bandyopadhyay 2006, mouse). BMP2 is also the ligand through which chondrocyte
  beta-catenin appears to act on maturation: Col2CreERT2-driven beta-catenin stabilisation raises Bmp2 in cartilage
  (Dao 2012, mouse), and VEGF induction in chondrocytes requires BMP2 and beta-catenin signalling together (Chen 2008,
  mouse). No human BMP2 loss-of-function short-stature syndrome is established from growth plate material.'
localization:
- 'mouse PERI: confirmed by in situ hybridisation (bandyopadhyay2006)'
- 'mouse PHZ/HZ: confirmed by in situ hybridisation (shu2011)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No human growth plate localisation or interventional data for BMP2 in longitudinal growth.
species_basis:
- mouse
translation_risk: high
translation_risk_reason: All causal data are mouse conditional knockouts; recombinant BMP2 human use is in fusion/nonunion,
  not physis.
