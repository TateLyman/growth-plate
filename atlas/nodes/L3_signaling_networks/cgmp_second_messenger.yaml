paralog_audit_note: >-
  Re-read in the paralog audit. This node already carried the unresolved EFFECTOR question - cGMP acts through
  PKG-II AND PKG-I, with the relative weighting undetermined and the cGKI/cGKII double knockout named as the
  discriminating experiment (CORR-003, g_l2d_001). The audit adds a second, independent unresolved question one
  step upstream: the SOURCE of the chondrocyte cGMP pool. It is attributed entirely to NPR2/CNP, but ANP acts in
  chondrocytes through cGMP-dependent protein kinase G and Corin- and Nppa-null mice have impaired chondrocyte
  differentiation and shortened long bones (zhou2024). Neither the NPR1/NPR2 double nor the cGKI/cGKII double has
  been made, so this second messenger currently has an unexcluded relative on BOTH sides - one generating it and
  one reading it. See g_para_001 and g_l2d_001.
