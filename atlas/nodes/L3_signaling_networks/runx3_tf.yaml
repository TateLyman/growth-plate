summary: 'RUNX3 is the RUNX paralogue that shares the hypertrophy-licensing function with RUNX2. Its importance is
  invisible in single mutants and appears only in combination: Runx2-null mice still complete chondrocyte maturation,
  whereas Runx2;Runx3 double nulls show a complete absence of maturation and shortened limbs, with the severity tracking
  total RUNX gene dose (Yoshida 2004, mouse). Runx3 transcripts rise at the onset of cartilage mineralisation, after
  Sox9 and concomitant with alkaline phosphatase, and gain/loss of function in limb-bud-derived chondrogenic cells
  shows RUNX3 regulates both early and late maturation markers while transcriptionally inhibiting Runx1 (Soung 2007,
  mouse cells). No human RUNX3 skeletal dysplasia is established, and RUNX3 is not a recognised human short stature
  gene, so the human contribution of this paralogue is unknown.'
