type: protein
layer: L3
stub: false
summary: 'LRP6 is the paralogue of LRP5 and the dominant WNT co-receptor during mouse embryogenesis. Joeng 2011 shows
  that Lrp5 and Lrp6 are redundant in the embryonic skeleton: Lrp6 loss produces a markedly more severe skeletal phenotype
  than Lrp5 loss, and reducing Lrp5 dose on an Lrp6 mutant background worsens it further, so the two receptors provide
  a summed rather than a divided input. This gene-dose structure is the reason single-receptor knockouts underestimate
  the requirement for canonical WNT in cartilage and bone. Human LRP6 variants have been associated with low bone
  mass and with coronary disease, but there is no LRP6 skeletal dysplasia with a defined growth plate phenotype and
  no human physeal measurement.'
localization:
- 'mouse embryonic skeleton: functionally required (joeng2011)'
- 'human growth plate: unconfirmed'
human_evidence: absent
human_evidence_note: No human LRP6 growth plate phenotype; associations are with bone mass and cardiovascular traits.
