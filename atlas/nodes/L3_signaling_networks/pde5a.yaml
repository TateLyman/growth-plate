paralog_audit_note: Tadalafil is PDE5-selective, target engagement was independently confirmed (cGMP +37%
  peak, +52% tissue), and the claim being defended is a NEGATIVE on bone length - the one case where cross-reactivity
  cannot manufacture a false positive.
reanalysis_observations:
- observation: 'PLATFORM DISAGREEMENT, recorded as a contradiction rather than resolved. P8-01: PDE5A
    not detected on any of 8 HG-U133 Plus 2.0 probe sets in either donor. P8-02: detected at the 91.2nd
    percentile of the array in GSE22855 (Illumina HumanWG-6, 6 probes, 2 donors), and NOT detected in
    GSE32398 (28.4th) or GSE18338 (37.2nd).'
  interpretation: 'One platform of four reports PDE5A strongly; three do not. That is a contradiction
    about probe design or about donor/age/site, and this design cannot separate them. The P8-01 reading
    - that PDE5-inhibitor pharmacology has no transcriptional basis in the human physis - is weakened
    but not overturned: it holds on three of four platforms.'
  caveats: Transcript only. Grade unchanged at D. See P8-02 RESULTS section 5.
  reanalysis: p8_02_independent_corroboration
  source_ref: gse9160
