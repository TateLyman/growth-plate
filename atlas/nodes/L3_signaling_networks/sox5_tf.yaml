summary: 'SOX5 is a SoxD-family factor with no transactivation domain of its own; it binds DNA as a dimer and raises
  the efficiency with which SOX9 activates cartilage matrix genes. Sox5 single-null mice have only mild skeletal abnormalities,
  and the requirement is revealed only in combination with Sox6: Sox5;Sox6 double-null fetuses die with generalised
  chondrodysplasia in which chondroblasts express essentially no cartilage matrix genes, begin proliferating only
  after a long delay, and epiphyseal chondroblasts ectopically switch on hypertrophic markers (Smits 2001, mouse).
  SOX5 expression is itself SOX9-dependent (Akiyama 2002, mouse). In human, heterozygous SOX5 loss of function causes
  Lamb-Shaffer syndrome, whose core features are neurodevelopmental with variable skeletal findings, so the human
  phenotype does not recapitulate the murine cartilage-specific requirement - a species discordance that should be
  stated explicitly rather than smoothed over.'
localization:
- 'mouse cartilage, all zones: co-expressed with Sox6 and Sox9 (smits2001)'
- 'human growth plate: unconfirmed'
human_evidence: indirect
human_evidence_note: Human SOX5 haploinsufficiency (Lamb-Shaffer syndrome) is primarily neurodevelopmental; no human
  growth plate data.
species_basis:
