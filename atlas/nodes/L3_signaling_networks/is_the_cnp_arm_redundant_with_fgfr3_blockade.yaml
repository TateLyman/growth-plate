id: is_the_cnp_arm_redundant_with_fgfr3_blockade
name: The CNP axis is redundant with FGFR3 blockade in ONE of its two arms and not the other - and the non-redundant arm lands on the term the stack covers worst
aliases:
- the redundancy question
- does vosoritide add anything to erdafitinib
- the gap defined
type: hypothesis
layer: L3
stub: false
summary: 'THIS NODE EXISTS TO DEFINE A GAP PRECISELY, BECAUSE THE ATLAS HAS ANSWERED THE SAME QUESTION TWO
  DIFFERENT WAYS ON MECHANISM ALONE AND NEVER STATED WHAT WOULD SETTLE IT. Round 86 dropped the CNP arm
  because both approved CNP-analogue labels place the mechanism at the RAF-1 step of the FGFR3-MAPK
  cascade, which erdafitinib already blocks - stacking within one control point. Round 94 reopened it
  because an unbiased target ranking put NPR3 above FGFR3 and because the human adult-height genetics
  favour the CNP axis by 15-25 cm. Neither round tested the mechanism claim. IT IS NOW TESTABLE AND IT IS
  HALF WRONG. hirota2022 shows with dual-FRET biosensors that CNP activates the cAMP/PKA pathway as well
  as cGMP, that PKA activation is ENHANCED as chondrocytes differentiate, and - by live imaging of the
  fetal growth plate in PKA-reporter mice - that CNP PREDOMINANTLY ACTIVATES PKA IN THE HYPERTROPHIC
  CHONDROCYTES. CNP lengthened the growth plate and the PKA inhibitor H89 BLOCKED IT, which is a necessity
  test rather than a correlation. SO THE CNP AXIS HAS TWO ARMS. Arm one is cGMP to PKG2, required for limb
  elongation in three species - PRKG2 nonsense causes chondrodysplasia in dogs and acromesomelic dysplasia
  in humans - and acting on proliferation through RAF-1. THAT ARM IS THE ONE THAT OVERLAPS WITH FGFR3
  BLOCKADE. Arm two is cAMP to PKA, acting on HYPERTROPHIC ZONE ELONGATION, in a different zone with a
  different second messenger and a different kinase. NOTHING ABOUT BLOCKING FGFR3 TOUCHES ARM TWO. AND
  ARM TWO LANDS EXACTLY ON h_term, WHICH THE ROUND-86 COVERAGE AUDIT NAMED AS THE TERM THE STACK COVERS
  WORST - held by cilostazol alone, on a single mouse study. THE REFRAME THAT FOLLOWS IS UNCOMFORTABLE FOR
  BOTH PREVIOUS POSITIONS. If the non-redundant half of the CNP axis is a cAMP/PKA effect on the
  hypertrophic zone, then the agent it is redundant WITH is not erdafitinib - it is CILOSTAZOL, whose
  target PDE3 is a cAMP-hydrolysing enzyme. Round 86 concluded cilostazol was the better partner for
  erdafitinib and vosoritide the better standalone; the mechanism now says cilostazol and a CNP analogue
  are competing for the same arm, and that BOTH are non-redundant with the FGFR inhibitor. That is the
  opposite of the pairing logic the atlas has been using. IT IS ALSO NOT ESTABLISHED - kawabe2025 built
  the cilostazol mechanism explicitly on PKG rather than PKA and left the cAMP limb of its own drug
  unexamined, so this is a mechanistic prediction, not a finding. THE GAP, STATED SO IT CAN BE CLOSED:
  does raising CNP signalling add BONE LENGTH on top of near-complete FGFR blockade, in a PATHWAY-INTACT
  animal? Every combination experiment that exists is in an Fgfr3 gain-of-function background, where
  correcting an excess and stimulating a normal plate cannot be distinguished. The experiment is a 2x2 in
  wild-type - vehicle, FGFR inhibitor, CNP-axis agent, both - with terminal bone length, and it can be run
  in the fetal tibial explant system hakata2024 already used or the E16.5 femur culture shuhaibar2021
  already used. NOBODY HAS RUN IT IN ANY SPECIES.'
quantitative:
- parameter: 'ARM TWO - CNP acts on the hypertrophic zone through PKA, and a PKA inhibitor blocks the
    length effect'
  value: CNP predominantly activates PKA in hypertrophic chondrocytes; H89 blocks CNP-induced growth
    plate lengthening
  unit: qualitative, with a necessity test
  conditions: 'hirota2022. ATDC5 chondrogenic cells transfected with FRET-based cGMP and PKA biosensors -
    dual-FRET imaging showed CNP raising BOTH intracellular cGMP and PKA activity, with CNP-induced PKA
    activation ENHANCED following differentiation. Live imaging of the fetal growth plate in PKAchu
    transgenic mice, which express a FRET biosensor for PKA, showed CNP PREDOMINANTLY ACTIVATING PKA IN
    THE HYPERTROPHIC CHONDROCYTES. Histology of the same mice showed CNP increasing growth plate length,
    and co-administration of the PKA inhibitor H89 INHIBITED that increase.'
  species: mouse
  source_ref: hirota2022
  uncertainty: 'THIS IS THE ROW THAT MAKES THE REDUNDANCY QUESTION ANSWERABLE, AND ITS LIMITS ARE THE
    USUAL ONES. ATDC5 is a cell line; the in vivo imaging is FETAL growth plate; H89 is a notoriously
    promiscuous PKA inhibitor that also hits ROCK, MSK1, S6K1 and PKA-unrelated kinases, so the necessity
    test is weaker than it reads. NO BONE LENGTH ENDPOINT - the measurement is GROWTH PLATE LENGTH, which
    is a zone dimension and not the same quantity, and this atlas has repeatedly found that a thicker
    plate is not a longer bone. WHAT SURVIVES ALL OF THAT is the zonal and second-messenger
    dissociation: whatever the exact magnitude, CNP is doing something in the HYPERTROPHIC zone through
    cAMP that the PKG-to-RAF-1 story does not describe, and FGFR3 blockade has no obvious route to it.'
- parameter: 'ARM ONE - cGMP/PKG2 is required for limb elongation, in three species'
  value: PRKG2 nonsense causes chondrodysplasia in dogs and acromesomelic dysplasia in humans
  unit: qualitative, genetic requirement
  conditions: mkelinen2025 - whole-genome sequencing of Dalmatian dogs with skeletal dysplasia identified
    a PRKG2 nonsense variant p.L534X truncating most of the catalytic domain; three recent dwarf Dalmatians
    were homozygous, with shortened radii and ulnae, irregular growth plates and disrupted endochondral
    ossification. PRKG2 variants are already implicated in human acromesomelic dysplasia
  species: canine
  source_ref: mkelinen2025
  uncertainty: 'A REQUIREMENT RESULT, WHICH IS ALL IT CLAIMS TO BE. It establishes that the cGMP-PKG2 arm
    is necessary for normal limb elongation across dog and human, which matters because it means arm one
    is real and load-bearing rather than an in vitro artefact. It says nothing about whether raising PKG2
    signalling in an animal that already has it lengthens anything, and nothing about redundancy - a
    pathway can be both necessary and fully overlapping with another intervention.'
- parameter: 'AND THE SAME LOGIC FROM THE FGFR3 SIDE - FGFR3 reaches the POOL through CREB, and a CREB
    inhibitor restores bone LENGTH'
  value: CREB inhibitor 666-15 restores growth plate pathology and bone length
  unit: qualitative, with a length endpoint
  conditions: horike2026 - Fgfr3-Ach knock-in mice carrying the achondroplasia p.Gly380Arg mutation show
    EXPANSION of the resting zone; EdU labelling and lineage tracing show disrupted turnover and impaired
    STEM-CELL-LIKE BEHAVIOUR of resting zone chondrocytes causing cells to accumulate; scRNA-seq identifies
    the corresponding cluster; pathway analysis and functional experiments implicate CREB in disrupting
    stem-cell-like properties; administration of the CREB inhibitor 666-15 restored growth plate pathology
    AND BONE LENGTH
  species: mouse
  source_ref: horike2026
  uncertainty: 'TWO THINGS, AND THE SECOND IS A HAZARD RATHER THAN AN OPPORTUNITY. FIRST, THIS IS A
    POOL-TERM INTERVENTION WITH A LENGTH ENDPOINT, which the atlas had almost none of - the pool term has
    been carried by trompet2024 alone. It is in an Fgfr3 GAIN-OF-FUNCTION background, so it corrects an
    excess and says nothing about a normal plate, which is the same limitation as everything else on this
    axis. SECOND, AND IT CUTS AGAINST THE CNP LEAD: CREB is the canonical PKA substrate. horike2026 has
    CREB DISRUPTING stem-cell properties in the RESTING zone, while hirota2022 has CNP raising PKA in the
    HYPERTROPHIC zone as a pro-growth effect. Same effector, opposite signs, different zones. IF A
    SYSTEMICALLY RAISED CNP SIGNAL ACTIVATES PKA AND CREB IN THE RESTING ZONE AS WELL, IT COULD DO TO THE
    POOL WHAT FGFR3 EXCESS DOES - which would present as good velocity and a spent pool, and would not be
    visible on any short-term endpoint. That is an untested risk and it is specific to raising the arm
    this node is arguing is non-redundant.'
- parameter: 'THE GAP, STATED AS AN EXPERIMENT - and every existing combination is in the wrong background'
  value: 'no FGFR-inhibitor plus CNP-axis 2x2 with a length endpoint exists in a wild-type animal, in any
    species'
  unit: count
  conditions: 'Searched Europe PMC 2026-08-08 across four query forms crossing vosoritide, BMN-111 and CNP
    analogues against infigratinib, NVP-BGJ398, TYRA-300 and FGFR inhibitors with combination, additive
    and synergy terms; and Fgfr3 against Nppc and Npr2 with double, epistasis and combined terms. The
    combination literature that exists is achondroplasia clinical management and review, not a factorial
    experiment. shuhaibar2021 combines LB-100 with BMN-111 in Fgfr3-Y367C/+ FETAL femur - a mutant
    background and a phosphatase rather than an FGFR inhibitor. hakata2024 combines nothing.'
  species: not_applicable
  source_ref: hirota2022
  uncertainty: 'THE DESIGN IS CHEAP AND FULLY SPECIFIED, WHICH IS WHY THE ABSENCE IS WORTH RECORDING. A
    2x2 in WILD-TYPE - vehicle, FGFR inhibitor, CNP-axis agent, both - with TERMINAL BONE LENGTH as the
    endpoint, runs in either of two systems this atlas already holds: the fetal tibial explant culture
    hakata2024 used for sacubitril, or the E16.5 femur organ culture shuhaibar2021 used for LB-100. Six
    days, no endocrine axis needed, no new model. IF THE COMBINATION EXCEEDS THE BETTER SINGLE AGENT, the
    arms are separable and the CNP arm belongs back in the stack. IF IT DOES NOT, round 86 was right and
    the human genetics are explained by lifetime accumulation rather than by a bigger per-unit effect.
    THE ONE THING THE EXPERIMENT CANNOT DO is settle the h_term question, because organ culture measures
    explant elongation over days and this atlas has repeatedly found zone thickness and final bone length
    dissociating - so it needs a terminal length readout at skeletal maturity to be decisive, which
    organ culture cannot give.'
localization:
- 'growth plate proliferative zone: where arm one and FGFR3 overlap at RAF-1'
- 'growth plate hypertrophic zone: where arm two acts through PKA and FGFR3 blockade does not reach'
- 'growth plate resting zone: where FGFR3 acts through CREB, and where raising PKA may carry a pool cost'
human_evidence: indirect
human_evidence_note: The human evidence is genetic - PRKG2 variants in acromesomelic dysplasia, and the
  NPR2 and NPR3 tall-stature cases. The two-arm dissociation and the CREB mechanism are mouse.
species_basis:
- mouse
- canine
- human
translation_risk: moderate
translation_risk_reason: The zonal and second-messenger dissociation rests on a cell line plus fetal mouse
  imaging with a promiscuous inhibitor; the human evidence is loss-of-function genetics that establishes
  requirement rather than the effect of raising the pathway.
confidence: C
claim_grades:
- claim: The CNP axis has a cAMP/PKA arm acting on hypertrophic chondrocytes that is distinct from the
    cGMP/PKG arm.
  grade: C
  basis: Dual-FRET biosensor imaging in a cell line plus live imaging in PKA-reporter fetal growth plate,
    with an H89 necessity test. H89 is promiscuous and the endpoint is plate length rather than bone
    length.
- claim: FGFR3 blockade is redundant with the PKG arm and not with the PKA arm.
  grade: D
  basis: An inference from the zonal and second-messenger dissociation. No experiment has combined an FGFR
    inhibitor with a CNP-axis agent in any background.
- claim: Cilostazol and a CNP analogue compete for the same arm, rather than cilostazol being the
    orthogonal partner.
  grade: E
  basis: Follows from PDE3 being a cAMP-hydrolysing enzyme, but kawabe2025 built the cilostazol mechanism
    on PKG and never examined the cAMP limb of its own drug. A prediction, not a finding.
key_refs:
- ref_id: hirota2022
  year: 2022
  type: primary
  one_line_finding: CNP activates PKA predominantly in hypertrophic chondrocytes and H89 blocks the
    CNP-induced increase in growth plate length.
- ref_id: horike2026
  year: 2026
  type: primary
  one_line_finding: Excess FGFR3 disrupts resting zone stem-cell behaviour via CREB, and the CREB
    inhibitor 666-15 restores bone length.
- ref_id: mkelinen2025
  year: 2025
  type: primary
  one_line_finding: PRKG2 nonsense causes chondrodysplasia in dogs, matching human acromesomelic
    dysplasia - the cGMP/PKG2 arm is required for limb elongation.
- ref_id: shuhaibar2021
  year: 2021
  type: primary
  one_line_finding: LB-100 plus a CNP analogue in Fgfr3-mutant fetal femur - the closest existing
    combination experiment, and it is in the wrong background with the wrong partner.
