paralog_risk: The cGMP rise, K+ channel activation and bone elongation are cilostazol/milrinone (PDE3-FAMILY)
  effects. PDE3A shares 48% overall identity and >95% ACTIVE-SITE homology with PDE3B, every FDA-approved
  PDE3 inhibitor is family-selective only (rowley2024), and PDE3A is the isoform carrying the human brachydactyly/short-stature
  genetics (maass2015). The IMPC Pde3b-null tibial length result is gene-selective and is what keeps this
  AT_RISK rather than superseded. See g_para_002.
reanalysis_observations:
- observation: 'The P8-01 re-analysis of GSE9160 speaks directly to this AT_RISK verdict in human tissue:
    PDE3B is NOT detected in either human donor in any of the five compartments (3 probe sets), while
    PDE3A is detected in the PERICHONDRIUM only (1 of 4 probe sets). If the cilostazol/milrinone result
    is carried by a PDE3 family member in the human physis, the transcript evidence points at PDE3A rather
    than PDE3B - which is also the paralog carrying the human skeletal genetics. Transcript only, two
    donors, grade D, and a PDE can be decisive below a microarray floor.'
