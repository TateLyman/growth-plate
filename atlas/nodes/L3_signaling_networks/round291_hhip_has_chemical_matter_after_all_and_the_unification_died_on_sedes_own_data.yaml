    design is two female plus one male mutant against three male wild types, with Xist and Tsix as the two
    largest effects in the published DEG list
- ref_id: qin2021
  pmid: '34721591'
  year: 2021
  type: primary
  one_line_finding: >-
    HHIP-AS1 PROMOTES osteogenic differentiation in human periodontal ligament stem cells - the direct
    opposite of yin2022 in BM-MSCs, on the same readout, and without testing the HHIP route at all
- ref_id: kosmicki2026
  year: 2026
  type: preprint
  one_line_finding: >-
    HHIP p.V496E costs 3.96 cm and is read by the authors as gain-of-function; mapped here onto the structure
