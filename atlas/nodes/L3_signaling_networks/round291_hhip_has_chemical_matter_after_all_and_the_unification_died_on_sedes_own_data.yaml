- ref_id: deritei2025
  pmid: '39945347'
  year: 2025
  type: primary
  one_line_finding: >-
    The only HHIP interactome in existence places it among extracellular-matrix proteins and shortens its
    network distance to DSP, MFAP2, TET2 and FBLN5 - no skeletal endpoint
contradicts: >-
  OVERTURNS A LINE I WROTE INTO CLAUDE.md ONE DAY EARLIER. Round 290 stated that HHIP is "a secreted
  beta-propeller with no small molecule, no antibody, no peptide in any species" and that HHIP-AS1 is
  "the only handle that exists". Both clauses are false: griffiths2021 supplies a genetically validated
  functional site (the GAG clamp) and a predicted druggable pocket (the HHIP-N CRD), and ye2025 supplies a
  manufactured, in-vivo-dosed HHIP biologic. See CORR-312.
  ALSO REFUTES AN UNWRITTEN HYPOTHESIS BEFORE IT ENTERED THE FILE - that FBN1 and HHIP are one
  TGF-beta-to-hedgehog pathway - on sedes2022's own deposited data.
  AND DAMAGES A DATASET TWO EXISTING NODES DEPEND ON: perichondrial_tgfb_restraint and
  round288_the_human_test_of_the_perichondrial_axis_was_run_four_times_and_nobody_looked_at_height both rest
  on GSE189091's DEG list and its derived pathway calls, including the KDM5A prediction underlying CORR-306.
  The TGF-beta findings themselves are large-effect and survive; the subtle calls do not.
