  type: primary
  one_line_finding: >-
    An Fc-fused HHIP protein has been manufactured and dosed in neonatal mice, and stromal Hhip deletion
    hyperactivates an Hh-IGF1 axis - the first connection in this atlas between HHIP and the IGF axis
- ref_id: guo2024
  pmid: '38417378'
  year: 2024
  type: primary
  one_line_finding: >-
    A distal enhancer drives HHIP transcription SMAD3-dependently and TGF-beta-responsively in human
    bronchial epithelium - the premise of the FBN1-HHIP unification hypothesis, which the perichondrial data
