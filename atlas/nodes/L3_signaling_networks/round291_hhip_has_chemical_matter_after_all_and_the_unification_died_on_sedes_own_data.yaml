id: round291_hhip_has_chemical_matter_after_all_and_the_unification_died_on_sedes_own_data
name: >-
  ROUND 291 - I wrote "no small molecule, no antibody, no peptide in any species" into CLAUDE.md yesterday
  and it was wrong in three directions. HHIP's potency REQUIRES glycosaminoglycan binding and the GAG-dead
  mutant is a weaker inhibitor; HHIP-N has a predicted small-molecule pocket of the same structural class as
  SMOOTHENED'S and it binds cholesterol at 23 micromolar; and an Fc-fused HHIP protein has already been
  manufactured and dosed in mice. Separately, the elegant hypothesis that FBN1 and HHIP are one pathway was
  put to sedes2022's own RNA-seq and DIED - and the same file shows that RNA-seq is sex-confounded, which
  lands on the atlas's own lead gene
aliases:
- round 291
- HHIP has chemical matter
- the GAG clamp
- the SMO-like pocket in HHIP-N
- FBN1 and HHIP are independent
- GSE189091 is 2 females against 3 males
- the first skeletal measurement of NRK
type: hypothesis
layer: L3
stub: false
summary: >-
  ZERO - THE CORRECTION THAT ORGANISES THE ROUND. Round 290 recorded, and I copied into CLAUDE.md, that HHIP
  is "a secreted beta-propeller with no small molecule, no antibody, no peptide in any species", making
  HHIP-AS1 "the only handle that exists". I never searched the STRUCTURAL literature. It took one query.
  There are three handles and one of them has a genetically validated functional readout.

  ONE - HHIP'S POTENCY REQUIRES GLYCOSAMINOGLYCAN BINDING, AND BREAKING THAT MAKES IT A WEAKER INHIBITOR.
  griffiths2021 solved both HHIP domains in complex with GAGs. HHIP-C carries TWO GAG sites - site 1 on the
  beta-propeller, site 2 on the EGF repeats - and a six-residue charge-reversal mutant across both
  (K277E/R328E/R350E/K569E/R610E/R613E, the "Glu mutant") abolishes binding to heparin, heparan sulfate and
  chondroitin sulfate by SPR. THE FUNCTIONAL CONSEQUENCE IS THE POINT: in NIH/3T3 the Glu mutant is a
  SIGNIFICANTLY LESS EFFICIENT INHIBITOR OF SHH than wild-type HHIP (Gli1 mRNA, 10 independent experiments,
  paired t-test p = 0.045). AND THE EPISTASIS TEST PROVES THE ROUTE: in EXTL3-knockout cells that lack
  surface heparan sulfate, wild-type HHIP is a weaker inhibitor than it is in parental cells, AND wild-type
  and Glu mutant become EQUALLY effective - the difference between them requires HS to exist. The mechanism
  is avidity: a heparin 30-mer drives HHIP-C into oligomers running from 50 kDa to 6 MDa by analytical
  ultracentrifugation, and that oligomerisation is completely ablated in the Glu mutant. HHIP is clamped to
  the proteoglycan layer and clustered there, and the clamp is what makes it potent.
  SO THERE IS A SECOND, NON-GENETIC WAY TO LOWER HHIP FUNCTION: DO NOT REMOVE THE PROTEIN, UNCLAMP IT.

  TWO - AND HHIP-N HAS A PREDICTED SMALL-MOLECULE POCKET IN THE SAME STRUCTURAL FAMILY AS SMOOTHENED'S.
  HHIP-N is required for full inhibition - deleting it costs potency at p = 0.0091 over 5 independent
  experiments - and the reason is the LIGAND'S CHOLESTEROL. PEG-cholesterol binds HHIP-N at K_D = 23
  micromolar while unconjugated PEG200 does not bind at all; and when the pathway is driven by a
  palmitoylated-only ShhN15 peptide, HHIP lacking HHIP-N cannot inhibit, which excludes the palmitoyl and
  leaves the cholesterol. Structurally, HHIP-N's cysteine-rich domain carries two disordered loops, DL1 and
  DL2, that sit where the FOLATE-BINDING POCKET sits in folate receptor beta, and the same scaffold appears
  in NPC1, RFBP, JUNO, Frizzled-8 AND SMOOTHENED. The authors state these loops could form a binding pocket
  for a physiologically relevant small-molecule ligand. THE CRD FAMILY THAT INCLUDES SMO'S IS THE SINGLE
  MOST DRUGGED FOLD IN THIS ENTIRE PATHWAY - cyclopamine, SAG, the oxysterols. A molecule occupying HHIP-N's
  CRD would block HHIP's grip on the SHH cholesterol and lower its potency, which is our direction; and if
  such a molecule cross-reacted with SMO's CRD, SMO CRD ligands ACTIVATE, so the off-target would run the
  SAME way. That last clause is an inference, not a result, and is graded accordingly.
  The authors close by saying this is a framework for HHIP-based inhibitors that can preserve or block
  individual SHH-receptor sites, and that drugging GAG-dependent clustering is an unexploited avenue. Nobody
  has taken it.

  THREE - THE HUMAN SHORT-STATURE ALLELE IS A READY-MADE POSITIVE CONTROL, AND IT IS STRUCTURALLY ORPHANED.
  kosmicki2026's HHIP p.V496E costs 3.96 cm and the authors call it gain-of-function. Mapped onto UniProt
  Q96QV1 (700 aa; residue 496 confirmed as valine), V496 lies in the beta-propeller, OUTSIDE the annotated
  SHH zinc-binding interaction region (376-388, contact residue 383) and OUTSIDE both EGF repeats (607-634,
  635-667), sitting between the two most C-terminal beta-propeller GAG residues R350 and K569. So the human
  allele that makes people short does NOT obviously act through the Hedgehog contact loop. Whether it works
  through GAG binding, clustering, or stability is unresolved - and griffiths2021 supplies exactly the three
  assays that would resolve it: SPR against heparin/HS/CS, AUC oligomerisation, and the NIH/3T3 Gli1 readout.
  Express one point mutant, run three assays that already exist, and a 1.45-million-person genetic result
  becomes a mechanism with a screening endpoint.

  FOUR - AN Fc-FUSED HHIP PROTEIN ALREADY EXISTS, AND HHIP LOSS RAISES IGF1. ye2025 built a therapeutic
  Fc-HHIP and dosed neonatal mice with it to treat bronchopulmonary dysplasia. That is the WRONG direction
  for a height goal - it adds HHIP - but it establishes that this protein is manufacturable as a biologic
  and administrable in a mammal, which the atlas had assumed away. The mechanistic half is the useful half:
  stromal-specific Hhip deletion caused HYPERACTIVATION OF THE Hh-IGF1 SIGNALLING AXIS. HHIP loss raising
  IGF1 is a second route by which the loss-of-function state could add height, and with this subject's
  IGF-1 at 198 it is the first time HHIP has touched the axis the case is actually limited on. Lung, mouse,
  not cartilage - recorded as a pointer, not a result.

  FIVE - THE ELEGANT HYPOTHESIS, AND ITS DEATH ON PRIMARY DATA IN ONE QUERY.
  guo2024 mapped a distal enhancer at the COPD 4q31 locus that drives HHIP transcription SMAD3-dependently
  and TGF-beta-responsively - and Hedgehog-INDEPENDENTLY - in human bronchial epithelium. Chain that to
  sedes2022, where Fbn1 loss lowers LTBP-3/-4 and p-Smad2 in the outer perichondrium, and the atlas's TWO
  open-plate passes collapse into ONE pathway: less fibrillin, less TGF-beta, less SMAD3, less HHIP, more
  hedgehog, longer bone. FBN1 +11.14 cm and HHIP +9.92 cm as one mechanism. It would have been the best
  structural result in this file.
  IT IS FALSE, AND SEDES2022'S OWN DATA SAYS SO. GSE189091 has been public since 2022-10-11; this atlas has
  cited the paper since round 288, held the full text since 2026-08-06, quoted its "1114 down, 529 up" -
  and never downloaded the table. Downloaded now, it reproduces 1114/529 exactly, and: HHIP IS NOT
  DIFFERENTIALLY EXPRESSED, and its raw counts trend the WRONG WAY (CPM 91.9 mutant vs 75.0 wild type,
  ratio 1.23 UP). NOR IS ANY OTHER HEDGEHOG GENE - not one of Hhip, Hhipl1, Hhipl2, Ihh, Shh, Dhh, Ptch1,
  Ptch2, Smo, Gli1, Gli2, Gli3, Sufu, Gas1, Cdon, Boc, Scube1, Scube2, Scube3, Disp1, Ext1, Ext2, Extl3,
  Smad2 or Smad3 appears in the 1,643-gene list. Ihh is effectively UNEXPRESSED in perichondrium (CPM 0.4
  versus 0.5). The TGF-beta arm is exactly where sedes2022 said it was - Fbn1 -3.50, Tgfb1 -1.18, Ltbp4
  -1.21, Ltbp3 -0.56, Tgfb3 -0.71 - and it does not reach hedgehog.
  FBN1 AND HHIP ARE TWO INDEPENDENT LEVERS. That is a worse story and a BETTER STACK: one pathway cannot be
  hit twice, two can be combined.

  SIX - AND THE SAME FILE SHOWS THE EXPERIMENT IS SEX-CONFOUNDED, WHICH LANDS ON OUR OWN LEAD GENE.
  Xist counts across the six samples: 6221, 4024, 4 in the mutants and 4, 2, 1 in the wild types. Ddx3y,
  Uty, Eif2s3y and Kdm5d are absent from mutants 1 and 2 and present in everything else. THE DESIGN IS TWO
  FEMALE PLUS ONE MALE MUTANT AGAINST THREE MALE WILD TYPES. GEO's sample metadata does not state sex; the
  counts do, unambiguously.
  IT PROPAGATED INTO THE PUBLISHED DEG LIST. The two largest effects in the entire table are TSIX (+11.73)
  and XIST (+10.95) - 6.8 log2 units clear of the third-ranked gene - and Tssk6, a testis-specific kinase,
  is eighth at -4.50.
  THE COST TO US: NRK IS X-LINKED (mouse chromosome X, confirmed) AND SITS IN THAT LIST AT +0.595. The
  atlas's stated lead since round 283, the gene with "zero skeletal literature in any species", finally
  appears in a skeletal dataset - and the differential is uninterpretable. It cannot be attributed to
  genotype when two of three mutants are female and none of the wild types are.
  WHAT SURVIVES, AND IT IS WORTH HAVING: Nrk EXPRESSION needs no contrast. 338, 282 and 365 CPM in the
  mutants; 183, 181 and 301 CPM in all three WILD TYPES. NRK IS ABUNDANTLY EXPRESSED IN A NORMAL SKELETAL
  TISSUE - above Hhip (75-92 CPM) and comparable to Ptch1 - and this is the FIRST SKELETAL EXPRESSION
  MEASUREMENT OF NRK IN ANY SPECIES. It does not tell us the sign. It tells us the gene is present where it
  would have to act.
  SECOND CASUALTY: Lcorl is autosomal (chromosome 5) and unconfounded at +0.636 - UP in the tissue that is
  driving the overgrowth. Human LCORL pLoF is +9.99 cm, i.e. LOSS makes people taller. This is the second
  independent datum, after wyler2024's smaller Lcorl-null mice, in which MORE Lcorl accompanies MORE growth.
  LCORL's demotion in CORR-301 is now corroborated rather than merely argued.
  THIRD CASUALTY, smaller: the KDM5A upstream-regulator call that CORR-306 was built on was computed over
  this list. KDM5A itself is not differentially expressed; the call came from pathway inference over an
  input whose top two genes are Xist and Tsix. CORR-306's conclusion does not flip - the available KDM5
  compounds still point the wrong way - but its premise is weaker than recorded.

  SEVEN - TWO SMALLER RESULTS, BOTH NEGATIVE FOR THE RNA HANDLE.
  (a) THE MOUSE ORTHOLOGUE OF HHIP-AS1 EXISTS POSITIONALLY AND HAS NEVER BEEN STUDIED. Ensembl GRCm39
  carries Gm53441 (ENSMUSG00000136241), a four-isoform lncRNA on the plus strand at 80,784,325-80,788,077,
  head-to-head with Hhip (minus strand, TSS 80,784,658); its longest isoform's first exon
  (80,784,325-80,784,504) lies ENTIRELY INSIDE Hhip exon 1, giving 180 bp of exonic antisense
  complementarity. Human HHIP-AS1 (ENSG00000248890) has the same class of topology - transcript
  ENST00000512359 has a 75 bp exonic antisense overlap with HHIP exon 2. So the in vivo test route is not
  closed. BUT Gm53441 returns ZERO records in Europe PMC, is not named as an Hhip antisense by MGI, and no
  sequence-conservation test has been run. A positional candidate is not an orthologue.
  (b) THE BONE LITERATURE ON HHIP-AS1 CONTRADICTS ITSELF. qin2021 reports HHIP-AS1 PROMOTING osteogenic
  differentiation in human periodontal ligament stem cells - ALP, mineralisation, BSP, osteocalcin and
  osterix all up - and being downregulated by compressive load. yin2022 reports HHIP-AS1 overexpression
  INHIBITING osteogenesis in BM-MSCs through HHIP stabilisation. Same readout, opposite sign, two human cell
  types; and qin2021 attributes its effects to PI3K-Akt and JAK-STAT without testing the HHIP route at all.
  Round 290 graded the HHIP-AS1 phenocopy claim E. It stays E, now with a named contradiction rather than
  merely thin evidence.
human_evidence: direct
human_evidence_note: >-
  Two direct human anchors and one human cell system. (1) kosmicki2026's HHIP p.V496E, beta = -3.96 cm,
  P = 1.52e-9, against HHIP pLoF at +9.92 cm - both directions of one human brake, in centimetres, and the
  variant is mapped onto the human protein structure here. (2) griffiths2021's functional assays are on
  HUMAN HHIP protein, though the cellular readout is mouse NIH/3T3. (3) qin2021 and yin2022 are both human
  primary cells, and they contradict each other. AGAINST: the decisive dataset in this round, GSE189091, is
  MOUSE perichondrium, and ye2025's Fc-HHIP was dosed in mice. No human has received anything that touches
  HHIP in either direction.
species_basis:
- human
- mouse
translation_risk: high
translation_risk_reason: >-
  Everything therapeutic here is one or two steps short of an agent. The GAG clamp is validated by a
  six-residue charge-reversal MUTANT, not a molecule; the HHIP-N pocket is a HOMOLOGY PREDICTION from
  disordered loops with no ligand found; the Fc-HHIP that exists runs the WRONG WAY. The cellular assays are
  fibroblasts, not chondrocytes, and no HHIP-directed manipulation of any kind has been given a bone-length
  endpoint in any species. The two A-grade claims in this node are both about a mouse RNA-seq file rather
  than about a therapy. Separately, the axis's opposite direction carries grade-A irreversible physeal
  fusion in children, so the safety asymmetry is real even under a deprioritised-risk brief.
confidence: B
confidence_reason: >-
  The griffiths2021 material is a structural and cell-biological paper read in full, with the functional
  claims resting on stated p-values and a knockout epistasis control, so the GAG-clamp result is B. The
  GSE189091 analyses are direct computation on primary counts and the refutation and the sex confound are
  both A-grade as statements about that dataset - a null and a library composition are not delicate. What is
  held low is everything therapeutic: no molecule has been made against either HHIP site, the SMO-CRD
  cross-reactivity argument is an inference, and the mouse lncRNA is a genome annotation with no experiment
  behind it.
claim_grades:
- claim: >-
    HHIP's inhibitory potency requires glycosaminoglycan binding, so unclamping HHIP from the proteoglycan
    layer is a route to lowering its function without removing the protein.
  grade: B
  basis: >-
    griffiths2021. The GAG-dead HHIP-C Glu mutant (K277E/R328E/R350E/K569E/R610E/R613E) loses heparin, HS and
    CS binding by SPR and is a significantly weaker SHH inhibitor in NIH/3T3 (Gli1 mRNA, 10 independent
    experiments, paired t-test p = 0.045). The epistasis control is what makes it B rather than C: in
    EXTL3-knockout cells lacking surface HS, wild-type HHIP is weaker than in parental cells and wild-type
    and Glu mutant become indistinguishable, so the potency difference REQUIRES heparan sulfate. Mechanism
    is avidity - heparin 30-mer drives oligomers from 50 kDa to 6 MDa by AUC, abolished in the mutant.
    Cellular assay in fibroblasts, not chondrocytes; no molecule exists that does what the mutant does.
- claim: >-
    HHIP-N contains a predicted small-molecule binding pocket of the same structural class as Smoothened's
    cysteine-rich domain, and it engages the Hedgehog ligand's cholesterol.
  grade: C
  basis: >-
    griffiths2021. HHIP-N is required for full inhibition (p = 0.0091, 5 independent experiments);
    PEG-cholesterol binds HHIP-N at K_D = 23 micromolar by ITC while unconjugated PEG200 does not; with a
    palmitoyl-only ShhN15 peptide, HHIP lacking HHIP-N cannot inhibit, excluding the palmitoyl. The pocket
    itself is a STRUCTURAL PREDICTION - loops DL1 and DL2 are disordered in the crystal and occupy the
    position of the folate pocket in FRbeta, with the same scaffold in NPC1, RFBP, JUNO, Fz8 and SMO. No
    ligand has been found for it. C, not B, because the pocket is inferred from homology and the authors say
    so.
- claim: >-
    A molecule hitting the HHIP-N CRD that also hit SMO's CRD would run in the same therapeutic direction.
  grade: E
  basis: >-
    INFERENCE, STATED AS ONE. SMO CRD ligands such as SAG and the oxysterols ACTIVATE the pathway; blocking
    HHIP-N would also raise pathway output. So the obvious cross-reactivity liability of a CRD-directed
    molecule is, uniquely here, on-message. Nobody has made such a molecule and no selectivity data exists.
    Recorded because it changes how a screen would be designed, not because it is evidence.
- claim: >-
    FBN1 and HHIP are independent levers, not one TGF-beta-to-hedgehog pathway.
  grade: A
  basis: >-
    Direct computation on GSE189091, sedes2022's own laser-capture perichondrial RNA-seq. The predicted sign
    was Hhip DOWN. Hhip is absent from the 1,643-gene DEG list and its counts trend UP (CPM 91.9 vs 75.0).
    None of 23 other hedgehog-pathway genes is differentially expressed, and Ihh is effectively unexpressed
    in the tissue (CPM 0.4 vs 0.5) while the TGF-beta arm moves exactly as published (Fbn1 -3.50, Tgfb1
    -1.18, Ltbp4 -1.21, Ltbp3 -0.56). Graded A as a statement about this dataset - one tissue, one timepoint,
    one mouse model, and guo2024's enhancer was mapped in human bronchial epithelium, so the enhancer may be
    real and simply not operate here.
- claim: >-
    GSE189091 is sex-confounded and the confound reached its published differential expression list.
  grade: A
  basis: >-
    Xist counts 6221, 4024, 4 in mutants versus 4, 2, 1 in wild types; Ddx3y, Uty, Eif2s3y and Kdm5d absent
    from mutants 1 and 2. Two female plus one male mutant against three male wild types. TSIX (+11.73) and
    XIST (+10.95) are the two largest effects in the published table, 6.8 log2 units above third place, and
    Tssk6 is eighth at -4.50. This is arithmetic on the deposited count matrix, not an interpretation.
- claim: >-
    NRK is expressed in a normal skeletal tissue.
  grade: B
  basis: >-
    FIRST SKELETAL EXPRESSION MEASUREMENT OF NRK IN ANY SPECIES. 183, 181 and 301 CPM in the three WILD-TYPE
    perichondrium samples of GSE189091 - above Hhip (75 CPM) and comparable to Ptch1 (88 CPM). Expression in
    wild types does not depend on the mutant contrast and is therefore untouched by the sex confound. It
    partially closes g_l8_nrk_has_no_skeletal_experiment_in_any_species: the gene is present where it would
    have to act. It says NOTHING about direction.
- claim: >-
    The NRK differential in GSE189091 (+0.595) supports NRK as a target.
  grade: X
  basis: >-
    NO. Nrk is on the mouse X chromosome and the mutant group contains two females against zero female
    controls. The differential cannot be attributed to genotype. This claim is recorded as false so that the
    number is not picked up later as evidence - it appears in a published DEG table and will look like data.
- claim: >-
    An Fc-fused HHIP protein exists and has been dosed in a mammal.
  grade: B
  basis: >-
    ye2025 built a therapeutic Fc-HHIP and gave it to neonatal mice for bronchopulmonary dysplasia. Opposite
    direction to the height goal, but it removes the assumption that HHIP is not manufacturable or dosable.
    The same paper reports stromal Hhip deletion hyperactivating an Hh-IGF1 axis, which is the first link
    between HHIP and IGF1 in this atlas - lung stroma, mouse, no skeletal endpoint, so that half is a
    pointer only.
- claim: >-
    Knocking down HHIP-AS1 can be tested in a mouse.
  grade: D
  basis: >-
    A POSITIONAL CANDIDATE ONLY. Ensembl GRCm39 Gm53441 (ENSMUSG00000136241) is a plus-strand lncRNA
    head-to-head with Hhip whose longest isoform's first exon lies entirely within Hhip exon 1 - 180 bp of
    exonic antisense complementarity, the same topology class as human HHIP-AS1's 75 bp overlap with HHIP
    exon 2. But Gm53441 has ZERO publications in Europe PMC, is not named as an Hhip antisense by MGI, and
    sequence conservation has not been tested. Downgraded from "unresolved" to D because the annotation
    exists; not higher because nothing has ever been done with it.
key_refs:
- ref_id: griffiths2021
  pmid: '34887403'
  year: 2021
  type: primary
  one_line_finding: >-
    HHIP's potency requires GAG binding - the GAG-dead Glu mutant is a significantly weaker SHH inhibitor
    (p=0.045, 10 experiments) and the difference disappears in EXTL3-knockout cells lacking heparan sulfate -
    while HHIP-N binds the ligand's cholesterol at 23 micromolar through a CRD whose predicted pocket is the
    same structural family as Smoothened's
- ref_id: ye2025
  pmid: '40333979'
